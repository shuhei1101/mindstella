id: mindstella/on-comment
title: コメントの取り込み
summary: 保留のタスクを見直し、取り込み待ちのスレッドを 1 件ずつ参照し、記録に反映して commit し、返信するかクローズにして、最後にその回の報告を 1 件の報告のスレッドにまとめ、手番を返す直前に手番を返す commit をする
condition: 「[mindstella] ユーザーからのコメントが N 件」の入力を受けたとき（入力された文字列そのものは記録に使わない）
steps:
  - name: 保留のタスクを見直す
    body: |-
      `search_docs` で状態が `保留` のタスクを全て検索し、`reason` の着手できる条件を満たしたものを `進行中` にしてすぐに着手する。
      状態を変えたら mindstella/record の「記録を書き込む」で書き、この回の書き換えとして「書き換えをまとめる」で `commit` し、「報告のスレッドで報告する」で着手したタスクを報告する。
    calls:
      - {server: project-index, tool: search_docs}
      - {server: project-index, tool: write_docs}
    refs:
      - mindstella/record
  - name: 取り込み待ちのスレッドを取得する
    body: |-
      `threads` を `awaiting: true` で呼ぶ。状態は渡さず、オープンもクローズも拾う。0 件で、見直しで記録を変えていなければ、何も記録せずに終える。変えていれば、「書き換えをまとめる」・「手番を返す前の確認」・「報告のスレッドで報告する」・「手番を返す」へ進む。
    calls:
      - {server: mindstella, tool: threads}
  - name: コメントを参照する
    body: |-
      スレッドごとに `thread` で未読の書き込みと箇所を参照する。
      箇所（`loc`）を持つスレッドは本文の行の範囲か値のキーと選んだ文への意見として、`target` が `null` のスレッドは発言と同じく記録の種類を振り分けて扱う。
      `thread` で参照しただけでは取り込み済みにならない。
    calls:
      - {server: mindstella, tool: thread}
  - name: 記録に反映する
    body: |-
      mindstella/record のとおり記録に書き込む。
      利用者の回答が要ることは、mindstella/record の工程「利用者に聞くことを方針と細部に分ける」で分ける。
    refs:
      - mindstella/record
  - name: 進め方の続きを進める
    when: コメントで進め方の工程が進んだ
    body: |-
      進め方の文書の続きの工程を進める。
  - name: 書き換えをまとめる
    when: 記録を書き換えた
    body: |-
      この回で何をしたかを一言の説明（1〜200 文字）にして `commit` を呼ぶ。返信へ差分のリンクを入れるための作業の途中の `commit` なので、`hand_back` は渡さない。
    calls:
      - {server: mindstella, tool: commit}
  - name: クローズのスレッドを再度開く
    when: 返信が要るスレッドがクローズになっている
    body: |-
      `set_thread_status` で理由つきでオープンに戻してから返信する。
    calls:
      - {server: mindstella, tool: set_thread_status}
  - name: 返信する
    when: 質問・依頼の書き込みがある
    body: |-
      `reply` で返信し、要約の書き直しと取り込み済みを 1 回で行う。追加した・修正した項目の ID を返信に書き、まとまりの ID は `[{id}](#diff={id})` のリンクにする。
      返信で利用者に回答を求めない。回答が要ることは mindstella/record の工程「利用者に聞くことを方針と細部に分ける」で検討事項に挙げる。
      返信してもクローズにしない。
    calls:
      - {server: mindstella, tool: reply}
  - name: 取り込み済みにする
    when: 返事の要らない書き込み（「了解」など）だけのスレッドがある
    body: |-
      返信せず、`update_thread`（`take: true`・要約）で取り込み済みにする。
    calls:
      - {server: mindstella, tool: update_thread}
  - name: 往復が 5 回を超えたスレッドを分ける
    when: 1 つのスレッドの往復が 5 回を超えた
    body: |-
      `new_thread` で話の続きを新規スレッドに立て、元のスレッドに新規スレッドの ID を書いてクローズにする。
    calls:
      - {server: mindstella, tool: new_thread}
      - {server: mindstella, tool: set_thread_status}
  - name: クローズにする
    when: 話が済んだスレッドがある
    body: |-
      AI の書き込みに回答を待つ質問が残っていない（残っていてもほかの場所で回答済みの）スレッドを、`set_thread_status` で回答の場所を書いた理由つきでクローズにする。
      利用者が未読の AI の書き込みがあるスレッドはクローズを拒まれるので、オープンのまま利用者が参照するのを待つ。
      クローズにする前に、そのスレッドの AI の書き込みの約束（後で行うと書いた作業）がタスクにあることを確かめ、無ければその回のうちにタスクにする。
    calls:
      - {server: mindstella, tool: set_thread_status}
  - name: 手番を返す前の確認
    body: |-
      進め方の文書の工程のうち、利用者の回答なしで進められる工程が残っていないかを確認し、残っていれば進める。確認が要る点は mindstella/record の工程「利用者に聞くことを方針と細部に分ける」で検討事項に挙げ、進めてよいかを報告で利用者に聞かない。
      `search_docs` で状態が `未着手`・`進行中` のタスクを検索し、済んだものは `完了`、続きを次の手番に回すものと着手できない条件があるものは `保留`（`reason` に着手できる条件）、やめるものは `中止` にして、mindstella/record の「記録を書き込む」で書き込む。
    calls:
      - {server: project-index, tool: search_docs}
      - {server: project-index, tool: write_docs}
    refs:
      - mindstella/record
  - name: 報告のスレッドで報告する
    when: この回で会話ログのほかに記録を追加・変更した
    body: |-
      その回の報告（追加した検討事項、AI が決めた細部の検討事項、反映した回答、追加・着手したタスク）を、`new_thread` で新規の報告のスレッド 1 件に表で書く（列は ID・タイトル・したこと）。
      報告を前の回のスレッドに続けて書き込まない。作成した後に、前の回の報告のスレッドを `set_thread_status` でクローズにする。
      報告のスレッドでも利用者に回答を求めない。利用者はターミナルを見ないため、知らせはスレッドだけで出す。
    calls:
      - {server: mindstella, tool: new_thread}
      - {server: mindstella, tool: set_thread_status}
  - name: オープンのスレッドを取得する
    body: |-
      `threads` を `status: open` で呼び、残っているオープンのスレッドを一覧で参照する。
    calls:
      - {server: mindstella, tool: threads}
  - name: 話が済んだスレッドをクローズにする
    when: オープンのスレッドに話が済んでいるものがある
    body: |-
      「クローズにする」と同じ条件で、話が済んでいるスレッドをクローズにする。
    calls:
      - {server: mindstella, tool: set_thread_status}
  - name: 手番を返す
    body: |-
      mindstella/record の工程「手番を返す」のとおり、`hand_back: true` で `commit` を呼ぶ。
    calls:
      - {server: mindstella, tool: commit}
    refs:
      - mindstella/record

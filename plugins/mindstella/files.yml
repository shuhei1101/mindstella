# yaml-language-server: $schema=../../schemas/files.schema.yaml
files:
- path: .claude-plugin/plugin.json
  name: プラグインのマニフェスト
  description: Claude Code がプラグイン mindstella を読み込むときの名前・バージョン・説明を持つ。プラグインの名前・バージョン・スキルの置き場所を変更するときに読む。
  tags:
  - tool:claude-code
  - topic:プラグイン
  - topic:マニフェスト
  related:
  - to: IF-489-68
    type: implements
- path: .mcp.json
  name: MCP サーバーの接続の設定
  description: Claude Code が mindstella の常駐の MCP サーバーへ HTTP でつなぐ先を持つ。Claude Code が mindstella の MCP サーバーへつなぐ先を変更するときに読む。
  tags:
  - tool:claude-code
  - tool:mcp
  - topic:サーバー
- path: agent-flows/agent-flow.schema.json
  name: エージェントフローのスキーマ
  description: 記録のエージェントフローの YAML の形式。エージェントフローのキーを変更するときに読む。
  tags:
  - topic:エージェントフロー
  - topic:スキーマ
  related:
  - to: IF-565-1
    type: implements
- path: agent-flows/dev-docs.yaml
  name: エージェントフローの配信元の設定
  description: 記録のエージェントフローを project-index の配信元 mindstella-agent-flows として配る設定。エージェントフローの配り方を変更するときに読む。
  tags:
  - tool:project-index
  - topic:エージェントフロー
  - topic:配信元
  related:
  - to: MOD-565-4
    type: implements
  - to: IF-565-1
    type: implements
- path: agent-flows/on-comment.yaml
  name: コメントの取り込みのエージェントフロー
  description: 取り込み待ちのスレッドを記録に反映し、返信・クローズ・通知をする手順。コメントの取り込みの手順を変更するときに読む。
  tags:
  - topic:エージェントフロー
  - topic:コメント
  - topic:スレッド
  - action:取り込み
  related:
  - to: IF-565-1
    type: implements
- path: agent-flows/record.yaml
  name: 記録の使い分けのエージェントフロー
  description: 発言を記録の種類に振り分け、タグを付けて書き込む手順。記録の書き方を変更するときに読む。
  tags:
  - topic:エージェントフロー
  - topic:記録
  - topic:タグ
  related:
  - to: IF-565-1
    type: implements
- path: agent-flows/startup.yaml
  name: 起動と再開のエージェントフロー
  description: MindStella のセッションの起動と再開で、状況の確認からまとめ忘れの commit・コメントの取り込みまでを進める手順。起動と再開の手順を変更するときに読む。
  tags:
  - topic:エージェントフロー
  - action:起動
  - action:再開
  related:
  - to: IF-565-1
    type: implements
- path: bin/mindstella
  name: 起動スクリプト
  description: mindstella の常駐サーバーが落ちていれば起動してから、Claude Code を tmux のセッションの中で立ち上げてつなぐ。起動の手順・tmux のセッションの立て方・依存の確かめ方を変更するときに読む。
  tags:
  - tool:bash
  - tool:tmux
  - topic:スクリプト
  - topic:起動
  related:
  - to: IF-489-56
    type: implements
  - to: MOD-489-168
    type: implements
- path: content/prompts/session-start.yaml
  name: 起動と再開の注入文のプロンプト
  description: MindStella のセッションの SessionStart で注入する、再開の状況とエージェントフローの案内の文。注入文を変更するときに読む。
  tags:
  - topic:プロンプト
  - topic:フック
  - action:注入
  related:
  - to: MOD-565-4
    type: implements
  - to: IF-489-32
    type: implements
- path: hooks/hooks.json
  name: フックの登録
  description: 会話の始まりにスレッドを未読へ戻して常駐サーバーを起動するフックと、mindstella のツールの呼び出しにセッションの値を入れるフックを登録する。PreCompact では圧縮を止めて常駐サーバーへ再起動を依頼するフックを登録する。SessionStart・PreToolUse・PreCompact のフックで動かすスクリプトを変更するときに読む。
  tags:
  - tool:claude-code
  - topic:フック
  related:
  - to: MOD-489-150
    type: implements
  - to: MOD-489-160
    type: implements

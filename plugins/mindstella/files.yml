# yaml-language-server: $schema=../../schemas/files.schema.yaml
files:
- path: .claude-plugin/plugin.json
  name: プラグインのマニフェスト
  description: Claude Code がプラグイン mindstella を読み込むときの名前・版・説明を持つ。プラグインの名前・版・スキルの置き場所を変更するときに読む。
  tags:
  - tool:claude-code
  - topic:プラグイン
  - topic:マニフェスト
  related:
  - to: dev/設計書/インターフェース定義/プラグイン/プラグインの読み込み.yaml
    type: implements
- path: .mcp.json
  name: MCP サーバーの接続の設定
  description: Claude Code が mindstella の常駐の MCP サーバーへ HTTP でつなぐ先を持つ。Claude Code が mindstella の MCP サーバーへつなぐ先を変更するときに読む。
  tags:
  - tool:claude-code
  - tool:mcp
  - topic:サーバー
- path: bin/mindstella
  name: 起動スクリプト
  description: mindstella の常駐サーバーが落ちていれば起動してから、Claude Code を tmux のセッションの中で立ち上げてつなぐ。起動の手順・tmux のセッションの立て方・依存の確かめ方を変更するときに読む。
  tags:
  - tool:bash
  - tool:tmux
  - topic:スクリプト
  - topic:起動
  related:
  - to: dev/設計書/インターフェース定義/サーバー/起動スクリプト.yaml
    type: implements
  - to: dev/設計書/モジュール構成/サーバー/起動.py.yaml
    type: implements
- path: hooks/hooks.json
  name: フックの登録
  description: 会話の始まりにスレッドを未読へ戻して常駐サーバーを起動するフックと、mindstella のツールの呼び出しにセッションの値を入れるフックを登録する。SessionStart・PreToolUse のフックで動かすスクリプトを変更するときに読む。
  tags:
  - tool:claude-code
  - topic:フック
  related:
  - to: dev/設計書/モジュール構成/サーバー/セッションの値の注入.py.yaml
    type: implements
  - to: dev/設計書/モジュール構成/サーバー/未読へ戻す.py.yaml
    type: implements
- path: skills/mindmap/README.md
  name: スキルの共通のフォルダの説明
  description: スキルが共有するスクリプト・プレビュー・スキーマ・進め方ガイドのフォルダの中身を並べる。スキルが共有するスクリプト・プレビュー・スキーマの置き場所を調べるときに読む。
  tags:
  - topic:スキル
  - topic:フォルダ

pre-commit:
  jobs:
    # ソースかビルドの設定を変えた commit で、commit するビルドの出力（preview/spa/・preview/export/）がソースと合っているかを確かめる
    - name: spa-build
      glob: "{frontend/**/*,vite.config.ts,vite.export.config.ts,package.json,package-lock.json}"
      run: npm run --silent build && npm run --silent build-export && test -z "$(git ls-files --others --exclude-standard -- plugins/mindstella/skills/mindmap/preview/spa plugins/mindstella/skills/mindmap/preview/export)" && git diff --exit-code -- plugins/mindstella/skills/mindmap/preview/spa plugins/mindstella/skills/mindmap/preview/export

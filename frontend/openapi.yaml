# React のプレビューが読む、サーバーの配信の API（インターフェース定義『記録の取得』『レビュー中のコメントの読み取り』『レビュー中のコメントの追加』『レビュー中のコメントの書き換え』『レビュー中のコメントの削除』『書きかけの保存』『コメントをまとめて送る』『保存待ちの編集の読み取り』『保存待ちの編集の追加』『保存待ちの編集の取り消し』『保存待ちの編集をまとめて保存』『スレッドの読み取り』『画面からのスレッドの状態の書き換え』『画面からのスレッドの既読』『設定の既定の書き換え』『前回開いた日時』）
openapi: 3.1.0
info:
  title: mindstella preview
  version: 0.0.0
paths:
  /api/records:
    get:
      operationId: getRecords
      summary: ワークスペースの記録をその場で読んで返す
      responses:
        "200":
          description: ワークスペースの記録
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Records"
        "422":
          description: config.yaml 以外の YAML がスキーマに合わない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/comments:
    get:
      operationId: getComments
      summary: レビュー中のコメントと書きかけを返す
      responses:
        "200":
          description: レビュー中のコメントと書きかけ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comments"
    post:
      operationId: addComment
      summary: コメントか返信 1 件をレビュー中に溜める（元に戻すときは id と created を渡す）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: 溜めた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentReply"
        "400":
          description: 本文が空・長すぎる・箇所が合わない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: 向けた項目かスレッドが無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 同じ id のコメントがある
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/edits:
    get:
      operationId: getEdits
      summary: 保存待ちの編集を返す
      responses:
        "200":
          description: 保存待ちの編集
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Edits"
    post:
      operationId: addEdit
      summary: 編集 1 件を保存待ちに溜める
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditInput"
      responses:
        "200":
          description: 同じキーの編集を書き換えたか、元の値に戻して外した
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditReply"
        "201":
          description: 新しく溜めた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EditReply"
        "400":
          description: 編集できないキー・合わない値
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/edits/{id}:
    delete:
      operationId: cancelEdit
      summary: 保存待ちの編集 1 件を外す
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 外した編集
          content:
            application/json:
              schema:
                type: object
                required: [removed, count]
                properties:
                  removed:
                    type: array
                    items: { type: string }
                  count: { type: integer }
        "404":
          description: 編集が無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/edits/save:
    post:
      operationId: saveEdits
      summary: 保存待ちの編集をまとめて保存する
      responses:
        "200":
          description: 全て当てた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveReply"
        "409":
          description: 書き込めない編集がある
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/BlockedProblem"
  /api/opened:
    post:
      operationId: postOpened
      summary: 前回開いた日時を返し、今の日時に書き換える
      responses:
        "200":
          description: 前回と今の時点
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenedReply"
  /api/threads:
    get:
      operationId: getThreads
      summary: スレッドを書き込みと状態の記録ごと返す
      responses:
        "200":
          description: スレッド
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Threads"
  /api/comments/{id}:
    patch:
      operationId: updateComment
      summary: レビュー中のコメント 1 件の本文を書き換えるか、箇所を外す
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentPatch"
      responses:
        "200":
          description: 書き換えた
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPatchReply"
        "400":
          description: 本文が空・長すぎる
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: コメントが無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: removeComment
      summary: レビュー中のコメント 1 件を消し、元に戻すための中身を返す
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 消したコメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemovedComment"
        "404":
          description: コメントが無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/comments/send:
    post:
      operationId: sendComments
      summary: チェックしたレビュー中の書き込みをスレッドへ移す
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendInput"
      responses:
        "201":
          description: 送った
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendReply"
        "400":
          description: ids が空
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: コメントが無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 箇所が合わない書き込みがある
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/StaleProblem"
  /api/drafts:
    put:
      operationId: saveDraft
      summary: コメントの入力欄の書きかけを向けた先ごとに保つ
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInput"
      responses:
        "204":
          description: 保った
        "400":
          description: 合わない値
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/threads/{id}:
    patch:
      operationId: setThreadStatus
      summary: 利用者がスレッドをクローズにするかオープンに戻す
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadStatusInput"
      responses:
        "200":
          description: 書き換えた後の状態
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThreadStatusReply"
        "400":
          description: 合わない値
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: スレッドが無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/threads/{id}/seen:
    post:
      operationId: markThreadSeen
      summary: 利用者が開いたスレッドの未読の書き込みを既読にする
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 既読にした書き込み
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeenReply"
        "404":
          description: スレッドが無い
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/config/display:
    put:
      operationId: putConfigDisplay
      summary: 見た目の既定と表示する種類の既定を config.yaml に書く
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisplayInput"
      responses:
        "200":
          description: 書いた後の display
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayReply"
        "400":
          description: 合わない値
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: config.yaml に書けない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/transcription:
    get:
      operationId: getTranscription
      summary: 文字起こしを使えるかと理由・用語集のプリセットの候補・ワークスペースの文字起こしの設定
      responses:
        "200":
          description: 可否（使えないときも 200）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionStatus"
        "403":
          description: 送り元が合わない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: config.yaml がスキーマに合わない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/transcriptions:
    post:
      operationId: postTranscription
      summary: 録音した音声を文字起こしし、起こした文字を返す
      requestBody:
        required: true
        content:
          audio/*:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: 起こした文字
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionReply"
        "400":
          description: 本文が空
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: 文字起こしに失敗した
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: 文字起こしのサービスが使えない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/UnavailableProblem"
        "504":
          description: 文字起こしが終わらない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/comments/send-now:
    post:
      operationId: sendNow
      summary: 書き込み 1 件をレビュー中に溜めずにすぐスレッドへ送る
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendNowInput"
      responses:
        "201":
          description: 送った
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendNowReply"
        "400":
          description: 合わない値
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: 向けた先が無いか送れない
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    NetworkLook:
      type: string
      enum: [glow, starlight, constellation, deep, dust]
    Loc:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [body, value] }
        start: { type: integer }
        end: { type: integer }
        key: { type: string }
        text: { type: string }
    CommentInput:
      type: object
      required: [body]
      properties:
        target: { type: [string, "null"] }
        loc:
          oneOf:
            - $ref: "#/components/schemas/Loc"
            - type: "null"
        body: { type: string }
        thread: { type: [string, "null"] }
        id: { type: string }
        created: { type: string }
    CommentReply:
      type: object
      required: [id, created, count]
      properties:
        id: { type: string }
        created: { type: string }
        count: { type: integer }
    CommentPatch:
      type: object
      properties:
        body: { type: string }
        loc: { type: "null" }
    CommentPatchReply:
      type: object
      required: [id, body]
      properties:
        id: { type: string }
        body: { type: string }
        loc:
          oneOf:
            - $ref: "#/components/schemas/Loc"
            - type: "null"
    RemovedComment:
      type: object
      required: [id, body, created, count]
      properties:
        id: { type: string }
        target: { type: [string, "null"] }
        loc:
          oneOf:
            - $ref: "#/components/schemas/Loc"
            - type: "null"
        thread: { type: [string, "null"] }
        body: { type: string }
        created: { type: string }
        count: { type: integer }
    SendInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string }
    SendReply:
      type: object
      required: [sent, items, entered]
      properties:
        sent: { type: string }
        items:
          type: array
          items:
            type: object
            required: [comment, thread, post]
            properties:
              comment: { type: string }
              thread: { type: string }
              post: { type: string }
        entered: { type: boolean }
      additionalProperties: true
    StaleComment:
      type: object
      required: [id, reason]
      properties:
        id: { type: string }
        reason: { type: string }
    StaleProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [stale]
          properties:
            stale:
              type: array
              items: { $ref: "#/components/schemas/StaleComment" }
    DraftInput:
      type: object
      required: [body]
      properties:
        target: { type: [string, "null"] }
        loc:
          oneOf:
            - $ref: "#/components/schemas/Loc"
            - type: "null"
        thread: { type: [string, "null"] }
        body: { type: string }
    ThreadStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [open, closed] }
        reason: { type: [string, "null"] }
    ThreadStatusReply:
      type: object
      required: [id, status, changed]
      properties:
        id: { type: string }
        status: { type: string, enum: [open, closed] }
        changed: { type: boolean }
    SeenReply:
      type: object
      required: [id, seen]
      properties:
        id: { type: string }
        seen:
          type: array
          items: { type: string }
    DisplayInput:
      type: object
      required: [network_look, visible_kinds]
      properties:
        network_look: { $ref: "#/components/schemas/NetworkLook" }
        visible_kinds:
          type: array
          items: { $ref: "#/components/schemas/Kind" }
    DisplayReply:
      type: object
      required: [display]
      properties:
        display:
          type: object
          required: [network_look, visible_kinds]
          properties:
            network_look: { $ref: "#/components/schemas/NetworkLook" }
            visible_kinds:
              type: array
              items: { $ref: "#/components/schemas/Kind" }
    EditInput:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [set, option-add, option-edit, option-remove, adopt, item-add, item-remove, setting]
        target: { type: string }
        key: { type: string }
        value: {}
        map:
          type: object
          additionalProperties: { type: string }
    EditReply:
      type: object
      required: [id, target, count]
      properties:
        id: { type: [string, "null"] }
        target: { type: string }
        count: { type: integer }
    BlockedEdit:
      type: object
      required: [id, reason, detail, refs]
      properties:
        id: { type: string }
        reason:
          type: string
          enum: [changed, missing, referenced, invalid]
        detail: { type: string }
        refs:
          type: array
          items: { type: string }
    BlockedProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          required: [blocked]
          properties:
            blocked:
              type: array
              items: { $ref: "#/components/schemas/BlockedEdit" }
    SaveReply:
      type: object
      required: [set, at, added, changed, removed, settings]
      properties:
        set: { type: [string, "null"] }
        at: { type: string }
        added:
          type: array
          items:
            type: object
            required: [temp, id]
            properties:
              temp: { type: string }
              id: { type: string }
        changed:
          type: array
          items: { type: string }
        removed:
          type: array
          items: { type: string }
        settings:
          type: array
          items: { type: string }
    OpenedPoint:
      type: object
      required: [at, seq]
      properties:
        at: { type: string }
        seq: { type: integer }
    OpenedReply:
      type: object
      required: [opened]
      properties:
        previous:
          oneOf:
            - $ref: "#/components/schemas/OpenedPoint"
            - type: "null"
        opened: { $ref: "#/components/schemas/OpenedPoint" }
    TranscriptionStatus:
      type: object
      required: [available, reason, detail, presets, action, preset]
      properties:
        available: { type: boolean }
        reason: { type: [string, "null"], enum: [stopped, unsupported, null] }
        detail: { type: [string, "null"] }
        presets:
          type: array
          items: { type: string }
        action: { type: string, enum: [review, send, insert] }
        preset: { type: [string, "null"] }
    TranscriptionReply:
      type: object
      required: [text]
      properties:
        text: { type: string }
    UnavailableProblem:
      type: object
      required: [type, title, status, detail, reason]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        reason: { type: string, enum: [stopped, unsupported] }
    SendNowInput:
      type: object
      required: [body]
      properties:
        target: { type: [string, "null"] }
        loc:
          oneOf:
            - $ref: "#/components/schemas/Loc"
            - type: "null"
        thread: { type: [string, "null"] }
        body: { type: string }
    SendNowReply:
      type: object
      required: [sent, thread, post, entered]
      properties:
        sent: { type: string }
        thread: { type: string }
        post: { type: string }
        entered: { type: boolean }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    Item:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
        status: { type: string }
        category: { type: string }
        phase: { type: string }
      additionalProperties: true
    Deliverable:
      type: object
      required: [title]
      properties:
        title: { type: string }
        doc: { type: string }
    Settings:
      type: object
      required: [summary, phases, targets, categories, target_label]
      properties:
        summary: { type: string }
        description: { type: string }
        target_label: { type: string }
        phases:
          type: array
          items: { type: string }
        targets:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
        categories:
          type: array
          items:
            type: object
            required: [name, target]
            properties:
              name: { type: string }
              target: { type: string }
        goal:
          type: object
          required: [deliverables]
          properties:
            deliverables:
              type: array
              items: { $ref: "#/components/schemas/Deliverable" }
        display:
          type: object
          properties:
            network_look: { $ref: "#/components/schemas/NetworkLook" }
            visible_kinds:
              type: array
              items: { $ref: "#/components/schemas/Kind" }
        transcription:
          type: object
          properties:
            action: { type: string, enum: [review, send, insert] }
            preset: { type: [string, "null"] }
      additionalProperties: true
    Kind:
      type: string
      enum: [decisions, tasks, research, docs, terms, notes, logs]
    ProgressCell:
      type: object
      required: [phase, settled, total]
      properties:
        phase: { type: string }
        settled: { type: integer }
        total: { type: integer }
    NextCandidate:
      type: object
      required: [id, title, phase, weight, followers]
      properties:
        id: { type: string }
        title: { type: string }
        phase: { type: [string, "null"] }
        weight: { type: [string, "null"] }
        followers: { type: integer }
    Goal:
      type: object
      required: [has_goal, remaining_deliverables, phase_progress]
      properties:
        has_goal: { type: boolean }
        remaining_deliverables:
          type: array
          items:
            type: object
            required: [title]
            properties:
              title: { type: string }
              doc: { type: [string, "null"] }
        phase_progress:
          type: array
          items: { $ref: "#/components/schemas/ProgressCell" }
      additionalProperties: true
    CategoryProgress:
      type: object
      required: [category, cells, settled, total]
      properties:
        category: { type: string }
        cells:
          type: array
          items: { $ref: "#/components/schemas/ProgressCell" }
        settled: { type: integer }
        total: { type: integer }
    Derived:
      type: object
      required: [next, goal, progress]
      properties:
        next:
          type: array
          items: { $ref: "#/components/schemas/NextCandidate" }
        goal: { $ref: "#/components/schemas/Goal" }
        progress:
          type: array
          items: { $ref: "#/components/schemas/CategoryProgress" }
    ItemList:
      type: array
      items: { $ref: "#/components/schemas/Item" }
    Records:
      type: object
      required: [settings, decisions, tasks, research, docs, terms, notes, logs, derived, built_at]
      properties:
        settings: { $ref: "#/components/schemas/Settings" }

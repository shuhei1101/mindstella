# yaml-language-server: $schema=https://raw.githubusercontent.com/shuhei1101/dev-docs/v0.0.0/schemas/dev-docs.schema.json
version: "3"
name: mindstella
worktrees: [".claude/worktrees/*"]
description: 話し合いを記録しながら決めたことを形にしていく Claude Code のスキルの設計書・目次・Markdown・コード・テスト
instructions: |-
  設計書は `docs/` の種別ごとの YAML が正本で、書式は `schemas/{種別}.schema.yaml` が持つ。他の設計書の項目は `{ID}#{項目のパス}` で指す。目次は `docs/` の各フォルダの `index.yaml`。
  Markdown・コード・テストは、`docs/guide/`・`docs/_root/`・`plugins/mindstella/`・`frontend/`・`tests/` の `files.yml` の行が名前・概要文・タグ・関連を持つ。コードの行の `implements` が設計書を、テストの行の `tests` がコードを指す。各文書の公開範囲は `visibility`（`public` / `internal`）で、YAML の文書はキー、Markdown は `files.yml` の行が持つ。
related:
  types: [references, depends_on, see_also, implements, tests]
github:
  repository: shuhei1101/mindstella
documents:
  - id: architecture
    title: アーキテクチャ図
    paths: ["docs/architecture/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/architecture.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: nonfunctional
    title: 非機能要件
    paths: ["docs/nonfunctional/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/nonfunctional.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: scenario
    title: シナリオ
    paths: ["docs/scenario/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/scenario.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: interface
    title: インターフェース定義
    paths: ["docs/interface/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/interface.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: module
    title: モジュール構成
    paths: ["docs/module/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/module.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: screen
    title: 画面設計
    paths: ["docs/screen/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/screen.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: component
    title: 部品設計
    paths: ["docs/component/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/component.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: er
    title: ER 図
    paths: ["docs/er/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/er.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: config
    title: 設定
    paths: ["docs/config/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/config.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: api
    title: 外部API
    paths: ["docs/external-api/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/external-api.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: library
    title: 外部ライブラリ
    paths: ["docs/library/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/library.schema.yaml
    metadata:
      name: title
      description: lead
      visibility: visibility
  - id: test_procedure
    title: テスト実行方法
    paths: ["docs/test-procedure/*.yaml"]
    exclude: [index.yaml]
    schema: schemas/test-procedure.schema.yaml
    metadata:
      name: title
      visibility: visibility
  - id: index
    title: 目次
    paths: ["docs/**/index.yaml"]
    schema: schemas/index.schema.yaml
    metadata:
      description: summary
  - id: files_guide
    title: 公開ドキュメントの Markdown
    paths: ["docs/guide/files.yml"]
    exclude: ["*.yaml", "*.yml", README.md, はじめに.md, 使い方.md, リファレンス.md]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
      category: category
  - id: files_root
    title: docs の直下の Markdown
    paths: ["docs/_root/files.yml"]
    exclude: ["*.yaml", "*.yml", README.md]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
    metadata:
      visibility: visibility
  - id: files_plugin
    title: プラグインのスキル・コード
    paths: ["plugins/mindstella/files.yml"]
    exclude: ["*.js", "*.ini", LICENSE, "*.txt", index.html, "index-*.css"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: files_frontend
    title: React のプレビューのコード
    paths: ["frontend/files.yml"]
    exclude: ["*.gen.ts", "*.json"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path
  - id: files_tests
    title: テスト
    paths: ["tests/files.yml"]
    schema: schemas/files.schema.yaml
    records: files
    body_file: path

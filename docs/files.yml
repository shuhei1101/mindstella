# yaml-language-server: $schema=../schemas/files.schema.yaml
files:
- path: はじめに/コアコンセプト/ワークスペース.md
  name: ワークスペースの仕組み
  description: 1 つの話し合いの記録を、YAML と Markdown で置いたフォルダ。利用者に話し合いの記録のフォルダの仕組みを説明するときに読む。
  tags:
  - topic:コアコンセプト
  - topic:ワークスペース
- path: はじめに/コアコンセプト/話し合いの進め方.md
  name: 話し合いの進め方の仕組み
  description: 話し合いの記録を 4 段の軸で整理し、分野ごとの進め方ガイドに沿ってステップを回し、ゴールまで進める仕組み。記録の軸・進め方ガイド・ステップの仕組みを説明するときに読む。
  tags:
  - topic:コアコンセプト
  - topic:進め方ガイド
- path: はじめに/変更履歴.md
  name: 変更履歴
  description: バージョンごとの変更の一覧。バージョンごとに何が変わったかを調べるとき・release を master へ入れるときに読む。
  tags:
  - topic:バージョン
  - topic:履歴
- path: リファレンス/コマンド.md
  name: コマンドのリファレンス
  description: スキルが呼ぶ MCP のツールと、利用者が叩く起動スクリプトの一覧。MCP のツールと起動スクリプトの引数・出力・結果を調べるときに読む。
  tags:
  - tool:mcp
  - topic:コマンド
  - topic:リファレンス
- path: リファレンス/スキル.md
  name: スキルのリファレンス
  description: プラグイン mindstella が持つスキルの一覧と、進め方ガイドの一覧。スキルの呼び名・入力・ステップと進め方ガイドを調べるときに読む。
  tags:
  - topic:スキル
  - topic:リファレンス
- path: リファレンス/ワークスペースの書式.md
  name: ワークスペースの書式のリファレンス
  description: ワークスペース（1 つの話し合いのフォルダ）のファイル構成と、各 YAML のキーの一覧。ワークスペースのファイル構成と YAML のキーを調べるときに読む。
  tags:
  - tool:yaml
  - topic:リファレンス
  - topic:ワークスペース
- path: リファレンス/動作環境.md
  name: 動作環境
  description: mindstella を使う端末に要る条件の一覧。mindstella を使う端末に要る条件を調べるときに読む。
  tags:
  - topic:リファレンス
  - topic:環境
- path: 使い方/セットアップ手順/スクリプトの依存を入れる.md
  name: スクリプトの依存を入れる手順
  description: 起動スクリプトを初めて叩くとき、起動スクリプトが依存の不足を示して止まったときに実行する。起動スクリプトが依存の不足で止まったときの手順を調べるときに読む。
  tags:
  - topic:セットアップ手順
  - topic:依存
- path: 使い方/セットアップ手順/プラグインをインストールする.md
  name: プラグインのインストールの手順
  description: mindstella を初めて使うときに実行する。mindstella を初めて入れる手順を調べるときに読む。
  tags:
  - topic:セットアップ手順
  - topic:プラグイン
  - topic:マーケットプレイス
- path: 使い方/セットアップ手順/プレビューを外から見る.md
  name: プレビューを外から見る手順
  description: プレビューを、トンネル・リバースプロキシを通して端末の外から開くときに実行する。トンネル・リバースプロキシを通してプレビューを開く設定を調べるときに読む。
  tags:
  - topic:セットアップ手順
  - topic:プレビュー
  - topic:ポート
- path: 使い方/セットアップ手順/ワークスペースを今の版へ移し替える.md
  name: ワークスペースの移し替えの手順
  description: プラグインを上げた後に、`/mindstella:setup`・`/mindstella:session` がワークスペースの版が古いと案内したときに実行する。プラグインを上げた後にワークスペースを移し替える手順を調べるときに読む。
  tags:
  - topic:セットアップ手順
  - topic:バージョン
  - topic:移行
- path: 使い方/セットアップ手順/常駐サーバーを起動する.md
  name: 常駐サーバーの起動の手順
  description: mindstella のツールが Claude Code に無いとき、常駐サーバーの状態を確かめたいとき、常駐サーバーを止めたいとき、待ち受けのポートを変えたいときに実行する。常駐サーバーを起動する手順を調べるときに読む。
  tags:
  - topic:サーバー
  - topic:セットアップ手順
  - topic:常駐
- path: 使い方/セットアップ手順/起動スクリプトで立ち上げる.md
  name: 起動スクリプトで立ち上げる手順
  description: mindstella のスキルを使い始めるとき、話し合いを再開するとき、止まったサーバーを立ち上げ直すときに実行する。起動スクリプトで Claude Code を立ち上げる手順を調べるときに読む。
  tags:
  - tool:tmux
  - topic:セットアップ手順
  - topic:起動
- path: 使い方/セットアップ手順/起動スクリプトを登録する.md
  name: 起動スクリプトの登録の手順
  description: 起動スクリプトを短い名前で叩きたいとき、外から見る設定などの環境変数を毎回打たずに済ませたいとき、Claude Code のアカウントごとに立ち上げたいときに実行する。alias と環境変数をシェルに登録する手順を調べるときに読む。
  tags:
  - topic:シェル
  - topic:セットアップ手順
  - topic:環境変数
- path: 使い方/プレビューを見る.md
  name: プレビューの使い方
  description: 話し合いの記録を、サーバーが配るプレビューをブラウザで開いて読み返す。利用者がプレビューを開いて記録を読み、コメントを送る手順を調べるときに読む。
  tags:
  - topic:プレビュー
  - topic:使い方
- path: 使い方/話し合い/ゴールでリリースする.md
  name: ゴールでリリースする使い方
  description: ゴールに届いたかを確かめ、決まったことと納品物を確定して、リリースの資料を `.mindstella/release/` に書き出す。ゴールに届いたかを確かめてリリースの資料を書き出す手順を調べるときに読む。
  tags:
  - topic:リリース
  - topic:使い方
- path: 使い方/話し合い/セットアップから始める.md
  name: セットアップから始める使い方
  description: 新しい話し合いを始めるとき、セットアップのスキル `setup` でワークスペースを作る。新しい話し合いを始める手順を調べるときに読む。
  tags:
  - topic:セットアップ
  - topic:使い方
- path: 使い方/話し合い/続きを再開する.md
  name: 続きを再開する使い方
  description: 途中まで進んだ話し合いを再開するとき、セットアップのスキル `setup` で状況を読んで、続きから進める。途中の話し合いを再開する手順を調べるときに読む。
  tags:
  - topic:ワークスペース
  - topic:使い方

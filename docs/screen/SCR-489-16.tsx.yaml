id: SCR-489-16
title: 変更履歴
screen: frontend/src/features/history/history/history-dialog.tsx
elements:
  - name: 既読の操作
    kind: button
    component: CMP-489-26#
    args:
      - name: onMarkAllRead
        value: サーバーの配信でだけ指定する（配る書き出しでは指定せず、件数とボタンの行を出さない）
    description: 一覧の上に「未読 {件数} 件」（0 件は「未読はありません」）と「すべて既読にする」を出す。押すと記録の全てのまとまりを既読にし（『プレビューを開く』の制約「既読のまとまり」）、一覧の未読のマーカーとトップバーの未読の件数を削除する。モーダルは閉じず、選んだ時点も変えない
    io: 入力
    source: 記録の取得.changes.sets と、端末の保存領域の既読のまとまり
    visible_when: サーバーの配信
    enabled_when: 未読のまとまりが 1 件以上
  - name: 時点の一覧
    kind: list
    component: CMP-489-26#
    args:
      - name: points
        value: 「最新」・「今回の差分」（常に出す）・「まだまとめていない変更」（記録の取得.changes.pending の added・changed・removed のどれかが空でないとき）・記録の取得.changes.sets の並び（新しい順）
      - name: points[].sel
        value: 空文字列・turn・pending・sets[].id
      - name: points[].name
        value: 最新・今回の差分・まだまとめていない変更・sets[].summary
      - name: points[].sub
        value: マーカーと差分を出さずに今の内容だけを読む・「{changes.turn_at の JST の MM/DD HH:mm} の送信より後の書き換え」（turn_at が null なら「送信の前のため、最初からの書き換え」、変わった項目の数が 0 なら「{日時} の送信より後の書き換えはありません」）・AI がまだ区切っていない書き換え・sets[].at（JST の MM/DD HH:mm）
      - name: points[].external
        value: sets[].by が external のまとまりで真（名前の横に「外部の変更」の札。名前は sets[].summary の「ほかのセッションの書き込み」）
      - name: points[].unread
        value: サーバーの配信で、sets[].id が端末の保存領域の既読に無いまとまりで真（配る書き出しでは指定しない）
      - name: points[].count
        value: その時点の added・changed・removed の数（「今回の差分」は、`until_seq` が記録の取得.changes.turn_seq より大きいまとまりの全てと、まだまとめていない変更を合わせた範囲。turn_seq が 0 なら全てのまとまり）。合わせた範囲で追加して削除した項目は、削除した項目として 1 件に数える（「最新」の行は指定しない）
      - name: current
        value: プレビューを開く.diff（無ければ空文字列）
    description: 時点を新しい順に並べる。行を押すとモーダルを閉じ、どの画面もその時点の差分の表示で再描画し、まとまりの行ならそのまとまりを既読にする。「最新」は差分の表示をやめる。書き換えの通知で再読み込みして増えたまとまりは、開いたままのモーダルにも未読で加わる
    io: 入力
    source: 記録の取得.changes、端末の保存領域の既読のまとまり
    visible_when: 常時
  - name: 閉じる
    kind: button
    description: モーダルを閉じる。Esc と外側の押下でも閉じる。選んだ時点は変えない
    visible_when: 常時
lead: 差分の表示で比べる時点を選ぶモーダル。トップバーの「変更履歴」で開く。
notes:
  削除した項目を含む件数のモック: 削除した項目を含む時点の件数の見本は `docs/mock/pages/decisions/179/b-band/index.html` の変更履歴のモーダル
test_file: tests/integration/preview/test_spa_history_screen.py

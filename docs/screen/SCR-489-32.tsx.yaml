    description: その項目に向けたスレッドの件数のバッジ。数える対象は、`target` がその項目のスレッド（オープン・クローズを問わない）と、レビュー中の書き込みのうちその項目へ向けたまだ送信していない新規スレッド。10 件以上は数字をそのまま出し、100 件以上は「99+」と出す。タブの読み上げの名前は「コメント {件数} 件」（100 件以上も実数で読む）
    io: 表示
    type: 整数
    source: スレッドの読み取り.threads[].target・レビュー中のコメントの読み取り.items[]（`thread` を持たず `target` がその項目のもの）
    visible_when: サーバーの配信で、件数が 1 以上のとき（0 件のときは出さない）
    status: planned
  - name: コメントの一覧のボタンの件数
    kind: badge
    position: 見出し > コメントの一覧 > アイコンの右上
    description: 「コメントのタブの件数」と同じ件数・同じ出し方（100 件以上は「99+」）のバッジ。ボタンの押せる領域を広げず、アイコンに重ねる。ボタンの読み上げの名前は「{ID} のコメントの一覧を開く（{件数} 件）」
    io: 表示
    type: 整数
    source: 「コメントのタブの件数」と同じ
    visible_when: サーバーの配信で開いた詳細パネルで、件数が 1 以上のとき（0 件のときは出さない）
    status: planned
  - name: お気に入りの星
    kind: toggle
    component: CMP-721-1#
    args:
      - name: title
        value: 開いている項目のタイトル
      - name: on
        value: 記録の取得.favorites に開いている項目の ID があるか
      - name: disabled
        value: 配る書き出しのとき真
    position: 見出し > 編集するの左
    description: 開いている項目をお気に入りに登録・解除する（『プレビューを開く』の制約「お気に入り」）。カード・表の星と同じお気に入りを指し、どちらで変えても同じ状態になる。押しても詳細パネルは閉じず、履歴に積まない。書き込めないときは押す前の状態に戻し、トースト「お気に入りを変更できませんでした。{detail}」を出す（`{detail}` は『画面からのお気に入りの登録・解除』の応答の `detail`。詳細パネル「保存できませんでした。{detail}」と同じ書式）
    io: 入力
    visible_when: 編集の表示でないとき（削除した項目の差分の表示では出さない）
    action_ref: IF-489-70#constraints[お気に入り]
    status: planned

id: SCR-489-32
title: 詳細パネル
screen: frontend/src/features/detail/detail-panel/detail-panel.tsx
elements:
  - name: 戻る・進む
    kind: button
    position: 見出し
    description: 詳細の履歴（一覧・表・ボード・カード・詳細の中のリンク・全体の検索・一覧の並びの前後から開いた項目）の 1 つ前・後の項目へ戻り・進む。間にある絞り込み・並べ替えの履歴は飛ばし、飛ばした履歴の絞り込み・並べ替えと後ろの画面（タブ）は今のままにする（『プレビューを開く』の制約「履歴」）。ブラウザの戻る・進むは履歴を 1 つずつたどる。読み上げの名前は「前の項目へ戻る」「次の項目へ進む」
    label: ← →
    enabled_when: 詳細の履歴のその向きに項目がある
  - name: タイトル
    kind: heading
    position: 本文のスクロール領域 > 先頭
    description: 項目の状態とタイトル。本文を送信するとスクロール領域と一緒に隠れ、代わりに見出しのタイトルが出る
    io: 表示
    source: プレビューを開く.id の項目
  - name: 全画面表示
    kind: button
    position: 見出し
    description: 詳細の全画面を開く（履歴に積まない）。全画面の中では、画面設計『詳細の全画面』の「元の大きさに戻す」に替わる
    label: 全画面表示
    visible_when: 画面の幅が 768px 以上のとき。スマホの幅（767px 以下）では詳細パネルが最初から画面いっぱいに出るため出さない
  - name: 閉じる
    kind: button
    position: 見出し
    description: パネルを閉じる。Esc でも閉じる（幅 900px 以下で左のパネルが前に出ているときは、左のパネルを先に閉じる）
  - name: 案
    kind: list
    description: 背景の後に、検討事項の案をカードの縦並びで出す。カードの左上に記号の丸いアイコン（読み上げは「案 {記号}」）、その右に内容を縦の中央を揃えて出し、その下にメリット・デメリット・備考・理由をラベルと値のベースラインを揃えて出し、値は文字列の値の描画で描く。採用した案にマーカーの色の「採用」、`adopted` が偽の案に枠線だけの「不採用」のバッジをカードの右上に出し、どちらでもない案には何も出さない。不採用のカードも文字を薄くしない。採用した案が無い間は、推奨の案の `reason` を「理由」ではなく「推奨理由」の欄としてそのカードの一番下に出し、案の一覧の下には出さない
    io: 表示
    source: 記録の取得.decisions[].options
    visible_when: 検討事項で案を持つ
  - name: 本文
    kind: article
    component: CMP-489-6#
    args:
      - name: source
        value: 記録の取得.bodies[{項目の body}]
      - name: display
        value: プレビューを開く.個人の上書き の section_fold（無ければ折りたたみはオン）
      - name: fold
        value: 差分の表示で本文の差分を描いているときは false、それ以外は true
      - name: base
        value: 差分の表示の間で本文が変わったとき、history の body_diff で組み立てた選んだ時点の本文。それ以外は指定しない
      - name: diffView
        value: 「本文の差分の見せ方の切り替え」で選んだ見せ方
    description: 本文の Markdown を mdmark で描き（描くときに無害化する）、見出しのリンク・本文のマーカー・項目の ID のリンクを付ける。mermaid の図は SVG に描き、「拡大表示」「Raw」「コピー」を置く。図は押しても拡大せず、図の上で虫眼鏡のカーソルを出さない。図の文字の上は文字を選ぶカーソルにし、ドラッグで選んでコピーできる。図を描けないときは「この図は表示できませんでした。原文を表示します。」と原文。ライブラリが読めないときは読めなかったライブラリの知らせと原文。コードブロック（ファイルツリーを含む）は、長い行を折り返さず、コードブロックの中だけで横にスクロールする（キーボードのフォーカスで止まり矢印で送信できる。『Markdownの本文』）。図の原文（Raw・描けないときの原文・Raw の差分）と、ライブラリが読めないときの本文の原文は、長い行を折り返して本文の幅に収め、横にスクロールさせない。本文の長い URL とインラインコードは、どの幅でも本文の幅で折り返す（項目の ID のリンクは折り返さない）。本文の表は mdmark の表の機能で描き、表の中だけで横にスクロールする。本文の区画は横にスクロールさせない。セクションの折りたたみ・コードブロックの言語の札とコピー・Alert の見出しのアイコンは『Markdownの本文』で当てる（『プレビューを開く』の制約「本文の表とセクションの見せ方」）。表示の設定で切り替えるとその場で再描画し、畳んだセクションは初めの状態に戻る。ブラウザの印刷では、mdmark の印刷の機能で畳んだセクションを開いて印刷し、印刷の後に元の開閉に戻す
    io: 表示
    visible_when: 項目が `body` を持ち、本文が Markdown（`body` が `.md` で終わる）
    source: 記録の取得.bodies[{項目の body}]
  - name: 図の拡大表示
    kind: button
    position: 本文 > 図
    description: 図の拡大を開く。読み上げの名前は「図を拡大表示」
    label: 拡大表示
  - name: 図の Raw
    kind: button
    position: 本文 > 図
    description: 図と mermaid の原文を切り替える（`aria-pressed`）
    label: Raw
  - name: 図のコピー
    kind: button
    position: 本文 > 図
    description: mermaid の原文をクリップボードに写す
    label: コピー
  - name: 関係する項目
    kind: list
    description: 前提・後続の項目・派生元と派生した項目・関連タスク・経緯・関連・参照元。`related` の種類ごとに見出しを分けて並べる（種類 `see_also` の見出しは「関連する項目」。会話ログは「更新した項目」）。リンクと一緒に「関連」のタブに出す。押すとその項目へ移り、履歴に積む
    io: 表示
    source: 記録の取得（`related` の種類 `depends_on`・`parent`・`for`・`see_also`・`sources` とその逆向き）
    visible_when: その種類の項目が 1 件以上
  - name: コメントの入力
    kind: form
    component: CMP-489-8#
    args:
      - name: target
        value: プレビューを開く.id
      - name: loc
        value: 選んだ箇所のコメントの入口を押して添えた箇所（添えていなければなし）
      - name: body
        value: レビュー中のコメントの読み取り.drafts のうち、同じ target と loc の下書き（入力中は画面が持ち、項目の移動・再描画・パネルと全画面の行き来をまたいで保つ）
      - name: status
        value: レビュー中のコメントの追加（POST /w/{workspace}/api/comments）の結果。音声入力では、既定の挙動でレビュー中のコメントの追加をした結果（reviewed）・書き込みをすぐ送信するの結果（sent）・入力欄へ挿入した（inserted）・録音と文字起こしと送信の失敗（voice-failed）
      - name: count
        value: レビュー中のコメントの追加.count
      - name: detail
        value: レビュー中のコメントの追加のエラーの detail（届かなかったときはなし）
      - name: open
        value: 端末の保存領域に覚えたコメントの入力の開閉（覚えていなければ開く）
      - name: voice
        value: 文字起こしの可否（GET /w/{workspace}/api/transcription）の available と、ブラウザが navigator.mediaDevices.getUserMedia を持つか、録音・文字起こしの進み（画面で 1 つの音声入力の状態）から決める。使えないときと、ほかの入力欄で録音・文字起こし中のときは disabled
      - name: voiceReason
        value: 文字起こしの可否.detail（ブラウザがマイクを使えないときは画面が持つ文「このページではマイクを使用できません。HTTPS か localhost の URL で開いてください。」、ほかの入力欄で音声入力中のときは「ほかの入力欄で音声入力中のため、音声で入力できません。」）
      - name: elapsed
        value: 録音を始めてからの秒数（画面が 1 秒ごとに進める）
      - name: levels
        value: 録音中のマイクの音量（画面が AnalyserNode で一定の間隔ごとに取って追加する）
      - name: entered
        value: 書き込みをすぐ送信する（POST /w/{workspace}/api/comments/send-now）の entered
    position: 下端
    description: 開いている項目へのコメントをレビュー中に溜める。本文のスクロール領域の外のパネルの下端に留め、本文と線で区切る。本文の長さ・スクロールの位置によらず、入力の下端とパネルの下端の間を空けない。下書きは入力が止まったときとパネルを閉じるときに『下書きの保存』へ送信する。溜めてレビュー中の書き込みを読み直し終えたら（読み直し終えるまでは部品『コメントの入力』の `saving`）入力欄と添えた箇所を空にし、コメントのボタンの件数とレビュー中のコメントを再描画する。溜めた後のフォーカスは『プレビューを開く』の制約「「レビューに追加」の後のフォーカス」に従い、入力欄か「レビューに追加」のボタンへ移す。開閉のボタンで閉じた・開いたことは端末の保存領域に覚え、項目を移っても・パネルと全画面を行き来しても・再度開いても同じ開閉で出す。閉じている間に選んだ箇所のコメントの入口を押したときは、開いて覚えてから入力欄へフォーカスを移す
    io: 入力
    visible_when: サーバーの配信で開いたとき
    status: planned
  - name: 選んだ時点
    kind: label
    description: 本文の冒頭に、変更履歴で選んだ時点の名前と日時を出す
    io: 表示
    source: プレビューを開く.diffと記録の取得.changes
    visible_when: 差分の表示の間で、開いた項目がその時点で追加されたか変わったとき
  - name: 新規の札
    kind: label
    component: CMP-489-32#
    args:
      - name: kind
        value: new
      - name: labeled
        value: 'true'
    description: タイトルの横に「新規」の札を置く
    io: 表示
    visible_when: 差分の表示の間で、開いた項目がその時点で追加されたとき
  - name: キーの差分
    kind: label
    description: 変わったキー（状態・回答・案 など）の前の値と今の値を並べる。前の値は削除した色の面と取り消し線、今の値は追加した色の面と下線。状態のキーだけは面を塗らず、取り消し線・下線と矢印で示す。前に無かったキーは今の値だけを追加したマーカーで出す。前の値と今の値は、値の中の改行を改行として出し、長い行は幅に合わせて折り返す。`withdrawn` はキーの一覧に値を出さず（取り下げの札が示す）、選んだ時点で変わったときだけ「取り下げ」の行に前後を並べ、真の値を取り下げの札で出す。タイトルと、文字列の値の描画が描く値は、前の値と今の値がどちらもあるとき、本文の差分と同じく変わった語だけに値の面より濃い面（前の値は濃い赤、今の値は濃い緑）を付ける。値の面・下線・取り消し線・矢印はそのまま残し、濃い面の上の文字も 4.5:1 以上にする。変わった語の範囲が改行をまたぐときは、改行の前後の行それぞれで、その範囲の文字に濃い面を付ける。配列のキー・キーの一覧・状態・案の採用の状態と、語の差分を計算しきれなかった値には濃い面を付けない
    io: 表示
    source: 記録の取得.{種類}[].history から組み立てた前の値
    visible_when: 差分の表示の間で、そのキーが選んだ時点で変わったとき
  - name: 本文の差分
    kind: label
    description: 本文を「本文の差分の見せ方の切り替え」で選んだ見せ方で、mdmark の差分で描く（『Markdownの本文』の `base`・`diffView`）。「描いた結果」は Markdown として描いたまま、追加・変更した段落・見出し・箇条書き・表の行を追加の色の面と左の余白の `+`、削除したものを削除の色の面と `−` で変更前の位置に出す（書き換えた段落の前の文と変わった単語は出さない）。「原文の差分」は mdmark の行の差分で、削除した行を赤と `-`、追加した行を緑と `+`、対の行で変わった単語を濃い色で出し、mdmark が配置する「変更表示」のボタンと前と後のリビジョンの欄（選択肢は「選んだ時点」と「今」）をそのまま出す。本文の差分も、表は mdmark の表の機能で描き、セクションの開閉は配置しない
    io: 表示
    source: 記録の取得.bodies と、history の body_diff から組み立てた前の本文
    visible_when: 差分の表示の間で、Markdown の本文が選んだ時点で変わったとき
  - name: 図の差分
    kind: label
    description: flowchart・sequenceDiagram・classDiagram・erDiagram・stateDiagram-v2 は、追加した・変えたノードと辺に色を付け、図の下に凡例と「削除したもの」の札を並べる。それ以外の種類は変わった図の枠に色を付け、Raw で差分を見るよう案内する
    io: 表示
    visible_when: 差分の表示の間で、本文のその図の記法が選んだ時点で変わったとき
  - name: 図の Raw の差分
    kind: label
    description: 図の Raw で、記法の行ごとに追加した行（+）と削除した行（−）をマーカーつきで出す。変えた行の対は、本文の差分と同じく変わった語だけに濃い面を付ける。記法の行の差分を打ち切ったときは、今の記法を差分なしで出す。長い行の折り返した続きはマーカーの幅だけ下げて、マーカーの列の下へ回り込ませない
    io: 表示
    visible_when: 差分の表示の間で、jsdiff を読めていて、図の Raw を押していて、その図の記法が変わったとき
  - name: 前後を組み立てられない旨
    kind: label
    description: 選んだまとまりの変更履歴が保持する回数を超えて消えているとき、本文の頭に出し、今の内容を差分なしで描く
    label: このまとまりの前後を組み立てられません。保持する回数を超えた古い変更履歴は消えています。今の内容を出しています。
    io: 表示
    visible_when: 差分の表示の間で、開いた項目が選んだ時点で変わっていて、その変更履歴が無いとき
  - name: 本文の差分を出せない旨
    kind: label
    description: 本文の差分が今の本文に当たらないとき、本文の頭に出し、今の本文を差分なしで描く。キーの差分は出す
    label: 本文の差分を出せません。書き換えの後に、本文のファイルが直接書き換えられています。今の本文を出しています。
    io: 表示
    visible_when: 差分の表示の間で、body_diff の now が今の本文に当たらないとき
  - name: 本文の差分を計算しきれない旨
    kind: label
    description: 本文の行の差分を打ち切ったとき、本文の頭に出し、今の本文を差分なしで描く。キーの差分は出す
    label: 本文の差分を出せません。書き換えが大きく、差分を計算しきれませんでした。今の本文を出しています。
    io: 表示
    visible_when: 差分の表示の間で、jsdiff を読めていて、本文の行の差分を打ち切ったとき（モジュール構成『差分』の `diffLineParts` が `null`）
  - name: 差分のライブラリを読めない旨
    kind: label
    description: jsdiff を読めなかったとき、本文の頭に出し、本文・図・図の Raw を今のバージョンで差分なしで描く。キーの差分は出す
    label: '本文と図の差分を表示できません。読み込めなかったライブラリ: jsdiff 通信を確認して、ページを再読み込みしてください。'
    io: 表示
    visible_when: 差分の表示の間で、開いた項目が選んだ時点で変わっていて、jsdiff を読めなかったとき（モジュール構成『基盤』の `missingLibraries`）
  - name: レビュー中のコメント
    kind: list
    position: 本文の切り替えの「コメント」のタブ
    description: その項目へのレビュー中のコメント（案の選択は案のカードに出すため除く）を、既定は新しい順に並べ、レビュー中のコメントの並びの切り替えで古い順にする。見出し「レビュー中のコメント」と件数、行ごとに箇所（名前と選んだ文）と本文（行の本文）を出し、行の右上に「修正」「削除」を置く。削除した行は並びの中の元の場所に「元に戻す」と共に残す。チェックとまとめて送信はコメントの一覧のレビュー中の書き込みの画面で行う。0 件のときは「レビュー中のコメントはありません。」。件数は削除した行を数えない。本文のスクロール領域の中で本文と一緒にスクロールし、下端に留めない
    io: 表示
    source: レビュー中のコメントの読み取り.items（target がこの項目のもの）
    visible_when: サーバーの配信で開いたとき
    status: planned
  - name: レビュー中のコメントの並びの切り替え
    kind: button
    position: レビュー中のコメント > 見出しの行 > 右
    description: '今の並び（「新しい順」「古い順」）と矢印を出す 1 つのボタンで、押すたびに並びを入れ替え、その場で再描画する（『プレビューを開く』の制約「レビュー中のコメントの並び」）。古い順は個人の上書きに残し、新しい順に戻すと上書きを外す。読み上げの名前は「コメントの並び: {今の並び}」。押したボタンのフォーカスを保ち、履歴に積まず URL の search params も変えない'
    label: 新しい順 / 古い順
    io: 入力
    visible_when: サーバーの配信で開いたとき、レビュー中のコメントの行（削除した行を含む）が 2 件以上のとき
    action_ref: IF-489-70#constraints[レビュー中のコメントの並び]
    status: planned
  - name: 選んだ箇所のコメントの起点
    kind: button
    component: CMP-489-58#
    args:
      - name: anchor
        value: 選んだ範囲の端の矩形
      - name: area
        value: 画面の大きさと、開いている詳細（パネルか全画面）の要素「本文のスクロール領域」の矩形
    position: 本文・値 > 選んだ範囲の始まりの上（収まらなければ終わりの下）
    description: 本文の文章か項目の値（案の中の値を含む）を選び終えたときに出す。本文は元の行のマーカーから行の範囲を、値は描いた要素のキーのパスを求める（『プレビューを開く』の選んだ箇所の対応づけ）。HTML の本文は、「HTML の本文」の「選び終えた」で受けた行の範囲と矩形で出す。埋め込んだ HTML の範囲の中の選択の端は、要素「埋め込んだ HTML」のとおり範囲の行に読み替える。押すと入口を閉じ、コメントの入力に箇所を添えて入力欄へフォーカスを移す。履歴に積まない
    visible_when: サーバーの配信で、選んだ範囲が空でなく、始まりと終わりがどちらも本文か同じ値の中にあるとき（見出しの帯・関係する項目・図・レビュー中のコメント・入力を含む選択と、差分の表示の間の削除した部分を含む選択、古いまとまりを選んでいてその後に本文を修正した項目の本文の選択、`html` のコードブロックの枠の中の選択、「HTML の本文の差分」の中の選択、「左右に並べた本文の差分」の左の列を含む選択では出さない）
    status: planned
  - name: 示す箇所
    kind: highlight
    position: 本文・値

id: SCR-489-24
title: 表示の設定
screen: frontend/src/features/settings/display-settings/display-settings-panel.tsx
elements:
  - name: パネルの見出し
    kind: heading
    position: 見出し
    description: 「表示の設定」
    label: 表示の設定
    io: 表示
    status: planned
  - name: パネルを閉じる
    kind: button
    position: 見出し
    description: パネルを閉じ、重ねていた画面に戻る（履歴に積まない）。Esc とトップバーの表示の設定のボタンでも閉じる。幅 901px 以上で詳細パネルを開いているときの Esc は詳細パネルを先に閉じる。幅 900px 以下の Esc は前に出ている側から閉じる。グレーアウトした所を押しても閉じる。読み上げの名前は「表示の設定を閉じる」
    status: planned
  - name: 表示の設定の中身
    kind: form
    component: CMP-489-50#
    args:
      - name: visibleKinds
        value: 個人の上書きの表示する種類（プレビューを開く.個人の上書き.visible_kinds）。無ければ default_kinds
      - name: defaultKinds
        value: 記録の取得.settings.display.visible_kinds（無ければ全ての種類）
      - name: counts
        value: 記録の取得.{種類} の件数
      - name: overrides
        value: 個人の上書きが持つ項目（表示する種類・ライト / ダーク・種類ごとの表の列・画面ごとの絞り込みの条件・差分のミニマップ・セクションの折りたたみ・レビュー中のコメントの並び）の名前。絞り込みは「絞り込み（{画面}）」で、残した条件が画面の既定の条件と違う画面だけを並べる。差分のミニマップは表示しない上書きを持つときだけ「差分のミニマップ」を、セクションの折りたたみは上書きを持つときだけ「セクションの折りたたみ」を、レビュー中のコメントの並びは `review_order` が oldest のときだけ「コメントの並び」を、「レビューに追加」の後のフォーカスは `focus_after_add` を持つときだけ「レビューに追加した後のフォーカス」を並べる
      - name: canSave
        value: サーバーの配信では true、配る書き出しでは false
      - name: message
        value: この画面を開いてから最後に既定にした知らせか、既定が変わった知らせ（時刻つき）
      - name: storageAvailable
        value: 端末の保存領域に書けるか
      - name: minimap
        value: プレビューを開く.個人の上書き.diff_minimap が偽なら false、それ以外は true
      - name: bodyView
        value: プレビューを開く.個人の上書き の section_fold が偽なら fold を false、それ以外は既定（fold は true）
      - name: focusAfterAdd
        value: プレビューを開くの個人の上書き.focus_after_add（無ければ auto）
      - name: pointerCoarse
        value: 'matchMedia("(pointer: coarse)") が当たるか'
    position: 本文
    description: 表示する種類を選ぶと、その場で個人の上書きとして端末の保存領域に残し、画面に当てる（サーバーへは送信しない）。開いている画面の種類を外したときは概要へ移し、履歴は置き換える。差分のミニマップを表示しないにすると個人の上書きとして残し、表示するに戻すと上書きを外して、開いている詳細パネル・詳細の全画面をその場で再描画する（履歴に積まない）。セクションの折りたたみは、既定と違う値にすると個人の上書きとして残し、既定と同じ値に戻すと上書きを外して、開いている詳細パネル・詳細の全画面をその場で再描画する（履歴に積まない）。区画「コメントの入力」の「レビューに追加した後のフォーカス」は、「入力欄へ戻す」「戻さない」を選ぶと個人の上書きとして残し、「自動」を選ぶと上書きを外す（再描画する画面は無く、履歴に積まない）。「既定に戻す」で個人の上書き（サーバーの配信で残した画面ごとの絞り込みの条件と、差分のミニマップと、セクションの折りたたみと、詳細で選んだレビュー中のコメントの並びと、「レビューに追加」の後のフォーカスを含む）を全て外す。開いている画面は画面の既定の条件で再描画する。「ワークスペースの既定にする」で『既定の保存の確認』を開く（差分のミニマップとセクションの折りたたみは保存する対象に含めない）
    io: 入力
    status: planned
  - name: 既定の変更の通知
    kind: label
    position: 画面の下（パネルを開いていなくても出す）
    description: '`role="status"`。書き換えの通知で再読み込みした記録の `settings.display` が前と違うとき、上書きを持たない項目に新しい既定を当て、画面の下に 6 秒出す。同じ知らせを時刻つきでパネルの `message` にも残す。自分が既定にした直後の知らせでは出さない'
    label: ワークスペースの既定が変わりました。
    io: 表示
    source: 書き換えの通知・記録の取得.settings.display
    visible_when: サーバーの配信で、他の人の保存・`update_settings`・設定の再読み込みで既定が変わってから 6 秒の間
    status: planned
  - name: 設定を編集する
    kind: button
    position: 本文 > 下端（見出し「ワークスペースの設定」と「題名・説明・関連する場所」の下）
    description: パネルを閉じて『設定の画面』を開く
    label: 設定を編集する
    visible_when: サーバーの配信で、差分の表示をしていないとき（配る書き出しでは出さない）
    action_ref: SCR-489-28#
    status: planned
  - name: グレーアウト
    kind: backdrop
    position: トップバーとタブの帯の下から画面の下端まで（パネルの後ろ）
    description: コメントの一覧のグレーアウトと同じ。押すとパネルを閉じ、押した操作は後ろの部品へ届けない
    visible_when: 幅 901px 以上
    status: planned
lead: 表示する種類と差分のミニマップと本文の表とセクションの見せ方を、この端末だけの個人の上書きとして変える。トップバーの表示の設定のボタンで開き、コメントの一覧と同じ左のパネルで見ている画面に重ねる。幅 900px 以下は画面の幅いっぱいに出す。コメントの一覧とは片方だけを開き、右の詳細パネルは開いたままにする。開いているかは URL の search params の `panel=display` に持つ（インターフェース定義『プレビューを開く』）。
notes:
  幅 900px 以下の重なり: 詳細パネルを開いたまま開いたときは詳細パネルの前に出し、後ろになった詳細パネルの部品を `inert` にする。閉じると開く前の詳細パネルが見える
  パネルの幅: コメントの一覧と同じ左のパネルの幅（幅 901px 以上）で開く。幅の区切りは持たない（画面設計『コメントの一覧』の補足「左のパネルの幅」）
test_file: tests/integration/preview/test_spa_display_settings_screen.py

id: SCR-489-9
title: レビュー中の書き込み
screen: frontend/src/features/comments/review/review-view.tsx
elements:
  - name: 戻る
    kind: button
    position: 見出し
    description: 開く前の画面（スレッドの一覧かスレッド）へ戻る（履歴に積まない）。開く前に見ていたまだ送信していない新規スレッドが、送信するか削除するかで無くなっていたら一覧へ戻る。入力欄にフォーカスが無いときの Esc も同じ。幅 901px 以上で詳細パネルを開いているときの Esc は詳細パネルを先に閉じる。幅 900px 以下の Esc は前に出ている側から閉じる
    label: 戻る
    action_ref: SCR-489-2#
    status: planned
  - name: 画面の見出し
    kind: heading
    position: 見出し
    description: 「レビュー中の書き込み」とレビュー中の書き込みの件数（削除した行を数えない）
    label: レビュー中の書き込み
    io: 表示
    source: レビュー中のコメントの読み取り.items の件数
    status: planned
  - name: すべて選ぶ
    kind: checkbox
    position: 送信する帯
    description: 送信できる書き込み（クローズのスレッドへの返信を除く）をまとめてチェックする・外す。一部だけをチェックしているときは横棒（`indeterminate`）。文字を持たず、読み上げの名前と `title` を「すべて選ぶ」にする
    io: 入力
    visible_when: 送信できる書き込みが 1 件以上
    status: planned
  - name: 選んだ件数
    kind: label
    position: 送信する帯
    description: 「{チェックした件数} / {送信できる書き込みの件数} 件」
    io: 表示
    visible_when: 送信できる書き込みが 1 件以上
    status: planned
  - name: まとめて送信する
    kind: button
    position: 送信する帯
    description: チェックした書き込みの ID を溜めた順に送信する。ラベルは「まとめて送信（{チェックした件数} 件）」。201 なら送信した行を外し、送信した新規スレッドはスレッドの一覧に、送信した返信はそのスレッドの書き込みに移し、コメントのボタンの件数を減らす。409 なら `stale` の行に理由を出し、どれも送信しない。送信してからレビュー中の書き込みとスレッドを読み直し終えるまでは押せず、1 秒を超えたらボタンの上に回るマーカーを出す（ボタンの幅は変えない）。送信する帯は画面の上端に留める
    label: まとめて送信（{件数} 件）
    visible_when: レビュー中の書き込みが 1 件以上
    enabled_when: チェックした書き込みが 1 件以上で、送信していない
    action_ref: IF-489-6#
    status: planned
  - name: 送信した結果
    kind: label
    position: 送信する帯の直下
    description: '`role="status"`。送信している間は回るマーカーと「送信しています」、送れて Claude Code へ入力できたら「{件数} 件を送信し、Claude Code に入力しました（{HH:mm}）。」、送信できたが入力できなかったら注意のマーカーと「{件数} 件を送信しましたが、Claude Code には入力できませんでした（{HH:mm}）。送信した内容は保存されていて、次に話し合いを始めたときに取り込まれます。」、409 は「送信できませんでした。送信できない書き込みが {件数} 件あります。」、届かないときは「送信できませんでした。サーバーが止まっています。再起動してから送信してください。」、そのほかのエラーは「送信できませんでした。{detail}」、チェックが 0 件のときは「送信する書き込みにチェックを付けてください。」。失敗と入力できなかったことはマーカーのアイコンと文言でも伝える'
    io: 表示
    visible_when: レビュー中の書き込みが 1 件以上か、まとめて送信した直後
    source: コメントをまとめて送信する.entered（送信できたときの文言の出し分け）
    status: planned
  - name: 書き込みの行
    kind: list
    position: 一覧
    description: レビュー中の書き込み（新規スレッドの最初の書き込みと、スレッドへの返信）を溜めた順（ID の連番の小さい順）に 1 件 1 行で並べる。各行にチェック・行の頭・箇所・本文・修正・削除を置く。スレッドの画面からこの画面を開いたときは、そのスレッドの書き込みの行を面と枠の全体で示す。一覧から開いた詳細パネルの項目の行も、開いている間だけ同じ見た目にする。幅 720px 以下では修正と削除を行の右上に重ね、行の頭を札の行と、2 行で省くタイトルの行に分ける（項目を指さない新規スレッドの行はタイトルの行を出さない）
    io: 表示
    source: レビュー中のコメントの読み取り.items
    status: planned
  - name: 行のチェック
    kind: checkbox
    position: 書き込みの行 > 左端
    description: まとめて送信するものを選ぶ。チェックの状態は画面だけが持ち、開いたときと新しく溜めた書き込みはチェックした状態で入る。クローズのスレッドへの返信は押せない（`disabled`）。読み上げの名前は、返信は「{スレッドの ID} への返信を送信する」、新規スレッドは「{向けた項目の ID} へのコメントを送信する」（項目を指さないものは「項目を指さないコメントを送信する」）
    io: 入力
    type: 真偽値
    enabled_when: 返信先のスレッドがオープン
    status: planned
  - name: 行の種類
    kind: label
    position: 書き込みの行 > 頭
    description: 「新規スレッド」か「返信」の札
    io: 表示
    status: planned
  - name: 向けた項目
    kind: button
    position: 書き込みの行 > 頭
    description: 新規スレッドの向けた項目の ID（等幅）とタイトル（1 行で末尾を省く）。押すと画面を開いたまま右にその項目の詳細パネルを開き、箇所があれば詳細パネルの「示す箇所」で示す。項目が消えたものは押せない ID だけを出す。項目を指さないものは何も出さず、行の頭を「新規スレッド」の札だけにする
    io: 表示
    visible_when: 項目を指す新規スレッドの行
    source: items[].target・items[].target_title
    action_ref: SCR-489-32#
    status: planned
  - name: 返信先のスレッド
    kind: button
    position: 書き込みの行 > 頭
    description: 返信先のスレッドの状態の札とタイトル（要約。無ければ最初の書き込みの先頭）。押すとそのスレッドを開く
    io: 表示
    visible_when: 返信の行
    source: スレッドの読み取り.threads[]（items[].thread の ID のもの）
    action_ref: SCR-489-4#
    status: planned
  - name: スレッドを開く
    kind: button
    position: 書き込みの行 > 本文の下
    description: まだ送信していない新規スレッドの画面を開く。「続きを表示」を出す行ではその後ろに並べる
    label: スレッドを開く
    visible_when: 新規スレッドの行
    action_ref: SCR-489-4#
    status: planned
  - name: 行の箇所
    kind: label
    position: 書き込みの行
    description: 箇所の名前（「本文 {行} 行目」かキーの見出し）と選んだ文の引用（3 行まで）
    io: 表示
    visible_when: 書き込みが箇所を持つ
    source: items[].loc
    status: planned
  - name: 行の本文
    kind: label
    position: 書き込みの行
    description: 書き込みの本文。スレッドの書き込みと同じく、改行を保って mdmark で Markdown として描く。折り返した後の見た目の行で 5 行を超える本文は、行の高さの 5 行分までを出してはみ出しを隠す（5 行以下の本文はそのまま）。開閉は行ごとに画面が覚え、再描画と本文の書き換えをまたいで保つ（パネルを閉じるまで）。項目の ID は文字のまま出す。記録にあるまとまりを指す `[文言](#diff=...)` は、スレッドの書き込みと同じ見た目の、`文言` だけのまとまりのリンクにする（描くものと文字のまま残すものはインターフェース定義『プレビューを開く』の制約『書き込みのまとまりのリンク』）。押すと、変更履歴でそのまとまりを選んだときと同じく差分の表示に切り替え、この画面は開いたままにする
    io: 表示
    source: items[].body・記録の取得.changes.sets のまとまりの ID と説明
    component: CMP-489-42#
    args:
      - name: id
        value: レビュー中のコメントの読み取り.items[].id
      - name: label
        value: 行の読み上げの名前の頭（「{スレッドの ID} への返信」「{向けた項目の ID} へのコメント」「項目を指さないコメント」）
      - name: body
        value: レビュー中のコメントの読み取り.items[].body
      - name: changeSets
        value: 記録の取得.changes.sets のまとまりの ID と説明
      - name: open
        value: 画面が行ごとに覚えた開閉（既定は畳む）
    status: planned
  - name: 修正
    kind: button
    position: 書き込みの行 > 操作
    description: 行の本文をその場で入力欄に切り替える。読み上げの名前は、返信は「{スレッドの ID} への返信を修正」、新規スレッドは「{向けた項目の ID} へのコメントを修正」（項目を指さないものは「項目を指さないコメントを修正」）、`title` は「修正」
    label: （鉛筆のアイコン）
    status: planned
  - name: 本文の書き換え
    kind: form
    position: 書き込みの行 > 本文
    description: 本文の入力欄と「キャンセル」「修正」。「修正」と入力欄の Ctrl+Enter（macOS は Cmd+Enter。変換の確定の Enter を除く）で `PATCH /w/{workspace}/api/comments/{id}` へ `body` を送信し、200 なら本文に戻す。空白だけは送信せず「コメントを入れてから修正してください。」、届かない・エラーのときは入力を残して理由を出す。「キャンセル」と Esc で書き換えを捨てる。入力欄は `aria-keyshortcuts` に Ctrl+Enter を持ち、「修正」の `title` は「修正（Ctrl+Enter）」。書き換えている行は、スレッドの画面と詳細パネルの書き換えと合わせて 1 行で、一方で書き換えを始めると他方の書き換えを捨てる
    io: 入力
    visible_when: 修正を押した行
    max_length: 10000
    action_ref: IF-489-22#
    status: planned
  - name: 削除
    kind: button
    position: 書き込みの行 > 操作
    description: '`DELETE /w/{workspace}/api/comments/{id}` で削除し、レビュー中の書き込みを読み直し終えるまでは「修正」「削除」を押せなくし（部品『スレッドの書き込み』の `busy`）、行を「コメントを削除しました。」と「元に戻す」に置き換える。確認のモーダルは挟まない。読み上げの名前は「修正」と同じ言い方で「…を削除」、`title` は「削除」'
    label: （ごみ箱のアイコン）
    action_ref: IF-489-21#
    status: planned
  - name: 元に戻す
    kind: button
    position: 書き込みの行（削除した行）
    description: 削除で返った中身を『レビュー中のコメントの追加』へ同じ `id` と `created` で送信し、元の場所に戻す。送信してから読み直し終えるまでは押せず、1 秒を超えたらボタンの上に回るマーカーを出す。パネルを閉じるか、まとめて送信するまで出す
    label: 元に戻す
    visible_when: パネルを開いている間に削除した行
    action_ref: IF-489-24#
    status: planned
  - name: 送信できない理由
    kind: label
    position: 書き込みの行
    description: マーカーのアイコンと「クローズのスレッドへの返信は送信できません。オープンに戻すと送信できます。」に、そのスレッドを開く「スレッドを開く」を添える（スレッドの画面の「オープンに戻す」へ移る入口）
    io: 表示
    visible_when: 返信先のスレッドがクローズ
    action_ref: SCR-489-4#
    status: planned
  - name: 箇所が合わない理由
    kind: label
    position: 書き込みの行
    description: '`role="alert"`。まとめて送信の 409 の `stale[].reason` をマーカーのアイコンと共に出し、行の枠の全体を要見直しの赤（`--st-review`）にする。箇所を外すか削除するまで、または次にまとめて送信するまで出す'
    io: 表示
    visible_when: 直前にまとめて送信したとき、その書き込みが `stale` にあった
    source: コメントをまとめて送信する.stale
    status: planned
  - name: 箇所を外す
    kind: button
    position: 書き込みの行 > 箇所が合わない理由
    description: '`PATCH /w/{workspace}/api/comments/{id}` へ `loc: null` を送信し、項目への書き込みにする。200 なら理由と行の箇所を削除する'
    label: 箇所を解除
    visible_when: 箇所が合わない理由を出していて、書き込みが箇所を持ち、向けた項目が記録にある
    action_ref: IF-489-22#
    status: planned
  - name: 空の状態
    kind: label
    position: 一覧
    description: マーカーと「レビュー中の書き込みはありません。」。送信する帯は出さない
    io: 表示
    visible_when: レビュー中の書き込みも削除した行も 0 件
    status: planned
  - name: 続きを表示
    kind: button
    position: 書き込みの行 > 本文の下
    description: 行の本文を開く・再度畳む（部品『本文の折りたたみ』が返す開閉のボタン）。畳んでいるときは下向きのアイコンと「続きを表示」、開いているときは上向きのアイコンと「折りたたむ」。新規スレッドの行は「スレッドを開く」と同じ行の先に置き、返信の行はこのボタンだけの行にする。収まらないときはボタンごと折り返し、ボタンの中の文字は折り返さない。読み上げの名前は「{行の読み上げの名前の頭}の続きを表示」「{行の読み上げの名前の頭}の本文を折りたたむ」
    label: 続きを表示 / 折りたたむ
    visible_when: 本文が折り返した後の見た目の行で 5 行を超え、本文を書き換えていない行
    action: その行の本文を開くか再度畳む（履歴に積まない）。折りたたんだときは行が画面から外れないように寄せる
    status: planned
  - name: 修正の音声入力
    kind: button
    position: 書き込みの行 > 本文の書き換え
    description: 「キャンセル」の左のマイクのボタンと、録音中の × の「キャンセル」・✓ の「文字起こし」・波形・経過の時間。見た目・読み上げ・押せないときの理由は、コメントの入力・返信の入力のマイクのボタンと同じ。文字起こしの結果は、設定の「文字起こし後の挙動」によらず入力欄のカーソルの位置へ挿入するだけにし、入力欄の下に「文字起こしの結果を挿入しました。」を出す（レビュー中への追加・送信はしない）。× は録音だけを捨て、修正の入力を開いたままにする。録音中・文字起こし中にほかの画面へ移っても続け、トップバーの音声入力中の表示からその行を修正の入力のまま再度開く（インターフェース定義『プレビューを開く』の制約「音声の入力」）
    label: （マイクのアイコン）
    io: 入力
    visible_when: 修正を押した行
    action_ref: IF-489-58#
lead: レビュー中の書き込み（新規スレッドの最初の書き込みと、スレッドへの返信）を溜めた順に並べ、チェックしたものだけをまとめて送信する。コメントの一覧のパネルの中で、見出しの帯の「レビュー中」から開く。見出しの帯（入口は出さない）・パネルの置き方・閉じ方はコメントの一覧と同じ。全てチェックした状態で開く。開いているかは URL の search params の `review` に持つ（インターフェース定義『プレビューを開く』）。
test_file: tests/integration/preview/test_spa_review_screen.py
refs:

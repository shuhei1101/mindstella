id: SCR-489-19
title: "検討事項"
elements:
  - name: トップバー
    kind: nav
    component: CMP-489-19#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: decisions
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: duplicateIds
        value: 書き換えの通知の duplicate_ids の ID と、記録の取得の項目の種類の名前（閉じた後は、集まりが変わるまで []）
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・削除する・元に戻す・まとめて送信の後に再描画する）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数（開いたときは既定の状態の条件で 1）
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
      - name: comments_unread
        value: 概要と同じ
      - name: pending
        value: 概要と同じ
      - name: pending_count
        value: 概要と同じ
      - name: pending_open
        value: 概要と同じ
      - name: pending_blocked
        value: 概要と同じ
      - name: voice
        value: 画面で 1 つの音声入力の状態（SPAを開く・プレビューを開く.音声の入力）。録音・文字起こし中だけ渡し、`label` は録音を始めた入力欄の名前。配る書き出しでは渡さない
      - name: voiceNotice
        value: 録音を破棄した（行き先の項目・スレッドが記録から無くなった）か、入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が失敗したときの理由。× か「入力欄を開く」で削除する
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: CMP-489-51#
    args:
      - name: views
        value: ボード・表
      - name: current
        value: プレビューを開く.view（既定 board。削除したマップの `map` はボード）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: 条件のチップ
    kind: list
    position: ツールバーの下
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで、列の文字の条件を `{列}に「{文字}」を含む` のチップ（英数字で終わる列名の後は空白を挟む）で並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・ボードを再描画する'
    io: 入力
    visible_when: 表示形式がボードで、値を 1 つ以上選んでいる条件があるとき
  - name: ボード
    kind: board
    description: 状態ごとの列に、絞り込みのドロワーの条件に合う検討事項をカードで並べる。状態の条件から外した状態の列も残し、列の中に「状態の条件で外しています。」と書く。ほかの 0 件の列は「検討事項はありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横にスクロールし、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む。列は最も長い列の高さまで伸ばし、列の見出しはボードを縦にスクロールしてもボードの上に留める。列の見出しは、画面の見出し（`h1`）の 1 段階下の見出し（`h2`）にする。カードを押すと詳細を開く
    io: 表示
    source: プレビューを開く.mindmap-data.decisions
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: CMP-489-47#
    args:
      - name: kind
        value: decisions
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・着手可否（ready、絞れる）・前提・タグ（絞れる）
      - name: rows
        value: プレビューを開く.mindmap-data.decisions
      - name: filters
        value: 絞り込みのドロワーの selected（ボードと共有）
      - name: marks
        value: 差分の表示の間、選んだ時点で追加した・変えた検討事項（記録の取得.changes）
      - name: comments
        value: サーバーにつながって開いたとき、検討事項の ID → その検討事項を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target）
    description: 検討事項の表。列「着手可否」は、`derived.ready` にある未決定は「着手可能」、それ以外の未決定は「前提待ち」、未決定以外は「なし」
    visible_when: 表示形式が表
  - name: ボードの差分のマーカー
    kind: label
    component: CMP-489-31#
    args:
      - name: kind
        value: 選んだ時点で追加した項目は new、変えた項目は changed（記録の取得.changes）
    description: ボードのカードで、タイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で追加されたか変わったとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: CMP-489-45#
    position: タブの帯の下から左に重ねる
    description: トップバーの絞り込みのボタンで開閉する。値の条件より上に、文字で絞れる列（値を選ぶ条件にしない、数でない列）の「文字を含む」の欄を並べる（部品設計『絞り込み』の `texts`）。ボード・表で 1 つの条件を共有し、表示形式を切り替えても保つ。開いている間、トップバーとタブの帯とドロワー以外をコメントの一覧と同じくグレーアウトして `inert` にし（右側の結果は透けて見える）、グレーアウトした所を押すと閉じる。コメントの一覧とは同時に開かない（どちらかを開くと他方を閉じる）。条件を変えると、開いたままボード・表を再描画する。幅 900px 以下で詳細パネルを開いたまま開いたときは詳細パネルの前に出し、Esc はドロワーを先に閉じる。閉じると開く前の詳細パネルが見える
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: 状態で要見直し・未決定・未整理・保留を選んだ状態。サーバーの配信でこの画面の残した条件があれば既定に代えてその条件（今の記録に無い値は外す）。URL のハッシュに `f.{列}` があるときは既定に代えてその条件だけで開き、残した条件を書き換えない
    args:
      - name: groups
        value: 状態（status。マーカーは status）・タグ（tags）・着手可否（ready）。検討事項は種類（`kind`）を持たないので種類の条件を出さない
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: プレビューを開く.mindmap-data.decisions の件数
      - name: shown
        value: 条件に合う検討事項の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。表・ボードは幅 721px 以上で、この領域の高さいっぱいに広げて中で縦・横にスクロールする。それより狭い幅では、この領域ごと縦にスクロールする
    visible_when: 常時
  - name: ボードのコメントのマーカー
    kind: label
    component: CMP-489-9#
    args:
      - name: count
        value: その検討事項を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    description: ボードのカードでは 2 行目（メタ情報の並び）の右端に置く。コメントを溜める・修正する・削除する・戻す・送信すると、スクロールの位置を動かさずにマーカーだけを描き替える。マーカーだけを押す操作は持たず、カード・行を押すと今と同じく詳細パネルを開く
    io: 表示
    visible_when: サーバーにつながって開いていて、その検討事項を指すレビュー中のコメントが 1 件以上あるとき
  - name: 削除した項目の帯
    kind: list
    component: CMP-489-43#
    args:
      - name: items
        value: 選んだ時点で削除した項目（記録の取得.changes の removed）のうち、種類が decision のものの id・title を ID の順に並べたもの。合わせた範囲で追加して削除した項目も含む
    position: ツールバー・条件のチップの下、ボード・表の上
    description: 選んだ時点で削除した検討事項を並べる。表示形式と絞り込みの条件によらず同じ帯を出す。項目は押せず、詳細パネルを開かない
    io: 表示
    source: 記録の取得.changes
    visible_when: 差分の表示の間で、選んだ時点で検討事項を 1 件以上消したとき
    status: implemented
  - name: 項目を追加
    kind: button
    position: 表示形式の切り替えの帯 > 右端
    description: 検討事項の項目を追加する入力を、詳細パネルと同じ置き方で開く（開いていた詳細パネルは閉じる）。タイトルを書いて入力欄を離れたときに `item-add` を 1 件溜め、残りのキーと案は、返った仮の ID で同じ `item-add` の `value` を書き換えて溜める（1 件のまま）。幅 480px 以下は「＋」の記号だけにし、文字を読み上げに残す
    label: 項目追加
    visible_when: サーバーの配信で、差分の表示をしていないとき（配る書き出しでは出さない）
    action_ref: SCR-489-31#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
  - name: 一覧の保存待ちのマーカー
    kind: label
    component: CMP-489-21#
    args:
      - name: kind
        value: その項目の削除を溜めていれば remove、直前の保存で書き込めなかった編集を持てば blocked、それ以外は pending
    position: ボードのカード・表の行のタイトルの後ろ（レビュー中のコメントのマーカーの左）
    description: 保存待ちの編集がある項目にマーカーを付け、削除を溜めた項目はタイトルに取り消し線を引く。保存待ちが変わるたびに再設定する
    io: 表示
    visible_when: その項目に保存待ちの編集が 1 件以上あり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（target がその項目のもの）
    status: planned
    introduced:
      pr: 325
  - name: 追加する項目
    kind: list
    position: ボード・表の先頭
    description: 溜めた `item-add` の項目を、ボードは状態の列（溜めた状態か、無ければ「未整理」）の先頭、表は先頭の行に出す（カードは破線の枠にする）。ID は保存で決まるため出さず、ID の場所に「ID は保存時に決定」（表は「—」）を置き、タイトルが空なら「（タイトル未入力）」と出す。保存待ちのマーカー（直前の保存で書き込めなかったときは blocked、それ以外は pending）を付け、押すと追加する入力を再度開く
    io: 表示
    visible_when: 開いている種類の `item-add` が保存待ちにあり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（op が item-add で key が開いている種類）
    action_ref: SCR-489-31#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
lead: 検討事項をボード（既定）・表で見る画面。
mock: docs/mock/pages/decisions/542/standard/index.html
test_file: tests/integration/preview/test_decisions_screen.py
notes:
  コメントのマーカーのモック: コメントのマーカーの見本は `docs/mock/pages/decisions/121/standard/index.html`
  削除した項目のモック: 削除した項目の帯の見本は `docs/mock/pages/decisions/179/b-band/index.html`

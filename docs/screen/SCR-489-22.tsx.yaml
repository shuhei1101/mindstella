id: SCR-489-22
title: 概要
screen: frontend/src/features/overview/overview/overview-screen.tsx
lead: プレビューを開いたときの既定の画面。未読の AI の書き込み・未決定の検討事項・要見直しの検討事項・確認中の資料のタイルを並べる。
test_file: tests/integration/preview/test_spa_overview_screen.py
elements:
  - name: トップバー
    kind: nav
    component: CMP-489-20#
    args:
      - name: title
        value: 記録の取得.settings.summary
      - name: tabs
        value: 概要と、表示する種類（個人の上書きか、無ければ記録の取得.settings.display.visible_kinds、それも無ければ全ての種類）の検討事項・タスク・調査・資料・用語集・メモ・会話ログ（件数は記録の取得.{種類} の件数）
      - name: current
        value: overview
      - name: theme
        value: 個人の上書き（端末の保存領域）の値（無ければ OS の設定）
      - name: connection
        value: サーバーの配信で、`GET /api/events` のつながりが切れている間と `GET /api/records` に届かないときは offline、それ以外と配る書き出しは online（SPAを開く.接続の状態）
      - name: duplicateIds
        value: 書き換えの通知の duplicate_ids の ID と、記録の取得の項目の種類の名前（閉じた後は、集まりが変わるまで []）
      - name: readAt
        value: 記録の取得.built_at（最後に読めた記録）
      - name: diffPoint
        value: 変更履歴で選んだ時点の名前と日時（SPAを開く.diff。選んでいなければ渡さない）。`tabs[].marked` はその時点でマーカーの付く項目か削除した項目を持つ種類
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: commentCount
        value: レビュー中のコメントの読み取り.items の件数（溜める・削除する・元に戻す・まとめて送信の後に再描画する）
      - name: commentsOpen
        value: コメントの一覧を開いているか
      - name: settingsOpen
        value: 表示の設定のパネルを開いているか
      - name: commentsUnread
        value: スレッドの読み取り.threads のうち `status` が `open` で `posts[].seen` が `false` の書き込みを持つものが 1 件以上あるとき true（コメントの一覧を閉じていても、画面を開いたときと書き換えの通知で再読み込みする）
      - name: pending
        value: サーバーの配信では true、配る書き出しでは false
      - name: pendingCount
        value: 保存待ちの編集の読み取り.items の件数（溜める・取り消す・まとめて保存するの後に再描画する）
      - name: pendingOpen
        value: 保存待ちのパネルを開いているか
      - name: pendingBlocked
        value: 直前の保存が 409 で、保存待ちの編集の読み取り.items に `blocked` に挙がった編集が残っているとき true
      - name: voice
        value: 画面で 1 つの音声入力の状態（SPAを開く・プレビューを開く.音声の入力）。録音・文字起こし中だけ渡し、`label` は録音を始めた入力欄の名前。配る書き出しでは渡さない
      - name: voiceNotice
        value: 録音を破棄した（行き先の項目・スレッドが記録から無くなった）か、入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が失敗したときの理由。× か「入力欄を開く」で削除する
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 要見直し
    id: tile-review
    kind: list
    description: 状態が要見直しの検討事項の件数と名前。押すと詳細パネル（`?tab={種類}&id={ID}`）を開く。「すべて表示」で検討事項の表を状態 = 要見直しで絞って開く。表示する種類に検討事項が無いときは「すべて表示」だけを外し、タイルは残す
    io: 表示
    source: 記録の取得.decisions
    visible_when: 常時（0 件のときは「要見直しの検討事項はありません。」）
  - name: 話し合いの概要
    id: overview-description
    kind: label
    description: 題名の上に、設定の話し合いの概要（1 文の短い文）を出す。読める幅（46em）で折り返す
    io: 表示
    type: 文字列
    visible_when: 設定が話し合いの概要を持つとき（無ければ行を出さない）
    source: 記録の取得.settings.description
  - name: タイルの項目の差分のマーカー
    kind: label
    component: CMP-489-31#
    args:
      - name: kind
        value: 選んだ時点で追加した項目は new、変えた項目は changed（記録の取得.changes）
    description: 未読の AI の書き込み以外のタイル（未決定・要見直し・確認中の資料）の各行で、項目のタイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で追加されたか変わったとき
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。タイルはこの領域の中で縦にスクロールする
    visible_when: 常時
  - name: 未読の AI の書き込み
    id: tile-unread
    kind: list
    description: 状態がオープンで、利用者が読んでいない AI の書き込み（`posts[].seen` が偽）を持つスレッドの件数と、スレッドごとの ID・要約・最後の未読の書き込みの日時を、新しい順にタイルの枠に収まるだけ並べる。押すとコメントの一覧でそのスレッドを開く（`?panel=comments&thread={ID}`）。「すべて表示」でコメントの一覧を開く（`?panel=comments`。未読のスレッドの行に未読の札が出る）
    io: 表示
    source: スレッドの読み取り.threads
    visible_when: 常時（0 件のときは「未読の AI の書き込みはありません。」）
  - name: 未決定の検討事項
    id: tile-open
    kind: list
    description: 状態が未決定の検討事項の件数と名前を ID の順に、タイルの枠に収まるだけ並べる。押すと詳細パネル（`?tab=decisions&id={ID}`）を開く。「すべて表示」で検討事項の表を状態 = 未決定で絞って開く（`?tab=decisions&view=table&f.status=未決定`）。表示する種類に検討事項が無いときは「すべて表示」だけを外し、タイルは残す
    io: 表示
    source: 記録の取得.decisions
    visible_when: 常時（0 件のときは「未決定の検討事項はありません。」）
  - name: 確認中の資料
    id: tile-docs
    kind: list
    description: 状態が確認中の資料の件数と名前。押すと詳細パネル（`?tab=docs&id={ID}`）を開く。「すべて表示」で資料を状態 = 確認中で絞って開く（`?tab=docs&f.status=確認中`）。表示する種類に資料が無いときは「すべて表示」だけを外し、タイルは残す
    io: 表示
    source: 記録の取得.docs
    visible_when: 常時（0 件のときは「確認中の資料はありません。」で、「すべて表示」を出さない）
refs:
  - SCR-489-21#
  - IF-489-70#
notes:
  画面への移り方: '概要からの操作は、全て SPA の中で移る。


    | 操作 | 開く先 |

    | --- | --- |

    | 未読の AI の書き込みの行と「すべて表示」 | SPA のコメントの一覧（`?panel=comments`。行は `&thread={ID}`） |

    | ほかの「すべて表示」 | SPA の同じ条件の search（`?tab={種類}&view={表示形式}&f.{列}={値}`） |

    | タイルの項目の押下 | SPA の詳細パネル（`?tab={種類}&id={ID}`） |

    | トップバーのタブ（`onNavigate(key)`） | SPA の `?tab={key}` |

    | トップバーの変更履歴・保存待ち・コメント・表示の設定（`onOpenHistory`・`onTogglePending`・`onToggleComments`・`onToggleSettings`） | SPA の中で開く |

    | トップバーの検索（`onOpenSearch`） | SPA の全体の検索（`?search=1`） |

    | トップバーのライト / ダーク（`onThemeChange`） | SPA の中で切り替え、今の画面と同じ端末の保存領域に残す |'

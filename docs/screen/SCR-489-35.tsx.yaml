id: SCR-489-35
title: ネットワーク
screen: frontend/src/features/graph/graph/graph-screen.tsx
elements:
  - name: トップバー
    kind: nav
    component: CMP-489-20#
    args:
      - name: title
        value: 記録の取得.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: graph
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: readAt
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: commentCount
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: commentsOpen
        value: コメントの一覧を開いているか
      - name: settingsOpen
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filterCount
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数
      - name: filterOpen
        value: 絞り込みのドロワーを開いているか
      - name: commentsUnread
        value: 概要と同じ
      - name: pending
        value: 概要と同じ
      - name: pendingCount
        value: 概要と同じ
      - name: pendingOpen
        value: 概要と同じ
      - name: pendingBlocked
        value: 概要と同じ
      - name: voice
        value: 画面で 1 つの音声入力の状態（SPAを開く・プレビューを開く.音声の入力）。録音・文字起こし中だけ渡し、`label` は録音を始めた入力欄の名前。配る書き出しでは渡さない
      - name: voiceNotice
        value: 録音を破棄した（行き先の項目・スレッドが記録から無くなった）か、入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が失敗したときの理由。× か「入力欄を開く」で消す
    description: 全ての画面で共通の帯。タブの帯の右端のネットワークの入口を選んだ状態で出す
    visible_when: 常時
    status: planned
  - name: 条件のチップ
    kind: list
    position: タブの帯の下、3D のキャンバスの上
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（検討事項の条件のチップと同じ行）。解除するとドロワー・バッジ・3D のキャンバスを描き直し、URL の `f.{列}` を置き換える'
    io: 入力
    visible_when: 値を 1 つ以上選んでいる条件があるとき
    status: planned
  - name: 3D のキャンバス
    id: graph-canvas
    kind: canvas
    description: '画面設計『ネットワーク』の 3D のキャンバスと同じ。絞り込みのドロワーの条件に合う項目を星、その間の関連（依存・関連・根拠・進めるタスク）を線で、ライブラリを使わずに透視で描く。5 つの見た目（`glow`・`starlight`・`constellation`・`deep`・`dust`）とライト / ダークの描き分け、回転・ホイールでの寄り・背景のダブルクリックで戻る・慣性・自動の回転・またたき・広がる輪・線を流れる光、`prefers-reduced-motion: reduce` のときに止めるもの、カーソルを乗せたときに寄る玉、注目の起点への寄りと強調を、今の画面と同じ値で描く。毎コマの描画は React の描き直しと分け、記録・条件・注目の起点が変わったときだけ玉と線を作り直す（見た目とライト / ダークの変更では作り直さず、次のコマから当てる）。玉を押すと「ロックの操作」の規則で詳細を開く'
    io: 表示
    source: SPAを開く.記録の取得（7 種類の項目と `depends_on`・`related`・`sources`・`for`）。見た目は個人の上書きか、無ければ記録の取得.settings.display.network_look、それも無ければ `deep`
    visible_when: 常時
    initial_value: URL の search params に `id` があるときは、その項目を選んだ項目として開く（項目を開いたままタブの帯で移ってきたときを含む。『SPAを開く』の制約「画面の移動と項目」）
    status: planned
  - name: 見た目のドロップダウン
    kind: select
    position: 3D のキャンバスの右上に重ねる
    description: ネットワークの見た目を 5 つから選ぶ。shadcn/ui の Select で描き、アイコンは付けない。選択肢はグロウ・星の光・星図・深宇宙・星屑の順で、ワークスペースの既定の見た目に「（既定）」を添える。どの地の上でも読めるよう面の色で塗り、狭い幅でも同じ大きさで右上に置く。読み上げの名前は「ネットワークの見た目」。見た目はここだけで選び、表示の設定のパネルには置かない
    io: 入力
    type: 列挙（glow・starlight・constellation・deep・dust）
    visible_when: 常時
    initial_value: 個人の上書きの見た目。無ければワークスペースの既定（記録の取得.settings.display.network_look、無ければ `deep`）
    source: 個人の上書き.network_look（『SPAを開く』の制約「端末の保存領域」）・記録の取得.settings.display.network_look
    action: 選ぶと個人の上書きとして今の画面と同じ端末の保存領域のキーに残し（サーバーへは送らない）、玉と線を作り直さずに次のコマからその見た目で描く。視点・選んだ項目・ロックは変えない。表示の設定のパネルの「この端末で変えている項目」に「ネットワークの見た目」を出す
    status: planned
  - name: 状態の印
    kind: label
    position: 3D のキャンバスの中。玉の名前の左
    description: 画面設計『ネットワーク』の状態の印と同じ。一覧と同じ状態の印を名前の左に描き、資料の成果物は箱の印にする。大きさは名前の文字の高さの 8 割で、名前と同じ遠近と濃さにする
    io: 表示
    visible_when: 注目しているとき（選んだ・ロックした）だけ、注目の起点とそれにつながる項目に出す。名前が消える距離では印も消す
    source: 記録の取得の各項目の `status` と資料の成果物の印
    status: planned
  - name: 鍵
    kind: label
    position: 3D のキャンバスの中。玉の名前のすぐ右（名前が出ない遠い距離では、玉の右上の札の中）
    description: 画面設計『ネットワーク』の鍵と同じ。閉じた鍵はロックした項目に、開いた鍵はロックしていないときに詳細を開いている項目に出し、名前とコメントの印の間に置く。押しても何も起きない。外れない操作をされたときの震え（赤く光らせて大きくし、上を軸に左右へ振れさせて約 1 秒で収める）は、モジュール構成『プレビュー / lock』の震えの量を毎コマ当て、描き直しても途切れさせず、`prefers-reduced-motion` でも止めない
    io: 表示
    visible_when: 閉じた鍵はロック中いつも（詳細を閉じても、ほかの項目へ移っても、タブを行き来しても残す）。開いた鍵はロックしていないとき、詳細を開いている項目の玉にカーソルを乗せたときだけ。幅 900px 以下では出さない
    status: planned
  - name: ロックの操作
    kind: gesture
    position: 3D のキャンバスの上
    description: 注目の起点を 1 つの項目に留める。押したときの規則・前に押してから 450ms 未満・24px 未満の 2 回目の扱い・鍵を震わせる場面は、画面設計『ネットワーク』の「ロックの操作」と同じにし、判定はモジュール構成『プレビュー / lock』を使う。ロックはページを開いている間だけ保ち、タブを行き来しても残す。検討事項のマップのロックとは別々に持つ（『SPAを開く』の制約「ネットワークのロック」）
    io: 入力
    visible_when: 幅 901px 以上。幅 900px 以下では詳細が全面に出るためロックしない
    action: 詳細を開く・切り替えるときは URL の `id` を書き換え（履歴は『SPAを開く』の制約「履歴」のとおり）、余白を押して全体の表示へ戻るときは `id` を外す
    status: planned
  - name: 条件に合う項目が無い旨
    kind: label
    position: 3D のキャンバスの枠の中央
    description: 絞り込みの条件に合う項目が無いときに、条件のせいで空だと伝える文（どの幅でも出す）
    label: 表示する項目はありません。
    io: 表示
    visible_when: 絞り込みの条件に合う項目が 1 件も無いとき
    status: planned
  - name: 絞り込みのドロワー
    kind: dialog
    component: CMP-489-46#
    position: タブの帯の下から左に重ねる
    description: 画面設計『検討事項.tsx』の絞り込みのドロワーと同じ出し方で、描く玉を選ぶ。条件を変えると玉と線を作り直し、URL の `f.{列}` を置き換える（履歴に積まない）
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: どの値も選んでいない（全ての玉を描く）。サーバーの配信でこの画面の残した条件があればその条件（今の記録に無い値は外す）。URL の search params に `f.{列}` があるときはその条件で開き、残した条件をその条件に書き換える（『SPAを開く』の制約「保存した絞り込みの条件」）
    args:
      - name: groups
        value: 種類（type。項目の種類の検討事項・タスク・調査・資料・用語集・メモ・会話ログ。印は kind）・状態（status。検討事項・タスク・資料の状態。印は status。状態を持たない種類の玉は、状態の値を選ぶと外れる）・タグ（tags）
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと条件のチップで変えた条件
      - name: total
        value: 7 種類の項目の件数
      - name: shown
        value: 条件に合う項目の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
    status: planned
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。3D のキャンバスはこの領域の高さいっぱいに広げる
    visible_when: 常時
    status: planned
  - name: 名前の横のコメントの印
    kind: label
    component: CMP-489-10#
    args:
      - name: count
        value: その項目を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    position: 3D のキャンバスの上に重ねる層
    description: 画面設計『ネットワーク』の名前の横のコメントの印と同じ。玉の上に出る名前の右に続け（鍵を出しているときは名前・鍵・コメントの印の順）、玉に付いて動かす。手前の玉の印ほど上に重ね、名前と同じ遠近・濃さにし、重なり順は描く枠の中に閉じて詳細パネルより上に出さない。コメントを溜める・直す・消す・戻す・送ると、視点を動かさずに印だけを描き替える。印だけを押す操作は持たない
    io: 表示
    visible_when: サーバーにつながって開いていて、その項目を指すレビュー中のコメントが 1 件以上あり、玉の名前が読める大きさ（文字 8px 以上）で描かれ、名前と印が描く枠に収まるとき
    status: planned
  - name: ロックのキー操作
    kind: shortcut
    position: ネットワークの画面
    description: 画面設計『ネットワーク』の「ロックのキー操作」と同じ。`L` を押すと、詳細を開いている項目の玉をもう一度押したのと同じ規則でロックを付け外しする。詳細を開いていないとき、修飾キー付き・入力欄にフォーカスがあるとき・変換中・重ねる面（ダイアログ・ポップオーバー・全体の検索）を開いているときは受けない。3D のキャンバスの読み上げの説明に「L キーで、詳細を開いている項目をロック・解除」を添える
    io: 入力
    visible_when: ネットワークの画面を開いていて、幅 901px 以上
    reason: 非機能要件の入力方式（全ての操作にキーボードで届く）を満たすため
    status: planned
lead: React のプレビューのネットワーク。今のネットワークと同じ要素と操作を持ち、URL の search params の `tab=graph` で開く（インターフェース定義『SPAを開く』）。

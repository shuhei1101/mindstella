id: SCR-489-2
title: コメントの一覧
screen: frontend/src/features/comments/comments-panel/comments-panel.tsx
elements:
  - name: パネルの見出し
    kind: heading
    position: 見出しの帯
    description: 「コメント」。スレッド・レビュー中の書き込みの画面でも同じ帯を出す
    label: コメント
    io: 表示
    status: planned
  - name: レビュー中の入口
    kind: button
    position: 見出しの帯 > 右
    description: 「レビュー中」とレビュー中の書き込みの件数（トップバーのコメントのボタンと同じ丸い札）。押すとパネルの中をレビュー中の書き込みの画面に切り替える（履歴に積まない）。スレッドの画面でも同じ場所に出し、レビュー中の書き込みの画面では出さない。0 件のときも出し、件数の塗りを外す。読み上げの名前は「レビュー中の書き込みを確かめる（{件数} 件）」
    label: レビュー中（{件数}）
    visible_when: レビュー中の書き込みの画面を開いていない
    source: レビュー中のコメントの読み取り.items の件数
    action_ref: SCR-489-9#
    status: planned
  - name: 一覧を閉じる
    kind: button
    position: 見出しの帯 > 右端
    description: パネルを閉じ、重ねていた画面に戻る（履歴に積まない）。トップバーのコメントのボタンでも閉じ、スレッドの一覧では Esc でも閉じる。幅 901px 以上で詳細パネルを開いているときの Esc は詳細パネルを先に閉じる。幅 900px 以下の Esc は前に出ている側から閉じる。ピン止めしていなければ、グレーアウトした所を押しても閉じる。次に開くときは、閉じる前のパネルの中の画面（スレッドの一覧・スレッド・レビュー中の書き込み）と開いていたスレッド、スクロールの位置に戻す（ページを開いている間）。読み上げの名前は「コメントの一覧を閉じる」
    status: planned
  - name: 状態の絞り込み
    kind: segment
    position: 絞り込みの帯
    description: 「オープン」「クローズ」「すべて」を、それぞれの件数（タグ・項目で絞っていれば、絞った後のスレッドの件数）つきで並べる。押した状態を `aria-pressed` で持ち、グループの読み上げの名前は「スレッドの状態で絞る」。パネルを開いている間はスレッドの画面との行き来をまたいで保つ
    io: 入力
    initial_value: オープン
    options: オープン・クローズ・すべての 1 つ
    status: planned
  - name: タグの絞り込み
    kind: chip
    position: 絞り込みの帯 > 状態の絞り込みの下
    description: '# のマーカーと絞っているタグ、外す ×（読み上げの名前「タグ「{タグ}」の絞り込みを外す」）と「{残った件数} / {状態・項目で絞った件数} 件」。スレッドの行のタグを押すとそのタグで絞り、同じタグを再度押すか × で外す。タグは 1 つだけで絞る'
    io: 表示
    visible_when: タグで絞っている
    status: planned
  - name: スレッドの行
    kind: list
    component: CMP-489-14#
    args:
      - name: thread
        value: スレッドの読み取り.threads[] の 1 件
      - name: pending
        value: レビュー中のコメントの読み取り.items のうち thread を持たない 1 件
      - name: hasPendingReply
        value: レビュー中のコメントの読み取り.items にそのスレッドへの返信があるとき true
      - name: activeTag
        value: タグの絞り込みのタグ
    position: 一覧
    description: 状態・タグ・項目で絞ったスレッドを最後の書き込みの新しい順に並べる。項目で絞るときは、向けた項目がその項目のスレッドだけにする。状態の絞り込みがクローズでなく、タグで絞っていないときは、まだ送信していない新規スレッド（項目で絞っていればその項目へのものだけ）を溜めた順に先頭へ並べる。行を押すとパネルの中をそのスレッドの画面に切り替える（履歴に積まない）。書き換えの通知が届いたらスレッドを再読み込みして再描画する（スクロールの位置と絞り込みは保つ）。クローズにしたスレッドは、絞り込みがオープンなら一覧へ戻ったときに外れる。`seen` が `false` の書き込みを持つスレッドの行には未読の札が出る（クローズの行でも出る）
    io: 表示
    source: スレッドの読み取り.threads
    action_ref: SCR-489-4#
    status: planned
  - name: 空の状態
    kind: label
    position: 一覧
    description: マーカーと、絞り込みを含めた文言（「オープンのスレッドはありません。」「クローズのスレッドはありません。」「スレッドはありません。」。タグで絞っていれば頭に「タグ「{タグ}」の」を、項目で絞っていればさらにその前に「{ID} への」を付ける）
    io: 表示
    visible_when: 並べる行が 0 件
    status: planned
  - name: 読めない理由
    kind: label
    position: 一覧
    description: '`role="alert"`。スレッドを読めなかったとき、マーカーのアイコンと「スレッドを読めませんでした。」に、届かないときは「サーバーが止まっています。再起動してから開いてください。」、422 は `detail` を続ける。まだ送信していない新規スレッドは並べる。次に読めたら削除する'
    io: 表示
    visible_when: 直前のスレッドの読み取りが 200 以外か届かなかった
    source: スレッドの読み取りのエラーの detail
    status: planned
  - name: 新規スレッド
    kind: button
    position: 下端
    description: 押すと同じ場所に新規スレッドの入力を出し、入力欄へフォーカスを移す
    label: 新規スレッド
    visible_when: 新規スレッドの入力を出していない
    status: planned
  - name: 新規スレッドの入力を閉じる
    kind: button
    position: 下端 > 新規スレッドの入力の見出し
    description: 見出し「新規スレッド」の右の ×。入力を畳んで「新規スレッド」に戻し、下書きは残す。読み上げの名前は「新規スレッドの入力を閉じる」
    visible_when: 新規スレッドの入力を出している
    status: planned
  - name: 新規スレッドの入力
    kind: form
    component: CMP-489-8#
    args:
      - name: body
        value: レビュー中のコメントの読み取り.drafts のうち target も thread も持たない下書き
      - name: status
        value: レビュー中のコメントの追加（POST /w/{workspace}/api/comments）の結果。音声入力では、既定の挙動でレビュー中のコメントの追加をした結果（reviewed）・書き込みをすぐ送信するの結果（sent）・入力欄へ挿入した（inserted）・録音と文字起こしと送信の失敗（voice-failed）
      - name: count
        value: レビュー中のコメントの追加.count
      - name: detail
        value: レビュー中のコメントの追加のエラーの detail
      - name: collapsed
        value: 'false'
      - name: label
        value: 新規スレッド
      - name: voice
        value: 文字起こしの可否（GET /w/{workspace}/api/transcription）の available と、ブラウザが navigator.mediaDevices.getUserMedia を持つか、録音・文字起こしの進み（画面で 1 つの音声入力の状態）から決める。使えないときと、ほかの入力欄で録音・文字起こし中のときは disabled
      - name: voiceReason
        value: 文字起こしの可否.detail（ブラウザがマイクを使えないときは画面が持つ文「このページではマイクを使用できません。HTTPS か localhost の URL で開いてください。」、ほかの入力欄で音声入力中のときは「ほかの入力欄で音声入力中のため、音声で入力できません。」）
      - name: elapsed
        value: 録音を始めてからの秒数（画面が 1 秒ごとに進める）
      - name: levels
        value: 録音中のマイクの音量（画面が AnalyserNode で一定の間隔ごとに取って追加する）
      - name: entered
        value: 書き込みをすぐ送信する（POST /w/{workspace}/api/comments/send-now）の entered
    position: 下端
    description: 見出し「新規スレッド」の下に、項目を指さない新規スレッドの最初の書き込みを溜める入力を出す（`target` を渡さない）。項目で絞っている間は、見出しを「{ID} への新規スレッド」にし、絞っている項目への箇所を持たない書き込みを溜める（`target` にその項目の ID。下書きは詳細パネルの下端のその項目への入力と同じ drafts を使う）。入口のボタンの文言は「新規スレッド」のまま。溜めてレビュー中の書き込みを読み直し終えたら（読み直し終えるまでは部品『コメントの入力』の `saving`）入力欄を空にし、まだ送信していない新規スレッドとして一覧の先頭に追加し、コメントのボタンと「レビュー中」の入口の件数を再描画する（この画面に留まる）。溜めた後のフォーカスは『プレビューを開く』の制約「「レビューに追加」の後のフォーカス」に従い、入力欄か「レビューに追加」のボタンへ移す
    io: 入力
    visible_when: 「新規スレッド」を押した後
    target: レビュー中のコメントの追加.body
    action_ref: IF-489-24#
    status: planned
  - name: ピン止め
    kind: button
    position: 見出しの帯 > 一覧を閉じるの左
    description: 錠のアイコンだけのボタン。押すとピン止めを切り替え、押した状態を `aria-pressed` と、閉じた錠のアイコン（`lock`）のアクセントの色で示す（押していない間は開いた錠のアイコン `unlock`）。ピン止めの間はグレーアウトせず、外側を押しても閉じない。状態は端末の保存領域に残し、次に開いたときも当てる。スレッド・レビュー中の書き込みの画面でも同じ場所に出す。読み上げの名前は、押していないとき「ピン止めする（外側を押しても閉じない）」、押しているとき「ピン止めを外す（外側を押したら閉じる）」
    io: 入力
    initial_value: 押していない（端末の保存領域に残した状態があればその状態）
    status: planned
  - name: グレーアウト
    kind: backdrop
    position: トップバーとタブの帯の下から画面の下端まで（パネルの後ろ）
    description: パネル以外を、ほかのモーダルと同じ濃さ（`--scrim`）で覆い、後ろの画面は透けて見える。押すとパネルを閉じ、押した操作は後ろの部品へ届けない。パネルの中（スレッドの向けた項目・書き込みの項目の ID など）から開いた詳細パネルはグレーアウトの上に出し、パネルと詳細パネルの両方を操作できる。幅 900px 以下はパネルが画面の幅いっぱいに出るため出さない
    visible_when: 幅 901px 以上で、ピン止めしていない
    status: planned
  - name: 項目の絞り込み
    kind: chip
    position: 絞り込みの帯 > 状態の絞り込みの下（タグの絞り込みの上）
    description: コメントのアイコンと、絞っている項目の ID（等幅）とタイトル（1 行に収まらない分は省略）、外す ×（読み上げの名前「項目「{ID}」の絞り込みを外す」）。件数は出さない（状態の絞り込みが項目で絞った後の件数を出す）。詳細パネルのコメントの一覧のボタンで絞り、× で外す（`ttarget` を外し、履歴に積まない）。外しても状態・タグの絞り込みは保つ。トップバーのコメントのボタンで開くときは絞らない。パネルを開いている間は、詳細パネルで別の項目へ移っても絞る項目を変えない
    io: 表示
    visible_when: 項目で絞っている（search params に `ttarget` がある）
    source: search params の `ttarget` と、その項目のタイトル
    status: planned
  - name: パネル
    kind: dialog
    position: トップバーとタブの帯の下から画面の下端まで、左端
    description: 見出しの帯・絞り込みの帯・一覧・下端を縦に並べる。トップバーとタブの帯を覆わず、開いている間もトップバーのボタンを押せる。幅 901px 以上は幅 384px、幅 900px 以下は画面の幅いっぱいで、どちらも上端はトップバーとタブの帯の下端にする。読み上げの名前は「コメント」で、ピン止めしていない間はモーダルのダイアログにする
    visible_when: search params に `panel=comments` がある
    status: planned
lead: スレッドを状態・タグ・項目で絞って並べ、新規スレッドの作成。トップバーのコメントのボタンか、詳細パネルのコメントの一覧のボタン（開いている項目で絞る）で開き、見ている画面に重ねて左から出すパネル。パネルの中をスレッド・レビュー中の書き込みの画面と切り替える。開いている間、トップバーとタブの帯とパネル以外をグレーアウトし、`inert` にする（ピン止めの間はグレーアウトせず、パネルが覆った範囲の本文の部品だけを `inert` にする）。絞り込みのドロワーとは同時に開かず、どちらかを開くと他方を閉じる。幅 900px 以下は画面の幅いっぱいに出し、パネルから開いた詳細パネルを閉じるとパネルへ戻る。配る書き出しには無い。開いているか・開いているスレッド・レビュー中の書き込みの画面・スレッドの絞り込みは、URL の search params の `panel`・`thread`・`review`・`tstatus`・`ttag`・`ttarget` に持つ（インターフェース定義『プレビューを開く』）。
notes:
  幅 900px 以下の重なり: 詳細パネルと重なるときは後から開いた側を前に出す。詳細パネルを開いたままトップバーから開いたときはパネルを、パネルから詳細パネルを開いたときは詳細パネルを前に出し、後ろになった側の部品を `inert` にする。パネルを閉じると開く前の詳細パネルが見える
test_file: tests/integration/preview/test_spa_comments_screen.py

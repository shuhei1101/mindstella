id: SCR-489-20
title: 検討事項
screen: frontend/src/features/decisions/decisions/decisions-screen.tsx
elements:
  - name: トップバー
    kind: nav
    component: CMP-489-20#
    args:
      - name: title
        value: 記録の取得.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: decisions
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: duplicateIds
        value: 書き換えの通知の duplicate_ids の ID と、記録の取得の項目の種類の名前（閉じた後は、集まりが変わるまで []）
      - name: readAt
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: commentCount
        value: レビュー中のコメントの読み取り.items の件数（溜める・削除する・元に戻す・まとめて送信の後に再描画する）
      - name: commentsOpen
        value: コメントの一覧を開いているか
      - name: settingsOpen
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filterCount
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数（開いたときは既定の状態の条件で 1）
      - name: filterOpen
        value: 絞り込みのドロワーを開いているか
      - name: commentsUnread
        value: 概要と同じ
      - name: pending
        value: 概要と同じ
      - name: pendingCount
        value: 概要と同じ
      - name: pendingOpen
        value: 概要と同じ
      - name: pendingBlocked
        value: 概要と同じ
      - name: voice
        value: 画面で 1 つの音声入力の状態（プレビューを開く.音声の入力）。録音・文字起こし中だけ渡し、`label` は録音を始めた入力欄の名前。配る書き出しでは渡さない
      - name: voiceNotice
        value: 録音を破棄した（行き先の項目・スレッドが記録から無くなった）か、入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が失敗したときの理由。× か「入力欄を開く」で削除する
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: CMP-489-52#
    args:
      - name: views
        value: ボード・表
      - name: current
        value: プレビューを開く.view（既定 board。削除したマップの `map` はボード）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: 条件のチップ
    kind: list
    position: ツールバーの下
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで、列の文字の条件を `{列}に「{文字}」を含む` のチップ（英数字で終わる列名の後は空白を挟む）で並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・ボードを再描画する'
    io: 入力
    visible_when: 表示形式がボードで、値を 1 つ以上選んでいる条件があるとき
    component: CMP-649-2#
    args:
      - name: filters
        value: 絞り込みのドロワーの selected
      - name: labels
        value: 条件の列の名前
      - name: tagMatch
        value: プレビューを開く.tagmatch（無ければ all）
      - name: tagExprText
        value: プレビューを開く.tx があるとき、その式を文にしたもの
      - name: onClearTagExpr
        value: タグの条件を解除する（tx を外す）
  - name: ボード
    kind: board
    description: 状態ごとの列に、絞り込みのドロワーの条件に合う検討事項をカードで並べる。状態の条件から外した状態の列も残し、列の中に「状態の条件で外しています。」と書く。ほかの 0 件の列は「検討事項はありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横にスクロールし、背景のドラッグで動かす。横にスクロールする領域は左右に余白を持ち（1 枚目のカードを領域の端に接させない）、カードが 0 枚でも Tab でフォーカスでき（読み上げの名前「ボード」）、矢印キーで送信できる。幅 720px 以下は列を縦に 1 列に積む。列は最も長い列の高さまで伸ばし、列の見出しはボードを縦にスクロールしてもボードの上に留める。列の見出しは、画面の見出し（`h1`）の 1 段階下の見出し（`h2`）にする。列の中は並べ替え（`sort`。既定は連番）の順に並べる。カードを押すと詳細を開き、その履歴の行に一覧から開いたマーカーを持たせ、開いたカードの列の今の並びを詳細の一覧の並びにする（『プレビューを開く』の制約「一覧の並び」）。カードは部品『項目のカード』で並べ（種類・状態の行の次に作成日時・更新日時を出す）、カードのタグを押すと詳細を開かずにそのタグを絞り込みのタグの条件（f.tags）に加え、履歴に 1 つ積む（既にあれば条件も履歴も変えない）。tx で絞っているときは『プレビューを開く』の制約「タグを押して絞り込む」のとおり tx に加える
    io: 表示
    source: 記録の取得.decisions
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: CMP-489-48#
    args:
      - name: kind
        value: decisions
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・着手可否（ready、絞れる）・前提・タグ（絞れる）
      - name: rows
        value: 記録の取得.decisions
      - name: filters
        value: 絞り込みのドロワーの selected（ボードと共有）
      - name: marks
        value: 差分の表示の間、選んだ時点で追加した・変えた検討事項（記録の取得.changes）
      - name: comments
        value: サーバーにつながって開いたとき、検討事項の ID → その検討事項を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target）
      - name: tagMatch
        value: プレビューを開く.tagmatch（無ければ all）
      - name: onSelectTag
        value: そのタグを f.tags に加えて履歴に 1 つ積む（既にあれば何もしない。tx で絞っているときは『プレビューを開く』の制約「タグを押して絞り込む」のとおり tx に加える）
      - name: tagExprText
        value: プレビューを開く.tx があるとき、その式を文にしたもの
      - name: onClearTagExpr
        value: タグの条件を解除する（tx を外す）
      - name: lookup
        value: 記録の項目・スレッドから ID を検索する関数（記録に無い ID と、配る書き出しのスレッドの ID は `null`）
    description: 検討事項の表。列の末尾に作成日時（`created`）・更新日時（`updated`）を並べ、見出しで並べ替えられる。行のタイトルを押して開くと、その履歴の行に一覧から開いたマーカーを持たせ、表の今の並び（絞り込み・並べ替えを適用した順）を詳細の一覧の並びにする。列「着手可否」は、`derived.ready` にある未決定は「着手可能」、それ以外の未決定は「前提待ち」、未決定以外は「なし」
    visible_when: 表示形式が表
  - name: ボードの差分のマーカー
    kind: label
    component: CMP-489-32#
    args:
      - name: kind
        value: 選んだ時点で追加した項目は new、変えた項目は changed（記録の取得.changes）
    description: ボードのカードで、タイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で追加されたか変わったとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: CMP-489-46#
    position: タブの帯の下から左に重ねる
    description: トップバーの絞り込みのボタンで開閉する。値の条件より上に、文字で絞れる列（値を選ぶ条件にしない、数でない列）の「文字を含む」の欄を並べる（部品設計『絞り込み』の `texts`）。ボード・表で 1 つの条件を共有し、表示形式を切り替えても保つ。開いている間、トップバーとタブの帯とドロワー以外をコメントの一覧と同じくグレーアウトして `inert` にし（右側の結果は透けて見える）、グレーアウトした所を押すと閉じる。コメントの一覧とは同時に開かない（どちらかを開くと他方を閉じる）。条件を変えると、開いたままボード・表を再描画する。幅 900px 以下で詳細パネルを開いたまま開いたときは詳細パネルの前に出し、Esc はドロワーを先に閉じる。閉じると開く前の詳細パネルが見える
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: 状態で要見直し・未決定・未整理・保留を選んだ状態。サーバーの配信でこの画面の残した条件があれば既定に代えてその条件（今の記録に無い値は外す）。URL の search params に `f.{列}` があるときはその条件で開き、残した条件をその条件に書き換える（『プレビューを開く』の制約「保存した絞り込みの条件」）
    args:
      - name: groups
        value: 変更（changed。マーカーは change。値「未読の変更あり」の件数は、未読のまとまりで追加・変更された検討事項の数）・状態（status。マーカーは status）・タグ（tags）・着手可否（ready）。検討事項は種類（`kind`）を持たないので種類の条件を出さない
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: 記録の取得.decisions の件数
      - name: shown
        value: 条件に合う検討事項の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
      - name: tagMatch
        value: プレビューを開く.tagmatch（無ければ all）
      - name: onTagMatchChange
        value: 組み合わせ方を tagmatch に書き（all は外す）、ボード・表・チップを再描画する
      - name: presets
        value: 記録の取得.settings.presets を並び順で、この画面の項目のうち式に合う件数と、今のタグの条件と同じ式か（applied）を添えたもの
      - name: onApplyPreset
        value: タグの条件をプリセットの式で置き換え（簡易で表せる式は f.tags・tagmatch、表せない式は tx）、ほかの条件は残してボード・表・チップを再描画する
      - name: tagExpr
        value: プレビューを開く.tx（無ければ f.tags・tagmatch から作った式。タグの条件が無ければなし）
      - name: onTagExprChange
        value: タグの条件を式で置き換え（1 つの「含む」の条件に収まる式は f.tags・tagmatch、それ以外は tx。null なら解除）、ボード・表・チップを再描画する
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。表・ボードは幅 721px 以上で、この領域の高さいっぱいに広げて中で縦・横にスクロールする。それより狭い幅では、この領域ごと縦にスクロールする。表・ボードの縦・横のスクロール位置は、表示形式ごとにそのタブの保存領域に残し、画面（タブ）の切り替えと戻る・進むで戻ったときに描画の後にその位置へ戻す（『プレビューを開く』の制約「スクロール位置の復元」）
    visible_when: 常時
  - name: ボードのコメントのマーカー
    kind: label
    component: CMP-489-10#
    args:
      - name: count
        value: その検討事項を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    description: ボードのカードでは一番下の行に右寄せで配置する（ID の行には配置しない）。コメントを溜める・修正する・削除する・戻す・送信すると、スクロールの位置を動かさずにマーカーだけを描き替える。マーカーだけを押す操作は持たず、カード・行を押すと今と同じく詳細パネルを開く
    io: 表示
    visible_when: サーバーにつながって開いていて、その検討事項を指すレビュー中のコメントが 1 件以上あるとき
  - name: 削除した項目の帯
    kind: list
    component: CMP-489-44#
    args:
      - name: items
        value: 選んだ時点で削除した項目（記録の取得.changes の removed）のうち、種類が decision のものの id・title を ID の順に並べたもの。合わせた範囲で追加して削除した項目も含む
      - name: lookup
        value: 記録の項目・スレッドから ID を検索する関数（記録に無い ID と、配る書き出しのスレッドの ID は `null`）
      - name: onOpen
        value: 項目の ID は詳細パネルを開き、スレッドの ID はそのスレッドを開いて、履歴に追加する
    position: ツールバー・条件のチップの下、ボード・表の上
    description: 選んだ時点で削除した検討事項を並べる。表示形式と絞り込みの条件によらず同じ帯を出す。項目は押せず、詳細パネルを開かない
    io: 表示
    source: 記録の取得.changes
    visible_when: 差分の表示の間で、選んだ時点で検討事項を 1 件以上消したとき
    status: implemented
  - name: 項目を追加
    kind: button
    position: 表示形式の切り替えの帯 > 右端
    description: 検討事項の項目を追加する入力を、詳細パネルと同じ置き方で開く（開いていた詳細パネルは閉じる）。タイトルを書いて入力欄を離れたときに `item-add` を 1 件溜め、残りのキーと案は、返った仮の ID で同じ `item-add` の `value` を書き換えて溜める（1 件のまま）。幅 480px 以下は「＋」の記号だけにし、文字を読み上げに残す
    label: 項目追加
    visible_when: サーバーの配信で、差分の表示をしていないとき（配る書き出しでは出さない）
    action_ref: SCR-489-32#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
  - name: 一覧の保存待ちのマーカー
    kind: label
    component: CMP-489-22#
    args:
      - name: kind
        value: その項目の削除を溜めていれば remove、直前の保存で書き込めなかった編集を持てば blocked、それ以外は pending
    position: ボードのカード・表の行のタイトルの後ろ（レビュー中のコメントのマーカーの左）
    description: 保存待ちの編集がある項目にマーカーを付け、削除を溜めた項目はタイトルに取り消し線を引く。保存待ちが変わるたびに再設定する
    io: 表示
    visible_when: その項目に保存待ちの編集が 1 件以上あり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（target がその項目のもの）
    status: planned
    introduced:
      pr: 325
  - name: 追加する項目
    kind: list
    position: ボード・表の先頭
    description: 溜めた `item-add` の項目を、ボードは状態の列（溜めた状態か、無ければ「未整理」）の先頭、表は先頭の行に出す（カードは破線の枠にする）。ID は保存で決まるため出さず、ID の場所に「ID は保存時に決定」（表は「—」）を置き、タイトルが空なら「（タイトル未入力）」と出す。保存待ちのマーカー（直前の保存で書き込めなかったときは blocked、それ以外は pending）を付け、押すと追加する入力を再度開く
    io: 表示
    visible_when: 開いている種類の `item-add` が保存待ちにあり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（op が item-add で key が開いている種類）
    action_ref: SCR-489-32#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
  - name: ボードの並べ替え
    kind: group
    component: CMP-695-3#
    args:
      - name: value
        value: 'プレビューを開く.sort（無ければ `{key: default, dir: asc}`）'
    position: 表示形式の切り替えの帯 > 表示形式の切り替えの右
    description: ボードの各列の中の並びを、連番・作成日時・更新日時で切り替える。押すたびに URL の `sort` を書き直し（連番は書かない）、履歴に 1 つ積む
    io: 入力
    visible_when: ボードの表示のとき（表は見出しで並べ替える）
    action_ref: IF-489-70#
    status: planned
  - name: カードのタイトルの中の ID
    kind: label
    component: CMP-701-1#
    position: ボード > カード
    description: ボードのカードのタイトルと関係する項目のタイトルの中の、記録にある項目の ID・スレッドの ID をマーカーにする。乗せると ID の項目・スレッドのタイトルと状態のツールチップを出し、押すとカードを押したときと同じく詳細を開く
    visible_when: 記録にある ID を持つタイトルのカードを出すとき
    args:
      - name: text
        value: カードの項目のタイトル・関係する項目のタイトル
      - name: mode
        value: marker
      - name: lookup
        value: 記録の項目・スレッドから ID を検索する関数（記録に無い ID と、配る書き出しのスレッドの ID は `null`）
  - name: お気に入りの星
    kind: button
    component: CMP-721-1#
    args:
      - name: title
        value: その検討事項のタイトル
      - name: on
        value: 端末の保存領域の `favorites` にその検討事項の ID があるか
    position: ボードのカード > 右上
    description: 押すとその検討事項をお気に入りに登録・解除し（『プレビューを開く』の制約「お気に入り」）、カードの星を描き替える。列の中の並びは変えず、カードの詳細は開かない
    io: 入力
    visible_when: 表示形式がボード
  - name: 星の列
    kind: button
    component: CMP-721-1#
    args:
      - name: title
        value: その行の検討事項のタイトル
      - name: on
        value: 端末の保存領域の `favorites` にその行の ID があるか
    position: 表 > 一番左の列
    description: 表の一番左に見出し「お気に入り」の列を配置し（`favoriteColumn`。列の表示で外せない）、行ごとに星を出す。押すとその行の検討事項をお気に入りに登録・解除し、行の詳細は開かない。見出しを押すとほかの列と同じく昇順 → 降順 → 解除で並べ替え（`sort` の `favorite`）、昇順でお気に入りが先頭になる
    io: 入力
    visible_when: 表示形式が表
  - name: お気に入りのみのチップ
    kind: button
    component: CMP-649-2#
    args:
      - name: filters
        value: 絞り込みのドロワーの selected
      - name: labels
        value: 条件の列の名前
      - name: onClearFavoritesOnly
        value: 端末の保存領域の `favorites_only` の上書きを削除する
    position: ツールバーの下（ボードは条件のチップ、表は表の上のチップの行）の先頭
    label: お気に入りのみ
    description: 「お気に入りだけを表示する」で絞っていることを、絞り込みの条件のチップの先頭に出す。ボード・表はお気に入りの検討事項だけに絞る。× と「すべて解除」で `favorites_only` の上書きを削除し、一覧を全ての項目で再描画する
    io: 入力
    visible_when: 端末の保存領域の `favorites_only` が真のとき
lead: 検討事項をボード（既定）・表で見る画面。
notes:
  コメントのマーカーのモック: コメントのマーカーの見本は `docs/mock/pages/decisions/121/standard/index.html`
  削除した項目のモック: 削除した項目の帯の見本は `docs/mock/pages/decisions/179/b-band/index.html`

id: SCR-489-30
title: 詳細の全画面
screen: frontend/src/features/detail/detail-fullscreen/detail-fullscreen.tsx
elements:
  - name: 元の大きさに戻す
    kind: button
    position: 見出し
    description: 全画面の間の全画面表示のボタン。縮小（矢印が内向き）のアイコンにし、ボタンの色は詳細パネルと同じで変えない。押された状態（`aria-pressed`）は持たない。押すと詳細パネルに戻す。全てを閉じるボタンは置かない
    label: 元の大きさに戻す
  - name: 後ろの幕
    kind: backdrop
    description: ほかのモーダルと同じ濃さ（`--scrim`）の幕。後ろの画面は透けて見える。押すと元の大きさ（詳細パネル）に戻す。Esc でも戻す。開いている間は、モーダルの中でスクロールしても後ろの画面をスクロールさせない
  - name: 詳細の中身
    kind: article
    description: 詳細パネルと同じ要素（戻る・進む・種類と ID・見出しのタイトル・タイトル・タグ・形式の札・取り下げの札・取り下げた理由・背景・案・推奨の印・採用した案と理由・文字列の値の描画・説明・エイリアス・本文・HTML の本文・html のコードブロック・HTML の本文の差分・埋め込んだ HTML・チャート・操作できる部品・今の値をコピー・埋め込んだ HTML の差分・エクスポート・エクスポートのメニュー・本文の差分の並べ方の切り替え・左右に並べた本文の差分・見出しのリンク・まとまりのリンク・本文の印とそのツールチップ・項目の ID のリンク・図の操作・関係する項目・レビュー中のコメント・レビュー中のコメントの並びの切り替え・行の修正・行の削除・行の本文・続きを読む・行の本文の書き換え・行の元に戻す・選んだ箇所のコメントの入口・示す箇所・本文のスクロール領域・差分のミニマップ・編集する・見出しの保存待ちの印・キー・案の保存待ちの印・編集の表示・タイトルの入力・タグの入力・案の入力・項目を削除・書き込めない理由）。本文はモーダルの幅いっぱいに広げ（差分のミニマップを出している間は帯の分を除く）、差分のミニマップはモーダルの本文のスクロール領域の右に並べる。本文の差分の並べ方の切り替えを出すかは、モーダルの本文の幅で詳細パネルと同じく決める。図を拡大表示するときは、モーダルを重ねずにこの中身を図の拡大に切り替え、閉じると本文に戻す。図の拡大を開いている間は選んだ箇所のコメントの入口と差分のミニマップを出さない。行の本文の書き換えの入力欄での Esc は書き換えだけを捨て、全画面を閉じない。本文の印のツールチップはモーダルの中に置き、ツールチップを出している間の Esc はツールチップだけを閉じ、全画面を閉じない。エクスポートのメニューもモーダルの中に置き、開いている間の Esc はメニューだけを閉じ、全画面を閉じない
    io: 表示
    source: 詳細パネルと同じ
  - name: コメントの入力
    kind: form
    component: CMP-489-8#
    args:
      - name: target
        value: SPAを開く.id
      - name: loc
        value: 詳細パネルと同じ
      - name: body
        value: 詳細パネルと同じ（パネルと全画面を行き来しても書きかけと添えた箇所を保つ）
      - name: status
        value: 詳細パネルと同じ。音声入力では、既定の挙動でレビュー中のコメントの追加をした結果（reviewed）・書き込みをすぐ送るの結果（sent）・入力欄へ挿入した（inserted）・録音と文字起こしと送信の失敗（voice-failed）
      - name: count
        value: 詳細パネルと同じ
      - name: detail
        value: 詳細パネルと同じ
      - name: open
        value: 端末の保存領域に覚えたコメントの入力の開閉（覚えていなければ開く）
      - name: voice
        value: 文字起こしの可否（GET /api/transcription）の available と、ブラウザが navigator.mediaDevices.getUserMedia を持つか、録音・文字起こしの進み（画面で 1 つの音声入力の状態）から決める。使えないときと、ほかの入力欄で録音・文字起こし中のときは disabled
      - name: voiceReason
        value: 文字起こしの可否.detail（ブラウザがマイクを使えないときは画面が持つ文「このページではマイクを使用できません。HTTPS か localhost の URL で開いてください。」、ほかの入力欄で音声入力中のときは「ほかの入力欄で音声入力中のため、音声で入力できません。」）
      - name: elapsed
        value: 録音を始めてからの秒数（画面が 1 秒ごとに進める）
      - name: levels
        value: 録音中のマイクの音量（画面が AnalyserNode で一定の間隔ごとに取って足す）
      - name: entered
        value: 書き込みをすぐ送る（POST /api/comments/send-now）の entered
    position: 詳細の中身 > 下端
    description: 詳細パネルと同じ部品をモーダルの下端に留め、本文だけをスクロールする。図の拡大を開いている間は拡大の下に隠れる。開閉は詳細パネルと同じく端末の保存領域に覚えた開閉で出す
    io: 入力
    visible_when: サーバーの配信で開いたとき
    status: planned
lead: 詳細パネルの中身を画面の中央のモーダルで大きく出す。モーダルは窓から 32px 内側（幅 720px 以下は 8px）で、幅の上限は 1600px。後ろはほかのモーダルと同じ濃さでグレーアウトし、元の画面が透けて見える。
notes:
  HTML の本文のモック: 形式の札・HTML の本文・HTML の本文の差分の見本は `docs/mock/pages/detail-full/214/c-marks/index.html`

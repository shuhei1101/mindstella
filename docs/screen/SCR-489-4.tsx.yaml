id: SCR-489-4
title: スレッド
screen: frontend/src/features/comments/thread/thread-view.tsx
elements:
  - name: 一覧へ戻る
    kind: button
    position: 見出し > 上の行
    description: スレッドの一覧へ戻る（履歴に積まない）。一覧のスクロールと絞り込みを保ち、開いていた行へフォーカスを戻す。入力欄にフォーカスが無いときの Esc も同じ。幅 901px 以上で詳細パネルを開いているときの Esc は詳細パネルを先に閉じる。幅 900px 以下の Esc は前に出ている側から閉じる
    label: 一覧へ戻る
    action_ref: SCR-489-1#
    status: planned
  - name: 状態を変える
    kind: button
    position: 見出し > 上の行 > 右端
    description: オープンのスレッドはチェックのアイコンと「クローズにする」、クローズのスレッドは戻すアイコンと「オープンに戻す」。押すと見出しの下に理由の入力を出し、理由の入力を出している間はこのボタンを出さない。確認のモーダルは挟まない
    label: クローズにする / オープンに戻す
    visible_when: 送信したスレッドで、理由の入力を出していない
    enabled_when: 状態を書き換えていない
    status: planned
  - name: 理由の入力
    kind: form
    position: 見出し > 上の行の下
    description: ラベル「理由（任意）」の入力欄と「キャンセル」・確定（「クローズにする」か「オープンに戻す」）。出したら入力欄へフォーカスを移す。確定と入力欄の Ctrl+Enter で `PATCH /w/{workspace}/api/threads/{id}` へ変えた後の `status` と `reason`（空白だけは理由なし）を 1 回で送信する。利用者の状態の変更は溜めずにその場で書く。200 なら理由の入力を閉じ、スレッドを再読み込みして状態の札・状態の記録・下端を再描画し、「状態を変える」へフォーカスを戻す（この画面に留まる）。書き換えている間は入力欄を読み取りだけにし確定を押せなくする。「キャンセル」と入力欄の Esc で理由の入力を閉じ、「状態を変える」へフォーカスを戻す（一覧へは戻らない）
    label: 理由（任意）
    io: 入力
    type: 文字列
    visible_when: 「状態を変える」を押した後
    required: false
    max_length: 400
    target: 画面からのスレッドの状態の書き換え.reason
    action_ref: IF-489-50#
    status: planned
  - name: 状態を変えられなかった理由
    kind: label
    position: 見出し > 理由の入力の下
    description: '`role="alert"`。マーカーのアイコンと「クローズにできませんでした。」か「オープンに戻せませんでした。」に、届かないときは「サーバーが止まっています。再起動してから押してください。」、そのほかのエラーは `detail` を続ける。自動で削除せず、理由の入力は開いたまま残す。次に確定するか理由の入力を閉じると削除する'
    io: 表示
    visible_when: 直前の状態の書き換えが 200 以外か届かなかった
    status: planned
  - name: スレッドのタイトル
    kind: heading
    position: 見出し
    description: 状態の札（オープン・クローズ。まだ送信していない新規スレッドは「レビュー中」。スレッドの行と同じマーカーと文字）とタイトル（要約。無ければ最初の書き込みの 1 行目）
    io: 表示
    source: スレッドの読み取り.threads[].status・threads[].summary
    status: planned
  - name: 向けた項目
    kind: button
    position: 見出し > タイトルの下
    description: 向けた項目の ID（等幅）とタイトル（1 行で末尾を省く）。押すとパネルを開いたまま右にその項目の詳細パネルを開き、箇所があれば詳細パネルの「示す箇所」で示す。項目が消えたときは押せない ID だけを出す
    io: 表示
    visible_when: スレッドが項目に向いている
    source: スレッドの読み取り.threads[].target・threads[].target_title・threads[].loc
    action_ref: SCR-489-31#
    status: planned
  - name: タグ
    kind: label
    position: 見出し > タイトルの下
    description: 'スレッドのタグを # のマーカーつきで並べる（押せない）'
    io: 表示
    visible_when: タグが 1 つ以上
    source: スレッドの読み取り.threads[].tags
    status: planned
  - name: 書き込みの並び
    kind: list
    component: CMP-489-12#
    args:
      - name: post
        value: スレッドの読み取り.threads[].posts[] の 1 件
      - name: event
        value: スレッドの読み取り.threads[].events[] の 1 件
      - name: pending
        value: レビュー中のコメントの読み取り.items のうち、このスレッドへの返信（まだ送信していない新規スレッドはその最初の書き込み）の 1 件
      - name: titles
        value: 記録の取得の項目の ID とタイトル
      - name: editing
        value: そのレビュー中の書き込みをこの画面で書き換えているとき true
      - name: editError
        value: レビュー中のコメントの書き換え（PATCH /w/{workspace}/api/comments/{id}）の失敗の理由
      - name: changeSets
        value: 記録の取得.changes.sets のまとまりの ID と説明
      - name: open
        value: 画面がレビュー中の書き込みごとに覚えた開閉（既定は畳む）
      - name: voice
        value: 修正の入力で、返信の入力の voice と同じく決める
      - name: voiceReason
        value: 返信の入力の voiceReason と同じ
      - name: elapsed
        value: 録音を始めてからの秒数（画面が 1 秒ごとに進める）
      - name: levels
        value: 録音中のマイクの音量（画面が AnalyserNode で一定の間隔ごとに取って追加する）
      - name: voiceStatus
        value: 修正の入力へ文字起こしの結果を挿入した（inserted）・録音と文字起こしの失敗（voice-failed）
      - name: voiceDetail
        value: 音声入力の失敗の理由
    position: 本文
    description: 書き込みと状態の記録を日時の順に並べ、その後ろにレビュー中の返信を溜めた順に並べる。まだ送信していない新規スレッドは最初の書き込み 1 件だけをレビュー中の構造で出す。レビュー中の書き込みの本文は、折り返した後の見た目の行で 5 行を超えると行の高さの 5 行分までを出してはみ出しを隠す（5 行以下の本文はそのまま）。開閉は書き込みごとに画面が覚え、再描画・本文の書き換え・一覧やレビュー中の書き込みの画面との行き来をまたいで保つ（パネルを閉じるまで。レビュー中の書き込みの画面の開閉と同じものを使う）。送信した書き込みは畳まない。書き込みの本文の段落・リストはパネルの幅で折り返し、幅に収まらない表・コードブロックはその要素の中だけを横にスクロールする（書き込みと並びは、どの幅でもパネルの幅より広げない）。見出しと下端の間だけを縦にスクロールする。「修正」「削除」の振る舞いと、書き換えている行を詳細パネル・レビュー中の書き込みと合わせて 1 行にすることは、レビュー中の書き込みの「本文の書き換え」「削除」と同じ。書き換えの通知が届いたらスレッドを再読み込みして再描画し、AI の返信と AI が状態を変えた記録を並びに追加する（スクロールの位置と入力中の返信は保つ）。本文の中のまとまりのリンクを押すと、変更履歴でそのまとまりを選んだときと同じく差分の表示に切り替え、この画面は開いたままにする（インターフェース定義『プレビューを開く』の制約『書き込みのまとまりのリンク』）
    io: 表示
    source: スレッドの読み取り.threads[]（開いた ID のもの）
    action: この画面を出すたびに（一覧の行・レビュー中の書き込みのどちらから開いても、開いている間に書き換えの通知で再描画しても）、`seen` が `false` の書き込みがあればそのスレッドを利用者の既読にする。呼ぶと同時に画面が持つスレッドのコピーのその書き込みを既読にしてトップバーのマーカーを再描画（応答より先に一覧へ戻っても、その行に未読の札を出さない）、応答を待たずに並びを出す。失敗しても画面には出さず、スレッドを再読み込みしてコピーをサーバーの値に戻す。失敗して再読み込みした後も開いたままなら同じスレッドへ再呼び出しせず、次に開いたときに再呼び出しする。まだ送信していない新規スレッドでは呼ばない
    action_ref: IF-489-49#
    status: planned
  - name: 削除した書き込み
    kind: button
    position: 書き込みの並び > 削除した行
    description: 削除したレビュー中の書き込みの元の場所に、「コメントを削除しました。」（`role="status"`）と「元に戻す」を出す。「元に戻す」はレビュー中の書き込みの「元に戻す」と同じ
    label: 元に戻す
    visible_when: パネルを開いている間に削除した、このスレッドのレビュー中の書き込み
    action_ref: IF-489-24#
    status: planned
  - name: 返信の入力
    kind: form
    component: CMP-489-56#
    args:
      - name: thread
        value: 開いたスレッドの ID
      - name: body
        value: レビュー中のコメントの読み取り.drafts のうち、同じ thread の下書き（入力中は画面が持ち、一覧との行き来・再描画をまたいで保つ）
      - name: status
        value: レビュー中のコメントの追加（POST /w/{workspace}/api/comments）の結果。音声入力では、既定の挙動でレビュー中のコメントの追加をした結果（reviewed）・書き込みをすぐ送信するの結果（sent）・入力欄へ挿入した（inserted）・録音と文字起こしと送信の失敗（voice-failed）
      - name: count
        value: レビュー中のコメントの追加.count
      - name: detail
        value: レビュー中のコメントの追加のエラーの detail（届かなかったときはなし）
      - name: voice
        value: 文字起こしの可否（GET /w/{workspace}/api/transcription）の available と、ブラウザが navigator.mediaDevices.getUserMedia を持つか、録音・文字起こしの進み（画面で 1 つの音声入力の状態）から決める。使えないときと、ほかの入力欄で録音・文字起こし中のときは disabled
      - name: voiceReason
        value: 文字起こしの可否.detail（ブラウザがマイクを使えないときは画面が持つ文「このページではマイクを使用できません。HTTPS か localhost の URL で開いてください。」、ほかの入力欄で音声入力中のときは「ほかの入力欄で音声入力中のため、音声で入力できません。」）
      - name: elapsed
        value: 録音を始めてからの秒数（画面が 1 秒ごとに進める）
      - name: levels
        value: 録音中のマイクの音量（画面が AnalyserNode で一定の間隔ごとに取って追加する）
      - name: entered
        value: 書き込みをすぐ送信する（POST /w/{workspace}/api/comments/send-now）の entered
    position: 下端
    description: スレッドの下端に留め、本文と線で区切る。「溜める」で `POST /w/{workspace}/api/comments` へ `thread` と `body` を送信し、201 なら入力欄を空にして、溜めた返信を書き込みの並びの末尾に追加し、コメントのボタンと「レビュー中」の入口の件数を再描画する（この画面に留まる）。溜めた後のフォーカスは『プレビューを開く』の制約「「レビューに追加」の後のフォーカス」に従い、入力欄か「レビューに追加」のボタンへ移す。下書きは入力が止まったときと、一覧へ戻る・レビュー中の書き込みの画面を開く・パネルを閉じるときに『下書きの保存』へ `thread` ごとに送信する
    io: 入力
    visible_when: オープンのスレッド
    target: レビュー中のコメントの追加.thread・body
    action_ref: IF-489-24#
    status: planned
  - name: クローズの知らせ
    kind: label
    position: 下端
    description: チェックのアイコンと「クローズにしたスレッドです。」。返信の入力の代わりに出す。返信するときは「オープンに戻す」で戻してから書く
    label: クローズにしたスレッドです。
    io: 表示
    visible_when: クローズのスレッド
    status: planned
  - name: まだ送信していない知らせ
    kind: label
    position: 下端
    description: 鉛筆のアイコンと「まだ送信していないスレッドです。」。まだ送信していない新規スレッドには「状態を変える」と返信の入力を出さない
    label: まだ送信していないスレッドです。
    io: 表示
    visible_when: まだ送信していない新規スレッド
    status: planned
  - name: 続きを表示
    kind: button
    position: 書き込みの並び > レビュー中の書き込み > 本文の下
    description: レビュー中の書き込みの本文を開く・再度畳む（部品『本文の折りたたみ』が返す開閉のボタン）。畳んでいるときは下向きのアイコンと「続きを表示」、開いているときは上向きのアイコンと「折りたたむ」。本文の下にこのボタンだけの行を置き、ボタンの中の文字は折り返さない。読み上げの名前は「{スレッドの ID} への返信の続きを表示」「{スレッドの ID} への返信の本文を折りたたむ」（まだ送信していない新規スレッドは「{向けた項目の ID} へのコメント」「項目を指さないコメント」を頭にする）
    label: 続きを表示 / 折りたたむ
    visible_when: レビュー中の書き込みの本文が折り返した後の見た目の行で 5 行を超え、本文を書き換えていない書き込み
    action: その書き込みの本文を開くか再度畳む（履歴に積まない）。折りたたんだときは書き込みが画面から外れないように寄せる
    status: planned
lead: スレッドの一覧で開いたスレッド 1 件。書き込みと状態の変更を書いた順に並べ、下端で返信を溜め、上端でクローズとオープンへの戻しをする。コメントの一覧のパネルの中で一覧と切り替え、見出しの帯・パネルの置き方・閉じ方はコメントの一覧と同じ。まだ送信していない新規スレッドもこの画面で開く。開いているスレッドは URL の search params の `thread` に持つ（インターフェース定義『SPAを開く』）。
test_file: tests/integration/preview/test_spa_thread_screen.py

id: SCR-489-34
title: 資料
screen: frontend/src/features/docs/docs/docs-screen.tsx
elements:
  - name: トップバー
    kind: nav
    component: CMP-489-20#
    args:
      - name: title
        value: 記録の取得.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: docs
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: duplicateIds
        value: 書き換えの通知の duplicate_ids の ID と、記録の取得の項目の種類の名前（閉じた後は、集まりが変わるまで []）
      - name: readAt
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: commentCount
        value: レビュー中のコメントの読み取り.items の件数（溜める・削除する・元に戻す・まとめて送信の後に再描画する）
      - name: commentsOpen
        value: コメントの一覧を開いているか
      - name: settingsOpen
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filterCount
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数
      - name: filterOpen
        value: 絞り込みのドロワーを開いているか
      - name: commentsUnread
        value: 概要と同じ
      - name: pending
        value: 概要と同じ
      - name: pendingCount
        value: 概要と同じ
      - name: pendingOpen
        value: 概要と同じ
      - name: pendingBlocked
        value: 概要と同じ
      - name: voice
        value: 画面で 1 つの音声入力の状態（プレビューを開く.音声の入力）。録音・文字起こし中だけ渡し、`label` は録音を始めた入力欄の名前。配る書き出しでは渡さない
      - name: voiceNotice
        value: 録音を破棄した（行き先の項目・スレッドが記録から無くなった）か、入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が失敗したときの理由。× か「入力欄を開く」で削除する
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: CMP-489-52#
    args:
      - name: views
        value: カード・ボード・表
      - name: current
        value: プレビューを開く.view（既定 cards）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: 条件のチップ
    kind: list
    position: ツールバーの下
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで、列の文字の条件を `{列}に「{文字}」を含む` のチップ（英数字で終わる列名の後は空白を挟む）で並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・カード・ボードを再描画する'
    io: 入力
    visible_when: 表示形式がカード・ボードで、値を 1 つ以上選んでいる条件があるとき
    component: CMP-649-2#
    args:
      - name: filters
        value: 絞り込みのドロワーの selected
      - name: labels
        value: 条件の列の名前
      - name: tagMatch
        value: プレビューを開く.tagmatch（無ければ all）
      - name: tagExprText
        value: プレビューを開く.tx があるとき、その式を文にしたもの
      - name: onClearTagExpr
        value: タグの条件を解除する（tx を外す）
  - name: 資料のカード
    kind: list
    description: 絞り込みのドロワーの条件に合う資料 1 件 = カード 1 枚。連番の順に並べ、種類・資料の状態（下書き / 確認中 / 完成）・タグを出す。押すと詳細を開く。カードの外枠は `div`（`data-card={ID}`）にし、タイトルを `button`（`data-id={ID}`）にして、その押せる範囲をカード全体へ広げる。タグのボタンはタイトルのボタンより前面に置き、ボタンを入れ子にしない（部品『項目のカード』と同じ構造）。結合テストのセレクタは、タイトルの文字を確かめる `button[data-id]` をそのまま使い、カードの中のマーカーを確かめる `[data-id] [title=…]` を `[data-card] [title=…]` に変える。タグを押したときは詳細を開かずにそのタグを絞り込みのタグの条件（f.tags）に加え、履歴に 1 つ積む（既にあれば条件も履歴も変えない。tx で絞っているときは『プレビューを開く』の制約「タグを押して絞り込む」のとおり tx に加える）。条件に合う資料が無いときは「該当する資料はありません。別の条件を試してください。」
    io: 表示
    source: 記録の取得.docs
    visible_when: 表示形式がカード
  - name: 表
    kind: table
    component: CMP-489-48#
    args:
      - name: kind
        value: docs
      - name: columns
        value: ID・タイトル（外せない）・状態（絞れる）・種類（絞れる）・形式（`body` の拡張子から `MD` / `HTML`、絞れる）・タグ（絞れる）
      - name: rows
        value: 記録の取得.docs
      - name: filters
        value: 絞り込みのドロワーの selected（カード・ボードと共有）
      - name: marks
        value: 差分の表示の間、選んだ時点で追加した・変えた資料（記録の取得.changes）
      - name: comments
        value: サーバーにつながって開いたとき、資料の ID → その資料を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target）
      - name: tagMatch
        value: プレビューを開く.tagmatch（無ければ all）
      - name: onSelectTag
        value: そのタグを f.tags に加えて履歴に 1 つ積む（既にあれば何もしない）
    description: 資料の表。取り下げた資料（`withdrawn` が真）の行は、差分の表示によらずタイトルの右に取り下げの札を置き、行の文字を薄くする（部品設計『表』の `rows`）
    visible_when: 表示形式が表
  - name: ボード
    kind: board
    description: 資料の状態（下書き・確認中・完成）ごとの列に、絞り込みのドロワーの条件に合う資料をカードで並べる。状態の条件から外した状態の列も残し、列の中に「状態の条件で外しています。」と書く。ほかの 0 件の列も出し、「資料はありません。」と書く。列の中は連番の順。カードに種類・タイトル・ID・タグを出し、状態のマーカーは出さない。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横にスクロールし、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む（タスク・検討事項のボードと同じ）。列は最も長い列の高さまで伸ばし、列の見出しはボードを縦にスクロールしてもボードの上に留める。列の見出しは、画面の見出し（`h1`）の 1 段階下の見出し（`h2`）にする。カードを押すと詳細を開き、開いているカードは枠の全体と面の色で示す。カードは部品『項目のカード』で並べ、カードのタグを押すと詳細を開かずにそのタグを絞り込みのタグの条件（f.tags）に加え、履歴に 1 つ積む（既にあれば条件も履歴も変えない。tx で絞っているときは『プレビューを開く』の制約「タグを押して絞り込む」のとおり tx に加える）
    io: 表示
    source: 記録の取得.docs
    visible_when: 表示形式がボード
  - name: カード・ボードの差分のマーカー
    kind: label
    component: CMP-489-32#
    args:
      - name: kind
        value: 選んだ時点で追加した項目は new、変えた項目は changed（記録の取得.changes）
    description: 資料のカードとボードのカードのタイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で追加されたか変わったとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: CMP-489-46#
    position: タブの帯の下から左に重ねる
    description: 画面設計『検討事項』の絞り込みのドロワーと同じ出し方（列の文字の欄を含む）で、カード・ボード・表で 1 つの条件を共有する
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: どの値も選んでいない。サーバーの配信でこの画面の残した条件があればその条件（今の記録に無い値は外す）。URL の search params に `f.{列}` があるときはその条件で開き、残した条件をその条件に書き換える（『プレビューを開く』の制約「保存した絞り込みの条件」）
    args:
      - name: groups
        value: 種類（kind）・状態（status。マーカーは status）・タグ（tags）
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: 記録の取得.docs の件数
      - name: shown
        value: 条件に合う資料の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
      - name: tagMatch
        value: プレビューを開く.tagmatch（無ければ all）
      - name: onTagMatchChange
        value: 組み合わせ方を tagmatch に書き（all は外す）、カード・ボード・表・チップを再描画する
      - name: presets
        value: 記録の取得.settings.presets を並び順で、この画面の項目のうち式に合う件数と、今のタグの条件と同じ式か（applied）を添えたもの
      - name: onApplyPreset
        value: タグの条件をプリセットの式で置き換え（簡易で表せる式は f.tags・tagmatch、表せない式は tx）、ほかの条件は残してカード・ボード・表・チップを再描画する
      - name: tagExpr
        value: プレビューを開く.tx（無ければ f.tags・tagmatch から作った式。タグの条件が無ければなし）
      - name: onTagExprChange
        value: タグの条件を式で置き換え（1 つの「含む」の条件に収まる式は f.tags・tagmatch、それ以外は tx。null なら解除）、カード・ボード・表・チップを再描画する
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。表・ボードは幅 721px 以上でこの領域の高さいっぱいに広げ、中で縦・横にスクロールする。カードと、それより狭い幅の表・ボードは、この領域ごと縦にスクロールする。カード・表・ボードの縦・横のスクロール位置は、表示形式ごとにそのタブの保存領域に残し、画面（タブ）の切り替えと戻る・進むで戻ったときに描画の後にその位置へ戻す（『プレビューを開く』の制約「スクロール位置の復元」）
    visible_when: 常時
  - name: カード・ボードのコメントのマーカー
    kind: label
    component: CMP-489-10#
    args:
      - name: count
        value: その資料を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    description: 資料のカードとボードのカードのメタ情報の並びの右端に置く。コメントを溜める・修正する・削除する・戻す・送信すると、スクロールの位置を動かさずにマーカーだけを描き替える。マーカーだけを押す操作は持たない
    io: 表示
    visible_when: サーバーにつながって開いていて、その資料を指すレビュー中のコメントが 1 件以上あるとき
  - name: 削除した項目の帯
    kind: list
    component: CMP-489-44#
    args:
      - name: items
        value: 選んだ時点で削除した項目（記録の取得.changes の removed）のうち、種類が doc のものの id・title を ID の順に並べたもの。合わせた範囲で追加して削除した項目も含む
    position: ツールバー・条件のチップの下、カード・ボード・表の上
    description: 選んだ時点で削除した資料を並べる。表示形式と絞り込みの条件によらず同じ帯を出す。項目は押せず、詳細パネルを開かない
    io: 表示
    source: 記録の取得.changes
    visible_when: 差分の表示の間で、選んだ時点で資料を 1 件以上消したとき
    status: implemented
  - name: カード・ボードの取り下げの札
    kind: label
    component: CMP-489-24#
    description: 資料のカードとボードのカードのタイトルの右、差分のマーカーより前に置き、カードの文字を薄くする。押すと詳細を開くのはほかのカードと同じ
    io: 表示
    source: 記録の取得.docs[].withdrawn
    visible_when: その資料の `withdrawn` が真のとき（差分の表示によらない）
    status: implemented
  - name: カード・ボードの形式の札
    kind: label
    component: CMP-489-40#
    args:
      - name: format
        value: 資料の `body` が `.html` で終われば `html`、それ以外は `md`
    position: 資料のカード・ボードのカード > 種類の右
    description: 資料のカードとボードのカードで、種類の右に本文の形式を示す。幅 390px でカードが 1 列になっても種類の右に収める。カードのホバー・フォーカスで札の見た目を変えない
    io: 表示
    source: 記録の取得.docs[].body
    visible_when: 資料が `body` を持つ
    status: implemented
    introduced:
      pr: 214
  - name: 項目を追加
    kind: button
    position: 表示形式の切り替えの帯 > 右端
    description: 資料の項目を追加する入力を、詳細パネルと同じ置き方で開く（開いていた詳細パネルは閉じる）。タイトルを書いて入力欄を離れたときに `item-add` を 1 件溜め、残りのキーは、返った仮の ID で同じ `item-add` の `value` を書き換えて溜める（1 件のまま）。幅 480px 以下は「＋」の記号だけにし、文字を読み上げに残す
    label: 項目追加
    visible_when: サーバーの配信で、差分の表示をしていないとき（配る書き出しでは出さない）
    action_ref: SCR-489-32#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
  - name: 一覧の保存待ちのマーカー
    kind: label
    component: CMP-489-22#
    args:
      - name: kind
        value: その項目の削除を溜めていれば remove、直前の保存で書き込めなかった編集を持てば blocked、それ以外は pending
      - name: compact
        value: 'false'
    position: カード・ボードのカード・表の行のタイトルの後ろ（レビュー中のコメントのマーカーの左）
    description: 保存待ちの編集がある項目にマーカーを付け、削除を溜めた項目はタイトルに取り消し線を引く。保存待ちが変わるたびに再設定する
    io: 表示
    visible_when: その項目に保存待ちの編集が 1 件以上あり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（target がその項目のもの）
    status: planned
    introduced:
      pr: 325
  - name: 追加する項目
    kind: list
    position: カード・ボード・表の先頭
    description: 溜めた `item-add` の項目を、カードの一覧の先頭、ボードは状態の列（溜めた状態か、無ければ「下書き」）の先頭、表は先頭の行に出す（カードは破線の枠にする）。ID は保存で決まるため出さず、ID の場所に「ID は保存時に決定」（表は「—」）を置き、タイトルが空なら「（タイトル未入力）」と出す。保存待ちのマーカー（直前の保存で書き込めなかったときは blocked、それ以外は pending）を付け、押すと追加する入力を再度開く
    io: 表示
    visible_when: 開いている種類の `item-add` が保存待ちにあり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（op が item-add で key が開いている種類）
    action_ref: SCR-489-32#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
  - name: カードのタグ
    kind: list
    component: CMP-489-16#
    args:
      - name: values
        value: 記録の取得（docs[].tags）
    position: 資料のカード・ボードのカードの下端
    description: 資料のタグを記録の順のまま並べ、主題のタグは名前の前に二重丸のマーカーを置く。表のタグの列と絞り込みのドロワーのタグは、主題の有無によらず名前で出す
    io: 表示
    visible_when: 資料がタグを持つとき
    source: 記録の取得（docs[].tags）
    status: planned
    introduced:
      pr: 385
lead: 資料をカード（既定）・ボード・表で見る画面。
notes:
  コメントのマーカーのモック: コメントのマーカーの見本は `docs/mock/pages/docs/121/standard/index.html`
  削除した項目と取り下げのモック: 削除した項目の帯と取り下げの札の見本は `docs/mock/pages/docs/179/b-band/index.html`
  形式の札のモック: カード・ボードの形式の札と表の形式の列の見本は `docs/mock/pages/docs/214/a-kind/index.html`（種類の右に置く案 A を採用）
  主題のタグのモック: 'カード・ボードのタグの主題のマーカーの見本は `docs/mock/pages/docs/385/a-ring/index.html`（採用した案 A。確認ログ: docs/pr/385/確認ログ.md）'
test_file: tests/integration/preview/test_spa_docs_screen.py

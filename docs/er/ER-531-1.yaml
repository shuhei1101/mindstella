id: ER-531-1
title: 'ER 図: 常駐サーバーの状態'
lead: 常駐サーバーが端末に持つ状態のフォルダ `${XDG_STATE_HOME:-~/.local/state}/mindstella/` の形。ワークスペースの ID の一覧と、ワークスペースごとの MindStella のセッションと追加の MCP・プラグインと変更の検知の前回の中身を持つ。Git の外に置き、ワークスペースの設定と記録には入れない（D-289・D-318・D-323）。
er:
  entities:
    - name: ワークスペースの ID の一覧
      columns:
        - type: array
          name: ids
          key: PK
    - name: MindStella のセッション
      columns:
        - type: string
          name: workspace
          key: FK
          comment: '参照: ワークスペースの ID の一覧.ids'
        - type: string
          name: session
    - name: 追加の MCP とプラグイン
      columns:
        - type: string
          name: workspace
          key: FK
          comment: '参照: ワークスペースの ID の一覧.ids'
    - name: 前回参照した時点
      columns:
        - type: string
          name: workspace
          key: FK
          comment: '参照: ワークスペースの ID の一覧.ids'
        - type: number
          name: read_seq
    - name: 移し替えの報告
      columns:
        - type: string
          name: workspace
          key: FK
          comment: '参照: ワークスペースの ID の一覧.ids'
  relations:
    - from: ワークスペースの ID の一覧
      to: MindStella のセッション
      from_column: ids
      to_column: workspace
      from_cardinality: '1'
      to_cardinality: 0..1
      label: 最後の MindStella のセッション
    - from: ワークスペースの ID の一覧
      to: 追加の MCP とプラグイン
      from_column: ids
      to_column: workspace
      from_cardinality: '1'
      to_cardinality: 0..1
      label: 起動の指定
    - from: ワークスペースの ID の一覧
      to: 前回参照した時点
      from_column: ids
      to_column: workspace
      from_cardinality: '1'
      to_cardinality: 0..1
      label: AI が前回参照した時点
    - from: ワークスペースの ID の一覧
      to: 移し替えの報告
      from_column: ids
      to_column: workspace
      from_cardinality: '1'
      to_cardinality: 0..1
      label: まだ知らせていない報告
tables:
  - name: workspaces.yaml
    title: ワークスペースの ID の一覧
    datastore: YAML
    summary: MindStella が作ったワークスペースの配信元の ID の一覧。MindStella の MCP と API は、project-index の配信元の行のうち、この一覧にある行だけをワークスペースとして扱う
    scale: 1 件（ID はワークスペースの数）
    access: 全件
    columns:
      - name: ids
        title: ワークスペースの ID
        type: array
        not_null: true
        description: ワークスペースの ID の並び。『ワークスペースの作成』が配信元の行の追加の後に足す。ファイルが無いときは、『常駐サーバーの起動時の照合』が待ち受けの前に配信元の行から作り直す（D-323）。重なりなし
        example: '[mindstella-家計簿アプリ-3f2a9c]'
  - name: workspaces/{ID}/session.json
    title: MindStella のセッション
    datastore: JSON
    summary: ワークスペースの最後の MindStella のセッション 1 つの状態
    scale: ワークスペースごとに 0〜1 件
    access: キー（ワークスペースの ID）
    columns:
      - name: session
        title: MindStella のセッションの ID
        type: string
        not_null: true
        description: '`S-` に続く 12 桁の 16 進。作成のときに振り、`/clear`・圧縮で変えない'
      - name: status
        title: 状態
        type: string
        not_null: true
        description: '`running`・`stopping`・`restarting`・`stopped`・`crashed` のどれか'
      - name: claude_session_id
        title: Claude Code の session_id
        type: string | null
        description: SessionStart のフックが入れる。`clear`・`compact` の後は入れ直す。入るまで `null`。止まった・落ちた後も削除せず、起動し直しと次の作成が会話を引き継ぐときに使用する
      - name: pane
        title: tmux のペイン
        type: string | null
        description: '`{tmux のセッションの名前}:0.0`。SessionStart のフックが `TMUX_PANE` で入れ直す。止まった・落ちたら `null`'
      - name: socket
        title: tmux のソケット
        type: string | null
        description: ペインの tmux のサーバーのソケット。SessionStart のフックが `TMUX` の最初の `,` より前を入れる。コメントをペインへ貼るときに使う
      - name: pid
        title: Claude Code の PID
        type: integer | null
        description: SessionStart のフックが入れる
      - name: pid_started_at
        title: PID の起動時刻
        type: string | null
        description: '`pid` の使い回しを見分ける（『セッションの値の注入』の `claude_started_at` と同じ引き方）'
      - name: responding
        title: 応答の途中か
        type: boolean
        not_null: true
        description: UserPromptSubmit で真、Stop・StopFailure で偽
      - name: pending_write
        title: 待っている書き込みがあるか
        type: boolean
        not_null: true
        description: 停止を待つ上限を過ぎたとき真
      - name: close_pending
        title: クローズ待ちか
        type: boolean
        not_null: true
        description: API で停止を受けたとき・ワークスペースをクローズしたとき真。作成・開き直しで偽
      - name: started_at
        title: 起動した日時
        type: string
        not_null: true
        description: UTC のタイムゾーン付き ISO 8601
      - name: last_error
        title: 最後の失敗
        type: string | null
        description: '最後の停止・起動し直しに失敗した段階と理由（`{stage}: {detail}`）。次に作成・停止・起動し直しが通ったら `null` に戻す'
      - name: claude_config_dir
        title: Claude Code の設定のフォルダ
        type: string | null
        description: MindStella のセッションの Claude Code が使用する設定のフォルダの絶対パス（起動したアカウント）。SessionStart のフックが入れる。`CLAUDE_CONFIG_DIR` が無いまま起動したときは `~/.claude` の絶対パス
      - name: restart_reason
        title: 起動し直しの契機
        type: string | null
        description: '`restarting` の間の契機（`api`・`rate_limit`・`compact`・`comment`）。起動し直しが終わったら `null`。失敗したときに『停止の通知』を呼ぶかを決める'
  - name: workspaces/{ID}/launch.json
    title: 追加の MCP とプラグイン
    datastore: JSON
    summary: MindStella のセッションを起動するたびに指定する追加の MCP の定義とプラグインのフォルダ。指定が空でもファイルを作り、ファイルが無いことと区別する（D-320）
    scale: ワークスペースごとに 0〜1 件
    access: キー（ワークスペースの ID）
    columns:
      - name: mcp_config
        title: 追加の MCP の定義
        type: object | null
        description: Claude Code の `--mcp-config` に渡す JSON。空の指定は `null`
      - name: plugin_dirs
        title: プラグインのフォルダ
        type: array
        not_null: true
        description: Claude Code の `--plugin-dir` に渡す絶対パス。空の指定は `[]`
  - name: workspaces/{ID}/snapshot/
    title: 変更の検知の前回の中身
    datastore: YAML
    summary: 変更の検知が比べる、ワークスペースの記録のファイルの前回の中身（『変更の検知』）
    scale: ワークスペースごとに、種類ごとの 7 つの YAML と本文のファイルの複製
    access: ファイル名で引く
    columns:
      - name: '{種類}.yaml'
        title: 種類ごとの YAML の複製
        type: string
        description: '`.mindstella/{種類}.yaml` の前回の中身'
      - name: 'docs/{ファイル名}'
        title: 本文の複製
        type: string
        description: '`.mindstella/docs/` の本文の前回の中身'
  - name: workspaces/{ID}/read_point.json
    title: 前回参照した時点
    datastore: JSON
    summary: AI が前回参照した時点。『前回読んだ時点からの変更』と『前回参照した時点の更新』だけが書き換え、『再開の状況』は読むだけ（D-326）
    scale: ワークスペースごとに 0〜1 件
    access: キー（ワークスペースの ID）
    columns:
      - name: read_seq
        title: AI が前回参照した時点
        type: number
        not_null: true
        description: ワークスペースの `changes.yaml` の通し番号。ファイルが無ければ `changes.yaml` に残った前のバージョンの `read_seq` を使う
        example: '12'
  - name: workspaces/{ID}/migration.json
    title: 移し替えの報告
    datastore: JSON
    summary: 『ワークスペースの作成』が記録を移し替えた報告のうち、まだ『再開の状況』で知らせていないもの。『前回参照した時点の更新』が消す
    scale: ワークスペースごとに 0〜1 件
    access: キー（ワークスペースの ID）
    columns:
      - name: provisional
        title: 仮の値
        type: array
        not_null: true
        description: '`{file, key, value}`。値が要るキーに入れた仮の値'
      - name: not_carried
        title: 移せなかった値
        type: array
        not_null: true
        description: '`{item, key, value}`。移せずに記録から消えた値'
notes:
  削除: インターフェース定義『ワークスペースの削除』で、そのワークスペースの `workspaces/{ID}/` と `ids` の行を消す。クローズでは残す（D-322）
  書き込み: 一時ファイルから `os.replace` で置き換える。`workspaces.yaml` は全体で 1 つの鍵、`session.json` はファイルごとの鍵を取って書く

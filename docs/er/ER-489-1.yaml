id: ER-489-1
title: "ER 図: ワークスペース"
lead: 1 つの話し合いのフォルダ（ワークスペース）が持つ YAML の形式。正本は `plugins/mindstella/skills/mindmap/schemas/` の JSON Schema で、書き込む前に突き合わせる。項目の本文のフォルダ `docs/` と資料に埋め込むファイルのフォルダ `files/` はワークスペースの直下に、ほかのファイルとフォルダは直下の記録のフォルダ `.mindstella/` に置き、表の物理名は `docs/`・`files/` の表は直下から、ほかの表は `.mindstella/` からのパス。画面はサーバーの配信で開き、ワークスペースには置かない。直下には `.mindstella/`・`docs/`・`files/` のほかに、このフォルダの起動・接続のコマンドとプレビューの URL を一覧にした `README.md` をサーバーが書く（記録ではなく、1 行目の自動で書いたマーカーを確かめるほかにどのツールも読まない）。
er:
  entities:
    - name: 設定
      columns:
        - type: object
          name: settings
    - name: 検討事項
      columns:
        - type: string
          name: id
          key: PK
        - type: array
          name: related（depends_on・parent）
          key: FK
          comment: '参照: 検討事項.id'
        - type: array
          name: sources
          key: FK
          comment: '参照: 会話ログ.id'
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: タスク
      columns:
        - type: array
          name: related（for）
          key: FK
          comment: '参照: 検討事項.id'
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: 調査
      columns:
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: 資料
      columns:
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: 用語集
      columns:
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: メモ
      columns:
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: 会話ログ
      columns:
        - type: string
          name: id
          key: PK
        - type: string
          name: body
          key: FK
          comment: '参照: 本文.ファイル名'
    - name: 本文
      columns:
        - type: string
          name: ファイル名
          key: PK
    - name: 送信
      columns:
        - type: string
          name: target
          key: FK
          comment: '参照: 検討事項.id'

    deletion: 削除と、まとめて送信したときに物理削除する（送信したものは `threads.yaml` へ移る）
    access: 全件
    description: 最上位に `seq`（最後に振った連番。振った番号を使い回さないために持つ）と `items:` の配列を持ち、1 要素 = 1 件のコメント。初めて溜めたときにサーバーが作り、無ければ 0 件として扱う。書くのはサーバーのコメントの受け付け（`/api/comments`）だけで、project-index の配信の対象にしない。共通のキー（`common.schema.json`）は持たない。並びは連番の小さい順（溜めた順）。チェックの状態は画面だけが持ち、ここには書かない
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: '`C-` + 連番。連番は `seq` + 1。削除したコメントを元に戻すときだけ、同じ ID で戻す'
        example: C-3
      - name: target
        title: 向けた項目
        type: string
        not_null: false
        description: コメントを向けた項目の ID（どの種類でもよい）。項目に紐づかないコメントはキーを持たない
        example: D-22
      - name: loc
        title: 箇所
        type: object
        not_null: false
        description: 選んだ箇所。箇所を持たないコメントはキーを持たない。`target` を持つときだけ持つ
      - name: loc.kind
        title: 箇所の種類
        type: string
        not_null: true
        description: '`body`（本文の文を選んだ）か `value`（項目の値を選んだ）'
        example: body
      - name: loc.start
        title: 始めの行
        type: number
        not_null: false
        description: '`body` のとき。本文の Markdown の行（1 始まり）'
        example: '2'
      - name: loc.end
        title: 終わりの行
        type: number
        not_null: false
        description: '`body` のとき。本文の Markdown の行（1 始まり）。`start` 以上'
        example: '2'
      - name: loc.key
        title: 値のキー
        type: string
        not_null: false
        description: '`value` のとき。項目のキーのパス。案の中は `options[{案の key}].{キー}`'
        example: options[B].cons
      - name: loc.text
        title: 選んだ文
        type: string
        not_null: true
        description: 画面で選んだ文（描いた文のまま）。前後の空白を除いて 1〜10000 文字
        example: 言い換えたい文
      - name: body
        title: 本文
        type: string
        not_null: false
        description: コメントの本文。前後の空白を除いて 1〜10000 文字。`choice` を持たないものは必ず持ち、`choice` を持つものは案に添えた一言で、添えないときはキーを持たない
        example: ここは言い換える
      - name: created
        title: 溜めた日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601。元に戻したときは元の日時
        example: '2026-10-05T03:00:00+00:00'
      - name: thread
        title: 返信先のスレッド
        type: string
        not_null: false
        description: 既存のスレッドへの返信のとき、そのスレッドの ID。新規スレッドの最初の書き込み（項目の詳細パネル・新規スレッドの入力欄で溜めたもの）はキーを持たない。持つときは `target`・`loc` を持たない
        example: TH-3
      - name: choice
        title: 案の選択
        type: object
        not_null: false
        description: 検討事項の詳細で案を選んで確定したものだけが持つ。持つときは `target` が未決定・要見直しの検討事項で、`loc` と `thread` を持たず、一言は `body` に持つ。同じ検討事項への案の選択は 1 件だけで、選び直すとその 1 件を書き換え、取り消すと削除する。まとめて送信すると、検討事項の `user_choice` に移る（スレッドには移らない）
      - name: choice.key
        title: 選んだ案
        type: string
        not_null: true
        description: 選んだ案の `key`
        example: B
  - name: drafts.yaml
    title: 下書き
    datastore: YAML
    summary: コメントの入力欄に書いて、まだ溜めていない本文

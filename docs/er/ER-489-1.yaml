        - type: string
          name: target
          key: FK
          comment: '参照: 検討事項.id'
        - type: string
          name: body
    - name: 下書き
      columns:
        - type: string
          name: target
          key: FK
          comment: '参照: 検討事項.id'
    - name: 保存待ちの編集
      columns:
        - type: string
          name: target
          key: FK
          comment: '参照: 検討事項.id'
  relations:
    - from: 検討事項
      to: 検討事項
      from_column: id
      to_column: related（depends_on・parent）
      from_cardinality: 0..n
      to_cardinality: 0..n
      label: 種類 depends_on・parent の related
    - from: 検討事項
      to: タスク
      from_column: id
      to_column: related（for）
      from_cardinality: '1'
      to_cardinality: 0..n
      label: 種類 for の related で進められる
    - from: 会話ログ
      to: 検討事項
      from_column: id
      to_column: sources
      from_cardinality: 0..n
      to_cardinality: 0..n
      label: sources
    - from: 検討事項
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1
      label: body
    - from: 調査
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1

    - from: レビュー中のコメント
      to: 検討事項
      from_column: target
      to_column: id
      from_cardinality: 0..n
      to_cardinality: 0..1
      label: target（送信と同じ）
    - from: 下書き
      to: 検討事項
      from_column: target
      to_column: id
      from_cardinality: 0..n
      to_cardinality: 0..1
      label: target（送信と同じ）
    - from: レビュー中のコメント
      to: 送信
      from_column: body
      to_column: body
      from_cardinality: '1'
      to_cardinality: 0..1
      label: まとめて送信すると移る
    - from: タスク
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1
      label: body
    - from: 用語集
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1
      label: body
    - from: メモ
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1
      label: body
    - from: 保存待ちの編集
      to: 検討事項
      from_column: target
      to_column: id
      from_cardinality: 0..n
      to_cardinality: 0..1
      label: target（どの種類の項目も指す。追加する項目は仮の ID）
    - from: 保存待ちの編集
      to: 設定
      from_column: target
      to_column: settings
      from_cardinality: 0..n
      to_cardinality: 0..1
      label: target が settings
tables:
  - name: config.yaml
    title: 設定
    datastore: YAML
    summary: ワークスペースの ID・進め方の文書・題名・話し合いの概要・関連する場所・変更履歴を保持する回数・表示の既定・絞り込みのプリセット・プレビューの配信のポート
    scale: 1 件
    access: 全件
    columns:
      - name: id
        title: ワークスペースの ID
        type: string
        description: 任意。『ワークスペースの作成』が振る、project-index の配信元の行の `id` と常駐サーバーの状態のフォルダのキー（`mindstella-{フォルダ名}-{ハッシュ}`）。書き換えない
        example: mindstella-家計簿アプリ-3f2a9c
      - name: flow
        title: 進め方の文書
        type: object
        description: 任意。`source`（配信元の ID）と `doc`（文書の ID）。『ワークスペースの作成』が記録の無いフォルダにだけ書き、MindStella のセッションを起動するたびにセッションの管理が読む
        example: '{source: aituber, doc: flow-script}'
      - name: links
        title: 関連する場所
        type: array
        description: 要素は `title`・`url`
      - name: summary
        title: 題名
        type: string
        not_null: true
        description: 話し合いの題名（何についての話し合いかを 1 文で）。プレビューのトップバーに出す
        example: 要件出しのスキル mindmap を設計する
      - name: description
        title: 話し合いの概要
        type: string
        not_null: false
        length: 1 字以上 60 字以内
        description: 任意。何についての話し合いかを 1 文の短い文で。AI がセットアップと範囲の見直しで書き、利用者は `config.yaml` を修正して書き換える。プレビューの概要の画面の題名の上に出す。題名（`summary`）・ゴールの概要（`goal.summary`）とは別のもの
        example: スキル mindmap の記録の構造とプレビューの画面を、作り始められるところまで決める話し合い。
      - name: history_limit
        title: 保持する回数
        type: number
        default: '5'
        description: 項目ごとに変更履歴を何回分持つか。0 以上の整数で上限は設けない。0 は変更履歴を持たず、差分を出さない。無ければ 5 として扱う。AI がまだ読んでいない回（前回参照した時点より後の回）は、この回数を超えても削除しない
        example: '3'
      - name: display
        title: 表示の既定
        type: object
        description: 任意。プレビューのワークスペースの既定。`visible_kinds`（表示する種類。`decisions`・`tasks`・`research`・`docs`・`terms`・`notes`・`logs` の重複しない配列。無ければ全ての種類）を持つ。利用者の個人の上書き（ブラウザの `localStorage`）が無い項目に使う。`update_settings` と画面の『設定の既定の書き換え』が書く
        example: '{visible_kinds: [decisions, tasks, research, docs, terms, notes, logs]}'
      - name: transcription
        title: 文字起こしの設定
        type: object
        description: 任意。コメント・返信の入力の音声入力の設定。`action`（文字起こし後の挙動。`review` は入力欄へ挿入した全文をレビュー中に溜めて送信しない。`send` は入力欄へ挿入した全文をその 1 件だけで Claude Code へ送信し、`insert` は入力欄のカーソルの位置に挿入して送信しない。無ければ `review`）と `preset`（文字起こしのサービスへ渡す用語集のプリセットの名前。1 文字以上の文字列か `null`。無いか `null` ならサービスの既定）を持つ。どのサービスを使うかは持たない（常駐サーバーの環境変数 `MINDSTELLA_TRANSCRIBER`）。`update_settings` と設定の画面が書く
        example: '{action: insert, preset: 開発}'
      - name: mdmark
        title: 画面が読み込む mdmark
        type: object
        description: 任意。`version`（画面・Storybook・配る書き出しが読み込む mdmark のバージョン。`latest` か `v{数字}.{数字}.{数字}` のタグ。無ければ `latest`。`latest` は jsDelivr の `gh/shuhei1101/mdmark@develop` を指す）と `map`（map の図の種類。mdmark の設定の `map` と同じ形式の `kinds`・`lines`。画面が `mount` の `config.map` に指定する）を持つ。`version` と `map` は `update_settings` が書き、`map` は移し替えの変換も追記する。`update_settings` は `map` を mdmark の設定のスキーマの `map` と突き合わせてから書き、`version` と `map` のうち渡さなかった方を残す。『設定の再読み込み』の後に開いた画面から効く
        example: '{version: latest, map: {kinds: {llm: {label: LLM, icon: bot, shape: rounded, color: purple}}}}'
      - name: presets
        title: 絞り込みのプリセット
        type: array
        description: '任意。タグの式に名前を付けた絞り込みのプリセットの並び。要素は `name`（名前。プリセットの間で重ならない 1 字以上 40 字以内。NFKC と大文字小文字をそろえて比べる）・`description`（任意。何を開くプリセットかを 1 文で）・`filter`（タグの式。knowledge の規約『フィルター・照合条件の構造』の条件か `and`・`or`・`not` の束。条件のキーは `field`・`op`・`values`・`match` に限り（`case_sensitive` は持たない。タグは常に NFKC と大文字小文字をそろえて比べる）、`field` は `tags`、`op` は `eq`・`ne`、`values` は 1 つ以上のタグ、`match` は `any`（既定）か `all`。`eq` は `match: any` で選んだタグのどれかを持つ項目、`all` で全てを持つ項目に該当し、タグの無い項目は該当しない。`ne` は選んだタグをどれも持たない項目に該当し、タグの無い項目も含める（`match` を持たない）。最上位の束を 1 レイヤーとして 3 レイヤーまで。空の束は持たない）を持ち、並び順は配列の順。該当する件数は保存せず、記録の取得・点検・プリセットのツールがそのつど数える。プリセットの作成・更新・削除の MCP のツールが記載し、利用者は `config.yaml` を修正して書き換えられる'
        example: "[{name: 画面の設計, description: 画面の設計の資料だけを開く, filter: {and: [{field: tags, op: eq, values: [画面]}, {field: tags, op: ne, values: [廃止]}]}}]"
  - name: plugins/mindstella/skills/mindmap/schemas/common.schema.json
    title: 共通のキー
    datastore: JSON
    summary: 種類ごとの YAML の項目が共通で持つキー（各種類のスキーマが `$ref` で指す）
    description: 種類ごとの YAML はどれも `items:` の配列を持ち、1 要素 = 1 項目。この表のキーは全ての種類の項目が持つ。作成日時・更新日時・編集した人・連番・変更履歴は項目に持たず、`history.yaml` に持つ。
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: 種類の頭の文字 + `-` + 連番。頭の文字で種類が決まる（D 検討事項 / T タスク / R 調査 / A 資料 / G 用語集 / N メモ / L 会話ログ）。連番はその種類の最大 + 1 で、削除した番号を使い回さない
        example: D-12
      - name: title
        title: タイトル
        type: string
        not_null: true
        description: タイトル
      - name: tags
        title: タグ
        type: array
        description: '話題のタグ。要素は `{name, main?}`（`name` はどの文字列でも持てる。タグの語彙は持たない）。その項目の主題のタグだけが `main: true` を持ち、主題でないタグは `main` を持たない。比べるときは `name` を NFKC と小文字でそろえ、そろえて同じ名前のタグを 2 件持たない。文字列の要素は v0.12.0 より前の形式（『記録の形式の移行』が移し替える）'
        example: '[{name: topic:タグ, main: true}, {name: topic:検索}]'
      - name: related
        title: 関連
        type: array
        description: '項目の参照。要素は `to`（指す項目の ID）・`type`（`depends_on` 前提 / `parent` 派生元 / `for` 進める検討事項 / `see_also` 向きを持たない関連）。`depends_on`・`parent` は同じ種類の項目、`for` はタスクから検討事項を指す。project-index の `trace_related` が種類つきでたどり、`delete_docs` が指されている項目の削除を断る。同じ `to`・`type` の組は 1 件だけ持つ'
        example: '[{to: D-1, type: depends_on}, {to: R-2, type: see_also}]'
      - name: links
        title: リンク
        type: array
        description: 要素は `title`・`url`
  - name: decisions.yaml
    title: 検討事項
    datastore: YAML
    summary: 質問と回答の単位（未決定のものも入る）
    primary_key: id
    scale: ~1000
    access: 全件
    deletion: 削除せず、状態を `取り下げ` か `対象外` にする
    columns:
      - name: status
        title: 状態
        type: string
        not_null: true
        enum_values: 未決定 / 決定済み / 要見直し / 保留 / 未整理 / 対象外 / 取り下げ
        description: 検討事項の状態
      - name: lead
        title: 質問の説明
        type: string
        description: 何を決める質問か
      - name: answer
        title: 回答
        type: string
        description: 決まった回答
      - name: options
        title: 案
        type: array
        description: 要素は `key`（記号）・`content`・`pros`・`cons`・`note`・`adopted`（真偽値）・`recommended`（真偽値。AI が推す案のマーカー）・`reason`（未決定の間は推奨する理由、決まった後は採用した・しなかった理由）。`adopted` が真の案と `recommended` が真の案は、それぞれ 0 か 1 つ。状態との決まりはこの表の説明
      - name: reason
        title: 理由
        type: string
        description: 決めた理由・保留や取り下げの理由
      - name: body
        title: 本文
        type: string
        description: '`.mindstella/` からの本文の Markdown のパス（`../docs/{ID}.mark.md`）'
        example: ../docs/D-12.mark.md
      - name: sources
        title: 経緯
        type: array
        description: 決めた会話ログの ID（`L-`）
      - name: user_choice
        title: 利用者の選択
        type: object
        not_null: false
        description: 利用者がプレビューで案を選んで送信し、AI がまだ採用していないときだけ持つ。`adopted` の採用とは別で、状態を変えない。記載するのはサーバーのコメントのまとめて送信だけで、案を採用する切り替え（`adopt`）が削除する。既に持つときは、まとめて送信した選択で書き換える
      - name: user_choice.key
        title: 選んだ案
        type: string
        not_null: true
        description: 選んだ案の `key`。その検討事項の `options` にある記号
        example: B
      - name: user_choice.note
        title: 一言
        type: string
        not_null: false
        description: 選ぶときに添えた一言。前後の空白を除いて 1〜10000 文字。添えなかったときはキーを持たない
        example: 費用を優先する
      - name: user_choice.at
        title: 送信した日時
        type: string
        not_null: true
        description: まとめて送信した日時（UTC のタイムゾーン付き ISO 8601）
        example: '2026-11-27T07:30:00+00:00'
    description: |-
      案と状態の決まり（書き込むツールと読み込みの検証、点検が見る）:

      | 決まり | 合わないときの理由の行 |
      | --- | --- |
      | `未整理`・`対象外`・`取り下げ` を除く状態は、`options` を 1 つ以上持つ | `{ID} は状態 {状態} のため案を 1 つ以上持つ（options に案を書く）` |
      | `決定済み` は、`adopted` が真の案を 1 つ持つ | `{ID} は決定済みなのに採用した案を持たない（adopt で案を採用する）` |
      | `adopted` が真の案を持つ検討事項は `未決定` にしない（方針転換で `要見直し` にした検討事項は、前に採用した案を持ったままでよい） | `{ID} は採用した案 {記号} を持つのに未決定（adopt で決定済みにするか、採用を外す）` |
      | `user_choice.key` は、その検討事項の `options` にある記号 | `{ID} の利用者の選択 {記号} は案に無い（案を戻すか、user_choice を削除する）` |
      | `決定済み` は `user_choice` を持たない | `{ID} は決定済みなのに利用者の選択を持つ（adopt で採用して片付ける）` |

      理由の行は、スキーマに合わない箇所と同じ `decisions.yaml: items[{番号}].{options・status・user_choice のどれか}: {理由}` の構造で返す。
  - name: tasks.yaml
    title: タスク
    datastore: YAML
    summary: 検討事項を決めるための作業と「後でやっといて」
    primary_key: id
    scale: ~1000
    access: 全件
    deletion: 削除せず、状態を `中止` にする
    columns:
      - name: kind
        title: 種類
        type: string
        not_null: true
        enum_values: 作業 / 調査 / 検証
        description: タスクの種類
      - name: status
        title: 状態
        type: string
        not_null: true
        enum_values: 未着手 / 進行中 / 保留 / 完了 / 中止
        description: タスクの状態
      - name: reason
        title: 理由
        type: string
        description: 積んだ理由・保留や中止の理由
      - name: result
        title: 結果
        type: string
        description: 終えたときの結果
      - name: body
        title: 本文
        type: string
        description: '`.mindstella/` からの本文の Markdown のパス（`../docs/{ID}.mark.md`）。経緯や補足を残す'
        example: ../docs/T-3.mark.md

        title: 中身
        type: string
        description: プラグインのスキーマと同じ中身
  - name: comments.yaml
    title: レビュー中のコメント
    datastore: YAML
    summary: プレビューで書いて溜め、まだ送信していないコメント
    primary_key: id
    scale: ~100

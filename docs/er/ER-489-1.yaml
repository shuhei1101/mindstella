  - name: history.yaml
    title: 項目の履歴
    datastore: YAML
    summary: 項目ごとの作成日時・更新日時・編集した人・連番・変更履歴
    scale: ~1000
    growth: 項目を追加するたびに 1 件
    deletion: 項目を削除したときにその項目の行を削除する（削除した項目は `changes.yaml` の `removed` に残る）
    access: キー（項目の ID）
    description: '最上位に `items:` の対応（項目の ID → その項目の行）を持つ。変更の検知・`adopt`・案の書き換え・画面の保存・設定の更新だけが、`.mindstella.lock` を取って書く。project-index の配信の対象にせず、種類ごとの YAML の項目はこれらのキーを持たない（project-index の `write_docs` と同じファイルを書かないため）。『記録の取得』は、各項目へこの行のキーを追加して返す。無ければどの項目も履歴を持たないものとして扱う'
    columns:
      - name: items.{ID}.created
        title: 作成日時
        type: string
        not_null: false
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601。項目を追加したときに変更の検知が書く
        example: '2026-10-02T08:00:00+00:00'
      - name: items.{ID}.updated
        title: 更新日時
        type: string
        not_null: false
        auto: 更新日時
        description: UTC のタイムゾーン付き ISO 8601。項目を追加した・値を変えたときに書く
      - name: items.{ID}.updated_by
        title: 編集した人
        type: string
        description: 最後に項目を追加した・値を変えたのが AI か利用者かほかのセッションか。`ai`（MindStella のセッションの応答の途中の書き込みと MindStella の MCP のツールの書き込み）・`user`（画面からの編集）・`external`（それ以外の書き込み。『変更の検知』）。`updated` を書き換える全ての書き込み（`update_settings` のフェーズ・対象・カテゴリーの付け替えを含む）が一緒に書く。このキーを入れる前に書いた項目は、次に書き換えるまで持たず、編集した人が分からないものとして扱う。変更の検知が付ける
        example: ai
      - name: items.{ID}.seq
        title: 最後に振った連番
        type: number
        not_null: false
        description: その項目を追加した・値を変えたときに振った `changes.yaml` の連番のうち、最も新しいもの。『前回読んだ時点からの変更』が `read_seq` と比べる。このキーを入れる前に追加した項目は、次に値を変えるまでキーを持たない。変更の検知が付ける
        example: '14'
      - name: items.{ID}.added_seq
        title: 追加したときの連番
        type: number
        not_null: false
        description: その項目を追加したときに振った `changes.yaml` の連番。『前回読んだ時点からの変更』が、読んだ時点より後に追加した項目と変えた項目を分けるのに使う。このキーを入れる前に追加した項目は持たない。変更の検知が付ける
        example: '14'
      - name: items.{ID}.history
        title: 変更履歴
        type: array
        description: '変更の検知・`adopt`・案の書き換え・画面の保存が値を変えるたびに先頭に 1 要素を追加し、新しい順に並べる。要素は `seq`（`changes.yaml` の連番）・`at`（書き換えた日時）・`by`（その回を書き換えたのが `ai` か `user` か `external`（ほかのセッションの書き込み）か。このキーを入れる前に積んだ回は持たない）・`before`（変わったキー → 書き換える前の値。前に無かったキーは `null`）・`body_diff`（本文が変わったときだけ。要素は `line`（その書き換えの後の本文の 1 始まりの行）・`now`（そこからの今の行の並び）・`before`（置き換える前の行の並び））。後ろの行から当てると前の本文になる。`updated`・`updated_by`・`history`・`history_dropped_seq`・`seq`・`added_seq`・`body` は `before` に入れず、本文の全文も持たない。ただし `body` は、前に本文が無かった回（`null`）と資料の本文の形式を替えた回（前のファイル名）だけ `before` に入れる。数は設定の `history_limit` までで、超えた古い要素は次に積むときに削除する。ただし `changes.yaml` の `read_seq` より大きい `seq` の要素（AI がまだ読んでいない回）は、超えても削除しない。無ければ変更履歴 0 回分として扱う。変更の検知が付ける'
      - name: items.{ID}.history_dropped_seq
        title: 削除した変更履歴の連番
        type: number
        not_null: false
        description: 保持する回数を超えて `history` から削除した要素のうち、最も大きい `seq`。削除するたびに大きい方へ書き換える。差分の表示で、選んだ時点の範囲の中の回が消えたかを見分けるのに使う。一度も削除していなければキーを持たない。変更の検知が付ける
        example: '5'
  - name: changes.yaml
    title: 書き換えのまとまり
    datastore: YAML
    summary: '`commit` でまとめた書き換えのまとまりと、まだまとめていない変更'
    scale: ~1000
    growth: ステップごとに `commit` で 1 件追加する
    deletion: 削除しない
    access: 全件
    description: '変更の検知・`adopt`・案の書き換え・画面の保存が初めて書き換えたときにサーバーが作り、無ければまとまり 0 件・まだまとめていない変更なしとして扱う。まとまりに入る項目の変更履歴は、1 つ前のまとまりの `until_seq` より大きく、そのまとまりの `until_seq` 以下の `seq` を持つもの。`sets[].removed`・`pending.removed` は削除した項目のただ 1 つの記録で、新しい ID を振るときに削除した ID を避けるのにも使う。`add`・`update` の対象にしない'
    columns:
      - name: last_seq
        title: 最後の連番
        type: number
        not_null: true
        description: 最後に振った連番。変更履歴を積むとき・項目を追加するとき・項目を削除するとき・保持する回数が 0 で変更履歴を積まずに値を変えるときに 1 追加する
      - name: sets
        title: まとまり
        type: array
        not_null: true
        description: 新しい順。要素は `id`（`V-` + 連番）・`at`（まとめた日時）・`summary`（一言の説明）・`until_seq`（まとめたときの `last_seq`）・`added`（追加した項目の ID）・`changed`（変えた項目の ID。追加した項目は入れない）・`removed`（削除した項目。要素は `pending.removed` と同じ形式。削除した項目が無いまとまりはキーを持たない）・`by`（まとめた変更の書いた元。`commit` は `ai`、画面の保存は `user`、変更の検知が自動でまとめた外部の変更は `external`。このキーを入れる前のまとまりは持たない）
      - name: pending
        title: まだまとめていない変更
        type: object
        not_null: true
        description: '`added`・`changed`（書き換えた順の ID）と `removed`（削除した順。要素は `id`・`kind`（種類）・`title`（削除したときのタイトル）・`seq`（削除したときに振った連番）・`added_seq`（削除した項目が持っていた `added_seq`。持たなければ 0））。`removed` は任意で、無ければ削除した項目なしとして扱う。保持する回数が 0 の書き換えは `changed` に入れない。最後のまとまりより後に追加して削除した項目は `added` から除き、`removed` に記録する。`by`（任意。`ai` か `external`。無ければ `ai`）は入っている変更の書いた元で、書いた元が違う変更を入れる前に、入っている変更を先にまとまりにする（『変更の検知』）'
      - name: read_seq
        title: AI が最後に読んだ時点
        type: number
        not_null: false
        description: 前のバージョンで『前回読んだ時点からの変更』を最後に呼んだときの `last_seq`。今は常駐サーバーの状態のフォルダの `read_point.json` に持ち（ER 図『常駐サーバーの状態』）、`read_point.json` が無いときだけこの値を読む
        example: '12'
  - name: dev-docs.yaml
    title: 記録の配信の設定
    datastore: YAML
    summary: 種類ごとの YAML の項目と本文を project-index の配信元として配る設定
    scale: 1 ファイル
    access: 全件
    description: 'ワークスペースの作成と移し替え（v0.13.0 の `place_source_config`・v0.14.0 の `move_bodies_to_root`）が書き、project-index が読む。書式は project-index のガイド『設定』。端末の設定の配信元の行の `config` がこのファイルを指す。MindStella のツールは書き換えない'
    columns:
      - name: version
        title: 設定のバージョン
        type: string
        not_null: true
        description: project-index の設定のバージョン
        example: '"3"'
      - name: name
        title: 名前
        type: string
        not_null: true
        description: ワークスペースの ID
      - name: description
        title: 説明
        type: string
        description: '`config.yaml` の `summary`'
      - name: related.types
        title: 関連の種類
        type: array
        not_null: true
        description: '`related[].type` に使える種類'
        example: '[depends_on, parent, for, see_also]'
      - name: documents
        title: 文書の行
        type: array
        not_null: true
        description: '種類ごとの 7 つの行。要素は `id`（種類の名前）・`title`・`paths`（`[.mindstella/{種類}.yaml]`。`paths_base` のワークスペースの直下から解かれる）・`schema`（`schemas/{種類}.schema.json`）・`records: items`・`body_file: body`・`write_dates: false`（project-index に `created`・`updated` を付けさせない。日時は `history.yaml` が持つ）・`metadata`（共通のキーと列の対応）'
      - name: paths_base
        title: 配信元の基準
        type: string
        not_null: true
        description: 配信元の基準のフォルダ。`..`（ワークスペースの直下）にして、項目の `body` が直下の `docs/` の本文を指せるようにする。project-index は配信元の基準のフォルダの外部の本文を返却しない
        example: ..
  - name: schemas/
    title: 記録のスキーマ
    datastore: JSON
    summary: '`dev-docs.yaml` の行が指す、種類ごとのスキーマと共通のキーのスキーマ'
    scale: 8 ファイル
    access: ファイル名で引く
    description: プラグインの `skills/mindmap/schemas/` の種類ごとの 7 つのスキーマと `common.schema.json` の複製。ワークスペースの作成と移し替えが書き、移し替えのたびにプラグインのバージョンで置き換える。project-index の `write_docs` が書き込む前に突き合わせる
    columns:

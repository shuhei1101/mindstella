      - IF-489-30#
      - IF-489-31#
    status: planned
    introduced:
      pr: 325
  - name: files/
    title: ファイルのフォルダ
    datastore: ファイル
    summary: 資料に埋め込む動画・音声・画像などのファイル。資料の本文から `../files/{名前}` で指す。記録ではなく、変更の検知は見ず、ワークスペースを作ったときには作らない

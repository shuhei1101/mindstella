    - from: 資料
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1
      label: body
    - from: 会話ログ
      to: 本文
      from_column: body
      to_column: ファイル名
      from_cardinality: '1'
      to_cardinality: 0..1
      label: body
    - from: 送信

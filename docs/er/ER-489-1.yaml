    columns:
      - name: target
        title: 向けた項目
        type: string
        not_null: false
        description: 入力欄が向ける項目の ID。項目に紐づかないコメントの入力欄はキーを持たない
        example: D-22
      - name: loc
        title: 箇所
        type: object
        not_null: false
        description: 入力欄に添えた箇所。構造は `comments.yaml` の `loc` と同じ
      - name: body
        title: 本文
        type: string
        not_null: true
        description: 下書きの本文。1〜10000 文字（空白だけも保つ）
        example: 案 B も見たい
      - name: updated
        title: 書いた日時
        type: string
        not_null: true
        auto: 更新日時
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-05T03:00:00+00:00'
      - name: thread
        title: 返信先のスレッド
        type: string
        not_null: false
        description: スレッドの返信の入力欄の下書きのとき、そのスレッドの ID。持つときは `target`・`loc` を持たない
        example: TH-3
  - name: docs/{ID}.html
    title: HTML の本文
    datastore: HTML
    summary: 資料の HTML の本文。メタデータは持たず、`docs.yaml` の `body` から指される
    access: ファイル名で引く
    columns:
      - name: (本文)
        title: 本文
        type: string
        description: HTML の本文（文書全体でも断片でもよい）。書き込みは project-index の `write_docs`（項目の `body` が指すファイル）が行い、ファイル名は項目の ID に揃える。サーバーは中身を解釈・実行せず、画面はスクリプトを動かさない枠に描く。同じ項目の `{ID}.mark.md` とは並んで持たない
  - name: threads.yaml
    title: スレッド
    datastore: YAML
    summary: 利用者と AI が書き込みを積むスレッド。状態・タグ・要約・クローズとオープンへの戻しの記録を持つ
    primary_key: id
    scale: ~1000
    growth: まとめて送信した新規スレッドの分と、AI が立てるたびに 1 件追加する。書き込みは返信のたびに追加する
    deletion: 削除しない（クローズにして残す）
    access: 全件
    description: '`items:` の配列を持ち、1 要素 = 1 件のスレッド。初めてスレッドを作ったときにサーバーが作り、無ければ 0 件として扱う。書くのはサーバーのまとめて送信（`POST /api/comments/send`）・状態の書き換え（`PATCH /api/threads/{id}`）・利用者の既読（`POST /api/threads/{id}/seen`）・スレッドの MCP のツール・未読へ戻すスクリプトだけで、project-index の配信の対象にしない。共通のキー（`common.schema.json`）は持たない。並びは ID の連番の小さい順（立てた順）。前のバージョンの送信（`submissions.yaml`）は移し替えの手順でここへ移す'
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: '`TH-` + 連番。連番は最大 + 1 で、番号を使い回さない'
        example: TH-3
      - name: status
        title: 状態
        type: string
        not_null: true
        description: スレッドの状態
        enum_values: "'open'（オープン） / 'closed'（クローズ）"
      - name: tags
        title: タグ
        type: array
        not_null: true
        default: '[]'
        description: AI が付けるタグ（文字列）。記録の話題のタグと同じく、どの文字列でも持てる
        example: '[起票]'
      - name: summary
        title: 要約
        type: string
        not_null: false
        description: 何の話で、どう決着したか。AI が書き、まだ書いていなければ `null`。前後の空白を除いて 1〜400 文字
        example: D-12 の失敗時の扱いの相談。案 B（コピーから戻す）で決まった
      - name: target
        title: 向けた項目
        type: string
        not_null: false
        description: 最初の書き込みを向けた項目の ID（どの種類でもよい）。立てたときにワークスペースにあった項目。項目に紐づかないスレッドはキーを持たない
        example: D-22
      - name: loc
        title: 箇所
        type: object
        not_null: false
        description: 最初の書き込みに添えた箇所。構造は `comments.yaml` の `loc` と同じ。`target` を持つときだけ持つ
      - name: posts
        title: 書き込み
        type: array
        not_null: true
        description: 書いた順。1 件以上
      - name: posts[].id
        title: 書き込みの ID
        type: string
        not_null: true
        auto: 採番
        description: '`{スレッドの ID}-` + スレッドの中の連番（1 始まり）'
        example: TH-3-2
      - name: posts[].author
        title: 書き手
        type: string
        not_null: true
        description: 書いたのは誰か
        enum_values: "'user'（利用者） / 'ai'（AI）"
      - name: posts[].body
        title: 本文
        type: string
        not_null: true
        description: 前後の空白を除いて 1〜10000 文字
        example: 案 A にする
      - name: posts[].created
        title: 書いた日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601。利用者の書き込みは送信した日時
        example: '2026-10-12T03:00:00+00:00'
      - name: posts[].read
        title: AI の既読
        type: boolean
        not_null: true
        description: AI が `thread` で読んだか。利用者の書き込みは `false` で追加し、AI の書き込みは `true` で追加する。セッションを開いたときに全て `false` に戻す
      - name: posts[].taken
        title: 取り込んだ日時
        type: string
        not_null: false
        description: 利用者の書き込みだけが持つ。AI が取り込み済みにした日時（UTC のタイムゾーン付き ISO 8601）。取り込んでいなければ `null`。未読に戻しても削除しない
      - name: posts[].comment
        title: 元のコメント
        type: string
        not_null: false
        description: まとめて送信したレビュー中のコメントの ID。まとめて送信する途中で落ち、同じコメントがレビュー中に残ったとき、次に送信したときに二重に追加しないために持つ。AI の書き込みと、移し替えた送信はキーを持たない
        example: C-1
      - name: events
        title: 状態の記録
        type: array
        not_null: true
        description: クローズとオープンへの戻しの記録。書いた順。無ければ空
      - name: events[].kind
        title: 種類
        type: string
        not_null: true
        description: 変えた後の状態
        enum_values: "'closed'（クローズにした） / 'reopened'（オープンに戻した）"
      - name: events[].author
        title: 書き手
        type: string
        not_null: true
        description: 状態を変えたのは誰か
        enum_values: "'user'（利用者） / 'ai'（AI）"
      - name: events[].reason
        title: 理由
        type: string
        not_null: false
        description: 任意の理由。前後の空白を除いて 1〜400 文字。書かなければ `null`
        example: 案 A で決着
      - name: events[].created
        title: 変えた日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601
      - name: posts[].seen
        title: 利用者の既読
        type: boolean
        not_null: true
        description: 利用者がプレビューでそのスレッドを開いたか。AI の書き込みは `false` で追加し、利用者の書き込みと移し替えた送信は `true` で追加する。画面でスレッドを開いたとき（`POST /api/threads/{id}/seen`）にそのスレッドの全てを `true` にする。セッションを開いたときに戻すのは AI の既読 `read` だけで、このキーは戻さない
  - name: edits.yaml
    title: 保存待ちの編集
    datastore: YAML
    summary: プレビューで利用者が溜め、まだ保存していない項目と設定の編集
    primary_key: id
    scale: ~100
    growth: 詳細パネル・設定の画面・追加の入力で溜めるたびに 1 件追加するか書き換える
    deletion: 1 件ずつの取り消しと、まとめて保存したときに物理削除する（保存したものは項目・設定・`changes.yaml` へ移る）
    access: 全件
    description: 最上位に `seq`（最後に振った編集の連番）・`new_seq`（最後に振った追加する項目の仮の ID の連番）と `items:` の配列を持ち、1 要素 = 1 件の編集。どちらの連番も振った番号を使い回さない。初めて溜めたときにサーバーが作り、無ければ 0 件として扱う。書くのはサーバーの保存待ちの編集の受け付け（`/api/edits`）だけで、project-index の配信の対象にしない。共通のキー（`common.schema.json`）は持たない。並びは連番の小さい順（溜めた順）。保存で書き込めなかった理由はここに書かず、保存の応答だけが返す
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: '`E-` + 連番。連番は `seq` + 1'
        example: E-3
      - name: target
        title: 編集するもの
        type: string
        not_null: true
        description: 編集する項目の ID（どの種類でもよい）、追加する項目の仮の ID（`new-` + 連番。連番は `new_seq` + 1）、または設定（`settings`）
        example: D-17
      - name: op
        title: 編集の種類
        type: string
        not_null: true
        description: 編集の種類
        enum_values: "'set'（項目のキー 1 つか本文を書き換える）/ 'option-add'（案を 1 つ追加する）/ 'option-edit'（案 1 つの中身を書き換える）/ 'option-remove'（案を 1 つ削除する）/ 'adopt'（採用する案を切り替える）/ 'item-add'（項目を 1 つ追加する）/ 'item-remove'（項目を 1 つ削除する）/ 'setting'（設定のキー 1 つを書き換える）"
        example: set
      - name: key
        title: キー
        type: string
        description: '`set` は項目のキー（本文は `body`）、`option-*`・`adopt` は案の記号、`item-add` は種類（`decisions` などファイル名の頭）、`setting` は設定のキー。`item-remove` はキーを持たない'
        example: answer
      - name: value
        title: 編集した後の値
        type: string / number / boolean / object / array
        description: そのキーの型の値。`adopt` は採用する案の記号（採用を外すときは `null`）、`item-add` は追加する項目のキーと値のオブジェクト。`option-remove`・`item-remove` は `null`
        example: ゴールはフェーズごとに 1 つ持つ
      - name: before
        title: 元の値
        type: string / number / boolean / object / array
        description: 最初に溜めたときの元の値。保存待ちのパネルの「前 → 後」と、設定の編集で保存の前に書き換わったかの確かめに使う。`option-add`・`item-add` は `null`
        example: '-'
      - name: base
        title: 溜めたときの更新日時
        type: string
        description: 項目への編集（`item-add`・`setting` を除く）のとき、最初に溜めた時点のその項目の `updated`（`history.yaml`）。保存のときに今の `updated` と違えば、溜めた後に書き換わった編集として書き込まない
        example: '2026-10-07T01:18:00+00:00'
      - name: created
        title: 溜めた日時
        type: string
        not_null: true
        auto: 作成日時
        description: 最初に溜めた日時（UTC のタイムゾーン付き ISO 8601）。同じ編集を書き換えても変えない
        example: '2026-10-21T05:02:00+00:00'

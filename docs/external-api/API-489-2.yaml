id: API-489-2
title: voice-paste
version:
  api_version: 'v0.7.1（shuhei1101/voice-paste の release。`/web/` の下の Origin の無い POST は #256 から）'
  checked_on: '2026-11-09'
auth:
  method: なし（Host が `127.0.0.1`・`localhost` で、Origin を付けない要求だけを受ける）
endpoints:
  - name: GET /web/glossary-presets
    method: GET
    path: /web/glossary-presets
    summary: 用語集のプリセットの名前の一覧（`presets`）と、voice-paste の設定で選んでいるプリセット（`active`）を返す。文字起こしのインターフェースの voice-paste の実装が、使えるかの確かめとプリセットの候補に使う。200 なら使える、404 なら音声を受け付ける口が無い（`unsupported`）、接続を断られた・応答の上限を超えたなら届かない（`stopped`）、それ以外のステータスも `stopped` と同じに扱って標準エラーにステータスを記録する
    status_codes:
      - code: '200'
        condition: 一覧を返した
      - code: '404'
        condition: voice-paste が Linux で動いている（`/web/` の下のルートが無い）
  - name: POST /web/transcriptions
    method: POST
    path: /web/transcriptions
    summary: '`multipart/form-data` の `audio`（音声のファイル）と任意の `glossary_preset` を受けてジョブを積み、202 と `job_id` を返す。本文の上限は 100,000,000 バイト。voice-paste の実装は `audio` のファイル名に `Content-Type` の形の拡張子を付け、`Origin` を付けずに送る（Origin の無い POST は Host が `127.0.0.1`・`localhost` のときだけ受ける。shuhei1101/voice-paste#256）。404 は口が無い、接続できないのは届かない、それ以外の 4xx・5xx は依頼を受け付けなかったと読み替える'
    status_codes:
      - code: '202'
        condition: 受け付けた（`job_id`）
      - code: '400'
        condition: '`audio` が無い・一覧に無い `glossary_preset`'
      - code: '404'
        condition: Linux で動いている
      - code: '413'
        condition: 本文が上限以上
      - code: '415'
        condition: 音声として読めない
      - code: '503'
        condition: 終わっていないジョブが待ちの上限に達している
  - name: GET /web/transcriptions/{job_id}
    method: GET
    path: /web/transcriptions/{job_id}
    summary: ジョブの `state`（`queued`・`running`・`done`・`failed`）・`progress`（0.0〜1.0）・`text`（`done` のとき）・`error`（`failed` のとき）を返す。voice-paste の実装は、非機能要件「文字起こしの状態を取りに行く間隔」ごとに読み、`done` で起こした文字、`failed` で失敗とし、`state` と `progress` が非機能要件「文字起こしの待ちの上限」の間変わらなければ進まないとして打ち切る
    status_codes:
      - code: '200'
        condition: 状態を返した
      - code: '404'
        condition: ジョブが無い（voice-paste を再起動した・終わったジョブを持つ件数を超えた）か、Linux で動いている
lead: 録音を文字に起こし、用語集で補正して返す、同じ端末で動く音声入力のサービス（shuhei1101/voice-paste の常駐アプリ）。mindstella の常駐サーバーが、文字起こしのインターフェースの実装の 1 つとして呼ぶ。
used_in:
  - plugins/mindstella/skills/mindmap/scripts/voice_paste.py
verification:
  state: 未確認
  detail: 2026-11-09 に確かめようとしたが、voice-paste が Windows で起動しておらず（WSL と Windows のどちらからも `127.0.0.1:47823` に接続できない）、動かせなかった。起動は利用者の操作が要る
base_urls:
  - env: 全て
    url: http://127.0.0.1:47823
official_url: https://github.com/shuhei1101/voice-paste
docs_url: https://github.com/shuhei1101/voice-paste/tree/develop/dev/設計書/インターフェース定義/常駐アプリ

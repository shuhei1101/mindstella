repository:
  style: モノレポ
  repositories:
    - name: shuhei1101/mindstella
  layout: '`.claude-plugin/`（マーケットプレイスのマニフェスト）/ `plugins/mindstella/.claude-plugin/`（プラグインのマニフェスト）/ `plugins/mindstella/version.ini`（プラグインの版）/ `plugins/mindstella/bin/`（起動スクリプト `mindstella`）/ `plugins/mindstella/skills/setup/`・`plugins/mindstella/skills/session/`・`plugins/mindstella/skills/upgrade/`（スキル。SKILL.md と `steps/`）/ `plugins/mindstella/skills/mindmap/`（スキルが共通で読む `references/`・`playbooks/`・`README.md` と、サーバーの `schemas/`・`scripts/`・版ごとの移し替えの手順 `migrations/`・プレビューの `preview/`（React の画面のビルドの出力 `preview/spa/` を含む）。SKILL.md は持たない） / `frontend/`（React の画面のソースと OpenAPI の定義。利用者へは配らない） / 直下の `package.json`・`vite.config.ts`・`eslint.config.js`・`lefthook.yml`・`.storybook/`（今の画面の部品）・`.storybook-react/`（React の部品）'
  notes: マーケットプレイスはリポジトリの直下の `.claude-plugin/` に置き、プラグインを `./plugins/mindstella` で指す。プラグインは `plugins/mindstella/` の下に分け、利用者へ配るのはその中身だけにする。
subsystems:
  - name: プラグイン
    scope: plugin
    role: マーケットプレイスとプラグインのマニフェスト・常駐サーバーへの接続の設定（`.mcp.json`）・フック。Claude Code にスキルを読み込ませ、常駐サーバーへつながせる入口
    runtime: JSON（Claude Code が読む）
    runs_on: 利用者の端末の Claude Code
  - name: スキル
    scope: skill
    role: 会話の進め方の手順（セットアップ `setup`・話し合いの進行 `session`・ワークスペースの移し替え `upgrade` の 3 つ）。ワークスペースへの記録はサーバーの MCP のツールで行い、リサーチはサブエージェントに任せる
    runtime: Markdown（Claude Code が読む手順）
    runs_on: 利用者の端末の Claude Code
    status: implemented
  - name: プレビュー
    scope: preview
    role: サーバーが配るワークスペースの記録を読み返し、詳細パネルから項目ごとに回答・意見を送る画面。配る書き出しは記録を中に持つ見るだけの 1 枚の HTML
    runtime: TypeScript（今の画面は tsc が生成した JavaScript、React の画面（SPA）は Vite と React Compiler でビルドした JavaScript をブラウザで動かす）
    runs_on: 利用者の端末のブラウザ（サーバーの配信の URL で開く。React の画面は同じ配信の `/spa/` で開く。配る書き出しはファイルとして開く）
    status: implemented
  - name: サーバー
    scope: server
    role: 端末に 1 つの常駐のプロセスで、MCP のツール（ワークスペースの YAML の読み書き・検索・影響の洗い出し・点検・配る書き出し・送信の取り込み・常駐サーバーの状態と停止）と、プレビューの配信・送信の受け付けと、MindStella の API（ワークスペースの作成・クローズ、MindStella のセッションの作成・一覧・停止）を持つ。MindStella のセッションは tmux のペインの中で起動する。起動のコマンドは、MindStella の API でワークスペースと MindStella のセッションを作ってそのペインへつなぐ。並行する複数のセッションが 1 つの常駐サーバーを共有し、複数のワークスペースを扱う
    runtime: Python 3（起動スクリプトは bash）
    runs_on: 利用者の端末（systemd --user が使える端末ではユニット `mindstella.service`、使えない端末では SessionStart のフックか起動のコマンドが、落ちていればバックグラウンドで起動する常駐サーバー。`127.0.0.1` の `MINDSTELLA_PORT`（無ければ 8784）で待ち受ける。配信は `127.0.0.1` の空きポートか、`config.yaml` の `preview.port` で固定したポート。状態は `${XDG_STATE_HOME:-~/.local/state}/mindstella/`）
    status: implemented
external_systems:
  - name: Claude Code
    purpose: プラグインの読み込み・スキルの手順の実行・サーバーの MCP のツールの呼び出し
    direction: 双方向
    protocol: プラグインのマニフェスト（JSON）/ スキル（Markdown）/ フック（標準入出力の JSON）/ MCP（Streamable HTTP の JSON-RPC）
    notes:
      事前確認: 要。起動スクリプトが、`PATH` に `claude` があることと、`claude plugin list --json` に mindstella があることを確かめ、無ければ Claude Code を立てずに止まる。常駐サーバーは、SessionStart のフックと起動スクリプトが `GET /_admin/status` で待ち受けているかを確かめ、落ちていれば起動する。。MindStella のセッションは、SessionStart のフックが状態に登録したことで準備ができたと判定し、上限まで待つ
    detail: LIB-489-4#
  - name: jsDelivr
    purpose: プレビューの描画のライブラリ（mdmark・marked・elkjs・mermaid）と差分の計算のライブラリ（jsdiff）の取得。サーバーが配るプレビューは開いたブラウザが読み、配る書き出し（`export`）は書き出すときに取って中に持つ
    direction: 受信のみ
    protocol: HTTPS
    notes:
      事前確認: 要。サーバーが配るプレビューは、開いた時点で、描画のライブラリが読み込めたかを確かめる。読み込めなかったときは、読み込めなかったライブラリの名前を画面に出す。`export` は、書き出すときに `https://cdn.jsdelivr.net/npm/{package}@{version}/{path}`（mdmark は `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@{version}/dist/{path}`）から配布ファイルとライセンスの本文を取る。1 回の要求で接続と 1 回の読み取りをそれぞれ 30 秒まで待ち、取れなければ何も書かずにエラーで終える。配る書き出しを開くときは通信しない。
    refs:
      - LIB-489-13#
      - LIB-489-11#
      - LIB-489-5#
      - LIB-489-14#
  - name: Google Fonts
    purpose: プレビューの文字（Inter・Noto Sans JP・JetBrains Mono）の取得
    direction: 受信のみ
    protocol: HTTPS
    detail: API-489-1#
    notes:
      事前確認: 不要。読めないときは端末の文字で描き、画面の操作は変わらない。配る書き出しは文字を読まず、常に端末の文字で描く。
  - name: tmux
    purpose: 起動スクリプトが立てるセッションの中で、Claude Code を動かす。サーバーは、まとめて送られた送信を、そのワークスペースを指してツールを呼んだセッションのペインへ入力する
    direction: 送信のみ
    protocol: tmux のコマンド（起動スクリプトは `new-session`・`has-session`・`attach-session`、サーバーはフックから受けたソケットを `-S` で指して `display-message`・`load-buffer`・`paste-buffer`・`send-keys`）
    detail: LIB-489-26#
    notes:
      事前確認: 要。起動スクリプトが、`PATH` に `tmux` があることを確かめ、無ければ Claude Code を立てずに止まる。
  - name: 文字起こしのサービス（voice-paste）
    purpose: コメント・返信の入力で録音した音声を文字に起こす。サーバーは文字起こしのインターフェース（抽象）経由で呼び、画面とサーバーのほかの処理はサービスに直接依存しない
    direction: 双方向
    protocol: HTTP（`MINDSTELLA_TRANSCRIBER_URL`。既定は `http://127.0.0.1:47823`。Origin を付けない）
    detail: API-489-2#
    notes:
      事前確認: 要。画面が開いたときと設定の画面を開いたときに、サーバーが『文字起こしの可否』で用語集のプリセットの一覧を尋ね、届かない・音声を受け付ける口が無いときはマイクのボタンを押せなくして理由を出す。サービスが無くても、マイクのボタンのほかの操作は変わらない。voice-paste は Windows で動くため、WSL の常駐サーバーから `127.0.0.1` で届くには WSL のネットワークを mirrored にする（届かないときは `stopped` と同じに扱う）
  - name: claude-balancer
    purpose: MindStella のセッションの Claude Code のアカウントを貸す。セッションの管理が `claude-balancer exec` で借りる（D-292）
    direction: 送信のみ
    protocol: CLI（`claude-balancer exec --client mindstella -- claude …`）
    detail: LIB-531-1#
    notes:
      事前確認: 要。セッションの管理が起動のたびに `PATH` に `claude-balancer` があるかを確かめ、無ければ利用者の既定のアカウントで起動する。空いたアカウントが無いときは 503 を返す
  - name: project-index
    purpose: ワークスペースを配信元の行として登録・クローズする。グローバルの設定のファイルの場所と、許可するフォルダのキーを読む（D-300）
    direction: 双方向
    protocol: HTTP（`http://127.0.0.1:${PROJECT_INDEX_PORT:-8786}` の `/settings/sources`）
    detail: API-531-1#
    notes:
      事前確認: 要。『ワークスペースの作成』と『ワークスペースのクローズ』が呼ぶたびに確かめ、届かない・エラーのときは 502 を返して、作成ではこの依頼で作った記録を消す
  - name: systemd --user
    purpose: 常駐サーバーをユニットとして起動・停止する
    direction: 送信のみ
    protocol: CLI（`systemctl --user`）
    detail: LIB-531-2#
    notes:
      事前確認: 要。『常駐サーバーの起動の確認』が `systemctl --user show-environment` で使えるかを確かめ、使えない端末では新しいセッションで起動する
lead: mindstella のサブシステムと、Claude Code・tmux・ブラウザ・CDN との境界。
constraints: |-
  - プラグインは、常駐サーバーへの接続をルートの `.mcp.json` に `type: http` で書き、`hooks/hooks.json` に SessionStart（未読へ戻す・常駐サーバーの起動の確認）と PreToolUse（セッションの値の注入）のフックを持つ。`plugin.json` には MCP サーバーを書かない
  - 他のスキル・外部の仕組みに依存しない
  - スキル・サーバー・プレビューの中で、特定の開発基盤の名前を出さない
  - サーバーは Claude Code のセッションと別に常駐し、セッションを閉じても止まらない。止めるのは `server_stop` か SIGTERM・SIGINT。MCP と配信は `127.0.0.1` だけで待ち受ける
  - ネットがある前提で、サーバーが配るプレビューは描画のライブラリを CDN から、文字を Google Fonts から読み、配る書き出し（`export`）は書き出すときに取った描画のライブラリを中に持つ

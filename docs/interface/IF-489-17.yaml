id: IF-489-17
title: "プレビューの URL"
entry:
  kind: mcp_tool
  value: '`preview_url`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__plugin_mindstella_mindstella__preview_url`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 初めて呼ぶと配信を立て、127.0.0.1 の URL を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant P as プレビューの配信
        participant WS as ワークスペース

        クライアント->>IF: preview_url workspace
        IF->>P: 127.0.0.1 の空きポートで立てる
        IF->>WS: 直下の README.md のプレビューのセクションを URL にして書き直す
        IF-->>クライアント: JSON（url・started: true）
      ```
    expected:
      - ツールのエラーにならない
      - '`url` が `http://127.0.0.1:` で始まって `/w/{workspace}/mindstella.html` で終わり、`started` が真'
      - '`url` を GET すると 200 が返る'
      - ワークスペースに `preview.html` が無い
      - 直下の `README.md` のプレビューのセクションに `url` がある
    test: test_normal
  - name: 正常系（2 回目）
    summary: 同じワークスペースで再呼び出しすると、同じ URL を返して配信を増やさない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース。`preview_url` を 1 回呼んでおく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）

        クライアント->>IF: preview_url workspace
        IF-->>クライアント: JSON（同じ url・started: false）
      ```
    expected:
      - ツールのエラーにならない
      - '`url` が 1 回目と同じで、`started` が偽'
    test: test_normal_when_called_again
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すと配信を立てずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: preview_url workspace
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（設定がスキーマに合わない・SchemaMismatchError）
    summary: '`config.yaml` がスキーマに合わないと、違う箇所を返して配信を立てない'
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `display.visible_kinds` を `[rainbow]` に直接書き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: preview_url workspace
        IF-->>WS: config.yaml を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `config.yaml: display.visible_kinds` で始まり、選べる値を含む行がある'
      - 同じワークスペースでもう一度呼ぶと、配信を立てずに同じエラーになる（配信が立っていない）
    test: test_error_when_config_invalid
  - name: 正常系（利用者が書いた README がある）
    summary: 自動で書いたマーカーの無い README.md は書き換えずに配信を立てる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、直下の `README.md` を `# 家計簿アプリの話し合い` だけに置き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant P as プレビューの配信
        participant WS as ワークスペース

        クライアント->>IF: preview_url workspace
        IF->>P: 127.0.0.1 の空きポートで立てる
        IF-->>WS: README.md の 1 行目が自動で書いたマーカーでない（書かない）
        IF-->>クライアント: JSON（url・started: true）
      ```
    expected:
      - ツールのエラーにならない
      - '`started` が真'
      - '`README.md` の中身と更新日時が呼ぶ前と同じ'
    test: test_normal_when_user_readme_exists
  - name: 正常系（起動時のフック）
    summary: 配信を立てたときだけ、起動時のフックをポート・ワークスペースの名前・画面のパスを追加して呼ぶ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 常駐サーバーの ID の一覧に無いワークスペース（『ワークスペースの作成』を通さずに `.mindstella/config.yaml` を置いたフォルダ）
      - name: 起動時のフック
        description: '`MINDSTELLA_PREVIEW_START_HOOK` に、受け取った引数をテストの一時フォルダのファイルへ 1 行ずつ追記するコマンド'
        notes: '`preview_url` を 2 回呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant HK as 起動時のフック

        クライアント->>IF: preview_url workspace
        IF->>HK: {コマンド} {ポート} {フォルダの名前} {画面のパス}
        IF-->>クライアント: JSON（url・started: true）
        クライアント->>IF: preview_url workspace
        IF-->>クライアント: JSON（同じ url・started: false）
      ```
    expected:
      - フックの追記するファイルに 1 行だけあり、`url` のポートとワークスペースのフォルダの名前が並ぶ
      - '`MINDSTELLA_PREVIEW_START_HOOK` を存在しないコマンドにしても、ツールのエラーにならず `url` を返す'
    test: test_normal_when_start_hook_set
  - name: 正常系（まとまりを指す）
    summary: diff を渡すと、そのまとまりの差分を開くハッシュを付けた URL を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` し、まとまり V-1 を持つワークスペース。常駐サーバーの ID の一覧に無く、ツールを呼ぶ常駐サーバーではこのワークスペースの配信を起動していない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant WS as ワークスペース
        participant P as プレビューの配信

        クライアント->>IF: preview_url workspace diff=V-1
        IF->>WS: changes.yaml を読み、sets に V-1 がある
        IF->>P: このワークスペースを常駐サーバーのポートで配り始める
        IF-->>クライアント: JSON（#diff=V-1 を付けた url・started: true）
      ```
    expected:
      - ツールのエラーにならない
      - '`url` が `http://127.0.0.1:` で始まり `/w/{workspace}/mindstella.html#diff=V-1` で終わる'
      - 直下の `README.md` のプレビューのセクションの URL がハッシュを持たない
      - 同じワークスペースで `diff` を渡さずに再呼び出しすると、ハッシュの無い同じポートの `url` が返り、`started` が偽
    test: test_normal_when_diff_given
  - name: 異常系（記録に無いまとまり・引数の誤り）
    summary: changes.yaml に無いまとまりを diff に渡すと、配信を立てずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` し、まとまり V-1 だけを持つワークスペース。常駐サーバーの ID の一覧に無く、ツールを呼ぶ常駐サーバーではこのワークスペースの配信を起動していない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: preview_url workspace diff=V-99
        IF-->>WS: changes.yaml の sets に V-99 が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: 引数の誤り: diff:` で始まり、`V-99` を含む'
      - 同じワークスペースで `diff` を渡さずに呼ぶと `started` が真（配信が立っていなかった）
    test: test_error_when_diff_not_found
  - name: 正常系（配っている間にまとまりを指す）
    summary: 既に配っているワークスペースで diff を渡すと、同じポートでハッシュを付けた URL を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` し、まとまり V-1 を持つワークスペース。`diff` を渡さずに `preview_url` を 1 回呼んでおく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: preview_url workspace diff=V-1
        IF->>WS: changes.yaml を読み、sets に V-1 がある
        IF-->>クライアント: JSON（同じポートで #diff=V-1 を付けた url・started: false）
      ```
    expected:
      - ツールのエラーにならない
      - '`url` が 1 回目の `url` の末尾に `#diff=V-1` を付けたもので、`started` が偽'
    test: test_normal_when_diff_given_while_serving
  - name: 異常系（配っている間に記録に無いまとまり・引数の誤り）
    summary: 既に配っているワークスペースでも、changes.yaml に無いまとまりを diff に渡すとツールのエラーになる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` し、まとまり V-1 だけを持つワークスペース。`diff` を渡さずに `preview_url` を 1 回呼んでおく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: preview_url workspace diff=V-99
        IF-->>WS: changes.yaml の sets に V-99 が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: 引数の誤り: diff:` で始まり、`V-99` を含む'
      - 1 回目の `url` を GET すると 200 が返る（配信は止まらない）
    test: test_error_when_diff_not_found_while_serving
  - name: 異常系（ワークスペースの ID が重なる・WorkspaceIdConflictError）
    summary: 配っている別のフォルダと ID が同じフォルダを指すと、配らずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース A と、A のフォルダを丸ごとコピーしたフォルダ B（`config.yaml` の `id` が A と同じ）
        notes: A で `preview_url` を呼んでから B で呼ぶ。起動時のフックに、受け取った引数をテストの一時フォルダのファイルへ追記するコマンドを渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）

        クライアント->>IF: preview_url A
        IF-->>クライアント: JSON（url）
        クライアント->>IF: preview_url B
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - B の呼び出しがツールのエラーになり、本文に重なった ID と A のフォルダの絶対パスがある
      - A の `url` を GET すると、A の記録の画面が返る
      - B の直下の `README.md` が呼ぶ前と同じで、フックの追記するファイルに B の行が無い
    test: test_error_when_workspace_id_conflicts
  - name: 正常系（フォルダを移した）
    summary: 配っているフォルダを移した先を指すと、前のフォルダの配信をやめて移した先を同じ URL で配る
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`config.yaml` に `id` を持つワークスペース A。`preview_url` を 1 回呼んでから、A のフォルダを別のパスへ改名する'
        notes: 起動時のフックと終了時のフックに、受け取った引数をテストの一時フォルダのファイルへ追記するコマンドを渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as preview_url（MCP のツール）
        participant HK as フック

        クライアント->>IF: preview_url A
        IF-->>クライアント: JSON（url・started: true）
        クライアント->>IF: preview_url 改名した先
        IF->>HK: 終了時のフック（前のフォルダ）
        IF->>HK: 起動時のフック（改名した先）
        IF-->>クライアント: JSON（同じ url・started: true）
      ```
    expected:
      - ツールのエラーにならず、`url` が 1 回目と同じで、`started` が真
      - '`url` の `/api/records` を GET すると、改名した先の記録が返る'
      - 終了時のフックの追記するファイルに前のフォルダの名前の行が 1 行、起動時のフックの追記するファイルに改名した先の名前の行がある
    test: test_normal_when_folder_moved
lead: ワークスペースのプレビューを配る URL を返す。まだ配っていないワークスペース（常駐サーバーの ID の一覧に無いフォルダか、設定が検査に通らず配っていなかったワークスペース）は、常駐サーバーのポートで配り始める（配信を立てる）。
idempotent: true
side_effects: まだ配っていないワークスペース（『プレビューの配信』の制約「配るワークスペース」）について、このプロセスの中に配信（『プレビューの配信』『記録の取得』『書き換えの通知』・『設定の既定の書き換え』・『設定の再読み込み』と、レビュー中のコメント・下書き・まとめて送信の受け付け）を立てる。配信を立てたときは、直下の `README.md` を『README の書き出し』と同じ判定・書き方で書き直す。`.mindstella/` には書かない
callers:
  - IF-565-1#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ（`.mindstella/` が無く直下に `config.yaml` か `mindmap.yaml` があるフォルダは WorkspaceNotFoundError。移し替えは『記録の形式の移行』）'
  - name: diff
    type: str | None
    required: false
    default: なし（`url` にハッシュを付けない）
    location: argument
    description: '`url` で差分を開くまとまりの ID（`V-{番号}`。`commit` が返した `id`）'
    constraints: '`changes.yaml` の `sets` にある ID。`since`・`pending` は受けない'
    example: V-2
response:
  - name: url
    type: str
    description: 配信の画面の URL（`http://127.0.0.1:{常駐サーバーのポート}/w/{workspace}/mindstella.html`。`{workspace}` は制約「画面のパス」）。`diff` を渡したときは、末尾にハッシュ `#diff={ID}` を付ける（インターフェース定義『プレビューを開く』の `diff`）
    example: http://127.0.0.1:8784/w/mindstella-notes-3f2a9c/mindstella.html
  - name: workspace
    type: str
    description: 配っているワークスペースの絶対パス
  - name: started
    type: bool
    description: この呼び出しで配信を立てたか。既に配っていたら偽（常駐サーバーの起動時から配っている ID の一覧のワークスペースは、初めて呼んでも偽）
exceptions:
  - name: なし（正常終了）
    condition: 配信の URL を返せた
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー。配信を立てない
  - name: SchemaMismatchError
    condition: 配信を立てる前に `config.yaml` をスキーマと突き合わせて合わない（このプロセスでまだ配っていないワークスペースのときだけ確かめる）。または、`diff` を渡した呼び出しで（既に配っているかによらず）`changes.yaml` がスキーマに合わないか YAML として読めない
    notes: 'ツールのエラー。エラーの本文に合わない箇所ごとの `config.yaml: {キーのパス}: {理由}`（`changes.yaml` のときは `changes.yaml: {キーのパス}: {理由}`）の行。まだ配っていなければ配信を立てない'
  - name: 引数の誤り
    condition: '`diff` が `changes.yaml` の `sets` に無い'
    notes: ツールのエラー。エラーの本文に渡した ID。まだ配っていなければ配信を立てない
  - name: WorkspaceIdConflictError
    condition: '`workspace` のワークスペースの ID が配っている別のフォルダの ID と同じで、そのフォルダに同じ ID の記録（`.mindstella/config.yaml`）が残っている'
    notes: ツールのエラー。エラーの本文に重なった ID と、既に配っているフォルダの絶対パス。配信を立てず、起動時のフックを呼ばず、`README.md` を書き直さない
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。'
constraints:
  - item: 結果の構造
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返却方法
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 待ち受け
    constraint: '常駐サーバーが `127.0.0.1` の `MINDSTELLA_PORT`（無ければ 8784）で待ち受ける経路で配る。ワークスペースごとにポートを開かない'
    decided_by: NFR-489-1#requirements[待ち受けの範囲]
  - item: 配信の数
    constraint: 1 つのプロセスの中で、ワークスペース（絶対パス）ごとに 1 つ。同じワークスペースで再呼び出しすると同じ URL を返す。ワークスペースの ID が配っている別のフォルダと同じフォルダは、配っているフォルダに同じ ID の記録が残っていれば（フォルダをコピーした・別の場所へクローンした）配らず、WorkspaceIdConflictError を返して既に配っているフォルダを変えない。残っていなければ（フォルダを移した）、前のフォルダの配信をやめて移した先を同じ URL で配る（『ワークスペースの作成』の制約と同じ基準）
  - item: 配信を止める時
    constraint: '常駐サーバーのプロセスが終わるとき（『MCP サーバーの起動』の終わり方。『常駐サーバーの停止』を含む）。ワークスペースを削除したとき（『ワークスペースの削除』。そのワークスペースだけ）。配っているフォルダを移した先を配り始めるとき（制約「配信の数」。前のフォルダだけ）。止めるときは、`MINDSTELLA_PREVIEW_STOP_HOOK` のコマンドを止めたワークスペースごとに呼ぶ（『設定: サーバー』）。ツールを呼んだセッションが終わっても、ワークスペースをクローズしても止めない。止めたワークスペースの画面のパスは 404 を返す'
  - item: 起動時の検査
    constraint: 配信を立てる前に `config.yaml` だけをスキーマと突き合わせる（種類ごとの YAML は『記録の取得』が読むたびに確かめる）。通った設定を、配信の「最後に検査に通った設定」の初めの値にする。既に配っているワークスペースでは確かめずに同じ URL を返す
  - item: README の更新
    constraint: 配信を立てた呼び出し（`started` が真）だけ、配信を立てた後に『README の書き出し』の制約「README の中身」「埋める値」「書き込むかの判定」「記載方法」で直下の `README.md` を書き直す。書けなくても配信は止めず、標準エラーに記録して URL を返す
  - item: 起動時のフック
    constraint: 'ワークスペースを配り始めたとき（この呼び出しで `started` が真のときと、『プレビューの配信』の制約「配るワークスペース」の常駐サーバーの起動時・ワークスペースの作成時）だけ、配り始めた直後に `MINDSTELLA_PREVIEW_START_HOOK` のコマンドを、末尾に常駐サーバーのポート・ワークスペースのフォルダの名前・画面のパス（`/w/{workspace}/mindstella.html`）を引数で追加して呼ぶ（『設定: サーバー』）。コマンドは新しいセッションで立て（`start_new_session`）、標準入出力をつながず、終わりを待たない。立てられない（コマンドが見つからない・引数を分けられない）ときは標準エラーに記録し、配信は止めずに URL を返す'
    decided_by: IF-489-1#constraints[終わり方]
  - item: まとまりを指す URL
    constraint: '`diff` は呼び出しのたびに（既に配っているワークスペースでも）`changes.yaml` を読んで `sets` にあるかを確かめる。あれば、配信の URL の末尾に `#diff={ID}` を付けて返す。まだ配っていなければ、配信を立てる前に確かめる。直下の `README.md` にはハッシュを付けない配信の URL を書く'
  - item: 画面のパス
    constraint: 画面と画面が呼ぶ全ての経路は `/w/{workspace}/` を先頭に持つ（『プレビューの配信』の制約「ワークスペースの区別」）。`{workspace}` はワークスペースの ID（`config.yaml` の `id`。無ければ『ワークスペースの作成』と同じ振り方でフォルダから振る）をパーセントエンコードしたもの
  - item: フローのワークスペース
    constraint: このインターフェース定義のフローの `make_workspace` は、ことわりが無い限り『ワークスペースの作成』を通さずに `.mindstella/config.yaml` を置いたフォルダ（常駐サーバーの ID の一覧に無く、`preview_url` が配り始める）。「作成を済ませた」とことわるワークスペースも同じで、「作成を済ませたワークスペース A」のように ID の一覧にあることを前提にするフローだけ、『ワークスペースの作成』で作る（異常系「ワークスペースの ID が重なる」の A）

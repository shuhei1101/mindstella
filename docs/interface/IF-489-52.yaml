      - D-1・A-1・R-1 が `phase`・`target`・`category`・`attrs`・`weight`・`deliverable`・`angles`・`confidence` を持たない
      - 'D-1 がタグ `topic:認証`・`topic:方式` を持ち、本文の末尾の表に `優先度: 高` がある'
      - R-1 の本文の末尾の表に、観点 `費用`・`運用` と確かさ `中` がある
      - '`.mindstella/release/` が呼ぶ前と同じ中身で残っている'
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョン'
      - 同じ呼び出しをもう一度当てても、ワークスペースが変わらない
    test: test_normal_when_discussion_keys_removed
lead: ワークスペースを開く前に、ワークスペースのバージョンとプラグインのバージョンを比べ、古ければ間のバージョンの移し替えの手順（`migrations/{バージョン}/steps.yaml`）を利用者に確認せずに順に当て、スキーマに合えばバージョンのファイルを書き換える。
idempotent: false
side_effects: '手順を当てる前に写しを取り（ワークスペースが git の作業ツリーの中ならワークスペースのパスだけをコミット、そうでなければフォルダの隣へ複製）、手順が書き換えるファイルを書き、値が要るキーに仮の値を入れ、`to_version` がプラグインのバージョンのときは `.mindstella/mindstella-version.ini` を書く。手順が失敗するかスキーマに合わなければ写しから戻す'
exclusivity: 呼ぶ側がワークスペースごとの鍵を取った中で呼ぶ。その上で『MCP サーバーの起動』の制約「同時の呼び出し」のとおり（プロセスの中の鍵の後に `.mindstella.lock` の排他ロックを取り、別のプロセスとも排他する）
callers:
  - IF-531-1#
  - IF-531-2#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml`、直下の `config.yaml`、直下の `mindmap.yaml`（v0.6.0 より前の版の設定ファイル）のどれかがあるフォルダ'
  - name: from_version
    type: str
    required: false
    default: なし（ワークスペースの版。『版の読み取り』のとおり、無ければ版を記録する前の形式）
    location: argument
    description: この版より後の手順を当てる
    constraints: '`v{メジャー}.{マイナー}.{パッチ}`'
  - name: to_version
    type: str
    required: false
    default: なし（プラグインの版。`plugins/mindstella/version.ini` の 1 行目）
    location: argument
    description: このバージョン以下の手順を当てる。プラグインのバージョンのときだけバージョンのファイルを書く（結合テストが手順を 1 つずつ当てるときに渡す）
    constraints: '`v{メジャー}.{マイナー}.{パッチ}`。`from_version` より前の版は渡さない'
response:
  - name: workspace_version
    type: str | None
    description: ワークスペースの版。版を記録する前の形式は `null`
  - name: plugin_version
    type: str
    description: プラグインの版
  - name: relation
    type: Literal['older', 'same', 'newer']
    description: プラグインの版と比べたワークスペースの版
  - name: steps[]
    type: list[{version, index, op, destructive, summary}]
    description: 当てた手順をバージョンの順・並びの順に並べたもの
  - name: steps[].version
    type: str
    description: 手順の版（`migrations/` のフォルダ名）
  - name: steps[].index
    type: int
    description: '`steps.yaml` の中の 1 始まりの番号'
  - name: steps[].op
    type: Literal['rename_file', 'move_dir', 'delete', 'rename_key', 'set_default', 'map_values', 'call']
    description: 操作
  - name: steps[].destructive
    type: bool
    description: 破壊的な操作（`rename_file`・`move_dir`・`delete`）か
  - name: steps[].summary
    type: str
    description: 手順の中身の 1 行
    example: docs.yaml の items[].done を status に名前を変える
  - name: backup
    type: '{kind, ref} | None'
    description: 取った写し。手順を当てたときだけ持つ
  - name: backup.kind
    type: Literal['git', 'copy']
    description: git のコミットか、フォルダの複製か
  - name: backup.ref
    type: str
    description: コミットの ID か、複製したフォルダの絶対パス
  - name: recorded
    type: str | None
    description: '書いたバージョン。書かなかったときは `null`'
  - name: provisional[]
    type: list[{file, key, value}]
    description: 手順を当てた後に値が要るキー（`set_default` の `ask`）に入れた仮の値。題名（`summary`）はフォルダの名前。MindStella のセッションが検討事項で利用者に確かめる
  - name: not_carried[]
    type: list[{item, key, value}]
    description: 移せずに記録から消えた値（mdmark の移行の報告が写さなかったとした値）。項目の ID・キー・消えた値の並び
exceptions:
  - name: なし（正常終了）
    condition: 手順を当ててバージョンを書いた、または当てる手順が無かった
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` も、直下の `config.yaml`・`mindmap.yaml` も無い'
    notes: 何も書き込まない
  - name: WorkspaceNewerError
    condition: ワークスペースのバージョンがプラグインのバージョンより新しい
    notes: '例外のメッセージに 2 つのバージョンと、プラグインを更新するよう書く。何も書き込まない'
  - name: StepFailedError
    condition: 手順を当てる途中で、手順が対象のファイルを読めない・書けない、または `call` の変換が例外を送った
    notes: 写しから戻してから、例外のメッセージに失敗した版・手順の番号・操作・理由を書く
  - name: SchemaMismatchError
    condition: '手順を当てた後に、ワークスペースのどれかの YAML がスキーマに合わない'
    notes: 写しから戻してから、メッセージに合わない箇所。バージョンのファイルを書かない
  - name: WriteFailedError
    condition: 写しを取れない、またはバージョンのファイルの書き込みに失敗した
    notes: 例外のメッセージに書けなかったパスと理由。写しを取れないときは手順を当てない
error_format: '例外のメッセージに内容を書く。手順の失敗は `{バージョン} の手順 {番号}（{操作}）: {理由}`。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。呼ぶ側（『ワークスペースの作成』など）がこのメッセージを応答の `detail` に入れる。'
constraints:
  - item: 版の比べ方
    constraint: '`v` を落とした 3 つの整数を左から比べる。版を記録する前の形式（版のファイルが無い）はどの版よりも古い'
  - item: 当てる手順
    constraint: '`plugins/mindstella/skills/mindmap/migrations/` の版のフォルダのうち、`from_version` より後で `to_version` 以下のものを版の順に、各 `steps.yaml` の並びの順に当てる。`from_version` が `to_version` 以上なら手順は空'
  - item: steps.yaml の形
    constraint: '`steps:` の並び。1 つの手順は `op` と操作ごとの引数を持ち、`schemas/migration-steps.schema.json` で点検する。合わなければ当てずに StepFailedError'
  - item: 操作と引数
    constraint: '`rename_file`（`from`・`to`）/ `move_dir`（`from`・`to`）/ `delete`（`path`）/ `rename_key`（`file`・`each_item`・`from`・`to`）/ `set_default`（`file`・`each_item`・`key`・`value` か `ask`）/ `map_values`（`file`・`each_item`・`key`・`map`）/ `call`（`script`。`scripts/{script}.py` の `migrate(root)` を呼ぶ）。資料を mdmark の今の書き方へ移す手順は `call` の `mdmark_documents` で、ワークスペースの `.mindstella/` に一時の mdmark の設定（`version: v0.10.0`・`build.include` に `docs/**/*.md`・`build.out` に mdmark の写しのフォルダ `.mdmark/` の下の HTML）を置き、`npx -y github:shuhei1101/mdmark#{設定の mdmark.version。latest は develop} upgrade --yes --config {一時の設定}` を呼ぶ。終了コード 0 なら、一時の設定に書き足された `map` を `config.yaml` の `mdmark.map` へ移し、一時の設定と mdmark の写し（`.mdmark/`）を消し、標準出力の移行の報告を手順の結果に入れる。0 以外なら標準出力と標準エラーを理由にして手順の失敗にする。パスはワークスペースからの相対、`each_item: true` は `items[]` の各項目に当てる'
  - item: 写し
    constraint: ワークスペースが git の作業ツリーの中にあり、ワークスペースの中に ignore されたファイル（`git ls-files --others --ignored --exclude-standard -- {ワークスペース}`）が 1 つも無いときだけ、ワークスペースのパスだけを `git add -A -- {ワークスペース}` して `git commit -- {ワークスペース}` でコミットする（変更が無ければ今の HEAD を写しにする。ワークスペースの外のステージされた変更はコミットに入れず、ステージされたまま残す）。そうでなければ、ワークスペースの隣の `{フォルダ名}.before-{to_version の版}`（あれば末尾に `-{日時}`）へ複製する。写しは成功しても消さない
  - item: 戻し方
    constraint: git の写しは、ワークスペースのパスをコミットの中身に戻し、コミットに無いファイルを消す。複製の写しは、ワークスペースの中身を消して複製から書き戻す
  - item: YAML の書き方
    constraint: '`safe_dump(allow_unicode=True, sort_keys=False)`。コメントは残らない。手順が触らない項目の `updated` は変えない'
  - item: 対象が無い・既にあるとき
    constraint: どの操作も、同じ手順を 2 度当てても結果が変わらないように振る舞う。`rename_key`・`set_default`・`map_values` は `file` が無ければ飛ばす。`rename_key` は `from` が無い項目を飛ばし、`from` と `to` が両方ある項目は StepFailedError。`map_values` は `key` が無い項目と `map` に無い値を変えない。`set_default` は `key` を既に持つ項目を変えず、`ask` でも `provisional` に返さない。`rename_file`・`move_dir` は `from` が無ければ飛ばし、`to` が既にあれば StepFailedError、`to` の親のフォルダが無ければ作る。`delete` は `path` が無ければ飛ばす。`call` の変換も同じ振る舞いで書く。手順が何も変えなかったファイルは書かない
  - item: v0.5.0 の手順
    constraint: '`call`（`field_to_playbooks`）の 1 手順。`mindmap.yaml` の `field` を `playbooks` の 1 件の配列へ移し、`field` を消す。`mindmap.yaml` か `field` が無ければ飛ばし、`field` と `playbooks` を両方持つときは StepFailedError。`target_label` とキーの並びは変えない（`playbooks` は `field` の位置に置く）'
  - item: v0.6.0 の手順
    constraint: '次の順の手順。どれも破壊的な操作。(1) `rename_file`（`mindmap.yaml` → `config.yaml`）。(2) 直下の 7 つの種類ごとの YAML・`changes.yaml`・`comments.yaml`・`drafts.yaml`・`submissions.yaml`・`mindstella-version.ini`・`.mindstella-opened` を、それぞれ `rename_file` で `.mindstella/{同じ名前}` へ。(3) `docs/`・`release/` を `move_dir` で `.mindstella/` の下へ。(4) 直下の `config.yaml` を `rename_file` で `.mindstella/config.yaml` へ（移し終えるまでほかのツールが移しかけのワークスペースをワークスペースと見ないように、移す手順の最後に置く）。(5) 前の版の画面 `preview.html` と直下の `.mindstella.lock` を `delete`。無いファイルは飛ばし（『対象が無い・既にあるとき』）、今の形のワークスペースでは何も変えない。v0.3.0・v0.5.0 の手順は移す前に当たるため、直下の `mindmap.yaml`・`docs.yaml` を指したまま残す。手順のパスはどの版もワークスペースの直下からの相対'
  - item: ワークスペースの見分け
    constraint: この関数だけは `.mindstella/config.yaml`、直下の `config.yaml`、直下の `mindmap.yaml` のどれかがあればワークスペースとして扱う（MindStella の MCP のツールは `.mindstella/config.yaml` だけ）。`.mindstella/` が無い移す前の形では、直下の `.mindstella.lock` で排他ロックを取る（v0.6.0 の手順がそのファイルを消す）
  - item: 版の読み取り
    constraint: ワークスペースの版は `.mindstella/mindstella-version.ini` の 1 行目。無ければ直下の `mindstella-version.ini`（v0.6.0 より前の置き場所）を読み、どちらも無ければ版を記録する前の形式。両方あるときは `.mindstella/` の方を読む
  - item: v0.7.0 の手順
    constraint: '`call`（`answer_to_adopted_option`）の 1 手順。`.mindstella/decisions.yaml` のうち、`決定済み` で `answer` を持ち `options` を持たない（空の配列を含む）検討事項に、`key: A`・`content` に `answer`・`reason` に検討事項の `reason`（持つときだけ）・`adopted: true` の案を 1 つ作る。それ以外の検討事項と、案を持つ検討事項は変えない。作った検討事項の `updated`・`history` は変えない。案と状態の合わない残りの検討事項は、点検が `decision_state` で返し、MindStella のセッションが検討事項で利用者に確かめる（単一ユースケース『ワークスペースの移し替え』）。破壊的な操作ではない'
  - item: v0.8.0 の手順
    constraint: '次の順の 2 手順。(1) `call`（`submissions_to_threads`）。`.mindstella/submissions.yaml` の送信 1 件ごとに、`.mindstella/threads.yaml` へスレッドを 1 件足す（送信の連番の小さい順に `TH-{連番}`、`target`・`loc` を引き継ぎ、`tags: []`・`summary: null`・`events: []`）。最初の書き込みは `author: user`・`body`・`created`（送信の `sent`）・`read: false`・`seen: true`・`taken`（送信の `taken`）。取り込み済みの送信は `status: closed` にして `events` に `kind: closed`・`author: ai`・`reason: null`・`created`（送信の `taken`）を 1 件足し、取り込んでいない送信は `status: open` にする。`submissions.yaml` が無ければ飛ばし、`threads.yaml` が既にあれば StepFailedError（二重に移さない）。(2) `delete`（`.mindstella/submissions.yaml`。破壊的な操作）'
  - item: v0.10.0 の手順
    constraint: '`call`（`tags_to_vocabulary`）の 1 手順。`.mindstella/` の種類ごとの YAML の項目と `threads.yaml` のスレッドが持つ `tags` を集め、重なりを除いて名前の順に並べ、`.mindstella/config.yaml` の `tags` へ説明なし（`name` だけ）で書く。`config.yaml` が既に `tags` を持つときは、無いタグだけを足して名前の順に並べ直す（説明は消さない）。どの項目もスレッドもタグを持たなければ `tags` を書かない。項目とスレッドは変えない。破壊的な操作ではない'
  - item: v0.11.0 の手順
    constraint: '`call`（`remove_tag_vocabulary`）の 1 手順。`.mindstella/config.yaml` から `tags` を削除する（タグの説明も消える）。`config.yaml` か `tags` が無ければ飛ばす。項目とスレッドの `tags` は変えない。破壊的な操作'
    notes: '#333 の方針の変更（D-169）'
  - item: v0.12.0 の手順
    constraint: '`call`（`tags_to_objects`）の 1 手順。`.mindstella/` の種類ごとの YAML の項目が持つ `tags` の文字列の要素を `{name: {文字列}}` に置き換える（並びと表記は変えず、どのタグも `main` を持たない）。NFKC と小文字にそろえて同じ名前のタグは、最初の 1 件だけを残す。既にオブジェクトの要素と `threads.yaml` のスレッドの `tags` は変えない。書き換えた項目の `updated`・`history` は変えない。破壊的な操作'
    notes: 版の番号は計画の次の Sprint の版。Sprint の版が変わったら合わせる
  - item: v0.13.0 の手順
    constraint: '次の順の 4 手順。(1) `call`（`refs_to_related`）。`.mindstella/decisions.yaml` の `depends_on`・`parent`、`tasks.yaml` の `for`・`depends_on` を、項目の `related` の `{to, type}`（`type` はキーの名前）へ移してキーを消す。既にある `related` の ID の文字列は `{to: {ID}, type: see_also}` に置き換える。並びは `depends_on`・`parent`・`for`・元の `related` の順で、同じ `to`・`type` の組は 1 件だけ残す。破壊的な操作。(2) `call`（`body_to_docs_path`）。種類ごとの YAML の項目の `body` が `/` を含まないファイル名なら `docs/{ファイル名}` に置き換える。破壊的な操作。(3) `call`（`place_source_config`）。`.mindstella/dev-docs.yaml` が無ければ『ワークスペースの作成』の「配信の設定」と同じ中身で書き、`.mindstella/schemas/` をプラグインのスキーマで置き換える。破壊的な操作ではない。(4) `call`（`meta_to_history_yaml`）。種類ごとの YAML の項目の `created`・`updated`・`updated_by`・`seq`・`added_seq`・`history`・`history_dropped_seq` を、`.mindstella/history.yaml` の `items` のその項目の ID の行へ値を変えずに移し、項目から消す。既に行があればそのキーは上書きしない。破壊的な操作。(1)〜(3) は、書き換えた項目の `updated`・`history`（変更履歴の `before` を含む）を変えない'
    notes: 版の番号は計画の次の Sprint の版。Sprint の版が変わったら合わせる
  - item: 値が要るキー
    constraint: '`set_default` が `ask` を持つときは、キーが無い項目に仮の値（題名はフォルダの名前、それ以外は手順が持つ `fallback`）を入れ、`provisional` に返す。利用者には確かめない（D-288）'
  - item: バージョンのファイルの書き換え
    constraint: 手順を全て当て、ワークスペースの全ての YAML がスキーマに合うときだけ、`.mindstella/mindstella-version.ini` を `to_version` に書き換える。点検（`check`）が返す利用者の判断が要る問題（案と状態の合わない検討事項など）は、バージョンの書き換えを止めない
  - item: 移し替えるとき
    constraint: ワークスペースのバージョンがプラグインより古いときだけ手順を当てる。同じときは何も書かず、新しいときは WorkspaceNewerError（D-288）
  - item: v0.14.0 の手順
    constraint: '`call`（`remove_discussion_keys`）の 1 手順。破壊的な操作。`.mindstella/config.yaml` から `goal`・`phases`・`playbooks`・`targets`・`target_label`・`categories` を消す。種類ごとの YAML の項目の `target`・`category` は値を `topic:{値}` のタグ（既にあれば足さない）へ、`attrs` は本文の末尾の「属性」の表（キーと値）へ、調査の `angles`・`confidence` は本文の末尾の「観点と確かさ」の表へ移してキーを消す。`phase`・検討事項の `weight`・資料の `deliverable` は移さずに消す。`.mindstella/release/` は消さない。書き換えた項目の変更履歴は変えない（D-276 A・D-277 A・D-278 A）'
    notes: バージョンの番号は計画の次の Sprint のバージョン。Sprint のバージョンが変わったら合わせる

    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant MD as mdmark の CLI（代わり）
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: 写しを取る
        IF->>MD: upgrade --yes
        MD-->>IF: 終了コード 1 と理由
        IF->>WS: 写しから戻す
        IF-->>クライアント: 例外
      ```
    expected:
      - 例外になる
      - 例外のメッセージに、失敗した版・手順と mdmark が出した理由の行がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_mdmark_documents_fail
  - name: 正常系（議論のキーを消す）
    summary: v0.14.0 の手順で、削除するキーを消し、対象・カテゴリーをタグへ、属性・観点・確かさを本文へ移す
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: 'バージョン v0.13.0 で、`config.yaml` が `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持ち、検討事項 D-1（`phase`・`target: 認証`・`category: 方式`・`attrs: {優先度: 高}`・`weight`）・資料 A-1（`deliverable: true`）・調査 R-1（`angles: [費用, 運用]`・`confidence: 中`）と `.mindstella/release/` を持つワークスペース'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: 写しを取る
        IF->>WS: remove_discussion_keys を当てる
        IF->>WS: スキーマと突き合わせ、バージョンのファイルを書く

        description: なし（関数 `migrate` を直接呼ぶ。mdmark の変換は実際に呼ぶ）
      - name: make_workspace
        description: 'この手順を持つ版より前の版で、資料 A-1 の本文に flow の図（種類 `llm`・`script` のノード）と sequence の図を、資料 A-2 の本文に `<!-- table: data +count -->` を持つワークスペース'
        notes: '`migrate` を呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant MD as mdmark の CLI（upgrade）
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: 写しを取る
        IF->>WS: 一時の mdmark の設定（対象は docs/ の Markdown）を置く
        IF->>MD: upgrade --yes --config 一時の設定
        MD->>WS: 資料の本文を書き換え、一時の設定に map の種類を書き足す
        MD-->>IF: 終了コード 0 と移行の報告
        IF->>WS: map の種類を config.yaml の mdmark.map へ移し、一時の設定と mdmark の写しを消す

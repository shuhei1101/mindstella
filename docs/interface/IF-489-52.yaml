      - 'A-2 の本文のマーカーが `<!-- table: {"kind": "data", ...} -->` の JSON の記載である'
      - '`config.yaml` の `mdmark.map.kinds` に `llm`・`script` がある'
      - 結果の `steps` のこの手順に、mdmark の移行の報告の行がある
      - ワークスペースに一時の mdmark の設定と `.mdmark/` が残っていない
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_mdmark_documents
  - name: 異常系（mdmark の変換が失敗する・StepFailedError）
    summary: mdmark の CLI が終了コード 0 以外で終わると、写しから戻してエラーを返す
    setup:
      - name: Mock
        description: mdmark の CLI の代わりに、終了コード 1 と理由を出すコマンドを呼ぶ（呼ぶコマンドを環境変数で差し替える）
      - name: make_workspace

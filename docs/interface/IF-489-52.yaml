      - '`config.yaml` が `tags` を持たず、ほかのキーは呼ぶ前と同じ'
      - D-1・TH-1 が呼ぶ前と同じ
      - 同じ呼び出しをもう一度当てても、`config.yaml` が変わらない
    test: test_normal_when_tag_vocabulary_removed
  - name: 正常系（項目のタグを主題を持てる形にする）
    summary: v0.11.0 のワークスペースの項目の文字列のタグを `{name}` に置き換え、スレッドのタグは残す
    setup:

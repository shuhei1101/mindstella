id: IF-489-52
title: "記録の形式の移行"
entry:
  kind: operation
  value: '`migrate`（常駐サーバーの移し替えの公開関数。『ワークスペースの作成』と『MindStella のセッションの作成』がワークスペースを開く前に呼ぶ。MCP のツールにはしない）'
flows:
  - name: 正常系（手順を当てる）
    summary: 写しを取ってプラグインのバージョンまでの手順を当て、題名に仮の値を入れてバージョンのファイルを書く
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '版のファイルを持たず、`summary` を持たない `mindmap.yaml` と、資料 A-1（`done: true`）・A-2（`done: false`）を持つ、git の作業ツリーではないワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: 隣のフォルダへ複製する
        IF->>WS: プラグインの版までの手順を並びの順に当てる
        IF-->>クライアント: 結果（steps・provisional・backup）
      ```
    expected:
      - 例外にならない
      - '`.mindstella/docs.yaml` の A-1 が `status: 完成`、A-2 が `status: 下書き` で、どちらも `done` を持たず、`updated` が呼ぶ前と同じ'
      - 直下に `mindmap.yaml`・`config.yaml` が無く、`.mindstella/config.yaml` が `mindmap.yaml` の中身（`field` を `playbooks` に移した後）を持つ
      - '`.mindstella/config.yaml` の `summary` がフォルダの名前で、`provisional` にそのキーがある'
      - '`backup.kind` が `copy` で、`backup.ref` のフォルダに呼ぶ前の `docs.yaml` と `mindmap.yaml` がある'
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンで、`recorded` が同じバージョン'
    test: test_normal_when_apply
  - name: 正常系（写しを git のコミットで取る）
    summary: git の作業ツリーの中のワークスペースでは、ワークスペースのパスだけをコミットして写しにする
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼び、写しは実際の git で取る）
      - name: git の作業ツリー
        description: テストごとの一時フォルダで `git init` し、その下に版を記録する前の形式のワークスペースと、ワークスペースの外のファイル `other.txt`・`staged.txt` を置く
        notes: どれもコミットしない。`staged.txt` だけ `git add` しておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant G as git

        クライアント->>IF: migrate workspace
        IF->>G: ワークスペースのパスだけを add してコミットする
        IF->>IF: 手順を当てる
        IF-->>クライアント: JSON（backup.kind: git）
      ```
    expected:
      - 例外にならない
      - '`backup.kind` が `git`、`backup.ref` が新しいコミットの ID'
      - そのコミットがワークスペースのパスのファイルだけを持ち、`other.txt`・`staged.txt` を持たない
      - '`staged.txt` がステージされたままである'
    test: test_normal_when_backup_git
  - name: 正常系（版が同じ）
    summary: 今の版のワークスペースでは並べる手順が無い
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '`init` で作ったワークスペース'
        notes: '今のバージョンのまま呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF-->>WS: 版のファイルを読む
        IF-->>クライアント: 結果（relation: same・steps は空）
      ```
    expected:
      - 例外にならない
      - '`relation` が `same`、`steps` と `provisional` が空で、ワークスペースの全てのファイルの中身と更新日時が呼ぶ前と同じ'
    test: test_normal_when_same
  - name: 正常系（ignore されたワークスペースは複製で写しを取る）
    summary: git の作業ツリーの中でも、ignore されたファイルを持つワークスペースは隣のフォルダへ複製して写しにする
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼び、写しは実際の git で取る）
      - name: ignore されたワークスペース
        description: テストごとの一時フォルダで `git init` し、`tmp/.gitignore` に `*` を書いて、`tmp/` の下に版を記録する前の形式のワークスペースを置く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant G as git
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>G: ignore されたファイルがあるかを引く
        G-->>IF: ある
        IF->>WS: 隣のフォルダへ複製する
        IF->>WS: 手順を当てる
        IF-->>クライアント: JSON（backup.kind: copy）
      ```
    expected:
      - 例外にならない
      - '`backup.kind` が `copy` で、`backup.ref` のフォルダに呼ぶ前の `docs.yaml` がある'
      - 作業ツリーにコミットが増えていない
    test: test_normal_when_backup_ignored
  - name: 正常系（既に今の形のワークスペースに当てる）
    summary: 今の形（版のファイルが無く、`.mindstella/config.yaml` が題名を持ち、資料が status）に当てても何も変えずに成功する
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '版のファイルを持たず、`summary` を持つ `.mindstella/config.yaml`（直下に `mindmap.yaml`・`config.yaml` は無い）と、資料 A-1（`status: 完成`）を持つ、git の作業ツリーではないワークスペース'
        notes: 当て直し（手順を当てた後、版を書く前に止めたワークスペース）も同じ形になる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: 写しを取る
        IF->>IF: 対象のキーが無い項目を飛ばして手順を当てる
        IF-->>クライアント: 結果（provisional は空）
      ```
    expected:
      - 例外にならない
      - '`provisional` が空'
      - '`.mindstella/config.yaml`・`.mindstella/docs.yaml` の中身と更新日時が呼ぶ前と同じ'
      - 直下に `mindmap.yaml`・`config.yaml` が作られていない
    test: test_normal_when_already_current
  - name: 正常系（分野をプレイブックの配列へ移す）
    summary: v0.5.0 の手順で mindmap.yaml の field を playbooks の 1 件の配列へ移す
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '版のファイルが `v0.4.0` で、`mindmap.yaml` が `field: システム開発` と `target_label: システム` を持つ、git の作業ツリーではないワークスペース'
        notes: YAML を直接書いて作る
      - name: to_version
        description: '`v0.5.0` を渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace to_version v0.5.0
        IF->>WS: 隣のフォルダへ複製する
        IF->>WS: v0.5.0 の手順（field_to_playbooks）を当てる
        IF-->>クライアント: 結果（steps・provisional・backup）
      ```
    expected:
      - 例外にならない
      - '`steps` が `version: v0.5.0`・`op: call` の 1 件'
      - '`mindmap.yaml` が `field` を持たず、`playbooks` が `[システム開発]`、`target_label` が `システム` のまま'
      - '`mindstella-version.ini` が `v0.4.0` のまま'
    test: test_normal_when_field_to_playbooks
  - name: 正常系（設定ファイルの名前を改める）
    summary: v0.6.0 の手順で `mindmap.yaml` を `config.yaml` に改め、直下の記録を `.mindstella/` へ移す
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: 直下に、版のファイル（`v0.5.0`）・`summary` を持つ `mindmap.yaml`（`config.yaml` は無い）・本文を持つ検討事項 D-1 の `decisions.yaml` と `docs/D-1.md`・`release/` の `資料.md`・前の版の画面 `preview.html` を持つ、git の作業ツリーではないワークスペース
        notes: YAML を直接書いて作る
      - name: to_version
        description: '`v0.6.0` を渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace to_version v0.6.0
        IF-->>WS: 直下の版のファイルを読む（v0.5.0）
        IF->>WS: 隣のフォルダへ複製する
        IF->>WS: v0.6.0 の手順（mindmap.yaml → config.yaml、直下の記録を .mindstella/ へ、preview.html・.mindstella.lock を消す）を当てる
        IF-->>クライアント: 結果（steps・provisional・backup）
      ```
    expected:
      - 例外にならない
      - '`workspace_version` が `v0.5.0` で、`steps` が v0.6.0 の手順だけ。先頭が `rename_file`（`mindmap.yaml` → `config.yaml`）で、どれも `destructive: true`'
      - 直下に `mindmap.yaml`・`config.yaml`・`decisions.yaml`・`docs/`・`release/`・`preview.html`・版のファイルが無い
      - '`.mindstella/config.yaml` の中身が呼ぶ前の `mindmap.yaml` と同じで、`.mindstella/decisions.yaml`・`.mindstella/docs/D-1.md`・`.mindstella/release/資料.md` の中身が呼ぶ前と同じ'
      - '`provisional` が空'
      - '`.mindstella/mindstella-version.ini` が `v0.5.0` のまま'
    test: test_normal_when_rename_settings_file
  - name: 異常系（版が新しい・WorkspaceNewerError）
    summary: 版が新しいワークスペースには手順を当てない
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '`init` で作り、版のファイルを `v99.0.0` に書き換えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF-->>WS: 版のファイルを読む
        IF-->>クライアント: 例外
      ```
    expected:
      - 例外になる
      - 例外のメッセージに `v99.0.0` とプラグインの版（`plugins/mindstella/version.ini` の 1 行目）がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じで、写しのフォルダが作られていない
    test: test_error_when_newer
  - name: 異常系（手順が失敗する・StepFailedError）
    summary: 手順が読めないファイルに当たると写しから戻して終わる
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '版のファイルを持たず、資料 A-1（`done: true`）・A-2（`done: false`）を持ち、`mindmap.yaml` の中身が `field: [`（YAML として読めない）のワークスペース'
        notes: 資料の手順 1・2 が `docs.yaml` を書き換えた後に、`mindmap.yaml` を読む手順 3 が失敗する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: 写しを取る
        IF->>IF: v0.3.0 の手順が mindmap.yaml を読めない
        IF->>WS: 写しから戻す
        IF-->>クライアント: 例外
      ```
    expected:
      - 例外になる
      - '例外のメッセージが `エラー: v0.3.0 の手順 3（set_default）: ` で始まり、`mindmap.yaml` がある'
      - 手順 1・2 が書き換えた `docs.yaml` を含め、ワークスペースの全てのファイルの中身が呼ぶ前と同じ
      - 'ワークスペースの全てのファイルの中身が呼ぶ前と同じ（バージョンのファイルを書いていない）'
    test: test_error_when_step_fails
  - name: 異常系（点検に合わない・SchemaMismatchError）
    summary: 手順を当てた後にスキーマに合わなければ写しから戻し、バージョンを書かない
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: 前のバージョンで、`.mindstella/config.yaml` の `summary` が数値（スキーマは文字列）のワークスペース
        notes: 'YAML を直接書いて作る'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF-->>WS: 全ての YAML を読み、スキーマと突き合わせる
        IF-->>クライアント: 例外
      ```
    expected:
      - 例外になる
      - '例外のメッセージに `config.yaml: ` で始まり `summary` を含む行がある'
      - 'ワークスペースの全てのファイルの中身が呼ぶ前と同じ（バージョンのファイルを書いていない）'
    test: test_error_when_schema_mismatch
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: '`.mindstella/config.yaml` も、直下の `config.yaml`・`mindmap.yaml` も無いフォルダを指すと何も書かずに終わる'
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` も、直下の `config.yaml`・`mindmap.yaml` も無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as フォルダ

        クライアント->>IF: migrate workspace
        IF-->>WS: .mindstella/config.yaml も、直下の config.yaml・mindmap.yaml も無い
        IF-->>クライアント: 例外
      ```
    expected:
      - 例外になる
      - 例外のメッセージにフォルダのパスがある
      - フォルダにファイルが増えていない
    test: test_error_when_workspace_not_found
  - name: 正常系（決定済みの答えから採用した案を作る）
    summary: v0.7.0 の手順で、案を持たない決定済みの検討事項にだけ答えから採用した案を作る
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '`.mindstella/mindstella-version.ini` が `v0.6.0` で、`answer`・`reason` を持ち案を持たない決定済みの D-1、案を持たない未決定の D-2、案 A（採用）を持つ決定済みの D-3 を持つ、git の作業ツリーではないワークスペース'
        notes: YAML を直接書いて作る
      - name: to_version
        description: '`v0.7.0` を渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace to_version v0.7.0
        IF-->>WS: 版のファイルを読む（v0.6.0）
        IF->>WS: 隣のフォルダへ複製する
        IF->>WS: v0.7.0 の手順（answer_to_adopted_option）を当てる
        IF-->>クライアント: 結果（steps・provisional・backup）
      ```
    expected:
      - 例外にならない
      - '`steps` が `version: v0.7.0`・`op: call`・`destructive: false` の 1 件'
      - D-1 の `options` が 1 件で、`key` が `A`、`content` が呼ぶ前の `answer`、`reason` が呼ぶ前の `reason`、`adopted` が真
      - D-1 の `status`・`answer`・`updated` が呼ぶ前と同じ
      - D-2・D-3 が呼ぶ前と同じ
      - 同じ呼び出しをもう一度当てても、D-1 の案が 1 件のまま
      - '`.mindstella/mindstella-version.ini` が `v0.6.0` のまま'
    test: test_normal_when_answer_to_option
  - name: 正常系（送信をスレッドへ移す）
    summary: v0.7.0 のワークスペースの送信を、取り込み済みはクローズ、取り込んでいないものはオープンのスレッドへ移す
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: 版 v0.7.0 で、検討事項 D-1 と、送信 S-1（D-1・取り込み済み）・S-2（項目を指さない・取り込んでいない）を持ち、`threads.yaml` を持たないワークスペース
        notes: '`migrate` を呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace
        IF->>WS: submissions_to_threads を当てる
        IF->>WS: 版を書く
        IF-->>クライアント: JSON
      ```
    expected:
      - 例外にならない
      - '`threads.yaml` の TH-1 が `status: closed`・`target: D-1` で、`events` に `kind: closed`・`author: ai` の 1 件、書き込みの `taken` が S-1 の `taken`'
      - 'TH-2 が `status: open` で `target` を持たず、書き込みの `taken` が `null`'
      - '`submissions.yaml` が無く、`check` が問題を 0 件で返す'
      - '`threads` を `awaiting` で呼ぶと TH-2 だけを返す'
      - 'TH-1・TH-2 の書き込みが `seen: true`（利用者が送ったものは利用者の既読）'
    test: test_normal_when_submissions_to_threads
  - name: 正常系（使っているタグを語彙へ登録する）
    summary: v0.9.0 のワークスペースの項目とスレッドが使っているタグを、説明なしで config.yaml の語彙へ書く
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '版 v0.9.0 で、`config.yaml` が `tags` を持たず、検討事項 D-1（`tags: [保存, 通知]`）・メモ N-1（`tags: [脱線, 保存]`）と、スレッド TH-1（`tags: [起票]`）を持つワークスペース'
        notes: '`migrate` を `to_version: v0.10.0` で呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace to_version=v0.10.0
        IF->>WS: tags_to_vocabulary を当てる
        IF-->>クライアント: JSON
      ```
    expected:
      - 例外にならない
      - '`steps` が `version: v0.10.0`・`op: call`・`destructive: false` の 1 件'
      - '`config.yaml` の `tags` が `{name: 保存}`・`{name: 脱線}`・`{name: 起票}`・`{name: 通知}` の 4 件で、どれも `summary` を持たない'
      - D-1・N-1・TH-1 が呼ぶ前と同じ
      - 同じ呼び出しをもう一度当てても、`tags` が 4 件のまま
    test: test_normal_when_tags_to_vocabulary
  - name: 正常系（タグの語彙を外す）
    summary: v0.10.0 のワークスペースの config.yaml からタグの語彙を削除し、項目とスレッドのタグは残す
    setup:
      - name: Mock
        description: なし（関数 `migrate` を直接呼ぶ）
      - name: make_workspace
        description: '版 v0.10.0 で、`config.yaml` が `tags`（`{name: 保存, summary: 保存の話}`・`{name: 通知}`）を持ち、検討事項 D-1（`tags: [保存, 通知]`）とスレッド TH-1（`tags: [起票]`）を持つワークスペース'
        notes: '`migrate` を `to_version: v0.11.0` で呼ぶ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as migrate
        participant WS as ワークスペース

        クライアント->>IF: migrate workspace to_version=v0.11.0

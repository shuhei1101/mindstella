id: IF-489-55
title: "設定の更新"
entry:
  kind: mcp_tool
  value: '`update_settings`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__plugin_mindstella_mindstella__update_settings`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 題名・話し合いの概要・関連する場所を置き換え、渡さないキーを残す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 保持する回数 3 と表示の既定を持つワークスペース
      - name: settings
        description: '`summary`・`description`・`links` を渡す'
        notes: '`links` は `[{label: 設計書, url: https://example.com}]`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace（`settings` に置き換えるキー）
        IF-->>WS: config.yaml を読む
        IF->>IF: キーを置き換え、スキーマと突き合わせる
        IF->>WS: config.yaml を書く
        IF-->>クライアント: JSON（changed・files）
      ```
    expected:
      - ツールのエラーにならない
      - '`config.yaml` の `summary`・`description`・`links` が渡した値で、`history_limit`・`display` が呼ぶ前と同じ'
      - '`changed` が `summary`・`description`・`links`、`files` が `config.yaml` だけ'
      - 種類ごとの YAML の中身が呼ぶ前と同じ
    test: test_normal
  - name: 正常系（表示の既定を書き換える）
    summary: 見た目の既定と表示する種類の既定を書き換える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が `display` を持たないワークスペース
        notes: '`settings` は `{"display": {"network_look": "starlight", "visible_kinds": [会話ログを除いた 6 種類]}}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace settings.display
        IF-->>WS: config.yaml を読む
        IF->>IF: display を置き換え、スキーマと突き合わせる
        IF->>WS: config.yaml を書く
        IF-->>クライアント: JSON（changed）
      ```
    expected:
      - ツールのエラーにならない
      - '`config.yaml` の `display.network_look` が `starlight`、`display.visible_kinds` が `logs` を除いた 6 種類'
      - '`summary`・`history_limit` が呼ぶ前と同じ'
    test: test_normal_when_display
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すと、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: update_settings workspace
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（スキーマに合わない・SchemaMismatchError）
    summary: スキーマに合わない値を渡すと、何も書かない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: settings
        description: '`summary` を空の文字列にして渡す'
        notes: '`{"summary": ""}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）

        クライアント->>IF: update_settings workspace（summary が空）
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `config.yaml: summary` で始まる行がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_schema_mismatch
  - name: 異常系（書き込めない・WriteFailedError）
    summary: 書き込めないワークスペースでは、どのファイルも書き換えずにエラーの行を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: ワークスペースのフォルダの書き込みの権限を外したワークスペース
        notes: root で動かすときは skip する
      - name: settings
        description: '`summary` を渡す'
        notes: '`config.yaml` と `decisions.yaml` の 2 つを書く場合'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace（settings）
        IF-->>WS: config.yaml を読む
        IF->>WS: 一時ファイルを書けない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、トレースバックを含まない'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_write_fails
  - name: 異常系（削除したキーを渡す・引数の誤り）
    summary: 削除したキー（`playbooks` など）を渡すと、何も書かずにエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: settings
        description: '`summary` と削除したキー `playbooks` を渡す'
        notes: '`{"summary": "題", "playbooks": ["壁打ち"]}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace（playbooks を含む）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文に `playbooks` がある
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_removed_key_given
  - name: 正常系（関連する場所と保持する回数）
    summary: 関連する場所と保持する回数を書き換える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`links` と `history_limit` を持たないワークスペース'
      - name: settings
        description: '`links` を 1 件、`history_limit` を 3 にする'
        notes: '`{"links": [{"title": "仕様", "url": "https://example.com/spec"}], "history_limit": 3}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace（links・history_limit）
        IF-->>WS: config.yaml を読む
        IF->>IF: 渡したキーを置き換え、スキーマと突き合わせる
        IF->>WS: config.yaml を書く
        IF-->>クライアント: JSON（changed）
      ```
    expected:
      - ツールのエラーにならない
      - '`changed` が `links`・`history_limit`'
      - '`config.yaml` の `links` が渡した 1 件で、`history_limit` が 3'
      - ほかのキーが呼ぶ前と同じ
    test: test_normal_when_links_and_history_limit
  - name: 正常系（文字起こしの設定を書き換える）
    summary: 文字起こし後の挙動と用語集のプリセットを書き換える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が `transcription` を持たないワークスペース
        notes: '`settings` は `{"transcription": {"action": "insert", "preset": "開発"}}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace settings.transcription
        IF-->>WS: config.yaml を読む
        IF->>IF: transcription を置き換え、スキーマと突き合わせる
        IF->>WS: config.yaml を書く
        IF-->>クライアント: JSON（changed）
      ```
    expected:
      - ツールのエラーにならない
      - '`config.yaml` の `transcription.action` が `insert`、`transcription.preset` が `開発`'
      - '`changed` が `transcription` だけ'
    test: test_normal_when_transcription
  - name: 異常系（文字起こし後の挙動の値が合わない・SchemaMismatchError）
    summary: '`review`・`send`・`insert` のどれでもない挙動を渡すと、何も書かない'
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`settings` は `{"transcription": {"action": "paste"}}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）

        クライアント->>IF: update_settings workspace（action が paste）
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `config.yaml: transcription.action` で始まる行がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_transcription_action_invalid
  - name: 正常系（mdmark のバージョンを書き換える）
    summary: 画面が読み込む mdmark のバージョンをタグにし、ほかのキーと map の種類を残す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark` が `map.kinds.llm` だけを持つワークスペース
        notes: '`settings` は `{"mdmark": {"version": "v0.13.0"}}`（`map` を指定しない）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: update_settings workspace settings.mdmark
        IF-->>WS: config.yaml を読む
        IF->>IF: mdmark.version だけを置き換え（mdmark.map は残す）、スキーマと突き合わせる
        IF->>WS: config.yaml を書く
        IF-->>クライアント: JSON（changed）
      ```
    expected:
      - ツールのエラーにならない
      - '`config.yaml` の `mdmark.version` が `v0.13.0` で、`mdmark.map.kinds.llm` が呼ぶ前と同じ'
      - '`changed` が `mdmark` だけ'
    test: test_normal_when_mdmark_version
  - name: 異常系（mdmark のバージョンの値が合わない・SchemaMismatchError）
    summary: '`latest` でもタグでもないバージョンを渡すと、何も書かない'
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`settings` は `{"mdmark": {"version": "develop"}}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as update_settings（MCP のツール）

        クライアント->>IF: update_settings workspace（version が develop）
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `config.yaml: mdmark.version` で始まる行がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_mdmark_version_invalid
lead: '`settings` で渡した設定のキーを置き換える。削除したキー（ゴール・フェーズ・プレイブック・対象・カテゴリー）は受け付けず、項目を付け替えない。'
idempotent: false
side_effects: '`config.yaml` を書き換える。種類ごとの YAML は書き換えない。一時ファイルを書き終えてから `os.replace` で置き換える'
exclusivity: 『MCP サーバーの起動』の制約「同時の呼び出し」のとおり（プロセスの中の鍵の後に `.mindstella.lock` の排他ロックを取り、別のプロセスとも排他する）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ'
  - name: settings
    type: dict
    required: true
    location: argument
    description: 置き換える設定のキーと値。渡したキーだけを値ごと置き換え（配列・オブジェクトも丸ごと）、値が `null` のキーは消す。渡さないキーはそのまま
    constraints: キーは `summary`・`description`・`links`・`history_limit`・`display`・`transcription`・`mdmark` だけ。`mdmark` は `version` だけを受けて `version` だけを置き換え、移し替えの手順が書いた `mdmark.map` を残す。`null` で消せるのは任意の `description`・`links`・`history_limit`・`display`・`transcription` だけ。1 つ以上のキーを持つ。削除したキー（`goal`・`phases`・`playbooks`・`targets`・`target_label`・`categories`）は引数の誤り
    example: '{"display": {"network_look": "starlight", "visible_kinds": ["decisions", "tasks", "research", "docs", "terms", "notes"]}}'
request_example: |-
  ```json
  {
    "workspace": "~/discussions/要件出し",
    "settings": {
      "summary": "要件出しのスキル mindmap を設計する",
      "description": "スキル mindmap の記録の形とプレビューの画面を、作り始められるところまで決める話し合い。"
    }
  }
  ```
response:
  - name: changed
    type: list[str]
    description: 値が変わった・消えた設定のキーの名前
  - name: files
    type: list[str]
    description: 書き換えた YAML（ワークスペースからの相対パス。例 `.mindstella/config.yaml`）
exceptions:
  - name: なし（正常終了）
    condition: 書き換えられた
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー。何も書き込まない
  - name: SchemaMismatchError
    condition: 書き換えた後のワークスペースのどれかの YAML がスキーマに合わない。`settings` に書き換えられないキー・必須のキーの `null` を渡したときも含む
    notes: ツールのエラー。エラーの本文に合わない箇所。何も書き込まない
  - name: WriteFailedError
    condition: 一時ファイルの書き込みか置き換えに失敗した（権限が無い・ほかのプロセスが開いている など）
    notes: ツールのエラー。エラーの本文に書けなかったパスと理由。置き換えたファイルは前の中身に戻し、どのファイルも書き換えない
  - name: 引数の誤り
    condition: '`settings` が空のオブジェクト、または削除したキー（`goal`・`phases`・`playbooks`・`targets`・`target_label`・`categories`）を含む'
    notes: ツールのエラー。エラーの本文に受け付けないキー。何も書き込まない
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 書き換えられるキー
    constraint: '`settings` の制約に並べたキー（`summary`・`description`・`links`・`history_limit`・`display`・`transcription`・`mdmark`）。`display`（見た目の既定・表示する種類の既定）と `transcription`（文字起こし後の挙動・用語集のプリセット）は丸ごと置き換える'
  - item: 検証の範囲
    constraint: 書き換えた後の `config.yaml` をスキーマと突き合わせる。参照先の ID があるかは確かめない（点検が持つ）
  - item: YAML の書き方
    constraint: '`safe_dump(allow_unicode=True, sort_keys=False)`。コメントは残らない。キーの並びは今の `config.yaml` の並びを保ち、新しいキーは末尾に足す'
  - item: 部分成功
    constraint: 起こさない。書き換える全てのファイルの一時ファイルを書き終えてから置き換え、途中で失敗したら置き換えたファイルを前の中身に戻してからツールのエラーで終わる（残った一時ファイルも消す）
  - item: 書き換えの知らせ
    constraint: 書き終えたら、ほかの書き換えるツールと同じく開いているプレビューへ知らせる（『書き換えの知らせ』）
test_file: tests/integration/server/test_update_settings.py

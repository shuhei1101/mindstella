id: IF-489-51
title: "記録の取得"
entry:
  kind: endpoint
  value: GET /w/{workspace}/api/records
flows:
  - name: 正常系
    summary: 全ての種類と本文と導いた値を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 7 つの種類を 1 件ずつ持ち、検討事項 D-1 が本文 `docs/D-1.mark.md` を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`settings` と 7 つの種類の項目が YAML と同じ'
      - '`bodies` に `D-1.mark.md` の本文がある'
      - '`derived.ready` が、前提が全て決着した未決定の検討事項の ID を持ち、`derived` が `next`・`goal`・`progress` を持たない'
    test: test_normal
  - name: 正常系（書き換えた後）
    summary: ツールで書き換えると、次に読んだ記録に書き換えが入っている
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant T as add（MCP のツール）

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>クライアント: D-1 だけ
        クライアント->>T: add workspace kind decision（D-2）
        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>クライアント: D-1・D-2
      ```
    expected:
      - 2 回目の `decisions` に D-2 がある
      - 2 回目の `built_at` が 1 回目以降の日時
    test: test_normal_when_rewritten
  - name: 正常系（変更履歴がある）
    summary: 項目の変更履歴と、書き換えのまとまりを返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit`（説明「足す」）し、D-1 の `answer` を修正して変更の検知が変更履歴を積んだワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>WS: 全ての YAML と changes.yaml と docs/ を読む
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`decisions` の D-1 が `history` を 1 回分持ち、`history.yaml` の D-1 の行と同じ'
      - '`changes.sets` が「足す」の 1 つで、`added` が `[D-1]`'
      - '`changes.pending.changed` が `[D-1]`'
    test: test_normal_when_history
  - name: 異常系（YAML がスキーマに合わない・422）
    summary: 手で崩した YAML があると、合わない箇所を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: '`decisions.yaml` の D-1 の `status` を `完了` に直接書き換えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: 422
      ```
    expected:
      - ステータスが 422、`Content-Type` が `application/problem+json`
      - '`detail` に `decisions.yaml: items[0].status:` で始まる行がある'
    test: test_error_when_schema_mismatch
  - name: 正常系（設定がスキーマに合わない）
    summary: 配信中に `config.yaml` を崩しても、最後に検査に通った設定で記録を返し、合わない箇所を添える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: '`config.yaml` の `display.visible_kinds` を `[decisions]` にしたワークスペース。`preview_url` を呼んだ後に `display.visible_kinds` を `[rainbow]` に直接書き換える'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>WS: 全ての YAML を読む
        IF->>IF: config.yaml だけが合わない
        IF-->>クライアント: 200、最後に通った設定と合わない箇所
      ```
    expected:
      - ステータスが 200
      - '`settings.display.visible_kinds` が `[decisions]`'
      - '`settings_problem` に `config.yaml: display.visible_kinds` で始まる行がある'
    test: test_normal_when_config_invalid
  - name: 正常系（HTML の本文がある）
    summary: HTML の本文は原文を `bodies` に、行のマーカーを追加したものを `marked_bodies` に返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 本文を Markdown で持つ資料 A-1 と、本文を HTML で持つ資料 A-2 を持つワークスペース
        notes: 'A-2 の本文は 1 行目が `<!doctype html>`、2 行目が `<style>p { color: red; }</style>`、3・4 行目にまたがる開きタグ `<p\n  class="lead">一覧の画面</p>`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: HTML の本文に行のマーカーを追加する
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`bodies` の `A-1.mark.md`・`A-2.html` がそれぞれのファイルの中身と同じ'
      - '`marked_bodies` が `A-2.html` だけを持ち、`<p` の直後に ` data-line="4" data-line-end="4"` がある'
      - '`marked_bodies` の `A-2.html` の `<style>` に行のマーカーが無く、` data-line="{数}"`・` data-line-end="{数}"` を取り除くと `bodies` の `A-2.html` と同じ'
    test: test_normal_when_html_body
  - name: 正常系（mdmark の ref を返す）
    summary: 設定の mdmark のバージョンが `latest` のとき、develop の先頭の commit の SHA を `mdmark_ref` に返す
    setup:
      - name: Mock
        description: GitHub の API を、develop の先頭の commit の SHA を返す偽のサーバー（空きポート）に差し替えて MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ
        notes: 偽のサーバーは `0123456789abcdef0123456789abcdef01234567` を返し、受けた要求の数を数える
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark.version` が `latest` のワークスペース
        notes: 続けて 2 回 GET する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant GH as GitHub の API

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>GH: develop の先頭の commit の SHA
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`mdmark_ref` が `0123456789abcdef0123456789abcdef01234567`'
      - '`settings.mdmark.version` が `latest` のまま'
      - 2 回とも `mdmark_ref` が同じで、偽のサーバーが受けた要求が 1 回
    test: test_normal_when_mdmark_ref
  - name: 正常系（GitHub に届かない）
    summary: develop の先頭の commit を問い合わせられないときは、`develop` を `mdmark_ref` に返す
    setup:
      - name: Mock
        description: GitHub の API を、誰も待ち受けない空きポートに差し替えて MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark.version` が `latest` のワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant GH as GitHub の API

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>GH: develop の先頭の commit の SHA（届かない）
        IF-->>クライアント: 200、mdmark_ref が develop の JSON
      ```
    expected:
      - ステータスが 200
      - '`mdmark_ref` が `develop`'
      - 常駐サーバーの標準エラーに、mdmark の develop の commit を問い合わせられなかった旨の行が 1 行ある
    test: test_normal_when_github_unreachable
  - name: 正常系（タグを指定）
    summary: 設定の mdmark のバージョンがタグのときは、GitHub に問い合わせずにタグを `mdmark_ref` に返す
    setup:
      - name: Mock
        description: GitHub の API を、受けた要求の数を数える偽のサーバー（空きポート）に差し替えて MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark.version` が `v0.13.0` のワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records

        クライアント->>IF: GET /w/{workspace}/api/records
        IF-->>クライアント: 200、mdmark_ref がタグの JSON
      ```
    expected:
      - ステータスが 200
      - '`mdmark_ref` が `v0.13.0`'
      - 偽のサーバーが受けた要求が 0 回
    test: test_normal_when_mdmark_version_tag
  - name: 正常系（jsDelivr がまだ配らない commit）
    summary: 問い合わせた develop の先頭の commit を jsDelivr が配らないときは、`develop` を `mdmark_ref` に返す
    setup:
      - name: Mock
        description: 常駐サーバーの GitHub と jsDelivr の基点の URL を、`sitecustomize` で偽のサーバーに向ける。偽の GitHub は SHA `0123456789abcdef0123456789abcdef01234567` を返し、偽の jsDelivr はその SHA の `dist/index.js` に 403 を返す
      - name: make_workspace
        description: 設定の `mdmark` を持たないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as GET /w/{workspace}/api/records
        participant GH as GitHub
        participant JD as jsDelivr

        ユーザー->>IF: GET /w/{workspace}/api/records
        IF->>GH: develop の先頭の commit を問い合わせる
        GH-->>IF: SHA
        IF->>JD: その SHA の dist/index.js
        JD-->>IF: 403
        IF-->>ユーザー: mdmark_ref が develop の JSON
      ```
    expected:
      - '`mdmark_ref` が `develop`'
      - 常駐サーバーの標準エラーに、jsDelivr が配らない旨の 1 行がある
    test: test_normal_when_dist_not_served
  - name: 正常系（圧縮と再検証）
    summary: 圧縮した記録を `ETag` 付きで返し、同じ `ETag` の再検証にはワークスペースを読まずに 304 を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 本文を持つ検討事項 D-1 を持つワークスペース
        notes: 1 回目の後に `docs/D-1.mark.md` を読めない権限にし、保持した応答を使うことを確かめる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant WS as ワークスペース

        クライアント->>IF: GET（Accept-Encoding: gzip）
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: 200、gzip、ETag
        クライアント->>IF: GET（If-None-Match: 受けた ETag）
        IF-->>クライアント: 304
        クライアント->>IF: GET（If-None-Match 無し）
        IF-->>クライアント: 200、保持した応答
      ```
    expected:
      - '1 回目が 200 で `Content-Encoding: gzip`・`Vary: Accept-Encoding`・`Cache-Control: no-cache`・`ETag` を持ち、展開した本文の `bodies` に `D-1.mark.md` がある'
      - 2 回目が 304 で本文が空、`ETag` が 1 回目と同じ
      - 3 回目は本文を読めなくしても 200 で、1 回目と同じ本文と `built_at` を返す
    test: test_normal_when_revalidated
  - name: 正常系（書き換えで作り直す）
    summary: ワークスペースを書き換えると保持した応答を捨て、次の要求で `ETag` の違う応答を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
        notes: 1 回目の後に、ツールを通さず `decisions.yaml` へ D-2 を直接書き、『書き換えの通知』が届くまで待つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records
        participant CD as 変更の検知

        クライアント->>IF: GET
        IF-->>クライアント: 200、ETag A
        CD->>IF: 書き換えを見つけ、保持した応答を捨てる
        クライアント->>IF: GET（If-None-Match: A）
        IF-->>クライアント: 200、ETag B
      ```
    expected:
      - 2 回目が 200 で `decisions` に D-2 があり、`ETag` が 1 回目と違う
    test: test_normal_when_cache_invalidated
  - name: 正常系（プリセットの件数）
    summary: 設定のプリセットごとに該当する項目の件数を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: '資料 A-1（タグ: 画面）・A-2（タグ: 画面・廃止）・検討事項 D-1（タグ: 画面）と、設定の `presets` に「画面の設計」（画面を持ち廃止を持たない）と「古い分類」（廃止したタグを持つ）を持つワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/api/records

        クライアント->>IF: GET
        IF-->>クライアント: 200、settings.presets と preset_counts
      ```
    expected:
      - '`settings.presets` が設定と同じ並び'
      - '`preset_counts` が `{画面の設計: 2, 古い分類: 0}`（A-1 と D-1 を数え、種類をまたぐ）'
    test: test_normal_when_presets
lead: 配信しているワークスペースの全ての YAML と本文を、その場で読んで 1 つの JSON にまとめて返す。プレビューの画面が開いたときと、書き換えの通知を受けたときに読む。
idempotent: true
side_effects: なし（読むだけ）
callers:
  - IF-489-70#
request:
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '『プレビューの配信』の制約「接続先の確認」に合うもの（`127.0.0.1:{ポート}`・`localhost:{ポート}`・許可するホスト名）'
  - name: If-None-Match
    type: str
    required: false
    location: header
    description: ブラウザが前に受けた `ETag`。再検証に使う
  - name: Accept-Encoding
    type: str
    required: false
    location: header
    description: '`gzip` を含むと圧縮した本文を返す'
response:
  - name: settings
    type: dict
    description: '`config.yaml` の中身。`display`（表示する種類の既定）と `mdmark`（画面が読み込む mdmark のバージョンと map の種類）を含む。`config.yaml` がスキーマに合わないときは、配信が持つ最後に検査に通った設定'
  - name: decisions / tasks / research / docs / terms / notes / logs
    type: list[dict]
    description: 種類ごとの YAML の `items` の中身に、`history.yaml` のその項目の行のキー（`created`・`updated`・`updated_by`・`seq`・`added_seq`・`history`・`history_dropped_seq`・`confirmed`）を追加したもの（キー名はファイル名から `.yaml` を落としたもの）。行が無い項目はキーを追加せず、`confirmed` だけを持つ行からは `confirmed` だけを追加する。`confirmed` を持たない項目は未確認
  - name: bodies
    type: dict[str, str]
    description: '`docs/` のファイル名 → 本文の原文（項目の `body` が指すものだけ。キーは `body` の値（Markdown は `../docs/{ID}.mark.md`、HTML は `../docs/{ID}.html`）で、どちらも書いたまま）。画面はキーの拡張子で形式を決め、差分・検索・前のバージョンの組み立てには原文を使う'
  - name: built_at
    type: str
    description: 読んだ日時（UTC のタイムゾーン付き ISO 8601）。画面はつながらないときに「{日時} に読んだ記録」と出す
  - name: derived.ready[]
    type: list[str]
    description: 前提（`depends_on` の `related`）が全て決着した未決定の検討事項の ID。画面の「着手可否」が「着手可能」になるのはここにある ID。並べない（ID の順）
    notes: '決着は検討事項の決定済み・対象外・取り下げ、タスクの完了・中止。次の候補（並べ替え）とゴール判定は #518 で削除した'
  - name: changes
    type: dict
    description: '`changes.yaml` の中身（`last_seq`・`sets`・`pending`）。無ければ `{last_seq: 0, sets: [], pending: {added: [], changed: []}}`。画面の変更履歴の一覧と、新規・変更のマーカーはここから取る。種類ごとの項目は `history` を持ったまま返し、画面はそこから前のバージョンを組み立てる'
  - name: settings_problem
    type: list[str] | None
    description: '`config.yaml` がスキーマに合わないとき、合わない箇所ごとの `config.yaml: {キーのパス}: {理由}`。合うときは `null`。画面は表示を変えず、設定を修正するよう知らせる'
  - name: marked_bodies
    type: dict[str, str]
    description: '`bodies` の HTML の本文ごとの、ファイル名 → 開きタグに原文の行のマーカー（`data-line`・`data-line-end`）を追加した HTML。画面はこれを描き、選んだ範囲を本文の行の範囲にし、差分のマーカーを付ける要素を決める。HTML の本文が無ければ `{}`'
    notes: マーカーの追加方法は制約「行のマーカー」
  - name: mdmark_ref
    type: str
    description: 画面が読み込む mdmark の jsDelivr の ref（『プレビューの配信』の制約「mdmark の ref の解決」）。設定の `mdmark.version` がタグならタグ、`latest` か無ければ mdmark の develop の先頭の commit の SHA（問い合わせられないときは `develop`）。React の画面はこの ref で mdmark の URL を組み立てる
    example: 0123456789abcdef0123456789abcdef01234567
  - name: preset_counts
    type: dict[str, int]
    description: '設定の `presets` の名前 → そのプリセットに該当する項目の件数。プリセットが無ければ `{}`。配る書き出しにも載る。一覧に並べて 0 件の印を出すのは #361'
response_notes: |-
  配る書き出し（`export`）は、同じ形式の JSON を `<script type="application/json" id="mindmap-data">` の中身に埋め込む。画面は埋め込みのデータがあればそれを読み、無ければこの API を読む。スレッド（`threads.yaml`）は返さない（『スレッドの読み取り』）。
status_codes:
  - code: '200'
    condition: 読めた
  - code: '422'
    condition: '`config.yaml` 以外のどれかの YAML がスキーマに合わないか、YAML として読めない。または `config.yaml` が無くなった'
    notes: '`detail` に合わない箇所ごとの `{ファイル名}: {キーのパス}: {理由}` を改行でつなぐ。画面は前に読んだ記録で描き続ける'
  - code: '304'
    condition: 要求の `If-None-Match` が今の `ETag` と一致する
    notes: 本文を持たない。ブラウザが持つ前の応答をそのまま使う
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 読み込む時
    constraint: 組み立てた応答の本文・gzip で圧縮した本文・`ETag` をワークスペースごとに常駐サーバーのメモリに保持し、保持した応答があればワークスペースの YAML と本文を読まずに返す。保持した応答は制約「作り直す契機」で捨て、次の要求で読み直して作り直す。書き出しのファイルは持たない
  - item: 本文の構造
    constraint: '`application/json; charset=utf-8`。日本語はエスケープしない。`Cache-Control: no-cache`（ブラウザは毎回再検証する）と、応答の本文の SHA-256 の先頭 32 文字を二重引用符で囲んだ `ETag` を付ける。要求の `Accept-Encoding` が `gzip` を含むときは圧縮した本文を `Content-Encoding: gzip` で返し、`Vary: Accept-Encoding` を付ける'
  - item: 接続先の確認
    constraint: 『プレビューの配信』と同じ（`Host` が合わなければ 403 を返す。確かめは『プレビューの配信』の異常系が持つ）
  - item: 書き込み途中の読み込み
    constraint: ツールは YAML を一時ファイルから `os.replace` で置き換えるため、書き込み途中のファイルを読まない
  - item: 設定の読み込み方法
    constraint: 呼ばれるたびに `config.yaml` を読み、スキーマに合えば配信の「最後に検査に通った設定」をその値に差し替える。合わなければ差し替えず、最後に検査に通った設定を `settings` に、合わない箇所を `settings_problem` に入れて 200 を返す
  - item: 行のマーカー
    constraint: Python の標準ライブラリ `html.parser.HTMLParser` で原文を読み、開きタグ（空要素を含む）のタグ名の直後に ` data-line="{始まりの行}" data-line-end="{終わりの行}"` を追加する。始まりの行はその開きタグが閉じた原文の行（中身が始まる行、1 始まり）。終わりの行はその要素の閉じタグが始まる原文の行で、空要素は始まりの行と同じ。閉じタグを省いた要素は、その要素を含む要素のうち閉じタグを持つ最も内側のものの閉じタグが始まる行（無ければ原文の最後の行）。文書の外枠と描いた文を持たない要素（`html`・`head`・`body`・`meta`・`link`・`base`・`style`・`script`・`template`・`title`）には追加しない。マーカーの他は原文を変えず、行の並びも保つ
    notes: PoC（#215）で、コメントの中のタグ・`<style>` / `<script>` の中の `<` `>`・属性値の `>`・複数行の開きタグ・閉じタグを省いた `<p>` / `<li>` を含む 12 ケースで確かめた
  - item: 作り直す契機
    constraint: どれかが起きたら、そのワークスペースの保持した応答を捨てる。『変更の検知』がワークスペースのファイルの書き換えを見つけたとき（『書き換えの通知』を送る前）。常駐サーバーのツール・画面の保存がワークスペースのファイルを書いたとき。『設定の再読み込み』を呼んだとき。常駐サーバーを起動し直したとき（メモリが空になる）
    notes: 要求のたびにファイルの更新時刻を確かめる方式は、`/mnt/c` でファイルの数だけ `stat` が走り数秒かかるため採らない（#547）
  - item: 再検証
    constraint: '要求の `If-None-Match` が今の `ETag` と一致すれば、本文の無い 304 を `ETag` と `Cache-Control: no-cache` 付きで返す。保持した応答が無いときは先に作り直してから比べる'
  - item: 本文のファイルの解決
    constraint: '`docs/` のフォルダの実体のパスは 1 回の読み込みで 1 回だけ解決し、項目ごとの本文はその配下のファイル名だけで開く。`body` が `docs/` の外を指すものは読まない（今の検査を残す）'
  - item: プリセットの件数
    constraint: '`preset_counts` は、設定の `presets` ごとに、タグの式に該当する全ての種類の項目の数。数え方は ER 図『ワークスペース』の `presets` の列の `eq`・`ne` の意味と、プリセットのツール・『ワークスペースの点検』と同じ'

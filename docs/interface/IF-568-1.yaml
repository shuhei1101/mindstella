id: IF-568-1
title: 作業の完了の通知
entry:
  kind: trigger
  value: 『書き換えのまとまり』が `hand_back` を真にして成功し、結果を返却した後
lead: MindStella のセッションが利用者に手番を返す直前の `commit` に成功したときに、利用者が用意した Webhook の設定のファイルの Discord の Webhook へ、作業が完了したことを 1 件送信する。
test_file: tests/integration/server/test_work_done_notify.py
idempotent: false
side_effects: Discord の Webhook へ 1 件の `POST`。送信の結果を標準エラーへ 1 行記録する（Webhook の URL を含めない）
callers:
  - IF-489-43#
exclusivity: 送信は常駐サーバーの中の別のスレッド（`daemon` のスレッド）で行い、`commit` の結果の返却と常駐サーバーの停止を待たせない
exceptions:
  - name: なし（正常終了）
    condition: 送信した・送信しなかった・送信に失敗した、のどれでも例外を出さない
constraints:
  - item: 通知するか
    constraint: MindStella のセッションが『書き換えのまとまり』を `hand_back` を真にして呼び、成功したときだけ 1 件送信する（まとめる書き換えが無く、まとまりを追加しなかったときも送信する）。`hand_back` が偽の `commit`・スレッドの書き込み・応答の終了（`stop`・`stop_failure`）・MindStella のセッションの終了・停止の工程と画面の保存と変更の検知が作るまとまりでは送信しない
  - item: 本文
    constraint: '`{ワークスペースの名前}: 作業が完了しました` と `{画面の URL}` の 2 行。絵文字を使用しない。ワークスペースの名前は `config.yaml` の題名（`summary`）で、空ならフォルダの名前。画面の URL は『ワークスペースの作成』の `url` と同じで、配信が無く画面の URL が無いときは 1 行目だけにする。本文が 2000 文字を超えるときは、ワークスペースの名前を切り詰めて 2000 文字以内にする'
  - item: 送信の方法
    constraint: '`POST {Webhook の URL}?wait=true` に JSON `{"content": 本文}` を送信する。`200` を成功とし、それ以外の応答・接続できない・上限を過ぎたときは失敗として標準エラーに 1 行記録する。再送信しない'
  - item: 送信を待つ上限
    constraint: 非機能要件『Webhook の送信を待つ上限』の秒数
    decided_by: NFR-489-1#
  - item: Webhook の設定
    constraint: 環境変数 `MINDSTELLA_DISCORD_WEBHOOK_FILE` が指すファイルの 1 行目（前後の空白を除く）を Webhook の URL とする。環境変数が無い・ファイルが無い・参照できない・1 行目が `http://` か `https://` で始まらないときは送信しない。ファイルは送信のたびに参照する（常駐サーバーを再起動せずに差し替えられる）
  - item: Webhook の URL の秘匿
    constraint: Webhook の URL を、標準エラー・応答・ワークスペース・状態のフォルダに記録しない。失敗の行に記録するのは、ステータスコードか失敗の種類（接続できない・上限を過ぎた・設定を参照できない）だけ
  - item: 公開 URL
    constraint: 本文の末尾の画面の URL は『プレビューの URL』の制約「公開 URL」と同じ
flows:
  - name: 正常系
    summary: 手番を返す直前の commit が成功したので、1 件送信する
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。受けた要求を記録して 200 を返却する）
      - name: 常駐サーバー
        description: テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ、`MINDSTELLA_DISCORD_WEBHOOK_FILE` はエンドポイントの URL を 1 行記載した一時ファイル
      - name: 状態
        description: '`status: running` の `session.json` と、題名を持つワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant CM as commit（MCP のツール）
        participant IF as 作業の完了の通知
        participant DC as Discord

        クライアント->>CM: MindStella のセッションとして reply を呼ぶ
        クライアント->>CM: MindStella のセッションとして commit を hand_back true で呼ぶ
        CM-->>クライアント: 結果
        CM->>IF: 呼ぶ
        IF->>DC: POST ?wait=true content
        DC-->>IF: 200
      ```
    expected:
      - エンドポイントが 1 件の要求を受け、クエリに `wait=true` がある
      - '`content` が `{題名}: 作業が完了しました` と画面の URL の 2 行である'
      - 標準エラーに送信の成功の行があり、エンドポイントの URL を含まない
    test: test_normal
  - name: 正常系（作業の途中の commit）
    summary: hand_back を指定しない commit と、スレッドの書き込みでは送信しない
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。受けた要求を記録して 200 を返却する）
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: 状態
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant CM as commit（MCP のツール）

        クライアント->>CM: MindStella のセッションとして reply を呼ぶ
        クライアント->>CM: MindStella のセッションとして commit を呼ぶ（hand_back なし）
        CM-->>クライアント: 結果
      ```
    expected:
      - エンドポイントが要求を受けていない
    test: test_normal_when_committed_during_work
  - name: 正常系（応答の終了）
    summary: commit の後に応答の終了（stop）を受けても送信しない
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。受けた要求を記録して 200 を返却する）
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: 状態
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant CM as commit（MCP のツール）
        participant EV as POST /_admin/sessions/{session}/events

        クライアント->>CM: MindStella のセッションとして commit を呼ぶ（hand_back なし）
        クライアント->>EV: stop
        EV-->>クライアント: 200 recorded: true
      ```
    expected:
      - エンドポイントが要求を受けていない
    test: test_normal_when_response_stopped
  - name: 正常系（Webhook の設定が無い）
    summary: 環境変数が無いときは送信しない
    setup:
      - name: Mock
        description: なし（送信先が無い）
      - name: 常駐サーバー
        description: '`MINDSTELLA_DISCORD_WEBHOOK_FILE` を指定せずに起動する'
      - name: 状態
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant MCP as commit（MCP のツール）
        participant IF as 作業の完了の通知

        クライアント->>MCP: MindStella のセッションとして commit を hand_back true で呼ぶ
        MCP-->>クライアント: 結果
        MCP->>IF: 呼ぶ
        IF->>IF: 設定が無いので送信しない
      ```
    expected:
      - '`commit` がツールのエラーにならない'
      - 標準エラーに送信の行が無い
    test: test_normal_when_webhook_not_configured
  - name: 異常系（送信の失敗・なし）
    summary: Webhook が 500 を返却しても commit は成功し、失敗を URL を含めずに記録する
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。500 を返却する）
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: 状態
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant MCP as commit（MCP のツール）
        participant IF as 作業の完了の通知
        participant DC as Discord

        クライアント->>MCP: MindStella のセッションとして commit を hand_back true で呼ぶ
        MCP-->>クライアント: 結果
        MCP->>IF: 呼ぶ
        IF->>DC: POST ?wait=true content
        DC-->>IF: 500
        IF->>IF: 標準エラーに失敗を 1 行記録する
      ```
    expected:
      - '`commit` がツールのエラーにならない'
      - エンドポイントが 1 件だけ要求を受けている（再送信しない）
      - 標準エラーに `500` を含む失敗の行があり、エンドポイントの URL を含まない
    test: test_error_when_send_failed
  - name: 異常系（送信を待つ上限・なし）
    summary: Webhook が上限まで応答しないときは打ち切り、commit の結果を待たせない
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。上限より長く応答しない）
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: 状態
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant MCP as commit（MCP のツール）
        participant IF as 作業の完了の通知
        participant DC as Discord

        クライアント->>MCP: MindStella のセッションとして commit を hand_back true で呼ぶ
        MCP-->>クライアント: 結果
        MCP->>IF: 呼ぶ
        IF->>DC: POST ?wait=true content
        IF->>IF: 上限で打ち切り、標準エラーに失敗を 1 行記録する
      ```
    expected:
      - '`commit` の結果が、送信の結果を待たずに返っている'
      - 標準エラーに上限を過ぎた失敗の行があり、エンドポイントの URL を含まない
    test: test_error_when_send_timed_out

id: IF-489-43
title: "書き換えのまとまり"
entry:
  kind: mcp_tool
  value: '`commit`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__plugin_mindstella_mindstella__commit`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: まだまとめていない書き換えを説明つきのまとまりにする
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` した後、D-1 の `answer` を修正し、タスク T-1 を追加して、変更の検知が `pending` に記録したワークスペース（保持する回数は既定の 5）
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「D-1 を決め、T-1 を積む」
        IF-->>WS: changes.yaml を読む
        IF->>IF: pending をまとまり V-2 にする
        IF->>WS: changes.yaml を書く
        IF-->>クライアント: JSON（id: V-2・added・changed）
      ```
    expected:
      - ツールのエラーにならない
      - '`id` が `V-2`、`added` が `[T-1]`、`changed` が `[D-1]`、`summary` が渡した説明'
      - '`changes.yaml` の `sets` の先頭が V-2 で、`by` が `ai`、`until_seq` が `last_seq` と同じ。`pending` の `added`・`changed` が空'
      - D-1 の変更履歴の先頭の `seq` が、V-1 の `until_seq` より大きく V-2 の `until_seq` 以下
      - '`decisions.yaml`・`tasks.yaml` の中身が呼ぶ前と同じ'
    test: test_normal
  - name: 正常系（まとめる書き換えが無い）
    summary: まだまとめていない書き換えが無ければ、まとまりを追加しない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「何もしない」
        IF-->>WS: changes.yaml を読む
        IF-->>クライアント: JSON（id: null）
      ```
    expected:
      - ツールのエラーにならない
      - '`id`・`at`・`summary` が `null`、`added`・`changed` が空'
      - '`changes.yaml` の中身が呼ぶ前と同じ'
    test: test_normal_when_nothing_pending
  - name: 異常系（説明が空・引数の誤り）
    summary: 空白だけの説明ではまとめない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加し、まだ `commit` していないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）

        クライアント->>IF: commit workspace summary（空白だけ）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: 引数の誤り: summary:` で始まる'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_error_when_summary_empty
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すと、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: commit workspace summary「a」
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（記録の構造が崩れている・SchemaMismatchError）
    summary: 手で崩した changes.yaml ではまとめず、合わない箇所を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`changes.yaml` の `pending` から `added` を削除したワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「a」
        IF-->>WS: changes.yaml を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `changes.yaml: pending` で始まる行がある'
      - '`changes.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_schema_mismatch
  - name: 異常系（書き込めない・WriteFailedError）
    summary: 書き込めないワークスペースではまとめず、エラーの行を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加し、ワークスペースのフォルダの書き込みの権限を外したワークスペース
        notes: root で動かすときは skip する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「a」
        IF-->>WS: changes.yaml を読む
        IF->>WS: 一時ファイルを書けない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、トレースバックを含まない'
      - '`changes.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_write_fails
  - name: 正常系（削除した項目をまとめる）
    summary: 削除した項目だけがあるときも、まとまりを 1 つ追加する
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
        notes: '-'
      - name: make_workspace
        description: メモ N-1・N-2 を追加して `commit` し、N-2 を削除して、変更の検知が `pending.removed` に記録したワークスペース
        notes: '-'
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
      - name: summary
        description: 一言の説明
        notes: '`重複した N-2 を消す`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary
        IF-->>WS: changes.yaml を読む
        IF->>WS: sets の先頭に removed を持つまとまりを追加し、pending を空にする
        IF-->>クライアント: JSON（id・at・summary・added・changed・removed）
      ```
    expected:
      - ツールのエラーにならない
      - 結果の `id` が空でなく、`removed` が N-2 の 1 件
      - '`changes.yaml` の `sets` の先頭が `removed` に N-2 を持ち、`pending` の `added`・`changed`・`removed` が空'
    test: test_normal_when_item_removed
  - name: 正常系（外部の変更が残っている）
    summary: 外部の変更を先に外部の変更のまとまりにしてから、自分の書き換えをまとめる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '検討事項 D-1 を持ち、`changes.yaml` の `pending` が `by: external`・`changed: [D-1]` のワークスペース'
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「a」
        IF-->>WS: changes.yaml を読む
        IF->>WS: 外部の変更をまとまりにする
        IF-->>クライアント: JSON（id: null）
      ```
    expected:
      - ツールのエラーにならず、`id` が `null`
      - '`changes.yaml` の `sets` の先頭が `by: external`・説明「ほかのセッションの書き込み」・`changed: [D-1]` で、`pending` が空'
    test: test_normal_when_external_pending
  - name: 異常系（MindStella のセッションでない・NotMindStellaSessionError）
    summary: MindStella のセッションでない呼び出しではまとめない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を追加し、まだ `commit` していないワークスペース
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
      - name: 呼ぶ値
        description: '`session.claude_session_id` に、状態の MindStella のセッションと違う値を入れる'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）

        クライアント->>IF: commit（違う claude_session_id）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - 'ツールのエラーになり、本文が `エラー: MindStella のセッションだけが呼べます: commit`'
      - '`changes.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_not_mindstella_session
  - name: 正常系（手番を返す）
    summary: hand_back が真では、まとめる書き換えが無くても、結果を返却した後に作業の完了の通知を呼ぶ
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。受けた要求を記録して 200 を返却する）。MCP サーバーは `MINDSTELLA_DISCORD_WEBHOOK_FILE` にエンドポイントの URL を記載した一時ファイルを指定して起動する
      - name: make_workspace
        description: 検討事項 D-1 を追加して `commit` したワークスペース（まだまとめていない書き換えが無い）
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant NT as 作業の完了の通知
        participant DC as Discord

        クライアント->>IF: commit workspace summary「質問に答えた」 hand_back true
        IF->>IF: まとめる書き換えが無い
        IF-->>クライアント: JSON（id: null）
        IF->>NT: 呼ぶ
        NT->>DC: POST ?wait=true content
      ```
    expected:
      - ツールのエラーにならず、`id` が `null`
      - エンドポイントが 1 件の要求を受けている
      - '`changes.yaml` の中身が呼ぶ前と同じ'
    test: test_normal_when_hand_back
  - name: 正常系（作業の途中）
    summary: hand_back を渡さない commit では、まとまりを追加しても通知を呼ばない
    setup:
      - name: Mock
        description: Discord の Webhook（正常系（手番を返す）と同じ）
      - name: make_workspace
        description: 検討事項 D-1 を追加し、まだ `commit` していないワークスペース
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）

        クライアント->>IF: commit workspace summary「D-1 を足す」
        IF->>IF: pending をまとまりにする
        IF-->>クライアント: JSON（id: V-2）
      ```
    expected:
      - ツールのエラーにならず、`id` が空でない
      - エンドポイントが要求を受けていない
    test: test_normal_when_not_hand_back
  - name: 異常系（未着手・進行中のタスクが残っている・OpenTasksRemainError）
    summary: hand_back が真で、状態が未着手・進行中のタスクが残っていれば、まとめずに残っているタスクを返却して拒む
    setup:
      - name: Mock
        description: Discord の Webhook（正常系（手番を返す）と同じ）
      - name: make_workspace
        description: 未着手のタスク T-1・進行中のタスク T-2・保留のタスク T-3・完了のタスク T-4 を追加し、まだ `commit` していないワークスペース
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「T-1 を積む」 hand_back true
        IF-->>WS: tasks.yaml を読む
        IF->>IF: 未着手の T-1・進行中の T-2 が残っている
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - 'ツールのエラーになり、本文の 1 行目が `エラー: 未着手・進行中のタスクが残っています` で始まる'
      - '本文に `T-1: 未着手` と `T-2: 進行中` で始まる行があり、T-3・T-4 の行が無い'
      - '`changes.yaml` の中身が呼ぶ前と同じで、`pending` に T-1・T-2・T-3・T-4 が残っている'
      - エンドポイントが要求を受けていない
    test: test_error_when_open_tasks_remain
  - name: 正常系（作業の途中はタスクの状態を問わない）
    summary: hand_back を渡さない commit は、未着手・進行中のタスクが残っていてもまとめる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 未着手のタスク T-1 を追加し、まだ `commit` していないワークスペース
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「T-1 を積む」
        IF->>IF: pending をまとまりにする
        IF->>WS: changes.yaml を書く
        IF-->>クライアント: JSON（id: V-2）
      ```
    expected:
      - ツールのエラーにならず、`id` が空でなく、`added` が `[T-1]`
      - T-1 の状態が未着手のままである
    test: test_normal_when_open_tasks_during_work
  - name: 異常系（手番を返すときに tasks.yaml が崩れている・SchemaMismatchError）
    summary: hand_back が真で、手で崩した tasks.yaml ではまとめず、合わない箇所を返却する
    setup:
      - name: Mock
        description: Discord の Webhook（正常系（手番を返す）と同じ）
      - name: make_workspace
        description: タスク T-1 を追加してまだ `commit` していないワークスペースで、`tasks.yaml` の T-1 から `status` を削除した
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: commit workspace summary「a」 hand_back true
        IF-->>WS: tasks.yaml を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `tasks.yaml: ` で始まる行がある'
      - '`changes.yaml` の中身が呼ぶ前と同じ'
      - エンドポイントが要求を受けていない
    test: test_error_when_tasks_schema_mismatch_on_hand_back
  - name: 正常系（手番を返すときに tasks.yaml が無い）
    summary: tasks.yaml が無いワークスペースでは、タスクが 0 件として手番を返す commit を通す
    setup:
      - name: Mock
        description: Discord の Webhook（正常系（手番を返す）と同じ）
      - name: make_workspace
        description: 検討事項 D-1 だけを追加してまだ `commit` していないワークスペースで、`tasks.yaml` が無い
      - name: MindStella のセッション
        description: 状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as commit（MCP のツール）
        participant NT as 作業の完了の通知

        クライアント->>IF: commit workspace summary「D-1 を足す」 hand_back true
        IF->>IF: tasks.yaml が無いのでタスクは 0 件
        IF->>IF: pending をまとまりにする
        IF-->>クライアント: JSON（id: V-2）
        IF->>NT: 呼ぶ
      ```
    expected:
      - ツールのエラーにならず、`id` が空でなく、`added` が `[D-1]`
      - エンドポイントが 1 件の要求を受けている
      - '`tasks.yaml` が無いままである'
    test: test_normal_when_no_tasks_file_on_hand_back
lead: まだまとめていない書き換え（最後のまとまりより後に `pending` に入った書き換え）を、日時と一言の説明を付けた 1 つのまとまりにする。プレビューの変更履歴は、このまとまりを並べる。
idempotent: false
side_effects: '`changes.yaml` の `sets` の先頭にまとまりを 1 つ追加し、`pending` を空にする。項目の YAML と本文は書き換えない'
callers:
  - IF-565-1#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ'
  - name: summary
    type: str
    required: true
    location: argument
    description: このまとまりで何をしたかの一言の説明。プレビューの変更履歴にそのまま出る
    constraints: 前後の空白を除いて 1〜200 文字
    example: D-1 を決め、T-1 を積む
  - name: session.claude_session_id
    type: str
    required: true
    location: argument
    description: 呼んだ Claude Code の `session_id`（『セッションの値の注入』が入れる）
    constraints: そのワークスペースの MindStella のセッションの `claude_session_id`（『MCP サーバーの起動』の「MindStella のセッションに限るツール」）
  - name: hand_back
    type: bool
    required: false
    default: 'false'
    location: argument
    description: 利用者に手番を返す直前の commit か。真のとき、成功した後に『作業の完了の通知』を呼ぶ。返信へ差分のリンクを入れるために作業の途中で呼ぶときは偽
    example: 'true'
response:
  - name: id
    type: str | None
    description: 追加したまとまりの ID。まだまとめていない書き換えが無く、まとまりを追加しなかったときは `null`
    example: V-3
  - name: at
    type: str | None
    description: まとめた日時（UTC のタイムゾーン付き ISO 8601、秒まで）。追加しなかったときは `null`
  - name: summary
    type: str | None
    description: 前後の空白を除いた説明。追加しなかったときは `null`
  - name: added
    type: list[str]
    description: このまとまりで追加した項目の ID
  - name: changed
    type: list[str]
    description: このまとまりで変えた項目の ID（追加した項目は含めない）
  - name: removed
    type: list[{id, kind, title}]
    description: このまとまりで削除した項目（ID・種類・削除したときのタイトル）
exceptions:
  - name: なし（正常終了）
    condition: まとめた（まだまとめていない書き換えが無く、何も追加しなかったときも含む）
    notes: 結果を返す
  - name: 引数の誤り
    condition: '`summary` が空白だけか、200 文字を超える'
    notes: ツールのエラー。何も書き込まない
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー。何も書き込まない
  - name: NotMindStellaSessionError
    condition: '`session.claude_session_id` が、そのワークスペースの MindStella のセッションでない'
    notes: ツールのエラー。何も書き込まない
  - name: SchemaMismatchError
    condition: '`changes.yaml` がスキーマに合わないか、YAML として読めない。`hand_back` が真で、`tasks.yaml` がスキーマに合わないか、YAML として読めない'
    notes: ツールのエラー。エラーの本文に合わない箇所。何も書き込まない
  - name: WriteFailedError
    condition: 一時ファイルの書き込みか置き換えに失敗した
    notes: ツールのエラー。エラーの本文に書けなかったパスと理由。`changes.yaml` を書き換えない
  - name: OpenTasksRemainError
    condition: '`hand_back` が真で、`tasks.yaml` に状態が `未着手`・`進行中` のタスクが 1 件以上ある'
    notes: ツールのエラー。エラーの本文に残っているタスクの ID・状態・タイトル。何も書き込まず、作業の完了の通知も呼ばない
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。引数の誤りは `エラー: 引数の誤り: summary: {理由}`。未着手・進行中のタスクが残っているときは `エラー: 未着手・進行中のタスクが残っています（保留・完了・中止にしてから呼び直してください）` の後に、タスクごとに `{ID}: {状態}: {タイトル}` の行を ID の順に続ける。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。'
constraints:
  - item: 呼べるセッション
    constraint: そのワークスペースの MindStella のセッションだけ（『MCP サーバーの起動』の「MindStella のセッションに限るツール」）。正常系のフローは、状態に登録した MindStella のセッションの `claude_session_id` を `session.claude_session_id` に入れて呼ぶ
  - item: 結果の構造
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返却方法
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: まとまりの ID
    constraint: '`V-` + 連番。連番はまとまりの最大 + 1（まとまりが無ければ 1）で、番号を使い回さない'
  - item: まとまりの中身
    constraint: '`changes.yaml` の `pending` の `added`・`changed`・`removed` をそのままコピーし、`until_seq` に `last_seq` を書く。`removed` が空のときはまとまりに `removed` のキーを置かない。まとまりに入る変更履歴は、1 つ前のまとまりの `until_seq` より大きく、このまとまりの `until_seq` 以下の `seq` を持つもの（ER 図『ワークスペース』の `changes.yaml`）'
  - item: まとまりの書き込み元
    constraint: '追加したまとまりに `by: ai` を書く'
  - item: 外部の変更が残っているとき
    constraint: '`pending.by` が `external` なら、それを先に説明「ほかのセッションの書き込み」・`by: external` のまとまりにしてから、このまとまりを追加する。外部の変更だけが残っていたときは、外部の変更のまとまりだけを追加し、結果はまとまりを追加しなかったときと同じにする'
    notes: 外部の変更は MindStella のセッションの応答の途中でない間にだけ記録されるため、`commit` を呼んだ応答の変更と混ざらない（『変更の検知』）
  - item: まだまとめていない書き換えが無いとき
    constraint: '`pending` の `added`・`changed`・`removed` が全て空なら、まとまりを追加せず、`changes.yaml` も書かない'
  - item: まとまりの保持
    constraint: 削除しない（保持する回数は項目の変更履歴だけにかかる）
  - item: 巻き戻し
    constraint: 持たない。まとめた後も書き換えはワークスペースに残る
  - item: YAML の記載方法
    constraint: '`safe_dump(allow_unicode=True, sort_keys=False)`。一時ファイルに書いてから `os.replace` で置き換える'
  - item: 作業の完了の通知
    constraint: '`hand_back` が真で成功したとき（まとめる書き換えが無く、まとまりを追加しなかったときも含む）だけ、結果を返却した後に『作業の完了の通知』を呼ぶ。`hand_back` が偽のときと、エラーになったときは呼ばない。通知の成否は結果に含めない'
  - item: 手番を返す条件
    constraint: '`hand_back` が真のときだけ、まとめる前に `tasks.yaml` を読み、状態が `未着手`・`進行中` のタスクがあれば OpenTasksRemainError にする。`保留`・`完了`・`中止` だけなら、タスクが 0 件のときも、今までどおりまとめる。`tasks.yaml` が無いときはタスクが 0 件として扱う。`tasks.yaml` がスキーマに合わないか YAML として読めないときは SchemaMismatchError にし、何も書き込まず、作業の完了の通知も呼ばない。決めるのはタスクの状態だけで、進め方の工程が残っているかは調べない（エージェントフロー mindstella/on-comment の「手番を返す前の確認」が受け持つ）。`hand_back` が偽のときはタスクの状態を問わない'
    notes: 調べるのは、引数の誤り・WorkspaceNotFoundError・NotMindStellaSessionError の後で、外部の変更をまとめる前。拒んだときは外部の変更のまとまりも追加しない
exclusivity: ワークスペースを書き換えるツールと同じ鍵とロック（『MCP サーバーの起動』の同時の呼び出し）を取ってから読み・書く

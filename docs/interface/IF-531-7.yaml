id: IF-531-7
title: MindStella のセッションのフック
entry:
  kind: trigger
  value: '`session_hook.py`（SessionStart・SessionEnd・UserPromptSubmit・Stop・StopFailure）'
lead: プラグインのフックが全てのセッションで呼び、環境変数 `MINDSTELLA_SESSION` を持つ MindStella のセッションでだけ、出来事を常駐サーバーへ送り、SessionStart では起動の契機・再開の状況・進め方の文書の場所と、起動と再開のエージェントフローを先に進める案内を注入する。
idempotent: true
side_effects: 『MindStella のセッションの出来事の受け取り』へ送る。SessionStart では『再開の状況』を呼び、前回参照した時点が書き換わる。ほかは書かない
request:
- name: '{出来事}'
  type: str
  required: true
  location: argument
  description: コマンドの最初の引数。`session-start`・`session-end`・`prompt-submit`・`stop`・`stop-failure`
- name: 標準入力
  type: JSON
  required: true
  location: argument
  description: Claude Code のフックの入力（`session_id`・`source`・`reason` など）
- name: MINDSTELLA_SESSION
  type: str
  required: false
  default: なし（通常のセッション。何もせずに終了コード 0）
  location: argument
  description: 環境変数。MindStella のセッションの ID
- name: MINDSTELLA_FLOW
  type: str
  required: false
  default: なし（注入しない）
  location: argument
  description: 環境変数。進め方の文書の場所（`{配信元の ID}#{文書の ID}`）
- name: MINDSTELLA_PORT
  type: str
  required: false
  default: '`8784`'
  location: argument
  description: 環境変数。送り先のポート
- name: TMUX
  type: str
  required: false
  default: なし（`socket` を送らない）
  location: argument
  description: 環境変数。最初の `,` より前をペインの tmux のサーバーのソケットとして `socket` で送る
response:
- name: 標準出力
  type: JSON | なし
  description: SessionStart でだけ、`hookSpecificOutput.additionalContext` に注入文を入れた JSON。注入文は、起動の契機（`起動` か `再開`）・『再開の状況』の応答（取り込み待ちのスレッドの件数・前回参照した後に変わった項目の ID と要約・要見直しの検討事項・進行中の作業・移し替えの報告）・進め方の文書の場所・起動と再開のエージェントフロー `mindstella/startup` を参照して先に進める案内を持つ。次の候補・スキルの呼び方を持たない。ほかの出来事では何も書かない
exceptions:
- name: なし（正常終了）
  condition: どの結末も
  notes: 終了コード 0。常駐サーバーへつながらない・応答が 200 でないときは標準エラーに 1 行書いて終わり、会話を止めない
constraints:
- item: 契機
  constraint: プラグインの `hooks/hooks.json` の `SessionStart`・`SessionEnd`・`UserPromptSubmit`・`Stop`・`StopFailure`（`matcher` なし）に、`python3 "${CLAUDE_PLUGIN_ROOT}/skills/mindmap/scripts/session_hook.py" {出来事}` を置く
- item: 動く Python
  constraint: システムの `python3` の標準ライブラリだけ（『常駐サーバーの起動の確認』と同じ）
- item: 送る時間の上限
  constraint: 1 回の送信を 2 秒で打ち切る
  decided_by: NFR-489-1#requirements[フックの送信の上限]
- item: PID の引き方
  constraint: 『セッションの値の注入』と同じく、フックのプロセスから親をたどり、最初に名前が `claude` のプロセス
- item: 通常のセッション
  constraint: '`MINDSTELLA_SESSION` が無ければ標準入力を読み捨てて何もしない'
- item: 注入文
  constraint: プラグインのプロンプトファイル（今の `references/起動時の指示.md` を移したもの）を読み、『再開の状況』の応答と `MINDSTELLA_FLOW` を埋めて組み立てる。プロンプトファイルの置き場所と形式はモジュール構成設計で決める
- item: 契機ごとの注入
  constraint: '`source` が `startup` のときを起動、`resume`・`clear`・`compact` のときを再開として注入する（A-119 のフックの表）。`fork` では注入しない'
- item: 注入に失敗したとき
  constraint: 『再開の状況』につながらない・応答が 200 でないときは、状況を持たずに起動の契機とエージェントフローの案内だけを注入し、標準エラーに 1 行書く。MindStella のセッションの起動は止めない
flows:
- name: 正常系
  summary: SessionStart で出来事を送り、起動の契機・進め方の文書の場所・エージェントフローの案内を注入する
  setup:
  - name: Mock
    description: 常駐サーバーの代わりに、受けた要求を記録する HTTP のサーバーを空きポートで立てる
  - name: 環境変数
    description: '`MINDSTELLA_SESSION`・`MINDSTELLA_FLOW`・`MINDSTELLA_PORT`・`TMUX_PANE`'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant CC as Claude Code
      participant HK as session_hook.py
      participant SV as 常駐サーバー（Mock）

      CC->>HK: session-start（標準入力に session_id・source: startup）
      HK->>SV: POST /_admin/sessions/{session}/events
      HK-->>CC: additionalContext
    ```
  expected:
  - 'Mock が `event: session_start`・`claude_session_id`・`pane`・`source: startup` を受けている'
  - 標準出力の `additionalContext` に、起動の契機 `起動`・`MINDSTELLA_FLOW` の値・`mindstella/startup` を参照する案内がある
  - 終了コードが 0
  test: test_normal
- name: 正常系（通常のセッション）
  summary: MINDSTELLA_SESSION が無ければ何もしない
  setup:
  - name: Mock
    description: 正常系と同じ
  - name: 環境変数
    description: '`MINDSTELLA_SESSION` を渡さない'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant CC as Claude Code
      participant HK as session_hook.py

      CC->>HK: session-start
      HK-->>CC: 何も出さない
    ```
  expected:
  - Mock が要求を受けておらず、標準出力が空で、終了コードが 0
  test: test_normal_when_ordinary_session
- name: 異常系（常駐サーバーへつながらない）
  summary: 標準エラーに 1 行書いて終了コード 0
  setup:
  - name: Mock
    description: なし（ポートで待ち受けない）
  - name: 環境変数
    description: 正常系と同じ
  flow: |-
    ```mermaid
    sequenceDiagram
      participant CC as Claude Code
      participant HK as session_hook.py

      CC->>HK: stop
      HK->>HK: つながらない
      HK-->>CC: 終了コード 0
    ```
  expected:
  - 終了コードが 0 で、標準エラーに `[mindstella]` の行がある
  test: test_error_when_server_down
- name: 正常系（再開）
  summary: SessionStart の compact で、再開の状況を引いて再開の契機と一緒に注入する
  setup:
  - name: Mock
    description: 常駐サーバーの代わりに、受けた要求を記録し、`/resume` に取り込み待ち 1 件・変わった D-1・要見直し D-1・進行中 T-1 を返す HTTP のサーバーを空きポートで立てる
  - name: 環境変数
    description: '`MINDSTELLA_SESSION`・`MINDSTELLA_PORT`・`TMUX_PANE`（`MINDSTELLA_FLOW` は渡さない）'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant CC as Claude Code
      participant HK as session_hook.py
      participant SV as 常駐サーバー（Mock）

      CC->>HK: session-start（標準入力に source: compact）
      HK->>SV: POST /_admin/sessions/{session}/events
      HK->>SV: POST /_admin/sessions/{session}/resume
      SV-->>HK: 状況
      HK-->>CC: additionalContext
    ```
  expected:
  - 'Mock が `events` と `resume`（`source: compact`）をこの順に受けている'
  - '`additionalContext` が、起動の契機 `再開`・取り込み待ちの件数 1・D-1 の ID と要約・要見直しの D-1・進行中の T-1・`mindstella/startup` を参照する案内を持ち、次の候補とスキルの呼び方を持たない'
  - 終了コードが 0
  test: test_normal_when_resumed

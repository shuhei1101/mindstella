id: IF-531-6
title: MindStella のセッションの出来事の受け取り
entry:
  kind: endpoint
  value: POST `/_admin/sessions/{session}/events`
lead: MindStella のセッションのフックが送信する出来事（起動・終了・応答の始まりと終わり）を受け、状態のフォルダの MindStella のセッションに記録する。
idempotent: true
side_effects: '`session.json` の `claude_session_id`・`pid`・`pane`・`claude_config_dir`・`balancer_account`・`status`・`responding` を書き換える。`prompt_submit`・`stop`・`stop_failure`・`session_end` で『作業の完了の通知』の書き込みのマーカーを解除し、`stop` の応答を返却した後に『作業の完了の通知』を呼ぶ。`session_end` が `running` から `stopped` に書き換えたときに『停止の通知』を呼ぶ'
request:
  - name: session
    type: str
    required: true
    location: path
    description: MindStella のセッションの ID（フックが `MINDSTELLA_SESSION` から入れる）
  - name: event
    type: Literal['session_start', 'session_end', 'prompt_submit', 'stop', 'stop_failure', 'pre_compact']
    required: true
    location: body
    description: 出来事
  - name: claude_session_id
    type: str
    required: true
    location: body
    description: Claude Code の `session_id`
  - name: source
    type: str | None
    required: false
    default: なし
    location: body
    description: SessionStart の `source`（`startup`・`resume`・`clear`・`compact`・`fork`）
  - name: reason
    type: str | None
    required: false
    default: なし
    location: body
    description: SessionEnd の `reason`
  - name: pane
    type: str | None
    required: false
    default: なし
    location: body
    description: '`TMUX_PANE`'
  - name: socket
    type: str | None
    required: false
    default: なし
    location: body
    description: '`TMUX` の最初の `,` より前（ペインの tmux のサーバーのソケット）'
  - name: pid
    type: int | None
    required: false
    default: なし
    location: body
    description: Claude Code のプロセスの PID（『セッションの値の注入』と同じ引き方）
  - name: pid_started_at
    type: str | None
    required: false
    default: なし
    location: body
    description: '`pid` のプロセスの起動時刻の文字列'
  - name: Host
    type: str
    required: true
    location: header
    description: 要求のホスト
  - name: claude_config_dir
    type: str | None
    required: false
    default: なし（記録しない）
    location: body
    description: MindStella のセッションの Claude Code が使用する設定のフォルダの絶対パス（`session_start` でフックが入れる）
  - name: error
    type: str | None
    required: false
    default: なし
    location: body
    description: StopFailure のフックの入力の `error`（`rate_limit` など）
  - name: balancer_account
    type: str | None
    required: false
    default: なし（`null` を記録する）
    location: body
    description: claude-balancer が貸したアカウント名（`session_start` でフックが入れる）。『利用枠の見回り』が `GET /accounts` の行と照らす
response:
  - name: recorded
    type: bool
    description: 記録したか。`session` が状態に無いときは偽
status_codes:
  - code: '200'
    condition: 受けた（記録しなかったときも 200。フックを失敗させない）
  - code: '400'
    condition: '`event` が無いか値が違う'
  - code: '403'
    condition: '`Host` が受ける値でない'
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語。失敗した段階は拡張のメンバー `stage` に入れる
constraints:
  - item: 受ける Host
    constraint: '`Host` が `127.0.0.1:{ポート}`・`localhost:{ポート}` でない要求（`MINDSTELLA_ALLOWED_HOSTS` のホスト名を含む）は 403。`Origin` があるときは同じ 2 つのどちらかでなければ 403（D-304・D-340）'
  - item: 記録する中身
    constraint: '`session_start`: `claude_session_id`・`pid`・`pid_started_at`・`pane`・`socket`・`claude_config_dir`・`balancer_account`（送信されなければ `null`）を入れる（`clear`・`compact`・`fork` の後は新しい `claude_session_id` で再入力する）。`session_end`: `reason` が `clear`・`resume` 以外なら `status` を `stopped`、`responding` を偽にする。`prompt_submit`: `responding` を真。`stop`・`stop_failure`: `responding` を偽'
  - item: 同時の依頼
    constraint: '`session.json` ごとの書き込みの鍵だけを取って読み・書く。ワークスペースごとの順番の鍵は取らない（『MindStella のセッションの作成』が鍵を持ったまま SessionStart の登録を待つため）'
  - item: 作業の完了の通知
    constraint: '`prompt_submit` で『作業の完了の通知』の書き込みのマーカーを解除し、`stop` で応答を返却した後に『作業の完了の通知』を呼ぶ。`stop_failure`・`session_end` ではマーカーを解除するだけにする。マーカーの付け方と送信は『作業の完了の通知』のとおり。通知の成否は応答に含めない'
  - item: 停止の通知
    constraint: '`session_end`（`reason` が `clear`・`resume` 以外）で書き換える前の `status` が `running` のときだけ、『停止の通知』を止まった理由 `session_ended` で呼ぶ。`stopping`（停止の依頼の途中）からの書き換えでは呼ばず、『MindStella のセッションの停止』が止め終えたときに呼ぶ。通知の成否は応答に含めない'
  - item: 利用上限
    constraint: '`stop_failure` の `error` が `rate_limit` で、`status` が `running` のとき、応答を返した後に『MindStella のセッションの再起動』を契機 `rate_limit` で呼ぶ'
  - item: 圧縮
    constraint: '`pre_compact` で `status` が `running` のとき、応答を返した後に『MindStella のセッションの再起動』を契機 `compact` で呼ぶ'
  - item: 再起動の途中の終了
    constraint: '`status` が `restarting` のときの `session_end` は、`status` を書き換えず `responding` を偽にするだけにし、『停止の通知』を呼ばない'
flows:
  - name: 正常系
    summary: SessionStart で claude_session_id とペインを記録する
    setup:
      - name: Mock
        description: なし（HTTP のクライアントで送信する）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: 状態
        description: '`status: running` で `claude_session_id` が空の `session.json`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/events

        クライアント->>API: session_start・claude_session_id・pane・pid・claude_config_dir
        API-->>クライアント: 200 recorded: true
      ```
    expected:
      - '`session.json` に `claude_session_id`・`pane`・`pid` が入っている'
      - '`session.json` の `claude_config_dir` が送信した値'
    test: test_normal
  - name: 正常系（応答の始まりと終わり）
    summary: prompt_submit で responding が真、stop で偽
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/events

        クライアント->>API: prompt_submit
        クライアント->>API: stop_failure
      ```
    expected:
      - '`prompt_submit` の後に `responding` が真、`stop_failure` の後に偽'
    test: test_normal_when_responding
  - name: 正常系（clear の後の終了）
    summary: SessionEnd の reason が clear なら停止済みにしない
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/events

        クライアント->>API: session_end・reason: clear
        API-->>クライアント: 200
      ```
    expected:
      - '`status` が `running` のまま'
    test: test_normal_when_cleared
  - name: 正常系（知らない MindStella のセッション）
    summary: 状態に無い session には記録せず 200 を返す
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/events

        クライアント->>API: 状態に無い session
        API-->>クライアント: 200 recorded: false
      ```
    expected:
      - 応答が 200 で `recorded` が偽
      - 状態のフォルダが変わっていない
    test: test_normal_when_unknown_session

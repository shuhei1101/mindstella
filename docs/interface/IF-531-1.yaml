id: IF-531-1
title: ワークスペースの作成
entry:
  kind: endpoint
  value: POST `/workspaces`
lead: 許可するフォルダの下に、ワークスペースの記録を作るか残っている記録を開き、project-index の配信元に登録して、ワークスペースの ID と画面の URL を返す。MindStella の MCP の `create_workspace` も同じ処理を呼ぶ。
idempotent: true
side_effects: 記録が無いフォルダには `.mindstella/` に既定の設定（ワークスペースの ID・進め方の文書）と空の記録を書き（『ワークスペースの作成』と同じ書き方）、直下に `README.md` を書く。状態のフォルダに追加の MCP・プラグインを記録し、project-index の配信元の行を追加し、状態のフォルダのワークスペースの ID の一覧に足す。記録が既にあるフォルダは記録を書き換えない。そのワークスペースのプレビューの配信を立てる
request:
  - name: folder
    type: str
    required: true
    location: body
    description: ワークスペースのフォルダの絶対パス。無ければ作る
    constraints: 許可するフォルダ（グローバルの設定のファイルの `mindstella.allowed_dirs`）のどれかの下。シンボリックリンクを解いて比べる
  - name: flow
    type: '{source: str, doc: str} | None'
    required: false
    default: なし（進め方の文書を持たない。SessionStart のフックは場所を注入しない）
    location: body
    description: 進め方の文書（project-index の配信元の ID と文書の ID）。記録が無いフォルダの設定にだけ記録する
  - name: mcp_config
    type: object | None
    required: false
    default: なし（空の指定として記録する）
    location: body
    description: 'Claude Code の `--mcp-config` に渡す JSON（`{"mcpServers": {...}}`）。状態のフォルダに記録が無いときだけ記録する'
    constraints: '`mcpServers` のキーに `mindstella`・`project-index` を含まない'
  - name: plugin_dirs
    type: list[str]
    required: false
    default: '`[]`（空の指定として記録する）'
    location: body
    description: Claude Code の `--plugin-dir` に渡すフォルダの絶対パス。状態のフォルダに記録が無いときだけ記録する
    constraints: どのフォルダも `.claude-plugin/plugin.json` を持ち、JSON のオブジェクトとして読める
  - name: Host
    type: str
    required: true
    location: header
    description: 要求のホスト
  - name: Origin
    type: str
    required: false
    default: なし
    location: header
    description: ブラウザからの要求の送り元
response:
  - name: id
    type: str
    description: ワークスペースの ID（配信元の行の `id`）。記録が無いフォルダは `mindstella-{フォルダ名}-{ハッシュ}` で振り、設定の `id` に記録する。記録があるフォルダは設定の `id` を返す
    notes: ハッシュはフォルダのシンボリックリンクを解いた絶対パスの SHA-256 の 16 進の先頭 6 桁。フォルダ名の `.`・`:` は `-` に置き換える（『起動のコマンド』の tmux のセッションの名前と同じ規則で、tmux のセッションの名前にも使う）
  - name: url
    type: str
    description: 画面の URL（そのワークスペースのプレビューの配信の `/mindstella.html`）。『プレビューの URL』が返す URL と同じ
  - name: result
    type: Literal['created', 'opened', 'reopened', 'already_open']
    description: '`created` 記録を作った / `opened` 残っている記録を開いて登録した / `reopened` クローズしたワークスペースの配信元の行を戻した / `already_open` 既に開いている'
  - name: launch_options_recorded
    type: bool
    description: 今回の追加の MCP・プラグインの指定を状態のフォルダに記録したか。記録が既にあって使わなかったときは偽（D-341）
status_codes:
  - code: '201'
    condition: '`result` が `created`'
  - code: '200'
    condition: '`result` が `opened`・`reopened`・`already_open`'
  - code: '400'
    condition: 本文が JSON のオブジェクトでない・`folder` が絶対パスでない・`flow` の形が違う
    notes: 何も書かない
  - code: '403'
    condition: 許可するフォルダの外、または `Host`・`Origin` が受ける値でない
    notes: 何も書かない。`stage` は `folder` か `host`
  - code: '409'
    condition: フォルダに移す前の形のワークスペース（`.mindstella/` が無く直下に `config.yaml` か `mindmap.yaml`）がある
    notes: 何も書かない。`detail` に `/mindstella:upgrade` での移し替えの案内
  - code: '422'
    condition: '`mcp_config`・`plugin_dirs` が読めない、または `flow` の文書を参照できない（文書が無い・配信元の `scope.read` にフォルダが含まれない）'
    notes: 何も書かない。`stage` は `mcp_config`・`plugin_dirs`・`flow` のどれか。`detail` に読めない値と理由
  - code: '502'
    condition: project-index へつながらない、または配信元の行の追加がエラーを返した
    notes: この依頼で作った記録と状態のフォルダの記録を消す（記録が既にあって開いたときは記録を消さない）。`stage` は `source`
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語。失敗した段階は拡張のメンバー `stage` に入れる
constraints:
  - item: 受ける Host
    constraint: '`Host` が `127.0.0.1:{ポート}`・`localhost:{ポート}` でない要求（`MINDSTELLA_ALLOWED_HOSTS` のホスト名を含む）は 403。`Origin` があるときは同じ 2 つのどちらかでなければ 403（D-304・D-340）'
    decided_by: NFR-489-1#requirements[待ち受けの範囲]
  - item: 確かめる順
    constraint: '`Host`・`Origin` → 本文 → 許可するフォルダ → 移す前の形 → `mcp_config` → `plugin_dirs` → 既に開いているか → `flow` の参照（記録が無いときだけ）→ 書き込み → 配信元の行 → ID の一覧。どこかで止まったら、それより後は何もしない'
  - item: 既定の設定
    constraint: '記録が無いフォルダの `config.yaml` は、`id`（ワークスペースの ID）・`flow`（渡したときだけ）・`summary`（フォルダ名）・`playbooks: [壁打ち]`・`target_label: 対象`・`phases: [問い, 発散, 整理, 絞り込み, 結論]`（プレイブック『壁打ち』のフェーズ）・`targets: []`・`categories: []` にする。題名・プレイブックなどは、作った後に『設定の更新』で書く（ER 図『ワークスペース』の `config.yaml`）'
    notes: 設定のスキーマが `playbooks`・`phases`・`summary` に 1 件以上・1 文字以上を求めるため、空にできない。プレイブックの削除（#518）で見直す
  - item: 許可するフォルダ
    constraint: project-index の `GET /settings/sources` が返す `settingsPath` のファイルを読み、最上位の `mindstella.allowed_dirs`（絶対パスの並び）を使う。キーが無いか空なら、どのフォルダも許可しない（403）
    notes: project-index は知らないキーを警告にして読み込みを続ける（shuhei1101/project-index#11）
  - item: 記録が既にあるフォルダ
    constraint: '`.mindstella/config.yaml` があれば作り直さずに開く。進め方の文書は設定のまま使い、今回の `flow` は使わない（D-283）。追加の MCP・プラグインは、状態のフォルダに記録が無いときだけ今回の指定を記録する（D-321）。配信元の行が無ければ追加し、`outside_read` が偽（クローズ済み）なら真に戻してクローズ待ちを解く（`reopened`）。`outside_read` を戻すときは、`GET /settings/sources` で `version` を引き、`PATCH /settings/sources/{id}` に `expectedVersion` と `source.outside_read: true` を送る。409（版が古い）なら 1 回だけ引き直して送り直す'
  - item: 配信元の行
    constraint: 'project-index の `POST /settings/sources` に `{"source": {"id": {ID}, "config": "{フォルダ}/.mindstella/dev-docs.yaml", "scope": {"read": ["{フォルダ}", "{フォルダ}/**"], "write": ["{フォルダ}", "{フォルダ}/**"]}, "outside_read": true}}` を送る（`expectedVersion` は送らない）。`scope` はワークスペースのフォルダと、その下の全てのフォルダを作業場所にしたセッションを対象にする。同じ `id` の行がある（409・`result: exists`）ときは、`same` が真なら追加済みとして続け、偽なら 502'
    notes: '本文の形は project-index の『端末の設定の配信元の 1 行の追加』（IF-32）、`/**` の当たり方はコアコンセプト『scope による権限』。`.mindstella/dev-docs.yaml`（記録を配信元として配る設定）は #517 で書くので、#516 では行は `not_served` で登録される（追加は通る。IF-31 の「追加した配信元が検証に通らない」）'
  - item: ID の一覧
    constraint: 状態のフォルダの `workspaces.yaml` の `ids` に足す。配信元の行の追加が通った後に足す
  - item: 追加の MCP・プラグインの記録
    constraint: 状態のフォルダの `workspaces/{id}/launch.json` に `mcp_config` と `plugin_dirs` を書く。指定が空でも書く（記録が無いことと区別する。D-320）
  - item: 同時の依頼
    constraint: 同じフォルダへの作成はフォルダごとの鍵、ID の一覧の書き込みは全体で 1 つの鍵、記録と状態の書き込みはワークスペースごとの鍵（セッションの管理と共有する）を取ってから行う
  - item: MCP のツール
    constraint: '`create_workspace` は同じ引数（`folder`・`flow`・`mcp_config`・`plugin_dirs`）を受け、同じ処理を呼び、応答と同じ JSON を構造化の結果で返す。エラーは `エラー: {detail}`（『MCP サーバーの起動』のエラーの形）。`Host` の確かめは `/mcp` の確かめに任せる'
  - item: 進め方の文書の確かめ方
    constraint: 'project-index の HTTP の読み取り API で 3 段に確かめる。(1) `GET /settings/sources` の `flow.source` の行の `scope.read` に、ワークスペースのフォルダが当たる（当たらなければ 422・理由 `scope`）。(2) `GET /sources/{flow.source}/docs` の一覧から、`id` が `flow.doc` の文書のパスを引く（無ければ 422・理由 `missing`。配信元が無ければ 404 の `missing: source`）。(3) `GET /sources/{flow.source}/docs/{パス}?id={flow.doc}` が 200 を返す（404 なら 422・理由 `missing`）'
    notes: 常駐サーバーは文書の MCP（`search_docs`）を呼ばない
flows:
  - name: 正常系
    summary: 記録が無いフォルダに記録を作り、配信元に登録して ID と URL を返す
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 許可するフォルダの下の、まだ無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）
        participant WS as ワークスペース

        クライアント->>API: folder・flow・mcp_config・plugin_dirs
        API->>PI: GET /settings/sources
        PI-->>API: settingsPath
        API->>API: 許可するフォルダ・mcp_config・plugin_dirs を確かめる
        API->>PI: flow の文書を参照できるか（search_docs）
        API->>WS: .mindstella/ に既定の設定と空の記録を書く
        API->>API: 状態のフォルダに launch.json を書く
        API->>PI: POST /settings/sources
        API->>API: workspaces.yaml の ids に足す
        API-->>クライアント: 201 id・url・created・launch_options_recorded: true
      ```
    expected:
      - 応答が 201 で、`result` が `created`、`launch_options_recorded` が真
      - '`.mindstella/config.yaml` の `id` が応答の `id` で、`flow` が渡した値'
      - 状態のフォルダの `workspaces/{id}/launch.json` に渡した `mcp_config`・`plugin_dirs` があり、`workspaces.yaml` の `ids` に `id` がある
      - 'project-index の Mock が、`config`・`scope`・`outside_read: true` の行の追加を受けている'
      - '`url` を開くと、そのワークスペースの画面が返る'
    test: test_normal
  - name: 正常系（記録が既にある）
    summary: 残っている記録を開き、状態のフォルダに記録が無いので今回の指定を記録する
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 記録があり、配信元の行と状態のフォルダの記録が無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: folder・flow・mcp_config・plugin_dirs
        API->>API: 設定の id と flow をそのまま使う
        API->>API: launch.json が無いので今回の指定を書く
        API->>PI: POST /settings/sources
        API-->>クライアント: 200 opened・launch_options_recorded: true
      ```
    expected:
      - 応答が 200 で `result` が `opened`
      - '`config.yaml` が呼ぶ前と同じ'
      - '`launch.json` に今回の指定があり、配信元の行の追加を受けている'
    test: test_normal_when_records_exist
  - name: 正常系（既に開いている）
    summary: 記録・配信元の行・状態のフォルダの記録を変えずに、既にある ID を返す
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 正常系で作ったフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: 違う mcp_config・plugin_dirs
        API-->>クライアント: 200 already_open・launch_options_recorded: false
      ```
    expected:
      - 応答が 200 で `result` が `already_open`、`launch_options_recorded` が偽
      - '`launch.json` と `config.yaml` が呼ぶ前と同じで、project-index の Mock が新しい依頼を受けていない'
    test: test_normal_when_already_open
  - name: 正常系（クローズしたワークスペース）
    summary: 配信元の行の `outside_read` を真に戻し、クローズ待ちを解く
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 'クローズした（配信元の行が `outside_read: false`、状態がクローズ待ち）ワークスペースのフォルダ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: folder
        API->>PI: PATCH /settings/sources/{id}（outside_read: true）
        API->>API: 状態のクローズ待ちを解く
        API-->>クライアント: 200 reopened
      ```
    expected:
      - 応答が 200 で `result` が `reopened`
      - 'project-index の Mock が `outside_read: true` の変更を受け、状態の `close_pending` が偽'
    test: test_normal_when_closed
  - name: 異常系（許可するフォルダの外）
    summary: 403 を返し、何も書かない
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 許可するフォルダの外
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: folder
        API-->>クライアント: 403 stage: folder
      ```
    expected:
      - 応答が 403 で `stage` が `folder`
      - フォルダに `.mindstella/` が無く、状態のフォルダと project-index の Mock に記録が無い
    test: test_error_when_folder_not_allowed
  - name: 異常系（読めない指定）
    summary: '`mcp_config`・`plugin_dirs`・`flow` のどれかが読めなければ 422 を返し、何も書かない'
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: 指定
        description: '`mcpServers` に `mindstella` を持つ `mcp_config`、`plugin.json` の無い `plugin_dirs`、無い文書を指す `flow` を 1 つずつ渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: 読めない指定
        API-->>クライアント: 422 stage: mcp_config / plugin_dirs / flow
      ```
    expected:
      - それぞれ 422 で `stage` が読めない引数の名前
      - 記録・状態のフォルダの記録・配信元の行が作られていない
    test: test_error_when_options_invalid
  - name: 異常系（配信元の登録に失敗する）
    summary: 502 を返し、この依頼で作った記録と状態のフォルダの記録を消す
    setup:
      - name: Mock
        description: project-index の Mock の `POST /settings/sources` が 500 を返す
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 許可するフォルダの下の、まだ無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: folder
        API->>PI: POST /settings/sources
        PI-->>API: 500
        API->>API: 書いた記録と launch.json を消す
        API-->>クライアント: 502 stage: source
      ```
    expected:
      - 応答が 502 で `stage` が `source`
      - フォルダに `.mindstella/` が無く、状態のフォルダに `launch.json` が無く、`ids` に足されていない
    test: test_error_when_source_registration_fails
  - name: 異常系（別のホスト）
    summary: '`Host` が受ける値でなければ 403'
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: '`MINDSTELLA_ALLOWED_HOSTS` に `example.test` を渡して起動する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: Host: example.test
        API-->>クライアント: 403 stage: host
      ```
    expected:
      - 応答が 403 で何も書かれていない
    test: test_error_when_host_not_local

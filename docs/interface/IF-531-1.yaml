id: IF-531-1
title: ワークスペースの作成
entry:
  kind: endpoint
  value: POST `/workspaces`
lead: 許可するフォルダの下に、ワークスペースの記録を作るか残っている記録を開き、project-index の配信元に登録して、ワークスペースの ID と画面の URL を返す。MindStella の MCP の `create_workspace` も同じ処理を呼ぶ。
idempotent: true
side_effects: 記録が無いフォルダには `.mindstella/` に既定の設定（ワークスペースの ID・進め方の文書）と空の記録と、記録を project-index の配信元として配る設定（`dev-docs.yaml`・`schemas/`）を書き（『ワークスペースの作成』と同じ書き方）、直下に `README.md` を書く。状態のフォルダに追加の MCP・プラグインを記録し、project-index の配信元の行を追加し、状態のフォルダのワークスペースの ID の一覧に足す。記録が既にあるフォルダは、記録のバージョンが古ければ『記録の形式の移行』で移し替えてから開き、それ以外はスキーマの複製（『記録の形式の移行』の制約『スキーマの複製』）のほかは書き換えない。スキーマの複製を書き直したときは、project-index にその配信元を読み直させる。そのワークスペースのプレビューの配信を立てる
request:
  - name: folder
    type: str
    required: true
    location: body
    description: ワークスペースのフォルダの絶対パス。無ければ作る
    constraints: 許可するフォルダ（グローバルの設定のファイルの `mindstella.allowed_dirs`）のどれかの下。シンボリックリンクを解いて比べる
  - name: flow
    type: '{source: str, doc: str} | None'
    required: false
    default: なし（進め方の文書を持たない。SessionStart のフックは場所を注入しない）
    location: body
    description: 進め方の文書（project-index の配信元の ID と文書の ID）。記録が無いフォルダの設定にだけ記録する
  - name: mcp_config
    type: object | None
    required: false
    default: なし（空の指定として記録する）
    location: body
    description: 'Claude Code の `--mcp-config` に渡す JSON（`{"mcpServers": {...}}`）。状態のフォルダに記録が無いときだけ記録する'
    constraints: '`mcpServers` のキーに `mindstella`・`project-index` を含まない'
  - name: plugin_dirs
    type: list[str]
    required: false
    default: '`[]`（空の指定として記録する）'
    location: body
    description: Claude Code の `--plugin-dir` に渡すフォルダの絶対パス。状態のフォルダに記録が無いときだけ記録する
    constraints: どのフォルダも `.claude-plugin/plugin.json` を持ち、JSON のオブジェクトとして読める
  - name: Host
    type: str
    required: true
    location: header
    description: 要求のホスト
  - name: Origin
    type: str
    required: false
    default: なし
    location: header
    description: ブラウザからの要求の送り元
response:
  - name: id
    type: str
    description: ワークスペースの ID（配信元の行の `id`）。記録が無いフォルダは `mindstella-{フォルダ名}-{ハッシュ}` で振り、設定の `id` に記録する。記録があるフォルダは設定の `id` を返す
    notes: ハッシュはフォルダのシンボリックリンクを解いた絶対パスの SHA-256 の 16 進の先頭 6 桁。フォルダ名の `.`・`:` は `-` に置き換える（『起動のコマンド』の tmux のセッションの名前と同じ規則で、tmux のセッションの名前にも使う）
  - name: url
    type: str
    description: 画面の URL（そのワークスペースのプレビューの配信の `/mindstella.html`）。『プレビューの URL』が返す URL と同じ
  - name: result
    type: Literal['created', 'opened', 'reopened', 'already_open']
    description: '`created` 記録を作った / `opened` 残っている記録を開いて登録した / `reopened` クローズしたワークスペースの配信元の行を戻した / `already_open` 既に開いている'
  - name: launch_options_recorded
    type: bool
    description: 今回の追加の MCP・プラグインの指定を状態のフォルダに記録したか。記録が既にあって使わなかったときは偽（D-341）
  - name: migration
    type: '{from_version: str | None, to_version: str, steps: list[str], not_carried: list[{item: str, key: str, value: str}]} | None'
    description: 記録を移し替えたときの報告。移し替えなかったときは `null`。`not_carried` は移せずに記録から消えた値（mdmark の書き方への移行で写さなかった `scope`・`updated` など）を項目とキーごとに並べる
status_codes:
  - code: '201'
    condition: '`result` が `created`'
  - code: '200'
    condition: '`result` が `opened`・`reopened`・`already_open`'
  - code: '400'
    condition: 本文が JSON のオブジェクトでない・`folder` が絶対パスでない・`flow` の形が違う
    notes: 何も書かない
  - code: '403'
    condition: 許可するフォルダの外、または `Host`・`Origin` が受ける値でない
    notes: 何も書かない。`stage` は `folder` か `host`
  - code: '409'
    condition: 記録のバージョンがプラグインのバージョンより新しい、または配信元の行が指す別のフォルダに同じ ID の記録がある
    notes: 何も書かない。記録のバージョンが新しいときは `stage` が `version` で、`detail` にワークスペースとプラグインのバージョンと、プラグインを更新する案内。同じ ID の記録が別のフォルダにあるときは `stage` が `duplicate` で、`detail` にそのフォルダのパス
  - code: '422'
    condition: '`mcp_config`・`plugin_dirs` が読めない、`flow` の文書を参照できない（文書が無い・配信元の `scope.read` にフォルダが含まれない）、または『記録の形式の移行』が手順の途中で失敗した'
    notes: 何も書かない。`stage` は `mcp_config`・`plugin_dirs`・`flow`・`migration` のどれか。`detail` に読めない値と理由（`migration` は失敗したバージョン・手順・理由。記録は写しから戻し、配信しない）
  - code: '502'
    condition: project-index へつながらない、または配信元の行の追加・変更がエラーを返した
    notes: この依頼で作った記録と状態のフォルダの記録を消す（記録が既にあって開いたときは記録を消さない）。`stage` は `source`
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語。失敗した段階は拡張のメンバー `stage` に入れる
constraints:
  - item: 受ける Host
    constraint: '`Host` が `127.0.0.1:{ポート}`・`localhost:{ポート}` でない要求（`MINDSTELLA_ALLOWED_HOSTS` のホスト名を含む）は 403。`Origin` があるときは同じ 2 つのどちらかでなければ 403（D-304・D-340）'
    decided_by: NFR-489-1#requirements[待ち受けの範囲]
  - item: 確かめる順
    constraint: '`Host`・`Origin` → 本文 → 許可するフォルダ → `mcp_config` → `plugin_dirs` → 既に開いているか → 記録の形式の移行（記録があるときだけ）→ `flow` の参照（記録が無いときだけ）→ 書き込み → 配信元の行 → ID の一覧。どこかで止まったら、それより後は何もしない'
  - item: 既定の設定
    constraint: '記録が無いフォルダの `config.yaml` は、`id`（ワークスペースの ID）・`flow`（渡したときだけ）・`summary`（フォルダ名）にする。題名・概要は、作った後に『設定の更新』で書く（ER 図『ワークスペース』の `config.yaml`）'
    notes: 設定のスキーマが `summary` に 1 文字以上を求めるため、空にできない
  - item: 許可するフォルダ
    constraint: project-index の `GET /settings/sources` が返す `settingsPath` のファイルを読み、最上位の `mindstella.allowed_dirs`（絶対パスの並び）を使う。キーが無いか空なら、どのフォルダも許可しない（403）
    notes: project-index は知らないキーを警告にして読み込みを続ける（shuhei1101/project-index#11）
  - item: 記録が既にあるフォルダ
    constraint: '`.mindstella/config.yaml` があれば作り直さずに開く。進め方の文書は設定のまま使い、今回の `flow` は使わない（D-283）。追加の MCP・プラグインは、状態のフォルダに記録が無いときだけ今回の指定を記録する（D-321）。配信元の行が無ければ追加し、`outside_read` が偽（クローズ済み）なら真に戻してクローズ待ちを解く（`reopened`）。`outside_read` を戻すときは、`GET /settings/sources` で `version` を引き、`PATCH /settings/sources/{id}` に `expectedVersion` と `source.outside_read: true` を送る。409（版が古い）なら 1 回だけ引き直して送り直す。配信元の行の `config` が今回のフォルダの `.mindstella/dev-docs.yaml` でない（フォルダを移したかコピーした）ときは、行の `config` が指すフォルダに同じ `id` の記録（`.mindstella/config.yaml`）があれば 409（`stage: duplicate`）。無ければ `PATCH /settings/sources/{id}` で `source.config`・`source.scope` を今回のフォルダの値（『配信元の行』と同じ形）へ変更し、`result` を `opened` にする（`expectedVersion` を添え、409 なら 1 回だけ `version` を取得し直して再送信する。それでも通らないときと project-index がそのほかの失敗を返したときは 502（`stage: source`）で、記録と状態のフォルダの記録は削除しない）。その行がクローズ済みなら、同じ依頼で `source.outside_read: true` も送信して `reopened` にする。記録の設定に `id` が無ければフォルダから振った ID を使用し、記録の設定は書き換えない（`id` の記録は v0.13.0 の移し替えが行う）'
  - item: 配信元の行
    constraint: 'project-index の `POST /settings/sources` に `{"source": {"id": {ID}, "config": "{フォルダ}/.mindstella/dev-docs.yaml", "scope": {"read": ["{フォルダ}", "{フォルダ}/**"], "write": ["{フォルダ}", "{フォルダ}/**"]}, "outside_read": true}}` と、`GET /settings/sources` で取得した `version` を `expectedVersion` として送信する。409 のうち `result: exists` でないもの（内容のバージョンの不一致）は、1 回だけ `version` を取得し直して再送信する。`scope` はワークスペースのフォルダと、その下の全てのフォルダを作業場所にしたセッションを対象にする。同じ `id` の行がある（409・`result: exists`）ときは、`same` が真なら追加済みとして続け、偽なら 502'
    notes: '本文の形は project-index の『端末の設定の配信元の 1 行の追加』（IF-32）、`/**` の当たり方はコアコンセプト『scope による権限』'
  - item: 配信の設定
    constraint: '記録が無いフォルダに、`.mindstella/dev-docs.yaml`（project-index の配信元の設定。書式は project-index のガイド『設定』）と `.mindstella/schemas/`（プラグインの `skills/mindmap/schemas/` の種類ごとの 7 つのスキーマと `common.schema.json` の複製）を書く。設定は `version: "3"`・`name`（ワークスペースの ID）・`description`（設定の `summary`）・`related.types`（`[depends_on, parent, for, see_also]`）と、種類ごとの 7 つの `documents` の行を持つ。行は `id`（種類の名前。`decisions` など）・`title`（種類の日本語の名前）・`paths`（`[{種類}.yaml]`）・`schema`（`schemas/{種類}.schema.json`）・`records: items`・`body_file: body`・`write_dates: false`（Git 管理外の配信元でも project-index の `write_docs` に `created`・`updated` を付けさせない。日時は `history.yaml` が持つ）・`metadata`（`id: id`・`name: title`・`description: lead`（持つ種類だけ）・`tags: tags[].name`・`main_tags: tags[main].name`・`related: related`・`status: status`（持つ種類だけ））'
    notes: '`body` は `.mindstella/` からの相対で本文のファイルを指す（`docs/{ID}.md`。ER 図『ワークスペース』）。`threads.yaml`・`changes.yaml`・`config.yaml` などは配信しない（MindStella の MCP が読み書きする）'
  - item: ID の一覧
    constraint: 状態のフォルダの `workspaces.yaml` の `ids` に足す。配信元の行の追加が通った後に足す
  - item: 追加の MCP・プラグインの記録
    constraint: 状態のフォルダの `workspaces/{id}/launch.json` に `mcp_config` と `plugin_dirs` を書く。指定が空でも書く（記録が無いことと区別する。D-320）
  - item: 同時の依頼
    constraint: 同じフォルダへの作成はフォルダごとの鍵、ID の一覧の書き込みは全体で 1 つの鍵、記録と状態の書き込みはワークスペースごとの鍵（セッションの管理と共有する）を取ってから行う
  - item: MCP のツール
    constraint: '`create_workspace` は同じ引数（`folder`・`flow`・`mcp_config`・`plugin_dirs`）を受け、同じ処理を呼び、応答と同じ JSON を構造化の結果で返す。エラーは `エラー: {detail}`（『MCP サーバーの起動』のエラーの形）。`Host` の確かめは `/mcp` の確かめに任せる'
  - item: 進め方の文書の確かめ方
    constraint: 'project-index の HTTP の読み取り API で 3 段に確かめる。(1) `GET /settings/sources` の `flow.source` の行の `scope.read` に、ワークスペースのフォルダが当たる（当たらなければ 422・理由 `scope`）。(2) `GET /sources/{flow.source}/docs` の一覧から、`id` が `flow.doc` の文書のパスを引く（無ければ 422・理由 `missing`。配信元が無ければ 404 の `missing: source`）。(3) `GET /sources/{flow.source}/docs/{パス}?id={flow.doc}` が 200 を返す（404 なら 422・理由 `missing`）'
    notes: 常駐サーバーは文書の MCP（`search_docs`）を呼ばない
  - item: 記録の形式の移行
    constraint: '記録があるフォルダは、開く前に『記録の形式の移行』を当てる。利用者に確認せずに移し替え、移せなかった値は応答の `migration.not_carried` に載せる（D-288。PR #565 の確認ログ）。利用者への知らせは、MindStella のセッションが起動と再開のエージェントフローで通知のスレッドにする。移行の結果の `source_files` が 1 件以上で、配信元の行が既にあり、この依頼で行を変更しない（『既に記録があるフォルダ』の `PATCH` を送らない）ときは、`GET /settings/sources` で `version` と `settingsPath` を引き、`settingsPath` の端末の設定の `sources` の行を書き換えずにそのまま、`expectedVersion` とともに `PUT /settings/sources` に送って、全ての配信元を読み直させる（project-index の『端末の設定の保存』は全ての行を再読み込みする。『端末の設定の配信元の 1 行の変更』は値が変わらない行の配信元を使い回すので、読み直されない。`GET` の応答の行は状態を含む camelCase の形で、端末の設定の行と形が違うので送らない）。`source_files` が 1 件以上になるのはプラグインを上げた後にそのワークスペースを初めて開くときだけなので、全ての配信元の再読み込みもそのときだけになる。行を追加する、または行を変更する `PATCH` を送るときは、それで読み直されるので重ねて送らない。409（版が古い）なら 1 回だけ引き直して送り直し、それでも通らないときと project-index がそのほかの失敗を返したときは 502（`stage: source`）'
  - item: エージェントフローの配信元
    constraint: 配信元の行を足した後に、project-index に配信元 `mindstella-agent-flows` の行が無ければ、『エージェントフローの参照』の制約「配信元の登録」のとおり足す。同じ `id` の行がある（409）ときは足さずに続ける。失敗してもワークスペースの作成は止めず、常駐サーバーのログに 1 行書く
  - item: project-index の版
    constraint: 配信の設定の `write_dates` を知らない project-index（shuhei1101/project-index の 368b731 より前）は、`documents` の行が `write_dates` を持つ配信の設定を検証に通さず、その配信元を配信しない（端末の設定の行の状態が `not_served`）。この操作は配信元の行の状態を確かめず、そのまま開いて応答を返す（記録は配信されず、MindStella のセッションの `search_docs`・`write_docs` が配信元を見つけられない）。必要な project-index の版は、使い方『動作環境』に記載する
flows:
  - name: 正常系
    summary: 記録が無いフォルダに記録を作り、配信元に登録して ID と URL を返す
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録し、`expectedVersion` の無い `POST` を 400 で拒否する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 許可するフォルダの下の、まだ無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）
        participant WS as ワークスペース

        クライアント->>API: folder・flow・mcp_config・plugin_dirs
        API->>PI: GET /settings/sources
        PI-->>API: settingsPath
        API->>API: 許可するフォルダ・mcp_config・plugin_dirs を確かめる
        API->>PI: flow の文書を参照できるか（search_docs）
        API->>WS: .mindstella/ に既定の設定と空の記録を書く
        API->>API: 状態のフォルダに launch.json を書く
        API->>PI: GET /settings/sources
        PI-->>API: version
        API->>PI: POST /settings/sources（expectedVersion）
        API->>API: workspaces.yaml の ids に足す
        API-->>クライアント: 201 id・url・created・launch_options_recorded: true
      ```
    expected:
      - 応答が 201 で、`result` が `created`、`launch_options_recorded` が真
      - '`.mindstella/config.yaml` の `id` が応答の `id` で、`flow` が渡した値'
      - 状態のフォルダの `workspaces/{id}/launch.json` に渡した `mcp_config`・`plugin_dirs` があり、`workspaces.yaml` の `ids` に `id` がある
      - 'project-index の Mock が、`config`・`scope`・`outside_read: true` の行の追加を受けている'
      - '`.mindstella/dev-docs.yaml` が種類ごとの 7 つの `documents` の行（`records: items`・`body_file: body`・`write_dates: false`）と `related.types` を持ち、`.mindstella/schemas/` にその行が指すスキーマがある'
      - '`url` を開くと、そのワークスペースの画面が返る'
      - project-index に配信元 `mindstella-agent-flows` の行（`config` がプラグインの `agent-flows/dev-docs.yaml`、`scope.read` が許可するフォルダとその下、`scope.write` なし）を、ワークスペースの行の後に追加する
      - project-index の Mock が受けた行の追加の本文の `expectedVersion` が、`GET /settings/sources` が返した `version` である
    test: test_normal
  - name: 正常系（記録が既にある）
    summary: 残っている記録を開き、状態のフォルダに記録が無いので今回の指定を記録する
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 記録があり、配信元の行と状態のフォルダの記録が無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: folder・flow・mcp_config・plugin_dirs
        API->>API: 設定の id と flow をそのまま使う
        API->>API: launch.json が無いので今回の指定を書く
        API->>PI: POST /settings/sources
        API-->>クライアント: 200 opened・launch_options_recorded: true
      ```
    expected:
      - 応答が 200 で `result` が `opened`
      - '`config.yaml` が呼ぶ前と同じ'
      - '`launch.json` に今回の指定があり、配信元の行の追加を受けている'
    test: test_normal_when_records_exist
  - name: 正常系（既に開いている）
    summary: 記録・配信元の行・状態のフォルダの記録を変えずに、既にある ID を返す
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 正常系で作ったフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: 違う mcp_config・plugin_dirs
        API-->>クライアント: 200 already_open・launch_options_recorded: false
      ```
    expected:
      - 応答が 200 で `result` が `already_open`、`launch_options_recorded` が偽
      - '`launch.json` と `config.yaml` が呼ぶ前と同じで、project-index の Mock が新しい依頼を受けていない'
    test: test_normal_when_already_open
  - name: 正常系（クローズしたワークスペース）
    summary: 配信元の行の `outside_read` を真に戻し、クローズ待ちを解く
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 'クローズした（配信元の行が `outside_read: false`、状態がクローズ待ち）ワークスペースのフォルダ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: folder
        API->>PI: PATCH /settings/sources/{id}（outside_read: true）
        API->>API: 状態のクローズ待ちを解く
        API-->>クライアント: 200 reopened
      ```
    expected:
      - 応答が 200 で `result` が `reopened`
      - 'project-index の Mock が `outside_read: true` の変更を受け、状態の `close_pending` が偽'
    test: test_normal_when_closed
  - name: 異常系（許可するフォルダの外）
    summary: 403 を返し、何も書かない
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 許可するフォルダの外
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: folder
        API-->>クライアント: 403 stage: folder
      ```
    expected:
      - 応答が 403 で `stage` が `folder`
      - フォルダに `.mindstella/` が無く、状態のフォルダと project-index の Mock に記録が無い
    test: test_error_when_folder_not_allowed
  - name: 異常系（読めない指定）
    summary: '`mcp_config`・`plugin_dirs`・`flow` のどれかが読めなければ 422 を返し、何も書かない'
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: 指定
        description: '`mcpServers` に `mindstella` を持つ `mcp_config`、`plugin.json` の無い `plugin_dirs`、無い文書を指す `flow` を 1 つずつ渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: 読めない指定
        API-->>クライアント: 422 stage: mcp_config / plugin_dirs / flow
      ```
    expected:
      - それぞれ 422 で `stage` が読めない引数の名前
      - 記録・状態のフォルダの記録・配信元の行が作られていない
    test: test_error_when_options_invalid
  - name: 異常系（配信元の登録に失敗する）
    summary: 502 を返し、この依頼で作った記録と状態のフォルダの記録を消す
    setup:
      - name: Mock
        description: project-index の Mock の `POST /settings/sources` が 500 を返す
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: フォルダ
        description: 許可するフォルダの下の、まだ無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: folder
        API->>PI: POST /settings/sources
        PI-->>API: 500
        API->>API: 書いた記録と launch.json を消す
        API-->>クライアント: 502 stage: source
      ```
    expected:
      - 応答が 502 で `stage` が `source`
      - フォルダに `.mindstella/` が無く、状態のフォルダに `launch.json` が無く、`ids` に足されていない
    test: test_error_when_source_registration_fails
  - name: 異常系（別のホスト）
    summary: '`Host` が受ける値でなければ 403'
    setup:
      - name: Mock
        description: project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）
      - name: 常駐サーバー
        description: '`MINDSTELLA_ALLOWED_HOSTS` に `example.test` を渡して起動する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces

        クライアント->>API: Host: example.test
        API-->>クライアント: 403 stage: host
      ```
    expected:
      - 応答が 403 で何も書かれていない
    test: test_error_when_host_not_local
  - name: 正常系（フォルダを移した）
    summary: 配信元の行が記録の無い前のフォルダを指していれば、行の config・scope を移した先へ変更する
    setup:
      - name: Mock
        description: 正常系と同じ project-index の Mock
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: フォルダ
        description: 正常系で作ったワークスペースのフォルダを、許可するフォルダの下の別のパスへ移したもの
        notes: 配信元の行と状態のフォルダの記録は移す前のまま。前のフォルダは無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: 移した先の folder
        API->>API: 記録の設定の id を使用する
        API->>PI: GET /settings/sources
        PI-->>API: 前のフォルダを指す行と version
        API->>API: 前のフォルダに同じ id の記録が無い
        API->>PI: PATCH /settings/sources/{id}（expectedVersion・config・scope）
        API-->>クライアント: 200 移す前と同じ id・opened
      ```
    expected:
      - 応答が 200 で、`id` が移す前と同じで `result` が `opened`
      - project-index の Mock が、`config` と `scope` を移した先のフォルダにした行の変更を受け、行の追加を受けていない
      - 状態のフォルダの `launch.json` が移す前のまま
    test: test_normal_when_folder_moved
  - name: 異常系（同じ ID の記録が別のフォルダにある・409）
    summary: 配信元の行が指す別のフォルダに同じ ID の記録が残っていれば 409 を返し、行を変えない
    setup:
      - name: Mock
        description: 正常系と同じ project-index の Mock
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: フォルダ
        description: 正常系で作ったワークスペースのフォルダを、許可するフォルダの下の別のパスへコピーしたもの
        notes: コピー元のフォルダに記録が残っている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /workspaces
        participant PI as project-index（Mock）

        クライアント->>API: コピーした folder
        API->>PI: GET /settings/sources
        PI-->>API: コピー元のフォルダを指す行
        API->>API: コピー元のフォルダに同じ id の記録がある
        API-->>クライアント: 409 stage: duplicate
      ```
    expected:
      - 応答が 409 で `stage` が `duplicate`、`detail` にコピー元のフォルダのパスがある
      - project-index の Mock が行の変更も追加も受けておらず、両方のフォルダの記録が変わっていない
    test: test_error_when_duplicate_id
  - name: 正常系（スキーマの複製を書き直した記録を開く）
    summary: 今のバージョンの記録のスキーマの複製を書き直し、端末の設定の行をそのまま送る PUT で project-index に配信元を読み直させる
    setup:
      - name: Mock
        description: 'project-index の Mock（テストが空きポートで立て、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。`GET /settings/sources` が一時ファイルの `settingsPath` とそのワークスペースの行（`outside_read: true`）を返し、`POST`・`PATCH`・`DELETE /settings/sources` の依頼を記録する。一時ファイルの `mindstella.allowed_dirs` はテストの一時フォルダ）'
      - name: スキーマの複製が更新前の記録
        description: 今のバージョンで作り、`.mindstella/schemas/docs.schema.json` を前のバージョンのスキーマに書き換えたフォルダ
        notes: 状態のフォルダに開いている記録は無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as ワークスペースの作成
        participant WS as ワークスペース
        participant PI as project-index

        クライアント->>API: フォルダ
        API->>WS: 記録の形式の移行（docs.schema.json を書き直す）
        API-->>PI: GET /settings/sources
        API->>PI: PUT /settings/sources（expectedVersion・端末の設定の sources の行）
        API-->>クライアント: 200（result: opened）
      ```
    expected:
      - 200 で `result` が `opened`
      - '`.mindstella/schemas/docs.schema.json` の中身がプラグインのスキーマと同じ'
      - 'project-index の Mock が、`expectedVersion` と一時ファイルの端末の設定の `sources` と同じ行を持つ `PUT /settings/sources` を 1 回受け、`POST`・`PATCH` を受けていない'
    test: test_normal_when_schema_copy_rewritten
  - name: 正常系（実際の project-index で記録を書き込み・検索する）
    summary: 作った Git 管理外のワークスペースを実際の project-index で配信し、記録の作成・更新、本文を持たない項目の検索・更新、スキーマの複製を更新前に戻した後の開き直しを通す
    setup:
      - name: Mock
        description: なし（実際の project-index をテストごとの一時フォルダの端末の設定と空きポートで起動し、`PROJECT_INDEX_PORT` で常駐サーバーへ渡す。準備はエージェントフローの参照の結合テストと同じで、project-index のクローンが無ければ skip する）
      - name: 作ったワークスペース
        description: 許可するフォルダの下の Git 管理外のフォルダにこの操作で作ったワークスペース。本文を持たない用語 G-1 を記録の YAML に直接書く
        notes: スキーマの複製を更新前にするときは `docs.schema.json` を `deliverable` を必須に持つスキーマに書き換える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as ワークスペースの作成
        participant PI as project-index

        クライアント->>API: フォルダ
        API->>PI: POST /settings/sources
        API-->>クライアント: 201（result: created）
        クライアント->>PI: write_docs（検討事項の作成・更新、G-1 の更新）
        クライアント->>PI: search_docs（G-1）
        クライアント->>API: スキーマの複製を更新前に戻したフォルダ
        API->>PI: PUT /settings/sources
        クライアント->>PI: search_docs（資料）
      ```
    expected:
      - 検討事項の作成と更新の `write_docs` が検査に通って書き込まれ、記録の YAML の項目が `created`・`updated` を持たない
      - 本文を持たない G-1 が `search_docs` でヒットし、`write_docs` で更新でき、結果に読み込めない文書の警告が無い
      - スキーマの複製を更新前に戻して開き直した後、資料を参照した `search_docs` の結果にスキーマに合わない旨の警告が無い
    test: test_normal_when_real_project_index

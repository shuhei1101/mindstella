id: IF-489-57
title: "配る書き出し"
entry:
  kind: mcp_tool
  value: '`export`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__plugin_mindstella_mindstella__export`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 記録・画面・描画のライブラリ・ライセンスの表示を中に持つ 1 枚の HTML を out へ書き出す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて MCP のクライアントでツールを呼び、描画のライブラリの配布ファイルとライセンスの本文は jsDelivr から取る）
      - name: make_workspace
        description: 7 つの種類を 1 件ずつ持ち、資料 A-1 の本文に `</script>` を含むワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as ワークスペース
        participant CDN as jsDelivr
        participant OUT as 書き出す先

        クライアント->>IF: export workspace out
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: スキーマと突き合わせる
        IF-->>CDN: 描画のライブラリと mdmark の配布ファイルとライセンスの本文を取る
        IF->>IF: mdmark 以外の配布ファイルを integrity と突き合わせ、書き出し用のビルドに描画のライブラリ・ライセンスの表示・データを入れる
        IF->>OUT: HTML を書く
        IF-->>クライアント: JSON（path）
      ```
    expected:
      - ツールのエラーにならない
      - '`path` が `配る.html` の絶対パス'
      - '`配る.html` の `mindmap-data` の中身を JSON として読むと、`settings` と 7 つの種類の項目が YAML と同じで、`bodies` に `A-1.mark.md` の本文、`changes` に書き換えのまとまりがある'
      - '`配る.html` の `script`・`link`・`img` に `data:` 以外を指す `src`・`href` を持つものが無く（ファビコンの `link` は `data:image/svg+xml` を指す）、import map も無い'
      - '`配る.html` の中の `</script>` の数が、書き出し用のビルドの数に、mdmark の JavaScript・部品の 3 つ・描画のライブラリの 3 つ・記録・ライセンスの表示の要素の 9 つを追加した数（本文の `</script>` で要素が閉じていない）'
      - '`mindmap-mdmark` と部品（`mindmap-mdmark-map`・`mindmap-mdmark-view`・`mindmap-mdmark-comments`）の要素が中身を持つ'
      - '`mindmap-licenses` の中身に、mdmark・marked・mermaid・jsdiff のそれぞれの名前・バージョン・著作権の表示・ライセンスの名前があり、mdmark の `THIRD_PARTY_LICENSES.txt` の本文がある。React の画面が中に束ねたライブラリごとの名前・バージョン・ライセンスの本文もある'
    test: test_normal
  - name: 異常系（out の末尾が .html でない・引数の誤り）
    summary: 書き出す先の末尾が .html でないと、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`out` はワークスペースの外の一時フォルダの `配る.txt`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）

        クライアント->>IF: export workspace out（配る.txt）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文に `out` がある
      - '`配る.txt` が無い'
    test: test_error_when_out_not_html
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すと何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無い）
      - name: 書き出す先
        description: 別の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: export workspace out
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
      - '`配る.html` が無い'
    test: test_error_when_workspace_not_found
  - name: 異常系（YAML がスキーマに合わない・SchemaMismatchError）
    summary: 手で崩した YAML があると、前に書き出した out のファイルを残して終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 一度 `export` で書き出した後、`decisions.yaml` の D-1 の `status` を `完了` に直接書き換えたワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの、一度書き出した `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: export workspace out
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `decisions.yaml: items[0].status:` で始まる行がある'
      - '`配る.html` の中身が呼ぶ前と同じ'
    test: test_error_when_schema_mismatch
  - name: 異常系（書き出す先のフォルダが無い・WriteFailedError）
    summary: out の親のフォルダが無いと、フォルダを作らずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き出す先
        description: 一時フォルダの中の無いフォルダ `無い/` の `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant OUT as 書き出す先

        クライアント->>IF: export workspace out
        IF-->>OUT: 親のフォルダが無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、`配る.html` のパスを含み、トレースバックを含まない'
      - フォルダ `無い/` が無い
    test: test_error_when_out_dir_missing
  - name: 異常系（ライブラリを取れない・DownloadFailedError）
    summary: jsDelivr に届かないと、何も書かずに終わる
    setup:
      - name: Mock
        description: 環境変数 `HTTPS_PROXY` に届かないアドレスを入れて起動し、jsDelivr への要求を全て失敗させる
        notes: '`HTTPS_PROXY=http://127.0.0.1:9`'
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの、一度書き出した `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant CDN as jsDelivr

        クライアント->>IF: export workspace out
        IF-->>CDN: 配布ファイルを取る（届かない）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、取れなかった URL を含み、トレースバックを含まない'
      - '`配る.html` の中身が呼ぶ前と同じ'
    test: test_error_when_download_fails
  - name: 正常系（HTML の本文を埋め込む）
    summary: HTML の本文も、原文と行のマーカーを追加したものを埋め込みのデータに入れる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて MCP のクライアントでツールを呼び、描画のライブラリの配布ファイルとライセンスの本文は jsDelivr から取る）
      - name: make_workspace
        description: 本文を HTML で持ち、`<style>` と `<script>` と段落を持つ資料 A-1 を持つワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as ワークスペース
        participant OUT as 書き出す先

        クライアント->>IF: export workspace out
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: HTML の本文に行のマーカーを追加し、書き出し用のビルドにデータを入れる
        IF->>OUT: HTML を書く
        IF-->>クライアント: JSON（path）
      ```
    expected:
      - ツールのエラーにならない
      - '`配る.html` の `mindmap-data` の中身を JSON として読むと、`bodies` の `A-1.html` が本文のファイルと同じで、`marked_bodies` の `A-1.html` が『記録の取得』と同じ'
      - '`配る.html` の中の `</script>` の数が、書き出し用のビルドの数に、mdmark の JavaScript・部品の 3 つ・描画のライブラリの 3 つ・記録・ライセンスの表示の要素の 9 つを追加した数（本文の `</script>` で要素が閉じていない）'
    test: test_normal_when_html_body
lead: ワークスペースの記録を、画面と描画のライブラリまで中に持つ見るだけの 1 枚の HTML にして、指定したパスへ書き出す。ワークスペースもサーバーもネットも持たない人へ配るために使う。
idempotent: true
side_effects: '`out` のファイルを、同じフォルダの一時ファイルから `os.replace` で置き換える。ワークスペースは読むだけ。プレビューの配信は立てず、ブラウザも開かない。描画のライブラリの配布ファイルとライセンスの本文を jsDelivr から取る'
callers:
  - IF-565-1#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ'
  - name: out
    type: str
    required: true
    location: argument
    description: 書き出す HTML のファイルのパス。相対パスは `workspace` と同じく `session.cwd` から読み、`session` が無ければ引数の誤り（インターフェース定義『MCP サーバーの起動』）。既にあるファイルは置き換える
    constraints: 末尾が `.html`。親のフォルダがある
    example: ~/渡す/新規事業の検討.html
response:
  - name: path
    type: str
    description: 書き出した HTML の絶対パス
  - name: 埋め込みのデータ
    type: dict
    description: 『記録の取得』のレスポンスと同じ構造で、`<script type="application/json" id="mindmap-data">` の中身に入る
  - name: ライセンスの表示
    type: str
    description: '`<script type="text/plain" id="mindmap-licenses">` の中身。中に持つライブラリごとに、名前・バージョン・著作権の表示・ライセンスの名前と本文を並べる。mermaid は、配布ファイルが中に束ねた依存ごとの名前・バージョンとライセンスの本文も続ける。mdmark は、`preview/licenses/mdmark-LICENSE.txt` の MIT の本文の後に、配布物の `dist/THIRD_PARTY_LICENSES.txt`（中に束ねた依存ごとのライセンスの本文）を続ける。React の画面が中に束ねたライブラリは、書き出し用のビルドの時に作るライセンスの一覧（プラグインの `preview/licenses/`）の名前・バージョン・ライセンスの本文を続ける。画面には出さない'
exceptions:
  - name: なし（正常終了）
    condition: 書き出せた
    notes: 結果を返す
  - name: 引数の誤り
    condition: '`out` の末尾が `.html` でない'
    notes: ツールのエラー。何も書き込まない
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー。何も書き込まない
  - name: SchemaMismatchError
    condition: ワークスペースのどれかの YAML がスキーマに合わないか、YAML として読めない
    notes: ツールのエラー。エラーの本文に合わない箇所。`out` のファイルを書き換えない
  - name: DownloadFailedError
    condition: jsDelivr から配布ファイルかライセンスの本文を取れない（制約「取り直し」の上限まで取り直しても、届かない・待ちの上限を超えた・200 以外が返った。取り直さない失敗は 1 回目で）か、取った配布ファイルが `preview/libraries.json` の `integrity` と合わない
    notes: ツールのエラー。エラーの本文に取れなかった URL と理由。`out` のファイルを書き換えない
  - name: WriteFailedError
    condition: '`out` の親のフォルダが無い、または書き込みか置き換えに失敗した'
    notes: ツールのエラー。エラーの本文に書けなかったパスと理由。親のフォルダは作らず、前の `out` のファイルを残す
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。引数の誤りは引数の名前を出す'
constraints:
  - item: 結果の構造
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返却方法
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 書き出し用のビルド
    constraint: React の画面を JS・CSS を中に持つ 1 枚の HTML にした書き出し用のビルドの出力（プラグインの `preview/export/index.html`。React の画面のソースを変えたときにビルドして commit する）を元にする。元の HTML の Google Fonts の `<link>` を外し、最後の `</body>` の前に、mdmark の CSS（`<style id="mindmap-mdmark-css">`）・JavaScript（`<script type="text/plain" id="mindmap-mdmark">`）・部品（`map.js`・`view.js`・`comments.js` を `<script type="text/plain" id="mindmap-mdmark-{部品}">`）と、marked・mermaid・jsdiff の配布ファイルを中身に持つ `<script>`、記録（`<script type="application/json" id="mindmap-data">`）、ライセンスの表示を差し込む。mdmark は『プレビューの配信』の制約「mdmark の ref の解決」の ref の配布ファイルを取る。画面がこれらを読む振る舞いは『プレビューを開く』の制約「配る書き出しで開く」。元の HTML に `</body>` が無いときは同梱の誤りとしてエラーにする
  - item: 埋め込みの安全
    constraint: 埋め込む JSON の `<`・`>`・`&` を、それぞれ JSON の Unicode エスケープ（バックスラッシュに続けて `u003c`・`u003e`・`u0026`）に置き換える。`JSON.parse` で元の文字に戻り、本文に `</script>` があっても要素を閉じさせない。差し込む CSS・JavaScript・ライブラリ・ライセンスの本文が `</style>`・`</script`・`<script` を含むときは、書き出さずにエラーにする（大文字・小文字を区別しない）
  - item: 読み込むファイル
    constraint: 書き出した HTML は外のファイルも URL も指さない（`script`・`link`・`img` に `src`・`href` を持たない）。文字は端末の文字で描く
  - item: 閲覧のみ
    constraint: 画面は、サーバーが配るものと同じ React の画面のソースから作る。記録を埋め込みのデータから読み、書き込む操作と書き換えの通知の購読を出さない（『プレビューを開く』の制約「配る書き出しで開く」）
  - item: 通信
    constraint: ツールは、描画のライブラリの配布ファイルの URL（プラグインの `preview/libraries.json` の URL。『プレビューを開く』の制約「描画のライブラリ」と同じ）と、『プレビューの配信』の制約「mdmark の ref の解決」の ref の mdmark の配布ファイル（`dist/index.css`・`dist/index.js`・部品）の URL と、ライブラリのライセンスの本文の URL（同じバージョン。mdmark は `dist/THIRD_PARTY_LICENSES.txt`。mdmark の MIT の本文はプラグインの `preview/licenses/mdmark-LICENSE.txt` から読む）を取るときと、その ref を解決するために GitHub の API へ問い合わせるときだけ通信する。mdmark 以外の取った配布ファイルは `preview/libraries.json` の `integrity`（sha384）と突き合わせ、合わなければ書き出さない。mdmark は突き合わせない。書き出した HTML は通信しない。ただし、HTML の本文が外の画像・CSS を指すときは、描くときにブラウザがその URL を読みに行き、ネットにつながらない端末では読めないまま描く（ツールは本文の中身を書き換えない）
  - item: 待ちの上限
    constraint: 1 回の要求で、接続と 1 回の読み取りをそれぞれ 30 秒まで待つ。届かなければ制約「取り直し」に従い、上限まで届かなければ `DownloadFailedError` で終える
    notes: jsDelivr から描画のライブラリの配布ファイル（最大 5.5MB）とライセンスの本文を取る時間の実測は 1 件あたり最大 0.65 秒（2026-10-03、手元の回線。mdmark の JavaScript・CSS・`THIRD_PARTY_LICENSES.txt` は 2026-10-25 に最大 0.05 秒）。待ちは読み取り 1 回ごとに効くので、遅い回線で全体が長くなっても途切れない限り止めない
  - item: 取り直し
    constraint: 配布ファイル・ライセンスの本文の 1 つの URL について、届かない・待ちの上限を超えた・HTTP 403・408・429・5xx が返ったときだけ、間を空けて同じ URL を取り直す。要求の回数と間隔は非機能要件『配る書き出しの取り直し』の値にする。それ以外の 4xx（404 など）と `integrity` の不一致は取り直さずに `DownloadFailedError` で終える。GitHub の API への ref の問い合わせは取り直さない。エラーの本文には最後の要求の理由を出す
    notes: jsDelivr は一時的に 403 を返し、間を置くと同じ URL が取れる（#672）。取り直すのはこの層だけで、利用者が `export` を再呼び出しすれば始めから取り直す
refs:
  - IF-489-51#
  - IF-489-70#
  - SC-489-11#
notes:
  書き出すときに取る理由: 書き出す側は Claude Code が動く端末でネットにつながっているため、配布ファイルをリポジトリに同梱せず、書き出すときに jsDelivr から取る（ユーザーの決定）。開く側は書き出した HTML だけで足り、通信しない
  書き出す先を既定にしない理由: 置き場所は利用者が渡したい先で決まるので、`out` を必須にして MindStella のセッションが利用者に聞く
test_file: tests/integration/server/test_export.py

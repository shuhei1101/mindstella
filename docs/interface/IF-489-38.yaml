id: IF-489-38
title: "常駐サーバーの起動の確認"
entry:
  kind: trigger
  value: Claude Code の `SessionStart` のフック（新しい会話・再開・`/clear`・圧縮のたび）が、プラグインの `hooks/hooks.json` から `python3 {プラグインのフォルダ}/skills/mindmap/scripts/ensure_server.py --hook` を呼ぶ。起動スクリプトは `--hook` を付けずに呼ぶ
flows:
  - name: 正常系
    summary: 常駐サーバーが落ちていれば起動し、待ち受けを確かめて、つなぎ直す案内を出す
    setup:
      - name: Mock
        description: Claude Code の代わりに、フックの入力の JSON を標準入力に渡してスクリプトを起動する
      - name: systemctl
        description: '`PATH` の先頭に置いた Mock の `systemctl`。受けた引数を記録し、`--user start mindstella.service` で常駐サーバーのプロセスを起動して終了コード 0 で終わる。`--user show-environment` は終了コード 0'
      - name: 仮想環境
        description: PyYAML・jsonschema・mcp を見せた仮想環境を `MINDSTELLA_VENV` で渡す
      - name: 待ち受けのポート
        description: テストごとに選んだ空きポートを `MINDSTELLA_PORT` で渡す（待ち受けているプロセスが無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（代わり）
        participant IF as ensure_server.py
        participant SV as 常駐サーバー

        CC->>IF: SessionStart の入力
        IF-->>SV: GET /_admin/status
        IF->>IF: mindstella.service を書いて daemon-reload する
        IF->>SV: systemctl --user start mindstella.service
        IF-->>SV: GET /_admin/status（待ち受けるまで）
        SV-->>IF: name mindstella
        IF-->>CC: つなぎ直す案内、終了コード 0
      ```
    expected:
      - 終了コードが 0
      - '`MINDSTELLA_PORT` の `GET /_admin/status` が `name` に `mindstella` を返す'
      - 標準出力に、mindstella の常駐サーバーを起動したことと、`/mcp` で mindstella につなぎ直す案内がある
      - スクリプトが終わった後も常駐サーバーのプロセスが残る
      - ユニットのファイル（`XDG_CONFIG_HOME` の `systemd/user/mindstella.service`）が、仮想環境の Python と `installPath` のフォルダの `server.py` を `ExecStart` に持ち、Mock の `systemctl` が `--user daemon-reload` と `--user start mindstella.service` を受けている
    test: test_normal
  - name: 正常系（既に待ち受けている）
    summary: 同じバージョンの常駐サーバーが待ち受けていれば、起動せずに何も出さない
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 待ち受けている常駐サーバー
        description: 正常系でスクリプトが起動した常駐サーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（代わり）
        participant IF as ensure_server.py
        participant SV as 常駐サーバー

        CC->>IF: SessionStart の入力
        IF-->>SV: GET /_admin/status
        SV-->>IF: name mindstella、同じバージョン
        IF-->>CC: 終了コード 0
      ```
    expected:
      - 終了コードが 0 で、標準出力に何も書かない
      - 常駐サーバーのプロセスが 1 つのまま
    test: test_normal_when_running
  - name: 正常系（古いコードが待ち受けている）
    summary: 待ち受けている常駐サーバーのバージョンか、読み込んだプラグインのフォルダの名前がインストール済みと違えば、再起動せずに違いと再起動の手順を示す
    setup:
      - name: Mock
        description: 正常系と同じ。テストが `MINDSTELLA_PORT` で、`GET /_admin/status` に `name` が `mindstella`・`version` が `0.0.1` の JSON を返す HTTP のサーバーを先に待ち受ける
      - name: 同じバージョンで違うフォルダ
        description: '`version` がプラグインと同じで、`plugin_root` の末尾のフォルダ名がプラグインのフォルダと違う JSON を返す HTTP のサーバー'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（代わり）
        participant IF as ensure_server.py
        participant SV as 常駐サーバー（古い）

        CC->>IF: SessionStart の入力
        IF-->>SV: GET /_admin/status
        SV-->>IF: name mindstella、version 0.0.1
        IF-->>CC: バージョンの差と起動し直す手順、終了コード 0
      ```
    expected:
      - 終了コードが 0
      - 標準出力に `0.0.1` とプラグインのバージョンがあり、起動のコマンドで常駐サーバーを再起動する手順（`mindstella server restart`）がある
      - 先に待ち受けていた HTTP のサーバーが、そのまま待ち受けている
      - 同じバージョンで違うフォルダのときも、終了コード 0 で、標準出力に 2 つのフォルダの名前と再起動の手順がある
    test: test_normal_when_outdated
  - name: 正常系（起動スクリプトから呼ぶ）
    summary: '`--hook` を付けずに呼ぶと、標準入力を読まず、起動したことを標準エラーに出す'
    setup:
      - name: Mock
        description: なし（標準入力に何も渡さずにスクリプトを起動する）
      - name: 仮想環境
        description: 正常系と同じ
      - name: 待ち受けのポート
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as ensure_server.py
        participant SV as 常駐サーバー

        クライアント->>IF: ensure_server.py
        IF-->>SV: GET /_admin/status
        IF->>SV: 仮想環境の Python で server.py を起動する
        SV-->>IF: name mindstella
        IF-->>クライアント: 終了コード 0
      ```
    expected:
      - 終了コードが 0 で、標準出力に何も書かない
      - 標準エラーに `[mindstella]` で始まる、起動したポートの行がある
    test: test_normal_when_called_by_launcher
  - name: 正常系（systemd --user が無い）
    summary: '`systemctl --user` が使えない端末（macOS・systemd の無い WSL）では、今までどおり新しいセッションで `server.py` を起動する'
    setup:
      - name: systemctl
        description: '`PATH` に `systemctl` が無い'
      - name: 仮想環境
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（代わり）
        participant IF as ensure_server.py
        participant SV as 常駐サーバー

        CC->>IF: SessionStart の入力
        IF-->>SV: GET /_admin/status
        IF->>IF: systemctl --user が使えない
        IF->>SV: 仮想環境の Python で server.py を新しいセッションで起動する
        SV-->>IF: name mindstella
        IF-->>CC: つなぎ直す案内、終了コード 0
      ```
    expected:
      - 常駐サーバーが待ち受け、ユニットのファイルが書かれていない
      - 終了コードが 0 で、標準出力に起動した旨がある
    test: test_normal_when_no_systemd
  - name: 正常系（起動し直す）
    summary: '`--restart` は、待ち受けていてもユニットをこのフォルダで書き直してから起動し直す'
    setup:
      - name: systemctl
        description: 正常系と同じ Mock。`restart` で、プロセスを止めて今のユニットの `ExecStart` で起動し直す
      - name: 古いユニット
        description: 別のフォルダの `server.py` を `ExecStart` に持つユニットのファイルと、そのコードで待ち受けている常駐サーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CMD as 起動のコマンド
        participant IF as ensure_server.py --restart
        participant SV as 常駐サーバー

        CMD->>IF: --restart
        IF->>IF: このフォルダで mindstella.service を書き直して daemon-reload する
        IF->>SV: systemctl --user restart mindstella.service
        IF-->>SV: GET /_admin/status（待ち受けるまで）
        SV-->>IF: plugin_root がこのフォルダ
      ```
    expected:
      - ユニットのファイルの `ExecStart` が、このスクリプトのプラグインのフォルダの `server.py`
      - Mock の `systemctl` が `--user daemon-reload` と `--user restart mindstella.service` をこの順で受けている
      - '`GET /_admin/status` の `plugin_root` がこのスクリプトのプラグインのフォルダ'
    test: test_normal_when_restarted
  - name: 異常系（待ち受けのポートが使われている・PortInUseError）
    summary: ポートを mindstella でないプロセスが使っていれば、起動せずに使われているポートを示し、会話の始まりは止めない
    setup:
      - name: Mock
        description: 正常系と同じ。テストが `MINDSTELLA_PORT` のポートを先に待ち受け、`GET /_admin/status` に 404 を返す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（代わり）
        participant IF as ensure_server.py
        participant SV as 常駐サーバー

        CC->>IF: SessionStart の入力
        IF-->>SV: GET /_admin/status
        SV-->>IF: つながるが mindstella の応答が無い
        IF->>IF: 起動しない
        IF-->>CC: ポートと MINDSTELLA_PORT の案内、終了コード 0
      ```
    expected:
      - Mock の `systemctl` が `start` を受けておらず、`server.py` を起動していない
      - 終了コードが 0
      - 標準出力に、使われているポートの番号と `MINDSTELLA_PORT` で別のポートを渡す案内がある
      - ポートを先に待ち受けていた側が、そのまま待ち受けている
      - '`--hook` を付けずに同じ状態で呼ぶと、終了コード 1 で、標準エラーに同じ案内がある'
    test: test_error_when_port_in_use
  - name: 異常系（依存が足りない・DependencyMissingError）
    summary: 仮想環境に依存がそろっていなければ、起動せずにそろえるコマンドを示す
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 仮想環境
        description: PyYAML・jsonschema・mcp を入れていない仮想環境を `MINDSTELLA_VENV` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（代わり）
        participant IF as ensure_server.py
        participant SV as 常駐サーバー

        CC->>IF: SessionStart の入力
        IF-->>SV: GET /_admin/status
        IF->>IF: 依存を確かめる
        IF-->>CC: そろえるコマンド、終了コード 0
      ```
    expected:
      - 終了コードが 0
      - 標準出力に `PyYAML`・`jsonschema`・`mcp` と、`-m pip install` を含むそろえるコマンドがある
      - '`MINDSTELLA_PORT` のポートで待ち受けているプロセスが無い'
    test: test_error_when_dependency_missing
lead: Claude Code が会話を始めるたびと起動スクリプトが Claude Code を立ち上げる前に、mindstella の常駐サーバーが待ち受けているかを確かめ、落ちていれば起動する。
idempotent: true
side_effects: 常駐サーバーが落ちていれば、`systemctl --user` が使える端末ではユニットのファイル `mindstella.service` を書いて（内容が同じなら書かない）`systemctl --user daemon-reload` と `systemctl --user start mindstella.service` を呼ぶ。使えない端末では、仮想環境の Python で `server.py` を新しいセッションで（`start_new_session`）起動し、標準出力・標準エラーを `~/.mindmap/server.log` に書き足す。ワークスペースは書かない
request:
  - name: --hook
    type: bool
    required: false
    default: なし（起動スクリプトからの呼び出しとして、案内を標準エラーに出し、失敗は終了コード 1）
    location: argument
    description: SessionStart のフックからの呼び出し。標準入力のフックの入力を読み捨て、案内を標準出力に出し、どの結末も終了コード 0 で終わる
  - name: --restart
    type: bool
    required: false
    default: なし（落ちているときだけ起動する）
    location: argument
    description: 起動のコマンドの `mindstella server restart` からの呼び出し。待ち受けていても止めて、このスクリプトのプラグインのフォルダのコードで起動し直す
  - name: MINDSTELLA_PORT
    type: str
    required: false
    default: '`8784`'
    location: argument
    description: 環境変数。確かめるポートと、起動する常駐サーバーへ渡すポート
  - name: MINDSTELLA_VENV
    type: str
    required: false
    default: '`~/.mindmap/venv`（『依存の確認』の `venv` の既定）'
    location: argument
    description: 環境変数。常駐サーバーを動かす仮想環境のフォルダ
exceptions:
  - name: なし（正常終了）
    condition: 常駐サーバーが待ち受けていたか、起動して待ち受けた（古いコードのときを含む）
    notes: 終了コード 0
  - name: PortInUseError
    condition: ポートで別のプロセスが待ち受けている（つながるが `name` が `mindstella` の応答が無い）。起動しない
    notes: '`--hook` では終了コード 0、無ければ 1'
  - name: DependencyMissingError
    condition: 『依存の確認』で仮想環境・Python・ライブラリのどれかが足りない
    notes: '`--hook` では終了コード 0、無ければ 1'
  - name: ServerStartTimeoutError
    condition: 起動した常駐サーバーが、終わらないまま 10 秒以内に `GET /_admin/status` へ応答しない
    notes: '`--hook` では終了コード 0、無ければ 1。systemd --user で起動したときは `systemctl --user status mindstella.service` と `journalctl --user -u mindstella.service` を、使えない端末では `~/.mindmap/server.log` を見るよう案内する'
error_format: '`[mindstella] エラー: {内容}` の行を出し、そろえるコマンド・案内があれば次の行に出す。`--hook` では標準出力、無ければ標準エラーに出す'
constraints:
  - item: 契機
    constraint: プラグインの `hooks/hooks.json` の `SessionStart`（`matcher` なし）。既存の `reset_unread.py` の呼び出しと並べて置く
  - item: 起動するコマンド
    constraint: '`python3 "${CLAUDE_PLUGIN_ROOT}/skills/mindmap/scripts/ensure_server.py" --hook`。システムの `python3` で動き、標準ライブラリだけを使う（仮想環境が無くても依存の不足を案内できる）'
  - item: 待ち受けているかの判定
    constraint: '`http://127.0.0.1:{MINDSTELLA_PORT}/_admin/status` へ 1 秒で打ち切る GET を送り、200 で JSON の `name` が `mindstella` なら待ち受けているとみなす。つながらない（接続を拒まれた・打ち切った）ときは落ちているとみなして起動する。つながるのに 200 でない・JSON でない・`name` が違うときは、別のプロセスがポートを使っているとみなし、起動せずに PortInUseError にする'
    notes: ユニットとして起動したプロセスの出力と終了コードは、起動した側に届かないため、ポートが使われていることは起動の前に判定する
  - item: 古いコードの見分け方
    constraint: 応答の `version` とプラグインの `version.ini` のバージョン、応答の `plugin_root` の末尾のフォルダ名と、このスクリプトのプラグインのフォルダの末尾のフォルダ名を比べる。どちらかが違うときは再起動せず、違う値と、起動のコマンドで再起動する手順（`mindstella server restart`）を示す（並行する別のセッションが使っているため）
    notes: Claude Code のプロファイル（`~/.claude`・`~/.claude-sub5` など）ごとにプラグインのフォルダのパスが違うので、パスの全体ではなく末尾のフォルダ名（コミットの SHA かバージョン）で比べる。プロファイルごとに別のコミットを入れているときは、そのプロファイルのセッションで案内が出て、どちらのコードで動かすかは利用者が再起動で選ぶ
  - item: 起動の仕方
    constraint: 依存を確かめ（『依存の確認』と同じ確かめ方）、`systemctl --user show-environment` が終了コード 0 なら systemd --user で、そうでなければ新しいセッションで起動する。systemd --user では、起動するたびに、このスクリプトのプラグインのフォルダでユニットのファイル `${XDG_CONFIG_HOME:-~/.config}/systemd/user/mindstella.service` を書き（内容が同じなら書かない）、`daemon-reload` してから `start` する。ユニットは `Type=exec`・`ExecStart={python_path} {このスクリプトのプラグインのフォルダ}/skills/mindmap/scripts/server.py`・`StandardOutput=append:{~/.mindmap/server.log}`・`StandardError=append:{~/.mindmap/server.log}`・`Restart=on-failure`・`RestartSec=5`・`StartLimitIntervalSec=60`・`StartLimitBurst=3`、呼び出し元の環境の `MINDSTELLA_*`・`PROJECT_INDEX_PORT`・`XDG_STATE_HOME` を並べた `Environment=` を持つ。新しいセッションでは、環境変数は呼び出し元の環境をそのまま渡し、標準入力はつながず、標準出力・標準エラーは `~/.mindmap/server.log` に書き足す
    notes: どちらの起動でも、常駐サーバーの出力は `~/.mindmap/server.log` に書き足されるので、起動を待つ間に同じファイルから理由を読める。`RestartSec=5` は起動を待つ上限（10 秒）の間に起動し直しが 1 回までになる値
  - item: 起動を待つ上限
    constraint: '`GET /_admin/status` を 0.2 秒ごとに送り、10 秒まで待つ。その間に常駐サーバーのプロセスが終わったら、`server.log` に書き足された分から理由を読んで示す。終わったかは、新しいセッションでは起動した子プロセスの終了で、systemd --user では `systemctl --user is-active mindstella.service` が `failed` か `activating`（`Restart=on-failure` の起動し直しを待っている）を返したことで見分ける'
    notes: 'mcp の SDK と PyYAML を読み込んで待ち受けるまでの時間（`MCPServer` の起動。WSL で 1 秒前後）に余裕を持たせた値。会話の始まりを待たせるのは起動したときだけ'
  - item: 標準出力
    constraint: '`--hook` で、起動した・古いコードのまま動いている・起動できないときだけ書く（会話の文脈に入る）。既に同じバージョンと同じフォルダが待ち受けていれば何も書かない'
  - item: つなぎ直す案内
    constraint: 起動したときは、Claude Code が会話の始まりに常駐サーバーへつなげず mindstella のツールを持たないことがあるため、`/mcp` で mindstella につなぎ直す案内を出す
  - item: 起動し直し（--restart）
    constraint: 待ち受けているかを確かめず、systemd --user ではユニットのファイルを書き直し（このスクリプトのプラグインのフォルダと、呼び出し元の環境の `Environment=`）、`daemon-reload` してから `systemctl --user restart mindstella.service` を呼ぶ。新しいセッションの端末では `POST /_admin/stop` を送り、ポートが閉じるまで 0.2 秒ごとに 10 秒まで待ってから起動する。どちらも、その後は「起動を待つ上限」と同じに待つ
    notes: 起動のコマンドは `installPath` の `ensure_server.py` を `--restart` で呼ぶので、古いコードの常駐サーバーは、比べる値（`installPath` の末尾のフォルダ名）と同じフォルダのコードに替わる

notes:
  systemd を使う端末: 端末に 1 つの常駐サーバーを、セッションを閉じても残る形で持つ（A-119・D-285）。systemd --user が無い端末（macOS・systemd の無い WSL）は、今までどおり起動の確認が新しいセッションで起動する（非機能要件『OS』を変えない）

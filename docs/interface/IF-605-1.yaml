title: 常駐サーバーの起動時の照合
entry:
  kind: trigger
  value: 常駐サーバーの起動（`server.py` が `/mcp` と MindStella の API の待ち受けを始める前に 1 回と、待ち受けを始めた後に別のスレッドで 1 回）
lead: 常駐サーバーが待ち受けを始める前に、状態のフォルダの ID の一覧が無ければ project-index の配信元の行から作り直し、起動中の MindStella のセッションを照合して落ちたものを記録・通知する。待ち受けを始めた後に、エージェントフローの配信元の行を今のプラグインへ向け直す。
test_file: tests/integration/server/test_startup_reconcile.py
idempotent: true
side_effects: 状態のフォルダに `workspaces.yaml` が無いときだけ、ワークスペースの行の ID で `workspaces.yaml` を作る。`running` の `session.json` のうち落ちているものを `crashed` にし、『停止の通知』を止まった理由 `crashed` で呼ぶ。配信元 `mindstella-agent-flows` の行の `config` が今のプラグインと違うときだけ、project-index の `PATCH /settings/sources/{id}` で `config` を書き換える。ほかは書き込まない
exclusivity: ID の一覧の作り直しと状態の照合は、待ち受けを始める前に起動の処理の中で順に行う（MindStella の API・MCP の依頼はまだ受けない）。`workspaces.yaml` は全体で 1 つの鍵、`session.json` はファイルごとの鍵を取って書き込む（『落ちたことの見回り』と同じ鍵）。エージェントフローの配信元の確認は、待ち受けを始めた後に 1 本の `daemon` のスレッドで 1 回行い、同じ間に『ワークスペースの作成』が行を追加しても、`expectedVersion` の照合でどちらかが 409 を受けて取得し直す
exceptions:
  - name: なし（正常終了）
    condition: 3 つの処理のどれかに失敗しても
    notes: 失敗した処理を常駐サーバーのログ（標準エラー）に 1 行記録して次の処理へ進み、待ち受けを始める
constraints:
  - item: 順番
    constraint: 待ち受けを始める前に ID の一覧の作り直し → 状態の照合。作り直した ID の一覧のワークスペースも照合する。エージェントフローの配信元の確認は待ち受けを始めた後に行う
    notes: 資料 A-119 の「常駐サーバーが起動した」の行で、待ち受けの前に要るのは ID の一覧（MCP と API がワークスペースを扱う前提）と状態の照合だけ。ID の一覧がある普段の起動は、待ち受けの前に project-index を呼ばない
  - item: 配信元の行の取得
    constraint: project-index の `GET /settings/sources` で取得する。ID の一覧の作り直し（`workspaces.yaml` が無いときだけ、待ち受けの前に 1 回）とエージェントフローの配信元の確認（待ち受けの後に 1 回）で別々に呼ぶ。応答の行のキーは camelCase（`outsideRead`）。行の `config` は文字列か文字列の並びで、並びのときは先頭の要素を行の `config` として扱う（『ワークスペースの作成』と同じ）
    notes: 端末の設定のファイルを直接参照しない（行の書き込みも読み取りも project-index の API で行う。D-300）
  - item: project-index の失敗
    constraint: 待ち受けの前の `GET` が失敗した（つながらない・200 以外・上限で打ち切った）ときは ID の一覧の作り直しを飛ばし、待ち受けの後の `GET`・`PATCH` が失敗したときはエージェントフローの配信元の確認を飛ばす。どちらも飛ばした処理と失敗の理由をログに 1 行記録する。状態の照合は行う。409 の再送信のほかは、次の起動まで再試行しない
  - item: 待ち受けの前の `GET` の上限
    constraint: 5 秒。外側の『常駐サーバーの起動の確認』が待ち受けを待つ上限 10 秒に、内側の待ち（SDK を読み込んで待ち受けるまでの約 1 秒 + この `GET`）と余裕（内側の待ちの合計の 50%）を収める（(1 + 5) × 1.5 = 9 ≤ 10）。待ち受けるまでの時間は WSL での目安で、結合テストで測る
    notes: 外側の上限は『常駐サーバーの起動の確認』の制約「起動を待つ上限」。導き方は規約『資源の値の決め方』の「入れ子の待ち」
  - item: 待ち受けの後の呼び出しの上限
    constraint: 1 回の呼び出しは、ワークスペースの管理が project-index を呼ぶときと同じ 10 秒（`project_index.py` の `REQUEST_TIMEOUT_SEC`）。外側に待つ処理が無いため、入れ子の待ちに入らない
  - item: ID の一覧の作り直しの条件
    constraint: '`workspaces.yaml` が無いときだけ作り直す。あるときは配信元の行と突き合わせず、書き換えない。あるが読めない（YAML として読めない・`ids` が並びでない）ときは書き換えず、ログに記録して状態の照合を飛ばす'
  - item: ワークスペースの行
    constraint: '`config` の末尾が `/.mindstella/dev-docs.yaml` の行をワークスペースの行とし、その `id` を端末の設定の並び順で `ids` に入れる。クローズした行（`outsideRead` が偽）も入れる（削除するまで ID の一覧に残すため。D-322）。`mindstella-agent-flows` とほかの配信元の行は入れない'
    notes: 『ワークスペースの作成』の制約「配信元の行」の `config` の構造
  - item: 状態の照合
    constraint: 『落ちたことの見回り』の 1 回分と同じ。ID の一覧のワークスペースのうち `session.json` の `status` が `running` のものを、『MindStella のセッションの一覧』の「落ちたかの判定」で判定し、落ちていれば `crashed` にして『停止の通知』を `crashed` で呼ぶ。`stopping`・`restarting` は書き換えない。落ちた MindStella のセッションは起動し直さない
  - item: エージェントフローの配信元の確認
    constraint: 配信元の行のうち `id` が `mindstella-agent-flows` の行の `config` が、起動した常駐サーバーのプラグインのフォルダの `agent-flows/dev-docs.yaml` の絶対パスと文字列で違えば、`PATCH /settings/sources/mindstella-agent-flows` に `expectedVersion`（取得した `version`）と `source.config`（今のパス）だけを送信する。409（バージョンが更新前）なら 1 回だけ `version` を取得し直して再送信する。行が無いときは追加しない。`scope`・`outsideRead` は変えない
    notes: 行の追加は『ワークスペースの作成』（『エージェントフローの参照』の制約「配信元の登録」）
  - item: ログ
    constraint: 処理ごとの失敗と、作り直した ID の数・`crashed` にした MindStella のセッションの数・書き換えた配信元の行を、常駐サーバーのログに 1 行ずつ記録する
flows:
  - name: 正常系
    summary: ID の一覧がある状態で、ペインが無い running の MindStella のセッションを crashed にし、通知を 1 件送信する
    setup:
      - name: Mock
        description: project-index（`GET /settings/sources` に、ワークスペース A・B の行と、今のプラグインの `agent-flows/dev-docs.yaml` を指す `mindstella-agent-flows` の行を返却し、受けた要求を記録する HTTP のエンドポイント）と Discord の Webhook（受けた要求を記録して 200 を返却するエンドポイント）
      - name: 常駐サーバー
        description: テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ、`PROJECT_INDEX_PORT` は project-index の Mock のポート、`MINDSTELLA_DISCORD_WEBHOOK_FILE` は Webhook の Mock の URL を記載した一時ファイル
      - name: 状態
        description: '`workspaces.yaml` の `ids` が A・B。A の `session.json` は `stopped`。B の `session.json` は `running` でペインが無い'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 常駐サーバーの起動時の照合
        participant ST as 状態のフォルダ
        participant PI as project-index（Mock）
        participant DC as Discord（Mock）

        クライアント->>IF: 常駐サーバーを起動する
        IF-->>ST: workspaces.yaml がある
        IF-->>ST: A・B の session.json
        IF->>ST: B を crashed に書き換える
        IF->>DC: B の止まった理由 crashed
        IF-->>クライアント: 待ち受けを始める
        IF-->>PI: GET /settings/sources
        IF->>IF: mindstella-agent-flows の config は今のプラグインと同じ
      ```
    expected:
      - 待ち受けを始めたときには、B の `session.json` の `status` が `crashed`、A の `status` が `stopped` のまま
      - Webhook の Mock が、止まった理由が異常終了の B の要求を 1 件だけ受けている
      - project-index の Mock が受けた `GET /settings/sources` が、『停止の通知』が B の行を引く 1 件と待ち受けの後の確認の 1 件の 2 件だけで（ID の一覧があるので作り直しの GET は無い）、`PATCH` を受けていない
      - '`workspaces.yaml` が起動の前と同じ'
    test: test_normal
    notes:
      生きている A を置かない理由: 同じ tmux のサーバーに別のセッションがあると、『MindStella のセッションの一覧』の「落ちたかの判定」がペインの無い B も生きていると判定する（tmux 3.4 の `display-message -p -t` が、無いセッションを指しても終了コード 0 を返す）。判定を直す Issue が片付くまで、書き換えない側は `stopped` で確かめる
  - name: 正常系（ID の一覧が無い）
    summary: ワークスペースの行の ID で workspaces.yaml を作り、作った ID の一覧で照合する
    setup:
      - name: Mock
        description: project-index（正常系と同じ。ほかに、`config` が `.mindstella/dev-docs.yaml` で終わらない配信元の行と、`outsideRead` が偽のワークスペース C の行も返却する）
      - name: 常駐サーバー
        description: 正常系と同じ。ただし `MINDSTELLA_DISCORD_WEBHOOK_FILE` を指定しない
      - name: 状態
        description: '`workspaces.yaml` が無い。B の `session.json` は `running` でペインが無い'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 常駐サーバーの起動時の照合
        participant ST as 状態のフォルダ
        participant PI as project-index（Mock）

        クライアント->>IF: 常駐サーバーを起動する
        IF-->>ST: workspaces.yaml が無い
        IF-->>PI: GET /settings/sources
        IF->>ST: A・B・C で workspaces.yaml を作る
        IF->>ST: B を crashed に書き換える
        IF-->>クライアント: 待ち受けを始める
      ```
    expected:
      - '`workspaces.yaml` の `ids` が端末の設定の並び順の A・B・C で、ワークスペースでない行と `mindstella-agent-flows` を含まない'
      - B の `session.json` の `status` が `crashed`
      - '`GET /workspaces` が A・B を返却する（C はクローズ済み）'
      - project-index の Mock が `GET /settings/sources` を 2 件受けている（待ち受けの前の作り直しと、待ち受けの後の確認。Webhook を指定しないので『停止の通知』は行を引かない）
    test: test_normal_when_ids_missing
  - name: 正常系（プラグインを更新した後）
    summary: mindstella-agent-flows の行の config を今のプラグインのパスへ書き換える
    setup:
      - name: Mock
        description: project-index（正常系と同じ。ただし `mindstella-agent-flows` の行の `config` は別のフォルダの `agent-flows/dev-docs.yaml` を指し、最初の `PATCH` には 409（バージョンが更新前）、2 回目には 200 を返却する）
      - name: 常駐サーバー
        description: 正常系と同じ。ただし `MINDSTELLA_DISCORD_WEBHOOK_FILE` を指定しない
      - name: 状態
        description: '`workspaces.yaml` の `ids` が A。`session.json` は無い'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 常駐サーバーの起動時の照合
        participant PI as project-index（Mock）

        クライアント->>IF: 常駐サーバーを起動する
        IF-->>クライアント: 待ち受けを始める
        IF-->>PI: GET /settings/sources
        IF-->>PI: GET /settings/sources（PATCH の version）
        IF->>PI: PATCH /settings/sources/mindstella-agent-flows（config）
        PI-->>IF: 409
        IF-->>PI: GET /settings/sources
        IF->>PI: PATCH /settings/sources/mindstella-agent-flows（config）
        PI-->>IF: 200
      ```
    expected:
      - project-index の Mock が受けた 2 件の `PATCH` の本文が、`expectedVersion` と、今のプラグインのフォルダの `agent-flows/dev-docs.yaml` の絶対パスの `source.config` だけを持つ
      - 2 件目の `PATCH` の `expectedVersion` が、取得し直した `version`
    test: test_normal_when_plugin_updated
  - name: 正常系（エージェントフローの配信元の行が無い）
    summary: mindstella-agent-flows の行が無ければ追加しない
    setup:
      - name: Mock
        description: project-index（`GET /settings/sources` にワークスペース A の行だけを返却する）
      - name: 常駐サーバー
        description: 正常系と同じ。ただし `MINDSTELLA_DISCORD_WEBHOOK_FILE` を指定しない
      - name: 状態
        description: '`workspaces.yaml` の `ids` が A'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 常駐サーバーの起動時の照合
        participant PI as project-index（Mock）

        クライアント->>IF: 常駐サーバーを起動する
        IF-->>クライアント: 待ち受けを始める
        IF-->>PI: GET /settings/sources
        IF->>IF: mindstella-agent-flows の行が無い
      ```
    expected:
      - project-index の Mock が `POST`・`PATCH` を受けていない
    test: test_normal_when_agent_flows_missing
  - name: 異常系（project-index がつながらない・なし）
    summary: ID の一覧の作り直しとエージェントフローの配信元の確認を飛ばし、照合だけをして待ち受ける
    setup:
      - name: Mock
        description: なし（`PROJECT_INDEX_PORT` は、どのプロセスも待ち受けていないポート）
      - name: 常駐サーバー
        description: 正常系と同じ。ただし `MINDSTELLA_DISCORD_WEBHOOK_FILE` を指定しない
      - name: 状態
        description: '`workspaces.yaml` が無い'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 常駐サーバーの起動時の照合
        participant ST as 状態のフォルダ
        participant PI as project-index

        クライアント->>IF: 常駐サーバーを起動する
        IF-->>ST: workspaces.yaml が無い
        IF-->>PI: GET /settings/sources
        PI-->>IF: つながらない
        IF->>IF: ID の一覧の作り直しを飛ばしてログに記録する
        IF-->>クライアント: 待ち受けを始める
        IF-->>PI: GET /settings/sources
        PI-->>IF: つながらない
        IF->>IF: エージェントフローの配信元の確認を飛ばしてログに記録する
      ```
    expected:
      - '`GET /_admin/status` が応答する'
      - '`workspaces.yaml` が作られていない'
      - 常駐サーバーのログに、project-index へつながらず ID の一覧の作り直しを飛ばしたことと、エージェントフローの配信元の確認を飛ばしたことが 1 行ずつ記録されている
    test: test_error_when_project_index_down
  - name: 異常系（ID の一覧が読めない・なし）
    summary: 読めない workspaces.yaml を書き換えず、照合を飛ばして待ち受ける
    setup:
      - name: Mock
        description: project-index（正常系と同じ）
      - name: 常駐サーバー
        description: 正常系と同じ。ただし `MINDSTELLA_DISCORD_WEBHOOK_FILE` を指定しない
      - name: 状態
        description: '`workspaces.yaml` が YAML として読めない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 常駐サーバーの起動時の照合
        participant ST as 状態のフォルダ
        participant PI as project-index（Mock）

        クライアント->>IF: 常駐サーバーを起動する
        IF-->>ST: workspaces.yaml が読めない
        IF->>IF: 状態の照合を飛ばしてログに記録する
        IF-->>クライアント: 待ち受けを始める
        IF-->>PI: GET /settings/sources
      ```
    expected:
      - '`GET /_admin/status` が応答する'
      - '`workspaces.yaml` が起動の前と同じ'
      - 常駐サーバーのログに、ID の一覧が読めず状態の照合を飛ばしたことが記録されている
    test: test_error_when_ids_unreadable
callers:
  - SC-605-1#
refs:

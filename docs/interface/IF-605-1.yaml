decisions:
  - D-323
notes:
  再試行しない理由: project-index が落ちている間に ID の一覧の無いまま『ワークスペースの作成』が呼ばれると、作成したワークスペースだけの ID の一覧ができ、前のワークスペースは次の起動でも作り直されない（ID の一覧があるため）。この場合は、利用者が `workspaces.yaml` を削除して常駐サーバーを再起動すれば作り直される
  待ち受けた直後: エージェントフローの配信元の確認が終わるまでの数秒は、`mindstella-agent-flows` の行が更新前のプラグインのパスを指したままのことがある
id: IF-605-1

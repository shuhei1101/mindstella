      - '`comments.yaml` に C-1 が残り、`threads.yaml` のスレッドが増えていない'
      - ブラウザのコンソールに未処理の例外が出ていない
    test: test_error_when_comment_send_stale
lead: 利用者がサーバーの配信の `/spa/` をブラウザで開くと、React のプレビューが記録をサーバーから読み、URL の search params が指す画面を開く。書き換えの知らせを受けると記録を読み直して描き直す。
callers:
  - SC-489-12#
request:
  - name: tab
    type: "'overview' | 'decisions' | 'tasks' | 'research' | 'docs' | 'terms' | 'notes' | 'logs' | 'graph' | 'settings'"
    required: false
    default: なし（概要を開く）
    location: query
    description: 開く画面。React へ移した画面だけを持ち、移すたびに値を足す。`graph` はネットワークで、タブの帯の右端の入口から開く。`settings` は設定の画面で、タブの帯には出さない
    constraints: 決めた値以外と、表示しない種類（個人の上書きかワークスペースの既定）を指す値は無いものとして扱い、URL から外す（`graph` は表示する種類によらず開ける）。差分の表示中の `settings` も無いものとして扱う
  - name: view
    type: "'map' | 'board' | 'cards' | 'table'"
    required: false
    default: なし（画面ごとの既定。`decisions` と `tasks` は `board`、`docs` は `cards`、それ以外は `table`）
    location: query
    description: 表示形式。既定と違うときだけ書く
    constraints: その画面が持たない形式は無いものとして扱い、URL から外す（`graph` は表示形式を持たない）
  - name: id
    type: str
    required: false
    default: なし（詳細パネルを開かない）
    location: query
    description: 詳細パネルで開く項目の ID。ネットワークでは、この項目を選んだ項目として示す
    constraints: '`D-`・`T-`・`R-`・`A-`・`G-`・`N-`・`L-` に数字。記録に無い ID は無いものとして扱い、URL から外す'
    example: D-3
  - name: full
    type: "'1'"
    required: false
    default: なし（詳細パネルで開く）
    location: query
    description: 詳細を全画面で開く
    constraints: '`id` があるときだけ効く。`id` が無いときは URL から外す'
  - name: h
    type: str
    required: false
    default: なし（本文の頭で開く）
    location: query
    description: 詳細の本文の、開いたときに画面に入れる見出し
    constraints: 形は『プレビューを開く』のハッシュの引数 `h` と同じ。`id` があるときだけ効く。本文に無い見出しと、本文が HTML の資料のときは本文の頭で開き、URL から外す
    example: 決め方
  - name: diff
    type: "'since' | 'pending' | str"
    required: false
    default: なし（端末の保存領域に残した時点。残していなければ差分を出さない）
    location: query
    description: 差分の表示で比べる時点。`since` は「前回開いてから」、`pending` は「まだまとめていない変更」、それ以外はまとまりの ID（`V-{番号}`）
    constraints: 端末の保存領域に残した時点より先に読み、差分を出せた時点を保存領域にも残す。記録に無いまとまりの ID と、まだまとめていない変更が空の `pending` は差分を出さず、URL から外す。URL に無く、保存領域の時点で差分を出せたときは、その時点を URL に書く
    example: V-2
  - name: f.{列}
    type: str
    required: false
    default: なし（その画面の保存した条件、無ければ画面の既定の条件で絞る）
    location: query
    description: 開いている画面を、その列の値で絞る。どの表示形式とネットワークでも絞り込みのドロワーの条件として効く。概要の「すべて表示」・表のセル・絞り込みのドロワーとチップが書く
    constraints: 形は『プレビューを開く』のハッシュの引数 `f.{列}` と同じ（複数の値は `|`、`~{列}` は文字の条件）。絞り込みを変えるたびに書き直す
    example: f.status=要見直し
  - name: sort
    type: str
    required: false
    default: なし（画面ごとの既定の並び）
    location: query
    description: 表を並べる列。降順は列の前に `-` を付ける
    constraints: 表に無い列は無いものとして扱い、URL から外す。表の見出しで並べ替えるたびに書き直す
    example: -updated
  - name: panel
    type: "'pending' | 'comments' | 'display'"
    required: false
    default: なし（左のパネルを開かない）
    location: query
    description: 開いている左のパネル。`pending` は保存待ちのパネル、`comments` はコメントの一覧、`display` は表示の設定
    constraints: '`pending` は、差分の表示中と、開いたときに保存待ちの編集が 0 件のときは無いものとして扱い、URL から外す。開いている間に取り消して 0 件になったときは開いたまま空の状態を出す'
  - name: thread
    type: str
    required: false
    default: なし（スレッドの一覧を出す）
    location: query
    description: コメントの一覧のパネルの中で開いているスレッド。`TH-{番号}` は送ったスレッド、`C-{番号}` はまだ送っていない新しいスレッド（最初の書き込みのコメントの ID）
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときと、スレッドにもレビュー中の新しいスレッドにも無い ID は無いものとして扱い、URL から外す'
    example: TH-3
  - name: review
    type: "'1'"
    required: false
    default: なし（スレッドの一覧か `thread` のスレッドを出す）
    location: query
    description: コメントの一覧のパネルの中で、レビュー中の書き込みの画面を開く。戻ると `thread` のスレッドか、無ければスレッドの一覧を出す
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときは URL から外す'
  - name: tstatus
    type: "'closed' | 'all'"
    required: false
    default: なし（オープンのスレッドに絞る）
    location: query
    description: スレッドの一覧を状態で絞る
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときは URL から外す'
  - name: ttag
    type: str
    required: false
    default: なし（タグで絞らない）
    location: query
    description: スレッドの一覧を絞るタグ。1 つだけ
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときと、どのスレッドにも無いタグは無いものとして扱い、URL から外す'
    example: 画面
  - name: search
    type: "'1'"
    required: false
    default: なし（全体の検索を開かない）
    location: query
    description: 全体の検索のモーダルを開く。トップバーの検索の入口と `Ctrl+K`（macOS は `Cmd+K`）が書き、閉じると外す
    constraints: 開いている画面と詳細パネルの上に重ねて開き、ほかの search params を変えない
  - name: q
    type: str
    required: false
    default: なし（検索の言葉が空）
    location: query
    description: 全体の検索の言葉
    constraints: '`search` があるときだけ効く。`search` が無いときと、前後の空白を除いて空のときは URL から外す。入力に合わせて書き直す'
    example: 画面
  - name: 編集の値
    type: Any
    required: false
    default: なし（溜めない）
    location: body
    description: 詳細の編集の入力欄・一覧の画面の追加の入力・設定の画面で書いた値。キーと一緒に『保存待ちの編集の追加』へ送る
    constraints: 『保存待ちの編集の追加』の request `value` と同じ。`title` は前後の空白を除いて 1 文字以上
  - name: コメントの本文
    type: str
    required: false
    default: なし（溜めない）
    location: body
    description: 詳細パネル・詳細の全画面・コメントの一覧の入力欄と、スレッドの返信の入力に書いて溜める本文。開いている項目の ID（一覧の入力欄は無し）・添えた箇所・返信先のスレッドと一緒に『レビュー中のコメントの追加』へ送る
    constraints: 前後の空白を除いて 1 文字以上、10000 文字以下
    example: 案 A にする
  - name: 選んだ範囲
    type: Range
    required: false
    default: なし（入口を出さない）
    location: body
    description: 詳細パネル・詳細の全画面で、本文の文か項目の値を選んだ範囲。本文は元の Markdown か HTML の行の範囲に、値はキーのパスに対応づけて箇所にする
    constraints: 『プレビューを開く』の request「選んだ範囲」と同じ
constraints:
  - item: 通信
    constraint: サーバーの配信（同じオリジンの `/api/`）と、描画のライブラリと Google Fonts の文字の配信元だけへ通信する。記録を外へ送らない。HTML の本文が外の画像・CSS を指すときだけ、描くときにブラウザがその URL を読みに行く
  - item: 描画のライブラリ
    constraint: mdmark・mermaid・elkjs・marked・jsdiff は、今の画面と同じ配信元と版から、`integrity` で中身を確かめて読む。読めなかったときは代わりの読み込みをせず、そのライブラリを使う箇所に名前を出し、本文は原文を出す。表・ボード・カードはそのまま使える
  - item: 本文の無害化
    constraint: 『プレビューを開く』の制約「本文の無害化」と同じ
  - item: 画面への反映の時間
    constraint: 書き換えの知らせを受けてから 2 秒以内に描き直す
    decided_by: NFR-489-1#requirements[画面への反映の時間]
  - item: 描き直し
    constraint: '`changed` を受けたら `GET /api/records`・`GET /api/comments`・`GET /api/edits`・`GET /api/threads` を読み直す。開いている画面・URL の search params・表の列の表示・本文のスクロールの位置・編集とコメントの入力欄の書きかけ・レビュー中の書き込みのチェックを保ったまま描き直し、履歴に積まない。開いていた項目が記録から消えたら詳細を閉じ、URL から `id`・`full`・`h` を外す。開いていたスレッドが無くなったら（まだ送っていない新しいスレッドを送ったか消したときを含む）スレッドの一覧を出し、URL から `thread` を外す。読み直しが 422 なら前に読んだ記録で描き続ける'
  - item: 接続の状態
    constraint: 書き換えの知らせが切れている間は、前に読んだ記録で描き続け、トップバーに接続が切れたことを出す。つなぎ直しは `EventSource` に任せる
  - item: URL の状態
    constraint: 画面で見ているものに影響する状態（リクエストの表の全て）は URL の search params に持ち、TanStack Router の `validateSearch` と Zod で検証する。既定の値は書かない
  - item: 履歴
    constraint: 画面の移動と、詳細の中の項目の移動（本文の用語・項目の ID のリンクを含む）と、全体の検索の結果から開いた項目の種類の画面が今の画面と違うときは履歴に積む。表示形式の切り替え・詳細パネルの開閉・全画面の開閉・本文の見出しへの移動・絞り込みと並べ替え・差分の時点の選び直し・左のパネルの開閉・コメントの一覧の中のスレッドとレビュー中の書き込みの画面の行き来・スレッドの絞り込み・全体の検索の開閉と検索の言葉の入力は積まずに URL を置き換える。幅 900px 以下の詳細パネルだけは開くときに積む
  - item: 画面の移動と項目
    constraint: タブの帯で画面を移るときは `id`・`diff` を残し、`view`・`f.{列}`・`sort` を外す。移った先が検討事項のマップかネットワークのときは、`id` の項目を選んだ項目として示す。全体の検索の結果から項目を開くときは、その項目の種類の画面（表示しない種類の項目は概要）へ移り、`id` をその項目にして、`diff` と左のパネル（`panel`・`thread`・`review`・`tstatus`・`ttag`）を残し、`view`・`full`・`h`・`f.{列}`・`sort`・`search`・`q` を外す。開いた項目の種類の画面が今の画面と同じときも、同じく `view` を外して既定の表示形式で詳細パネルを開く
  - item: 保存した絞り込みの条件
    constraint: 画面ごとの絞り込みの条件を、今の画面と同じ端末の保存領域のキーに、条件を変えるたびに書く。URL に `f.{列}` が無い画面を開くときは保存した条件を当てて URL に書き、`f.{列}` があれば URL の条件で開いて保存した条件を書き換える。保存した値が今の記録に無ければ、その値を外して描く
  - item: 端末の保存領域
    constraint: ライト / ダーク・表ごとの表示する列とピン留め・変更履歴で選んだ時点・差分のミニマップ・本文の差分の並べ方・本文の表とセクションの見せ方・画面ごとの絞り込みの条件・表示する種類・コメントの一覧のピン止め・レビュー中のコメントの並び・ネットワークの見た目は、今の画面と同じ `localStorage` のキーと値の形で読み書きし、知らない項目を消さない。詳細パネルの幅は今の画面と同じ `sessionStorage` のキーに持つ。詳細パネル・詳細の全画面の本文のスクロール位置は、今の画面と同じ `sessionStorage` のキー（`mindmap-body-scroll`）に項目の ID ごとに持ち、項目を開いたときにその位置へ戻す。`h` の見出しへ送るときは戻さない
  - item: 「前回開いてから」の範囲
    constraint: 『プレビューを開く』の制約「「前回開いてから」の範囲」のサーバーの配信の決め方と同じ。`sessionStorage` のキーも今の画面と同じにし、同じタブで今の画面と SPA を行き来しても `POST /api/opened` を呼び直さない
  - item: 前の版の組み立て
    constraint: 『プレビューを開く』の制約「前の版の組み立て」と同じ
  - item: 差分の表示と書き換え
    constraint: 差分の表示に入る・抜ける・時点を選び直すだけでは記録を読み直さない。画面・項目を移っても `diff` を保つ。書き換えの知らせで読み直したときは同じ時点の差分の表示のまま描き直し、選んだまとまりが記録から消えたか、`pending` を選んでいてまだまとめていない変更が空になったら、差分の表示をやめて URL から `diff` を外す
  - item: 編集の読み書き
    constraint: 『プレビューを開く』の制約「編集の読み書き」のサーバーの配信の振る舞いと同じ（入力欄を離れたときに `POST /api/edits`、取り消しは `DELETE /api/edits/{id}`、保存は `POST /api/edits/save`。保存の 409 は `blocked` を行ごとの書き込めない理由として出し、届かないときは保存待ちの編集を残す。差分の表示中は編集の操作・保存待ちの印・件数を出さず、保存待ちのパネルを閉じる）。送っている間はそのボタンを押せなくし、二重に送らない
  - item: コメントの読み書き
    constraint: 『プレビューを開く』の制約「コメントの読み書き」と同じ（溜める・直す・消す・元に戻す・まとめて送る・書きかけの保存の送り先と、送れなかったときに本文を残して理由を出す振る舞い）
  - item: 選んだ箇所の対応づけ
    constraint: 『プレビューを開く』の制約「選んだ箇所の対応づけ」と同じ。箇所の値は今の画面と同じ（『レビュー中のコメントの追加』の request `loc`）
  - item: レビュー中のコメントの並び
    constraint: 『プレビューを開く』の制約「レビュー中のコメントの並び」と同じ
  - item: スレッドの読み書き
    constraint: 『プレビューを開く』の制約「スレッドの読み書き」と同じ（開いたスレッドの利用者の既読、返信、クローズとオープンへの戻し）
  - item: 書き込みのまとまりのリンク
    constraint: 『プレビューを開く』の制約「書き込みのまとまりのリンク」と同じ。押したときは `diff` だけを置き換え、ほかの search params は保つ
  - item: 表示の設定
    constraint: 表示する種類・差分のミニマップ・本文の表とセクションの見せ方の個人の上書きは、選んだときに端末の保存領域に書いてその場で画面に当て、サーバーへは送らない。開いている画面の種類を外したときは概要へ移り、URL を置き換える。ワークスペースの既定は、既定の保存の確かめで「保存する」を押したときに `PUT /api/config/display` で書く（`network_look` は個人の上書きの見た目を送り、上書きが無ければ記録の既定（`settings.display.network_look`。無ければ `deep`）を送る）。書き換えの知らせで読み直した記録の既定が変わったときは、上書きを持たない項目に新しい既定を当てる
  - item: 設定の画面の入口
    constraint: 設定の画面は `tab=settings` で開く。入口は表示の設定のパネルの「設定を編集する」で、押すとパネルを閉じて設定の画面へ移り、履歴に積む
  - item: ネットワークのロック
    constraint: 注目の起点のロックは、ページを開いている間だけ画面の中に持ち、URL にも端末の保存領域にも書かない。タブを行き来しても残し、検討事項のマップのロックとは別々に持つ
  - item: 音声の入力
    constraint: '開いたときに `GET /api/transcription` を読み、コメントの入力・返信の入力のマイクのボタンを置く。応答を待たずに入力を描き、`available` が `false` か、ブラウザが `navigator.mediaDevices.getUserMedia` を持たないときは、マイクのボタンを押せない見た目にしてフォーカスは受けたまま（`aria-disabled`）、理由（`detail`、マイクを使えないときは画面が持つ文）をツールチップと押したときの結果の行に出す。サービスが使えないために押せないマイクのボタンを押したときは `GET /api/transcription` を読み直し、使えるようになっていれば押せる状態に戻す（録音は利用者がもう一度押して始める）。押すと `getUserMedia({audio: true})` と `MediaRecorder` で録り、マイクと「レビューに追加」の位置を × の「キャンセル」と ✓ の「文字起こし」に切り替える。録音中は、入力欄の中身とカーソルの位置を残したまま入力欄を隠してキーボードの入力を受け付けず、同じ場所に、`AnalyserNode` で取ったマイクの音量を縦の棒で描く波形（読み上げない）を出す。録音を終えたら（キャンセル・✓・失敗）波形を消して入力欄に戻す。キャンセルは録音を捨ててマイクを解放する。✓ は録音を止め、`POST /api/transcriptions` へ録った形の `Content-Type` で送り、返った文字を入力欄のカーソルの位置へ挿入する。`action`（無ければ `review`）が `review` なら挿入した全文を「レビューに追加」と同じく `POST /api/comments` へ送ってレビュー中に溜め、溜められたら入力欄を空にする（溜められなければ全文を入力欄に残して理由を結果の行に出す）。`send` なら挿入した全文を `POST /api/comments/send-now`（コメントの入力は `target`・`loc`、返信の入力は `thread`）へ送り、送れたら入力欄を空にする。`insert` なら送らず、利用者が「レビューに追加」を押すとキーボードで入力した書き込みと同じくレビュー中に溜める。失敗（許可の拒否・503・502・504・413・届かない）は、入力欄の文字を残して理由を結果の行に出し、503 のときはマイクのボタンを押せなくする。録音は画面で同時に 1 つだけにし、録音・文字起こし中はほかの入力欄のマイクのボタンを押せない見た目（`aria-disabled`）にして理由をツールチップと押したときの結果の行に出す（キーボードの入力は受け付ける）。録音中に入力欄が画面から消えても（ほかの項目・スレッド・タブへ移る、パネル・全画面・入力を閉じる）録音を続け、トップバーのコメントのボタンの左隣に音声入力中の表示を出す。表示を押すと録音を始めた入力欄の画面（詳細パネル・詳細の全画面・コメントの一覧・スレッド）を開き、波形と × ・ ✓ を出し直して ✓ にフォーカスを移す。入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が終わったときは、結果を入力欄の書きかけ（`body`）へ反映し（`insert` と失敗のときは挿入した全文。カーソルは挿入した文字の後ろ）、失敗のときはトップバーの下の帯に理由と「入力欄を開く」のボタンを出す（成功のときは何も出さない）。「入力欄を開く」は音声入力中の表示と同じく入力欄の画面を開いてフォーカスを移し、帯を閉じる。録音中に行き先の項目・スレッドが記録から無くなったら録音を捨ててマイクを解放し、トップバーの下の帯に理由を出す。録音の開始で `navigator.wakeLock.request("screen")` を求め、録音を終えたら（✓・キャンセル・失敗・捨てた）解放する。録音中に画面が見えるようになったとき（`visibilitychange`）解放されていれば求め直し、求められないときは何も出さずに録音を続ける'

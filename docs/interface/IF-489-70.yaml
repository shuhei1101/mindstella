        SV-->>IF: 409、stale は C-1
        IF-->>ユーザー: C-1 の行に箇所が合わない理由
      ```
    expected:
      - C-1 の行に箇所が合わない理由と、箇所を外すボタンがある
      - '`comments.yaml` に C-1 が残り、`threads.yaml` のスレッドが増えていない'
      - ブラウザのコンソールに未処理の例外が出ていない
    test: test_error_when_comment_send_stale
  - name: 正常系（入力中に書き換える）
    summary: 入力する欄にフォーカスがある間は再読み込みせず「更新があります」を出し、フォーカスが外れたら 1 回だけ再読み込みする
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/?tab=decisions&view=table&id=D-1` を実際のブラウザで開く）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
        notes: 開いた後に、詳細パネルのコメントの入力に「途中まで」と入れてフォーカスを置いたまま、MCP の `add` で検討事項を 1 件追加する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as React のプレビュー
        participant SV as サーバーの配信

        ユーザー->>IF: コメントの入力に入れている
        SV-->>IF: changed の知らせ
        IF-->>ユーザー: 再読み込みせず、「更新があります」の帯
        ユーザー->>IF: 入力欄の外を押す
        IF-->>SV: GET /w/{workspace}/api/records
        SV-->>IF: 記録
        IF-->>ユーザー: 再描画した表、帯を削除する
      ```
    expected:
      - フォーカスが入力欄にある間は、追加してから 3 秒たっても `GET /w/{workspace}/api/records` を呼ばず、表の行が増えず、入力欄の値が「途中まで」でフォーカスが入力欄にあり、「更新があります。入力欄から離れると反映します。」の帯が出ている
      - 入力欄の外を押してから 2 秒以内に、表に追加した行が出て、帯が消え、`GET /w/{workspace}/api/records` を呼んだのが 1 回である
      - 再描画した後も、コメントの入力の値が「途中まで」で、URL が変わらない
    test: test_normal_when_records_changed_while_typing
  - name: 正常系（埋め込んだ動画を再生する）
    summary: 本文の ../files/{名前} を配信の /w/{workspace}/files/{名前} に解決して、動画・画像を描く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配る `/w/{workspace}/` を実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を Markdown で持つ資料 A-1
        notes: 本文に `![動画](../files/clip.mp4)`・`![画面](../files/shot.png)` を持ち、両方を直下の `files/` に配置する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as React のプレビュー
        participant SV as 配信

        ユーザー->>IF: /w/{workspace}/ で A-1 の詳細パネルを開く
        IF-->>SV: GET /w/{workspace}/files/clip.mp4・GET /w/{workspace}/files/shot.png
        IF-->>ユーザー: 再生バーを持つ動画と画像を描いた本文
      ```
    expected:
      - 本文の `video` の `src` が `/w/{workspace}/files/clip.mp4`、`img` の `src` が `/w/{workspace}/files/shot.png` で、動画は再生でき、画像は読み込みを終えている
    test: test_normal_when_embedded_files
  - name: 正常系（項目で絞ったコメントの一覧を開く）
    summary: 詳細パネルのボタンで、開いている項目で絞ったスレッドの一覧を開き、項目の絞り込みを外す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/` を実際のブラウザで開く）
      - name: make_workspace
        description: 検討事項 D-1・D-2 と、D-1 へ向けたオープンのスレッド TH-1・D-2 へ向けたオープンのスレッド TH-2・D-1 へのまだ送信していない新規スレッド C-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&id=D-1` で開く'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as React のプレビュー

        ユーザー->>IF: 詳細パネルのコメントの一覧のボタンを押す
        IF-->>ユーザー: D-1 で絞ったスレッドの一覧
        ユーザー->>IF: 項目の絞り込みのチップの × を押す
        IF-->>ユーザー: 項目で絞らないスレッドの一覧
      ```
    expected:
      - ボタンを押した後、URL の search params が `tab=decisions&id=D-1&panel=comments&ttarget=D-1` で、一覧に C-1 と TH-1 だけが出て、履歴の数が変わらない
      - × を押した後、URL から `ttarget` が外れ、一覧に C-1・TH-1・TH-2 が出て、履歴の数が変わらない
    test: test_normal_when_comment_target_filtered
  - name: 正常系（配る書き出しを通信なしで開く）
    summary: 『配る書き出し』の HTML を `file://` で開くと、外部への要求をせずに、中に持つ記録・描画のライブラリで概要と詳細の本文・図を描く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `export` で書き出した HTML を実際のブラウザで `file://` で開く）
      - name: make_workspace
        description: 本文に見出しと Mermaid の図と map の範囲（`<!-- map -->` の中の flowchart）を持つ資料 A-1 を持つワークスペース
        notes: '`file:` 以外への要求を全てブラウザで止めて数えてから、書き出した HTML を開き、続けて `#/?tab=docs&id=A-1` へ移る'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as React のプレビュー（配る書き出し）

        ユーザー->>IF: file:// で開く
        IF->>IF: mindmap-data の記録を読む
        IF-->>ユーザー: 概要
        ユーザー->>IF: #/?tab=docs&id=A-1 へ移る
        IF->>IF: 中に持つ mdmark・mermaid で本文と図を描く
        IF-->>ユーザー: 詳細パネルの本文と図
      ```
    expected:
      - 開いた直後に概要のタイルが描かれている
      - 詳細パネルに A-1 の本文の見出しと Mermaid の図の SVG があり、map の図の描画の領域にノードの名前の要素があって map の範囲の原文が画面に無い（中に持つ部品 `map` で描いた）
      - 止めた要求が 0 件
      - ブラウザのコンソールにエラーが出ていない
    test: test_normal_when_exported_offline
  - name: 正常系（配る書き出しで書き込む操作を出さない）
    summary: 配る書き出しは、項目の追加・編集・確認済み・コメント・保存待ち・ワークスペースの既定にするの操作を出さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `export` で書き出した HTML を実際のブラウザで `file://` で開く）
      - name: make_workspace
        description: タスク T-1 を持つワークスペース
        notes: 書き出した HTML を `#/?tab=tasks&id=T-1` で開き、トップバーの表示の設定を開く
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as React のプレビュー（配る書き出し）

        ユーザー->>IF: file:// で #/?tab=tasks&id=T-1 を開く
        IF-->>ユーザー: タスクの一覧と T-1 の詳細パネル
        ユーザー->>IF: 表示の設定を開く
        IF-->>ユーザー: 表示の設定のパネル
      ```
    expected:
      - トップバーにコメントと保存待ちのボタンが無い
      - タスクの項目を追加するボタンが無い
      - 詳細パネルに編集する・確認済み・コメントの一覧のボタンと入力欄が無い
      - 表示の設定のパネルにワークスペースの既定にするのボタンが無い
    test: test_normal_when_exported_read_only
lead: 利用者がサーバーの配信の `/w/{workspace}/` をブラウザで開くと、React のプレビューが記録をサーバーから読み、URL の search params が指す画面を開く。書き換えの通知を受けると記録を再読み込みして再描画する。
callers:
  - SC-489-12#
request:
  - name: tab
    type: "'overview' | 'decisions' | 'tasks' | 'research' | 'docs' | 'terms' | 'notes' | 'logs' | 'settings'"
    required: false
    default: なし（概要を開く）
    location: query
    description: 開く画面。React へ移した画面だけを持ち、移すたびに値を追加する。`settings` は設定の画面で、タブの帯には出さない
    constraints: 決めた値以外と、表示しない種類（個人の上書きかワークスペースの既定）を指す値は無いものとして扱い、URL から外す（削除したネットワークの `graph` も決めた値以外として扱い、概要を開く）。差分の表示中の `settings` も無いものとして扱う
  - name: view
    type: "'board' | 'cards' | 'table'"
    required: false
    default: なし（画面ごとの既定。`decisions` と `tasks` は `board`、`docs` は `cards`、それ以外は `table`）
    location: query
    description: 表示形式。既定と違うときだけ書く
    constraints: その画面が持たない形式は無いものとして扱い、URL から外す（削除した検討事項のマップの `map` も持たない形式として扱い、既定のボードを開く）
  - name: id
    type: str
    required: false
    default: なし（詳細パネルを開かない）
    location: query
    description: 詳細パネルで開く項目の ID
    constraints: '`D-`・`T-`・`R-`・`A-`・`G-`・`N-`・`L-` に数字。記録に無い ID は無いものとして扱い、URL から外す'
    example: D-3
  - name: full
    type: "'1'"
    required: false
    default: なし（詳細パネルで開く）
    location: query
    description: 詳細を全画面で開く
    constraints: '`id` があるときだけ効く。`id` が無いときは URL から外す'
  - name: h
    type: str
    required: false
    default: なし（本文の頭で開く）
    location: query
    description: 詳細の本文の、開いたときに画面に入れる見出し
    constraints: 見出しの文言の空白を `-` にした状態。同じ文言の見出しが 2 つ以上あるときは、本文の頭から 2 つ目が `-1`、3 つ目が `-2` を続ける。`id` があるときだけ効く。本文に無い見出しと、本文が HTML の資料のときは本文の頭で開き、URL から外す
    example: 決め方
  - name: diff
    type: "'since' | 'pending' | str"
    required: false
    default: なし（そのタブの保存領域に残した時点。残していなければ差分を出さない）
    location: query
    description: 差分の表示で比べる時点。`since` は「前回開いてから」、`pending` は「まだまとめていない変更」、それ以外はまとまりの ID（`V-{番号}`）
    constraints: そのタブの保存領域（制約「保存した絞り込みの条件」のキー）に残した時点より先に読み、差分を出せた時点を保存領域にも残す。記録に無いまとまりの ID と、まだまとめていない変更が空の `pending` は差分を出さず、URL から外す。URL に無く、保存領域の時点で差分を出せたときは、その時点を URL に書く
    example: V-2
  - name: f.{列}
    type: str
    required: false
    default: なし（その画面の保存した条件、無ければ画面の既定の条件で絞る）
    location: query
    description: 開いている画面を、その列の値で絞る。どの表示形式でも絞り込みのドロワーの条件として効く。概要の「すべて表示」・表のセル・表・ボード・カード・詳細パネルのタグ・絞り込みのドロワーとチップが書く
    constraints: 複数の値は `|` でつなぐ。列が `~{列}` のときは文字の条件で、その列の値に文字を含む行に絞る（大文字・小文字を区別せず、文字の中の `|` で分けない）。絞り込みを変えるたびに書き直す
    example: f.status=要見直し
  - name: sort
    type: str
    required: false
    default: なし（画面ごとの既定の並び）
    location: query
    description: 表を並べる列。降順は列の前に `-` を付ける
    constraints: 表に無い列は無いものとして扱い、URL から外す。表の見出しで並べ替えるたびに書き直す
    example: -updated
  - name: panel
    type: "'pending' | 'comments' | 'display'"
    required: false
    default: なし（左のパネルを開かない）
    location: query
    description: 開いている左のパネル。`pending` は保存待ちのパネル、`comments` はコメントの一覧、`display` は表示の設定
    constraints: '`pending` は、差分の表示中と、開いたときに保存待ちの編集が 0 件のときは無いものとして扱い、URL から外す。開いている間に取り消して 0 件になったときは開いたまま空の状態を出す'
  - name: thread
    type: str
    required: false
    default: なし（スレッドの一覧を出す）
    location: query
    description: コメントの一覧のパネルの中で開いているスレッド。`TH-{番号}` は送信したスレッド、`C-{番号}` はまだ送信していない新規スレッド（最初の書き込みのコメントの ID）
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときと、スレッドにもレビュー中の新規スレッドにも無い ID は無いものとして扱い、URL から外す'
    example: TH-3
  - name: review
    type: "'1'"
    required: false
    default: なし（スレッドの一覧か `thread` のスレッドを出す）
    location: query
    description: コメントの一覧のパネルの中で、レビュー中の書き込みの画面を開く。戻ると `thread` のスレッドか、無ければスレッドの一覧を出す
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときは URL から外す'
  - name: tstatus
    type: "'closed' | 'all'"
    required: false
    default: なし（オープンのスレッドに絞る）
    location: query
    description: スレッドの一覧を状態で絞る
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときは URL から外す'
  - name: ttag
    type: str
    required: false
    default: なし（タグで絞らない）
    location: query
    description: スレッドの一覧を絞るタグ。1 つだけ
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときと、どのスレッドにも無いタグは無いものとして扱い、URL から外す'
    example: 画面
  - name: search
    type: "'1'"
    required: false
    default: なし（全体の検索を開かない）
    location: query
    description: 全体の検索のモーダルを開く。トップバーの検索の入口と `Ctrl+K`（macOS は `Cmd+K`）が書き、閉じると外す
    constraints: 開いている画面と詳細パネルの上に重ねて開き、ほかの search params を変えない
  - name: q
    type: str
    required: false
    default: なし（検索の言葉が空）
    location: query
    description: 全体の検索の言葉
    constraints: '`search` があるときだけ効く。`search` が無いときと、前後の空白を除いて空のときは URL から外す。入力に合わせて書き直す'
    example: 画面
  - name: 編集の値
    type: Any
    required: false
    default: なし（溜めない）
    location: body
    description: 詳細の編集の入力欄・一覧の画面の追加の入力・設定の画面で書いた値。キーと一緒に『保存待ちの編集の追加』へ送信する
    constraints: 『保存待ちの編集の追加』の request `value` と同じ。`title` は前後の空白を除いて 1 文字以上
  - name: コメントの本文
    type: str
    required: false
    default: なし（溜めない）
    location: body
    description: 詳細パネル・詳細の全画面・コメントの一覧の入力欄と、スレッドの返信の入力に書いて溜める本文。開いている項目の ID（一覧の入力欄は無し）・添えた箇所・返信先のスレッドと一緒に『レビュー中のコメントの追加』へ送信する
    constraints: 前後の空白を除いて 1 文字以上、10000 文字以下
    example: 案 A にする
  - name: 選んだ範囲
    type: Range
    required: false
    default: なし（入口を出さない）
    location: body
    description: 詳細パネル・詳細の全画面で、本文の文か項目の値を選んだ範囲。本文は元の Markdown か HTML の行の範囲に、値はキーのパスに対応づけて箇所にする
    constraints: 本文と値の外・空の選択・Markdown の中の `html` のコードブロックを描いた枠の中の選択・差分の表示の間の HTML の本文の中の選択では入口を出さない
  - name: ttarget
    type: str
    required: false
    default: なし（項目で絞らない）
    location: query
    description: スレッドの一覧を絞る項目の ID。向けた項目がその項目のスレッドと、その項目へのまだ送信していない新規スレッドだけを出す。詳細パネルのコメントの一覧のボタンが書き、項目の絞り込みのチップの × で外す。コメントの一覧を開いたままボタンを押したときは、`tstatus`・`ttag` を残して書き換える
    constraints: '`panel` が `comments` のときだけ効く。それ以外のときと、記録に無い項目の ID は無いものとして扱い、URL から外す。トップバーのコメントのボタンで開くときは書かない'
    example: D-12
  - name: tagmatch
    type: "'any'"
    required: false
    default: なし（選んだタグを全て持つ項目に絞る）
    location: query
    description: '`f.tags` で選んだタグの組み合わせ方。`any` は選んだタグのどれかを持つ項目に絞る'
    constraints: '`f.tags` が無いときは URL から外す。絞り込みのドロワーの「すべて含む / どれかを含む」が書く'
    example: tagmatch=any
constraints:
  - item: 通信
    constraint: サーバーの配信（同じオリジンの `/w/{workspace}/api/`）と、描画のライブラリと Google Fonts の文字の配信元だけへ通信する。記録を外へ送信しない。HTML の本文が外の画像・CSS を指すときだけ、描くときにブラウザがその URL を読みに行く
  - item: 描画のライブラリ
    constraint: mermaid・marked・jsdiff は、プラグインの `preview/libraries.json`（ライブラリごとの jsDelivr のバージョンを固定した URL・`integrity`（sha384）・置かれるグローバルの名前。画面と『配る書き出し』が共有する唯一の持ち主）の URL から、`integrity` で中身を確かめて読む。mdmark は、『記録の取得』の `mdmark_ref` の jsDelivr の URL（`gh/shuhei1101/mdmark@{mdmark_ref}/dist/`。`mdmark_ref` を受ける前は `develop`）から、`integrity` を付けずに `crossorigin="anonymous"` で読む。ES モジュールのため、CSS を link 要素で読み、JavaScript を `import()` で読む。`mount` の `config` には、`features`（画面と重なる機能のオフ。mdmark が既定でオンにする目次のレール・先頭へ戻るボタン・図の拡大・mermaid の描画も含める。表の機能 `table` は、詳細・詳細の全画面・本文の差分の本文でオンにし、スレッドの書き込みでオフにする）と、`settings.mdmark.map` を `map` として指定する。読めなかったときは代わりの読み込みをせず、そのライブラリを使う箇所に名前を出し、本文は原文を出す。表・ボード・カードはそのまま使える
  - item: 本文の無害化
    constraint: 本文とスレッドの書き込みの Markdown は、mdmark が HTML に描くときに無害化した結果を差し込む。図はスクリプトを動かさない安全の設定で描く。HTML の本文は、記録の `marked_bodies` を `sandbox="allow-same-origin"`（`allow-scripts` を付けない）の iframe の `srcdoc` に描き、本文のスクリプトを動かさず、本文の CSS を枠の外へ漏らさない。枠の高さは `ResizeObserver` で描いた中身に合わせる。Markdown の中の言語指定 `html` のコードブロックも、コードではなく同じ枠に描く（行のマーカーは付けない）。Markdown の中の `<!-- html -->` 〜 `<!-- /html -->` の範囲（埋め込んだ HTML）は、枠に入れず mdmark の HTML の埋め込みの機能で本文の中に描き、範囲に書いたスクリプトとイベントの属性は無害化で外す
  - item: 画面への反映の時間
    constraint: 書き換えの通知を受けてから 2 秒以内に再描画する（入力中に保留したときは、保留を解いてから 2 秒以内）
    decided_by: NFR-489-1#requirements[画面への反映の時間]
  - item: 再描画
    constraint: '`changed` を受けたら `GET /w/{workspace}/api/records`・`GET /w/{workspace}/api/comments`・`GET /w/{workspace}/api/edits`・`GET /w/{workspace}/api/threads` を再読み込みする。開いている画面・URL の search params・表の列の表示・本文のスクロールの位置・編集とコメントの入力欄の下書き・レビュー中の書き込みのチェックを保ったまま再描画し、履歴に積まない。開いていた項目が記録から消えたら詳細を閉じ、URL から `id`・`full`・`h` を外す。開いていたスレッドが無くなったら（まだ送信していない新規スレッドを送信したか削除したときを含む）スレッドの一覧を出し、URL から `thread` を外す。再読み込みが 422 なら前に読んだ記録で描き続ける。入力中は制約「入力中の再読み込みの保留」に従う。再読み込みで入力欄を再作成せず、入力中の値とカーソルの位置を書き換えない'
  - item: 接続の状態
    constraint: 書き換えの通知が切れている間は、前に読んだ記録で描き続け、トップバーに接続が切れたことを出す。再接続は `EventSource` に任せる
  - item: URL の状態
    constraint: 画面で見ているものに影響する状態（リクエストの表の全て）は URL の search params に持ち、TanStack Router の `validateSearch` と Zod で検証する。既定の値は書かない
  - item: 履歴
    constraint: 画面の移動と、詳細の中の項目の移動（本文の用語・項目の ID のリンクを含む）と、全体の検索の結果から開いた項目の種類の画面が今の画面と違うときは履歴に積む。表示形式の切り替え・詳細パネルの開閉・全画面の開閉・本文の見出しへの移動・絞り込みと並べ替え・差分の時点の再選択・左のパネルの開閉・コメントの一覧の中のスレッドとレビュー中の書き込みの画面の行き来・スレッドの絞り込み・全体の検索の開閉と検索の言葉の入力は積まずに URL を置き換える。幅 900px 以下の詳細パネルだけは開くときに積む。タグを押して絞り込みに加えるときは積む（制約「タグを押して絞り込む」）
  - item: 画面の移動と項目
    constraint: タブの帯で画面を移るときは `id`・`diff` を残し、`view`・`f.{列}`・`sort` を外す。全体の検索の結果から項目を開くときは、その項目の種類の画面（表示しない種類の項目は概要）へ移り、`id` をその項目にして、`diff` と左のパネル（`panel`・`thread`・`review`・`tstatus`・`ttag`・`ttarget`）を残し、`view`・`full`・`h`・`f.{列}`・`sort`・`search`・`q` を外す。開いた項目の種類の画面が今の画面と同じときも、同じく `view` を外して既定の表示形式で詳細パネルを開く
  - item: 保存した絞り込みの条件
    constraint: 画面ごとの絞り込みの条件（タグの組み合わせ方を含む）と変更履歴で選んだ時点を、そのタブの `sessionStorage` のキー（`mindmap-filters`）に、条件を変えるたびに書く。URL に `f.{列}` が無い画面を開くときは保存した条件を当てて URL に書き、`f.{列}` があれば URL の条件で開いて保存した条件を書き換える。保存した値が今の記録に無ければ、その値を外して描く
  - item: 端末の保存領域
    constraint: ライト / ダークと、表ごとの表示する列・ピン留め、差分のミニマップを表示する・しない、セクションの折りたたみ、レビュー中のコメントの並び、「レビューに追加」の後のフォーカスを `localStorage` の 1 つのキーに持つ。絞り込みの条件と変更履歴で選んだ時点はこのキーに持たず、このキーに残っていれば参照せずに削除する（制約「保存した絞り込みの条件」）。配る書き出しは絞り込みの条件を保存しない。保存できない環境では開いている間だけ保つ。詳細パネルの幅（区切りのドラッグかキーで変えた幅）は、そのタブの `sessionStorage` の 1 つのキーに持ち、種類で分けない。配る書き出しも同じ。保存できない環境では既定の幅で開く。サーバーの配信では全てのワークスペースを同じオリジンで配るため、`localStorage`・`sessionStorage` のキーの末尾に `:{workspace}`（『プレビューの URL』の制約「画面のパス」）を付けてワークスペースごとに分ける（配る書き出しは付けない）。詳細パネル・詳細の全画面の本文のスクロール位置は、`sessionStorage` のキー（`mindmap-body-scroll`）に項目の ID ごとに持ち、項目を開いたときにその位置へ戻す。`h` の見出しへ送信するときは戻さない。表の見せ方とセクションの見せ方・表示する種類・コメントの一覧のピン止めの上書きも同じ `localStorage` のキーに持ち、知らない項目を削除しない
  - item: 「前回開いてから」の範囲
    constraint: サーバーの配信では、タブで最初に記録を読む前に `POST /w/{workspace}/api/opened` を 1 度呼び、`previous`（日時と連番）をそのタブの範囲の始まりにする（`sessionStorage` に持ち、同じタブで再読み込みしても再呼び出ししない）。`previous` が `null` のときは `opened`（タブを開いた時点）にし、呼べなかったときはタブを開いた日時と、読んだ記録の先頭のまとまりの `until_seq` にする。始まりの連番が読んだ記録の先頭のまとまりの `until_seq` より大きいとき（ワークスペースを戻した・再作成した）も、タブを開いた時点にする。配る書き出しは `localStorage` に前回開いた日時と、書き出した記録の先頭のまとまりの `until_seq` を持ち、同じ決め方にする（連番を持たない前のバージョンの値は前回開いた時点なしとして扱う）。範囲に入るのは、`until_seq` が始まりの連番より大きいまとまりと、まだまとめていない変更。日時は比べず、`{日時} より後` の表示にだけ使う
  - item: 前のバージョンの組み立て
    constraint: 項目の `history` を新しいものから順に、選んだ時点の最初の `seq` まで当てる（キーは `before` で戻し、本文は `body_diff` で戻す）。選んだ時点の範囲の中の回が 1 つでも保持する回数を超えて消えていれば（範囲の要素が無いか、項目の `history_dropped_seq` が範囲の始まりの `seq` より大きい）、マーカーだけ付けて詳細パネルにその旨を出す。`body_diff` の `now` が今の本文に当たらなければ、本文は今の内容を描いて差分を出せない旨を出し、キーの差分は出す。`update_settings` が付け替えた `phase` は変更履歴に無いため、前のバージョンでも今の値で出す
  - item: 差分の表示と書き換え
    constraint: 差分の表示に入る・抜ける・時点を再選択するだけでは記録を再読み込みしない。画面・項目を移っても `diff` を保つ。書き換えの通知で再読み込みしたときは同じ時点の差分の表示のまま再描画し、選んだまとまりが記録から消えたか、`pending` を選んでいてまだまとめていない変更が空になったら、差分の表示をやめて URL から `diff` を外す
  - item: 編集の読み込みと書き込み
    constraint: 開いたときと書き換えの通知を受けたときに `GET /w/{workspace}/api/edits` を読み、保存待ちの編集を記録に重ねて描く（追加する項目は ID を持たないカード・行として一覧へ差し込む）。編集の表示の入力欄を離れたとき（選ぶ・チェックは選んだとき）にそのキーの編集を `POST /w/{workspace}/api/edits` へ、取り消しを `DELETE /w/{workspace}/api/edits/{id}` へ、保存を `POST /w/{workspace}/api/edits/save` へ送信する。空のタイトルは送信せずに入力の誤りを出す。保存が 409 のときは `blocked` を行ごとに書き込めない理由として出し、届かないときは保存待ちの編集を残して保存できなかった旨を出す。差分の表示中は編集の操作・バッジ・件数を出さず、保存待ちのパネルを閉じる。配る書き出しはどの API も呼ばず、編集の操作を出さない（入力欄を離れたときに `POST /w/{workspace}/api/edits`、取り消しは `DELETE /w/{workspace}/api/edits/{id}`、保存は `POST /w/{workspace}/api/edits/save`。保存の 409 は `blocked` を行ごとの書き込めない理由として出し、届かないときは保存待ちの編集を残す。差分の表示中は編集の操作・保存待ちのマーカー・件数を出さず、保存待ちのパネルを閉じる）。送信している間はそのボタンを押せなくし、二重に送信しない
  - item: コメントの読み込みと書き込み
    constraint: '開いたときに `GET /w/{workspace}/api/comments` を読み、コメントのボタンの件数・コメントの一覧・詳細の一番下のレビュー中のコメント・入力欄の下書きを描く。溜める・修正する・削除する・元に戻す・まとめて送信はそれぞれの API へ `Content-Type: application/json` で送信し、送信している間はそのボタンを押せなくする。空白だけの本文は送信せずに理由を出す。届かない・エラーのときは本文を残して理由（届いたときは `detail`、409 のまとめて送信は `stale` を行ごとに）を出す。下書きは入力が止まったときと入力欄を閉じるときに `PUT /w/{workspace}/api/drafts` へ送信する。一覧のチェックは画面だけが持ち、溜めたコメントはチェックした状態で入る（溜める・修正する・削除する・元に戻す・まとめて送信する・下書きの保存の送信先と、送信できなかったときに本文を残して理由を出す振る舞い）'
  - item: 選んだ箇所の対応づけ
    constraint: '本文は、mdmark が描いたブロックの `data-source-line`（0 始まりのブロックの開始行）を元の行のマーカー（1 始まり。フェンスのコードは中身の最初の行）に読み替え、選択の端から元の Markdown の行の範囲を求める（PoC #80 の方式。読み替えは PR #342 の PoC 結果）。HTML の本文は、親の画面が iframe の文書に `pointerup`・`selectionchange` の受け手を追加し、選択の端ごとに、文書の順で端より前にある `data-line` を持つ要素のうち最も後のものの行に、その要素の開きタグの直後から端までの文とコメントの中の改行の数を追加して元の HTML の行を求める（`<br>` は数えない。`<pre>`・`<textarea>`・`<listing>` の開きタグの直後の改行は文書から落ちるため、その要素から数えるときは原文にその改行があれば 1 を追加する）。入口の位置は iframe の中の選択の矩形に iframe の位置を追加する。値は描いた要素にキーのパスを持たせる。選んだ文は描いた文のまま送信する。箇所の値は『レビュー中のコメントの追加』の request `loc`'
  - item: レビュー中のコメントの並び
    constraint: '詳細パネル・詳細の全画面のレビュー中のコメントは、コメントの ID の番号で並べ、既定は新しい順（番号の大きい順）にする。削除した行（「元に戻す」）も同じ並びの中の元の場所に置く。行が 2 件以上のときだけ、見出し「レビュー中のコメント」の行の右に、今の並び（「新しい順」「古い順」）と矢印を出す 1 つのボタンを置き、押すたびに並びを入れ替えて個人の上書き `review_order` に残す（古い順は `oldest`、新しい順は上書きを外す）。ボタンの読み上げの名前は「コメントの並び: {今の並び}」にする。並びを変えても URL の search paramsは変えず、ボタンにフォーカスを残す。表示の設定の「この端末で変えている項目」には「コメントの並び」と出す'
  - item: スレッドの読み込みと書き込み
    constraint: "コメントの一覧を開いたときと、書き換えの通知を受けたときに `GET /w/{workspace}/api/threads` を読み、スレッドの一覧と開いているスレッドを再描画する（入力欄の下書き・開いているスレッド・一覧の絞り込みを保つ）。一覧の状態・タグの絞り込みは画面が持つ。返信は `POST /w/{workspace}/api/comments` に `thread` を渡してレビュー中に溜め、クローズとオープンへの戻しは理由を添えて `PATCH /w/{workspace}/api/threads/{id}` へ送信する。開いているスレッドの状態が知らせで変わったら、変わる前の状態で開いた理由の入力を閉じる\nトップバーの未読のマーカーのため、サーバーの配信ではコメントの一覧を閉じていても、画面を開いたときと書き換えの通知を受けたときに `GET /w/{workspace}/api/threads` を読む。スレッドの画面を出すたびに（一覧の行・レビュー中の書き込みのどちらから開いても、開いている間の再描画でも）、そのスレッドに `seen: false` の書き込みがあれば `POST /w/{workspace}/api/threads/{id}/seen` を呼ぶ。呼ぶと同時に、画面が持つスレッドのコピーのその書き込みを既読にしてトップバーのマーカーを再描画し、応答を待たずに画面を出す（応答や書き換えの通知より先に一覧へ戻っても、そのスレッドの行とトップバーに未読のマーカーを出さない）。失敗しても画面には出さず、`GET /w/{workspace}/api/threads` を再読み込みしてコピーをサーバーの値に戻す。この再読み込みの後もそのスレッドを開いたままなら同じスレッドへ再呼び出しせず、次に開いたときに再呼び出しする（開いたスレッドの利用者の既読、返信、クローズとオープンへの戻し）"
  - item: 書き込みのまとまりのリンク
    constraint: スレッドの画面の書き込み（利用者・AI の書き込みとレビュー中の書き込み）と、レビュー中を確かめる画面の行の本文の中の `[文言](#...)` のうち、`#` の後ろを `URLSearchParams` で読んだ `diff` の値が記録にあるまとまりの ID のものを、`文言` だけを出すまとまりのリンクとして描く。読むのは `diff` だけで、他の引数（`tab`・`id` ほか）は無視する。`文言` の中の項目の ID は項目を開くボタンにしない。記録に無いまとまりの ID・`since`・`pending`・空の値を指すもの、`diff` の引数を持たない `[文言](#...)` は、リンクにせず `文言` だけを出す。`#` で始まらないリンクは、詳細の本文と同じく描く。押すと、変更履歴でそのまとまりを選んだときと同じく、開いている画面・項目のまま差分の表示を切り替え、端末の保存領域と search params の `diff` を書き換え、ほかの search params は保つ（履歴に積まない）。コメントの一覧と開いているスレッド・レビュー中を確かめる画面は閉じない。見た目は詳細の本文のまとまりのリンクと同じにする
  - item: 表示の設定
    constraint: 表示する種類・差分のミニマップ・本文の表とセクションの見せ方・「レビューに追加」の後のフォーカスの個人の上書きは、選んだときに端末の保存領域に書いてその場で画面に当て、サーバーへは送信しない。開いている画面の種類を外したときは概要へ移り、URL を置き換える。ワークスペースの既定は、既定の保存の確かめで「保存する」を押したときに `PUT /w/{workspace}/api/config/display` で書く。書き換えの通知で再読み込みした記録の既定が変わったときは、上書きを持たない項目に新しい既定を当てる
  - item: 設定の画面の起点
    constraint: 設定の画面は `tab=settings` で開く。入口は表示の設定のパネルの「設定を編集する」で、押すとパネルを閉じて設定の画面へ移り、履歴に積む
  - item: 音声の入力
    constraint: '開いたときに `GET /w/{workspace}/api/transcription` を読み、コメントの入力・返信の入力・レビュー中の書き込みの修正の入力のマイクのボタンを置く。応答を待たずに入力を描き、`available` が `false` か、ブラウザが `navigator.mediaDevices.getUserMedia` を持たないときは、マイクのボタンを押せない見た目にしてフォーカスは受けたまま（`aria-disabled`）、理由（`detail`、マイクを使えないときは画面が持つ文）をツールチップと押したときの結果の行に出す。サービスが使えないために押せないマイクのボタンを押したときは `GET /w/{workspace}/api/transcription` を再読み込みし、使えるようになっていれば押せる状態に戻す（録音は利用者がもう一度押して始める）。押すと `getUserMedia({audio: true})` と `MediaRecorder` で録り、マイクと「レビューに追加」の位置を × の「キャンセル」と ✓ の「文字起こし」に切り替える。録音中は、入力欄の中身とカーソルの位置を残したまま入力欄を隠してキーボードの入力を受け付けず、同じ場所に、`AnalyserNode` で取ったマイクの音量を縦の棒で描く波形（読み上げない）を出す。録音を終えたら（キャンセル・✓・失敗）波形を削除して入力欄に戻す。キャンセルは録音を捨ててマイクを解放する。✓ は録音を止め、`POST /w/{workspace}/api/transcriptions` へ録った状態の `Content-Type` で送信し、返った文字を入力欄のカーソルの位置へ挿入する。`action`（無ければ `review`）が `review` なら挿入した全文を「レビューに追加」と同じく `POST /w/{workspace}/api/comments` へ送信してレビュー中に溜め、溜められたら入力欄を空にする（溜められなければ全文を入力欄に残して理由を結果の行に出す）。`send` なら挿入した全文を `POST /w/{workspace}/api/comments/send-now`（コメントの入力は `target`・`loc`、返信の入力は `thread`）へ送信し、送信できたら入力欄を空にする。`insert` なら送信せず、利用者が「レビューに追加」を押すとキーボードで入力した書き込みと同じくレビュー中に溜める。失敗（許可の拒否・503・502・504・413・届かない）は、入力欄の文字を残して理由を結果の行に出し、503 のときはマイクのボタンを押せなくする。録音は画面で同時に 1 つだけにし、録音・文字起こし中はほかの入力欄のマイクのボタンを押せない見た目（`aria-disabled`）にして理由をツールチップと押したときの結果の行に出す（キーボードの入力は受け付ける）。録音中に入力欄が画面から消えても（ほかの項目・スレッド・タブへ移る、パネル・全画面・入力を閉じる）録音を続け、トップバーのコメントのボタンの左隣に音声入力中の表示を出す。表示を押すと録音を始めた入力欄の画面（詳細パネル・詳細の全画面・コメントの一覧・スレッド）を開き、波形と × ・ ✓ を再表示して ✓ にフォーカスを移す。入力欄が画面に無い間に文字起こし・レビュー中への追加・送信が終わったときは、結果を入力欄の下書き（`body`）へ反映し（`insert` と失敗のときは挿入した全文。カーソルは挿入した文字の後ろ）、失敗のときはトップバーの下の帯に理由と「入力欄を開く」のボタンを出す（成功のときは何も出さない）。「入力欄を開く」は音声入力中の表示と同じく入力欄の画面を開いてフォーカスを移し、帯を閉じる。録音中に行き先の項目・スレッドが記録から無くなったら録音を捨ててマイクを解放し、トップバーの下の帯に理由を出す。録音の開始で `navigator.wakeLock.request("screen")` を求め、録音を終えたら（✓・キャンセル・失敗・捨てた）解放する。録音中に画面が見えるようになったとき（`visibilitychange`）解放されていれば再計算し、求められないときは何も出さずに録音を続ける。レビュー中の書き込みの修正の入力（レビュー中の書き込みの画面・スレッドのレビュー中の返信・詳細パネルと詳細の全画面のレビュー中のコメント）では、マイクと「修正」「キャンセル」の位置を × と ✓ に切り替え、`action` によらず返った文字を修正の入力欄のカーソルの位置へ挿入するだけにし、`POST /w/{workspace}/api/comments`・`POST /w/{workspace}/api/comments/send-now` を呼ばない（「修正」で `PATCH /w/{workspace}/api/comments/{id}` へ送信するまでレビュー中の書き込みを変えない）。挿入した後は、`focus_after_add` によらずフォーカスを修正の入力欄へ戻し、カーソルを挿入した文字の後ろに置く（修正の入力欄が画面に無い間に終わったときはフォーカスを動かさない）。修正の入力の × は録音だけを捨て、修正の入力を開いたままにする。音声入力中の表示と「入力欄を開く」は、録音を始めた画面を開いてその書き込みを修正の入力のまま出し、✓ にフォーカスを移す。修正の入力欄が画面に無い間に文字起こしが終わったときは、下書きへ反映せず、挿入した全文をページを開いている間だけ画面の中に持ち、その書き込みの修正の入力を開いたときに入力欄へ入れる（失敗のときは、元の本文のまま、帯に理由と「入力欄を開く」を出す）。録音中・文字起こし中にその書き込みをレビュー中から削除・送信したときは、録音と結果を捨ててマイクを解放し、トップバーの下の帯に理由を出す。削除した書き込みを「元に戻す」で戻しても、結果は入れない'
  - item: 入力中の再読み込みの保留
    constraint: 文字を入力する欄（文字の `input`・`textarea`・`contenteditable`）にフォーカスがある間と、音声入力の録音を始めてから文字起こしの結果が入るまでの間（制約「音声の入力」の録音・文字起こし中）は、`changed` と再接続（`open`）を受けても画面に反映する再読み込みをせず、再読み込みを保留したことだけを持つ。音声入力の間に `changed` と再接続を受けたときは、録音の行き先が記録にあるかだけを確かめるために `GET /w/{workspace}/api/records`（行き先がスレッドなら `GET /w/{workspace}/api/threads`、レビュー中の書き込みの修正なら `GET /w/{workspace}/api/comments`）を読み、画面には反映しない。行き先が無ければ制約「音声の入力」のとおり録音を捨てる。保留の間はトップバーの下に帯で「更新があります。入力欄から離れると反映します。」を出す（押せない表示）。フォーカスが入力する欄から外れ、音声入力もしていないときに、保留していた再読み込みを 1 回だけ行い、帯を削除する。入力する欄から別の入力する欄へフォーカスを移したときは再読み込みしない。帯を出す・削除するときは、帯の高さの分だけ本文のスクロールの位置をずらし、入力欄の画面の上の位置を変えない。保留の間も、接続の状態と重なった ID（`duplicate_ids`）は受けて出す。自分の書き込み（編集・コメントの追加・下書き）の応答で再描画するものは保留しない
  - item: 本文のファイルのパス
    constraint: Markdown の本文とスレッドの書き込みを mdmark で描いた直後に、描いた `img`・`video`・`audio`・`source` の `src` と `video` の `poster` の相対パスを、資料のフォルダを表す `/w/{workspace}/docs/` を基準に解決した配信のパスに置き換える（`../files/clip.mp4` は `/w/{workspace}/files/clip.mp4`。ファイルは『ワークスペースのファイルの配信』が返す）。絶対 URL・`data:`・`/` で始まるパスと、埋め込んだ HTML の範囲の中は置き換えない（コードブロックとインラインコードの中は要素にならないため触れない）。HTML の本文と配る書き出しは置き換えない。動画・音声の再生バーとキャプションは mdmark の部品『動画と音声』が描き、読み込めないときも本文のほかの部分は描く。React の画面は `/w/{workspace}/` で開くが、解決の基準は同じ `/w/{workspace}/docs/` にし、`/w/{workspace}/files/{名前}` を指す
  - item: 「レビューに追加」の後のフォーカス
    constraint: 'コメントの入力（詳細パネル・詳細の全画面・コメントの一覧の新規スレッド）と返信の入力で、「レビューに追加」・入力欄の Ctrl+Enter（macOS は Cmd+Enter）・音声入力の確定（`review`・`send`）で溜めた・送信できた後のフォーカスを、個人の上書き `focus_after_add` で決める。`input` は入力欄へ戻してカーソルを末尾に置き、`none` はその入力の「レビューに追加」のボタン（音声入力の確定の後は ✓ の位置に戻した「レビューに追加」のボタン）に置く。上書きが無いとき（自動）は、`matchMedia("(pointer: coarse)")` に当たる端末では `none`、それ以外は `input` と同じにする。空白だけで溜めなかったとき・溜められなかった・送信できなかったときと、音声入力の `insert` の後は、設定によらず入力欄へ戻す。入力欄が画面に無い間に終わった音声入力はフォーカスを動かさない。表示の設定のパネルの区画「詳細に表示するもの」の下に区画「コメントの入力」を置き、ラジオのグループ「レビューに追加した後のフォーカス」（「自動」「入力欄へ戻す」「戻さない」）を並べる。自動の下に今の端末での振る舞い（「この端末では入力欄へ戻します」「この端末では戻しません」）を出し、区画の下の説明をグループの `aria-describedby` で指す。選んだらその場で端末の保存領域に書き（自動は上書きを外す）、サーバーへは送信しない。「この端末で変えている項目」には「レビューに追加した後のフォーカス」と出し、「既定に戻す」で外し、「ワークスペースの既定にする」の対象には含めない。配る書き出しはコメント・返信の入力を持たないため、この区画を出さない'
  - item: HTML の本文の中のリンク
    constraint: 親の画面が枠の文書に `click`・`auxclick` の受け手を追加し、押された要素から最も近い `href` を持つ `a`（SVG の `a` を含む）・`area` の押下を受けて、既定の動作を止める（枠の中では移らない。`target` の有無、Ctrl・Shift・Meta つき、中ボタン、Enter によらない）。`href` の属性の値が `#` で始まるリンクは、`#` の後ろを `decodeURIComponent` で戻した `id` を持つ枠の中の要素まで本文のスクロール領域をスクロールし、その要素が無ければ何もしない（URL の search paramsは変えず、履歴に積まない）。それ以外は、`href` の属性の値がそれだけで絶対の URL として読め、スキームが `http:`・`https:`・`mailto:` のリンクだけを、親の画面の `window.open` に `_blank` と `noopener,noreferrer` を渡して開く。相対の URL とほかのスキーム（`javascript:`・`data:`・`file:` ほか）のリンクは開かない。ポインターを押してから離すまでの間に枠の中の選択が変わり、`click` の時点で選択が空でないときは、開かず送信しない（リンクの文をなぞって選んだ直後）。キーボードからの `click`（`detail` が 0）は選択の有無によらず扱う。枠に描く全ての場所（HTML の本文・`html` のコードブロック・HTML の本文の差分の描いた結果・配る書き出し）で同じ
  - item: 本文の表とセクションの見せ方
    constraint: 表は mdmark の表の機能（`features.table`）で描き、列の幅と折り返し・表の中の横スクロール・ピン止め（複数の列を含む）・並べ替えを mdmark に任せる。本文の区画を縦にスクロールしたときに表の見出し行を区画の上端に留めることはしない（外部ライブラリ『mdmark』の制限「表の見出し行の固定」。mdmark の `mount` で描いた表は見出し行を留めず、スクロールする区画の中で留める位置もブラウザで変わる。mdmark の対応は shuhei1101/mdmark#683）。画面の CSS は、mdmark の使い方『テーマを上書きする』の CSS 変数のほかに、mdmark が描いた表・差分・図・囲みの見た目と動きを上書きする規則を持たない。`.mdmark` の `--mdmark-color-bg` を透明にする箇所と `:root` には、`--mdmark-color-bg-opaque` を周りの面の色で指定する。セクションの折りたたみがオンのとき、本文で使っている上位 2 つの階層の見出しの頭に開閉の矢印（24px）のボタンを置き、開いた状態で描く。畳んだ中身は `hidden="until-found"` にし、ページ内の検索・リンク・search params の `h` で飛んだときは開く。見出しの文言は選んでコメントできるまま残す。コードブロックの言語の札とコピーのボタンは `pre` の外に置き、選んだ箇所の行のマーカーをずらさない。Alert の囲みの見出しは「補足」「ヒント」「重要」「警告」「注意」。配る書き出しにも同じスタイルが当たる
  - item: 埋め込んだ HTML と部品
    constraint: '範囲の中の図・チャート（`<mdmark-chart>`）と操作できる部品（`<mdmark-param>` ほか）は mdmark の部品で描く。チャートは拡大・縮小のボタンとドラッグで倍率と表示の位置を変え、図の拡大の画面は開かない。チャート以外の要素には拡大・縮小のボタンを付けない。今の値をコピーするボタンは、文言を「今の値をコピー」にし、部品の今の値を `{"{キー}": {"name": ..., "value": ...}}` の JSON にしてクリップボードへ書き込む。範囲の中の文にも、範囲の外の本文と同じく用語・資料・調査のマーカーとツールチップ、項目の ID のリンク（押すとその項目へ移り履歴に積む）を付ける。用語・エイリアスの一致は mdmark の一致の機能に任せ、全角半角・英字の大文字小文字・前後の空白の違いを揃えて比べる'
  - item: HTML の本文の差分
    constraint: 前のバージョンの本文と今の本文の原文を行ごとに比べ、今の本文で追加した行と、削除した行と入れ替えた行（変えた行）を求める（空行だけを追加した行は入れない）。描いた結果では、その行を含む最も内側の `data-line` を持つ要素に「追加した」か「変わった」のマーカーを付ける。行を含む要素は `data-line` ≦ 行 ≦ `data-line-end` の要素で、最も内側はそのうち文書の順で最後のもの（コメントの一覧から開いたときに示す要素も同じ）。削除しただけの箇所は描いた結果に出せないため、原文の差分で見られる旨を添える。前のバージョンの本文が Markdown（形式を替えた）のときは、原文の差分だけを出す
  - item: 埋め込んだ HTML の差分
    constraint: Markdown の本文の埋め込んだ HTML の範囲は、範囲ごとに前のバージョンと今の範囲の原文を行ごとに比べる。既定は原文の差分（削除した行・追加した行と変えた文字の色分け）で出し、「描いた結果（変更前）」では選んだ時点の範囲を描いた結果、「描いた結果（変更後）」では今の範囲を描いた上で、範囲の直下の要素ごとに、追加した要素と変えた要素にマーカーを付ける。見せ方の切り替えは履歴に積まず、search params を変えない。範囲の外の Markdown は本文の差分のまま出す。本文が HTML の資料の差分（「HTML の本文の差分」の制約）は変えない
  - item: 資料のエクスポート
    constraint: 入口は、本文が Markdown の資料の詳細パネル・詳細の全画面にだけ置き、配る書き出しにも置く。「HTML でエクスポート」は、描画のライブラリの配信元から採用バージョンの mdmark の CSS と JavaScript を `integrity` で確かめて読み（配る書き出しは中に持つ CSS と JavaScript を使う）、記録の用語・資料・調査の索引と資料の本文と合わせて 1 枚の HTML を組み立てる。ほかの項目へのリンクは移らなくてよい。「Markdown でエクスポート」は、警告の「エクスポート」を押してから、本文の Markdown から埋め込んだ HTML の範囲を除いた Markdown を組み立てる。どちらも `Blob` を `download` を持つ `a` 要素でダウンロードさせ、サーバーの API を呼ばず、記録・URL の search params・履歴を変えない。メニューの開閉と警告への切り替えも履歴に積まない。mdmark を読めないときはダウンロードせず、メニューの中に理由を出し、「再試行」で再読み込みする
  - item: 本文のリンクの href
    constraint: '本文の見出しの # のリンクと、用語・資料・調査のマーカーと項目の ID のリンクの `href` は、今の search params の `id`・`h` を置き換えた URL（サーバーの配信は `/w/{workspace}/?{search}`、配る書き出しは `#/?{search}`）にする。押したときは既定の動作を止めて画面の中で移り、履歴に積む。リンクをコピーして開いた・新しいタブで開いたときも、同じ画面・項目・見出しで開く'
  - item: 配る書き出しで開く
    constraint: 配る書き出し（『配る書き出し』の HTML を `file://` で開いたとき）は、記録を `mindmap-data` の要素の JSON から読み（レビュー中のコメント・保存待ちの編集・スレッドは空として扱う）、書き換えの通知に接続しない。search params はハッシュの `#/?{search}` に持つ。描画のライブラリは HTML が中に持つ配布ファイルから読み、mdmark は `mindmap-mdmark` の中身を Blob の URL で `import()` した後に、部品（`map`・`view`・`comments`）の読み込みを `mindmap-mdmark-{部品}` の中身へ差し替える。項目の追加・編集・削除、回答・コメントの送信、設定の保存、「ワークスペースの既定にする」の操作は出さない。外部への要求をしない
  - item: 本文のまとまりのリンク
    constraint: 詳細パネル・詳細の全画面の Markdown の本文（差分の表示の間に描く本文を含む）で、`href` の属性の値が `#` で始まり、`#` の後ろを `URLSearchParams` で読んだ結果が `diff` の引数を持つリンク（`[文言](#diff=V-2)`）を、まとまりのリンクとする。読むのは `diff` だけで、他の引数（`tab`・`id` ほか）は無視する。押すと既定の動作を止め、`diff` の値が記録にあるまとまりの ID のときだけ、変更履歴でそのまとまりを選んだときと同じく、開いている画面・項目・全画面のまま差分の表示を切り替え、端末の保存領域と search params の `diff` を書き換える（履歴に積まない）。記録に無いまとまりの ID・`since`・`pending`・空の値のときは何もしない（差分の表示も search params も変えず、見出しのリンクとしても扱わない）。`diff` の引数を持たない `#` のリンクは、見出しのリンク（`h`）として扱う。サーバーの配信と配る書き出しで同じ。HTML の本文の枠の中のリンクは対象外（制約『HTML の本文の中のリンク』）
  - item: タグを押して絞り込む
    constraint: 表・ボード・カード・詳細パネルのタグを押すと、詳細を開かずに、そのタグを開いている画面の `f.tags` に加え、履歴に 1 つ積む。詳細パネルから押したときも、後ろの画面の `f.tags` に加えて同じく履歴に 1 つ積む。後ろの画面が概要（絞り込みを持たない）ときは、その項目の種類の画面へ移り、その画面の `f.tags` にタグを加えて開き、履歴に 1 つ積む。既に `f.tags` にあるタグを押したときは条件も履歴も変えない。タグの組み合わせ方は変えない
  - item: スクロール位置の復元
    constraint: TanStack Router の `scrollRestoration` を有効にし、ページ全体のスクロール位置を履歴の項目ごとに戻す。一覧（表・ボード・カード）のスクロール領域は、画面と表示形式を含むキーでそのタブの `sessionStorage`（`mindmap-list-scroll`）に位置を持ち、画面（タブ）の切り替えと戻る・進むで戻ったときに、描画の後に離れたときの位置へ戻す。記録の再読み込みの再描画では位置を変えない

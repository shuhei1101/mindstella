id: IF-489-70
title: プレビューを開く
entry:
  kind: screen
  value: サーバーの配信の `/w/{workspace}/`（画面は『プレビューの配信』が返し、ソースは `frontend/`）
  api: '`GET /w/{workspace}/api/records`（記録）・`GET /w/{workspace}/api/events`（書き換えの通知）・`GET /w/{workspace}/api/comments`（レビュー中の書き込みと下書き、項目ごとのコメントのマーカー）・`GET /w/{workspace}/api/edits`（保存待ちの編集の件数と、項目ごとの保存待ちのマーカー）・`GET /w/{workspace}/api/threads`（スレッドと利用者の未読）・`POST /w/{workspace}/api/opened`（前回開いた日時）・`POST /w/{workspace}/api/edits`・`DELETE /w/{workspace}/api/edits/{id}`・`POST /w/{workspace}/api/edits/save`（保存待ちの編集を溜める・取り消す・まとめて保存する）・`POST /w/{workspace}/api/comments`・`PATCH`/`DELETE /w/{workspace}/api/comments/{id}`（レビュー中の書き込みを溜める・書き換える・削除する）・`PUT /w/{workspace}/api/drafts`（下書き）・`POST /w/{workspace}/api/comments/send`（まとめて送信する）・`PATCH /w/{workspace}/api/threads/{id}`（クローズとオープンへの戻し）・`POST /w/{workspace}/api/threads/{id}/seen`（利用者の既読）・`PUT /w/{workspace}/api/config/display`（ワークスペースの既定の書き換え）・`GET /w/{workspace}/api/transcription`（文字起こしの可否と設定）・`POST /w/{workspace}/api/transcriptions`（音声の文字起こし）・`POST /w/{workspace}/api/comments/send-now`（入力欄の全文 1 件をすぐ送信する）'
flows:
  - name: 正常系
    summary: '`/w/{workspace}/` を開くと、記録を読んでトップバーと概要を描く'
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/` を実際のブラウザで開く）
      - name: make_workspace
        description: 検討事項 D-1・D-2 とタスク T-1、利用者の未読の書き込みを持つオープンのスレッド 1 件と、レビュー中のコメント 2 件を持つワークスペース
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: /w/{workspace}/ を開く\n  IF-->>SV: GET /w/{workspace}/api/records\n  SV-->>IF: 記録\n  IF-->>SV: GET /w/{workspace}/api/events につなぐ\n  IF-->>ユーザー: トップバーと概要\n```"
    expected:
      - トップバーに話し合いの題名があり、タブの帯で概要が選ばれている
      - 概要のタイルが記録の値で描かれている
      - トップバーのコメントのボタンに件数 2 と未読の点がある
      - URL が `/w/{workspace}/`（search params が付かない）
      - ブラウザのコンソールにエラーが出ていない
    test: test_normal
  - name: 正常系（書き換えの通知）
    summary: ツールで記録を書き換えると、再度開かずに概要を再描画する
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/` を実際のブラウザで開く）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
        notes: 開いた後に MCP の `add` で検討事項を 1 件追加する
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: /w/{workspace}/ を開く\n  SV-->>IF: changed の知らせ\n  IF-->>SV: GET /w/{workspace}/api/records\n  SV-->>IF: 記録\n  IF-->>ユーザー: 再描画した概要\n```"
    expected:
      - 追加してから 2 秒以内に、タブの帯の検討事項の件数が 1 増える
      - URL とスクロールの位置が変わらない
    test: test_normal_when_records_changed
  - name: 正常系（search params が正しくない）
    summary: '`tab` が決めた値でなければ概要を開き、URL から外す'
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/` を実際のブラウザで開く）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=unknown` で開く'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n\n  ユーザー->>IF: /w/{workspace}/?tab=unknown を開く\n  IF-->>ユーザー: 概要\n```"
    expected:
      - タブの帯で概要が選ばれている
      - URL の search params に `tab` が無い
    test: test_normal_when_search_invalid
  - name: 正常系（一覧の画面を開く）
    summary: '`tab` と `view` が指す一覧の画面と表示形式を開く'
    setup:
      - &id001
        name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/` を実際のブラウザで開く）
      - name: make_workspace
        description: 検討事項 D-1（決定済み）・D-2（要見直し）と、タスク T-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&view=table` で開き、続けてタブの帯でタスクへ移る'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: /w/{workspace}/?tab=decisions&view=table を開く\n  IF-->>SV: GET /w/{workspace}/api/records\n  SV-->>IF: 記録\n  IF-->>ユーザー: 検討事項の表\n  ユーザー->>IF: タブの帯でタスクを押す\n  IF-->>ユーザー: タスクのボード\n```"
    expected:
      - タブの帯で検討事項が選ばれ、表示形式の切り替えで表が選ばれている
      - 表に D-1・D-2 の行がある
      - タスクへ移った後、タスクのボードに T-1 があり、URL の search params が `tab=tasks` だけ
      - ブラウザで戻ると検討事項の表に戻る
      - ブラウザのコンソールにエラーが出ていない
    test: test_normal_when_list_screen
  - name: 正常系（項目を指す）
    summary: '`id` が指す項目の詳細パネルを開き、`full` で全画面に切り替える'
    setup:
      - *id001
      - name: make_workspace
        description: 本文に見出し「決め方」を持つ検討事項 D-1 と、タスク T-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&id=D-1&h=決め方` で開き、全画面のボタンを押す'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: /w/{workspace}/?tab=decisions&id=D-1&h=決め方 を開く\n  IF-->>SV: GET /w/{workspace}/api/records\n  SV-->>IF: 記録\n  IF-->>ユーザー: 検討事項のボードと D-1 の詳細パネル\n  ユーザー->>IF: 全画面のボタンを押す\n  IF-->>ユーザー: D-1 の詳細の全画面\n```"
    expected:
      - 詳細パネルに D-1 のタイトルと、mdmark で描いた本文がある
      - 本文の見出し「決め方」が詳細パネルの本文の区画に入っている
      - 全画面のボタンを押した後、URL に `full=1` があり、履歴の数が変わらない
      - 詳細の本文の T-1 へのリンクを押すと、詳細が T-1 に移り、ブラウザで戻ると D-1 に戻る
    test: test_normal_when_item
  - name: 正常系（search params の値が記録・画面に合わない）
    summary: 画面が持たない表示形式・記録に無い項目・本文に無い見出しを外して開く
    setup:
      - *id001
      - name: make_workspace
        description: タスク T-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=tasks&view=map&id=T-99&h=無い見出し&sort=unknown` で開く'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n\n  ユーザー->>IF: /w/{workspace}/?tab=tasks&view=map&id=T-99&h=無い見出し&sort=unknown を開く\n  IF-->>ユーザー: タスクのボード\n```"
    expected:
      - タスクがボードで開き、詳細パネルが開いていない
      - URL の search params が `tab=tasks` だけ
    test: test_normal_when_search_mismatched
  - name: 正常系（絞り込みの条件がある）
    summary: '`f.{列}` と `sort` で絞って並べた表を、条件のチップ付きで開く'
    setup:
      - *id001
      - name: make_workspace
        description: 検討事項 D-1（決定済み）・D-2（要見直し）・D-3（要見直し）を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&view=table&f.status=要見直し&sort=-id` で開き、チップを外して再読み込みする'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: f.status=要見直し&sort=-id を付けて開く\n  IF-->>ユーザー: D-3・D-2 の順の表と条件のチップ\n  ユーザー->>IF: チップを外す\n  IF-->>ユーザー: 全ての行の表\n  ユーザー->>IF: 再読み込みする\n  IF-->>ユーザー: 全ての行の表\n```"
    expected:
      - 開いたとき、表の行が D-3・D-2 の順で、D-1 の行が無く、表の上に状態「要見直し」のチップがある
      - チップを外した後、URL に `f.status` が無く、履歴の数が変わらない
      - 再読み込みした後も、表に D-1・D-2・D-3 の行がある（外した条件を端末に残している）
    test: test_normal_when_filter
  - name: 正常系（時点を指す）
    summary: '`diff` が指すまとまりの差分の表示で開き、時点を再選択すると履歴に積まずに `diff` を置き換える'
    setup:
      - *id001
      - name: make_workspace
        description: まとまり V-1（D-1 を追加した）と V-2（D-1 の本文を変え、D-2 を追加し、D-3 を削除した）を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&view=table&id=D-1&diff=V-2` で開き、トップバーの変更履歴で V-1 を選ぶ'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: diff=V-2 を付けて開く\n  IF-->>SV: POST /w/{workspace}/api/opened\n  IF-->>SV: GET /w/{workspace}/api/records\n  IF-->>ユーザー: 差分のマーカーと削除した項目の帯の付いた表と、本文の差分の詳細\n  ユーザー->>IF: 変更履歴で V-1 を選ぶ\n  IF-->>ユーザー: V-1 からの差分の表示\n```"
    expected:
      - 表の D-1 の行に変更のマーカー、D-2 の行に新規のマーカーがあり、表の上の削除した項目の帯に D-3 がある
      - 詳細パネルの本文に、追加した行と削除した行の差分の色分けがある
      - V-1 を選んだ後、URL の `diff` が `V-1` になり、履歴の数が変わらない
      - 再読み込みすると、`diff=V-1` の差分の表示で開く
    test: test_normal_when_diff
  - name: 正常系（記録に無い時点を指す）
    summary: 記録に無いまとまりを指す `diff` では差分を出さずに開き、`diff` を外す
    setup:
      - *id001
      - name: make_workspace
        description: まとまり V-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&diff=V-99` で開く'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n\n  ユーザー->>IF: /w/{workspace}/?tab=decisions&diff=V-99 を開く\n  IF-->>ユーザー: 差分のマーカーの無い検討事項\n```"
    expected:
      - 差分のマーカーと削除した項目の帯が無い
      - URL の search params に `diff` が無い
    test: test_normal_when_diff_missing
  - name: 正常系（前回開いてから）
    summary: 「前回開いてから」を選ぶと、`POST /w/{workspace}/api/opened` が返した前回の時点より後の変更にマーカーを付ける
    setup:
      - *id001
      - name: make_workspace
        description: まとまり V-1 を持ち、前回開いた日時の連番が V-1 の `until_seq` のワークスペース
        notes: 開いた後に MCP の `add` で D-2 を追加し、`commit` でまとまり V-2 にしてから、変更履歴で「前回開いてから」を選ぶ
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: /w/{workspace}/?tab=decisions を開く\n  IF-->>SV: POST /w/{workspace}/api/opened\n  SV-->>IF: previous\n  SV-->>IF: changed の知らせ\n  IF-->>SV: GET /w/{workspace}/api/records\n  ユーザー->>IF: 変更履歴で「前回開いてから」を選ぶ\n  IF-->>ユーザー: D-2 に新規のマーカー\n```"
    expected:
      - D-2 に新規のマーカーがあり、D-1 にマーカーが無い
      - URL の `diff` が `since`
      - 同じタブで再読み込みしても `POST /w/{workspace}/api/opened` が呼ばれない
    test: test_normal_when_since
  - name: 正常系（書き換えで項目と表示を保つ）
    summary: 詳細と絞り込みを開いたまま書き換えると、URL と詳細を保って再描画し、開いていた項目が消えたら詳細を閉じる
    setup:
      - *id001
      - name: make_workspace
        description: 検討事項 D-1・D-2 を持つワークスペース
        notes: '`/w/{workspace}/?tab=decisions&view=table&id=D-1&f.status=未決定` で開き、MCP の `update` で D-1 のタイトルを変え、続けて `remove` で D-1 を削除する'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: 詳細と絞り込みを付けて開く\n  SV-->>IF: changed の知らせ\n  IF-->>SV: GET /w/{workspace}/api/records\n  IF-->>ユーザー: 新しいタイトルの詳細\n  SV-->>IF: changed の知らせ\n  IF-->>SV: GET /w/{workspace}/api/records\n  IF-->>ユーザー: 詳細を閉じた表\n```"
    expected:
      - タイトルを変えた後 2 秒以内に、詳細パネルと表の D-1 が新しいタイトルになり、URL が変わらない
      - D-1 を削除した後、詳細パネルが閉じ、URL に `id` が無く、`f.status` が残っている
    test: test_normal_when_records_changed_with_item
  - name: 正常系（全体の検索で項目を開く）
    summary: '`Ctrl+K` で全体の検索を開き、検索の言葉にヒットした項目を選んで、その項目のタブと詳細パネルを開く'
    setup:
      - *id001
      - name: make_workspace
        description: タイトル「画面の分け方」の検討事項 D-1 と、タスク T-1 と、D-1 を追加したまとまり V-1 を持つワークスペース
        notes: '`/w/{workspace}/?tab=tasks&diff=V-1` で開き、`Ctrl+K` を押して「画面」と入力し、結果の D-1 を押す'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n\n  ユーザー->>IF: Ctrl+K を押す\n  IF-->>ユーザー: 全体の検索\n  ユーザー->>IF: 「画面」と入力する\n  IF-->>ユーザー: D-1 を含む検索の結果\n  ユーザー->>IF: D-1 を押す\n  IF-->>ユーザー: 検討事項と D-1 の詳細パネル\n```"
    expected:
      - '`Ctrl+K` を押した後、URL に `search=1` があり、履歴の数が変わらず、検索の言葉にフォーカスがある'
      - 「画面」と入力した後、URL に `q=画面` があり、履歴の数が変わらず、検索の結果に D-1 がある
      - D-1 を押した後、全体の検索が閉じ、URL の search params が `tab=decisions&id=D-1&diff=V-1` で（`search`・`q` が無く、`diff` が残る）、履歴が 1 つ増える
      - ブラウザで戻ると、タスクの画面に戻る
    test: test_normal_when_search
  - name: 正常系（編集を溜めて保存する）
    summary: 詳細パネルで回答を書いて保存待ちに溜め、保存待ちのパネルからまとめて保存する
    setup:
      - &id002
        name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL のオリジンの `/w/{workspace}/` を実際のブラウザで開く）
      - name: make_workspace
        description: 未決定の検討事項 D-1 を持ち、`edits.yaml` を持たないワークスペース
        notes: '`/w/{workspace}/?tab=decisions&id=D-1` で開く'
    flow: "```mermaid\nsequenceDiagram\n  actor ユーザー\n  participant IF as React のプレビュー\n  participant SV as サーバーの配信\n\n  ユーザー->>IF: 「編集する」を押し、回答を書いて入力欄を離れる\n  IF->>SV: POST /w/{workspace}/api/edits {op: set, target: D-1, key: answer, value}\n  SV-->>IF: 201\n  IF-->>ユーザー: 回答とカードに保存待ちのマーカー、トップバーに件数 1\n  ユーザー->>IF: トップバーの保存待ちのボタンを押し、まとめて保存する\n  IF->>SV: POST /w/{workspace}/api/edits/save\n  SV-->>IF: 200\n  IF-->>ユーザー: 保存した旨と、D-1 の新しい回答\n```"
    expected:
      - 溜めた後、D-1 の回答のキーとボードの D-1 のカードに保存待ちのマーカーがあり、トップバーの件数が 1
      - 保存待ちのパネルを開いた後、URL に `panel=pending` があり、履歴の数が変わらない
      - 保存した後、`decisions.yaml` の D-1 の `answer` が書いた値で、`history.yaml` の D-1 の `updated_by` が `user`、マーカーと件数が再度開かずに消え、URL から `panel` が外れる
      - 「編集する」・入力欄・トップバーの件数・取り消す・まとめて保存するに Tab キーで届く
    test: test_normal_when_edits_saved
  - name: 正常系（一覧の画面から項目を追加して削除する）
    summary: 一覧の画面の追加の入力で追加する項目を溜め、詳細で削除する項目を溜め、保存待ちのパネルで 1 件ずつ取り消す
    setup:
      - *id002
      - name: make_workspace
        description: タスク T-1 と、どの項目からも指されていないメモ N-1 を持ち、`edits.yaml` を持たないワークスペース
        notes: '`/w/{workspace}/?tab=tasks` で開き、追加の入力でタスク「画面を作る」を追加し、続けて `/w/{workspace}/?tab=notes&id=N-1` で N-1 の削除を溜め、保存待ちのパネルで N-1 の削除を取り消す'

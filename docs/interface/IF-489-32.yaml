id: IF-489-32
title: 再開の状況
entry:
  kind: endpoint
  value: POST `/_admin/sessions/{session}/resume`
lead: MindStella のセッションの SessionStart のフックが呼び、起動と再開の注入に入れる状況（取り込み待ちのスレッドの件数・前回参照した後に変わった項目・要見直しの検討事項・進行中の作業）と、注入した後に前回参照した時点を進める連番を返す。
idempotent: true
side_effects: 書き換えない。前回参照した時点は、フックが注入文を書き終えた後に『前回参照した時点の更新』で進める
request:
  - name: session
    type: str
    required: true
    location: path
    description: MindStella のセッションの ID（フックが `MINDSTELLA_SESSION` から入れる）
  - name: source
    type: Literal['startup', 'resume', 'clear', 'compact']
    required: true
    location: body
    description: SessionStart の `source`。`startup` を起動、それ以外を再開として返す
  - name: Host
    type: str
    required: true
    location: header
    description: 要求のホスト
response:
  - name: trigger
    type: Literal['startup', 'resume']
    description: 起動の契機。`source` が `startup` なら `startup`、それ以外は `resume`
  - name: awaiting_threads
    type: int
    description: 取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド）の件数
  - name: changed[]
    type: list[{id, kind, title, updated_by}]
    description: 前回参照した後（`read_seq` より後）に追加した・変えた項目の ID と要約。前の値は返さない（『前回読んだ時点からの変更』で取得する）。前回参照した時点が無いときは空
  - name: removed[]
    type: list[{id, kind, title}]
    description: 前回参照した後に削除した項目
  - name: needs_review[]
    type: list[{id, title}]
    description: 状態が `要見直し` の検討事項
  - name: in_progress[]
    type: list[{id, title}]
    description: 状態が `進行中` のタスク
  - name: flow
    type: '{source, doc} | None'
    description: ワークスペースの設定の進め方の文書。無ければ `null`
  - name: migration
    type: '{not_carried, provisional} | None'
    description: この MindStella のセッションを作る前に『記録の形式の移行』が移し替え、まだ知らせていない報告。無ければ `null`
  - name: until_seq
    type: int
    description: 状況をまとめたときの `changes.yaml` の `last_seq`。フックが『前回参照した時点の更新』へ渡す
  - name: context
    type: str
    description: SessionStart の注入文。プラグインのプロンプトファイルを `trigger` とこの応答の値で描いた文で、起動の契機・取り込み待ちの件数・変わった項目と削除した項目・要見直し・進行中・超えた件数・移し替えの報告・進め方の文書の場所と、`mindstella/startup` を参照して先に進める案内を持つ。`changed_more`・`removed_more` が 1 以上なら `changes_since_read` を呼んで残りと前の値を取る案内を持つ。次の候補・スキルの呼び方を持たない
status_codes:
  - code: '200'
    condition: 状況をまとめた
  - code: '403'
    condition: '`Host` が受ける値でない'
  - code: '404'
    condition: '`session` が状態に無い'
    notes: 何も読まない
  - code: '500'
    condition: 注入文を描けない（プロンプトファイルが読めない・変数が足りない）
    notes: 何も書かない。フックは状況を持たない注入に切り替える
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 受ける Host
    constraint: 『MindStella のセッションの出来事の受け取り』と同じ（D-304・D-340）
  - item: 前回参照した時点
    constraint: 状態のフォルダの `workspaces/{ワークスペースの ID}/read_point.json` の `read_seq` を読み、『前回読んだ時点からの変更』（`changes_since_read`）と同じ値を使う（D-326・D-342）。書き換えない。状況をまとめたときの `changes.yaml` の `last_seq` を `until_seq` で返し、フックは注入文を標準出力に書き終えた後に『前回参照した時点の更新』へ渡す。注入に失敗したときは時点が進まない
  - item: 次の候補
    constraint: 返さない（#518）。未決定の検討事項を候補として並べない
  - item: 件数の上限
    constraint: '`changed`・`removed`・`needs_review`・`in_progress` はそれぞれ 20 件まで。超えた分は件数だけを `{キー}_more` に入れる。注入に収まらない分は MindStella のセッションが `changes_since_read` で取得する（D-342）'
  - item: 移し替えの報告
    constraint: '`migration` は『前回参照した時点の更新』が削除するまで、呼ばれるたびに返す'
  - item: 注入文
    constraint: 'プロンプトファイルは規約『プロンプトファイル』の `kind: hook` の YAML にし、常駐サーバーが Jinja2（未定義の変数は誤り）で描く。置き場所はモジュール構成で決める'
flows:
  - name: 正常系
    summary: 再開のとき、前回参照した後の変更と要見直し・進行中・取り込み待ちを返し、前回参照した時点は進めない
    setup:
      - name: Mock
        description: なし（HTTP のクライアントで送信する）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: make_workspace
        description: 前回参照した時点を記録した後に D-1 のタイトルを書き換え、要見直しの D-1・進行中の T-1・未決定の D-2・取り込み待ちのスレッド 1 件を持つワークスペースと MindStella のセッション
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/resume
        participant WS as ワークスペース
        participant ST as 状態のフォルダ

        クライアント->>API: source: compact
        API-->>ST: read_point.json を読む
        API-->>WS: 記録と changes.yaml を読む
        API-->>クライアント: 200 状況・until_seq
      ```
    expected:
      - '`trigger` が `resume`、`awaiting_threads` が 1'
      - '`changed` が D-1 の 1 件で、`needs_review` が D-1、`in_progress` が T-1'
      - 応答が次の候補を持たず、未決定の D-2 を並べない
      - '`until_seq` が `changes.yaml` の `last_seq` と同じで、`read_point.json` の `read_seq` が呼ぶ前と同じ。続けて呼ぶと同じ `changed` を返す'
      - '`context` が契機 `再開`・取り込み待ちの件数 1・D-1・T-1・`mindstella/startup` を持ち、`/mindstella:` を持たない'
    test: test_normal
  - name: 正常系（起動）
    summary: 前回参照した時点が無いときは変更を返さず、今の連番を until_seq で返す
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: make_workspace
        description: 作成したばかりのワークスペースと MindStella のセッション（`read_point.json` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/resume
        participant ST as 状態のフォルダ

        クライアント->>API: source: startup
        API-->>ST: read_point.json が無い
        API-->>クライアント: 200 状況（どれも 0 件）・until_seq
      ```
    expected:
      - '`trigger` が `startup` で、`changed`・`removed` が空'
      - '`until_seq` が今の `last_seq` で、`read_point.json` が作られていない'
    test: test_normal_when_startup
  - name: 異常系（知らない MindStella のセッション・404）
    summary: 状態に無い session には 404 を返し、何も書かない
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/resume

        クライアント->>API: 状態に無い session
        API-->>クライアント: 404
      ```
    expected:
      - 応答が 404 で、状態のフォルダが変わっていない
    test: test_error_when_unknown_session

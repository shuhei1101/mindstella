id: IF-489-22
title: "レビュー中のコメントの書き換え"
entry:
  kind: endpoint
  value: PATCH /w/{workspace}/api/comments/{id}
flows:
  - name: 正常系
    summary: 本文を書き換え、並びとほかのキーは変えない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送信する）
      - name: make_workspace
        description: 検討事項 D-1 と、レビュー中のコメント C-1（D-1・「案 A にする」）・C-2 を持つワークスペース
        notes: '`PATCH /w/{workspace}/api/comments/C-1` に `{body: 案 A に決める}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as PATCH /w/{workspace}/api/comments/{id}
        participant WS as ワークスペース

        クライアント->>IF: PATCH /w/{workspace}/api/comments/C-1 {body}
        IF->>WS: comments.yaml の C-1 を書き換える
        IF-->>クライアント: 200
      ```
    expected:
      - ステータスが 200 で、`body` が `案 A に決める`
      - '`comments.yaml` の C-1 の `body` だけが変わり、並びが C-1・C-2 のまま'
    test: test_normal
  - name: 正常系（箇所を外す）
    summary: 箇所が合わなくなったコメントから箇所を外し、向けた項目は残す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送信する）
      - name: make_workspace
        description: 資料 A-1 と、A-1 の本文の 5 行目を指すレビュー中のコメント C-1 を持つワークスペース
        notes: '`{loc: null}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as PATCH /w/{workspace}/api/comments/{id}
        participant WS as ワークスペース

        クライアント->>IF: PATCH /w/{workspace}/api/comments/C-1 {loc: null}
        IF->>WS: C-1 の loc を削除する
        IF-->>クライアント: 200
      ```
    expected:
      - ステータスが 200 で、`loc` が `null`
      - '`comments.yaml` の C-1 が `loc` を持たず、`target: A-1` を持つ'
    test: test_normal_when_remove_location
  - name: 異常系（本文が空・400）
    summary: 空白だけの本文には書き換えない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送信する）
      - name: make_workspace
        description: レビュー中のコメント C-1 を持つワークスペース
        notes: '`{body: "  "}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as PATCH /w/{workspace}/api/comments/{id}

        クライアント->>IF: PATCH /w/{workspace}/api/comments/C-1 {body: 空白}
        IF-->>クライアント: 400
      ```
    expected:
      - ステータスが 400 で、`detail` に `body` がある
      - '`comments.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_body_empty
  - name: 異常系（送信元が違う・403）
    summary: 別のサイトのページからは書き換えない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送信する）
      - name: make_workspace
        description: レビュー中のコメント C-1 を持つワークスペース
        notes: '`Origin: https://attacker.example` を付ける'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as PATCH /w/{workspace}/api/comments/{id}

        クライアント->>IF: PATCH（Origin: attacker.example）
        IF-->>クライアント: 403
      ```
    expected:
      - ステータスが 403
      - '`comments.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_origin_mismatch
  - name: 異常系（コメントが無い・404）
    summary: 無い ID は書き換えない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送信する）
      - name: make_workspace
        description: レビュー中のコメント C-1 だけを持つワークスペース
        notes: '`PATCH /w/{workspace}/api/comments/C-9`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as PATCH /w/{workspace}/api/comments/{id}

        クライアント->>IF: PATCH /w/{workspace}/api/comments/C-9
        IF-->>クライアント: 404
      ```
    expected:
      - ステータスが 404 で、`detail` に `C-9` がある
      - '`comments.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_comment_not_found
  - name: 正常系（案を選び直す）
    summary: 案の選択の記号と一言を書き換え、向けた検討事項は変えない
    setup:
      - name: Mock
        description: なし（MCP サーバーを起動して `preview_url` を呼び、返った URL へ HTTP のクライアントで送信する）
      - name: make_workspace
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 への案 A の選択 C-1（一言なし）を持つワークスペース
        notes: '`PATCH /w/{workspace}/api/comments/C-1` に `{choice: {key: B}, body: 費用を優先する}`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as PATCH /w/{workspace}/api/comments/{id}
        participant WS as ワークスペース

        クライアント->>IF: PATCH /w/{workspace}/api/comments/C-1 {choice, body}
        IF->>WS: comments.yaml の C-1 を書き換える
        IF-->>クライアント: 200
      ```
    expected:
      - ステータスが 200 で、`choice.key` が `B`、`body` が `費用を優先する`
      - '`comments.yaml` の C-1 の `choice` と `body` だけが変わり、`target` が D-1 のまま'
      - '`decisions.yaml` の中身が呼ぶ前と同じ'
    test: test_normal_when_choice_changed
lead: コメントの一覧の行の中で、レビュー中のコメント 1 件の本文を書き換えるか、箇所が合わなくなったコメントから箇所を外す。
idempotent: true
side_effects: '`comments.yaml` のそのコメントの `body` を書き換えるか `loc` を削除する。一時ファイルから `os.replace` で置き換える。ほかのファイルは書き換えない'
callers:
  - IF-489-70#
request:
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '『プレビューの配信』の制約「接続先の確認」に合うもの（`127.0.0.1:{ポート}`・`localhost:{ポート}`・許可するホスト名）'
  - name: Content-Type
    type: str
    required: true
    location: header
    description: 本文の構造
    constraints: '`application/json`'
  - name: Origin
    type: str
    required: false
    default: なし（確かめない）
    location: header
    description: ブラウザが付ける送信元
    constraints: 付いていれば『プレビューの配信』の制約「送信元の確認」に合うもの（`http://127.0.0.1:{ポート}`・`http://localhost:{ポート}`・許可するホスト名の `https` / `http`）
  - name: id
    type: str
    required: true
    location: path
    description: 書き換えるコメントの ID
    example: C-1
  - name: body
    type: str
    required: false
    default: なし（本文を変えない）
    location: body
    description: 書き換えた後の本文
    constraints: 前後の空白を除いて 1 文字以上、10000 文字以下。案の選択のコメントだけ `null` を渡せ、一言を削除する
    example: 案 A に決める
  - name: loc
    type: None
    required: false
    default: なし（箇所を変えない）
    location: body
    description: '`null` を渡すと箇所を外す。箇所を付け替えることはできない'
    constraints: '`null` だけ'
  - name: choice.key
    type: str
    required: false
    default: なし（選んだ案を変えない）
    location: body
    description: 案の選択のコメントで、選び直した案の記号
    constraints: 向けた検討事項の `options` にある記号
    example: A
response:
  - name: id
    type: str
    description: 書き換えたコメントの ID
  - name: body
    type: str
    description: 書き換えた後の本文
  - name: loc
    type: dict | None
    description: 書き換えた後の箇所。外したら `null`
  - name: choice
    type: dict | None
    description: 書き換えた後の案の選択（`key`）。案の選択でないコメントは `null`
status_codes:
  - code: '200'
    condition: 書き換えた
  - code: '400'
    condition: '本文が JSON のオブジェクトでない・`body` も `loc` も `choice` も無い・`body` が空白だけか 10000 文字を超える・案の選択でないコメントに `choice` か `body: null` を渡した・`loc` が `null` 以外'
    notes: 何も書かない
  - code: '403'
    condition: '`Origin` が『プレビューの配信』の制約「送信元の確認」に合わない'
    notes: 何も書かない
  - code: '404'
    condition: '`id` のコメントがレビュー中に無い'
    notes: 何も書かない
  - code: '415'
    condition: '`Content-Type` が `application/json` でない'
    notes: 何も書かない
  - code: '422'
    condition: '`comments.yaml` がスキーマに合わないか YAML として読めない、または `config.yaml` が無くなった'
    notes: 何も書かない
  - code: '500'
    condition: '`comments.yaml` を書けない'
    notes: '`detail` に書けなかったパスと理由。`comments.yaml` は前のまま'
  - code: '409'
    condition: '`choice.key` が向けた検討事項の案に無いか、向けた検討事項が `未決定`・`要見直し` でない'
    notes: 何も書かない。`detail` に合わない理由
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 書き換えるキー
    constraint: '`body`・`loc`・`choice` だけ。`id`・`target`・`created` は変えない。並びも変えない'
  - item: 本文の上限
    constraint: 『レビュー中のコメントの追加』と同じ
    decided_by: NFR-489-1#requirements[送信の本文の長さ]
  - item: 送信元の確認
    constraint: 『コメントをまとめて送信する』と同じ
  - item: 同時の書き込み
    constraint: 書き換えの鍵とワークスペースのロック（『MCP サーバーの起動』の同時の呼び出し）を取ってから読み・書く
refs:
  - ER-489-1#
  - SC-489-3#
test_file: tests/integration/server/test_comment_update.py

summary: "サブシステムの外部インターフェースと処理フロー（サブシステム結合テストの元）"
items:
  - page: IF-489-69.yaml
    summary: "Claude Code がマーケットプレイスとして登録するときに読む marketplace.json の形"
  - page: IF-489-68.yaml
    summary: "Claude Code がインストールして読み込む plugin.json とフォルダの形"
  - page: IF-489-64.yaml
    summary: "/mindstella:setup: 依存を確かめ、ワークスペースを作るか状況を示して session へ渡す"
  - page: IF-489-66.yaml
    summary: "/mindstella:session: 取り込み・ヒアリング・リサーチ・方針転換・プレビュー・ゴール判定を回す"
  - page: IF-489-65.yaml
    summary: "/mindstella:upgrade: ワークスペースの版とプラグインの版を比べ、版ごとの手順で今の版へ移し替える"
  - page: IF-489-67.yaml
    summary: "register.py: 起動スクリプトを呼ぶ mindstella・mindstella-{名前} と環境変数を、ログインシェルの設定に登録・読み返し・外す"
  - page: IF-489-71.yaml
    summary: "URL のハッシュが指す画面と項目を、サーバーから読んだ記録で開き、書き換えで描き直し、回答・意見を送る"
  - page: IF-489-70.yaml
    summary: "React のプレビューを `/spa/` で開き、記録を読んで search params が指す画面を描き、書き換えの知らせで描き直す"
  - page: IF-489-56.yaml
    summary: "bin/mindstella: 依存を確かめ、常駐サーバーが落ちていれば起動して、tmux のセッションで Claude Code を立ち上げる"
  - page: IF-489-27.yaml
    summary: "check_env.py: スキル専用の仮想環境の Python と PyYAML・jsonschema・mcp の版を確かめる"
  - page: IF-489-1.yaml
    summary: "常駐の MCP サーバー mindstella を HTTP で待ち受ける。全てのツールに共通の結果とエラーの返し方"
  - page: IF-489-38.yaml
    summary: "ensure_server.py: SessionStart のフックと起動スクリプトが、落ちていた常駐サーバーを起動する"
  - page: IF-489-15.yaml
    summary: "inject_session.py: PreToolUse のフックが、呼んだセッションの作業フォルダとペインをツールの引数に入れる"
  - page: IF-489-37.yaml
    summary: "server_status: 待ち受けのポート・バージョンと、配信しているワークスペースを返す"
  - page: IF-489-36.yaml
    summary: "server_stop: 配信を全て止めて常駐サーバーを終える"
  - page: IF-489-25.yaml
    summary: "init: 設定を受け取って空のワークスペースを作る"
  - page: IF-489-63.yaml
    summary: "add: 1 項目を足す"
  - page: IF-489-60.yaml
    summary: "update: 1 項目のキーを置き換える"
  - page: IF-489-40.yaml
    summary: "adopt: 検討事項の採用する案を 1 つに切り替える"
  - page: IF-489-32.yaml
    summary: "status: 要見直し・進行中・再開可能・決定待ち・次の候補をまとめて返す"
  - page: IF-489-48.yaml
    summary: "next: 前提が揃った未決定をフェーズ → 影響度 → 後続の件数の順に返す"
  - page: IF-489-39.yaml
    summary: "impact: 参照を逆向きにたどって影響を受ける項目を返す"
  - page: IF-489-61.yaml
    summary: "find: 条件に合う項目を返す"
  - page: IF-489-62.yaml
    summary: "show: 1 項目の中身・本文・参照元を返す"
  - page: IF-489-35.yaml
    summary: "attrs: 使っている属性名と件数を返す"
  - page: IF-489-16.yaml
    summary: "tags: 使っているタグと件数・種類を返す"
  - page: IF-489-7.yaml
    summary: "goal: ゴールのフェーズまでが決着し納品物が揃ったかと、残りの項目を返す"
  - page: IF-489-26.yaml
    summary: "check: スキーマ違反・参照切れ・本文のずれを洗い出す"
  - page: IF-489-52.yaml
    summary: "migrate: ワークスペースの版とプラグインの版を比べ、版ごとの手順を並べる・当てる・版を書き換える"
  - page: IF-489-20.yaml
    summary: "clear_release: リリースの資料を書き出す前に release/ の中身を消す"
  - page: IF-489-19.yaml
    summary: "write_release: 確定したリリースの資料を release/ の下へ 1 ファイルずつ書き出す"
  - page: IF-489-57.yaml
    summary: "export: 描画のライブラリまで中に持つ見るだけの 1 枚の HTML を書き出す"
  - page: IF-489-17.yaml
    summary: "preview_url: ワークスペースを 127.0.0.1 の空きポートで配り、URL を返す"
  - page: IF-489-18.yaml
    summary: "GET /mindstella.html: プレビューの画面を返す（/ はここへ送り直す）"
  - page: IF-489-3.yaml
    summary: "GET /spa/{path}: React のプレビュー（SPA）の index.html と出力の静的なファイルを返す（出力に無いパスは index.html）"
  - page: IF-489-51.yaml
    summary: "GET /api/records: ワークスペースの記録をその場で読んで返す"
  - page: IF-489-44.yaml
    summary: "GET /api/events: 書き換えを Server-Sent Events で知らせる"
  - page: IF-489-43.yaml
    summary: "commit: まだまとめていない書き換えを説明つきのまとまりにする"
  - page: IF-489-4.yaml
    summary: "pending: 最後のまとまりより後に足した・変えた項目を返す"
  - page: IF-489-34.yaml
    summary: "POST /api/opened: 前回プレビューを開いた日時を返し、今の日時に書き換える"
  - page: IF-489-55.yaml
    summary: "update_settings: 設定のキーを置き換え、フェーズ・対象・カテゴリーの対応で項目を付け替える"
  - page: IF-489-23.yaml
    summary: "GET /api/comments: レビュー中のコメントと書きかけをその場で読んで返す"
  - page: IF-489-24.yaml
    summary: "POST /api/comments: 項目・選んだ箇所へのコメントか項目に紐づかないコメントをレビュー中に溜める"
  - page: IF-489-22.yaml
    summary: "PATCH /api/comments/{id}: レビュー中のコメント 1 件の本文を書き換えるか、箇所を外す"
  - page: IF-489-21.yaml
    summary: "DELETE /api/comments/{id}: レビュー中のコメント 1 件を消し、元に戻すための中身を返す"
  - page: IF-489-42.yaml
    summary: "PUT /api/drafts: コメントの入力欄の書きかけを向けた先ごとに保つ"
  - page: IF-489-6.yaml
    summary: "POST /api/comments/send: チェックしたレビュー中の書き込みをスレッドへ移す"
  - page: IF-489-47.yaml
    summary: "edit_option: 検討事項の案を記号で指して 1 つ足す・直す・消す"
  - page: IF-489-5.yaml
    summary: "batch: 項目の追加・更新・取得を並べて 1 回で当てる"
  - page: IF-489-33.yaml
    summary: "changes_since_read: AI が前回読んだ時点より後に足した・変えた項目を返し、読んだ時点を進める"
  - page: IF-489-54.yaml
    summary: "PUT /api/config/display: 見た目の既定と表示する種類の既定を config.yaml に書く"
  - page: IF-489-53.yaml
    summary: "POST /api/config/reload: 手で直した config.yaml を検査し、通れば配信の設定を差し替える"
  - page: IF-489-2.yaml
    summary: "readme: 直下の README.md を起動・接続・スキル・プレビューの一覧に書き直す"
  - page: IF-489-59.yaml
    summary: "remove: 1 項目を消し、消した項目をまだまとめていない変更に残す"
  - page: IF-489-8.yaml
    summary: "threads: スレッドを状態・タグ・未読・取り込み待ちで絞り、キーだけを返す"
  - page: IF-489-14.yaml
    summary: "thread: スレッド 1 件の書き込みを返し、返した書き込みを AI の既読にする"
  - page: IF-489-13.yaml
    summary: "new_thread: AI が返事を求めるスレッドを立てる"
  - page: IF-489-12.yaml
    summary: "reply: スレッドへ返信し、要約を書き直して読んだ書き込みを取り込み済みにする"
  - page: IF-489-10.yaml
    summary: "set_thread_status: AI がスレッドをクローズにするかオープンに戻す"
  - page: IF-489-9.yaml
    summary: "update_thread: 要約とタグを書き換え、読んだ書き込みを取り込み済みにする"
  - page: IF-489-11.yaml
    summary: "GET /api/threads: スレッドを全て、書き込みと状態の記録ごとその場で読んで返す"
  - page: IF-489-50.yaml
    summary: "PATCH /api/threads/{id}: 利用者がスレッドをクローズにするかオープンに戻す"
  - page: IF-489-46.yaml
    summary: "reset_unread.py: 会話を始めるたびにスレッドの書き込みを AI の未読に戻す"
  - page: IF-489-49.yaml
    summary: "POST /api/threads/{id}/seen: 利用者が開いたスレッドの未読の書き込みを利用者の既読にする"
  - page: IF-489-29.yaml
    summary: "GET /api/edits: 保存待ちの編集をその場で読んで返す"
  - page: IF-489-30.yaml
    summary: "POST /api/edits: 項目と設定の編集 1 件を保存待ちに溜める（同じキーは書き換える）"
  - page: IF-489-28.yaml
    summary: "DELETE /api/edits/{id}: 保存待ちの編集 1 件を外す"
  - page: IF-489-31.yaml
    summary: "POST /api/edits/save: 保存待ちの編集を 1 回で当て、利用者の書き換えのまとまりにする"
  - page: IF-489-41.yaml
    summary: "GET /api/transcription: 文字起こしを使えるかと理由、用語集のプリセットの候補、ワークスペースの文字起こしの設定を返す"
  - page: IF-489-58.yaml
    summary: "POST /api/transcriptions: 録音した音声を文字起こしのサービスへ渡し、終わるまで待って起こした文字を返す"
  - page: IF-489-45.yaml
    summary: "POST /api/comments/send-now: 入力欄の全文 1 件を、溜めずにスレッドへ送って Claude Code へ入力する"

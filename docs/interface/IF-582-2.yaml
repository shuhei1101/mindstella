id: IF-582-2
title: 落ちたことの見回り
entry:
  kind: trigger
  value: 常駐サーバーの起動から、非機能要件『落ちたことを見回る間隔』ごと
lead: 状態が起動中の MindStella のセッションを一定の間隔で見回り、tmux のペインか Claude Code のプロセスが無ければ落ちたことを状態に記録して『停止の通知』を呼ぶ。一覧・停止などで状態を読まれなくても、落ちたことが分かる。
idempotent: true
side_effects: '`running` の `session.json` のうち落ちているものを `crashed` にし、『停止の通知』を止まった理由 `crashed` で呼ぶ。ほかは書かない'
exclusivity: 常駐サーバーの中の 1 本の `daemon` のスレッドで順に見回る。`session.json` ごとの書き込みの鍵を取って書き換える前の `status` を読み、`running` のときだけ書き換える（`stopping`・`restarting` はその処理に任せる）
exceptions:
  - name: なし（正常終了）
    condition: 1 つのワークスペースの見回りに失敗しても
    notes: 標準エラーに 1 行記録して次のワークスペースへ進む。見回りのスレッドは止めない
constraints:
  - item: 見回る間隔
    constraint: 非機能要件『落ちたことを見回る間隔』の秒数。環境変数 `MINDSTELLA_CRASH_WATCH_INTERVAL` で上書きできる
    decided_by: NFR-489-1#requirements[落ちたことを見回る間隔]
  - item: 見回る対象
    constraint: 状態のフォルダのワークスペースの ID の一覧のうち、`session.json` の `status` が `running` のもの
  - item: 落ちたかの判定
    constraint: 『MindStella のセッションの一覧』の「落ちたかの判定」と同じ
  - item: 停止の通知
    constraint: '`running` から `crashed` に書き換えたときだけ『停止の通知』を `crashed` で呼ぶ。作成・停止・クローズが先に書き換えていれば呼ばない'
  - item: 再起動
    constraint: 見回りでは再起動しない。再起動するのはコメントが届いたとき（『コメントをまとめて送信する』）と再起動の依頼
  - item: 起動のとき
    constraint: 常駐サーバーの起動では、最初の間隔を待たずに『常駐サーバーの起動時の照合』が同じ 1 回分を待ち受けの前に呼ぶ
flows:
  - name: 正常系
    summary: ペインが無い running の MindStella のセッションを crashed にし、異常終了を 1 件通知する
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント。受けた要求を記録して 200 を返却する）
      - name: 常駐サーバー
        description: テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ、`MINDSTELLA_CRASH_WATCH_INTERVAL` は 1、`MINDSTELLA_DISCORD_WEBHOOK_FILE` はエンドポイントの URL を記載した一時ファイル
      - name: 状態
        description: '`status: running` で `pane` のペインが無い `session.json`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant WT as 見回りのスレッド
        participant ST as 状態のフォルダ
        participant IF as 停止の通知
        participant DC as Discord（Mock）

        WT->>ST: running の session.json を読む
        WT->>WT: ペインが無い
        WT->>ST: crashed に書き換える
        WT->>IF: crashed
        IF->>DC: POST
      ```
    expected:
      - 一覧も停止も呼ばずに、`session.json` の `status` が `crashed` になる
      - エンドポイントが 1 件だけ要求を受け、止まった理由が異常終了
    test: test_normal
  - name: 正常系（再起動の途中）
    summary: restarting の MindStella のセッションは書き換えない
    setup:
      - name: Mock
        description: 正常系と同じ
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: 状態
        description: '`status: restarting` でペインが無い `session.json`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant WT as 見回りのスレッド
        participant ST as 状態のフォルダ

        WT->>ST: session.json を読む
        WT->>WT: restarting なので飛ばす
      ```
    expected:
      - '`session.json` の `status` が `restarting` のまま'
      - エンドポイントが要求を受けていない
    test: test_normal_when_restarting

id: IF-489-18
title: プレビューの配信
entry:
  kind: endpoint
  value: GET /w/{workspace}/mindstella.html
flows:
  - name: 正常系
    summary: 雛形に CSS と JavaScript を差し込んだ画面を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/mindstella.html

        クライアント->>IF: GET /w/{workspace}/mindstella.html（Host: 127.0.0.1:{ポート}）
        IF-->>クライアント: 200、HTML
      ```
    expected:
      - ステータスが 200 で、`Content-Type` が `text/html; charset=utf-8`、`Cache-Control` が `no-store`
      - 本文に `<style>` と `<script>` があり、`mindmap-data` の要素が空
    test: test_normal
  - name: 正常系（/ を開く）
    summary: '`/w/{workspace}/` は画面のパスへリダイレクトする'
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: リダイレクトを辿らずに `/w/{workspace}/` を GET する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信

        クライアント->>IF: GET /w/{workspace}/
        IF-->>クライアント: 302、Location: /w/{workspace}/mindstella.html
      ```
    expected:
      - ステータスが 302 で、`Location` が `/w/{workspace}/mindstella.html`
    test: test_normal_when_root
  - name: 異常系（接続先が違う・403）
    summary: Host が端末の中の名前でなければ画面を返さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`Host: attacker.example:{ポート}` を付けてつなぐ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/mindstella.html

        クライアント->>IF: GET /w/{workspace}/mindstella.html（Host: attacker.example）
        IF-->>クライアント: 403
      ```
    expected:
      - ステータスが 403
      - 本文に HTML が無い
    test: test_error_when_host_mismatch
  - name: 異常系（無いパス・404）
    summary: 決めたパス以外は 404 を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`/config.yaml` を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信

        クライアント->>IF: GET /config.yaml
        IF-->>クライアント: 404
      ```
    expected:
      - ステータスが 404
      - 本文に `config.yaml` の中身が無い
    test: test_error_when_path_unknown
  - name: 正常系（許可したホスト名）
    summary: 許可したホスト名の `Host` は、入口のポートを問わず画面を返す
    setup:
      - name: Mock
        description: なし（`MINDSTELLA_ALLOWED_HOSTS` を `preview.example.test` にして MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`Host: preview.example.test` と `Host: PREVIEW.example.test:8443` の 2 回つなぐ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/mindstella.html

        クライアント->>IF: GET /w/{workspace}/mindstella.html（Host: preview.example.test）
        IF-->>クライアント: 200、HTML
        クライアント->>IF: GET /w/{workspace}/mindstella.html（Host: PREVIEW.example.test:8443）
        IF-->>クライアント: 200、HTML
      ```
    expected:
      - どちらもステータスが 200 で、`Content-Type` が `text/html; charset=utf-8`
      - '`Host: other.example.test` でつなぐと 403'
    test: test_normal_when_host_allowed
  - name: 正常系（latest を develop の commit に解決する）
    summary: 設定の mdmark のバージョンが `latest` のとき、GitHub に問い合わせた develop の先頭の commit の SHA で mdmark の URL を組み立て、保持している間は再問い合わせしない
    setup:
      - name: Mock
        description: GitHub の API を、develop の先頭の commit の SHA を返す偽のサーバー（空きポート）に差し替えて MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ
        notes: 偽のサーバーは `0123456789abcdef0123456789abcdef01234567` を返し、受けた要求の数を数える
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark.version` が `latest` のワークスペース
        notes: 続けて 2 回 GET する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/mindstella.html
        participant GH as GitHub の API

        クライアント->>IF: GET /w/{workspace}/mindstella.html
        IF-->>GH: develop の先頭の commit の SHA
        IF-->>クライアント: 200、SHA の URL で mdmark を読み込む HTML
        クライアント->>IF: GET /w/{workspace}/mindstella.html
        IF-->>クライアント: 200、同じ HTML（問い合わせない）
      ```
    expected:
      - どちらもステータスが 200
      - mdmark の CSS の link 要素の `href` が `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@0123456789abcdef0123456789abcdef01234567/dist/index.css`
      - '`mindmap-mdmark-config` の `js` が `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@0123456789abcdef0123456789abcdef01234567/dist/index.js`'
      - 偽のサーバーが受けた要求が 1 回
    test: test_normal_when_latest_resolved
  - name: 正常系（GitHub に届かない）
    summary: develop の先頭の commit を問い合わせられないときは、`develop` の URL で mdmark を読み込む画面を返す
    setup:
      - name: Mock
        description: GitHub の API を、誰も待ち受けない空きポートに差し替えて MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark.version` が `latest` のワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/mindstella.html
        participant GH as GitHub の API

        クライアント->>IF: GET /w/{workspace}/mindstella.html
        IF-->>GH: develop の先頭の commit の SHA（届かない）
        IF-->>クライアント: 200、develop の URL で mdmark を読み込む HTML
      ```
    expected:
      - ステータスが 200
      - mdmark の CSS の link 要素の `href` が `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@develop/dist/index.css`
      - 常駐サーバーの標準エラーに、mdmark の develop の commit を問い合わせられなかった旨の行が 1 行ある
    test: test_normal_when_github_unreachable
  - name: 正常系（タグを指定）
    summary: 設定の mdmark のバージョンがタグのときは、GitHub に問い合わせずにタグの URL で mdmark を読み込む画面を返す
    setup:
      - name: Mock
        description: GitHub の API を、受けた要求の数を数える偽のサーバー（空きポート）に差し替えて MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `mdmark.version` が `v0.13.0` のワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/mindstella.html

        クライアント->>IF: GET /w/{workspace}/mindstella.html
        IF-->>クライアント: 200、タグの URL で mdmark を読み込む HTML
      ```
    expected:
      - ステータスが 200
      - mdmark の CSS の link 要素の `href` が `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@v0.13.0/dist/index.css`
      - 偽のサーバーが受けた要求が 0 回
    test: test_normal_when_version_tag
  - name: 正常系（jsDelivr がまだ配らない commit）
    summary: 問い合わせた develop の先頭の commit を jsDelivr が配らないときは、`develop` で読み込む
    setup:
      - name: Mock
        description: 常駐サーバーの GitHub と jsDelivr の基点の URL を、`sitecustomize` で偽のサーバーに向ける。偽の GitHub は SHA `0123456789abcdef0123456789abcdef01234567` を返し、偽の jsDelivr はその SHA の `dist/index.js` に 403 を返す
      - name: make_workspace
        description: 設定の `mdmark` を持たないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as 配信
        participant GH as GitHub
        participant JD as jsDelivr

        ユーザー->>IF: GET /w/{workspace}/mindstella.html
        IF->>GH: develop の先頭の commit を問い合わせる
        GH-->>IF: SHA
        IF->>JD: その SHA の dist/index.js
        JD-->>IF: 403
        IF-->>ユーザー: develop で mdmark を読み込む画面
      ```
    expected:
      - 返した HTML の mdmark の CSS と JavaScript の URL が `mdmark@develop/dist/` を含む
      - 常駐サーバーの標準エラーに、jsDelivr が配らない旨の 1 行がある
    test: test_normal_when_dist_not_served
  - name: 異常系（配っていないワークスペース・404）
    summary: 配っていないワークスペース（知らない ID・削除したワークスペース）の ID を指すと、画面も記録も返さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL のオリジンへ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース A と、作成した後に『ワークスペースの削除』で削除したワークスペース B（フォルダは残す）
        notes: '`/w/mindstella-unknown-000000/mindstella.html`・`/w/{B の ID}/mindstella.html`・`/w/{B の ID}/api/records` を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信

        クライアント->>IF: GET /w/{知らない ID}/mindstella.html
        IF-->>クライアント: 404
        クライアント->>IF: GET /w/{B の ID}/api/records
        IF-->>クライアント: 404
      ```
    expected:
      - 3 つともステータスが 404 で、`Content-Type` が `application/problem+json`
      - 本文に B の記録が無い
      - A の `/w/{A の ID}/mindstella.html` は 200 のまま
    test: test_error_when_workspace_not_served
lead: '常駐サーバーが、配っているワークスペース（制約「配るワークスペース」）のプレビューの画面（雛形に CSS と JavaScript を差し込んだ HTML）を `/w/{workspace}/mindstella.html` で返す。`/w/{workspace}/` は `/w/{workspace}/mindstella.html` へ再送信する。記録は画面が『記録の取得』で読む。'
idempotent: true
side_effects: なし（読むだけ）
callers:
  - IF-489-71#
request:
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '`127.0.0.1:{常駐サーバーのポート}`・`localhost:{常駐サーバーのポート}` か、ポートを外したホスト名の部分が許可するホスト名のどれかと同じもの（制約「接続先の確認」）'
response:
  - name: 本文
    type: text/html
    description: '`plugins/mindstella/skills/mindmap/preview/` の `template.html` に、画面の CSS を `<style>`、JavaScript を `<script>` の中身として差し込んだ HTML。`<script type="application/json" id="mindmap-data"></script>` は空のまま返す'
  - name: Cache-Control
    type: str
    description: '`no-store`（プラグインを上げた後に古い画面を読ませない）'
status_codes:
  - code: '200'
    condition: 画面を返せた
  - code: '302'
    condition: '`/w/{workspace}/` を開いた'
    notes: '`Location: /w/{workspace}/mindstella.html`'
  - code: '403'
    condition: '`Host` が制約「接続先の確認」に合わない'
    notes: 本文は返さない
  - code: '404'
    condition: '`{workspace}` が配っているワークスペースの ID でない（知らない ID・削除したワークスペース）。または `/w/{workspace}/`・`/w/{workspace}/mindstella.html`・`/w/{workspace}/spa`（`/w/{workspace}/spa/{path}` を含む。『SPAの配信』）・`/w/{workspace}/api/records`・`/w/{workspace}/api/events`・`/w/{workspace}/api/comments`（`/w/{workspace}/api/comments/{id}`・`/w/{workspace}/api/comments/send` を含む）・`/w/{workspace}/api/drafts`・`/w/{workspace}/api/config/display`・`/w/{workspace}/api/config/reload` 以外のパス'
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 待ち受け
    constraint: '常駐サーバーが `127.0.0.1` の `MINDSTELLA_PORT` で待ち受ける経路だけ（『プレビューの URL』）'
    decided_by: NFR-489-1#requirements[待ち受けの範囲]
  - item: 接続先の確認
    constraint: '全てのパスで `Host` を確かめ、合わなければ 403 を返す（別のサイトがこの端末の名前を名乗って配信を読む DNS の付け替えを防ぐ）。受けるのは `127.0.0.1:{常駐サーバーのポート}`・`localhost:{常駐サーバーのポート}` と、ポートを外したホスト名の部分が許可するホスト名（『設定: サーバー』の `MINDSTELLA_ALLOWED_HOSTS`）のどれかと同じもの。比べるときは大文字と小文字を区別しない。許可するホスト名は入口のポートを問わない（トンネル・リバースプロキシが転送したものしか `127.0.0.1` に届かないため）'
  - item: 差し込みの安全
    constraint: 差し込む CSS・JavaScript が `</style>`・`</script>` を含むときは、同梱の雛形の誤りとして 500 を返す
  - item: 読み込むファイル
    constraint: 返す HTML は、描画のライブラリを jsDelivr から、文字を Google Fonts から読む（雛形が持つ）。mdmark の CSS の link 要素と JavaScript の URL は、返すたびに制約「mdmark の ref の解決」の ref から `https://cdn.jsdelivr.net/gh/shuhei1101/mdmark@{ref}/dist/{ファイル}` で組み立てて雛形へ入れ、`integrity` を付けない。ローカルのファイルは指さない
  - item: 通信
    constraint: 配信は、制約「mdmark の ref の解決」の GitHub の API への問い合わせと jsDelivr への配布物の確認のほかは外へ通信しない
  - item: 送信元の確認
    constraint: 書き込むエンドポイントは、`Origin` が付いていれば確かめ、合わなければ 403 を返す（別のサイトのページからの書き込みを防ぐ）。受けるのは `http://127.0.0.1:{常駐サーバーのポート}`・`http://localhost:{常駐サーバーのポート}` と、スキームが `https` か `http` で、ポートを外したホスト名の部分が許可するホスト名のどれかと同じもの。`Origin` が無い要求（HTTP のクライアントからの要求）は通す
  - item: mdmark の ref の解決
    constraint: 'ワークスペースの設定の `mdmark.version` がタグのときはタグを、`latest` か無いときは mdmark の develop の先頭の commit の SHA（40 文字の 16 進）を mdmark の ref にする。SHA は外部 API『GitHub』で問い合わせ、常駐サーバーの中で 150 秒保持し、保持している間は問い合わせない。1 回の問い合わせは、接続を 11 秒、読み取りを 2 秒まで待ち、再取得しない。問い合わせた SHA が保持している SHA と違うときは、jsDelivr にその SHA の `dist/index.js` を画面と同じ GET に `Range: bytes=0-0` を付けて 1 回要求し（接続を 1 秒、読み取りを 2 秒まで待ち、本文は読まない）、200 か 206 のときだけその SHA を ref にする。200 も 206 でもないとき（新しい commit を jsDelivr がまだ配らず 403 を返す間など）は、問い合わせられないときと同じく扱う。問い合わせられないとき（届かない・200 以外・SHA の形式でない・jsDelivr が配らない）は、前に問い合わせた SHA があればそれを、無ければ `develop` を ref にし、標準エラーに 1 行記録して、問い合わせられなかったことも 150 秒保持する。develop に新しい commit が入った後の最初の 1 回は、画面を返すまでに問い合わせ（最大 13 秒）と確認（最大 3 秒）で最大 16 秒待つ。外部 API『GitHub』が上限を超えた応答を返したときは、その応答が示す時刻まで問い合わせない。問い合わせる基点の URL（既定は `https://api.github.com`）と配布物を確かめる jsDelivr の基点の URL（既定は `https://cdn.jsdelivr.net`）は常駐サーバーの定数に持ち、結合テストは文字起こしのテストと同じく、常駐サーバーを起動するときに `sitecustomize` で定数を差し替えて偽のサーバーへ向ける。『記録の取得』の `mdmark_ref` と『配る書き出し』も、同じ ref を使用する'
    notes: '150 秒: GitHub の API の認証なしの上限 60 回/時 ÷ 同じ端末で問い合わせる数 2（常駐サーバー・Storybook）× 安全率 0.8 = 24 回/時。接続 11 秒・読み取り 2 秒: 2026-11-19 に認証つきで同じエンドポイントを 1,000 回呼んだ実測（200 が 999 回、30 秒でも接続できなかったのが 1 回）で、接続の p99.9 が 7.10 秒、読み取り（応答の終了まで − 接続）の p99.9 が 1.17 秒。それぞれに余裕 50% を加え、秒に切り上げた。認証のあり・なしで応答の時間は変わらない前提を置く。commit を指す jsDelivr の URL は `cache-control: immutable` で中身が変わらないため、ブラウザ・CDN のキャッシュが更新前の配布物を返さない。jsDelivr の確認: 2026-11-19 に mdmark の develop の先頭の commit（`aadba7dd`。push の約 15 分後）の `dist/index.js` が「Package size exceeded the configured limit of 50 MB」の 403 を返し、約 4 分後には同じ URL が 200 を返した。配らない commit を ref にすると画面が mdmark を読めず本文を描けないため、確かめてから切り替える。403 を見たのは画面と同じ GET なので、確認も GET で行い、`Range: bytes=0-0` で本文を減らす（jsDelivr は 1,000 回のうち 998 回を 200、2 回を 206 で返したため、どちらも配っていると判定する）。jsDelivr の接続 1 秒・読み取り 2 秒: 2026-11-19 に配っている commit（`05a79a26`）の `dist/index.js` を `Range: bytes=0-0` の GET で 1,000 回要求した実測（全て 200 か 206）で、接続の p99.9 が 0.038 秒、読み取り（応答の終了まで − 接続）の p99.9 が 1.30 秒。それぞれに余裕 50% を加え、秒に切り上げた'
  - item: ワークスペースの区別
    constraint: 画面と画面が呼ぶ全ての経路（この画面・『SPAの配信』・『ワークスペースのファイルの配信』・`/api/*`）は `/w/{workspace}/` を先頭に持ち、`{workspace}`（『プレビューの URL』の制約「画面のパス」）で指したワークスペースだけを読み書きする。別のワークスペースの記録・ファイル・書き換えの通知を返さず、別のワークスペースへ書かない。`/w/` の外は、常駐サーバーの MCP（`/mcp`）と MindStella の API（`/workspaces`・`/_admin`）だけを持ち、画面を返さない
  - item: 配るワークスペース
    constraint: 常駐サーバーの状態のワークスペースの ID の一覧（ER 図『常駐サーバーの状態』）にあるワークスペース（クローズしたものを含む）を、常駐サーバーが起動したときから配る。『ワークスペースの作成』で一覧に加わったワークスペースは作成の時点から配り、『ワークスペースの削除』で一覧から外れたら配るのをやめる。一覧に無いフォルダは、`preview_url` を呼んだときからそのプロセスが終わるまで配る。配り始める前に `config.yaml` をスキーマと突き合わせ（『プレビューの URL』の制約「起動時の検査」と同じ）、合わないワークスペースは配らずに標準エラーへ 1 行記録する（`preview_url` で検査に通った時点から配る）。配り始めたときに起動時のフックを 1 回呼び（『プレビューの URL』の制約「起動時のフック」）、直下の README を画面の URL で書き直す（同じく制約「README の更新」）

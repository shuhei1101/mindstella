id: IF-489-18
title: プレビューの配信
entry:
  kind: endpoint
  value: GET /w/{workspace}/
flows:
  - name: 正常系
    summary: '`/w/{workspace}/` で React の画面の `index.html` を返す'
    setup:
      - &id001
        name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/
        
        クライアント->>IF: GET /w/{workspace}/（Host: 127.0.0.1:{ポート}）
        IF-->>クライアント: 200、index.html
      ```
    expected:
      - ステータスが 200 で、`Content-Type` が `text/html; charset=utf-8`、`Cache-Control` が `no-store`
      - 本文に `id="root"` の要素と、`/w/{workspace}/assets/` を指す `<script type="module">` がある
    test: test_normal
  - name: 正常系（静的なファイル）
    summary: ビルドの出力の静的なファイルを拡張子に合う Content-Type で返す
    setup:
      - *id001
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`/w/{workspace}/` の本文の `<script>` の `src` と `<link rel="stylesheet">` の `href` を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/assets/{名前}
        
        クライアント->>IF: GET /w/{workspace}/assets/{名前}.js
        IF-->>クライアント: 200、JavaScript
        クライアント->>IF: GET /w/{workspace}/assets/{名前}.css
        IF-->>クライアント: 200、CSS
      ```
    expected:
      - JavaScript はステータスが 200 で、`Content-Type` が `text/javascript; charset=utf-8`
      - CSS はステータスが 200 で、`Content-Type` が `text/css; charset=utf-8`
    test: test_normal_when_asset
  - name: 正常系（前の画面の URL を開く）
    summary: '`/w/{workspace}`・`/w/{workspace}/mindstella.html`・`/w/{workspace}/spa`（`/w/{workspace}/spa/{path}` を含む）は、search を残して `/w/{workspace}/` へ再送信する'
    setup:
      - *id001
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: リダイレクトを辿らずに `/w/{workspace}`・`/w/{workspace}/mindstella.html`・`/w/{workspace}/spa/?tab=decisions&id=D-1` を GET する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信
        
        クライアント->>IF: GET /w/{workspace}/mindstella.html
        IF-->>クライアント: 302、Location: /w/{workspace}/
        クライアント->>IF: GET /w/{workspace}/spa/?tab=decisions&id=D-1
        IF-->>クライアント: 302、Location: /w/{workspace}/?tab=decisions&id=D-1
      ```
    expected:
      - 3 つともステータスが 302
      - '`/w/{workspace}` と `/w/{workspace}/mindstella.html` の `Location` が `/w/{workspace}/`'
      - '`/w/{workspace}/spa/?tab=decisions&id=D-1` の `Location` が `/w/{workspace}/?tab=decisions&id=D-1`'
    test: test_normal_when_old_path
  - name: 異常系（接続先が違う・403）
    summary: Host が端末の中の名前でなければ画面を返さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`Host: attacker.example:{ポート}` を付けて `/w/{workspace}/` と `/w/{workspace}/assets/{名前}.js` を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/

        クライアント->>IF: GET /w/{workspace}/（Host: attacker.example）
        IF-->>クライアント: 403
      ```
    expected:
      - どちらもステータスが 403
      - 本文に HTML と JavaScript が無い
    test: test_error_when_host_mismatch
  - name: 異常系（無いパス・404）
    summary: 決めたパス以外は 404 を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`/config.yaml` と、出力のフォルダの外を指す `/w/{workspace}/assets/../config.yaml`（`..` を正規化せずに送信する）を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信
        
        クライアント->>IF: GET /config.yaml
        IF-->>クライアント: 404
        クライアント->>IF: GET /w/{workspace}/assets/../config.yaml
        IF-->>クライアント: 404
      ```
    expected:
      - どちらもステータスが 404
      - 本文に `config.yaml` の中身が無い
    test: test_error_when_path_unknown
  - name: 正常系（許可したホスト名）
    summary: 許可したホスト名の `Host` は、入口のポートを問わず画面を返す
    setup:
      - name: Mock
        description: なし（`MINDSTELLA_ALLOWED_HOSTS` を `preview.example.test` にして MCP サーバーを立て、`preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`Host: preview.example.test` と `Host: PREVIEW.example.test:8443` の 2 回つなぐ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/

        クライアント->>IF: GET /w/{workspace}/（Host: preview.example.test）
        IF-->>クライアント: 200、HTML
        クライアント->>IF: GET /w/{workspace}/（Host: PREVIEW.example.test:8443）
        IF-->>クライアント: 200、HTML
      ```
    expected:
      - どちらもステータスが 200 で、`Content-Type` が `text/html; charset=utf-8`
      - '`Host: other.example.test` でつなぐと 403'
    test: test_normal_when_host_allowed
  - name: 異常系（配っていないワークスペース・404）
    summary: 配っていないワークスペース（知らない ID・削除したワークスペース）の ID を指すと、画面も記録も返さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL のオリジンへ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませたワークスペース A と、作成した後に『ワークスペースの削除』で削除したワークスペース B（フォルダは残す）
        notes: '`/w/mindstella-unknown-000000/`・`/w/{B の ID}/`・`/w/{B の ID}/api/records` を GET する'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as 配信

        クライアント->>IF: GET /w/{知らない ID}/
        IF-->>クライアント: 404
        クライアント->>IF: GET /w/{B の ID}/api/records
        IF-->>クライアント: 404
      ```
    expected:
      - 3 つともステータスが 404 で、`Content-Type` が `application/problem+json`
      - 本文に B の記録が無い
      - A の `/w/{A の ID}/` は 200 のまま
    test: test_error_when_workspace_not_served
  - name: 異常系（出力が無い・500）
    summary: ビルドの出力のフォルダに `index.html` が無いとき、画面を返さない
    setup:
      - *id001
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: 配信が読む出力のフォルダを、`index.html` を置かない一時フォルダに差し替えて `/w/{workspace}/` を GET する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/
        
        クライアント->>IF: GET /w/{workspace}/
        IF-->>クライアント: 500、problem+json
      ```
    expected:
      - ステータスが 500 で、`Content-Type` が `application/problem+json`
    test: test_error_when_index_missing
  - name: 正常系（公開 URL のホストで開く）
    summary: preview.public_url のホスト名を Host に持つ要求を受け付ける
    setup:
      - name: Mock
        description: 'なし（ホームの設定に `preview.public_url: https://preview.example.test` を記載し、`MINDSTELLA_ALLOWED_HOSTS` を空にして MCP サーバーを立て、`preview_url` を呼び、返った URL のパスへ `Host: preview.example.test` で HTTP のクライアントでつなぐ）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /w/{workspace}/

        クライアント->>IF: GET（Host: preview.example.test）
        IF-->>クライアント: 200
      ```
    expected:
      - ステータスが 200 で、画面の HTML が返る
    test: test_normal_when_public_url_host
lead: '常駐サーバーが、配っているワークスペース（制約「配るワークスペース」）のプレビューの画面（React の画面のビルドの出力の `index.html`）を `/w/{workspace}/` で、出力の静的なファイルを `/w/{workspace}/assets/` の下で返す。`/w/{workspace}`・`/w/{workspace}/mindstella.html`・`/w/{workspace}/spa`（`/w/{workspace}/spa/{path}` を含む）は search を残して `/w/{workspace}/` へ再送信する。記録は画面が『記録の取得』で読む。'
idempotent: true
side_effects: なし（読むだけ）
callers:
  - IF-489-70#
request:
  - name: path
    type: str
    required: false
    default: なし（`/w/{workspace}/` は `index.html` を返す）
    location: path
    description: '`/w/{workspace}/assets/` より後ろの、出力の静的なファイルの名前'
    constraints: 出力のフォルダの外を指すパスは 404 にする
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '`127.0.0.1:{常駐サーバーのポート}`・`localhost:{常駐サーバーのポート}` か、ポートを外したホスト名の部分が許可するホスト名のどれかと同じもの（制約「接続先の確認」）'
response:
  - name: 本文
    type: text/html / text/javascript / text/css / image/svg+xml
    description: '`plugins/mindstella/skills/mindmap/preview/spa/` の `index.html`（`/` のとき）か、`assets/` の下のファイルの中身'
  - name: Content-Type
    type: str
    description: 拡張子から決める。`.html` は `text/html; charset=utf-8`、`.js` は `text/javascript; charset=utf-8`、`.css` は `text/css; charset=utf-8`、`.svg` は `image/svg+xml`。表に無い拡張子は `application/octet-stream`
  - name: Cache-Control
    type: str
    description: '`no-store`（プラグインを上げた後に古い画面を読ませない）'
status_codes:
  - code: '200'
    condition: 画面を返せた
  - code: '302'
    condition: '`/w/{workspace}`・`/w/{workspace}/mindstella.html`・`/w/{workspace}/spa`（`/w/{workspace}/spa/{path}` を含む）を開いた'
    notes: '`Location: /w/{workspace}/`。search があれば残す'
  - code: '403'
    condition: '`Host` が制約「接続先の確認」に合わない'
    notes: 本文は返さない
  - code: '404'
    condition: '`{workspace}` が配っているワークスペースの ID でない（知らない ID・削除したワークスペース）。または `/w/{workspace}/`・`/w/{workspace}/mindstella.html`・`/w/{workspace}/spa`（`/w/{workspace}/spa/{path}` を含む）・`/w/{workspace}/assets/{path}`（出力のフォルダの中のファイル）・`/w/{workspace}/api/records`・`/w/{workspace}/api/events`・`/w/{workspace}/api/comments`（`/w/{workspace}/api/comments/{id}`・`/w/{workspace}/api/comments/send` を含む）・`/w/{workspace}/api/drafts`・`/w/{workspace}/api/config/display`・`/w/{workspace}/api/presets`・`/w/{workspace}/api/config/reload` 以外のパス'
  - code: '500'
    condition: 出力のフォルダに `index.html` が無い（同梱の誤り）
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 待ち受け
    constraint: '常駐サーバーが `127.0.0.1` の `MINDSTELLA_PORT` で待ち受ける経路だけ（『プレビューの URL』）'
    decided_by: NFR-489-1#requirements[待ち受けの範囲]
  - item: 接続先の確認
    constraint: '全てのパスで `Host` を確かめ、合わなければ 403 を返す（別のサイトがこの端末の名前を名乗って配信を読む DNS の付け替えを防ぐ）。受けるのは `127.0.0.1:{常駐サーバーのポート}`・`localhost:{常駐サーバーのポート}` と、ポートを外したホスト名の部分が許可するホスト名（『設定: サーバー』の `MINDSTELLA_ALLOWED_HOSTS`）のどれかと同じもの。比べるときは大文字と小文字を区別しない。許可するホスト名は入口のポートを問わない（トンネル・リバースプロキシが転送したものしか `127.0.0.1` に届かないため）'
  - item: 読み込むファイル
    constraint: 返す HTML は、出力のフォルダの中のファイルと、Google Fonts の文字だけを読む。描画のライブラリは画面が『プレビューを開く』の制約「描画のライブラリ」のとおりに読む
  - item: 通信
    constraint: 配信は、制約「mdmark の ref の解決」の GitHub の API への問い合わせと jsDelivr への配布物の確認のほかは外へ通信しない
  - item: 送信元の確認
    constraint: 書き込むエンドポイントは、`Origin` が付いていれば確かめ、合わなければ 403 を返す（別のサイトのページからの書き込みを防ぐ）。受けるのは `http://127.0.0.1:{常駐サーバーのポート}`・`http://localhost:{常駐サーバーのポート}` と、スキームが `https` か `http` で、ポートを外したホスト名の部分が許可するホスト名のどれかと同じもの。`Origin` が無い要求（HTTP のクライアントからの要求）は通す
  - item: mdmark の ref の解決
    constraint: 'ワークスペースの設定の `mdmark.version` がタグのときはタグを、`latest` か無いときは mdmark の develop の先頭の commit の SHA（40 文字の 16 進）を mdmark の ref にする。SHA は外部 API『GitHub』で問い合わせ、常駐サーバーの中で 150 秒保持し、保持している間は問い合わせない。1 回の問い合わせは、接続を 11 秒、読み取りを 2 秒まで待ち、再取得しない。問い合わせた SHA が保持している SHA と違うときは、jsDelivr にその SHA の `dist/index.js` を画面と同じ GET に `Range: bytes=0-0` を付けて 1 回要求し（接続を 1 秒、読み取りを 2 秒まで待ち、本文は読まない）、200 か 206 のときだけその SHA を ref にする。200 も 206 でもないとき（新しい commit を jsDelivr がまだ配らず 403 を返す間など）は、問い合わせられないときと同じく扱う。問い合わせられないとき（届かない・200 以外・SHA の形式でない・jsDelivr が配らない）は、前に問い合わせた SHA があればそれを、無ければ `develop` を ref にし、標準エラーに 1 行記録して、問い合わせられなかったことも 150 秒保持する。develop に新しい commit が入った後の最初の 1 回は、画面を返すまでに問い合わせ（最大 13 秒）と確認（最大 3 秒）で最大 16 秒待つ。外部 API『GitHub』が上限を超えた応答を返したときは、その応答が示す時刻まで問い合わせない。問い合わせる基点の URL（既定は `https://api.github.com`）と配布物を確かめる jsDelivr の基点の URL（既定は `https://cdn.jsdelivr.net`）は常駐サーバーの定数に持ち、結合テストは文字起こしのテストと同じく、常駐サーバーを起動するときに `sitecustomize` で定数を差し替えて偽のサーバーへ向ける。『記録の取得』の `mdmark_ref` と『配る書き出し』も、同じ ref を使用する'
    notes: '150 秒: GitHub の API の認証なしの上限 60 回/時 ÷ 同じ端末で問い合わせる数 2（常駐サーバー・Storybook）× 安全率 0.8 = 24 回/時。接続 11 秒・読み取り 2 秒: 2026-11-19 に認証つきで同じエンドポイントを 1,000 回呼んだ実測（200 が 999 回、30 秒でも接続できなかったのが 1 回）で、接続の p99.9 が 7.10 秒、読み取り（応答の終了まで − 接続）の p99.9 が 1.17 秒。それぞれに余裕 50% を加え、秒に切り上げた。認証のあり・なしで応答の時間は変わらない前提を置く。commit を指す jsDelivr の URL は `cache-control: immutable` で中身が変わらないため、ブラウザ・CDN のキャッシュが更新前の配布物を返さない。jsDelivr の確認: 2026-11-19 に mdmark の develop の先頭の commit（`aadba7dd`。push の約 15 分後）の `dist/index.js` が「Package size exceeded the configured limit of 50 MB」の 403 を返し、約 4 分後には同じ URL が 200 を返した。配らない commit を ref にすると画面が mdmark を読めず本文を描けないため、確かめてから切り替える。403 を見たのは画面と同じ GET なので、確認も GET で行い、`Range: bytes=0-0` で本文を減らす（jsDelivr は 1,000 回のうち 998 回を 200、2 回を 206 で返したため、どちらも配っていると判定する）。jsDelivr の接続 1 秒・読み取り 2 秒: 2026-11-19 に配っている commit（`05a79a26`）の `dist/index.js` を `Range: bytes=0-0` の GET で 1,000 回要求した実測（全て 200 か 206）で、接続の p99.9 が 0.038 秒、読み取り（応答の終了まで − 接続）の p99.9 が 1.30 秒。それぞれに余裕 50% を加え、秒に切り上げた'
  - item: ワークスペースの区別
    constraint: 画面と画面が呼ぶ全ての経路（この画面・『ワークスペースのファイルの配信』・`/api/*`）は `/w/{workspace}/` を先頭に持ち、`{workspace}`（『プレビューの URL』の制約「画面のパス」）で指したワークスペースだけを読み書きする。別のワークスペースの記録・ファイル・書き換えの通知を返さず、別のワークスペースへ書かない。`/w/` の外は、常駐サーバーの MCP（`/mcp`）と MindStella の API（`/workspaces`・`/_admin`）だけを持ち、画面を返さない
  - item: 配るワークスペース
    constraint: 常駐サーバーの状態のワークスペースの ID の一覧（ER 図『常駐サーバーの状態』）にあるワークスペース（クローズしたものを含む）を、常駐サーバーが起動したときから配る。『ワークスペースの作成』で一覧に加わったワークスペースは作成の時点から配り、『ワークスペースの削除』で一覧から外れたら配るのをやめる。一覧に無いフォルダは、`preview_url` を呼んだときからそのプロセスが終わるまで配る。配り始める前に `config.yaml` をスキーマと突き合わせ（『プレビューの URL』の制約「起動時の検査」と同じ）、合わないワークスペースは配らずに標準エラーへ 1 行記録する（`preview_url` で検査に通った時点から配る）。配り始めたときに起動時のフックを 1 回呼び（『プレビューの URL』の制約「起動時のフック」）、直下の README を画面の URL で書き直す（同じく制約「README の更新」）
  - item: 出力フォルダの外部にあるファイル
    constraint: '`assets/` の下のパスを解決した後に出力のフォルダの配下にあることを確かめ、外を指すときは 404 を返す'
  - item: 公開 URL のホスト
    constraint: 設定『サーバー』の `preview.public_url` があれば、そのホスト名も制約「接続先の確認」の許可するホスト名に加える（`MINDSTELLA_ALLOWED_HOSTS` に重ねて記載しなくても、通知の URL を開ける）
refs:
  - IF-489-17#
  - IF-489-70#
  - API-591-1#
test_file: tests/integration/server/test_preview_serve.py

id: IF-565-2
title: 前回参照した時点の更新
entry:
  kind: endpoint
  value: POST `/_admin/sessions/{session}/read_point`
lead: MindStella のセッションの SessionStart のフックが、『再開の状況』の注入文を標準出力に書き終えた後に呼び、前回参照した時点を『再開の状況』が返した通し番号に進め、知らせた移し替えの報告を消す。
idempotent: true
side_effects: 状態のフォルダの `workspaces/{ワークスペースの ID}/read_point.json` の `read_seq` を `until_seq` に書き換え、`migration` で知らせた移し替えの報告を状態のフォルダから消す。ワークスペースの記録は書き換えない
request:
  - name: session
    type: str
    required: true
    location: path
    description: MindStella のセッションの ID（フックが `MINDSTELLA_SESSION` から入れる）
  - name: until_seq
    type: int
    required: true
    location: body
    description: 『再開の状況』の応答の `until_seq`
  - name: Host
    type: str
    required: true
    location: header
    description: 要求のホスト
response:
  - name: read_seq
    type: int
    description: 書き換えた後の前回参照した時点
status_codes:
  - code: '200'
    condition: 書き換えた（今の `read_seq` が `until_seq` 以上で書き換えなかったときも 200）
  - code: '400'
    condition: '`until_seq` が無いか、0 未満か、`changes.yaml` の `last_seq` より大きい'
  - code: '403'
    condition: '`Host` が受ける値でない'
  - code: '404'
    condition: '`session` が状態に無い'
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 受ける Host
    constraint: 『MindStella のセッションの出来事の受け取り』と同じ（D-304・D-340）
  - item: 戻さない
    constraint: 今の `read_seq` が `until_seq` 以上なら書き換えない（`changes_since_read` が先に進めた時点を戻さない）。読むのと書き換えるのをワークスペースごとの鍵の中で行う
  - item: 移し替えの報告
    constraint: 『再開の状況』が `migration` を返した後に、この呼び出しで消す。呼ばれなければ、次の『再開の状況』がもう一度返す
flows:
  - name: 正常系
    summary: until_seq まで前回参照した時点を進め、移し替えの報告を消す
    setup:
      - name: Mock
        description: なし（HTTP のクライアントで送る）
      - name: 常駐サーバー
        description: 常駐サーバー（テストを動かす Python で子プロセスとして起動する。`MINDSTELLA_PORT` は空きポート、`XDG_STATE_HOME` はテストごとの一時フォルダ）
      - name: make_workspace
        description: '`read_seq` が 3、`last_seq` が 5 で、知らせていない移し替えの報告を持つワークスペースと MindStella のセッション'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/read_point
        participant ST as 状態のフォルダ

        クライアント->>API: until_seq: 5
        API->>ST: read_seq を 5 に書き、移し替えの報告を消す
        API-->>クライアント: 200 read_seq: 5
      ```
    expected:
      - 応答が 200 で `read_seq` が 5
      - '`read_point.json` の `read_seq` が 5 で、状態のフォルダに移し替えの報告が無い'
    test: test_normal
  - name: 正常系（先に進んでいる）
    summary: 今の read_seq が until_seq 以上なら書き換えない
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: make_workspace
        description: '`read_seq` が 5、`last_seq` が 5 のワークスペースと MindStella のセッション'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/read_point

        クライアント->>API: until_seq: 3
        API-->>クライアント: 200 read_seq: 5
      ```
    expected:
      - 応答が 200 で `read_seq` が 5
      - '`read_point.json` の `read_seq` が 5 のまま'
    test: test_normal_when_already_ahead
  - name: 異常系（通し番号を超える・400）
    summary: until_seq が last_seq より大きいと 400 を返し、何も書かない
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 正常系と同じ
      - name: make_workspace
        description: '`read_seq` が 3、`last_seq` が 5 のワークスペースと MindStella のセッション'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/read_point

        クライアント->>API: until_seq: 9
        API-->>クライアント: 400
      ```
    expected:
      - 応答が 400 で、`read_point.json` の `read_seq` が 3 のまま
    test: test_error_when_beyond_last_seq
  - name: 異常系（知らない MindStella のセッション・404）
    summary: 状態に無い session には 404 を返し、何も書かない
    setup:
      - name: Mock
        description: なし
      - name: 常駐サーバー
        description: 正常系と同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant API as POST /_admin/sessions/{session}/read_point

        クライアント->>API: 状態に無い session
        API-->>クライアント: 404
      ```
    expected:
      - 応答が 404 で、状態のフォルダが変わっていない
    test: test_error_when_unknown_session
callers:
  - IF-531-7#
refs:

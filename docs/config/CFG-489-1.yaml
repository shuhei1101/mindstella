id: CFG-489-1
title: "設定: サーバー"
lead: 起動スクリプトと常駐の MCP サーバーが読む環境変数と、mindstella のホームの設定 `${XDG_CONFIG_HOME:-~/.config}/mindstella/settings.yaml`。
settings:
  - key: MINDSTELLA_VENV
    title: 仮想環境のフォルダ
    file: 環境変数
    type: str
    required: false
    default: ~/.mindmap/venv
    description: 常駐サーバーを動かす仮想環境のフォルダ。『常駐サーバーの起動の確認』と起動スクリプトが依存の確認に使い、その Python で常駐サーバーを起動する
    env_var: MINDSTELLA_VENV
    reload: restart
    status: implemented
    visibility: user
    refs:
      - IF-489-56#
      - IF-489-27#
      - IF-489-38#
  - key: MINDSTELLA_PORT
    title: 常駐サーバーのポート
    file: 環境変数
    type: int
    required: false
    default: '8784'
    description: 常駐サーバーが `127.0.0.1` で待ち受けるポート。常駐サーバーが起動時に読み、プラグインの `.mcp.json` の `url` と『常駐サーバーの起動の確認』も同じ値を使う
    missing: 8784 で待ち受ける
    env_var: MINDSTELLA_PORT
    reload: restart
    allowed: 1〜65535 の整数（違えば常駐サーバーが InvalidPortError で終わる）
    reason: 端末で別のサービスが 8784 を使っているときに変えるため。Claude Code と常駐サーバーが同じ値を読む必要があり、ワークスペースの `config.yaml` には置かない
    status: planned
    visibility: user
    refs:
      - IF-489-1#
      - IF-489-38#
      - IF-489-68#
    introduced:
      pr: 392
  - key: CLAUDE_CONFIG_DIR
    title: Claude Code の設定のフォルダ
    file: 環境変数
    type: str
    required: false
    default: なし（Claude Code の既定の設定のフォルダ）
    description: あれば起動スクリプトが tmux のセッションへ `new-session -e` で渡し、`claude plugin list --json` もそのフォルダで引く。起動のコマンドは、この値を『MindStella のセッションの作成』の `claude_config_dir` に渡す（claude-balancer がある端末では `exec --account` でそのアカウントを借り、無い端末では MindStella のセッションの `CLAUDE_CONFIG_DIR` になる）
    env_var: CLAUDE_CONFIG_DIR
    reload: restart
    status: implemented
    visibility: user
    refs:
      - IF-489-56#
      - IF-531-2#
  - key: MINDSTELLA_ALLOWED_HOSTS
    title: 許可するホスト名
    file: 環境変数
    type: str
    required: false
    default: なし（`127.0.0.1` と `localhost` だけを受ける）
    description: プレビューの配信が `Host` と `Origin` で受ける外のホスト名。トンネル・リバースプロキシの内側で、端末の外から開くときに設定する。常駐サーバーを起動した環境から読む
    missing: 外のホスト名を受けない（今と同じ動き）
    env_var: MINDSTELLA_ALLOWED_HOSTS
    reload: restart
    allowed: ホスト名をカンマで区切ったもの（例 `preview.example.com,notes.example.com`）。前後の空白は外し、大文字と小文字を区別しない。スキーム・ポート・`/` を含む要素と空の要素は使わず、常駐サーバーが起動するときに標準エラーへ記録する
    reason: 待ち受けは `127.0.0.1` のままで、外から開く画面の認証は外の入口に任せる。端末ごとに決まる値のため、ワークスペースの `config.yaml` には置かない
    status: implemented
    visibility: user
    refs:
      - IF-489-18#
      - IF-489-56#
    introduced:
      pr: 155
  - key: MINDSTELLA_PREVIEW_START_HOOK
    title: 配信を立てたときのフック
    file: 環境変数
    type: str
    required: false
    default: なし（何も呼ばない）
    description: プレビューの配信を立てた直後に呼ぶコマンド。末尾に配信のポートとワークスペースの名前（フォルダの名前）を引数で追加して呼ぶ（例 `pub add` なら `pub add 47800 家計簿`）。外の入口へポートを登録するのに使う。常駐サーバーを起動した環境から読む
    missing: 呼ばない
    env_var: MINDSTELLA_PREVIEW_START_HOOK
    reload: restart
    allowed: シェルの書き方で区切ったコマンドと引数（`shlex.split` で分け、シェルを通さずに呼ぶ）
    reason: コマンドを動かす値のため、ワークスペースと一緒に他の端末へ渡る `config.yaml` には置かない
    status: implemented
    visibility: user
    refs:
      - IF-489-17#
      - IF-489-56#
    introduced:
      pr: 155
  - key: MINDSTELLA_PREVIEW_STOP_HOOK
    title: 配信を止めるときのフック
    file: 環境変数
    type: str
    required: false
    default: なし（何も呼ばない）
    description: 常駐サーバーが終わるときに、立てた配信ごとに呼ぶコマンド。末尾に起動時と同じポートとワークスペースの名前を引数で追加して呼ぶ（例 `pub rm` なら `pub rm 47800 家計簿`）。外の入口からポートの登録を削除するのに使う。常駐サーバーを起動した環境から読む
    missing: 呼ばない
    env_var: MINDSTELLA_PREVIEW_STOP_HOOK
    reload: restart
    allowed: '`MINDSTELLA_PREVIEW_START_HOOK` と同じ'
    reason: '`MINDSTELLA_PREVIEW_START_HOOK` と同じ'
    status: implemented
    visibility: user
    refs:
      - IF-489-1#
      - IF-489-56#
    introduced:
      pr: 155
  - key: MINDSTELLA_TRANSCRIBER
    title: 文字起こしのサービス
    file: 環境変数
    type: str
    required: false
    default: voice-paste
    description: 『音声の文字起こし』『文字起こしの可否』が使う文字起こしのインターフェースの実装。今は `voice-paste` だけ
    missing: '`voice-paste` を使う'
    env_var: MINDSTELLA_TRANSCRIBER
    reload: restart
    allowed: '`voice-paste`（違えば常駐サーバーが起動時に InvalidTranscriberError で終わる）'
    reason: 配信の処理を文字起こしのサービスに直接依存させず、別のサービスへ切り替えられるようにするため（PR #476 の確認ログ）。端末に 1 つのサービスを選ぶ値で、ワークスペースの `config.yaml` には置かない
    status: planned
    visibility: user
    refs:
      - IF-489-58#
      - IF-489-41#
  - key: MINDSTELLA_TRANSCRIBER_URL
    title: 文字起こしのサービスの URL
    file: 環境変数
    type: str
    required: false
    default: http://127.0.0.1:47823
    description: 文字起こしのサービスの待ち受けの URL（スキームとホストとポート）。既定は voice-paste の既定の待ち受け
    missing: '`http://127.0.0.1:47823` へつなぐ'
    env_var: MINDSTELLA_TRANSCRIBER_URL
    reload: restart
    allowed: '`http://127.0.0.1:{ポート}` か `http://localhost:{ポート}`（違えば常駐サーバーが起動時に InvalidTranscriberError で終わる）'
    reason: サービスの待ち受けのポートは端末ごとに変えられるため。voice-paste は Host が `127.0.0.1`・`localhost` の Origin の無い要求だけを受けるため、ほかのホストを受けない
    status: planned
    visibility: user
    refs:
      - IF-489-58#
      - IF-489-41#
      - API-489-2#
  - key: mindstella.allowed_dirs
    title: 許可するフォルダ
    file: グローバルの設定のファイル（project-index の `GET /settings/sources` の `settingsPath`）
    type: list[str]
    required: false
    default: なし（どのフォルダにもワークスペースを作れない）
    description: ワークスペースを作ってよいフォルダの絶対パスの並び。『ワークスペースの作成』は、渡されたフォルダがこのどれかの下でなければ断る
    reload: immediate
    status: planned
    visibility: user
    refs:
      - IF-531-1#
    notes:
      補足: project-index は最上位の知らないキーを警告にして読み込みを続ける（shuhei1101/project-index#11）。作成のたびにファイルを読む
  - key: PROJECT_INDEX_PORT
    title: project-index のポート
    file: 環境変数
    type: str
    required: false
    default: '8786'
    description: 常駐サーバーが配信元の行の登録・変更とグローバルの設定のファイルの場所の取得に呼ぶ project-index のポート
    env_var: PROJECT_INDEX_PORT
    reload: restart
    status: planned
    visibility: user
    refs:
      - IF-531-1#
      - IF-531-5#
    notes:
      補足: project-index と同じ環境変数を読む
  - key: XDG_STATE_HOME
    title: 状態のフォルダの親
    file: 環境変数
    type: str
    required: false
    default: ~/.local/state
    description: 常駐サーバーの状態のフォルダ `{XDG_STATE_HOME}/mindstella/` の親
    env_var: XDG_STATE_HOME
    reload: restart
    status: planned
    visibility: user
    refs:
      - IF-489-1#
    notes:
      補足: テストは一時フォルダを渡す（利用者の状態に触れない）
  - key: MINDSTELLA_SESSION
    title: MindStella のセッションの ID
    file: 環境変数
    type: str
    required: false
    default: なし（通常のセッション）
    description: セッションの管理が MindStella のセッションを起動するときに渡す、MindStella のセッションの ID。『MindStella のセッションのフック』は、これがあるセッションでだけ動く
    env_var: MINDSTELLA_SESSION
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-531-2#
      - IF-531-7#
  - key: MINDSTELLA_WORKSPACE
    title: MindStella のセッションのワークスペースの ID
    file: 環境変数
    type: str
    required: false
    default: なし（通常のセッション）
    description: セッションの管理が MindStella のセッションを起動するときに渡す、ワークスペースの ID
    env_var: MINDSTELLA_WORKSPACE
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-531-2#
  - key: MINDSTELLA_FLOW
    title: 進め方の文書の場所
    file: 環境変数
    type: str
    required: false
    default: なし（進め方の文書を持たない）
    description: セッションの管理が、起動のたびにワークスペースの設定の進め方の文書から作って渡す `{配信元の ID}#{文書の ID}`。『MindStella のセッションのフック』の SessionStart が注入する
    env_var: MINDSTELLA_FLOW
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-531-2#
      - IF-531-7#
  - key: MINDSTELLA_SESSION_READY_TIMEOUT
    title: MindStella のセッションの準備を待つ上限の秒数
    file: 環境変数
    type: str
    required: false
    default: 非機能要件『MindStella のセッションの準備を待つ上限』の値
    description: 『MindStella のセッションの作成』が SessionStart のフックの登録を待つ秒数を上書きする
    env_var: MINDSTELLA_SESSION_READY_TIMEOUT
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-531-2#
    notes:
      補足: 結合テストが短くするために使う
  - key: MINDSTELLA_STOP_WAIT_TIMEOUT
    title: 最後の書き込みを待つ上限の秒数
    file: 環境変数
    type: str
    required: false
    default: 非機能要件『最後の書き込みを待つ上限』の値
    description: 『MindStella のセッションの停止』が応答の終わりを待つ秒数を上書きする
    env_var: MINDSTELLA_STOP_WAIT_TIMEOUT
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-531-4#
    notes:
      補足: 結合テストが短くするために使う
  - key: MINDSTELLA_DISCORD_WEBHOOK_FILE
    title: Discord の Webhook の設定のファイル
    file: 環境変数
    type: str
    required: false
    default: なし（通知しない）
    description: 『作業の完了の通知』が送信する Discord の Webhook の URL を 1 行目に記載したファイルの絶対パス。常駐サーバーを起動した環境から参照し、ファイルは送信のたびに参照する
    missing: 通知しない。ファイルが無い・1 行目が `http://` か `https://` で始まらないときも通知しない
    env_var: MINDSTELLA_DISCORD_WEBHOOK_FILE
    reload: restart
    allowed: ファイルのパス。中身の差し替えは再起動せずに有効になる
    reason: Webhook の URL はそれ自体が資格情報なので、環境変数にもリポジトリにも `config.yaml` にも配置せず、利用者が用意したファイルの場所だけを指定する
    status: planned
    visibility: user
    refs:
      - IF-568-1#
    introduced:
      pr: 569
  - key: MINDSTELLA_LAUNCH_REASON
    title: 起動の契機
    file: 環境変数
    type: str
    required: false
    default: なし（圧縮でない起動）
    description: 『MindStella のセッションの再起動』が圧縮の契機で起動するときに `compact` で渡す。『MindStella のセッションのフック』の SessionStart が、`source` が `startup` でも再開として注入する
    env_var: MINDSTELLA_LAUNCH_REASON
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-582-1#
      - IF-531-7#
  - key: MINDSTELLA_CRASH_WATCH_INTERVAL
    title: 落ちたことを見回る間隔の秒数
    file: 環境変数
    type: str
    required: false
    default: 非機能要件『落ちたことを見回る間隔』の値
    description: 『落ちたことの見回り』の間隔の秒数を上書きする
    env_var: MINDSTELLA_CRASH_WATCH_INTERVAL
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-582-2#
    notes:
      補足: 結合テストが短くするために使う
  - key: claude_balancer.url
    title: claude-balancer の常駐の待ち受け先
    file: ~/.config/mindstella/settings.yaml
    type: str
    required: false
    default: http://127.0.0.1:8770
    description: 常駐サーバーが、使用中のアカウントの利用枠を確かめるのに `GET /accounts` を呼ぶ claude-balancer の常駐の待ち受け先。常駐サーバーが起動時に読み、MindStella のセッションを起動するときに `respawn-pane -e` で環境変数 `CLAUDE_BALANCER_URL` に渡して、ペインの中の `claude-balancer exec` も同じ値を使う。キーが無いときは渡さない
    missing: '`http://127.0.0.1:8770` へつなぐ。ペインには `CLAUDE_BALANCER_URL` を渡さない'
    reload: restart
    status: planned
    visibility: user
    refs:
      - IF-582-1#
      - IF-531-2#
      - IF-616-1#
    allowed: '`http://` か `https://` で始まる URL（違えば常駐サーバーが起動時に InvalidSettingsError で終わる）'
    reason: '端末ごとに変わる値なので、ホームの設定に置く（PR #616 の確認ログ）'
    introduced:
      pr: 616
  - key: MINDSTELLA_USAGE_WATCH_INTERVAL
    title: 利用枠を見回る間隔の秒数
    file: 環境変数
    type: str
    required: false
    default: 非機能要件『利用枠を見回る間隔』の値
    description: 使用中のアカウントの利用枠を見回る間隔の秒数を上書きする
    env_var: MINDSTELLA_USAGE_WATCH_INTERVAL
    reload: restart
    status: planned
    visibility: developer
    refs:
      - IF-582-1#
      - IF-616-1#
    notes:
      補足: 結合テストが短くするために使う
  - key: account.release_on_limit
    title: 指定したアカウントの自動解除
    file: ~/.config/mindstella/settings.yaml
    type: bool
    required: false
    default: 'true'
    description: アカウントを指定して起動した MindStella のセッションで、指定したアカウントが利用上限に達した・利用枠がしきい値以上になった・借りられなかったときに、指定を解除して自動で選んだアカウントへ切り替えるか。`false` のときは指定したアカウント以外では再起動しない
    missing: 指定を解除して切り替える
    reload: restart
    allowed: '`true` か `false`（違えば常駐サーバーが起動時に InvalidSettingsError で終わる）'
    reason: '指定したアカウント以外を使わせたくない端末のためにオフにできるようにする（PR #616 の確認ログ）'
    status: planned
    visibility: user
    refs:
      - IF-582-1#
      - IF-616-1#
    introduced:
      pr: 616
files:
  - file: ~/.config/mindstella/settings.yaml
    manages: claude-balancer の常駐の待ち受け先と、指定したアカウントの自動解除
    notes: '`XDG_CONFIG_HOME` があれば `${XDG_CONFIG_HOME}/mindstella/settings.yaml` を読む。常駐サーバーが起動時に 1 回だけ読む。ファイルが無ければ全てのキーを既定値として扱う。YAML として読めないときと、最上位がマッピングでないときは、常駐サーバーが起動時に InvalidSettingsError で終わる。知らないキーは標準エラーへ記録して読み飛ばし、起動を続ける。Git の外に置き、利用者が作る（常駐サーバーは作らない）'

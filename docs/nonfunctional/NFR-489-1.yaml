    measurement: release ブランチで、voice-paste に 1 分の音声を続けて 2 件送信し、2 件目の状態と進み具合が変わらない最長の時間を測る。その 1.5 倍が上限を超えたら上限を見直す
    overflow: 打ち切って 504 を返す。画面は文字起こしできなかった旨を出し、入力欄の文字は残す。サービスのジョブは取り消さない（取り消す API が無い）

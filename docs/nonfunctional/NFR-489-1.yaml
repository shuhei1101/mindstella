  - id: NFR-30
    name: Webhook の送信を待つ上限
    english_name: discord_webhook_timeout
    category: 性能
    external_constraint: 接続できない場合は応答自体が返らない
    source_kind: 外部 API の制限
    source: API-568-1#endpoints[POST /webhooks/{webhook.id}/{webhook.token}]
    value: '10'
    unit: 秒（『作業の完了の通知』が Webhook へ 1 回送信し、応答を受けるまで）
    rationale: 送信は出来事の受け取りの応答を返却した後に `daemon` のスレッドで行うため、待つ間もフック・会話・常駐サーバーの停止は止まらない。上限が決めるのは送信のスレッドが同時に残る数だけで、通知は MindStella のセッションの 1 回の応答につき最大 1 件のため、上限を 1 回の応答の時間（非機能要件『最後の書き込みを待つ上限』の実測で中央値 314 秒）より十分短くすれば、同じ MindStella のセッションの送信のスレッドは重ならない。10 秒は中央値の 3% 以下で、同じ端末で同じ Webhook の API に送信する claude-balancer の決定値と同じ。下流（Discord の Webhook）の応答時間は実装の工程の動作確認で測り、p99.9 に余裕 50% を追加した値が 10 秒を超えたら見直す。次の応答の終わりで次の通知が届くため、再送信しない
    measurement: release ブランチで、常駐サーバーの標準エラーの送信の行から上限を過ぎた回数を数え、通知の 1% を超えたら見直す
    overflow: 上限を過ぎたら打ち切り、標準エラーに上限を過ぎたことを 1 行記録してその回を終える（Webhook の URL を含めない）
    refs:
      - IF-568-1#
  - id: NFR-31
    name: 落ちたことを見回る間隔
    english_name: crash_watch_interval
    category: 可用性
    external_constraint: 制限なし
    source_kind: ユーザー要望
    value: '60'
    unit: 秒（常駐サーバーが状態が起動中の MindStella のセッションを見回る間隔）
    rationale: '見回りは落ちたことの Discord への通知の遅れだけを決め、再起動はコメントが届いたときに見回りと関係なく行う。下流の制約は無く、利用者が落ちたことの通知を待てる時間で決まるため、利用者が 60 秒に決めた（PR #582 の確認ログ）。見回り 1 回は起動中のワークスペースごとに tmux の `display-message` と `/proc` の読み取りだけで、端末の負荷にならない'
    measurement: 利用者が、落ちたことの通知が遅いと感じたら見直す
    overflow: 間隔の間に落ちたものは次の見回りで見つかる。その前に停止・コメントの送信が状態を読めば、そちらが先に落ちたことを記録する
    refs:
      - IF-582-2#
  - id: NFR-32
    name: 再起動で exec の終了を待つ上限
    english_name: restart_exec_exit_timeout
    category: 性能
    external_constraint: claude-balancer の `exec` が子プロセスの終了後に行う利用上限の到達の通知（30 秒まで）と返却（10 秒まで）の待ち（claude-balancer の IF-275-21）
    source_kind: 外部ライブラリの制限
    value: '75'
    unit: 秒（再起動でペインに `/exit` を貼ってから、`claude-balancer exec` が終わって tmux のセッションが閉じるまで）
    rationale: 入れ子の待ちの上限の和に余裕 50% を追加した。Claude Code の終了を待つ 10 秒（『MindStella のセッションの停止』の `/exit` の待ち）・`exec` の利用上限の到達の通知の応答を待つ 30 秒・返却の応答を待つ 10 秒の和 50 秒に、余裕 25 秒を追加して 75 秒
    measurement: release ブランチで、利用上限の契機の再起動を結合テストで流し、`/exit` から tmux のセッションが閉じるまでの時間を測る。claude-balancer の通知・返却の上限が変わったら見直す
    overflow: 上限を過ぎたら `kill-session` で閉じ、標準エラーに 1 行記録してから起動する。claude-balancer の通知か返却が済んでいないことがあるが、貸与は claude-balancer の回収で戻る
    breakdown:
      - part: Claude Code の終了の待ち
        value: 10 秒
        notes: 『MindStella のセッションの停止』の `/exit` の待ち
      - part: 利用上限の到達の通知
        value: 30 秒
        notes: claude-balancer の IF-275-21
      - part: 返却
        value: 10 秒
        notes: claude-balancer の IF-275-21
      - part: 余裕
        value: 25 秒
        notes: 規約『資源の値の決め方』の既定の 50%
    refs:
      - IF-582-1#
  - id: NFR-33
    name: 利用枠を見回る間隔
    english_name: usage_watch_interval
    category: レート制限
    external_constraint: claude-balancer が利用枠を取り込むのは 5 分ごとで、`GET /accounts` の消費率と貸せない理由はそれより短い間隔では変わらない
    source_kind: 外部ライブラリの制限
    source: https://github.com/shuhei1101/claude-balancer/blob/develop/docs/nonfunctional/NFR-275-1.yaml
    value: '60'
    unit: 秒（常駐サーバーが起動中の MindStella のセッションの使用中のアカウントの利用枠を `GET /accounts` で確かめる間隔）
    rationale: しきい値以上を見つける遅れは、claude-balancer の取り込みの間隔（5 分）とこの間隔の和で決まる。取り込みより短い間隔で確かめても値は変わらないが、取り込みの直後に見つけるために 5 分より十分短くし、遅れを最大 6 分にする。`GET /accounts` は claude-balancer の SQLite を読むだけで外の API を呼ばず、見回り 1 回につき 1 回なので、端末と claude-balancer の負荷にならない。非機能要件『落ちたことを見回る間隔』と同じ値にする
    measurement: 利用上限の契機（`rate_limit`）の再起動が、しきい値の契機より先に起きた回数を常駐サーバーの標準エラーで数え、利用者が多いと感じたら見直す
    overflow: 間隔の間に利用上限に達したときは、利用上限の契機（`rate_limit`）で再起動する
    refs:
      - IF-616-1#
  - id: NFR-34
    name: 利用枠の問い合わせを待つ上限
    english_name: usage_query_timeout
    category: 耐障害
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '5'
    unit: 秒（『利用枠の見回り』が `GET /accounts` を 1 回送信し、応答を受けるまで）
    rationale: '`GET /accounts` は claude-balancer の常駐が同じ端末の SQLite を読むだけなので、平常は 1 秒より十分短い。問い合わせは `daemon` の見回りのスレッドで行い、待つ間も他の処理は止まらない。上限は見回る間隔（60 秒）より十分短くし、見回りが重ならないようにする'
    measurement: 常駐サーバーの標準エラーの、上限を過ぎた記録の回数を数え、見回りの 1% を超えたら見直す
    overflow: 上限を過ぎたら打ち切り、その回は再起動せずに次の間隔を待つ（『利用枠の見回り』の例外）
    refs:
      - IF-616-1#
  - id: NFR-35
    name: 配る書き出しの取り直し
    english_name: export_fetch_retry
    category: 耐障害
    external_constraint: jsDelivr は一時的に 403 を返す（#672 で、書き出しの結合テスト 2 件が 403 で落ち、流し直すと通った。403 が続く時間は測っていない）。`Retry-After` を返すことは公開の仕様にない
    source_kind: 外部 API の制限
    source: https://github.com/shuhei1101/mindstella/issues/672
    value: 1 つの URL につき要求は最大 3 回（取り直しは 2 回）。間隔は 1 回目の後が 0〜1 秒、2 回目の後が 0〜2 秒の乱数（指数バックオフ + full jitter）。`Retry-After` があればその秒数を 10 秒を上限に待つ
    unit: 回・秒
    rationale: 規約『資源の値の決め方』のリトライに従い、取り直しは `fetch_url` の 1 層だけで、回数の上限を持つ指数バックオフ + ジッターにする。取るのは GET で冪等。403 が続く時間の実測が無いため、回数と間隔は `measurement` で見直す仮の値にする。取り直しで増える待ちは 1 つの URL につき、間隔が最大 20 秒（`Retry-After` が 2 回とも 10 秒。返らなければ最大 3 秒）と、要求 2 回分の待ち（1 回は接続に 30 秒、読み取り 1 回ごとに 30 秒。IF-489-57 の制約「待ちの上限」）。外側の待ち（MCP のツールの呼び出し）は、今も遅い回線で途切れない限り書き出し全体を打ち切らない作り（同じ制約の補足）で、取り直しによって新しく打ち切られることはない
    measurement: release ブランチで、書き出しの結合テストと E2E が jsDelivr の 403 で落ちた回数を数え、流した回数の 1% を超えたら回数と間隔を見直す
    overflow: 上限まで取れなければ `DownloadFailedError` で終え、書き出す先のファイルを書き換えない。利用者は `export` を呼び直す
    breakdown:
      - part: 要求の回数
        value: 3 回
        notes: 1 回目 + 取り直し 2 回
      - part: 1 回目の後の間隔
        value: 0〜1 秒
        notes: 基準 1 秒の full jitter
      - part: 2 回目の後の間隔
        value: 0〜2 秒
        notes: 基準を倍にした full jitter
      - part: '`Retry-After` の上限'
        value: 10 秒
        notes: 返ったときだけ従う
    refs:
      - IF-489-57#
lead: mindstella が外部の制約から逆算して決める値。

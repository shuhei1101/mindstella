    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '5400'
    unit: 秒（停止を受け付けてから、MindStella のセッションの応答が終わるまで）
    rationale: 下流（MindStella のセッションの 1 回の応答）の実測の p99.9 に余裕 50% を追加して切り上げた。実測は、この端末の話し合いのワークスペース（`/mnt/c/Users/shuhe/repo/tmp/何でも会話`）の全てのアカウントの会話の記録（jsonl 66 件）から、利用者の入力の行から、次の利用者の入力の前の最後のアシスタントの行までを 1 回の応答として引いた 3,267 回で、中央値 314 秒・p99 2,763 秒・p99.9 3,355 秒だった。応答の途中に 10 分を超える間（許可の確認や利用の上限で待った間）がある 286 回は除いた。3,355 + 1,678 = 5,033 秒を 5,400 秒（90 分）に切り上げた
    measurement: release ブランチで、会話の記録から 1 回の応答の時間を 1,000 回分以上引き、p99.9 の 1.5 倍が 5,400 秒を超えたら見直す
    overflow: 上限を過ぎたら止めずに `pending_write` を真にし、`status` を `running` に戻す。外部のアプリは停止を再依頼するか、強制を指定する。応答の途中に許可の確認で止まっている MindStella のセッションも、上限まで待つ
    refs:

      - part: 余裕
        value: 1,678 秒
        notes: 規約『資源の値の決め方』の既定の 50%
      - part: 切り上げ
        value: 5,400 秒
        notes: 5,033 秒を 90 分に切り上げた。停止の依頼はすぐに受け付けて返すので、待つ間も外部のアプリは止まらない

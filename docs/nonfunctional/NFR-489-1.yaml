id: NFR-489-1
title: "非機能要件"
requirements:
  - id: NFR-1
    name: Claude Code のバージョン
    english_name: claude_code_version
    category: 動作環境
    external_constraint: スキルを持つプラグインは 2.0.20 から読み込める。シェルの `claude plugin` のサブコマンドが入ったバージョンは CHANGELOG から引けない
    source_kind: 実行基盤の制限
    value: 2.1.287 以上
    rationale: 動かして確かめたバージョン。設計どおりのマニフェストで `claude plugin validate`・`marketplace add`・`install`・`list`・`uninstall`・`marketplace remove` が通ることを確かめた（https://github.com/shuhei1101/mindmap/pull/9#discussion_r4160895275）。これより古いバージョンは確かめていない
    source: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md#2020
  - id: NFR-2
    name: OS
    english_name: os
    category: 動作環境
    external_constraint: Claude Code が動く OS（macOS・Linux・Windows）
    source_kind: 実行基盤の制限
    value: Linux・Windows の WSL（どちらも systemd --user が使えること）
    rationale: 'スクリプトは標準ライブラリのファイル操作と PyYAML・jsonschema だけを使い、OS ごとの分岐を持たない。常駐サーバーは systemd --user のユニットとして動かすため、systemd --user が使えない端末（macOS・systemd を有効にしていない WSL）は外した（PR #531 の確認ログ。利用者が「今の環境で動けば ok」と決めた）。テストは Linux（WSL2 の Ubuntu 24.04）で流す'
    source: https://github.com/shuhei1101/mindmap/pull/12
    measurement: '実機での確認: Windows の WSL の端末で `check-env`・`init`・`add`・`build` を流す'
    overflow: Windows で、ほかのプロセスが開いている YAML を `os.replace` で置き換えようとすると失敗する。そのとき書き込みのコマンドはエラーで終わり、元のファイルは変わらない
  - id: NFR-3
    name: Python のバージョン
    english_name: python_version
    category: 動作環境
    external_constraint: PyYAML 5.1 以上・jsonschema 4.18.0 以上が動くバージョン
    source_kind: 外部ライブラリの制限
    value: 3.12 以上
    rationale: コーディング規約が 3.12 の書き方（PEP 695）を前提にし、既存のテスト（`tests/conftest.py`）も 3.12 の構文を使う。ライブラリが求めるバージョンより新しい側で揃える
    source: LIB-489-9#
    overflow: '仮想環境の Python が古ければ、依存の確認（`check_env.py`）が `python_ok: false` と再作成するコマンドを終了コード 1 で返し、起動スクリプトは Claude Code を立てずに止まる。仮想環境を作るシステムの `python3` も古ければ、`base_python_ok: false` で `install` を `null` にし、利用者が 3.12 以上を入れる。バージョンの判定より前に読まれる `check_env.py` は Python 3.8 で読める構文で書き、それより古い `python3` では構文エラーで終わる'
  - id: NFR-4
    name: ブラウザ
    english_name: browser
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: Chrome と Edge の最新版（PC）。スマートフォンは閲覧できれば足りる
    rationale: 'コーディング規約『対応ブラウザ』の既定（PC は Chrome と Edge、スマートフォンは閲覧できれば足りる）に従う。使う描画のライブラリ（marked・mermaid）は jsDelivr の配布物を file:// で開いた Chromium で動かして確かめ、mdmark は import map の `integrity` を含めて Chromium 151 で確かめた（PR #342 の PoC）。性能は Chrome 154 で測った。Edge・Firefox・Safari の実機では確かめていない'
    measurement: '実機での確認: Chrome と Edge で `preview.html` を file:// で開き、概要から詳細パネルまでの操作を最後まで済ませる'
  - id: NFR-5
    name: 画面サイズ
    english_name: screen_size
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 幅 320px 以上
    rationale: PC の画面に加えて、スマートフォンの縦向きで最も狭い端末（iPhone SE の幅 320px）で閲覧できるようにする。幅 900px 以下は狭い幅の作り（詳細パネルは本文に重なる）、幅 1100px 以上は詳細パネルの分だけ本文を寄せる。性能は 1280×800 と 1920×1080 で測った
    measurement: ブラウザの表示幅を 320px・390px・900px・901px・1100px・1280px・1920px にして全ての画面を開き、操作が最後まで済むことを見る
  - id: NFR-6
    name: 入力方式
    english_name: input_method
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: マウスとキーボード（PC）。スマートフォンは閲覧できれば足りる
    rationale: ボード・図の移動（背景のドラッグ）はマウスの操作を前提にする。押せるものはボタンかリンクにし、全ての操作にキーボードで届く
    measurement: '実機での確認: PC で、マウスで全ての操作を済ませ、続けてキーボードだけで項目を開く・閉じる・切り替える操作を済ませる'
  - id: NFR-7
    name: 通信
    english_name: network
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 'サーバーが配るプレビューを開くブラウザは、配信（`127.0.0.1`）と jsDelivr（描画のライブラリ）・Google Fonts（文字）へ HTTPS で届くこと。配る書き出しを開くのは通信しない。サーバーは `export` が書き出すときだけ jsDelivr へ HTTPS で届くこと（1 回の要求で接続と 1 回の読み取りをそれぞれ 30 秒まで待ち、取れなければ何も書かずにエラーで終える）。移し替え（`migrate`）の v0.13.0 の手順は、mdmark の CLI を `npx` で取得するため、Node.js と GitHub・npm のレジストリへの HTTPS が要る（v0.13.0 より前のワークスペースを移し替えるときだけ）。それ以外のツールと配信は外へ通信しない'
    rationale: サーバーの仕事はワークスペースのファイルの読み書きと端末の中への配信で、`export` だけが書き出すときに配布ファイルとライセンスの本文を jsDelivr から取る（ユーザーの決定。リポジトリには同梱しない）。移し替えの v0.13.0 の手順は、資料の書き方を mdmark の変換で移すため、mdmark の CLI を取得する（インターフェース定義『記録の形式の移行』。PR #550 の PoC で `npx` での取得を確かめた）。サーバーが配るプレビューの描画のライブラリは jsDelivr から、文字は Google Fonts から読むと決めている（アーキテクチャ図の制約）。届かないときは、読めなかったライブラリの名前を画面に出す（インターフェース定義『プレビューを開く』の異常系）。配る書き出しは描画のライブラリを中に持つため、開くときに通信せず、読めなかったライブラリの知らせは出ない（インターフェース定義『配る書き出し』）。資料の HTML の本文が外の画像・CSS を指すときだけは、描くときにブラウザがその URL を読みに行き、読めなければそのまま描く（本文は記録の持ち主が書いたもので、サーバーは中身を書き換えない）
  - id: NFR-8
    name: 常駐サーバーの待ち受けのポート
    english_name: server_port
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/mindstella/issues/338
    value: '`127.0.0.1` の 8784。`MINDSTELLA_PORT` で 1〜65535 の別のポートに上書きできる'
    rationale: '並行する複数の Claude Code のセッションが、プラグインの `.mcp.json` に書いた 1 つの URL で常駐サーバーへつなぐため、ポートを固定する。上書きは、ほかのプロセスが 8784 を使っている端末のため（『設定: サーバー』の `MINDSTELLA_PORT`）'
    measurement: '`MINDSTELLA_PORT` を渡さずに常駐サーバーを起動し、`127.0.0.1:8784` の `GET /_admin/status` が `name` に `mindstella` を返すことと、`MINDSTELLA_PORT` に別のポートを渡すとそのポートで返すことを確かめる'
    overflow: ポートが使われていれば、常駐サーバーは使われているポートと `MINDSTELLA_PORT` で別のポートを渡す案内を出して終了コード 1 で終わる。SessionStart のフックは会話の始まりを止めない（インターフェース定義『常駐サーバーの起動の確認』）
  - id: NFR-9
    name: 常駐サーバーの共有
    english_name: server_sharing
    category: 動作環境
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/mindstella/issues/338
    value: 端末に常駐サーバーは 1 つ。並行する複数の Claude Code のセッションが共有し、それぞれが `workspace` で指した複数のワークスペースを扱う。セッションを閉じても常駐サーバーとプレビューの配信は止まらない
    rationale: セッションごとにサーバーのプロセスを立てず、knowledge の規約『MCP サーバー作成ルール』の HTTP の常駐に合わせる（#338）。相対パスの基準と、ペインへの入力の宛先は、PreToolUse のフックがツールの引数 `session` に入れたセッションの値で決め、サーバーのプロセスの作業フォルダと環境変数を使わない（インターフェース定義『MCP サーバーの起動』）
    measurement: 2 つの MCP のクライアントが別々の作業フォルダを `session` で渡して同じ相対パスの `status` を呼び、それぞれの作業フォルダのワークスペースの状況が返ることと、常駐サーバーのプロセスが 1 つのままであることを確かめる
  - id: NFR-14
    name: tmux のバージョン
    english_name: tmux_version
    category: 動作環境
    external_constraint: 未確定
    source_kind: 実行基盤の制限
    source: LIB-489-26#
    value: 3.4 以上
    rationale: PoC（https://github.com/shuhei1101/mindstella/pull/73）で動かして確かめたバージョン。起動スクリプトは `new-session -e` で Claude Code の設定のフォルダを渡すため、これを持たないバージョンでは動かない。3.4 より古いバージョンは確かめていない
    overflow: 起動スクリプトはバージョンを確かめない。`new-session` が引数の誤りで終われば、tmux の標準エラーをそのまま出して終了コード 1 で終わる
  - id: NFR-15
    name: 待ち受けの範囲
    english_name: listen_scope
    category: セキュリティ
    external_constraint: 制限なし
    source_kind: 制限なし
    source: https://github.com/shuhei1101/mindstella/issues/67
    value: '`127.0.0.1` だけ。常駐サーバーの MCP（`/mcp`）・`GET /_admin/status`・全てのワークスペースの画面（`/w/{workspace}`）を `MINDSTELLA_PORT`（無ければ 8784）の 1 つで待ち受ける'
    rationale: '#67 の要件で、待ち受けるのは端末の中だけにすると決めている。配信は記録を読ませ、送信でワークスペースへ書くため、端末の外からつながせない。同じ端末の別のサイトからの読み書きは、`Host`・`Origin`・`Content-Type` の確かめで防ぐ（インターフェース定義『プレビューの配信』『コメントをまとめて送信する』）。端末の外から見るときも待ち受けは変えず、トンネル・リバースプロキシが `127.0.0.1` へ転送する。外から開く画面の認証は外の入口に任せ、配信は利用者が明示したホスト名（`MINDSTELLA_ALLOWED_HOSTS`）だけを `Host`・`Origin` で受ける（#138）'
    measurement: 常駐サーバーを起動してワークスペースを配り始めた後に、常駐サーバーの待ち受けのソケットが 1 つで、そのアドレスが `127.0.0.1` であることと、端末の別のアドレス（LAN の IP）からつながらないことを確かめる
  - id: NFR-16
    name: 画面への反映の時間
    english_name: preview_reflect_time
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    source: https://github.com/shuhei1101/mindstella/pull/73
    value: '1'
    unit: 秒（ワークスペースの YAML を書き換えてから、開いている画面が再描画するまで）
    rationale: '#67 の要件の「再読み込みの操作なしで反映」を、話し合いの中で書き換えを待っていると感じない 1 秒にする。PoC では 250ms ごとに書き換えのマーカーを見る作りで、同じプロセス・別のプロセスの書き換えとも最大 252ms だった。内訳はほぼ全てが検知の間隔で、1 秒に対して 4 倍の余裕がある'
    measurement: MCP サーバーを立ててプレビューを実際のブラウザで開き、ツールで項目を追加してから画面の表に行が出るまでを、計測の側の単調な時計で 10 回測り、最大を求める
    test_file: tests/nfr/test_preview_reflect_time.py
    overflow: 超えても再描画は遅れて届くだけで、記録は失わない
    breakdown:
      - part: 書き換えの検知
        value: 250ms 以下
        notes: 書き換えのマーカーを見る間隔（インターフェース定義『書き換えの通知』）
      - part: 記録の再読み込みと再描画
        value: PoC で数十 ms
        notes: '`GET /api/records` とブラウザの描画'
      - part: アプリの決定値
        value: 1 秒
        notes: 検知の間隔の 4 倍の余裕を見る
      - part: 差分の表示の間の差分の計算と再描画
        value: PoC で 505ms 以下
        notes: 前後とも再描画して、ノード 100・本文 5000 行で 375〜505ms（#83）。検知の 250ms と追加しても 1 秒に収まる
    tests:
      - name: test_preview_reflect_time
        summary: 書き換えから画面の再描画までが 1 秒以内
        condition: 検討事項を 1 件持つワークスペース。`add` で 1 件ずつ 10 回追加する
        measurement: '`add` を呼ぶ直前から、検討事項の表に追加した行が出るまでを計測の側の単調な時計で測る'
        expected: 10 回の最大が 1 秒以下
  - id: NFR-17
    name: 送信の本文の長さ
    english_name: submission_body_length
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '10000'
    unit: 文字（前後の空白を除いたコメントの本文と、選んだ文のそれぞれ）
    rationale: コメントとスレッドの書き込みは項目への数行の回答を想定し、長い資料は話し合いの中で渡す。上限が無いと 1 件の書き込みで `threads.yaml` と会話ログが際限なく太る。リクエストの本文の上限 128KiB に、本文と選んだ文の 2 万文字（UTF-8 で最大 4 バイトとして 80KB）とキーが収まる。AI が MCP のツールで書く返信・スレッドの最初の書き込みも同じ上限にする
    measurement: 10000 文字と 10001 文字の本文・選んだ文をそれぞれ溜め、前者が 201、後者が 400 になることを確かめる
    overflow: サーバーは 400 を返して何も書かない。画面は溜められなかった理由（`detail`）を入力の近くに出し、本文を残す
  - id: NFR-18
    name: 差分の表示の切り替えの時間
    english_name: diff_toggle_time
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    source: https://github.com/shuhei1101/mindstella/pull/83
    value: '200'
    unit: ミリ秒（変更履歴で時点を選んでから、詳細パネルの本文と図に差分が出るまで。図のノード 50・本文 1000 行まで）
    rationale: 操作への応答と感じる 200 ミリ秒を上限にする。PoC（#83）で、今のバージョンの図を使い回して前のバージョンだけを描く形式が、ノード 50・本文 1000 行で 117〜160ms（2 回とも満たした最大の規模）。ノード 100・本文 5000 行は 198〜284ms で境目をまたぐため、規模を決定値の条件に含める
    measurement: MCP サーバーを立ててプレビューを実際のブラウザで開き、詳細パネルを開いたまま変更履歴でまとまりを選んでから、本文と図に差分のマーカーが出るまでを 5 回測り、中央値を求める
    overflow: 超えても差分は遅れて出るだけで、今の内容は読める
  - id: NFR-19
    name: ClaudeCodeへの貼り付けの上限
    english_name: claude_code_paste_timeout
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '0.5'
    unit: 秒（宛先の Claude Code が生きているかを確かめ始めてから、tmux の 3 つのコマンドを終えるまで）
    rationale: 下流（`ps`・`tmux` の子プロセス）の実測の最大に余裕 50% を追加して切り上げた。実測は tmux 3.4・WSL2 の Ubuntu 24.04 で、生きているかの確かめ（`ps -o lstart=`・`display-message`・`ps -o ppid=` を 3 段階）と tmux のコマンド 3 つに当たる子プロセスを 100 回呼び、0.026〜0.043 秒だった。100 回では p99.9 を出せないため最大の 0.043 秒を p99.9 とみなし、0.043 + 0.022 = 0.065 秒を 0.5 秒に切り上げた。`paste-buffer` と `send-keys` の間で打ち切ると、貼った文字列が確定されずに入力欄に残るため、常駐サーバーが忙しいときの子プロセスの起動の遅れを見込んで大きく切り上げる
    measurement: release ブランチで、起動スクリプトで立てた Claude Code に 100 回貼り、生きているかを確かめ始めてから `send-keys` が終わるまでの時間を測る。最大の 1.5 倍が 0.5 秒を超えたら上限を見直す
    overflow: '上限を過ぎたら残りの tmux のコマンドを呼ばず、会話の記録も読まずに、送信は残したまま `entered: false` を返す'
    breakdown:
      - part: 実測の最大（p99.9 とみなす）
        value: 0.043 秒
        notes: 子プロセスを 100 回呼んだ最大。中央値は 0.027 秒
      - part: 余裕
        value: 0.022 秒
        notes: 規約『資源の値の決め方』の既定の 50%
      - part: 切り上げ
        value: 0.5 秒
        notes: 0.065 秒を、打ち切って入力欄に文字列を残さないよう大きく切り上げた
    refs:
      - IF-489-6#
  - id: NFR-20
    name: ClaudeCodeへの入力を確かめる上限
    english_name: claude_code_input_confirm_timeout
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '5'
    unit: 秒（tmux の 3 つのコマンドを終えてから、会話の記録に入ったと確かめるのを諦めるまで）
    rationale: '下流（Claude Code の会話の記録）の実測の最大に余裕 50% を追加して切り上げた。2026-10-20〜11-06 に 7 つのワークスペースで利用者が送信した 284 回で、送信した書き込みの `created` から、会話の記録に最初に入った行の `timestamp` までを測った。入力を待っているときの user の行は 256 回で中央値 0.777 秒・最大 1.668 秒、処理中の待ち行列への追加（`queue-operation` の `enqueue`）は 28 回で中央値 0.954 秒・最大 2.996 秒。`created` は秒で切り捨て、送信の書き込みと貼り付けも含むため、各値は貼り終えてからの時間より長く出る。284 回では p99.9 を出せないため最大の 2.996 秒を p99.9 とみなし、2.996 + 1.498 = 4.49 秒を 5 秒に切り上げた。新しい会話で測った PR #201 の実測（最大 0.245 秒）より長いのは、長く続いた会話での実際の入力を測ったため。届かなくても送信は残り、話し合いの取り込みで拾われるため、外れたときの損は画面の文言だけで済む。届かないときの応答は、この上限と貼り付けの上限の和まで遅れる'
    measurement: release ブランチで、起動スクリプトで立てた Claude Code に、入力を待っているときと処理中のそれぞれで貼り、`send-keys` を終えてから会話の記録に書かれるまでの時間を測る。利用者が送信した分も、送信した書き込みの `created` と会話の記録の最初の行の `timestamp` で測る。最大の 1.5 倍が 5 秒を超えたら上限を見直す
    overflow: '上限までに会話の記録に入ったと確かめられなければ、送信は残したまま `entered: false` を返し、画面は入力できなかったことを出す。入力した文字列は取り消さない'
    breakdown:
      - part: 実測の最大（p99.9 とみなす）
        value: 2.996 秒
        notes: 処理中の `enqueue` 28 回の最大。入力を待っているときの user の行 256 回の最大は 1.668 秒
      - part: 余裕
        value: 1.498 秒
        notes: 規約『資源の値の決め方』の既定の 50%
      - part: 切り上げ
        value: 5 秒
        notes: 4.49 秒を切り上げた
    refs:
      - IF-489-6#

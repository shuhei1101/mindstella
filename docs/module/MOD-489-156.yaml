id: MOD-489-156
title: "サーバー / 入口"
lead: 常駐する MCP サーバー `mindstella` を `127.0.0.1` の HTTP で待ち受け、ツールを登録し、ツールの引数を各機能へ渡して、結果を構造化の結果・エラーをツールのエラーにする。プレビューの配信と、常駐サーバーの状態と停止も同じプロセスに持つ。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    server.py          入口（常駐サーバーの待ち受けと終わり方・ツールの登録・結果とエラー・書き換えの鍵・状態と停止）
    commands.py        ツールごとの処理（引数 → 各機能 → 結果の辞書）
    api.py             MindStella の API の経路（Host と Origin の確かめ・problem+json）
    workspaces.py      ワークスペースの管理（作成・クローズ・配信元の行・依頼の順番の鍵）
    sessions.py        セッションの管理（MindStella のセッションの起動・一覧・停止・フックの出来事）
    state.py           常駐サーバーの状態（`${XDG_STATE_HOME}/mindstella/` の読み書き）
    project_index.py   project-index の端末の設定の API と読み取り API の呼び出し
  ```

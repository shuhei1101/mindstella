id: MOD-489-156
title: "サーバー / 入口"
lead: 常駐する MCP サーバー `mindstella` を `127.0.0.1` の HTTP で待ち受け、ツールを登録し、ツールの引数を各機能へ渡して、結果を構造化の結果・エラーをツールのエラーにする。プレビューの配信と、常駐サーバーの状態と停止も同じプロセスに持つ。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    server.py     入口（常駐サーバーの待ち受けと終わり方・ツールの登録・結果とエラー・書き換えの鍵・状態と停止）
    commands.py   ツールごとの処理（引数 → 各機能 → 結果の辞書）
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 入口
        class ツールの処理
        class 配信
        class スレッド
        class コメント
        class Claude Codeへの入力
        class 読み書きと検証
        class 検索
        class 依存と影響
        class 点検
        class ビルド
        class 移行
        class 設定の更新
        class ワークスペースのREADME
        入口 --> ツールの処理 : ツールごとに呼ぶ
        入口 --> 読み書きと検証 : 書き換えの鍵
        入口 --> 配信 : 終わるときに止める
        入口 --> Claude Codeへの入力 : セッションの値を読む
        ツールの処理 --> 配信 : preview_url
        ツールの処理 --> スレッド : threads・thread・new_thread・reply・set_thread_status・update_thread
        ツールの処理 --> 読み書きと検証
        ツールの処理 --> 検索
        ツールの処理 --> 依存と影響
        ツールの処理 --> 点検
        ツールの処理 --> ビルド
        ツールの処理 --> 移行
        ツールの処理 --> 設定の更新 : update_settings
        ツールの処理 --> ワークスペースのREADME : readme・preview_url
        配信 --> ビルド : 雛形と記録
        配信 --> コメント : /api/comments・/api/drafts
        配信 --> スレッド : /api/threads
        配信 --> Claude Codeへの入力 : まとめて送った後
        コメント --> スレッド : まとめて送る
      ```
notes:
  モジュールの読み込み: サーバーはパッケージとして入れず、『常駐サーバーの起動の確認』（`ensure_server.py`）が `{仮想環境の Python} {プラグインのフォルダ}/skills/mindmap/scripts/server.py` を起動する。起動したファイルのフォルダが `sys.path` の先頭に入るので、各モジュールは `import store` のように同じフォルダの名前で読む。単体テストは `tests/unit/scripts/conftest.py` で `plugins/mindstella/skills/mindmap/scripts` を `sys.path` に足して同じ名前で読む
  標準出力: サーバーのどのモジュールも `print` を使わず、記録は `logging` で標準エラーへ書く（『常駐サーバーの起動の確認』が標準出力と標準エラーを `~/.mindmap/server.log` へつなぐ）
  ツールを動かすスレッド: 'MCP の SDK は同期の関数のツールを作業スレッドで呼ぶ。複数のセッションのツールの呼び出しが並ぶため、書き換えは今までどおりプロセスの中の 1 本の鍵とワークスペースのロックで順にする'

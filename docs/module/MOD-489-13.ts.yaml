id: MOD-489-13
title: プレビュー / use-threads
lead: スレッドの状態の書き換えと利用者の既読の mutation。
functions:
  - name: useSetThreadStatus
    title: スレッドの状態の書き換え
    kind: フック
    usecase: スレッドで話す
    summary: '`PATCH /api/threads/{id}` へ `status` と `reason` を送信し、成功でスレッドを再読み込みする'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_set_thread_status
        case: 正常
        summary: 再読み込みする
        condition: '200'
        mock: MSW
        expected: スレッドの query が再読み込みされる
      - name: test_use_set_thread_status_when_error
        case: 異常
        summary: エラーの detail
        condition: '409'
        mock: MSW
        expected: '`AppError` の `detail`'
    container: frontend/src/features/comments/shared/use-threads.ts
  - name: useMarkThreadSeen
    title: スレッドの既読
    kind: フック
    usecase: スレッドで話す
    summary: '`POST /api/threads/{id}/seen` を呼ぶ。応答を待たずに `withSeen` でスレッドの query の値を書き換える（楽観更新の許可リストの既読の状態）。失敗しても画面には出さず、スレッドの query を再読み込みしてサーバーの値に戻す。再呼び出ししない判定は `ThreadView` が持ち、開いている間に呼んだスレッドの ID を覚えて、同じスレッドを開いている間は再読み込みの後も再呼び出しせず、次に開いたときに再呼び出しする'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_mark_thread_seen
        case: 正常
        summary: マーカーをすぐ削除する
        condition: 未読の TH-1
        mock: MSW
        expected: 応答の前にスレッドの query の TH-1 が既読
      - name: test_use_mark_thread_seen_when_error
        case: 異常
        summary: 失敗したら再読み込みする
        condition: '500'
        mock: MSW
        expected: スレッドの query が再読み込みされ、TH-1 が未読に戻る。エラーを画面に出さない
    container: frontend/src/features/comments/shared/use-threads.ts
notes:
  単体テスト: 同じフォルダの `use-threads.test.ts` に置く（knowledge の規約『フォルダ構成』）

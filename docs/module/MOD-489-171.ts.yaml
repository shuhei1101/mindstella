notes:
  入力中の再読み込みの保留: サーバーの配信では、`start` が呼ぶ `run` で再描画の保留（`createRefreshHold`。`isVoiceActive` は `comment.voice.phase` が `idle` でないこと、`reload` は記録の再読み込みし、`onStaleChange` はトップバーの `stale` を書き換えて `renderTop`）を作る。書き換えの通知（`onChanged`）とつながり修正したときの再読み込みは `request` を呼び、音声入力があれば続けて `checkVoiceDestination` を呼んで、ID が返り、その時点でも `comment.voice` が同じ行き先で録音・文字起こし中なら録音を捨て（`abandonVoice`）、知らせを discarded にしてトップバーを再描画する（`renderTop`）。音声入力が終わったとき（文字起こしの結果が入った・キャンセル・失敗・捨てた）は `release` を呼ぶ。配る書き出しでは作らない
  スレッドの再読み込み: |-
    `start` の 2（開いたとき）・13（`changed` を受けたときとつながり修正したとき）では、記録とレビュー中に続けてスレッドも読む（`threadApi().read`）。読めたら `CommentState.threads` を置き換えて `threadsError` を `null` にし、断られた・届かないときは `threads` を前のまま残して `threadsError` に理由を入れる。再読み込みした後、パネルを開いていればスクロールの位置・絞り込み・入力中の返信と理由を保ったままパネルを再描画する（AI の返信・AI が立てたスレッド・AI のクローズとオープンへの戻しが届く）。配る書き出しでは読まない
    再読み込みしたらトップバーの `commentsUnread` を `anyOpenUnseen(threads)` で再描画する（パネルを閉じていても読む）。`view` が `thread` で、開いているスレッドが送信したもの（`openedThread.pending` が偽）で `hasUnseen` が真なら、「既読にする」を行う（開いている間に届いた返信も既読にする）

    「既読にする」は、「スレッドを開く」と再読み込みの両方が使う 1 か所の処理。
    - そのスレッドへの要求を送信している間と、そのスレッドへの要求が失敗してから別のスレッドを開くか一覧へ戻るまでの間は、呼ばない（送信しているスレッドと失敗したスレッドの ID を控える。失敗の控えは「スレッドを開く」と「戻る」で空にする）
    - `threadApi().seen` を呼ぶと同時に、`CommentState.threads` を `withSeen({ threads, id })` に置き換え、`anyOpenUnseen` が変わればトップバーを再描画する。応答は待たない
    - 要求を送信している間に再読み込みした値で置き換えるときは、送信しているスレッドを `withSeen` で既読にしてから置き換える（送信する前のサーバーの値でコピーを未読に戻さない）
    - 断られた・届かないときは画面に出さず、そのスレッドの ID を送信している控えから失敗の控えへ移してからスレッドを再読み込みする（コピーをサーバーの値に戻す）
  スレッドの画面の操作: |-
    `start` の 5・6・8 に追加する。`listOpen` なら `commentsPanel` に `CommentState` の `view`・`threads`・`threadsError`・`filter`・`tag`・`target`・`openedThread`（`opened`）・`composing`・`reason`・`expanded` と、新しいスレッドの入力（`formKey(null, null)`。`target` があれば、その項目への箇所を持たない入力 `formKey({ID}, null)` で、詳細パネルの下端の入力と状態を共有する。その入力を溜める・書くとパネルを再描画し、フォーカスがパネルにあれば、溜めた後のフォーカスの移動先（`focusAfterAddTarget`）に従ってパネルの入力欄か「レビューに追加」へ移す）・開いているスレッドの返信の入力（`formKey(null, null, {ID})`。`forms` に無ければ同じ `thread` の `review.drafts` の本文で `idle` で作る）を渡す。項目を指さない入力の `collapsed` は使わない（常に偽）。どの操作も履歴に積まない
    - パネルを開くときは、閉じる前の `view`・`openedThread`・`composing`・`reviewFrom`・`reviewFocus` のまま描き、パネルの中のスクロールの位置を `listScroll` に戻す（ページを開いたときは `list` から始める）。スレッドを再読み込みし、`view` が `thread` で、開いていた送信したスレッドが再読み込みしたスレッドに無ければ、`view` を `list`、`openedThread` を `null` にする
    - 「状態で絞る」「タグで絞る」（絞っているタグなら外す）「タグを外す」「項目の絞り込みを外す」では `filter`・`tag`・`target` を書き換えてパネルを再描画する
    - 一覧を閉じるときは `target` を `null` にする（トップバー・未読のタイル・音声入力の帯など、詳細パネルのボタンでない入口で開くと項目で絞らない）。サーバーの配信では `detailPanel` に `on.comments` を渡し、受けたら `target` に項目の ID を入れてパネルの中の画面を開いた直後の状態（`view` は `list`、`openedThread`・`reviewFocus` は `null`、`composing` は偽、`reason` は閉じて空）に戻し、一覧を開いていなければ開き、開いていれば再描画する（`filter`・`tag` は保つ）。詳細パネルで別の項目へ移っても `target` は変えない
    - 「スレッドを開く」では一覧のスクロールの位置を控え、`openedThread` を入れて `view` を `thread`、`reason` を閉じて空にする。送信したスレッドで `hasUnseen` が真なら「既読にする」を行う（一覧の行・レビュー中の書き込みのどちらから開いても同じ。「スレッドの再読み込み」）。「戻る」（`thread` から）では返信の書きかけを待たずに保ち（`saveDraft`）、`view` を `list` にして控えたスクロールの位置と開いていた行へのフォーカスを戻す
    - 「レビュー中を開く」では返信の書きかけを待たずに保ち、`reviewFrom` に今の `view` を控えて `view` を `review` にする（`thread` から開いたときは `reviewFocus` にそのスレッドの ID）。「戻る」（`review` から）では `reviewFrom` へ戻る。`reviewFrom` が `thread` で、開いていたまだ送信していない新しいスレッドが `review.items` にも `removed` にも無ければ `list` へ戻る
    - 「新しいスレッドの入力を出す／畳む」では `composing` を入れ替え、出したときは入力欄へ、畳んだときは「新しいスレッド」へフォーカスを移す（書きかけは残す）
    - 返信の「入力」「溜める」は 6 のコメントの入力と同じ扱いで、`add`・`saveDraft` に `{thread, body}` を送信する（空白だけは部品が溜めさせないため `empty` は使わない）。溜めたらレビュー中を再読み込みして溜めた ID を `checked` に追加し、トップバーとパネルを再描画する
    - 「理由の入力を出す／閉じる」「理由の入力」では `reason` を書き換える。「状態を変える」では `reason.status` を `saving` にして送り（`threadApi().setStatus`）、200 なら `reason` を閉じて空にし、スレッドを再読み込みしてパネルを再描画し、「状態を変える」へフォーカスを戻す。断られた・届かないなら `failed`（`detail`）にして理由の入力を開いたまま残す
    - 「まとめて送信する」では、チェックした ID から `isBlockedReply` が真のものを除いて溜めた順に送信する。201 の後はレビュー中に続けてスレッドも再読み込みする（`view` は `review` のまま）
    - 項目を開く（本文の中の ID・スレッドの向けた項目・レビュー中の行の向けた項目）では、パネルを開いたまま詳細パネルを開く。スレッドの向けた項目とレビュー中の行は `highlight` にその箇所を渡す
    - Esc は、幅 901px 以上か `StackState.front` が `detail` で詳細パネルを開いていれば、詳細パネルを閉じる。それ以外で入力欄にフォーカスがあるとき（`isTyping`）は何もしない（入力欄が自分で外れる）。それ以外は `view` が `thread`・`review` なら「戻る」と同じ、`list` ならパネルを閉じる
    - パネルを閉じるときは、パネルの中のスクロールの位置を `listScroll` に控え、新しいスレッドと返信の書きかけを待たずに保ち、`removed` と `editingIn` が `'list'` の書き換えを捨てる（「詳細パネルのレビュー中のコメントの操作」と同じ。修正の入力で録音・文字起こし中か、出していない結果があるとき（`editHeld`）は書き換えを捨てない）
  修正の入力の音声入力: "`VoiceDestination` にレビュー中の書き込みの修正 `{review: ID, view: 'review' | 'thread' | 'panel' | 'full'}` を追加する。修正の入力の `key` は `review:{ID}` で、`voiceHandlers` には `comment.edit` の書き換えていた中身を入力欄の状態として渡す。`destinationOf` が `review` を返すとき、`finishVoice` の `action` を設定によらず `insert` にする。入力欄が画面に無い間に終わった結果は、書きかけ（`saveDraft`）へ送信せず `comment.edit` の書き換えていた中身へ入れ、`editing` をその ID、`editingIn` を録音を始めた画面にしたまま残す。`checkVoiceDestination` は `review` の向けた先をレビュー中のコメント（`review.items`）で確かめ、無ければ録音と結果を捨てて知らせる。`openVoiceInput` は `review` の向けた先の画面（コメントの一覧のレビュー中・スレッド・詳細パネル・詳細の全画面）を開き、その書き込みを修正の入力のまま描く。修正の入力の「修正」の「キャンセル」で書き換えを捨てるときは、録音を捨てる（`abandonVoice`）。画面からの削除（`removeComment`）とまとめて送信（`sendChecked`）の応答が成功した時点で、その ID の `review:{ID}` が録音・文字起こし中なら `abandonVoice` して知らせを discarded にし、`comment.edit` に取っておいたその ID の結果も捨てる（記録の再読み込みを待たない。「元に戻す」で戻しても結果を入れない）。修正の入力の音声入力は次の処理で持つ。`editVoiceHandlers` は書き換えている行のマイク・×・✓・押せないマイクを受け、✓ では `action: insert` で `finishVoice` を呼ぶ。入力欄が画面に無い間に終わった結果は `editBody` に入れて `editVoicePending` を立て、失敗だけを知らせる。`editHeld`（その行で録音・文字起こし中か、`editVoicePending` が立っている）の間は、項目の移動と詳細パネル・一覧を閉じても書き換えを捨てない。`openEditVoiceInput` は `openVoiceInput` が `review:{ID}` を受けたときに向けた先の画面を開いて `editing`・`editingIn` を戻し、`editVoicePending` を下ろす。`discardEditVoice` は削除・送信した書き込みと、再読み込みで無くなった書き込み（`discardMissingVoice`）の録音を捨てて知らせを discarded にし、出していない結果も捨てる。`removeComment`・`sendChecked` は `start` の中の処理で単体テストを置かず、再読み込みを挟まない削除・送信で録音を捨てることは、結合テスト（単一ユースケース『音声でコメントする』の `異常シナリオ（修正の入力で録音中にその書き込みを削除・送信する）` を今の画面で開く流れ）で確かめる"

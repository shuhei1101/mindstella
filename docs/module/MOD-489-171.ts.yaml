id: MOD-489-171
title: プレビュー / 入口 / app.ts
lead: プレビューを開いたときに記録を読み（配る書き出しは埋め込みから、サーバーの配信は『記録の取得』から）、URL のハッシュが指す画面を描き、操作を画面の移動・書き換えの知らせ・コメントの読み書き・端末の保存領域につなぐ。
test_files:
  - tests/unit/preview/test_app.py
directory: |-
  ```
  plugins/mindstella/skills/mindmap/preview/
    template.html   雛形（描画のライブラリ（mdmark は import map と CSS の link）・文字の読み込みと、CSS・JavaScript・データの差し込み位置）
    tokens.css      デザイン方針のトークン（ライト / ダーク）
    style.css       画面と部品のスタイル
    app.ts          起動・画面の振り分け・端末の保存領域（差し込む順の最後）
  ```

  `.ts` の書き方と生成した `.js` の扱いは、モジュール構成『基盤』のディレクトリ構成と同じ。
data_models:
  - name: Prefs
    title: 端末に残す設定
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: '`localStorage` の 1 つのキーに JSON で残す値。表示する種類・ライト / ダーク・表の列・絞り込みの条件・差分のミニマップ・本文の表とセクションの見せ方・本文の差分の並べ方・レビュー中のコメントの並びは個人の上書きで、無い（`null`・種類や画面のキーが無い）項目はワークスペースの既定か画面の既定に従う（`resolveDisplay`・`initialFilters`）'
    properties:
      - name: theme
        type: "'light' | 'dark' | null"
        description: ライト / ダーク。`null` は OS の設定に従う
      - name: columns
        type: 'Record<string, {hidden: string[], pinTo: string | null}>'
        description: 種類ごとの表示する列とピン留め。種類のキーが無ければ既定の列
      - name: kinds
        type: string[] | null
        description: 表示する種類（`decisions` など）。`null` はワークスペースの既定
      - name: diffSel
        type: string | null
        description: 変更履歴で選んだ時点（`since`・`pending`・まとまりの ID）。`null` は差分を出さない。個人の上書きではなく、「既定に戻す」でも削除しない
      - name: filters
        type: Record<string, Record<string, string[]>>
        description: サーバーの配信で残した、画面（記録の表は種類）ごとの絞り込みの条件（`FilterState.byTab` と同じ形式）。画面のキーが無ければ画面の既定の条件で開く。配る書き出しでは読まず書かない
      - name: minimap
        type: false | null
        description: 差分のミニマップを表示しない上書き。`null` は表示する（ワークスペースの既定は持たない）。表示するに戻すと `null` にする
      - name: bodyLayout
        type: "'side' | null"
        description: 本文の差分を左右に並べる上書き（インターフェース定義の `body_diff_layout`）。`null` はインライン（ワークスペースの既定は持たない）。「インライン」を押すと `null` にする
      - name: reviewOrder
        type: "'oldest' | null"
        description: 詳細のレビュー中のコメントを古い順に並べる上書き（インターフェース定義の `review_order`）。`null` は新しい順（ワークスペースの既定は持たない）。新しい順に戻すと `null` にする
      - name: opened
        type: unknown
        description: 配る書き出しだけが持つ、前回開いた時点（`OpenedPoint`）。`resolveSince` が `isOpenedPoint` で確かめてから読み、連番を持たない前のバージョンの値（日時の文字列）は無いものとして扱う。サーバーの配信では読まず書かない
      - name: sectionFold
        type: false | null
        description: セクションの折りたたみをオフにする上書き（`section_fold`）。`null` はオン。オンに戻すと `null` にする
      - name: commentsPinned
        type: true | null
        description: コメントの一覧をピン止めしているか。`null` はピン止めしない。個人の上書きではなく、「既定に戻す」でも削除しない
      - name: commentFormClosed
        type: true | null
        description: 詳細パネル・詳細の全画面の下端のコメントの入力を閉じているか。`null` は開く。個人の上書きではなく、「既定に戻す」でも削除しない
      - name: focusAfterAdd
        type: "'input' | 'none' | null"
        description: 「レビューに追加」の後のフォーカスの上書き（インターフェース定義の `focus_after_add`）。`null` は自動（ワークスペースの既定は持たない）。「自動」を選ぶと `null` にする
  - name: CommentState
    title: コメントの画面の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: コメントを選んで送信する
    summary: 開いている間だけ持つコメントの状態。再描画・項目の移動・詳細パネルと全画面の行き来でも保つ。書きかけとレビュー中のコメントはサーバーが持ち、ここには読んだコピーを置く
    properties:
      - name: review
        type: ReviewState
        description: 最後に読んだレビュー中のコメントと書きかけ
      - name: forms
        type: Map<string, {target, loc, thread, body, status, count, detail}>
        description: 入力欄ごと（`formKey`）の書きかけと溜める状態。スレッドの返信の入力欄は `thread` を持ち、`target`・`loc` を `null` にする
      - name: pendingLoc
        type: Map<string, Location>
        description: 項目の ID → 選んだ箇所の入口を押して入力に添えた箇所
      - name: checked
        type: Set<string>
        description: コメントの一覧でチェックしたコメントの ID（読んだときと溜めたときに追加する）
      - name: removed
        type: ReviewState['items']
        description: コメントの一覧か詳細パネルで削除したコメント（一覧と詳細パネルで同じものを見る。一覧を閉じるかまとめて送信すると空にする。一覧を開いていない間は、詳細パネルで別の項目へ移るかパネルを閉じると空にする）
      - name: stale
        type: Map<string, string>
        description: 送信できなかった書き込みの ID → 理由（箇所を外す・削除・次に送信するで削除する）
      - name: listOpen
        type: boolean
        description: コメントの一覧を開いているか
      - name: opened
        type: string | null
        description: レビュー中の書き込みの行から項目を開いたコメントの ID
      - name: threads
        type: Thread[]
        description: 最後に読めたスレッド（読めなかったときは前のまま残す）
      - name: threadsError
        type: '{detail: string | null} | null'
        description: 直前のスレッドの読み取りが断られた・届かなかったときの理由。読めたら `null`
      - name: view
        type: "'list' | 'thread' | 'review'"
        description: パネルの中に出している画面。パネルを閉じても保ち、再度開いたときにこの画面へ戻す（『スレッドの画面の操作』）
      - name: reviewFrom
        type: "'list' | 'thread'"
        description: レビュー中の書き込みを開く前の画面（「戻る」の戻り先）
      - name: filter
        type: "'open' | 'closed' | 'all'"
        description: スレッドの状態の絞り込み。ページを開いたときは `open` で、パネルを閉じても保つ
      - name: tag
        type: string | null
        description: スレッドを絞っているタグ。パネルを閉じても保つ
      - name: openedThread
        type: '{id: string, pending: boolean} | null'
        description: 開いているスレッド（`pending` が真なら `id` はまだ送信していない新しいスレッドのコメントの ID）
      - name: composing
        type: boolean
        description: 新しいスレッドの入力を出しているか
      - name: reason
        type: "{open: boolean, body: string, status: 'idle' | 'saving' | 'failed', detail: string | null}"
        description: 開いているスレッドの理由の入力の状態。スレッドを開く・一覧へ戻るときに閉じて空にする
      - name: reviewFocus
        type: string | null
        description: スレッドの画面からレビュー中の書き込みを開いたときの、そのスレッドの ID（一覧から開いたときは `null`）
      - name: expanded
        type: Set<string>
        description: レビュー中の書き込みの画面とスレッドの画面で本文を開いている書き込みの ID（`on.fold` で追加引きする。再描画と本文の書き換えでは保ち、パネルを閉じると空にする）
      - name: listScroll
        type: number
        description: コメントの一覧を閉じたときのパネルの中（`.comments-body`）のスクロールの位置。再度開いたときに戻す（ページを開いたときは 0）
      - name: detailExpanded
        type: Set<string>
        description: 詳細パネルと詳細の全画面のレビュー中のコメントで本文を開いているコメントの ID（`detailPanel` の `comment.edit.on.fold` で追加引きし、`comment.edit.expanded` で渡す。再描画・本文の書き換え・詳細の全画面との行き来では保ち、詳細パネルで別の項目へ移るかパネルを閉じると空にする）
      - name: voice
        type: VoiceState
        description: コメント・返信の入力の音声入力の状態
      - name: target
        type: string | null
        description: スレッドを絞っている項目の ID。詳細パネルの「コメントの一覧」で入れ、項目の絞り込みの × と一覧を閉じるときに `null` にする。ページを開いたときは `null`
  - name: VoiceState
    title: 音声入力の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 音声でコメントする
    summary: 開いている間だけ持つ録音の状態。録音は同時に 1 つで、録っている入力（`key`）にだけ `recording`・`transcribing` を渡し、録っている間はほかの入力のマイクを `disabled`（`VOICE_TEXT.busy`）で描く。録っている入力が画面から消えても（画面を移る・パネルや入力を閉じる）保ち、書き換えの知らせでの再描画でも保つ
    properties:
      - name: availability
        type: TranscriptionStatus | null
        description: 最後に読んだ文字起こしの可否（読めない・まだ読んでいないときは `null` で、マイクは押せるまま描く）
      - name: key
        type: string | null
        description: 録っている入力の `formKey`（録っていなければ `null`）
      - name: phase
        type: "'idle' | 'recording' | 'transcribing'"
        description: 録音の段階
      - name: recording
        type: Recording | null
        description: 録音中の 1 回分
      - name: elapsed
        type: number
        description: 録音を始めてからの秒数（1 秒ごとに進めて、録っている入力だけを再描画する）
      - name: levels
        type: number[]
        description: 録音中の音量の並び（`startRecording` の `onLevel` で `pushLevel` し、録っている入力の波形だけを再描画する。録音を終えたら空にする）
      - name: selection
        type: '{start: number, end: number} | null'
        description: マイクを押したときの入力欄の選んだ範囲（`selectionStart`・`selectionEnd`）。録音を終えて入力欄に戻すときに使い、戻したら `null` にする
      - name: ticket
        type: number
        description: 録音を始めるたびに 1 進める番号。文字起こしの結果が返ったとき、押したときの番号と違えば結果を捨てる
      - name: destination
        type: "{target, loc, view: 'panel' | 'full'} | {thread} | {newThread: true} | null"
        description: 録っている入力の向けた先と、戻るときに開く画面（詳細パネル・詳細の全画面・コメントの一覧の新しいスレッド・スレッド）
      - name: label
        type: string | null
        description: トップバーの `voice.label`（「{ID} へのコメント」「新しいスレッド」「{スレッド} への返信」）
      - name: notice
        type: "{kind: 'discarded' | 'failed', text: string, key: string | null} | null"
        description: トップバーの `voiceNotice`。`failed` は「入力欄を開く」で開く入力の `key` を持つ
      - name: release
        type: (() => void) | null
        description: 画面の消灯の抑止を解く関数（`acquireWakeLock` が返したもの。解いたら `null`）
  - name: DisplayState
    title: 表示の設定の画面の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 表示の設定を変える
    summary: 開いている間だけ持つ、表示の設定のパネル・確かめ・知らせの状態。再描画・書き換えの知らせでも保つ
    properties:
      - name: open
        type: boolean
        description: 表示の設定のパネルを開いているか（コメントの一覧の `CommentState.listOpen`・絞り込みの `FilterState.drawerOpen` とは 1 つだけが真）
      - name: confirm
        type: '{busy: boolean, error: string | null} | null'
        description: 既定の保存の確かめを開いている間の状態。閉じていれば `null`
      - name: message
        type: "{kind: 'ok' | 'info', text: string} | null"
        description: パネルに残す最後の知らせ（既定にした・既定が変わった。時刻つき）
      - name: savedDisplay
        type: '{visible_kinds} | null'
        description: 自分が既定にした直後の値。次に読んだ記録の `settings.display` がこれと等しければ、画面の下の知らせを出さずに `null` に戻す
      - name: storageOk
        type: boolean
        description: 端末の保存領域に書けたか（`savePrefs` の結果）
  - name: FilterState
    title: 絞り込みの状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目を表で絞り込む
    summary: 開いている間の絞り込みの状態。表示形式の切り替え・再描画・書き換えの知らせでも保つ。サーバーの配信では、条件を変えるたびに `Prefs.filters` へコピーて端末に残す
    properties:
      - name: byTab
        type: Record<string, Record<string, string[]>>
        description: 画面（記録の表は種類）ごとの絞り込み。初めて開いた画面は `initialFilters` で入れる（サーバーの配信では `Prefs.filters` の分を `pruneFilters` にかけて渡す）
      - name: drawerOpen
        type: boolean
        description: 絞り込みのドロワーを開いているか。コメントの一覧（`CommentState.listOpen`）・表示の設定のパネル（`DisplayState.open`）と同時に真にしない
  - name: StackState
    title: 重なりの状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: 幅 900px 以下で詳細パネルと左のパネル（絞り込みのドロワー・コメントの一覧・表示の設定のパネル）を両方開いているときに前に出す側。ページを開いている間だけ持ち、URL のハッシュにも端末の保存領域にも書かない（`start` の 5）
    properties:
      - name: front
        type: "'left' | 'detail'"
        default: "'detail'"
        description: 後から開いた側。左のパネルをトップバーから開いたら `left`、詳細パネルを開く・別の項目へ移ったら `detail`
  - name: EditState
    title: 編集の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 画面で項目を編集して保存する
    summary: 開いている間だけ持つ編集・保存待ちの状態。保存待ちの編集はサーバーが持ち、ここには読んだコピーを置く。再描画・書き換えの知らせでも保つ
    properties:
      - name: edits
        type: PendingEdit[]
        description: 最後に読んだ保存待ちの編集
      - name: blocked
        type: BlockedEdit[]
        description: 直前の保存で書き込めなかった編集（その編集を取り消すか、次に保存できたら外す）
      - name: open
        type: boolean
        description: 保存待ちのパネルを開いているか（コメントの一覧・表示の設定・絞り込みのドロワーとは 1 つだけが真）
      - name: editing
        type: string | null
        description: 詳細パネルで編集の表示にしている項目の ID（追加する項目は仮の ID。別の項目を開くと `null`）
      - name: adding
        type: Kind | null
        description: 仮の ID をまだ振られていない、開いたばかりの項目を追加する入力の種類
      - name: status
        type: "'idle' | 'saving' | 'offline'"
        description: まとめて保存の状態
      - name: errors
        type: Map<string, string>
        description: '`{target}:{key}` → 溜められなかった理由（届かない・断られた）'
      - name: toast
        type: string | null
        description: 保存した知らせの文言（「{n} 件を保存しました。」。`NOTICE_MS` で削除する）
      - name: workspaceOpen
        type: boolean
        description: 設定の画面を開いているか
      - name: optionDrafts
        type: 'Map<string, {key: string; content: string}[]>'
        description: 項目の ID（追加する項目は仮の ID、仮の ID が振られる前は `NEW_ID_PREFIX`）→「案を追加」で置いた、まだ溜めていない書きかけの案の記号と中身
      - name: sentEdits
        type: 'Map<string, {value: unknown; settledSeq: number | null}>'
        description: '`{target}:{op}:{key}`（`adopt` は `{target}:adopt`）→ 送信したが、まだ当てた読み取りに載っていない編集の値（`option-add` は入れない）と、溜められた後に送信した最初の読み取りの番号（`settledSeq`。溜められるまでは `null`）。再描画で `edits` の上に重ねて入力欄に描く'
      - name: editsReadSeq
        type: number
        description: 最後に送信した保存待ちの編集の読み取りの番号
      - name: editsAppliedSeq
        type: number
        description: '`edits` に当てた読み取りの番号'
      - name: addSend
        type: '{kind: Kind; target: string | null; value: Record<string, unknown> | null; draft: Record<string, unknown>; tail: Promise<void>} | null'
        description: 今開いている項目を追加する入力の送信の並び。追加の入力を開くたびに再作成する（保存待ちにある仮の ID の項目を `openAdded` で再度開いたときは、`target` をその仮の ID、`value` を保存待ちのその `item-add` の `value` にして作る）。`target` は最初の `item-add` の応答で返った仮の ID（応答までは `null`）、`value` は最後に溜められた `item-add` の `value`、`draft` はタイトルを書く前の入力（`addDraft`）、`tail` は最後に積んだ送信が終わると解決する。閉じた・別の追加を始めた後も、積んだ送信はこの並びを参照して終える
constants:
  - name: PREFS_KEY
    title: 端末の保存領域のキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: '`Prefs` を残す `localStorage` のキー'
    value: '"mindmap-preview"'
  - name: DRAFT_SAVE_DELAY_MS
    title: 書きかけを保つまでの待ち
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目へコメントする
    summary: 入力が止まってから『下書きの保存』を呼ぶまでの待ち（打つたびに書かず、打ち終えた直後に閉じても失うのがこの待ちの分だけで済む長さ。閉じるときは待たずに呼ぶ）
    value: '500'
  - name: SINCE_KEY
    title: 「前回開いてから」の始まりのキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 前回からの差分を見る
    summary: そのタブの「前回開いてから」の始まり（`OpenedPoint` の JSON）を残す sessionStorage のキー。あれば `POST /api/opened` を呼ばない（同じタブで再読み込みしても範囲を変えない）。配る書き出しでは、前回開いた時点を `Prefs.opened` に持つ
    value: '"mindmap-since"'
  - name: NOTICE_MS
    title: 既定が変わった知らせを出す長さ
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: ワークスペースの既定を変える
    summary: 画面の下に「ワークスペースの既定が変わりました。」を出すミリ秒（画面設計『表示の設定』と確認ログの決定）
    value: '6000'
  - name: PANEL_WIDTH_KEY
    title: 詳細パネルの幅のキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目の詳細を読む
    summary: そのタブで変えた詳細パネルの幅（px の整数の文字列）を残す sessionStorage のキー。種類で分けない。配る書き出しでも同じ
    value: '"mindmap-panel-width"'
  - name: BODY_SCROLL_KEY
    title: 本文のスクロールの位置のキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目の詳細を読む
    summary: そのタブで詳細パネル・全画面の本文をスクロールした位置（項目の ID → px の JSON）を残す sessionStorage のキー。配る書き出しでも同じ
    value: '"mindmap-body-scroll"'
functions:
  - name: readEmbeddedData
    title: 埋め込みのデータを読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts

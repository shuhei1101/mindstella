  - name: start
    title: 起動
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: 記録を読み、ハッシュが指す画面を描き、操作と履歴をつなぐ
    side_effects: '`document.body` に画面を描く。`hashchange`・`popstate`・`keydown`（`Ctrl+K`・`Cmd+K` で検索・Esc）・`selectionchange`・`pointerup` を受ける。端末の保存領域に個人の上書き（サーバーの配信では画面ごとの絞り込みの条件も）を残す。サーバーの配信では `GET /api/records` と `GET /api/comments` を読み、`GET /api/events` につなぎ、コメント・書きかけ・既定の書き換えの API へ送信する'
    args: []
    returns:
      type: void
      description: '-'
    process: |-
      1. mdmark を読み終えるのを待ち（`loadMdmark`。読めなくても続ける）、埋め込みのデータを読む（`readEmbeddedData`）
         - 読めない場合、本文にそのメッセージを出して終える
         - データがある場合、配る書き出しとしてそれを記録にし、コメントのボタン・一覧・入力・選んだ箇所の入口と接続の状態を出さない（以降の 2・6・7・8 をしない）。表示の設定は出し、「ワークスペースの既定にする」を出さない（`can_save: false`）
         - `null` の場合、サーバーの配信として 2 へ進む
      2. 記録とレビュー中を読む（`fetchRecords`、`commentApi().read`。読んだコメントは全て `checked` に入れる）。待たずに文字起こしの可否を読み（`voiceApi().status`）、返ったら `VoiceState.availability` に入れて入力を再描画する
         - 記録が届かない・読めない場合、接続の状態だけを出したトップバーと、読めなかった理由を本文に出し、書き換えの知らせのつなぎ修正を待つ（13 へ）
      3. 索引を作る（`buildIndex`）。端末の設定を読み（`loadPrefs`）、表示を読み分けて（`resolveDisplay`。記録の `settings.display`）テーマを当てる。ページのタイトル（`document.title`）を `{設定の summary} | mindstella` にする
         - 「前回開いてから」の始まりを決める（`resolveSince`。読んだ記録の先頭のまとまりの `until_seq` を渡す）
         - 選んだ時点を引く（`resolveDiffPoint`。ハッシュの `diff`（`parseHash` の `Route.diff`）があればそれ、無ければ `Prefs.diffSel` と、始まり）。引けたら `Prefs.diffSel` と `Route.diff` をその時点にし、引けなければどちらも `null` にして残す（`savePrefs`）
      4. ハッシュを読み（`parseHash`）、記録に無い `id` だった場合は `id` の無いハッシュに置き換える（`navigate`、`push: false`）。`tab` が表示しない種類を指す場合は `overview` のハッシュに置き換える（`id` は残し、詳細パネルは開く）。3 で `Route.diff` が読んだハッシュの `diff` と変わった場合も、そのハッシュに置き換える（`navigate`、`push: false`）
      5. トップバーと画面を描き、`id` があれば詳細パネルを開く。トップバーのタブは概要と表示する種類だけにし、表示の設定のボタン（`DisplayState.open`）を渡す。サーバーの配信では、録っている間は `voice`（`VoiceState.phase`・`label`・`elapsed`）、知らせがあれば `voiceNotice`（`VoiceState.notice`）も渡す。概要に表示する種類を渡す。選んだ時点があれば、トップバーに `diffPoint` とタブの `marked`、表に `marks`、画面と詳細パネル・図の拡大に `diff` を渡す。タブの `marked` は、その種類にマーカーの付く項目があるか `removedOf` が空でない種類を真にする。検討事項・タスク・資料・記録の表には `removedOf` で引いたその種類の削除した項目を `removed` で渡す。ハッシュの絞り込みは、その画面を初めて開いたとき（`f.{列}` があるときは再度開いたときも）`initialFilters` で `FilterState.byTab` に入れてから、ハッシュから削除する（`navigate`、`push: false`）。サーバーの配信では、`Prefs.filters` のその画面の分を今の記録で `pruneFilters` にかけてから `initialFilters` の `saved` に渡す（`f.{列}` で開いたときは `Prefs.filters` を書き換えない）。画面に `FilterState` のその画面の絞り込みと `drawerOpen` を渡し、概要以外ではトップバーに絞り込みのボタン（件数は `activeConditionCount`）を渡す。サーバーの配信では、トップバーにコメントのボタン（件数は `review.items` の件数）を、詳細パネルにその項目へのコメントの入力（`forms` に無ければ、同じ向けた先の `review.drafts` の本文で `idle` で作る。`open` は `Prefs.commentFormClosed` が `true` なら偽）とレビュー中のコメントを渡す。`listOpen` ならコメントの一覧を、`DisplayState.open` なら表示の設定を重ねる（`settingsDrawer`）
         - 再描画で詳細パネルを再作成するときは、本文のスクロールの位置を保ち、再作成する前に本文のスクロール領域にフォーカスがあれば、再作成した後の本文のスクロール領域へフォーカスを戻す
         - 詳細パネル・全画面の本文のスクロール領域をスクロールしたら、開いている項目の位置を残す（`writeBodyScrolls`。`scroll` は伝わらないため `document` でキャプチャフェーズで受ける）。詳細パネルか全画面を開く・項目を移る・全画面と行き来するときは、見出し（`heading`）もコメントの箇所（`highlight`）も示さなければ、描いた次のコマで本文をその項目の位置へ戻す（位置は 3 で `readBodyScrolls` で読む。残っていなければ先頭から）
         - 左のパネル（絞り込みのドロワー・コメントの一覧・表示の設定・保存待ち）のどれかを開いているときは、描いた後に前の解除を呼んでから、本文の部品を止め修正する（条件の変更・表示形式の切り替え・書き換えの知らせで再作成した本文にも乗せる）。ピン止めしたコメントの一覧（`Prefs.commentsPinned`）は `inertBehind` で覆った範囲だけを止め、グレーアウトを出さない。それ以外は、`body` の直下のグレーアウト（`div.left-scrim`。`aria-hidden`、トップバーとタブの帯の下から。幅 900px 以下では出さない）に `on` を付け、`inertOutside` で止める。詳細パネルは、左のパネルの中（グレーアウトの上に出した詳細パネルの中を含む）の押下で開いたときだけ `body` に `detail-above-scrim` を付けてグレーアウトの上に出し、それ以外は `inert` を付ける。押下の出どころは `click` をキャプチャフェーズで受けて控え、左のパネルか詳細パネルを閉じたら戻す
         - グレーアウトを押したら、開いている左のパネルを、トップバーのそのパネルのボタンを押したときと同じに閉じ、そのボタンへフォーカスを戻す
         - 詳細パネルを開く・別の項目へ移るときは `StackState.front` を `detail` にする。幅 900px 以下（`NARROW_QUERY`）で詳細パネルと左のパネル（絞り込みのドロワー・コメントの一覧・表示の設定のパネル）を両方開いているときは、`front` の側を前に出す。`left` なら `body` に `left-front` を付け、詳細パネル（`aside.panel`）に `inert` を付ける。`detail` なら `left-front` を外し、開いている左のパネルに `inert` を付ける。それ以外（幅 901px 以上・片方だけ開いている）では `left-front` と、この 2 つに付けた `inert` を外す。幅が 900px をまたいだとき（`NARROW_QUERY` の `change`）も再実行する
      6. コメントの入力のコールバックを次で扱う
         - 「入力」では `forms` の `body` を書き換え、`DRAFT_SAVE_DELAY_MS` 待って書きかけを保つ（`saveDraft`。詳細パネル・一覧を閉じるときと項目を移るときは待たずに保つ。届かないときは何も出さない）
         - 「溜める」では、本文が空白だけなら `empty` にして入力欄へフォーカスを戻す。そうでなければ `saving` にして送り（`add`）、溜めたら入力欄と添えた箇所を空にして `saved`（`count`）、レビュー中を再読み込みして溜めた ID を `checked` に追加し、トップバー・詳細の一番下・一覧を再描画する。断られた・届かないなら本文を残して `failed`
         - 「箇所を外す」では `pendingLoc` から外し、書きかけは箇所を持たない向けた先へ移す
         - 「本文をコピー」では `navigator.clipboard.writeText` でコピーする
         - 「開閉」では、押した後の開閉が閉じるなら `Prefs.commentFormClosed` を `true`、開くなら `null` にして残し（`savePrefs`）、開いている詳細パネル・詳細の全画面の下端の入力を再描画して、その開閉のボタンへフォーカスを戻す。書きかけ（`forms`）はそのまま残し、履歴に積まず、ハッシュも変えない
         - コメント・返信の入力に渡す `voice` は、`micSupported()` が偽なら `disabled`（`voiceReason` は `VOICE_TEXT.noMicrophone`）、`availability.available` が偽なら `disabled`（`availability.detail`）、録っている入力なら `VoiceState.phase`、ほかの入力で録っていれば `disabled`（`VOICE_TEXT.busy`）、それ以外は `idle`
         - 「録音を始める」では、別の入力で録っていれば何もしない。押したときの入力欄の選んだ範囲を `selection` に持ち、`startRecording` で始め（`onLevel` で `levels` に `pushLevel` して録っている入力の波形を再描画する）、`key`・`recording`・`destination`・`label`・`phase: recording`・`elapsed: 0`・`levels: []` にして、再描画した入力の ✓ へフォーカスを移して `ticket` を進め、1 秒ごとに `elapsed` を進めて、トップバーを再描画する。`acquireWakeLock` の関数を `release` に持つ。`denied` なら `status` を `voice-failed`（`VOICE_TEXT.denied`）、`no-microphone` なら `voice-failed`（`VOICE_TEXT.noMicrophone`）にする
         - 「録音をキャンセル」では `recording.cancel()` と `release` を呼び、`key`・`recording`・`destination`・`label` を `null`・`phase: idle` にしてトップバーを再描画し、入力欄の中身を変えず、再描画した入力欄へフォーカスを移して `selection` の範囲に戻す
         - 「文字起こし」では `phase: transcribing` にして `release` を呼び、押したときの `ticket` と入力欄の中身・カーソルの位置・記録の `settings.transcription.action`（無ければ `review`）・向けた先で `finishVoice` を呼ぶ。返ったとき、`ticket` が違えば結果を捨てる。そうでなければ `phase: idle`・`key`・`destination`・`label` を `null` に戻してトップバーを再描画し、録っていた入力が画面に無ければ、結果の中身を `forms` に入れて書きかけを保ち（`saveDraft`）、`failed`・`unavailable` のときだけ `notice` を `failed`（失敗の種類の文。レビュー中への追加は `VOICE_TEXT.awayReviewFailed(label)`、送信は `awaySendFailed(label)`、文字起こし・`unavailable` は `awayTranscribeFailed(label)`）にする。画面にあれば、`reviewed` は `forms` の中身と添えた箇所を空にして `status: reviewed`、書きかけを削除（`saveDraft` を空で）、レビュー中を再読み込みして溜めた ID を `checked` に追加し、トップバーの件数と一覧を再描画する。`sent` は `forms` の中身と添えた箇所を空にして `status: sent`（`entered`）、書きかけを削除（`saveDraft` を空で）、スレッドを再読み込みする。`inserted` は中身を書き換えて入力欄へフォーカスを移し、挿入した文字の後ろにカーソルを置いて `status: inserted`、`failed` は中身を書き換えて入力欄へフォーカスを移し、文字起こしの前に失敗して中身が元のままなら `selection` の範囲に戻して `voice-failed`（`detail`）、`unavailable` は `availability` を `available: false` と返った `reason`・`detail` に書き換えて `voice-failed`（`detail`）にする
         - 「押せないマイクを押す」では `status` を `voice-failed`（`voiceReason` と同じ文）にし、`micSupported()` が真なら文字起こしの可否を再読み込みして `availability` に入れる（使えるようになっていれば `idle` で再描画する。録音は始めない）
         - 録っている入力が画面から消えるとき（詳細パネル・全画面・コメントの一覧・スレッドを閉じる、入力を畳む、別の項目・スレッド・タブへ移る）は、録音も文字起こしも止めない。記録を再読み込みしたとき、`destination` の項目・スレッドが無ければ `recording.cancel()` と `release` を呼び、`key`・`recording`・`destination`・`label` を `null`・`phase: idle` にして `ticket` を進め（文字起こし中の結果を捨てる）、`notice` を `discarded`（`VOICE_TEXT.discarded(id)`）にしてトップバーを再描画する
         - トップバーの「音声入力中の入力欄へ移る」では、`destination` の画面（詳細パネル・詳細の全画面は項目を開き、コメントの一覧は一覧を開いて新しいスレッドの入力を出し、スレッドは一覧でそのスレッドを開く）を、その画面を今開くときと同じ開き方と履歴の扱いで開き、入力が閉じていれば開いて、録音中は ✓、文字起こし中は入力欄へフォーカスを移す。「音声入力の入力欄を開く」は `notice.key` の入力の画面を同じく開いて `notice` を `null` にし、「音声入力の知らせを閉じる」は `notice` を `null` にする。どれもトップバーを再描画する
         - `visibilitychange` で画面が見えたとき、`phase` が `recording` で `release` が `null` なら `acquireWakeLock` を再呼び出しする
         - 項目を指さない入力は、幅 720px 以下でフォーカスが無く本文が空なら `collapsed`
      7. 選んだ箇所の入口を次で扱う
         - `pointerup` と、ポインターを押していない間の `selectionchange` で、全画面を開いている間は全画面の中、それ以外は詳細パネルの中の選択から箇所を求め（`selectionLocation`）、あれば入口を出し、無ければ閉じる（図の拡大を開いている間は出さない）
         - 「押す」では入口を閉じ、`Prefs.commentFormClosed` が `true` なら `null` にして残し（`savePrefs`）、`pendingLoc` に入れて下端の入力（全画面を開いている間は全画面の下端の入力）を再描画し、その入力欄へフォーカスを移す。「閉じる」では入口を閉じて本文へフォーカスを戻す
      8. コメントの一覧のコールバックを次で扱う（どれも履歴に積まない）
         - トップバーのコメントのボタンで一覧を開くときは、表示の設定を閉じる（`DisplayState.open` を偽）。`StackState.front` を `left` にする
         - 「行の項目を開く」では一覧を開いたまま詳細パネルを開き、`highlight` にその箇所を渡す
         - 「修正を送信する」「箇所を外す」では `update`、「削除」では `remove` して削除した中身を `removed` に入れ、「元に戻す」ではその中身を `id`・`created` ごと `add` して `removed` から外す。終えたらレビュー中を再読み込みして再描画する
         - 「まとめて送信する」ではチェックした ID を溜めた順に `send` し、201 なら `removed`・`stale` を空にして、結果を `sent`（`count` は送信した件数、`at` は応答の `sent`、`entered` は応答の `entered`）にする（文言は `commentsPanel` が `entered` で出し分ける）。409 なら `stale` を入れて理由を出し、届かない・そのほかは理由を出す。どの場合もレビュー中を再読み込みする
         - Esc は、幅 901px 以上か `StackState.front` が `detail` で詳細パネルを開いていれば、詳細パネルを閉じる。それ以外は「スレッドの画面の操作」の Esc（`isTyping` の扱い・`view` ごとの戻る / 閉じる）に従う
         - 一覧を開くときは、絞り込みのドロワーと表示の設定のパネルを閉じる（`drawerOpen`・`DisplayState.open` を偽）
         - 「ピン止めの切り替え」では `Prefs.commentsPinned` を `true` と `null` で入れ替えて残し（`savePrefs`）、パネルを開いたまま再描画して 5 のグレーアウトと止める部品を再実行する
      9. 絞り込みのコールバックを次で扱う（どれも履歴に積まない）
         - トップバーの絞り込みのボタンでは `drawerOpen` を入れ替える。開くときはコメントの一覧と表示の設定のパネルを閉じ、`StackState.front` を `left` にする
         - Esc は、幅 900px 以下で `StackState.front` が `left` ならドロワーだけを閉じ、詳細パネルは閉じない
         - 画面の「条件を変える」では `FilterState.byTab` のその画面の分を置き換え、トップバーと画面を再描画する（ドロワーは開いたまま）。サーバーの配信では、`Prefs.filters` のその画面の分も同じ条件に置き換えて残す（`savePrefs`。結果を `DisplayState.storageOk` に入れる。表示の設定を開いていれば再描画する）
         - 画面の「ドロワーを閉じる」では `drawerOpen` を偽にして再描画し、トップバーの絞り込みのボタンへフォーカスを戻す
         - 概要へ移ったときは `drawerOpen` を偽にする
      10. 変更履歴のコールバックを次で扱う（どれも記録を再読み込みせず、履歴に積まない）
         - 「変更履歴を開く」では変更履歴のモーダルを開く（`historyDialog`。時点の件数は `resolveDiffPoint` の `added`・`changed`・`removed` の件数の和）
         - 「時点を選ぶ」「差分の表示をやめる」では `Prefs.diffSel` を書き換えて残し（`savePrefs`）、3 の時点の再取得と 5 を再実行する。`Route.diff` をその時点（やめるときは `null`）にしたハッシュに置き換える（`navigate`、`push: false`）
      11. 表示の設定のコールバックを次で扱う（どれも記録を再読み込みせず、履歴に積まない）
         - トップバーの表示の設定のボタンで `DisplayState.open` を入れ替える。開くときはコメントの一覧と絞り込みのドロワーを閉じ（`listOpen`・`drawerOpen` を偽）、詳細パネルは開いたままにし、`StackState.front` を `left` にする。閉じる（×・Esc。幅 900px 以下で `StackState.front` が `left` なら Esc は表示の設定を閉じる。それ以外で詳細パネルを開いていれば Esc は詳細パネルを先に閉じる）ときはトップバーのボタンにフォーカスを戻す
         - 「表示する種類を変える」では `Prefs.kinds` を書き換えて残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けと 5 を再実行する。開いている画面の種類を外したときは概要へ移す（`navigate`、`push: false`）
         - 「既定に戻す」では個人の上書きを外して残し（`clearOverrides`、`savePrefs`）、`FilterState.byTab` を空にして、3 と 5 を再実行する（開いている画面は画面の既定の条件で開き直る）。フォーカスは「ワークスペースの既定のまま表示しています。」へ移す
         - 「ワークスペースの既定にする」では `DisplayState.confirm` を `{busy: false, error: null}` にして確かめを開く（`settingsConfirm`。`from` は既定、`to` は今当てている値）
         - 確かめの「保存する」では `busy` にして送信する（`putDisplay`）。200 なら確かめを閉じ、返った `display` を記録の `settings.display` と `savedDisplay` に入れ、`message` を「ワークスペースの既定にしました（{MM/DD HH:mm}）。」にして 3 と 5 を再実行する（個人の上書きはそのまま残す）。断られたら `error` に「保存できませんでした。{detail}」、届かないなら立ち再起動の案内を入れて確かめを再描画する（画面設計『既定の保存の確かめ』の文言）
         - 確かめの「取り消す」と Esc（`busy` の間は受けない）では確かめを閉じ、「ワークスペースの既定にする」にフォーカスを戻す
         - トップバーのライト / ダークと表の「列の表示」「初期設定に戻す」も `Prefs` の上書きとして残し、開いていれば表示の設定を再描画する（「この端末で変えている項目」を合わせる）
      12. 書き換えの知らせにつなぐ（`subscribeEvents`）。`changed` では保存待ちの編集も再読み込みする（`editApi().read`）。再読み込みは 1 回ずつ順に流し、流している間に `changed` を受けたら、終わった後にもう 1 回だけ再読み込みする（その間に続けて受けた知らせは 1 回にまとめる）。保存できた後とつながり修正した後の再読み込みも同じ順番に載せる
         - `changed` を受けた場合、記録を再読み込みし、開いている画面・表示形式・ハッシュ・詳細パネルの項目・表の並べ替え・`FilterState`・`CommentState`・`DisplayState`・選んだ時点と「前回開いてから」の始まりを保ったまま 3・5 を履歴に積まずに再描画する。開いていた項目が消えていれば詳細パネルを閉じる。再読み込みが読めない（422）場合は再描画しない
         - 再読み込みした記録で選んだ時点が引けなくなった（まとまりが消えた・`pending` が空になった）場合、`Prefs.diffSel` と `Route.diff` を `null` にして残し（`savePrefs`）、ハッシュを置き換える（`navigate`、`push: false`）
         - 再読み込みした `settings.display` が前と違う場合、`savedDisplay` と等しければ `savedDisplay` を `null` に戻すだけにする。そうでなければ、画面の下に「ワークスペースの既定が変わりました。」を `NOTICE_MS` の間出し、`message` を「ワークスペースの既定が変わりました（{MM/DD HH:mm}）。」にする（上書きを持たない項目だけが、読み分けで新しい既定になる）
         - `duplicate_ids` を受けた場合、ID と記録の項目の種類の名前を `duplicateIds` にしてトップバーを再描画する。閉じたら `duplicateIds` を空にし、閉じたときの ID の集まりと違う `duplicate_ids` を受けるまで再表示しない。ID のリンクを押すとその項目の詳細パネルを開く
         - つながりが切れた場合、接続の状態を `offline`（読んだ日時は最後に読めた記録の `built_at`）にしてトップバーを再描画する
         - つながり修正した場合、記録とレビュー中を再読み込みして接続の状態を `online` に戻す
      13. `hashchange`・`popstate` で 3 の選んだ時点の再取得と 4・5 を繰り返す
      14. サーバーの配信では、編集を次で扱う（`EditState`。どれも履歴に積まない）
         - 2 で保存待ちの編集も読む（`editApi().read`）。3 の索引は、差分の表示中でなければ `applyEdits` で当てた記録から作る（差分の表示中は当てない。保存待ちの編集は残し、やめると再描画する）
         - 5 で、差分の表示中でなければ、トップバーに `pending`（件数・`EditState.open`・`blocked` があるか）、一覧の 4 画面に `edit`（`pendingMarkOf` で求めたマーカーとその種類の `item-add`）、詳細パネルに `edit`、表示の設定に `onWorkspace` を渡す。`EditState.open` なら保存待ちのパネルを重ね、`workspaceOpen` なら本文の区画を設定の画面に置き換える
         - 差分の表示に移ったときは、保存待ちのパネルと設定の画面を閉じ、`editing` を `null` にする
         - 「編集する」では `editing` をその項目と `null` で入れ替える。「項目を追加」では開いていた詳細パネルを閉じ、`adding` に種類を入れて空の項目の `detailEditForm` を詳細パネルと同じ置き方で開く
         - 編集の表示の `on.change`・設定の画面の `on.change`・「項目を削除」では `editApi().add` で溜める（追加する項目は、タイトルを書いたときに `target` を省いた `item-add` を送信し、返った仮の ID を `editing` に入れて `adding` を `null` にする。続くキーは同じ `item-add` の `value` を再送信する。追加する項目の `option-add`・`option-edit`・`option-remove`・`adopt` はその op では送信せず、`value.options` を書き換えた同じ `item-add` を再送信する。`adopt` では選んだ案だけを `adopted: true` にして `status` を決定済みにする。追加する項目の送信は、追加の入力を開くたびに作る送信の並び（`EditState.addSend`。保存待ちの仮の ID の項目を再度開いたときは、その仮の ID と保存待ちの `item-add` の `value` で作る）に積み、前の送信が終わってから順に送信する。送信する `value` は、並びが持つ最後に溜められた `value`（まだ無ければ、その並びの追加の入力の `addDraft`）にその入力を当てて組み立て、溜められたら並びの `value` を送信した値にする（保存待ちの編集の再読み込みの結果は待たない）。当て先は `editing` ではなく並びが持つ仮の ID で引き、タイトルを書いた最初の `item-add` の応答より前に来た入力も、返った仮の ID の `item-add` へ当てて送信し、`target` の無い `item-add` を重ねて送信しない。追加の入力を閉じた・別の追加を始めた後も、並びに積んだ入力はその並びの仮の ID へ送信する。最初の `item-add` の応答で `editing` を仮の ID、`adding` を `null` にするのは、その並びの追加の入力をまだ開いているときに限る。最初の `item-add` が断られた・届かないときは、並びに待たせた入力を送信せずにその並びの `addDraft` に当てて残す）。溜めたら保存待ちの編集を再読み込みして 3・5 を再実行し、その入力欄へフォーカスを戻す。断られた・届かないときは `errors` に理由を入れ、入力を残して再描画する。「削除を取り消す」ではその `item-remove` を `editApi().remove` で外す
         - トップバーの保存待ちのボタンでは `EditState.open` を入れ替える。開くときはコメントの一覧・表示の設定・絞り込みのドロワーを閉じ、`StackState.front` を `left` にする。Esc と「閉じる」はコメントの一覧と同じに扱い、閉じたらトップバーの保存待ちのボタンへフォーカスを戻す
         - 保存待ちのパネルの「開く」では、項目は詳細パネルを編集の表示で開き、`settings` は設定の画面を開く（幅 900px 以下ではパネルを閉じ、詳細パネルを閉じたら再度開く）。「取り消す」では `editApi().remove` して外した ID を `blocked` からも外し、再読み込みして再描画する
         - 「まとめて保存する」では `status` を `saving` にして `editApi().save` を呼ぶ。200 なら `blocked` を空にしてパネルを閉じ、`editing` を `null`、`toast` を「{送信した件数} 件を保存しました。」にして記録と保存待ちの編集を再読み込みする。409 なら `blocked` に結果を入れてパネルを開いたまま書き込めない編集の知らせへフォーカスを移す。届かないときは `offline` にする。どの場合も `idle` に戻してから再描画する（`offline` は次に保存するまで残す）
         - 表示の設定の「設定を編集する」では表示の設定を閉じ、`workspaceOpen` を真にする（幅 900px 以下では保存待ちのパネルも閉じる）。設定の画面の「閉じる」では偽にして開く前の画面を描く
         - 設定の画面を開くたびに文字起こしの可否を再読み込み（`voiceApi().status`）、返ったら `VoiceState.availability` に入れて `workspaceSettings` の `transcription` に渡し、開いている設定の画面の音声入力のまとまり（`data-key` が `transcription.action`・`transcription.preset` の欄）だけを再作成した欄に差し替える（読めなければ `null`。ほかの欄は再描画せず、付け替え先の選択などの入力の途中を残す）
         - 保存待ちの編集の読み取り（`editApi().read`。2・13 と、溜めた・取り消した・保存した後）は送信した順に `EditState.editsReadSeq` で番号を振る。届いた読み取りの番号が `editsAppliedSeq` より小さければ結果を `edits` に当てずに捨て、当てたら `editsAppliedSeq` をその番号にする
         - 編集の表示・設定の画面の `on.change` では、`editApi().add` を送信する前に値を `EditState.sentEdits` に `settledSeq` を `null` にして入れる（`option-add` は入れず、`optionDrafts` の書きかけを溜められるまで残す）。溜められた（`add` が返った）ら、そのキーの値が入れた値のままのときだけ `settledSeq` をその時点の `editsReadSeq` + 1 にする。断られた・届かないときは外さず、理由と一緒に入力欄に残す。`sentEdits` から外すのは次の 3 つだけ: 保存待ちの編集の読み取りを `edits` に当てたら、当てた `edits` に同じキーで同じ値（JSON にして比べる）の編集があるキーと、当てた読み取りの番号が `settledSeq` 以上のキー（その読み取りがサーバーの今の保存待ちを表すため、`edits` にそのキーの編集が無い・ほかの端末の値で載っているも含めて値によらず）を外す／「取り消す」で外した編集と同じキーを外す／「まとめて保存する」が 200 なら全て外す
         - 編集の表示の `on.draft` では、`EditState.optionDrafts` のその項目の分の記号の中身を書き換える（無ければ追加する）。追加したときだけ再描画し、その案の中身の入力欄へフォーカスを移す（打つたびには再描画しない）。その記号の `option-add` を溜められたら（追加する項目では、その記号の案を加えた `value.options` の `item-add` を溜められたら）書きかけから外す。`editing` を変えたとき（追加の入力で仮の ID が振られたときを除く）・差分の表示に移ったとき・保存できたときは `optionDrafts` を空にする。詳細パネルの `form` に、その項目の書きかけを `optionDrafts` で渡す
         - 追加の入力のパネルの `form` にも `optionDrafts` と `on.draft` を渡す。仮の ID が振られる前の書きかけは `NEW_ID_PREFIX` をキーにし、`item-add` を溜めて仮の ID が振られたら、そのキーの書きかけを仮の ID へ移す

    notes:
      確かめ方: 単体テストは持たない。インターフェース定義『プレビューを開く』の結合テストがこの流れを確かめる
      キー操作: 文書の `keydown` で `Ctrl+K`（`metaKey` の `Cmd+K` を含む）を受けたら、入力欄にフォーカスがあっても既定の動作を止め、全体の検索を開く（開いていれば検索の言葉を再選択する）。`/` では開かない
      画面の作り: '`body` を窓の高さに固定し、トップバーとタブの帯の下に画面ごとの領域（画面設計の「画面の領域」）を 1 つ置く（`style.css`）。ページ全体はスクロールさせず、表・ボード（幅 721px 以上）は領域の高さいっぱいに広げて中でスクロールさせ、それより狭い幅では領域ごとスクロールさせる。`100dvh` から帯と余白を引く高さの計算（`.table-wrap`・`.map-wrap`・`.fg-wrap`・`.g3-wrap`）はやめる。詳細パネルの位置（`.panel` の `top`）は帯の下のまま'
      見出しのハッシュ: '5 で詳細パネルに `Route.heading` を渡す。詳細パネルの `on.heading` では `Route.heading` を書き換え、履歴に積まずにハッシュを置き換える（`navigate`、`push: false`）。項目へ移るときは `heading` を `null` にする'
      詳細パネルのレビュー中のコメントの操作: 詳細パネルには、コメントの一覧へ渡すのと同じ書き換えている行（`editing`・`editingIn`・`editError`・`editBody`）と、`CommentState.removed` のうちその項目へのものを `comment.edit` で渡し、`comment.edit.on` には一覧と同じ処理（修正を始める・`saveEdit`・キャンセル・`removeComment`・`restoreComment`）を渡す。書き換えている行は一覧と詳細パネルを合わせて 1 つで、修正を始めると前の書き換えを捨てる。修正を始めた場所（一覧なら `'list'`、詳細パネルなら `'detail'`）を `editingIn` に持ち、入力欄はその場所だけに描かせる。修正を始める・キャンセル・修正できなかったときは、詳細パネルと一覧を両方再描画する（`refreshComments`）。詳細パネルの操作の後は、再描画した詳細パネルの中で、修正を始めたら入力欄（`detail-edit:{ID}`）、送信するかキャンセルしたらその行の「修正」（`detail-edit-open:{ID}`）、削除したら「元に戻す」（`detail-restore:{ID}`）、戻したら戻した行の「修正」へフォーカスを移し、本文のスクロールの位置を保つ。コメントの一覧を開いていない間に、詳細パネルで別の項目へ移るかパネルを閉じたら、`CommentState.removed` と書き換えている行を捨てる。一覧を開いている間でも、詳細パネルで別の項目へ移るかパネルを閉じたら、`editingIn` が `'detail'` の書き換えを捨てる（`CommentState.removed` は残す）。一覧を閉じたら（表示の設定を開いて一覧を閉じるときも）、`editingIn` が `'list'` の書き換えを捨てる。どちらも、入力欄の無い側に「修正」「削除」の無い行を残さないため。ただし、書き換えている行の修正の入力で録音・文字起こし中か、入力欄に出していない文字起こしの結果があるとき（`editHeld`）は、書き換えを捨てない（トップバーから戻ったときに修正の入力のまま開くため）。配る書き出しとサーバーにつながらないときは、今と同じく `comment` を `null` で渡す
      差分の時点の引き継ぎ: 画面・項目を移るとき（画面と部品から受けた移る先の `Route` と、全体の検索から開くとき。`go`）は、移る先の `Route.diff` を今の `Route.diff` にしてから `route` に入れて書く（`navigate`）。概要の `tableRoute` のように `Route` を一から作る移る先でも `diff` を落とさない。`Route.diff` を変えるのは 3・10・13・14 だけ
      本文のまとまりのリンク: 詳細パネルの `on.changeSet` では、渡された値を `resolveDiffPoint` で引き、まとまりの ID として引けたときだけ 10 の「時点を選ぶ」と同じに扱う（`Prefs.diffSel` と `Route.diff` をそのまとまりにし、履歴に積まずにハッシュを置き換える。開いている画面・項目・全画面はそのまま）。引けなければ何もしない
      幅 900px 以下の重なり: 幅 900px 以下で `body.left-front` のとき、`.comments-panel`・`.settings-drawer`・`dialog.drawer.narrow` の `z-index` を `.panel`（35）より上にする（`style.css`）。`body.left-front` が無いときは変えない。幅 901px 以上では、グレーアウト（`.left-scrim`）を本文と詳細パネルの上、左のパネルの下に置き、`body.detail-above-scrim` のときだけ詳細パネルをグレーアウトの上に出す
      書き込みのまとまりのリンク: コメントの一覧に `changeSetOf`（記録の `changes.sets` からまとまりの ID で説明を引く。無ければ `null`）を渡す。コメントの一覧の `on.changeSet` は詳細パネルの `on.changeSet` と同じく扱う（`resolveDiffPoint` で引けたときだけ 10 の「時点を選ぶ」と同じにし、履歴に積まずにハッシュを置き換える）。コメントの一覧（`listOpen`）と、その中の画面・開いているスレッドは変えない
      本文の差分の並べ方: 詳細パネルに `resolveDisplay` の `bodyLayout` を渡す。詳細パネルの `on.layout`（押した並べ方）では、`side` なら `Prefs.bodyLayout` を `side`、`inline` なら `null` にして残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けを再実行して開いている詳細パネル・詳細の全画面だけを再描画する。本文のスクロール領域の `scrollTop` を保ち、押した並べ方のボタン（`[data-layout]`）にフォーカスを戻す。履歴に積まず、ハッシュも変えない。表示の設定を開いていれば再描画する（「この端末で変えている項目」を合わせる）
      レビュー中のコメントの並び: 詳細パネルに `resolveDisplay` の `reviewOrder` を渡す。詳細パネルの `on.order`（押した後の並び）では、`oldest` なら `Prefs.reviewOrder` を `oldest`、`newest` なら `null` にして残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けを再実行して開いている詳細パネル・詳細の全画面だけを再描画する。本文のスクロール領域の `scrollTop` を保ち、並びの切り替えのボタン（`data-focus` が `detail-review-order`）にフォーカスを戻す。履歴に積まず、ハッシュも変えない。表示の設定を開いていれば再描画する（「この端末で変えている項目」を合わせる）
      本文の表とセクションの見せ方: 詳細パネルと表示の設定に `resolveDisplay` の `bodyView` を渡す。表示の設定の `on.bodyView`（`{key, value}`）では、`value` が `BODY_VIEW_DEFAULT` のその項目と同じなら `Prefs` の対応する項目（`fold` → `sectionFold`）を `null`、違えば `value` にして残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けを再実行して開いている詳細パネル・詳細の全画面と表示の設定だけを再描画する。本文のスクロール領域の `scrollTop` を保ち、押したチェックボックスにフォーカスを戻す。履歴に積まず、ハッシュも変えない
      グレーアウトの色: 左のパネルのグレーアウト（`.left-scrim`）と詳細の全画面の後ろの幕（`dialog.full::backdrop`）は、ほかのモーダルと同じ `--scrim`（`style.css`）。使わなくなる `--scrim-soft` は `tokens.css` から削除する

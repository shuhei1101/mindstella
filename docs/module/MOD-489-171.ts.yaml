  - name: resolveDisplay
    title: 表示の読み分け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 表示の設定を変える
    scope: public
    summary: 項目ごとに、個人の上書きがあればそれを、無ければワークスペースの既定を、それも無ければ組み込みの既定を使って、今当てる表示する種類と、既定と上書きを持つ項目を返す
    args:
      - name: prefs
        type: Prefs
        required: true
        passing: positional
        description: 端末の設定
      - name: display
        type: '{visible_kinds?} | undefined'
        required: true
        passing: positional
        description: 記録の `settings.display`（配る書き出しは埋め込みの値）
    returns:
      type: "{kinds: Set<string>, defaultKinds: Set<string>, overrides: string[], minimap: boolean, bodyLayout: 'inline' | 'side', reviewOrder: 'newest' | 'oldest', bodyView: {fold: boolean}}"
      description: 当てる種類、ワークスペースの既定（無ければ全ての種類）、上書きを持つ項目の名前（「表示する種類」・「ライト / ダーク」・「表の列（{種類の名前}）」・「絞り込み（{画面の名前}）」・「差分のミニマップ」・「セクションの折りたたみ」・「本文の差分の並べ方」・「コメントの並び」の順）、差分のミニマップを置くか、本文の差分の並べ方、レビュー中のコメントの並び、本文のセクションの見せ方
    process: |-
      1. 既定を決める（`display.visible_kinds` が無ければ 7 つの種類全て）
      2. `prefs.kinds` が `null` でなければその値を、`null` なら既定を当てる。`minimap` は `prefs.minimap` が `false` のときだけ偽にする。`bodyLayout` は `prefs.bodyLayout` が `side` のときだけ `side`、それ以外は `inline` にする。`reviewOrder` は `prefs.reviewOrder` が `oldest` のときだけ `oldest`、それ以外は `newest` にする。`bodyView` は `BODY_VIEW_DEFAULT` に、`prefs.sectionFold` が `false` なら `fold` を偽にして当てる
      3. `prefs.kinds`・`prefs.theme` が `null` でない項目と、`prefs.columns` の種類ごとに「表の列（{種類の名前}）」を `overrides` に並べる
      4. `prefs.filters` の画面ごとに、条件が画面の既定（`initialFilters(画面, {}, null)`）と違えば「絞り込み（{画面の名前}）」を `overrides` に並べる（記録の表は種類の名前）
      5. `prefs.minimap` が `false` なら `MINIMAP_LABEL`（「差分のミニマップ」）を、`sectionFold` が上書きを持つなら `BODY_VIEW_LABELS.fold` を、`prefs.bodyLayout` が `side` なら `BODY_LAYOUT_LABEL`（「本文の差分の並べ方」）を、`prefs.reviewOrder` が `oldest` なら `REVIEW_ORDER_LABEL`（「コメントの並び」）を、`prefs.focusAfterAdd` が `null` でなければ `FOCUS_AFTER_ADD_LABEL`（「レビューに追加した後のフォーカス」）を、この順に `overrides` の末尾に並べる
    unit_tests:
      - name: test_resolve_display
        case: 正常
        summary: 上書き → ワークスペースの既定 → 組み込みの既定の順に項目ごとに読み分ける
        condition: '`parametrize`: 上書きも既定も無い / 既定がメモを除く 6 種類で上書きが無い / 同じ既定で `kinds` に 7 種類・`theme: dark`・`columns.research` の上書き / `filters` が `{tasks: {status: [未着手]}, decisions: {status: [要見直し, 未決定, 未整理, 保留]}}`'
        mock: なし
        expected: '7 種類・`overrides` が空 / 6 種類・`overrides` が空 / `kinds` が 7 種類、`defaultKinds` が 6 種類、`overrides` が「表示する種類」・「ライト / ダーク」・「表の列（調査）」 / `overrides` が「絞り込み（タスク）」だけ（検討事項は画面の既定と同じなので並べない）'
      - name: test_resolve_display_when_minimap
        summary: 差分のミニマップは上書きが false のときだけ偽で、変えている項目の末尾に並ぶ
        case: 正常
        condition: '既定の無い `display`。`parametrize`: `minimap: null` / `minimap: false` / `minimap: false`・`theme: dark`'
        expected: '`minimap` が真で `overrides` が空 / `minimap` が偽で `overrides` が「差分のミニマップ」 / `overrides` が「ライト / ダーク」・「差分のミニマップ」の順。どれも `look`・`kinds` は既定のまま'
        mock: なし
      - name: test_resolve_display_when_body_layout
        case: 正常
        summary: 本文の差分の並べ方は上書きが side のときだけ side で、変えている項目の末尾に並ぶ
        condition: '既定の無い `display`。`parametrize`: `bodyLayout: null` / `bodyLayout: side` / `bodyLayout: side`・`minimap: false`'
        mock: なし
        expected: '`bodyLayout` が `inline` で `overrides` が空 / `bodyLayout` が `side` で `overrides` が「本文の差分の並べ方」 / `overrides` が「差分のミニマップ」・「本文の差分の並べ方」の順'
      - name: test_resolve_display_when_review_order
        case: 正常
        summary: レビュー中のコメントの並びは上書きが oldest のときだけ oldest で、変えている項目の末尾に並ぶ
        condition: '既定の無い `display`。`parametrize`: `reviewOrder: null` / `reviewOrder: oldest` / `reviewOrder: oldest`・`bodyLayout: side`'
        mock: なし
        expected: '`reviewOrder` が `newest` で `overrides` が空 / `reviewOrder` が `oldest` で `overrides` が「コメントの並び」 / `overrides` が「本文の差分の並べ方」・「コメントの並び」の順'
      - name: test_resolve_display_when_body_view
        case: 正常
        summary: セクションの折りたたみは上書きがあるときだけ偽にし、変えている項目に差分のミニマップと本文の差分の並べ方の間で並ぶ
        condition: '既定の無い `display`。`parametrize`: 上書きが無い / `sectionFold: false` / `minimap: false`・`sectionFold: false`・`bodyLayout: side`'
        mock: なし
        expected: '`bodyView` が `{fold: true}` で `overrides` が空 / `fold` が偽、`overrides` が「セクションの折りたたみ」 / `overrides` が「差分のミニマップ」・「セクションの折りたたみ」・「本文の差分の並べ方」の順'

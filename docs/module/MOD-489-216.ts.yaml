id: MOD-489-216
title: プレビュー / 画面と部品 / looks.ts
test_files:
  - tests/unit/preview/test_looks.py
functions:
  - name: drawLook
    title: 見た目ごとの描き方
    container: plugins/mindstella/skills/mindmap/preview/graph/looks.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: '1 コマ分の玉と線を、`look` の見た目で地・線・注目の線を流れる光・星の順に描く（名前・状態の印・鍵・コメントの印は描かない）。見た目ごとの中身は Issue #28 の表と合意済みのモック（`docs/mock/refs/123/assets/stella.js`）。`glow` は今の円に光のにじみを足し、芯は円を塗る。`starlight` は夜に白い芯・色のにじみ・つながりの多い星の光条、昼に 4 方向にとがった星形。`constellation` は回転に合わせて回る天球の経線 12 本・緯線 5 本、星の手前で切った線、選んだ星の照準の輪（目盛りがゆっくり回る）。`deep` は回転に合わせて流れる遠い星・天の川・星雲（`deepSky`）と寄ると視差で動く塵、光のにじむ星と光条、注目の線を尾を引いて流れる彗星と選んだ星から広がる輪、昼は夜明けの空と光沢のある玉。`dust` は無彩色の細かな点と細い線で、注目の起点とつながる星にだけ種類の色を灯す。星のまたたき（周期 1,900ms）と広がる輪（周期 3,600ms）は `now` で自動で動かす。`frame.reducedMotion` が真のときは、`now` で自分で動くもの（星のまたたき・広がる輪・注目の線を流れる光と彗星・照準の目盛りの回転）を止め、星はまたたきの中ほどの明るさで、輪は描かず、注目の線は流れる光の代わりに強調した線で描く。PoC の判定どおり、`starlight`・`deep` の線は両端の色の `midColor` の単色で 1 本ずつ引き、1 本のパスに線分を 2 本以上入れない。`glow` 以外の星のにじみ・芯・光条は `bakeGlow`・`bakeRay` の絵を置くだけにし、毎コマ作るグラデーションは `deep` と `dust` の地の 1 枚だけにする'
    args:
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        passing: keyword
        description: 当てる見た目
      - name: frame
        type: LookFrame（{context, width, height, dark, colors, now, stars, links, focusLinks, focusId, near, rotate, project, spread, reducedMotion}）
        required: true
        passing: keyword
        description: '1 コマ分の描く材料。`stars` は手前の玉ほど後ろに並べた玉（`{id, kind, degree, x, y, radius, alpha, color, selected, hover, strong, seed}`。`dust` は描いた点の半径を `radius` に書き戻し、名前・鍵をその大きさに合わせて置かせる）、`links` は描く線（`{from, to, type, fromColor, toColor, alpha}`）、`focusLinks` は注目の起点につながる線、`near` は起点とつながる玉の ID、`rotate`・`project` は視点の回転と透視、`spread` は群れのおおよその半径（近い順に 9 割目の玉まで）。`colors` は `tokens.css` から読んだ線・選択の輪・流れる玉の色。`reducedMotion` は `prefers-reduced-motion: reduce` が効いているか'
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_draw_look_when_reduced_motion
        case: 正常
        summary: 動きを減らす設定では、時刻が進んでも同じ絵を描く
        condition: '`parametrize`: 5 つの見た目。注目の起点と、それにつながる線を 1 本持つ同じ `frame` を、`reducedMotion: true` で `now` を 0・950・1,800ms に変えて 3 回描く。比べに `reducedMotion: false` で同じく 3 回描く'
        mock: なし（キャンバスに描いて画素を読む）
        expected: '`reducedMotion: true` の 3 枚は画素が全て同じ。`reducedMotion: false` の 3 枚は、どの見た目でも 1 枚以上が違う'
  - name: lookLabelColor
    title: 見た目ごとの名前の色
    container: plugins/mindstella/skills/mindmap/preview/graph/looks.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 名前の文字の色を返す。`deep` の夜は `#dfe6ff`（星空になじむ青白）、`dust` は夜 `#c9ced6`・昼 `#2a2f36`（無彩色）、ほかは `fallback`
    args:
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        passing: keyword
        description: 当てている見た目
      - name: dark
        type: boolean
        required: true
        passing: keyword
        description: ダークか
      - name: fallback
        type: string
        required: true
        passing: keyword
        description: '`tokens.css` の名前の色'
    returns:
      type: string
      description: 文字の色
    unit_tests:
      - name: test_look_label_color
        case: 正常
        summary: 見た目とライト / ダークで名前の色を読み分ける
        condition: '`parametrize`: `deep`・ダーク / `deep`・ライト / `dust`・ダーク / `dust`・ライト / `glow`・ダーク（`fallback` は `#111111`）'
        mock: なし
        expected: '`#dfe6ff` / `#111111` / `#c9ced6` / `#2a2f36` / `#111111`'
  - name: midColor
    title: 線の色
    container: plugins/mindstella/skills/mindmap/preview/graph/looks.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 両端の星の色（`#rrggbb`）の、成分ごとの平均を四捨五入した色を返す。`starlight`・`deep` の線を 1 本の単色で引くのに使う
    args:
      - name: from
        type: string
        required: true
        passing: keyword
        description: 始まりの星の色
      - name: to
        type: string
        required: true
        passing: keyword
        description: 終わりの星の色
    returns:
      type: string
      description: '`#rrggbb`'
    unit_tests:
      - name: test_mid_color
        case: 正常
        summary: 成分ごとの平均を四捨五入する
        condition: '`parametrize`: `#000000`・`#ffffff` / `#ff0000`・`#0000ff` / `#123456`・`#123456`'
        mock: なし
        expected: '`#808080` / `#800080` / `#123456`'
  - name: bakeGlow
    title: 光の玉の絵
    container: plugins/mindstella/skills/mindmap/preview/graph/looks.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 中心が明るく外へ薄れる光の玉を、一辺 128px のキャンバスに放射状のグラデーション（減衰 `(1 − t)^falloff` を 12 段で近似）で描いて返す。色と減衰ごとに一度だけ作り、2 回目からは同じキャンバスを返す
    args:
      - name: color
        type: string
        required: true
        passing: keyword
        description: '`#rrggbb`'
      - name: falloff
        type: number
        required: true
        passing: keyword
        description: 外へ薄れる速さ（大きいほど芯が締まる）
    returns:
      type: HTMLCanvasElement
      description: 光の玉の絵
    unit_tests:
      - name: test_bake_glow
        case: 正常
        summary: 色と減衰ごとに一度だけ作る
        condition: '`#2dd4bf`・2 を 2 回、`#2dd4bf`・1.4 を 1 回'
        mock: '`document.createElement` を数える'
        expected: 1 回目と 2 回目が同じキャンバス（一辺 128）で、作ったのは 2 枚
  - name: bakeRay
    title: 光条の絵
    container: plugins/mindstella/skills/mindmap/preview/graph/looks.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 十字の光の筋（太さ 3px、中央が濃く両端へ消える）を一辺 128px のキャンバスに描いて返す。色ごとに一度だけ作る。毎コマは長さに合わせて置くだけにする
    args:
      - name: color
        type: string
        required: true
        passing: positional
        description: '`#rrggbb`'
    returns:
      type: HTMLCanvasElement
      description: 光条の絵
  - name: deepSky
    title: 深宇宙の空
    container: plugins/mindstella/skills/mindmap/preview/graph/looks.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 深宇宙の空の素材を、種を決めた乱数で一度だけ作って返す（2 回目からは同じもの）。遠い星 900 個（暗い星ほど多い）、傾けた大円に寄せた天の川の星 1,600 個、色のにじみ 14 個を重ねた一辺 512px の星雲の絵 4 枚（正四面体の 4 方向に貼り、どちらを向いても 1 枚は見える）
    args: []
    returns:
      type: '{stars: {x, y, z, magnitude, color, seed, band}[], nebulae: {image, direction, scale}[]}'
      description: 星の向き（単位ベクトル）・明るさ・色と、星雲の絵と貼る向き

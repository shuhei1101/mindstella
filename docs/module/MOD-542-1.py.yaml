id: MOD-542-1
title: サーバー / 移行 / remove_network_look.py
lead: v0.14.0 の 4 手順目の変換。`.mindstella/config.yaml` の `display` から削除したネットワークの見た目の既定 `network_look` を削除し、`display` が空になったら `display` も削除する。`yaml` と標準ライブラリだけを読み、このバージョンの形式を自分で組み立てる。
constants:
  - name: CONFIG_FILE
    title: 設定のファイル
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/remove_network_look.py
    usecase: 記録の形式の移行
    summary: 書き換える設定（ワークスペースの直下からの相対パス）
    value: '".mindstella/config.yaml"'
  - name: REMOVED_KEY
    title: 削除するキー
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/remove_network_look.py
    usecase: 記録の形式の移行
    summary: '`display` から削除するキー'
    value: '"network_look"'
functions:
  - name: remove_network_look.migrate
    title: ネットワークの見た目の既定を削除する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/remove_network_look.py
    usecase: 記録の形式の移行
    scope: public
    summary: '`config.yaml` の `display` から `network_look` を削除し、空になった `display` も削除する'
    side_effects: '`config.yaml` を書き換える（ほかのファイルは触らない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースの直下
    returns:
      type: list[str]
      description: 変えたファイル（ワークスペースからの相対パス。書き換えたときは `.mindstella/config.yaml` の 1 件。何も変えなければ空）
    process: |-
      1. `CONFIG_FILE` が無ければ空を返す
      2. `CONFIG_FILE` を読み、`display` がオブジェクトで `REMOVED_KEY` を持たなければ何も書かずに空を返す
      3. `display` から `REMOVED_KEY` を削除し、`display` が空になったら `display` も削除する（ほかのキーと並びは変えない）
      4. 一時ファイルに書いてから `os.replace` で置き換え、`CONFIG_FILE` を返す
    exceptions:
      - name: RuntimeError
        condition: '`config.yaml` を YAML として読めない。手順の `StepError` にしてコピーから戻すのは移行が担う'
    unit_tests:
      - name: test_migrate
        case: 正常
        summary: '`network_look` を削除し、空になった `display` も削除する'
        condition: '`parametrize`: `display: {network_look: glow}` と `summary` を持つ設定 / `display: {network_look: dust, visible_kinds: [decisions]}` を持つ設定'
        mock: なし（`tmp_path`）
        expected: '`display` が無く `summary` が同じ / `display` が `{visible_kinds: [decisions]}`。どちらも戻り値が `.mindstella/config.yaml` の 1 件で、ほかのキーと並びが同じ'
      - name: test_migrate_when_already_current
        case: 正常
        summary: もう一度当てても変わらない
        condition: '`parametrize`: `test_migrate` を当てた後の設定 / `display` を持たない設定 / `config.yaml` が無いワークスペース'
        mock: なし
        expected: 戻り値が空で、ファイルが呼ぶ前と同じ（無いファイルを作らない）
      - name: test_migrate_when_unreadable
        case: 異常
        summary: 読めない設定は書き換えずに失敗する
        condition: YAML として読めない `config.yaml`
        mock: なし
        expected: '`RuntimeError`。ファイルが呼ぶ前と同じ'
refs:
  - IF-489-52#
  - MOD-489-164#
test_files:
  - tests/unit/scripts/test_remove_network_look.py

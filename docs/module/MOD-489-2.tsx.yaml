id: MOD-489-2
title: プレビュー / preview-shell
lead: '`tab` の画面と、詳細・変更履歴・保存待ちのパネル・コメントの一覧・表示の設定を重ねて描く SPA の外枠。features の画面を組むのはここだけ。'
components:
  - name: PreviewShell
    title: プレビューの外枠
    kind: コンポーネント
    usecase: プレビューを開く
    summary: search の `tab` の画面を描き、`id`・`full`・`panel` の詳細と、保存待ちのパネル・コメントの一覧・表示の設定を重ねる。トップバーのコメントのボタンと表示の設定のボタンで `panel` を開閉する。トップバーに `useVoiceStore` の `session`・`notice` を `voice`・`voiceNotice` で渡し、「音声入力中の入力欄へ移る」「音声入力の入力欄を開く」で `session.destination`（`notice.key`）の画面を、その画面を今開くときと同じ search の書き換えで開く。記録を再読み込みしたら `discardVoice` を呼ぶ（行き先の有無は `voiceDestinationExists` で作る）。反映の保留（`useStale`）をトップバーの `stale` に、接続し直しの状態（`useConnectionStore` の `refreshing`）を `refreshing` に渡し、「更新する」で `reconnectEvents` を呼ぶ（配る書き出しでは `onRefresh` を渡さない）。保留が下りて描いた後に入力欄の位置を戻す（`restoreAnchor`）。記録を再読み込みしても、開いている入力欄を再作成せず、入力中の値とカーソルの位置を書き換えない。`search` で全体の検索を重ねる（トップバーの検索の入口と `useSearchShortcut` で開き、結果の項目を『プレビューを開く』の制約「画面の移動と項目」「履歴」のとおりに開く）。再読み込みした記録の `settings.display` が前と違えば `displayChanged` を呼び、画面の下の「ワークスペースの既定が変わりました。」を 6 秒出す。変更履歴で選んだ時点は `writeScreenState` の `diffSel` に書き、最初の描画の前に `dropLegacyScreenState` を 1 度呼ぶ。トップバーを包む要素の高さを `ResizeObserver` で測り、`document.documentElement` の CSS 変数 `--topbar-height`（px）に書く（外したときは変数を削除する）。左のパネル（コメントの一覧・保存待ちのパネル・表示の設定）・絞り込みのドロワー・それらのグレーアウトは、この変数を上端に使う
    refs:
      - IF-489-70#
    unit_tests:
      - name: test_preview_shell
        case: 正常
        summary: tab の画面を描く
        condition: '`?tab=tasks` で MSW の記録を返す'
        mock: MSW
        expected: タスクの画面が描かれる
      - name: test_preview_shell_when_item
        case: 正常
        summary: id で詳細パネルを重ねる
        condition: '`?tab=tasks&id=T-1`'
        mock: MSW
        expected: タスクの画面と T-1 の詳細パネルが描かれる
      - name: test_preview_shell_when_full
        case: 正常
        summary: full で全画面にする
        condition: '`?tab=tasks&id=T-1&full=1`'
        mock: MSW
        expected: 詳細の全画面が描かれ、詳細パネルは描かれない
      - name: test_preview_shell_when_settings
        case: 正常
        summary: 設定の画面を開く
        condition: '`?tab=settings`'
        mock: MSW
        expected: 設定の画面が描かれ、タブの帯でどのタブも選ばれていない
      - name: test_preview_shell_when_search_mismatched
        case: 正常
        summary: 記録に合わない値を外す
        condition: '`?tab=tasks&view=cards&id=T-99`'
        mock: MSW
        expected: URL が `?tab=tasks` に置き換わる
      - name: test_preview_shell_when_comments
        case: 正常
        summary: コメントの一覧を開く
        condition: トップバーのコメントのボタンを押す
        mock: MSW
        expected: コメントの一覧が描かれ、URL に `panel=comments`
      - name: test_preview_shell_when_display
        case: 正常
        summary: 表示の設定を開く
        condition: '`?panel=display`'
        mock: MSW
        expected: 表示の設定のパネルが描かれる
      - name: test_preview_shell_when_removed_view
        case: 正常
        summary: 削除したネットワーク・検討事項のマップを指す URL は概要・ボードで開く
        condition: '`parametrize`: `?tab=graph` / `?tab=decisions&view=map`'
        mock: MSW
        expected: 概要が描かれ、URL から `tab` が外れる / 検討事項のボードが描かれ、URL から `view` が外れる
      - name: test_preview_shell_when_search
        case: 正常
        summary: 検索の結果から項目を開く
        condition: '`?tab=tasks&search=1&q=画面&diff=V-1` で、結果の検討事項 D-1 を押す'
        mock: MSW
        expected: 全体の検索が閉じ、URL が `?tab=decisions&id=D-1&diff=V-1` になり、履歴が 1 つ増える
      - name: test_preview_shell_when_search_same_tab
        case: 正常
        summary: 同じ画面の項目は履歴に積まずに詳細パネルを開く
        condition: '`?tab=decisions&view=table&search=1&q=画面` で、結果の D-1 を押す'
        mock: MSW
        expected: URL が `?tab=decisions&id=D-1` に置き換わり（`view` が無い）、履歴の数が変わらない
      - name: test_preview_shell_when_search_hidden_kind
        case: 正常
        summary: 表示しない種類の項目は概要で開く
        condition: 表示する種類にメモが無く、`?tab=tasks&search=1&q=メモ` で結果の N-1 を押す
        mock: MSW
        expected: URL が `?id=N-1` で、概要と N-1 の詳細パネルが描かれる
      - name: test_preview_shell_when_voice
        case: 正常
        summary: 録音中にほかの画面へ移り、トップバーから録音中の入力欄へ戻る
        condition: '`?tab=tasks&id=T-1` で T-1 のコメントの入力のマイクを押し、コメントの一覧で TH-1 を開いてからトップバーの音声入力中の表示を押す'
        mock: MSW と `vi.stubGlobal`
        expected: TH-1 を開いている間もトップバーに音声入力中の表示があり、押すと URL が `?tab=tasks&id=T-1` になって T-1 のコメントの入力の ✓ にフォーカスがある
      - name: test_preview_shell_when_voice_target_removed
        case: 正常
        summary: 録音中に行き先の項目が無くなったら録音を捨てて帯を出す
        condition: T-1 で録音中に、再読み込みした記録に T-1 が無い
        mock: MSW と `vi.stubGlobal`
        expected: トップバーの音声入力中の表示が消え、帯に「T-1 が削除されたため、録音を破棄しました。」
      - name: test_preview_shell_when_records_changed_while_typing
        case: 正常
        summary: 入力中に書き換わったら保留し、離れたら反映する
        condition: '`?tab=tasks&id=T-1` で T-1 のコメントの入力に「途中まで」と入れてフォーカスを置いたまま、MSW の記録に T-2 を追加して偽物の EventSource から `changed` を送信し、続けて入力欄の外を押す'
        mock: MSW・EventSource（偽物）
        expected: 離れるまでタスクの画面に T-2 が無く、「更新があります」のバーが無い。離れた後に T-2 が出て、入力欄の値が「途中まで」
      - name: test_preview_shell_when_records_changed
        case: 正常
        summary: 再読み込みで入力欄を再作成しない
        condition: '`?tab=tasks&id=T-1` で T-1 のコメントの入力に「途中まで」と入れ、フォーカスを入力欄の外へ移してから、MSW の記録に T-2 を追加して `changed` を送信する'
        mock: MSW・EventSource（偽物）
        expected: T-2 が出た後も、コメントの入力の `textarea` が再読み込みする前と同じ要素で、値が「途中まで」
      - name: test_preview_shell_when_topbar_height
        case: 正常
        summary: トップバーの高さを CSS 変数に書く
        condition: '`ResizeObserver` の差し替えで、トップバーを包む要素の高さを 52px にしてから 96px に変える'
        mock: MSW と `vi.stubGlobal`
        expected: '`document.documentElement` の `--topbar-height` が `52px`、変えた後は `96px`。外すと変数が無い'
    container: frontend/src/app/preview-shell.tsx
notes:
  単体テスト: 同じフォルダの `preview-shell.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  修正の入力の音声入力: '`voiceTargetFor` は、向けた先が `{review, thread, target}` のとき、開く画面が `thread` ならそのスレッド、`review` ならコメントの一覧のレビュー中の書き込みの画面、`panel`・`full` なら `target` の詳細パネル（詳細の全画面）を開く。`discardVoice` に渡す `exists` は、`review` の向けた先をレビュー中のコメント（`commentsQuery` の `items`）にその ID があるかで確かめる。単体テストに、修正の入力で録音中にトップバーの表示を押すとレビュー中の書き込みの画面が開き、ほかの画面でそのコメントが記録から無くなって再読み込みすると録音を捨てる場合（`test_preview_shell_when_review_voice`）を追加する。画面からの削除・送信で捨てる経路は `use-comments` の `useRemoveComment`・`useSendComments` が `discardReviewVoice` を呼ぶ'
  絞り込みの候補: '`SearchDialog` に `useFilterCandidatesStore` の `groups` を値ごとに展開した `filterCandidates` と、`apply` を呼んでから `search`・`q` を外す `onApplyFilter` を渡す（`apply` が null の画面ではどちらも渡さない）。`search`・`q` を外す書き換えは積まずに置き換え、積むのは `apply` の 1 つだけにする。単体テスト `test_preview_shell_when_search_filter_candidate`（資料の画面で全体の検索に「廃」を入れ、「タグ = 廃止」を押すと、search が `tab=docs&f.tags=廃止` で履歴が 1 つ増える）を追加する'
  コメントの一覧から開いた詳細パネル: コメントの一覧の `onOpenItem` には、`openItem` を呼ぶ前に `useState` の `detailFromComments` を真にする関数を指定する。`search.panel` が変わったら、描いている途中で前の `panel` と比べて `detailFromComments` を偽に戻す（`useEffect` を使用しない）。`raised` を `detailFromComments && search.panel === "comments" && search.id !== undefined` として求め、`DetailPanel` の `raised` と `CommentsPanel` の `detailRaised` に指定する。詳細パネルの中のリンクで別の項目へ移っても真のままにする。単体テスト `test_preview_shell_when_detail_from_comments`（表示の幅 1440、`?tab=tasks&panel=comments&thread=TH-1` で書き込みの T-1 を押すと、詳細パネルが `data-raised` を持ち、コメントの一覧が `aria-modal` を持たない。先に `?tab=tasks&id=T-1` を開いてからトップバーでコメントの一覧を開いたときは `data-raised` が無い）を追加する

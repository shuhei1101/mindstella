id: MOD-489-2
title: プレビュー / preview-shell
lead: '`tab` の画面と、詳細・変更履歴・保存待ちのパネル・コメントの一覧・表示の設定を重ねて描く SPA の外枠。features の画面を組むのはここだけ。'
components:
  - name: PreviewShell
    title: プレビューの外枠
    kind: コンポーネント
    usecase: SPAを開く
    summary: search の `tab` の画面を描き、`id`・`full`・`panel` の詳細と、保存待ちのパネル・コメントの一覧・表示の設定を重ねる。トップバーのコメントのボタンと表示の設定のボタンで `panel` を開閉する。トップバーに `useVoiceStore` の `session`・`notice` を `voice`・`voiceNotice` で渡し、「音声入力中の入力欄へ移る」「音声入力の入力欄を開く」で `session.destination`（`notice.key`）の画面を、その画面を今開くときと同じ search の書き換えで開く。記録を読み直したら `discardVoice` を呼ぶ。`tab=graph` でネットワークの画面を描き、`search` で全体の検索を重ねる（トップバーの検索の入口と `useSearchShortcut` で開き、結果の項目を『SPAを開く』の制約「画面の移動と項目」「履歴」のとおりに開く）。読み直した記録の `settings.display` が前と違えば `displayChanged` を呼び、画面の下の「ワークスペースの既定が変わりました。」を 6 秒出す
    refs:
      - IF-489-70#
    unit_tests:
      - name: test_preview_shell
        case: 正常
        summary: tab の画面を描く
        condition: '`?tab=tasks` で MSW の記録を返す'
        mock: MSW
        expected: タスクの画面が描かれる
      - name: test_preview_shell_when_item
        case: 正常
        summary: id で詳細パネルを重ねる
        condition: '`?tab=tasks&id=T-1`'
        mock: MSW
        expected: タスクの画面と T-1 の詳細パネルが描かれる
      - name: test_preview_shell_when_full
        case: 正常
        summary: full で全画面にする
        condition: '`?tab=tasks&id=T-1&full=1`'
        mock: MSW
        expected: 詳細の全画面が描かれ、詳細パネルは描かれない
      - name: test_preview_shell_when_settings
        case: 正常
        summary: 設定の画面を開く
        condition: '`?tab=settings`'
        mock: MSW
        expected: 設定の画面が描かれ、タブの帯でどのタブも選ばれていない
      - name: test_preview_shell_when_search_mismatched
        case: 正常
        summary: 記録に合わない値を外す
        condition: '`?tab=tasks&view=map&id=T-99`'
        mock: MSW
        expected: URL が `?tab=tasks` に置き換わる
      - name: test_preview_shell_when_comments
        case: 正常
        summary: コメントの一覧を開く
        condition: トップバーのコメントのボタンを押す
        mock: MSW
        expected: コメントの一覧が描かれ、URL に `panel=comments`
      - name: test_preview_shell_when_display
        case: 正常
        summary: 表示の設定を開く
        condition: '`?panel=display`'
        mock: MSW
        expected: 表示の設定のパネルが描かれる
      - name: test_preview_shell_when_graph
        case: 正常
        summary: ネットワークの入口で SPA の中のネットワークを開く
        condition: '`?tab=decisions&id=D-1` でタブの帯の右端のネットワークの入口を押す'
        mock: MSW
        expected: ネットワークの画面が描かれ、URL が `?tab=graph&id=D-1` で、`window.location.assign` が呼ばれない
      - name: test_preview_shell_when_search
        case: 正常
        summary: 検索の結果から項目を開く
        condition: '`?tab=tasks&search=1&q=画面&diff=V-1` で、結果の検討事項 D-1 を押す'
        mock: MSW
        expected: 全体の検索が閉じ、URL が `?tab=decisions&id=D-1&diff=V-1` になり、履歴が 1 つ増える
      - name: test_preview_shell_when_search_same_tab
        case: 正常
        summary: 同じ画面の項目は履歴に積まずに詳細パネルを開く
        condition: '`?tab=decisions&view=table&search=1&q=画面` で、結果の D-1 を押す'
        mock: MSW
        expected: URL が `?tab=decisions&id=D-1` に置き換わり（`view` が無い）、履歴の数が変わらない
      - name: test_preview_shell_when_search_hidden_kind
        case: 正常
        summary: 表示しない種類の項目は概要で開く
        condition: 表示する種類にメモが無く、`?tab=tasks&search=1&q=メモ` で結果の N-1 を押す
        mock: MSW
        expected: URL が `?id=N-1` で、概要と N-1 の詳細パネルが描かれる
      - name: test_preview_shell_when_voice
        case: 正常
        summary: 録音中にほかの画面へ移り、トップバーから録音中の入力欄へ戻る
        condition: '`?tab=tasks&id=T-1` で T-1 のコメントの入力のマイクを押し、コメントの一覧で TH-1 を開いてからトップバーの音声入力中の表示を押す'
        mock: MSW と `vi.stubGlobal`
        expected: TH-1 を開いている間もトップバーに音声入力中の表示があり、押すと URL が `?tab=tasks&id=T-1` になって T-1 のコメントの入力の ✓ にフォーカスがある
      - name: test_preview_shell_when_voice_target_removed
        case: 正常
        summary: 録音中に行き先の項目が無くなったら録音を捨てて帯を出す
        condition: T-1 で録音中に、書き換えの知らせの後の記録に T-1 が無い
        mock: MSW と `vi.stubGlobal`
        expected: トップバーの音声入力中の表示が消え、帯に「T-1 が削除されたため、録音を破棄しました。」
    container: frontend/src/app/preview-shell.tsx
notes:
  単体テスト: 同じフォルダの `preview-shell.test.tsx` に置く（knowledge の規約『フォルダ構成』）

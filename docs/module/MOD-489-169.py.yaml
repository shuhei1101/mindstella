  - name: stream_events
    title: 書き換えの通知
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: 書き換えのマーカーを `POLL_INTERVAL_SEC` ごとに再作成し、変わったら `changed` を、知らせが無いまま `KEEPALIVE_SEC` が過ぎたら保つための行を書き続ける
    side_effects: '`write` で書き続ける'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配っているワークスペース
      - name: write
        type: Callable[[bytes], None]
        required: true
        passing: positional
        description: 書いて送信す関数（`wfile.write` と `flush`）
      - name: sleep
        type: Callable[[float], None]
        required: false
        default: time.sleep
        passing: injected
        description: 待つ関数
      - name: clock
        type: Callable[[], float]
        required: false
        default: time.monotonic
        passing: injected
        description: 単調な時計
      - name: signature
        type: Callable[[Path], str]
        required: false
        default: workspace_signature
        passing: injected
        description: 書き換えのマーカーを作る関数
    returns:
      type: None
      description: '`write` が `BrokenPipeError`・`ConnectionResetError` を送出したら戻る'
    process: |-
      1. 今のマーカーを控え、最後に書いた時刻を今にする
      2. つながっている間、繰り返す
         - `POLL_INTERVAL_SEC` 待ち、マーカーを再作成する
         - マーカーが前と違う場合、`event: changed` と `data: {印}` の知らせを書き、控えと時刻を更める
         - 変更の検知の重なった ID の集まりが前に書いたものと違う場合（『変更の検知』の `ChangeDetector.duplicate_ids`）、`event: duplicate_ids` と `data: {ID の JSON の配列}` を書く
         - そうでなく、最後に書いてから `KEEPALIVE_SEC` 以上経った場合、`: keepalive` を書く
      3. `write` が `BrokenPipeError`・`ConnectionResetError` を送出したら戻る（画面が閉じた）
    unit_tests:
      - name: test_stream_events
        case: 正常
        summary: マーカーが変わったときだけ changed を書く
        condition: '`signature` が `a` → `a` → `b` → `b` → `c` を返し、2 回目の `write`（`c` への `changed`）が `BrokenPipeError` を送出する。`sleep` は待たない。`clock` は 0.25 ずつ進む'
        mock: '`signature`・`sleep`・`clock`・`write`'
        expected: '書いたものが `event: changed\ndata: b\n\n` の 1 つだけで、戻る'
      - name: test_stream_events_when_idle
        case: 正常
        summary: 変わらないまま 15 秒経つと保つための行を書く
        condition: '`signature` は常に `a`。`clock` は 1 回ごとに 5 秒進む。2 回目の `write` が `ConnectionResetError` を送出する'
        mock: '`signature`・`sleep`・`clock`・`write`'
        expected: '1 回目に書いたものが `: keepalive\n\n` で、戻る'

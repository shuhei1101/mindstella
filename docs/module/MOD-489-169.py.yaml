      - name: test_spa_response_when_client_route
        case: 正常
        summary: 出力に無いパスは index.html
        condition: 同じフォルダで `/decisions` と `/`
        mock: なし（一時ディレクトリ）
        expected: どちらも 200、`text/html; charset=utf-8`、`index.html` の中身
      - name: test_spa_response_when_outside
        case: 正常
        summary: 出力の外を指すパスは index.html
        condition: 一時フォルダの親に `secret.txt` を置き、`/../secret.txt` と `/%2e%2e/secret.txt`
        mock: なし（一時ディレクトリ）
        expected: どちらも `index.html` の中身で、`secret.txt` の中身が無い
      - name: test_spa_response_when_unknown_suffix
        case: 正常
        summary: 表に無い拡張子
        condition: '`assets/app.js.map` を置き `/assets/app.js.map`'
        mock: なし（一時ディレクトリ）
        expected: 200、`application/octet-stream`
      - name: test_spa_response_when_index_missing
        case: 正常
        summary: index.html が無いと 500
        condition: 空の一時フォルダで `/`
        mock: なし（一時ディレクトリ）
        expected: 500 の問題の応答
  - name: transcription_response
    title: 文字起こしの可否の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    scope: public
    summary: 文字起こしを使えるかと理由・プリセットの候補・ワークスペースの文字起こしの設定を返す（インターフェース定義『文字起こしの可否』）
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
    returns:
      type: Response
      description: 200 と `{available, reason, detail, presets, action, preset}`、問題の応答
    process: |-
      1. `Origin` が合わなければ 403 を返す（`check_origin`）
      2. `config.yaml` を読んで検査する（`check_settings`）
         - 問題がある場合、問題の行を改行でつないだ `detail` の 422 を返す
         - `WorkspaceNotFoundError` の場合、そのメッセージの 422 を返す
      3. 文字起こしのインターフェースに尋ねる（`check_availability(context.transcriber)`。鍵を取らない）
      4. 200・`application/json; charset=utf-8`・`Cache-Control: no-store` で、3 の値と `transcription.action`（無ければ `review`。`DEFAULT_TRANSCRIPTION_ACTION`）・`transcription.preset`（無ければ `null`）を返す
    unit_tests:
      - name: test_transcription_response
        case: 正常
        summary: 使えるときは候補と設定を返す
        condition: '`transcription: {action: send, preset: 開発}` のワークスペース。`presets()` が `["一般", "開発"]` を返す偽の実装を `context.transcriber` に入れる'
        mock: 偽の実装
        expected: '200 で `{available: true, reason: null, detail: null, presets: [一般, 開発], action: send, preset: 開発}`、`Cache-Control: no-store`'
      - name: test_transcription_response_when_unavailable
        case: 正常
        summary: 使えないときも 200 で理由を返し、設定が無ければ既定
        condition: '`transcription` を持たないワークスペース。`presets()` が `TranscriberStoppedError` を送出する偽の実装'
        mock: 偽の実装
        expected: '200 で `available: false`・`reason: stopped`・`presets: []`・`action: review`・`preset: null`。本文に `voice-paste` を含まない'
      - name: test_transcription_response_when_rejected
        case: 異常
        summary: 送信元の違いと崩れた設定
        condition: '`parametrize`: `origin="https://attacker.example"` / `transcription.action` が `paste` の `config.yaml`'
        mock: 偽の実装
        expected: '403 / 422（`detail` に `config.yaml: transcription.action`）'
        exception: 送信元の違い・スキーマに合わない
  - name: transcribe_response
    title: 音声の文字起こしの受け付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    scope: public
    summary: 受けた音声を文字起こしのインターフェースへ渡し、起こした文字を返す（インターフェース定義『音声の文字起こし』）。ワークスペースを書き換えないため、書き換えの鍵を取らない
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: content_type
        type: str | None
        required: true
        passing: keyword
        description: '`Content-Type`'
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
      - name: body
        type: bytes
        required: true
        passing: keyword
        description: 読んだ音声（`MAX_AUDIO_BYTES` 以下。上限の確かめは `PreviewHandler.do_POST`）
    returns:
      type: Response
      description: 200 と `{text}`、問題の応答
    process: |-
      1. `Content-Type` の `;` より前（小文字）が `audio/` で始まらなければ 415 を返す
      2. `Origin` が合わなければ 403 を返す（`check_origin`）
      3. 本文が空なら 400 を返す
      4. `config.yaml` の `transcription.preset` を読む（`check_settings`。問題があれば 422）
      5. `context.transcriber` が `None` なら、`reason: stopped` の 503 を返す
      6. `context.transcriber.transcribe(本文, Content-Type, preset=プリセット)` を呼ぶ（再試行しない）
         - `TranscriberStoppedError` の場合、`reason: stopped` と `UNAVAILABLE_DETAILS["stopped"]` の 503 を返す
         - `TranscriberUnsupportedError` の場合、`reason: unsupported` と `UNAVAILABLE_DETAILS["unsupported"]` の 503 を返す
         - `TranscriptionFailedError` の場合、`FAILED_DETAIL` の 502 を返す
         - `TranscriptionTimeoutError` の場合、`FAILED_DETAIL` の 504 を返す
         - どれも `[WARNING]` 文字起こしできなかった（例外の種類・メッセージ。音声は記録しない）
      7. 200・`application/json; charset=utf-8` で `{text}` を返す
    unit_tests:
      - name: test_transcribe_response
        case: 正常
        summary: 音声とプリセットを渡して起こした文字を返す
        condition: '`transcription.preset: 開発` のワークスペース。`Content-Type: audio/webm;codecs=opus`・本文 `b"abc"`。`transcribe` が受けた引数を控えて `案 A にする` を返す偽の実装'
        mock: 偽の実装
        expected: '200 で `{text: 案 A にする}`。偽の実装が `(b"abc", "audio/webm;codecs=opus", preset="開発")` で 1 回呼ばれ、ワークスペースのファイルの更新日時が呼ぶ前と同じ'
      - name: test_transcribe_response_when_no_preset
        case: 正常
        summary: プリセットが無ければ None を渡す
        condition: '`transcription` を持たないワークスペース'
        mock: 偽の実装
        expected: '偽の実装が `preset=None` で呼ばれる'
      - name: test_transcribe_response_when_transcriber_failed
        case: 異常
        summary: 文字起こしの失敗の種類をステータスに分ける
        condition: '`parametrize`: `transcribe` が `TranscriberStoppedError` / `TranscriberUnsupportedError` / `TranscriptionFailedError("busy")` / `TranscriptionTimeoutError` を送出する / `context.transcriber` が `None`'
        mock: 偽の実装
        expected: '503・`reason: stopped` / 503・`reason: unsupported` / 502（`detail` が `FAILED_DETAIL` で `busy` を含まない）/ 504 / 503・`reason: stopped`'
        exception: 文字起こしの失敗
      - name: test_transcribe_response_when_rejected
        case: 異常
        summary: 構造の違う要求は文字起こしへ渡さない
        condition: '`parametrize`: `Content-Type: application/json` / `origin="https://attacker.example"` / 空の本文'
        mock: 偽の実装
        expected: 415 / 403 / 400。どれも偽の実装が呼ばれない
        exception: 構造の違う要求
  - name: run_hook
    title: フックの呼び出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    scope: public
    summary: フックのコマンドの末尾にポート・ワークスペースの名前・画面のパスを追加し、新しいセッションで起動して終わりを待たずに返す
    side_effects: 子プロセスを起動する
    args:
      - name: command
        type: tuple[str, ...]
        required: true
        passing: positional
        description: フックのコマンドと引数（空でない）
      - name: port
        type: int
        required: true
        passing: positional
        description: 常駐サーバーのポート
      - name: name
        type: str
        required: true
        passing: positional
        description: ワークスペースのフォルダの名前
      - name: path
        type: str
        required: true
        passing: positional
        description: そのワークスペースの画面のパス（`page_path`）
    returns:
      type: bool
      description: 起動できたか
    process: |-
      1. `subprocess.Popen([*command, str(port), name, path], start_new_session=True, stdin=DEVNULL, stdout=DEVNULL, stderr=DEVNULL)` で起動する（シェルを通さない・終わりを待たない）
         - `OSError` が起きた場合、偽を返す
           - `[WARNING]` フックを起動できない（コマンド、理由）
      2. 真を返す
    unit_tests:
      - name: test_run_hook
        case: 正常
        summary: 末尾にポート・名前・画面のパスを追加して起動する
        condition: "`command=(sys.executable, \"-c\", \"import sys,pathlib; pathlib.Path(sys.argv[1]).write_text(' '.join(sys.argv[2:]))\", {一時ファイル})`、`port=8784`、`name=\"家計簿\"`、`path=\"/w/mindstella-x-1/mindstella.html\"`"
        mock: なし（本物の子プロセス）
        expected: 真を返し、待つと一時ファイルの中身が `8784 家計簿 /w/mindstella-x-1/mindstella.html`
      - name: test_run_hook_when_command_missing
        case: 異常
        summary: コマンドが無ければ偽で例外を送出しない
        condition: '`command=("mindstella-no-such-command",)`'
        mock: なし
        expected: 偽
  - name: page_path
    title: 画面のパス
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: ワークスペースの ID から、常駐サーバーの待ち受けでの画面のパスを組み立てる（URL・フックの引数に使う）
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
    returns:
      type: str
      description: '`{PREVIEW_PREFIX}/{quote(workspace_id, safe="")}{PAGE_PATH}`'
    process: 1. ID を `urllib.parse.quote(workspace_id, safe="")` でパーセントエンコードし、`PREVIEW_PREFIX` と `PAGE_PATH` の間に置いて返す
    unit_tests:
      - name: test_page_path
        case: 正常
        summary: 日本語を含む ID をパーセントエンコードする
        condition: '`parametrize`: `mindstella-notes-3f2a9c` / `mindstella-家計簿-3f2a9c`'
        mock: なし
        expected: '`/w/mindstella-notes-3f2a9c/mindstella.html` / `/w/mindstella-%E5%AE%B6%E8%A8%88%E7%B0%BF-3f2a9c/mindstella.html`'

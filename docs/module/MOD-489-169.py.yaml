  - name: write_response
    title: 書き込む要求の受け付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    scope: public
    summary: 本文の構造と送信元を確かめ、書き換えの鍵を取って渡した処理を呼び、結果の応答を返す
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: content_type
        type: str | None
        required: true
        passing: keyword
        description: '`Content-Type`'
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
      - name: body
        type: bytes
        required: true
        passing: keyword
        description: 要求の本文（`MAX_REQUEST_BYTES` 以下）
      - name: handle
        type: Callable[[Path, dict[str, Any]], dict[str, Any] | tuple[dict[str, Any], int] | None]
        required: true
        passing: keyword
        description: 鍵を取った中で呼ぶ処理。応答の本文（無ければ `None`）を返す。結果で成功のステータスコードが変わる処理（保存待ちの編集の追加）は `(本文, ステータスコード)` を返す
      - name: status
        type: int
        required: true
        passing: keyword
        description: 成功のステータスコード（201・200・204）
      - name: after
        type: Callable[[dict[str, Any]], dict[str, Any]] | None
        required: false
        default: None
        passing: keyword
        description: 書き換えの鍵を外した後、`handle` が返した本文を受けて応答の本文を返す処理（まとめて送信の Claude Code への入力）。`handle` が `MindmapError` を送出したときは呼ばない
    returns:
      type: Response
      description: 成功の応答か、問題の応答
    process: |-
      1. `Content-Type` のメディアタイプが `application/json` でなければ 415 を返す
      2. `Origin` が合わなければ 403 を返す（`check_origin`）
      3. 本文を UTF-8 の JSON として読む
         - 読めないかオブジェクトでなければ 400 を返す
      4. 書き換えの鍵を取って（`workspace_lock`）`handle` を呼ぶ
         - `MindmapError` の場合、`error_response` の応答を返す
      5. `after` があれば、鍵を外した後に `handle` の結果を渡して呼び、返った値を応答の本文にする
      6. `status`（`handle` が `(本文, ステータスコード)` を返したときはそのステータスコード）で返す（204 は本文を持たない。それ以外は `ensure_ascii=False` の JSON）
    unit_tests:
      - name: test_write_response
        case: 正常
        summary: 処理の結果を指定のステータスで返す
        condition: '`application/json`、`Origin` 無し、`{"a": 1}`。`handle` は `{"ok": true}` を返す。`parametrize`: `status=201` / `status=204`（`handle` は `None`）'
        mock: '`handle`'
        expected: '201 で本文 `{"ok": true}` / 204 で本文が空。`handle` が `(root, {"a": 1})` で 1 回呼ばれる'
      - name: test_write_response_when_rejected
        case: 正常
        summary: 構造・送信元の誤りは処理を呼ばずに問題の応答
        condition: '`parametrize`: `text/plain` / `Origin: https://attacker.example` / 本文 `[1]` / 本文 `{`'
        mock: '`handle`'
        expected: 415 / 403 / 400 / 400。`handle` が呼ばれない
      - name: test_write_response_when_after
        case: 正常
        summary: 鍵を外した後に after を呼び、その結果を返す
        condition: '`handle` は `{"ok": true}` を返す。`after` は呼ばれたときに書き換えの鍵が取れるか（`write_lock.acquire(blocking=False)`）を控え、`{**body, "entered": true}` を返す。`parametrize`: `handle` が成功 / `handle` が `CommentConflictError` を送出する'
        mock: '`handle`・`after`'
        expected: '前者は 201 で本文 `{"ok": true, "entered": true}`、`after` の中で鍵が取れた。後者は 409 で `after` が呼ばれない'
      - name: test_write_response_when_status_returned
        case: 正常
        summary: 処理が返したステータスコードで返す
        condition: '`status=201`。`handle` は `({"id": "E-1"}, 200)` を返す'
        mock: '`handle`'
        expected: '200 で本文 `{"id": "E-1"}`'

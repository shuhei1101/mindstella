id: MOD-489-169
title: サーバー / 配信 / serve.py
lead: 常駐サーバーの待ち受けの `/w/{workspace}` の下で、全てのワークスペースのプレビューを配る。画面・記録・スレッド・書き換えの通知を返し、レビュー中のコメント・下書き・まとめて送信する・スレッドの状態の書き換え・スレッドの利用者の既読・設定の既定の書き換え・設定の再読み込み・書き込みをすぐ送信するを受け付ける。まとめて送信した後とすぐ送信した後は Claude Code へ入力する。文字起こしの可否を返し、受けた音声を文字起こしのインターフェースへ渡す。ビルド（雛形と記録）とコメントとスレッドと Claude Code への入力と設定の更新と文字起こしと読み書きと検証に依存する。
test_files:
  - tests/unit/scripts/test_serve.py
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    serve.py   配信の台帳・常駐サーバーの経路の要求の振り分け・画面と記録・書き換えの通知・コメントの受け付け・最後に検査に通った設定と再読み込み・文字起こしの受け付け
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 配信の台帳
        class 配信の文脈
        class 要求のハンドラー
        class ビルド
        class コメント
        class スレッド
        class Claude Codeへの入力
        class 外から見る設定
        class フックの呼び出し
        class 文字起こしのインターフェース
        配信の台帳 --> 配信の文脈 : ワークスペースごとに 1 つ
        配信の台帳 --> 外から見る設定
        配信の台帳 --> フックの呼び出し : 配り始めたとき・やめるとき
        要求のハンドラー --> 配信の台帳 : ワークスペースの ID で配信の文脈を引く
        要求のハンドラー --> ビルド : 雛形・記録
        要求のハンドラー --> コメント : /api/comments・/api/drafts
        要求のハンドラー --> スレッド : /api/threads
        要求のハンドラー --> Claude Codeへの入力 : まとめて送信した後・すぐ送信した後
        要求のハンドラー --> 文字起こしのインターフェース : /api/transcription・/api/transcriptions
      ```
data_models:
  - name: ServeContext
    title: 配信の文脈
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: DTO
    summary: 要求のハンドラーが使う、配っているワークスペースと待ち受けの値（ワークスペースごとに 1 つ。配信の台帳が持つ）。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: root
        type: Path
        description: 配っているワークスペース
      - name: port
        type: int
        description: 常駐サーバーの待ち受けのポート（`MINDSTELLA_PORT`。`check_host`・`check_origin` と画面の URL に使う）
      - name: write_lock
        type: threading.Lock
        description: プロセスの中の書き換えの鍵
      - name: settings
        type: SettingsHolder
        description: 最後に検査に通った設定
      - name: preview_dir
        type: Path
        default: PREVIEW_DIR
        description: 雛形のフォルダ
      - name: allowed_hosts
        type: frozenset[str]
        default: frozenset()
        description: 許可するホスト名（`check_host`・`check_origin` に渡す）
      - name: input_targets
        type: InputTargets | None
        default: None
        description: ワークスペースごとの Claude Code への入力の宛先（モジュール構成『ClaudeCodeへの入力』）。`None` ならまとめて送信した後に入力しない
      - name: transcriber
        type: Transcriber | None
        default: None
        description: 文字起こしのインターフェース（モジュール構成『文字起こし』）。`None` なら文字起こしの可否は `stopped`
      - name: workspace_id
        type: str
        description: ワークスペースの ID（`workspace_id_of`。画面のパスの `{workspace}`）
  - name: Response
    title: 応答
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: DTO
    summary: 処理の関数が返す、書く前の応答。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: status
        type: int
        description: ステータスコード
      - name: content_type
        type: str
        description: '`Content-Type`'
      - name: body
        type: bytes
        description: 本文
  - name: ExternalAccess
    title: 外から見る設定
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    role: DTO
    summary: 環境変数から読んだ、許可するホスト名と起動時・終了時のフック。`@dataclass(frozen=True, slots=True, kw_only=True)`。どの値も無いときは空の既定値（`ExternalAccess()`）で、今と同じ動きになる
    properties:
      - name: allowed_hosts
        type: frozenset[str]
        default: frozenset()
        description: 許可するホスト名（小文字）
      - name: start_hook
        type: tuple[str, ...]
        default: ()
        description: 起動時のフックのコマンドと引数（空なら呼ばない）
      - name: stop_hook
        type: tuple[str, ...]
        default: ()
        description: 終了時のフックのコマンドと引数（空なら呼ばない）
classes:
  - name: PreviewRegistry
    title: 配信の台帳
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: 長期保持のランタイム状態
    summary: このプロセスが配っているワークスペースを絶対パスごとに 1 つ（配信の文脈）持ち、ワークスペースの ID でも引けるようにする。待ち受けは持たず、要求は常駐サーバーの経路（`PreviewEndpoint`）が受ける。作るときにツールと共有する書き換えの鍵を位置引数で、常駐サーバーのポートと外から見る設定をキーワード引数で受け取る（`PreviewRegistry(write_lock, port=port, external=ExternalAccess())`）。ワークスペースごとの Claude Code への入力の宛先も持つ。文字起こしのインターフェースもキーワード引数 `transcriber` で受け取る（既定は `None`）。入力の宛先の台帳は、入口が状態のフォルダとワークスペースの ID の引き方（`workspaces.workspace_id_of`）を渡して作った `InputTargets` を `input_targets` で受ける（無ければ空の台帳）
    kind: クラス
    properties:
      - name: _servers
        type: dict[Path, ServeContext]
        access: 内部 (_)
        description: ワークスペース → 配信の文脈
      - name: _write_lock
        type: threading.Lock
        access: 内部 (_)
        description: ツールと共有するプロセスの中の書き換えの鍵（コメントの受け付けが取る）
      - name: _guard
        type: threading.RLock
        access: 内部 (_)
        description: '`_servers`・`_detectors` を触る間だけ取る鍵'
      - name: _external
        type: ExternalAccess
        access: 内部 (_)
        description: 外から見る設定（許可するホスト名を配信へ渡し、フックを呼ぶ）
      - name: _input_targets
        type: InputTargets
        access: 内部 (_)
        description: ワークスペースごとの Claude Code への入力の宛先（`InputTargets()`。立てる配信へ渡す。配信の前に受けたセッションも持つ）
      - name: _transcriber
        type: Transcriber | None
        access: 内部 (_)
        description: 文字起こしのインターフェース（モジュール構成『文字起こし』。立てる配信へ渡す）
      - name: _detectors
        type: dict[Path, ChangeDetector]
        access: 内部 (_)
        description: ワークスペース → 配信と一緒に始めた変更の検知
      - name: _port
        type: int
        access: 内部 (_)
        description: 常駐サーバーの待ち受けのポート（配信の文脈・画面の URL・フックに使う）
      - name: _by_id
        type: dict[str, Path]
        access: 内部 (_)
        description: ワークスペースの ID → 配っているワークスペース（`_guard` の中で `_servers` と一緒に書き換える）
    methods:
      - name: remember_session
        title: 宛先を書き換える
        kind: メソッド
        summary: そのワークスペースの Claude Code への入力の宛先を、ツールを呼んだセッションにする（配信を立てていなくても持つ）
        args:
          - name: root
            type: Path
            required: true
            passing: positional
            description: ワークスペースの絶対パス
          - name: session
            type: Session
            required: true
            passing: positional
            description: ツールを呼んだセッション
        returns:
          type: None
          description: '-'
        process: 1. `_input_targets.remember(root, session)` を呼ぶ
      - name: start
        title: 配り始める
        kind: メソッド
        summary: そのワークスペースを配り始め、画面の URL と今配り始めたかを返す。配っていればその URL を返す
        args:
          - name: root
            type: Path
            required: true
            passing: positional
            description: ワークスペースの絶対パス
        returns:
          type: tuple[str, bool]
          description: 画面の URL（`url_of` と同じ）と、この呼び出しで配り始めたか
        process: |-
          1. `_guard` を取り、`_servers` にあればその URL と `False` を返す（検査しない・フックを呼ばない）
          2. ワークスペースの ID を引く（『変更の検知』の `workspace_id_of`）
             - `_by_id` に別のフォルダがある場合、ID と配っているフォルダを持った `WorkspaceIdConflictError` を送出する（配らない・フックを呼ばない）
          3. `config.yaml` を検査する（設定の検査。`check_settings`）
             - 問題がある場合、問題ごとの `config.yaml: {キーのパス}: {理由}` を `lines` に持った `SchemaMismatchError` を送出する（配らない）
          4. 読んだ設定を初めの値に、`root`・ID・`_port`・`_write_lock`・`_external.allowed_hosts`・`_input_targets`・`_transcriber` で `ServeContext` を作り、`_servers` と `_by_id` に入れる
          5. そのワークスペースの変更の検知を始める（『変更の検知』の `ChangeDetector.start`。書き換えの鍵と入力の宛先を渡す）
             - `[INFO]` ワークスペースを配り始めた（ワークスペース、URL）
          6. `_external.start_hook` があれば、`_port`・ワークスペースのフォルダの名前・画面のパス（`page_path`）でフックを呼ぶ（`run_hook`）
          7. URL と `True` を返す
        unit_tests:
          - name: test_start
            case: 正常
            summary: 同じワークスペースは同じ URL、別ならパスの違う URL
            condition: 作成済みのワークスペース 2 つ。`port=8784` で作った台帳で、一つ目を 2 回、二つ目を 1 回 `start` する
            mock: なし（待ち受けを立てない。後で `stop_all`）
            expected: 1 回目 `(url1, True)`、2 回目 `(url1, False)`、二つ目 `(url2, True)`。どちらも `http://127.0.0.1:8784/w/` で始まり `/mindstella.html` で終わり、間がそれぞれのワークスペースの ID をパーセントエンコードしたもの
          - name: test_start_when_settings_invalid
            case: 異常
            summary: config.yaml が合わなければ配らず、修正すれば配る
            condition: '`display.visible_kinds` を `[rainbow]` にしたワークスペースで 2 回 `start` し、`[decisions]` に変更してもう 1 回 `start` する'
            mock: なし（後で `stop_all`）
            expected: '1・2 回目は `SchemaMismatchError`（`lines` に `config.yaml: display.visible_kinds` で始まる行）で台帳が空。3 回目は `(url, True)`'
          - name: test_start_when_start_hook_set
            case: 正常
            summary: 配り始めたときだけ起動時のフックを呼ぶ
            condition: '`port=8784`・`external=ExternalAccess(start_hook=("hook",))` で作り、同じワークスペースを 2 回 `start` する'
            mock: '`run_hook`（`serve` モジュールの参照を monkeypatch し、受け取った引数を記録する）'
            expected: '`run_hook` が 1 回だけ、`(("hook",), 8784, {フォルダの名前}, "/w/{ID}/mindstella.html")` で呼ばれる'
          - name: test_start_when_id_conflicts
            case: 異常
            summary: 配っている別のフォルダと ID が重なれば配らない
            condition: 作成済みのワークスペース A を `start` し、A を丸ごとコピーした B（`config.yaml` の `id` が同じ）を `external=ExternalAccess(start_hook=("hook",))` の台帳で `start` する
            mock: '`run_hook`（受け取った引数を記録する）'
            expected: '`WorkspaceIdConflictError`（メッセージに ID と A のパス）で、台帳は A だけ、`run_hook` は A の 1 回だけ'
            exception: ワークスペースの ID の重なり
      - name: context_of
        title: 配信の文脈を引く
        kind: メソッド
        summary: ワークスペースの ID で配っているワークスペースの配信の文脈を返す（要求のハンドラーが使う）
        args:
          - name: workspace_id
            type: str
            required: true
            passing: positional
            description: ワークスペースの ID（パーセントエンコードを戻したもの）
        returns:
          type: ServeContext | None
          description: 配信の文脈。配っていなければ `None`
        process: |-
          1. `_guard` を取り、`_by_id` で引いたワークスペースの `_servers` の値を返す
             - 無い場合、`None` を返す
        unit_tests:
          - name: test_context_of
            case: 正常
            summary: 配っている ID だけ文脈を返す
            condition: ワークスペース A を `start` し、A の ID と配っていない ID を渡す
            mock: なし
            expected: A の ID は `root` が A の文脈、配っていない ID は `None`
      - name: url_of
        title: 配っている URL
        kind: メソッド
        summary: そのワークスペースを配っていれば画面の URL を、配っていなければ `None` を返す（配り始めない）
        args:
          - name: root
            type: Path
            required: true
            passing: positional
            description: ワークスペースの絶対パス
        returns:
          type: str | None
          description: '`http://127.0.0.1:{_port}{page_path}`。台帳に無ければ `None`'
        process: |-
          1. `_guard` を取り、`_servers` を `root.resolve()` で引いた文脈の ID で URL を組み立てて返す（`page_path`）
             - 無い場合、`None` を返す
        unit_tests:
          - name: test_url_of
            case: 正常
            summary: 配っているワークスペースだけ URL を返す
            condition: 作成済みのワークスペース 2 つ。一つ目だけ `start` する
            mock: なし（後で `stop_all`）
            expected: 一つ目は `start` が返した URL、二つ目は `None`。台帳が 1 つのまま
      - name: listing
        title: 配信の一覧
        kind: メソッド
        summary: 配っているワークスペースと画面の URL を、ワークスペースの絶対パスの昇順で返す（`server_status`・`server_stop` の `previews`）
        returns:
          type: list[dict[str, Any]]
          description: '`[{workspace: 絶対パスの文字列, url}]`'
        process: 1. `_guard` を取り、`_servers` をワークスペースの昇順に並べて、それぞれの URL と返す
        unit_tests:
          - name: test_listing
            case: 正常
            summary: ワークスペースの昇順に並べる
            condition: '作成済みのワークスペース `b`・`a` の順に `start` する。`parametrize`: この 2 つ / 配っていない台帳'
            mock: なし（後で `stop_all`）
            expected: '`a`・`b` の順で、それぞれ `start` が返した URL / `[]`'
      - name: stop_workspace
        title: ワークスペースを配るのをやめる
        kind: メソッド
        summary: ワークスペースの ID が一致する配信の文脈と変更の検知を台帳から除外して止める。無ければ何もしない（『ワークスペースの削除』が状態のフォルダを削除する前に呼ぶ。同じフォルダで再作成すると `start` が配信と変更の検知を新しく始める）
        args:
          - name: workspace_id
            type: str
            required: true
            passing: positional
            description: ワークスペースの ID
        returns:
          type: None
          description: '-'
        process: |-
          1. `_guard` を取り、`_by_id` で引いたワークスペースを `_servers`・`_by_id`・`_detectors` から除外して手元に取る
          2. `_guard` を放してから、手元の変更の検知の `ChangeDetector.stop` を呼ぶ
          3. `_external.stop_hook` があれば、`_port`・ワークスペースのフォルダの名前・画面のパスでフックを呼ぶ（`run_hook`）
        unit_tests:
          - name: test_stop_workspace
            case: 正常
            summary: 一致するワークスペースだけ配るのをやめる
            condition: 2 つのワークスペースを配り、片方の ID を渡す
            mock: '`ChangeDetector`'
            expected: 渡した ID の `url_of`・`context_of` が `None` で変更の検知の `stop` が呼ばれ、もう片方は URL を返す
          - name: test_stop_workspace_then_start
            case: 正常
            summary: やめた後の start で配信と変更の検知を新しく始める
            condition: '`stop_workspace` の後に同じフォルダを `start` する'
            mock: なし（後で `stop_all`）
            expected: '`start` が `(url, True)` を返し、変更の検知が台帳にある'
          - name: test_stop_workspace_when_not_served
            case: 正常
            summary: 配っていない ID なら何も変えない
            condition: 1 つのワークスペースを配り、配っていない ID を渡す
            mock: '`ChangeDetector`'
            expected: 配っているワークスペースの `url_of` が同じ URL を返す
          - name: test_stop_workspace_when_stop_hook_set
            case: 正常
            summary: やめたワークスペースについて終了時のフックを 1 回呼ぶ
            condition: '`port=8784`・`external=ExternalAccess(stop_hook=("hook",))` で作り、1 つ配ってその ID を渡す'
            mock: '`run_hook`（受け取った引数を記録する）'
            expected: '`run_hook` が 1 回だけ、`(("hook",), 8784, {フォルダの名前}, "/w/{ID}/mindstella.html")` で呼ばれる'
      - name: stop_all
        title: 全てのワークスペースを配るのをやめる
        kind: メソッド
        summary: 配っているワークスペースごとに変更の検知を止め、終了時のフックを呼んで台帳を空にする。2 回呼んでも 2 回目は何もしない（常駐サーバーが終わるときに呼ぶ）
        returns:
          type: None
          description: '-'
        process: |-
          1. `_guard` を取り、`_servers`・`_by_id`・`_detectors` を空の辞書と入れ替えて、入れ替える前の中身を手元に取る（2 回目の呼び出しでは手元が空）
          2. `_guard` を放してから、手元の変更の検知ごとに `ChangeDetector.stop` を呼ぶ
          3. `_external.stop_hook` があれば、手元の配信の文脈ごとに `_port`・ワークスペースのフォルダの名前・画面のパスでフックを呼ぶ（`run_hook`）
        unit_tests:
          - name: test_stop_all
            case: 正常
            summary: やめた後はどのワークスペースも引けない
            condition: 2 つ配ってから `stop_all`
            mock: なし
            expected: どちらの `url_of`・`context_of` も `None`、`listing` が `[]`
          - name: test_stop_all_when_stop_hook_set
            case: 正常
            summary: ワークスペースごとに 1 回だけ終了時のフックを呼ぶ
            condition: '`external=ExternalAccess(stop_hook=("hook",))` で作り、ワークスペース 2 つを `start` してから `stop_all` を 2 回呼ぶ'
            mock: '`run_hook`（`serve` モジュールの参照を monkeypatch し、受け取った引数を記録する）'
            expected: '`run_hook` が 2 回だけ、それぞれ常駐サーバーのポート・フォルダの名前・画面のパスで呼ばれる'
          - name: test_stop_all_when_reentered
            case: 正常
            summary: やめている途中に同じスレッドから呼ばれても止まらず、フックを重ねて呼ばない
            condition: '`external=ExternalAccess(stop_hook=("hook",))` で作り 1 つ配る。差し替えた `run_hook` の中で同じ台帳の `stop_all` を呼ぶ'
            mock: '`run_hook`（受け取った引数を記録し、中で `stop_all` を呼ぶ）'
            expected: '`stop_all` が戻り、`run_hook` が 1 回だけ呼ばれる'
  - name: SettingsHolder
    title: 最後に検査に通った設定
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 設定の再読み込み
    role: 長期保持のランタイム状態
    summary: 1 つの配信が持つ、最後に検査に通った `config.yaml` の中身と、再読み込みの回数。要求ごとのスレッドから読み書きするため、触る間だけ鍵を取る。作るときに初めの設定を位置引数で受け取る（`SettingsHolder(settings)`）
    kind: クラス
    properties:
      - name: _settings
        type: dict[str, Any]
        access: 内部 (_)
        description: 最後に検査に通った設定
      - name: _revision
        type: int
        access: 内部 (_)
        description: 再読み込みで差し替えた回数（0 から）。書き換えのマーカーに混ぜて、ファイルが変わらない再読み込みでも知らせる
      - name: _guard
        type: threading.Lock
        access: 内部 (_)
        description: 触る間だけ取る鍵
    methods:
      - name: current
        title: 今の設定
        summary: 最後に検査に通った設定を返す
        kind: メソッド
        returns:
          type: dict[str, Any]
          description: 設定
        process: 1. `_guard` を取り、`_settings` を返す
      - name: accept
        title: 通った設定を控える
        summary: 記録の取得が検査に通した設定に差し替える（回数は進めない）
        kind: メソッド
        args:
          - name: settings
            type: dict[str, Any]
            required: true
            passing: positional
            description: 検査に通った設定
        returns:
          type: None
          description: '-'
        process: 1. `_guard` を取り、`_settings` を差し替える
      - name: reload
        title: 再読み込みで差し替える
        summary: 設定を差し替え、`_revision` を 1 進める
        kind: メソッド
        args:
          - name: settings
            type: dict[str, Any]
            required: true
            passing: positional
            description: 検査に通った設定
        returns:
          type: None
          description: '-'
        process: 1. `_guard` を取り、`_settings` を差し替えて `_revision` を 1 進める
        unit_tests:
          - name: test_settings_holder
            case: 正常
            summary: accept は回数を変えず、reload だけが進める
            condition: '`{summary: a}` で作り、`accept({summary: b})`、`reload({summary: c})` の順に呼ぶ'
            mock: なし
            expected: '`current()` が `a` → `b` → `c`、`revision()` が `0` → `0` → `1`'
      - name: revision
        title: 再読み込みの回数
        summary: '`_revision` を返す'
        kind: メソッド
        returns:
          type: int
          description: 回数
        process: 1. `_guard` を取り、`_revision` を返す
  - name: PreviewEndpoint
    title: 要求のハンドラー
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: ライブラリが要求するクラス
    summary: 常駐サーバーの経路 `{PREVIEW_PREFIX}/{workspace}` と `{PREVIEW_PREFIX}/{workspace}/{rest:path}` に登録する Starlette のエンドポイント（`async def __call__(request) -> starlette.responses.Response`）。ワークスペースの ID で配信の文脈を引き、メソッドと `rest` で処理の関数へ振り分け、返った応答を Starlette の応答にする。振り分けた先の処理は今の関数（`*_response`・`write_response`）で持ち、このクラスは要求と応答の読み書きだけを持つ。同期の処理の関数は `starlette.concurrency.run_in_threadpool` で呼ぶ
    kind: クラス
    properties:
      - name: _registry
        type: PreviewRegistry
        access: 内部 (_)
        description: 配信の台帳（配信の文脈を引く）
    methods:
      - name: __call__
        title: 要求の振り分け
        kind: メソッド
        summary: ワークスペースの ID で配信の文脈を引き、`Host` を確かめて、メソッドと `rest` で処理の関数へ振り分ける
        args:
          - name: request
            type: starlette.requests.Request
            required: true
            passing: positional
            description: 受けた要求（パスの値 `workspace`・`rest` を持つ。`rest` が無い経路は空の文字列）
        returns:
          type: starlette.responses.Response
          description: 応答
        process: |-
          1. `request.path_params["workspace"]` で配信の文脈を引く（`PreviewRegistry.context_of`。Starlette がパーセントエンコードを戻す）
             - `None` の場合、404 を返す（`problem_response`。`detail` は「配っていないワークスペースです」）
          2. `Host` が合わなければ 403 を返す（`check_host`。文脈の `port` と `allowed_hosts` を渡す）
          3. `rest` の前に `/` を付けたパス（`rest` が無い経路は `""`）とメソッドで分ける（クエリは見ない）。パスごとの処理は前の待ち受けの振り分けと同じで、次だけが違う
             - パスが `""`（`/w/{workspace}`）の場合、`/w/{workspace}/` へ 302 で再送信する
             - `GET /` の場合、`302`・`Location: {PREVIEW_PREFIX}/{workspace}{PAGE_PATH}` で再送信する（パスは受けたままのパーセントエンコードで組み立てる）
             - `GET /spa` の場合、`{PREVIEW_PREFIX}/{workspace}/spa/` へ 302 で再送信する
             - `GET /files/...` の場合、`_send_file` へ渡す
             - `GET /api/events` の場合、`_stream` へ渡す
             - `POST /api/transcriptions` の場合、`_transcribe` へ渡す
             - 本文を読む処理は、`Content-Length` が無いか `MAX_REQUEST_BYTES` を超えれば読まずに 400 を返し、`await request.body()` で読む
             - それ以外のパスは 404 を返す
          4. 処理の関数を `run_in_threadpool` で呼び、返った `Response` を `starlette.responses.Response(content=body, status_code=status, media_type=content_type)` にして `Cache-Control: no-store` を付けて返す
        unit_tests:
          - name: test_endpoint
            case: 正常
            summary: 配っているワークスペースの画面と記録を返す
            condition: 作成済みのワークスペースを `start` した台帳で、経路を登録した Starlette のアプリを `TestClient` で呼ぶ。`/w/{ID}/mindstella.html`・`/w/{ID}/api/records` を GET する
            mock: なし（`TestClient`。`Host` は `127.0.0.1:{port}`）
            expected: 'どちらも 200、`Cache-Control: no-store`。記録はそのワークスペースのもの'
          - name: test_endpoint_when_redirect
            case: 正常
            summary: ワークスペースの先頭と /spa を再送信する
            condition: '同じアプリで、再送信を辿らずに `/w/{ID}`・`/w/{ID}/`・`/w/{ID}/spa` を GET する。`parametrize`: ASCII の ID / 日本語を含む ID'
            mock: なし（`TestClient`）
            expected: 302 で、`Location` がそれぞれ `/w/{ID}/`・`/w/{ID}/mindstella.html`・`/w/{ID}/spa/`（ID はパーセントエンコード）
          - name: test_endpoint_when_workspace_not_served
            case: 異常
            summary: 配っていない ID は 404 で、ほかのワークスペースの記録を返さない
            condition: A だけ `start` した台帳で、配っていない ID の `/w/{ID}/api/records` を GET する
            mock: なし（`TestClient`）
            expected: 404、`application/problem+json`、本文に A の記録が無い
          - name: test_endpoint_when_host_mismatch
            case: 異常
            summary: Host が合わなければ 403
            condition: '`Host: attacker.example:{port}` で `/w/{ID}/mindstella.html` を GET する'
            mock: なし（`TestClient`）
            expected: 403、本文に HTML が無い
          - name: test_endpoint_when_two_workspaces
            case: 正常
            summary: 2 つのワークスペースへの書き込みが別々に入る
            condition: A・B を `start` し、`POST /w/{A の ID}/api/comments` でコメントを溜めてから、両方の `GET /api/comments` を呼ぶ
            mock: なし（`TestClient`）
            expected: A の応答に溜めたコメントがあり、B の応答は空
      - name: _send_file
        title: ファイルの応答
        kind: メソッド
        container: plugins/mindstella/skills/mindmap/scripts/serve.py
        usecase: 動画などのファイルを配置して資料に埋め込む
        scope: internal
        summary: ワークスペースのファイルを解決し、200・206・416 のヘッダーと本文を分けて返す `StreamingResponse` を作る。解決できなければ 404
        args:
          - name: context
            type: ServeContext
            required: true
            passing: positional
            description: 配信の文脈（ワークスペースの直下 `root` を使用する）
          - name: sub_path
            type: str
            required: true
            passing: positional
            description: '`/files/` より後ろのパス（URL エンコードのまま。`request.url.path` から切り出す）'
          - name: range_header
            type: str | None
            required: true
            passing: positional
            description: '`Range` の値'
        returns:
          type: starlette.responses.Response
          description: ファイルの応答か 404
        process: |-
          1. 直下の `{root}/{FILES_DIR}` と `sub_path` でファイルを解決する（ファイルの解決）
             - None の場合、404 を返す（`problem_response`。`detail` は「ファイルがありません」で、パスを含めない。`FILE_SECURITY_HEADERS` を付ける）
          2. `Range` の値で計画を決める（ファイルの応答の計画）
             - `OSError` の場合、同じ 404 を返す
          3. 計画のステータス・`Content-Type`・`Content-Length`（計画の長さ）・計画のヘッダーで `StreamingResponse` を作り、本文はファイルの書き出しをスレッドで分けて読むイテレーターにする（`iterate_in_threadpool`。`Cache-Control: no-store` は付けない）
             - ブラウザが接続を切った場合、Starlette が書き出しをやめる（ほかの要求に影響しない）
        unit_tests:
          - name: test_send_file
            case: 正常
            summary: ファイルの全体と範囲を返す
            condition: 一時ワークスペースに 1000 バイトの直下の `files/clip.mp4` を置き、`start` して `/w/{ID}/files/clip.mp4` を `Range` 無しと `bytes=100-199` で GET する
            mock: なし（`TestClient`）
            expected: '200 で全体、206 で 100〜199 バイト目。どちらも `Cache-Control: no-cache`・`Content-Security-Policy: sandbox`'
          - name: test_send_file_when_missing
            case: 正常
            summary: 解決できなければ 404
            condition: 同じワークスペースで `/w/{ID}/files/missing.mp4` と `/w/{ID}/files/../.mindstella/config.yaml`
            mock: なし（`TestClient`）
            expected: 'どちらも 404 の問題の応答で、本文に `config.yaml` の中身が無い。`Content-Security-Policy: sandbox`・`X-Content-Type-Options: nosniff` を持つ'
      - name: _stream
        title: 書き換えの通知の応答
        kind: メソッド
        scope: internal
        summary: '`200`・`text/event-stream`・`Cache-Control: no-store` の `StreamingResponse` で、画面が閉じるまで書き換えを知らせ続ける'
        args:
          - name: request
            type: starlette.requests.Request
            required: true
            passing: positional
            description: 受けた要求（切断を確かめる）
          - name: context
            type: ServeContext
            required: true
            passing: positional
            description: 配信の文脈
        returns:
          type: starlette.responses.StreamingResponse
          description: 書き換えの通知
        process: |-
          1. 別のスレッドで `stream_events` を動かし、書き出す片を `asyncio.Queue` へ渡す（`loop.call_soon_threadsafe`。書き換えのマーカーは `workspace_signature` の後ろに `|settings:{SettingsHolder.revision}` をつないだもの）
          2. 応答のイテレーターはキューの片を順に返す
          3. 画面が閉じた（`await request.is_disconnected()` が真、またはイテレーターが閉じられた）ら、切断の印を立てて終える。スレッドの書き出しは印を見て `BrokenPipeError` を送出し、`stream_events` を終える
        unit_tests:
          - name: test_stream
            case: 正常
            summary: 書き換えを知らせ、切断でスレッドを終える
            condition: '`start` したワークスペースの `/w/{ID}/api/events` を `TestClient.stream` で開き、記録を書き換えてから閉じる'
            mock: '`POLL_INTERVAL_SEC` を短くする'
            expected: '`changed` の知らせを受け取り、閉じた後に `stream_events` のスレッドが終わる'
      - name: _transcribe
        title: 文字起こしの受け付け
        kind: メソッド
        scope: internal
        summary: 音声の本文を上限まで読み、文字起こしを呼ぶ（前の待ち受けの `POST /api/transcriptions` と同じ）
        args:
          - name: request
            type: starlette.requests.Request
            required: true
            passing: positional
            description: 受けた要求
          - name: context
            type: ServeContext
            required: true
            passing: positional
            description: 配信の文脈
        returns:
          type: starlette.responses.Response
          description: 文字起こしの結果か 413
        process: |-
          1. `Content-Length` があれば `MAX_AUDIO_BYTES` と比べ、超えれば読まずに 413 を返す
          2. `request.stream()` を読みながら数え、`MAX_AUDIO_BYTES` を超えた時点で読むのをやめて 413 を返す
          3. 読んだ本文で `transcribe_response` を `run_in_threadpool` で呼ぶ
        unit_tests:
          - name: test_transcribe_when_too_large
            case: 異常
            summary: 上限を超える音声は 413
            condition: '`Content-Length` を付けずに `MAX_AUDIO_BYTES` + 1 バイトを `/w/{ID}/api/transcriptions` へ送信する'
            mock: 文字起こしのインターフェース（呼ばれたかを記録する）
            expected: 413 で、文字起こしが呼ばれていない
constants:
  - name: LISTEN_HOST
    title: 待ち受けのアドレス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 非機能要件の「待ち受けの範囲」。ポートは `config.yaml` の `preview.port` があればそれ、無ければ 0 で OS に選ばせる
    value: '"127.0.0.1"'
  - name: POLL_INTERVAL_SEC
    title: 書き換えを見る間隔
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 書き換えのマーカーを再作成する間隔（非機能要件の「画面への反映の時間」の内訳）
    value: '0.25'
  - name: KEEPALIVE_SEC
    title: 保つための行の間隔
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: '知らせが無いままこの秒数が過ぎたら `: keepalive` を送信する（インターフェース定義『書き換えの通知』）'
    value: '15'
  - name: MAX_REQUEST_BYTES
    title: 要求の本文の上限
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    summary: 書き込む要求の本文を読む上限。`Content-Length` がこれを超えたら読まずに 400（非機能要件の「送信の本文の長さ」の根拠）
    value: '131072'
  - name: MAX_AUDIO_BYTES
    title: 音声の本文の上限
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    summary: '`POST /api/transcriptions` の本文を読む上限（非機能要件「録音の大きさの上限」）。超えたら 413'
    value: '80000000'
  - name: AUDIO_READ_CHUNK
    title: 音声を読む単位
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    summary: '`Content-Length` を持たない音声の本文を、上限まで数えながら読む 1 回のバイト数'
    value: '65536'
  - name: TRANSCRIPTION_PATH
    title: 文字起こしの可否のパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    summary: GET で文字起こしの可否を返す（インターフェース定義『文字起こしの可否』）
    value: '"/api/transcription"'
  - name: TRANSCRIPTIONS_PATH
    title: 音声の文字起こしのパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    summary: POST で音声を受けて文字起こしする（インターフェース定義『音声の文字起こし』）
    value: '"/api/transcriptions"'
  - name: SEND_NOW_PATH
    title: すぐ送信するのパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 音声でコメントする
    summary: POST で書き込み 1 件をすぐスレッドへ送信する（インターフェース定義『書き込みをすぐ送信する』）
    value: '"/api/comments/send-now"'
  - name: PAGE_PATH
    title: 画面のパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 配信が画面を返すパス（`/w/{workspace}` より後ろ）。`/w/{workspace}/` はここへ再送信し、画面の URL はこのパスで終わる
    value: '"/mindstella.html"'
  - name: ALLOWED_HOSTS_ENV
    title: 許可するホスト名の環境変数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: 許可するホスト名を読む環境変数の名前（設定『サーバー』）
    value: '"MINDSTELLA_ALLOWED_HOSTS"'
  - name: START_HOOK_ENV
    title: 起動時のフックの環境変数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: 配信を立てたときのフックを読む環境変数の名前（設定『サーバー』）
    value: '"MINDSTELLA_PREVIEW_START_HOOK"'
  - name: STOP_HOOK_ENV
    title: 終了時のフックの環境変数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: 配信を止めるときのフックを読む環境変数の名前（設定『サーバー』）
    value: '"MINDSTELLA_PREVIEW_STOP_HOOK"'
  - name: ORIGIN_SCHEMES
    title: 許可するホスト名の送信元のスキーム
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: '`Origin` で許可するホスト名を受けるスキーム（`check_origin`）'
    value: ("https", "http")
  - name: EDITS_PATH
    title: 保存待ちの編集のパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 画面で項目を編集して保存する
    summary: GET（読み取り）・POST（追加）と、DELETE `/api/edits/{id}`（取り消し）の頭
    value: '"/api/edits"'
  - name: EDITS_SAVE_PATH
    title: まとめて保存のパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 画面で項目を編集して保存する
    summary: POST で保存待ちの編集をまとめて保存する
    value: '"/api/edits/save"'
  - name: SPA_PATH
    title: SPA のパスの頭
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: SPAを開く
    summary: SPA を配るパスの頭（インターフェース定義『SPAの配信』）
    value: '"/spa"'
  - name: SPA_DIR
    title: SPA の出力のフォルダ
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: SPAを開く
    summary: プレビューのフォルダの中で Vite が書き出すフォルダの名前
    value: '"spa"'
  - name: SPA_TYPES
    title: SPA の Content-Type
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: SPAを開く
    summary: 出力のファイルの拡張子から Content-Type を引く。表に無い拡張子は `application/octet-stream`
    entries:
      - key: .html
        value: '"text/html; charset=utf-8"'
      - key: .js
        value: '"text/javascript; charset=utf-8"'
      - key: .css
        value: '"text/css; charset=utf-8"'
      - key: .svg
        value: '"image/svg+xml"'
  - name: ITEMS_PATH
    title: 項目のパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 確認済みの設定と解除
    summary: PUT `/api/items/{id}/confirmed`（確認済みの設定と解除）の頭
    value: '"/api/items"'
  - name: PREVIEW_PREFIX
    title: 配信の経路の先頭
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 常駐サーバーの待ち受けで、画面と画面が呼ぶ経路の前に置くパス。後ろに `/{ワークスペースの ID をパーセントエンコードしたもの}` を続ける

        condition: AI の未読の返信 TH-1-2 を持つ TH-1。`origin=None`
        mock: なし
        expected: '200 で `{id: TH-1, seen: [TH-1-2]}`、`Cache-Control: no-store`。`threads.yaml` の TH-1-2 の `seen` が真'
      - name: test_seen_response_when_nothing_unseen
        case: 正常
        summary: 未読が無ければ鍵を取らず書かない
        condition: '全て `seen: true` の TH-1。`workspace_lock` を呼ばれた回数を数える関数に差し替える'
        mock: '`workspace_lock`（`serve` モジュールの参照を monkeypatch）'
        expected: '200 で `{id: TH-1, seen: []}`。`workspace_lock` が呼ばれず、`threads.yaml` の更新日時が呼ぶ前と同じ'
      - name: test_seen_response_when_rejected
        case: 異常
        summary: 送信元の違い・無い ID・崩れたファイルは書かない
        condition: '`parametrize`: `origin="https://attacker.example"` / `TH-9` / `threads.yaml` の書き込みから `seen` を削除する'
        mock: なし

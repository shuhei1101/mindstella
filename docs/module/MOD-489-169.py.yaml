  - name: error_response
    title: エラーの応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    scope: public
    summary: ツールのエラーの種類からステータスコードを決めて問題の応答にする
    args:
      - name: error
        type: MindmapError
        required: true
        passing: positional
        description: 処理が送出した例外
    returns:
      type: Response
      description: 問題の応答
    process: |-
      1. 種類で分ける
         - `CommentInvalidError`・`SettingsInvalidError`・`ArgumentError`・`EditInvalidError` は 400
         - `ItemNotFoundError`・`CommentNotFoundError`・`ThreadNotFoundError`・`EditNotFoundError` は 404
         - `CommentConflictError` は 409（`stale` があれば本文に `stale: [{id, reason}]` を追加する）
         - `EditConflictError` は 409、`EditsBlockedError` は 409（本文に `blocked: [{id, reason, detail, refs}]` を追加する）
         - `WorkspaceNotFoundError`・`SchemaMismatchError` は 422（`detail` はメッセージに `lines` を改行でつないだもの）
         - `WriteFailedError` は 500
         - それ以外は 500
           - `[ERROR]` 渡された種類のないエラー（例外の種類・メッセージ）
      2. `detail` にメッセージを入れた問題の応答を返す（`problem_response`。トレースバックを含めない）
    unit_tests:
      - name: test_error_response
        case: 正常
        summary: 種類ごとのステータスコード
        condition: '`parametrize`: `CommentInvalidError` / `SettingsInvalidError` / `ArgumentError` / `ItemNotFoundError` / `CommentNotFoundError` / `ThreadNotFoundError` / `CommentConflictError(stale=[(C-2, 理由)])` / `SchemaMismatchError(lines=[行])` / `WriteFailedError`'
        mock: なし
        expected: '400 / 400 / 400 / 404 / 404 / 404 / 409（本文の `stale` が `[{id: C-2, reason: 理由}]`）/ 422（`detail` にその行）/ 500'
      - name: test_error_response_when_edits
        case: 正常
        summary: 保存待ちの編集のエラーのステータスコード
        condition: '`parametrize`: `EditInvalidError` / `EditNotFoundError` / `EditConflictError` / `EditsBlockedError(blocked=[BlockedEdit(id=E-1, reason=referenced, detail=理由, refs=[D-2])])`'
        mock: なし
        expected: '400 / 404 / 409 / 409（本文の `blocked` が `[{id: E-1, reason: referenced, detail: 理由, refs: [D-2]}]`）'
  - name: opened_response
    title: 前回開いた日時の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 前回からの差分を見る
    scope: public
    summary: 前回開いた日時と連番を返し、今の値に書き換える（インターフェース定義『前回開いた日時』）
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配っているワークスペース
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: Response
      description: 200 と `{previous, opened}`、`changes.yaml` が読めなければ 422、書けなければ 500 の problem+json
    process: |-
      1. `changes.yaml` を読み（`load_changes`。記録のロックは取らない）、今の連番を求める（`head_until_seq`）
         - `SchemaMismatchError` の場合、`.mindstella-opened` を書き換えずに 422 を返す（`problem_response`、`detail` は `error.lines` を改行でつなぐ）
      2. 前回開いた時点を `{at: now(), seq}` に書き換える（`touch_opened`。記録のロックは取らない）
         - `WriteFailedError` の場合、500 を返す（`problem_response`、`detail` に理由）
      3. 200・`application/json; charset=utf-8`・`Cache-Control: no-store` で `{previous, opened}` を返す
    unit_tests:
      - name: test_opened_response
        case: 正常
        summary: 2 回目は 1 回目の時点を返し、連番は先頭のまとまりの `until_seq`
        condition: '`.mindstella-opened` を持たず、まとまり 1 つとまだまとめていない変更を持つワークスペースで 2 回呼ぶ。`now` は 1 回目と 2 回目で違う日時'
        mock: '`now`'
        expected: 1 回目の `previous` が `null`、`opened.seq` が先頭のまとまりの `until_seq`（`last_seq` でない）。2 回目の `previous` が 1 回目の `opened`
      - name: test_opened_response_when_changes_invalid
        case: 異常
        summary: '`changes.yaml` が読めなければ 422 で、前回開いた時点を書き換えない'
        condition: '`.mindstella-opened` を持ち、`changes.yaml` の `last_seq` を文字列にしたワークスペース'
        mock: なし
        expected: 'ステータスが 422、`Content-Type` が `application/problem+json`、`detail` が `changes.yaml: last_seq:` で始まる行を持つ。`.mindstella-opened` が呼ぶ前と同じ'
        exception: 変更履歴が読めない
      - name: test_opened_response_when_write_fails
        case: 異常
        summary: 書けなければ 500
        condition: '`touch_opened` を `WriteFailedError` を送出する関数に差し替える'
        mock: '`touch_opened`（`serve` モジュールの参照を monkeypatch）'
        expected: ステータスが 500、`Content-Type` が `application/problem+json`
        exception: 書き込めない

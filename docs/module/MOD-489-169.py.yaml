    process: |-
      1. `sub_path` を URL デコードし、先頭の `/` を外して `spa_dir` につなぎ、解決する
      2. 解決したパスが `spa_dir` の配下のファイルでなければ、`spa_dir/index.html` に置き換える
         - `index.html` も無い場合、500 を返す（`problem_response`）
           - `[ERROR]` SPA の出力がありません（`spa_dir`）
      3. 拡張子を `SPA_TYPES` で引いて Content-Type にし、中身を読んで 200 を返す（要求ごとに読み、控えない）
    unit_tests:
      - name: test_spa_response
        case: 正常
        summary: 出力のファイルを返す
        condition: '`index.html` と `assets/app.js` を持つ一時フォルダで `/assets/app.js`'
        mock: なし（一時ディレクトリ）

  - name: patch_thread_status
    title: スレッドの状態の受け付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: スレッドで話す
    scope: public
    summary: 画面からのクローズ・オープンへの戻しを、書き手を利用者にして書く（`write_response` が鍵を取った中で呼ぶ処理）
    side_effects: '`threads.yaml` を置き換える（状態が変わるときだけ）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配っているワークスペース
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: パスの `id`
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト（`status`・`reason`）
    returns:
      type: dict[str, Any]
      description: '`{id, status, changed}`'
    process: |-
      1. ワークスペースを確かめ（`require_workspace`）、`data` の `status`（無ければ `None`）と `reason` を `author="user"` で渡す（`set_thread_status`。`status` が無い・決まった値でない・`reason` が長いは `ArgumentError` で 400 になる）
      2. `{id, status, changed}` を返す（`status` は呼んだ後の状態）
    exceptions:
      - name: ArgumentError
        condition: '`status` が無いか `open`・`closed` でない、`reason` が上限を超える'
      - name: ThreadNotFoundError
        condition: その ID のスレッドが無い
      - name: SchemaMismatchError
        condition: '`threads.yaml` が崩れている'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_patch_thread_status
        case: 正常
        summary: 利用者のクローズを理由つきで書き、取り込み待ちを残す
        condition: '取り込んでいない利用者の書き込みを持つオープンの TH-1。`{status: closed, reason: 案 A で決着}`'
        mock: なし
        expected: '`{id: TH-1, status: closed, changed: true}`。`events` の末尾の `author` が `user` で、書き込みの `taken` が `None` のまま'
      - name: test_patch_thread_status_when_same_or_rejected
        case: 正常
        summary: 既にその状態なら変えず、構造の誤りと無い ID は断る
        condition: 'オープンの TH-1。`parametrize`: `{status: open}` / `{}` / `{status: closed, reason: 401 文字}` / `TH-9` に `{status: closed}`'
        mock: なし
        expected: '`changed: false` / `ArgumentError` / `ArgumentError` / `ThreadNotFoundError`。どれも `threads.yaml` が呼ぶ前と同じ'
  - name: seen_response
    title: 利用者の既読の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: スレッドで話す
    scope: public
    summary: 画面で開いたスレッドの利用者の未読の書き込みを全て既読にし、既読にした ID を返す（インターフェース定義『画面からのスレッドの既読』）。本文を持たないため `write_response` を通さない
    side_effects: '`threads.yaml` を置き換える（未読が無ければ書かない）'
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: パスの `id`
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
    returns:
      type: Response
      description: 200 と `{id, seen}`、問題の応答
    process: |-
      1. `Origin` が合わなければ 403 を返す（`check_origin`）
      2. ワークスペースを確かめ、スレッドを読んで ID で引く（`require_workspace`、`load_threads`。鍵を取らない）
         - `seen` が偽の書き込みが無ければ、書かずに 200 で `{id, seen: []}` を返す

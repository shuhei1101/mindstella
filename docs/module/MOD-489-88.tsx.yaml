id: MOD-489-88
title: プレビュー / topbar
lead: 部品設計『トップバー.tsx』の props・イベント・状態を持つ。
components:
  - name: Topbar
    title: トップバー
    kind: コンポーネント
    container: frontend/src/shared/components/topbar.tsx
    usecase: 共通
    summary: 部品設計『トップバー.tsx』の props・イベント・状態を持つ。`sessionStatus` が `running` 以外なら、タブの帯の下・重なった ID の通知の上に『MindStellaのセッションの状態のバー』（`SessionStatusBanner`）を描き、`onRestart` に `onRestartSession`、`onClose` に `onCloseSessionWarning` を渡す
    refs:
      - CMP-489-20#
    unit_tests:
      - name: test_topbar_when_duplicate_ids
        case: 正常
        summary: 重なった ID があれば通知を出す
        condition: '`duplicateIds: [{id: D-12, kind: 検討事項}]`'
        mock: なし
        expected: タブの帯の下に重なった ID の通知（`DuplicateIdNotice`）がある
      - name: test_topbar_when_navigate
        case: 正常
        summary: タブを押すと onNavigate
        condition: '`tabs` に概要と検討事項を渡し、検討事項のタブを押す'
        mock: なし
        expected: '`onNavigate` が `decisions` で 1 回呼ばれる'
      - name: test_topbar_when_offline
        case: 正常
        summary: offline で接続の状態を出す
        condition: '`connection` に offline、`readAt` を渡す'
        mock: なし
        expected: '`role="status"` の接続の状態の読み上げの文字が「サーバーにつながりません（{日時} に読んだ記録）」で、`title` 属性を持たない'
      - name: test_topbar_when_many_comments
        case: 正常
        summary: 100 件以上は 99+
        condition: '`comments` true・`commentCount` 120'
        mock: なし
        expected: 件数の札が `99+`、読み上げの名前に 120
      - name: test_topbar_when_voice
        case: 正常
        summary: 音声入力中の表示と知らせの帯
        condition: '`voice` が `{state: recording, label: D-022 へのコメント, elapsed: 12}` / `{state: transcribing, label: D-022 へのコメント}` / `voiceNotice` が `{kind: failed, text: …}` で「入力欄を開く」と × を押す'
        mock: なし
        expected: 'コメントのボタンの左に読み上げの名前「音声入力中（D-022 へのコメント）。録音中の入力欄へ移動」のボタンと `0:12`、押すと `onOpenVoice` が 1 回 / 読み上げの名前「文字起こし中（D-022 へのコメント）。入力欄へ移動」で、画面に「文字起こし中」の文字が無い / 帯が `role="status"` で、`onOpenVoice` と `onDismissVoiceNotice` が 1 回ずつ'
      - name: test_topbar_when_diff_point
        case: 正常
        summary: 差分の表示中は変更履歴のボタンに点だけを出し、差分の表示をやめるボタンを出さない
        condition: '`diffPoint: {name: V-2, sub: 10/04 13:05}` を指定する'
        mock: なし
        expected: 「変更履歴」のボタンの読み上げ名が「変更履歴（過去の差分を表示中）」で、「10/04 13:05」の文字が無い。読み上げ名「差分の表示をやめる」のボタンが無い。`diffPoint` が `null` のときは読み上げ名「変更履歴」
      - name: test_topbar_when_refresh
        case: 正常
        summary: 更新のボタンを押すと onRefresh、保留中は点と「更新があります」
        condition: '`onRefresh` を渡して更新のボタンを押す / `stale` true / `refreshing` true / `onRefresh` を渡さない'
        mock: なし
        expected: 読み上げの名前「最新の記録を読み込む」のボタンで `onRefresh` が 1 回 / 名前が「更新があります。最新の記録を読み込む」 / `aria-busy` で押せない / ボタンが無い
      - name: test_topbar_when_icon_only
        case: 正常
        summary: ボタンは名前を文字で出さず、ツールチップと読み上げに持つ
        condition: '`comments`・`filter`・`pending` を真にして描き、表示の設定のボタンへ Tab でフォーカスを移し、Esc を押す'
        mock: なし
        expected: 「表示の設定」「絞り込み」「保存待ち」「コメント」の文字はツールチップ（`aria-hidden`）にだけあり、どの要素も `title` 属性を持たない。Esc の後はトップバーに `data-tipsoff` が付く
      - name: test_topbar_when_history_unread
        case: 正常
        summary: 変更履歴のボタンに未読の件数を出す
        condition: '`parametrize`: `historyUnread` 3 / 120 / 0'
        mock: なし
        expected: 件数の札が `3` で読み上げ名が「変更履歴（未読 3 件）」 / 札が `99+` で読み上げ名が「変更履歴（未読 120 件）」 / 札が無く読み上げ名が「変更履歴」
      - name: test_topbar_when_tab_marked
        case: 正常
        summary: marked のタブに点を重ねる
        condition: '`tabs` の検討事項だけ `marked: true`'
        mock: なし
        expected: 検討事項のタブだけが点を持ち、「新規・変更・削除した項目があります」を読み上げに持つ
      - name: test_topbar_when_session_failed
        case: 正常
        summary: 再起動の失敗をタブの帯の下に出し、再起動を伝える
        condition: '`sessionStatus` が `{kind: failed, reason: x, retrying: false}`、`duplicateIds` が 1 件。「再起動」を押す'
        mock: '`onRestartSession`'
        expected: 状態のバーがタブの帯の後ろ・重なった ID の通知の前にあり、`onRestartSession` が 1 回呼ばれる。`running` ではバーが無い
notes:
  単体テスト: 同じフォルダの `topbar.test.tsx` に置く（knowledge の規約『フォルダ構成』）

id: MOD-489-7
title: プレビュー / reply-form
lead: 部品設計『返信の入力.tsx』の props・イベント・状態を持つ。
components:
  - name: ReplyForm
    title: 返信の入力
    kind: コンポーネント
    usecase: スレッドで話す
    summary: 部品設計『返信の入力.tsx』の props・イベント・状態を持つ
    refs:
      - CMP-489-56#
    unit_tests:
      - name: test_reply_form
        case: 正常
        summary: 溜める
        condition: 本文を書いて Ctrl+Enter
        mock: なし
        expected: '`onSubmit` が thread・body で呼ばれる。ボタンは文字を持たず、`aria-label`「レビューに追加」と `title`「レビューに追加（Ctrl+Enter）」を持つ'
      - name: test_reply_form_when_saving
        case: 正常
        summary: 溜めている
        condition: '`status` が saving'
        mock: なし
        expected: 入力欄が読み取りだけでボタンを押せない
      - name: test_reply_form_when_voice
        case: 正常
        summary: 音声入力の状態とイベント
        condition: '`voice` が recording（`levels: [0.5]`）で ✓ / disabled でマイク'
        mock: なし
        expected: '入力欄が隠れて読み上げない波形に棒が 1 本あり、`onVoiceDone` が thread・body で呼ばれ、結果の行に経過の時間 / `onVoiceBlocked` が呼ばれる'
      - name: test_reply_form_when_recording_ended
        case: 正常
        summary: 録音を始めたら ✓ へ、終えたら入力欄の録音前の範囲へフォーカスを移す
        condition: '入力欄 `確認: でよい`・カーソル 4 で `voice: recording` に描き直し、続けて `voice: idle` に描き直す'
        mock: なし
        expected: 録音中は ✓ にフォーカスがあり、`idle` の後は入力欄が見えてフォーカスが入力欄にあり、`selectionStart`・`selectionEnd` が 4
      - name: test_reply_form_when_reviewed
        case: 正常
        summary: 既定の挙動でレビュー中に追加した結果
        condition: '`status: reviewed`'
        mock: なし
        expected: 結果の行に「文字起こしの結果をレビュー中に追加しました。」
    container: frontend/src/features/comments/shared/reply-form.tsx
notes:
  単体テスト: 同じフォルダの `reply-form.test.tsx` に置く（knowledge の規約『フォルダ構成』）

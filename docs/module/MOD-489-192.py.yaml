id: MOD-489-192
title: サーバー / 起動 / ensure_server.py
test_files:
  - tests/unit/scripts/test_ensure_server.py
classes:
  - name: ServerExitedError
    title: 常駐サーバーが起動直後に終わった
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 起動した常駐サーバーが待ち受ける前に落ちた（`systemctl --user is-active` が `failed`・`activating`）。ユニットの状態（`state`）と、`server.log` の書き足された末尾（`log_tail`）を持ち、`main` が出す
    kind: クラス
    inherits: Exception
    properties:
      - name: log_tail
        type: list[str]
        description: 起動してから `server.log` に書き足された行の末尾（`LOG_TAIL_LINES` 行まで）
  - name: ServerStartTimeoutError
    title: 常駐サーバーが応答しない
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 起動した常駐サーバーが、終わらないまま `START_TIMEOUT_SEC` 秒以内に `GET /_admin/status` へ応答しない。`main` が `server.log` を見る案内を出す（プロセスは止めない）
    kind: クラス
    inherits: Exception
constants:
  - name: DEFAULT_PORT
    title: 既定の待ち受けのポート
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`MINDSTELLA_PORT` が無いか空のときに確かめるポート（`server.py` の同じ名前の定数と合わせる。仮想環境の外で動くため import しない）'
    value: '8784'
  - name: SERVER_NAME
    title: 常駐サーバーの名前
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`GET /_admin/status` の `name` で、待ち受けているのが mindstella かを見分ける値（`server.py` の同じ名前の定数と合わせる）'
    value: '"mindstella"'
  - name: STATUS_PATH
    title: 状態のパス
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 常駐サーバーの状態を読む GET のパス（`server.py` の同じ名前の定数と合わせる）
    value: '"/_admin/status"'
  - name: STATUS_TIMEOUT_SEC
    title: 状態を待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`GET /_admin/status` 1 回を打ち切る秒数（インターフェース定義『常駐サーバーの起動の確認』の待ち受けているかの判定）'
    value: '1.0'
  - name: START_TIMEOUT_SEC
    title: 起動を待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 起動してから待ち受けるまで待つ秒数（インターフェース定義『常駐サーバーの起動の確認』の起動を待つ上限）
    value: '10.0'
  - name: START_POLL_SEC
    title: 起動を確かめる間隔
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 起動を待つ間に `GET /_admin/status` を送る間隔の秒数
    value: '0.2'
  - name: LOG_TAIL_LINES
    title: 示す記録の行数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 常駐サーバーが起動直後に終わったときに示す、`server.log` の末尾の行数
    value: '20'
  - name: PLUGIN_ROOT
    title: プラグインのフォルダ
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: このファイルの 3 つ上のフォルダ（`version.ini` を持つ）
    value: Path(__file__).resolve().parents[3]
  - name: UNIT_NAME
    title: ユニットの名前
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 常駐サーバーの systemd --user のユニット
    value: '"mindstella.service"'
  - name: UNIT_RESTART_SEC
    title: 起動し直すまでの秒数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: ユニットの `RestartSec`。起動を待つ上限（10 秒）の間の起動し直しが 1 回までになる値
    value: '5'
  - name: UNIT_START_LIMIT
    title: 起動し直しの上限
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: ユニットの `StartLimitIntervalSec`・`StartLimitBurst`
    value: (60, 3)
  - name: PASS_ENV_PREFIXES
    title: ユニットに渡す環境変数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 呼び出し元の環境からユニットの `Environment=` に書く環境変数の名前の頭
    value: ("MINDSTELLA_",)
  - name: PASS_ENV_NAMES
    title: ユニットに渡す環境変数の名前
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: 呼び出し元の環境からユニットの `Environment=` に書く環境変数の名前（`PATH` は常駐サーバーが `claude-balancer`・`claude`・`tmux` を探すため、`TMUX_TMPDIR` は利用者と同じ tmux のサーバーを使うため）
    value: ("PATH", "TMUX_TMPDIR", "PROJECT_INDEX_PORT", "XDG_STATE_HOME")
  - name: PORT_IN_USE
    title: ポートが使われている
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`fetch_status` が、つながるが mindstella の応答でないときに返す印'
    value: '"port_in_use"'
functions:
  - name: main
    title: 常駐サーバーの起動の確認の入口
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: 常駐サーバーが同じバージョンと同じプラグインのフォルダで待ち受けていれば何もせず、違えば違いと再起動の手順を示し、ポートが別のプロセスに使われていれば起動せずに示し、落ちていれば systemd --user のユニットを書いて起動し、待ち受けるまで待つ。`--restart` では待ち受けていてもユニットを書き直して起動し直す。ポートを別のプロセスが使っているとき（`fetch_status` が `PORT_IN_USE`）と systemd --user が使えないとき（`show-environment` が 0 でない）は、例外を作らずに案内を出して止まる
    description: 末尾で `sys.exit(main())`。SessionStart のフックは `--hook` を付け、起動のコマンドは付けずに呼ぶ。`mindstella server restart` は `--restart` を付ける
    side_effects: ユニットのファイルを書き、`systemctl --user` を呼ぶ。案内を標準出力か標準エラーに書く
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: 引数（`None` なら `sys.argv[1:]`。`--hook`・`--restart` を受ける）
      - name: environ
        type: Mapping[str, str]
        required: false
        default: os.environ
        passing: keyword
        description: '`MINDSTELLA_PORT`・`MINDSTELLA_VENV` を読み、常駐サーバーへそのまま渡す環境変数'
      - name: stdin
        type: TextIO
        required: false
        default: sys.stdin
        passing: keyword
        description: フックの入力（`--hook` のときだけ読み捨てる）
      - name: stdout
        type: TextIO
        required: false
        default: sys.stdout
        passing: keyword
        description: '`--hook` のときの案内の出力先'
      - name: stderr
        type: TextIO
        required: false
        default: sys.stderr
        passing: keyword
        description: '`--hook` が無いときの案内の出力先'
      - name: fetch
        type: Callable[[int], dict | None]
        required: false
        default: fetch_status
        passing: injected
        description: 常駐サーバーの状態を読む関数
      - name: systemctl
        type: Callable[[list[str]], int]
        required: false
        default: run_systemctl
        passing: injected
        description: '`systemctl --user` を呼ぶ関数'
      - name: log_file
        type: Path
        required: false
        default: Path.home() / ".mindmap" / "server.log"
        passing: keyword
        description: 常駐サーバーの標準出力と標準エラーを書き足すファイル
    returns:
      type: int
      description: 終了コード（`--hook` はどの結末も 0。無いときは 0 待ち受けている / 1 起動できない / 2 引数の誤りは argparse が終える）
    process: |-
      1. `--hook` を解釈する。`--hook` なら標準入力を最後まで読み捨て、案内の出力先を `stdout`、無ければ `stderr` にする。失敗の終了コードを `--hook` なら 0、無ければ 1 にする
      2. 確かめるポートを読む（`environ` の `MINDSTELLA_PORT`。無いか空なら `DEFAULT_PORT`）
         - 1〜65535 の整数でなければ、`[mindstella] エラー: MINDSTELLA_PORT の値 {値} は誤りです。1〜65535 の整数を渡してください` を出して失敗の終了コードを返す
      3. `fetch(port)` で状態を読む
         - 状態が返った場合、`version` とプラグインのバージョン（`read_installed_version(PLUGIN_ROOT)`）を比べる。同じなら何も出さずに 0 を返す。違えば、`[mindstella] 常駐サーバーのバージョン {待ち受けている版} と、インストールしたプラグインのバージョン {今の版} が違います` と、`server_stop` で止めてから Claude Code を立ち上げ直す手順の行を出して 0 を返す（起動し直さない）
      4. 依存を確かめる（`run_check_env`。仮想環境は `environ` の `MINDSTELLA_VENV`、無いか空なら `default_venv_dir()`）
         - `VenvNotFoundError`・`PythonVersionError`・`DependencyMissingError` を捕まえた場合、`[mindstella] エラー: 仮想環境の依存がそろっていません（{足りない配布名を・でつないだもの}）` と、`report` の `install` があればそのコマンドの行（無ければ Python 3.12 以上を入れてから仮想環境を作る案内の行）を出して、失敗の終了コードを返す
      5. `log_file` の今の大きさを控え（無ければ 0）、`start(python_path, environ=environ, log_file=log_file)` で起動する
      6. 待ち受けるまで待つ（`wait_until_ready`）
         - 待ち受けた場合、`--hook` なら `[mindstella] 常駐サーバーを起動しました（ポート {port}）` と `/mcp` で mindstella につなぎ直す案内を出し、無ければ同じ 1 行目だけを出す。0 を返す
         - `PortInUseError` を捕まえた場合、`[mindstella] エラー: ポート {port} は別のプロセスが使っています` と、`MINDSTELLA_PORT` で別のポートを渡す案内の行を出して、失敗の終了コードを返す
         - `ServerExitedError` を捕まえた場合、`[mindstella] エラー: 常駐サーバーが起動直後に終わりました（終了コード {n}）` と記録の末尾の行と `log_file` のパスを出して、失敗の終了コードを返す
         - `ServerStartTimeoutError` を捕まえた場合、`[mindstella] エラー: 常駐サーバーが {START_TIMEOUT_SEC} 秒以内に応答しません` と、`log_file` を見る案内の行を出して、失敗の終了コードを返す
    exceptions:
      - name: VenvNotFoundError
        condition: 仮想環境が無い（捕まえて案内する）
      - name: PythonVersionError
        condition: 仮想環境の Python が古い（捕まえて案内する）
      - name: DependencyMissingError
        condition: ライブラリが足りない（捕まえて案内する）
      - name: PortInUseError
        condition: ポートが別のプロセスに使われている（捕まえて案内する）
      - name: ServerExitedError
        condition: 常駐サーバーが起動直後に終わった（捕まえて案内する）
      - name: ServerStartTimeoutError
        condition: 常駐サーバーが応答しない（捕まえて案内する）
    unit_tests:
      - name: test_main
        case: 正常
        summary: 落ちていれば起動し、つなぎ直す案内を出す
        condition: '`["--hook"]`。`fetch` は 1 回目つながらない、2 回目以降 `{name: mindstella, version: 今の版, plugin_root: このフォルダ}` を返す。`systemctl` は 0 を返す。`run_check_env` はそろっている結果を返す'
        mock: '`fetch`・`systemctl`・`run_check_env`・`time.sleep`・ユニットのフォルダ（`XDG_CONFIG_HOME`）'
        expected: 0 を返し、ユニットのファイルが書かれ、`systemctl` が `show-environment`・`daemon-reload`・`start mindstella.service` の順で呼ばれ、`stdout` に `ポート 8784` と `/mcp` がある
      - name: test_main_when_running
        case: 正常
        summary: 同じバージョンが待ち受けていれば何もしない
        condition: '`["--hook"]`。`fetch` が `{name: mindstella, version: 今の版}` を返す'
        mock: '`fetch`・`start`'
        expected: 0 を返し、`start` が呼ばれず、`stdout` が空
      - name: test_main_when_outdated
        case: 正常
        summary: バージョンかプラグインのフォルダが違えば、再起動せずに違いと手順を示す
        condition: '`fetch` が `parametrize`: 違う `version` / 同じ `version` で `plugin_root` の末尾のフォルダ名が違う'
        mock: '`fetch`・`start`'
        expected: 0 を返し、`systemctl` が `start`・`restart` を受けず、`stdout` に違う値と `mindstella server restart` がある
      - name: test_main_when_port_invalid
        case: 異常
        summary: ポートの値が誤りなら確かめずに案内する
        condition: '`MINDSTELLA_PORT=abc`。`parametrize`: `["--hook"]` / `[]`'
        mock: '`fetch`・`start`'
        expected: 前者は 0、後者は 1 を返し、案内に `abc` がある。`fetch`・`start` が呼ばれない
      - name: test_main_when_dependency_missing
        case: 異常
        summary: 依存が足りなければ起動せずにそろえるコマンドを示す
        condition: '`fetch` が `None` を返し、`run_check_env` が mcp の足りない `DependencyMissingError(report)` を送る。`parametrize`: `["--hook"]` / `[]`'
        mock: '`fetch`・`start`・`run_check_env`'
        expected: 前者は 0、後者は 1 を返し、案内に `mcp` と `report` の `install` がある。`start` が呼ばれない
      - name: test_main_when_old_syntax
        case: 正常
        summary: Python 3.8 の構文で読め、型注釈を実行時に評価しない
        condition: '`ensure_server.py` を `ast.parse(..., feature_version=(3, 8))` で読み、先頭の文を見る'
        mock: なし
        expected: '`SyntaxError` にならず、docstring の次の文が `from __future__ import annotations`'
      - name: test_main_when_port_in_use
        case: 異常
        summary: ポートがつながるのに mindstella の応答が無ければ起動しない
        condition: '`fetch` が `PORT_IN_USE` を返す'
        mock: '`fetch`・`systemctl`'
        expected: 0 を返し（`--hook`）、`systemctl` が `start` を受けず、`stdout` にポートと `MINDSTELLA_PORT`
      - name: test_main_when_systemd_unavailable
        case: 異常
        summary: systemd --user が使えなければ起動しない
        condition: '`systemctl` の `show-environment` が 1'
        mock: '`fetch`・`systemctl`'
        expected: '`--hook` で 0、無しで 1。ユニットのファイルが書かれず、出力に systemd --user が要ることの案内'
      - name: test_main_when_restart
        case: 正常
        summary: --restart はユニットを書き直して起動し直す
        condition: '`["--restart"]`、`fetch` は待ち受けている状態を返す'
        mock: '`fetch`・`systemctl`'
        expected: ユニットの `ExecStart` がこのフォルダの `server.py` で、`systemctl` が `daemon-reload`・`restart mindstella.service` の順で呼ばれる
      - name: test_main_when_start_failed
        case: 異常
        summary: 起動した後に終われば記録の末尾を示す
        condition: '`wait_until_ready` が `ServerExitedError`'
        mock: '`wait_until_ready`'
        expected: 1 を返し（`--hook` 無し）、`stderr` に記録の末尾
  - name: fetch_status
    title: 常駐サーバーの状態を読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: '`http://127.0.0.1:{port}/_admin/status` を読み、mindstella の状態なら返す。つながらないときは `None`、つながるのに mindstella の応答でないときは `PORT_IN_USE`'
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 確かめるポート
      - name: opener
        type: urllib.request.OpenerDirector
        required: false
        default: urllib.request.build_opener(urllib.request.ProxyHandler({}))
        passing: injected
        description: HTTP を開くもの（環境変数のプロキシを通さない）
    returns:
      type: dict | Literal["port_in_use"] | None
      description: 200 で JSON のオブジェクトの `name` が `SERVER_NAME` ならその辞書。それ以外は `None`
    process: |-
      1. `opener.open(URL, timeout=STATUS_TIMEOUT_SEC)` で GET を送る
      2. 200 で、本文を JSON のオブジェクトとして読め、`name` が `SERVER_NAME` ならその辞書を返す
         - つながらない・時間切れ・200 でない・JSON でない・`name` が違う（`OSError`・`urllib.error.URLError`・`ValueError` を含む）ときは `None` を返す
    unit_tests:
      - name: test_fetch_status
        case: 正常
        summary: mindstella の状態だけを返す
        condition: 'テストが空きポートで HTTP のサーバーを立てる。`parametrize`: `{"name": "mindstella", "version": "v1.0.0"}` を返す / 404 を返す / `{"name": "other"}` を返す / `x` を返す / 待ち受けていないポート'
        mock: なし
        expected: その辞書 / `PORT_IN_USE` / `PORT_IN_USE` / `PORT_IN_USE` / `None`
  - name: read_installed_version
    title: プラグインのバージョン
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: プラグインのフォルダの `version.ini` の 1 行目を返す
    args:
      - name: plugin_root
        type: Path
        required: true
        passing: positional
        description: プラグインのフォルダ
    returns:
      type: str
      description: 前後の空白を除いた 1 行目（`server_status` の `version` と同じ文字列）
    unit_tests:
      - name: test_read_installed_version
        case: 正常
        summary: 1 行目を返す
        condition: '`tmp_path / "version.ini"` に `v0.12.0\n`'
        mock: なし
        expected: '`v0.12.0`'
  - name: is_outdated
    title: 古いコードか
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: 状態の `version` とプラグインのバージョン、`plugin_root` の末尾のフォルダ名とこのスクリプトのプラグインのフォルダの末尾のフォルダ名を比べ、違う値の組を返す。同じなら `None`
    args:
      - name: status
        type: dict
        required: true
        passing: positional
        description: '`GET /_admin/status` の応答'
      - name: plugin_root
        type: Path
        required: true
        passing: positional
        description: このスクリプトのプラグインのフォルダ
    returns:
      type: list[tuple[str, str, str]] | None
      description: 違う値の組（項目・常駐サーバーの値・インストール済みの値）
    unit_tests:
      - name: test_is_outdated
        case: 正常
        summary: バージョンかフォルダ名が違えば組を返す
        condition: '`parametrize`: 同じ / `version` が違う / `plugin_root` が別のプロファイルの同じ名前のフォルダ / 末尾が `0fd2` と `c938`'
        mock: なし
        expected: '`None` / `version` の組 / `None` / `plugin` の組'
  - name: unit_text

  - name: wait_until_ready
    title: 待ち受けるまで待つ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/ensure_server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: '`GET /_admin/status` に応答するまで `START_POLL_SEC` ごとに確かめ、`systemctl --user is-active mindstella.service` が `failed`・`activating` なら ServerExitedError、上限を過ぎたら ServerStartTimeoutError を送る'
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
      - name: log_file
        type: Path
        required: true
        passing: keyword
        description: 記録のファイル
      - name: log_offset
        type: int
        required: true
        passing: keyword
        description: 起動する前の記録のファイルの大きさ
      - name: fetch
        type: Callable[[int], dict | None]
        required: false
        default: fetch_status
        passing: injected
        description: 状態を読む関数
      - name: unit_state
        type: Callable[[], str]
        required: false
        default: read_unit_state
        passing: injected
        description: ユニットの状態（`systemctl --user is-active` の出力）を読む関数
      - name: clock
        type: Callable[[], float]
        required: false
        default: time.monotonic
        passing: injected
        description: 今の時刻
      - name: sleep
        type: Callable[[float], None]
        required: false
        default: time.sleep
        passing: injected
        description: 待つ関数
    returns:
      type: dict
      description: 待ち受けた常駐サーバーの状態
    process: |-
      1. 上限を `clock() + START_TIMEOUT_SEC` にし、上限まで次を繰り返す
         - `process.poll()` が終了コードを返した場合、`fetch(port)` をもう 1 回呼び、状態が返ればそれを返す（同時に起動した別の `ensure_server.py` の常駐サーバーが先に待ち受けた）。状態が返らず、`127.0.0.1` のそのポートへつながれば `PortInUseError(port)`、つながらなければ記録のファイルの `log_offset` より後ろの末尾 `LOG_TAIL_LINES` 行を持った `ServerExitedError` を送る
         - `fetch(port)` が状態を返せば、それを返す
         - `START_POLL_SEC` 待つ
      2. 上限を過ぎたら `ServerStartTimeoutError` を送る
    exceptions:
      - name: PortInUseError
        condition: プロセスが終わり、`fetch` が状態を返さず、ポートに別のプロセスがつながる
      - name: ServerExitedError
        condition: プロセスが終わり、ポートが空いている
      - name: ServerStartTimeoutError
        condition: 上限までに応答しない
    unit_tests:
      - name: test_wait_until_ready
        case: 正常
        summary: 応答したら状態を返す
        condition: '`fetch` が 2 回 `None` の後に状態を返す。`unit_state` は `active`'
        mock: '`fetch`・`unit_state`・`clock`・`sleep`'
        expected: その状態を返し、`sleep` が 2 回呼ばれる
      - name: test_wait_until_ready_when_exited
        case: 異常
        summary: 終わったら、先に待ち受けた mindstella があればその状態を返し、無ければポートの使われ方で分ける
        condition: '`unit_state` が `parametrize`: `failed` / `activating`。`fetch` は常に `None`。`log_file` の `log_offset` より後ろに 30 行'
        mock: '`fetch`・`unit_state`'
        expected: '`ServerExitedError`（`state` がその状態、`log_tail` が書き足した末尾の 20 行）'
        exception: プロセスが終わった
      - name: test_wait_until_ready_when_timeout
        case: 異常
        summary: 上限までに応答しなければ ServerStartTimeoutError
        condition: '`fetch` が常に `None`。`unit_state` は `active`。`clock` は `sleep` の分だけ進む'
        mock: '`fetch`・`unit_state`・`clock`・`sleep`'
        expected: '`ServerStartTimeoutError`。`sleep` に渡した秒の合計が `START_TIMEOUT_SEC` を超えない'
        exception: 上限までに応答しない

id: MOD-489-193
title: サーバー / 起動 / launch.py
test_files:
  - tests/unit/scripts/test_launch.py
classes:
  - name: PluginNotInstalledError
    title: プラグインが無い
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 起動スクリプトで立ち上げる
    summary: '`claude plugin list --json` に `PLUGIN_ID` が無い。`main` が標準エラーにインストールの案内を出して終了コード 1 にする'
    kind: クラス
    inherits: Exception
constants:
  - name: PLUGIN_ID
    title: プラグインの識別子
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 起動スクリプトで立ち上げる
    summary: '`claude plugin list --json` の要素の `id` で引く値'
    value: '"mindstella@mindstella"'
functions:
  - name: find_plugin_dir
    title: プラグインのフォルダの引き当て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 起動スクリプトで立ち上げる
    scope: public
    summary: '`claude plugin list --json` の一覧から、インストールした mindstella の今の版のフォルダを引く'
    args:
      - name: listing
        type: list[dict[str, Any]]
        required: true
        passing: positional
        description: '`claude plugin list --json` の出力を読んだ配列'
    returns:
      type: Path
      description: '`id` が `PLUGIN_ID` の要素の `installPath`'
    process: |-
      1. `id` が `PLUGIN_ID` の最初の要素を探し、その `installPath` を返す
         - 無い場合、`PluginNotInstalledError` を送る
    exceptions:
      - name: PluginNotInstalledError
        condition: '`id` が `PLUGIN_ID` の要素が無い'
        message: プラグイン mindstella@mindstella がインストールされていません
    unit_tests:
      - name: test_find_plugin_dir
        case: 正常
        summary: mindstella の installPath を返す
        condition: 'ほかのプラグインと `{id: mindstella@mindstella, installPath: /p/0.0.2}` を持つ配列'
        mock: なし
        expected: '`Path("/p/0.0.2")`'
      - name: test_find_plugin_dir_when_missing
        case: 異常
        summary: mindstella が無ければ PluginNotInstalledError
        condition: 空の配列
        mock: なし
        expected: '`PluginNotInstalledError`'
        exception: PLUGIN_ID の要素が無い
  - name: run_launch
    title: 起動の手助けの入口
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 起動スクリプトで立ち上げる
    scope: public
    summary: '`--find-plugin`: 標準入力のプラグインの一覧から、インストールした今の版のフォルダを標準出力に出す。`--start`: `run_start` を呼ぶ。`--server-status`: `run_server_status` を呼ぶ'
    description: 末尾で `sys.exit(run_launch())`。起動スクリプトが `{python_path} launch.py --folder {フォルダ}` で起動し、`claude plugin list --json` の出力を標準入力へ渡す。
    side_effects: 標準出力・標準エラーに書く
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: 引数（`None` なら `sys.argv[1:]`。`--folder` は必須）
      - name: stdin
        type: TextIO
        required: false
        default: sys.stdin
        passing: keyword
        description: プラグインの一覧の JSON を読む先
      - name: environ
        type: Mapping[str, str]
        required: false
        default: os.environ
        passing: keyword
        description: '`CLAUDE_CONFIG_DIR` を読む環境変数'
    returns:
      type: int
      description: 終了コード（0 正常 / 1 プラグインが無い・一覧を読めない / 2 引数の誤りは argparse が終える）
    process: |-
      1. 引数を解釈する（`--find-plugin`・`--start`・`--server-status` のどれか 1 つ）
         - `--start`・`--server-status` の場合、`run_start`・`run_server_status` を呼んで、その終了コードを返す
      2. `--find-plugin`: 標準入力を JSON の配列として読む
         - 読めないか配列でない場合、標準エラーに `[mindstella] エラー: claude plugin list --json の出力を読めません` を出して 1 を返す
      3. プラグインのフォルダを引く（`find_plugin_dir`）
         - `PluginNotInstalledError` を捕まえた場合、標準エラーに `[mindstella] エラー: {メッセージ}` とインストールの手順を案内する行を出して 1 を返す
      4. 標準出力にプラグインのフォルダを 1 行で出し、0 を返す（起動のコマンドが `read` で受ける）
    unit_tests:
      - name: test_run_launch
        case: 正常
        summary: --find-plugin でプラグインのフォルダを 1 行出す
        condition: '`--find-plugin`、標準入力は mindstella の `installPath` を持つ配列'
        mock: なし
        expected: 0 を返し、標準出力の 1 行が `installPath`
      - name: test_run_launch_when_plugin_missing
        case: 正常
        summary: プラグインが無ければ案内して 1
        condition: 標準入力が `[]`
        mock: なし
        expected: 1 を返し、標準エラーに `mindstella@mindstella`。標準出力が空
      - name: test_run_launch_when_listing_invalid
        case: 正常
        summary: 一覧を読めなければ 1
        condition: '`parametrize`: 標準入力が `{` / `{}`'
        mock: なし
        expected: '1 を返し、標準エラーが `[mindstella] エラー: ` で始まる'
  - name: api_request
    title: MindStella の API を呼ぶ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 端末から起動する
    scope: public
    summary: '`http://127.0.0.1:{port}{path}` へ JSON を送り、ステータスと JSON の本文を返す（`Host` は `127.0.0.1:{port}`）'
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 常駐サーバーのポート
      - name: method
        type: str
        required: true
        passing: positional
        description: HTTP のメソッド
      - name: path
        type: str
        required: true
        passing: positional
        description: パス
      - name: body
        type: dict | None
        required: true
        passing: positional
        description: 本文
      - name: timeout
        type: float
        required: true
        passing: positional
        description: 打ち切る秒数
    returns:
      type: tuple[int, dict]
      description: ステータスと本文
    exceptions:
      - name: OSError
        condition: つながらない・打ち切った
    unit_tests:
      - name: test_api_request
        case: 正常
        summary: 本文と Host を送り、4xx も本文を返す
        condition: テストが空きポートで HTTP のサーバーを立てる。201 / 409 の problem+json
        mock: なし
        expected: '`(201, {...})` / `(409, {stage: exists, ...})`。送った `Host` が `127.0.0.1:{port}`'
  - name: run_start
    title: ワークスペースと MindStella のセッションを作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 端末から起動する
    scope: public
    summary: 起動のコマンドの引数（フォルダ・`--flow`・`--mcp-config`・`--plugin-dir`）で『ワークスペースの作成』と『MindStella のセッションの作成』を呼び、画面の URL とつなぐペインを 1 行に 1 つ出す。409（`exists`）は起動中のペインを出す
    args:
      - name: argv
        type: list[str]
        required: true
        passing: positional
        description: 引数
      - name: environ
        type: Mapping[str, str]
        required: true
        passing: positional
        description: '`MINDSTELLA_PORT`・`CLAUDE_CONFIG_DIR` を読む'
      - name: stdout
        type: TextIO
        required: true
        passing: positional
        description: 出力先
      - name: stderr
        type: TextIO
        required: true
        passing: positional
        description: エラーの出力先
      - name: request
        type: Callable[..., tuple[int, dict]]
        required: false
        default: api_request
        passing: injected
        description: API を呼ぶ関数
    returns:
      type: int
      description: 0 正常 / 1 API のエラー / 2 引数の誤り
    unit_tests:
      - name: test_run_start
        case: 正常
        summary: 2 つの API を順に呼び、URL とペインを出す
        condition: '`[/w/家計簿, --flow aituber#flow-1, --mcp-config m.json, --plugin-dir p]`、`CLAUDE_CONFIG_DIR=/c`'
        mock: '`request`'
        expected: '0 を返し、1 回目が `POST /workspaces`（`flow: {source: aituber, doc: flow-1}`・`mcp_config` がファイルの中身・`plugin_dirs` が絶対パス）、2 回目が `POST /workspaces/{id}/sessions`（`claude_config_dir: /c`）、`stdout` が `url`・`pane` の 2 行'
      - name: test_run_start_exists
        case: 正常
        summary: 既にある MindStella のセッションのペインを出す
        condition: '2 回目が 409 `{stage: exists, pane: w:0.0}`'
        mock: '`request`'
        expected: 0 を返し、`stdout` のペインが `w:0.0`、`stderr` に既にあった旨
      - name: test_run_start_error
        case: 異常
        summary: 作成の失敗は detail を出して 1
        condition: 1 回目が 403 / 2 回目が 503
        mock: '`request`'
        expected: 1 を返し、`stderr` に `detail`（2 回目は画面の URL も）
  - name: run_server_status
    title: 常駐サーバーの状態を出す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/launch.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: '`GET /_admin/status` を読んで、ポート・バージョン・`plugin_root`・配信を出す'
    args:
      - name: environ
        type: Mapping[str, str]
        required: true
        passing: positional
        description: '`MINDSTELLA_PORT` を読む'
      - name: stdout
        type: TextIO
        required: true
        passing: positional
        description: 出力先
    returns:
      type: int
      description: 0 待ち受けている / 1 待ち受けていない
    unit_tests:
      - name: test_run_server_status
        case: 正常
        summary: 状態を出す
        condition: '`request` が状態を返す / つながらない'
        mock: '`request`'
        expected: 0 で状態の行 / 1

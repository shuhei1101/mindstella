id: MOD-489-22
title: プレビュー / detail-comments
lead: 詳細パネル・詳細の全画面の下端のコメントの入力と、レビュー中のコメントの一覧（並びの切り替え・修正・削除・元に戻す・続きを読む）、本文の選択から出す選んだ箇所のコメントの入口を描く。
components:
  - name: DetailComments
    title: 詳細のコメント
    kind: コンポーネント
    usecase: 項目へコメントする
    summary: 詳細パネル・詳細の全画面の下端のコメントの入力と、レビュー中のコメントの一覧（並びの切り替え・修正・削除・元に戻す・続きを読む）、本文の選択から出す選んだ箇所のコメントの入口を描く。コメントの入力の `open` は `usePrefsStore` の `commentFormClosed` から渡し、`onToggleOpen` で書き換える。閉じている間に選んだ箇所の入口を押したら `commentFormClosed` を `null` にしてから入力欄へフォーカスを移す
    refs:
      - SCR-489-32#
      - SCR-489-30#
    unit_tests:
      - name: test_detail_comments
        case: 正常
        summary: 箇所を添えて溜める
        condition: 本文の 2 行目を選んで入口を押し、書いて溜める
        mock: MSW と mdmark の差し替え
        expected: '`POST /api/comments` が `loc` の 2 行目で呼ばれる'
      - name: test_detail_comments_when_order
        case: 正常
        summary: 並びを切り替える
        condition: 2 件で並びのボタンを押す
        mock: MSW
        expected: 古い順に並び、保存領域の `reviewOrder` が `oldest`
      - name: test_detail_comments_when_toggle_open
        case: 正常
        summary: 開閉を覚え、入口で開く
        condition: 開閉のボタンで閉じてから別の項目に移る / 閉じたまま本文の 2 行目を選んで入口を押す
        mock: MSW と mdmark の差し替え
        expected: 保存領域の `commentFormClosed` が `true` で、移った項目でも入力欄が無く見出しの行だけ / `commentFormClosed` が `null` になり、入力欄にフォーカスがある
      - name: test_detail_comments_when_voice
        case: 正常
        summary: 音声で項目へのコメントを送る
        condition: 'D-1 の入力でマイクを押して ✓。`POST /api/transcriptions` が `{text: 案 A にする}` で、挙動が `send`'
        mock: MSW と `vi.stubGlobal`
        expected: '`POST /api/comments/send-now` が `{target: D-1, body: 案 A にする}` で 1 回呼ばれ、入力欄が空で「送信し、Claude Code へ入力しました。」'
    container: frontend/src/features/detail/detail-panel/components/detail-comments.tsx
notes:
  単体テスト: 同じフォルダの `detail-comments.test.tsx` に置く（knowledge の規約『フォルダ構成』）

id: MOD-489-184
title: サーバー / 移行 / submissions_to_threads.py
test_files:
  - tests/unit/scripts/test_submissions_to_threads.py
functions:
  - name: submissions_to_threads.migrate
    title: 送信をスレッドにする移し替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/migrations/v0.8.0/scripts/submissions_to_threads.py
    usecase: 記録の形式の移行
    scope: public
    summary: v0.8.0 の `call`（`submissions_to_threads`）が呼ぶ変換（関数名は `migrate`）。送信 1 件ごとにスレッドを 1 件作って `threads.yaml` を書く。`submissions.yaml` は消さない（次の `delete` の手順が消す）
    side_effects: '`.mindstella/threads.yaml` を作る'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: list[str]
      description: 変えたファイル（ワークスペースからの相対パス。変えなければ空）
    process: |-
      1. `.mindstella/submissions.yaml` が無い場合、何も書かず空を返す
      2. `.mindstella/threads.yaml` が既にある場合、`threads.yaml が既にあります` の `ValueError` を送る（手順の当て方が `StepFailedError` にする）
      3. `yaml.safe_load` で送信を読む。一番上が辞書でないか `items` が配列でない場合、`submissions.yaml の形が崩れています` の `ValueError` を送る（次の `delete` で失わないため、飛ばさない）
      4. 送信を連番の小さい順に並べ、1 件ごとに `TH-{1 からの連番}`・`tags: []`・`summary: null`・`target`・`loc`（持つときだけ）のスレッドにする。最初の書き込みは `{ID}-1`・`author: user`・`body`・`created`（送信の `sent`）・`read: false`・`seen: true`・`taken`（送信の `taken`）。送信の `comment` は引き継がない
         - `taken` を持つ送信は `status: closed` にし、`events` を `[{kind: closed, author: ai, reason: null, created: {taken}}]` にする
         - `taken` を持たない送信は `status: open`・`events: []` にする
      5. `{items: [...]}` を読み書きと検証の `dump_yaml` と `write_temp` で一時ファイルに書き、`os.replace` で `threads.yaml` に置く（送信が 0 件でも `items: []` で書く）
         - 置き換えで `OSError` が起きた場合、一時ファイルを消して送り直す
      6. `[.mindstella/threads.yaml]` を返す
    exceptions:
      - name: ValueError
        condition: '`threads.yaml` が既にある、または `submissions.yaml` の形が崩れている'
      - name: OSError
        condition: 読めない・書けない
    unit_tests:
      - name: test_submissions_to_threads
        case: 正常
        summary: 取り込み済みはクローズ、取り込んでいないものはオープンのスレッドにする
        condition: 'S-3（項目を指さない・取り込んでいない）・S-1（D-1・取り込み済み・`comment: C-1`）・S-2（A-1 の本文の 2 行目の `loc`・取り込んでいない）をこの順に持つ `submissions.yaml`'
        mock: なし
        expected: '戻り値が `[.mindstella/threads.yaml]`。TH-1 が S-1 からで `closed`・`target: D-1`・`events` が `kind: closed`・`author: ai`・`created` が S-1 の `taken` の 1 件、書き込みの `taken` が S-1 の `taken` で `comment` のキーが無い。TH-2 が `open` で `loc` を持ち、TH-3 が `open` で `target`・`loc` のキーを持たない。どの書き込みも `read: false`・`seen: true`。`submissions.yaml` が残っている。『スレッド』の `load_threads` で読める'
      - name: test_submissions_to_threads_when_no_file
        case: 正常
        summary: submissions.yaml が無ければ何も書かない
        condition: '`.mindstella/submissions.yaml` を持たないワークスペース（1 回当てて `delete` も当てた後を含む）'
        mock: なし
        expected: 戻り値が空で、`threads.yaml` が呼ぶ前と同じ（無ければ作られない）
      - name: test_submissions_to_threads_when_rejected
        case: 異常
        summary: スレッドが既にある・送信の形が崩れているときは移さない
        condition: '`parametrize`: `submissions.yaml` と `threads.yaml` が両方ある / `submissions.yaml` の一番上が配列 / `items` が文字列'
        mock: なし
        expected: どれも `ValueError`。`submissions.yaml`・`threads.yaml` が呼ぶ前と同じ
        exception: threads.yaml が既にある・形が崩れている
      - name: test_submissions_to_threads_when_empty
        case: 正常
        summary: 送信が 0 件でも空のスレッドのファイルを作る
        condition: '`items: []` の `submissions.yaml`'
        mock: なし
        expected: '`threads.yaml` が `items: []`'

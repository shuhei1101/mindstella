id: MOD-489-166
title: サーバー / 設定の更新 / settings_update.py
lead: '`update_settings` の引数を確かめ、設定のキーを置き換えて `config.yaml` を書く。削除したキー（ゴール・フェーズ・プレイブック・対象・カテゴリー）を渡すと、何も書かずに引数の誤りにする。読み書きと検証だけに依存する。'
test_files:
  - tests/unit/scripts/test_settings_update.py
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    settings_update.py   設定の更新の引数の確かめ・設定の置き換え・設定の書き込み
  ```
data_models:
  - name: SettingsStage
    title: 当てた設定の更新
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 共通
    role: DTO
    summary: 書き込む前にメモリの上で当てた設定。`@dataclass(frozen=True, slots=True, kw_only=True)`。`update_settings` とまとめて保存（モジュール構成『保存待ちの編集』）が使う
    properties:
      - name: settings
        type: dict[str, Any]
        description: 当てた後の設定
      - name: changed
        type: list[str]
        description: 変わった設定のキー
constants:
  - name: EDITABLE_KEYS
    title: 書き換えられる設定のキー
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    summary: '`update_settings` の `settings` に渡せるキー'
    value: ("summary", "description", "links", "history_limit", "display", "transcription", "mdmark")
  - name: REMOVABLE_KEYS
    title: null で削除できる設定のキー
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    summary: 値が `null` のときに削除してよい任意のキー
    value: ("description", "links", "history_limit", "display", "transcription")
  - name: REMOVED_KEYS
    title: 削除した設定のキー
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    summary: 渡すと引数の誤りにするキー（#518 で削除した設定）
    value: ("goal", "phases", "playbooks", "targets", "target_label", "categories")
functions:
  - name: validate_settings_input
    title: 設定の更新の引数の確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    scope: public
    summary: '`settings` のキーを、書き換える前に確かめる'
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`settings`'
    returns:
      type: None
      description: 問題が無ければ何も返さない
    process: |-
      1. 削除したキー（`REMOVED_KEYS`）を持てば、`ArgumentError`（引数 `settings`、理由 `削除したキーです: {キーを「・」でつないだもの}`）
      2. `settings` が空か、`EDITABLE_KEYS` に無いキーを持つか、`REMOVABLE_KEYS` に無いキーの値が `None` なら `SchemaMismatchError`（行は `config.yaml: {キー}: {理由}`）
         - `mdmark` が `version`・`map` 以外のキーを持てば `SchemaMismatchError`（行は `config.yaml: mdmark.{キー}: 書き換えられないキー`）。`map` の値は、`save_settings` のワークスペースの検証が設定のスキーマの `mdmark.map` と突き合わせる
    exceptions:
      - name: ArgumentError
        condition: 削除したキー（`goal`・`phases`・`playbooks`・`targets`・`target_label`・`categories`）を渡した
        message: '引数の誤り: settings: 削除したキーです: {キー}'
      - name: SchemaMismatchError
        condition: '`settings` が空・書き換えられないキー・必須のキーの `None`'
        message: スキーマに合いません（`lines` に問題ごとの行）
    unit_tests:
      - name: test_validate_settings_input
        case: 正常
        summary: 書き換えられるキーだけなら通す
        condition: '`settings` が `{"summary": "題", "links": null}`'
        mock: なし
        expected: 例外にならない
      - name: test_validate_settings_input_when_bad_key
        case: 異常
        summary: 書き換えられないキー・必須のキーの null を弾く
        condition: '`parametrize`: `{}` / `{"field": "システム開発"}` / `{"summary": null}` / `{"tags": []}` / `{"mdmark": {"version": "v0.13.0", "theme": {}}}`（`version`・`map` 以外のキー） / `{"mdmark": null}`'
        mock: なし
        expected: '`SchemaMismatchError`'
        exception: 書き換えられないキー
      - name: test_validate_settings_input_when_removed_key
        case: 異常
        summary: 削除したキーは引数の誤り
        condition: '`parametrize`: `{"summary": "題", "playbooks": ["壁打ち"]}` / `{"goal": null}` / `{"phases": [], "categories": []}`'
        mock: なし
        expected: '`ArgumentError`（`argument` が `settings`、メッセージに `playbooks` / `goal` / `phases`・`categories`）'
        exception: 削除したキー
      - name: test_validate_settings_input_when_mdmark_map
        case: 正常
        summary: 図の種類を渡せる
        condition: '`{"mdmark": {"map": {"kinds": {"question": {"shape": "rect"}}, "lines": {}}}}`'
        mock: なし
        expected: 例外を送出しない
  - name: merge_settings
    title: 設定の置き換え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    scope: public
    summary: 今の設定に渡したキーを当て、置き換えた設定と変わったキーを返す
    args:
      - name: current
        type: dict[str, Any]
        required: true
        passing: positional
        description: 今の `config.yaml` の中身
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: 確かめた `settings`
    returns:
      type: tuple[dict[str, Any], list[str]]
      description: 置き換えた設定（新しい辞書）と、値が変わった・消えたキーの名前（`settings` の並び）
    process: |-
      1. `current` をコピー、キーの並びを保つ
      2. `settings` のキーごとに、値が `None` ならキーを削除し、それ以外は値ごと置き換える（無いキーは末尾に追加する）。`mdmark` だけは今の `mdmark` に渡した `version`・`map` を当て（`map` は丸ごと置き換える）、渡さなかった方を残す
      3. 前と値が違うキーだけを変わったキーに入れる
    unit_tests:
      - name: test_merge_settings
        case: 正常
        summary: 渡したキーだけを置き換え、null で削除し、並びを保つ
        condition: '`summary`・`links`・`history_limit` を持つ設定に `{"summary": "新しい題名", "links": null, "description": "概要", "history_limit": 前と同じ値}`'
        mock: なし
        expected: '`summary` が新しい題名、`links` が無く、`description` が末尾にあり、他のキーの並びがそのまま。変わったキーが `[summary, links, description]`'
      - name: test_merge_settings_when_mdmark
        case: 正常
        summary: mdmark は version だけを置き換え、移し替えが書いた map を残す
        condition: '`mdmark` が `{"version": "latest", "map": {"kinds": {"llm": {}}}}` の設定に `{"mdmark": {"version": "v0.13.0"}}`'
        mock: なし
        expected: '`mdmark` が `{"version": "v0.13.0", "map": {"kinds": {"llm": {}}}}`。変わったキーが `[mdmark]`'
      - name: test_merge_settings_when_mdmark_map
        case: 正常
        summary: mdmark.map を丸ごと置き換え、version を残す
        condition: '今の `mdmark` が `version: v0.13.0` と `map.kinds.llm` を持ち、`{"mdmark": {"map": {"kinds": {"question": {"shape": "rect"}}}}}` を当てる'
        mock: なし
        expected: '`mdmark` が `version: v0.13.0` と渡した `map` だけを持ち（`map.kinds.llm` を持たない）、変わったキーが `mdmark`'
  - name: save_settings
    title: 設定の書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    scope: public
    summary: 設定を検証してから `config.yaml` を置き換える。変わらなければ書かない
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 書き込む前のワークスペース
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: 書き換えた後の `config.yaml` の中身
    returns:
      type: list[str]
      description: 書き換えた YAML（`[.mindstella/config.yaml]`。設定が `workspace.settings` と同じなら空）
    process: |-
      1. `settings` が `workspace.settings` と同じなら何も書かずに空を返す
      2. `raw` の設定を差し替えたワークスペースを作り、検証する（`validate_workspace`）
         - 問題がある場合、`SchemaMismatchError` を送出する（何も書かない）
      3. 一時ファイルに書き（`dump_yaml`、`write_temp`）、`os.replace` で置き換える
         - `OSError` が起きた場合、一時ファイルを削除して `WriteFailedError` を送出する
    exceptions:
      - name: SchemaMismatchError
        condition: 変更する種類のファイルが読めないか書き戻すと中身を失う構造、または差し替えた後のワークスペースに問題がある
        message: スキーマに合いません（`lines` に問題ごとの行）
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError` が起きた（置き換えたファイルを戻した後）
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_save_settings
        case: 正常
        summary: 設定を書き、一時ファイルを残さない
        condition: '`summary` を変えた設定'
        mock: なし
        expected: 戻り値が `[.mindstella/config.yaml]`。読むと渡した中身。`.tmp` のファイルが無い
      - name: test_save_settings_when_schema_mismatch
        case: 異常
        summary: スキーマに合わない設定は書かない
        condition: '`history_limit: -1` の設定'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `config.yaml: history_limit` で始まる行）。`config.yaml` が呼ぶ前と同じ'
        exception: スキーマに合わない
      - name: test_save_settings_when_replace_fails
        case: 異常
        summary: 置き換えに失敗したら一時ファイルを残さない
        condition: '`os.replace` を `OSError` を送出する関数に差し替える'
        mock: '`os.replace`（`settings_update` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`（メッセージに `config.yaml`）。`config.yaml` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: 置き換えで OSError
      - name: test_save_settings_when_settings_unchanged
        case: 正常
        summary: 設定が変わらないときは書かない
        condition: '`workspace.settings` と同じ設定'
        mock: なし
        expected: 戻り値が空。`config.yaml` が呼ぶ前と同じ
  - name: update_settings
    title: 設定の更新
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 設定の更新
    scope: public
    summary: 引数を確かめ、設定を置き換えて書く
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ（絶対パス）
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`settings`'
    returns:
      type: dict[str, Any]
      description: '`{changed, files}`'
    process: |-
      1. ワークスペースを読む（`load_workspace`）
      2. 引数を確かめ、設定を置き換える（`stage_settings`）
      3. 書く（`save_settings`）
      4. 変更の検知の前回の中身を、書いたファイルとその中身で置き換える（『変更の検知』の `accept_own_write`）
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い（`load_workspace` から伝わる）'
      - name: ArgumentError
        condition: '`validate_settings_input` から伝わる'
      - name: SchemaMismatchError
        condition: '`validate_settings_input`・`save_settings` から伝わる'
      - name: WriteFailedError
        condition: '`save_settings` から伝わる'
    unit_tests:
      - name: test_update_settings
        case: 正常
        summary: 設定を置き換えて書く
        condition: '`settings` `{"summary": "新しい題名", "links": [{"title": "仕様", "url": "https://example.com"}]}`'
        mock: なし
        expected: '`changed` が `[summary, links]`、`files` が `[.mindstella/config.yaml]`。種類ごとの YAML が呼ぶ前と同じ'
      - name: test_update_settings_when_removed_key
        case: 異常
        summary: 削除したキーを渡すと何も書かない
        condition: '`settings` `{"summary": "題", "playbooks": ["壁打ち"]}`'
        mock: なし
        expected: '`ArgumentError`（メッセージに `playbooks`）。ワークスペースの全てのファイルが呼ぶ前と同じ'
        exception: 削除したキー
      - name: test_update_settings_when_display
        case: 正常
        summary: 表示の既定を丸ごと置き換え、ほかのキーを変えない
        condition: '`display` を持たない設定のワークスペースに `{"display": {"visible_kinds": [会話ログを除く 6 種類]}}`。続けて `{"display": {}}` を渡す'
        mock: なし
        expected: '1 回目の `changed` が `[display]`、`files` が `[.mindstella/config.yaml]`、`config.yaml` の `display` が渡した値で `summary`・`history_limit` が呼ぶ前と同じ。2 回目の後は `display` が `{}`（`visible_kinds` を持たない）'
      - name: test_update_settings_when_mdmark_map_invalid
        case: 異常
        summary: 設定のスキーマに合わない図の種類は断る
        condition: '正しい設定のワークスペースで `{"mdmark": {"map": {"kinds": {"question": {"shape": "木"}}}}}`'
        mock: なし（`tmp_path`）
        expected: '`SchemaMismatchError`（行が `config.yaml: mdmark.map.kinds.question.shape` で始まる）。`config.yaml` が呼ぶ前と同じ'
  - name: update_display
    title: 表示の既定の書き換え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: ワークスペースの既定を変える
    scope: public
    summary: 要求の本文の `visible_kinds` で `config.yaml` の `display` だけを丸ごと置き換える（`PUT /api/config/display` の受け付け。配信の `write_response` が書き換えの鍵を取った中で呼ぶ）
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配っているワークスペース
      - name: body
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文（JSON のオブジェクト）
    returns:
      type: dict[str, Any]
      description: '`{display}`（書いた後の `config.yaml` の `display`）'
    process: |-
      1. 本文を確かめる
         - `visible_kinds` が無い場合、`SettingsInvalidError`（`visible_kinds: 渡してください`）
         - `visible_kinds` 以外のキー（削除した `network_look` を含む）がある場合、`SettingsInvalidError`（`{キー}: 知らないキーです`）
         - 本文を、設定のスキーマの `display` の部分（`properties.display`。共通のスキーマを登録した検証器で）と突き合わせ、合わない場合は問題ごとの `{キーのパス}: {理由}`（列挙の誤りは選べる値を含む）をメッセージにした `SettingsInvalidError` を送出する（選べる種類の名前はスキーマだけが持つ）
      2. `config.yaml` を検査する（`check_settings`）
         - 問題がある場合、`SchemaMismatchError` を送出する（崩れた設定の上に追記しない。配信は 422）
      3. 読んだ設定の `display` を `{visible_kinds}` に置き換える（キーの並びは保ち、`display` が無ければ末尾に追加する）
      4. 置き換えた設定を書く（設定の書き込み。`save_settings`。ワークスペース全体を検証してから一時ファイルと `os.replace` で置き換える）
         - 書けない場合、`WriteFailedError` がそのまま上がる（配信は 500）
      5. `{display}` を返す（変更履歴にも書き換えのまとまりにも入れない。書き換えの通知は `config.yaml` の更新日時で配信が見つける）
    exceptions:
      - name: SettingsInvalidError
        condition: 本文の `visible_kinds` が無いか値が合わない、またはほかのキーがある
        message: '{キー}: {理由}'
      - name: SchemaMismatchError
        condition: 今の `config.yaml` がスキーマに合わない、または置き換えた後のワークスペースに問題がある
        message: スキーマに合いません（`lines` に問題ごとの行）
      - name: WriteFailedError
        condition: '`config.yaml` を書けない'
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_update_display
        case: 正常
        summary: display だけを置き換え、ほかのキーと並びを保つ
        condition: '`display` を持たない設定のワークスペースに `{visible_kinds: [用語集を除く 6 種類]}`'
        mock: なし
        expected: 戻り値の `display` が渡した値。`config.yaml` のキーが前と同じ並びで末尾に `display`、ほかの値が呼ぶ前と同じ。`changes.yaml` を書いていない
      - name: test_update_display_when_body_invalid
        case: 異常
        summary: 合わない本文は書かない
        condition: '`parametrize`: `network_look: glow` を含む / `visible_kinds` が無い / `visible_kinds` が `[decisions, decisions]` / `visible_kinds` が `[graph]` / `visible_kinds` が文字列'
        mock: なし
        expected: 'どれも `SettingsInvalidError`。メッセージは、`network_look` を含むときは `network_look: 知らないキーです`、後の 4 つは `visible_kinds` を含み、`[graph]` では選べる値（`decisions` を含む）も含む。`config.yaml` が呼ぶ前と同じ'
        exception: 本文の値が合わない
      - name: test_update_display_when_settings_broken
        case: 異常
        summary: 崩れた config.yaml には追記しない
        condition: '`summary` を削除した `config.yaml` のワークスペースに正しい本文'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `config.yaml: ` と `summary`）。`config.yaml` が呼ぶ前と同じ'
        exception: 今の config.yaml が合わない
  - name: stage_settings
    title: 設定の更新を当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/settings_update.py
    usecase: 共通
    scope: public
    summary: 引数を確かめ、設定を置き換え、書かずに結果を返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 当てる前のワークスペース
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: 置き換える設定のキーと値
    returns:
      type: SettingsStage
      description: 当てた設定と変わったキー
    process: |-
      1. 引数を確かめる（`validate_settings_input`）
      2. 設定を置き換えて返す（`merge_settings`）
    exceptions:
      - name: ArgumentError
        condition: '`validate_settings_input` から伝わる'
      - name: SchemaMismatchError
        condition: '`validate_settings_input` から伝わる'
    unit_tests:
      - name: test_stage_settings
        case: 正常
        summary: 書かずに当てた設定を返す
        condition: '`settings` `{"summary": "新しい題名"}`'
        mock: なし
        expected: '`changed` が `[summary]`、`settings` の `summary` が新しい題名。`config.yaml` が呼ぶ前と同じ'

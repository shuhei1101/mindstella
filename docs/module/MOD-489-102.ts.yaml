id: MOD-489-102
title: プレビュー / body-links
lead: 描いた本文に、見出しのリンク・本文のマーカー・項目の ID のリンクを付ける処理。
functions:
  - name: linkHeadings
    title: 見出しのリンク
    kind: 関数
    usecase: 項目の詳細を読む
    summary: '見出しに `h` の値の ID と # のリンクを付ける'
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた本文
      - name: onHeading
        type: '(slug: string) => void'
        required: true
        description: '# を押したとき'
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_link_headings
        case: 正常
        summary: 同じ文言に番号
        condition: 同じ見出しが 2 つ
        mock: なし
        expected: 2 つ目の ID の末尾が `-1`
    container: frontend/src/shared/core/body-links.ts
  - name: linkBody
    title: 本文のマーカーと項目のリンク
    kind: 関数
    usecase: 項目の詳細を読む
    summary: 用語・資料・調査の語にマーカーを付け、項目の ID と記録にあるスレッド・書き込みの ID をリンクにする。差分を描いた本文にも同じく付け、削除した行の中はリンクにしない。項目の ID のリンクには `title` を付けず、`attachTermTips` が種類 `item` のツールチップを出す
    args:
      - name: root
        type: HTMLElement
        required: true
        description: 描いた本文
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: onOpen
        type: '(id: string) => void'
        required: true
        description: 項目へ移る
      - name: threads
        type: LookupThread | null
        required: false
        default: 'null'
        description: スレッドの ID からタイトルと書き込みの ID の並びを参照する。`null`（配る書き出し）のときはスレッドの ID を文字のままにする
      - name: onOpenThread
        type: '(threadId: string, postId: string | null) => void'
        required: false
        description: スレッドの ID・書き込みの ID のリンクを押したとき
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_link_body
        case: 正常
        summary: ID をリンクにする
        condition: '`D-1` を含む本文'
        mock: なし
        expected: D-1 のリンクを押すと `onOpen('D-1')`
      - name: test_link_body_when_thread_ids
        case: 正常
        summary: スレッドの ID と書き込みの ID をリンクにする
        condition: '`TH-1`・`TH-1-2`・`TH-99` を含む本文、`threads` は TH-1（書き込み TH-1-1・TH-1-2）だけ'
        mock: なし
        expected: TH-1・TH-1-2 がリンクで TH-99 は文字のまま。押すと `onOpenThread('TH-1', null)`・`onOpenThread('TH-1', 'TH-1-2')`
      - name: test_link_body_when_diff
        case: 正常
        summary: 差分を描いた本文にもリンクとマーカーを付ける
        condition: '`renderMarkdown` に `options.base` を指定して描いた、追加した行に `D-1` と用語、削除した行に `D-2` を含む本文'
        mock: なし
        expected: 追加した行の D-1 がリンクで用語にマーカーが付き、削除した行の D-2 はリンクにならない
    container: frontend/src/shared/core/body-links.ts
  - name: renderMarkdown
    title: 本文を描く
    kind: 関数
    usecase: 項目の詳細を読む
    summary: '本文の Markdown を mdmark で描いた要素にする（コピーのボタンの文言は `mount` の設定 `labels.paramCopy` に指定し、描いた後に書き換えない）。（処理 6 のコードブロックの `pre` のフォーカスの属性と、`options.table` による表の機能の指定を含む）。`config.features` は `MDMARK_FEATURES` の値（`options.table` が偽でなければ `table` だけオン）、`config.map` は『libraries』の `mdmarkMapConfig()`。`MDMARK_FEATURES` は `print` をオンにする。`options.base` を指定すると mdmark の `baseMarkdown` に渡し、`options.diffSource` を指定すると、選んだ時点と今の 2 つのリビジョンを返す取り出し元と `diffMode: "open"`・`docId`（項目の ID）を渡す'
    args:
      - name: source
        type: string
        required: true
        description: 本文の Markdown
      - name: options
        type: '{table?: boolean; base?: string; diffSource?: {docId: string; before: string; after: string}}'
        required: false
        default: '{}'
        description: '`table` は mdmark の表の機能をオンで指定するか（省くと真。スレッドの書き込みでは偽）。`base` は比較元の Markdown（描いた結果）、`diffSource` は行の差分で比べる項目の ID と前後の本文（原文の差分）'
    returns:
      type: HTMLElement
      description: 描いた本文（class `mdmark`）。mdmark が読めないときと、mdmark の `mount` が例外を投げたとき（部品の読み込みを差し替えられないタグの mdmark を中に持つ配る書き出しで map の範囲を描いたときなど）は、例外を投げずに `libraryNotice`（mdmark）と原文の `pre` を持つ要素
    unit_tests:
      - name: test_render_markdown_when_code_block
        case: 正常
        summary: コードブロックの pre をフォーカスできる要素にする
        condition: mdmark の `mount` を、mdmark と同じ属性を持つ言語指定 `json` のコードブロックと言語指定の無いコードブロック・属性を持たない字下げのコードブロック・mermaid のコードブロック・`.mdmark-html` の中の `pre`・`.mdmark-map` の中の mermaid のコードブロックを描く代わりのものにする
        mock: 描画のライブラリ（`@/shared/adapters/libraries`）
        expected: '範囲の外の 3 つのコードブロックの `pre` が `tabindex="0"` を持ち、`aria-label` は順に `コード: json`・`コード`・`コード`。`role` は持たない。図の入れ物の `pre.dg-raw` と範囲の中の `pre` は `tabindex` を持たない。`.mdmark-map` の中の mermaid のコードブロックは図の入れ物にならない'
      - name: test_render_markdown_when_mount_failed
        case: 異常
        summary: 描けない本文を原文にする
        condition: mdmark は読めているが `mount` が例外を投げる
        mock: 描画のライブラリ（`@/shared/adapters/libraries`）
        expected: 例外を投げず、mdmark の名前を持つ知らせと、原文をそのまま持つ `pre.md-raw` を返す
      - name: test_render_markdown_when_base
        case: 正常
        summary: 比較元の Markdown を渡す
        condition: '`options.base` を指定する'
        mock: 描画のライブラリ（`@/shared/adapters/libraries`）
        expected: '`mount` の `baseMarkdown` が `options.base` で、`config.features.print` が真'
      - name: test_render_markdown_when_diff_source
        case: 正常
        summary: 取り出し元を渡す
        condition: '`options.diffSource` に `D-1` と前後の本文を指定する'
        mock: 描画のライブラリ（`@/shared/adapters/libraries`）
        expected: '`mount` の `docId` が `D-1`、`diffMode` が `open` で、`diffSource.revisions` が 2 つのリビジョン、`content` がそれぞれ前後の本文を返す'
    container: frontend/src/shared/core/body-links.ts
  - name: resolveFileSources
    title: 本文のファイルのパスの解決
    kind: 関数
    container: frontend/src/shared/core/body-links.ts
    usecase: 動画などのファイルを配置して資料に埋め込む
    scope: public
    summary: 本文の相対パスのファイルの参照を配信のパスにする。`mountMarkdown` が mdmark の `mount` の直後に呼ぶ（基準のパスは同じ `workspacePath() + FILE_BASE_PATH`。`/w/{workspace}/files/{名前}` を指す）
    side_effects: '`root` の中の要素の `src`・`poster` を書き換える'
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: positional
        description: mdmark が描いた本文
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_resolve_file_sources
        case: 正常
        summary: 相対パスだけを配信のパスにする
        condition: 相対パス・絶対パス・`data:` の `src` を持つ要素で、`location` を `http://127.0.0.1:8784/w/mindstella-x-1/` にする
        mock: なし（jsdom）
        expected: 相対パスだけが `/w/mindstella-x-1/files/a.png` などになる
    callees:
      - MOD-642-1#functions[workspacePath]
notes:
  単体テスト: 同じフォルダの `body-links.test.ts` に置く（knowledge の規約『フォルダ構成』）
  原文の差分の指定: '`renderMarkdown` が取り出し元（`diffSource`）を渡して描くとき（「原文の差分」）は、`mount` の引数に `diffMode: "open"` に加えて `diffControls: false` を渡し、mdmark の「変更表示」のボタンとリビジョンを選ぶ欄を配置させない（『プレビューを開く』の制約「描画のライブラリ」）。`RenderOptions` の型に `diffControls?: false` を加える。単体テストは `renderMarkdown` に `test_render_markdown_when_diff_source`（取り出し元を渡すと `mount` の引数に `diffMode: open` と `diffControls: false` がある）を追加する'
  値の欄: '`linkBody` は本文に加えて詳細の値の欄（モジュール構成『value-text』）からも呼ぶ（#688）。引数と振る舞いは変えない'
  ID の判定: '`linkBody` が本文の文字から項目の ID・スレッドの ID を見つける判定は、`record-ids` の `RECORD_ID_PATTERN`・`findRecordIds` を使用する（部品『記録の文字』と同じ判定）。マーカー・リンクの付け方は変えない'
  mdmark の機能のオン・オフ: '`MDMARK_FEATURES` は、MindStella の画面と重なる機能だけをオフにする（`glossary`・`backlinks`・`comments`・`anchors`・`sections`・`toc`・`side-toc`・`views`・`mermaid`・`diagram-resize`・`lightbox`・`back-to-top`。機能ごとの重なる画面の機能は外部ライブラリ『mdmark』）。`syntax`・`code` のオフを削除し（mermaid・`html` のコードブロックは、mdmark のバーを持つ入れ物 `.mdmark-code` ごと図・ HTML の本文の枠の入れ物に置き換える）、`print` はオン、`table` は今のまま `renderMarkdown` が指定する（#710）。単体テスト `test_render_markdown_when_code_block` は、mdmark のコードブロックのバーを描いた結果でも `pre` の属性が同じであることを確認し、mermaid のコードブロックのバーを残さないことも確認するように変え、`test_render_markdown_features`（`mount` の `config.features` が `syntax`・`code` を持たず、重なる機能だけが偽）を追加する'
  外部のリンク: '`renderMarkdown` は mdmark の `mount` の直後に `markExternalLinks(root)` を呼ぶ。`root` の中の `a[href]` のうち、`href` が `#` で始まらず、`new URL(href, location.href)` のスキームが `http:`・`https:` で、その `origin` が `location.origin` と異なるものに `target="_blank"`・`rel="noopener noreferrer"` を付ける（解決できない `href` は変えない）。サーバーの配信の本文・値の欄・スレッドの書き込みはどれも `renderMarkdown` を通る。配る書き出しは `renderMarkdown` を通らないため、『doc-export』が埋め込むスクリプトで同じ判定をする（#708。『プレビューを開く』の制約「外部のリンク」）。単体テスト `test_mark_external_links`（別のオリジン・同じオリジン・`#id=D-1`・`#見出し` のリンクのうち、別のオリジンだけが `target` と `rel` を持つ）を追加する'

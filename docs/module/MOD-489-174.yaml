      body-format-badge.ts  本文の形式の札（部品設計『本文の形式の札』）
      html-body-frame.ts    HTML の本文の枠（部品設計『HTMLの本文の枠』）
      html-body-diff.ts     HTML の本文の差分（部品設計『HTMLの本文の差分』）

id: MOD-489-186
title: サーバー / 移行 / remove_tag_vocabulary.py
test_files:
  - tests/unit/scripts/test_remove_tag_vocabulary.py
functions:
  - name: remove_tag_vocabulary.migrate
    title: タグの語彙を外す移し替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/migrations/v0.11.0/scripts/remove_tag_vocabulary.py
    usecase: 記録の形式の移行
    scope: public
    summary: v0.11.0 の `call`（`remove_tag_vocabulary`）が呼ぶ変換（関数名は `migrate`）。`config.yaml` から `tags` を削除する（項目とスレッドの `tags` は変えない）
    side_effects: '`.mindstella/config.yaml` を書き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: list[str]
      description: 変えたファイル（ワークスペースからの相対パス。変えなければ空）
    process: |-
      1. `.mindstella/config.yaml` が無ければ空を返す
      2. `yaml.safe_load` で読む。一番上が辞書でなければ `config.yaml の形が崩れています` の `ValueError` を送る
      3. `tags` のキーが無ければ、何も書かず空を返す
      4. 他のキーの並びを保って `tags` を削除し、読み書きと検証の `dump_yaml` と `write_temp` で一時ファイルに書き、`os.replace` で置き換える
         - 置き換えで `OSError` が起きた場合、一時ファイルを削除して送り直す
      5. `[.mindstella/config.yaml]` を返す
    exceptions:
      - name: ValueError
        condition: '`config.yaml` の形が崩れている'
      - name: OSError
        condition: 読めない・書けない
    unit_tests:
      - name: test_remove_tag_vocabulary
        case: 正常
        summary: 設定から tags を削除し、他のキーと項目のタグを残す
        condition: '`tags: [{name: 保存, summary: s}]` と `categories` を持つ `config.yaml`、D-1: `[保存]`'
        mock: なし
        expected: 戻り値が `[.mindstella/config.yaml]`。`config.yaml` が `tags` を持たず、他のキーとその並び、D-1 が呼ぶ前と同じ
      - name: test_remove_tag_vocabulary_when_no_tags
        case: 正常
        summary: tags が無ければ書かない。もう一度当てても変えない
        condition: '`tags` を持たない `config.yaml`'
        mock: なし
        expected: 戻り値が空で、`config.yaml` が呼ぶ前と同じ
      - name: test_remove_tag_vocabulary_when_broken
        case: 異常
        summary: 設定の形が崩れていれば移さない
        condition: 一番上が配列の `config.yaml`
        mock: なし
        expected: '`ValueError`。`config.yaml` が呼ぶ前と同じ'

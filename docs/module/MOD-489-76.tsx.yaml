id: MOD-489-76
title: プレビュー / list-screen
lead: 一覧の画面の枠（表示形式の切り替え・項目の追加・削除した項目の帯・絞り込みのドロワーと表の状態）。
components:
  - name: ListScreen
    title: 一覧の画面の枠
    kind: コンポーネント
    usecase: 項目を表で絞り込む
    summary: '一覧の画面の枠（表示形式の切り替え・項目の追加・削除した項目の帯・絞り込みのドロワーと表の状態）。`useScreenFilters` の `filters`・`tagMatch` で行を絞り（`filterRows` に `tagMatch` を渡す）、`setTagMatch` をドロワーの `onTagMatchChange`、`addTag` を表・ボード・カードの `onSelectTag` に渡す。簡易で表せない `tagExpr` があるときは、`filterRows` で絞った行を `matchesTagExpr` でさらに絞り、`describeTagExpr` の文と `setTagExpr(null)` を条件のチップと表の `tagExprText`・`onClearTagExpr` に渡す。ドロワーには `presetChoicesOf`（記録の取得の `settings.presets`、画面の項目のタグ、今の `tagExpr`）の結果を `presets`、`setTagExpr(プリセットの式)` を `onApplyPreset`、`tagExpr`・`setTagExpr` を `tagExpr`・`onTagExprChange` に渡す。`useListScroll` のキーは `{画面}:{表示形式}`。ドロワーの値の選択・解除・グループの解除は `setFilters(…, {push: true})`（タグのグループは `setTagExpr(null, {push: true})`）、すべて解除は `clearAll`、プリセットとタグの条件の詳細は `setTagExpr(…, {push: true})`、文字の条件は `setTextFilter`・`commitTextFilter` を渡す。表の並べ替えは `setSort`（積む）、列が無くなった並びの解除と初期設定に戻すは `setSort(undefined, {replace: true})` にする'
    container: frontend/src/shared/components/list-screen.tsx
notes:
  プリセットの保存と絞り込みの候補: "ドロワーの `presetSave` に、`hasOtherConditions`（`filters` に `tags` 以外の条件か文字の条件があるか）と `onSave`（`usePresetSave(tagExpr)`）を渡す（配る書き出しでは渡さない）。描いている間は、ドロワーに渡す `drawerGroups` の結果（タグの条件の `key` は `tags`）と、`apply(key, value)`（値を `filters[key]` に加えて `setFilters(…, {push: true})`。既にあれば何もしない。`tags` は `addTag`）を、後片付けつきの `useEffect` で `useFilterCandidatesStore` の `publish` に渡し、外したときに `clear` を呼ぶ。単体テスト `test_list_screen_when_candidates`（描いた後にストアの `groups` がドロワーと同じで、`apply('status', '保留')` で URL に `f.status=保留` が入り履歴が 1 つ増える。外すと `groups` が空）を追加する"
  お気に入り: '`useFavorites`（モジュール構成『use-favorites』）を使用し、表の列の先頭に `favoriteColumn(ids, toggle)` を加える。`only` が真なら絞り込みの後の行を `favoritesOnly` で絞り（カード・ボード・表のどれでも）、条件のチップと表に `onClearFavoritesOnly`（`clearOnly`）を指定する。表示形式がカードで `first` が真のときだけ、並べ替えたカードを `favoritesFirst` で先頭に並べ（ボードは並びを変えない）、その並びを `shown` と詳細の一覧の並びに使用する。`content` に `favorites`（`ids`）・`favoritesFirst`（`first`）・`onToggleFavorite`（`toggle`）を指定する。単体テスト `test_list_screen_when_favorites`（カードでお気に入りが先頭、`favoritesOnly: true` でお気に入りだけとチップ「お気に入りのみ」が出る）を追加する'
  コメントの件数: ボードのカードと表に指定する項目ごとのコメントの件数は、レビュー中の書き込みのうち `target` を持ち、案の選択（`isChoice`）でないものを数える（詳細パネルの件数と統一する）

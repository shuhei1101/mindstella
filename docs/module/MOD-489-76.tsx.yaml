id: MOD-489-76
title: プレビュー / list-screen
lead: 一覧の画面の枠（表示形式の切り替え・項目の追加・削除した項目の帯・絞り込みのドロワーと表の状態）。
components:
  - name: ListScreen
    title: 一覧の画面の枠
    kind: コンポーネント
    usecase: 項目を表で絞り込む
    summary: '一覧の画面の枠（表示形式の切り替え・項目の追加・削除した項目の帯・絞り込みのドロワーと表の状態）。`useScreenFilters` の `filters`・`tagMatch` で行を絞り（`filterRows` に `tagMatch` を渡す）、`setTagMatch` をドロワーの `onTagMatchChange`、`addTag` を表・ボード・カードの `onSelectTag` に渡す。簡易で表せない `tagExpr` があるときは、`filterRows` で絞った行を `matchesTagExpr` でさらに絞り、`describeTagExpr` の文と `setTagExpr(null)` を条件のチップと表の `tagExprText`・`onClearTagExpr` に渡す。ドロワーには `presetChoicesOf`（記録の取得の `settings.presets`、画面の項目のタグ、今の `tagExpr`）の結果を `presets`、`setTagExpr(プリセットの式)` を `onApplyPreset`、`tagExpr`・`setTagExpr` を `tagExpr`・`onTagExprChange` に渡す。`useListScroll` のキーは `{画面}:{表示形式}`。ドロワーの値の選択・解除・グループの解除は `setFilters(…, {push: true})`（タグのグループは `setTagExpr(null, {push: true})`）、すべて解除は `clearAll`、プリセットとタグの条件の詳細は `setTagExpr(…, {push: true})`、文字の条件は `setTextFilter`・`commitTextFilter` を渡す。表の並べ替えは `setSort`（積む）、列が無くなった並びの解除と初期設定に戻すは `setSort(undefined, {replace: true})` にする'
    container: frontend/src/shared/components/list-screen.tsx

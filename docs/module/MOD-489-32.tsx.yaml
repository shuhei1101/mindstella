id: MOD-489-32
title: プレビュー / detail-panel
lead: 画面設計『詳細パネル.tsx』の要素と操作を描く。
components:
  - name: DetailPanel
    title: 詳細パネル
    kind: 画面
    usecase: 項目の詳細を読む
    summary: 画面設計『詳細パネル.tsx』の要素と操作を描く
    refs:
      - SCR-489-32#
    unit_tests:
      - name: test_detail_panel_when_body_scroll_saved
        case: 正常
        summary: 本文のスクロール位置へ戻す
        condition: 項目の位置が保存領域にある
        mock: MSW
        expected: 本文のスクロール領域がその位置に戻る
      - name: test_detail_panel
        case: 正常
        summary: 項目を描く
        condition: '`id=D-1`'
        mock: MSW
        expected: タイトル・案・本文・関係する項目
      - name: test_detail_panel_when_diff
        case: 正常
        summary: 本文の差分
        condition: '`diff=V-2` で本文を変えた項目'
        mock: MSW
        expected: 足した行と消した行
      - name: test_detail_panel_when_editing
        case: 正常
        summary: 編集の表示
        condition: 「編集する」を押す
        mock: MSW
        expected: 入力欄と保存待ちの印
      - name: test_detail_panel_when_comments
        case: 正常
        summary: 下端にコメント
        condition: サーバーの配信で項目を開く
        mock: MSW
        expected: 下端に部品『DetailComments』があり、今の画面を開くリンクが無い
      - name: test_detail_panel_when_comments_button
        case: 正常
        summary: 見出しのコメントの一覧のボタンで、その項目で絞ったコメントの一覧を開く
        condition: サーバーの配信で search が `id=D-1&panel=comments&thread=TH-1&tstatus=all` のとき、読み上げの名前「D-1 のコメントの一覧を開く」のボタンを押す
        mock: MSW
        expected: search が `id=D-1&panel=comments&tstatus=all&ttarget=D-1`（`thread` が外れる）で、履歴の数が変わらない。全画面（`full=1`）ではボタンが無い
    container: frontend/src/features/detail/detail-panel/detail-panel.tsx
notes:
  単体テスト: 同じフォルダの `detail-panel.test.tsx` に置く（knowledge の規約『フォルダ構成』）

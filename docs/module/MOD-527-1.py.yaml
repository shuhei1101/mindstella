id: MOD-527-1
title: サーバー / 移行 / markdown_bodies_to_mark_md.py
lead: v0.14.0 の 2 手順目の変換。`.mindstella/docs/` の Markdown の本文を `.mark.md` へ改名し、項目の `body` と変更履歴の `before.body` を書き換える。`yaml` と標準ライブラリだけを読み、このバージョンの形式を自分で組み立てる。
constants:
  - name: KIND_FILES
    title: 種類のファイル
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/markdown_bodies_to_mark_md.py
    usecase: 記録の形式の移行
    summary: '`body` を書き換える種類ごとの YAML（`.mindstella/` からの相対パス）'
    value: ("decisions.yaml", "tasks.yaml", "research.yaml", "docs.yaml", "terms.yaml", "notes.yaml", "logs.yaml")
  - name: HISTORY_FILE
    title: 変更履歴のファイル
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/markdown_bodies_to_mark_md.py
    usecase: 記録の形式の移行
    summary: '`before.body` を書き換える変更履歴の YAML（`.mindstella/` からの相対パス）'
    value: '"history.yaml"'
  - name: MARK_SUFFIX
    title: mdmark の文書の拡張子
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/markdown_bodies_to_mark_md.py
    usecase: 記録の形式の移行
    summary: 改名後の本文の拡張子
    value: '".mark.md"'
functions:
  - name: markdown_bodies_to_mark_md.migrate
    title: 本文の Markdown を .mark.md へ改名する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/migrations/v0.14.0/scripts/markdown_bodies_to_mark_md.py
    usecase: 記録の形式の移行
    scope: public
    summary: '`docs/` の直下の `.mark.md` でない `*.md` を改名し、それを指す `body` と `before.body` を書き換える'
    side_effects: '`.mindstella/docs/` の本文のファイルを改名し、種類ごとの YAML と `history.yaml` を書き換える（本文の中身・`docs/*.html`・`release/` は触らない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースの直下
    returns:
      type: list[str]
      description: 変えたファイル（ワークスペースからの相対パス。改名した本文は改名後のパス。何も変えなければ空）
    process: |-
      1. `.mindstella/docs/` の直下の `*.md` のうち名前が `MARK_SUFFIX` で終わらないファイルを名前の順に集める。どれかの改名先 `{名前}.mark.md` が既にあれば、何も書かずに `RuntimeError` を送出する
      2. `KIND_FILES` の各ファイルの `items[]` の `body` と、`HISTORY_FILE` の各項目の行の `history[].before.body` のうち、`docs/{名前}.md` で `MARK_SUFFIX` で終わらない値を `docs/{名前}.mark.md` に置き換える（キーの並び・`updated`・変更履歴の並びは変えない）
      3. 1 で集めたファイルを `os.replace` で改名し、2 で書き換えた YAML だけを一時ファイルに書いてから置き換え、変えたファイルを返す。改名するファイルも書き換える値も無ければ何も書かない
    exceptions:
      - name: RuntimeError
        condition: 改名先の `.mark.md` が既にある、または YAML を読めない。手順の `StepError` にしてコピーから戻すのは移行が担う
    unit_tests:
      - name: test_migrate
        case: 正常
        summary: Markdown の本文を改名し、`body` と `before.body` を書き換える
        condition: 'D-1（`body: docs/D-1.md`、本文あり。`history.yaml` の D-1 の行に `before.body: docs/D-1.html` と `before.body: docs/D-1.md` の回）・A-1（`body: docs/A-1.html`）・どの項目からも指されない `docs/X-1.md`'
        mock: なし（`tmp_path`）
        expected: '`docs/D-1.mark.md`・`docs/X-1.mark.md` が改名前と同じ中身で、`D-1.md`・`X-1.md` が無い。D-1 の `body` が `docs/D-1.mark.md`、`before.body` が `docs/D-1.html` と `docs/D-1.mark.md` で、D-1 の `updated` と変更履歴の並びが同じ。A-1 と `docs/A-1.html` は同じ。戻り値が `.mindstella/decisions.yaml`・`.mindstella/history.yaml`・`.mindstella/docs/D-1.mark.md`・`.mindstella/docs/X-1.mark.md`'
      - name: test_migrate_when_already_current
        case: 正常
        summary: もう一度当てても変わらない
        condition: '`test_migrate` を当てた後のワークスペース'
        mock: なし
        expected: 戻り値が空で、全てのファイルが呼ぶ前と同じ
      - name: test_migrate_when_target_exists
        case: 異常
        summary: 改名先が既にあれば何も書かずに失敗する
        condition: 'D-1（`body: docs/D-1.md`）を持ち、`docs/` に `D-1.md` と `D-1.mark.md` の両方がある'
        mock: なし
        expected: '`RuntimeError`（メッセージに `docs/D-1.mark.md`）。全てのファイルが呼ぶ前と同じ'
      - name: test_migrate_when_no_history
        case: 正常
        summary: 変更履歴のファイルが無くても改名する
        condition: '`history.yaml` を持たず、D-1（`body: docs/D-1.md`）を持つ'
        mock: なし
        expected: '`docs/D-1.mark.md` があり、D-1 の `body` が `docs/D-1.mark.md`。`history.yaml` を作らない'
refs:
  - IF-489-52#
  - MOD-489-164#
test_files:
  - tests/unit/scripts/test_markdown_bodies_to_mark_md.py

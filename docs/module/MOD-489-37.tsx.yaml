id: MOD-489-37
title: プレビュー / pending-edits-panel
lead: 画面設計『保存待ちのパネル.tsx』の要素と操作を描く。
components:
  - name: PendingEditsPanel
    title: 保存待ちのパネル
    kind: 画面
    usecase: 画面で項目を編集して保存する
    summary: '画面設計『保存待ちのパネル.tsx』の要素と操作を描く。パネルは部品『左のパネル』（`resizerLabel` 「保存待ちのパネルの幅」）で描く。パネルとグレーアウトは `position: fixed` で、上端を CSS 変数 `--topbar-height`（無ければ 0）、下端を画面の下端にする（幅によらず同じ）'
    refs:
      - SCR-489-11#
    unit_tests:
      - name: test_pending_edits_panel
        case: 正常
        summary: 取り消す
        condition: 取り消すを押す
        mock: MSW
        expected: '`DELETE /api/edits/E-1`'
      - name: test_pending_edits_panel_when_blocked
        case: 異常
        summary: 書き込めない編集
        condition: 保存が 409
        mock: MSW
        expected: 行に理由
    container: frontend/src/features/edits/pending-edits/pending-edits-panel.tsx
notes:
  単体テスト: 同じフォルダの `pending-edits-panel.test.tsx` に置く（knowledge の規約『フォルダ構成』）

id: MOD-531-6
title: サーバー / 起動 / session_hook.py
test_files:
  - tests/unit/scripts/test_session_hook.py
constants:
  - name: POST_TIMEOUT_SEC
    title: 送信の上限
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 外部のアプリから起動する
    summary: 常駐サーバーへ 1 回送る上限
    value: 2.0（非機能要件『フックの送信の上限』）
  - name: EVENTS
    title: 出来事の名前
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 外部のアプリから起動する
    summary: コマンドの引数から本文の `event` への対応
    value: '{"session-start": "session_start", "session-end": "session_end", "prompt-submit": "prompt_submit", "stop": "stop", "stop-failure": "stop_failure"}'
  - name: PROMPT_FILE
    title: 注入文の雛形
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 起動と再開
    summary: SessionStart の注入文の雛形（モジュール構成『エージェントフロー』）
    value: Path(__file__).resolve().parent.parent / "prompts" / "session_start.md"
functions:
  - name: main
    title: フックの入口
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`MINDSTELLA_SESSION` があれば出来事を送り、SessionStart（`fork` 以外）では再開の状況を引いて `additionalContext` を出し、書き終えた後に前回参照した時点を進める。どの結末も 0 を返す'
    description: 依存が揃う前のシステムの `python3` で起動するので、Python 3.8 で読める構文と標準ライブラリだけで書く
    side_effects: 常駐サーバーへ出来事を送る
    args:
      - name: argv
        type: list[str] | None
        required: false
        default: None
        passing: positional
        description: '`[出来事]`'
      - name: environ
        type: Mapping[str, str]
        required: false
        default: os.environ
        passing: keyword
        description: 環境変数
      - name: stdin
        type: TextIO
        required: false
        default: sys.stdin
        passing: keyword
        description: フックの入力
      - name: stdout
        type: TextIO
        required: false
        default: sys.stdout
        passing: keyword
        description: 注入の出力先
      - name: post
        type: Callable[[int, str, dict], None]
        required: false
        default: post_event
        passing: injected
        description: 送る関数
      - name: resume
        type: Callable[[int, str, str], dict]
        required: false
        default: request_resume
        passing: injected
        description: 再開の状況を引く関数
      - name: advance
        type: Callable[[int, str, int], None]
        required: false
        default: post_read_point
        passing: injected
        description: 前回参照した時点を進める関数
    returns:
      type: int
      description: 常に 0
    unit_tests:
      - name: test_main
        case: 正常
        summary: SessionStart で送り、状況を注入してから時点を進める
        condition: '`[session-start]`、`MINDSTELLA_SESSION`・`MINDSTELLA_FLOW`・`TMUX_PANE` あり、入力 `{session_id: c1, source: compact}`、`resume` が取り込み待ち 1 件・`until_seq` 7 を返す'
        mock: '`post`・`resume`・`advance`・PID の引き方'
        expected: '0 を返し、`post` が `event: session_start` で、`resume` が `compact` で、`advance` が 7 でこの順に呼ばれ、`advance` より前に標準出力に `additionalContext` がある'
      - name: test_main_ordinary_session
        case: 正常
        summary: MINDSTELLA_SESSION が無ければ何もしない
        condition: '`MINDSTELLA_SESSION` 無し'
        mock: '`post`・`resume`・`advance`'
        expected: 0 を返し、どれも呼ばれず、標準出力が空
      - name: test_main_server_down
        case: 異常
        summary: 送れなくても 0
        condition: '`post` が `OSError`、出来事が `stop`'
        mock: '`post`'
        expected: 0 を返し、標準エラーに `[mindstella]` の行
      - name: test_main_when_resume_unavailable
        case: 正常
        summary: 状況を引けなければ状況なしで注入し、時点を進めない
        condition: '`resume` が `OSError`'
        mock: '`post`・`resume`・`advance`'
        expected: 0 を返し、`additionalContext` が起動の契機と `mindstella/startup` を持ち、`advance` が呼ばれない
      - name: test_main_when_changes_overflow
        case: 正常
        summary: 収まらない変更があれば時点を進めない
        condition: '`resume` が `changed_more` 5 を返す'
        mock: 同上
        expected: '`advance` が呼ばれず、`additionalContext` に `changes_since_read` の案内'
      - name: test_main_when_fork
        case: 正常
        summary: fork では注入しない
        condition: '入力 `{session_id: c1, source: fork}`'
        mock: 同上
        expected: '`post` だけが呼ばれ、標準出力が空'
    process: |-
      1. `MINDSTELLA_SESSION` が無ければ標準入力を読み捨てて 0 を返す
      2. 出来事を送る（`post`）。送れなければ標準エラーに 1 行書き、続ける
      3. SessionStart で `source` が `fork` でない場合
         - 再開の状況を引く（`resume`）。つながらない・200 でない・打ち切った場合、状況を `None` にして標準エラーに 1 行書く
         - 注入文を組み立て（`build_context`）、`hookSpecificOutput.additionalContext` に入れた JSON を標準出力に書いて `flush` する
         - 状況があり `changed_more`・`removed_more` がどちらも 0 の場合だけ、状況の `until_seq` で前回参照した時点を進める（`advance`。失敗したら標準エラーに 1 行書く）
      4. 0 を返す
  - name: post_event
    title: 出来事を送る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`POST /_admin/sessions/{session}/events` に JSON を送る（`POST_TIMEOUT_SEC` で打ち切る）'
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 常駐サーバーのポート
      - name: session_id
        type: str
        required: true
        passing: positional
        description: MindStella のセッションの ID
      - name: body
        type: dict
        required: true
        passing: positional
        description: 本文
    returns:
      type: None
      description: なし
    exceptions:
      - name: OSError
        condition: つながらない・打ち切った
    unit_tests:
      - name: test_post_event
        case: 正常
        summary: 経路と本文
        condition: テストが空きポートで HTTP のサーバーを立てる
        mock: なし
        expected: 経路が `/_admin/sessions/S-1/events`、本文が同じ JSON
  - name: request_resume
    title: 再開の状況を引く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 起動と再開
    scope: public
    summary: '`POST /_admin/sessions/{session}/resume` に `source` を送り、応答の JSON を返す（`POST_TIMEOUT_SEC` で打ち切る）'
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 常駐サーバーのポート
      - name: session_id
        type: str
        required: true
        passing: positional
        description: MindStella のセッションの ID
      - name: source
        type: str
        required: true
        passing: positional
        description: SessionStart の `source`
    returns:
      type: dict
      description: 『再開の状況』の応答
    exceptions:
      - name: OSError
        condition: つながらない・打ち切った・200 でない（`urllib.error.HTTPError` を含む）
    unit_tests:
      - name: test_request_resume
        case: 正常
        summary: 経路と本文
        condition: 'テストが空きポートで立てた HTTP のサーバーが `{trigger: resume}` を返す'
        mock: なし
        expected: '経路が `/_admin/sessions/S-1/resume`、本文が `{source: compact}`、戻り値が `{trigger: resume}`'
  - name: post_read_point
    title: 前回参照した時点を進める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 起動と再開
    scope: public
    summary: '`POST /_admin/sessions/{session}/read_point` に `until_seq` を送る（`POST_TIMEOUT_SEC` で打ち切る）'
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 常駐サーバーのポート
      - name: session_id
        type: str
        required: true
        passing: positional
        description: MindStella のセッションの ID
      - name: until_seq
        type: int
        required: true
        passing: positional
        description: 再開の状況の `until_seq`
    returns:
      type: None
      description: なし
    exceptions:
      - name: OSError
        condition: つながらない・打ち切った・200 でない
    unit_tests:
      - name: test_post_read_point
        case: 正常
        summary: 経路と本文
        condition: テストが空きポートで立てた HTTP のサーバー
        mock: なし
        expected: '経路が `/_admin/sessions/S-1/read_point`、本文が `{until_seq: 7}`'
  - name: build_context
    title: 注入文を組み立てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/session_hook.py
    usecase: 起動と再開
    scope: public
    summary: '`PROMPT_FILE` の雛形を、起動の契機・再開の状況・進め方の文書の場所で埋める'
    args:
      - name: source
        type: str
        required: true
        passing: positional
        description: SessionStart の `source`
      - name: status
        type: dict | None
        required: true
        passing: positional
        description: 再開の状況（引けなかったら `None`）
      - name: flow
        type: str | None
        required: true
        passing: positional
        description: '`MINDSTELLA_FLOW`'
    returns:
      type: str
      description: 注入文
    process: |-
      1. `source` が `startup` なら `$trigger` を `起動`、それ以外は `再開` にする
      2. `status` があれば、取り込み待ちの件数・変わった項目・消した項目・要見直し・進行中を `{ID} {要約}` の箇条書きにし、`{キー}_more` が 1 以上なら「ほか {n} 件」を続ける。`changed_more`・`removed_more` が 1 以上なら `changes_since_read` を呼ぶ案内を続ける。移し替えの報告があれば仮の値と移せなかった値を続ける。無ければ状況の段を空にする
      3. `flow` があれば進め方の文書の場所を入れる
      4. `PROMPT_FILE` を `string.Template.safe_substitute` で埋めて返す（次の候補・スキルの呼び方は持たない）
    unit_tests:
      - name: test_build_context
        case: 正常
        summary: 状況と案内を埋める
        condition: '`source: compact`、取り込み待ち 1・変わった D-1・要見直し D-1・進行中 T-1、`flow` あり'
        mock: なし
        expected: '`再開`・`1`・`D-1`・`T-1`・`flow` の値・`mindstella/startup` を含み、`/mindstella:` を含まない'
      - name: test_build_context_when_no_status
        case: 正常
        summary: 状況が無ければ契機と案内だけ
        condition: '`source: startup`、`status` が `None`、`flow` が `None`'
        mock: なし
        expected: '`起動` と `mindstella/startup` を含み、取り込み待ちの行を含まない'
notes:
  ログ: '`logging` を使わず、送れなかったときだけ標準エラーに `[mindstella] {理由}` の 1 行を `print` で書く（フックのスクリプトは単一ファイルのスクリプトの規約に従い、Claude Code がフックの標準エラーを記録する）'

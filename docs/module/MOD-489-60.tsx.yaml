id: MOD-489-60
title: プレビュー / board
lead: 状態ごとの列にカードを並べたボードと項目のカード。
components:
  - name: Board
    title: ボード
    kind: コンポーネント
    usecase: タスクをボードで見る
    summary: 状態ごとの列に `ItemCard` を並べたボード。`onSelectTag` を受けて各カードへ渡し、ボードのスクロール領域に `useListScroll` の ref を付ける。横にスクロールする領域は左右に余白を持ち、`tabIndex={0}`・`aria-label="ボード"` を付けてカードが 0 枚でもキーボードでフォーカス・スクロールできる
    container: frontend/src/shared/components/board.tsx
  - name: ItemCard
    title: 項目のカード
    kind: コンポーネント
    usecase: 項目を表で絞り込む
    summary: 部品設計『項目のカード.tsx』の props・イベント・状態を持つ。外枠は `div[data-card]`、タイトルは `button[data-id]` でその `::after` をカード全体へ広げ、`onSelectTag` を指定したときだけ部品『タグの並び』を `onSelect` つきで前面に並べる
    container: frontend/src/shared/components/board.tsx

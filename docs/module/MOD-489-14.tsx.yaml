id: MOD-489-14
title: プレビュー / thread-view
lead: 画面設計『スレッド.tsx』の要素と操作を描く。開いたら未読のスレッドを既読にする。
components:
  - name: ThreadView
    title: スレッド
    kind: 画面
    usecase: スレッドで話す
    summary: '画面設計『スレッド.tsx』の要素と操作を描く。開いたら未読のスレッドを既読にする。「状態を変える」は理由の入力の状態を持たず、押したら `reason: null` で状態の書き換えを呼ぶ（失敗の理由だけを状態に持ち、次に押したときに削除する）。クローズにできたら props の `onClosed` を呼び（一覧へ戻るのは使う側）、オープンに戻したらスレッドを再読み込みして「状態を変える」へフォーカスを戻す。返信を溜めたら、`ReplyForm` に渡した `formRef` の form で `focusAfterAdded` を呼び、`useFocusAfterAddTarget` が `submit` なら返信の入力の「レビューに追加」へ、`input` なら入力欄へフォーカスを移す'
    refs:
      - SCR-489-4#
    unit_tests:
      - name: test_thread_view
        case: 正常
        summary: 既読にする
        condition: 未読の TH-1 を開く
        mock: MSW
        expected: '`POST /api/threads/TH-1/seen` が 1 回呼ばれる'
      - name: test_thread_view_when_seen_failed
        case: 異常
        summary: 失敗した後に再呼び出ししない
        condition: '`POST /api/threads/TH-1/seen` が 500 で、再読み込みした TH-1 が未読のまま'
        mock: MSW
        expected: 開いている間は `POST /api/threads/TH-1/seen` が 1 回だけで、一覧へ戻って再度開くと 2 回目が呼ばれる
      - name: test_thread_view_when_voice
        case: 正常
        summary: 音声で返信を送信する
        condition: 'オープンの TH-1 の返信の入力でマイクを押して ✓。`POST /api/transcriptions` が `{text: x}` で、挙動が `send`'
        mock: MSW と `vi.stubGlobal`
        expected: '`POST /api/comments/send-now` が `{thread: TH-1, body: x}` で 1 回呼ばれ、スレッドが再読み込みされる'
      - name: test_thread_view_when_voice_reviewed
        case: 正常
        summary: 既定の挙動で返信をレビュー中に溜める
        condition: 'オープンの TH-1 の返信の入力でマイクを押して ✓。`POST /api/transcriptions` が `{text: x}` で、挙動が無い（`review`）'
        mock: MSW と `vi.stubGlobal`
        expected: '`POST /api/comments` が `{thread: TH-1, body: x}` で 1 回呼ばれ、入力欄が空で「文字起こしの結果をレビュー中に追加しました。」'
      - name: test_thread_view_when_focus_after_add
        case: 正常
        summary: 返信を溜めた後のフォーカスを移動先に従わせる
        condition: '`parametrize`: `useFocusAfterAddTarget` が `input` / `submit` で返信を溜める（201）'
        mock: MSW・`useFocusAfterAddTarget`
        expected: 返信の入力欄にフォーカス / 「レビューに追加」にフォーカス
      - name: test_thread_view_when_open_latest
        case: 正常
        summary: 開いたら最新の書き込みへ移る
        condition: 3 件の書き込みを持つ TH-1 を開く
        mock: MSW・要素の大きさの差し替え
        expected: 3 件目の書き込みにフォーカスがあり、並びの `scrollTop` がその書き込みの先頭の位置、1・2 件目にだけ `fold` が渡る
      - name: test_thread_view_when_title_collapsed
        case: 正常
        summary: スクロールしたらタイトルを 1 行にする
        condition: 並びの `scrollTop` を 0 → 120 → 0 に変えて `scroll` を送る
        mock: MSW・`requestAnimationFrame` の差し替え
        expected: タイトルの `data-collapsed` が 無い → ある → 無い
      - name: test_thread_view_when_open_post
        case: 正常
        summary: 書き込みの ID のリンクで開いたときは最新の書き込みへ移らない
        condition: "`requestPost('TH-1-2')` の後に 3 件の書き込みを持つ TH-1 を開き、2 件目へフォーカスする"
        mock: MSW
        expected: 2 コマの後も 2 件目にフォーカスがあり、並びの `scrollTop` が 0
      - name: test_thread_view_when_reveal_post_clears_request
        case: 正常
        summary: 開いたままのスレッドで書き込みへ移り終えたら記録を削除する
        condition: TH-1 を開いたまま `requestPost('TH-1-1')` と `revealPost('TH-1-1')` を呼ぶ
        mock: MSW・`scrollIntoView` の差し替え
        expected: "`takeRequestedPost('TH-1')` が `null`"
      - name: test_thread_view_when_close
        case: 正常
        summary: 理由を聞かずにクローズにし、一覧へ戻るよう使う側へ知らせる
        condition: オープンの TH-1 で「クローズにする」を押す
        mock: MSW
        expected: '理由の入力欄が出ず、`PATCH /api/threads/TH-1` が `{status: closed, reason: null}` で 1 回呼ばれ、`onClosed` が 1 回呼ばれる'
      - name: test_thread_view_when_reopen_focus
        case: 正常
        summary: オープンに戻した後、この画面に留まり「クローズにする」へフォーカスを戻す
        condition: クローズの TH-1 で「オープンに戻す」を押し、再描画より先に次のコマが来る
        mock: MSW と `vi.stubGlobal`
        expected: '`PATCH` が `{status: open, reason: null}` で呼ばれ、`onClosed` が呼ばれず、再描画した「クローズにする」にフォーカスがある'
      - name: test_thread_view_when_status_failed
        case: 異常
        summary: 状態を変えられなかったら理由を出し、画面に留まる
        condition: '`PATCH /api/threads/TH-1` が 409（`detail` あり）で「クローズにする」を押し、続けてもう一度押す'
        mock: MSW
        expected: '`role="alert"` に「クローズにできませんでした。{detail}」が出て `onClosed` が呼ばれず、もう一度押すと送信の前に理由が消える'
    container: frontend/src/features/comments/thread/thread-view.tsx
notes:
  単体テスト: 同じフォルダの `thread-view.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  修正の入力の音声入力: '書き換えている行を `{id, body, error}` で持ち、初めの値は `voiceEditingOf("thread")` の ID にする。書き換えている行に `useVoiceInput`（`key` は `review:{ID}`、向けた先は `{review: ID, thread, target}`、開く画面は `thread`）を使い、`ThreadPost` へ `editBody` と音声の props・イベントを渡す。返信の入力の `useVoiceInput` とは別の `key` で、同時に 1 つだけ録音する。単体テストに `test_thread_view_when_edit_voice` を追加する'
  書き込みの幅: 書き込みの並び（`ol`）は列を `grid-cols-1`（`repeat(1, minmax(0, 1fr))`。Tailwind の任意値は lint が禁じる） にし、並びが書き込みの中の幅の広い表・コードブロックに合わせて広がらないようにする（#619）。書き込みの `article` にも `min-w-0` を付ける（モジュール構成『thread-post』）。単体テストに `test_thread_view_when_wide_table` を追加し、並びがそのクラスを持つことを確かめる
  タイトルと最新の書き込み: '見出しのタイトルは `ThreadTitle`（モジュール構成『thread-title』）で描き、書き込みの並びのスクロール領域の `scrollTop` が 0 より大きい間だけ `collapsed` を真にする（`scroll` を `requestAnimationFrame` で 1 コマに 1 回読む。#372）。送信した書き込みのうち最後の 1 件以外に `fold` を渡す。スレッドを開いた直後（書き込みの ID を持たずに開いたとき。書き込みの ID のリンクは `requestPost`（`thread-ids.ts`）で開く書き込みを控え、画面は開いたときに `takeRequestedPost` で取り出して、控えがあれば最新の書き込みへ移さない）、描いた後に最新の送信した書き込みの先頭を並びの上端に合わせる位置（その位置が一番下を超えるときは一番下）へ `scrollTop` を設定し、その書き込みの `article`（`tabIndex={-1}`）へ `focus({preventScroll: true})` する（#374）'
  見出しのタイトルの幅と開いた直後の位置: 見出しの `h2` は grid の子のため `min-w-0` を付ける（付けないと、`line-clamp-2` のタイトルが 1 行の幅を最小の幅にして列が広がり、折り返さず右端を超える）。状態の札はタイトルの 1 行目と同じ高さに配置する（`items-start`）。開いた直後に最新の書き込みへ移すとき、最新の書き込みが最初の書き込みなら `scrollTop` を 0 にし、並びの一番上のままにする（見出しのタイトルを 2 行の省略で出す）

id: MOD-489-14
title: プレビュー / thread-view
lead: 画面設計『スレッド.tsx』の要素と操作を描く。開いたら未読のスレッドを既読にする。
components:
  - name: ThreadView
    title: スレッド
    kind: 画面
    usecase: スレッドで話す
    summary: 画面設計『スレッド.tsx』の要素と操作を描く。開いたら未読のスレッドを既読にする。返信を溜めたら、`ReplyForm` に渡した `formRef` の form で `focusAfterAdded` を呼び、`useFocusAfterAddTarget` が `submit` なら返信の入力の「レビューに追加」へ、`input` なら入力欄へフォーカスを移す
    refs:
      - SCR-489-4#
    unit_tests:
      - name: test_thread_view
        case: 正常
        summary: 既読にする
        condition: 未読の TH-1 を開く
        mock: MSW
        expected: '`POST /api/threads/TH-1/seen` が 1 回呼ばれる'
      - name: test_thread_view_when_seen_failed
        case: 異常
        summary: 失敗した後に再呼び出ししない
        condition: '`POST /api/threads/TH-1/seen` が 500 で、再読み込みした TH-1 が未読のまま'
        mock: MSW
        expected: 開いている間は `POST /api/threads/TH-1/seen` が 1 回だけで、一覧へ戻って再度開くと 2 回目が呼ばれる
      - name: test_thread_view_when_close
        case: 正常
        summary: クローズにする
        condition: 理由を書いて確定
        mock: MSW
        expected: '`PATCH /api/threads/TH-1` が `status: closed` と理由で呼ばれる'
      - name: test_thread_view_when_close_focus
        case: 正常
        summary: クローズにした後、「オープンに戻す」へフォーカスを戻す
        condition: 理由を入力して確定し、再描画より先に次のコマが来る
        mock: MSW と `vi.stubGlobal`
        expected: 再描画した「オープンに戻す」にフォーカスがある
      - name: test_thread_view_when_voice
        case: 正常
        summary: 音声で返信を送信する
        condition: 'オープンの TH-1 の返信の入力でマイクを押して ✓。`POST /api/transcriptions` が `{text: x}` で、挙動が `send`'
        mock: MSW と `vi.stubGlobal`
        expected: '`POST /api/comments/send-now` が `{thread: TH-1, body: x}` で 1 回呼ばれ、スレッドが再読み込みされる'
      - name: test_thread_view_when_voice_reviewed
        case: 正常
        summary: 既定の挙動で返信をレビュー中に溜める
        condition: 'オープンの TH-1 の返信の入力でマイクを押して ✓。`POST /api/transcriptions` が `{text: x}` で、挙動が無い（`review`）'
        mock: MSW と `vi.stubGlobal`
        expected: '`POST /api/comments` が `{thread: TH-1, body: x}` で 1 回呼ばれ、入力欄が空で「文字起こしの結果をレビュー中に追加しました。」'
      - name: test_thread_view_when_focus_after_add
        case: 正常
        summary: 返信を溜めた後のフォーカスを移動先に従わせる
        condition: '`parametrize`: `useFocusAfterAddTarget` が `input` / `submit` で返信を溜める（201）'
        mock: MSW・`useFocusAfterAddTarget`
        expected: 返信の入力欄にフォーカス / 「レビューに追加」にフォーカス
      - name: test_thread_view_when_open_latest
        case: 正常
        summary: 開いたら最新の書き込みへ移る
        condition: 3 件の書き込みを持つ TH-1 を開く
        mock: MSW・要素の大きさの差し替え
        expected: 3 件目の書き込みにフォーカスがあり、並びの `scrollTop` がその書き込みの先頭の位置、1・2 件目にだけ `fold` が渡る
      - name: test_thread_view_when_title_collapsed
        case: 正常
        summary: スクロールしたらタイトルを 1 行にする
        condition: 並びの `scrollTop` を 0 → 120 → 0 に変えて `scroll` を送る
        mock: MSW・`requestAnimationFrame` の差し替え
        expected: タイトルの `data-collapsed` が 無い → ある → 無い
    container: frontend/src/features/comments/thread/thread-view.tsx
notes:
  単体テスト: 同じフォルダの `thread-view.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  修正の入力の音声入力: '書き換えている行を `{id, body, error}` で持ち、初めの値は `voiceEditingOf("thread")` の ID にする。書き換えている行に `useVoiceInput`（`key` は `review:{ID}`、向けた先は `{review: ID, thread, target}`、開く画面は `thread`）を使い、`ThreadPost` へ `editBody` と音声の props・イベントを渡す。返信の入力の `useVoiceInput` とは別の `key` で、同時に 1 つだけ録音する。単体テストに `test_thread_view_when_edit_voice` を追加する'
  書き込みの幅: 書き込みの並び（`ol`）は列を `grid-cols-1`（`repeat(1, minmax(0, 1fr))`。Tailwind の任意値は lint が禁じる） にし、並びが書き込みの中の幅の広い表・コードブロックに合わせて広がらないようにする（#619）。書き込みの `article` にも `min-w-0` を付ける（モジュール構成『thread-post』）。単体テストに `test_thread_view_when_wide_table` を追加し、並びがそのクラスを持つことを確かめる
  タイトルと最新の書き込み: '見出しのタイトルは `ThreadTitle`（モジュール構成『thread-title』）で描き、書き込みの並びのスクロール領域の `scrollTop` が 0 より大きい間だけ `collapsed` を真にする（`scroll` を `requestAnimationFrame` で 1 コマに 1 回読む。#372）。送信した書き込みのうち最後の 1 件以外に `fold` を渡す。スレッドを開いた直後（書き込みの ID を持たずに開いたとき）、描いた後に最新の送信した書き込みの先頭を並びの上端に合わせる位置（その位置が一番下を超えるときは一番下）へ `scrollTop` を設定し、その書き込みの `article`（`tabIndex={-1}`）へ `focus({preventScroll: true})` する（#374）'

  - name: head_until_seq
    title: 先頭のまとまりの連番
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 前回からの差分を見る
    scope: public
    summary: 先頭（最新）のまとまりの `until_seq` を返す。開いた時点の連番に使う
    description: '`last_seq` ではなくこの値を使う。`commit_pending` は `until_seq` に `last_seq` をそのまま入れるため、`last_seq` を開いた時点にすると、開く前に書き換えて開いた後にまとめたまとまりが範囲から落ちる'
    args:
      - name: changes
        type: Changes
        required: true
        passing: positional
        description: まとまりの記録
    returns:
      type: int
      description: 先頭のまとまりの `until_seq`。まとまりが無ければ 0
    process: |-
      1. `sets` が空なら 0 を返す
      2. `sets[0]["until_seq"]` を返す
    unit_tests:
      - name: test_head_until_seq
        case: 正常
        summary: 先頭のまとまりの連番を返し、`last_seq` は返さない
        condition: '`parametrize`: まとまりが無い（`last_seq` 3）/ まとまり 2 つ（新しい順に `until_seq` 5・2、`last_seq` 7）'
        mock: なし
        expected: 0 / 5
  - name: load_item_history
    title: 項目の履歴の読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: '`history.yaml` を読んで項目の ID → 行の辞書を返す。無ければ空の辞書'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: dict[str, ItemHistory]
      description: 項目の ID → 履歴の行
    process: |-
      1. `records_root(root) / HISTORY_FILE` が無ければ空の辞書を返す
      2. 読んで `items` の辞書を返す。YAML として読めないか `items` が辞書でなければ `SchemaMismatchError`（`history.yaml: items`）を送信する
    exceptions:
      - name: SchemaMismatchError
        condition: '`history.yaml` が読めないか形式が違う'
        message: 'スキーマに合いません（`history.yaml: items`）'
    unit_tests:
      - name: test_load_item_history
        case: 正常
        summary: 行を読み、無ければ空
        condition: D-1 の行を持つ `history.yaml` と、`history.yaml` の無いワークスペース
        mock: なし
        expected: '前は `{D-1: 行}`、後は `{}`'
  - name: merge_item_history
    title: 項目と履歴の行の合わせ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の取得
    scope: public
    summary: 項目に `history.yaml` のその ID の行のキーを追加した新しい項目を返す（『記録の取得』と、項目の履歴を読む処理が使う）
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 種類の YAML の項目
      - name: rows
        type: dict[str, ItemHistory]
        required: true
        passing: positional
        description: '`load_item_history` の戻り値'
    returns:
      type: dict[str, Any]
      description: 行のキーを追加した項目。行が無ければ項目のまま
    process: 1. その ID の行があれば、項目のキーの後ろに行のキーを追加した新しい辞書を返す
    unit_tests:
      - name: test_merge_item_history
        case: 正常
        summary: 行のキーを追加する
        condition: D-1 の項目と、D-1 の `updated`・`history` を持つ行
        mock: なし
        expected: 項目のキーに続けて `updated`・`history` を持つ
  - name: flush_pending
    title: まだまとめていない変更の先のまとめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: 書いた元が違う変更を記録する前に、入っている変更をその書いた元のまとまりにする
    args:
      - name: changes
        type: Changes
        required: true
        passing: positional
        description: 今の記録
      - name: by
        type: Literal["ai", "external"]
        required: true
        passing: positional
        description: これから記録する変更の書いた元
      - name: at
        type: str
        required: true
        passing: positional
        description: まとめた日時
    returns:
      type: Changes
      description: 新しい記録
    process: |-
      1. `pending` が空か、`pending.by`（無ければ `ai`）が `by` と同じなら、そのまま返す
      2. `pending.by` が `ai` なら説明 `PENDING_AI_SUMMARY`、`external` なら説明 `EXTERNAL_SUMMARY`・`by: external` でまとめる（`commit_pending`）
    unit_tests:
      - name: test_flush_pending
        case: 正常
        summary: 書いた元が違えば先にまとめ、同じならまとめない
        condition: '`pending` が `by: external`・`changed: [D-1]` の記録を `ai` で / `external` で渡す'
        mock: なし
        expected: '`ai` では `sets` の先頭が `by: external`・説明「ほかのセッションの書き込み」で `pending` が空。`external` では記録が変わらない'
  - name: last_updated
    title: 項目の最後の更新
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: ワークスペースとMindStella のセッションの状態を取得する
    scope: public
    summary: '`load_item_history` の行の `updated` のうち最も新しいものを返す。行が無ければ `None`'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: str | None
      description: ISO 8601 の日時
    exceptions:
      - name: SchemaMismatchError
        condition: '`load_item_history` と同じ'
    unit_tests:
      - name: test_last_updated
        case: 正常
        summary: 最も新しい updated を返す
        condition: '`updated` が違う 2 行 / `history.yaml` が無い'
        mock: なし
        expected: 新しい方の日時 / `None`
  - name: unconfirm
    title: 確認済みの解除
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: 画面から保存した変更以外で項目を書き換えたときに、行の `confirmed` を除いた新しい行を返す（`stage_add`・`stage_update`・採用の切り替え・変更の検知の `record_diff` が、更新日時と編集した人を書き込む行に使う）
    args:
      - name: row
        type: ItemHistory
        required: true
        passing: positional
        description: 書き込む行
      - name: by
        type: Writer
        required: true
        passing: positional
        description: 編集した人
    returns:
      type: ItemHistory
      description: '`by` が `user` なら行のまま。それ以外は `confirmed` を除いた新しい行'
    process: |-
      1. `by` が `user` なら `row` をそのまま返す
      2. `confirmed` 以外のキーを持つ新しい行を返す
    unit_tests:
      - name: test_unconfirm
        case: 正常
        summary: AI・外部の書き換えは確認済みを除く
        condition: '`parametrize`: `by` が `ai` / `external`。`confirmed: true` と `updated` を持つ行'
        mock: なし
        expected: '`updated` だけを持つ行。渡した行は `confirmed` を持ったまま'
      - name: test_unconfirm_when_user
        case: 正常
        summary: 画面からの保存は確認済みを残す
        condition: '`by` が `user`。`confirmed: true` を持つ行'
        mock: なし
        expected: '`confirmed: true` を持つ行'
  - name: set_confirmed
    title: 確認済みの付け外し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 確認済みの付け外し
    scope: public
    side_effects: '`history.yaml` を置き換える（既にその状態なら書かない）'
    summary: インターフェース定義『確認済みの設定と解除』の受け付け。本文の `confirmed` を確かめ、`history.yaml` のその項目の行の `confirmed` だけを書き換える（鍵は呼ぶ側が取る）
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 項目の ID（パスの `{id}`）
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文
    returns:
      type: dict[str, Any]
      description: '`{"id": item_id, "confirmed": 書き換えた後の値}`'
    process: |-
      1. `data` の `confirmed` が真偽値でなければ `ArgumentError` を送信する
      2. `load_workspace(root)` と `find_item` で項目が記録にあることを確かめる
      3. `load_item_history(root)` のその ID の行から、確認済みにするときは `confirmed: true` を追加した行、解除するときは `confirmed` を除いた行を作る（行が無ければ `confirmed` だけの行。除いて空になった行は行ごと除く）
      4. 作った行が今の行と同じなら書かずに返す
      5. `_write_rows` で `history.yaml` を置き換える（種類ごとの YAML・`changes.yaml`・更新日時・連番・変更履歴は変えない）
    exceptions:
      - name: ArgumentError
        condition: '`confirmed` が無いか真偽値でない'
        message: 'confirmed: true か false で渡してください'
      - name: ItemNotFoundError
        condition: '`item_id` の項目が記録に無い'
        message: '項目がありません: {ID}'
      - name: SchemaMismatchError
        condition: 種類ごとの YAML がスキーマに合わないか、`history.yaml` が YAML として読めないか `items` が辞書でない
        message: '`load_workspace`・`load_item_history` と同じ'
      - name: WriteFailedError
        condition: '`history.yaml` の書き込みか置き換えで `OSError`'
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_set_confirmed
        case: 正常
        summary: 確認済みにして解除する
        condition: 'D-1 の行（`updated`・`seq`・`history` を持つ）を持つワークスペースで `{"confirmed": true}`、続けて `{"confirmed": false}`'
        mock: なし
        expected: '1 回目の後に行が `confirmed: true` を持ち、2 回目の後に持たない。行のほかのキーと `changes.yaml` が呼ぶ前と同じ'
      - name: test_set_confirmed_when_no_row
        case: 正常
        summary: 行が無い項目は confirmed だけの行を作り、解除で行ごと除く
        condition: D-1 の行を持たないワークスペースで `true`、続けて `false`
        mock: なし
        expected: '1 回目の後は行が `{confirmed: true}` だけ、2 回目の後は D-1 の行が無い'
      - name: test_set_confirmed_when_unchanged
        case: 正常
        summary: 既にその状態なら書かない
        condition: 'D-1 の行が `confirmed: true` を持ち、`{"confirmed": true}`'
        mock: なし
        expected: '`{"id": "D-1", "confirmed": true}` を返し、`history.yaml` の更新日時が呼ぶ前と同じ'
      - name: test_set_confirmed_when_invalid
        case: 異常
        summary: 真偽値でない confirmed は断る
        condition: '`parametrize`: `{"confirmed": "yes"}` / `{}`'
        mock: なし
        expected: '`ArgumentError`。`history.yaml` が呼ぶ前と同じ'
      - name: test_set_confirmed_when_item_not_found
        case: 異常
        summary: 記録に無い項目は断る
        condition: 'D-9 へ `{"confirmed": true}`'
        mock: なし
        expected: '`ItemNotFoundError`。`history.yaml` が呼ぶ前と同じ'
  - name: confirm_items
    title: 送信した項目の確認済み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: コメントを送信する
    scope: public
    side_effects: '`history.yaml` を置き換える（確認済みにする項目が無ければ書かない）'
    summary: コメントをまとめて送信する・すぐ送信するが、送信したコメントが向いた項目をまとめて確認済みにする（鍵は呼ぶ側が取る）
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
      - name: item_ids
        type: list[str]
        required: true
        passing: positional
        description: 送信したコメントが向いた項目の ID（重なりを含んでよい）
    returns:
      type: list[str]
      description: 確認済みにした項目の ID（既に確認済みの項目と記録に無い項目を除く。渡した順）
    process: |-
      1. `load_workspace(root)` にある ID だけを、重なりを除いて残す
      2. `load_item_history(root)` の行のうち、`confirmed` を持たない行に `confirmed: true` を追加する（行が無ければ `confirmed` だけの行を作る）
      3. 追加した行があれば `_write_rows` で `history.yaml` を置き換える
    exceptions:
      - name: WriteFailedError
        condition: '`history.yaml` の書き込みか置き換えで `OSError`'
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_confirm_items
        case: 正常
        summary: 未確認の項目だけを確認済みにする
        condition: 'D-1（未確認の行）・D-2（`confirmed: true`）・R-1（行が無い）を持つワークスペースで `["D-1", "D-2", "R-1", "D-1", "D-9"]`'
        mock: なし
        expected: '`["D-1", "R-1"]` を返し、D-1 の行が `confirmed: true` と元のキー、R-1 の行が `confirmed: true` だけを持つ'
      - name: test_confirm_items_when_nothing
        case: 正常
        summary: 確認済みにする項目が無ければ書かない
        condition: '`[]` と、確認済みの D-2 だけの `["D-2"]`'
        mock: なし
        expected: '`[]` を返し、`history.yaml` の更新日時が呼ぶ前と同じ'
  - name: _write_rows
    title: 履歴の行の書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 確認済みの付け外し
    scope: internal
    side_effects: '`history.yaml` を置き換える'
    summary: '`history.yaml` を `{items: rows}` で一時ファイルに書いてから `os.replace` で置き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
      - name: rows
        type: dict[str, ItemHistory]
        required: true
        passing: positional
        description: 書き込む行の全て
    returns:
      type: None
      description: なし
    process: |-
      1. `write_temp(records_root(root) / HISTORY_FILE, dump_yaml({"items": rows}))` で一時ファイルを書き、`os.replace` で置き換える
         - `OSError` が起きた場合、一時ファイルを削除して `write_failed` の `WriteFailedError` を送信する（前の `history.yaml` を残す）
    exceptions:
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError`
        message: '書き込めませんでした: {パス}（{理由}）'

  - name: commit_pending
    title: まとめる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: まだまとめていない変更を 1 つのまとまりにした新しい記録と、追加したまとまりを返す
    args:
      - name: changes
        type: Changes
        required: true
        passing: positional
        description: 今の記録
      - name: summary
        type: str
        required: true
        passing: positional
        description: 前後の空白を除いた説明
      - name: at
        type: str
        required: true
        passing: positional
        description: まとめた日時
      - name: by
        type: Literal["ai", "user", "external"]
        required: false
        default: '"ai"'
        passing: keyword
        description: まとまりの書いた元
    returns:
      type: tuple[Changes, ChangeSet | None]
      description: まだまとめていない変更が空なら `(changes, None)`
    process: |-
      1. `pending.added`・`pending.changed`・`pending.removed` が全て空なら `(changes, None)` を返す
      2. ID を `SET_ID_PREFIX` + （`sets` の連番の最大 + 1）にし、`until_seq` を `last_seq` ・`by` を `by` にしたまとまりを `sets` の先頭に置き、`pending` を空にする（`pending.by` も除く）

id: MOD-489-157
title: サーバー / 変更履歴 / history.py
lead: 項目の変更履歴の 1 回分を作って積み、書き換えのまとまり（`changes.yaml`）・AI が最後に読んだ時点・前回開いた日時（`.mindstella-opened`）を読み書きし、読んだ時点からの変更を組み立てる。『読み書きと検証』と『前回参照した時点』に依存し、書き込みは `save_change`・`save_batch` に任せる。
test_files:
  - tests/unit/scripts/test_history.py
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    schemas/
      changes.schema.json  changes.yaml（書き換えのまとまり）
    scripts/
      history.py           変更履歴の 1 回分・本文の差分・まとまり・前回開いた日時
  ```
data_models:
  - name: HistoryEntry
    title: 変更履歴の 1 回分
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    role: DTO
    summary: 項目の `history` の 1 要素（ER 図『ワークスペース』の共通のキー `history`）
    description: '`TypedDict`。YAML にそのまま書く。`body_diff` は本文が変わったときだけ持つ（`NotRequired`）。'
    properties:
      - name: seq
        type: int
        description: '`changes.yaml` の `last_seq` + 1'
      - name: at
        type: str
        description: 書き換えた日時（その書き換えの `updated` と同じ）
      - name: before
        type: dict[str, Any]
        description: 変わったキー → 書き換える前の値。前に無かったキーは `None`
      - name: body_diff
        type: list[BodyDiffHunk]
        description: 今の本文を前の本文へ戻す行の置き換えの並び（行の位置の小さい順）
      - name: by
        type: Literal["ai", "user", "external"]
        description: その回を書き換えた人（`NotRequired`。このキーを入れる前に積んだ回は持たない）
  - name: BodyDiffHunk
    title: 本文の差分の 1 か所
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    role: DTO
    summary: 書き換えた後の本文のある行からの並びを、前の行の並びに置き換える 1 か所
    description: '`TypedDict`。'
    properties:
      - name: line
        type: int
        description: 書き換えた後の本文の 1 始まりの行。`now` が空のときはその行の前に差し込む
      - name: now
        type: list[str]
        description: その行からの今の行（改行を含まない）
      - name: before
        type: list[str]
        description: 置き換える前の行
  - name: ChangeSet
    title: 書き換えのまとまり
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    role: DTO
    summary: '`changes.yaml` の `sets` の 1 要素'
    description: '`TypedDict`。'
    properties:
      - name: id
        type: str
        description: '`V-` + 連番'
      - name: at
        type: str
        description: まとめた日時
      - name: summary
        type: str
        description: 一言の説明
      - name: until_seq
        type: int
        description: まとめたときの `last_seq`
      - name: added
        type: list[str]
        description: 追加した項目の ID
      - name: changed
        type: list[str]
        description: 変えた項目の ID
      - name: removed
        type: NotRequired[list[RemovedItem]]
        description: 削除した項目。削除した項目が無いまとまりはキーを持たない
      - name: by
        type: NotRequired[Literal["ai", "user", "external"]]
        description: まとめた変更の書いた元（`commit` は `ai`、まとめて保存は `user`、変更の検知が自動でまとめた外部の変更は `external`）
  - name: Changes
    title: まとまりの記録
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    role: DTO
    summary: '`changes.yaml` の中身'
    description: '`TypedDict`。書き換える関数は受け取ったものを書き換えず、新しいものを返す。'
    properties:
      - name: last_seq
        type: int
        description: 最後に振った連番（変更履歴を積むとき・項目を追加するとき・項目を削除するとき・保持する回数が 0 で値を変えるときに進む）
      - name: sets
        type: list[ChangeSet]
        description: 新しい順のまとまり
      - name: pending
        type: Pending
        description: まだまとめていない変更。`added`・`changed`（項目の ID）と、任意の `removed`（`list[RemovedItem]`。無ければ削除した項目なし）を持つ `TypedDict`
      - name: read_seq
        type: NotRequired[int]
        description: AI が最後に読んだ時点。`load_changes` が『前回参照した時点』の `read_point.json` の値で入れる（`changes.yaml` の値は `read_point.json` が無いときだけ使う）。無ければキーが無い
  - name: RemovedItem
    title: 削除した項目の記録
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の削除と取り下げ
    role: DTO
    summary: '`changes.yaml` の `pending.removed`・`sets[].removed` の 1 要素'
    description: '`TypedDict`。'
    properties:
      - name: id
        type: str
        description: 削除した項目の ID
      - name: kind
        type: Kind
        description: 削除した項目の種類
      - name: title
        type: str
        description: 削除したときのタイトル
      - name: seq
        type: int
        description: 削除したときに振った連番
      - name: added_seq
        type: int
        description: 削除した項目が持っていた `added_seq`（持たなければ 0）
  - name: Pending
    title: まだまとめていない変更
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    role: DTO
    summary: '`changes.yaml` の `pending`'
    description: '`TypedDict`。'
    properties:
      - name: added
        type: list[str]
        description: 追加した項目の ID（書き換えた順）
      - name: changed
        type: list[str]
        description: 変えた項目の ID（書き換えた順。追加した項目は入れない）
      - name: removed
        type: NotRequired[list[RemovedItem]]
        description: 削除した項目（削除した順）。無ければ削除した項目なし
      - name: by
        type: NotRequired[Literal["ai", "external"]]
        description: 入っている変更の書いた元。無ければ `ai`
  - name: OpenedPoint
    title: 前回開いた時点
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 前回からの差分を見る
    role: DTO
    summary: '`OPENED_FILE` の中身で、`POST /api/opened` の `previous`・`opened` の形式'
    description: '`TypedDict`。'
    properties:
      - name: at
        type: str
        description: 開いた日時（UTC のタイムゾーン付き ISO 8601）。範囲の始まりの表示にだけ使う
      - name: seq
        type: int
        description: 開いた時点の連番（`head_until_seq`）。0 以上
  - name: ItemHistory
    title: 項目の履歴の行
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    role: DTO
    summary: '`history.yaml` の `items` の 1 行（ER 図『ワークスペース』の `history.yaml`）'
    description: '`TypedDict`。`history`・`history_dropped_seq`・`confirmed` は持つときだけ（`NotRequired`）。確認済みの付け外しが作った行は `confirmed` だけを持つ。'
    properties:
      - name: created
        type: str
        description: 作成日時
      - name: updated
        type: str
        description: 更新日時
      - name: updated_by
        type: Literal["ai", "user", "external"]
        description: 編集した人
      - name: seq
        type: int
        description: 最後に振った連番
      - name: added_seq
        type: int
        description: 追加したときの連番
      - name: history
        type: list[HistoryEntry]
        description: 変更履歴（新しい順）
      - name: history_dropped_seq
        type: int
        description: 削除した変更履歴の連番の最大
      - name: confirmed
        type: bool
        description: 確認済み。`true` のときだけ持ち、解除するとキーを削除する
constants:
  - name: CHANGES_FILE
    title: まとまりのファイル名
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 共通
    summary: 書き換えのまとまりを持つファイルの名前（`records_root(root)` の下）
    value: '"changes.yaml"'
  - name: CHANGES_SCHEMA
    title: まとまりのスキーマ
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 共通
    summary: '`changes.yaml` を検証するスキーマのファイル名（`SCHEMA_DIR` の下）'
    value: '"changes.schema.json"'
  - name: OPENED_FILE
    title: 前回開いた日時のファイル名
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 前回からの差分を見る
    summary: プレビューを最後に開いた日時（1 行目）と連番（2 行目）を持つファイルの名前（`records_root(root)` の下）
    value: '".mindstella-opened"'
  - name: DEFAULT_HISTORY_LIMIT
    title: 保持する回数の既定
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    summary: '`config.yaml` に `history_limit` が無いときの回数'
    value: '5'
  - name: SET_ID_PREFIX
    title: まとまりの ID の頭
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    summary: まとまりの ID の頭の文字
    value: '"V-"'
  - name: SUMMARY_MAX_LENGTH
    title: まとまりの説明の上限
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    summary: '`commit` の `summary` の前後の空白を除いた文字数の上限（インターフェース定義『書き換えのまとまり』）'
    value: '200'
  - name: HISTORY_FILE
    title: 項目の履歴のファイル
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    summary: 記録のフォルダの中の、項目の履歴のファイル名
    value: history.yaml
  - name: EXTERNAL_SUMMARY
    title: 外部の変更のまとまりの説明
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    summary: 変更の検知が外部の変更をまとめるときの説明
    value: ほかのセッションの書き込み
  - name: PENDING_AI_SUMMARY
    title: まとめる前の AI の書き換えの説明
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    summary: 書いた元が違う変更の前に、AI のまだまとめていない変更をまとめるときの説明（まとめて保存と同じ）
    value: まとめる前の AI の書き換え
functions:
  - name: load_changes
    title: まとまりを読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: '`changes.yaml` を読んでスキーマと突き合わせる。無ければ空の記録を返す'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: Changes
      description: '無ければ `{last_seq: 0, sets: [], pending: {added: [], changed: []}}`'
    process: |-
      1. `records_root(root) / CHANGES_FILE` が無ければ空の記録にする
      2. あれば読み込み（モジュール構成『読み書きと検証』の `load_yaml_text`）、`CHANGES_SCHEMA` と突き合わせる
         - YAML として読めないか合わない場合、`changes.yaml: {キーのパス}: {理由}` の行を持った `SchemaMismatchError` を送信する
      3. `read_seq` を『前回参照した時点』の値にする（`load_read_seq`）
         - `read_point.json` が無く、`changes.yaml` が前のバージョンの `read_seq` を持つ場合、その値を使う
         - どちらも無ければ `read_seq` を持たない
      4. 記録を返す
    exceptions:
      - name: SchemaMismatchError
        condition: '`changes.yaml` が YAML として読めないかスキーマに合わない'
        message: スキーマに合いません（`lines` に問題ごとの行）
    unit_tests:
      - name: test_load_changes_when_missing
        case: 正常
        summary: ファイルが無ければ空の記録
        condition: '`changes.yaml` を持たないワークスペース'
        mock: なし
        expected: '`last_seq` が 0、`sets`・`pending.added`・`pending.changed` が空'
      - name: test_load_changes_when_schema_mismatch
        case: 異常
        summary: 崩れたファイルは読まない
        condition: '`pending` から `added` を削除した `changes.yaml`'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `changes.yaml: pending` で始まる行）'
        exception: スキーマに合わない
      - name: test_load_changes_reads_read_point
        case: 正常
        summary: 前回参照した時点を状態のフォルダから読む
        condition: '`parametrize`: `read_point.json` が 4・`changes.yaml` の `read_seq` が 2 / `read_point.json` が無く `changes.yaml` の `read_seq` が 2 / どちらも無い'
        mock: なし（状態のフォルダは `tmp_path`）
        expected: '`read_seq` が順に 4 / 2 / キーが無い'
  - name: history_limit
    title: 保持する回数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: 設定の `history_limit` を返す。無ければ `DEFAULT_HISTORY_LIMIT`
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: int
      description: 0 以上の回数（値の範囲はスキーマが確かめる）
    unit_tests:
      - name: test_history_limit
        case: 正常
        summary: 設定が無ければ既定の 5
        condition: '`parametrize`: `history_limit` が無い / 0 / 3'
        mock: なし
        expected: 5 / 0 / 3
  - name: diff_body
    title: 本文の差分を作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: 書き換えた後の本文を前の本文へ戻す行の置き換えの並びを作る
    args:
      - name: before
        type: str
        required: true
        passing: positional
        description: 書き換える前の本文
      - name: after
        type: str
        required: true
        passing: positional
        description: 書き換えた後の本文
    returns:
      type: list[BodyDiffHunk]
      description: 行の位置の小さい順。同じ本文なら空
    process: |-
      1. 両方を `splitlines()` で行に分ける
      2. `difflib.SequenceMatcher(None, after_lines, before_lines).get_opcodes()` の `equal` 以外を、`{line: i1 + 1, now: after_lines[i1:i2], before: before_lines[j1:j2]}` にする（`autojunk` は既定の真のまま。空行のように何度も現れる行を突き合わせの目印に使わず、空行の多い本文を大きく書き換えても書き込みのロックを長く握らない。置き換えの塊が粗くなっても、当てれば前の本文に戻る）
    unit_tests:
      - name: test_diff_body
        case: 正常
        summary: 変えた行だけを持ち、当てると前の本文になる
        condition: 3 行の本文の 2 行目を書き換え、4 行目を追加した後の本文
        mock: なし
        expected: 1 行目・3 行目を含まず、`apply_body_diff(after, 戻り値)` が前の本文の行と等しい
      - name: test_diff_body_when_large_rewrite
        case: 正常
        summary: 空行を挟む大きな本文を丸ごと書き換えても速く、戻せる
        condition: 3 行に 1 行が空行の 5000 行の Markdown の、空行でない行を全て書き換えた前後（空行の並びは同じ）
        mock: なし
        expected: 1 秒以内に戻り、`apply_body_diff(after, 戻り値)` が前の本文と等しい
  - name: apply_body_diff
    title: 本文の差分を当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: ワークスペースの点検
    scope: public
    summary: 本文に差分を後ろの箇所から当てて前の本文にする。`now` が当てる先の行と合わなければ `None`
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 当てる先の本文
      - name: hunks
        type: list[BodyDiffHunk]
        required: true
        passing: positional
        description: '`diff_body` の戻り値'
    returns:
      type: str | None
      description: 前の本文（行を `\n` でつなぎ、末尾に `\n`。空なら空文字列）。合わないときは `None`
    unit_tests:
      - name: test_apply_body_diff_when_text_rewritten
        case: 正常
        summary: 手で書き換えた本文には当たらない
        condition: '`diff_body` で作った差分を、全ての行を変えた本文に当てる'
        mock: なし
        expected: '`None`'
  - name: make_entry
    title: 変更履歴の 1 回分を作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: 書き換える前と後の項目と本文を比べ、変わったものがあれば 1 回分を作る
    args:
      - name: before_item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 書き換える前の項目
      - name: after_item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 書き換えた後の項目
      - name: before_body
        type: str | None
        required: true
        passing: keyword
        description: 前の本文（無ければ `None`）
      - name: after_body
        type: str | None
        required: true
        passing: keyword
        description: 後の本文（本文を変えないときは `before_body` と同じ）
      - name: seq
        type: int
        required: true
        passing: keyword
        description: 積むときの連番
      - name: at
        type: str
        required: true
        passing: keyword
        description: 書き換えた日時
      - name: by
        type: Literal["ai", "user", "external"]
        required: true
        passing: keyword
        description: 書き換えた人（MCP のツールは `ai`、変更の検知は書いた元）
    returns:
      type: HistoryEntry | None
      description: 変わったものが無ければ `None`
    process: |-
      1. `updated`・`updated_by`・`history`・`history_dropped_seq`・`body` を除いたキーの和を取り、値が違うキーを `before` にする（前に無いキーは `None`）
      2. 前の本文があり後の本文と違う場合、`body_diff` を作る（`diff_body`）。前に本文が無い場合は `before.body` を `None` にする。前の `body` と後の `body` がどちらもあり名前が違う（資料の本文の形式を替えた）場合は `before.body` を前の名前にする
      3. `before` も `body_diff` も無ければ `None` を返す
      4. `seq`・`at`・`by`・`before`（とあれば `body_diff`）を持つ 1 回分を返す
    unit_tests:
      - name: test_make_entry
        case: 正常
        summary: 変わった・消えた・追加したキーを前の値で持つ
        condition: '`answer` を追加し、`status` を変え、`lead` を削除し、`updated` を変えた項目。本文は同じ'
        mock: なし
        expected: '`before` が `{answer: None, status: 未決定, lead: l}` で `updated` を含まず、`body_diff` が無い'
      - name: test_make_entry_when_nothing_changed
        case: 正常
        summary: 変わったものが無ければ作らない
        condition: '`updated` だけが違う項目と同じ本文'
        mock: なし
        expected: '`None`'
      - name: test_make_entry_records_editor
        case: 正常
        summary: 書き換えた人を持ち、updated_by の違いだけでは作らない
        condition: '`parametrize`: `answer` を変え `by="ai"` / `updated_by` だけが `user` → `ai` に変わった項目で `by="ai"`'
        mock: なし
        expected: 前者は `by` が `ai` で `before` に `answer` だけ。後者は `None`
      - name: test_make_entry_when_body_format_changed
        case: 正常
        summary: 本文の形式を替えた回は前の `body` を `before` に入れる
        condition: '前の項目 `body: A-1.mark.md`・本文 `a\n`、後の項目 `body: A-1.html`・本文 `<p>a</p>\n`'
        expected: '`before` が `{body: A-1.mark.md}` で、`body_diff` を後の本文に当てると `a\n`'
        mock: なし
  - name: stack_history
    title: 変更履歴を積む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: 項目の `history` の先頭に 1 回分を追加し、保持する回数を超えた古いものを削除して、削除した回の最大の `seq` を `history_dropped_seq` に残した新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 書き換えた後の項目の履歴の行（`ItemHistory`）
      - name: entry
        type: HistoryEntry | None
        required: true
        passing: positional
        description: '`make_entry` の戻り値'
      - name: limit
        type: int
        required: true
        passing: positional
        description: '`history_limit` の戻り値'
      - name: read_seq
        type: int | None
        required: true
        passing: keyword
        description: '前回参照した時点（`load_changes` が入れた `read_seq`。『前回参照した時点』の値で、無ければ `changes.yaml` の前のバージョンの値。どちらも無ければ `None`）'
    returns:
      type: dict[str, Any]
      description: 新しい履歴の行。`limit` が 0 なら `history` のキーを持たない
    process: |-
      1. `limit` が 0 の場合、`history`・`history_dropped_seq` を除いた行を返す
      2. `entry` が `None` の場合、行をそのまま返す
      3. `[entry] + 今の history` のうち、先頭 `limit` 個と、`read_seq` が `None` でなければ `seq` が `read_seq` より大きいものを、並びを保って `history` にする
      4. 残り（削除した要素）があれば、その最大の `seq` と今の `history_dropped_seq` の大きい方を `history_dropped_seq` にする
    unit_tests:
      - name: test_stack_history
        case: 正常
        summary: 保持する回数を超えた古いものを削除し、削除した回の seq を残す
        condition: '`history` を seq 5 の 1 回分持ち `history_dropped_seq` が 3 の項目に、seq 9 の新しい 1 回分、`limit` 1'
        mock: なし
        expected: '`history` が seq 9 の 1 回分だけで、`history_dropped_seq` が 5'
      - name: test_stack_history_when_not_dropped
        case: 正常
        summary: 消さなければ削除した回の seq を付けない
        condition: '`history` を持たない項目に新しい 1 回分、`limit` 1'
        mock: なし
        expected: '`history` が新しい 1 回分で、`history_dropped_seq` のキーが無い'
      - name: test_stack_history_when_limit_zero
        case: 正常
        summary: 回数が 0 なら変更履歴を削除する
        condition: '`history` と `history_dropped_seq` を持つ項目、`limit` 0'
        mock: なし
        expected: 戻り値が `history`・`history_dropped_seq` のキーを持たない
      - name: test_stack_history_keeps_unread
        case: 正常
        summary: 読んでいない回は保持する回数を超えても残す
        condition: '`history` を seq 4・seq 2 の 2 回分持つ項目に seq 6 の新しい 1 回分、`limit` 1、`read_seq` 3'
        mock: なし
        expected: '`history` が seq 6・seq 4 の 2 回分で、`history_dropped_seq` が 2'
  - name: note_pending

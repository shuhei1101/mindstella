  - name: values_at_read
    title: 読んだ時点の値を組み立てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 前回読んだ時点からの変更を読む
    scope: public
    summary: 項目の `history` から、読んだ時点より後に変わったキーの読んだ時点の値と、今の本文を読んだ時点の本文へ戻す差分を組み立てる
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 今の項目の履歴の行（`ItemHistory`）。読んだ時点の値は項目と比べるため、呼ぶ側は項目と行を合わせた辞書を渡す
      - name: body
        type: str | None
        required: true
        passing: positional
        description: 今の本文（無ければ `None`）
      - name: read_seq
        type: int
        required: true
        passing: positional
        description: AI が最後に読んだ時点
    returns:
      type: tuple[dict[str, Any], list[BodyDiffHunk] | None]
      description: 変わったキー → 読んだ時点の値（今と同じ値のキーは除く）と、本文の差分（本文が変わっていなければ `None`）
    process: |-
      1. `history` のうち `seq` が `read_seq` より大きい回を取り出す（新しい順）
      2. 新しい回から順に `before` を重ね、同じキーは古い回の値で上書きする（最も古い回の値が読んだ時点の値になる）。今の項目と同じ値になったキーを除く
      3. 本文があり、取り出した回が `body_diff` を持つ場合、今の本文に新しい回から順に当てて読んだ時点の本文を作り（`apply_body_diff`）、今の本文と違えば差分を作る（`diff_body`）
    unit_tests:
      - name: test_values_at_read
        case: 正常
        summary: 読んだ時点の値と本文の差分を組み立てる
        condition: '`title` を `質問 A` → `質問 B`（seq 4）→ `質問 C` と本文の 2 行目（seq 5）と変えた項目と今の本文、`read_seq` 3'
        mock: なし
        expected: '変わったキーが `{title: 質問 A}`、差分を今の本文に当てると読んだ時点の本文になる'
      - name: test_values_at_read_when_changed_back
        case: 正常
        summary: 元の値に戻したキーは返さない
        condition: '`answer` を `a` → `b`（seq 4）→ `a`（seq 5）と戻した項目、`read_seq` 3'
        mock: なし
        expected: 変わったキーが空で、差分が `None`
  - name: changes_since
    title: 読んだ時点からの変更を並べる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 前回読んだ時点からの変更を読む
    scope: public
    summary: AI が最後に読んだ時点より後に追加した・変えた項目を、`changes_since_read` の結果の形式に並べる
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 読んだワークスペース
      - name: changes
        type: Changes
        required: true
        passing: positional
        description: 今の記録
    returns:
      type: dict[str, Any]
      description: '`{had_read_point, read_seq, until_seq, added, changed, removed}`（インターフェース定義『前回読んだ時点からの変更』のレスポンス）'
    process: |-
      1. `read_seq` が無ければ `{had_read_point: False, read_seq: None, until_seq: last_seq, added: [], changed: [], removed: []}` を返す
      2. 種類の順（`KINDS`）、項目の並びの順に、項目と `history.yaml` のその ID の行を合わせて見る（`load_item_history`）
         - `added_seq` が `read_seq` より大きい項目は `added` に `{id, kind, title, updated_by}` で追加する（`updated_by` を持たなければ `None`）
         - それ以外で `seq` が `read_seq` より大きい項目は、保持する回数が 0 なら `before`・`body_diff` を `None`、`by` を空にして `changed` に追加する。それ以外は本文を読み（`read_body`）、読んだ時点の値を組み立てて（`values_at_read`）、変わったキーか本文の差分があれば `changed` に追加する
         - `changed` の要素は `updated_by`（今の値。無ければ `None`）と、`by`（`seq` が `read_seq` より大きい変更履歴の回の `by` を重なりなく `user`・`external`・`ai` の順で並べたもの。`by` を持たない回は数えない）を持つ
      3. 削除した項目の記録（`removed_items`）のうち、`seq` が `read_seq` より大きく `added_seq` が `read_seq` 以下のものを `{id, kind, title}` にして `removed` に並べる
      4. `until_seq` を `last_seq` にして返す
    unit_tests:
      - name: test_changes_since
        case: 正常
        summary: 読んだ時点より後の追加と変更を分けて返す
        condition: '`read_seq` 3、D-1（`added_seq` 1、`seq` 5、seq 5 の `history` で `answer` を変えた）、T-1（`added_seq` 4、`seq` 4）、D-2（`seq` 2）'
        mock: なし
        expected: '`added` が T-1、`changed` が D-1（`before` に `answer`）だけで D-2 を含まない。`had_read_point` が真で `until_seq` が `last_seq`'
      - name: test_changes_since_when_no_read_point
        case: 正常
        summary: 読んだ時点が無ければ差分を返さない
        condition: '`read_seq` を持たない記録と、変更履歴を持つ D-1'
        mock: なし
        expected: '`had_read_point` が偽、`read_seq` が `None`、`added`・`changed`・`removed` が空'
      - name: test_changes_since_when_limit_zero
        case: 正常
        summary: 保持する回数が 0 なら前の値を組み立てない
        condition: '`history_limit` 0、`read_seq` 3、`seq` 5 で `history` を持たない D-1'
        mock: なし
        expected: '`changed` が D-1 で `before`・`body_diff` が `None`'
      - name: test_changes_since_reports_editors
        case: 正常
        summary: 読んだ後に利用者と AI が修正した項目で、両方を返す
        condition: '`read_seq` 3。D-1 が `updated_by: ai` で、`history` に `seq` 5（`by: ai`）・4（`by: user`）・2（`by: user`）の回を持つ'
        mock: なし
        expected: '`changed` の D-1 が `updated_by: ai`、`by: [user, ai]`（`seq` 2 の回は数えない）'
      - name: test_changes_since_when_removed
        case: 正常
        summary: 読んだ時点に有って後で削除した項目だけを返す
        condition: '`read_seq` 3。`pending.removed` に N-2（`added_seq` 2・`seq` 4）・N-3（`added_seq` 5・`seq` 6）、`sets[0].removed` に N-1（`added_seq` 1・`seq` 2）'
        mock: なし
        expected: '`removed` が N-2 の 1 件（N-1 は読む前に削除した、N-3 は読んだ後に追加して削除した）'
  - name: note_removed
    title: 削除した項目を記録する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の削除と取り下げ
    scope: public
    summary: '`pending.added`・`pending.changed` から ID を除き、`pending.removed` の末尾に削除した項目を追加した新しい記録を返す（連番は進めない。進めるのは `advance_seq`）'
    args:

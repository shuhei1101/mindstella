        condition: '`pending.changed` が `[D-1, D-2]` の記録に D-1 の記録（`seq` 5・`added_seq` 1）'
        mock: なし
        expected: '`pending.changed` が `[D-2]`、`pending.removed` が D-1 の 1 件。渡した記録はそのまま'
      - name: test_note_removed_when_added_since_commit
        case: 正常
        summary: まとめる前に追加した項目も removed に記録する
        condition: '`pending.added` が `[N-1]` の記録に N-1 の記録'
        mock: なし
        expected: '`pending.added` が空、`pending.removed` が N-1 の 1 件'
  - name: removed_items
    title: 削除した項目の記録を並べる

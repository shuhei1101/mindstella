        mock: なし
        expected: まとまりの `id` が `V-2`・`until_seq` が 3・`added` が `[T-1]`・`changed` が `[D-1]`。新しい記録の `sets` の先頭が V-2 で `pending` が空
      - name: test_commit_pending_when_empty
        case: 正常
        summary: まとめるものが無ければ何もしない
        condition: '`pending` が空'
        mock: なし
        expected: まとまりが `None` で、記録が渡したものと等しい
      - name: test_commit_pending_when_only_removed
        case: 正常
        summary: 削除した項目だけでもまとまりにする
        condition: '`pending` が `added: []`・`changed: []`・`removed: [N-2 の記録]`'
        mock: なし
        expected: まとまりの `removed` が N-2 の 1 件、新しい記録の `pending` の `added`・`changed`・`removed` が空
  - name: pending_view
    title: まだまとめていない変更を並べる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 記録の追加と更新
    scope: public
    summary: '`pending` の項目を、タイトルと変えたキーつきで返す（`pending` のツールの結果の形式）'
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 読んだワークスペース
      - name: changes
        type: Changes
        required: true
        passing: positional
        description: 今の記録
    returns:
      type: dict[str, Any]
      description: '`{added: [{id, title}], changed: [{id, title, keys}], removed: [{id, kind, title}]}`'
    process: |-
      1. `added`・`changed` の ID ごとに項目を引く（`find_item`）
      2. `changed` の項目は、`history` のうち `seq` が `sets` の先頭の `until_seq`（無ければ 0）より大きいものの `before` のキーと、`body_diff` を持つときの `body_markdown` を、重なりを除いて出てきた順に並べる
      3. `pending.removed`（無ければ空）を `{id, kind, title}` にして `removed` に並べる
    unit_tests:
      - name: test_pending_view
        case: 正常
        summary: 変えたキーをまとめて返す
        condition: 'D-1 が `before: {answer, status}` と `body_diff` を持つ 2 回分の `history`（どちらも最後のまとまりより後）、T-1 が `added`'
        mock: なし
        expected: '`added` が T-1 とそのタイトル、`changed` が D-1 で `keys` が `answer`・`status`・`body_markdown`'
      - name: test_pending_view_when_removed
        case: 正常
        summary: 削除した項目を removed で返す
        condition: '`pending.removed` に N-2（`kind: note`・`title: 重複したメモ`）、`pending.added`・`pending.changed` が空'
        mock: なし
        expected: '`removed` が `[{id: N-2, kind: note, title: 重複したメモ}]`、`added`・`changed` が空'
  - name: touch_opened
    title: 前回開いた日時を書き換える
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/history.py
    usecase: 前回からの差分を見る
    scope: public
    side_effects: ワークスペースの `OPENED_FILE` を置き換える
    summary: '`OPENED_FILE` の前回開いた時点を読んでから今の日時と連番に書き換え、前の時点を返す'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
      - name: opened
        type: OpenedPoint
        required: true
        passing: positional
        description: 今の時点（今の日時と `head_until_seq`）
    returns:
      type: OpenedPoint | None
      description: 前の時点。無い・1 行目が日時として読めない・2 行目が無い（前のバージョンの形式）・2 行目が 0 以上の整数として読めなければ `None`
    process: |-
      1. `records_root(root) / OPENED_FILE` を読む（無ければ `None`。1 行目を `datetime.fromisoformat` で、2 行目を 0 以上の整数として読めなければ `None`）
      2. 一時ファイルに `{opened.at}\n{opened.seq}\n` を書いて `os.replace` で置き換える
         - `OSError` が起きた場合、一時ファイルを削除して `WriteFailedError` を送信する
    exceptions:
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError`
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_touch_opened
        case: 正常
        summary: 前の時点を返して書き換える
        condition: 無い状態で 1 回、別の日時と連番でもう 1 回呼ぶ
        mock: なし
        expected: 1 回目が `None`、2 回目が 1 回目の `opened`。ファイルの 1 行目が 2 回目の `at`、2 行目が 2 回目の `seq`
      - name: test_touch_opened_when_previous_unreadable
        case: 正常
        summary: 連番を読めない前の時点は無いものとして返し、今の構造で書き換える
        condition: '`parametrize`: 1 行の日時だけ（前のバージョンの形式）/ 2 行目が `x` / 2 行目が `-1` / 1 行目が日時でない'
        mock: なし
        expected: '`None` を返し、ファイルが渡した `opened` の 2 行になる'

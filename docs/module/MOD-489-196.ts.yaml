        condition: '`parametrize`: `{at: "2026-10-04T13:05:00+00:00", seq: 3}` / `{at: "...", seq: 0}` / 日時の文字列 / `{at: "..."}` / `{at: "...", seq: -1}` / `{at: "...", seq: 1.5}` / `null`'
        mock: なし
        expected: 真 / 真 / 偽 / 偽 / 偽 / 偽 / 偽
  - name: editApi
    title: 保存待ちの編集の API
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: 画面で項目を編集して保存する
    scope: public
    summary: 保存待ちの編集の読み取り・追加・取り消し・まとめて保存を `callApi` に当てた関数の束を返す
    args:
      - name: fetchFn
        type: typeof fetch
        default: window.fetch
        passing: injected
        description: 要求を送る関数
    returns:
      type: '{read, add, remove, save}'
      description: '`read()` は `GET api/edits`（成功の本文は `{items: PendingEdit[], count}`）、`add(input)` は `POST api/edits`（`input` は `{op, target?, key?, value?, map?}`。成功の本文は `{id, target, count}`）、`remove(id)` は `DELETE api/edits/{id}`（成功の本文は `{removed, count}`）、`save()` は `POST api/edits/save`（本文を送らない。成功の本文は `{set, at, added, changed, removed, settings}`）を呼ぶ。どれも `ApiResult` を返す'
    process: 1. それぞれのメソッド・パス・本文で `callApi` を呼ぶ関数を束ねて返す（`id` は `encodeURIComponent` でパスに入れる）
    unit_tests:
      - name: test_edit_api
        case: 正常
        summary: 各呼び出しのメソッド・パス・本文
        condition: "`parametrize`: `read()` / `add({op: 'set', target: 'D-1', key: 'answer', value: 'a'})` / `remove('E-1')` / `save()`"
        mock: '`fetchFn`'
        expected: '`GET api/edits` / `POST api/edits`（本文 `{"op":"set","target":"D-1","key":"answer","value":"a"}`）/ `DELETE api/edits/E-1` / `POST api/edits/save`（本文なし）'
      - name: test_edit_api_when_blocked
        case: 異常
        summary: 書き込めない編集を結果に持つ
        condition: '`save()` に 409・`{"detail": "…", "blocked": [{"id": "E-1", "reason": "changed", "detail": "…", "refs": []}]}` を返す'
        mock: '`fetchFn`'
        expected: '`{ok: false, status: 409, blocked: [E-1]}`'
  - name: voiceApi
    title: 音声入力の API
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: 音声でコメントする
    scope: public
    summary: 文字起こしの可否・音声の文字起こし・すぐ送るの 3 つの呼び出しを返す
    args:
      - name: fetchFn
        type: typeof fetch
        required: false
        default: window.fetch
        passing: injected
        description: 要求を送る関数
    returns:
      type: '{status, transcribe, sendNow}'
      description: '`status()` は `GET api/transcription`（`ApiResult<TranscriptionStatus>`）、`transcribe(blob)` は `POST api/transcriptions` に `Blob` をそのまま本文にし `Content-Type` を `blob.type` にして送る（`ApiResult<{text}>`。503 の本文の `reason` を `detail` と一緒に `data` でなく `reason` に返す）、`sendNow(input)` は `POST api/comments/send-now`（`input` は `{target, loc, body}` か `{thread, body}`。`ApiResult<{sent, thread, post, entered}>`）'
    process: |-
      1. `status`・`sendNow` は `callApi` を呼ぶ
      2. `transcribe` は `fetchFn` を直接呼び、結果を `callApi` と同じ形にする（届かなければ `status`・`detail` が `null`）。503 なら本文の `reason` を足す
    unit_tests:
      - name: test_voice_api
        case: 正常
        summary: 各呼び出しのメソッドとパスと本文
        condition: '`parametrize`: `status()` / `transcribe(new Blob([abc], {type: audio/webm}))` / `sendNow({thread: TH-1, body: x})`'
        mock: '`fetchFn`'
        expected: '`GET api/transcription` / `POST api/transcriptions` で本文がその `Blob`・`Content-Type` が `audio/webm` / `POST api/comments/send-now`（本文 `{"thread":"TH-1","body":"x"}`）'
      - name: test_voice_api_when_unavailable
        case: 正常
        summary: 503 の理由と届かないを分ける
        condition: '`parametrize`: `transcribe` に 503・`{"detail": "…", "reason": "unsupported"}` / `fetchFn` が `TypeError` を送る'
        mock: '`fetchFn`'
        expected: '`{ok: false, status: 503, reason: unsupported}` / `{ok: false, status: null, detail: null}`'

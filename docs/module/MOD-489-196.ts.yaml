    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: 前回からの差分を見る
    scope: public
    summary: 値が `OpenedPoint` の形（文字列の `at` と 0 以上の整数の `seq`）かを確かめる。サーバーの応答・`sessionStorage`・`Prefs.opened` の値を読むときに使う
    args:

id: MOD-489-224
title: プレビュー / 画面と部品 / overview.ts
test_files:
  - tests/unit/preview/test_overview.py
components:
  - name: overviewScreen
    title: 概要
    container: plugins/mindstella/skills/mindmap/preview/screens/overview.ts
    usecase: 概要を見る
    kind: 画面
    summary: 画面設計『概要』の未読の AI の書き込み・未決定・要見直し・確認中の資料のタイルを描く。題名の上には `settings.description` があるときだけその 1 行を出す。未読のタイルは、状態がオープンで `posts[].seen` が偽の AI の書き込みを持つスレッドを、最後の未読の書き込みの新しい順に並べる
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: threads
        type: Thread[] | null
        required: true
        description: スレッド（`threadsApi().read()`）。`null`（読めなかった・配る書き出し）のときは未読のタイルを 0 件で描く
      - name: on
        type: '{open, navigate, openThread}'
        required: true
        description: 項目を開く・絞った表へ移る（`Route`）・コメントの一覧を開く（スレッドの ID。「すべて表示」は `null`）
      - name: visibleKinds
        type: Set<string>
        required: true
        description: 表示する種類（`resolveDisplay`）。表示しない種類へ移る「すべて表示」を出さない（タイルと中の項目は残す。画面設計『概要』）
    unit_tests:
      - name: test_overview_screen_when_kinds_hidden
        case: 正常
        summary: 表示しない種類へのリンクだけを外し、タイルは残す
        condition: '未決定の D-2・要見直しの D-1・確認中の A-1 を持つ索引。`parametrize`: `visibleKinds` が 7 種類 / 検討事項・資料を除く 5 種類'
        mock: なし（DOM を作って見る）
        expected: どちらも 4 つのタイルと D-1・D-2・A-1 の行がある。前者は未決定・要見直し・確認中の資料の「すべて表示」があり、後者は無い
      - name: test_overview_screen_when_unread
        case: 正常
        summary: 未読の書き込みを持つオープンのスレッドだけを新しい順に並べる
        condition: 未読の AI の書き込みを持つオープンの TH-1（1 日）・TH-2（2 日）、未読を持たない TH-3、未読を持つが閉じた TH-4。TH-1 の行を押す
        mock: '`on.openThread`'
        expected: 件数が 2、行が TH-2・TH-1 の順。`on.openThread` が `TH-1` で 1 回

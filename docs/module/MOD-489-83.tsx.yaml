id: MOD-489-83
title: プレビュー / send-form
lead: 部品設計『コメントの入力.tsx』の props・イベント・状態を持つ。
components:
  - name: SendForm
    title: コメントの入力
    kind: コンポーネント
    usecase: 項目へコメントする
    summary: 部品設計『コメントの入力.tsx』の props・イベント・状態を持つ
    refs:
      - CMP-489-8#
    unit_tests:
      - name: test_send_form
        case: 正常
        summary: 溜める
        condition: 本文を書いて「レビューに追加」
        mock: なし
        expected: '`onSubmit` が target・loc・body で呼ばれる。ボタンは文字を持たず、`aria-label`「レビューに追加」と `title`「レビューに追加（Ctrl+Enter）」を持つ'
      - name: test_send_form_when_empty
        case: 異常
        summary: 空白だけ
        condition: 空白だけで「レビューに追加」
        mock: なし
        expected: '`onSubmit` が呼ばれない'
      - name: test_send_form_when_closed
        case: 正常
        summary: 閉じた形と開閉
        condition: '`open: false`・`body` ありで開閉のボタンを押す'
        mock: なし
        expected: 入力欄と「レビューに追加」が無く「書きかけ」が出て、ボタンは `aria-expanded` が `false` で「コメントの入力を開く」。押すと `onToggleOpen` が `true` で呼ばれる
      - name: test_send_form_when_voice
        case: 正常
        summary: 音声入力の状態ごとのボタンと結果の行
        condition: '`voice` が idle / disabled（`voiceReason` あり）/ recording（`elapsed: 72`・`levels: [0.2, 0.8]`）/ transcribing'
        mock: なし
        expected: マイクのボタン（`aria-label`「音声で入力」）が「レビューに追加」の左 / マイクが `aria-disabled="true"` で理由を `aria-describedby` で指す / × と ✓ があり「レビューに追加」が無く、結果の行に `1:12` と読み上げの「録音中」、入力欄が隠れて、読み上げない波形に棒が 2 本あり、✓ にフォーカスがある / × と ✓ が押せず入力欄が読み取りだけ
      - name: test_send_form_when_voice_events
        case: 正常
        summary: 音声入力のイベント
        condition: idle でマイク / recording で × / recording で ✓ / disabled でマイク
        mock: なし
        expected: '`onVoiceStart` / `onVoiceCancel` / `onVoiceDone` が target・loc・body / `onVoiceBlocked` が呼ばれる'
      - name: test_send_form_when_recording_ended
        case: 正常
        summary: 録音を終えたら入力欄へフォーカスを戻す
        condition: '入力欄 `確認: でよい`・カーソル 4 で recording にし、idle へ描き直す'
        mock: なし
        expected: 入力欄が見え、フォーカスが入力欄にあり、カーソルが 4
      - name: test_send_form_when_reviewed
        case: 正常
        summary: 既定の挙動でレビュー中に追加した結果と、ほかの入力欄で音声入力中
        condition: '`status: reviewed` / `voice: disabled`・`voiceReason: ほかの入力欄で音声入力中のため、音声で入力できません。`'
        mock: なし
        expected: 結果の行に「文字起こしの結果をレビュー中に追加しました。」/ マイクが `aria-disabled="true"` で理由を `aria-describedby` で指し、入力欄に文字を打てる
    container: frontend/src/shared/components/send-form.tsx
notes:
  単体テスト: 同じフォルダの `send-form.test.tsx` に置く（knowledge の規約『フォルダ構成』）

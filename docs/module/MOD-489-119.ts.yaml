id: MOD-489-119
title: プレビュー / post-links
lead: 書き込みの描いた本文に、項目の ID のボタンとまとまりのリンクを付ける。
functions:
  - name: linkChangeSets
    title: まとまりのリンク
    kind: 関数
    usecase: 前回からの差分を見る
    summary: '`#` で始まるリンクのうち、記録にあるまとまりを指すものをまとまりのリンクにし、それ以外は中の文字に置き換える'
    args:
      - name: root
        type: HTMLElement
        description: 描いた本文
      - name: changeSets
        type: LookupTitle
        description: まとまりの ID から説明を引く
      - name: onChangeSet
        type: '(id: string) => void'
        description: まとまりのリンクを押したとき
    returns:
      type: void
      description: root を書き換える
    container: frontend/src/shared/core/post-links.ts
  - name: buttonizeItemIds
    title: 項目の ID のボタン
    kind: 関数
    usecase: スレッドで話す
    summary: 描いた本文の文字のうち、記録にある項目の ID をその項目を開くボタンにする。ボタンには `title` を付けず、書き込みを描く側が `attachTermTips` で種類 `item` のツールチップを出す（コード・リンク・ボタン・図・HTML の本文の枠の中と、記録に無い ID・スレッドの ID は文字のまま）
    args:
      - name: root
        type: HTMLElement
        description: 描いた本文
      - name: titles
        type: LookupTitle
        description: 項目の ID からタイトルを引く
      - name: onOpen
        type: '(id: string) => void'
        description: ボタンを押したとき
    returns:
      type: void
      description: root を書き換える
    container: frontend/src/shared/core/post-links.ts
  - name: linkThreadIds
    title: スレッドの ID のリンク
    kind: 関数
    usecase: スレッドで話す
    summary: 描いた本文の文字のうち、記録にあるスレッドの ID（`TH-{数字}`）と書き込みの ID（`TH-{数字}-{数字}`）を、そのスレッドを開くボタンにする。ボタンには `title` を付けず、描く側が `attachTermTips` で種類 `thread` のツールチップを出す（コード・リンク・ボタン・図・HTML の本文の枠の中と、記録に無いスレッド・スレッドに無い書き込みの ID は文字のまま）
    args:
      - name: root
        type: HTMLElement
        description: 描いた本文
      - name: threads
        type: LookupThread
        description: スレッドの ID からタイトルと書き込みの ID の並びを引く
      - name: onOpen
        type: '(threadId: string, postId: string | null) => void'
        description: ボタンを押したとき
    returns:
      type: void
      description: root を書き換える
    container: frontend/src/shared/core/post-links.ts
    unit_tests:
      - name: test_link_thread_ids
        case: 正常
        summary: 記録にあるスレッド・書き込みの ID だけをボタンにする
        condition: 本文「TH-2 と TH-2-3 と TH-2-9 と TH-99」、`threads` は TH-2（書き込み TH-2-1〜TH-2-3）だけ。ボタンを押す
        mock: なし
        expected: TH-2・TH-2-3 がボタンで、TH-2-9・TH-99 は文字のまま。押すと `onOpen` が `("TH-2", null)`・`("TH-2", "TH-2-3")`

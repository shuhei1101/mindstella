title: プレビュー / use-item-confirmed
lead: 項目の確認済みの付け外しを送り、応答を待つ間は押した後の値を返す。
functions:
  - name: useItemConfirmed
    title: 確認済みの付け外し
    kind: 関数
    usecase: 確認済みの付け外し
    summary: 開いている項目の確認済みと、付け外しの操作を返す
    args:
      - name: id
        type: string
        required: true
        passing: positional
        description: 項目の ID
      - name: confirmed
        type: boolean
        required: true
        passing: positional
        description: 記録の取得のその項目の `confirmed`（無ければ `false`）
    returns:
      type: '{ confirmed: boolean; saving: boolean; toggle: () => void }'
      description: 描く値（応答を待つ間は押した後の値）・応答を待っているか・押したときの操作
    process: |-
      1. orval が生成した `setItemConfirmed`（PUT `/api/items/{id}/confirmed`）の mutation を使う
      2. `toggle` で `!confirmed` を送る。応答を待つ間は `mutation.variables` の値を `confirmed` にし、`saving` を真にする
      3. 成功したら記録の query を invalidate する（`preview-queries` の記録のキー）
      4. 失敗したら記録の値に戻し、トーストで「確認済みを書き換えられませんでした。」と `detail`（届かないときは「サーバーが止まっています。立ち上げ直してから押してください。」）を出す
    container: frontend/src/shared/hooks/use-item-confirmed.ts
notes:
  API: '`frontend/openapi.yaml` に PUT `/api/items/{id}/confirmed`（`operationId: setItemConfirmed`、本文 `{confirmed}`、応答 `{id, confirmed}`）を足し、記録の取得の項目に任意の `confirmed`（真偽値）、設定に任意の `confirm_on_comment`（真偽値）を足して orval で生成し直す。MSW の handler（`frontend/src/testing/msw/handlers.ts`）にも受け口を足す'
  単体テスト: 同じフォルダの `use-item-confirmed.test.tsx` に置く。押した直後に値が変わり `saving` が真になること、成功で記録を invalidate すること、失敗で元の値に戻りトーストを出すことを確かめる
id: MOD-633-2

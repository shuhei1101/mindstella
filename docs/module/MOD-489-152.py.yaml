  - name: CDN_REPO_URL
    title: GitHub のリポジトリのファイルの URL
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: jsDelivr の、タグを固定した GitHub のリポジトリの中のファイルの URL の形式。mdmark の配布物と同梱物のライセンスを取るのに使う
    value: '"https://cdn.jsdelivr.net/gh/{package}@{version}/{path}"'
    status: planned
  - name: MDMARK_OPEN
    title: mdmark の JavaScript の要素
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: 配る書き出しに置く、mdmark の JavaScript を中身に持つ要素の開きタグ（閉じタグは `</script>`）。画面が中身から Blob の URL を作って `import()` する（インターフェース定義『プレビューを開く』の制約「配る書き出しで開く」）

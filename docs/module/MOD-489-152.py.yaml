  - name: export_preview
    title: 配る書き出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    scope: public
    summary: 検証してから、書き出し用のビルドに描画のライブラリ・ライセンスの表示・記録を差し込み、`out` を置き換える
    side_effects: '`out` を置き換える。ワークスペースは読むだけ。jsDelivr から配布ファイルとライセンスの本文を取る'
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: out
        type: Path
        required: true
        passing: keyword
        description: 書き出す先（`validate_export_out` を通した絶対パス）
      - name: built_at
        type: str
        required: true
        passing: keyword
        description: 書き出した日時（`now_utc` の文字列）

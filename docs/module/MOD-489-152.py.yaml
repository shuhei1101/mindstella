    value: ("map.js", "view.js", "comments.js")
  - name: MDMARK_CSS_OPEN
    title: mdmark の CSS の要素の開きタグ
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: 配る書き出しに置く、mdmark の CSS を中身に持つ `<style>` の開きタグ（閉じタグは `</style>`）。画面の JavaScript が資料の HTML のエクスポートでこの中身を使う
    value: "'<style id=\"mindmap-mdmark-css\">'"

  - container: plugins/mindstella/skills/mindmap/scripts/builder.py
    name: DATA_OPEN
    summary: 配る書き出しに置く、記録の JSON を中身に持つ要素の開きタグ（閉じタグは `</script>`）
    title: 記録の要素
    usecase: 配る書き出し
    value: "'<script type=\"application/json\" id=\"mindmap-data\">'"
  - container: plugins/mindstella/skills/mindmap/scripts/builder.py
    name: FONT_LINK
    summary: 書き出し用のビルドの HTML から外す、Google Fonts（`fonts.googleapis.com`・`fonts.gstatic.com`）の `<link>` を見つける正規表現
    title: 文字の読み込みの要素

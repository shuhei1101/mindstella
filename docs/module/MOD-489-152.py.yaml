    introduced:
      pr: 348
  - container: plugins/mindstella/skills/mindmap/scripts/builder.py
    name: EXPORT_HTML_FILE
    summary: '`PREVIEW_DIR` からの相対パス。React の画面の JS・CSS を中に持つ 1 枚の HTML'
    title: 書き出し用のビルド
    usecase: 配る書き出し
    value: '"export/index.html"'
  - container: plugins/mindstella/skills/mindmap/scripts/builder.py
    name: LIBRARIES_FILE
    summary: '`PREVIEW_DIR` からの相対パス。描画のライブラリごとの `package`・`version`・`url`・`integrity`・`global` を並べた JSON の配列（並びの順に `<script>` を差し込む）'
    title: 描画のライブラリの一覧
    usecase: 配る書き出し

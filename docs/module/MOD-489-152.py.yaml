    value: (VendorLibrary(package="shuhei1101/mdmark", name="mdmark", notice="Copyright (c) 2026 shuhei1101", license="MIT", license_path=None, license_file="licenses/mdmark-LICENSE.txt", bundled_license_path="dist/THIRD_PARTY_LICENSES.txt", bundled_license_file=None, repository="https://github.com/shuhei1101/mdmark", tag="{version}"), VendorLibrary(package="marked", name="marked", notice="Copyright (c) 2018+, MarkedJS / Copyright (c) 2011-2018, Christopher Jeffrey", license="MIT", license_path="LICENSE", license_file=None, bundled_license_path=None, bundled_license_file=None, repository="https://github.com/markedjs/marked", tag="v{version}"), VendorLibrary(package="mermaid", name="mermaid", notice="Copyright (c) 2014 - 2022 Knut Sveidqvist", license="MIT", license_path="LICENSE", license_file=None, bundled_license_path=None, bundled_license_file="licenses/mermaid-bundled.txt", repository="https://github.com/mermaid-js/mermaid", tag="mermaid@{version}"), VendorLibrary(package="diff", name="jsdiff", notice="Copyright (c) 2009-2015, Kevin Decker", license="BSD-3-Clause", license_path="LICENSE", license_file=None, bundled_license_path=None, bundled_license_file=None, repository="https://github.com/kpdecker/jsdiff", tag="v{version}"))

id: MOD-489-152
title: サーバー / ビルド / builder.py
lead: ワークスペースの記録を 1 つの JSON にまとめる。配る書き出しは、React の画面の書き出し用のビルド（プラグインの `preview/export/index.html`）に、jsDelivr から取った mdmark と描画のライブラリ・ライセンスの表示・記録を差し込んで書き出す。描画のライブラリの URL と `integrity` はプラグインの `preview/libraries.json` から読む。読み書きと検証と、依存と影響（画面に出す値の計算）に依存する。
test_files:
  - tests/unit/scripts/test_builder.py
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    preview/
      spa/            React の画面のビルドの出力（配信が返す。モジュール構成『プレビュー / React』）
      export/
        index.html    React の画面の書き出し用のビルドの出力（JS・CSS を中に持つ 1 枚の HTML。配る書き出しの元）
        licenses.md   書き出し用のビルドが中に持つライブラリごとの名前・バージョン・ライセンスの本文（Vite の `build.license` が書く）
      libraries.json  描画のライブラリ（marked・mermaid・jsdiff）ごとの package・version・url・integrity・global。画面と配る書き出しが読む唯一の持ち主
      licenses/
        README.md  mermaid-bundled.txt を作り直す手順と、mdmark-LICENSE.txt を置いている理由
        mermaid-bundled.txt  mermaid.min.js が中に束ねた依存ごとの、名前・バージョンと LICENSE の写。mermaid のバージョンを上げたら再収集する
        mdmark-LICENSE.txt  mdmark の MIT の本文
    scripts/
      builder.py      記録の収集と、配る書き出し
  ```
data_models:
  - name: VendorLibrary
    title: 配る書き出しに入れるライブラリ
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    role: DTO
    summary: 描画のライブラリ 1 つの、ライセンスの表示に使う値。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: package
        type: str
        description: '`LIBRARIES_FILE` の `package` と結ぶ。npm はパッケージ名、GitHub は `{owner}/{repo}`'
        example: marked
      - name: name
        type: str
        description: 表示する名前
        example: marked
      - name: notice
        type: str
        description: 著作権の表示
        example: Copyright (c) 2018+, MarkedJS / Copyright (c) 2011-2018, Christopher Jeffrey
      - name: license
        type: str
        description: 配るときのライセンスの名前（SPDX）。選べるライセンスを持つときは選んだもの
        example: MIT
      - name: license_path
        type: str | None
        description: パッケージの中のライセンスの本文のファイル（`CDN_PACKAGE_URL` か `CDN_REPO_URL` の `path`）。取らずに `license_file` から読むライブラリは `None`
        example: LICENSE
      - name: bundled_license_file
        type: str | None
        description: 配布ファイルが中に束ねた依存の、名前・バージョンとライセンスの本文を並べたファイルの、プレビューのフォルダからの相対パス。束ねた依存が無いライブラリは `None`
        example: licenses/mermaid-bundled.txt
      - name: repository
        type: str
        description: ソースコードのリポジトリの URL
        example: https://github.com/markedjs/marked
      - name: tag
        type: str
        description: バージョンのタグの形式（`{version}` に`LIBRARIES_FILE` のバージョンを入れる）。入手先は `{repository}/tree/{tag}`
        example: v{version}
      - name: license_file
        type: str | None
        description: ライセンスの本文を取らずに読む、プレビューのフォルダからの相対パス。`license_path` が `None` のライブラリだけが持ち、それ以外は `None`
        example: licenses/mdmark-LICENSE.txt
      - name: bundled_license_path
        type: str | None
        description: 配布物が中に束ねた依存の、名前・バージョンとライセンスの本文を並べたパッケージの中のファイル（取る。`CDN_REPO_URL` の `path`）。`bundled_license_file` と両方は持たない。無ければ `None`
        example: dist/THIRD_PARTY_LICENSES.txt
  - name: ExternalScript
    title: 外の読み込み
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    role: DTO
    summary: '`LIBRARIES_FILE` の 1 行。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: url
        type: str
        description: '配布ファイルの URL'
        example: https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js
      - name: integrity
        type: str
        description: '`integrity`（`sha384-{Base64}`）'
      - name: package
        type: str
        description: パッケージ名
        example: marked
      - name: version
        type: str
        description: バージョン
        example: 0.12.0
  - name: LicenseBlock
    title: ライセンスの表示の材料
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    role: DTO
    summary: ライブラリ 1 つのライセンスの表示を組み立てる材料。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: library
        type: VendorLibrary
        description: ライブラリ
      - name: version
        type: str
        description: 外の読み込みのバージョン
      - name: license_text
        type: str
        description: 取ったか `license_file` から読んだライセンスの本文
      - name: bundled_text
        type: str | None
        description: 束ねた依存のライセンス（`bundled_license_file` の中身か、`bundled_license_path` から取った本文）。無ければ `None`

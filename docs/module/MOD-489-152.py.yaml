        message: '取れませんでした: {URL}（{理由}） / integrity が合いません: {URL}'
        name: DownloadFailedError
    kind: 関数
    name: assemble_export_html
    process: |-
      1. `preview_dir / EXPORT_HTML_FILE` を読み、`FONT_LINK` に当たる `<link>` を外す
         - 最後の `BODY_CLOSE` が無い場合、`ValueError` を送出する（同梱の誤り）
      2. 描画のライブラリを読み（`load_libraries`）、mdmark（`MDMARK_PACKAGE`）と各ライブラリに `package` が同じ `VendorLibrary` を引く
         - 無い場合、`ValueError` を送出する
      3. mdmark の `index.css`・`index.js`・`MDMARK_PART_FILES`（`mdmark_dist_url` で `mdmark_ref` の URL）と、各ライブラリの配布ファイルを取り（`fetch`）、ライブラリだけ sha384 を Base64 にした `sha384-{値}` が `integrity` と同じことを確かめる
         - 違う場合、`DownloadFailedError` を送出する
      4. ライブラリごとのライセンスの本文と束ねた依存のライセンスを、`license_path`・`bundled_license_path` があれば取り、無ければ `license_file`・`bundled_license_file` をプレビューのフォルダから読む。`FRONTEND_LICENSES_FILE` を読む
      5. 取った・読んだ中身が `</script`・`<script`（CSS は `</style`）を含まないことを確かめる（大文字・小文字を区別しない）
         - 含む場合、`ValueError` を送出する
      6. 最後の `BODY_CLOSE` の前に、`MDMARK_CSS_OPEN` + CSS + `</style>`、`MDMARK_OPEN` + JavaScript + `</script>`、部品ごとの `<script type="text/plain" id="mindmap-mdmark-{部品の名前}">` + 中身 + `</script>`、ライブラリごとの `<script>{配布ファイルの中身}</script>`、`DATA_OPEN` + `escape_for_script` した記録の JSON + `</script>`、`LICENSES_OPEN` + ライセンスの表示（mdmark・ライブラリの順の `format_licenses` の後に、空行と見出しの行 `React の画面が中に持つライブラリ` と `FRONTEND_LICENSES_FILE` の中身）+ `</script>` を差し込む
    returns:
      description: 外部のファイルも URL も指さない HTML
      type: str
    scope: public
    summary: 書き出し用のビルドに、取った mdmark・描画のライブラリ・記録・ライセンスの表示を差し込んだ HTML を返す
    title: 配る書き出しの組み立て
    usecase: 配る書き出し
    unit_tests:
      - case: 正常
        condition: '`tmp_path` に、文字列の `</body>` を中に持つ `<script>` と Google Fonts の `<link>` と最後の `</body>` を持つ `export/index.html`、2 行の `libraries.json`、`export/licenses.md`（中身 `React の依存`）。`MDMARK_PACKAGE` と 2 つのパッケージの `VendorLibrary`。記録の本文に `</script>` を含む'
        exception: '-'
        expected: '`https://` と Google Fonts の `<link>` が無い。差し込んだ要素が最後の `</body>` の直前にあり、`<script>` の中の文字列の `</body>` は変わらない。`mindmap-data` を JSON として読むと記録と同じで本文の `</script>` で閉じていない。`mindmap-licenses` の最後に見出しの行と `React の依存` がある'
        mock: '`fetch`（URL ごとに決めた中身を返す関数。配布ファイルの中身は `integrity` と合うもの）'
        name: test_assemble_export_html
        summary: 最後の </body> の前に mdmark・ライブラリ・記録・ライセンスを差し込む
      - case: 異常
        condition: '`parametrize`: `</body>` が無い / 配布ファイルが `integrity` と合わない / 取った中身が `</script` を含む'
        exception: ビルドか取った中身の誤り
        expected: '`ValueError` / `DownloadFailedError`'
        mock: '`fetch`'
        name: test_assemble_export_html_when_invalid
        summary: ビルド・配布ファイルが違う
  - name: fetch_url
    title: URL の中身を取る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    scope: public
    summary: URL を GET し、一時的な失敗は取り直して本文のバイト列を返す。`FetchFn` の本物
    side_effects: HTTPS で外へ要求を送信する
    args:
      - name: url
        type: str
        required: true
        passing: positional
        description: 取る URL
      - name: timeout
        type: float
        required: false
        default: FETCH_TIMEOUT_SEC
        passing: keyword
        description: 接続と 1 回の読み取りの待ちの上限（秒）
    returns:
      type: bytes
      description: 本文
    process: |-
      1. `urllib.request.urlopen(url, timeout=timeout)` で取る（環境変数のプロキシに従う）
         - 例外は `HTTPError` を `URLError`（`HTTPError` の親）より先に分け、`HTTPError` は状態コードで取り直すかを決める
         - 届かない（`HTTPError` を除く `URLError`・`OSError`。`TimeoutError` を含む）か、HTTP 403・408・429・5xx が返った場合、要求の回数が `FETCH_ATTEMPTS` 未満なら、`Retry-After`（秒。`FETCH_RETRY_AFTER_MAX_SEC` を上限にする）か、`random.uniform(0, FETCH_BACKOFF_BASE_SEC * 2 ** (回数 - 1))` 秒を `time.sleep` で待って 1 へ戻る（非機能要件『配る書き出しの取り直し』）
         - それ以外の 200 以外が返った場合と、上限まで取れなかった場合、最後の要求の理由で `DownloadFailedError` を送出する
      2. 本文を全て読んで返す
    exceptions:
      - name: DownloadFailedError
        condition: 届かない・待ちの上限を超えた・200 以外が返った
        message: '取れませんでした: {URL}（{理由}）'
    unit_tests:
      - name: test_fetch_url
        case: 正常
        summary: 本文を返す
        condition: '`http.server` を `127.0.0.1` の空きポートで立て、`/a.js` に `abc` を返す'
        mock: なし（手元の HTTP サーバー）
        expected: '`b"abc"` を返す'
      - name: test_fetch_url_when_transient_failure
        case: 正常
        summary: 一時的な失敗の後に取り直して本文を返す
        condition: '`parametrize`: 手元の HTTP サーバーが 1 回目に 403 / 429（`Retry-After: 1`）/ 503 を返し、2 回目に `abc` を返す'
        mock: '`sleep`（待った秒数を記録する差し替え）・`random`（上限を返す差し替え）'
        expected: '`b"abc"` を返し、要求が 2 回。429 では 1 秒、それ以外は 1 回目の間隔の上限（1 秒）を待つ'
      - name: test_fetch_url_when_retries_exhausted
        case: 異常
        summary: 上限まで取れなければ DownloadFailedError
        condition: 手元の HTTP サーバーが何回でも 403 を返す
        mock: '`sleep`・`random`'
        expected: '`DownloadFailedError`（`match` に URL と `HTTP 403`）。要求が 3 回で、待った秒数が 1・2'
        exception: 取り直しの上限まで取れない
      - name: test_fetch_url_when_unreachable
        case: 異常
        summary: 届かないか 200 以外なら DownloadFailedError
        condition: '`parametrize`: 閉じたポートの URL / 手元の HTTP サーバーが 404 を返す URL / 手元の HTTP サーバーが 204 を返す URL'
        mock: '`sleep`（待った秒数を記録する差し替え）・`random`（上限を返す差し替え）'
        expected: '`DownloadFailedError`（`match` にその URL）。要求の回数は閉じたポートが 3 回（待った秒数 1・2）、404・204 が 1 回（待たない）'
        exception: 届かないか 200 以外
  - name: format_licenses
    title: ライセンスの表示の組み立て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    scope: public
    summary: ライブラリごとの名前・バージョン・著作権の表示・ライセンスの名前・ソースコードの入手先・ライセンスの本文・束ねた依存のライセンスを並べた文字列を返す
    args:
      - name: blocks
        type: list[LicenseBlock]
        required: true
        passing: positional
        description: 外の読み込みの順のライセンスの表示の材料
    returns:
      type: str
      description: ライブラリごとの塊を空行で区切った文字列
    process: |-
      1. 塊ごとに、`{name} {version}`・`notice`・`License: {license}`・`Source: {repository}/tree/{tag}`（`tag` の `{version}` にバージョンを入れる）の行と、`license_text`、`bundled_text` があればその見出しの行 `{name} が中に持つライブラリ` と本文をこの順に並べる
      2. 塊を並びの順に空行でつなぐ
    unit_tests:
      - name: test_format_licenses
        case: 正常
        summary: ライブラリごとに名前・バージョン・著作権・ライセンス・入手先・本文を並べる
        condition: '2 つの `LicenseBlock`（`license_text` は `本文 A`・`本文 B`。2 つ目だけ `bundled_text` が `束ねた本文`。1 つ目の `tag` は `v{version}`・バージョン `1.2.3`）'
        mock: なし
        expected: '1 つ目の名前とバージョン・`notice`・`License:`・`Source: {repository}/tree/v1.2.3`・`本文 A` がこの順にあり、その後に 2 つ目の塊が空行を挟んで続き、2 つ目の `本文 B` の後に見出しの行と `束ねた本文` がある。1 つ目の塊には見出しの行が無い'
  - name: read_records
    title: 記録の読み出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: プレビューを開く
    scope: public
    summary: ワークスペースをその場で読んで検証し、記録の取得の JSON にする辞書を返す（`GET /api/records` が使う）。`config.yaml` だけが合わないときは、渡された最後に検査に通った設定で返す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配信しているワークスペースのフォルダ
      - name: last_settings
        type: dict[str, Any] | None
        required: false
        default: None
        passing: keyword
        description: 配信が持つ最後に検査に通った設定（`SettingsHolder.current`）。`None` なら `config.yaml` の問題もほかと同じく送信する
      - name: now
        type: NowFn
        required: false
        default: now_utc
        passing: injected
        description: 読んだ日時を返す関数
      - name: resolve
        type: Callable[[str | None], str]
        required: false
        default: resolve_ref
        passing: injected
        description: 設定の mdmark のバージョンを ref にする関数（mdmark_ref.py）
    returns:
      type: dict[str, Any]
      description: '`collect_preview_data` の辞書。`config.yaml` が合わないときは `settings` が `last_settings` で、`settings_problem` に合わない箇所の行'
    process: |-
      1. ワークスペースを読み、検証する（`load_workspace`、`validate_workspace`）
         - `config.yaml` が無い場合、`WorkspaceNotFoundError` がそのまま上がる
      2. 問題を `file` が `config.yaml` のものとそれ以外に分ける
         - それ以外の問題がある場合、問題ごとの行を持った `SchemaMismatchError` を送出する（`legacy` は `is_legacy_problem`）
         - `config.yaml` の問題があり、`last_settings` が `None` の場合、同じく `SchemaMismatchError` を送出する
         - `config.yaml` の問題があり、`last_settings` がある場合、ワークスペースの `settings` を `last_settings` に差し替え（`dataclasses.replace`）、問題ごとの行を `settings_problem` にする
      3. まとめる設定（差し替えたときは `last_settings`）の `mdmark.version` を、`resolve` で ref にする
      4. 読んだ日時と `settings_problem` と ref を付けてまとめる（`collect_preview_data`）
    exceptions:
      - name: SchemaMismatchError
        condition: '`config.yaml` 以外のどれかの YAML がスキーマに合わないか YAML として読めない、または `last_settings` を渡さずに `config.yaml` が合わない'
    unit_tests:
      - name: test_read_records
        case: 正常
        summary: その場で読んだ記録を返す
        condition: D-1 を持つワークスペース。`now` は `2026-10-04T03:00:00+00:00`。一度読んだ後に D-2 を追加してもう一度読む
        mock: '`now`'
        expected: 1 回目の `decisions` が D-1 だけ、2 回目が D-1・D-2。`built_at` が `now` の値
      - name: test_read_records_when_schema_mismatch
        case: 異常
        summary: スキーマに合わなければ返さない
        condition: D-1 の `status` が `完了`
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `decisions.yaml: items[0].status:` で始まる行）'
        exception: スキーマに合わない
      - name: test_read_records_when_settings_invalid
        case: 正常
        summary: config.yaml だけが合わなければ最後に通った設定で返す
        condition: '`config.yaml` の `display.visible_kinds` を `[rainbow]` にしたワークスペース。`parametrize`: `last_settings` に `display.visible_kinds: [decisions]` の設定 / `last_settings` を渡さない'
        mock: なし
        expected: '`settings.display.visible_kinds` が `[decisions]` で、`settings_problem` に `config.yaml: display.visible_kinds` で始まる行 / `SchemaMismatchError`（`lines` に同じ行）'
function_types:
  - name: FetchFn
    title: URL の中身を取る関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: URL を受けて本文のバイト列を返す。取れなければ `DownloadFailedError` を送出する（`type FetchFn = Callable[[str], bytes]`）
    args:
      - name: url
        type: str
        description: 取る URL
    returns:
      type: bytes
      description: 本文

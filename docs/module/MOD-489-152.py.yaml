    name: BODY_CLOSE
    summary: 書き出し用のビルドの HTML の最後のこのタグの前に差し込む（ビルドの JavaScript が文字列の `</body>` を持つため最後のものを使う）
    title: 差し込む位置
    usecase: 配る書き出し
    value: '"</body>"'
  - name: FETCH_ATTEMPTS
    title: 取るときの要求の上限
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: 1 つの URL への要求の回数の上限（1 回目 + 取り直し）。非機能要件『配る書き出しの取り直し』
    value: '3'
  - name: FETCH_BACKOFF_BASE_SEC
    title: 取り直しの間隔の基準
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: 取り直しの間隔の上限の基準（秒）。n 回目の後は 0〜基準 × 2^(n-1) 秒の乱数（full jitter）
    value: '1.0'
  - name: FETCH_RETRY_AFTER_MAX_SEC
    title: Retry-After の上限
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    summary: 応答の `Retry-After` に従って待つ秒数の上限
    value: '10.0'
functions:
  - name: collect_preview_data
    title: プレビューのデータの収集
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: プレビューを開く
    scope: public
    summary: 設定（`presets` を含む）・7 種類・本文・まとまり・読んだ日時と、`preset_counts`（`presets.preset_counts`）を 1 つの辞書にまとめる（インターフェース定義『記録の取得』のレスポンスの構造。スレッドは含めない）
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: built_at
        type: str
        required: true
        passing: keyword
        description: 読んだ日時（配信は読んだとき、配る書き出しは書き出したときの `now_utc`）
      - name: settings_problem
        type: list[str] | None
        required: false
        default: None
        passing: keyword
        description: '`config.yaml` がスキーマに合わないときの合わない箇所の行（`read_records` だけが渡す）'
      - name: mdmark_ref
        type: str
        required: true
        passing: keyword
        description: 画面が読み込む mdmark の ref（『記録の取得』の `mdmark_ref`）
    returns:
      type: dict[str, Any]
      description: '`settings`・`decisions` など種類ごと（ファイル名から `.yaml` を落としたキー）・`bodies`・`marked_bodies`・`changes`・`derived`・`built_at`・`settings_problem`・`mdmark_ref`'
    process: |-
      1. 種類ごとの `items` をファイル名から `.yaml` を落としたキーで入れる（項目の `history` もそのまま入る）
      2. 項目の `body` が指す本文を読んで `bodies` に入れる（本文の読み込み。`read_body`。読めないものは入れない）。形式が `html` の本文は、行のマーカーを追加したもの（`mark_lines`）を `marked_bodies` にも入れる
      3. まとまりを読んで `changes` に入れる（`load_changes`）。今回の差分の始まり（『前回参照した時点』の `load_turn_point`）を `changes.turn_seq`・`changes.turn_at` に入れる（無ければ 0 と `null`）
      4. 画面に出す値を計算して `derived` に入れる（`derive_preview_values`）
      5. `settings_problem` を入れる（渡されなければ `null`。配る書き出しも同じキーを持つ）
      6. `mdmark_ref` を入れる
    unit_tests:
      - name: test_collect_preview_data
        case: 正常
        summary: 種類ごとのキーと、指された本文だけを集める
        condition: 'A-1（`body: A-1.mark.md`、ファイルあり）・R-1（`body: R-1.mark.md`、ファイル無し）・`docs/X-1.mark.md`（指されない）'
        mock: なし
        expected: キーが `settings`・`decisions`・`tasks`・`research`・`docs`・`terms`・`notes`・`logs`・`bodies`・`marked_bodies`・`changes`・`derived`・`built_at`・`settings_problem`。`bodies` のキーが `A-1.mark.md` だけ。`marked_bodies` が `{}`。`settings_problem` が `None`
      - name: test_collect_preview_data_with_changes
        case: 正常
        summary: まとまりと変更履歴を含める
        condition: '`history` を持つ D-1 と、`sets` を 1 つ持つ `changes.yaml`'
        mock: なし
        expected: '`changes` が `changes.yaml` と同じで、`decisions` の D-1 が `history` を持つ'
      - name: test_collect_preview_data_with_html_body
        case: 正常
        summary: HTML の本文は原文を `bodies` に、行のマーカーつきを `marked_bodies` に入れる
        condition: 'A-1（`body: A-1.mark.md`）・A-2（`body: A-2.html`、本文 `<p>a</p>`）'
        expected: '`bodies` が `A-1.mark.md`・`A-2.html` の原文を持ち、`marked_bodies` が `A-2.html` → `<p data-line="1" data-line-end="1">a</p>` だけを持つ'
        mock: なし
      - name: test_collect_preview_data_turn_point
        case: 正常
        summary: 今回の差分の始まりを changes に入れる
        condition: '`parametrize`: `turn_point.json` が無い / `turn_seq: 3`・`at: 2026-11-28T05:50:00+00:00`'
        mock: なし（`XDG_STATE_HOME` は `tmp_path`）
        expected: '`changes.turn_seq`・`changes.turn_at` が `0`・`None` / `3`・`2026-11-28T05:50:00+00:00`'
  - name: escape_for_script
    title: 埋め込みのエスケープ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 配る書き出し
    scope: public
    summary: JSON の文字列の `<`・`>`・`&` を、JSON の Unicode エスケープ（バックスラッシュに続けて `u003c`・`u003e`・`u0026`）に置き換える
    args:
      - name: json_text
        type: str
        required: true
        passing: positional
        description: '`json.dumps(..., ensure_ascii=False)` の結果'
    returns:
      type: str
      description: '`<script>` の中に置いても要素を閉じない JSON の文字列'
    process: 1. `&` → `<` → `>` の順に、それぞれの Unicode エスケープへ置き換えて返す
    unit_tests:
      - name: test_escape_for_script
        case: 正常
        summary: 置き換えた文字列は `</script>` を含まず、JSON として読むと元に戻る
        condition: '`json.dumps({"a": "</script>&<b>"}, ensure_ascii=False)`'
        mock: なし
        expected: '戻り値に `<`・`>`・`&` が無く、`json.loads` すると `{"a": "</script>&<b>"}`'
  - name: mdmark_dist_url
    title: mdmark の配布ファイルの URL
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/builder.py
    usecase: 共通
    scope: public
    summary: 解決した mdmark の ref から、jsDelivr の配布ファイルの URL を組み立てる
    args:
      - name: ref
        type: str
        required: true
        passing: positional
        description: mdmark_ref.py の `resolve_ref` が返した ref（commit の SHA・タグ・`develop`）
      - name: path
        type: str
        required: true
        passing: positional
        description: '`dist/` の中のファイル名（`index.js` ほか）'
    returns:
      type: str
      description: '`CDN_REPO_URL` に `MDMARK_PACKAGE` と ref を入れた URL'
    process: |-
      1. `dist/{path}` にして、ref と一緒に `CDN_REPO_URL` に入れる
    unit_tests:
      - name: test_mdmark_dist_url
        case: 正常
        summary: ref をそのまま URL に入れる
        condition: '`parametrize`: (`0123456789abcdef0123456789abcdef01234567`, `index.js`) / (`develop`, `index.css`) / (`v0.13.0`, `map.js`)'
        mock: なし
        expected: '`.../mdmark@0123456789abcdef0123456789abcdef01234567/dist/index.js` / `.../mdmark@develop/dist/index.css` / `.../mdmark@v0.13.0/dist/map.js`'
  - name: derive_preview_values
    title: プレビューに出す値の計算
    kind: 関数

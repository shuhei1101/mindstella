  - container: plugins/mindstella/skills/mindmap/scripts/builder.py
    name: FRONTEND_LICENSES_FILE
    summary: '`PREVIEW_DIR` からの相対パス。書き出し用のビルドのときに生成し、ライセンスの表示の最後に続ける'
    title: React の画面が中に持つライブラリのライセンス
    usecase: 配る書き出し

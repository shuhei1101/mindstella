id: MOD-489-49
title: プレビュー / use-save-display-default
lead: ワークスペースの既定の書き換えの mutation。
functions:
  - name: useSaveDisplayDefault
    title: ワークスペースの既定にする
    kind: フック
    usecase: ワークスペースの既定を変える
    summary: '`PUT /api/config/display` へ `network_look`・`visible_kinds` を送り、成功で記録を読み直す。返った `display` を返す。送る前に値を `expectDisplaySave` で控え、失敗したら `cancelDisplaySave` で外す（読み直した記録で自分の既定を知らせないため）'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_save_display_default
        case: 正常
        summary: 読み直す
        condition: '200'
        mock: MSW
        expected: 記録の query が読み直される
      - name: test_use_save_display_default_when_error
        case: 異常
        summary: 書けない
        condition: 403 と `detail`
        mock: MSW
        expected: '`AppError` の `detail`'
    container: frontend/src/features/settings/display-settings/use-save-display-default.ts
notes:
  単体テスト: 同じフォルダの `use-save-display-default.test.ts` に置く（knowledge の規約『フォルダ構成』）

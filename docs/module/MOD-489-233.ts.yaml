id: MOD-489-233
title: プレビュー / 画面と部品 / filter-drawer.ts
components:
  - name: filterDrawer
    title: 絞り込みのドロワー
    container: plugins/mindstella/skills/mindmap/preview/components/filter-drawer.ts
    usecase: 項目を表で絞り込む
    kind: コンポーネント
    summary: 部品設計『絞り込み』の引数を受け、タブの帯の下に非モーダルの `dialog` を `show()` で開く。値の条件より上に「文字を含む」の欄を並べ、文字の入力（打ち終えて 250 ミリ秒後）・値の選択・条件の解除・すべて解除・閉じるをコールバックで知らせる。描き直しても中のスクロールの位置と、押した値・打っていた文字の欄とカーソルの位置へのフォーカスを保つ。初めて開くときは先頭の文字の欄（無ければ最初の値）へフォーカスを移す。開いている間のグレーアウトと本文の部品を止めるのは入口（`start` の 5）
    props:
      - name: groups
        type: FilterGroup[]
        required: true
        description: 条件の並び（`drawerGroups` の結果）
      - name: selected
        type: Record<string, string[]>
        required: true
        description: 選んだ値
      - name: total
        type: number
        required: true
        description: 画面の項目の件数
      - name: shown
        type: number
        required: true
        description: 条件に合う項目の件数
      - name: narrow
        type: boolean
        required: true
        description: 画面の幅が 900px 以下か
      - name: on
        type: '{select, text, clear, clearAll, close}'
        required: true
        description: 値の選択 `select`（`key`・`value`・入れたか）・文字の入力 `text`（`key`・`value`。使う側が前後の空白を除いて `~{列}` に入れ替え、空なら外す）・条件の解除 `clear`（`key`）・すべて解除 `clearAll`・閉じる `close`
      - name: texts
        type: '{key, label, value}[]'
        required: false
        description: 文字の欄。画面は表の列を `textColumns` に通して組み、`value` は `selected` の `~{列}` の文字。画面は `drawerGroups` に文字の条件で絞った行を渡し、値の件数をその行で数える。省くと文字の欄を出さない（ネットワーク）

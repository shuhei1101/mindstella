id: MOD-489-10
title: プレビュー / thread-row
lead: 部品設計『スレッドの行.tsx』の props・イベント・状態を持つ。
components:
  - name: ThreadRow
    title: スレッドの行
    kind: コンポーネント
    usecase: スレッドで話す
    summary: 部品設計『スレッドの行.tsx』の props・イベント・状態を持つ。タイトルは『record-text』の `RecordText` を `mode="marker"`・`tooltip={false}` で描く
    refs:
      - CMP-489-14#
    unit_tests:
      - name: test_thread_row
        case: 正常
        summary: 開く
        condition: 行を押す
        mock: なし
        expected: '`onOpen` がスレッドの ID で呼ばれる'
      - name: test_thread_row_when_unread
        case: 正常
        summary: 未読
        condition: 未読の書き込みを持つ
        mock: なし
        expected: 未読の札がある
      - name: test_thread_row_without_id_tooltip
        case: 正常
        summary: 行の中の ID にツールチップを出さない
        condition: 要約に記録にある D-1 を持つ行で、D-1 に `mouseenter`、行のボタンに `focus` を送信する
        mock: なし
        expected: '`role="tooltip"` が描かれず、ボタンの `aria-describedby` が D-1 の説明を指す'
    container: frontend/src/features/comments/shared/thread-row.tsx
notes:
  単体テスト: 同じフォルダの `thread-row.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  長い値: 状態の札・未読の札・レビュー中のマーカー・書き手の文字に `shrink-0 whitespace-nowrap` を付け、2 行目の ID を `min-w-0 truncate` にする（#690）。ストーリーに部品設計の `LongValuesNarrow` を追加する
  区切りの線: 行の `li` は `grid border-b border-border hover:bg-accent` にし、角丸・枠線・`bg-card` を付けない。まだ送信していない新規スレッドは `border-dashed` を加える。ストーリーに部品設計の `List`・`Many` を追加し、幅を `min(384px, 100%)` にする

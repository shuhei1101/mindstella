id: MOD-713-3
title: プレビュー / left-panel
lead: コメントの一覧・保存待ちのパネル・表示の設定が共有する左のパネルの外側の要素で、幅と、コメントの一覧では右端の幅の区切りを持つ。
components:
  - name: LeftPanel
    title: 左のパネル
    kind: コンポーネント
    usecase: 共通
    container: frontend/src/shared/components/left-panel.tsx
    summary: "`as` の要素（既定 `aside`）を描き、受けた属性（`role`・`aria-label`・`className`・`onKeyDown` など）と `children` をそのまま指定する。表示の幅が `LEFT_PANEL_WIDTH.resizableFrom`（901px）以上では、幅を『panel-width-store』の `currentLeftWidth(state)` を `clampWidth(幅, min, leftPanelMax(表示の幅))` で収めた値にし、`resizerLabel` を指定したときだけ右端に部品『幅の区切り』（`side=right`・`label`・`min`・`max`・`step`）を描いて `onChange` で `setLeftWidth`、`onCommit` で `commitLeftWidth` を呼ぶ。900px 以下は幅を適用せず、区切りを描かない（各パネルの今の全幅のまま）。表示の幅が 901px 以上では、詳細パネル（`lg:z-30`）より上の重なり順 `lg:z-[35]` を要素に付ける。表示の幅は『use-viewport-width』の `useViewportWidth()` で参照する"
    refs:
      - SCR-489-2#
      - SCR-489-11#
      - SCR-489-24#
    props:
      - name: resizerLabel
        type: string
        description: '幅の区切りの `aria-label`（例: 「コメントの一覧の幅」）。省くと区切りを描かず、幅だけを適用する'
        required: false
      - name: children
        type: ReactNode
        description: パネルの中身
      - name: as
        type: '"aside" | "section"'
        required: false
        default: '"aside"'
        description: 描く要素。`role="dialog"` を持つパネル（コメントの一覧・表示の設定）は `section`（`aside` は `dialog` の role を持てない）
    unit_tests:
      - name: test_left_panel_when_resized
        case: 正常
        summary: 右端の区切りで幅を変えて残す
        condition: 表示の幅 1440。区切りにフォーカスして → を 2 回押す
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 416px で、`sessionStorage` の `mindmap-left-panel-width` が `416`
      - name: test_left_panel_when_width_saved
        case: 正常
        summary: 残した幅で開く
        condition: '`sessionStorage` の `mindmap-left-panel-width` に 520 を入れて描く'
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 520px で、区切りの `aria-valuenow` が 520
      - name: test_left_panel_when_over_max
        case: 正常
        summary: 上限は表示の幅の 2/3 で、詳細パネルの幅によらない
        condition: 表示の幅 1440。ストアの `detailWidth` が 960 で、残した幅が 1200
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 960px で、区切りの `aria-valuemax` が 960。`sessionStorage` の値は 1200 のまま
      - name: test_left_panel_when_narrow
        case: 正常
        summary: 900px 以下は区切りを描かない
        condition: 表示の幅 900
        mock: '`window.innerWidth`・`matchMedia`'
        expected: '`role=separator` が無く、`aside` に `style.width` が無い'
      - name: test_left_panel_above_detail
        case: 正常
        summary: 詳細パネルより上の重なり順で描く
        condition: 表示の幅 1440 で描く
        mock: なし
        expected: '`aside` が class `lg:z-[35]` を持つ'
      - name: test_left_panel_without_resizer
        case: 正常
        summary: resizerLabel を省くと区切りを描かず、共有した幅で開く
        condition: 表示の幅 1440。ストアの `leftWidth` が 520 で、`resizerLabel` を省いて描く
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 520px で、`role=separator` が無い
      - name: test_left_panel_as_section
        case: 正常
        summary: section のダイアログとして描き、共有した幅で開く
        condition: 表示の幅 1440。ストアの `leftWidth` が 520 で、`as="section"`・`role="dialog"`・`aria-label="表示の設定"` を指定して描く
        mock: '`window.innerWidth`・`matchMedia`'
        expected: 読み上げの名前「表示の設定」の `role=dialog` の `section` があり、幅が 520px
notes:
  単体テスト: 同じフォルダの `left-panel.test.tsx` に置く（knowledge の規約『フォルダ構成』）

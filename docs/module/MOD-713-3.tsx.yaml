id: MOD-713-3
title: プレビュー / left-panel
lead: コメントの一覧・保存待ちのパネル・表示の設定が共有する左のパネルの `aside` で、幅と、コメントの一覧では右端の幅の区切りを持つ。
components:
  - name: LeftPanel
    title: 左のパネル
    kind: コンポーネント
    usecase: 共通
    container: frontend/src/shared/components/left-panel.tsx
    summary: "`aside` を描き、受けた属性（`aria-label`・`className` など）と `children` をそのまま指定する。表示の幅が `LEFT_PANEL_WIDTH.resizableFrom`（901px）以上では、幅を『panel-width-store』の `leftWidth` を `clampWidth(leftWidth, min, leftPanelMax(...))` で収めた値にし、`resizerLabel` を指定したときだけ右端に部品『幅の区切り』（`side=right`・`label`・`min`・`max`・`step`）を描いて `onChange` で `setLeftWidth`、`onCommit` で `commitLeftWidth` を呼ぶ。900px 以下は幅を適用せず、区切りを描かない（各パネルの今の全幅のまま）。描いたときに `setOpen('left', true)`、除外したときに `setOpen('left', false)` を呼ぶ。表示の幅は `matchMedia('(min-width: 901px)')` の変化と `resize` で参照し直す"
    refs:
      - SCR-489-2#
      - SCR-489-11#
      - SCR-489-24#
    props:
      - name: resizerLabel
        type: string
        description: '幅の区切りの `aria-label`（例: 「コメントの一覧の幅」）。省くと区切りを描かず、幅だけを適用する'
        required: false
      - name: children
        type: ReactNode
        description: パネルの中身
    unit_tests:
      - name: test_left_panel_when_resized
        case: 正常
        summary: 右端の区切りで幅を変えて残す
        condition: 表示の幅 1440。区切りにフォーカスして → を 2 回押す
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 416px で、`sessionStorage` の `mindmap-left-panel-width` が `416`
      - name: test_left_panel_when_width_saved
        case: 正常
        summary: 残した幅で開く
        condition: '`sessionStorage` の `mindmap-left-panel-width` に 520 を入れて描く'
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 520px で、区切りの `aria-valuenow` が 520
      - name: test_left_panel_when_detail_open
        case: 正常
        summary: 詳細パネルを開いていれば上限から詳細パネルの幅を引く
        condition: 表示の幅 1440。ストアの `detailOpen` が真・`detailWidth` が 640 で、残した幅が 900
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 400px で、区切りの `aria-valuemax` が 400。`sessionStorage` の値は 900 のまま
      - name: test_left_panel_when_narrow
        case: 正常
        summary: 900px 以下は区切りを描かない
        condition: 表示の幅 900
        mock: '`window.innerWidth`・`matchMedia`'
        expected: '`role=separator` が無く、`aside` に `style.width` が無い'
      - name: test_left_panel_open_state
        case: 正常
        summary: 描いている間だけ開いている
        condition: 描いた後に除外する
        mock: なし
        expected: 描いた後のストアの `leftOpen` が真、除外した後は偽
      - name: test_left_panel_without_resizer
        case: 正常
        summary: resizerLabel を省くと区切りを描かず、共有した幅で開く
        condition: 表示の幅 1440。ストアの `leftWidth` が 520 で、`resizerLabel` を省いて描く
        mock: '`window.innerWidth`・`matchMedia`'
        expected: パネルの幅が 520px で、`role=separator` が無い
notes:
  単体テスト: 同じフォルダの `left-panel.test.tsx` に置く（knowledge の規約『フォルダ構成』）

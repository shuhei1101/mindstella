  - name: linkHeadings
    title: 本文の見出しのリンク
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    summary: '描いた本文の見出しに、見出しを指す名前と右の # のリンクを付け、本文の中の `#見出し` のリンクをその見出しへの移動に、`#diff=` のリンクをまとまりの知らせにする'
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: keyword
        description: '`renderMarkdown` が描いた本文'
      - name: onHeading
        type: '(slug: string) => void'
        required: true
        passing: keyword
        description: '# か `#見出し` のリンクを押したときに、その見出しの名前を知らせる（使う側が送ってハッシュの `h` を置き換える）'
      - name: onChangeSet
        type: '(id: string) => void'
        required: true
        passing: keyword
        description: 本文の `#diff=` のリンクを押したときに、`diff` の値を知らせる（空・`since`・`pending` のときは呼ばない。記録にあるまとまりかは使う側が確かめる）
    returns:
      type: void
      description: '-'
    process: |-
      1. 本文の見出し（h1〜h6）を頭から順に、文言を `headingSlug`（本文 1 つで 1 つの `seen`）で名前にして `data-heading` に持たせる
      2. 見出しの右に、読み上げの名前「見出し「{見出し}」へのリンク」の # の `a` を置き、押したら既定の動作を止めて `onHeading` を呼ぶ
      3. 本文の中の `href` が `#` で始まるリンクは、押したら既定の動作を止める（URL のハッシュを `#{文字}` に替えさせない）。`#` の後ろを `URLSearchParams` で読み、`diff` の引数を持つかで分ける
         - `diff` を持つ場合、まとまりのリンクとして扱う。値が空・`since`・`pending` でなければ `onChangeSet` をその値で呼ぶ。他の引数は読まず、見出しのリンクとしても扱わない
         - `diff` を持たない場合、`#` の後ろを `decodeURIComponent` で戻し（mdmark は日本語の `href` をパーセントエンコードして描く。戻せない文字列はそのまま）、`headingSlug` と同じ形にする。同じ名前の見出しがあれば `onHeading` を呼び、無ければ何もしない
    unit_tests:
      - name: test_link_headings
        case: 正常
        summary: '見出しに名前と # を付け、`#見出し` で知らせる'
        condition: 見出し「保存先」「決め方」「決め方」と段落の `[決め方](#決め方)`・`[無い](#無い)` を描いた本文（mdmark が描いた `href` はパーセントエンコードされた日本語）。#・段落の 2 つのリンクを押す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`data-heading` が `保存先`・`決め方`・`決め方-1`。見出しごとに # が 1 つ。押すと `onHeading` にその名前が渡り、`[決め方]`（`href` はエンコードされた `#決め方`）は `決め方`、`[無い]` は呼ばず、URL のハッシュも変わらない'
      - name: test_link_headings_when_change_set_link
        case: 正常
        summary: '`#diff=` のリンクでまとまりを知らせ、見出しとしては扱わない'
        condition: 見出し「diff=V-1」と段落の `[a](#diff=V-1)`・`[b](#tab=tasks&id=D-1&diff=V-2)`・`[c](#diff=since)`・`[d](#diff=pending)`・`[e](#diff=)` を描いた本文。段落の 5 つのリンクを押す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`onChangeSet` が `V-1`・`V-2` の順に 2 回だけ呼ばれる。`onHeading` はどのリンクでも呼ばれず、URL のハッシュも変わらない'
  - name: linkBody
    title: 本文の印と項目の ID のリンク
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    summary: 描いた本文の文中（埋め込んだ HTML の範囲の中を含む）の、用語集の用語のタイトルと別名、資料・調査のエイリアスを本文の印に、記録にある項目の ID をリンクにする。語の一致と一致の前の正規化は mdmark の `collectMatches` に任せる
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: keyword
        description: '`renderMarkdown` が描いた本文（`linkHeadings` の後）'
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引（用語は `data.terms` のタイトルと `aliases`、資料・調査は `data.docs`・`data.research` の `aliases`、ID は `byId`）
      - name: selfId
        type: string
        required: true
        passing: keyword
        description: 開いている項目の ID（その項目自身の ID にはリンクを付けず、その項目は印に当てる項目に含めない）
      - name: onOpen
        type: '(id: string) => void'
        required: true
        passing: keyword
        description: ID のリンクと、用語 1 件だけに一致した印を押したときにその項目の ID を知らせる（使う側が詳細へ移り、履歴に積む）。用語 2 件以上か、資料・調査にも一致した印では呼ばない
      - name: source
        type: string
        required: true
        passing: keyword
        description: '`root` を描いた本文の Markdown（`collectMatches` に渡す）'
    returns:
      type: void
      description: '-'
    process: |-
      1. 印に当てる語 → 一致した項目の ID の対応を作る。用語はタイトルと `aliases` の各語、資料・調査は `aliases` の各語を、前後の空白を落として用語 → 資料 → 調査の順に積む（`selfId` の項目、`withdrawn` が真の資料・調査、空の語は積まない。取り下げた用語はタイトルも別名も積む）。同じ項目の同じ語（用語のタイトルと同じ別名を含む）は 1 つにまとめる
      2. 語ごとに `{id: W-{n}, term: 語, meaning: 語}` の用語を作り（`collectMatches` は `meaning` が空の用語を照合しない）、`source` を `self.md`、語そのものを `w{n}.md` の文書にして `mdmark.collectMatches` に渡す（PR #348 の PoC 結果の最小再現コード）
      3. 語そのものの文書の一致（1 行目の 0 文字目から語の長さまで）から、正規化の後に同じになる語がまとまる先の用語を引き、まとまる先ごとに 1 の項目の ID を寄せて用語 → 資料 → 調査の順に並べる
      4. `self.md` の一致ごとに、行と文字の位置から元の語を取り、その行を持つブロック（行を含む `data-line-start` の要素。行が埋め込んだ HTML の範囲の中なら、`data-html-open` から `data-html-close` の間にその行を持つ `.mdmark-html`）の文字の中で、同じブロックの前の一致の後ろから元の語を探す。`pre`・図の入れ物・`a`・`code`・h1〜h6 の中の文字は包まない（インラインコードは 5 で当てる）。英数字だけの語は、前後が英数字のときと、後ろが `-` と数字のとき（`API-2` の `API`）は包まない
      5. インラインコード（`pre` の外の `code`）は `collectMatches` が照合しないため、中身を 1 と同じく前後の空白を落として、ちょうど語か記録にある ID のときだけ `code` ごと当てる
      6. 探し当てた箇所を、文字の色を変えない点線の下線の `a`（`class="term"`・`data-id` に先頭の項目・`data-ids` に一致した全ての項目を空白区切りで）で包む。用語 1 件だけに一致した印は `aria-describedby`、用語 2 件以上か、資料・調査にも一致した印は `aria-details` でツールチップを指す
      7. 項目の ID（`{頭文字}-{数}`）は、記録にあるものだけを等幅の印の色と下線の `a`（`class="idref"`・`data-id`、折り返さない）で包む。前後が英数字のものと `selfId` は当てない。埋め込んだ HTML の範囲の中にも当てる
      8. 包んだ要素を押したら既定の動作を止める。ID のリンクと用語 1 件だけに一致した印は `onOpen` を呼ぶ。元の行の印（`data-line-start`）と差分の印は包む前の要素に残す
    unit_tests:
      - name: test_link_body
        case: 正常
        summary: 文中の用語と ID だけに印を付ける
        condition: 用語 G-1「保存先」・G-2「保存」・G-3「AI」、検討事項 D-3・D-5 の索引。本文に見出し「保存先」、段落「保存先と AIM と AI と D-3 と `D-5` と D-99 と XD-3」、コードブロック「保存先 D-3」。`selfId` は A-1
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 段落の「保存先」が G-1 の印（「保存」に分けない）、「AI」だけが G-3 の印（「AIM」には付かない）。D-3 と `D-5` が ID のリンクで、D-99・XD-3 はリンクでない。見出しとコードブロックには印もリンクも無い。印を押すと `onOpen` に G-1、リンクを押すと D-3
      - name: test_link_body_when_self
        case: 正常
        summary: 開いている項目自身には付けない
        condition: '`selfId` が G-1 で、本文に「保存先」と「G-1」'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 「保存先」にも「G-1」にも印・リンクが無い
      - name: test_link_body_when_aliases
        case: 正常
        summary: 資料・調査のエイリアスにも印を付け、同じ語の項目を 1 つの印にまとめる
        condition: '用語 G-1「特殊効果」、エイリアス「特殊効果」を持つ資料 A-2・調査 R-1、エイリアス「エフェクト」を持つ資料 A-2、エイリアス「特殊効果」を持つ取り下げた資料 A-8 と、エイリアス「古い語」だけを持つ取り下げた資料 A-9 の索引。本文の段落「特殊効果とエフェクトと古い語」。`parametrize`: `selfId` が A-1 / A-2'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 「特殊効果」の印の `data-ids` が `G-1 A-2 R-1`、「エフェクト」が `A-2` で `aria-details` を持ち、「古い語」には印が無い。「特殊効果」の印を押しても `onOpen` が呼ばれない / `data-ids` が `G-1 R-1` で、「エフェクト」には印が無い
      - name: test_link_body_when_term_aliases
        case: 正常
        summary: 用語の別名にも印を付け、用語 2 件以上の一致はリンクを持つツールチップへ回す
        condition: '用語 G-1「移し替え」（別名「マイグレーション」「移し替え」「 」）・G-2「版の更新」（別名「移し替え」）、取り下げた用語 G-3「旧名」（別名「古い呼び方」）の索引。本文の段落「マイグレーションと移し替えと古い呼び方」。`parametrize`: `selfId` が A-1 / G-1'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 「マイグレーション」の印の `data-ids` が `G-1` で `aria-describedby` を持ち、押すと `onOpen` に G-1。「移し替え」が `G-1 G-2` で `aria-details` を持ち、押しても `onOpen` が呼ばれない。「古い呼び方」が `G-3`。空白だけの別名には印が無い / 「マイグレーション」には印が無く、「移し替え」が `G-2` で `aria-describedby` を持つ
      - name: test_link_body_when_normalized
        case: 正常
        summary: 全角半角・英字の大文字小文字・空白の違いでも一致させ、まとまる語の項目を 1 つの印に寄せる
        condition: 用語 G-1「response」・G-2「Response」・G-3「応答 時間」・G-4「API」の索引。本文の段落「ＲＥＳＰＯＮＳＥ と 応答　時間 と API-2 と API」
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 「ＲＥＳＰＯＮＳＥ」の印の `data-ids` が `G-1 G-2`、「応答　時間」が `G-3`。`API-2` の `API` には印が無く、末尾の「API」が `G-4`
      - name: test_link_body_when_embedded_html
        case: 正常
        summary: 埋め込んだ HTML の範囲の中の文にも、全ての出現に印と ID のリンクを付ける
        condition: 用語 G-1「応答時間」と資料 A-2 の索引。本文に「応答時間」を持つ段落を 2 つと、「ﾋﾟｰｸ時の応答時間 」と `A-2` を含む段落を持つ `<!-- html -->` の範囲。`selfId` は A-1
        mock: 描画のライブラリの配信元（`page.route`）
        expected: G-1 の印が 3 つ（範囲の外の 2 つと範囲の中の 1 つ）。範囲の中の `A-2` が ID のリンクで、押すと `onOpen` に A-2
      - name: test_link_body_when_inline_code
        case: 正常
        summary: インラインコードの中の文字には一致を当てず、中身がちょうど語のときだけ `code` ごと印にする
        condition: '用語 G-1「保存先」の索引。`parametrize`: 本文の段落「`保存先` と保存先」 / 本文の段落「`docs/保存先.md` と保存先」。`selfId` は A-1'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: G-1 の印が 2 つで、1 つは `code` ごと、もう 1 つは後ろの「保存先」 / G-1 の印が後ろの「保存先」の 1 つだけで、`code` の中に `a` が無い
  - name: renderValue
    title: 値を描く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    summary: 項目の文字列の値の Markdown を、段落の中の改行も改行にして mdmark で描いた要素にする。mdmark が読めないときは、改行を残した文字のままの要素にする
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 値の文字列
    returns:
      type: HTMLElement
      description: '`class="md md-value mdmark"` の要素。読めないときは渡した文字列を文字として持つ `class="md-value-raw"` の `span`（`white-space: pre-wrap` で改行を改行として出す）'
    process: |-
      1. mdmark が読めたか確かめる（`missingLibraries`）
         - 読めていない場合、渡した文字列を文字として持つ `span.md-value-raw` を返す（知らせは出さない。本文の `renderMarkdown` が出す）
      2. 段落の中の改行を強制改行にした Markdown（`withHardBreaks`）を、`mdmark.mount` に `config.features` の `MDMARK_FEATURES` を渡して描き、`br` の直後の改行の文字（`renderMarkdown` の処理 2 と同じ理由）と `data-source-line` を外す（`data-line-start` は付けず、mermaid のコードブロックも図にしない）
      3. `.mdmark-html` の外のコードブロックの `pre` に、`renderMarkdown` の処理 7 と同じ属性を付ける
    unit_tests:
      - name: test_render_value
        case: 正常
        summary: 値の Markdown を描き、スクリプトを動かさない
        condition: '`**強調** <img src=x onerror="window.__x=1"> <script>window.__x=2</script>` と箇条書き 2 行を渡す'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`strong` と `li` 2 つを持つ `.md-value` の要素。`onerror` と `script` が無く、`window.__x` が未定義。どの要素も `data-line-start`・`data-source-line` を持たない'
      - name: test_render_value_when_line_break_in_paragraph
        case: 正常
        summary: 段落の中の 1 つの改行を改行にし、空行の段落は分けたままにする
        condition: '`1 行目\n2 行目\n\n3 行目` を渡す'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`.md-value` の要素が `p` を 2 つ持ち、1 つ目の `p` が `1 行目`・`br`・`2 行目` の順で並び、2 つ目の `p` が `3 行目`'
      - name: test_render_value_when_library_missing
        case: 正常
        summary: ライブラリが読めなければ、改行を残した文字のままの要素を返す
        condition: mdmark の配信元を止める。`**強調**\n2 行目` を渡す
        mock: 描画のライブラリの配信元（`page.route` で 404）
        expected: 戻り値が `span.md-value-raw` で、文字が `**強調**\n2 行目`、子の要素を持たない
      - name: test_render_value_when_code_block
        case: 正常
        summary: 値のコードブロックの pre をフォーカスできる要素にする
        condition: 段落と言語指定 `json` のコードブロックを持つ値を渡す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`.md-value` の中の `pre` が `tabindex="0"`・`aria-label="コード: json"` を持ち、`role` を持たない'
  - name: htmlSelectionLocation
    title: HTML の本文で選んだ範囲の箇所
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 選んだ箇所へコメントする
    kind: 関数
    scope: public
    summary: HTML の本文の枠の中で選んだ範囲を、元の HTML の行の範囲の箇所にする（部品『HTMLの本文の枠』の「選び終えた」が使う）
    status: implemented
    introduced:
      pr: 214
    args:
      - name: range
        type: Range
        required: true
        passing: positional
        description: 枠の文書の中の選んだ範囲
      - name: source
        type: string
        required: true
        passing: positional
        description: 本文の原文（`<pre>`・`<textarea>`・`<listing>` の開きタグの直後に改行があるかを確かめる）
    returns:
      type: Location | null
      description: '`{kind: body, start, end, text}`（`text` は `range.toString()` の前後の空白を除いたもの）。空の選択・端より前に `data-line` を持つ要素が無い選択は `null`'
    process: |-
      1. 空の選択か、文が空白だけなら `null`
      2. 始点と終点それぞれについて、文書の順で端より前にある `data-line` を持つ要素のうち最も後のものを引く（無ければ `null`）
      3. その要素の開きタグの直後から端までの文とコメントの中の改行の数を、その要素の `data-line` に足す（`<br>` は数えない）。その要素が `pre`・`textarea`・`listing` で、原文のその行の開きタグの直後に改行があれば 1 を足す
      4. `{kind: body, start, end, text}` を返す
    unit_tests:
      - name: test_html_selection_location
        case: 正常
        summary: 選んだ端を元の HTML の行にする
        condition: 'PoC #215 の 12 ケースと、`parametrize`: 入れ子の `<span` が 2 行にまたがった後の 3 行目の文 / `<p>a<br>別の文</p>` の `別の文` / `<pre>` の直後の改行の次の行の文 / 前に複数行のコメントを持つ段落の文'
        expected: 各ケースの元の行の範囲。順に 3 / 段落の行（`<br>` を数えない）/ `<pre>` の次の行 / 段落の行
        mock: なし（印を足した HTML はサーバーの `mark_lines` と同じ形をテストの中で作る）
      - name: test_html_selection_location_when_outside
        case: 正常
        summary: 印の無い範囲と空の選択は null
        condition: '`parametrize`: 空の選択 / 空白だけの選択 / 印を持つ要素より前の `body` 直下の文'
        expected: どれも `null`
        mock: なし
  - name: htmlLinkAction
    title: HTML の本文のリンクの扱い
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    kind: 関数
    scope: public
    summary: HTML の本文の枠の中のリンクの `href` から、新しいタブで開く・本文の中の場所まで送る・何もしないのどれかを決める（部品『HTMLの本文の枠』が押下を受けたときに使う）
    status: implemented
    introduced:
      pr: 243
    args:
      - name: href
        type: string
        required: true
        passing: positional
        description: 押されたリンクの `href` の属性の値（ブラウザが解いた URL ではなく、書かれたままの値）
    returns:
      type: HtmlLinkAction
      description: '`{kind: "open", url}`（新しいタブで開く URL）/ `{kind: "anchor", id}`（送る先の要素の `id`）/ `{kind: "none"}`（何もしない）のどれか。型 `HtmlLinkAction` は同じファイルで export する'
    process: |-
      1. 前後の空白を除く
      2. `#` で始まるとき、`#` の後ろを `decodeURIComponent` で戻す（戻せなければそのまま使う）。空なら `{kind: "none"}`、空でなければ `{kind: "anchor", id}`
      3. `new URL(href)` が読めない（相対の URL）とき、`{kind: "none"}`
      4. スキームが `HTML_LINK_OPEN_SCHEMES` にあるとき、`{kind: "open", url}`（`url` は読んだ URL の `href`）
      5. それ以外は `{kind: "none"}`
    unit_tests:
      - name: test_html_link_action_when_open
        case: 正常
        summary: 絶対の http・https・mailto の URL は開く
        condition: '`parametrize`: `https://example.com/a?b=1#c` / `http://127.0.0.1:8000/` / `HTTPS://EXAMPLE.COM/` / `mailto:a@example.com` / 前後に空白を持つ `  https://example.com/  `'
        expected: どれも `kind` が `open` で、`url` が読んだ URL の `href`（順に `https://example.com/a?b=1#c` / `http://127.0.0.1:8000/` / `https://example.com/` / `mailto:a@example.com` / `https://example.com/`）
        mock: なし
      - name: test_html_link_action_when_anchor
        case: 正常
        summary: '# で始まる値は、戻した id へ送る'
        condition: '`parametrize`: `#usage` / `#%E4%BD%BF%E3%81%84%E6%96%B9` / `#100%`（戻せない）/ `#`'
        expected: '順に `{kind: anchor, id: usage}` / `{kind: anchor, id: 使い方}` / `{kind: anchor, id: 100%}` / `{kind: none}`'
        mock: なし
      - name: test_html_link_action_when_none
        case: 正常
        summary: 相対の URL とほかのスキームは何もしない
        condition: '`parametrize`: `other.html` / `/mindstella.html` / `//example.com/a` / `?a=1` / 空文字 / `javascript:alert(1)` / `JaVaScRiPt:alert(1)` / `data:text/html,x` / `file:///etc/hosts` / `ftp://example.com/` / `blob:https://example.com/x`'
        expected: 'どれも `{kind: none}`'
        mock: なし
  - name: loadMdmark
    title: mdmark の読み込み
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 共通
    summary: mdmark の JavaScript を読み、読めたらグローバルの `mdmark` に置く
    kind: 関数
    scope: public
    is_async: true
    side_effects: グローバルの `mdmark` を置く
    returns:
      type: Promise<void>
      description: 読み終えたか、読めないと分かったら解決する（読めなくても拒否しない）
    process: |-
      1. 雛形に `#mindmap-mdmark`（配る書き出しが中身を入れた要素）がある場合、その中身を `type: "text/javascript"` の Blob にした URL を `import()` で読み、読み終えたら URL を `URL.revokeObjectURL` で捨てる
      2. 無い場合（サーバーの配信）、雛形の import map（`script[type="importmap"]`）の `integrity` のただ 1 つのキーの URL を `import()` で読む（ブラウザが import map の `integrity` で中身を確かめる）
         - import map が無いか読めない、または `import()` が拒否された場合、グローバルの `mdmark` を置かずに解決する（読めなかったことは `missingLibraries` が伝える）
      3. 読んだモジュールをグローバルの `mdmark` に置く
    unit_tests:
      - name: test_load_mdmark
        case: 正常
        summary: サーバーの配信と配る書き出しのどちらでも読み、グローバルに置く
        condition: '`parametrize`: import map に外部ライブラリの設計書の mdmark の URL と `integrity` を持つページ / `#mindmap-mdmark` に配布物の中身を持ち import map を持たないページ'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 解決した後、`window.mdmark.version()` が `v0.8.0` で、`missingLibraries(["mdmark"])` が空
      - name: test_load_mdmark_when_unavailable
        case: 正常
        summary: 読めなければ拒否せず、グローバルを置かない
        condition: '`parametrize`: 配信元が 404 を返す / import map の `integrity` が配布物と違う値'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 拒否せずに解決し、`window.mdmark` が無く、`missingLibraries(["mdmark"])` が `["mdmark"]`
    status: planned
  - name: withHardBreaks
    title: 段落の中の改行を強制改行にする
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 共通
    summary: フェンスと字下げのコードの外で、次の行が空行でない行の末尾に空白 2 つを足した Markdown を返す（mdmark は `breaks` を持たないため、段落の中の 1 つの改行を `br` にするのに使う）
    kind: 関数
    scope: public
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: Markdown
    returns:
      type: string
      description: 行の数を変えない Markdown
    process: |-
      1. 行を頭から見て、フェンスの行とその中の行をそのまま残す。フェンスの開始は `renderMarkdown` と同じく、行頭の空白・引用の `>`・リストのマーカーを除いた先が ```` ``` ```` か `~~~` で始まる行で、同じく除いた先に同じ記号が同じ数以上並ぶ行で閉じる
      2. 字下げのコードの行（直前が空行か字下げのコードの行で、4 つ以上の空白かタブで始まる行）もそのまま残す（リストの項目の中の字下げした段落も区別せずに残す）
      3. Alert の種類の行（引用の `>` を除いた先が `[!{英字}]` だけで、後ろに `-` を許す行）もそのまま残す（mdmark は種類の行の後ろが `softbreak` でないと囲みにしない）
      4. それ以外の行は、次の行があり、次の行が空白だけの行でなければ、末尾に空白 2 つを足す
    unit_tests:
      - name: test_with_hard_breaks
        case: 正常
        summary: 段落の中の行だけに空白を足し、フェンスの中は変えない
        condition: '`parametrize`: `1 行目\n2 行目\n\n3 行目` / ```` ```\na\nb\n```\nc ```` / ```` > ```js\n> a\n> ```\n- ```js\n  b\n  ``` ```` / `p\n\n    a\n    b\n\nq` / `> [!NOTE]\n> a\n> b`'
        mock: なし
        expected: '`1 行目  \n2 行目\n\n3 行目` / 入力のまま（閉じる行もフェンスの行として空白を足さない） / 入力のまま（引用・リストの中のフェンスの行と中身に空白を足さない。最後の閉じる行は次の行が無い） / 入力のまま（字下げのコードの行に空白を足さない） / `> [!NOTE]\n> a  \n> b`（Alert の種類の行には空白を足さない）'
    status: planned
  - name: embeddedHtmlRanges
    title: 埋め込んだ HTML の範囲の行
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 共通
    summary: Markdown の本文の中の `<!-- html -->` 〜 `<!-- /html -->` の範囲を、本文の中の並びの順に印の行で返す（範囲の行の持たせ方・範囲の差分の対・Markdown のエクスポートが使う）
    kind: 関数
    scope: public
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 本文の Markdown
    returns:
      type: 'Array<{open: number, close: number}>'
      description: 範囲ごとの `<!-- html -->` の行（`open`）と `<!-- /html -->` の行（`close`）。どちらも 1 始まり
    process: |-
      1. 行を頭から見て、フェンスの行とその中の行は飛ばす（フェンスの開始と閉じは `withHardBreaks` と同じ判定）
      2. 前後の空白を除いた行が `<!--`・`html`・`-->` だけでできた行（間の空白は許す）を範囲の始まり、その後で最初の同じく `<!--`・`/html`・`-->` だけでできた行を終わりにする
      3. 終わりの行が無い始まりは範囲にしない（mdmark も範囲として描かない）
    unit_tests:
      - name: test_embedded_html_ranges
        case: 正常
        summary: 範囲の印の行を並びの順に返す
        condition: '`parametrize`: `a\n<!-- html -->\n<p>x</p>\n<!-- /html -->` / 範囲 2 つと、その間のフェンスの中の `<!-- html -->` / `<!--html-->` と `  <!--  /html  -->` / 閉じていない `<!-- html -->`'
        mock: なし
        expected: '`[{open: 2, close: 4}]` / 範囲 2 つだけ（フェンスの中は範囲にしない） / 範囲 1 つ / `[]`'
    status: planned
    introduced:
      pr: 348
  - name: relabelParamCopy
    title: 今の値をコピーするボタンの文言の差し替え
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    summary: mdmark が描いた部品の今の値をコピーするボタンの文言を `MDMARK_PARAM_COPY_LABEL` に替える（mdmark v0.8.0 は文言を「今の値を写す」に固定しているための付け替え口。mdmark が文言の設定を持ったら、その設定で渡す形に替える）
    kind: 関数
    scope: public
    side_effects: '`root` の中のボタンの文字を書き換え、`root` に `MutationObserver` を付ける'
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: positional
        description: mdmark が描いた本文
    returns:
      type: void
      description: '-'
    process: |-
      1. `root` の中の `button.mdmark-param-copy` ごとに、アイコンの要素を残して文字のノードだけを `MDMARK_PARAM_COPY_LABEL` に置き換える（文言が同じボタンは触らない）
      2. 部品が描き直したボタンにも当てるため、`root` の子孫の追加を `MutationObserver` で見張り、足されたボタンに 1 を当てる（同じ `root` に 2 回当てても見張りを重ねない）
    unit_tests:
      - name: test_relabel_param_copy

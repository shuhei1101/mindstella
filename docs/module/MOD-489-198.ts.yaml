    returns:
      type: string
      description: 前後の空白を除き、間の空白の並びを `-` 1 つにした形。同じ形の 2 つ目から `-1`・`-2` を続ける
    unit_tests:
      - name: test_heading_slug
        case: 正常
        summary: 空白を - にし、同じ文言に番号を続ける
        condition: 同じ `seen` で「 保存先 」「決め 方」「決め 方」「決め 方」の順に呼ぶ

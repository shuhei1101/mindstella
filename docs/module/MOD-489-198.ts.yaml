  - name: renderMarkdown
    title: 本文を描く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    summary: 本文の Markdown を mdmark で描いた要素にする（mdmark が描くときに無害化する）。ブロックに元の行の印を付け、mermaid のコードブロックは図の入れ物に、`html` のコードブロックは HTML の本文の枠の入れ物に置き換え、表は横に送れる要素で包み、コードブロックはフォーカスできる要素にする
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 本文の Markdown
    returns:
      type: HTMLElement
      description: 描いた本文（class `mdmark`）。mdmark が読めないときは、`libraryNotice` と原文の `pre` を持つ要素
    process: |-
      1. mdmark が読めたか確かめる（`missingLibraries`）
         - 読めていない場合、知らせと原文を返す（本文に mermaid のコードブロックがあり mermaid も読めていなければ名前に足す）
      2. `div` を作り、`mdmark.mount` に本文と `config.features` の `MDMARK_FEATURES` を渡して描く（描き直しは要素ごと作り直すので、返った `update`・`destroy` は使わない）。描いた後、`br` の直後の改行の文字を外す（mdmark は強制改行を `br` と改行の文字で描き、`selectionLocation` は改行の文字と `br` の両方を行として数えるため）。続けて `relabelParamCopy` を当てる
      3. mdmark が付けた `data-source-line`（0 始まりのブロックの開始行）を、元の行の印 `data-line-start`（1 始まり）に読み替える（PoC #80 の対応づけ。読み替えは PR #342 の PoC 結果）
         - 見出し・段落・リストの項目・表の行・`pre` は、値に 1 を足した `data-line-start` を付ける。フェンスのコードの `pre` は 2 を足す（中身の最初の行）。フェンスかは、原文のその行から行頭の空白・引用の `>`・リストのマーカーを除いた先が ```` ``` ```` か `~~~` で始まるかで判定する（`/^(?:[ \t]*(?:>|[-*+]|\d+[.)])[ \t]?)*[ \t]*(```|~~~)/`。PR #342 の PoC 結果）
         - 段落を持つリストの項目は中の段落に任せ、項目には付けない。リスト・表・引用・区切り線にも付けない
         - 読み替えた後、全ての `data-source-line` を外す
         - 埋め込んだ HTML の範囲（`.mdmark-html`）は `data-source-line` を持たないため、本文の中で n 番目の範囲に、`embeddedHtmlRanges` の n 番目の `open` を `data-html-open`、`close` を `data-html-close` で持たせる（範囲の中の要素には `data-line-start` を付けない）
      4. `.mdmark-html` の外の `language-mermaid` のコードブロックを、原文を `data-source` に持つ図の入れ物に `pre` ごと置き換える（入れ物には `data-line-start` を付けない。描くのは `renderDiagrams`）
      5. `.mdmark-html` の外の `language-html` のコードブロックを、原文を `data-source` に持ち `pre` の `data-line-start` を残した HTML の本文の枠の入れ物（`.html-block`）に `pre` ごと置き換える（描くのは使う側が部品『HTMLの本文の枠』で、`selectable` は偽）
      6. `.mdmark-html` の外の表（`table`）を 1 つずつ、表の中だけで横に送る入れ物（`div.md-table-wrap`、`tabindex="0"`・`role="group"`・`aria-label="本文の表"`）で包む（範囲の中の表は書いた HTML のまま包まない）。表の行の `data-line-start` は表に残し、入れ物には付けない（画面設計『詳細パネル』の本文。本文の差分の部品が描く本文とスレッドの書き込みも同じ）
      7. `.mdmark-html` の外の、処理 4・5 で置き換えずに残ったコードブロックの `pre`（子に `code` を持つ `pre`）のうち、`tabindex` を持たないもの（mdmark の `fence` の規則を通らない字下げのコードブロック）に、`tabindex="0"`・`aria-label="コード"` を付ける（部品設計『Markdownの本文』。mdmark がフェンスのコードブロックに付けた `tabindex="0"`・`aria-label="コード: {言語}"` は残す。範囲の中の `pre` は書いた HTML のまま付けない）
    unit_tests:
      - name: test_render_markdown
        case: 正常
        summary: mdmark で無害化して描き、図の入れ物を作る
        condition: 見出し・表・`<img src=x onerror=alert(1)>`・`<script>window.__x=1</script>`・mermaid のコードブロックを持つ本文。mdmark はリポジトリの外部ライブラリの設計書の版を `page.route` で返し、`loadMdmark` で読む
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 要素が class `mdmark` を持ち、`h1`・`table` があり、`onerror` と `script` が無く `window.__x` が未定義。図の入れ物が 1 つで `data-source` に原文。`data-source-line` を持つ要素が無い
      - name: test_render_markdown_when_library_missing
        case: 正常
        summary: ライブラリが無ければ知らせと原文
        condition: mdmark・mermaid を読まない。本文に mermaid のコードブロック
        mock: なし
        expected: '`role="alert"` に `mdmark`・`mermaid`、`pre` に原文'
      - name: test_render_markdown_when_line_marks
        case: 正常
        summary: ブロックに元の行の印を付ける
        condition: 見出し（1 行目）・段落（3 行目）・入れ子のリスト・段落を持つリストの項目・表・フェンスのコード（行頭から・2 個の空白で字下げ・引用の中の `> ```js`・リストの中の `- ```js` と `1. ```js`・入れ子のリストの中）・字下げのコード・mermaid のコードブロックを持つ本文
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`h1` の `data-line-start` が 1、段落が 3、リストの項目・表の各行・フェンスのコード（中身の最初の行）・字下げのコード（最初の行）が PoC #80 の対応づけどおり。段落を持つリストの項目は中の段落だけが持ち、`ul`・`table`・図の入れ物は持たない。`data-source-line` を持つ要素が無い'
      - name: test_render_markdown_when_html_code_block
        case: 正常
        summary: html のコードブロックを枠の入れ物にし、前後は今までどおり描く
        condition: 見出し・段落の間に、`<p>a</p><script>x()</script>` を持つ言語指定 `html` のコードブロックを 1 つ持つ本文
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`.html-block` が 1 つで `data-source` に原文、`pre` にコードとしては出ない。見出し・段落の `data-line-start` はコードブロックが無いときと同じ数え方'
      - name: test_render_markdown_when_table
        case: 正常
        summary: 表を横に送れる入れ物で包み、行の印を変えない
        condition: '`parametrize`: 段落の後に表を 2 つ持つ本文 / 範囲の外の表と、`<!-- html -->` の範囲の中の表を持つ本文'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`table` が 2 つとも `.md-table-wrap` の直下にあり、入れ物は `tabindex="0"`・`role="group"`・`aria-label="本文の表"` を持ち `data-line-start` を持たない。表の各行の `data-line-start` は包まないときと同じ。段落は包まない / 範囲の外の表だけが `.md-table-wrap` の直下にあり、範囲の中の表は `.md-table-wrap` の中に無い'
      - name: test_render_markdown_when_embedded_html
        case: 正常
        summary: 埋め込んだ HTML を本文の中に描き、範囲に元の行を持たせる
        condition: 段落（1 行目）・`<!-- html -->` の範囲（3〜9 行目。段落・`<mdmark-chart>`・`<mdmark-param>`・`<script>window.__x=1</script>`・`onclick` を持つボタン）・段落（11 行目）・言語指定 `html` のコードブロックを持つ本文
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`.mdmark-html` が 1 つで `data-html-open` が 3、`data-html-close` が 9。範囲の中に `data-line-start` を持つ要素が無く、`script` と `onclick` が無く `window.__x` が未定義。前後の段落の `data-line-start` が 1 と 11。範囲の外の `html` のコードブロックだけが `.html-block` になる。今の値をコピーするボタンの文字が `MDMARK_PARAM_COPY_LABEL`'
      - name: test_render_markdown_when_code_block
        case: 正常
        summary: コードブロックの pre をフォーカスできる要素にする
        condition: 言語指定 `json` のコードブロック・言語指定の無いコードブロック・字下げのコードブロック・mermaid のコードブロックと、`<!-- html -->` の範囲の中の `<pre><code>` を持つ本文
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '範囲の外の 3 つのコードブロックの `pre` が `tabindex="0"` を持ち、`aria-label` は順に mdmark が付けた `コード: json`・`コード` と、字下げのコードブロックに付けた `コード`。`role` は持たず、`data-line-start` は付けないときと同じ。図の入れ物の `pre.dg-raw` と範囲の中の `pre` は `tabindex` を持たない'
  - name: renderDiagrams
    title: 図を描く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    is_async: true
    summary: 要素の中の図の入れ物を mermaid で SVG に描く。直前の呼び出しで描いた同じ記法の図は描き直さずに写す
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: positional
        description: '`renderMarkdown` の戻り値'
    returns:
      type: Promise<void>
      description: 全て描き終えたら解決する
    process: |-
      1. mermaid が読めていない場合、各入れ物に知らせ（`libraryNotice({names: ["mermaid"], what: "図"})`）と原文を入れる
      2. 初めて描くときに `mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: "base"})` を呼ぶ
         - テーマが変わって初期化し直したときは、覚えた SVG を捨てる
      3. 入れ物ごとに `mermaid.render` した SVG を入れる
         - 描けなかった場合、その入れ物に「この図は表示できませんでした。原文を表示します。」と原文を入れる（ほかの図は続ける）
         - 直前の呼び出しで描いた同じ記法の SVG を覚えていれば、`mermaid.render` を呼ばずにそれを写す。写すときは新しい図の ID を振り、SVG の中の元の ID（後ろに数字が続かないもの）を全て新しい ID に置き換える（同じ図が文書に 2 つあっても ID と参照が重ならない）
      4. この呼び出しで描いた・写した図の記法と SVG（印を付ける前の mermaid の出力）だけを覚え、それまで覚えていたものは捨てる。描けなかった図は覚えない
    unit_tests:
      - name: test_render_diagrams
        case: 正常
        summary: 図を SVG に描き、描けない図は原文を残す
        condition: 正しいフローチャートと、構文の誤った図の入れ物。mermaid は `page.route` で返す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 1 つ目に `svg`、2 つ目に「この図は表示できませんでした。原文を表示します。」と原文
      - name: test_render_diagrams_when_same_source_again
        case: 正常
        summary: 直前に描いた同じ記法の図は描き直さず、新しい ID で写す
        condition: 同じフローチャートの入れ物を持つ 2 つの要素を順に `renderDiagrams` で描く。`mermaid.render` を数える包みを `page.evaluate` で被せる
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`mermaid.render` の呼び出しは 1 回。2 つの SVG の `id` は異なり、2 つ目の SVG の中に 1 つ目の `id` が残らない'
      - name: test_render_diagrams_when_source_not_in_last_call
        case: 正常
        summary: 覚えるのは直前の呼び出しの図だけで、その前の図は描き直す
        condition: 図 A、図 B、図 A の入れ物を持つ要素を 1 つずつ順に `renderDiagrams` で描く。`mermaid.render` を数える包みを被せる
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`mermaid.render` の呼び出しは 3 回'
      - name: test_render_diagrams_when_theme_changed
        case: 正常
        summary: テーマが変わったら、同じ記法の図も描き直す
        condition: フローチャートを描いた後、`--surface` の値を変えて同じフローチャートの入れ物を描く。`mermaid.render` を数える包みを被せる
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`mermaid.render` の呼び出しは 2 回'
  - name: selectionLocation
    title: 選んだ範囲の箇所
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 選んだ箇所へコメントする
    scope: public
    summary: 選んだ範囲を、本文なら元の Markdown の行の範囲、値ならキーのパスの箇所にする。本文と値の外は `null`
    args:
      - name: range
        type: Range
        required: true
        passing: positional
        description: 選んだ範囲
    returns:
      type: Location | null
      description: 箇所（`text` は `range.toString()` の前後の空白を除いたもの）。空の選択・本文と値の外・本文と値をまたぐ選択・異なる値をまたぐ選択は `null`
    process: |-
      1. 空の選択か、文が空白だけなら `null`
      2. 始点と終点から `[data-key]` を持つ最も近い祖先を引き、どちらも同じ要素なら `{kind: value, key}` を返す
      3. 端が埋め込んだ HTML の範囲（`.mdmark-html`）の中にあるときは、始点は範囲の `data-html-open`、終点は範囲の `data-html-close` の行にする
      4. それ以外の端は、始点と終点から `.md` の中で `data-line-start` を持つ最も近い祖先を引き（無ければ `null`）、祖先の先頭から端までを `cloneContents` した中の `\n` の数と `br` の数を印の行に足す（表の行は数えない。PoC #80 の `selectionLines`）
      5. `{kind: body, start, end, text}` を返す
    unit_tests:
      - name: test_selection_location
        case: 正常
        summary: 本文の行の範囲と値のキーを求める
        condition: 'PoC #80 の選択のケース 19 件（見出し・段落・入れ子の項目・番号付きリスト・表・コード・引用・ソフト改行・ハードブレイク・ブロックをまたぐ選択）と、`data-key="options[B].cons"` の値の中の選択。差分の表示の間に、消した部分の後ろの段落を選んだとき'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '本文は各ケースの元の行の範囲（差分の表示の間は今の本文の行）。値は `{kind: value, key: options[B].cons, text}`'
      - name: test_selection_location_when_outside
        case: 正常
        summary: 本文と値の外は null
        condition: '`parametrize`: 空の選択 / 見出しの帯 / 関係する項目 / 図の SVG / 図の Raw の原文 / 本文から値へまたぐ選択 / 差分の表示の間の消した部分 / 消した部分と今の部分をまたぐ選択'
        mock: なし
        expected: どれも `null`
      - name: test_selection_location_when_embedded_html
        case: 正常
        summary: 埋め込んだ HTML の範囲の中の端を、範囲の印の行に読み替える
        condition: '段落（1 行目）・範囲 2 つ（3〜6 行目・8〜11 行目）・段落（13 行目）を持つ本文。`parametrize`: 2 つ目の範囲の中の段落の文だけ / 1 行目の段落から 1 つ目の範囲の中まで / 2 つ目の範囲の中から 13 行目の段落まで'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`start: 8, end: 11` / `start: 1, end: 6` / `start: 8, end: 13`'
  - name: renderDiagramSvg
    title: 図を画面に出さずに描く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 前回からの差分を見る
    scope: public
    is_async: true
    summary: 記法を mermaid で SVG に描いて返す（画面には出さない）。差分の表示で前の版の図を描く
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 図の記法
    returns:
      type: Promise<SVGElement | null>
      description: 描いた SVG。mermaid が読めていないか、描けないときは `null`
    process: |-
      1. mermaid が読めていない場合、`null` を返す
      2. `renderDiagrams` と同じく、初めて描くとき（とテーマが変わったとき）に初期化する
      3. 新しい図の ID で `mermaid.render` し、SVG の要素にして返す（`renderDiagrams` の覚えた SVG は使わず、覚えもしない）
         - 描けなかった場合、mermaid が `body` に残した作業用の要素を消して `null` を返す
    unit_tests:
      - name: test_render_diagram_svg
        case: 正常
        summary: 記法を SVG の要素にして返し、描けない記法は null を返す
        condition: 正しいフローチャートと、構文の誤った記法をそれぞれ渡す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 1 つ目は `svg` の要素、2 つ目は `null` で、`body` に作業用の要素が残らない
  - name: headingSlug

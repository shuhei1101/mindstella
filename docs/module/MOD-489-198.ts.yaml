        condition: キー `rps` の `<mdmark-param>` を持つ範囲を `renderMarkdown` で描き、スライダーを矢印キーで動かしてからボタンを押す
        mock: 描画のライブラリの配信元（`page.route`）・`navigator.clipboard.writeText`
        expected: '動かす前と後のどちらも、ボタンの文字が「今の値をコピー」でアイコンの `svg` を 1 つ持つ。クリップボードに `{"rps": {"name": ..., "value": ...}}` の JSON が入る'
    status: planned
    introduced:
      pr: 348

id: MOD-489-136
title: プレビュー / connection-store
lead: 書き換えの通知がつながっているか（インターフェース定義『プレビューを開く』の制約「接続の状態」）。
stores:
  - name: useConnectionStore
    title: 接続の状態
    container: frontend/src/shared/stores/connection-store.ts
    usecase: プレビューを開く
    summary: 書き換えの通知がつながっているか（インターフェース定義『プレビューを開く』の制約「接続の状態」）
    state:
      - name: connection
        type: '''online'' | ''offline'''
        initial: online
        description: トップバーの `connection` に渡す
      - name: refreshing
        type: boolean
        initial: 'false'
        description: 更新のボタンで接続し直している間か。トップバーの `refreshing` に渡す
    actions:
      - name: setConnection
        title: 接続の状態の書き換え
        kind: メソッド
        summary: 接続の状態を書き換える
        args:
          - name: connection
            type: '''online'' | ''offline'''
            required: true
            description: 新しい状態
        returns:
          type: void
          description: '-'
        unit_tests:
          - name: test_set_connection
            case: 正常
            summary: 書き換える
            condition: offline を渡す
            mock: なし
            expected: '`connection` が offline'
      - name: setRefreshing
        title: 接続し直しの状態の書き換え
        kind: メソッド
        summary: 接続し直している間かを書き換える
        args:
          - name: refreshing
            type: boolean
            required: true
            description: 新しい状態
        returns:
          type: void
          description: '-'
        unit_tests:
          - name: test_set_refreshing
            case: 正常
            summary: 書き換える
            condition: true を渡す
            mock: なし
            expected: '`refreshing` が true'
notes:
  単体テスト: 同じフォルダの `connection-store.test.ts` に置く（knowledge の規約『フォルダ構成』）

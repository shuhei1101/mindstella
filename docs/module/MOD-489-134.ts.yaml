id: MOD-489-134
title: プレビュー / use-voice-input
lead: 文字起こしの可否の query と、コメント・返信の入力の録音・文字起こし・すぐ送るをまとめて、部品へ渡す音声入力の props を返す。
functions:
  - name: useTranscriptionStatus
    title: 文字起こしの可否
    kind: フック
    usecase: 音声でコメントする
    summary: '`GET /api/transcription` の query。マイクのボタンを描く画面と設定の画面が開いたときに読み、押せないマイクのボタンを押したときと設定の画面を開いたときに読み直す（書き換えの知らせでは読み直さない）'
    returns:
      type: UseQueryResult<TranscriptionStatus>
      description: query
    unit_tests:
      - name: test_use_transcription_status
        case: 正常
        summary: 可否を読む
        condition: '200・`{available: false, reason: stopped}`'
        mock: MSW
        expected: '`data.reason` が `stopped`'
    container: frontend/src/shared/hooks/use-voice-input.ts
  - name: useVoiceInput
    title: 音声入力
    kind: フック
    usecase: 音声でコメントする
    summary: 入力欄の識別（`key`）・向けた先・開く画面・トップバーに出す名前と入力欄の中身の書き換えを受け、`useVoiceStore` の自分の `key` の分を購読して `voice`・`voiceReason`・`elapsed`・`levels` と `onVoiceStart`・`onVoiceCancel`・`onVoiceDone`・`onVoiceBlocked` を返す。録音は画面で同時に 1 つで、ほかの入力が録っている間は `voice` を `disabled`（`VOICE_TEXT.busy`）にする
    description: |-
      - `voice` は、`micSupported()` が偽なら `disabled`（`VOICE_TEXT.noMicrophone`）、可否の `available` が偽なら `disabled`（`detail`）、`session` がほかの `key` なら `disabled`（`VOICE_TEXT.busy`）、自分の `key` なら `session.phase`、それ以外は `idle`
      - `onVoiceStart` は `startVoice`、`onVoiceCancel` は `cancelVoice` を呼ぶ。`elapsed`・`levels` は `session` から読む
      - `onVoiceDone` は、記録の `settings.transcription.action`（無ければ `review`）と、部品が付いているかを返す関数で `finishVoice` を呼ぶ。部品が付いていれば結果を写し、`reviewed` は中身を空にしてレビュー中を読み直し、`sent` は中身を空にしてスレッドを読み直し（`entered`）、`inserted` は中身を書き換え、`failed` は中身を残して `detail` を出す
      - 503 は可否の query のデータを返った `reason`・`detail` に書き換え、`voice` を `disabled` にする
      - 使う部品が外れても（unmount）・向けた先が変わっても録音と文字起こしは止めない。部品が付いたとき（mount）は `takeVoiceResult(key)` の結果があれば写す
    returns:
      type: '{voice, voiceReason, elapsed, levels, status, detail, entered, onVoiceStart, onVoiceCancel, onVoiceDone, onVoiceBlocked}'
      description: 部品設計『コメントの入力.tsx』『返信の入力.tsx』の音声入力の props
    unit_tests:
      - name: test_use_voice_input
        case: 正常
        summary: 録音して挙動で分ける
        condition: '偽の録音。`POST /api/transcriptions` が `{text: 案 A にする}`。`settings.transcription.action` が `insert` / 無い（`review`）/ `send`'
        mock: MSW と `vi.stubGlobal`
        expected: '中身が `確認: 案 A にする` で `status` が `inserted`、`send-now` は呼ばれない / `POST /api/comments` が全文で 1 回呼ばれ、中身が空で `status` が `reviewed` / `send-now` が全文で 1 回呼ばれ、中身が空で `status` が `sent`'
      - name: test_use_voice_input_when_unavailable
        case: 異常
        summary: 押せない理由と 503
        condition: '`micSupported()` が偽 / `POST /api/transcriptions` が 503・`reason: unsupported`'
        mock: MSW と `vi.stubGlobal`
        expected: '`voice` が `disabled` で `voiceReason` が `VOICE_TEXT.noMicrophone` / `voice` が `disabled` で `voiceReason` がその `detail`'
      - name: test_use_voice_input_when_unmounted
        case: 正常
        summary: 部品が外れても録音を続け、付き直したら結果を受け取る
        condition: 録音中に unmount して ✓ の後の結果を `results` に入れてから、同じ `key` で mount し直す / ほかの `key` で録音中に呼ぶ
        mock: MSW と `vi.stubGlobal`
        expected: 録音の `cancel` が呼ばれず、mount し直すと `status` が `reviewed` / `voice` が `disabled` で `voiceReason` が `VOICE_TEXT.busy`
      - name: test_use_voice_input_levels
        case: 正常
        summary: 録音中の音量を `levels` に持ち、終えたら空にする
        condition: 偽の録音が `onLevel` を `0.25`・`0.75` で呼んだ後に × を押す
        mock: MSW と `vi.stubGlobal`
        expected: 録音中の `levels` が `[0.25, 0.75]`、× の後は `[]`
    container: frontend/src/shared/hooks/use-voice-input.ts
notes:
  単体テスト: 同じフォルダの `use-voice-input.test.ts` に置く（knowledge の規約『フォルダ構成』）
  API: '`frontend/openapi.yaml` に `GET /api/transcription`・`POST /api/transcriptions`・`POST /api/comments/send-now` を足し、orval で生成した呼び出しを使う'

id: MOD-489-35
title: プレビュー / doc-cards
lead: 資料を連番の順にカードで並べる。
components:
  - name: DocCards
    title: 資料のカード
    kind: コンポーネント
    usecase: 資料を読む
    summary: 資料を連番の順にカードで並べる。カードの外枠は `div[data-card]`、タイトルは `button[data-id]` でその `::after` をカード全体へ広げ、タグは部品『タグの並び』を `onSelect`（`onSelectTag`）つきで前面に並べる。カードの並びのスクロール領域に `useListScroll` の ref を付ける。カードのタイトルは `h2`（見た目の大きさは変えない）にし、カードを並べる列の数は『docs-screen』の領域のコンテナクエリで 3・2・1 に切り替える
    container: frontend/src/features/docs/docs/components/doc-cards.tsx
notes:
  単体テスト: 同じフォルダの `doc-cards.test.tsx` に置く（knowledge の規約『フォルダ構成』）

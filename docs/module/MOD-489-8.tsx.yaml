id: MOD-489-8
title: プレビュー / review-edit-form
lead: レビュー中の書き込みの本文をその場で書き換える入力欄と「キャンセル」「修正」。
components:
  - name: ReviewEditForm
    title: レビュー中の書き込みの修正
    kind: コンポーネント
    usecase: コメントを選んで送信する
    summary: レビュー中の書き込みの本文をその場で書き換える入力欄と「キャンセル」「修正」（スレッドの書き込みとレビュー中の書き込みの画面と詳細のコメントが使う）。入力欄の中身は使う側が持つ（`body`・`onBodyChange`）。`VoiceProps` と `voiceStatus`・`voiceDetail` を受け、「キャンセル」の左に `send-form.tsx` の `VoiceButtons`・`VoiceWave`・`VoiceProgress` を置き、`useVoiceFocus` で録音の始めと終わりにフォーカスを移す（部品設計『スレッドの書き込み.tsx』の `voice`・`voiceReason`・`elapsed`・`levels`・`voiceStatus`・`voiceDetail` と「修正で録音を始める」「修正の録音をキャンセル」「修正で文字起こし」）。`voice` を渡さないときはマイクのボタンを置かない
    refs:
      - CMP-489-12#
    container: frontend/src/features/comments/shared/review-edit-form.tsx
    unit_tests:
      - name: test_review_edit_form_voice
        case: 正常
        summary: マイクのボタンと録音中の切り替え
        condition: '`parametrize`: `voice: idle` でマイクを押す / `voice: recording` で ✓ と × を押す / `voiceStatus: inserted` で描く / `voice` を渡さない'
        mock: '`onVoiceStart`・`onVoiceDone`・`onVoiceCancel`（`vi.fn`）'
        expected: '`onVoiceStart` が 1 回 / 「キャンセル」「修正」の代わりに × と ✓ があり、`onVoiceDone`・`onVoiceCancel` が 1 回ずつ / 「文字起こしの結果を挿入しました。」が出る / マイクのボタンが無い'

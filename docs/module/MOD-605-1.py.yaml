title: サーバー / 入口 / startup.py
lead: 常駐サーバーの起動時の照合（IF-605-1）を受け持つ。待ち受けの前に ID の一覧の再作成と状態の照合を行い、待ち受けと並行するスレッドでエージェントフローの配信元の行を確認する。
constants:
  - name: STARTUP_GET_TIMEOUT_SEC
    title: 待ち受けの前の GET の上限
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    summary: 待ち受けの前に ID の一覧を再作成するときの `GET /settings/sources` を打ち切る秒数
    value: '5.0'
    refs:
      - IF-605-1#constraints[待ち受けの前の `GET` の上限]
  - name: WORKSPACE_CONFIG_SUFFIX
    title: ワークスペースの行の config の末尾
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    summary: 配信元の行をワークスペースの行と見分ける `config` の末尾
    value: '"/.mindstella/dev-docs.yaml"'
functions:
  - name: reconcile_before_listen
    title: 待ち受けの前の照合
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    scope: public
    summary: ID の一覧が無ければ再作成し、状態の照合を 1 回して戻る。どれに失敗しても例外を送出しない
    side_effects: '`workspaces.yaml` を作ることがある。`running` の `session.json` を `crashed` にし、『停止の通知』を呼ぶことがある'
    args:
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 常駐サーバーの文脈（`state_root`・`pi_port`・`tmux`・`proc`）
    returns:
      type: None
      description: なし
    process: |-
      1. 状態のフォルダに ID の一覧が無ければ再作成する（`rebuild_ids_if_missing`）
         - `Exception`（`workspaces.yaml` を書けない `OSError` など）を捕まえた場合、再作成を飛ばして 2 へ進む
           - `[ERROR]` ID の一覧の再作成に失敗した（例外の種類・理由）
      2. 状態の照合を 1 回する（`sessions.watch_crashes_once`）
         - `[INFO]` 起動時の照合で落ちたものを記録した（数）
         - `yaml.YAMLError`・`ValueError`（ID の一覧が読めない）を捕まえた場合、照合を飛ばす
           - `[ERROR]` ID の一覧が読めず状態の照合を飛ばした（理由）
         - そのほかの `Exception`（`workspaces.yaml` を読めない `PermissionError` など）を捕まえた場合も、照合を飛ばす
           - `[ERROR]` 状態の照合に失敗した（例外の種類・理由）
    callees:
      - MOD-531-4#functions[watch_crashes_once]
    unit_tests:
      - name: test_reconcile_before_listen
        case: 正常
        summary: 再作成の後に照合する
        condition: '`rebuild_ids_if_missing` と `sessions.watch_crashes_once` を呼ばれた順に記録する関数に差し替える'
        mock: '`rebuild_ids_if_missing`・`sessions.watch_crashes_once`（monkeypatch）'
        expected: 再作成 → 照合の順に 1 回ずつ呼ばれる
      - name: test_reconcile_before_listen_when_ids_unreadable
        case: 正常
        summary: ID の一覧が読めなければ照合を飛ばして戻る
        condition: 一時フォルダの `workspaces.yaml` が YAML として読めない
        mock: なし（一時フォルダ）
        expected: 例外を送出しずに戻り、`ERROR` の記録が 1 件ある。`workspaces.yaml` が書き換わっていない
      - name: test_reconcile_before_listen_when_rebuild_fails
        case: 正常
        summary: 再作成が失敗しても照合して戻る
        condition: '`rebuild_ids_if_missing` が `OSError` を送信する。`sessions.watch_crashes_once` を呼ばれた回数を数える関数に差し替える'
        mock: '`rebuild_ids_if_missing`・`sessions.watch_crashes_once`（monkeypatch）'
        expected: 例外を送出しずに戻り、`watch_crashes_once` が 1 回呼ばれ、`ERROR` の記録が 1 件ある
      - name: test_reconcile_before_listen_when_watch_fails
        case: 正常
        summary: 照合が想定外の例外で失敗しても戻る
        condition: '`sessions.watch_crashes_once` が `PermissionError` を送信する'
        mock: '`rebuild_ids_if_missing`・`sessions.watch_crashes_once`（monkeypatch）'
        expected: 例外を送出しずに戻り、`ERROR` の記録が 1 件ある
  - name: rebuild_ids_if_missing
    title: ID の一覧の再作成
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    scope: public
    summary: '`workspaces.yaml` が無いときだけ、project-index の配信元の行のうちワークスペースの行の ID で作る'
    side_effects: '`workspaces.yaml` を作る'
    args:
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 常駐サーバーの文脈
    returns:
      type: int | None
      description: 作った ID の数。作らなかった（一覧がある・project-index に失敗した）とき `None`
    process: |-
      1. 状態のフォルダに `workspaces.yaml` があれば `None` を返す（`state.ids_exist`）
      2. 配信元の行を取得する（`project_index.get_settings(ctx.pi_port, timeout=STARTUP_GET_TIMEOUT_SEC)`）
         - `ProjectIndexError` を捕まえた場合、`None` を返す
           - `[WARNING]` project-index へつながらず ID の一覧の再作成を飛ばした（ステータス・理由）
      3. ワークスペースの行の ID を並べ（`workspace_ids`）、一覧がまだ無ければ書く（`state.create_ids_if_missing`）
         - 書いた場合
           - `[INFO]` ID の一覧を再作成した（数）
         - 書かなかった（取得している間にできた）場合、`None` を返す
      4. 書いた ID の数を返す
    callees:
      - MOD-531-1#functions[ids_exist]
      - MOD-531-1#functions[create_ids_if_missing]
      - MOD-531-2#functions[get_settings]
    unit_tests:
      - name: test_rebuild_ids_if_missing
        case: 正常
        summary: 一覧が無ければワークスペースの行の ID で作る
        condition: 一時フォルダに `workspaces.yaml` が無い。`project_index.get_settings` がワークスペース A・B の行と `mindstella-agent-flows` の行を返す
        mock: '`project_index.get_settings`（monkeypatch）'
        expected: 2 を返し、`state.read_ids` が `[A, B]`。`get_settings` に `timeout=STARTUP_GET_TIMEOUT_SEC` が渡っている
      - name: test_rebuild_ids_if_missing_when_ids_exist
        case: 正常
        summary: 一覧があれば project-index を呼ばない
        condition: '`workspaces.yaml` の `ids` が `[A]`'
        mock: '`project_index.get_settings`（呼ばれないことを確かめる）'
        expected: '`None` を返し、`get_settings` が呼ばれない。`ids` が `[A]` のまま'
      - name: test_rebuild_ids_if_missing_when_project_index_fails
        case: 正常
        summary: project-index に失敗したら作らない
        condition: '`workspaces.yaml` が無い。`get_settings` が `ProjectIndexError` を送信する'
        mock: '`project_index.get_settings`（monkeypatch）'
        expected: '`None` を返し、`workspaces.yaml` が無い。`WARNING` の記録が 1 件ある'
  - name: workspace_ids
    title: ワークスペースの行の ID
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    scope: public
    summary: '`GET /settings/sources` の応答の行のうち、`config` の末尾が `WORKSPACE_CONFIG_SUFFIX` の行の `id` を応答の並び順で返す'
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`GET /settings/sources` の応答'
    returns:
      type: list[str]
      description: ワークスペースの ID の並び（重なりなし）
    process: 1. `sources` の行ごとに、辞書で `id` が文字列、`config`（並びなら先頭の要素。`_row_config`）が `WORKSPACE_CONFIG_SUFFIX` で終わる行の `id` を、出た順に重なりなく並べて返す（`outsideRead` は見ない）
    unit_tests:
      - name: test_workspace_ids
        case: 正常
        summary: ワークスペースの行だけを並び順で返す
        condition: '行が A（`outsideRead: true`）・エージェントフロー・ほかの配信元・C（`outsideRead: false`）・`config` の無い行・辞書でない行'
        mock: なし
        expected: '`[A, C]`'
      - name: test_workspace_ids_when_config_list
        case: 正常
        summary: config が並びの行は先頭の要素で見分ける
        condition: '行が A（`config: [/w/a/.mindstella/dev-docs.yaml]`）・エージェントフロー（`config: [/p/agent-flows/dev-docs.yaml]`）'
        mock: なし
        expected: '`[A]`'
  - name: check_agent_flows_source
    title: エージェントフローの配信元の確認
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    scope: public
    summary: '`mindstella-agent-flows` の行の `config` が今のプラグインの `agent-flows/dev-docs.yaml` と違えば書き換え、書き換えたかを返す。失敗しても例外を送出しない'
    side_effects: project-index の `PATCH /settings/sources/mindstella-agent-flows` を送信することがある
    args:
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 常駐サーバーの文脈（`pi_port`）
    returns:
      type: bool
      description: 行を書き換えたら真
    process: |-
      1. 配信元の行を取得し、`mindstella-agent-flows` の行を引く（`project_index.get_settings(ctx.pi_port)`）
         - 行が無い場合、偽を返す
         - 行の `config`（並びなら先頭の要素。`_row_config`）が `str(PLUGIN_DIR / AGENT_FLOWS_CONFIG)` と同じ場合、偽を返す
      2. `config` だけを今のパスへ書き換える（`project_index.patch_source(ctx.pi_port, AGENT_FLOWS_SOURCE, {"config": 今のパス})`。409 の 1 回の再取得は `patch_source` が行う）
         - `[INFO]` エージェントフローの配信元の行を書き換えた（前のパス・今のパス）
      3. 真を返す
      - 1・2 で `ProjectIndexError` を捕まえた場合、偽を返す
        - `[WARNING]` エージェントフローの配信元の確認を飛ばした（ステータス・理由）
    callees:
      - MOD-531-2#functions[get_settings]
      - MOD-531-2#functions[patch_source]
    unit_tests:
      - name: test_check_agent_flows_source
        case: 正常
        summary: 前のプラグインを指していれば config だけを書き換える
        condition: '`get_settings` が別のフォルダの `agent-flows/dev-docs.yaml` を指す行を返す'
        mock: '`project_index.get_settings`・`project_index.patch_source`（monkeypatch）'
        expected: '真を返し、`patch_source` が `mindstella-agent-flows` と `{"config": 今のプラグインのパス}` で 1 回呼ばれる'
      - name: test_check_agent_flows_source_when_same
        case: 正常
        summary: 今のプラグインを指していれば書き換えない
        condition: 行の `config` が今のプラグインのパス
        mock: '`project_index.get_settings`・`project_index.patch_source`（monkeypatch）'
        expected: 偽を返し、`patch_source` が呼ばれない
      - name: test_check_agent_flows_source_when_missing
        case: 正常
        summary: 行が無ければ追加しない
        condition: 応答に `mindstella-agent-flows` の行が無い
        mock: '`project_index.get_settings`・`project_index.patch_source`・`project_index.add_source`（monkeypatch）'
        expected: 偽を返し、`patch_source`・`add_source` が呼ばれない
      - name: test_check_agent_flows_source_when_project_index_fails
        case: 正常
        summary: project-index に失敗しても例外を送出しない
        condition: '`parametrize`: `get_settings` が `ProjectIndexError` を送信する / `patch_source` が `ProjectIndexError` を送信する'
        mock: '`project_index.get_settings`・`project_index.patch_source`（monkeypatch）'
        expected: 偽を返し、`WARNING` の記録が 1 件ある
      - name: test_check_agent_flows_source_when_config_list
        case: 正常
        summary: config が今のパス 1 つの並びなら書き換えない
        condition: 行の `config` が `[今のプラグインのパス]`
        mock: '`project_index.get_settings`・`project_index.patch_source`（monkeypatch）'
        expected: 偽を返し、`patch_source` が呼ばれない
  - name: start_agent_flows_check
    title: エージェントフローの配信元の確認を始める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/startup.py
    usecase: 常駐サーバーの起動
    scope: public
    summary: '`check_agent_flows_source` を 1 回だけ呼ぶ `daemon` のスレッドを始めて返す'
    args:
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 常駐サーバーの文脈
    returns:
      type: threading.Thread
      description: 始めたスレッド（名前 `mindstella-agent-flows-check`）
    callees:
      - MOD-605-1#functions[check_agent_flows_source]
    unit_tests:
      - name: test_start_agent_flows_check
        case: 正常
        summary: daemon のスレッドで 1 回呼ぶ
        condition: '`check_agent_flows_source` を呼ばれた回数を数える関数に差し替え、返ったスレッドを `join` する'
        mock: '`check_agent_flows_source`（monkeypatch）'
        expected: スレッドが `daemon` で、1 回呼ばれている
refs:
  - IF-605-1#
  - SC-605-1#
decisions:

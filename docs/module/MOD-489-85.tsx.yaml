id: MOD-489-85
title: プレビュー / table
lead: 部品設計『表.tsx』の props・イベント・状態を持つ。
components:
  - name: Table
    title: 表
    kind: コンポーネント
    usecase: 項目を表で絞り込む
    summary: 部品設計『表.tsx』の props・イベント・状態を持つ。`tagMatch` を部品『絞り込みの条件のチップ』へ渡し、タグの列のセルの部品『タグの並び』に `onSelectTag` を渡す。表のスクロール領域に `useListScroll` の ref を付ける
    refs:
      - CMP-489-48#
    unit_tests:
      - name: test_table_when_sort
        case: 正常
        summary: 見出しで並べ替える
        condition: 見出しを押す
        mock: なし
        expected: '`onSort` が key で呼ばれる'
      - name: test_table_when_hidden_column
        case: 正常
        summary: 列を隠す
        condition: '`hiddenColumns` に列'
        mock: なし
        expected: その列が描かれない
      - name: test_table_when_pin
        case: 正常
        summary: 列をピン留めする
        condition: ピン留めを押す
        mock: なし
        expected: '`onPin` が key で呼ばれる'
      - name: test_table_when_open_order
        case: 正常
        summary: 開いたときに今の並びを渡す
        condition: 状態で絞ってタイトルで並べた表の 2 行目を押す
        mock: なし
        expected: '`onOpenItem` が 2 行目の ID と、描いた行の ID の並びで呼ばれる'
    container: frontend/src/shared/components/table.tsx
notes:
  単体テスト: 同じフォルダの `table.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  開いた並び: 行のタイトルを押したとき、絞り込み・並べ替えを当てた行の ID の並びを `onOpenItem(id, order)` で使用する側へ知らせる（#364）。ストーリーに部品設計の `DatetimeColumns`・`SortedByUpdatedDesc` を追加する
  お気に入り: '`onClearFavoritesOnly` を受け、指定されたときだけ部品『絞り込みの条件のチップ』へ指定する。星の列は使用する側が列の定義（`favoriteColumn`）で指定し、表は引数を増やさない。ストーリーに部品設計の `FavoriteColumn`・`FavoriteColumnSortedAsc`・`FavoriteColumnSortedDesc` を追加する'

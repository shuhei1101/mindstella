  - name: update_comment
    title: コメントを修正する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    scope: public
    summary: レビュー中のコメント 1 件の本文か案の選択の記号を書き換えるか、箇所を外す（鍵は呼ぶ側が取る）
    side_effects: '`comments.yaml` を一時ファイルから置き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: comment_id
        type: str
        required: true
        passing: positional
        description: コメントの ID
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト（`body`・`loc`・`choice`）
    returns:
      type: ReviewComment
      description: 書き換えた後のコメント
    process: |-
      1. `body` も `loc` も `choice` も無ければ `CommentInvalidError`。`body` は文字列で前後の空白を除いて 1〜`MAX_BODY_CHARS` 文字か `None`、`loc` は `None` だけ（それ以外は `loc: null だけを受けます` の `CommentInvalidError`）、`choice` は `key` に文字列を持つオブジェクトだけを受ける
      2. コメントを読み、ID で引く（無ければ `CommentNotFoundError`）
      3. 案の選択でないコメントに `choice` か `body: None` を渡したら、`choice: 案の選択のコメントだけが受けます` か `body: 案の選択のコメントだけが null を受けます` の `CommentInvalidError` を送出する
      4. `choice` があればワークスペースを読み（`load_workspace`）、向けた検討事項に当てて確かめる（`_check_choice`）
         - 理由が返れば、その理由の `CommentConflictError` を送出する
      5. `body` を置き換える（`None` なら削除する）か、`choice` を置き換えるか、`loc` を `None` にし、並びと `seq` を変えずに書く（`_write_yaml`）
    exceptions:
      - name: CommentInvalidError
        condition: '`body` も `loc` も `choice` も無い、`body` が空白だけか上限を超える、`loc` が `null` 以外、`choice` の形式が崩れている、案の選択でないコメントに `choice` か `body: null` を渡した'
      - name: CommentNotFoundError
        condition: その ID のコメントがレビュー中に無い
        message: 'コメントがありません: {ID}'
      - name: WriteFailedError
        condition: '`comments.yaml` を書けない'
      - name: CommentConflictError
        condition: '`choice` が `_check_choice` に合わない'
        message: '{理由}'
    unit_tests:
      - name: test_update_comment
        case: 正常
        summary: 本文を修正する・箇所を外す
        condition: '`parametrize`: C-1 に `{body: " 案 A に決める "}` / 箇所を持つ C-2 に `{loc: null}`'
        mock: なし
        expected: C-1 の `body` が `案 A に決める` / C-2 の `loc` が `None`。どちらも `id`・`target`・`created`・並び・`seq` が呼ぶ前と同じ
      - name: test_update_comment_when_rejected
        case: 異常
        summary: 構造の誤りと無い ID は修正しない
        condition: '`parametrize`: `{}` / `{body: "  "}` / `{loc: {kind: body}}` / `C-9` に `{body: x}`'
        mock: なし
        expected: '`CommentInvalidError` / `CommentInvalidError` / `CommentInvalidError` / `CommentNotFoundError`。`comments.yaml` が呼ぶ前と同じ'
        exception: 構造の誤り・無い ID
      - name: test_update_comment_when_choice
        case: 正常
        summary: 案の選択を選び直して一言を書き換える・一言を削除する
        condition: '案 A・B を持つ未決定の D-1 と、D-1 への案 A の選択 C-1（一言「x」）。`parametrize`: `{choice: {key: B}, body: 費用を優先する}` / `{body: null}`'
        mock: なし
        expected: C-1 の `choice` が `B`・`body` が `費用を優先する` / C-1 の `body` が `None` でファイルに `body` のキーが無い。どちらも `target` が D-1 のままで `decisions.yaml` が呼ぶ前と同じ
      - name: test_update_comment_when_choice_rejected
        case: 異常
        summary: '案に無い記号と、案の選択でないコメントへの choice・body: null は書き換えない'
        condition: '`parametrize`: 案の選択 C-1 に `{choice: {key: Z}}` / 案の選択でない C-2 に `{choice: {key: A}}` / C-2 に `{body: null}`'
        mock: なし
        expected: '`CommentConflictError` / `CommentInvalidError` / `CommentInvalidError`。`comments.yaml` が呼ぶ前と同じ'
        exception: 案の選択が合わない・案の選択でない
  - name: delete_comment
    title: コメントを削除する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    scope: public
    summary: レビュー中のコメント 1 件を削除し、削除した中身を返す（`seq` は変えない。鍵は呼ぶ側が取る）
    side_effects: '`comments.yaml` を一時ファイルから置き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: comment_id
        type: str
        required: true
        passing: positional
        description: コメントの ID
    returns:
      type: tuple[ReviewComment, int]
      description: 削除したコメントと、削除した後の件数。配信は削除したコメントの `choice` を応答の `choice` に入れる
    process: |-
      1. コメントを読み、ID で引く（無ければ `CommentNotFoundError`）
      2. その 1 件を除いた `{seq, items}` を書く（`_write_yaml`）
    exceptions:
      - name: CommentNotFoundError
        condition: その ID のコメントがレビュー中に無い（既に削除した・送信したものを含む）
      - name: WriteFailedError
        condition: '`comments.yaml` を書けない'
    unit_tests:
      - name: test_delete_comment
        case: 正常
        summary: 削除して中身と件数を返す
        condition: '`seq: 3` と C-1・C-2・C-3 で `C-2`'
        mock: なし
        expected: '`(C-2, 2)`。`comments.yaml` が C-1・C-3 で `seq` が 3'
      - name: test_delete_comment_when_not_found
        case: 異常
        summary: 無い ID は削除しない
        condition: C-1 だけで `C-9`
        mock: なし
        expected: '`CommentNotFoundError`（メッセージに `C-9`）'
        exception: その ID のコメントが無い
      - name: test_delete_comment_when_choice
        case: 正常
        summary: 案の選択を削除すると、選んだ案の記号つきで返す
        condition: D-1 への案 B の選択 C-1 で `C-1`
        mock: なし
        expected: 返したコメントの `choice` が `B`。`comments.yaml` が空
  - name: save_draft
    title: 下書きを保つ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    scope: public
    summary: 向けた先（`target` と `loc` の組か、`thread`）の下書きを上書きする。空の本文なら削除する（鍵は呼ぶ側が取る）
    side_effects: '`drafts.yaml` を一時ファイルから置き換える（無ければ作る）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト（`target`・`loc`・`thread`・`body`）
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: None
      description: '-'
    process: |-
      1. `body` が文字列で `MAX_BODY_CHARS` 以下か、`target`・`thread` が文字列か無いか、`loc` を渡すときは `target` もあるか、`thread` を `target`・`loc` と一緒に渡していないかを確かめる（`loc` は `parse_location`。今の項目に合うかは確かめない）
      2. `body` が空でなければ、`target` の項目があるか（`find_item`）、`thread` のスレッドがあるか（`load_threads`。クローズでも保つ）を確かめる
      3. 下書きを読み、同じ向けた先の 1 件を除き、`body` が空でなければ今の日時で末尾に追加して書く（`_write_yaml`）
    exceptions:
      - name: CommentInvalidError
        condition: '`body` が無いか文字列でないか上限を超える、`loc` だけで `target` が無い、`loc` の形式が崩れている、`thread` を `target` か `loc` と一緒に渡した'
      - name: ItemNotFoundError
        condition: 空でない本文で、`target` の項目が無い
      - name: WriteFailedError
        condition: '`drafts.yaml` を書けない'
      - name: ThreadNotFoundError
        condition: 空でない本文で、`thread` のスレッドが無い
    unit_tests:
      - name: test_save_draft
        case: 正常
        summary: 向けた先ごとに上書きする
        condition: 'D-1 への下書き「案 A に」と、D-1 の本文の 2 行目への下書き。`{target: D-1, body: 案 B も見たい}`'
        mock: '`now`'
        expected: '`drafts.yaml` が 2 件で、箇所を持たない D-1 の本文が `案 B も見たい`、箇所を持つ方は呼ぶ前と同じ'
      - name: test_save_draft_when_empty
        case: 正常
        summary: 空の本文はその向けた先を削除する。項目が無くても削除できる
        condition: '消えた D-9 への下書き。`{target: D-9, body: ""}`'
        mock: なし
        expected: 例外にならず、`drafts.yaml` に D-9 への下書きが無い
      - name: test_save_draft_when_rejected
        case: 異常
        summary: 構造の誤りと無い項目への下書きは保たない
        condition: '`parametrize`: `body` が無い / `body` が 10001 文字 / `loc` だけ / `{target: D-99, body: x}`'
        mock: なし
        expected: '`CommentInvalidError` / `CommentInvalidError` / `CommentInvalidError` / `ItemNotFoundError`。`drafts.yaml` が無い'
        exception: 構造の誤り・無い項目
      - name: test_save_draft_when_thread
        case: 正常
        summary: スレッドごとに保ち、クローズのスレッドへも保つ
        condition: 'オープンの TH-1・クローズの TH-2 と、TH-1 への下書き「了解」。`{thread: TH-1, body: 了解した}` の後に `{thread: TH-2, body: 追記}`'
        mock: '`now`'
        expected: '`drafts.yaml` が 2 件で、TH-1 の本文が `了解した`、TH-2 の本文が `追記`。どちらも `target`・`loc` のキーが無い'
      - name: test_save_draft_when_thread_rejected
        case: 異常
        summary: 無いスレッドと、項目と一緒に渡したスレッドは保たない
        condition: '`parametrize`: `{thread: TH-9, body: x}` / `{thread: TH-1, target: D-1, body: x}`'
        mock: なし
        expected: '`ThreadNotFoundError` / `CommentInvalidError`（メッセージに `thread`）。`drafts.yaml` が無い'
        exception: スレッドが無い・構造の誤り
  - name: send_comments
    title: まとめて送信する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    scope: public
    summary: 渡した ID のコメントを全て確かめてから、案の選択は検討事項の `user_choice` へ、ほかはスレッドへ追加し、レビュー中から外す。1 件でも合わなければ何も書き換えない（鍵は呼ぶ側が取る）
    side_effects: '案の選択があれば `decisions.yaml`・`history.yaml`・`changes.yaml` を、続けて `threads.yaml`、最後に `comments.yaml` を一時ファイルから置き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト（`ids`）
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[str, list[SentItem]]
      description: 送信した日時と、溜めた順の送信したコメント・スレッド・書き込み・検討事項の ID（`SentItem`）
    process: |-
      1. `ids` が 1 件以上の文字列の配列で重なりが無いかを確かめる（合わなければ `ids: {理由}` の `CommentInvalidError`）
      2. コメントを読み、無い ID があればその全てを持った `CommentNotFoundError` を送出する
      3. ワークスペースとスレッドを読み（`load_workspace`、`load_threads`）、渡したコメントを溜めた順に確かめる。同じ `comment` を持つ書き込みが既にあるコメントは確かめない（二重に送信しないため、追加せずに外すだけ）
         - 新規スレッドの分は、向けた項目が無ければ `{target} がありません`、箇所が合わなければ `check_location` の理由を控える
         - 返信の分は、返信先のスレッドが無ければ `スレッド {ID} がありません`、クローズなら `スレッド {ID} はクローズです` を控える
         - 案の選択の分は、向けた検討事項が無ければ `{target} がありません`、`_check_choice` に合わなければその理由を控える
         - 控えが 1 件でもあれば、全てを `stale` に持った `CommentConflictError` を送出する
      4. 前の `decisions.yaml`・`history.yaml`・`changes.yaml` の中身を控え、案の選択があれば利用者の選択を記載する（`_write_user_choices`）
      5. 前の `threads.yaml` の中身（無ければ無いこと）を控え、案の選択でない分をスレッドへ追加する（`UserPostInput` にして `append_user_posts`。`loc` は `location_to_dict`。案の選択だけのときは書かない）
         - `WriteFailedError` の場合、控えた `decisions.yaml`・`history.yaml`・`changes.yaml` を書き戻し、同じ例外を送出する
      6. 送信したコメントを除いた `{seq, items}` を書く（`_write_yaml`）
         - `WriteFailedError` の場合、控えた `threads.yaml`・`decisions.yaml`・`history.yaml`・`changes.yaml` を書き戻し（無かったファイルは削除する）、同じ例外を送出する
      7. 送信した返信のスレッドの下書きがあれば削除して書く
         - `WriteFailedError` の場合、`[WARNING]` 下書きを削除できなかった（パス・理由）を出して送信したまま返す
      8. 送信した日時と、溜めた順の `SentItem`（スレッドへの分は `thread`・`post`、案の選択は `decision`）を返す
         - `[INFO]` コメントを送信した（件数・スレッドの ID・案の選択の件数）
    exceptions:
      - name: CommentInvalidError
        condition: '`ids` が無い・空・文字列の配列でない・重なりがある'
        message: 'ids: {理由}'
      - name: CommentNotFoundError
        condition: '`ids` のどれかがレビュー中に無い'
        message: 'コメントがありません: {ID、ID}'
      - name: CommentConflictError
        condition: 向けた項目が消えたコメント、箇所が今の項目に合わないコメント、クローズか無いスレッドへの返信、検討事項が `未決定`・`要見直し` でないか選んだ案が無くなった案の選択がある
        message: 送信できない書き込みが {件数} 件あります
      - name: SchemaMismatchError
        condition: '`load_comments`・`load_threads`・`load_workspace` が送信するもの'
      - name: WriteFailedError
        condition: '`decisions.yaml`・`history.yaml`・`changes.yaml`・`threads.yaml`・`comments.yaml` のどれかを書けない（この送信で置き換えたファイルを前のままに戻した後）'
    unit_tests:
      - name: test_send_comments
        case: 正常
        summary: チェックしたものだけを溜めた順に送信し、新規スレッドの作成
        condition: 'D-1・A-1、C-1（D-1）・C-2（A-1 の本文の 2 行目）・C-3（項目を指さない）。`{ids: [C-2, C-1]}`'
        mock: '`now`'
        expected: '`items` が C-1 → TH-1・TH-1-1、C-2 → TH-2・TH-2-1。`threads.yaml` がオープンの TH-1（D-1）・TH-2（A-1・`loc` あり）で書き込みが `comment` を持ち、`comments.yaml` が C-3 だけ'
      - name: test_send_comments_when_reply
        case: 正常
        summary: 返信をスレッドの末尾に追加し、そのスレッドの下書きを削除する
        condition: '書き込み 2 件のオープンの TH-1、C-1（`thread: TH-1`）、TH-1 への下書き。`{ids: [C-1]}`'
        mock: '`now`'
        expected: '`items` が C-1 → TH-1・TH-1-3。TH-1-3 が `author: user`・`read: False`・`taken: None`。`drafts.yaml` に TH-1 への下書きが無い'
      - name: test_send_comments_when_rejected
        case: 異常
        summary: 構造の誤り・無い ID は何も送信しない
        condition: '`parametrize`: `{ids: []}` / `{ids: [C-1, C-1]}` / `{ids: [C-1, C-9]}`'
        mock: なし
        expected: '`CommentInvalidError` / `CommentInvalidError` / `CommentNotFoundError`（メッセージに `C-9`）。`threads.yaml` が無く、`comments.yaml` が呼ぶ前と同じ'
        exception: 構造の誤り・無い ID
      - name: test_send_comments_when_stale
        case: 異常
        summary: 送信できないコメントを全て返し、何も送信しない
        condition: 'クローズの TH-2。C-1（D-1）・C-2（3 行の本文の 5 行目）・C-3（消えた D-9）・C-4（`thread: TH-2`）・C-5（`thread: TH-9`）で `{ids: [C-1, C-2, C-3, C-4, C-5]}`'
        mock: なし
        expected: '`CommentConflictError` の `stale` が C-2・C-3・C-4・C-5 の順で理由が空でない（C-4 の理由に `クローズ`）。`threads.yaml`・`comments.yaml` が呼ぶ前と同じ'
        exception: 送信できない書き込みがある
      - name: test_send_comments_when_already_sent
        case: 正常
        summary: 既に追加してあるコメントは確かめずにレビュー中から外す
        condition: '`comment: C-1` の書き込み TH-1-2 を持つクローズの TH-1 と、C-1（`thread: TH-1`）。`{ids: [C-1]}`'
        mock: '`now`'
        expected: '`items` が C-1 → TH-1・TH-1-2。`threads.yaml` が呼ぶ前と同じで、`comments.yaml` が空'
      - name: test_send_comments_when_comments_write_fails
        case: 異常
        summary: レビュー中を書けなければスレッドを書き戻す
        condition: TH-1 と C-1 を持つワークスペース。`comments.yaml` への `os.replace` だけ `OSError` を送出するように差し替える
        mock: '`os.replace`'
        expected: '`WriteFailedError`。`threads.yaml`・`comments.yaml` が呼ぶ前と同じ'
        exception: 置き換えで OSError
      - name: test_send_comments_when_choices
        case: 正常
        summary: 案の選択を検討事項の利用者の選択へ移し、スレッドは作らない
        condition: '案 A・B を持つ未決定の D-1・D-2、D-1 への案 B の選択 C-1（一言なし）・D-2 への案 B の選択 C-2（一言「費用を優先する」）。`{ids: [C-1, C-2]}`'
        mock: '`now`'
        expected: '`items` が C-1 → D-1、C-2 → D-2 で `thread`・`post` が `None`。D-1 の `user_choice` が `{key: B, at: now}`、D-2 が `{key: B, note: 費用を優先する, at: now}`。D-1・D-2 が未決定のまま。`threads.yaml` が無く、`comments.yaml` が空。`changes.yaml` に説明 `画面からの案の選択`・`by: user` のまとまりが 1 つ増え、D-1・D-2 の変更履歴の `before` の `user_choice` が `None`'
      - name: test_send_comments_when_choices_and_posts
        case: 正常
        summary: 案の選択とスレッドへの書き込みを一緒に送信し、まだまとめていない変更は先にまとまりにする
        condition: '`changes.yaml` の `pending` に AI の変更、D-1 への案 B の選択 C-1 と D-2 への新規スレッドの C-2。`{ids: [C-1, C-2]}`'
        mock: '`now`'
        expected: '`items` が C-1 → D-1、C-2 → TH-1・TH-1-1。`changes.yaml` に AI のまとまり → 案の選択のまとまりの順に 2 つ増える'
      - name: test_send_comments_when_choice_same
        case: 正常
        summary: 同じ記号と一言の利用者の選択を持つ検討事項は書き換えない
        condition: '`user_choice: {key: B, at: 前の日時}` を持つ D-1 と、D-1 への案 B の選択 C-1（一言なし）。`{ids: [C-1]}`'
        mock: '`now`'
        expected: D-1 の `user_choice.at` が前の日時のままで、`changes.yaml`・`history.yaml` が呼ぶ前と同じ。`comments.yaml` が空
      - name: test_send_comments_when_choice_stale
        case: 異常
        summary: 選べなくなった検討事項・無くなった案への案の選択は何も送信しない
        condition: '`parametrize`: C-1 を溜めた後に D-1 を決定済みにした / 案 B を削除した'
        mock: なし
        expected: '`CommentConflictError` の `stale` が C-1 の 1 件。`decisions.yaml`・`comments.yaml` が呼ぶ前と同じ'
        exception: 送信できない案の選択がある
      - name: test_send_comments_when_threads_write_fails_after_choices
        case: 異常
        summary: スレッドを書けなければ利用者の選択を書き戻す
        condition: D-1 への案の選択 C-1 と新規スレッドの C-2。`threads.yaml` への `os.replace` だけ `OSError` を送出するように差し替える
        mock: '`os.replace`'
        expected: '`WriteFailedError`。`decisions.yaml`・`history.yaml`・`changes.yaml`・`threads.yaml`・`comments.yaml` が呼ぶ前と同じ'
        exception: 置き換えで OSError
  - name: send_now
    title: すぐ送信する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 音声でコメントする
    scope: public
    summary: 書き込み 1 件の向けた先と本文を確かめ、レビュー中に溜めずにスレッドへ追加する（インターフェース定義『書き込みをすぐ送信する』。鍵は呼ぶ側が取る）
    side_effects: '`threads.yaml` を一時ファイルから置き換える。`comments.yaml`・`drafts.yaml` は読まず、書き換えない'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト（`body`・`target`・`loc`・`thread`）
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[str, SentPost]
      description: 送信した日時と、スレッド・書き込みの ID（`SentPost` の `comment` は `None`）
    process: |-
      1. 本文と向けた先の構造を、溜めるときと同じく確かめる（`_validate_body`・`_parse_destination`。合わなければ `{キー}: {理由}` の `CommentInvalidError`）
      2. ワークスペースとスレッドを読み（`load_workspace`、`load_threads`）、まとめて送信するときと同じ理由で向けた先を確かめる（`_stale_reason` を、コメントでなく向けた先の組で受けるように分けたもの）
         - 理由がある場合、その理由をメッセージにした `CommentConflictError` を送出する（`stale` は空）
      3. `comment` を `None` にした `UserPostInput` 1 件でスレッドへ追加する（`append_user_posts`。`loc` は `location_to_dict`）
      4. 送信した日時と、追加した `SentPost` を返す
         - `[INFO]` 書き込みをすぐ送信した（スレッドの ID）
    exceptions:
      - name: CommentInvalidError
        condition: '`body` が空か長すぎる・`target` と `thread` を一緒に渡した・`loc` だけを渡した・`loc` の形式の誤り'
        message: '{キー}: {理由}'
      - name: CommentConflictError
        condition: '`target` の項目が無い・`loc` が今の項目に合わない・`thread` がクローズか無い'
        message: '{理由}'
      - name: SchemaMismatchError
        condition: '`load_threads`・`load_workspace` が送信するもの'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_send_now
        case: 正常
        summary: 新規スレッドを立てて最初の書き込みにし、レビュー中の書き込みは残す
        condition: 'D-1、C-1（D-1）。`{target: D-1, body: " 案 A にする "}`'
        mock: '`now`'
        expected: '`SentPost(comment=None, thread=TH-1, post=TH-1-1)`。TH-1 がオープン・`target: D-1` で、書き込みが `author: user`・`body: 案 A にする`・`read: False`・`seen: True`・`taken: None` で `comment` を持たない。`comments.yaml` に C-1 が残る'
      - name: test_send_now_when_reply
        case: 正常
        summary: オープンのスレッドの末尾に追加する
        condition: '書き込み 1 件のオープンの TH-1、TH-1 への下書き。`{thread: TH-1, body: x}`'
        mock: '`now`'
        expected: '`SentPost(comment=None, thread=TH-1, post=TH-1-2)`。`drafts.yaml` の TH-1 への下書きが残る'
      - name: test_send_now_when_invalid
        case: 異常
        summary: 構造の誤りは何も書かない
        condition: '`parametrize`: `{body: "  "}` / `{target: D-1, thread: TH-1, body: x}` / `{loc: {kind: body, start: 1, end: 1, text: x}, body: x}`'
        mock: なし
        expected: '`CommentInvalidError`。`threads.yaml` が無い'
        exception: 構造の誤り
      - name: test_send_now_when_conflict
        case: 異常
        summary: 向けた先が無いか送信できない
        condition: '`parametrize`: `{target: D-9, body: x}` / クローズの TH-1 へ `{thread: TH-1, body: x}` / `{thread: TH-9, body: x}` / 3 行の本文の D-1 へ 5 行目の `loc`'
        mock: なし
        expected: '`CommentConflictError`（メッセージに `D-9` / `クローズ` / `TH-9` / 行数）。`threads.yaml` が呼ぶ前と同じ'
        exception: 送信できない向けた先
  - name: _parse_comment_input
    title: コメントの入力の確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    scope: internal
    summary: 溜める要求の `target`・`loc`・`thread`・`body`・`id`・`created`・`choice` の形式を確かめる
    args:
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト
    returns:
      type: CommentInput
      description: '確かめた要求（`body` は前後の空白を除き、案の選択で渡さなければ `None`）'
    process: |-
      1. `body` を確かめる（文字列で、前後の空白を除いて 1〜`MAX_BODY_CHARS` 文字。`choice` があるときは無くてよい）
      2. `target` があれば文字列かを確かめる
      3. `loc` があれば `target` もあるかを確かめ、`parse_location` を当てる
      4. `thread` があれば文字列で、`target`・`loc` を一緒に渡していないかを確かめる
      5. `choice` があれば `key` に文字列を持つオブジェクトで、`target` があり、`loc`・`thread` を一緒に渡していないかを確かめる
      6. `id` があれば `C-{数字}` の構造で `created` もあるかを、`created` があれば `id` もあるかを確かめる
         - 合わない場合、`{キー}: {理由}` の `CommentInvalidError` を送出する
    exceptions:
      - name: CommentInvalidError
        condition: '`choice` を渡さないのに `body` が無い、`body` が文字列でない・空白だけ・上限を超える、`target` が文字列でない、`loc` だけで `target` が無い、`loc` の形式が崩れている、`thread` が文字列でないか `target`・`loc` と一緒に渡した、`choice` の形式が崩れているか `target` が無いか `loc`・`thread` と一緒に渡した、`id` と `created` の組みが合わない'
        message: '{キー}: {理由}'
    unit_tests:
      - name: test_parse_comment_input_when_invalid
        case: 異常
        summary: 構造の誤りを拾う
        condition: '`parametrize`: `body` が無い / `body` が `"  "` / `body` が 10001 文字 / `body` が `1` / `target` が `1` / `loc` だけ / `id` だけ / `id: X-1` / `thread` が `1` / `thread` と `target` / `thread` と `target`・`loc` / `choice` が `B` / `choice` だけで `target` が無い / `choice` と `loc` / `choice` と `thread`'
        mock: なし
        expected: '`CommentInvalidError`（メッセージに順に `body`・`body`・`body`・`body`・`target`・`target`・`created`・`id`・`thread`・`thread`・`thread`・`choice`・`choice`・`choice`・`choice`）'
        exception: 構造の誤り
      - name: test_parse_comment_input_when_boundary
        case: 正常
        summary: ちょうど上限の本文を受ける
        condition: 前後に空白を付けた 10000 文字の `body`
        mock: なし
        expected: 返した `body` が 10000 文字
  - name: _write_yaml
    title: YAML の書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 共通
    scope: internal
    summary: ワークスペースの 1 ファイルを一時ファイルから置き換える
    side_effects: ファイルを置き換える
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 書くファイル
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 書く中身（`None` のキーは呼ぶ側が落とす）
    returns:
      type: None
      description: '-'
    process: |-
      1. `dump_yaml` した文を一時ファイルに書いて（`write_temp`）`os.replace` で置き換える
         - `OSError` の場合、一時ファイルを削除して `WriteFailedError` を送出する（`write_failed`）
    exceptions:
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError` が起きた
        message: '書き込めませんでした: {パス}（{理由}）'
  - name: _check_choice
    title: 案の選択の確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    scope: internal
    summary: 案の選択が向けた検討事項に当てはまるかを確かめ、合わない理由を返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: target
        type: str
        required: true
        passing: positional
        description: 向けた項目の ID
      - name: key
        type: str
        required: true
        passing: positional
        description: 選んだ案の記号
    returns:
      type: str | None
      description: 合わない理由。当てはまれば `None`
    process: |-
      1. 項目を引く（`find_item`）
         - 検討事項でない場合、`{target} は検討事項ではありません` を返す
      2. 状態が `CHOOSABLE_STATUSES` に無い場合、`{target} は {状態} のため案を選べません` を返す
      3. `options` に `key` の案が無い場合、`{target} に案 {key} がありません` を返す
      4. `None` を返す
    unit_tests:
      - name: test_check_choice
        case: 正常
        summary: 当てはまる案の選択は理由を返さない
        condition: '`parametrize`: 未決定の D-1 の案 B / 要見直しの D-2 の案 A'
        mock: なし
        expected: '`None`'
      - name: test_check_choice_when_mismatch
        case: 正常
        summary: 合わない理由を返す
        condition: '`parametrize`: 資料 A-1 / 決定済みの D-3 / D-1 の案 Z'
        mock: なし
        expected: 順に `検討事項ではありません`・`決定済み のため案を選べません`・`案 Z がありません` を含む理由
  - name: _write_user_choices
    title: 利用者の選択の記載
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    scope: internal
    summary: 送信する案の選択を検討事項の `user_choice` に当て、変更履歴とまとまりを積んで 1 回で記載する
    side_effects: '`decisions.yaml`・`history.yaml`・`changes.yaml` を一時ファイルから置き換える（変わる検討事項が無ければ記載しない）'
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: choices
        type: list[ReviewComment]
        required: true
        passing: positional
        description: 送信する案の選択（溜めた順）
      - name: at
        type: str
        required: true
        passing: keyword
        description: 送信した日時
    returns:
      type: None
      description: なし
    process: |-
      1. 案の選択ごとに、検討事項の今の `user_choice` と `key`・`note` が同じなら飛ばす。違えば `{key, note（あれば）, at}` に置き換えた検討事項を作る
         - 置き換える検討事項が無ければ、何も記載せずに返す
      2. 変更履歴と `changes.yaml` を読み（`load_item_history`、`load_changes`）、まだまとめていない変更があれば先にその書いた元のまとまりにする（`commit_pending`。説明と `by` は『保存待ちの編集』の `save_edits` と同じ）
      3. 置き換える検討事項ごとに、`by: user`・`before` に置き換える前の `user_choice` を持った変更履歴を 1 回分積み、`history.yaml` の行の `updated`・`updated_by`（`user`）を書き換える（`make_entry`、`stack_history`、`note_pending`）
      4. 案の選択の変更を説明 `CHOICE_SUMMARY`・`by: user` の 1 つのまとまりにする（`commit_pending`）
      5. 検討事項・変更履歴・まとまりを 1 回で記載し（`save_batch`）、書き換えの検知に自分の書き込みとして伝える（`accept_written`）
    exceptions:
      - name: WriteFailedError
        condition: '`save_batch` が送出するもの'
    unit_tests:
      - name: test_write_user_choices
        case: 正常
        summary: 選択を書き換え、前の選択を変更履歴に残す
        condition: '`user_choice: {key: A}` を持つ D-1 に案 B（一言「x」）の選択'
        mock: なし
        expected: 'D-1 の `user_choice` が `{key: B, note: x, at}`。D-1 の変更履歴の最後の `before.user_choice.key` が `A`、`by` が `user`'

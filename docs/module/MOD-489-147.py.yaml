functions:
  - name: load_comments
    title: レビュー中のコメントの読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 共通
    scope: public
    summary: '`comments.yaml` を読み、スキーマと突き合わせて `CommentFile` にする'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: CommentFile
      description: 'ファイルが無ければ `seq: 0`・空の `items`'
    process: |-
      1. ファイルが無ければ空を返す
      2. 読み込み（モジュール構成『読み書きと検証』の `load_yaml_text`）、`COMMENTS_SCHEMA` と突き合わせる
         - 読めないか合わない場合、`comments.yaml: {キーのパス}: {理由}` の行を持った `SchemaMismatchError` を送出する
      3. `items` を連番の小さい順の `ReviewComment` にして返す（`loc` は `parse_location`）
    exceptions:
      - name: SchemaMismatchError
        condition: '`comments.yaml` が YAML として読めないか、スキーマに合わない'
    unit_tests:
      - name: test_load_comments
        case: 正常
        summary: 連番の順に読む
        condition: '`seq: 3` と C-3・C-1 をこの順に持つ `comments.yaml`'
        mock: なし
        expected: '`seq` が 3、`items` が C-1・C-3 の順'
      - name: test_load_comments_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: '`comments.yaml` が無いワークスペース'
        mock: なし
        expected: '`CommentFile(seq=0, items=[])`'
      - name: test_load_comments_when_invalid
        case: 異常
        summary: 読めない・合わないファイルは読まない
        condition: '`parametrize`: `items: [` / C-1 から `body` を削除したもの'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` が `comments.yaml: ` で始まる）'
        exception: 読めないかスキーマに合わない
  - name: load_drafts
    title: 下書きの読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    scope: public
    summary: '`drafts.yaml` を読み、スキーマと突き合わせて下書きの並びにする'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: list[Draft]
      description: ファイルの並びの順。無ければ空
    process: |-
      1. ファイルが無ければ空を返す
      2. 読み込み（モジュール構成『読み書きと検証』の `load_yaml_text`）、`DRAFTS_SCHEMA` と突き合わせる
         - 読めないか合わない場合、`drafts.yaml: {キーのパス}: {理由}` の `SchemaMismatchError` を送出する
      3. `items` を `Draft` にして返す
    exceptions:
      - name: SchemaMismatchError
        condition: '`drafts.yaml` が YAML として読めないか、スキーマに合わない'
    unit_tests:
      - name: test_load_drafts
        case: 正常
        summary: 下書きを読む。無ければ空
        condition: '`parametrize`: D-1 への下書きと項目を指さない下書き / `drafts.yaml` が無い'
        mock: なし
        expected: 2 件（後者の `target` が `None`） / `[]`
  - name: list_review
    title: レビュー中の読み取り
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    scope: public
    summary: レビュー中のコメントに向けた項目のタイトルを付け、下書きと合わせて『レビュー中のコメントの読み取り』の構造にする
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース（項目のタイトルを引く）
    returns:
      type: dict[str, Any]
      description: '`{items: [ReviewCommentView の asdict], drafts: [{target, loc, thread, body}]}`'
    process: |-
      1. コメントと下書きを読む（`load_comments`、`load_drafts`）
      2. コメントごとに `target` の項目の `title`（紐づかないか無ければ `None`）を付ける（`find_item` の `ItemNotFoundError` は `None` にする）
    unit_tests:
      - name: test_list_review
        case: 正常
        summary: タイトルを付けて下書きと返す
        condition: D-1 と、C-1（D-1）・C-2（消えた D-9）・C-3（項目を指さない）、D-1 への下書き
        mock: なし
        expected: C-1 の `target_title` が D-1 のタイトル、C-2・C-3 は `None`。`drafts` が 1 件
      - name: test_list_review_when_thread
        case: 正常
        summary: 返信と返信の下書きは返信先を持つ
        condition: 'C-1（`thread: TH-1`）と、TH-1 への下書き'
        mock: なし
        expected: C-1 の `thread` が TH-1 で `target`・`target_title`・`loc` が `None`。`drafts` の 1 件の `thread` が TH-1
  - name: add_comment
    title: コメントを溜める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    scope: public
    summary: 向けた先（項目と箇所か、返信先のスレッド）と本文・案の選択を確かめ、レビュー中のコメントを 1 件追加する。`id` を渡されたら削除したコメントを同じ ID で戻す（鍵は呼ぶ側が取る。スレッドは作らない）
    side_effects: '`comments.yaml` を一時ファイルから置き換える。新しく溜めたときは同じ向けた先の下書きを `drafts.yaml` から削除する（案の選択は下書きを削除しない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文のオブジェクト（`target`・`loc`・`thread`・`body`・`id`・`created`・`choice`）
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[ReviewComment, int]
      description: 溜めたコメントと、溜めた後の件数
    process: |-
      1. 入力を確かめる（`_parse_comment_input`）
      2. ワークスペースを読み（`load_workspace`）、`target` があれば項目を引く（`find_item`）
      3. `loc` があれば今の項目に合うかを確かめる（`check_location`）
         - 合わなければ、その理由の `CommentConflictError` を送出する
      4. `choice` があれば案の選択を確かめる（`_check_choice`）
         - 理由が返れば、その理由の `CommentConflictError` を送出する
      5. `thread` があればスレッドを読み（`load_threads`）、ID で引く
         - 無ければ `ThreadNotFoundError` を送出する
         - クローズなら `スレッド {ID} はクローズです` の `CommentConflictError` を送出する（元に戻すときも同じ）
      6. コメントを読む（`load_comments`）
         - `choice` があり、同じ `target` に `choice` を持つコメントが既にある場合、`{target} への案の選択は {ID} にあります` の `CommentConflictError` を送出する
         - `id` がある場合、その ID が今の `items` にあるか連番が `seq` を超えれば `CommentConflictError` を送出する。渡された ID と `created` で戻し、`seq` は変えない
         - `id` が無ければ `C-{seq + 1}` と今の日時で追加し、`seq` を 1 上げる
      7. 連番の小さい順に並べた `{seq, items}` を書く（`_write_yaml`。`None` の `target`・`loc`・`thread`・`body`・`choice` はキーを記載しない。`choice` は `{key}` で記載する）
      8. 新しく溜めたとき（案の選択を除く）、同じ向けた先（`target` と `loc` の組か、`thread`）の下書きがあれば削除して書く
         - `WriteFailedError` の場合、`[WARNING]` 下書きを削除できなかった（パス・理由）を出して溜めたまま返す
    exceptions:
      - name: CommentInvalidError
        condition: '`_parse_comment_input` が送信するもの'
      - name: ItemNotFoundError
        condition: '`target` の項目がワークスペースに無い'
        message: '項目がありません: {target}'
      - name: CommentConflictError
        condition: 箇所が今の項目に合わない、返信先のスレッドがクローズ、戻す `id` が今のレビュー中にあるか `seq` を超える、案の選択が `_check_choice` に合わない、または同じ検討事項への案の選択が既にレビュー中にある
        message: '{理由}'
      - name: WriteFailedError
        condition: '`comments.yaml` の一時ファイルの書き込みか置き換えで `OSError` が起きた'
        message: '書き込めませんでした: {パス}（{理由}）'
      - name: ThreadNotFoundError
        condition: '`thread` のスレッドが無い'
        message: 'スレッドがありません: {ID}'
    unit_tests:
      - name: test_add_comment
        case: 正常
        summary: 連番を振って溜め、下書きを削除する
        condition: 'D-1、`seq: 2` と C-2、D-1 への下書き。`{target: D-1, body: "  案 A にする "}`。`now` は `2026-10-05T03:00:00+00:00`'
        mock: '`now`'
        expected: '`(C-3・D-1・案 A にする・now の値, 2)`。`comments.yaml` の `seq` が 3、`drafts.yaml` に D-1 への下書きが無い'
      - name: test_add_comment_when_location_and_no_target
        case: 正常
        summary: 箇所を持つコメントと項目を指さないコメントを溜める
        condition: '`parametrize`: A-1 の本文の 2 行目の `loc` / `body` だけ'
        mock: '`now`'
        expected: 前者は渡した `loc` を持ち、後者は `target`・`loc` を持たない（ファイルにもキーが無い）
      - name: test_add_comment_when_restore
        case: 正常
        summary: 削除したコメントを同じ ID と日時で元の並びに戻す
        condition: '`seq: 3` と C-1・C-3。`{id: C-2, created: 2026-10-05T01:00:00+00:00, target: D-1, body}`'
        mock: '`now`（呼ばれないことを確かめる）'
        expected: '`items` が C-1・C-2・C-3 の順で `seq` が 3。C-2 の `created` が渡した日時'
      - name: test_add_comment_when_rejected
        case: 異常
        summary: 無い項目・合わない箇所・使えない ID は溜めない
        condition: '`parametrize`: `target: D-99` / 本文に無い文の `loc` / `id: C-1`（今ある）/ `id: C-9`（`seq` が 3）'
        mock: なし
        expected: '`ItemNotFoundError` / `CommentConflictError` / `CommentConflictError` / `CommentConflictError`。`comments.yaml` が呼ぶ前と同じ'
        exception: 項目が無い・箇所が合わない・戻せない ID
      - name: test_add_comment_when_write_fails
        case: 異常
        summary: 置き換えに失敗したら前のコメントを残す
        condition: C-1 を持つワークスペース。`os.replace` を `OSError` を送出する関数に差し替える
        mock: '`os.replace`（`comments` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`。`comments.yaml` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: 置き換えで OSError
      - name: test_add_comment_when_reply
        case: 正常
        summary: オープンのスレッドへの返信を溜め、そのスレッドの下書きを削除する
        condition: 'オープンの TH-1 と、TH-1 への下書き・D-1 への下書き。`{thread: TH-1, body: 了解}`'
        mock: '`now`'
        expected: 溜めたコメントの `thread` が TH-1 で、ファイルに `target`・`loc` のキーが無い。`drafts.yaml` に D-1 への下書きだけが残る。`threads.yaml` が呼ぶ前と同じ
      - name: test_add_comment_when_reply_rejected
        case: 異常
        summary: 無いスレッド・クローズのスレッドへの返信は溜めない
        condition: 'クローズの TH-2。`parametrize`: `{thread: TH-9, body: x}` / `{thread: TH-2, body: x}`'
        mock: なし
        expected: '`ThreadNotFoundError` / `CommentConflictError`（メッセージに `クローズ`）。`comments.yaml` が無い'
        exception: スレッドが無い・クローズ
      - name: test_add_comment_when_choice
        case: 正常
        summary: 案の選択を一言つきで溜め、検討事項と下書きは変えない
        condition: '案 A・B を持つ未決定の D-1 と D-1 への下書き。`{target: D-1, choice: {key: B}, body: 費用を優先する}`'
        mock: '`now`'
        expected: '溜めたコメントの `choice` が `B`・`body` が `費用を優先する`。ファイルに `choice: {key: B}` があり `loc`・`thread` のキーが無い。`decisions.yaml`・`drafts.yaml` が呼ぶ前と同じ'
      - name: test_add_comment_when_choice_without_note
        case: 正常
        summary: 一言なしの案の選択は本文のキーを記載しない
        condition: '案 A・B を持つ未決定の D-1。`{target: D-1, choice: {key: A}}`'
        mock: '`now`'
        expected: 溜めたコメントの `body` が `None` で、ファイルに `body` のキーが無い
      - name: test_add_comment_when_choice_rejected
        case: 異常
        summary: 選べない検討事項・案に無い記号・同じ検討事項への 2 件目は溜めない

id: MOD-489-147
title: サーバー / コメント / comments.py
lead: レビュー中のコメント（`comments.yaml`）と下書き（`drafts.yaml`）を読み書きし、チェックしたコメントをスレッドへ移す。文字起こしの結果の書き込み 1 件は、レビュー中に溜めずにすぐスレッドへ追加する。箇所・スレッド・読み書きと検証に依存し、鍵は呼ぶ側（配信）が取る。
test_files:
  - tests/unit/scripts/test_comments.py
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    schemas/comments.schema.json  comments.yaml の構造（ER 図『ワークスペース』のレビュー中のコメント）
    schemas/drafts.schema.json    drafts.yaml の構造（同じく下書き）
    scripts/comments.py           レビュー中のコメントと下書きの読み書き・まとめて送信する・すぐ送信する
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class コメント
        class 箇所
        class スレッド
        class 読み書きと検証
        class 変更履歴
        class 変更の検知
        コメント --> 箇所 : 構造と合うかの確かめ
        コメント --> スレッド : 返信先の確かめ・まとめて送信する・すぐ送信する
        コメント --> 読み書きと検証
        コメント --> 変更履歴 : 案の選択の変更履歴とまとまり
        コメント --> 変更の検知 : 自分の書き込みを伝える
      ```
data_models:
  - name: ReviewComment
    title: レビュー中のコメント
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 共通
    role: DTO
    summary: '`comments.yaml` の 1 件。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: id
        type: str
        description: '`C-{連番}`'
      - name: target
        type: str | None
        description: 向けた項目の ID。項目に紐づかないコメントは `None`
      - name: loc
        type: Location | None
        description: 選んだ箇所
      - name: body
        type: str | None
        description: 本文（前後の空白を除いたもの）。一言を添えない案の選択は `None`（キーを記載しない）
      - name: created
        type: str
        description: 溜めた日時
      - name: thread
        type: str | None
        default: None
        description: 返信先のスレッドの ID。新規スレッドの最初の書き込みは `None`（キーを書かない）。持つときは `target`・`loc` を持たない
      - name: choice
        type: str | None
        default: None
        description: 案の選択の選んだ案の記号（`comments.yaml` の `choice.key`）。案の選択でないコメントは `None`（キーを記載しない）。持つときは `target` が検討事項で、`loc`・`thread` を持たない
  - name: CommentFile
    title: レビュー中のコメントのファイル
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 共通
    role: DTO
    summary: '`comments.yaml` の中身。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: seq
        type: int
        description: 最後に振った連番（無ければ 0）
      - name: items
        type: list[ReviewComment]
        description: 連番の小さい順のコメント
  - name: Draft
    title: 下書き
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    role: DTO
    summary: '`drafts.yaml` の 1 件。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: target
        type: str | None
        description: 入力欄が向ける項目の ID
      - name: loc
        type: Location | None
        description: 入力欄に添えた箇所
      - name: body
        type: str
        description: 下書きの本文
      - name: updated
        type: str
        description: 書いた日時
      - name: thread
        type: str | None
        default: None
        description: 返信の入力欄が向けるスレッドの ID（キーを書かないときは `None`）。持つときは `target`・`loc` を持たない
  - name: ReviewCommentView
    title: 読み取りのコメント
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    role: DTO
    summary: 『レビュー中のコメントの読み取り』の `items[]` の 1 行。`ReviewComment` に `target_title` を追加したもの。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: id
        type: str
        description: コメントの ID
      - name: target
        type: str | None
        description: 向けた項目の ID
      - name: target_title
        type: str | None
        description: 向けた項目のタイトル。紐づかないか消えていれば `None`
      - name: loc
        type: dict[str, Any] | None
        description: 箇所（`location_to_dict`）
      - name: body
        type: str | None
        description: 本文。一言を添えない案の選択は `None`
      - name: created
        type: str
        description: 溜めた日時
      - name: thread
        type: str | None
        description: 返信先のスレッドの ID。新規スレッドの最初の書き込みは `None`
      - name: choice
        type: dict[str, str] | None
        description: 案の選択（`{key}`）。案の選択でないコメントは `None`
  - name: CommentInput
    title: コメントの入力
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: 項目へコメントする
    role: DTO
    summary: '`_parse_comment_input` が確かめた溜める要求。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: target
        type: str | None
        description: 向けた項目の ID
      - name: loc
        type: Location | None
        description: 選んだ箇所
      - name: thread
        type: str | None
        description: 返信先のスレッドの ID
      - name: body
        type: str | None
        description: 前後の空白を除いた本文。案の選択で一言を渡さなければ `None`
      - name: id
        type: str | None
        description: 元に戻すときのコメントの ID
      - name: created
        type: str | None
        description: 元に戻すときの溜めた日時
      - name: choice
        type: str | None
        description: 案の選択の選んだ案の記号
  - name: SentItem
    title: 送信した書き込み
    container: plugins/mindstella/skills/mindmap/scripts/comments.py
    usecase: コメントを選んで送信する
    role: DTO
    summary: 『コメントをまとめて送信する』の `items[]` の 1 行。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: comment
        type: str
        description: 送信したレビュー中のコメントの ID
      - name: thread
        type: str | None
        description: 書き込みを追加したスレッドの ID。案の選択は `None`
      - name: post
        type: str | None
        description: 追加した書き込みの ID。案の選択は `None`
      - name: decision
        type: str | None
        description: 案の選択のとき、`user_choice` を記載した検討事項の ID。それ以外は `None`

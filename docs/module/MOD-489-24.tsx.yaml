id: MOD-489-24
title: プレビュー / detail-header
lead: 戻る・進む・全画面・エクスポート・編集・閉じるを並べる。
components:
  - name: DetailHeader
    title: 詳細の見出し
    kind: コンポーネント
    usecase: 項目の詳細を読む
    summary: 戻る・進む・全画面・エクスポート・編集・閉じるを並べる。全画面のボタンは幅 768px 以上だけ描く。`error` があれば見出しの下に `role="alert"` で出す。`toc` が 1 つ以上あるときは、エクスポートの左に部品『本文の目次』（`BodyToc`）を置き、`onHeading` を渡す
    container: frontend/src/features/detail/detail-panel/components/detail-header.tsx
    props:
      - name: toc
        type: readonly TocEntry[]
        required: false
        default: '[]'
        description: 本文の見出し。空のときは目次のボタンを描かない
      - name: onHeading
        type: '(slug: string) => void'
        required: false
        description: 目次で押した見出し
      - name: sibling
        type: SiblingNavProps | null
        required: false
        default: 'null'
        description: 一覧の並びの位置と前後へ移る操作。`null` のときは部品『一覧の並びの前後』を描かず、キーも受けない
      - name: commentCount
        type: number
        required: false
        default: '0'
        description: コメントの一覧のボタンに出す件数。1 以上のときアイコンの右上にバッジ（100 以上は `99+`）を重ね、ボタンの `aria-label` を「{ID} のコメントの一覧を開く（{件数} 件）」にする
    unit_tests:
      - name: test_detail_header_when_toc
        case: 正常
        summary: 見出しがあるときだけ目次のボタンを描く
        condition: '`parametrize`: `toc` に 2 件 / `toc` が空'
        mock: なし
        expected: 「本文の目次」のボタンがある / 無い
      - name: test_detail_header_when_sibling
        case: 正常
        summary: 一覧の並びの前後を戻る・進むの左に描く
        condition: '`parametrize`: `sibling` が `{position: 2, total: 3}` / `null`'
        mock: なし
        expected: 「2 / 3」が「前の項目へ戻る」より前にある / 無い
      - name: test_detail_header_when_key
        case: 正常
        summary: j・k で前後へ移る
        condition: '`parametrize`: `j` / `k` / 入力欄にフォーカスして `j` / `Ctrl+j` / `isComposing` の `j`'
        mock: なし
        expected: '`onNext` / `onPrev` / どちらも呼ばれない / 呼ばれない / 呼ばれない'
      - name: test_detail_header_when_comment_count
        case: 正常
        summary: コメントの一覧のボタンに件数のバッジを描く
        condition: '`parametrize`: `commentCount` が 3 / 0'
        mock: なし
        expected: ボタンに `3` のバッジがあり名前が「D-1 のコメントの一覧を開く（3 件）」 / バッジが無く名前が「D-1 のコメントの一覧を開く」
notes:
  単体テスト: 同じフォルダの `detail-header.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  一覧の並びの前後: '`sibling` を受けたとき、戻る・進むの左に `SiblingNav` を描き、`useShortcut`（モジュール構成『use-shortcut』）で `item.prev` を `onPrev`（先頭では無効）、`item.next` を `onNext`（末尾では無効）に割り当てる。戻り値の `active` が真のときだけ `SiblingNav` の `keys` に `keys`・`label` を指定する。種類と ID の `span` は `shrink-0 whitespace-nowrap`、見出しのタイトルは `min-w-0 truncate`（#690）'

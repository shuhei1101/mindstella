id: MOD-489-9
title: プレビュー / thread-post
lead: 部品設計『スレッドの書き込み.tsx』の props・イベント・状態を持つ。
components:
  - name: ThreadPost
    title: スレッドの書き込み
    kind: コンポーネント
    usecase: スレッドで話す
    summary: 部品設計『スレッドの書き込み.tsx』の props・イベント・状態を持つ
    refs:
      - CMP-489-12#
    unit_tests:
      - name: test_thread_post
        case: 正常
        summary: AI の書き込み
        condition: AI の `post`
        mock: mdmark の差し替え
        expected: 左に寄せた本文
      - name: test_thread_post_when_pending_editing
        case: 正常
        summary: 書き換え
        condition: '`pending` と `editing`'
        mock: なし
        expected: 入力欄と「キャンセル」「修正」
    container: frontend/src/features/comments/shared/thread-post.tsx
notes:
  単体テスト: 同じフォルダの `thread-post.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  修正の入力の音声入力: '`editing` の間、部品設計の `voice`・`voiceReason`・`elapsed`・`levels`・`voiceStatus`・`voiceDetail` と `onEditVoiceStart`・`onEditVoiceCancel`・`onEditVoiceDone`（と押せないときの `onEditVoiceBlocked`）を `ReviewEditForm` へそのまま渡す。`editBody` は入力欄の中身で、書き換えは `onEditInput(id, body)` で使う側へ知らせる。ストーリーに部品設計の `PendingEditingRecording`・`PendingEditingTranscribing`・`PendingEditingInserted`・`PendingEditingVoiceDisabled` を足す'

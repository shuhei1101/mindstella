id: MOD-489-199
title: プレビュー / 基盤 / dom.ts
test_files:
  - tests/unit/preview/test_dom.py
constants:
  - name: PRESS_SLOP_PX
    title: 押したとみなす移動の上限
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 検討事項をマップで辿る
    summary: 背景を押してから離すまでのポインターの移動（縦・横それぞれの px）がこの値以内なら、ドラッグではなく押したとみなす（タッチパッド・ペンで 1 回押すときのぶれを吸収し、マップを動かすつもりのドラッグとは取り違えない幅）。`MindmapPreview.PRESS_SLOP_PX` として出し、差分のミニマップの印を押したかドラッグかの見分けもこの値を使う
    value: '5'
functions:
  - name: h
    title: 要素を作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 要素を作り、属性とイベントのリスナーを付け、子を並べる
    args:
      - name: tag
        type: keyof HTMLElementTagNameMap
        required: true
        passing: keyword
        description: 要素の名前
      - name: attrs
        type: Record<string, string | number | boolean | null | undefined | EventListener>
        required: false
        passing: keyword
        description: 属性。`on` で始まる名前の関数はそのイベントのリスナーとして付ける。`class` は `className`、`true` は値の無い属性にする。`null`・`undefined`・`false` は付けない
      - name: children
        type: (Node | string | number | null | undefined | false)[]
        required: false
        passing: keyword
        description: 子。文字と数は文字として入れ、`null`・`undefined`・`false` は入れない
    returns:
      type: HTMLElementTagNameMap[tag]
      description: 作った要素
    unit_tests:
      - name: test_h
        case: 正常
        summary: 属性・リスナー・子を付けた要素を返す
        condition: '`{tag: "button", attrs: {class: "b", disabled: true, title: null, hidden: false, onclick: 数える関数}, children: ["a", 1, null, false, 要素]}` で作り、click のイベントを送る'
        mock: なし
        expected: '`className` が `b`、`disabled` が空の値で付き、`title`・`hidden` は無い。子は `a`・`1`・要素の 3 つ。関数が 1 回呼ばれる'
  - name: append
    title: 子を足す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 要素の中に子を足す
    args:
      - name: parent
        type: Element
        required: true
        passing: keyword
        description: 足す先
      - name: children
        type: (Node | string | number | null | undefined | false)[]
        required: true
        passing: keyword
        description: '`h` の `children` と同じ扱い'
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_append
        case: 正常
        summary: 偽の値を除いて末尾に足す
        condition: 子を 1 つ持つ要素に `["x", 0, undefined, false]`
        mock: なし
        expected: 子が `元の子・x・0` の 3 つ
  - name: icon
    title: アイコン
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 24px の枠に描いた線のアイコン。読み上げ名は付けず、装飾として隠す
    args:
      - name: name
        type: IconName（画面が使うアイコンの名前）
        required: true
        passing: positional
        description: アイコンの名前
    returns:
      type: SVGSVGElement
      description: '`class="icon"`・`viewBox="0 0 24 24"`・`aria-hidden="true"` の SVG'
    unit_tests:
      - name: test_icon
        case: 正常
        summary: 装飾として隠した SVG を返す
        condition: '`"search"`'
        mock: なし
        expected: '`svg.icon` で `aria-hidden` が `true`、子の図形を 1 つ以上持つ'
  - name: statusMark
    title: 状態の印
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 状態ごとの印（色と形）を 10px の枠に描く。検討事項・タスク・資料の状態を持つ
    args:
      - name: status
        type: string | undefined
        required: true
        passing: positional
        description: 項目の状態
    returns:
      type: SVGSVGElement | null
      description: '`class="mark"` の SVG。知らない状態・`undefined` は `null`'
    unit_tests:
      - name: test_status_mark
        case: 正常
        summary: 知っている状態だけ印を返す
        condition: '`parametrize`: `決定済み` / `要見直し` / `完成` / `知らない` / `undefined`'
        mock: なし
        expected: '`svg.mark` / `svg.mark` / `svg.mark` / `null` / `null`'
  - name: statusBadge
    title: 状態の表示
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 状態の印と名前を並べる
    args:
      - name: status
        type: string | undefined
        required: true
        passing: positional
        description: 項目の状態
    returns:
      type: Node
      description: '`span.st`（`data-st` に状態）。`undefined` は空の断片'
    unit_tests:
      - name: test_status_badge
        case: 正常
        summary: 印と名前を並べ、状態が無ければ空
        condition: '`parametrize`: `未決定` / `undefined`'
        mock: なし
        expected: '`span.st` で `data-st` が `未決定`、文字が `未決定`、`svg.mark` を持つ / 子の無い断片'
  - name: impactBadge
    title: 影響度の表示
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 影響度（大・中・小）を 3 本の目盛りと文字で表す
    args:
      - name: weight
        type: string | undefined
        required: true
        passing: positional
        description: 影響度
      - name: labeled
        type: boolean
        required: false
        default: 'false'
        passing: positional
        description: 目盛りの横の文字に軸の名前を添えて「影響度 大」にするか。列名「影響度」の下に出す表は `false`、概要の次に検討する項目は `true`
    returns:
      type: Node
      description: '`span.impact`。大は 3 本・中は 2 本・小は 1 本の目盛りを `on` にする。文字は `labeled` が真なら「影響度 {値}」、偽なら「{値}」。大・中・小のどれでもない値と `undefined` は空の断片'
    unit_tests:
      - name: test_impact_badge
        case: 正常
        summary: 影響度ごとの目盛りの数
        condition: '`parametrize`: `大` / `中` / `小` / `知らない` / `undefined`（いずれも `labeled` なし）と、`大` で `labeled = true`'
        mock: なし
        expected: '`on` の目盛りが 3 / 2 / 1 本（文字は `大` / `中` / `小`）/ 空の断片 / 空の断片。`labeled = true` は目盛り 3 本で文字が `影響度 大`'
  - name: deliverableBadge
    title: 納品物の印
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 納品物の資料に付ける印（箱のアイコンと「納品物」）
    args: []
    returns:
      type: HTMLElement
      description: '`span.deliv-badge`'
    unit_tests:
      - name: test_deliverable_badge
        case: 正常
        summary: アイコンと文字を持つ
        condition: 引数なし
        mock: なし
        expected: '`span.deliv-badge` が `svg.icon` と文字 `納品物` を持つ'
  - name: emptyNote
    title: 空のときの 1 行
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 一覧が空のときに出す 1 行（「該当なし」など）
    args:
      - name: text
        type: string
        required: true
        passing: positional
        description: 出す文
    returns:
      type: HTMLElement
      description: '`p.empty`'
    unit_tests:
      - name: test_empty_note
        case: 正常
        summary: 文を持つ段落を返す
        condition: '`"該当なし"`'
        mock: なし
        expected: '`p.empty` の文字が `該当なし`'
  - name: enableDragScroll
    title: 背景のドラッグで動かす
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: スクロールする要素を、押せるもの（button・a・input・label）の上でない所の左ボタンのドラッグで動かせるようにする。`onPress` を渡したときは、押してから離すまでの移動が縦・横とも `PRESS_SLOP_PX` 以内なら、離したときにそれを呼ぶ
    side_effects: 要素にポインターのリスナーを付ける。ドラッグの間は `dragging` のクラスを付ける
    args:
      - name: scroller
        type: HTMLElement
        required: true
        passing: positional
        description: スクロールする要素（ボード・マップ）
      - name: onPress
        type: () => void
        required: false
        passing: positional
        description: 背景を押した（ドラッグしなかった）ときに呼ぶ。渡さなければ何も呼ばない（ボード）
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_enable_drag_scroll
        case: 正常
        summary: 背景のドラッグで動き、ボタンの上では動かない
        condition: '`parametrize`: 背景で押して左へ 50px・上へ 30px 動かす / ボタンの上で押して同じだけ動かす'
        mock: なし
        expected: '`scrollLeft` が 50・`scrollTop` が 30 増え、離すと `dragging` が外れる / `scrollLeft`・`scrollTop` が変わらない'
      - name: test_enable_drag_scroll_when_pressed
        case: 正常
        summary: 背景を押したときだけ `onPress` を呼び、ドラッグとボタンの上では呼ばない
        condition: '`parametrize`: 背景で押して動かさずに離す / 背景で押して右へ 5px・下へ 5px 動かして離す / 背景で押して右へ 6px 動かして離す / ボタンの上で押して動かさずに離す'
        mock: '`onPress` に呼ばれた回数を数える関数'
        expected: 呼ばれた回数が 1 / 1 / 0 / 0
  - name: markSelected
    title: 選択中の印を付け替える
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: 詳細パネルで開いている項目を持ち、描いてある行・カード・節（`main [data-id]`）の `selected` を付け替える
    side_effects: 開いている項目の ID を持ち替え、`main [data-id]` のクラスを書き換える
    args:
      - name: id
        type: string | null
        required: true
        passing: positional
        description: 開いた項目の ID。閉じたときは `null`
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_mark_selected
        case: 正常
        summary: 開いた項目だけに印が付き、持った ID を引ける
        condition: '`main` の中に `data-id` が D-1・D-2 の要素を置き、`parametrize`: `"D-2"` / `null`'
        mock: なし
        expected: D-2 だけが `selected`・`currentSelection()` が `D-2` / どれも `selected` でなく、`currentSelection()` が `null`
  - name: currentSelection
    title: 開いている項目
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: '`markSelected` が最後に受けた ID を返す。描き直した行・カードに「選択中」の印を付けるのに使う'
    args: []
    returns:
      type: string | null
      description: 開いている項目の ID
  - name: inertBehind
    title: パネルの下を止める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: ピン止めしたコメントの一覧が覆った本文の部品に `inert` を付け、外す関数を返す
    side_effects: '`main` の中の要素の `inert` 属性を書き換える'
    args:
      - name: panel
        type: HTMLElement
        required: true
        passing: positional
        description: 開いたパネル
    returns:
      type: () => void
      description: 付けた分だけ `inert` を外す関数（パネルを閉じるときに呼ぶ）
    process: |-
      1. `main` の直下からたどり、パネルの矩形に全体が収まる要素に `inert` を付ける（一部だけ重なる要素はその子をたどる）。パネル自身・トップバー・既に `inert` の要素には付けない
      2. 付けた要素を控え、それだけから `inert` を外す関数を返す
    unit_tests:
      - name: test_inert_behind
        case: 正常
        summary: パネルに覆われた部品だけを止め、外すと付けた分だけ戻す
        condition: 左端 0〜420px のパネル。`main` に左端のボタン A（x=10）・右側のボタン B（x=600）・始めから `inert` の C（x=20）、トップバーのボタン D（x=10）
        mock: なし
        expected: A だけに `inert` が付き、B・D は付かない。返った関数を呼ぶと A から外れ、C は `inert` のまま
      - name: test_inert_behind_when_redrawn
        case: 正常
        summary: 本文を描き直してから呼び直すと、新しい部品も止まる
        condition: '`test_inert_behind` と同じパネルと本文で呼んだ後、`main` の中身を左端のボタン E（x=10）だけに差し替え、返った解除を呼んでからもう一度呼ぶ'
        mock: なし
        expected: E に `inert` が付き、E にフォーカスを移せない
  - name: inertOutside
    title: パネルの外を止める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 共通
    scope: public
    summary: グレーアウトで覆う間、左から重ねるパネル（ピン止めしていないコメントの一覧・表示の設定・保存待ち・絞り込みのドロワー）と詳細パネル（`aside.panel`）を除いた本文の部品に `inert` を付け、外す関数を返す
    side_effects: '`main` と、その中の要素の `inert` 属性を書き換える'
    args:
      - name: panel
        type: HTMLElement
        required: true
        passing: positional
        description: 開いたパネル
    returns:
      type: () => void
      description: 付けた分だけ `inert` を外す関数（パネルを閉じるとき・描き直す前に呼ぶ）
    process: |-
      1. `main` からたどる。パネル自身・詳細パネル・既に `inert` の要素には付けない
      2. パネルか詳細パネルを中に持つ要素は、その子をたどる。それ以外の要素は、まとめて `inert` を付ける（パネルを中に持たない `main` は、`main` 自体に付ける）
      3. 付けた要素を控え、それだけから `inert` を外す関数を返す
    unit_tests:
      - name: test_inert_outside
        case: 正常
        summary: パネルと詳細パネルを除いた本文を止め、外すと付けた分だけ戻す
        condition: '`main` に、パネル P とボタン A を持つ囲み W・ボタン B・始めから `inert` の C・`aside.panel` の詳細パネル E。トップバーのボタン D は `main` の外'
        mock: なし
        expected: A・B に `inert` が付き、P・W・E・D には付かない。返った関数を呼ぶと A・B から外れ、C は `inert` のまま
      - name: test_inert_outside_when_no_panel_inside
        case: 正常
        summary: パネルを中に持たない本文は main ごと止める
        condition: '`main` の外（`body` の直下）に置いたパネル P と、ボタン A を持つ `main`'
        mock: なし
        expected: '`main` に `inert` が付き、A にフォーカスを移せない。返った関数を呼ぶと `main` から外れる'

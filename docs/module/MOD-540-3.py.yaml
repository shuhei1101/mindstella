id: MOD-540-3
title: サーバー / 移行 / refs_to_related.py
test_files:
  - tests/unit/scripts/test_refs_to_related.py
functions:
  - name: refs_to_related.migrate
    title: 参照のキーを種類つきの関連へ移す移し替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/migrations/v0.13.0/scripts/refs_to_related.py
    usecase: 記録の形式の移行
    scope: public
    summary: 'v0.13.0 の `call`（`refs_to_related`）が呼ぶ変換。検討事項の `depends_on`・`parent`、タスクの `for`・`depends_on` を `related` の `{to, type}` へ移し、既にある `related` の ID の文字列を `{to, type: see_also}` にする'
    side_effects: '`.mindstella/decisions.yaml`・`.mindstella/tasks.yaml` と、`related` を持つ種類の YAML を書き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: list[str]
      description: 変えたファイル（ワークスペースからの相対パス。変えなければ空）
    process: |-
      1. 種類ごとの YAML を読む。無いファイルは飛ばす。一番上が辞書でないか `items` が配列でない場合、`{ファイル名} の形が崩れています` の `ValueError` を送る
      2. 項目ごとに `related` を作り直す。並びは `depends_on`・`parent`・`for`・元の `related` の順で、`depends_on`・`for` の ID と `parent` の ID は `type` にそのキーの名前、元の `related` の文字列は `type: see_also` を付ける。既に `{to, type}` の要素はそのまま残し、同じ `to`・`type` の組は最初の 1 件だけ残す
      3. `depends_on`・`parent`・`for` のキーを消す。`updated`・`history` は変えない（`history` の `before` のキーの名前も変えない）
      4. 変えたファイルだけを『読み書きと検証』の `dump_yaml` と `write_temp` で一時ファイルに書き、`os.replace` で置き換える
      5. 変えたファイルのワークスペースからの相対パスを返す
    exceptions:
      - name: ValueError
        condition: 種類の YAML の形が崩れている
      - name: OSError
        condition: 読めない・書けない
    unit_tests:
      - name: test_refs_to_related
        case: 正常
        summary: 参照のキーを related へ移し、同じ組は 1 件にする
        condition: 'D-2（`depends_on: [D-1]`・`parent: D-1`・`related: [R-1, D-1]`）、T-1（`for: [D-2]`・`depends_on: [T-2]`）'
        mock: なし
        expected: '戻り値が `[.mindstella/decisions.yaml, .mindstella/tasks.yaml]`。D-2 の `related` が `[{to: D-1, type: depends_on}, {to: D-1, type: parent}, {to: R-1, type: see_also}, {to: D-1, type: see_also}]` で `depends_on`・`parent` を持たない。T-1 の `related` が `[{to: D-2, type: for}, {to: T-2, type: depends_on}]`'
      - name: test_refs_to_related_when_applied_twice
        case: 正常
        summary: 2 度当てても変わらない
        condition: '1 回当てたワークスペース'
        mock: なし
        expected: '戻り値が空で、どのファイルも呼ぶ前と同じ'

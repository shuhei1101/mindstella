id: MOD-713-2
title: プレビュー / panel-width-store
lead: 左のパネルと詳細パネルの幅を持ち、表示の幅の 2/3 の上限を求め、確定した幅をそのタブの `sessionStorage` に残す。
stores:
  - name: usePanelWidthStore
    title: パネルの幅
    container: frontend/src/shared/stores/panel-width-store.ts
    usecase: 共通
    summary: 左のパネル（コメントの一覧・保存待ちのパネル・表示の設定）と詳細パネルの幅を持つ Zustand のストア。幅は、このタブでまだ適用していない間（`null`）は `currentLeftWidth`・`currentDetailWidth` が保存領域から参照する
    refs:
      - IF-489-70#
      - SCR-489-2#
      - SCR-489-32#
    state:
      - name: leftWidth
        title: 左のパネルの幅
        type: number | null
        initial: 'null'
        description: このタブで適用した幅。`null` の間は保存領域の値を使用する（`currentLeftWidth`）。画面に適用するときは使用する側が上限で収め、残した値は書き換えない
      - name: detailWidth
        title: 詳細パネルの幅
        type: number | null
        initial: 'null'
        description: このタブで適用した幅。`null` の間は保存領域の値を使用する（`currentDetailWidth`）
    actions:
      - name: setLeftWidth
        title: 左のパネルの幅を適用する
        kind: 関数
        summary: 幅の区切りの `onChange` で呼ぶ。保存しない
      - name: commitLeftWidth
        title: 左のパネルの幅を確定する
        kind: 関数
        summary: 幅の区切りの `onCommit` で呼ぶ。適用した後に `sessionStorage` の `workspaceKey(LEFT_PANEL_WIDTH_KEY)` に残す（保存できないときは適用するだけ）
        unit_tests:
          - name: test_commit_left_width
            case: 正常
            summary: 確定したときだけ保存領域に書く
            condition: '`setLeftWidth(500)` の後に `commitLeftWidth(520)`'
            mock: なし（jsdom の `sessionStorage`）
            expected: '`setLeftWidth` の後は保存領域にキーが無く、`commitLeftWidth` の後は `mindmap-left-panel-width` が `520`、`leftWidth` が 520'
      - name: setDetailWidth
        title: 詳細パネルの幅を適用する
        kind: 関数
        summary: 幅の区切りの `onChange` で呼ぶ。保存しない
      - name: commitDetailWidth
        title: 詳細パネルの幅を確定する
        kind: 関数
        summary: 幅の区切りの `onCommit` で呼ぶ。適用した後に `sessionStorage` の `workspaceKey(PANEL_WIDTH_KEY)` に残す
constants:
  - name: LEFT_PANEL_WIDTH
    title: 左のパネルの幅の決まり
    summary: 左のパネルの既定・下限・キーの 1 回の幅・区切りを出す幅（px）
    value: '`{ default: 384, min: 320, step: 16, resizableFrom: 901 }`'
    container: frontend/src/shared/stores/panel-width-store.ts
  - name: DETAIL_PANEL_WIDTH
    title: 詳細パネルの幅の決まり
    summary: 詳細パネルの既定・下限・キーの 1 回の幅・区切りを出す幅（px）
    value: '`{ default: 640, min: 480, step: 16, resizableFrom: 901 }`'
    container: frontend/src/shared/stores/panel-width-store.ts
  - name: LEFT_PANEL_WIDTH_KEY
    title: 左のパネルの幅の保存のキー
    summary: '`workspaceKey` で末尾に `:{workspace}` を付ける'
    value: '`mindmap-left-panel-width`'
    container: frontend/src/shared/stores/panel-width-store.ts
  - name: PANEL_WIDTH_KEY
    title: 詳細パネルの幅の保存のキー
    summary: '`workspaceKey` で末尾に `:{workspace}` を付ける'
    value: '`mindmap-panel-width`'
    container: frontend/src/shared/stores/panel-width-store.ts
  - name: PANEL_MAX_RATIO
    title: パネルの幅の上限の比
    summary: 左のパネルと詳細パネルの上限を、表示の幅に対する比で持つ
    value: '`2 / 3`'
    container: frontend/src/shared/stores/panel-width-store.ts
functions:
  - name: readStoredWidth
    title: 残した幅を参照する
    kind: 関数
    summary: '`sessionStorage` の `workspaceKey(key)` の値が正の整数ならその数、無いか正の整数でなければ `fallback` を返却する'
    container: frontend/src/shared/stores/panel-width-store.ts
    unit_tests:
      - name: test_read_stored_width
        case: 正常
        summary: 残した幅か既定を返却する
        condition: '`parametrize`: `mindmap-left-panel-width:mindstella-x-1` が `520` / 無い / `abc` / `0`。パスは `/w/mindstella-x-1/`、`fallback` は 384'
        mock: '`history.replaceState`'
        expected: 520 / 384 / 384 / 384
  - name: leftPanelMax
    title: 左のパネルの上限
    kind: 関数
    summary: '`leftPanelMax(viewport)`。`Math.floor(viewport * PANEL_MAX_RATIO)`。詳細パネルの幅も本文に残す幅も引かない。下限を下回るときは下限'
    container: frontend/src/shared/stores/panel-width-store.ts
    unit_tests:
      - name: test_left_panel_max
        case: 正常
        summary: 左のパネルの上限
        condition: '`parametrize`: 表示の幅 1440 / 1000 / 901 / 450'
        mock: なし
        expected: 960 / 666 / 600 / 320
  - name: detailPanelMax
    title: 詳細パネルの上限
    kind: 関数
    summary: '`detailPanelMax(viewport)`。`Math.floor(viewport * PANEL_MAX_RATIO)`。左のパネルの幅も本文に残す幅も引かない。下限を下回るときは下限'
    container: frontend/src/shared/stores/panel-width-store.ts
    unit_tests:
      - name: test_detail_panel_max
        case: 正常
        summary: 詳細パネルの上限
        condition: '`parametrize`: 表示の幅 1440 / 1100 / 1000 / 600'
        mock: なし
        expected: 960 / 733 / 666 / 480
  - name: currentLeftWidth
    title: 左のパネルの今の幅
    kind: 関数
    summary: '`currentLeftWidth(state)`。`leftWidth` が `null` なら `readStoredWidth(LEFT_PANEL_WIDTH_KEY, LEFT_PANEL_WIDTH.default)`、それ以外は `leftWidth` を返却する'
    container: frontend/src/shared/stores/panel-width-store.ts
    unit_tests:
      - name: test_current_left_width
        case: 正常
        summary: 適用した幅か、まだなら保存領域の幅を返却する
        condition: '`parametrize`: `leftWidth` が `null` で保存領域が `520` / `leftWidth` が 500 で保存領域が `520`'
        mock: なし（jsdom の `sessionStorage`）
        expected: 520 / 500
  - name: currentDetailWidth
    title: 詳細パネルの今の幅
    kind: 関数
    summary: '`currentDetailWidth(state)`。`detailWidth` が `null` なら `readStoredWidth(PANEL_WIDTH_KEY, DETAIL_PANEL_WIDTH.default)`、それ以外は `detailWidth` を返却する'
    container: frontend/src/shared/stores/panel-width-store.ts
notes:
  単体テスト: 同じフォルダの `panel-width-store.test.ts` に置く（knowledge の規約『フォルダ構成』）
  両方の上限: 2 つのパネルの上限は表示の幅だけで決め、互いの幅を引かない。重なることを許可し、重なり順は『left-panel』が持つ。上限のために開いているかを持つ必要が無くなったため、`leftOpen`・`detailOpen`・`setOpen` を削除した
  幅の初期値: ストアは import したときに作られ、その時点では開いたワークスペースのパスが決まっていないことがあるため、保存領域は使用するときに `workspaceKey` で参照する

id: MOD-489-177
title: サーバー / 入口 / server.py
test_files:
  - tests/unit/scripts/test_server.py
classes:
  - name: PortInUseError
    title: 待ち受けのポートが使われている
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`MINDSTELLA_PORT` のポートで待ち受けられない。`main` が記録して終了コード 1 にする（ツールのエラーではないため `MindmapError` を継がない）'
    kind: クラス
    inherits: Exception
    properties:
      - name: port
        type: int
        description: 待ち受けようとしたポート
  - name: InvalidPortError
    title: ポートの値が誤り
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`MINDSTELLA_PORT` が 1〜65535 の整数でない。`main` が記録して終了コード 1 にする'
    kind: クラス
    inherits: Exception
    properties:
      - name: value
        type: str
        description: 環境変数の値
constants:
  - name: SERVER_NAME
    title: サーバーの名前
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    summary: MCP サーバーの名前（`server_status` の `name`）。Claude Code の中のツールの名前は、プラグインの `.mcp.json` の名前と合わせて `mcp__plugin_mindstella_mindstella__{ツール}` になる
    value: '"mindstella"'
  - name: TOOL_NAMES
    title: ツールの名前
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    summary: 登録するツールの名前の並び（インターフェース定義『MCP サーバーの起動』のツール）
    value: ("init", "add", "update", "remove", "update_settings", "adopt", "edit_option", "batch", "changes_since_read", "commit", "pending", "status", "next", "impact", "find", "show", "attrs", "tags", "check", "goal", "migrate", "clear_release", "write_release", "export", "preview_url", "readme", "threads", "thread", "new_thread", "reply", "set_thread_status", "update_thread", "server_status", "server_stop")
  - name: DEFAULT_PORT
    title: 既定の待ち受けのポート
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`MINDSTELLA_PORT` が無いか空のときに待ち受けるポート（設定『サーバー』。`ensure_server.py` の同じ名前の定数と合わせる）'
    value: '8784'
  - name: PORT_ENV
    title: ポートの環境変数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: 待ち受けのポートを読む環境変数の名前
    value: '"MINDSTELLA_PORT"'
  - name: MCP_PATH
    title: MCP のパス
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: Streamable HTTP で待ち受けるパス（プラグインの `.mcp.json` の URL のパス）
    value: '"/mcp"'
  - name: STATUS_PATH
    title: 状態のパス
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: '`server_status` と同じ JSON を返す GET のパス（インターフェース定義『常駐サーバーの状態』の HTTP の入口）'
    value: '"/_admin/status"'
  - name: SHUTDOWN_GRACE_SEC
    title: 終わるときに待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    summary: 終わり始めてから、返している途中のレスポンスとつながったままの MCP の通り道を待つ秒数（uvicorn の `timeout_graceful_shutdown`）。『常駐サーバーの停止』の結果を返し終え、5 秒以内に終わる長さ
    value: '2'
  - name: UNEXPECTED_ERROR
    title: 予期しないエラーの文言
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    summary: '`MindmapError` でない例外をツールのエラーにするときの文言（`{type}` は例外のクラス名）'
    value: '"予期しないエラー（{type}）: {message}"'
functions:
  - name: main
    title: 入口
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: 待ち受けのポートを取り、MCP サーバーを組み立てて `127.0.0.1` の HTTP で動かし、SIGTERM・SIGINT を受けるか `server_stop` が呼ばれたら、終了時のフックを呼んで配信を止めて終える
    description: 末尾で `sys.exit(main())`。
    side_effects: '`127.0.0.1` の `MINDSTELLA_PORT` で待ち受け、記録を標準エラーに書く'
    args:
      - name: build
        type: Callable[..., MCPServer]
        required: false
        default: build_server
        passing: injected
        description: MCP サーバーを組み立てる関数
      - name: make_server
        type: Callable[[Starlette], uvicorn.Server]
        required: false
        default: 'lambda app: uvicorn.Server(uvicorn.Config(app, log_config=None, timeout_graceful_shutdown=SHUTDOWN_GRACE_SEC))'
        passing: injected
        description: HTTP の待ち受けを動かすサーバーを作る関数
      - name: environ
        type: Mapping[str, str]
        required: false
        default: os.environ
        passing: injected
        description: 待ち受けのポートと外から見る設定を読む環境変数
    returns:
      type: int
      description: 終了コード（終わり方で終えたら 0、待ち受けられなければ 1）
    process: |-
      1. `logging` の出力先を標準エラーにする
      2. 待ち受けのポートを読み（`read_port(environ)`）、そのポートのソケットを取る（`bind_socket`）
         - `InvalidPortError` を捕まえた場合、1 を返す
           - `[ERROR]` MINDSTELLA_PORT の値が誤り（値。1〜65535 の整数を渡す案内）
         - `PortInUseError` を捕まえた場合、1 を返す
           - `[ERROR]` ポートが使われている（ポート。`MINDSTELLA_PORT` で別のポートを渡す案内）
      3. プロセスの中の書き換えの鍵（`threading.Lock()`）と、外から見る設定（`load_external_access(environ)`）と、文字起こしのインターフェース（`load_transcriber(environ)`。モジュール構成『文字起こしの引き当て』）を渡した配信の台帳（`PreviewRegistry`）を作る
         - `InvalidTranscriberError` を捕まえた場合、取ったソケットを閉じて 1 を返す
           - `[ERROR]` 文字起こしの環境変数の値が誤り（環境変数の名前と値。設定『サーバー』の許す値の案内）
      4. 起動した日時（UTC）・プラグインのフォルダ（`PLUGIN_VERSION_FILE.parent`）・プラグインのバージョン（`str(read_plugin_version())`）を控え、それらと台帳から状態を作る関数（`build_status`）を作る
      5. サーバーを組み立て（`build`。`status` に 4 の関数、`request_stop` に HTTP のサーバーの `should_exit` を真にする関数を渡す）、`streamable_http_app(streamable_http_path=MCP_PATH, host=LISTEN_HOST)` のアプリを `make_server` に渡す
      6. 2 のソケットで動かす（`run(sockets=[ソケット])`）。SIGTERM・SIGINT の受け口は uvicorn が置き、受けると `should_exit` を真にする。uvicorn は終わり終えてから受けたシグナルを元の受け口へ送り直すので、動かす前に SIGTERM の受け口を `SystemExit(0)` を投げる関数にし、7 の後で元に戻す
         - `[INFO]` 常駐サーバーが待ち受けを始めた（ポート、バージョン、PID）
      7. `run` が戻ったら（例外で戻ったときも）、立てた配信を止める（`PreviewRegistry.stop_all`。終了時のフックもここで呼ぶ）
         - `[INFO]` 常駐サーバーを終えた
      8. 0 を返す
    unit_tests:
      - name: test_main
        case: 正常
        summary: 空きポートで動かし、戻ったら配信を止めて 0
        condition: '`environ={"MINDSTELLA_PORT": "{空きポート}"}`。`build` を、受け取った `previews` を控えて偽のサーバーを返す関数に、`make_server` を `run` がすぐ戻る偽の HTTP のサーバーを返す関数に差し替える'
        mock: '`build`・`make_server`'
        expected: 0 を返し、`run` が 1 回、`127.0.0.1` のそのポートに bind したソケット 1 つで呼ばれ、控えた `previews.stop_all` が呼ばれている
      - name: test_main_when_server_raises
        case: 正常
        summary: HTTP のサーバーが例外で戻っても配信を止める
        condition: '`test_main` と同じで、`run` が `RuntimeError` を送る'
        mock: '`build`・`make_server`'
        expected: '`RuntimeError` が伝わり、`previews.stop_all` が呼ばれている'
      - name: test_main_when_external_access_set
        case: 正常
        summary: 環境変数の外から見る設定を台帳へ渡す
        condition: '`environ` に `MINDSTELLA_PORT` の空きポートと `"MINDSTELLA_ALLOWED_HOSTS": "preview.example.test"`。`test_main` と同じ差し替え'
        mock: '`build`・`make_server`'
        expected: 控えた `previews` の外から見る設定の `allowed_hosts` が `{"preview.example.test"}`
      - name: test_main_when_stop_requested
        case: 正常
        summary: request_stop で HTTP のサーバーを終わらせる
        condition: '`test_main` と同じ差し替え。`build` が受け取った `request_stop` を控え、`run` の中で呼ぶ'
        mock: '`build`・`make_server`'
        expected: 偽の HTTP のサーバーの `should_exit` が真になり、0 を返す
      - name: test_main_when_port_invalid
        case: 異常
        summary: ポートの値が誤りなら待ち受けずに 1
        condition: '`parametrize`: `MINDSTELLA_PORT` が `abc` / `0` / `70000`'
        mock: '`build`・`make_server`（呼ばれないことを確かめる）'
        expected: 1 を返し、`ERROR` の記録にその値がある。`build`・`make_server` が呼ばれない
        exception: InvalidPortError
      - name: test_main_when_port_in_use
        case: 異常
        summary: ポートが使われていれば待ち受けずに 1
        condition: テストが `127.0.0.1` で待ち受けたままのポートを `MINDSTELLA_PORT` に渡す
        mock: '`build`・`make_server`（呼ばれないことを確かめる）'
        expected: 1 を返し、`ERROR` の記録にそのポートと `MINDSTELLA_PORT` がある。`build`・`make_server` が呼ばれない
        exception: PortInUseError
      - name: test_main_when_transcriber_invalid
        case: 異常
        summary: 文字起こしの環境変数の値が誤りなら待ち受けずに 1
        condition: '`environ` に `MINDSTELLA_PORT` の空きポートと `"MINDSTELLA_TRANSCRIBER": "whisper"`'
        mock: '`build`・`make_server`（呼ばれないことを確かめる）'
        expected: 1 を返し、`ERROR` の記録に `MINDSTELLA_TRANSCRIBER` と `whisper` がある。`build`・`make_server` が呼ばれない
        exception: InvalidTranscriberError
      - name: test_main_when_transcriber_set
        case: 正常
        summary: 環境変数で選んだ文字起こしを台帳へ渡す
        condition: '`environ` に `MINDSTELLA_PORT` の空きポートと `"MINDSTELLA_TRANSCRIBER_URL": "http://127.0.0.1:50000"`。`test_main` と同じ差し替え'
        mock: '`build`・`make_server`'
        expected: 控えた `previews` の文字起こしが `VoicePasteTranscriber` で、URL が `http://127.0.0.1:50000`
  - name: read_port
    title: 待ち受けのポートの読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: '`MINDSTELLA_PORT` を読み、待ち受けのポートにする'
    args:
      - name: environ
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 環境変数
    returns:
      type: int
      description: 待ち受けのポート（無いか空なら `DEFAULT_PORT`）
    process: |-
      1. `environ` の `PORT_ENV` を読み、無いか空なら `DEFAULT_PORT` を返す
      2. 整数にして 1〜65535 なら返す
         - 整数にできないか範囲の外なら、`InvalidPortError(値)` を送る
    exceptions:
      - name: InvalidPortError
        condition: 値が 1〜65535 の整数でない
        message: MINDSTELLA_PORT の値 {値} は誤りです。1〜65535 の整数を渡してください
    unit_tests:
      - name: test_read_port
        case: 正常
        summary: 無ければ既定、あればその値
        condition: '`parametrize`: `{}` / `{"MINDSTELLA_PORT": ""}` / `{"MINDSTELLA_PORT": "9000"}`'
        mock: なし
        expected: '`8784` / `8784` / `9000`'
      - name: test_read_port_when_invalid
        case: 異常
        summary: 整数でないか範囲の外なら InvalidPortError
        condition: '`parametrize`: `abc` / `0` / `65536` / `-1`'
        mock: なし
        expected: '`InvalidPortError`（`value` が渡した値）'
        exception: 1〜65535 の整数でない
  - name: bind_socket
    title: 待ち受けのソケット
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: '`LISTEN_HOST` のポートに bind したソケットを返す（uvicorn が待ち受けを始める前に、使われているかを見分ける）'
    side_effects: ソケットを開く
    args:
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
    returns:
      type: socket.socket
      description: '`AF_INET`・`SOCK_STREAM` で `SO_REUSEADDR` を真にし、`(LISTEN_HOST, port)` に bind したソケット'
    process: |-
      1. ソケットを作り、`SO_REUSEADDR` を真にして `(LISTEN_HOST, port)` に bind して返す
         - `OSError` が起きた場合、ソケットを閉じて `PortInUseError(port)` を送る（`raise ... from`）
    exceptions:
      - name: PortInUseError
        condition: bind できない
        message: ポート {port} は別のプロセスが使っています。MINDSTELLA_PORT で別のポートを渡してください
    unit_tests:
      - name: test_bind_socket
        case: 正常
        summary: 127.0.0.1 の空きポートに bind する
        condition: テストの中で取って閉じた空きポート
        mock: なし（後で閉じる）
        expected: '`getsockname()` が `("127.0.0.1", そのポート)`'
      - name: test_bind_socket_when_in_use
        case: 異常
        summary: 待ち受けているポートなら PortInUseError
        condition: テストが `127.0.0.1` で待ち受けたままのポート
        mock: なし
        expected: '`PortInUseError`（`port` がそのポート）'
        exception: bind できない
  - name: build_status
    title: 常駐サーバーの状態
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: '`server_status` と `GET /_admin/status` が返す JSON を作る'
    args:
      - name: previews
        type: PreviewRegistry
        required: true
        passing: positional
        description: 配信の台帳
      - name: port
        type: int
        required: true
        passing: keyword
        description: 待ち受けのポート
      - name: started_at
        type: str
        required: true
        passing: keyword
        description: 起動した日時（UTC のタイムゾーン付き ISO 8601）
      - name: plugin_root
        type: Path
        required: true
        passing: keyword
        description: 起動したプラグインのフォルダ
      - name: version
        type: str
        required: true
        passing: keyword
        description: プラグインのバージョン
    returns:
      type: dict[str, Any]
      description: '`{name, version, port, pid, started_at, plugin_root, previews}`（インターフェース定義『常駐サーバーの状態』のレスポンス）'
    process: 1. `name` に `SERVER_NAME`、`pid` に `os.getpid()`、`plugin_root` に文字列にしたパス、`previews` に `previews.listing()` を入れて返す
    unit_tests:
      - name: test_build_status
        case: 正常
        summary: 台帳の配信を並べた状態
        condition: 作成済みのワークスペース 2 つを `start` した台帳
        mock: なし（本物の待ち受け。後で `stop_all`）
        expected: '`name` が `mindstella`、`pid` が `os.getpid()`、`previews` がワークスペースの絶対パスの昇順で、それぞれ `start` が返した URL のポート'
  - name: run_server_stop
    title: server_stop の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 常駐サーバーの起動と停止
    scope: public
    summary: 止める配信を結果にし、HTTP のサーバーに終わり始めるよう頼む
    description: 頼んだ後も、返している途中のこのレスポンスは uvicorn が返し終えてから待ち受けを閉じる（インターフェース定義『常駐サーバーの停止』の止める時）。
    args:
      - name: previews
        type: PreviewRegistry
        required: true
        passing: positional
        description: 配信の台帳
      - name: request_stop
        type: Callable[[], None]
        required: true
        passing: keyword
        description: HTTP のサーバーの `should_exit` を真にする関数
    returns:
      type: dict[str, Any]
      description: '`{stopping: true, previews}`（`previews` は `previews.listing()`）'
    process: |-
      1. `previews.listing()` を控える
      2. `request_stop()` を呼ぶ
         - `[INFO]` server_stop で終わり始めた
      3. `{stopping: true, previews: 控えた配信}` を返す
    unit_tests:
      - name: test_run_server_stop
        case: 正常
        summary: 配信を返して止めるよう頼む
        condition: 作成済みのワークスペースを 1 つ `start` した台帳と、呼ばれた回数を数える `request_stop`
        mock: '`request_stop`'
        expected: '`stopping` が真で `previews` にそのワークスペースがあり、`request_stop` が 1 回呼ばれている'
  - name: build_server
    title: サーバーの組み立て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: '`TOOL_NAMES` のツールを登録した `MCPServer` を作る'
    args:
      - name: previews
        type: PreviewRegistry
        required: true
        passing: keyword
        description: 配信の台帳（`preview_url` が使う）
      - name: write_lock
        type: threading.Lock
        required: true
        passing: keyword
        description: プロセスの中の書き換えの鍵（配信の送信の受け付けと同じもの）
      - name: status
        type: Callable[[], dict[str, Any]]
        required: true
        passing: keyword
        description: 常駐サーバーの状態を作る関数（`server_status` と `GET /_admin/status` が使う）
      - name: request_stop
        type: Callable[[], None]
        required: true
        passing: keyword
        description: HTTP のサーバーに終わり始めるよう頼む関数（`server_stop` が使う）
    returns:
      type: MCPServer
      description: 名前が `SERVER_NAME` で、ツールを `TOOL_NAMES` の順に持つサーバー
    process: |-
      1. `MCPServer(SERVER_NAME)` を作る
      2. ツールごとに、インターフェース定義のリクエストと同じ名前・型の引数と、全てのツールに共通の `session: dict[str, Any] | None = None` を持つ関数を `@server.tool(name=...)` で登録する（ツールの説明はインターフェース定義の冒頭リード。`find`・`tags` は冒頭リードに、インターフェース定義の制約「ツールの説明」の文を続ける）
         - `workspace` を受ける関数は、`session` を読み（`parse_session`）、`workspace` を絶対パスにし（`resolve_workspace`）、セッションがあればそのワークスペースの宛先を書き換えてから（`previews.remember_session`）、ツールの処理を呼ぶ。`resolve_workspace` が `ArgumentError` を送った場合、ツールの処理を呼ばずにエラーの結果を返す（`error_result`）。`out` も同じセッションで絶対パスにする（`argument="out"`）
         - `server_status` は `call_tool(status)`、`server_stop` は `call_tool(lambda: run_server_stop(previews, request_stop=request_stop))` にする（`session` は受けても使わない）
         - `find` は `tags`・`any_tags`（`list[str] | None`）をタプルにし、`attr` の要素を `parse_attr` で分けて `SearchFilter` を作り、`limit`（既定 `DEFAULT_LIMIT`）・`cursor`・`view`（既定 `brief`）・`include`・`exclude`（既定 空）・`count_only`（既定 偽）と一緒に `run_find` へ渡す。`format`（既定 `markdown`）が `markdown` なら `call_tool` に `render=render_find_markdown` を渡す
         - 各関数は `workspace` を絶対パスにし（`resolve_workspace`）、ツールの処理を呼んで結果にする（`call_tool`、`run_{ツール}`）
         - ワークスペースを書き換えるツール（`init`・`add`・`update`・`update_settings`・`adopt`・`edit_option`・`batch`・`changes_since_read`・`clear_release`・`write_release`・`new_thread`・`reply`・`set_thread_status`・`update_thread` と、`plan` でない `migrate`）は、`call_tool` に `lock_root` を渡す。`init` だけ `lock_create=True` も、`plan` でない `migrate` だけ `lock_require=require_migratable`（前の版の `mindmap.yaml` だけのフォルダも通す）も渡す。直下の README だけを書く `readme`・`preview_url` には `lock_root` を渡さない（インターフェース定義『README の書き出し』の排他）
         - `thread` は `lock_root` を渡さず、既読を書くときだけ鍵を取れるよう、`run_thread` に `lock=lambda: workspace_lock(root, write_lock)` を渡す（インターフェース定義『スレッドを読む』の同時の呼び出し）
      3. `@server.custom_route(STATUS_PATH, methods=["GET"])` で、`status()` を `JSONResponse` で返す入口を登録する
      4. サーバーを返す
    unit_tests:
      - name: test_build_server
        case: 正常
        summary: 管理のツールの他は全てのツールを workspace つきで登録する
        condition: 空の `PreviewRegistry`。作ったサーバーの `list_tools()` を呼ぶ
        mock: なし
        expected: ツールの名前が `TOOL_NAMES` と一致し、`server_status`・`server_stop` 以外は入力のスキーマの `required` に `workspace` を持つ。どのツールも入力のスキーマの `properties` に `session` を持ち、`required` に持たない
      - name: test_build_server_when_relative_workspace
        case: 正常
        summary: 相対パスの workspace をセッションの作業フォルダから読む
        condition: '`tmp_path / "ws"` に作成済みのワークスペース。`call_tool("attrs", {"workspace": "ws", "session": {"cwd": "{tmp_path}", "claude_config_dir": "{tmp_path}/cfg"}})`'
        mock: なし
        expected: '結果の `is_error` が偽で、`structured_content` が `{"attrs": []}`'
      - name: test_build_server_when_relative_without_session
        case: 異常
        summary: セッションが無い相対パスは引数の誤り
        condition: '`call_tool("attrs", {"workspace": "ws"})`'
        mock: なし
        expected: '`is_error` が真で、本文が `エラー: 引数の誤り: workspace:` で始まる'
        exception: ArgumentError
      - name: test_build_server_when_session_given
        case: 正常
        summary: セッションを受けたらそのワークスペースの宛先を書き換える
        condition: 作成済みのワークスペース `ws`（絶対パス）。`tmux`・`tmux_pane`・`claude_pid`・`claude_started_at` を持つ `session` で `attrs` を呼ぶ。`previews` は `remember_session` を記録する偽の台帳
        mock: '`previews`'
        expected: '`remember_session` がワークスペースの絶対パスとそのセッションで 1 回呼ばれている'
      - name: test_build_server_when_status_route
        case: 正常
        summary: GET /_admin/status が status の結果を返す
        condition: '`status` が `{"name": "mindstella"}` を返す関数。`streamable_http_app()` のアプリを `starlette.testclient.TestClient` で開き、`GET /_admin/status` を送る'
        mock: '`status`'
        expected: '200 で、JSON が `{"name": "mindstella"}`'
      - name: test_build_server_when_find_format
        case: 正常
        summary: find は既定で Markdown の本文、json で構造化の結果を返す
        condition: 'D-1 を持つワークスペース `ws` を `tmp_path` に置き、`session` の `cwd` を `tmp_path` にする。`parametrize`: `call_tool("find", {"workspace": "ws", "session": ...})` / `call_tool("find", {"workspace": "ws", "format": "json", "session": ...})`'
        mock: なし
        expected: 本文が `全 1 件・合計` で始まり `structured_content` が `None` / `structured_content` の `items[0].id` が `D-1`
  - name: call_tool
    title: ツールの呼び出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: ツールの処理を呼び、結果を構造化の結果に、エラーをツールのエラーにする
    description: 例外を送って SDK に任せると本文の頭に `Error executing tool` が付くため、ここで全ての例外を `CallToolResult` にする（インターフェース定義『MCP サーバーの起動』の結果の組み立て）。
    args:
      - name: handler
        type: Callable[[], dict[str, Any]]
        required: true
        passing: positional
        description: 引数を渡し終えたツールの処理
      - name: write_lock
        type: threading.Lock
        required: true
        passing: keyword
        description: プロセスの中の書き換えの鍵
      - name: lock_root
        type: Path | None
        required: false
        default: None
        passing: keyword
        description: 書き換えるワークスペース。渡したときだけ鍵とロックを取る
      - name: lock_create
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 鍵を取るとき、まだ無いワークスペースのフォルダを作るか（`init` だけ真。`workspace_lock` の `create`）
      - name: lock_require
        type: Callable[[Path], None]
        required: false
        default: require_workspace
        passing: keyword
        description: 鍵を取る前にワークスペースを確かめる関数（`workspace_lock` の `require`。`plan` でない `migrate` だけ `require_migratable`）
      - name: render
        type: Callable[[dict[str, Any]], str] | None
        required: false
        default: None
        passing: keyword
        description: 成功の辞書を本文の文字にする関数。渡したときは `text_result` にする（`find` の `format` が `markdown` のとき `render_find_markdown`）
    returns:
      type: CallToolResult
      description: 成功は `ok_result`、エラーは `error_result` の結果
    process: |-
      1. `lock_root` がある場合、ワークスペースの鍵を取ってから（`workspace_lock`、`create=lock_create`、`require=lock_require`）、無い場合はそのまま `handler()` を呼ぶ。鍵を取るときの `WorkspaceNotFoundError` も 2 の `MindmapError` として扱う
      2. 結果を分ける
         - 辞書が返った場合、`render` が無ければそれを結果にし（`ok_result`）、あれば `render` で文字にした本文を結果にする（`text_result`）
         - `MindmapError` を捕まえた場合、ツールのエラーにする（`error_result`）
         - それ以外の例外を捕まえた場合、トレースバックを記録し、`UNEXPECTED_ERROR` の文言の `MindmapError` としてツールのエラーにする
           - `[ERROR]` ツールの予期しないエラー（例外のトレースバック）
    unit_tests:
      - name: test_call_tool
        case: 正常
        summary: 辞書を結果にする
        condition: '`handler` が `{"id": "D-1"}` を返す'
        mock: なし
        expected: '`is_error` が偽、`structured_content` が `{"id": "D-1"}`'
      - name: test_call_tool_when_mindmap_error
        case: 正常
        summary: MindmapError はツールのエラー
        condition: '`handler` が `WorkspaceNotFoundError` を送る'
        mock: なし
        expected: '`is_error` が真で、本文が `エラー: ` で始まる'
      - name: test_call_tool_when_unexpected_error
        case: 正常
        summary: 予期しない例外もトレースバックを出さずツールのエラー
        condition: '`handler` が `KeyError("x")` を送る'
        mock: なし
        expected: '`is_error` が真で、本文が `エラー: 予期しないエラー（KeyError）` で始まり `Traceback` を含まない'
      - name: test_call_tool_when_lock_root
        case: 正常
        summary: 書き換えるツールは鍵を取って呼ぶ
        condition: '`config.yaml` を置いた `tmp_path` を `lock_root` に渡す。`handler` は呼ばれたときに `write_lock.locked()` を控える'
        mock: なし
        expected: 控えた値が真で、呼んだ後は鍵が外れている。`tmp_path / ".mindstella.lock"` がある
      - name: test_call_tool_when_lock_require
        case: 正常
        summary: 渡した確かめの関数で、前の版の設定ファイルだけのフォルダにも鍵を取る
        condition: '`mindmap.yaml` だけを置いた `tmp_path` を `lock_root` に、`require_migratable` を `lock_require` に渡す。`handler` は `{}` を返す'
        mock: なし
        expected: '`is_error` が偽で、`tmp_path / ".mindstella.lock"` がある'
      - name: test_call_tool_when_render
        case: 正常
        summary: render を渡すと本文だけの結果にする
        condition: "`handler` が `{\"total\": 1}` を返し、`render` が `lambda r: f\"全 {r['total']} 件\"`"
        mock: なし
        expected: '`is_error` が偽、本文が `全 1 件`、`structured_content` が `None`'
  - name: ok_result
    title: 成功の結果
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: 辞書を、構造化の結果と同じ JSON の本文を持つ `CallToolResult` にする
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: ツールの処理が返した辞書
    returns:
      type: CallToolResult
      description: '`structured_content` が `payload`、`content` が `json.dumps(payload, ensure_ascii=False)` の文字列 1 つ'
    process: 1. `payload` を `ensure_ascii=False` で JSON の文字列にし、`TextContent` と `structured_content` に入れた結果を返す
    unit_tests:
      - name: test_ok_result
        case: 正常
        summary: 日本語をエスケープしない本文と構造化の結果
        condition: '`{"title": "問い"}`'
        mock: なし
        expected: '`structured_content` がその辞書、本文が `{"title": "問い"}`'
  - name: error_result
    title: エラーの結果
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: '`MindmapError` を、`エラー: {内容}` で始まる本文のツールのエラーにする'
    args:
      - name: error
        type: MindmapError
        required: true
        passing: positional
        description: 送られた例外
    returns:
      type: CallToolResult
      description: '`is_error` が真で、本文がエラーの行を改行でつないだ文字列 1 つ'
    process: |-
      1. 1 行目を `エラー: {メッセージ}` にし、`lines` を持つ例外はその行を続ける
         - `SchemaMismatchError` で `legacy` が真の場合、最後に `LEGACY_HINT` の 1 行を続ける
      2. `is_error=True` の結果を返す
    unit_tests:
      - name: test_error_result
        case: 正常
        summary: 合わない箇所の行を続ける
        condition: '`SchemaMismatchError(lines=["decisions.yaml: items[0].status: 理由"])`'
        mock: なし
        expected: '`is_error` が真で、本文の 1 行目が `エラー: ` で始まり 2 行目がその行'
      - name: test_error_result_when_legacy_format
        case: 正常
        summary: 前の版の形式には /mindstella:upgrade を案内する
        condition: '`legacy=True` の `SchemaMismatchError`'
        mock: なし
        expected: 本文の最後の行が `LEGACY_HINT`
  - name: resolve_workspace
    title: ワークスペースのパス
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: ツールに渡されたパスを、セッションの作業フォルダを基準にした絶対パスにする（`workspace`・`out` が使う。常駐サーバーの作業フォルダは使わない）
    args:
      - name: path
        type: str
        required: true
        passing: positional
        description: 渡されたパス（`~` を含んでよい）
      - name: session
        type: Session | None
        required: true
        passing: positional
        description: ツールを呼んだセッション（`parse_session` の結果）
      - name: argument
        type: str
        required: false
        default: '"workspace"'
        passing: keyword
        description: エラーに出す引数の名前
    returns:
      type: Path
      description: 絶対パス
    process: |-
      1. `~` を展開し、絶対パスならそのまま返す
      2. 相対パスで `session` があれば、`session.cwd` とつないで返す
         - `session` が無い場合、`ArgumentError`（`argument`、`相対パスはセッションの作業フォルダが無いと読めません。絶対パスで渡してください`）を送る
    exceptions:
      - name: ArgumentError
        condition: 相対パスで `session` が無い
    unit_tests:
      - name: test_resolve_workspace
        case: 正常
        summary: 相対パスと ~ を絶対パスにする
        condition: '`parametrize`: `ws` / `~/ws` / `/abs/ws`。`session` の `cwd` が `/c`'
        mock: '`Path.home`（`/h`）'
        expected: '`/c/ws` / `/h/ws` / `/abs/ws`'
      - name: test_resolve_workspace_when_no_session
        case: 異常
        summary: セッションが無ければ相対パスだけ誤り
        condition: '`session=None`。`parametrize`: `ws` / `/abs/ws`'
        mock: なし
        expected: '`ArgumentError`（メッセージが `引数の誤り: workspace:` で始まる）/ `/abs/ws`'
        exception: 相対パスで session が無い
  - name: text_result
    title: 本文だけの成功の結果
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 記録の検索
    scope: public
    summary: 文字を、構造化の結果を持たない `CallToolResult` にする
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: 本文
    returns:
      type: CallToolResult
      description: '`content` が `text` の `TextContent` 1 つで、`structured_content` を持たない結果'
    unit_tests:
      - name: test_text_result
        case: 正常
        summary: 本文だけを持つ
        condition: '`全 2 件・合計 300 文字`'
        mock: なし
        expected: 本文がその文字で、`structured_content` が `None`、`is_error` が偽

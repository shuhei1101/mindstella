id: MOD-489-230
title: プレビュー / 画面と部品 / history-dialog.ts
test_files:
  - tests/unit/preview/test_history_dialog.py
components:
  - name: historyDialog
    title: 変更履歴
    container: plugins/mindstella/skills/mindmap/preview/components/history-dialog.ts
    usecase: 前回からの差分を見る
    kind: コンポーネント
    summary: 部品設計『変更履歴』の引数を受け、`dialog` を `showModal()` で開く。行を押すと選んだ `sel` を知らせて閉じる。閉じたら「変更履歴」のボタンにフォーカスを戻す。並べる時点は入口が記録の `changes` と「前回開いてから」の始まりから作る（画面設計『変更履歴』の時点の一覧）
    props:
      - name: points
        type: '{sel, name, sub, count?}[]'
        required: true
        description: 並べる時点。`count` はその時点の `DiffPoint` の `added`・`changed`・`removed` の件数の和
      - name: points[].external
        type: boolean
        required: false
        description: 外部の変更のまとまり（`sets[].by` が `external`）。真なら名前の横に「外部の変更」の札を付け、行のボタンの読み上げ名に含める
      - name: current
        type: string
        required: true
        description: 今選んでいる時点の `sel`（差分を出さないときは空文字列）
      - name: onPick
        type: '(sel: string) => void'
        required: true
        description: 時点を選ぶ（空文字列は差分の表示をやめる）
      - name: onClose
        type: () => void
        required: true
        description: 閉じる
    unit_tests:
      - name: test_history_dialog_when_external
        case: 正常
        summary: 外部の変更のまとまりに札を付ける
        condition: 2 つ目のまとまりだけ `external` が真の `points`
        mock: なし
        expected: 2 つ目の行だけ「外部の変更」の札（`.hist-tag`）を持ち、行のボタンの読み上げ名が名前と「外部の変更」を含む

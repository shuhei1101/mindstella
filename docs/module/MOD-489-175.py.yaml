id: MOD-489-175
title: サーバー / 依存と影響 / graph.py
test_files:
  - tests/unit/scripts/test_graph.py
data_models:
  - name: Affected
    title: 影響を受ける項目
    container: plugins/mindstella/skills/mindmap/scripts/graph.py
    usecase: 採用する案の切り替え
    role: DTO
    summary: 影響の洗い出しの出力の `affected[]` の 1 行
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。`asdict` で JSON にする。'
    properties:
      - name: id
        type: str
        description: ID
      - name: title
        type: str
        description: タイトル
      - name: status
        type: str
        description: 状態
      - name: via
        type: list[str]
        description: 起点とこの項目の間にある項目の ID
      - name: key
        type: Literal["depends_on", "parent", "for"]
        description: 直前の項目とつなぐ `related` の種類
constants:
  - name: IMPACT_KEYS
    title: 影響をたどる関連の種類
    container: plugins/mindstella/skills/mindmap/scripts/graph.py
    usecase: 共通
    summary: 項目の種類 → 参照先から参照元へ逆向きにたどる `related` の種類（`see_also` はたどらない）
    entries:
      - key: decision
        value: depends_on, parent
      - key: task
        value: for, depends_on
functions:
  - name: build_reverse_edges
    title: 逆向きの参照
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/graph.py
    usecase: 共通
    scope: public
    summary: 参照先の ID → それを参照する項目とキーの並びを作る
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: dict[str, list[tuple[str, str]]]
      description: 参照先の ID → `(参照元の ID, キー)` の並び（参照元の並びはファイルの並び）
    process: 1. `IMPACT_KEYS` の項目の種類ごとに項目を見て、`related` のうち種類が `IMPACT_KEYS` にある要素の `to` ごとに `(自分の ID, 種類)` を追加する
    unit_tests:
      - name: test_build_reverse_edges
        case: 正常
        summary: 種類 depends_on・parent・for を逆向きにし、see_also は含めない
        condition: 'D-2 `related: [{to: D-1, type: depends_on}]`・D-3 `related: [{to: D-1, type: parent}]`・T-1 `related: [{to: D-1, type: for}]`・D-4 `related: [{to: D-1, type: see_also}]`'
        mock: なし
        expected: '`D-1` → `[(D-2, depends_on), (D-3, parent), (T-1, for)]`'
  - name: trace_impact
    title: 影響の洗い出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/graph.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 起点から逆向きの参照を幅優先でたどり、影響を受ける項目を近い順に返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: start_id
        type: str
        required: true
        passing: positional
        description: 起点の ID
    returns:
      type: list[Affected]
      description: 影響を受ける項目（起点に近い順、同じ距離は種類 D・T → 連番の順）
    process: |-
      1. 起点があるか確かめる（項目の引き当て。`find_item`）
      2. 逆向きの参照を作る（`build_reverse_edges`）
      3. 起点から幅優先でたどる。一度出た ID（起点を含む）はもうたどらない
         - 距離ごとに ID の順で並べ、最初に届いた経路を `via`・`key` にする
         - 参照元の ID がワークスペースに無い場合は飛ばす
    exceptions:
      - name: ItemNotFoundError
        condition: 起点の ID が無い（`find_item` から伝わる）
    unit_tests:
      - name: test_trace_impact
        case: 正常
        summary: 間接の影響まで、経路つきで近い順に返す
        condition: 'D-2 `related: [{to: D-1, type: depends_on}]`・D-3 `related: [{to: D-2, type: parent}]`・T-1 `related: [{to: D-3, type: for}]`・D-4 `related: [{to: D-1, type: see_also}]` で起点 D-1'
        mock: なし
        expected: 'D-2（`via: []`・`depends_on`）・D-3（`via: [D-2]`・`parent`）・T-1（`via: [D-2, D-3]`・`for`）の 3 件'
      - name: test_trace_impact_when_cycle
        case: 正常
        summary: 循環があっても同じ項目を 2 度出さず終わる
        condition: 'D-1 `related: [{to: D-2, type: depends_on}]`・D-2 `related: [{to: D-1, type: depends_on}]` で起点 D-1'
        mock: なし
        expected: D-2 の 1 件だけ
  - name: is_settled
    title: 決着の判定
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/graph.py
    usecase: 共通
    scope: public
    summary: 項目の状態がその種類の決着に当たるか
    args:
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: 種類
      - name: item
        type: dict[str, Any] | None
        required: true
        passing: positional
        description: 項目。無い ID を指すときは `None`
    returns:
      type: bool
      description: 決着していれば真。`None` は偽（未完了として扱う）
    process: |-
      1. `item` が `None` なら偽を返す
      2. `status` が `KINDS[kind].settled_statuses` にあるかを返す
    unit_tests:
      - name: test_is_settled
        case: 正常
        summary: 種類ごとの決着を見分ける
        condition: decision `決定済み`・decision `保留`・task `中止`・task `進行中`
        mock: なし
        expected: 真・偽・真・偽
      - name: test_is_settled_when_missing
        case: 正常
        summary: 無い項目は未完了
        condition: '`item` が `None`'
        mock: なし
        expected: 偽
  - name: list_ready
    title: 着手できる検討事項
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/graph.py
    usecase: 記録の取得
    scope: public
    summary: 前提が全て決着した未決定の検討事項の ID を、連番の順に返す（『記録の取得』の `derived.ready`）
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: list[str]
      description: 検討事項の ID（並べ替えない。連番の小さい順）
    process: |-
      1. 状態が `未決定` の検討事項のうち、種類 `depends_on` の `related` の `to` が全て決着しているものを選ぶ（決着の判定。`is_settled`。無い ID は未完了）
      2. 連番の小さい順に ID を返す
    unit_tests:
      - name: test_list_ready
        case: 正常
        summary: 前提が決着した未決定だけを連番の順に返す
        condition: 決定済みの D-1、D-1 に依存する未決定の D-3、未決定の D-4 に依存する未決定の D-2、無い D-9 に依存する未決定の D-5、前提を持たない未決定の D-4
        mock: なし
        expected: '`[D-3, D-4]`'

id: MOD-489-218
title: プレビュー / 画面と部品 / comments.ts
test_files:
  - tests/unit/preview/test_comments_panel.py
functions:
  - name: visibleThreads
    title: 一覧に出すスレッド
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    scope: public
    summary: スレッドを状態とタグで絞り、最後の書き込みの新しい順に並べる
    args:
      - name: threads
        type: Thread[]
        required: true
        passing: positional
        description: スレッド
      - name: filter
        type: "'open' | 'closed' | 'all'"
        required: true
        passing: positional
        description: 状態の絞り込み
      - name: tag
        type: string | null
        required: true
        passing: positional
        description: 絞るタグ
    returns:
      type: Thread[]
      description: 絞って並べたスレッド（渡した配列は変えない）
    unit_tests:
      - name: test_visible_threads
        case: 正常
        summary: 状態とタグで絞り、新しい順に並べる
        condition: 'オープンの TH-1（01:00・タグ `画面`）・TH-2（02:00）とクローズの TH-5（03:00・タグ `画面`）。`parametrize`: `open`・`null` / `all`・`null` / `all`・`画面` / `closed`・`起票`'
        mock: なし
        expected: '`[TH-2, TH-1]` / `[TH-5, TH-2, TH-1]` / `[TH-5, TH-1]` / `[]`'
  - name: threadCounts
    title: 状態ごとの件数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    scope: public
    summary: タグで絞ったスレッドの、状態の絞り込みに出す件数を返す
    args:
      - name: threads
        type: Thread[]
        required: true
        passing: positional
        description: スレッド
      - name: tag
        type: string | null
        required: true
        passing: positional
        description: 絞るタグ
    returns:
      type: '{open: number, closed: number, all: number}'
      description: 状態ごとの件数
    unit_tests:
      - name: test_thread_counts
        case: 正常
        summary: タグで絞った件数を数える
        condition: 'オープン 2 件（1 件がタグ `画面`）とクローズ 1 件（タグ `画面`）。`parametrize`: `null` / `画面`'
        mock: なし
        expected: '`{open: 2, closed: 1, all: 3}` / `{open: 1, closed: 1, all: 2}`'
  - name: pendingThreads
    title: まだ送っていない新しいスレッド
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    scope: public
    summary: レビュー中の書き込みのうち、一覧の先頭に出す新しいスレッドの最初の書き込みを返す
    args:
      - name: items
        type: ReviewState['items']
        required: true
        passing: positional
        description: レビュー中の書き込み
      - name: filter
        type: "'open' | 'closed' | 'all'"
        required: true
        passing: positional
        description: 状態の絞り込み
      - name: tag
        type: string | null
        required: true
        passing: positional
        description: 絞るタグ
    returns:
      type: ReviewState['items']
      description: '`thread` を持たない書き込み（溜めた順）。`filter` が `closed` か、`tag` が `null` でなければ空'
    unit_tests:
      - name: test_pending_threads
        case: 正常
        summary: 返信を除き、クローズの絞り込みとタグの絞り込みでは出さない
        condition: 'C-41（新しいスレッド）・C-42（新しいスレッド）・C-43（返信）。`parametrize`: `open`・`null` / `all`・`null` / `closed`・`null` / `open`・`画面`'
        mock: なし
        expected: '`[C-41, C-42]` / `[C-41, C-42]` / `[]` / `[]`'
  - name: isBlockedReply
    title: 送れない返信か
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: コメントを選んで送る
    scope: public
    summary: レビュー中の書き込みが、クローズのスレッドへの返信かを返す（入口もまとめて送る ID から除くのに使う）
    args:
      - name: item
        type: ReviewState['items'][number]
        required: true
        passing: positional
        description: レビュー中の書き込み
      - name: threads
        type: Thread[]
        required: true
        passing: positional
        description: スレッド
    returns:
      type: boolean
      description: '`thread` を持ち、そのスレッドが `closed` なら真（スレッドが見つからなければ偽。サーバーが 409 で返す）'
    unit_tests:
      - name: test_is_blocked_reply
        case: 正常
        summary: クローズのスレッドへの返信だけ真
        condition: '`parametrize`: クローズの TH-5 への返信 / オープンの TH-1 への返信 / 新しいスレッド / 無い TH-9 への返信'
        mock: なし
        expected: 真 / 偽 / 偽 / 偽
  - name: threadTimeline
    title: 書き込みと記録の並び
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    scope: public
    summary: スレッドの書き込みと状態の記録を、日時の順の 1 本の並びにする
    args:
      - name: thread
        type: Thread
        required: true
        passing: positional
        description: スレッド
    returns:
      type: ({post} | {event})[]
      description: '`created` の古い順。同じ日時は書き込みを先にし、それぞれの中の並びを保つ'
    unit_tests:
      - name: test_thread_timeline
        case: 正常
        summary: 日時の順に混ぜ、同じ日時は書き込みを先にする
        condition: 書き込み 00:10・00:30 と記録 00:20・00:30
        mock: なし
        expected: 書き込み（00:10）・記録（00:20）・書き込み（00:30）・記録（00:30）
  - name: reviewLabel
    title: レビュー中の書き込みの読み上げの名前の頭
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: コメントを選んで送る
    scope: public
    summary: レビュー中の書き込みの行の読み上げの名前の頭を返す。返信は「{スレッドの ID} への返信」、新しいスレッドは「{向けた項目の ID} へのコメント」、項目を指さないものは「項目を指さないコメント」（`thread` を持たない詳細パネルの行は新しいスレッドと同じ扱い）。`commentsPanel`・`threadPost`・`detailPanel`・`reviewRowActions` が使う
    args:
      - name: item
        type: ReviewItem
        required: true
        passing: positional
        description: レビュー中の書き込み
    returns:
      type: string
      description: 読み上げの名前の頭
    unit_tests:
      - name: test_review_label
        case: 正常
        summary: 返信・項目へのコメント・項目を指さないコメントの頭
        condition: '`parametrize`: `thread: TH-1` / `thread: null`・`target: D-1` / `thread` を持たず `target: D-1` / `thread: null`・`target: null`'
        mock: なし
        expected: 「TH-1 への返信」/「D-1 へのコメント」/「D-1 へのコメント」/「項目を指さないコメント」
components:
  - name: commentsPanel
    title: コメントの一覧
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    kind: 画面
    summary: 左から出すパネル（`aside`。読み上げの名前「コメントの一覧」）を描く。見出しの帯（「コメント」・レビュー中の入口・ピン止め・閉じる）の下に、`view` で画面設計『コメントの一覧』（`threadListView`）・『スレッド』（`threadView`）・『レビュー中の書き込み』（`reviewView`）のどれかを入れる。レビュー中の入口は `view` が `review` のとき出さず、0 件のときは件数の塗りを外す（`data-focus` は `review`）。操作はコールバックで入口に知らせ、描き直しても操作していた部品にフォーカスを戻す。ピン止めは `pinned` を `aria-pressed` で示すアイコンのボタン（`data-focus` は `pin`。読み上げの名前と `title` は画面設計『コメントの一覧』の要素「ピン止め」）で、押すと `on.pin` を知らせる。開いている間のグレーアウトと本文の部品を止めるのは入口（`start` の 5）
    props:
      - name: view
        type: "'list' | 'thread' | 'review'"
        required: true
        description: パネルの中に出す画面
      - name: items
        type: ReviewState['items']
        required: true
        description: レビュー中の書き込み（新しいスレッドと返信）
      - name: removed
        type: ReviewState['items']
        required: true
        description: パネルを開いている間に消した書き込み（元の場所に「元に戻す」を出す）
      - name: threads
        type: Thread[]
        required: true
        description: 最後に読めたスレッド
      - name: threadsError
        type: '{detail: string | null} | null'
        required: true
        description: スレッドを読めなかったときの理由（届かなければ `detail` が `null`）。読めていれば `null`
      - name: filter
        type: "'open' | 'closed' | 'all'"
        required: true
        description: 状態の絞り込み
      - name: tag
        type: string | null
        required: true
        description: 絞っているタグ
      - name: opened
        type: '{id: string, pending: boolean} | null'
        required: true
        description: 開いているスレッド（`pending` が真なら `id` はまだ送っていない新しいスレッドのコメントの ID）
      - name: composing
        type: boolean
        required: true
        description: 新しいスレッドの入力を出しているか
      - name: free
        type: SendFormProps
        required: true
        description: "新しいスレッドの入力の引数（`target: null`・`label: '新しいスレッド'`・`collapsed: false`）"
      - name: reply
        type: '{body, status, count, detail}'
        required: true
        description: 開いているスレッドの返信の入力の引数
      - name: reason
        type: "{open: boolean, body: string, status: 'idle' | 'saving' | 'failed', detail: string | null}"
        required: true
        description: 理由の入力の状態（`failed` で `detail` が `null` なら届かなかった）
      - name: checked
        type: Set<string>
        required: true
        description: チェックした書き込みの ID
      - name: editing
        type: string | null
        required: true
        description: 本文を書き換えている書き込みの ID（詳細パネルと共に 1 つ）。入力欄は `editingIn` が `'list'` で、その書き込みを出している画面にだけ描く
      - name: editingIn
        type: "'list' | 'detail'"
        required: false
        default: "'list'"
        description: "`editing` の修正を始めた場所（パネルの中なら `'list'`、詳細パネルなら `'detail'`）"
      - name: editError
        type: string | null
        required: false
        default: 'null'
        description: 本文を直せなかった理由
      - name: editBody
        type: string | null
        required: false
        default: 'null'
        description: 本文を直せなかったとき、入力欄に残す書き換えていた中身
      - name: stale
        type: Map<string, string>
        required: true
        description: 送れなかった書き込みの ID → 理由
      - name: result
        type: "{kind: 'sending' | 'sent' | 'failed' | 'stale', count?, at?, detail?, entered?} | null"
        required: true
        description: まとめて送った結果（文言は画面設計『レビュー中の書き込み』の「送った結果」）
      - name: selected
        type: string | null
        required: true
        description: 行から開いて詳細パネルに出している書き込みの ID
      - name: reviewFocus
        type: string | null
        required: true
        description: スレッドの画面からレビュー中の書き込みを開いたときの、そのスレッドの ID（そのスレッドの書き込みの行を示す）
      - name: titleOf
        type: '(id: string) => string | null'
        required: true
        description: 項目のタイトル（記録から消えていれば `null`）
      - name: on
        type: '{close, pin, review, back, filter, tag, clearTag, compose, openThread, openId, changeSet, reply, replyInput, reasonOpen, reasonInput, setStatus, check, checkAll, send, open, edit, saveEdit, cancelEdit, remove, restore, unloc, fold}'
        required: true
        description: 閉じる・ピン止めの切り替え・レビュー中を開く・戻る・状態で絞る・タグで絞る・タグを外す・新しいスレッドの入力を出す／畳む・スレッドを開く・項目を開く・まとまりのリンクを押した（まとまりの ID）・返信を溜める・返信の入力・理由の入力を出す／閉じる・理由の入力・状態を変える・チェック・すべて選ぶ・まとめて送る・行の項目を開く・修正・書き換えを送る・キャンセル・削除・元に戻す・箇所を外す・本文を開く／畳む（書き込みの ID・開くか）
      - name: changeSetOf
        type: '(id: string) => string | null'
        required: true
        description: まとまりの説明（記録の `changes.sets` に無ければ `null`）
      - name: expanded
        type: Set<string>
        required: true
        description: 本文を開いているレビュー中の書き込みの ID（レビュー中の書き込みの画面とスレッドの画面で同じものを使う）
      - name: pinned
        type: boolean
        required: true
        description: ピン止めしているか（入口の `Prefs.commentsPinned`）
    unit_tests:
      - name: test_comments_panel
        case: 正常
        summary: 見出しの帯と、view ごとの中身
        condition: 'レビュー中 3 件。`parametrize`: `view` が `list` / `thread`（TH-1 を開く）/ `review`'
        mock: '`on.review`・`on.close`'
        expected: どれも見出し「コメント」と読み上げの名前「コメントの一覧を閉じる」のボタンを持つ。`list`・`thread` は読み上げの名前「レビュー中の書き込みを確かめる（3 件）」の入口があり（押すと `on.review` が 1 回）、`review` は入口が無い。中身が順にスレッドの一覧・スレッド・レビュー中の書き込み
      - name: test_comments_panel_when_no_pending
        case: 正常
        summary: レビュー中が 0 件でも入口を出す
        condition: '`items` が空で `view` が `list`'
        mock: なし
        expected: 入口があり、クラス `zero` を持ち、読み上げの名前が「レビュー中の書き込みを確かめる（0 件）」
      - name: test_comments_panel_when_pin
        case: 正常
        summary: ピン止めのボタンは押した状態と読み上げの名前を切り替える
        condition: '`parametrize`: `pinned` が偽 / 真'
        mock: '`on.pin`'
        expected: 「コメントの一覧を閉じる」の左にピン止めのボタンがあり、`aria-pressed` が `false`、読み上げの名前が「ピン止めする（外側を押しても閉じない）」 / `aria-pressed` が `true`、読み上げの名前が「ピン止めを外す（外側を押したら閉じる）」。どちらも押すと `on.pin` が 1 回
  - name: reviewRowActions
    title: 行の修正と削除
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: 項目へコメントする
    kind: コンポーネント
    summary: レビュー中のコメントの行の右上に置く、鉛筆の印の「修正」とごみ箱の印の「削除」のアイコンのボタン（`icon-btn`）を返す。読み上げの名前は「{向けた項目の ID} へのコメントを修正 / 削除」（項目を指さないコメントは「項目を指さないコメントを修正 / 削除」、スレッドへの返信は「{スレッドの ID} への返信を修正 / 削除」）、`title` は「修正」「削除」。`data-focus` は `{focus}edit-open:{ID}` と `{focus}remove:{ID}`。コメントの一覧（レビュー中の書き込み・スレッド）と詳細パネルが使う
    props:
      - name: item
        type: ReviewItem
        required: true
        description: 行のコメント
      - name: focus
        type: string
        required: true
        description: '`data-focus` の接頭辞（コメントの一覧は空、詳細パネルは `detail-`）。一覧と詳細パネルを同時に開いていても、描き直した後のフォーカスの戻し先を分ける'
      - name: on
        type: '{edit, remove}'
        required: true
        description: 修正（コメントの ID）・削除（コメントの ID）
    unit_tests:
      - name: test_review_row_actions
        case: 正常
        summary: 読み上げの名前と `title` と `data-focus` を付けて、押すと ID を知らせる
        condition: '`parametrize`: D-1 へのコメント C-1 を `focus: "detail-"` で / 項目を指さないコメント C-2 を `focus: ""` で描き、2 つのボタンを押す'
        mock: '`on.edit`・`on.remove`'
        expected: 読み上げの名前が「D-1 へのコメントを修正」「D-1 へのコメントを削除」、`data-focus` が `detail-edit-open:C-1`・`detail-remove:C-1` / 「項目を指さないコメントを修正」「項目を指さないコメントを削除」、`data-focus` が `edit-open:C-2`・`remove:C-2`。どちらも `title` が「修正」「削除」で、`on.edit`・`on.remove` がその ID で 1 回ずつ
  - name: reviewEditForm
    title: 本文の書き換え
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: 項目へコメントする
    kind: コンポーネント
    summary: 行の本文をその場で書き換える入力欄（`maxlength` 10000）と「キャンセル」「修正」の `form` を返す。「修正」で中身が空白だけなら送らず「コメントを入れてから直してください。」を出して入力欄を `aria-invalid="true"` にし、それ以外は `on.saveEdit` を呼ぶ。理由は `role="alert"` と印のアイコンで出す。入力欄の Ctrl+Enter（macOS は Cmd+Enter。`isComposing` の間は除く）は `preventDefault` して `form.requestSubmit()` を呼び、「修正」と同じ処理を通す。入力欄は `aria-keyshortcuts="Control+Enter"`、「修正」は `title`「修正（Ctrl+Enter）」を持つ。入力欄の Esc は `preventDefault` と `stopPropagation` をしてから `on.cancelEdit` を呼ぶ（詳細の全画面の `dialog` の `cancel` を起こさない）。入力欄の `data-focus` は `{focus}edit:{ID}`。描いた後に入力欄へフォーカスを移すのは使う側。コメントの一覧と詳細パネルが使う
    props:
      - name: item
        type: ReviewItem
        required: true
        description: 書き換えるコメント
      - name: body
        type: string | null
        required: true
        description: 入力欄に入れる中身（直せなかったときの書き換えていた中身。`null` なら元の本文）
      - name: error
        type: string | null
        required: true
        description: 直せなかった理由（`null` なら出さない）
      - name: focus
        type: string
        required: true
        description: '`data-focus` の接頭辞（`reviewRowActions` と同じ）'
      - name: on
        type: '{saveEdit, cancelEdit}'
        required: true
        description: 書き換えを送る（コメントの ID と中身）・書き換えを捨てる
    unit_tests:
      - name: test_review_edit_form
        case: 正常
        summary: 文言と、送る・捨てる
        condition: '`parametrize`: 中身を「案 A に決める」にして「修正」を押す / 「キャンセル」を押す / 入力欄で Esc を押す'
        mock: '`on.saveEdit`・`on.cancelEdit`'
        expected: ボタンが「キャンセル」「修正」の順。`on.saveEdit` が C-1 と「案 A に決める」で 1 回 / `on.cancelEdit` が 1 回 / `on.cancelEdit` が 1 回で Esc の `keydown` の `defaultPrevented` が真
      - name: test_review_edit_form_when_blank_or_error
        case: 異常
        summary: 空白だけは送らず、直せなかった理由と中身を出す
        condition: '`parametrize`: 中身を空白だけにして「修正」を押す / `body: "案 A に決める"`・`error: "サーバーが止まっています。立ち上げ直してから直してください。"` で描く'
        mock: '`on.saveEdit`'
        expected: '`on.saveEdit` が呼ばれず「コメントを入れてから直してください。」が `role="alert"` の要素に出て入力欄が `aria-invalid="true"` / 入力欄の中身が「案 A に決める」で、理由が `role="alert"` の要素に出る'
      - name: test_review_edit_form_ctrl_enter
        case: 正常
        summary: Ctrl+Enter で「修正」と同じ処理を通し、変換中は通さない
        condition: '`parametrize`: 中身を「案 A に決める」にして Ctrl+Enter / Cmd+Enter（`metaKey`）/ 空白だけで Ctrl+Enter / `isComposing` の Ctrl+Enter'
        mock: '`on.saveEdit`'
        expected: 入力欄が `aria-keyshortcuts="Control+Enter"`、「修正」の `title` が「修正（Ctrl+Enter）」。`on.saveEdit` が C-1 と「案 A に決める」で 1 回で `keydown` の `defaultPrevented` が真 / 同じ / `on.saveEdit` が呼ばれず「コメントを入れてから直してください。」が `role="alert"` の要素に出る / `on.saveEdit` が呼ばれない
  - name: removedReviewRow
    title: 消した行
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts

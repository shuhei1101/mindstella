        condition: タグ `画面` の TH-1 とタグ `起票` の TH-2、レビュー中に C-41。`tag` は `画面`
        mock: '`on.clearTag`'
        expected: チップ「画面」と「1 / 2 件」、行が TH-1 だけ。×（読み上げの名前「タグ「画面」の絞り込みを外す」）を押すと `on.clearTag` が 1 回
      - name: test_thread_list_view_when_empty_or_failed
        case: 正常
        summary: 0 件の文言と、読めない理由
        condition: '`parametrize`: スレッドが無い / `filter: closed`・`tag: 起票` で該当が無い / `threadsError: {detail: null}` / `threadsError: {detail: 理由}`'
        mock: なし
        expected: 「オープンのスレッドはありません。」/ 「タグ「起票」のクローズのスレッドはありません。」/ `role="alert"` で「スレッドを読めませんでした。サーバーが止まっています。立ち上げ直してから開いてください。」/ 「スレッドを読めませんでした。{理由}」
      - name: test_thread_list_view_when_composing
        case: 正常
        summary: 新しいスレッドの入口と入力を切り替える
        condition: '`parametrize`: `composing` が偽 / 真'
        mock: '`on.compose`'
        expected: 「新しいスレッド」のボタン（押すと `on.compose` が真で 1 回）/ 見出し「新しいスレッド」と入力欄（`aria-label` が「新しいスレッド」）、× を押すと `on.compose` が偽で 1 回
  - name: threadView
    title: スレッド
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    kind: 画面
    summary: 画面設計『スレッド』を描く。見出し（一覧へ戻る・状態を変える・理由の入力・状態を変えられなかった理由・状態の札と題・向けた項目・タグ）、書き込みの並び（`threadTimeline` の後にレビュー中の返信と消した返信をコメントの連番の順。`threadPost`・`removedReviewRow`。レビュー中の書き込みには `open` を `expanded` にあるかで、`on.fold` を `commentsPanel` の `on.fold` で渡す）、下端（オープンは `replyForm`、クローズは「クローズにしたスレッドです。」）を持つ。`opened.pending` が真のときは、そのレビュー中の書き込み（消していれば消した行）から組み立て、状態の札を「レビュー中」にして「状態を変える」と返信の入力を出さず、下端に「まだ送っていないスレッドです。」を出す。理由の入力欄は `maxlength` 400 で、Ctrl+Enter で確定、Esc で閉じる（`stopPropagation`）。`data-focus` は戻るが `back`、状態を変えるが `status`、理由が `reason`・`reason-cancel`・`reason-ok`、向けた項目が `target`
    props:
      - name: props
        type: CommentsPanelProps
        required: true
        description: '`commentsPanel` の引数（`opened`・`threads`・`items`・`removed`・`reply`・`reason`・`editing` ほかと `titleOf`・`on` を使う）'
    unit_tests:
      - name: test_thread_view
        case: 正常
        summary: 書き込みと状態の記録を日時の順に並べ、レビュー中の返信を末尾に出す
        condition: '書き込み 00:10・00:12・00:30 と記録 00:20（クローズ）・00:29（オープンへの戻し）を持つオープンの TH-4、レビュー中に C-43（`thread: TH-4`）、消した C-45（`thread: TH-4`）'
        mock: なし
        expected: 並びが 書き込み・書き込み・クローズの記録・オープンへの戻しの記録・書き込み・C-43（レビュー中の印）・C-45 の「元に戻す」の順。見出しに「クローズにする」、下端にラベル「返信」の入力
      - name: test_thread_view_when_closed_or_pending
        case: 正常
        summary: クローズと、まだ送っていない新しいスレッドは返信の入力を出さない
        condition: '`parametrize`: クローズの TH-5 / `opened: {id: C-41, pending: true}`'
        mock: なし
        expected: 「オープンに戻す」と「クローズにしたスレッドです。」で返信の入力が無い / 状態の札が「レビュー中」で「状態を変える」も返信の入力も無く、「まだ送っていないスレッドです。」と最初の書き込み（「D-5 へのコメントを修正」「D-5 へのコメントを削除」）がある
      - name: test_thread_view_when_reason
        case: 正常
        summary: 理由の入力と、変えられなかった理由
        condition: 'オープンの TH-1。`parametrize`: `reason.open` が真 / `status: saving` / `status: failed`・`detail: null` / `status: failed`・`detail: 理由`'
        mock: '`on.setStatus`・`on.reasonOpen`'
        expected: ラベル「理由（任意）」の入力欄（`maxlength` 400）と「キャンセル」「クローズにする」があり見出しの「クローズにする」が無い。確定で `on.setStatus` が `closed` と入力欄の中身で 1 回、Esc で `on.reasonOpen` が偽で 1 回 / 入力欄が `readonly` で確定が `disabled` / `role="alert"` で「クローズにできませんでした。サーバーが止まっています。立ち上げ直してから押してください。」/ 「クローズにできませんでした。{理由}」。後の 2 つは理由の入力が開いたまま
      - name: test_thread_view_when_target
        case: 正常
        summary: 向けた項目とタグ
        condition: '`parametrize`: D-12 へ向けたタグ `画面` の TH-1 / 消えた D-99 へ向けた TH-6 / 項目もタグも持たないスレッド'
        mock: '`on.openId`'
        expected: '`D-12` とタイトルのボタン（押すと `on.openId` が 1 回）と押せないタグ / 押せない `D-99` だけ / 向けた項目とタグの行が無い'
      - name: test_thread_view_when_change_set_link
        case: 正常
        summary: 書き込みのまとまりのリンクを使う側へ知らせる
        condition: TH-1 を開き、AI の書き込みが `[D-1 を直した](#diff=V-1)`。`changeSetOf` は V-1 を引く
        mock: '`on.changeSet`'
        expected: リンクを押すと `on.changeSet` が `V-1` で 1 回、`on.back` は呼ばれない
  - name: reviewView
    title: レビュー中の書き込み
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: コメントを選んで送る
    kind: 画面
    summary: 画面設計『レビュー中の書き込み』を描く。見出し（戻る・題と件数）・送る帯・行・削除した行の「元に戻す」・送れない理由・箇所が合わない理由・空の状態を持つ。行の頭は「新しいスレッド」と向けた項目（項目を指さないものは札だけ）か、「返信」と返信先のスレッド（状態の札と `threadTitle`）。行の本文は `reviewBodyFold`（`changeSets` は `changeSetOf`、`open` は `expanded` にあるか、`on.toggle` は `on.fold`）で描き、書き換えている行は畳まない。開閉のボタンは、新しいスレッドの行は「スレッドを開く」と同じ行（`row-thread-open`）の先、返信の行はボタンだけの行に置き、ボタンを出さない返信の行はその行ごと出さない。クローズのスレッドへの返信（`isBlockedReply`）はチェックを `disabled` にして送れる件数から除き、送れない理由と「スレッドを開く」を出す。行の「修正」「削除」は `reviewRowActions`、書き換えは `reviewEditForm`、消した行は `removedReviewRow` で描く（`focus` の接頭辞は空）。「すべて選ぶ」は、文字を添えない三状態のチェックの箱（部品の中の `selectAllBox`）
    props:
      - name: props
        type: CommentsPanelProps
        required: true
        description: '`commentsPanel` の引数（`items`・`removed`・`threads`・`checked`・`editing` ほか・`stale`・`result`・`selected`・`reviewFocus`・`titleOf`・`on` を使う）'
    unit_tests:
      - name: test_review_view
        case: 正常
        summary: 送る帯と、新しいスレッド・返信の行を描く
        condition: C-1（D-1 への新しいスレッド）・C-2（消えた D-9、箇所が合わない）・C-3（項目を指さない新しいスレッド）・C-5（オープンの TH-1 への返信）、C-1・C-3 をチェック、削除した C-4
        mock: '`on.openThread`'
        expected: 見出し「レビュー中の書き込み」と件数 4、「2 / 4 件」と「まとめて送る（2 件）」、すべて選ぶが `indeterminate`。C-2 の行に理由（`role="alert"`）があり「箇所を外す」が無い。C-3 の行の頭が「新しいスレッド」の札だけで（`.row-target` が無い）、「スレッドを開く」がある。C-5 の頭が「返信」と TH-1 の状態の札・題で、押すと `on.openThread` が 1 回。C-4 の場所に「元に戻す」
      - name: test_review_view_when_blocked
        case: 正常
        summary: クローズのスレッドへの返信は選べず、送る件数に入らない
        condition: C-1（新しいスレッド）・C-44（クローズの TH-5 への返信）、どちらも `checked` にある
        mock: '`on.openThread`'
        expected: C-44 のチェックが `disabled` で外れている。「1 / 1 件」と「まとめて送る（1 件）」。C-44 の行に「クローズのスレッドへの返信は送れません。オープンに戻すと送れます。」と「スレッドを開く」（押すと `on.openThread` が TH-5 で 1 回）
      - name: test_review_view_when_empty
        case: 正常
        summary: 0 件は空の状態だけ
        condition: '`items`・`removed` が空'
        mock: なし
        expected: 「レビュー中の書き込みはありません。」があり、送る帯が無い
      - name: test_review_view_when_send_disabled
        case: 正常
        summary: チェック 0 件と送っている間は送れない
        condition: '`parametrize`: チェックが 0 件 / `result.kind` が `sending`'
        mock: '`on.send`'
        expected: まとめて送るが `disabled` で、押しても `on.send` が呼ばれない。前者は「送る書き込みにチェックを付けてください。」
      - name: test_review_view_when_editing_in_detail
        case: 正常
        summary: 詳細パネルで書き換えている行は、本文だけで描く
        condition: C-1（D-1）を `editing`、`editingIn` を `'detail'` で描く
        mock: なし
        expected: C-1 の行に入力欄・「キャンセル」「修正」が無く、本文が出て、「修正」「削除」のボタンが無い
      - name: test_review_view_when_sent
        case: 正常
        summary: 送れた結果を Claude Code へ入力したかで出し分ける
        condition: "C-1 をチェックし、`result` を `{kind: 'sent', count: 2, at: '2026-10-10T03:04:00+00:00', entered}` で描く。`parametrize`: `entered` が `true` / `false`"
        mock: なし
        expected: 送った結果（`role="status"`）が、前者は確かめの印と「2 件を送り、Claude Code に入力しました（12:04）。」、後者は注意の印と「2 件を送りましたが、Claude Code には入力できませんでした（12:04）。送った内容は保存されていて、次に話し合いを始めたときに取り込まれます。」
      - name: test_review_view_when_change_set_link
        case: 正常
        summary: 行の本文のまとまりのリンクと、文字のままの項目の ID
        condition: レビュー中に本文 `[A-14 の書き直し](#diff=V-6) で消した行は戻して。T-14 にも関わる` の返信 1 件。`titleOf` は T-14、`changeSetOf` は V-6 を引く
        mock: '`on.changeSet`・`on.openId`'
        expected: 行の `p.review-body` に `a.setlink` が 1 つで、T-14 は文字のまま（`button` が無い）。リンクを押すと `on.changeSet` が `V-6` で 1 回、`on.openThread` は呼ばれない
      - name: test_review_view_when_folded
        case: 正常
        summary: 長い本文を畳み、開閉のボタンを行の種類ごとの場所に置く
        condition: 'C-51（項目を指さない新しいスレッド、改行で 8 行）・C-52（TH-1 への返信、改行で 8 行）・C-53（TH-1 への 2 行の返信）。`parametrize`: `expanded` が空 / C-51 を `expanded` に入れ `editing` も C-51'
        mock: '`on.fold`'
        expected: C-51 の「続きを読む」が `row-thread-open` の中で「スレッドを開く」の前にあり、押すと `on.fold` が `('C-51', true)` で 1 回。C-52 の行には「続きを読む」だけの行がある。C-53 は開閉のボタンもその行も見えない / C-51 は入力欄を出し、本文も開閉のボタンも無い

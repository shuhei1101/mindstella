id: MOD-489-126
title: プレビュー / use-comments
lead: レビュー中の書き込みを溜める・書き換える・削除する・まとめて送信する mutation と、下書きの保存。
functions:
  - name: useAddComment
    title: 書き込みを溜める
    kind: フック
    usecase: 項目へコメントする
    summary: '`POST /api/comments` を呼び、成功でレビュー中の書き込みを再読み込みする。「元に戻す」は削除したときに返った `id`・`created` を渡して同じ hook で呼ぶ'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_add_comment
        case: 正常
        summary: 再読み込みする
        condition: '201'
        mock: MSW
        expected: レビュー中のコメントの query が再読み込みされる
      - name: test_use_add_comment_when_unreachable
        case: 異常
        summary: 届かない
        condition: fetch が失敗する
        mock: MSW
        expected: '`AppError` の `detail` が無く、届かない旨のエラー'
    container: frontend/src/shared/hooks/use-comments.ts
  - name: useUpdateComment
    title: 書き込みを書き換える
    kind: フック
    usecase: コメントを選んで送信する
    summary: '`PATCH /api/comments/{id}` で `body` か `loc: null` を送信し、成功で再読み込みする'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_update_comment
        case: 正常
        summary: 箇所を外す
        condition: '`loc: null`'
        mock: MSW
        expected: 'リクエストの本文が `{loc: null}`'
    container: frontend/src/shared/hooks/use-comments.ts
  - name: useRemoveComment
    title: 書き込みを削除する
    kind: フック
    usecase: コメントを選んで送信する
    summary: '`DELETE /api/comments/{id}` を呼び、返った中身を「元に戻す」のために返す。成功したら `discardReviewVoice([id])` を呼ぶ'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_remove_comment
        case: 正常
        summary: 中身を返す
        condition: '200'
        mock: MSW
        expected: 返った中身に `id`・`created`
      - name: test_use_remove_comment_when_review_voice
        case: 正常
        summary: 修正の入力で録音中の書き込みを削除すると、再読み込みを待たずに録音を捨てる
        condition: '`review:C-1` を録音中。`DELETE /api/comments/C-1` が 200'
        mock: MSW と `vi.stubGlobal`
        expected: 応答の直後に `session` が nullで `notice` が `discarded`
    container: frontend/src/shared/hooks/use-comments.ts
  - name: useSendComments
    title: まとめて送信する
    kind: フック
    usecase: コメントを選んで送信する
    summary: '`POST /api/comments/send` を呼び、成功で送信した ID の `discardReviewVoice` を呼び、レビュー中の書き込みとスレッドを再読み込みする。409 の `stale` を返す'
    returns:
      type: UseMutationResult
      description: mutation
    unit_tests:
      - name: test_use_send_comments
        case: 正常
        summary: 再読み込みする
        condition: '201'
        mock: MSW
        expected: レビュー中のコメントとスレッドの query が再読み込みされる
      - name: test_use_send_comments_when_stale
        case: 異常
        summary: 箇所が合わない
        condition: 409 と `stale`
        mock: MSW
        expected: '`stale` が返り、再読み込みしない'
      - name: test_use_send_comments_when_review_voice
        case: 正常
        summary: 修正の入力で録音中の書き込みを送信すると、録音を捨てる
        condition: '`review:C-1` を録音中。`POST /api/comments/send` へ `[C-1]` が 201'
        mock: MSW と `vi.stubGlobal`
        expected: 応答の直後に `session` が nullで `notice` が `discarded`
    container: frontend/src/shared/hooks/use-comments.ts
  - name: useSaveDraft
    title: 下書きの保存
    kind: フック
    usecase: 項目へコメントする
    summary: 入力が止まって 500ms 経ったとき（今の画面の `DRAFT_SAVE_DELAY_MS` と同じ）と、入力欄を離れたときに `PUT /api/drafts` を呼ぶ関数を返す。向けた先ごとに待ちを分ける。溜めたときは、その向けた先の予約した保存を取り消す（サーバーが溜めた向けた先の下書きを削除するため）
    returns:
      type: '(draft: DraftInput, now?: boolean) => void'
      description: 保存を予約する関数（`now` が真なら待たずに送信する。入力欄を離れたとき）
    unit_tests:
      - name: test_use_save_draft
        case: 正常
        summary: 止まってから送信する
        condition: 500ms の間に 3 回入力する
        mock: MSW と偽の時計
        expected: '`PUT /api/drafts` が 1 回'
    container: frontend/src/shared/hooks/use-comments.ts
notes:
  単体テスト: 同じフォルダの `use-comments.test.ts` に置く（knowledge の規約『フォルダ構成』）

id: MOD-489-47
title: プレビュー / display-settings-panel
lead: 画面設計『表示の設定.tsx』の要素と操作を描く。上書きを端末の保存領域に書き、既定にするで確かめのモーダルを開く。
components:
  - name: DisplaySettingsPanel
    title: 表示の設定
    kind: 画面
    usecase: 表示の設定を変える
    summary: 画面設計『表示の設定.tsx』の要素と操作を描く。上書きを端末の保存領域に書き（「レビューに追加」の後のフォーカスは `auto` で `focusAfterAdd` を `null`、それ以外はその値）、既定にするで確かめのモーダルを開く
    refs:
      - SCR-489-24#
    unit_tests:
      - name: test_display_settings_panel
        case: 正常
        summary: 種類を外す
        condition: メモを外す
        mock: MSW
        expected: 保存領域の `kinds` にメモが無い
      - name: test_display_settings_panel_when_reset
        case: 正常
        summary: 既定に戻す
        condition: 上書きを持つ
        mock: MSW
        expected: '`resetPrefs` の値が保存領域に書かれる'
      - name: test_display_settings_panel_when_focus_after_add
        case: 正常
        summary: 「レビューに追加」の後のフォーカスを変えて自動に戻す
        condition: 「入力欄へ戻す」を選び、続けて「自動」を選ぶ
        mock: MSW
        expected: 保存領域の `focusAfterAdd` が `input` になり、「この端末で変えている項目」に「レビューに追加した後のフォーカス」が出る。自動を選ぶと `focusAfterAdd` が無い
    container: frontend/src/features/settings/display-settings/display-settings-panel.tsx
notes:
  単体テスト: 同じフォルダの `display-settings-panel.test.tsx` に置く（knowledge の規約『フォルダ構成』）

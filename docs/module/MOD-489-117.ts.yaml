notes:
  コードブロック: '`decorateCodeBlocks`（言語の札・コピーのボタン・`md-code` の入れ物）を削除し、mdmark のコードブロックのバー・行の部品に任せる（#710。『プレビューを開く』の制約「本文の表とセクションの見せ方」）。`body.css` の `md-code`・`code-lang`・`code-copy` の規則も削除する'
  区切りの間: '見出しごとに包む `div.md-section-body` の直下のブロック同士の間は、`body.css` に `.mdmark .md-section-body > * + * { margin-block-start: var(--mdmark-space); }` を追加して付ける（#729）。包む要素の class は変えない'

  - name: restart_session
    title: 起動し直しを受け付ける
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    scope: public
    summary: IF-582-1 の受け付け。ワークスペースごとの鍵の中でクローズ済み・`stopping`・`restarting` を断り、`status` を `restarting`、`restart_reason` を契機、契機が `api` なら `close_pending` を偽にして、止めて起動する工程を別のスレッドで始める
    description: 別のスレッドは、生きていれば停止と同じ待ち方で `/exit` を貼り、`EXEC_EXIT_WAIT_SEC` まで tmux のセッションが閉じるのを待つ（過ぎたら `kill-session`）。最後の書き込みを待つ上限を過ぎたら起動し直さず、`pending_write` を真・`status` を `running`・`restart_reason` を `None` に戻す。契機が `rate_limit` なら `notify_stopped` を `rate_limited` で呼ぶ。`check_launch_options`・`resume_id_for` の後、`create_session` と同じ起動の工程（`build_command` に `resume_id`、`build_env` に契機が `compact` のとき `LAUNCH_REASON_ENV`）で起動し、準備ができたら `running` にして `restart_reason`・`last_error` を戻す。失敗はペインを閉じて `crashed`・`last_error` にし、契機が `api`・`compact` なら `notify_stopped` を `restart_failed` で呼ぶ
    side_effects: '`session.json` を書き換え、tmux のセッションを立て直す。停止の通知を呼ぶ'
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: session_id
        type: str | None
        required: true
        passing: positional
        description: MindStella のセッションの ID。内部の契機は `None`（最後の MindStella のセッション）
      - name: reason
        type: str
        required: true
        passing: positional
        description: '`RESTART_REASONS` のどれか'
      - name: force
        type: bool
        required: true
        passing: positional
        description: 最後の書き込みを待たないか
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・鍵・ポート
    returns:
      type: tuple[int, dict]
      description: '`(202, {session, status: restarting, warnings})`'
    exceptions:
      - name: ApiError
        condition: 404・409
    unit_tests:
      - name: test_restart_session
        case: 正常
        summary: 起動中を止めて --resume で起動し直す
        condition: '`TmuxRunner` の偽。`session.json` が `running`、会話の記録のファイルがある。別のスレッドの終わりを待つ'
        mock: '`TmuxRunner`・`ProcessInspector`・`time.monotonic`・`time.sleep`'
        expected: '`(202, {status: restarting, warnings: []})`。`respawn-pane` の引数に `--resume` と `claude_session_id`。終わった後の `session.json` が `running` で `session` が変わらない'
      - name: test_restart_session_when_rejected
        case: 異常
        summary: クローズ済み・停止の途中・起動し直しの途中は 409
        condition: '`parametrize`: クローズ済み / `stopping` / `restarting`'
        mock: '`TmuxRunner`'
        expected: '`ApiError` 409、`stage` が `closed` / `stopping` / `restarting`'
      - name: test_restart_session_when_launch_failed
        case: 異常
        summary: 起動に失敗すると crashed と last_error、契機で通知を呼び分ける
        condition: '`parametrize`: 契機 `api` で 125 / 契機 `comment` で 125 / プラグインのフォルダが無い'
        mock: '`TmuxRunner`・`notify.notify_stopped`'
        expected: '`crashed`、`last_error` が `account:` / `account:` / `launch_options:`。`notify_stopped` を `restart_failed` で 1 回 / 呼ばない / `restart_failed` で 1 回'
      - name: test_restart_session_when_rate_limited
        case: 正常
        summary: 利用上限の契機では止めた後に rate_limited を通知し、report-limit を呼ばない
        condition: 契機 `rate_limit`。`TmuxRunner` の偽は `/exit` の後にセッションを閉じる
        mock: '`TmuxRunner`・`notify.notify_stopped`・`subprocess.run`'
        expected: '`notify_stopped` を `rate_limited` で 1 回。`claude-balancer report-limit` を呼んでいない'
      - name: test_restart_session_when_exec_slow
        case: 正常
        summary: exec が上限までに終わらなければ kill-session してから起動する
        condition: '`TmuxRunner` の偽はセッションを閉じない。時刻を `EXEC_EXIT_WAIT_SEC` より進める'
        mock: '`TmuxRunner`・`time.monotonic`・`time.sleep`'
        expected: '`kill-session` の後に `new-session` を呼ぶ'
      - name: test_restart_session_when_write_timeout
        case: 異常
        summary: 最後の書き込みを待つ上限を過ぎたら起動し直さず running に戻す
        condition: 契機 `api`・`force` は偽。`session.json` が `running` で `responding` が真のまま、時刻を『最後の書き込みを待つ上限』より進める
        mock: '`TmuxRunner`・`time.monotonic`・`time.sleep`'
        expected: ペインに `/exit` を貼らない。終わった後の `session.json` が `running`・`pending_write` が真・`restart_reason` が `None`
  - name: request_restart
    title: 内部の契機で起動し直す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    scope: public
    summary: '`rate_limit`・`compact`・`comment` の契機で `restart_session` を呼ぶ。`restarting` なら重ねて起動せず真、`comment` でクローズ待ち・クローズ済みなら偽を返す（`ApiError` を外へ出さない）'
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: reason
        type: str
        required: true
        passing: positional
        description: '`rate_limit`・`compact`・`comment`'
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・鍵・ポート
    returns:
      type: bool
      description: 起動し直しを始めたか、既に起動し直しの途中か
    unit_tests:
      - name: test_request_restart
        case: 正常
        summary: 契機と状態で始めるかが決まる
        condition: '`parametrize`: `crashed` で `comment` / `restarting` で `comment` / クローズ待ちで `comment` / `running` で `rate_limit`'
        mock: '`restart_session`'
        expected: 真で 1 回呼ぶ / 真で呼ばない / 偽で呼ばない / 真で 1 回呼ぶ
  - name: wait_until_running
    title: 起動し直しの終わりを待つ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    scope: public
    summary: '`session.json` が `restarting` でなくなるまで `READY_POLL_SEC` ごとに読み、`running` なら真を返す。待つ上限は `STOP_WAIT_SEC + EXEC_EXIT_WAIT_SEC + READY_TIMEOUT_SEC`'
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ
    returns:
      type: bool
      description: 起動し直したか
    unit_tests:
      - name: test_wait_until_running
        case: 正常
        summary: restarting の後の状態で返り値が決まる
        condition: '`parametrize`: 2 回目に `running` / 2 回目に `crashed`'
        mock: '`time.monotonic`・`time.sleep`'
        expected: 真 / 偽
  - name: watch_crashes_once
    title: 落ちたことを 1 回見回る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    scope: public
    summary: IF-582-2 の 1 回分。ID の一覧のワークスペースのうち `running` のものに `is_alive` を `on_crashed`（`notify_stopped` を `crashed`）つきで呼ぶ。ワークスペースごとの例外は記録して次へ進む
    args:
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・tmux・プロセス
    returns:
      type: int
      description: '`crashed` にした数'
    unit_tests:
      - name: test_watch_crashes_once
        case: 正常
        summary: running で落ちているものだけ crashed にして通知する
        condition: '`running` でペインが無い / `restarting` でペインが無い / `running` で生きている、の 3 つのワークスペース'
        mock: '`TmuxRunner`・`ProcessInspector`・`notify.notify_stopped`'
        expected: 1 を返し、1 つ目だけ `crashed`。`notify_stopped` を `crashed` で 1 回
  - name: start_crash_watch
    title: 落ちたことの見回りを始める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    scope: public
    summary: '`CRASH_WATCH_INTERVAL_SEC`（環境変数で上書き）ごとに `watch_crashes_once` を呼ぶ `daemon` のスレッドを始め、`stop` が立つまで繰り返す'
    args:
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ
      - name: stop
        type: threading.Event
        required: true
        passing: positional
        description: 常駐サーバーの停止で立つ印
    returns:
      type: threading.Thread
      description: 始めたスレッド
    unit_tests:
      - name: test_start_crash_watch
        case: 正常
        summary: 間隔ごとに見回り、stop で終わる
        condition: 間隔を 0.01 秒に上書きし、`watch_crashes_once` を数える偽にする。少し待って `stop` を立てる
        mock: '`watch_crashes_once`'
        expected: 2 回以上呼ばれ、スレッドが終わっている
classes:
  - name: TmuxRunner
    title: tmux のコマンドを呼ぶもの
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: '`tmux` を常駐サーバーの `MINDSTELLA_*` を除いた環境で子プロセスで呼び（このとき tmux のサーバーが立つとペインがその値を受け継ぐため）、終了コードと標準出力を返す。テストは偽に置き換える'
    kind: クラス
    methods:
      - name: run
        title: tmux を呼ぶ
        kind: メソッド
        summary: 引数の並びで `tmux` を呼び、`(終了コード, 標準出力)` を返す
  - name: ProcessInspector
    title: プロセスの起動時刻を読むもの
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: PID の起動時刻を読む（『セッションの値の注入』と同じ引き方）。テストは偽に置き換える
    kind: クラス
    methods:
      - name: started_at
        title: 起動時刻
        kind: メソッド
        summary: PID の起動時刻の文字列を返す。プロセスが無ければ `None`
notes:
  ログ: |
    `logging.getLogger("mindstella.{モジュール}")` で標準エラーへ書く（ユニットが `~/.mindmap/server.log` に書き足す）。イベント名は固定の文字列にし、ワークスペースの ID・MindStella のセッションの ID・段階・理由は `extra` の属性に分ける。同じ例外は 1 回だけ書き、呼び出し元へ `ApiError` で返すだけの経路は、下の表に挙げたものだけを書く

    | イベント名 | 水準 | いつ | 属性 |
    | --- | --- | --- | --- |
    | `mindstella.session.started` | INFO | `create_session` が 201 を返す | ワークスペースの ID・MindStella のセッションの ID・claude-balancer を通したか |
    | `mindstella.session.start_failed` | ERROR | `create_session` が 502・503・504 を返す | ワークスペースの ID・段階（`launch`・`account`・`ready`）・終了コード・ペインの最後の 20 行 |
    | `mindstella.session.crashed` | WARN | `is_alive` が落ちたと判定して `crashed` にした | ワークスペースの ID・MindStella のセッションの ID・理由（ペインが無い・PID が無い・起動時刻が違う） |
    | `mindstella.session.stopped` | INFO | 止まって `stopped` を記録した | ワークスペースの ID・MindStella のセッションの ID・強制か・落ちていたか |
    | `mindstella.session.stop_wait_exceeded` | WARN | 待つ上限を過ぎて `pending_write` を真にした | ワークスペースの ID・MindStella のセッションの ID・待った秒数 |
    | `mindstella.session.stop_failed` | ERROR | 停止の別のスレッドで例外を捕まえた（`logger.exception`） | ワークスペースの ID・MindStella のセッションの ID・段階（`wait`・`exit`・`term`・`commit`・`state`） |
    | `mindstella.session.event_unknown` | WARN | `record_event` が状態に無い MindStella のセッションの出来事を受けた | MindStella のセッションの ID・出来事 |

id: MOD-531-4
title: サーバー / セッションの管理 / sessions.py
test_files:
  - tests/unit/scripts/test_sessions.py
constants:
  - name: READY_TIMEOUT_SEC
    title: 準備を待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: SessionStart のフックの登録を待つ秒数。`MINDSTELLA_SESSION_READY_TIMEOUT` で上書きできる
    value: 30.0（非機能要件『MindStella のセッションの準備を待つ上限』）
  - name: READY_POLL_SEC
    title: 準備を確かめる間隔
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: '`session.json` とペインの終わり方を読む間隔'
    value: '0.5'
  - name: STOP_WAIT_SEC
    title: 最後の書き込みを待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを止めてワークスペースをクローズにする
    summary: 停止で応答の終わりを待つ秒数。`MINDSTELLA_STOP_WAIT_TIMEOUT` で上書きできる
    value: 5400.0（非機能要件『最後の書き込みを待つ上限』）
  - name: STOP_POLL_SEC
    title: 応答の終わりを確かめる間隔
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを止めてワークスペースをクローズにする
    summary: 停止を待つ間に `session.json` を読む間隔
    value: '1.0'
  - name: EXIT_WAIT_SEC
    title: /exit の後に待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを止めてワークスペースをクローズにする
    summary: '`/exit` を貼ってから Claude Code のプロセスが終わるまで待つ秒数。過ぎたら SIGTERM を送る'
    value: '10.0'
  - name: PANE_TAIL_LINES
    title: 返すペインの行数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: 失敗のときに `detail` に入れるペインの最後の行数
    value: '20'
  - name: BALANCER_CLIENT
    title: claude-balancer のクライアント
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: '`claude-balancer exec --client` に渡す名前'
    value: '"mindstella"'
  - name: NO_ACCOUNT_EXIT
    title: 借りられないときの終了コード
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: claude-balancer の `exec` が子プロセスを起動せずに終わるときの終了コード（LIB-531-1）
    value: '125'
  - name: FIRST_INPUT
    title: 最初の入力
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: '準備ができた後にペインへ入力する 1 行（PR #531 の確認ログ）'
    value: '"[mindstella] MindStella のセッションを起動しました"'
  - name: EXEC_EXIT_WAIT_SEC
    title: exec の終了を待つ上限
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    summary: 起動し直しで `/exit` を貼ってから tmux のセッションが閉じるまで待つ秒数
    value: 75.0（非機能要件『起動し直しで exec の終了を待つ上限』）
  - name: CRASH_WATCH_INTERVAL_SEC
    title: 落ちたことを見回る間隔
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    summary: 見回りの間隔の秒数。`MINDSTELLA_CRASH_WATCH_INTERVAL` で上書きできる
    value: 60.0（非機能要件『落ちたことを見回る間隔』）
  - name: LAUNCH_REASON_ENV
    title: 起動の契機の環境変数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    summary: 圧縮の契機で起動したことをフックへ渡す環境変数の名前
    value: '"MINDSTELLA_LAUNCH_REASON"'
  - name: LAUNCH_RECORD_MISSING
    title: 記録が無いことの警告
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    summary: 作成・起動し直しの応答の `warnings` に入れる値
    value: '"launch_record_missing"'
  - name: RESTART_REASONS
    title: 起動し直しの契機
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを起動し直す
    summary: '`restart_reason` に入る値'
    value: ("api", "rate_limit", "compact", "comment")
functions:
  - name: new_session_id
    title: MindStella のセッションの ID を振る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`S-` に続く 12 桁の 16 進（`secrets.token_hex(6)`）を返す'
    args: []
    returns:
      type: str
      description: MindStella のセッションの ID
    unit_tests:
      - name: test_new_session_id
        case: 正常
        summary: 形と重なり
        condition: 1,000 回振る
        mock: なし
        expected: 全て `^S-[0-9a-f]{12}$` に合い、重ならない
  - name: build_command
    title: 起動のコマンドを組み立てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: ペインで動かすコマンドの引数の並びを作る（claude-balancer があれば `claude-balancer exec --client mindstella [--account {claude_config_dir}] -- claude ...`、無ければ `claude ...`）。`--account` は claude-balancer があり `claude_config_dir` があるときだけ付ける。`--mcp-config`・`--plugin-dir` を足し、`resume_id` があれば `--resume {resume_id}` を足す
    args:
      - name: options
        type: LaunchOptions | None
        required: true
        passing: positional
        description: 起動の指定
      - name: mcp_config_file
        type: Path | None
        required: true
        passing: positional
        description: '`mcp_config` を書いた一時ファイル'
      - name: balancer
        type: str | None
        required: true
        passing: positional
        description: '`claude-balancer` のパス（`shutil.which`）'
      - name: claude_config_dir
        type: str | None
        required: true
        passing: positional
        description: 依頼の `claude_config_dir`（claude-balancer の `--account` に渡す）
      - name: resume_id
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 引き継ぐ会話の ID（`resume_id_for` の結果）
    returns:
      type: list[str]
      description: コマンドの引数の並び
    unit_tests:
      - name: test_build_command
        case: 正常
        summary: claude-balancer の有無と指定で並びが変わる
        condition: '`parametrize`: balancer あり・指定あり / balancer 無し・指定が空 / 記録無し（`None`） / balancer あり・`claude_config_dir` が `/c` / balancer 無し・`claude_config_dir` が `/c`'
        mock: なし
        expected: '`[balancer, exec, --client, mindstella, --, claude, --mcp-config, f, --plugin-dir, p]` / `[claude]` / 同じく指定なし / `[balancer, exec, --client, mindstella, --account, /c, --, claude]` / `[claude]`（`--account` を付けない）'
      - name: test_build_command_when_resume
        case: 正常
        summary: resume_id があれば --resume を付ける
        condition: balancer あり・指定なし・`resume_id` が `abc`
        mock: なし
        expected: '`[balancer, exec, --client, mindstella, --, claude, --resume, abc]`'
  - name: build_env
    title: 渡す環境変数を組み立てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`MINDSTELLA_SESSION`・`MINDSTELLA_WORKSPACE`・`MINDSTELLA_PORT`・`MINDSTELLA_FLOW`（あれば）・`CLAUDE_CONFIG_DIR`（claude-balancer が無く指定があれば）・`LAUNCH_REASON_ENV`（`launch_reason` があれば）を返す'
    args:
      - name: session_id
        type: str
        required: true
        passing: positional
        description: MindStella のセッションの ID
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: port
        type: int
        required: true
        passing: positional
        description: 常駐サーバーのポート
      - name: flow
        type: dict | None
        required: true
        passing: positional
        description: 設定の進め方の文書
      - name: claude_config_dir
        type: str | None
        required: true
        passing: positional
        description: 依頼の `claude_config_dir`
      - name: has_balancer
        type: bool
        required: true
        passing: positional
        description: claude-balancer があるか
      - name: launch_reason
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 起動の契機（圧縮の起動し直しのとき `compact`）
    returns:
      type: dict[str, str]
      description: 環境変数
    unit_tests:
      - name: test_build_env
        case: 正常
        summary: 進め方の文書と CLAUDE_CONFIG_DIR の入り方
        condition: '`parametrize`: flow あり・balancer あり・config_dir あり / flow 無し・balancer 無し・config_dir あり'
        mock: なし
        expected: '`MINDSTELLA_FLOW: src#doc` があり `CLAUDE_CONFIG_DIR` が無い / `MINDSTELLA_FLOW` が無く `CLAUDE_CONFIG_DIR` がある'
      - name: test_build_env_when_compact
        case: 正常
        summary: 圧縮の契機を渡す
        condition: '`launch_reason` が `compact`'
        mock: なし
        expected: '`MINDSTELLA_LAUNCH_REASON: compact` がある'
  - name: is_alive
    title: MindStella のセッションが生きているか
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`status` が `running`・`stopping` で、ペインと `pid` のプロセスがあり起動時刻が合うかを返す。合わなければ状態を `crashed` にし、`running` から書き換えたときだけ `on_crashed` を呼ぶ'
    side_effects: 落ちていれば `session.json` を `crashed` にする。`running` から書き換えたときだけ `on_crashed` を呼ぶ（`stopping` からは呼ばない）
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 状態のフォルダ
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: tmux
        type: TmuxRunner
        required: true
        passing: positional
        description: tmux のコマンドを呼ぶもの
      - name: proc
        type: ProcessInspector
        required: true
        passing: positional
        description: プロセスの起動時刻を読むもの
      - name: on_crashed
        type: Callable[[], object] | None
        required: false
        default: None
        passing: keyword
        description: '`running` から `crashed` に書き換えたときに呼ぶ関数（呼び出し元は `lambda: notify_stopped(ctx, workspace_id, "crashed")` を渡す。戻り値は使わない）'
    returns:
      type: bool
      description: 生きているか
    unit_tests:
      - name: test_is_alive
        case: 正常
        summary: ペインとプロセスで判定し、落ちていれば crashed
        condition: '`running`・ペインあり・起動時刻が合う / ペインが無い / 起動時刻が違う / `stopped`'
        mock: '`TmuxRunner`・`ProcessInspector`'
        expected: '`True` / `False` で `crashed` / `False` で `crashed` / `False` で変えない'
      - name: test_is_alive_when_crashed_from_running
        case: 正常
        summary: running から落ちたときだけ on_crashed を呼ぶ
        condition: '`parametrize`: `running` でペインが無い / `stopping` でペインが無い。`on_crashed` に呼ばれた回数を数える関数'
        mock: '`TmuxRunner`・`ProcessInspector`'
        expected: どちらも `False` で `crashed`。`on_crashed` の呼ばれた回数が 1 / 0
  - name: create_session
    title: MindStella のセッションを作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: IF-531-2 の順で、残ったセッションを閉じてペインを作り、`remain-on-exit` を立ててからコマンドを動かし、SessionStart の登録かペインの終わりを待つ。既存の `session.json` から `resume_id_for` で引き継ぐ会話を決め、`launch.json` が無ければ指定なしで起動して応答の `warnings` に `LAUNCH_RECORD_MISSING` を入れる。既存の MindStella のセッションの生死の判定は `is_alive` に `on_crashed`（`notify_stopped` を `crashed` で呼ぶ）を渡す
    description: ワークスペースごとの鍵を、クローズ済みかの確かめから状態を書くまで持つ（準備を待つ間も）。`session.json` の読み書きは `state.update_session` の鍵を使う。ウィンドウ・ペインを指す tmux の `-t` は `={ワークスペースの ID}:`（末尾の `:` が無いとペインに当たらない）。最初の入力は SessionStart のフックが登録したペインへ貼る。409 の `pane` は 201 と同じ `{ワークスペースの ID}:0.0`
    side_effects: tmux のセッションを作り、`session.json` を書く。失敗のときはペインを閉じて `session.json` を消す
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: claude_config_dir
        type: str | None
        required: true
        passing: positional
        description: 依頼の `claude_config_dir`
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・鍵・ポート・プラグインのフォルダ
    returns:
      type: tuple[int, dict]
      description: '`(201, {session, pane, url, account})`。`account` は SessionStart のフックが `session.json` に入れた `claude_config_dir`'
    exceptions:
      - name: ApiError
        condition: 404・409・502・503・504
    unit_tests:
      - name: test_create_session
        case: 正常
        summary: 登録が入れば 201 と最初の入力
        condition: '`TmuxRunner` の偽。0.5 秒後に `session.json` の `claude_session_id` と `claude_config_dir`（`/c`）を入れる'
        mock: '`TmuxRunner`・`time.monotonic`・`time.sleep`'
        expected: '`(201, {..., account: /c})`。tmux の呼び出しが `has-session` → `new-session` → `set-option remain-on-exit on` → `respawn-pane -k ... -e MINDSTELLA_SESSION=...` → 登録の後の `set-option remain-on-exit off` → 最初の入力の貼り付けの順'
      - name: test_create_session_stale
        case: 正常
        summary: 止まった・落ちた後に残った tmux のセッションを閉じてから作る
        condition: '`parametrize`: `session.json` が `stopped` / `crashed`、`has-session` が 0'
        mock: '`TmuxRunner`・`time.monotonic`・`time.sleep`'
        expected: '`(201, ...)`。tmux の呼び出しが `has-session` → `kill-session` → `new-session` の順'
      - name: test_create_session_exists
        case: 異常
        summary: 生きている MindStella のセッションがあれば 409
        condition: '`session.json` が `running` で `is_alive` が真'
        mock: '`is_alive`'
        expected: '`ApiError`（409、`stage: exists`、`session`・`pane`）、tmux を呼ばない'
      - name: test_create_session_closed
        case: 異常
        summary: クローズ済みなら 409
        condition: '配信元の行が `outsideRead: false`'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（409、`stage: closed`）'
      - name: test_create_session_no_account
        case: 異常
        summary: ペインが 125 で終われば 503
        condition: '`display-message` が `1 125`、`capture-pane` が理由の行'
        mock: '`TmuxRunner`'
        expected: '`ApiError`（503、`stage: account`、`detail` に理由の行）、`kill-session` が呼ばれ、`session.json` が無い'
      - name: test_create_session_launch_exit
        case: 異常
        summary: 125 以外で終われば 502
        condition: '`display-message` が `1 1`'
        mock: '`TmuxRunner`'
        expected: '`ApiError`（502、`stage: launch`）'
      - name: test_create_session_not_ready
        case: 異常
        summary: 上限を過ぎれば 504
        condition: 登録が入らず、ペインも終わらない。上限を 1 秒にする
        mock: '`TmuxRunner`・`time.monotonic`'
        expected: '`ApiError`（504、`stage: ready`）、`kill-session` が呼ばれる'
      - name: test_create_session_when_resume
        case: 正常
        summary: 停止済みの記録の会話を引き継ぐ
        condition: 既存の `session.json` が `stopped` で `claude_session_id` を持ち、会話の記録のファイルがある
        mock: '`TmuxRunner`・`time.monotonic`・`time.sleep`'
        expected: '`respawn-pane` の引数に `--resume` とその ID。新しい `session` が振られている'
      - name: test_create_session_when_launch_record_missing
        case: 正常
        summary: launch.json が無ければ指定なしで起動して警告を返す
        condition: '`launch.json` が無いワークスペース'
        mock: '`TmuxRunner`・`time.monotonic`・`time.sleep`'
        expected: 応答の `warnings` が `[launch_record_missing]`。`respawn-pane` の引数に `--mcp-config`・`--plugin-dir` が無い
  - name: list_sessions
    title: MindStella のセッションの一覧
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: ワークスペースとMindStella のセッションの状態を取得する
    scope: public
    summary: 最後の MindStella のセッションの状態と `close_pending` を返す。何も書かず、『停止の通知』も呼ばない。`status` が `running` のときだけ `_dead_reason` で判定し、落ちていれば応答の `status` だけを `crashed`・`pane` を `None` にする（`is_alive` は呼ばない）
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ
    returns:
      type: dict
      description: '`{sessions: [...], close_pending}`'
    unit_tests:
      - name: test_list_sessions
        case: 正常
        summary: 無ければ空、落ちていれば crashed を返して書き換えない
        condition: '`session.json` 無し / `running` で生きている / `running` でペインが無い / `stopping` でペインが無い'
        mock: '`TmuxRunner`・`ProcessInspector`・`notify.notify_stopped`'
        expected: '`sessions: []` / `status: running` / `status: crashed`・`pane: None` / `status: stopping`。どれも `session.json` が呼ぶ前と同じで、`notify_stopped` が呼ばれていない'
  - name: stop_session
    title: MindStella のセッションを止める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: MindStella のセッションを止めてワークスペースをクローズにする
    scope: public
    summary: '`close_pending` を真・`status` を `stopping` にしてすぐ返し、別のスレッドで応答の終わりを待って止める。落ちていれば止める工程を飛ばして commit し 200'
    side_effects: '`session.json` を書き、ペインへ `/exit` を貼り、プロセスに SIGTERM を送り、tmux のセッションを閉じ、まとめていない変更を commit する'
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: session_id
        type: str
        required: true
        passing: positional
        description: MindStella のセッションの ID
      - name: force
        type: bool
        required: true
        passing: positional
        description: 応答の終わりを待たない
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・鍵
      - name: spawn
        type: Callable[[Callable[[], None]], None] | None
        required: false
        default: None
        passing: keyword
        description: 止める処理を走らせる関数（既定は別のスレッド。テストは同じスレッドで走らせる）
    returns:
      type: tuple[int, dict]
      description: '`(202, {status: stopping})` か `(200, {status: stopped})`'
    exceptions:
      - name: ApiError
        condition: '404'
    unit_tests:
      - name: test_stop_session
        case: 正常
        summary: すぐに 202 を返し、応答の途中でなければ /exit を貼る
        condition: '`running`・`responding: false`'
        mock: '`TmuxRunner`・止める処理を同じスレッドで走らせる'
        expected: '`(202, ...)`、受けた直後に `close_pending` が真、`/exit` が貼られる'
      - name: test_stop_session_waits
        case: 正常
        summary: 応答の途中なら終わるまで貼らない
        condition: '`responding: true` が 2 回の確認の後に偽になる'
        mock: 同上・`time.sleep`
        expected: '`/exit` が偽になった後に貼られる'
      - name: test_stop_session_wait_limit
        case: 異常
        summary: 上限を過ぎれば止めずに pending_write
        condition: '`responding` が真のまま、上限を 2 秒にする'
        mock: 同上・`time.monotonic`
        expected: '`/exit` が貼られず、`pending_write` が真、`status` が `running`'
      - name: test_stop_session_crashed
        case: 正常
        summary: 落ちていれば commit して 200
        condition: '`running` でペインが無い、まとめていない変更がある'
        mock: '`is_alive`・`history` の commit'
        expected: '`(200, {status: stopped})`、commit の説明に落ちていた旨'
      - name: test_stop_session_forced
        case: 正常
        summary: 強制なら待たずに止めて commit
        condition: '`responding: true`、`force=True`'
        mock: 同上
        expected: '`/exit` を待たずに SIGTERM と `kill-session`、commit の説明に強制の旨'
      - name: test_stop_session_thread_error
        case: 異常
        summary: 別のスレッドで例外が起きれば記録して status を戻す
        condition: '`/exit` の貼り付けで `TmuxRunner` が例外を送る'
        mock: '`TmuxRunner`・止める処理を同じスレッドで走らせる・`caplog`'
        expected: '`caplog` に `mindstella.session.stop_failed`（ワークスペースの ID・段階 `exit`）、`session.json` の `status` が `running`（生きている）で `last_error` に段階と理由、`close_pending` が真'
      - name: test_stop_session_when_notifying
        case: 正常
        summary: 止め終えたときに停止の依頼か強制停止を 1 回通知する
        condition: '`parametrize`: `force=False`・止める前に SessionEnd が `stopped` を書く / `force=False`・止める間にクローズが `crashed` を書く / `force=True`'
        mock: '`TmuxRunner`・止める処理を同じスレッドで走らせる・`notify.notify_stopped`'
        expected: '`notify_stopped` がワークスペースの ID と `stop_requested` / `stop_requested` / `force_stopped` で 1 回呼ばれる'
      - name: test_stop_session_when_stop_failed
        case: 異常
        summary: 止める間の失敗で crashed に戻したときだけ停止処理の失敗を通知する
        condition: '`parametrize`: `/exit` の貼り付けで例外、その後ペインが無い / ペインがある'
        mock: '`TmuxRunner`・止める処理を同じスレッドで走らせる・`notify.notify_stopped`'
        expected: '`status` が `crashed` で `notify_stopped` が `stop_failed` で 1 回 / `status` が `running` で `notify_stopped` が呼ばれない'
      - name: test_stop_session_when_crashed_before
        case: 正常
        summary: 落ちていた MindStella のセッションへの停止は異常終了だけを通知する
        condition: '`running` でペインが無い'
        mock: '`TmuxRunner`・`notify.notify_stopped`'
        expected: '`(200, {status: stopped})`、`notify_stopped` が `crashed` で 1 回だけ呼ばれる'
    description: '別のスレッドの本体は例外で包む。例外（tmux のコマンドの失敗・commit の失敗・`session.json` の書き込みの失敗）を捕まえたら `logger.exception` で `mindstella.session.stop_failed` を書き、`is_alive` で判定して `status` を `running`（生きている）か `crashed`（落ちた）に戻し、`last_error` に段階と理由を入れる。`close_pending` は真のまま残す（外部のアプリは停止を依頼し直せる）。停止の通知: 別のスレッドが停止済みを記録したとき、同じ鍵の中で読んだ書き換える前の `status` が `stopping`・`stopped`・`crashed` なら `notify_stopped` を `force` で `stop_requested` か `force_stopped` で呼ぶ。例外の後に `crashed` に戻したときは `stop_failed` で呼び、`running` に戻したときは呼ばない。落ちていて 200 を返す経路は、`is_alive` の `on_crashed` だけが呼ぶ'
  - name: record_event
    title: フックの出来事を記録する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/sessions.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: IF-531-6 の「記録する中身」で `session.json` を書き換える。`restarting` のときの `session_end` は `status` を変えず通知もしない。`running` のとき、`stop_failure` の `error` が `rate_limit` なら `request_restart` を `rate_limit` で、`pre_compact` なら `compact` で、応答を返した後の別のスレッドで呼ぶ。`session` が状態に無ければ偽（`session_start` は `socket`・`claude_config_dir` も入れる）。記録した後に、`prompt_submit`・`stop_failure`・`session_end` では書き込みのマーカーを解除し（`notify.clear_written`）、`stop` では作業の完了を通知する（`notify.notify_if_written`。名前と画面の URL は、`workspaces.find_workspace_row` のフォルダの `config.yaml` の `summary`（空ならフォルダの名前）と `ctx.previews.url_of` をスレッドの中で参照する）。`session_end` が書き換える前の `running` から `stopped` にしたときだけ `notify_stopped` を `session_ended` で呼ぶ
    side_effects: '`session.json` を書く。書き込みのマーカーを解除する。`stop` では通知のスレッドを起動することがある'
    args:
      - name: session_id
        type: str
        required: true
        passing: positional
        description: MindStella のセッションの ID
      - name: event
        type: dict
        required: true
        passing: positional
        description: 出来事の本文
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ
    returns:
      type: bool
      description: 記録したか
    unit_tests:
      - name: test_record_event
        case: 正常
        summary: 出来事ごとの書き換え
        condition: '`parametrize`: `session_start`（`source: startup`・`clear`・`fork`）/ `session_end`（`reason: clear`・`logout`）/ `prompt_submit` / `stop_failure`'
        mock: なし
        expected: '`claude_session_id`・`claude_config_dir` を入れる・入れ直す / `running` のまま・`stopped` / `responding` 真 / 偽'
      - name: test_record_event_unknown
        case: 正常
        summary: 知らない MindStella のセッションは記録しない
        condition: 状態に無い `session`
        mock: なし
        expected: '`False` を返し、`session.json` が変わらない'
      - name: test_record_event_when_stop
        case: 正常
        summary: stop で書き込んだ応答の通知を呼ぶ
        condition: 状態にある `session` に `stop`
        mock: '`notify.notify_if_written`'
        expected: '`notify_if_written` がワークスペースの ID で 1 回呼ばれ、`responding` が偽'
      - name: test_record_event_when_clearing
        case: 正常
        summary: prompt_submit・stop_failure・session_end では通知せずにマーカーを解除する
        condition: '`parametrize`: `prompt_submit` / `stop_failure` / `session_end`（`reason: logout`）。事前に `notify.MARKERS.mark` でマーカーを付ける'
        mock: '`notify.notify_if_written`'
        expected: '`notify.MARKERS.take` が偽で、`notify_if_written` が呼ばれない'
      - name: test_record_event_when_session_ended
        case: 正常
        summary: running からの session_end だけ Claude Code の終了を通知する
        condition: '`parametrize`: `running` に `session_end`（`reason: prompt_input_exit`） / `stopping` に同じ / `running` に `session_end`（`reason: clear`）'
        mock: '`notify.notify_stopped`'
        expected: '`notify_stopped` が `session_ended` で 1 回 / 呼ばれない / 呼ばれない'
      - name: test_record_event_when_rate_limit
        case: 正常
        summary: stop_failure の rate_limit と pre_compact で起動し直しを始める
        condition: '`parametrize`: `stop_failure`・`error: rate_limit` / `stop_failure`・`error: server_error` / `pre_compact`。`status` は `running`'
        mock: '`request_restart`'
        expected: '`rate_limit` で 1 回 / 呼ばない / `compact` で 1 回'
      - name: test_record_event_when_restarting
        case: 正常
        summary: 起動し直しの途中の session_end は状態を変えず通知しない
        condition: '`status` が `restarting` で `session_end`（`reason: other`）'
        mock: '`notify.notify_stopped`'
        expected: '`status` が `restarting` のままで `responding` が偽。`notify_stopped` を呼ばない'

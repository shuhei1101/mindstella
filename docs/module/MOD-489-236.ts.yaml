id: MOD-489-236
title: プレビュー / 画面と部品 / term-tip.ts
test_files:
  - tests/unit/preview/test_term_tip.py
components:
  - name: termTip
    title: 本文の印のツールチップ
    container: plugins/mindstella/skills/mindmap/preview/components/term-tip.ts
    usecase: 項目の詳細を読む
    kind: コンポーネント
    summary: 部品設計『本文の印のツールチップ』の中身と置き場所を決める。`entries` が用語 1 件だけなら用語・ID・意味を入れて `role="tooltip"` にし、用語が 2 件以上か、資料・調査を含むなら `role` を外して種類ごと（用語 → 資料 → 調査）の見出し（種類名と件数）とリストに分け、全ての項目のタイトルを `a.tt-link`（`data-id`。押すと `on.open`）にする。資料・調査は `description` があるときだけ出す。高さの上限は 360px で、超えた分は中でスクロールする。置き場所は `anchor` の上に 6px 空けて `bottom` で下端を留め、上に収まらなければ下に `top` で出し、上下どちらにも収まらなければ広い側に出してその高さに縮める（縮めた高さで固定し、中身が変わっても大きさを変えない）。収まるかの判定と縮める高さは、印との 6px と画面の端からの 8px を引いた余白で測る（上に出すなら `anchor` の上端 − 6 − 8）。左右も画面の端から 8px の内側に収める。中の Tab は、最初のリンクの Shift+Tab で印へ、最後のリンクの次で本文の印の次の要素へ移す
    props:
      - name: entries
        type: "{kind: 'terms' | 'docs' | 'research', item: object}[]"
        required: true
        description: 一致した項目（部品設計『本文の印のツールチップ』の `entries`）
      - name: anchor
        type: HTMLElement
        required: true
        description: 本文の印の要素。置き場所は `anchor.getBoundingClientRect()` で決め、フォーカスの戻し先にする。「本文の印の次の要素」は、`anchor` を含む本文（`anchor.closest(".md")`）の中のフォーカスできる要素の並びで `anchor` の次に当たるもの（無ければ `anchor`）
      - name: pinned
        type: boolean
        required: false
        default: 'false'
        description: 押して残したか
      - name: on
        type: '{open: (id: string) => void, close: () => void}'
        required: true
        description: 項目へ移る・閉じる
    unit_tests:
      - name: test_term_tip_content
        case: 正常
        summary: 用語 1 件だけは今と同じ形、用語 2 件以上か資料・調査を含むと見出しと区切りとリンクで並べる
        condition: '`parametrize`: 用語 G-1 だけ / G-1・資料 A-2（説明あり）・資料 A-9（説明なし）・調査 R-1 / 用語 G-1・G-2'
        mock: なし
        expected: '`role="tooltip"` で用語・ID・意味だけ、リンクが無い / `role` を持たず、見出し「用語 1」「資料 2」「調査 1」がこの順で、各タイトルが `data-id` を持つリンク。A-9 は説明を持たない / `role` を持たず、見出し「用語 2」の下に G-1・G-2 が用語・ID・意味とリンクのタイトルで並ぶ'
      - name: test_term_tip_position
        case: 正常
        summary: 上に出し、収まらなければ下、どちらにも収まらなければ広い側に縮める
        condition: '`parametrize`: 画面の中ほどの印 / 画面の上端の近くの印 / 高さ 520px の画面の中ほどの印に 8 件'
        mock: なし
        expected: 下端が印の 6px 上 / 上端が印の 6px 下 / 広い側に出て高さがその余白と同じで、中身を減らしても高さが変わらない
      - name: test_term_tip_keys
        case: 正常
        summary: 中の Tab と Esc とリンクの押下
        condition: 資料を含むツールチップの最初のリンクで Shift+Tab、最後のリンクで Tab、Esc、リンクで Enter
        mock: '`on.open`・`on.close`'
        expected: 印へ戻る / 本文の印の次の要素へ移り `on.close` / `on.close` / `on.open` がリンクの ID で呼ばれる

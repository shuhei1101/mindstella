notes:
  単体テスト: 同じフォルダの `refresh-hold-store.test.ts` に置く（knowledge の規約『フォルダ構成』）
  置き場所: 画面をまたいで React の外（書き換えの通知への接続）からも読むため、`shared/stores/` の Zustand に置く（knowledge の判定フローチャート『React の状態の置き場所』）

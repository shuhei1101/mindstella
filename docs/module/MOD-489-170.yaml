id: MOD-489-170
title: プレビュー / React
lead: React のプレビューのファイルの並び・つながり・置き場所の決まり。各ファイルの設計書は `モジュール構成/frontend/` の下に置く。
directory: |-
  ```
  package.json            依存と npm scripts（dev・build・build-export・typecheck・lint・test・storybook-react・generate-api）
  vite.config.ts          root を frontend/ にし、出力を plugins/mindstella/skills/mindmap/preview/spa/ へ書く（base は相対の ./。/w/{workspace}/ の下の assets/ を読む）
  vite.export.config.ts   vite.config.ts に vite-plugin-singlefile と rollup-plugin-license を加えた書き出し用のビルド。JS・CSS を中に持つ 1 枚の HTML を plugins/mindstella/skills/mindmap/preview/export/index.html へ、中に持つライブラリのライセンスを preview/licenses/frontend-licenses.txt へ書く（配る書き出しの元）
  vitest.config.ts        jsdom・setupFiles・coverage
  orval.config.ts         frontend/openapi.yaml から shared/api/generated/ へ生成する
  eslint.config.js        React の側（frontend/src）だけに当てる lint
  lefthook.yml            commit の前に、ビルドの出力（spa/ と export/）がソースと合うかの検査を実行する
  .storybook-react/       @storybook/react-vite の設定（main.ts・preview.tsx・public/mockServiceWorker.js）
  frontend/
    index.html            SPA の HTML
    openapi.yaml          SPA が読む配信の API の OpenAPI の定義
    tsconfig.json         React の側の型検査（paths の @/* は src/*）
    src/
      main.tsx            起動
      route-tree.gen.ts   TanStack Router の生成したルートのツリー
      app/
        query-client.ts   QueryClient を作る
        router.tsx        ルーターを作る
        app.tsx           Provider を組む
        preview-shell.tsx `tab` の画面と詳細・パネルを重ねて描く（features を組むのはここだけ）
      routes/
        __root.tsx        ルートの外枠
        index.tsx         SPA のルート（/）。search は `shared/core/preview-search.ts`、loader は `shared/hooks/preview-queries.ts`
  ```

  ```
  frontend/src/shared/
    adapters/
      api-client.ts       orval の mutator。fetch を呼び、失敗を AppError にする
      libraries.ts        描画のライブラリの読み込み（URL・integrity はプラグインの preview/libraries.json を import する）
      events-client.ts    書き換えの通知（EventSource）につなぎ、query を読み直す
    api/generated/        orval の生成物（手で書かない）
    core/
      app-error.ts        AppError
      embedded.ts         配る書き出しの埋め込みの記録と、API の応答の代わり
      workspace-path.ts   開いた画面のワークスペースのパスの頭と、端末の保存領域のキー
      preview-search.ts   SPA の search の Zod と、記録に合わせた補正
      records.ts          記録の型・索引・関係する項目
      filters.ts          絞り込みの判定と既定
      diff.ts             差分の表示の計算
      edits.ts            保存待ちの編集の重ね合わせ
      doc-export.ts       資料のエクスポート
      body-links.ts       本文の見出し・印・項目のリンク
      comments.ts         コメントの一覧・スレッド・レビュー中の書き込みの計算
      display.ts          表示の設定の計算と既定に戻す
      voice.ts            録音とカーソルの位置への挿入
    hooks/
      preview-queries.ts  SPA が読む query と読み直し
      use-preview-search.ts  search の読み書き
      use-diff-view.ts    差分の表示の時点と印
      use-edits.ts        保存待ちの編集の mutation
      use-comments.ts     レビュー中の書き込みの mutation と下書きの保存
      use-voice-input.ts  文字起こしの可否と、録音・文字起こし・すぐ送る
      use-screen-filters.ts  画面の絞り込みの条件
    stores/
      connection-store.ts 接続の状態（Zustand）
      theme-store.ts      ライト / ダーク（Zustand・端末の保存領域）
      prefs-store.ts      表・本文の見せ方・絞り込み・表示する種類・コメントの個人の上書き（端末の保存領域）
    lib/
      cn.ts               クラス名を合わせる
  ```

  ```
  frontend/src/
    shared/components/
      ui/                   shadcn/ui の部品（Base UI 版）
      icon.tsx              線のアイコンと状態の印
      topbar.tsx            トップバー
      topbar.stories.tsx    トップバーの状態ごとのストーリー
      {部品}.tsx            部品設計の `.tsx` の部品（表・絞り込み・差分の印 など）と横のストーリー
    shared/styles/
      tokens.css            :root の 3 ティアのトークン（デザイン方針の値）
      index.css             Tailwind の読み込みと @theme inline
    features/overview/overview/
      overview-screen.tsx   概要の画面
      overview-screen.stories.tsx  概要の画面のストーリー（MSW）
      components/
        list-tile.tsx       未読の AI の書き込み・未決定・要見直し・確認中の資料のタイル
    features/decisions/decisions/    検討事項の画面とボード
    features/tasks/tasks/            タスクの画面とボード
    features/docs/docs/              資料の画面とカード・ボード
    features/records/records/        記録の表の画面
    features/detail/detail-panel/    詳細パネルと中の部品
    features/detail/detail-fullscreen/  詳細の全画面
    features/detail/diagram-viewer/  図の拡大
    features/history/history/        変更履歴
    features/edits/pending-edits/    保存待ちのパネル
    features/settings/workspace-settings/  設定の画面
    features/settings/display-settings/    表示の設定と既定の保存の確かめ
    features/comments/shared/        スレッドの行・書き込み・返信の入力と、スレッドの mutation
    features/comments/comments-panel/  コメントの一覧
    features/comments/thread/        スレッド
    features/comments/review/        レビュー中の書き込み
    features/search/search/          全体の検索と開くキー
  ```
diagrams:
  - name: React のエントリーポイント
    diagram: "```mermaid\nclassDiagram\n  direction LR\n  class 起動\n  class アプリ\n  class QueryClientの作成\n  class ルーターの作成\n  class SPAのルート\n  class searchの検証\n  class 先読みするquery\n  class プレビューの外枠\n  起動 --> アプリ\n  アプリ --> QueryClientの作成\n  アプリ --> ルーターの作成\n  ルーターの作成 --> SPAのルート\n  SPAのルート --> searchの検証\n  SPAのルート --> 先読みするquery\n  SPAのルート --> プレビューの外枠\n```"
  - name: プレビューの外枠
    diagram: "```mermaid\nclassDiagram\n  direction LR\n  class プレビューの外枠\n  class 概要の画面\n  class 検討事項の画面\n  class タスクの画面\n  class 資料の画面\n  class 記録の表の画面\n  class 設定の画面\n  class 詳細パネル\n  class 詳細の全画面\n  class 保存待ちのパネル\n  class 変更履歴\n  class コメントの一覧\n  class 表示の設定\n  class スレッド\n  class レビュー中の書き込み\n  class 既定の保存の確かめ\n  class 詳細のコメント\n  class 図の拡大\n  プレビューの外枠 --> 概要の画面\n  プレビューの外枠 --> 検討事項の画面\n  プレビューの外枠 --> タスクの画面\n  プレビューの外枠 --> 資料の画面\n  プレビューの外枠 --> 記録の表の画面\n  プレビューの外枠 --> 設定の画面\n  プレビューの外枠 --> 詳細パネル\n  プレビューの外枠 --> 詳細の全画面\n  プレビューの外枠 --> 保存待ちのパネル\n  プレビューの外枠 --> 変更履歴\n  プレビューの外枠 --> コメントの一覧\n  プレビューの外枠 --> 表示の設定\n  コメントの一覧 --> スレッド\n  コメントの一覧 --> レビュー中の書き込み\n  表示の設定 --> 既定の保存の確かめ\n  詳細パネル --> 詳細のコメント\n  詳細の全画面 --> 詳細のコメント\n  詳細パネル --> 図の拡大\n  詳細の全画面 --> 図の拡大\n```"
  - name: 全体の検索
    diagram: "```mermaid\nclassDiagram\n  direction LR\n  class プレビューの外枠\n  class 全体の検索\n  class 全体の検索を開くキー\n  プレビューの外枠 --> 全体の検索\n  プレビューの外枠 --> 全体の検索を開くキー\n```"
  - name: React の基盤
    diagram: "```mermaid\nclassDiagram\n  direction LR\n  class API の呼び出し\n  class アプリのエラー\n  class 書き換えの通知への接続\n  class 接続の状態\n  API の呼び出し --> アプリのエラー\n  書き換えの通知への接続 --> 接続の状態\n```"
notes:
  置き場所: knowledge の規約『ビルド構成』『フォルダ構成』のとおり、package.json と各ツールの設定をリポジトリの直下に、ソースを `frontend/` に置く。型検査の設定は `frontend/tsconfig.json` に置く
  ルート: TanStack Router のファイルのルートで `routes/` を置き、`@tanstack/router-plugin` の Vite のプラグインで `route-tree.gen.ts` を生成する
  ストーリー: 共通の部品（`shared/components/`）は状態ごとのストーリーを横に置き、画面の部品（`components/`）にはストーリーを置かない（knowledge の規約『Storybook』）。概要の画面の本体のストーリーは MSW の handler でデータを差し込む
  単体テスト: Vitest と Testing Library で、テストのファイルを対象の横に `{名前}.test.ts(x)` で置く（knowledge の規約『フォルダ構成』『Unit / Component テスト』）。単体テストの表の名前から先頭の `test_` を除いた名前を、各テストの `test` の名前にする
  features のつながり: features どうしは import しない（boundaries の向き）。画面と詳細・パネルを組むのは `app/preview-shell.tsx` で、複数の画面が使う search・query・計算は `shared/` に置く。コメントの一覧の中のスレッド・レビュー中の書き込みの画面は、同じドメインの `features/comments/` の中で一覧が組む
  入力: 画面での編集は 1 キーごとではなく入力欄を離れたときに溜めるため、React Hook Form を使わず、`useAddEdit` をイベントハンドラから呼ぶ。設定の画面の入力の検証だけ `form.ts` の Zod を使う
  配る書き出し: 書き出し用のビルドは `vite.config.ts` と同じソースから作り、`isEmbedded()`（`shared/core/embedded.ts`）で埋め込みの記録・ハッシュの履歴・中に持つ配布ファイルへ切り替える。React の画面のソースを変えたら `npm run build` と `npm run build-export` の両方の出力を commit する

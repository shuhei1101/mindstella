id: MOD-489-115
title: プレビュー / list-rows
lead: 一覧の行の絞り込み・並べ替え・ドロワーの条件の組み立て。
functions:
  - name: filterRows
    title: 一覧の行の絞り込み
    kind: 関数
    usecase: 項目を表で絞り込む
    summary: 一覧の行の絞り込み・並べ替え・ドロワーの条件の組み立て。タグの列は `tagMatch` が `all` のとき選んだタグを全て持つ行、`any` のときどれかを持つ行を残し、ドロワーのタグの件数も同じ組み合わせ方で数える
    args: []
    returns:
      type: unknown
      description: 処理の結果
    container: frontend/src/shared/core/list-rows.ts
notes:
  カード・ボードの並べ替え: '`sortRows` の `sort` に `id`・`-id`・`created`・`-created`・`updated`・`-updated` を受け、カード・ボードも同じ関数で並べる（#186）。`id` は連番の数の順で、`-id` は連番として扱う。既定の並びは画面が『カードの並べ替え』の `INITIAL_CARD_SORT` から決める。単体テストは同じフォルダの `list-rows.test.ts` に `test_sort_rows_when_updated_desc`（更新日時の新しい順）・`test_sort_rows_when_id`（連番の数の順で D-10 が D-2 の後）を置く'

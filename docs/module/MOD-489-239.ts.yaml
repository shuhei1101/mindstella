id: MOD-489-239
title: プレビュー / 画面と部品 / side-by-side-body-diff.ts
test_files:
  - tests/unit/preview/test_side_by_side_body_diff.py
components:
  - name: sideBySideBodyDiff
    title: 左右に並べた本文の差分
    container: plugins/mindstella/skills/mindmap/preview/components/side-by-side-body-diff.ts
    usecase: 前回からの差分を見る
    summary: 部品設計『左右に並べた本文の差分』。`sideBySideRows` の行ごとに、左右の列（`section.sbs-col`、読み上げの名前「選んだ時点の本文」「今の本文」）へ `div.sbs-row` を 1 つずつ置き、塊を `renderMarkdown` で描き、描いた `data-line-start` に塊の開始行から 1 を引いた数を足して本文の行に揃える。見出しの段は、左右の全ての塊を描いた後、それらを合わせた最も上の段から `detailPanel` と同じ差を 1 つ求め（`headingShift`）、左右の全ての塊に当てる（`lowerHeadings`。h6 を超える段は `aria-level` で伝える。どちらも `screens/detail.ts` の関数を `MindmapPreview` に出して使う）。`changed` の行を持つ要素に、左は消した印、右は足した印を付ける（段落・見出し・コードは `del.df-blk` / `ins.df-blk` で囲み、表の行は `tr.df-row.df-del` / `df-add`、箇条書きの項目は `li.df-li-del` / `df-li-add`）。片側が空の行は `sbs-gap`（`aria-hidden`）にする。左の列と、`lined` が偽のときの右の列は `data-line-start` を外す。左の変えた図には `sbs-was` だけを付ける。行ごとに左右の高い方に `min-height` を揃え、中の要素の高さが変わったら（`ResizeObserver`）次のコマで 1 回だけ揃え直す
    description: 返すのは `{root, columns, markWords, decorate}`（並べた本文、左右の列、向かい合う変えた行で消した塊と足した塊の数が同じものを対にして語の面を付ける関数、右の変えた図に図の差分を付ける関数）。`sideBySideRows` が `null` のときは `null` を返し、`detailPanel` が本文の差分を計算しきれない旨を出す
    kind: コンポーネント
    props:
      - name: before
        type: string
        required: true
        description: 選んだ時点の本文
      - name: after
        type: string
        required: true
        description: 今の本文
      - name: lined
        type: boolean
        required: false
        default: 'true'
        description: 右の列に今の本文の行の印を残すか
      - name: deadline
        type: number
        required: true
        description: 語の差分（`diffInline`）を打ち切る時刻。`detailPanel` が行の差分を呼ぶ直前に決めたもの
    unit_tests:
      - name: test_side_by_side_body_diff
        case: 正常
        summary: 消した印を左、足した印を右に付け、片側だけの塊の向かいを空きにする
        condition: '段落 3 つの 1 つ目を消し末尾に段落を足した前後。`parametrize`: `lined: true` / `lined: false`'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 左の列の 1 行目が `del.df-blk`、右の列の 1 行目が `sbs-gap`、右の列の最後の行が `ins.df-blk`、左の列の最後の行が `sbs-gap`。左の列は `data-line-start` を持たない。右の列は `data-line-start` を持つ / 持たない。列の読み上げの名前は「選んだ時点の本文」「今の本文」
      - name: test_side_by_side_body_diff_when_aligned
        case: 正常
        summary: 変えていない塊は左右で上端の高さが揃う
        condition: 1 つ目の段落を 3 段落の長さに書き換えた前後を幅 600px の本文で描く
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 2 つ目・3 つ目の段落の左右の `getBoundingClientRect().top` が同じ
      - name: test_side_by_side_body_diff_when_timeout
        case: 正常
        summary: 行の差分を打ち切ったら描かない
        condition: 全ての行が違う 5000 行の前後
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`null`'
      - name: test_side_by_side_body_diff_when_headings
        case: 正常
        summary: 見出しの段は前後を合わせた最も上の段から 1 つの差で下げ、左右で揃う
        condition: '`## 決め方` と `### 理由` の見出しを持ち、`### 理由` の下の段落だけを書き換えた前後'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 左右の列とも「決め方」が `h4`、「理由」が `h5`

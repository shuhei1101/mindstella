id: MOD-489-11
title: プレビュー / thread-state
lead: スレッドの状態の札・レビュー中のマーカー・未読の札。
components:
  - name: ThreadState
    title: 状態の札
    kind: コンポーネント
    usecase: スレッドで話す
    summary: スレッドの状態（オープン・クローズ・レビュー中）を色に加えてマーカーと文字で出す

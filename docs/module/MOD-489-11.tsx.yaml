    summary: レビュー中の返信を持つスレッドに出すマーカー
    container: frontend/src/features/comments/shared/thread-state.tsx
  - name: UnseenMark
    title: 未読の札
    kind: コンポーネント
    usecase: スレッドで話す
    summary: 利用者の未読の書き込みを持つスレッドに出す札
    container: frontend/src/features/comments/shared/thread-state.tsx
constants:
  - name: AUTHOR_LABELS
    title: 書き手の呼び名
    usecase: スレッドで話す
    summary: 書き手（user・ai）→ 画面に出す呼び名
    container: frontend/src/features/comments/shared/thread-state.tsx
  - name: STATE_LABELS
    title: 状態の札の文言
    usecase: スレッドで話す
    summary: 状態の札の種類 → マーカーと文言
    container: frontend/src/features/comments/shared/thread-state.tsx

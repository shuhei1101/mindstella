id: MOD-489-140
title: プレビュー / prefs-store
lead: 表の列・ピン留め・差分のミニマップ・本文の見せ方・表示する種類・コメントの一覧のピン止め・レビュー中のコメントの並びを、`localStorage` の `mindmap-preview` のキーで読み書きする（制約「端末の保存領域」。キーは `workspaceKey` で末尾に `:{workspace}` を付ける）。絞り込みの条件と変更履歴で選んだ時点は『screen-state-store』が持つ。
functions:
  - name: readPrefs
    title: 保存領域の読み取り
    kind: 関数
    usecase: プレビューを開く
    summary: 保存領域の JSON を読み、読めない項目は持たないものとして扱う
    returns:
      type: Prefs
      description: 個人の上書き
    unit_tests:
      - name: test_read_prefs_when_invalid
        case: 異常
        summary: 読めない JSON
        condition: 壊れた JSON
        mock: '`localStorage`'
        expected: 空の上書き
      - name: test_read_prefs_when_legacy_written
        case: 正常
        summary: 前のバージョンの項目を含む JSON を読める
        condition: '`mindmap-preview` の形式の JSON（`columns`・`filters`・`diffSel`・`minimap`）に、前のバージョンの項目 `tablePin`・`bodyLayout` を含めたもの'
        mock: '`localStorage`'
        expected: 全ての項目を同じ値で読める
    container: frontend/src/shared/stores/prefs-store.ts
  - name: writePrefs
    title: 保存領域の書き込み
    kind: 関数
    usecase: プレビューを開く
    summary: 変えた項目だけを書き、ほかの項目を残す
    args:
      - name: patch
        type: Partial<Prefs>
        required: true
        description: 変える項目
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_write_prefs
        case: 正常
        summary: 知らない項目を残す
        condition: '`theme`・`kinds`・`commentsPinned` を持つ保存領域に `minimap` を書く'
        mock: '`localStorage`'
        expected: 3 つの項目が残り、`minimap` が書かれる
      - name: test_write_prefs_when_workspace_path
        case: 正常
        summary: ワークスペースごとのキーに書く
        condition: '`history.replaceState` で `location` のパスを `/w/mindstella-x-1/` にし、`minimap` を書く'
        mock: '`localStorage`'
        expected: '`mindmap-preview:mindstella-x-1` に `minimap` が書かれ、`mindmap-preview` が無い'
      - name: test_write_prefs_when_single_key_shortcuts
        case: 正常
        summary: 1 文字のショートカットの上書きを書き、読める
        condition: '`singleKeyShortcuts: false` を書いて読む'
        mock: '`localStorage`'
        expected: '`readPrefs().singleKeyShortcuts` が `false`、ほかの項目は残る'
    container: frontend/src/shared/stores/prefs-store.ts
  - name: readBodyScrolls
    title: 本文のスクロール位置の読み取り
    kind: 関数
    usecase: 項目の詳細を読む
    summary: 詳細の本文をスクロールした位置を、項目の ID ごとに sessionStorage のキー `workspaceKey(BODY_SCROLL_KEY)`（`mindmap-body-scroll`。サーバーの配信では末尾に `:{workspace}`）から読む
    args: []
    returns:
      type: Record<string, number>
      description: 項目の ID → 位置。0 以上の数だけ
    unit_tests:
      - name: test_read_body_scrolls
        case: 正常
        summary: 書いた位置を読む
        condition: 2 件の項目の位置を書く
        mock: なし
        expected: 項目の ID ごとの位置を返す
      - name: test_read_body_scrolls_when_broken
        case: 異常
        summary: 壊れた値は読まない
        condition: 負の数・文字・読めない JSON
        mock: なし
        expected: 0 以上の数だけを返す
    container: frontend/src/shared/stores/prefs-store.ts
  - name: writeBodyScroll
    title: 本文のスクロール位置の書き込み
    kind: 関数
    usecase: 項目の詳細を読む
    summary: 項目の本文をスクロールした位置を残す。書けない保存領域では何もしない
    args:
      - name: id
        type: string
        required: true
        description: 項目の ID
      - name: top
        type: number
        required: true
        description: スクロールの位置
    returns:
      type: void
      description: 無し
    container: frontend/src/shared/stores/prefs-store.ts
  - name: usePrefs
    title: 端末の保存領域の購読
    kind: フック
    usecase: プレビューを開く
    summary: 保存領域の JSON の文字列を `useSyncExternalStore` で購読し、`writePrefs` の書き換えを描画へ反映する
    args: []
    returns:
      type: Prefs
      description: 保存領域の値
    container: frontend/src/shared/stores/prefs-store.ts
  - name: useFocusAfterAddTarget
    title: 「レビューに追加」の後のフォーカスの移動先
    kind: フック
    usecase: 項目へコメントする
    summary: '`usePrefs` の `focusAfterAdd` と `matchMedia("(pointer: coarse)")` の変化を購読し、`focusAfterAddTarget`（`shared/core/display.ts`）で溜めた後のフォーカスの移動先を返す'
    args: []
    returns:
      type: "'input' | 'submit'"
      description: 入力欄か「レビューに追加」のボタン
    unit_tests:
      - name: test_use_focus_after_add_target
        case: 正常
        summary: 上書きと端末の種類で移動先を返す
        condition: '`parametrize`: 上書き無し・`pointer: coarse` に当たらない / 上書き無し・当たる / `focusAfterAdd: input`・当たる'
        mock: '`localStorage`・`matchMedia`'
        expected: '`input` / `submit` / `input`'
    container: frontend/src/shared/stores/prefs-store.ts
stores:
  - name: usePrefsStore
    title: 端末の保存領域
    usecase: プレビューを開く
    summary: '`mindmap-preview` のキーと値の形式の JSON のうち、移す画面が使う項目だけを読み書きし、知らない項目を削除しない'
    state:
      - name: columns
        type: Record<string, TablePrefs>
        description: '種類ごとの表示する列とピン留め。`TablePrefs` は `{hidden: string[]; pinTo: string | null}`'
      - name: minimap
        type: false | null
        description: 差分のミニマップを表示しない上書き
      - name: sectionFold
        type: false | null
        description: セクションの折りたたみをオフにする上書き
      - name: kinds
        type: Kind[] | null
        description: 表示する種類の上書き
      - name: commentsPinned
        type: true | null
        description: コメントの一覧のピン止め
      - name: reviewOrder
        type: '''oldest'' | null'
        description: レビュー中のコメントを古い順に並べる上書き
      - name: commentFormClosed
        type: true | null
        description: 詳細のコメントの入力を閉じているか
      - name: focusAfterAdd
        type: "'input' | 'none' | null"
        description: 「レビューに追加」の後のフォーカスの上書き（インターフェース定義の `focus_after_add`）。`null` は自動
      - name: singleKeyShortcuts
        type: false | null
        description: 1 文字のショートカットを使用しない上書き（インターフェース定義の `single_key_shortcuts`）。`null` は使用する
    container: frontend/src/shared/stores/prefs-store.ts
notes:
  単体テスト: 同じフォルダの `prefs-store.test.ts` に置く（knowledge の規約『フォルダ構成』）

        expected: メニューがエラーの文を `role="alert"` で出し、保存されない。「再試行」で `A-1.html` が保存されメニューが閉じる
      - name: test_detail_panel_when_embedded_html_diff
        case: 正常
        summary: 変わった埋め込んだ HTML の範囲だけを HTML の本文の差分に置き換える
        condition: 範囲 2 つを持ち、2 つ目の範囲の 1 つ目の段落を書き換えて末尾に段落を足した A-1 を `diff` つきで開き、「描いた結果（変更後）」を押す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 1 つ目の範囲はそのまま描かれ、2 つ目の範囲の場所に「埋め込んだ HTML」の差分が「原文の差分」を選んだ状態で出る。変更後では書き換えた段落に変わったマーカー、足した段落に足したマーカーが付き、範囲の中に本文の行の差分のマーカー（`ins.df-blk`）が無い
      - name: test_detail_panel_when_main_tag
        case: 正常
        summary: タグの行は主題のマーカーを付けて描き、差分の表示でも前後をタグの並びで描く
        condition: '`parametrize`: `tags` が `[{name: 画面}, {name: データ, main: true}]` の D-1 を開く / 選んだ時点で `tags` を `[{name: データ}]` → `[{name: データ, main: true}]` にした D-1 を `diff` つきで開く'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: タグの行の `span.tag` が `画面`・`データ` の順（記録の順）で `データ` だけが主題のマーカーを持ち、画面に「主題」の文字が出ない / `del.df-was` の `span.tag` `データ` がマーカーを持たず、`ins.df-now` の `span.tag` `データ` がマーカーを持つ
      - name: test_detail_panel_when_review_folded
        case: 正常
        summary: レビュー中のコメントの長い本文を Markdown で描いて畳む
        condition: 'D-1 へのコメント C-63（「頭の 1 行 + `1.`〜`7.` の番号付きのリスト」の 8 行）と C-65（1 行）。`parametrize`: `expanded` が空 / `expanded` に C-63'
        mock: '`comment.edit.on.fold`'
        expected: C-63 の本文が `ol` を持ち（リストの行に行の並びの罫線が無い）、`folded` で本文の下に `data-focus` が `detail-more:C-63` の「続きを読む」。C-65 には開閉のボタンが無い。押すと `on.fold` が `(C-63, true)` / C-63 が `folded` を持たず「折りたたむ」
  - name: panelResizer
    title: 幅の区切り
    kind: コンポーネント
    container: plugins/mindstella/skills/mindmap/preview/screens/detail.ts
    usecase: 項目の詳細を読む
    summary: 画面設計『詳細パネル』の要素「幅の区切り」を描き（`role="separator"`・`aria-orientation="vertical"`・`aria-label="詳細パネルの幅"`・`tabindex="0"`）、`panelWidthMax`・`clampPanelWidth` で収めた幅を `document.documentElement` の `--panel-w` と `aria-valuemin` / `aria-valuemax` / `aria-valuenow` に当てる。ポインターを押すとフォーカスを移して `setPointerCapture` し、動かすたびに押した位置からの差で持っている幅を変え（左へ動かすと広げる）、`requestAnimationFrame` で予約した 1 回で当てる（予約済みなら予約し直さない）。終わりは、押したときに `document` へ付けた `lostpointercapture` のリスナーで、押したときの `pointerId` に絞って受ける（離した・中断したときは区切りから泡立って届き、区切りが文書から外れたときは `document` に直接届く）。終わりではリスナーを外し、予約を取り消して、区切りが文書に残っていれば最後の幅を当て、押したときから幅が変わっていれば `onChange` を 1 回呼ぶ。ドラッグ中の幅はモジュールの変数に持ち、ドラッグ中に作られた区切り（記録の書き換えで詳細パネルを描き直したとき）は、`stored` の代わりにその幅から始める。←・→ は `PANEL_WIDTH.step` ずつ、Home は下限、End は上限にし、押すたびに当てて `onChange` を呼ぶ。描いたときと窓の幅が変わるたびに、最後に変えた幅（変えていなければ `stored`、それも無ければ `PANEL_WIDTH.default`）を今の上限に収めて当て直す（収めても `onChange` は呼ばない）。窓の幅の受け取りは、区切りが文書から外れたら外す。下限・上限で止まっている間は、その向きだけのカーソル（`w-resize` / `e-resize`）にする
    props:
      - name: stored
        type: number | null
        required: true
        description: そのタブで変えた幅（入口の `readPanelWidth`）
      - name: mapView
        type: () => boolean
        required: true
        description: 今、検討事項のマップを出しているか
      - name: onChange
        type: '(width: number) => void'
        required: true
        description: ドラッグを終えたときとキーで変えたときに、変えた幅を知らせる（入口が `writePanelWidth` で残す）
    unit_tests:
      - name: test_panel_resizer
        case: 正常
        summary: 残した幅を上限に収めて当て、ドラッグで幅を変えて知らせる
        condition: '表示の幅 1280、マップ以外。`parametrize`: `stored` が `null` / 768 / 1000'
        mock: '`onChange`（受けた幅を並べる関数）'
        expected: '`--panel-w` と `aria-valuenow` が 640 / 768 / 880、`aria-valuemin` が 480、`aria-valuemax` が 880 で、どれも `onChange` を呼ばない。続けて 100px 左へ動かすと、次のフレームで幅が 740 / 868 / 880（上限で止まる）になり、離すまで `onChange` を呼ばない。離すと `onChange` がその幅で 1 回だけ呼ばれる'
      - name: test_panel_resizer_keys
        case: 正常
        summary: 矢印キーで刻み、Home・End で下限・上限にする
        condition: 表示の幅 1280、`stored` 640。区切りにフォーカスして ← / → / Home / End を順に押す
        mock: '`onChange`'
        expected: 幅が 656 / 640 / 480 / 880 になり、`onChange` がその順で 4 回呼ばれる
      - name: test_panel_resizer_when_window_resized
        case: 正常
        summary: 窓の幅が変わると残した幅を収め直し、広げ直すと残した幅に戻す
        condition: 表示の幅 1280、`stored` 880 で描き、1000 に狭めてから 1280 に戻す
        mock: '`onChange`'
        expected: 狭めた後は幅と `aria-valuemax`・`aria-valuenow` が 840、戻した後は幅が 880。`onChange` は呼ばれない
      - name: test_panel_resizer_when_moved_within_frame
        case: 正常
        summary: 1 フレームの間の動きをまとめて 1 回当て、離すと最後の位置の幅を当てる
        condition: 表示の幅 1280、`stored` 640。押してから、次のフレームまでに押した位置から 20px・40px・60px 左の位置へ順に動かし、次のフレームを待ってから、80px 左の位置へ動かしてすぐに離す
        mock: '`onChange`'
        expected: 次のフレームまでは `--panel-w` が 640 のまま。次のフレームで 700 になる。離すとフレームを待たずに 720 になり、`onChange` が 720 で 1 回だけ呼ばれる
      - name: test_panel_resizer_when_released_without_moving
        case: 正常
        summary: 幅を変えずに離すと知らせない
        condition: 表示の幅 1280、`stored` 640。押して動かさずに離す
        mock: '`onChange`'
        expected: 幅が 640 のままで、`onChange` を呼ばない
      - name: test_panel_resizer_when_removed_while_dragging
        case: 正常
        summary: ドラッグ中に区切りが文書から外れると、最後の幅を知らせ、作り直した区切りはその幅から始める
        condition: 表示の幅 1280、`stored` 640。押して 100px 左の位置へ動かし、次のフレームの前に区切りを文書から外して、`stored` 640 の区切りを新しく描く。続けてフレームを進める
        mock: '`onChange`'
        expected: '`onChange` が 740 で 1 回だけ呼ばれる。新しい区切りの `aria-valuenow` と `--panel-w` が 740 で、フレームを進めても外した区切りが `--panel-w` を書き換えない'

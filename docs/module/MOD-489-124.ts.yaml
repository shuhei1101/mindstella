id: MOD-489-124
title: プレビュー / voice
lead: コメント・返信の入力の録音と、カーソルの位置への挿入（今の画面の `core/voice.ts` と同じ振る舞い）。
constants:
  - name: VOICE_MIME_TYPES
    title: 録音の形の候補
    usecase: 音声でコメントする
    summary: '`MediaRecorder.isTypeSupported` が真の最初の形で録る（今の画面と同じ並び）'
    value: "['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4']"
    container: frontend/src/shared/core/voice.ts
  - name: VOICE_TEXT
    title: 画面が持つ音声入力の文
    usecase: 音声でコメントする
    summary: サーバーが返さない理由の文（今の画面の `VOICE_TEXT` と同じ文）
    entries:
      - key: noMicrophone
        value: このページではマイクを使用できません。HTTPS か localhost の URL で開いてください。
      - key: denied
        value: マイクを使用できませんでした。ブラウザの設定でこのページのマイクを許可してください。
      - key: failed
        value: 文字起こしできませんでした。もう一度お試しください。
      - key: sendFailed
        value: 送信できませんでした。文字起こしの結果は入力欄に残しています。
    container: frontend/src/shared/core/voice.ts
  - name: WAVE_SAMPLE_MS
    title: 音量を取る間隔
    container: frontend/src/shared/core/voice.ts
    usecase: 音声でコメントする
    summary: 録音中にマイクの音量を取って波形の棒を 1 本足す間隔（ミリ秒）。`AnalyserNode` の `fftSize` 2048 が 48 kHz で 1 回に見る長さ（約 43 ms）以上にし、重ねて見ない。1 秒に 20 本で、話し始めてから 1 秒以内に棒の長さで声を拾えているかが分かる
    value: '50'
  - name: WAVE_LEVELS_MAX
    title: 持つ音量の数の上限
    container: frontend/src/shared/core/voice.ts
    usecase: 音声でコメントする
    summary: 波形に持つ音量の数の上限（古いものから捨てる）。入力欄の最も広い詳細の全画面の幅の上限 1600px を、縦の棒の最も狭い間隔（棒 2px + すき間 2px）の 4px で割った数で、どの幅でも枠を埋める
    value: '400'
classes:
  - name: RecordingError
    title: 録音を始められなかったエラー
    kind: クラス
    container: frontend/src/shared/core/voice.ts
    usecase: 音声でコメントする
    inherits: Error
    summary: '`startRecording` が録音を始められなかったときに投げる'
    properties:
      - name: reason
        type: '"denied" | "no-microphone"'
        description: 許可の拒否は `denied`、それ以外は `no-microphone`
functions:
  - name: micSupported
    title: マイクを使えるか
    kind: 関数
    usecase: 音声でコメントする
    summary: '`navigator.mediaDevices.getUserMedia` と `MediaRecorder` を持つかを返す'
    returns:
      type: boolean
      description: 両方を持てば真
    unit_tests:
      - name: test_mic_supported
        case: 正常
        summary: 両方があるときだけ真
        condition: 両方ある / `mediaDevices` が無い
        mock: '`vi.stubGlobal`'
        expected: 真 / 偽
    container: frontend/src/shared/core/voice.ts
  - name: startRecording
    title: 録音を始める
    kind: 関数
    usecase: 音声でコメントする
    summary: マイクの許可を得て録音を始め、`stop`（音声の `Blob` を返す）・`cancel` を持つ録音を返す。録音中は `AudioContext` の `AnalyserNode`（`fftSize` 2048）で `WAVE_SAMPLE_MS` ごとに 0〜1 の音量を取って引数 `onLevel` を呼ぶ（今の画面の `startRecording` と同じ求め方）。`stop`・`cancel` はどちらも音量を取るのをやめて `AudioContext` を閉じ、マイクのトラックを全て止める。許可の拒否は `reason` が `denied`、それ以外は `no-microphone` の `RecordingError` で断る
    returns:
      type: Promise<Recording>
      description: 録音中の 1 回分
    unit_tests:
      - name: test_start_recording
        case: 正常
        summary: 止めると音声を返し、トラックを止める
        condition: 偽の `getUserMedia`・`MediaRecorder`。始めて `stop()`
        mock: '`vi.stubGlobal`'
        expected: '`Blob` の型が `audio/webm;codecs=opus`。トラックの `stop` が呼ばれている'
      - name: test_start_recording_when_rejected
        case: 異常
        summary: 許可の拒否とそれ以外
        condition: '`getUserMedia` が `NotAllowedError` / `NotFoundError` で断る'
        mock: '`vi.stubGlobal`'
        expected: '`reason` が `denied` / `no-microphone` の `RecordingError` で断る'
      - name: test_start_recording_levels
        case: 正常
        summary: 間隔ごとに音量を知らせ、止めたら知らせない
        condition: 偽の `AudioContext`（`getByteTimeDomainData` が 128 と 192 を持つ値を返す）と `vi.useFakeTimers`。始めて `WAVE_SAMPLE_MS` を 2 回進め、`stop()` してからもう 1 回進める
        mock: '`vi.stubGlobal` と偽の時計'
        expected: '`onLevel` が `0.5` で 2 回だけ呼ばれ、`AudioContext` の `close` が呼ばれている'
    container: frontend/src/shared/core/voice.ts
  - name: insertAtCursor
    title: カーソルの位置への挿入
    kind: 関数
    usecase: 音声でコメントする
    summary: 入力欄の中身の選んだ範囲を文字で置き換え、中身と挿入した文字の後ろの位置を返す（範囲を超える位置は末尾にそろえる）
    returns:
      type: '{value: string, caret: number}'
      description: 置き換えた中身と位置
    unit_tests:
      - name: test_insert_at_cursor
        case: 正常
        summary: カーソルの位置と選んだ範囲
        condition: '`("確認: ", 4, 4, "案 A")` / `("abc", 1, 2, "x")` / `("ab", 9, 9, "x")`'
        mock: なし
        expected: '`確認: 案 A`・7 / `axc`・2 / `abx`・3'
    container: frontend/src/shared/core/voice.ts
  - name: pushLevel
    title: 音量を足す
    kind: 関数
    container: frontend/src/shared/core/voice.ts
    usecase: 音声でコメントする
    scope: public
    summary: 音量の並びの末尾に 1 つ足し、`WAVE_LEVELS_MAX` を超えた古いものを先頭から捨てた新しい並びを返す（元の並びは変えない）
    args:
      - name: levels
        type: readonly number[]
        required: true
        passing: positional
        description: 今の音量の並び（古い順）
      - name: level
        type: number
        required: true
        passing: positional
        description: 足す音量（0〜1。範囲の外は 0 か 1 にそろえる）
    returns:
      type: number[]
      description: 足した後の並び
    unit_tests:
      - name: test_push_level
        case: 正常
        summary: 末尾に足し、上限を超えた古いものを捨てる
        condition: '`parametrize`: `([], 0.5)` / `([0.1, 0.2], 1.4)` / 長さ `WAVE_LEVELS_MAX` の並びに `0.3`'
        mock: なし
        expected: '`[0.5]` / `[0.1, 0.2, 1]` / 長さ `WAVE_LEVELS_MAX` で、先頭の 1 つが消え末尾が `0.3`。元の並びは変わらない'
  - name: formatElapsed
    title: 経過の時間の文字
    kind: 関数
    usecase: 音声でコメントする
    summary: 秒数を `m:ss` にする
    returns:
      type: string
      description: '`m:ss`'
    unit_tests:
      - name: test_format_elapsed
        case: 正常
        summary: 分と秒
        condition: 0 / 72
        mock: なし
        expected: '`0:00` / `1:12`'
    container: frontend/src/shared/core/voice.ts
notes:
  単体テスト: 同じフォルダの `voice.test.ts` に置く（knowledge の規約『フォルダ構成』）

id: MOD-489-74
title: プレビュー / icon
lead: 24px の枠に描いた線のアイコンと、状態の 10px の印。絵は今の画面（`core/dom.ts`）と同じ。
components:
  - name: Icon
    title: 線のアイコン
    kind: コンポーネント
    container: frontend/src/shared/components/icon.tsx
    usecase: 共通
    summary: アイコンの名前で線の SVG を描き、読み上げから外す。大きさは className で変える
    props:
      - name: name
        type: IconName
        required: true
        description: アイコンの名前（トップバー・タブ・タイルが使うもの）
      - name: className
        type: string
        required: false
        description: 大きさ・色のクラス
  - name: StatusMark
    title: 状態の印
    kind: コンポーネント
    container: frontend/src/shared/components/icon.tsx
    usecase: 概要を見る
    summary: 状態ごとに色と形の違う 10px の印を描く。知らない状態は描かない
    props:
      - name: status
        type: string | undefined
        required: true
        description: 項目の状態
notes:
  単体テスト: 絵を返すだけで分岐を持たないため置かない。使う側（トップバー・概要の画面）の単体テストとストーリーで描かれることを確かめる

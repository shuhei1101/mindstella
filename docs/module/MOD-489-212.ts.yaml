id: MOD-489-212
title: プレビュー / 画面と部品 / decisions.ts
test_files:
  - tests/unit/preview/test_decisions.py
components:
  - name: decisionsScreen
    title: 検討事項
    container: plugins/mindstella/skills/mindmap/preview/screens/decisions.ts
    usecase: プレビューを開く
    kind: 画面
    summary: '画面設計『検討事項』を描く。検討事項を `filters` で絞り（`filterRows`）、ボード・表に同じ結果を渡す。表示形式の切り替えは `VIEWS_OF` の並び（ボード・表）で出す。状態の帯は出さない。ボードは `boardColumns` に状態の条件を渡し、外した列に「状態の条件で外しています。」を出す。ボードではツールバーの下に `filterChips` を描く。`drawerOpen` のときは `drawerGroups` で組んだ `filterDrawer` を描く。ボードの列は最も長い列の高さまで伸ばし（`align-items: stretch`）、列の見出しを `position: sticky` でボードの上に留める（タスク・資料のボードも同じ）'
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view, filter, closeDrawer}'
        required: true
        description: 項目を開く・表示形式を切り替える・条件を変える（新しい `filters`。ドロワーと表のチップから）・ドロワーを閉じる
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みの条件（入口の `FilterState` のこの画面の分）
      - name: drawerOpen
        type: boolean
        required: true
        description: 絞り込みのドロワーを開いているか
      - name: comments
        type: Record<string, number>
        required: false
        default: なし（マーカーを出さない）
        description: 項目の ID → レビュー中のコメントの件数（入口の `commentCounts`）。ボードのカードの 2 行目の右端に `data-comment-target` の場所を置き、表へは `comments` で渡す
      - name: removed
        type: RemovedItem[]
        required: false
        default: '[]'
        description: 選んだ時点で削除した検討事項（入口が `removedOf` で引く）。空でなければ、ツールバー・`filterChips` の下、ボード・表の上に `removedBand` を置く。`filters` で絞らない
      - name: edit
        type: "{marks: Record<string, 'pending' | 'remove' | 'blocked'>, adds: object[], onAdd} | null"
        required: false
        default: 'null'
        description: 編集の入口。配る書き出し・差分の表示中は `null`。表示形式の切り替えの帯の右端に「項目を追加」（幅 480px 以下はマーカーだけ。押すと `onAdd`）を置き、ボードのカード・表の行のタイトルの後ろに `marks` の `pendingEditMark` を置く。`adds`（追加する項目。`id` は仮の ID）はボードの状態の列の先頭と表の先頭の行に破線の枠で出し、ID の場所に「ID は保存で決まる」（表は「—」）を置く。押すと `on.open` に仮の ID を渡す
    unit_tests:
      - name: test_decisions_screen_when_removed
        case: 正常
        summary: 削除した検討事項を、表示形式と絞り込みによらず一覧の上の帯に出す
        condition: '`removed` に D-53。`parametrize`: ボード / 表 / ボードで `filters` が `{"status": ["決定済み"]}`'
        mock: なし（DOM を作って見る）
        expected: どれも一覧（ボード・表）の前に「削除した項目」の帯が 1 つあり D-53 を持つ。ボードの列に D-53 が無い

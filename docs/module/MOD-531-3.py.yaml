  - name: reopen_workspace
    title: ワークスペースを開き直す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: ワークスペースを開き直して削除する
    scope: public
    summary: 'クローズ済みなら配信元の行を `outside_read: true` に戻し、どちらも `close_pending` を偽にする。MindStella のセッションは起動しない'
    side_effects: project-index の行を変え、`session.json` の `close_pending` を書く
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・project-index のポート・鍵
    returns:
      type: dict
      description: '`{id, reopened, closed: false}`'
    exceptions:
      - name: ApiError
        condition: '404（`stage: workspace`）・502（`stage: source`）'
    process: |-
      1. `ctx.locks.for_workspace` を取る
      2. 鍵を取った後に `state.read_ids` に無ければ `ApiError`（404、`stage: workspace`）
      3. `find_workspace_row` で配信元の行を引く（`ProjectIndexError` は 502、`stage: source`。行が無ければ 404、`stage: workspace`）
      4. `is_closed` なら `project_index.patch_source` で `{outside_read: true}` にする（`ProjectIndexError` は 502、`stage: source`。クローズ待ちは解かない）
      5. `state.update_session` で `close_pending` を偽にする（`session.json` が無ければ書かない）。`create_workspace` の `reopened` も同じ内部の処理で解く
      6. `logger.info` で `mindstella.workspace.reopened`（`workspace_id`・`reopened`）を書く
    unit_tests:
      - name: test_reopen_workspace
        case: 正常
        summary: クローズ済みなら行を戻してクローズ待ちを解く
        condition: '配信元の行が `outsideRead: false`、`close_pending` が真'
        mock: '`project_index.get_settings`・`project_index.patch_source`'
        expected: '`{reopened: true, closed: false}`、`patch_source` が `{outside_read: true}` で呼ばれ、`close_pending` が偽'
      - name: test_reopen_workspace_not_closed
        case: 正常
        summary: クローズしていなければクローズ待ちだけ解く
        condition: '配信元の行が `outsideRead: true`、`close_pending` が真'
        mock: 同上
        expected: '`{reopened: false}`、`patch_source` が呼ばれず、`close_pending` が偽'
      - name: test_reopen_workspace_error_when_unknown
        case: 異常
        summary: ID の一覧に無いワークスペースは 404
        condition: '`ids` に無い'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（404・`stage: workspace`）'
      - name: test_reopen_workspace_error_when_row_missing
        case: 異常
        summary: 配信元の行が無いワークスペースは 404
        condition: '`ids` にあり、配信元の行が無い'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（404・`stage: workspace`）'
      - name: test_reopen_workspace_error_when_patch_failed
        case: 異常
        summary: project-index の失敗は 502 で、クローズ待ちを解かない
        condition: '`patch_source` が `ProjectIndexError`'
        mock: '`project_index.get_settings`・`project_index.patch_source`'
        expected: '`ApiError`（502・`stage: source`）で `close_pending` が真のまま'
  - name: delete_workspace
    title: ワークスペースを削除する
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: ワークスペースを開き直して削除する
    scope: public
    summary: クローズしたワークスペースの配信元の行・配信と変更の検知・状態のフォルダの `workspaces/{ID}/`・ID の一覧の行をこの順に削除する。記録のフォルダは変えない
    side_effects: project-index の行を削除し、配信と変更の検知を止め、状態のフォルダを削除する
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・project-index のポート・鍵・配信
    returns:
      type: dict
      description: '`{id, deleted: true}`'
    exceptions:
      - name: ApiError
        condition: '404（`stage: workspace`）・409（`stage: not_closed`）・500（`stage: state`）・502（`stage: source`）'
    process: |-
      1. `ctx.locks.for_workspace` を取る
      2. 鍵を取った後に `state.read_ids` に無ければ `ApiError`（404、`stage: workspace`）
      3. `find_workspace_row` で配信元の行を引く（`ProjectIndexError` は 502、`stage: source`）
         - 行があり `is_closed` でない: `ApiError`（409、`stage: not_closed`）で何も変えない
         - 行がありクローズ済み: `project_index.delete_source` で削除する（`ProjectIndexError` は 502、`stage: source`。状態のフォルダを変えない）
         - 行が無い: 前の削除で行だけ削除済みとして続ける
      4. `ctx.previews.stop_workspace` でそのワークスペースの配信と変更の検知を止める
      5. `state.delete_workspace_state` で `workspaces/{ID}/` を削除する（`OSError` は `logger.exception` で `mindstella.workspace.delete_failed` を書き、500、`stage: state`。ID の一覧の行は残す）
      6. `state.remove_id` で ID の一覧から外す
      7. `logger.info` で `mindstella.workspace.deleted`（`workspace_id`）を書く
    unit_tests:
      - name: test_delete_workspace
        case: 正常
        summary: クローズ済みなら行・状態・ID の一覧の行を削除する
        condition: '配信元の行が `outsideRead: false`、`workspaces/{ID}/` に `session.json`・`launch.json`'
        mock: '`project_index.get_settings`・`project_index.delete_source`・`ctx.previews`'
        expected: '`{deleted: true}`、`delete_source` と `stop_workspace` が 1 回ずつ呼ばれ、`workspaces/{ID}/` と `ids` の行が無く、記録のフォルダが残る'
      - name: test_delete_workspace_source_row_missing
        case: 正常
        summary: 行が無ければ残りだけ削除する
        condition: 配信元の行が無く、`workspaces/{ID}/` と `ids` の行がある
        mock: 同上
        expected: '`{deleted: true}`、`delete_source` が呼ばれず、`workspaces/{ID}/` と `ids` の行が無い'
      - name: test_delete_workspace_concurrent
        case: 異常
        summary: 鍵を取った時点で ID の一覧に無ければ 404
        condition: 同じ ID の削除を 2 つのスレッドで同時に呼ぶ
        mock: '`project_index.get_settings`・`project_index.delete_source`・`ctx.previews`'
        expected: '片方が `{deleted: true}`、もう片方が `ApiError`（404、`stage: workspace`）で、`delete_source` が 1 回だけ呼ばれる'
      - name: test_delete_workspace_error_when_unknown
        case: 異常
        summary: ID の一覧に無いワークスペースは 404
        condition: '`ids` に無い'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（404・`stage: workspace`）'
      - name: test_delete_workspace_error_when_not_closed
        case: 異常
        summary: クローズしていなければ 409 で、何も変えない
        condition: '行が `outsideRead: true`'
        mock: '`project_index.get_settings`・`project_index.delete_source`'
        expected: '`ApiError`（409・`stage: not_closed`）、`delete_source` が呼ばれず、`ids` の行が残る'
      - name: test_delete_workspace_error_when_source_failed
        case: 異常
        summary: project-index の失敗は 502 で、状態のフォルダを変えない
        condition: '`delete_source` が `ProjectIndexError`'
        mock: 同上
        expected: '`ApiError`（502・`stage: source`）、`workspaces/{ID}/` と `ids` の行が残る'
      - name: test_delete_workspace_error_when_state_failed
        case: 異常
        summary: 状態のフォルダを削除できなければ 500 で、ID の一覧の行を残す
        condition: '`delete_workspace_state` が `OSError`'
        mock: 同上・`caplog`
        expected: '`ApiError`（500・`stage: state`）、`ids` の行が残り、`caplog` に `mindstella.workspace.delete_failed`'
  - name: update_workspace
    title: ワークスペースの設定を書き換える
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: ワークスペースの設定を書き換えて起動し直す
    scope: public
    summary: 指定した設定のキー・進め方の文書を `config.yaml` に、追加の MCP・プラグインを `launch.json` に書き換える。全ての指定を確かめてから書き、起動中の MindStella のセッションには何もしない
    side_effects: '`.mindstella/config.yaml` と状態のフォルダの `workspaces/{id}/launch.json` を書く'
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: request
        type: dict[str, Any]
        required: true
        passing: positional
        description: 要求の本文（`settings`・`flow`・`mcp_config`・`plugin_dirs` のうち指定したキー）
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・project-index のポート・鍵・プロセスの中の書き込みの鍵
    returns:
      type: dict
      description: '`{id, changed}`。`changed` は値が変わった設定のキーと `flow`・`mcp_config`・`plugin_dirs`'
    exceptions:
      - name: ApiError
        condition: '400（`stage: body`）・404（`stage: workspace`）・409（`stage: records`）・422（`stage: mcp_config`・`plugin_dirs`・`settings`・`flow`）・500（`stage: write`）・502（`stage: source`）'
    process: |-
      1. 本文のキーを確かめる（`settings`・`flow`・`mcp_config`・`plugin_dirs` のどれも無い・ほかのキーがある・`settings` が空かオブジェクトでない・`flow` が `null` でも `source`・`doc` の文字列を持つオブジェクトでもない・`mcp_config` がオブジェクトでない・`plugin_dirs` が文字列の並びでないときは `ApiError`（400、`stage: body`））
      2. `ctx.locks.for_workspace` を取る
      3. 鍵を取った後に `state.read_ids` に無ければ `ApiError`（404、`stage: workspace`）
      4. `find_workspace_row` で配信元の行を引く（`ProjectIndexError` は 502、`stage: source`。行が無ければ 404、`stage: workspace`）。`workspace_folder` でフォルダを引き、`.mindstella/config.yaml` が無ければ 409（`stage: records`）
      5. `state.read_launch` で今の記録を読み、指定した `mcp_config`・`plugin_dirs` を重ねて（記録が無ければ指定しなかった方を `{"mcpServers": {}}`・`[]`）`validate_options` で確かめる（422、`stage: mcp_config`・`plugin_dirs`）
      6. `flow` にオブジェクトを指定したときは、`ctx.locks.for_workspace` だけを持つ間に `check_flow` で確かめる（422、`stage: flow`。502、`stage: source`）。`null` は確かめない
      7. `workspace_lock`（フォルダと `ctx.write_lock`）を取り、`store.load_workspace` で読んだ設定に `settings_update.stage_settings` で `settings` を当て、`flow` を置き換える（`null` ならキーを外す）（`MindmapError` は 422、`stage: settings`、`detail` はエラーの本文）。`workspace_lock` を持つ間は project-index を呼ばない
      8. 設定が変わるときだけ `settings_update.save_settings` で `config.yaml` を書く（`MindmapError` は 422、`stage: settings`。`OSError` などで書けなければ `logger.exception` で `mindstella.workspace.update_failed`（書けなかったファイル `config.yaml`）を書いて 500、`stage: write`）
      9. 指定した `mcp_config`・`plugin_dirs` で今の記録の値が変わるとき（記録が無いときを含む）だけ `state.write_launch` で書く。`OSError` のときは、手順 8 で書いていれば読んだときの設定で `save_settings` を呼んで戻し、`logger.exception` で `mindstella.workspace.update_failed`（書けなかったファイル `launch.json`・`config.yaml` を戻したか）を書いて 500（`stage: write`）。戻しの `save_settings` も失敗したときは、戻したかを偽にして同じく 500
      10. 鍵を放し、`logger.info` で `mindstella.workspace.updated`（`workspace_id`・`changed`）を書く
    unit_tests:
      - name: test_update_workspace
        case: 正常
        summary: 4 つの指定を書き換え、変わったキーを返す
        condition: '`settings.summary`・`flow`・`mcp_config`・`plugin_dirs` を今と別の値で渡す'
        mock: '`project_index.get_settings`・`check_flow`'
        expected: '`{id, changed: [summary, flow, mcp_config, plugin_dirs]}`、`config.yaml` と `launch.json` が渡した値'
      - name: test_update_workspace_keeps_other_launch_key
        case: 正常
        summary: プラグインだけを渡すと、追加の MCP の記録を残す
        condition: '`launch.json` があり、`plugin_dirs` だけを渡す'
        mock: '`project_index.get_settings`'
        expected: '`changed` が `plugin_dirs` だけで、`launch.json` の `mcp_config` が呼ぶ前と同じ、`config.yaml` を書かない'
      - name: test_update_workspace_launch_record_missing
        case: 正常
        summary: '`launch.json` が無ければ、指定しなかった方を空にして作る'
        condition: '`launch.json` が無く、`plugin_dirs` だけを渡す'
        mock: '`project_index.get_settings`'
        expected: '`launch.json` の `mcp_config` が `{"mcpServers": {}}`'
      - name: test_update_workspace_flow_removed
        case: 正常
        summary: '`flow: null` は確かめずに `flow` を外す'
        condition: '`flow` を持つ設定に `flow: null` を渡す'
        mock: '`project_index.get_settings`・`check_flow`'
        expected: '`check_flow` が呼ばれず、`config.yaml` が `flow` を持たない'
      - name: test_update_workspace_unchanged
        case: 正常
        summary: 同じ値は書かず、`changed` が空
        condition: 今と同じ `settings.summary` と `plugin_dirs` を渡す
        mock: '`project_index.get_settings`'
        expected: '`changed` が空で、`config.yaml`・`launch.json` の更新時刻が変わらない'
      - name: test_update_workspace_error_when_body_invalid
        case: 異常
        summary: 指定が無い・知らないキー・空の `settings` は 400
        condition: '`{}`・`{"title": "x"}`・`{"settings": {}}`・`{"flow": "x"}`'
        mock: なし
        expected: '`ApiError`（400・`stage: body`）で、鍵を取らず何も書かない'
      - name: test_update_workspace_error_when_unknown
        case: 異常
        summary: ID の一覧に無いワークスペースは 404
        condition: '`ids` に無い'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（404・`stage: workspace`）'
      - name: test_update_workspace_error_when_records_missing
        case: 異常
        summary: 配信元の行のフォルダに記録が無ければ 409
        condition: '`.mindstella/config.yaml` が無い'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（409・`stage: records`）'
      - name: test_update_workspace_error_when_plugin_dir_unreadable
        case: 異常
        summary: 読めないプラグインのフォルダは 422 で、ほかの指定も書かない
        condition: 読める `settings.summary` と、無いフォルダを含む `plugin_dirs`
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（422・`stage: plugin_dirs`）で、`config.yaml`・`launch.json` が呼ぶ前と同じ'
      - name: test_update_workspace_error_when_settings_invalid
        case: 異常
        summary: スキーマに合わない設定は 422
        condition: '`settings.summary` が空の文字列'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（422・`stage: settings`）で、`detail` に `config.yaml: summary` で始まる行があり、何も書かない'
      - name: test_update_workspace_error_when_flow_unreadable
        case: 異常
        summary: 参照できない進め方の文書は 422
        condition: '`check_flow` が `ApiError`（422・`stage: flow`）'
        mock: '`project_index.get_settings`・`check_flow`'
        expected: '`ApiError`（422・`stage: flow`）で、何も書かない'
      - name: test_update_workspace_error_when_launch_write_failed
        case: 異常
        summary: '`launch.json` を書けなければ `config.yaml` を戻して 500'
        condition: '`state.write_launch` が `OSError`'
        mock: '`project_index.get_settings`・`state.write_launch`・`caplog`'
        expected: '`ApiError`（500・`stage: write`）、`config.yaml` が呼ぶ前と同じ、`caplog` に `mindstella.workspace.update_failed`'
      - name: test_update_workspace_error_when_config_write_failed
        case: 異常
        summary: '`config.yaml` を書けなければ 500 で、`launch.json` を書かない'
        condition: '`settings_update.save_settings` が `OSError`、`settings.summary` と `plugin_dirs` を渡す'
        mock: '`project_index.get_settings`・`settings_update.save_settings`・`caplog`'
        expected: '`ApiError`（500・`stage: write`）、`launch.json` が呼ぶ前と同じ、`caplog` に `mindstella.workspace.update_failed`'
      - name: test_update_workspace_error_when_rollback_failed
        case: 異常
        summary: 戻しも失敗したら、戻したかを偽にして 500
        condition: '`state.write_launch` が `OSError` で、戻しの `save_settings` も `OSError`'
        mock: '`project_index.get_settings`・`state.write_launch`・`settings_update.save_settings`・`caplog`'
        expected: '`ApiError`（500・`stage: write`）、`caplog` の `mindstella.workspace.update_failed` の戻したかが偽'
notes:
  ServerContext: 状態のフォルダ・project-index のポート・`WorkspaceLocks`・配信（`serve.PreviewRegistry`）・プラグインのフォルダを持つ、入口（`server.py`）が作って渡す値。モジュール構成『入口』の `ServerContext`
  ログ: |
    `logging.getLogger("mindstella.{モジュール}")` で標準エラーへ書く（ユニットが `~/.mindmap/server.log` に書き足す）。イベント名は固定の文字列にし、ワークスペースの ID・MindStella のセッションの ID・段階・理由は `extra` の属性に分ける。同じ例外は 1 回だけ書き、呼び出し元へ `ApiError` で返すだけの経路は、下の表に挙げたものだけを書く

    | イベント名 | 水準 | いつ | 属性 |
    | --- | --- | --- | --- |
    | `mindstella.workspace.created` | INFO | `create_workspace` が `created`・`opened`・`reopened` を返す | ワークスペースの ID・結果・今回の指定を記録したか |
    | `mindstella.workspace.create_failed` | ERROR | `create_workspace` が 502 を返す | ワークスペースの ID・段階 `source`・project-index のステータスと理由 |
    | `mindstella.workspace.rollback_failed` | ERROR | 巻き戻しの削除が失敗した（`logger.exception`） | ワークスペースの ID・残ったパス |
    | `mindstella.workspace.closed` | INFO | `close_workspace` がクローズにした | ワークスペースの ID |
    | `mindstella.workspace.close_failed` | ERROR | `close_workspace` が 502 を返す | ワークスペースの ID・project-index のステータスと理由 |
    | `mindstella.workspace.updated` | INFO | `update_workspace` が書き換えた | ワークスペースの ID・変わったキー |
    | `mindstella.workspace.update_failed` | ERROR | `update_workspace` が `config.yaml` か `launch.json` を書けず 500 を返す（`logger.exception`） | ワークスペースの ID・書けなかったファイル・`config.yaml` を戻したか |

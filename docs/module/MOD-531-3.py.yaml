id: MOD-531-3
title: サーバー / ワークスペースの管理 / workspaces.py
test_files:
  - tests/unit/scripts/test_workspaces.py
classes:
  - name: WorkspaceLocks
    title: 依頼の順番の鍵
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    summary: ワークスペースごと・フォルダごとの `threading.Lock` を持つ。ワークスペースの管理とセッションの管理が 1 つを共有する
    kind: クラス
    methods:
      - name: for_workspace
        title: ワークスペースの鍵
        kind: メソッド
        summary: ワークスペースの ID の鍵を返す（無ければ作る）
      - name: for_folder
        title: フォルダの鍵
        kind: メソッド
        summary: フォルダの鍵を返す
constants:
  - name: RESERVED_MCP_NAMES
    title: 使えない MCP の名前
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    summary: ユーザー配下のプラグインの MCP と重なる名前
    value: '{"mindstella", "project-index"}'
  - name: AGENT_FLOWS_SOURCE
    title: エージェントフローの配信元
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    summary: project-index に登録するエージェントフローの配信元の ID（インターフェース定義『エージェントフローの参照』）
    value: '"mindstella-agent-flows"'
  - name: FILE_OUTSIDE_READ_KEY
    title: ファイルの配信元の行の作業範囲の外のキー
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: ワークスペースとMindStella のセッションの状態を取得する
    summary: グローバルの設定のファイルの行のキー（API の応答の `OUTSIDE_READ_KEY` は camelCase）
    value: '"outside_read"'
functions:
  - name: workspace_id_for
    title: ワークスペースの ID を作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`mindstella-{フォルダ名}-{ハッシュ}` を返す（フォルダ名の `.`・`:` は `-`。ハッシュはシンボリックリンクを解いた絶対パスの SHA-256 の先頭 6 桁）'
    args:
      - name: folder
        type: Path
        required: true
        passing: positional
        description: フォルダ
    returns:
      type: str
      description: ワークスペースの ID
    unit_tests:
      - name: test_workspace_id_for
        case: 正常
        summary: 同じフォルダは同じ ID、別の場所の同じ名前は別の ID
        condition: '`/a/家計簿.app` / 同じパスへのシンボリックリンク / `/b/家計簿.app`'
        mock: なし
        expected: '`mindstella-家計簿-app-{6 桁}` / 同じ値 / 違う値'
  - name: workspace_id_of
    title: 記録のワークスペースの ID
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: 記録の設定の `id` を返す。記録か `id` が無ければ `workspace_id_for` で振る（README の接続のコマンドと、入力の宛先の台帳が使う）
    args:
      - name: folder
        type: Path
        required: true
        passing: positional
        description: フォルダ
    returns:
      type: str
      description: ワークスペースの ID
  - name: validate_options
    title: 起動の指定を確かめる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: '`mcp_config` の形（`mcpServers` のオブジェクト）と予約の名前、`plugin_dirs` の各フォルダの `.claude-plugin/plugin.json` を確かめる'
    args:
      - name: mcp_config
        type: dict | None
        required: true
        passing: positional
        description: 追加の MCP の定義
      - name: plugin_dirs
        type: list[str]
        required: true
        passing: positional
        description: プラグインのフォルダ
    returns:
      type: LaunchOptions
      description: 確かめた指定
    exceptions:
      - name: ApiError
        condition: '422'
    unit_tests:
      - name: test_validate_options
        case: 正常
        summary: 形が合えば LaunchOptions
        condition: '`{mcpServers: {aituber: {...}}}` と `plugin.json` を持つフォルダ'
        mock: なし
        expected: 同じ値の `LaunchOptions`
      - name: test_validate_options_error
        case: 異常
        summary: 読めない指定は ApiError 422
        condition: '`mcpServers` に `mindstella` / `mcpServers` が無い / `plugin.json` が無い / 壊れた `plugin.json`'
        mock: なし
        expected: '`ApiError`（422、`stage` が `mcp_config` か `plugin_dirs`）'
  - name: check_flow
    title: 進め方の文書を確かめる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: IF-531-1 の「進め方の文書の確かめ方」の 3 段で確かめる
    args:
      - name: pi_port
        type: int
        required: true
        passing: positional
        description: project-index のポート
      - name: flow
        type: dict
        required: true
        passing: positional
        description: '`{source, doc}`'
      - name: folder
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: None
      description: なし
    exceptions:
      - name: ApiError
        condition: '422'
    unit_tests:
      - name: test_check_flow
        case: 正常
        summary: 3 段とも通れば例外なし
        condition: '`scope.read` がフォルダに当たり、一覧に ID があり、文書が 200'
        mock: '`project_index` の関数'
        expected: 例外なし
      - name: test_check_flow_error
        case: 異常
        summary: どこかで止まれば ApiError 422
        condition: '`scope.read` に当たらない / 一覧に無い / 文書が 404'
        mock: '`project_index` の関数'
        expected: '`ApiError`（422、`stage: flow`、`detail` に `scope`・`missing`）'
  - name: create_workspace
    title: ワークスペースを作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: IF-531-1 の確かめる順で、記録を作るか開き、配信元の行と ID の一覧を揃える
    description: '記録は既存の `commands.run_init` に既定の設定（`id`・`flow`・`summary` にフォルダ名）を渡して書く。記録があるフォルダは、開く前に『記録の形式の移行』の `migrator.migrate` を `workspace_lock`（`require=require_migratable`）の中で呼ぶ。移し替えたら、報告の `provisional`・`not_carried` を『前回参照した時点』の `save_migration_report` で状態のフォルダに残し、応答の `migration` にも入れ、同じ鍵の中で『変更の検知』の `rebase_snapshot` を呼び、前回の中身を作り直す（移し替えの書き換えを変更として記録しない）。フォルダごとの鍵とワークスペースごとの鍵を取ってから書き、ID の一覧は `state.add_id` が全体の鍵で書く。配信元の登録の失敗で巻き戻すときは、作成の前に直下の `README.md` が無かったら書いた `README.md` も消す。巻き戻しで、記録・`launch.json` の削除自体が失敗したら `logger.exception` で `mindstella.workspace.rollback_failed` を書き、502 は返す（`detail` に残ったものを足す）。配信元の行は、`GET /settings/sources` に行が無いときだけ追加し、行があれば追加の依頼を送らない。配信元の行を足した後に、配信元 `mindstella-agent-flows` の行が無ければ足す（`ensure_agent_flows_source`）。行があり、`workspace_folder` が今回のフォルダでないときは、そのフォルダに `.mindstella/config.yaml` があり、その `id` が同じ ID（記録が残っている）なら（記録が無いときにフォルダから振る `workspace_id_of` は使わない） `ApiError`（409、`stage: duplicate`、`detail` にそのフォルダ）、無ければ `project_index.patch_source` で `config`・`scope`（クローズ済みなら `outside_read: true` も）を今回のフォルダの値へ変更する。変更が `ProjectIndexError` のときは 502（`stage: source`）で、記録は削除しない（記録はこの依頼で作っていない）。記録の設定は書き換えない。移し替えの結果の `source_files` が 1 件以上で、配信元の行の追加・変更（`add_source`・`patch_source`）を送らなかったときは、`project_index.reload_sources` で全ての配信元を読み直させる（`ProjectIndexError` は 502、`stage: source`。記録は消さない）。そのために、配信元の行を揃える内部の処理は、結果に加えて行を送ったかを返す。移し替えを呼ぶ内部の処理は、応答の `migration`（手順が無ければ `null`）とは別に、移し替えの結果の `source_files` を返す'
    side_effects: '`.mindstella/` と `README.md`・`launch.json`・`workspaces.yaml` を書き、project-index へ行を送る'
    args:
      - name: request
        type: dict
        required: true
        passing: positional
        description: 本文（`folder`・`flow`・`mcp_config`・`plugin_dirs`）
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・project-index のポート・鍵・配信
    returns:
      type: tuple[int, dict]
      description: ステータス（201 か 200）と応答（`id`・`url`・`result`・`launch_options_recorded`・`migration`）
    exceptions:
      - name: ApiError
        condition: '400・403・409（`stage: version`。`WorkspaceNewerError`）・422（`stage: migration` は `StepFailedError`・`SchemaMismatchError`）・502'
    unit_tests:
      - name: test_create_workspace
        case: 正常
        summary: 記録の無いフォルダに作る
        condition: 許可するフォルダの下のまだ無いフォルダ
        mock: '`project_index.add_source`・`check_flow`・配信の URL'
        expected: '`(201, {result: created, launch_options_recorded: true})`、`config.yaml` に `id`・`flow`、`launch.json`・`ids` がある'
      - name: test_create_workspace_opened
        case: 正常
        summary: 記録がありlaunch.json が無ければ今回の指定を記録して opened
        condition: 記録あり・`launch.json` 無し・配信元の行無し
        mock: 同上
        expected: '`(200, {result: opened, launch_options_recorded: true})`、`config.yaml` は変わらない'
      - name: test_create_workspace_already_open
        case: 正常
        summary: 既に開いていれば何も変えない
        condition: 記録・`launch.json`・`ids`・配信元の行あり
        mock: 同上
        expected: '`(200, {result: already_open, launch_options_recorded: false})`、`launch.json` は変わらない'
      - name: test_create_workspace_reopened
        case: 正常
        summary: クローズ済みなら outside_read を戻す
        condition: '配信元の行が `outsideRead: false`'
        mock: 同上・`patch_source`
        expected: '`(200, {result: reopened})`、`patch_source` が `{outside_read: true}` で呼ばれ、`close_pending` が偽'
      - name: test_create_workspace_rollback
        case: 異常
        summary: 配信元の登録に失敗したら作った記録を消す
        condition: '`add_source` が `ProjectIndexError`'
        mock: 同上
        expected: '`ApiError`（502、`stage: source`）、`.mindstella/`・直下の `README.md`・`launch.json` が無く、`ids` に無い'
      - name: test_create_workspace_rollback_keeps_user_readme
        case: 異常
        summary: 利用者の README は巻き戻しで消さない
        condition: 作成の前から直下に利用者の `README.md`、`add_source` が `ProjectIndexError`
        mock: '`project_index.add_source`'
        expected: '`README.md` が元の中身のまま'
      - name: test_create_workspace_folder_not_allowed
        case: 異常
        summary: 許可するフォルダの外は 403
        condition: '`allowed_dirs` が別のフォルダ / キーが無い'
        mock: '`project_index.get_settings`'
        expected: '`ApiError`（403、`stage: folder`）、何も書かれていない'
      - name: test_create_workspace_migrated
        case: 正常
        summary: 前の版の記録は移し替えて開き、報告を残す
        condition: 版 v0.13.0 で `playbooks` を持つ記録のフォルダ
        mock: '`project_index.add_source`・`check_flow`・配信の URL'
        expected: '`(200, {result: opened, migration: {from_version: v0.13.0, ...}})`、`config.yaml` が `playbooks` を持たず、`load_migration_report` が報告を返し、`rebase_snapshot` が呼ばれる'
      - name: test_create_workspace_rollback_failed
        case: 異常
        summary: 巻き戻しの削除に失敗しても 502 を返して記録する
        condition: '`add_source` が `ProjectIndexError`、`shutil.rmtree` が `OSError`'
        mock: 同上・`caplog`
        expected: '`ApiError`（502、`detail` に残ったパス）、`caplog` に `mindstella.workspace.rollback_failed`'
      - name: test_create_workspace_newer
        case: 異常
        summary: 記録の版が新しければ 409
        condition: プラグインより新しい版の記録のフォルダ
        mock: 同上
        expected: '`ApiError`（409、`stage: version`）。記録が呼ぶ前と同じで配信元の行を足さない'
        exception: 版が新しい
      - name: test_create_workspace_migration_failed
        case: 異常
        summary: 移し替えが失敗したら 422
        condition: '`migrator.migrate` が `StepFailedError`'
        mock: 同上・`migrator.migrate`
        expected: '`ApiError`（422、`stage: migration`）。配信元の行を足さない'
        exception: 移し替えが失敗
      - name: test_create_workspace_moved
        case: 正常
        summary: 配信元の行が記録の無い前のフォルダを指せば、行を移した先へ変える
        condition: 設定に `id` を持つ記録と `launch.json`・`ids`。`id` は前のフォルダから `workspace_id_for` で振った値。配信元の行の `config` が記録の無い前のフォルダ
        mock: '`project_index.get_settings`・`patch_source`・配信の URL'
        expected: '`(200, {id: 設定の id, result: opened})`、`patch_source` が今回のフォルダの `config`・`scope` で呼ばれ、`add_source` が呼ばれない'
      - name: test_create_workspace_moved_closed
        case: 正常
        summary: 移した先でクローズ済みの行は同じ依頼で outside_read も戻す
        condition: 'test_create_workspace_moved と同じで、行が `outsideRead: false`'
        mock: 同上
        expected: '`(200, {result: reopened})`、`patch_source` が 1 回だけ `config`・`scope`・`outside_read: true` で呼ばれ、`close_pending` が偽'
      - name: test_create_workspace_duplicate
        case: 異常
        summary: 行が指す別のフォルダに同じ ID の記録があれば 409
        condition: 同じ `id` の記録を 2 つのフォルダに置き、行はもう一方を指す
        mock: '`project_index.get_settings`・`patch_source`'
        expected: '`ApiError`（409、`stage: duplicate`、`detail` にもう一方のフォルダ）、`patch_source`・`add_source` が呼ばれない'
      - name: test_create_workspace_moved_patch_failed
        case: 異常
        summary: 行の変更が失敗すれば 502 で記録は消さない
        condition: test_create_workspace_moved と同じで、`patch_source` が `ProjectIndexError`
        mock: 同上
        expected: '`ApiError`（502、`stage: source`）、`.mindstella/` と `launch.json` が残る'
      - name: test_create_workspace_schema_reloaded
        case: 正常
        summary: スキーマの複製を書き直し、行を送らないときは全ての配信元を読み直させる
        condition: 今の版の記録・`launch.json`・`ids`・配信元の行があり、`.mindstella/schemas/docs.schema.json` を別の中身に書き換えたフォルダ
        mock: '`project_index.get_settings`・`project_index.reload_sources`・配信の URL'
        expected: '`(200, {result: already_open, migration: null})`、`reload_sources` が 1 回呼ばれ、`add_source`・`patch_source` が呼ばれない'
      - name: test_create_workspace_schema_rewritten_row_added
        case: 正常
        summary: 行を追加するときは読み直しを重ねて送らない
        condition: 今の版の記録があり、配信元の行が無く、`.mindstella/schemas/docs.schema.json` を別の中身に書き換えたフォルダ
        mock: '`project_index.add_source`・`project_index.reload_sources`・配信の URL'
        expected: '`(200, {result: opened})`、`add_source` が 1 回呼ばれ、`reload_sources` が呼ばれない'
      - name: test_create_workspace_schema_reload_failed
        case: 異常
        summary: 読み直しに失敗したら 502
        condition: '`test_create_workspace_schema_reloaded` と同じフォルダで、`reload_sources` が `ProjectIndexError`'
        mock: 同上
        expected: '`ApiError`（502、`stage: source`）。記録は消さない'
  - name: close_workspace
    title: ワークスペースをクローズにする
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: MindStella のセッションを止めてワークスペースをクローズにする
    scope: public
    summary: 'MindStella のセッションがあれば断り（生死の判定は `sessions.is_alive` に `on_crashed=lambda: sessions.notify_stopped(ctx, workspace_id, "crashed")` を渡す）、無ければ配信元の行を `outside_read: false` にして `close_pending` を真にする'
    side_effects: project-index の行を変え、`session.json` の `close_pending` を書く
    args:
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
      - name: ctx
        type: ServerContext
        required: true
        passing: positional
        description: 状態のフォルダ・project-index のポート・鍵
    returns:
      type: dict
      description: '`{id, closed: true}`'
    exceptions:
      - name: ApiError
        condition: 404・409・502
    unit_tests:
      - name: test_close_workspace
        case: 正常
        summary: セッションが無ければ outside_read を偽にする
        condition: '`session.json` が `stopped`'
        mock: '`project_index.patch_source`・`sessions.is_alive`'
        expected: '`patch_source` が `{outside_read: false}` で呼ばれ、`close_pending` が真、`launch.json` が残る'
      - name: test_close_workspace_session_running
        case: 異常
        summary: セッションがあれば 409
        condition: '`session.json` が `running` で生きている'
        mock: '`sessions.is_alive` が真'
        expected: '`ApiError`（409、`stage: session`）、`patch_source` が呼ばれない'
      - name: test_close_workspace_unknown
        case: 異常
        summary: ID の一覧に無ければ 404
        condition: '`ids` が空'
        mock: なし
        expected: '`ApiError`（404）'
  - name: find_workspace_row
    title: 配信元の行を引く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: project-index の `GET /settings/sources` の行のうち、ワークスペースの ID の行を返す（セッションの管理がクローズ済みかとフォルダを読む）
    args:
      - name: pi_port
        type: int
        required: true
        passing: positional
        description: project-index のポート
      - name: workspace_id
        type: str
        required: true
        passing: positional
        description: ワークスペースの ID
    returns:
      type: dict | None
      description: 行。無ければ `None`
  - name: workspace_folder
    title: 配信元の行のフォルダ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: 行の `config`（`{フォルダ}/.mindstella/dev-docs.yaml`）からワークスペースのフォルダを返す
    args:
      - name: row
        type: dict
        required: true
        passing: positional
        description: 配信元の行
    returns:
      type: Path
      description: ワークスペースのフォルダ
  - name: is_closed
    title: クローズ済みか
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/workspaces.py
    usecase: 外部のアプリから起動する
    scope: public
    summary: 行の `outsideRead` が偽かを返す
    args:
      - name: row
        type: dict
        required: true
        passing: positional
        description: 配信元の行
    returns:
      type: bool
      description: クローズ済みか
  - name: ensure_agent_flows_source
    title: エージェントフローの配信元を登録する
    kind: 関数

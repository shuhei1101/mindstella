id: MOD-489-168
title: "サーバー / 起動"
lead: 起動スクリプト（`bin/mindstella`）と SessionStart のフックが呼ぶ Python の部分。仮想環境の依存を確かめ、インストールしたプラグインのフォルダ・セッションの名前を作り、常駐サーバーが待ち受けているかを確かめて落ちていれば起動する。tmux と Claude Code の起動は起動スクリプト（bash）が持つ。
directory: |-
  ```
  plugins/mindstella/
    bin/mindstella          起動のコマンド（bash。引数・tmux・claude の確かめ、MindStella のセッションのペインへつなぐ、server のサブコマンド。形はインターフェース定義『起動のコマンド』）
    skills/mindmap/scripts/
      check_env.py          依存の確認（システムの python3 で起動。Python 3.8 で読める構文）
      launch.py             起動の手助け（仮想環境の Python で起動。プラグインのフォルダ・MindStella の API の呼び出し・常駐サーバーの状態）
      ensure_server.py      常駐サーバーの起動の確認（システムの python3 で起動。Python 3.8 で読める構文と標準ライブラリだけ。systemd --user のユニット。形はインターフェース定義『常駐サーバーの起動の確認』）
      session_hook.py       MindStella のセッションのフック（システムの python3 で起動。Python 3.8 で読める構文と標準ライブラリだけ）
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 起動のコマンド
        class SessionStartのフック
        class MindStellaのセッションのフック
        class 依存の確認
        class 起動の手助け
        class 常駐サーバーの起動の確認
        class 入口
        起動のコマンド --> 依存の確認 : システムの python3 で起動
        起動のコマンド --> 起動の手助け : 仮想環境の Python で起動
        起動のコマンド --> 常駐サーバーの起動の確認 : システムの python3 で起動（server restart は --restart）
        起動の手助け --> 入口 : POST /workspaces・POST /workspaces/{id}/sessions
        SessionStartのフック --> 常駐サーバーの起動の確認 : --hook
        MindStellaのセッションのフック --> 入口 : POST /_admin/sessions/{session}/events
        常駐サーバーの起動の確認 --> 依存の確認 : run_check_env
        常駐サーバーの起動の確認 --> 入口 : systemctl --user start mindstella.service
      ```
notes:
  起動スクリプトの流れ: '`bin/mindstella` は (1) 引数を確かめ（`server status|stop|restart` は (8) へ）、(2) システムの `python3` で `check_env.py` を起動して `python_path` を受け取り、(3) `tmux`・`claude` を `command -v` で確かめ、(4) `claude plugin list --json` の出力を `python_path` で起動した `launch.py --find-plugin` の標準入力へ渡して `plugin_dir` を受け取り、(5) システムの `python3` で `{plugin_dir}/skills/mindmap/scripts/ensure_server.py` を起動し（`--hook` を付けない）、終了コードが 0 でなければ止まり、(6) `python_path` で `launch.py --start {引数}` を起動して画面の URL とペインを 1 行ずつ受け取り（終了コードが 0 でなければ止まる）、(7) 画面の URL を出してそのペインのセッションへつなぐ。(8) `status` は `launch.py --server-status`、`stop` は `systemctl --user stop mindstella.service`、`restart` は `{plugin_dir}/skills/mindmap/scripts/ensure_server.py --restart`。JSON の読み書きは bash でせず、`launch.py` の出力は 1 行に 1 つの値を出す形で受け取る'
  構文: '`check_env.py` は先頭に `from __future__ import annotations` を置き、Python 3.8 で読める構文だけで書く（依存が揃う前のシステムの `python3` で起動するため）。`ensure_server.py` も同じ理由で同じ書き方にし、標準ライブラリと `check_env` だけを読む。`launch.py` は確かめた仮想環境の Python で起動するので 3.12 の書き方を使ってよい。`session_hook.py` も、どのセッションのフックでも動くよう同じ書き方にし、標準ライブラリだけを読む'

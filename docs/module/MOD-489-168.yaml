id: MOD-489-168
title: "サーバー / 起動"
lead: 起動スクリプト（`bin/mindstella`）と SessionStart のフックが呼ぶ Python の部分。仮想環境の依存を確かめ、インストールしたプラグインのフォルダ・セッションの名前を作り、常駐サーバーが待ち受けているかを確かめて落ちていれば起動する。tmux と Claude Code の起動は起動スクリプト（bash）が持つ。
directory: |-
  ```
  plugins/mindstella/
    bin/mindstella          起動スクリプト（bash。引数・tmux・claude の確かめと tmux のセッション。形はインターフェース定義『起動スクリプト』）
    skills/mindmap/scripts/
      check_env.py          依存の確認（システムの python3 で起動。Python 3.8 で読める構文）
      launch.py             起動の手助け（仮想環境の Python で起動。プラグインのフォルダ・セッションの名前）
      ensure_server.py      常駐サーバーの起動の確認（システムの python3 で起動。Python 3.8 で読める構文と標準ライブラリだけ。形はインターフェース定義『常駐サーバーの起動の確認』）
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 起動スクリプト
        class SessionStartのフック
        class 依存の確認
        class 起動の手助け
        class 常駐サーバーの起動の確認
        class 入口
        起動スクリプト --> 依存の確認 : システムの python3 で起動
        起動スクリプト --> 起動の手助け : 仮想環境の Python で起動
        起動スクリプト --> 常駐サーバーの起動の確認 : システムの python3 で起動
        SessionStartのフック --> 常駐サーバーの起動の確認 : --hook
        常駐サーバーの起動の確認 --> 依存の確認 : run_check_env
        常駐サーバーの起動の確認 --> 入口 : 仮想環境の Python で server.py を起動
      ```
notes:
  起動スクリプトの流れ: '`bin/mindstella` は (1) 引数を確かめ、(2) システムの `python3` で `check_env.py` を起動して `python_path` を受け取り、(3) `tmux`・`claude` を `command -v` で確かめ、(4) `claude plugin list --json` の出力を `python_path` で起動した `launch.py` の標準入力へ渡して `{plugin_dir, session}` を受け取り、(5) システムの `python3` で `{plugin_dir}/skills/mindmap/scripts/ensure_server.py` を起動し（`--hook` を付けない）、終了コードが 0 でなければ止まり、(6) `tmux has-session -t ={session}` が無ければ `tmux new-session -d -s {session} -c {フォルダ} [-e CLAUDE_CONFIG_DIR=...] -- claude` で立て、(7) つなぐ。JSON の読み書きは bash でせず、`launch.py` の出力は 1 行に 1 つの値を出す形（`--format lines`）で受け取る'
  構文: '`check_env.py` は先頭に `from __future__ import annotations` を置き、Python 3.8 で読める構文だけで書く（依存が揃う前のシステムの `python3` で起動するため）。`ensure_server.py` も同じ理由で同じ書き方にし、標準ライブラリと `check_env` だけを読む。`launch.py` は確かめた仮想環境の Python で起動するので 3.12 の書き方を使ってよい'

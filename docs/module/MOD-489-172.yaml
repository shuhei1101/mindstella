id: MOD-489-172
title: "プレビュー / 基盤"
lead: 画面が共通で使う土台。記録の索引と画面に出す値の計算、描画のライブラリの呼び出しと読めないときの知らせ、URL のハッシュと履歴、コメント・返信の入力の録音を持つ。
directory: |-
  ```
  tsconfig.json      tsc の設定（リポジトリの直下。外部ライブラリ『typescript』）
  plugins/mindstella/skills/mindmap/preview/
    core/
      globals.d.ts   描画のライブラリ（marked・ELK・mermaid）のグローバルに npm の型を、mdmark のグローバルに `mount`・`version`・`collectMatches` の型を割り当てる（出力しない）
      dom.ts         要素の組み立て（`h`）・アイコン・状態の印など、画面が共通で使う DOM の部品
      records.ts     記録の索引・関係する項目・検索・箇所の名前（次の候補・ゴールまでの進捗・カテゴリー別の進捗はサーバーが計算した `derived` を使う）
      libs.ts        描画のライブラリの読み込み（mdmark）・有無と呼び出し（Markdown・図・配置）と、選んだ範囲から箇所を求める処理
      doc-export.ts  資料のエクスポート（1 枚の HTML と、埋め込んだ HTML を除いた Markdown）の組み立てとダウンロード
      router.ts      URL のハッシュの読み書きと履歴
      api.ts         サーバーの配信とのやり取り（記録の取得・書き換えの知らせ・レビュー中のコメント・書きかけ・まとめて送る・保存待ちの編集・文字起こしの可否・音声の文字起こし・すぐ送る）
      edits.ts       保存待ちの編集を記録に当てた表示の値と、項目・キー・案の保存待ちの印の種類
      lock.ts        ロック（注目の起点を 1 つの項目に留める）の押下の判定・2 回押しの読み替えと、鍵の震えの量・要素の鍵の震え（ネットワークと検討事項のマップで共通）
      voice.ts       コメント・返信の入力の録音（マイクを使えるか・録音の開始と止め方）・カーソルの位置への挿入・文字起こしの結果の組み立て
  ```

  全ての `.ts` は import / export を持たない script で、`namespace MindmapPreview` の下に関数を置く。読んだだけでは DOM に触らない。
  `tsc -p .` が `.ts` と同じ階層に即時実行関数の形の `.js` を出し、その `.js` を commit する。各 `.js` が名前空間を無ければ作り、あれば足すので、名前空間を作るだけのファイルは要らない。サーバーはこの `.js` をつないで雛形に差し込む（モジュール構成『ビルド』の `SCRIPT_FILES`）。

id: MOD-489-70
title: プレビュー / filter-drawer
lead: 部品設計『絞り込み.tsx』の props・イベント・状態を持つ。
components:
  - name: FilterDrawer
    title: 絞り込みのドロワー
    kind: コンポーネント
    usecase: 項目を表で絞り込む
    summary: '部品設計『絞り込み.tsx』の props・イベント・状態を持つ。ドロワーは `position: fixed` で、上端を CSS 変数 `--topbar-height`（無ければ 0。Storybook では変数が無く画面の上端）、下端を画面の下端にする。開いている間は、コメントの一覧と同じグレーアウトをトップバーとタブの帯の下から描き、ドロワーの外の画面の要素を `inert` にする。`presetSave` を渡されたときは、プリセットのまとまりの下（プリセットが 0 件のときも）に部品『プリセットの保存』を描き、`hasTagCondition` は `tagExpr` が null でないか `selected.tags` が 1 つ以上あるかで決める'
    refs:
      - CMP-489-46#
    unit_tests:
      - name: test_filter_drawer
        case: 正常
        summary: 値を選ぶ
        condition: チェックボックスを押す
        mock: なし
        expected: '`onToggleValue` が key と値で呼ばれる'
      - name: test_filter_drawer_when_preset
        case: 正常
        summary: プリセットを選ぶ
        condition: '`presets` に 0 件の「通知」を含む 2 件を渡し、「画面の設計」のボタンを押す'
        mock: なし
        expected: '`onApplyPreset` が「画面の設計」で呼ばれ、「通知」のボタンに「0 件」の文字があり `aria-pressed` が偽'
      - name: test_filter_drawer_when_tag_detail
        case: 正常
        summary: 簡易で表せない式は詳細で出す
        condition: '`tagExpr` に「画面」を含み「廃止」を含まない式を渡す'
        mock: なし
        expected: 指定方法の「詳細」が選ばれ「簡易」が無効で、タグのチェックボックスの代わりにタグの条件の詳細がある
      - name: test_filter_drawer_when_text_commit
        case: 正常
        summary: 列の文字の条件を打ち終えたときに知らせる
        condition: '`parametrize`: 入力欄に「画面」と打って 500ms 進める（フェイクのタイマー）/ 打って Enter を押す / 打ってフォーカスを外す'
        mock: なし
        expected: 打つたびに `onTextChange` が呼ばれ、`onTextCommit` が 1 回だけ呼ばれる（500ms の前には呼ばれない）
      - name: test_filter_drawer_when_preset_save
        case: 正常
        summary: タグの条件の有無で保存を押せるかが変わる
        condition: '`presetSave` を渡し、`parametrize`: `selected` に `tags` が無く `tagExpr` が null / `selected.tags` が「画面」 / `tagExpr` が「画面」を含む式'
        mock: なし
        expected: 「プリセットとして保存」が `aria-disabled="true"` / `aria-disabled` を持たない / `aria-disabled` を持たない
    container: frontend/src/shared/components/filter-drawer.tsx
notes:
  単体テスト: 同じフォルダの `filter-drawer.test.tsx` に置く（knowledge の規約『フォルダ構成』）
  文字の条件の区切り: 列の文字の条件の入力欄は、打つたびに `onTextChange(key, text)` を呼び、入力が 500ms 止まったとき・Enter を押したとき・入力欄からフォーカスが離れたときに `onTextCommit()` を 1 回呼ぶ（どれかで呼んだら待ちのタイマーを止める）

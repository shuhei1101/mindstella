id: MOD-489-70
title: プレビュー / filter-drawer
lead: 部品設計『絞り込み.tsx』の props・イベント・状態を持つ。
components:
  - name: FilterDrawer
    title: 絞り込みのドロワー
    kind: コンポーネント
    usecase: 項目を表で絞り込む
    summary: 部品設計『絞り込み.tsx』の props・イベント・状態を持つ
    refs:
      - CMP-489-46#
    unit_tests:
      - name: test_filter_drawer
        case: 正常
        summary: 値を選ぶ
        condition: チェックボックスを押す
        mock: なし
        expected: '`onToggleValue` が key と値で呼ばれる'
      - name: test_filter_drawer_when_preset
        case: 正常
        summary: プリセットを選ぶ
        condition: '`presets` に 0 件の「通知」を含む 2 件を渡し、「画面の設計」のボタンを押す'
        mock: なし
        expected: '`onApplyPreset` が「画面の設計」で呼ばれ、「通知」のボタンに「0 件」の文字があり `aria-pressed` が偽'
      - name: test_filter_drawer_when_tag_detail
        case: 正常
        summary: 簡易で表せない式は詳細で出す
        condition: '`tagExpr` に「画面」を含み「廃止」を含まない式を渡す'
        mock: なし
        expected: 指定方法の「詳細」が選ばれ「簡易」が無効で、タグのチェックボックスの代わりにタグの条件の詳細がある
    container: frontend/src/shared/components/filter-drawer.tsx
notes:
  単体テスト: 同じフォルダの `filter-drawer.test.tsx` に置く（knowledge の規約『フォルダ構成』）

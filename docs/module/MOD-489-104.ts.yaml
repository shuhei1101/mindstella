id: MOD-489-104
title: プレビュー / comments
lead: コメントの一覧・スレッド・レビュー中の書き込みの計算（今の画面の `screens/comments.ts`・`components/thread-row.ts` の DOM に触らない関数と同じ振る舞い）。
functions:
  - name: commentNumber
    title: コメントの ID の番号
    kind: 関数
    usecase: コメントを選んで送る
    summary: '`C-{番号}` の番号を返す。読めない ID は 0'
    args:
      - name: id
        type: string
        required: true
        description: コメントの ID
    returns:
      type: number
      description: 番号
    unit_tests:
      - name: test_comment_number
        case: 正常
        summary: 番号を返す
        condition: '`C-12`'
        mock: なし
        expected: '12'
    container: frontend/src/shared/core/comments.ts
  - name: threadTitle
    title: スレッドの題
    kind: 関数
    usecase: スレッドで話す
    summary: '`summary`、無ければ最初の書き込みの 1 行目'
    args:
      - name: thread
        type: Thread
        required: true
        description: スレッド
    returns:
      type: string
      description: 題
    unit_tests:
      - name: test_thread_title_when_no_summary
        case: 正常
        summary: 要約が無い
        condition: '`summary` が空'
        mock: なし
        expected: 最初の書き込みの 1 行目
    container: frontend/src/shared/core/comments.ts
  - name: visibleThreads
    title: 絞ったスレッド
    kind: 関数
    usecase: スレッドで話す
    summary: 状態とタグで絞り、最後の書き込みの新しい順に並べる
    args:
      - name: threads
        type: readonly Thread[]
        required: true
        description: スレッド
      - name: filter
        type: ThreadFilter
        required: true
        description: '`open`・`closed`・`all`'
      - name: tag
        type: string | null
        required: true
        description: 絞るタグ
    returns:
      type: Thread[]
      description: 絞ったスレッド
    unit_tests:
      - name: test_visible_threads
        case: 正常
        summary: 状態とタグで絞る
        condition: オープン 2 件（タグ「画面」1 件）とクローズ 1 件、`open` と「画面」
        mock: なし
        expected: タグ「画面」のオープンの 1 件
    container: frontend/src/shared/core/comments.ts
  - name: threadCounts
    title: 状態ごとの件数
    kind: 関数
    usecase: スレッドで話す
    summary: タグで絞った後の、オープン・クローズ・すべての件数
    args:
      - name: threads
        type: readonly Thread[]
        required: true
        description: スレッド
      - name: tag
        type: string | null
        required: true
        description: 絞るタグ
    returns:
      type: '{ open: number; closed: number; all: number }'
      description: 件数
    unit_tests:
      - name: test_thread_counts
        case: 正常
        summary: 件数を数える
        condition: オープン 2 件とクローズ 1 件
        mock: なし
        expected: '`{open: 2, closed: 1, all: 3}`'
    container: frontend/src/shared/core/comments.ts
  - name: pendingThreads
    title: まだ送っていない新しいスレッド
    kind: 関数
    usecase: コメントを選んで送る
    summary: レビュー中の書き込みのうち `thread` を持たないものを溜めた順に返す。状態の絞り込みが `closed` か、タグで絞っているときは空
    args:
      - name: items
        type: readonly ReviewItem[]
        required: true
        description: レビュー中の書き込み
      - name: filter
        type: ThreadFilter
        required: true
        description: 状態の絞り込み
      - name: tag
        type: string | null
        required: true
        description: 絞るタグ
    returns:
      type: ReviewItem[]
      description: まだ送っていない新しいスレッド
    unit_tests:
      - name: test_pending_threads_when_tagged
        case: 正常
        summary: タグで絞っている
        condition: 「画面」で絞る
        mock: なし
        expected: 空
    container: frontend/src/shared/core/comments.ts
  - name: isBlockedReply
    title: 送れない返信
    kind: 関数
    usecase: コメントを選んで送る
    summary: クローズのスレッドへの返信か
    args:
      - name: item
        type: ReviewItem
        required: true
        description: レビュー中の書き込み
      - name: threads
        type: readonly Thread[]
        required: true
        description: スレッド
    returns:
      type: boolean
      description: 送れないとき true
    unit_tests:
      - name: test_is_blocked_reply
        case: 正常
        summary: クローズのスレッド
        condition: クローズの TH-1 への返信
        mock: なし
        expected: 'true'
    container: frontend/src/shared/core/comments.ts
  - name: threadTimeline
    title: 書き込みと状態の記録の並び
    kind: 関数
    usecase: スレッドで話す
    summary: 書き込みと状態の記録を日時の順に並べる
    args:
      - name: thread
        type: Thread
        required: true
        description: スレッド
    returns:
      type: TimelineEntry[]
      description: '`{post}` か `{event}` の並び'
    unit_tests:
      - name: test_thread_timeline
        case: 正常
        summary: 日時の順
        condition: 書き込み 2 件の間にクローズの記録
        mock: なし
        expected: 書き込み・記録・書き込みの順
    container: frontend/src/shared/core/comments.ts
  - name: reviewLabel
    title: レビュー中の書き込みの読み上げの名前
    kind: 関数
    usecase: コメントを選んで送る
    summary: 「{スレッドの ID} への返信」「{向けた項目の ID} へのコメント」「項目を指さないコメント」
    args:
      - name: item
        type: ReviewItem
        required: true
        description: レビュー中の書き込み
    returns:
      type: string
      description: 名前
    unit_tests:
      - name: test_review_label_when_no_target
        case: 正常
        summary: 項目を指さない
        condition: '`target` も `thread` も無い'
        mock: なし
        expected: 「項目を指さないコメント」
    container: frontend/src/shared/core/comments.ts
  - name: hasUnseen
    title: スレッドの利用者の未読
    kind: 関数
    usecase: スレッドで話す
    summary: '`seen` が `false` の書き込みを持つか'
    args:
      - name: thread
        type: Thread
        required: true
        description: スレッド
    returns:
      type: boolean
      description: 未読があるとき true
    unit_tests:
      - name: test_has_unseen
        case: 正常
        summary: 未読の書き込み
        condition: '`seen: false` を 1 件持つ'
        mock: なし
        expected: 'true'
    container: frontend/src/shared/core/comments.ts
  - name: withSeen
    title: 既読にしたスレッド
    kind: 関数
    usecase: スレッドで話す
    summary: 開いたスレッドの書き込みを既読にした並びを返す（`POST /api/threads/{id}/seen` の応答を待たずに印を消す）
    args:
      - name: threads
        type: readonly Thread[]
        required: true
        description: スレッド
      - name: id
        type: string
        required: true
        description: 開いたスレッドの ID
    returns:
      type: Thread[]
      description: 既読にした並び
    unit_tests:
      - name: test_with_seen
        case: 正常
        summary: 開いたスレッドだけ既読
        condition: TH-1・TH-2 が未読で TH-1
        mock: なし
        expected: 'TH-1 だけ `seen: true`'
    container: frontend/src/shared/core/comments.ts
notes:
  単体テスト: 同じフォルダの `comments.test.ts` に置く（knowledge の規約『フォルダ構成』）

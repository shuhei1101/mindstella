id: MOD-489-109
title: プレビュー / edits
lead: 保存待ちの編集を記録に重ねる計算（今の画面の `core/edits.ts` と同じ振る舞い）。
functions:
  - name: applyEdits
    title: 編集の重ね合わせ
    kind: 関数
    usecase: 画面で項目を編集して保存する
    summary: 保存待ちの編集を記録に重ね、足す項目を ID の無い項目として差し込む
    args:
      - name: data
        type: MindmapData
        required: true
        description: 記録
      - name: edits
        type: readonly PendingEdit[]
        required: true
        description: 保存待ちの編集
    returns:
      type: MindmapData
      description: 重ねた記録
    unit_tests:
      - name: test_apply_edits
        case: 正常
        summary: キーの編集を重ねる
        condition: D-1 の `answer` の `set`
        mock: なし
        expected: D-1 の `answer` が編集の値
      - name: test_apply_edits_when_item_add
        case: 正常
        summary: 足す項目を差し込む
        condition: '`item-add` の `new-1`'
        mock: なし
        expected: '`tasks` に `new-1` の項目'
    container: frontend/src/shared/core/edits.ts
  - name: pendingMarkOf
    title: 保存待ちの印の種類
    kind: 関数
    usecase: 画面で項目を編集して保存する
    summary: 項目・キー・案の印の種類を返す
    args:
      - name: edits
        type: readonly PendingEdit[]
        required: true
        description: 保存待ちの編集
      - name: blocked
        type: readonly BlockedEdit[]
        required: true
        description: 書き込めない編集
      - name: target
        type: string
        required: true
        description: 項目の ID
      - name: key
        type: string | undefined
        required: false
        description: キー
        default: undefined
    returns:
      type: PendingMarkKind | null
      description: 印の種類
    unit_tests:
      - name: test_pending_mark_of_when_remove
        case: 正常
        summary: 削除
        condition: '`item-remove` の編集'
        mock: なし
        expected: '`remove`'
      - name: test_pending_mark_of_when_blocked
        case: 正常
        summary: 書き込めない
        condition: '`blocked` に同じ編集'
        mock: なし
        expected: '`blocked`'
    container: frontend/src/shared/core/edits.ts
notes:
  単体テスト: 同じフォルダの `edits.test.ts` に置く（knowledge の規約『フォルダ構成』）

id: MOD-489-207
title: プレビュー / 画面と部品 / markdown-body.ts
test_files:
  - tests/unit/preview/test_markdown_body.py
constants:
  - name: BODY_VIEW_LABELS
    title: 本文の見せ方の呼び名
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 表示の設定を変える
    summary: 表示の設定のチェックボックスと「この端末で変えている項目」に出す名前。`resolveDisplay` もこの名前を並べる
    value: '{fold: "セクションの折りたたみ"}'
  - name: BODY_VIEW_DEFAULT
    title: 本文の見せ方の既定
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 表示の設定を変える
    summary: 個人の上書きが無いときの本文の見せ方（折りたたみはオン）
    value: '{fold: true}'
  - name: FOLD_LEVELS
    title: 開閉を置く見出しの階層の数
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 項目の詳細を読む
    summary: 本文で使っている見出しの階層のうち、上からこの数の階層にだけ開閉を置く
    value: '2'
  - name: CODE_COPIED_MS
    title: コピーしたマーカーを出しておく時間
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 項目の詳細を読む
    summary: コードブロックのコピーのボタンを押した後、チェックのアイコンを出しておくミリ秒（図のコピーと同じ）
    value: '1400'
  - name: CALLOUT_KINDS
    title: Alert の種類
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 項目の詳細を読む
    summary: mdmark が描いた Alert の囲みの種類（クラス `markdown-alert-{種類}`）→ 見出しの頭に置くアイコン
    value: '{note: "note", tip: "star", important: "flag", warning: "alert", caution: "alert"}'
functions:
  - name: revealHeading
    title: 畳んだ見出しを開く
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 項目の詳細を読む
    kind: 関数
    scope: public
    summary: 本文の中の見出しへ移る前に、その見出しを包む畳んだ入れ物を全て開く（開閉の矢印の `aria-expanded` も合わせる）
    side_effects: '`root` の中の `div.md-section-body` の `hidden` と開閉の矢印を書き換える'
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: keyword
        description: '`decorateMarkdown` を当てた本文の要素'
      - name: slug
        type: string
        required: true
        passing: keyword
        description: 移る先の見出しの `id`（ハッシュの `h`・本文のリンク）
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_reveal_heading
        case: 正常
        summary: 畳んだ入れ物の中の見出しへ移るときは外側まで開く
        condition: 'h2「候補」とその下の h3「料金」をどちらも畳んだ本文。`parametrize`: `slug` が「料金」の下の h4 / 畳んだ入れ物の外の見出し / 存在しない `slug`'
        mock: なし（DOM を作って見る）
        expected: 両方の入れ物の `hidden` が外れ、矢印が `aria-expanded="true"` / どちらも畳んだまま / どちらも畳んだままで例外を送出しない
components:
  - name: decorateMarkdown
    title: Markdownの本文
    kind: コンポーネント
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 項目の詳細を読む
    summary: '部品設計『Markdownの本文』。`renderMarkdown` で描いた本文の要素に、次の順で見せ方を当てる（戻り値は無く、`root` の中を書き換える。表は `renderMarkdown` の `table`（部品設計の表の機能を指定するかの引数）で mdmark の表の機能のまま描き、ここでは表に見せ方を当てない）。(1) `fold` と `display.fold` がどちらも真なら、本文で使っている見出しの階層のうち上から `FOLD_LEVELS` の階層の見出しごとに、次の同じか上の階層の見出しまでを `div.md-section-body` で包み（中身の無い見出しは包まず開閉も置かない）、見出しの頭に開閉の矢印（`button.md-fold`、24px、`aria-expanded`・`aria-controls`、読み上げの名前「{見出し}を開閉」）を置く。開いた状態で描き、畳むと入れ物を `hidden="until-found"` にする（`beforematch` で開く）。見出しの文言はボタンに入れず、選んだ箇所の対応づけに使う `data-line-start` を変えない。(2) コードブロック（図と `html` のコードブロックを除く）を `div.md-code` で包み、`pre` の外に言語を書いたものだけ言語の札と、コピーのボタン（読み上げの名前「コードをコピー」）を置く。押すと `code` の文字だけをクリップボードに入れ、`CODE_COPIED_MS` の間チェックのアイコンに変えて `role="status"` で伝える。(3) mdmark が描いた Alert の囲み（`div.markdown-alert`）ごとに、見出し（`p.markdown-alert-title`）の頭に、囲みのクラス `markdown-alert-{種類}` の種類のアイコン（`CALLOUT_KINDS`）を置く。(1)〜(3) は、埋め込んだ HTML の範囲（`.mdmark-html`）の中の要素には当てない。同じ `root` に 2 回当てても包み・ボタンを重ねない'
    props:
      - name: root
        type: HTMLElement
        required: true
        description: '`renderMarkdown` で描いた本文の要素（class `mdmark`）'
      - name: display
        type: '{fold: boolean}'
        required: false
        default: BODY_VIEW_DEFAULT
        description: 表示の設定の本文の見せ方
      - name: fold
        type: boolean
        required: false
        default: 'true'
        description: 開閉を置ける本文か（本文の差分では偽）
    unit_tests:
      - name: test_decorate_markdown_when_fold
        case: 正常
        summary: 上位 2 つの階層の見出しにだけ開閉を置き、畳むと次の同じか上の階層の見出しまでを隠す
        condition: 'h2「候補」（下に h3「料金」と h4「内訳」）・h2「まとめ」・中身の無い h2「付録」を持つ本文。`parametrize`: 「料金」の矢印を押す / `fold` が偽 / `display.fold` が偽'
        mock: なし（DOM を作って見る）
        expected: 矢印は「候補」「料金」「まとめ」の 3 つで「内訳」「付録」には無い。押すと「料金」の矢印が `aria-expanded="false"` で「内訳」を含む入れ物が `hidden="until-found"`、「まとめ」は見えている / 矢印が無い / 矢印が無い
      - name: test_decorate_markdown_when_code_and_callout
        case: 正常
        summary: コードブロックに札とコピーを、Alert の囲みの見出しにアイコンを付ける
        condition: 言語 `bash` のコードブロック・言語の無いコードブロック・mdmark が描いた `[!WARNING]` の囲み（`div.markdown-alert.markdown-alert-warning` と見出し「警告」）・マーカーの無い引用を持つ本文。`bash` のコピーを押し、同じ本文に 2 回当てる
        mock: '`navigator.clipboard.writeText`'
        expected: '`bash` だけ言語の札「bash」を持ち、どちらもコピーのボタンを `pre` の外に持つ。クリップボードにはコードの文字だけが入る。`[!WARNING]` の囲みの見出しの頭に警告のアイコンが 1 つだけあり、札とコピーのボタンも 1 つずつ。マーカーの無い引用は変わらない'
      - name: test_decorate_markdown_when_tables_off
        case: 正常
        summary: '表の機能をオフで描いた本文にも、コードと Alert の見せ方を当てる'
        condition: 3 列の表・言語 `bash` のコードブロック・`[!NOTE]` の囲みを持つ本文に、`renderMarkdown` の `table` を偽で描き、`fold` を偽、`display` を `BODY_VIEW_DEFAULT` にして当てる
        mock: なし（DOM を作って見る）
        expected: 表は `.mdmark-table` に包まれず、`div.md-table-frame`・`button.md-pin` が無い。コードブロックは言語の札とコピーのボタンを持ち、囲みの見出しは補足のアイコンを持つ
      - name: test_decorate_markdown_when_table
        case: 正常
        summary: mdmark の表の機能で描いた表に見せ方を当てない
        condition: '`renderMarkdown` を `table` が真で描いた、3 列の表を持つ本文に `BODY_VIEW_DEFAULT` で当てる'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`.mdmark-table` の中の要素の属性・クラスが当てる前と同じで、`data-col-size`・`div.md-table-frame`・`button.md-pin` が無い'

        message: '引数の誤り: id: 検討事項の ID（D-）を渡してください'
    unit_tests:
      - name: test_run_edit_option
        case: 正常
        summary: 案を足して変更履歴と通し番号を付ける
        condition: '`commit` 済みの案 A だけを持つ D-1 に `add` B'
        mock: '`now`'
        expected: '`options` が A・B、`changed` が真。D-1 の `history[0].before` が `{options: [A]}` で `seq` が `last_seq`'
  - name: run_changes_since_read
    title: changes_since_read の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 前回読んだ時点からの変更を読む
    scope: public
    summary: 読んだ時点からの変更を並べ、読んだ時点を進めて書き込む
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`{had_read_point, read_seq, until_seq, added, changed}`'
    process: |-
      1. ワークスペースとまとまりを読む（`load_workspace`、`load_changes`）
      2. 変更を並べる（`changes_since`）
      3. 読んだ時点を進めた記録だけを、`changes.yaml` だけを置き換えて書く（`mark_read`、`run_commit` と同じ `_write_changes`）。項目の YAML は書かず、ワークスペースのスキーマの検証もしない（今あるスキーマ違反で止めない）
      4. 2. の結果を返す（3. で失敗したら返さずにエラーを伝える）
    unit_tests:
      - name: test_run_changes_since_read
        case: 正常
        summary: 変更を返して読んだ時点を進める
        condition: '`read_seq` 2、`last_seq` 4 で、`added_seq` 3 の T-1 を持つワークスペース'
        mock: なし
        expected: '`added` が T-1、`until_seq` が 4。`changes.yaml` の `read_seq` が 4'
      - name: test_run_changes_since_read_when_schema_mismatch
        case: 正常
        summary: ワークスペースにスキーマ違反があっても読んだ時点を進める
        condition: '`status: 完了`（検討事項に無い状態）の D-1 と、`read_seq` 2・`last_seq` 3 の `changes.yaml` を持つワークスペース'
        mock: なし
        expected: 例外にならず、`changes.yaml` の `read_seq` が 3。`decisions.yaml` が呼ぶ前と同じ
  - name: run_readme
    title: readme の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: README の書き直し
    scope: public
    summary: ワークスペースを確かめ、直下の README を今の値と配っている URL で書き直す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: previews
        type: PreviewRegistry
        required: true
        passing: injected
        description: 配信の台帳
    returns:
      type: dict[str, Any]
      description: '`{path, written, preview_url}`'
    process: |-
      1. ワークスペースを確かめる（`require_workspace`）
      2. 配っている URL を引く（`PreviewRegistry.url_of`。配っていなければ `None`）
      3. README を書く（README の書き込み。`write_readme(root, preview_url=url)`）
      4. `path` に `root / README_FILE`、`written` に書いたか、`preview_url` に引いた URL を入れて返す

  - name: run_commit
    title: commit の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: まだまとめていない変更を説明つきのまとまりにして書き込む
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: summary
        type: str
        required: true
        passing: positional
        description: '`summary`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: dict[str, Any]
      description: '`{id, at, summary, added, changed, removed}`（まとめなかったときは `id`・`at`・`summary` が `None`、`added`・`changed`・`removed` が空。`removed` はまとまりの `removed` を `{id, kind, title}` にしたもの）'
    process: |-
      1. 前後の空白を除いた `summary` が空か `SUMMARY_MAX_LENGTH` を超えれば `ArgumentError`（`summary`）を送る
      2. ワークスペースを確かめる（`require_workspace`）。まとまりを読む（`load_changes`）
      3. `pending.by` が `external` なら、先に外部の変更のまとまりにする（`flush_pending`）。その後にまとめる（`commit_pending`。`by` は `ai`）
         - 自分のまとまりが `None` の場合、外部の変更のまとまりだけを書いて（あれば）空の結果を返す
      4. 新しい記録を `records_root(root) / CHANGES_FILE` に書く（一時ファイルから `os.replace`。`OSError` は一時ファイルを消して `WriteFailedError`）
    exceptions:
      - name: ArgumentError
        condition: '`summary` が空白だけか 200 文字を超える'
        message: '引数の誤り: summary: {理由}'
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い'
        message: 'ワークスペースがありません: {パス}'
      - name: WriteFailedError
        condition: '`changes.yaml` を書けない'
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_run_commit
        case: 正常
        summary: まだまとめていない変更をまとめる
        condition: D-1 を足した直後。`summary` 「  足す 」
        mock: '`now`'
        expected: '`id` が `V-1`・`summary` が「足す」・`added` が `[D-1]`。`changes.yaml` の `pending` が空'
      - name: test_run_commit_when_external_pending
        case: 正常
        summary: 外部の変更を先に外部のまとまりにし、自分のまとまりは足さない
        condition: '`pending` が `by: external`・`changed: [D-1]`。`summary` 「a」'
        mock: '`now`'
        expected: '結果の `id` が `None`。`changes.yaml` の `sets` の先頭が `by: external`・説明「ほかのセッションの書き込み」・`changed: [D-1]` で、`pending` が空'
      - name: test_run_commit_when_summary_blank
        case: 異常
        summary: 空白だけの説明は引数の誤り
        condition: '`summary` 「   」'
        mock: なし
        expected: '`ArgumentError`（引数の名前 `summary`）'
        exception: 空白だけ

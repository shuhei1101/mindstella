id: MOD-489-176
title: サーバー / ゴール判定 / commands.py
test_files:
  - tests/unit/scripts/test_commands.py
data_models:
  - name: Staged
    title: 当てた書き換え
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    role: DTO
    summary: 書き込む前にメモリの上で当てた、種類ごとの項目・本文・まとまり
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。`stage_add`・`stage_update` が新しいものを返し、`run_edit_option` と『保存待ちの編集』の `save_edits` が最後に `BatchChange` にして書く。'
    properties:
      - name: workspace
        type: Workspace
        description: 読んだワークスペース（書き込みの前の中身。`save_batch` に渡す）
      - name: items
        type: dict[Kind, list[dict[str, Any]]]
        description: 当てた後の種類ごとの項目の並び（書き換えた種類だけでなく全て）
      - name: touched
        type: frozenset[Kind]
        description: 書き換えた種類
      - name: bodies
        type: dict[str, BodyWrite]
        description: 書く本文（ファイル名 → 本文。同じ項目を二度直すと後の本文で置き換える）
      - name: history
        type: dict[str, ItemHistory]
        description: 当てた後の `history.yaml` の行（項目の ID → 行。『変更履歴』の `ItemHistory`）
      - name: changes
        type: Changes
        description: 当てた後のまとまりの記録
      - name: removed_bodies
        type: list[str]
        description: 書き込んだ後に消す `docs/` の本文のファイル名（形式を替えた資料の前の形式の本文）。`save_batch` の `BatchChange.removed_bodies` に渡す
        default: '[]'
constants:
  - name: RESERVED_KEYS
    title: スクリプトが付けるキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`item` で渡させないキー（`body` 以外は `history.yaml` に持つキー）'
    value: ("id", "created", "updated", "updated_by", "body", "history", "history_dropped_seq", "seq", "added_seq")
  - name: BODY_INPUT_KEY
    title: 本文を渡すキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`item` で本文の Markdown を渡すキー（YAML には残さない）'
    value: '"body_markdown"'
  - name: OPTION_KEYS
    title: 案で渡せるキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 検討事項の案の編集
    summary: '`edit_option` の `option` に渡せるキー'
    value: ("content", "pros", "cons", "note", "reason", "recommended")
  - name: REF_KEYS
    title: 参照のキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: 保存待ちの編集の仮の ID（`new-{連番}`）を、振った ID に置き換える参照の場所（`related` は各要素の `to`）
    value: ("related", "sources")
  - name: HTML_BODY_INPUT_KEY
    title: HTML の本文を渡すキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`item` で資料の HTML の本文を渡すキー（YAML には残さない）'
    value: '"body_html"'
    status: implemented
    introduced:
      pr: 214
  - name: NEXT_ID_MAX_COUNT
    title: next_id の数の上限
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`next_id` の `count` の上限（『ID の採番』）'
    value: '50'
functions:
  - name: run_goal
    title: goal の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: ゴール判定
    scope: public
    summary: ゴールの判定を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`GoalReport` を `asdict` した辞書（届いたかどうかによらずツールのエラーにしない）'
    process: |-
      1. ワークスペースを読み、判定する（`load_workspace`、`judge_goal`）
      2. `asdict` して返す
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い（`load_workspace` から伝わる）'
    unit_tests:
      - name: test_run_goal
        case: 正常
        summary: 判定を出力の形にする
        condition: 未決定の D-1 だけを持つワークスペース
        mock: なし
        expected: '`reached` が偽で、`goal_phase`・`phases`・`remaining_decisions`・`remaining_deliverables` のキーがある'
  - name: validate_input_keys
    title: 渡せないキーの確認
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: ツールが付けるキーを弾く
    args:
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: 種類
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: ツールの `item`
      - name: index
        type: int
        required: true
        passing: keyword
        description: エラーの行の `items[{番号}]` に使う、その種類の並びの中の位置（足すときは末尾の位置、直すときはその項目の位置）
    process: |-
      1. `RESERVED_KEYS` のキーがあれば `SchemaMismatchError`（`item: {キー}: ツールが付けるキーです`）を送る（`body_markdown` はどの種類も渡せる）
      2. `HTML_BODY_INPUT_KEY` がある場合
         - `kind` が `doc` でなければ `SchemaMismatchError`（`{種類のファイル名}: items[{番号}].body_html: 資料だけが HTML の本文を持てる`）を送る
         - `BODY_INPUT_KEY` もあれば `SchemaMismatchError`（`{種類のファイル名}: items[{番号}].body_html: body_markdown と body_html は一緒に渡せない`）を送る
    exceptions:
      - name: SchemaMismatchError
        condition: '`RESERVED_KEYS`（`id`・`created`・`updated`・`updated_by`・`body` など）のどれかを持つ'
    unit_tests:
      - name: test_validate_input_keys
        case: 正常
        summary: 渡せるキーだけなら何もしない
        condition: '`parametrize`: `decision` に `{"title": "t", "body_markdown": "b"}` / `task` に `{"title": "t", "body_markdown": "b"}` / `note` に `{"content": "c", "body_markdown": "b"}`'
        mock: なし
        expected: 例外を送らない
      - name: test_validate_input_keys_when_reserved
        case: 異常
        summary: スクリプトが付けるキーを弾く
        condition: '`parametrize`: `id` / `created` / `updated` / `updated_by` / `body` / `history` / `history_dropped_seq`'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` にそのキー）'
        exception: スクリプトが付けるキーを持つ
      - name: test_validate_input_keys_when_html_body
        case: 異常
        summary: 資料以外の `body_html` と、本文の両方の指定を弾く
        condition: '`parametrize`: `task` に `{"title": "t", "body_html": "<p>a</p>"}`（`index` 0） / `doc` に `{"title": "t", "body_markdown": "a", "body_html": "<p>a</p>"}`（`index` 2）'
        expected: 'どちらも `SchemaMismatchError`。行が順に `tasks.yaml: items[0].body_html: 資料だけが HTML の本文を持てる` / `docs.yaml: items[2].body_html: body_markdown と body_html は一緒に渡せない`。`doc` に `body_html` だけを渡すと何も送らない'
        mock: なし
  - name: merge_changes
    title: 変更の当てはめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 渡したキーを値ごと置き換え、`null` のキーを消した新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 元の項目（書き換えない）
      - name: changes
        type: dict[str, Any]
        required: true
        passing: positional
        description: 置き換えるキーと値（`body_markdown` を除いたもの）
    returns:
      type: tuple[dict[str, Any], list[str]]
      description: 新しい項目と、値が変わった・消えたキー（渡した順）
    process: |-
      1. 元の項目を写し、渡したキーごとに当てはめる
         - 値が `None` の場合、キーがあれば消して変わったキーに加える
         - それ以外で元の値と違う場合、置き換えて変わったキーに加える（新しいキーは末尾に足す）
    unit_tests:
      - name: test_merge_changes
        case: 正常
        summary: 置き換え・消す・同じ値を見分ける
        condition: '元 `{"id": "D-1", "status": "未決定", "weight": "大", "lead": "l"}` に `{"status": "決定済み", "weight": null, "lead": "l", "answer": "a"}`'
        mock: なし
        expected: '`{"id": "D-1", "status": "決定済み", "lead": "l", "answer": "a"}` と `[status, weight, answer]`。元の項目は変わらない'
  - name: switch_adopted
    title: 採用する案の切り替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 指定した記号の案だけを採用にし、状態を `決定済み` にした新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 検討事項（書き換えない）
      - name: key
        type: str
        required: true
        passing: positional
        description: 採用する案の記号
    returns:
      type: tuple[dict[str, Any], str | None]
      description: 新しい項目と、それまで採用していた案の記号（無ければ `None`）
    process: |-
      1. `options` にその記号の案が無ければ `OptionNotFoundError`（持っている記号の一覧つき）を送る
      2. それまで `adopted` が真だった最初の案の記号を控える
      3. 指定した案の `adopted` を真、ほかを偽にし、`status` を `決定済み` にした新しい項目を返す（`answer`・案の `recommended` は変えない）
    exceptions:
      - name: OptionNotFoundError
        condition: 検討事項がその記号の案を持たない（`options` が無いときも含む）
        message: '案がありません: {key}（持っている案: {記号の一覧}）'
    unit_tests:
      - name: test_switch_adopted
        case: 正常
        summary: 採用を切り替え、前の記号を返す
        condition: 案 A（採用）・案 B を持つ項目と `B`
        mock: なし
        expected: '案 A `adopted: false`・案 B `adopted: true` の項目と `A`'
      - name: test_switch_adopted_when_none_adopted
        case: 正常
        summary: 採用が無ければ前の記号は None
        condition: どの案も採用していない項目と `A`
        mock: なし
        expected: '案 A だけ `adopted: true` の項目と `None`'
      - name: test_switch_adopted_when_option_missing
        case: 異常
        summary: 無い記号は切り替えない
        condition: 案 A・B を持つ項目と `Z`
        mock: なし
        expected: '`OptionNotFoundError`（メッセージに `Z`・`A`・`B`）'
        exception: その記号の案を持たない
      - name: test_switch_adopted_when_undecided
        case: 正常
        summary: どの状態からも決定済みにし、推奨の印は残す
        condition: '`parametrize`: 状態が `未決定` / `要見直し` / `保留` で、案 A・B を持ち B に `recommended: true` を持つ検討事項に `key: B`'
        mock: なし
        expected: '`status` が `決定済み`、案 B だけが `adopted` が真で `recommended` が真のまま。渡した項目は変わらない'
  - name: run_init
    title: init の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: ワークスペースの作成
    scope: public
    summary: ツールの `settings` でワークスペースを作る
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`settings`'
    returns:
      type: dict[str, Any]
      description: '`{workspace, files}`'
    process: |-
      1. プラグインの版を読み（`read_plugin_version`）、ワークスペースを作る（ワークスペースの作成。`create_workspace(version=str(版))`）
    unit_tests:
      - name: test_run_init
        case: 正常
        summary: 作ったワークスペースとファイルを返す
        condition: まだ無い `tmp_path / "ws"` と正しい設定の辞書
        mock: なし
        expected: '`workspace` が絶対パス、`files` が 12 件（8 つの YAML・`mindstella-version.ini`・2 つのフォルダ・`README.md`）、`mindstella-version.ini` が `plugins/mindstella/version.ini` と同じ版'
  - name: run_adopt
    title: adopt の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 検討事項の採用する案を切り替え、状態を `決定済み` にして書き込む
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 検討事項の ID
      - name: key
        type: str
        required: true
        passing: positional
        description: 案の記号
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: dict[str, Any]
      description: '`{id, adopted, previous, status, previous_status}`（`status` は `決定済み`、`previous_status` は切り替える前の状態）'
    process: |-
      1. ワークスペース・まとまり・項目の履歴を読み、項目を引く（`load_workspace`、`load_changes`、`load_item_history`、`find_item`）
         - 種類が `decision` でない場合、`ItemNotFoundError` を送る
      2. 採用を切り替え（`switch_adopted`）、履歴の行の `updated` を今の日時、`updated_by` を `EDITOR` にする
      3. 変更履歴と通し番号を `stage_update` の 3. と同じく付ける（本文は変えないので `before_body` と `after_body` は同じ。`by` は `EDITOR`）
      4. 差し替えた並び・履歴・まとまりを書き込む（`save_change`。まとまりの `pending.by` が `external` なら、先に外部の変更のまとまりにする（`flush_pending`））
      5. 変更の検知の前回の中身を書いた中身で置き換える（『変更の検知』の `accept_own_write`）
    exceptions:
      - name: ItemNotFoundError
        condition: ID が検討事項でない
        message: '検討事項がありません: {item_id}'
    unit_tests:
      - name: test_run_adopt
        case: 正常
        summary: 切り替えて書き込む
        condition: 案 A（採用）・B を持つ D-1 と `B`
        mock: '`now`'
        expected: '`{id: D-1, adopted: B, previous: A}`。`decisions.yaml` の D-1 の案 B が採用'
      - name: test_run_adopt_when_not_decision
        case: 異常
        summary: 検討事項でない ID は切り替えない
        condition: T-1 を持つワークスペースで `T-1`
        mock: なし
        expected: '`ItemNotFoundError`（メッセージに `T-1`）'
        exception: ID が検討事項でない
      - name: test_run_adopt_when_undecided
        case: 正常
        summary: 未決定の検討事項を採用で決定済みにし、前の状態を変更履歴に積む
        condition: '案 A・B を持つ未決定の D-1 を持つワークスペースに `key: B`'
        mock: なし
        expected: '戻り値が `status: 決定済み`・`previous_status: 未決定`・`previous: None`。D-1 の `history` の 1 回分の `before` が `status: 未決定` と、どの案も採用でない `options` を持つ'
  - name: run_check
    title: check の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: ワークスペースの点検
    scope: public
    summary: 点検して、問題の有無と問題の並びを返す（問題があってもツールのエラーにしない）
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`{ok, problems}`'
    process: |-
      1. ワークスペースを読み、点検する（`load_workspace`、`check_workspace`）
      2. 前の版の形式の問題（`is_legacy_problem`。`written_ids` は渡さないので、`decision_state` の問題は全て当たる）は、`detail` に続けて `（/mindstella:upgrade で今の形式に移せます）` を足す
      3. 問題が無ければ `ok: true`、あれば `ok: false` を返す
    unit_tests:
      - name: test_run_check
        case: 正常
        summary: 問題が無ければ ok
        condition: 整った D-1
        mock: なし
        expected: '`{ok: true, problems: []}`'
      - name: test_run_check_when_problems
        case: 正常
        summary: 問題があれば ok が偽
        condition: 'D-1 `related: [{to: D-9, type: depends_on}]`'
        mock: なし
        expected: '`ok: false`・`problems` が 1 件（例外を送らない）'
      - name: test_run_check_when_legacy_format
        case: 正常
        summary: 前の版の形式の問題に /mindstella:upgrade を案内する
        condition: 'A-1（`done: true`）を YAML で直接書いたワークスペース'
        mock: なし
        expected: '`ok: false`。A-1 の問題の `detail` が `（/mindstella:upgrade で今の形式に移せます）` で終わる'
      - name: test_run_check_when_decision_state
        case: 正常
        summary: 案と状態の合わない検討事項に /mindstella:upgrade を案内する
        condition: 案を持たない未決定の D-1 を直接書いたワークスペース
        mock: なし
        expected: '`ok` が偽で、`kind: decision_state`・`file: .mindstella/decisions.yaml`・`key: items[0].options` の問題の `detail` が `/mindstella:upgrade` を含む'
  - name: run_next
    title: next の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 状況の確認
    scope: public
    summary: 次の候補を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: limit
        type: int | None
        required: true
        passing: positional
        description: '`limit`'
    returns:
      type: dict[str, Any]
      description: '`{candidates}`'
    process: |-
      1. `limit` が 1 未満なら `ArgumentError`（`limit`・`1 以上を渡してください`）を送る
      2. ワークスペースを読み、候補を並べる（`load_workspace`、`list_next_candidates`）
      3. `asdict` して返す
    unit_tests:
      - name: test_run_next
        case: 正常
        summary: 候補を出力の形にする
        condition: 未決定の D-1 だけで `limit=None`
        mock: なし
        expected: '`{candidates: [{id: D-1, title, phase, weight, followers: 0}]}`'
      - name: test_run_next_when_limit_invalid
        case: 異常
        summary: 1 未満の limit は引数の誤り
        condition: '`limit=0`'
        mock: なし
        expected: '`ArgumentError`（メッセージに `limit`）'
        exception: limit が 1 未満
  - name: run_status
    title: status の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 状況の確認
    scope: public
    summary: 再開時の状況を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`StatusSummary` を `asdict` した辞書'
    process: |-
      1. ワークスペースを読み、まとめる（`load_workspace`、`summarize_status`）
      2. `asdict` して返す
    unit_tests:

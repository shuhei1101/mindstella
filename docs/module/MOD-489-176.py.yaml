      4. 書き込む（`save_batch`。履歴も書く）。`changed` は `stage_update` の `changed` が `options` を含むか
      5. 変更の検知の前回の中身を書いた中身で置き換える（`accept_own_write`）
    exceptions:
      - name: ArgumentError

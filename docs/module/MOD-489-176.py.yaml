  - name: run_next_id
    title: next_id の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 種類と数を確かめ、予約から次の ID を振って返す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: kind
        type: str
        required: true
        passing: positional
        description: '`kind`'
      - name: count
        type: int
        required: false
        default: '1'
        passing: keyword
        description: '`count`'
    returns:
      type: dict[str, list[str]]
      description: '`{ids}`'
    process: |-
      1. `kind` が `KINDS` に無ければ `ArgumentError`（`kind`）、`count` が 1〜`NEXT_ID_MAX_COUNT` でなければ `ArgumentError`（`count`）を送る
      2. ワークスペースを確かめ、その種類の項目とまとまりを読む（`require_workspace`、`read_kind_items`、`load_changes`）
      3. 予約から振る（『ID の採番』の `reserve_ids`。消した項目の記録（`removed_items`）を渡す）
    exceptions:
      - name: ArgumentError
        condition: '`kind` が決めた種類でない、または `count` が範囲の外'
        message: '引数の誤り: {引数}: {理由}'
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い'
        message: 'ワークスペースがありません: {パス}'
    unit_tests:
      - name: test_run_next_id
        case: 正常
        summary: 種類の次の ID を返す
        condition: D-1・D-2 を持つワークスペースで `kind` `decision`・`count` 2
        mock: なし
        expected: '`ids` が `[D-3, D-4]`'
      - name: test_run_next_id_when_kind_unknown
        case: 異常
        summary: 知らない種類は引数の誤り
        condition: '`kind` `thread`'
        mock: なし
        expected: '`ArgumentError`（引数の名前 `kind`）'
        exception: 決めた種類でない

    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 検討事項の案の編集
    scope: public
    summary: 検討事項の案を 1 つ足す・直す・消す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: item_id
        type: str
        required: true
        passing: positional
        description: '`id`'
      - name: action
        type: Literal['add', 'update', 'remove']
        required: true
        passing: positional
        description: '`action`'
      - name: key
        type: str
        required: true
        passing: positional
        description: '`key`'
      - name: option
        type: dict[str, Any] | None
        required: true
        passing: positional
        description: '`option`'

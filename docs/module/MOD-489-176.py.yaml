      - name: test_run_readme_when_serving
        case: 正常
        summary: 配っていればその URL を書く
        condition: 作成済みのワークスペース。偽の台帳の `url_of` が `http://127.0.0.1:1/mindstella.html` を返す
        mock: '`previews`'
        expected: '`preview_url` がその URL で、`README.md` がその URL を含む'
      - name: test_run_readme_when_user_file
        case: 正常
        summary: 利用者の README は書かず written を偽にする
        condition: 作成済みのワークスペースの `README.md` を `# 家計簿アプリの話し合い` に置き換える
        mock: '`previews`'
        expected: '`written` が偽で、`README.md` の中身が呼ぶ前と同じ'
      - name: test_run_readme_when_not_workspace
        case: 異常
        summary: ワークスペースでなければ書かない
        condition: 空の `tmp_path`
        mock: '`previews`'
        expected: '`WorkspaceNotFoundError`。`tmp_path` に `README.md` が無い'
        exception: config.yaml が無い
  - name: run_threads
    title: threads の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 送信の取り込み
    scope: public
    summary: スレッドを絞ったキーだけの一覧を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: status
        type: str | None
        required: true
        passing: positional
        description: '`status`'
      - name: tag
        type: str | None
        required: true
        passing: positional
        description: '`tag`'
      - name: unread
        type: bool
        required: true
        passing: positional
        description: '`unread`'
      - name: awaiting
        type: bool
        required: true
        passing: positional
        description: '`awaiting`'
    returns:
      type: dict[str, Any]
      description: '`{items}`'
    process: |-
      1. `status` が `None`・`open`・`closed`・`all` のどれかでなければ `ArgumentError`（`argument` は `status`）
      2. ワークスペースを読み、一覧を作る（`load_workspace`、`list_threads`）
    exceptions:
      - name: ArgumentError
        condition: '`status` が決まった値でない'
        message: '引数の誤り: status: {理由}'
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い'
      - name: SchemaMismatchError
        condition: '`threads.yaml` が崩れている'
    unit_tests:
      - name: test_run_threads
        case: 正常
        summary: 取り込み待ちのスレッドをキーだけで返す
        condition: D-1 と、取り込んでいない利用者の書き込みを持つ TH-1（D-1）と取り込み済みだけの TH-2。`awaiting=True`
        mock: なし
        expected: '`{items: [{id: TH-1, target: D-1, target_title: {D-1 のタイトル}, awaiting: 1, ...}]}` で、行に `body` のキーが無い'
      - name: test_run_threads_when_invalid_status
        case: 異常
        summary: 決まった値でない status は引数の誤り
        condition: '`status="done"`'
        mock: なし
        expected: '`ArgumentError`（`argument` が `status`）'
        exception: status が決まった値でない
  - name: run_thread
    title: thread の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: スレッドで話す
    scope: public
    summary: スレッド 1 件を返し、返した未読の書き込みを既読にする。未読が無ければ鍵を取らない
    side_effects: 未読を返したときだけ `threads.yaml` を置き換える
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: '`id`'
      - name: unread_only
        type: bool
        required: true
        passing: positional
        description: '`unread_only`'
      - name: lock
        type: Callable[[], ContextManager[None]]
        required: true
        passing: keyword
        description: 書き換えの鍵とワークスペースのロックを取る文脈を返す関数
    returns:
      type: dict[str, Any]
      description: '`{id, status, tags, summary, target, target_title, loc, posts, events}`'
    process: |-
      1. ワークスペースを確かめ、読む形と未読の ID を作る（`require_workspace`、`view_thread`）。ワークスペース全体は読み込まない
      2. 未読の ID があれば、`lock()` の中で既読にする（`mark_read`）
      3. 1 の読む形を返す（`posts[].read` は読む前の値のまま）
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い'
      - name: ThreadNotFoundError
        condition: その ID のスレッドが無い
      - name: SchemaMismatchError
        condition: '`threads.yaml` が崩れている'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_run_thread
        case: 正常
        summary: 未読を返して既読にする
        condition: 既読の TH-1-1 と未読の TH-1-2 を持つ TH-1。`unread_only=True`
        mock: '`lock`（呼ばれた回数を数える文脈）'
        expected: '`posts` が TH-1-2 だけで `read` が偽。`lock` が 1 回呼ばれ、`threads.yaml` の TH-1-2 の `read` が真で `taken` が `None` のまま'
      - name: test_run_thread_when_nothing_unread
        case: 正常
        summary: 未読が無ければ鍵を取らず書かない
        condition: '既読だけの TH-1。`parametrize`: `unread_only=True` / `False`'
        mock: '`lock`'
        expected: '`posts` が空 / 全件。どちらも `lock` が呼ばれず、`threads.yaml` の更新日時が呼ぶ前と同じ'

  - name: stage_add
    title: 追加を当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: ID・日時・通し番号・本文を付けた 1 項目を、メモリの上の並びに足す
    args:
      - name: staged
        type: Staged
        required: true
        passing: positional
        description: 今までに当てた書き換え
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: '`kind`'
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`item`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
      - name: editor
        type: str
        required: false
        default: EDITOR
        passing: keyword
        description: 編集した人（MCP のツールは既定の `ai`、まとめて保存は `user`）
    returns:
      type: tuple[Staged, dict[str, Any]]
      description: 新しい `Staged` と、`add` の結果 `{id, file, body}`
    process: |-
      1. 渡せないキーを確かめる（`validate_input_keys`。`index` はその種類の並びの長さ）。`tags` があれば `compact_tags` で主題でないタグの `main` を除く
      2. その種類の ID を 1 つ予約から振る（『ID の採番』の `reserve_ids`。`staged.items` と消した項目の記録（`removed_items`）を渡す）
      3. 通し番号を振り（`advance_seq`）、`id` を先頭に置いた項目を作り、`staged.history` にその ID の行（`created`・`updated`・`updated_by`（`editor`）・`seq`・`added_seq`）を足す
         - `body_markdown` がある場合、項目の `body` を `docs/{ID}.md` にし、本文の書き込みを足す（どの種類も）
         - `body_html` がある場合、項目の `body` を `docs/{ID}.html` にし、本文の書き込みを足す（資料だけ）
      4. まだまとめていない変更の `added` に ID を足す（`note_pending`）
      5. 末尾に足した並びと、`touched` にその種類を足した `Staged` を返す
    unit_tests:
      - name: test_stage_add
        case: 正常
        summary: 通し番号と編集した人を付けて足す
        condition: '`last_seq` 3 の記録と D-1 を持つ `Staged` に検討事項を足す'
        mock: '`now`'
        expected: 結果の `id` が D-2。`history` の D-2 の行の `seq`・`added_seq` が 4、`updated_by` が `ai`、項目は `seq`・`updated_by` を持たず、新しい記録の `last_seq` が 4 で `pending.added` に D-2。渡した `Staged` はそのまま
      - name: test_stage_add_when_note_has_body
        case: 正常
        summary: メモにも本文を付ける
        condition: '空の `Staged` に `note` の `{"title": "t", "content": "c", "body_markdown": "b"}`'
        mock: '`now`'
        expected: N-1 の `body` が `docs/N-1.md` で、`Staged` の本文の書き込みに `docs/N-1.md` → `b` がある
      - name: test_stage_add_skips_removed_id
        case: 正常
        summary: 消した ID を振らない
        condition: N-1 を持ち、記録の `pending.removed` に N-2 を持つ `Staged` にメモを足す
        mock: '`now`'
        expected: 結果の `id` が N-3
      - name: test_stage_add_when_doc_has_html_body
        case: 正常
        summary: 資料の HTML の本文を `{ID}.html` の書き込みにする
        condition: '空の `Staged` に `doc` の `{"title": "t", "kind": "モック", "status": "下書き", "body_html": "<p>a</p>"}`'
        expected: 項目の `body` が `docs/A-1.html` で `body_html` のキーを持たず、`bodies` に `docs/A-1.html` → `<p>a</p>`、結果の `body` が `.mindstella/docs/A-1.html`
        mock: なし
      - name: test_stage_add_when_user_editor
        case: 正常
        summary: 編集した人を渡すと、足した項目の `updated_by` にその人を書く
        condition: 'タスク `{"title": "画面を作る", "status": "未着手"}` を `editor="user"` で足す'
        mock: '`now`'
        expected: '`history` の T-1 の行の `updated_by` が `user`'
      - name: test_stage_add_when_main_false
        case: 正常
        summary: main が偽のタグは main を除いて書く
        condition: '空の `Staged` に検討事項 `{"title": "t", "status": "未決定", "tags": [{"name": "通知", "main": true}, {"name": "画面", "main": false}]}`'
        mock: '`now`'
        expected: 'D-1 の `tags` が `[{name: 通知, main: true}, {name: 画面}]`'
  - name: stage_update
    title: 更新を当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 1 項目のキーを置き換え、変更履歴と通し番号を付けて、メモリの上の並びを差し替える
    args:
      - name: staged
        type: Staged
        required: true
        passing: positional
        description: 今までに当てた書き換え
      - name: item_id
        type: str
        required: true
        passing: positional
        description: '`id`'
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`item`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
      - name: editor
        type: str
        required: false
        default: EDITOR
        passing: keyword
        description: 編集した人（MCP のツールは既定の `ai`、まとめて保存は `user`）
    returns:
      type: tuple[Staged, dict[str, Any]]
      description: 新しい `Staged` と、`update` の結果 `{id, file, changed}`
    process: |-
      1. `staged.items` から項目を引き、渡せないキーを確かめる（`validate_input_keys`。`index` はその項目の位置）。渡した `tags` があれば `compact_tags` で主題でないタグの `main` を除く
      2. 変更を当てはめ（`merge_changes`）、`staged.history` のその ID の行の `updated` を今の日時、`updated_by` を `editor` にする
         - `body_markdown` がある場合、`body` を `docs/{ID}.md` にし、本文の書き込みを作る（どの種類も）
         - `body_html` がある場合、`body` を `docs/{ID}.html` にし、本文の書き込みを作る（資料だけ）
         - 前の `body` があり新しい `body` と名前が違う（形式を替えた）場合、前の名前を `removed_bodies` に足す（同じ名前が `bodies` にあればそこから外す）。新しい名前が `removed_bodies` にあれば外す
         - `changed` には、`body` の名前が変わったとき `body` を、本文の中身が変わったとき渡したキー（`body_markdown` か `body_html`）を入れる
      3. 書き換える前の本文（`staged.bodies` にあればそれ、無ければ `read_body`）と比べて変更履歴の 1 回分を作る（`make_entry`。`seq` は `last_seq` + 1、`by` は `editor`）
         - 変わったものがある場合、通し番号を振り（`advance_seq`）、`staged.history` の行の `seq` をその番号にして、行に変更履歴を積む（`history_limit`、`stack_history`。`read_seq` は記録のもの）。保持する回数が 0 より大きければ、まだまとめていない変更の `changed` に ID を足す（`note_pending`）
      4. その位置を差し替えた並びと、`touched` にその種類を足した `Staged` を返す
    exceptions:
      - name: ItemNotFoundError
        condition: '`staged.items` に ID が無い'
        message: '項目がありません: {item_id}'
    unit_tests:
      - name: test_stage_update_when_limit_zero
        case: 正常
        summary: 保持する回数が 0 でも通し番号を進める
        condition: '`history_limit` 0、`last_seq` 3、D-1 に `{"answer": "a"}`'
        mock: '`now`'
        expected: D-1 の `seq` が 4 で `history` を持たず、新しい記録の `last_seq` が 4 で `pending.changed` が空
      - name: test_stage_update_when_nothing_changed
        case: 正常
        summary: 変わったものが無ければ通し番号を進めない
        condition: '`answer: a` の D-1 に `{"answer": "a"}`'
        mock: '`now`'
        expected: '`changed` が空で、記録の `last_seq` と D-1 の `seq` が呼ぶ前と同じ'
      - name: test_stage_update_sets_editor
        case: 正常
        summary: 編集した人を ai にし、変更履歴の回にも書く
        condition: '`updated_by: user` の D-1 に `{"answer": "a"}`。保持する回数は既定'
        mock: '`now`'
        expected: D-1 の `updated_by` が `ai`、`history[0].by` が `ai` で、`history[0].before` に `updated_by` が無い
      - name: test_stage_update_when_body_format_changed
        case: 正常
        summary: 形式を替えると前の形式の本文を消す書き込みにし、前の `body` を変更履歴に積む
        condition: '`body: A-1.md`（本文 `a\nb\n`）の資料 A-1 に `{"body_html": "<p>a</p>\n"}`。保持する回数は既定。続けて同じ `Staged` で `{"body_markdown": "a\n"}`'
        expected: '1 回目: A-1 の `body` が `A-1.html`、`bodies` に `A-1.html`、`removed_bodies` が `["A-1.md"]`、`changed` が `body`・`body_html`、`history` の先頭の `before.body` が `A-1.md` で `body_diff` を今の本文に当てると `a\nb\n`。2 回目: `body` が `A-1.md`、`removed_bodies` が `["A-1.html"]` で `bodies` に `A-1.html` が無い'
        mock: なし
      - name: test_stage_update_when_user_editor
        case: 正常
        summary: 編集した人を渡すと、項目と変更履歴の回にその人を書く
        condition: '`updated_by: ai` の D-1 に `{"answer": "a"}` を `editor="user"` で当てる。保持する回数は既定'
        mock: '`now`'
        expected: D-1 の `updated_by` が `user`、`history[0].by` が `user`
      - name: test_stage_update_when_main_false
        case: 正常
        summary: main が偽のタグは main を除いて置き換える
        condition: '`tags: [{name: 通知, main: true}]` の D-1 に `{"tags": [{"name": "通知", "main": false}]}`'
        mock: '`now`'
        expected: 'D-1 の `tags` が `[{name: 通知}]` で、`changed` に `tags`'
  - name: apply_option_edit
    title: 案の書き換えを当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 検討事項の案の編集
    scope: public
    summary: 検討事項の案の並びに、記号で指した 1 つの足す・直す・消すを当てた新しい並びを返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 検討事項
      - name: action
        type: Literal['add', 'update', 'remove']
        required: true
        passing: positional
        description: '`action`'
      - name: key
        type: str
        required: true
        passing: positional
        description: '`key`'
      - name: option
        type: dict[str, Any] | None
        required: true
        passing: positional
        description: '`option`'
    returns:
      type: list[dict[str, Any]]
      description: 書き換えた後の `options`（新しい並び）
    process: |-
      1. `add`・`update` で `option` が無いか、`remove` で `option` があるか、`option` が `OPTION_KEYS` に無いキーを持つなら `ArgumentError`（`option`）
      2. `add` の場合、同じ記号の案があれば `OptionExistsError`。無ければ `{key, **option}` を末尾に足す
      3. `update`・`remove` の場合、その記号の案が無ければ `OptionNotFoundError`
         - `update` はその案に `option` を当てる（値が `None` のキーは消す）
         - `remove` はその案が `adopted` なら `AdoptedOptionError`、その案が最後の案で検討事項の状態が `OPTIONS_OPTIONAL_STATUSES` に無ければ `LastOptionError`、そうでなければ抜く
      4. `add`・`update` で `option` の `recommended` が真の場合、ほかの案の `recommended` のキーを消す。偽の場合、その案の `recommended` のキーを消す（印を外した案はキーを持たない）
    exceptions:
      - name: ArgumentError
        condition: '`option` の渡し方が合わない'
        message: '引数の誤り: option: {理由}'
      - name: OptionExistsError
        condition: '`add` で同じ記号の案がある'
        message: '{ID} の案 {記号}: 同じ記号の案が既にあります'
      - name: OptionNotFoundError
        condition: '`update`・`remove` でその記号の案が無い'
        message: '{ID} の案 {記号}: その記号の案がありません'
      - name: AdoptedOptionError
        condition: '`remove` で採用している案を指した'
        message: '{ID} の案 {記号}: 採用している案は消せません。先に adopt で採用をほかの案へ移してください'
      - name: LastOptionError
        condition: '`remove` で、案を必須にする状態の検討事項の最後の案を指した'
        message: '{ID} の案 {記号}: 状態 {状態} の検討事項は案を 1 つ以上持ちます。先に add で別の案を足してください'
    unit_tests:
      - name: test_apply_option_edit
        case: 正常
        summary: 足す・直す・消すで指した案だけが変わる
        condition: '案 A（`pros`・`cons`）・B を持つ検討事項。`parametrize`: `add` C / `update` A に `{"pros": "x", "cons": null}` / `remove` B'
        mock: なし
        expected: A・B・C / A の `pros` が x で `cons` が無く B はそのまま / A だけ
      - name: test_apply_option_edit_when_rejected
        case: 異常
        summary: 記号と採用と引数の誤りを拒む
        condition: '案 A（採用）・B。`parametrize`: `add` B / `update` Z / `remove` A / `update` B に `{"adopted": true}`'
        mock: なし
        expected: '`OptionExistsError` / `OptionNotFoundError` / `AdoptedOptionError` / `ArgumentError`'
      - name: test_apply_option_edit_when_recommended
        case: 正常
        summary: 推奨の印を 1 つに付け替え、外した案はキーを持たない
        condition: '案 A（`recommended: true`）・B を持つ未決定の検討事項。`parametrize`: `update` で B に `recommended: true` / `update` で A に `recommended: false` / `add` で C に `recommended: true`'
        mock: なし
        expected: B だけが `recommended` を持つ / どの案も `recommended` を持たない / C だけが `recommended` を持つ。どれも `content` と並びは変わらない
      - name: test_apply_option_edit_when_last_option
        case: 異常
        summary: 案を必須にする状態の最後の案は消さず、必須でない状態では消せる
        condition: '案 A だけを持つ検討事項に `remove`。`parametrize`: 状態が `未決定` / `未整理`'
        mock: なし
        expected: '`LastOptionError`（メッセージに ID・`A`・`未決定`） / 空の並び'
  - name: run_edit_option

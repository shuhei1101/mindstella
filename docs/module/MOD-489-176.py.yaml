  - name: run_preview_url
    title: preview_url の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: プレビューを開く
    scope: public
    summary: ワークスペースを確かめて配信を立て（立っていればそのまま）、画面の URL を返す。初めて立てるときは `config.yaml` を検査し、立てた後に直下の README を書き直す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: previews
        type: PreviewRegistry
        required: true
        passing: injected
        description: 配信の台帳
      - name: diff
        type: str | None
        required: false
        default: None
        passing: keyword
        description: '`diff`（差分を開くまとまりの ID）'
    returns:
      type: dict[str, Any]
      description: '`{url, workspace, started}`（`diff` を渡したときは `url` の末尾に `#diff={diff}`）'
    process: |-
      1. ワークスペースを確かめる（`require_workspace`）
      2. `diff` を渡した場合、まとまりを読み（`load_changes`。`SchemaMismatchError` はそのまま上がる）、`sets` に `id` が `diff` のまとまりが無ければ `ArgumentError`（`diff`、`記録に無いまとまりです: {diff}`）を送る（台帳の `start` を呼ばない）
      3. 配信を立てるか、立っている配信を引く（`PreviewRegistry.start`。立てる前の検査の `SchemaMismatchError` はそのまま上がる）
      4. この呼び出しで立てたときだけ、直下の README をハッシュの無い URL つきで書き直す（README の書き込み。`write_readme(root, preview_url=url)`）
         - `WriteFailedError` が起きた場合、送り直さずに続ける
           - `[WARNING]` README を書けなかった（パス、理由）
      5. `diff` を渡した場合、`url` の末尾に `#diff={diff}` を付けて返す
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`config.yaml` が無い（`mindmap.yaml` だけなら移し替えの案内を持つ）'
      - name: SchemaMismatchError
        condition: まだ配っていないワークスペースの `config.yaml` がスキーマに合わない（`PreviewRegistry.start` から伝わる）。`diff` を渡したときは、`changes.yaml` がスキーマに合わないか YAML として読めない（`load_changes` から伝わる）
      - name: ArgumentError
        condition: '`diff` が `changes.yaml` の `sets` に無い'
    unit_tests:
      - name: test_run_preview_url
        case: 正常
        summary: 台帳の結果を返す
        condition: 作成済みのワークスペース。`previews` は `start` が `("http://127.0.0.1:1/mindstella.html", True)` を返す偽の台帳
        mock: '`previews`'
        expected: '`{url: http://127.0.0.1:1/mindstella.html, workspace: {絶対パス}, started: true}`'
      - name: test_run_preview_url_when_not_workspace
        case: 異常
        summary: ワークスペースでなければ配信を立てない
        condition: '`parametrize`: 空の `tmp_path` / `mindmap.yaml` だけを置いた `tmp_path`'
        mock: '`previews`'
        expected: '`WorkspaceNotFoundError`（後者は `lines` に `/mindstella:upgrade`）。`start` が呼ばれない'
        exception: config.yaml が無い
      - name: test_run_preview_url_when_started
        case: 正常
        summary: 立てたときだけ README に URL を書く
        condition: 作成済みのワークスペース。偽の台帳の `start` が 1 回目 `(url, True)`、2 回目 `(url, False)` を返す。1 回目の後に `README.md` を消して 2 回目を呼ぶ
        mock: '`previews`'
        expected: 1 回目の後、`README.md` が `url` を含む。2 回目の後、`README.md` が無いまま
      - name: test_run_preview_url_when_readme_write_fails
        case: 正常
        summary: README を書けなくても URL を返す
        condition: 作成済みのワークスペースの `README.md` を消して同じ名前のフォルダを作る。偽の台帳の `start` が `(url, True)` を返す
        mock: '`previews`'
        expected: '例外が上がらず `started: true` の結果が返る。ログに WARNING が 1 件ある'
      - name: test_run_preview_url_when_diff_given
        case: 正常
        summary: まとまりを指す URL を返し、README にはハッシュを書かない
        condition: 検討事項 D-1 を足して `commit` し、まとまり V-1 を持つワークスペース。偽の台帳の `start` が 1 回目 `(url, True)`、2 回目 `(url, False)` を返す。`diff="V-1"` で 2 回呼ぶ
        mock: '`previews`'
        expected: どちらの結果も `url` が `{url}#diff=V-1`。1 回目の後の `README.md` が `url` を含み、`#diff=` を含まない
      - name: test_run_preview_url_when_diff_not_found
        case: 異常
        summary: 記録に無いまとまりでは配信を立てない
        condition: まとまり V-1 だけを持つワークスペース。`diff="V-99"`
        mock: '`previews`'
        expected: '`ArgumentError`（メッセージが `引数の誤り: diff:` で始まり `V-99` を含む）。`start` が呼ばれない'
        exception: '`diff` が `changes.yaml` の `sets` に無い'
      - name: test_run_preview_url_when_changes_invalid
        case: 異常
        summary: changes.yaml が読めなければ配信を立てない
        condition: '`changes.yaml` を YAML として読めない中身に書き換えたワークスペース。`diff="V-1"`'
        mock: '`previews`'
        expected: '`SchemaMismatchError`（`lines` が `changes.yaml: ` で始まる行を持つ）。`start` が呼ばれない'
        exception: まだ配っていないワークスペースの `config.yaml` がスキーマに合わない（`PreviewRegistry.start` から伝わる）。`diff` を渡したときは、`changes.yaml` がスキーマに合わないか YAML として読めない（`load_changes` から伝わる）

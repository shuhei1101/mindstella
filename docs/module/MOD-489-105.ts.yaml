id: MOD-489-105
title: プレビュー / diff
lead: 差分の表示の計算（DOM に触らない）。行の比較は jsdiff、塊の分割は marked の `marked.lexer` を、呼ぶ側が読み込んで渡す。
functions:
  - name: resolveDiffPoint
    title: 時点の解決
    kind: 関数
    usecase: 前回からの差分を見る
    summary: '`pending`・`turn`（今回の差分。`changes.turn_seq` より後のまとまりとまだまとめていない変更を合わせ、変更が無くても null にしない。`sub` は `turnSub`）・まとまりの ID からマーカーを付ける項目と削除した項目を決める。まとまりの ID でない値（`since` など）は差分を出さない'
    args:
      - name: changes
        type: Changes
        required: true
        description: 記録の変更履歴
      - name: sel
        type: string | null
        required: true
        description: 選んだ時点
    returns:
      type: DiffPoint | null
      description: 時点。記録に無ければ null
    unit_tests:
      - name: test_resolve_diff_point
        case: 正常
        summary: まとまりを解決する
        condition: V-2 を持つ変更履歴と `V-2`
        mock: なし
        expected: V-2 の追加した・変えた・削除した項目
      - name: test_resolve_diff_point_when_missing
        case: 正常
        summary: 記録に無い
        condition: '`V-99`'
        mock: なし
        expected: 'null'
      - name: test_resolve_diff_point_when_pending_empty
        case: 正常
        summary: 空の pending
        condition: '`pending` と空の変更'
        mock: なし
        expected: 'null'
      - name: test_resolve_diff_point_when_not_set_id
        case: 正常
        summary: まとまりの ID でない値は差分を出さない
        condition: V-1 を持つ変更履歴と `since`
        mock: なし
        expected: 'null'
      - name: test_resolve_diff_point_when_turn
        case: 正常
        summary: 今回の差分は送信より後のまとまりとまだまとめていない変更を合わせる
        condition: '`parametrize`: まとまり V-3（`until_seq: 5`、D-3 を追加）・V-2（`until_seq: 3`、D-2 を変更）・V-1（`until_seq: 1`）、まだまとめていない変更 D-4 で `turn_seq: 3` / 同じ記録で `turn_seq: 0` / `turn_seq: 5` でまだまとめていない変更が空'
        mock: なし
        expected: '`sel` が `turn`・`name` が「今回の差分」・`fromSeq` が 3・`untilSeq` が null で、追加が D-3・D-4、変更が空 / `fromSeq` が 0 で D-2 も変更に含む / null でなく、追加・変更・削除が空'
    container: frontend/src/shared/core/diff.ts
  - name: buildVersions
    title: 前のバージョンの組み立て
    kind: 関数
    usecase: 前回からの差分を見る
    summary: 項目の `history` を当てて前のバージョンを作る（制約「前のバージョンの組み立て」）
    args:
      - name: item
        type: Item
        required: true
        description: 項目
      - name: body
        type: string
        required: true
        description: 今の本文
      - name: point
        type: DiffPoint
        required: true
        description: 時点
    returns:
      type: VersionPair
      description: 前後の値と本文
    unit_tests:
      - name: test_build_versions
        case: 正常
        summary: キーと本文を戻す
        condition: '`history` にキーと `body_diff` を持つ項目'
        mock: なし
        expected: 前の値と前の本文
      - name: test_build_versions_when_dropped
        case: 正常
        summary: 保持の回数を超えた
        condition: '`history_dropped_seq` が範囲の始まりより大きい'
        mock: なし
        expected: 前のバージョンを作れないマーカーが立つ
    container: frontend/src/shared/core/diff.ts
  - name: diffLineParts
    title: 行の差分
    kind: 関数
    usecase: 前回からの差分を見る
    summary: 前後の本文を行ごとに比べ、計算の打ち切りで null を返す
    args:
      - name: before
        type: string
        required: true
        description: 前
      - name: after
        type: string
        required: true
        description: 後
      - name: jsdiff
        type: JsDiff
        required: true
        description: 読み込んだ jsdiff
    returns:
      type: LinePart[] | null
      description: 塊の並び
    unit_tests:
      - name: test_diff_line_parts
        case: 正常
        summary: 追加した行と削除した行
        condition: 1 行を置き換えた本文
        mock: jsdiff の実物
        expected: 削除した塊と追加した塊
    container: frontend/src/shared/core/diff.ts
  - name: htmlChangedLines
    title: HTML の変わった行
    kind: 関数
    usecase: 前回からの差分を見る
    summary: HTML の本文の追加した行と変えた行を返す
    args:
      - name: before
        type: string
        required: true
        description: 前
      - name: after
        type: string
        required: true
        description: 後
      - name: jsdiff
        type: JsDiff
        required: true
        description: 読み込んだ jsdiff
    returns:
      type: HtmlChangedLines | null
      description: 行の番号
    unit_tests:
      - name: test_html_changed_lines
        case: 正常
        summary: 追加した行を返す
        condition: 1 行追加した HTML
        mock: jsdiff の実物
        expected: '`added` にその行'
    container: frontend/src/shared/core/diff.ts
  - name: removedOf
    title: 削除した項目
    kind: 関数
    usecase: 前回からの差分を見る
    summary: 時点でその種類の削除した項目を返す
    args:
      - name: point
        type: DiffPoint | null
        required: true
        description: 時点
      - name: kind
        type: Kind
        required: true
        description: 種類
    returns:
      type: RemovedItem[]
      description: 削除した項目
    unit_tests:
      - name: test_removed_of
        case: 正常
        summary: 種類で絞る
        condition: D-3 と T-1 を削除した時点と `decisions`
        mock: なし
        expected: D-3 だけ
    container: frontend/src/shared/core/diff.ts
  - name: changedKinds
    title: 変更を持つ種類
    kind: 関数
    usecase: 前回からの差分を見る
    summary: 時点の範囲で追加・変更・削除・取り下げた項目を持つ種類を返却する（インターフェース定義『プレビューを開く』の制約「タブのマーカー」。画面の組み立てがトップバーの `tabs[].marked` にする）
    args:
      - name: point
        type: DiffPoint | null
        required: true
        description: 時点。`null` なら空
    returns:
      type: Set<Kind>
      description: 変更を持つ種類（項目の ID の頭の文字で決める。取り下げは変更に含まれる）
    unit_tests:
      - name: test_changed_kinds
        case: 正常
        summary: 追加・変更・削除した項目の種類を返却する
        condition: D-1 を変え、T-2 を追加し、N-3 を削除した時点
        mock: なし
        expected: '`decisions`・`tasks`・`notes` の 3 つ。`research` を含まない'
      - name: test_changed_kinds_when_null
        case: 正常
        summary: 差分を出していなければ空
        condition: '`null`'
        mock: なし
        expected: 空の Set
    container: frontend/src/shared/core/diff.ts
  - name: unreadSetIds
    title: 未読のまとまりの ID
    kind: 関数
    usecase: 前回からの差分を見る
    summary: まとまりの ID の並びのうち、既読に無いものを並びの順で返却する
    args:
      - name: setIds
        type: readonly string[]
        required: true
        description: 記録のまとまりの ID（新しい順）
      - name: read
        type: readonly string[]
        required: true
        description: 既読のまとまりの ID
    returns:
      type: string[]
      description: 未読のまとまりの ID
    unit_tests:
      - name: test_unread_set_ids
        case: 正常
        summary: 既読に無いものだけ
        condition: '`[V-3, V-2, V-1]` と `[V-2, V-9]`'
        mock: なし
        expected: '`[V-3, V-1]`'
    container: frontend/src/shared/core/diff.ts
  - name: turnSub
    title: 今回の差分の説明
    kind: 関数
    container: frontend/src/shared/core/diff.ts
    usecase: 前回からの差分を見る
    summary: 画面設計『変更履歴.tsx』の「今回の差分」の行の説明を返す。`resolveDiffPoint` が `turn` の時点の `sub` に使う
    args:
      - name: turnAt
        type: string | null
        required: true
        description: 記録の取得の `changes.turn_at`
      - name: count
        type: number
        required: true
        description: 変わった項目の数
    returns:
      type: string
      description: '`turnAt` が null なら「送信の前のため、最初からの書き換え」、`count` が 0 なら「{JST の MM/DD HH:mm} の送信より後の書き換えはありません」、それ以外は「{JST の MM/DD HH:mm} の送信より後の書き換え」'
    unit_tests:
      - name: test_turn_sub
        case: 正常
        summary: 送信の有無と数で説明が変わる
        condition: '`parametrize`: `(2026-10-04T05:50:00+00:00, 3)` / `(2026-10-04T05:50:00+00:00, 0)` / `(null, 5)`'
        mock: なし
        expected: '`10/04 14:50 の送信より後の書き換え` / `10/04 14:50 の送信より後の書き換えはありません` / `送信の前のため、最初からの書き換え`'
  - name: unreadChangedIds
    title: 未読の変更がある項目
    kind: 関数
    container: frontend/src/shared/core/diff.ts
    usecase: 項目を表で絞り込む
    summary: 未読のまとまりで追加・変更された項目の ID を返す（その範囲で削除した項目は除く）。一覧の「変更」の条件に使う
    args:
      - name: changes
        type: Changes
        required: true
        description: 記録の変更履歴
      - name: unread
        type: readonly string[]
        required: true
        description: 未読のまとまりの ID（『既読のまとまり』の `useUnreadSetIds`）
    returns:
      type: Set<string>
      description: 項目の ID
    unit_tests:
      - name: test_unread_changed_ids
        case: 正常
        summary: 未読のまとまりの追加と変更だけ
        condition: V-2（D-2 を追加・D-5 を削除）・V-1（D-1 を変更）で、未読が `[V-2]`
        mock: なし
        expected: '`{D-2}`'
notes:
  単体テスト: 同じフォルダの `diff.test.ts` に置く（knowledge の規約『フォルダ構成』）

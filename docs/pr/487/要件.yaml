  - item: v0.3.0 より後の配布物（図を mdmark の部品にする Schema・シーケンス図のデータ化）への追従
    reason: 追従するバージョンの範囲が v0.2.0..v0.3.0 で、後のバージョンは別の Issue がこの Issue を依存に持つ
    plan: '#408'
  - item: dev/ を廃止して文書を docs/ の種類のフォルダへ移し、Pages を mdmark で描く配信に切り替える
    reason: 配布元の v0.3.0 より後の変更で、別の Issue がこの Issue を依存に持つ
    plan: '#413'
  - item: 既存の文書を表し方の優先順位（図 → 表 → 箇条書き → 文）に移行する
    reason: knowledge の規約への追従で、AI Monitor v0.3.0 の配布物の変更ではない
    plan: '#407'
  - item: v0.3.0 の設計書の検証・publish と dev-docs.yaml の目次の paths（docs/**/index.yaml）が、docs/pr/{PR 番号}/反映作業/index.yaml を目次として扱い、items・summary が無い誤りを出す（publish は README.md も生成する）
    reason: PR ドキュメントを docs/pr/ に置く今の構成と v0.3.0 の検証器の前提（dev/pr/）の食い違いで、文書を docs/ の種類のフォルダへ移す作業で dev-docs.yaml の paths と検証器のバージョンが変わる
    plan: '#413'

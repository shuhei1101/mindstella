scope_out:
  - item: 項目の ID・スレッドの ID（書き込みの ID を含む）以外の ID（書き換えのまとまりの ID など）の自動のリンク
    reason: '要望は項目の ID とスレッドの ID だけを挙げている。まとまりのリンク（linkChangeSets）は # で始まるリンクの記法を持ち、プレーンテキストの自動のリンクとは別の仕組み'
    plan: none
  - item: 記録の文字でない画面の文言（ボタンのラベル・見出し・空の表示など、コードに書いた文字）の ID のリンク
    reason: 要望は記録の文字を表示する場所が対象。画面の文言は記録の ID を持たない
    plan: none

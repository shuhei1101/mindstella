Webhookの設定のファイルの指定:
  説明: 常駐サーバー（systemd --user のユニット mindstella.service）の drop-in `~/.config/systemd/user/mindstella.service.d/discord-webhook.conf` に、環境変数 MINDSTELLA_DISCORD_WEBHOOK_FILE（利用者が用意した Webhook の設定のファイル /home/shuhei2441/.config/web-hook/mindstella.ini の場所）を書き、常駐サーバーを起動し直す。ユニット本体は起動のたびに書き直されるが、drop-in はその外にあるため残る。ファイルの中身（Webhook の URL）は、スクリプト・ログ・リポジトリに記載しない
  タグ: [設定, 再起動]
  実行者: tester
  時期: master へ入った後
  回数: 1 回限り
  起動し直す対象: mindstella.service
  可逆: true
  疎通確認: Webhookの設定のファイルの指定/疎通確認.sh
  実行: Webhookの設定のファイルの指定/実行.sh
  確認: Webhookの設定のファイルの指定/確認.sh
  切り戻し: Webhookの設定のファイルの指定/切り戻し.sh
  失敗時: 既定の対処を 1 回、2 回連続で失敗したら依頼元へ返却する
  確認方法: '`systemctl --user show mindstella.service -p Environment` に MINDSTELLA_DISCORD_WEBHOOK_FILE=/home/shuhei2441/.config/web-hook/mindstella.ini があり、`http://127.0.0.1:8784/_admin/status` が 200 を返す。MindStella のセッションが書き込んだ応答の終了後に、常駐サーバーのログに通知の送信が成功した行（URL を含まない）が出る'
  状態: "-"

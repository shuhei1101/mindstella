use_cases:
  - kind: single
    scenario: docs/scenario/SC-531-2.yaml
    impact: following
    detail: MindStella のセッションが止まったときに、止まった理由の知らせが Discord に届くことを追記する（新しい単一ユースケース『作業の完了と停止を通知する』に追随）
    depends_on:
      - docs/scenario/SC-568-1.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: none
    detail: commit の説明を通知に載せるが、外部の変更のまとまりの自動の commit は通知しないため、履歴の残し方は変わらない
    depends_on: []

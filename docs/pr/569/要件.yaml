scope_out:
  - item: AI の書き込みを commit までステージングする
    reason: '#157 で見送った範囲。通常のセッションが project-index で書き込む構成と合わない'
    plan: none
  - item: Slack・OS の通知
    reason: 要望は Discord だけ。要ると分かったときに追加する（Issue の見送った案）
    plan: none
  - item: 通常の Claude Code のセッション（MindStella のセッションでない）の作業の通知
    reason: 要望は MindStella のセッションだけ。応答の終わりは MindStella のセッションのフックだけが常駐サーバーへ送る
    plan: none
  - item: MindStella のセッションが止まったとき（エラー・利用上限・無操作の上限・停止の依頼）の通知
    reason: '利用者の判断で、まずは作業が完了したときの通知だけにする（PR #569 の確認事項）。#520・#521 の停止からの呼び出しも、止まったときの通知を作るときに扱う'
    plan: to_file
  - item: 通知にスレッドの要約・commit の説明を記載する
    reason: '利用者の判断で、通知にはワークスペースの名前・作業が完了したこと・プレビューの URL だけを記載する（PR #569 の確認事項）'
    plan: none

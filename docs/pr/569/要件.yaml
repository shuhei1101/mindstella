scope_out:
  - item: 利用上限で止まったときの通知の呼び出し
    reason: '利用上限での停止の検知は #520 が作る。この PR は通知の仕組みを作り、#520 がそれを呼ぶ（計画の判断）。利用上限で止まった応答は StopFailure の通知で届くため、#520 は同じ停止の通知を重ねて送信しない'
    plan: '#520'
  - item: 無操作の上限で止まったときの通知の呼び出し
    reason: '無操作の上限での停止は #521 が作る。この PR は通知の仕組みを作り、#521 がそれを呼ぶ（計画の判断）'
    plan: '#521'
  - item: AI の書き込みを commit までステージングする
    reason: '#157 で見送った範囲。通常のセッションが project-index で書き込む構成と合わない'
    plan: none
  - item: Slack・OS の通知
    reason: 要望は Discord だけ。要ると分かったときに追加する（Issue の見送った案）
    plan: none
  - item: 通常の Claude Code のセッション（MindStella のセッションでない）の作業の通知
    reason: 要望は MindStella のセッションだけ。応答の終わりは MindStella のセッションのフックだけが常駐サーバーへ送る
    plan: none

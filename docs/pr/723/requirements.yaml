scope_out:
  - item: 変更履歴に、利用者の最後の書き込みより後に AI が書き換えた内容を 1 つの差分にする「今回の差分」を追加する
    reason: 束の子に含まれない要望。#156 で「前回開いてから」をやめて時系列にするので、#693 は本文の関連のとおり先に入ったこの作業 PR の変更履歴に合わせて対応する
    plan: '#693'
  - item: トップバーのボタンをアイコンだけの表示にする
    reason: 束の子に含まれない要望。変更履歴のボタンの未読の件数はこの作業 PR で追加し、#573 がそれを含めてアイコンと件数の表示にする
    plan: '#573'
  - item: 過去の差分を見ている間の変更履歴のボタンの色
    reason: 束の子に含まれない要望
    plan: '#184'
  - item: 変更があった項目だけを表示する絞り込み
    reason: '束の子に含まれない要望。#158 は #156 を依存に持ち、この作業 PR の後に着手する'
    plan: '#158'
  - item: 案のカードの記号・推奨・採用の見せ方
    reason: 束の子に含まれない要望。この作業 PR は案のカードに押す操作と利用者が選んだ状態を追加するだけで、記号のアイコン・推奨と採用のバッジは変えない
    plan: '#161'
  - item: 複数の検討事項にまとめて回答し、誰が決めたかを持たせる
    reason: 束の子に含まれない要望。この作業 PR は 1 件の検討事項の詳細で案を選ぶ操作を持つ
    plan: '#484'
  - item: レビュー中の書き込みの行の「修正」「削除」のアイコンのボタンが、axe の target-size（押す領域 24px・十分な間隔）に当たる
    reason: 作業前からある既存の部品の大きさで、束の子の要望に含まれない（実装した画面の撮影の detect_screen_issues で、長い場面の幅 1280 のレビュー中の書き込みで検出）
    plan: 未起票
  - item: 部品『Markdownの本文』のストーリー DiffSource の結合テスト `test_diff_source` が、原文の差分のリビジョンの欄（`.mdmark-diff-picker`）を見つけられずに落ちる
    reason: 作業前からある不具合で、develop の時点のストーリーでも同じく落ちる（この作業 PR は差分の表示の本文の描き方を変えていない）
    plan: 未起票

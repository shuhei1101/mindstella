use_cases:
  - kind: composite
    scenario: docs/scenario/SC-489-50.yaml
    impact: changed
    detail: 変更履歴の時点の選び方が「最新」から始まる時系列の一覧になり、まだ開いていない変更に未読のマーカーが付く。差分の表示の間は変更があった画面のタブにマーカーが付く
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: changed
    detail: 利用者が検討事項の案を画面で選んで回答し、MindStella のセッションが選ばれた検討事項を拾って採用まで済ませる流れが加わる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-18.yaml
    impact: changed
    detail: 変更履歴を時系列の一覧にし（「差分を出さない今の内容」を「最新」にし、「前回開いてから」をやめる）、未読のマーカー・すべて既読にする・ヘッダーの未読の件数を出す。差分の表示の間は変更があった画面のタブにマーカーを付け、トップバーの差分の表示をやめるボタンを無くす
    depends_on:
      - docs/scenario/SC-489-50.yaml
  - kind: single
    scenario: docs/scenario/SC-489-12.yaml
    impact: changed
    detail: AI が記録をまとめたら、開いている画面の変更履歴に反映して未読の件数を増やす
    depends_on:
      - docs/scenario/SC-489-18.yaml
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: changed
    detail: 検討事項の詳細の案のカードを押して案を選び、一言を添え、選び直し・取り消しができる。資料を開いていても画面の全体はスクロールしない
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-21.yaml
    impact: changed
    detail: MindStella のセッションが利用者の選んだ案を拾い、採用と理由の記録を済ませてから利用者の選択を片付ける
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-26.yaml
    impact: changed
    detail: 起動と再開で、利用者が案を選んだ検討事項があることを知らせて取り込みへ進む
    depends_on:
      - docs/scenario/SC-489-21.yaml
  - kind: single
    scenario: docs/scenario/SC-489-43.yaml
    impact: changed
    detail: 利用者が案の選択をまとめて送信するとコメントと同じく通知が入力され、取り込みで選ばれた検討事項を取得して一言を理由に反映する
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: changed
    detail: スレッドの書き込みの並びをカードの中のカードに見せない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-587-1.yaml
    impact: changed
    detail: 資料に埋め込んだ音声の再生バーを見切れずに全体を表示する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: run_only
    detail: 変更の記録の連番を未読の数え方に使うため、記録の書き込みを壊さないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-3.yaml
    impact: changed
    detail: 確定した案の選択をレビュー中に溜め、まとめて送信したときに MindStella のセッションへ 1 回だけ通知する
    depends_on:
      - docs/scenario/SC-489-52.yaml

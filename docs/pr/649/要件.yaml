scope_out:
  - item: プリセットを画面の一覧の上に並べて押すだけで開くこと、0 件に当たるプリセットの一覧の印、タグの式と状態・種類など今の絞り込みの組み合わせ
    reason: '#360 の本文で #361 へ分けた範囲'
    plan: '#361'
  - item: 画面の今の絞り込みをプリセットとして保存すること
    reason: '#360 の本文で #362 へ分けた範囲'
    plan: '#362'
  - item: 詳細パネルの戻る・進むで、一覧・ボード・マップから開いた項目の順をたどること
    reason: '#452 の要望に含まれない（スクロール位置以外の履歴のたどり方）'
    plan: '#148'
  - item: 本文を項目を開いたときに取得して最初の応答を減らすこと、ワークスペースを Linux 側のファイルシステムへ移すこと
    reason: '#547 の「見送った案」。本文の取得は、記録の保持・圧縮・ETag の後に要るかを判断すると本文が定めている'
    plan: none
  - item: 資料を開くたびの画面での全記録の再計算・再描画
    reason: 画面の描画の重さで、サーバーの記録の取得（#547）とは別の事象
    plan: '#627'
  - item: 画面の初期化が外部スクリプトの読み込みを待つこと
    reason: '#547 が関係として挙げる別の事象'
    plan: '#548'

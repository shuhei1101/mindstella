use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-49.yaml
    impact: changed
    detail: 絞り込みでタグを AND と OR のどちらで絞るかを選べる（既定は AND）。表のタグを押すとそのタグが絞り込みに加わる。ほかの画面へ移って戻ったとき、離れたときの表のスクロール位置から表示する（#187・#452）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-6.yaml
    impact: following
    detail: ボードのカードのタグを押すと、カードの詳細を開かずにそのタグが絞り込みに加わる（#187）
    depends_on:
      - docs/scenario/SC-489-49.yaml
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: changed
    detail: 詳細パネルのタグを押すとそのタグが絞り込みに加わる。関係する項目へ移ってブラウザの戻る・進むで戻ったとき、一覧と詳細パネルのスクロール位置から表示する（#187・#452）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-12.yaml
    impact: changed
    detail: Windows 側のドライブのワークスペースでも画面が短い時間で開き、記録が変わっていないときは読み直さない。画面の一時的な状態（絞り込み・開いているタブなど）を knowledge の決まりの保持先に持ち、再読み込み・戻るで戻す（#547・#452）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-649-1.yaml
    impact: new
    detail: AI が、利用者の見やすい単位でタグの式（AND・OR・NOT の入れ子）の絞り込みのプリセットを名前・説明・並び順つきで作成・更新・削除し、当たる項目の件数を確かめる（#360）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-16.yaml
    impact: changed
    detail: 保存したタグがどの記録にも付いていない（0 件に当たる）プリセットを警告する（#360）
    depends_on:
      - docs/scenario/SC-649-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-11.yaml
    impact: following
    detail: 配る書き出しにプリセットと当たる件数が載る（#360）
    depends_on:
      - docs/scenario/SC-649-1.yaml

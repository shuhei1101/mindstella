    plan: '#707'
  - item: 差分の表示の間のタブの変更のマーク・資料を開くと画面の全体がスクロールする件・トップバーの「差分の表示をやめる」のボタン
    reason: 要望に含まれない。縦のスクロールの件で、#706 の本文が関連として分けている
    plan: '#692'

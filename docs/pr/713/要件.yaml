use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: changed
    detail: コメントの一覧のパネルの右端の区切りをドラッグ・キーで動かして幅を変え、スレッドの一覧・スレッド 1 件で同じ幅のまま読み書きする。開き直しても変えた幅で出る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-3.yaml
    impact: following
    detail: レビュー中の書き込みの画面もコメントの一覧と同じ幅で出し、長い書き込みでも横にスクロールしない
    depends_on:
      - docs/scenario/SC-489-5.yaml
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: run_only
    detail: 詳細パネルの幅の区切りを共通の部品へ移し、資料の広い表は表の中だけで横にスクロールさせるため、詳細を読む手順が壊れないかを確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-43.yaml
    impact: changed
    detail: 手番を返す前に、回答なしで進められる進め方の工程を進め、タスクを保留・完了・中止にしたかを確認してから手番を返す。未着手・進行中のタスクが残っていると手番を返せない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-30.yaml
    impact: changed
    detail: 手番の終了時にタスクを保留（着手できる条件つき）・完了・中止のどれかにする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-26.yaml
    impact: following
    detail: 起動と再開の注入文に手番を返す条件が入ることに追随する
    depends_on:
      - docs/scenario/SC-489-43.yaml
  - kind: single
    scenario: docs/scenario/SC-568-1.yaml
    impact: following
    detail: タスクが残っていて手番を返せなかったときは作業の完了を通知しない
    depends_on:
      - docs/scenario/SC-489-43.yaml

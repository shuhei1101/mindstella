scope_out:
  - item: 本文の差分（インライン・左右に並べる・HTML の本文の差分）を MindStella の実装から mdmark の差分の機能へ寄せること
    reason: '利用者が挙げた差分の見た目（削除した行の打ち消し線・変わった所だけ濃い色）は mdmark の差分の機能のもので、今の画面は MindStella の差分の実装で描いている。実装の入れ替えは #347 が持つ。この PR は mdmark が描いた部品への CSS の上書きを取り除く範囲に留める。含めるかは設計のレビューで確定する'
    plan: '#347'
  - item: 部品のコピーのボタンの文言の付け替え（`relabelParamCopy`）
    reason: 'CSS ではなく文言の付け替えで、mdmark の設定へ移す作業は #351 が持つ'
    plan: '#351'
  - item: '`docs/mock/` のモックが読む、版を固定した mdmark の URL'
    reason: モックは作った時点の見た目を残す資料で、設定の `latest` を読まない
    plan: none
  - item: 本文の表の見出し行を、本文の区画を縦にスクロールしても区画の上端に留めること
    reason: mdmark の `mount` で描いた表は見出し行を留めず、スクロールする区画の中で留める位置もブラウザで変わる（shuhei1101/mdmark#683）。画面の CSS で mdmark を上書きしない方針のため、mdmark の対応を待ち、対応後に制約「本文の表とセクションの見せ方」の「留めない」を外す。この PR を mdmark の対応の待ちにするかは、承認確認でユーザーに確認する
    plan: to_file
  - item: 今の画面の Storybook が React の SPA のバンドルを module でない script として読み込み、全てのストーリーで `import.meta` のエラーが出ること
    reason: '`.storybook/main.js` の `componentScripts()` の既存の不具合で、PR #591 の変更の前から出ている。今回の要望（mdmark の最新を読み込む・mdmark の部品を上書きしない）に含まれない'
    plan: '#598'
  - item: thread-post の `MarkdownPost` ストーリーの本文の画像に代替テキストが無く、axe の `image-alt` が出ること
    reason: 'ストーリーの既存の不備で、今回の thread-post の変更（`table: false` の指定）と関係しない。今回の要望に含まれない'
    plan: '#599'
  - item: 埋め込んだ HTML のチャートの結合テスト 3 件（`test_embedded_html_in_full`・`test_normal_when_embedded_html`・`test_embedded_chart`）が、mdmark の図の右上のパネルの変更に追従しておらず fail すること
    reason: 'mdmark の図のパネルの変更（shuhei1101/mdmark#659）にテストが追従していない既存の不具合。develop（`044bbcb1`）の画面も設定の latest を jsDelivr の `gh/shuhei1101/mdmark@develop` で読み込んで #659 のパネルを描き、3 件とも同じ箇所で fail する（`テスト結果/20261119175809_044bbcb1_結合テスト.log`）。今回の要望（mdmark の最新を読み込む・mdmark の部品を上書きしない）に含まれない'
    plan: '#610'
  - item: 詳細パネルの差分のミニマップで印の無い所を押す結合テスト（`test_diff_minimap_when_empty_area_pressed`）が、押した位置まで本文が送られずに fail すること
    reason: develop でも同じ値（223.75、期待 424 ± 2）で fail する既存の不具合で、#553 が develop（`1013853b`）での fail を記録している。develop（`044bbcb1`）で流した出力は `テスト結果/20261119175809_044bbcb1_結合テスト.log`。今回の変更（本文の表・mdmark の ref）と関係しない。今回の要望に含まれない
    plan: '#553'

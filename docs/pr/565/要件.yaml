scope_out:
  - item: 記録の種類ごとの使い方のガイド（検討事項・タスク・調査・資料・用語集・メモ・会話ログ・スレッド。D-502）
    reason: 'ガイドの資料（話し合いの作業 T-67）が未作成で、#518 に含めると資料が揃うまで #565 をマージできないため、task-planner が別の Issue に分けた'
    plan: '#566'
  - item: 常駐サーバーの起動のときにプラグインの配信元のパスを確認して登録し直す
    reason: A-107 の No 10 の範囲
    plan: '#525'
  - item: MindStella のセッションの自動の起動し直し（PreCompact で止めて起動し直す契機を含む）
    reason: A-107 の No 5 の範囲。この PR は起動し直した後に起動と再開のエージェントフローを進める注入だけを持つ
    plan: '#520'
  - item: ワークスペースの設定の書き換えの API（PATCH /workspaces/{id}）へ update_settings をまとめる
    reason: A-107 の No 9 の範囲。この PR は update_settings から削除するキーを除くだけ
    plan: '#524'
  - item: 今の画面（/mindstella.html）の廃止
    reason: 要望に含まれない。この PR は今の画面と React の画面の両方から削除するキーを除く
    plan: none

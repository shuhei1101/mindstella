use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: changed
    detail: 一覧・ボードから開いた項目も戻る・進むでたどり、タブの切り替えは履歴に追加しない。元の画面の並びで前後の項目へ移る。値の欄の項目の ID から資料を開く
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-49.yaml
    impact: changed
    detail: 表を作成日時・更新日時の列で並べ替える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-40.yaml
    impact: changed
    detail: 資料のカードに作成日時・更新日時が出て、それで並べ替える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-6.yaml
    impact: changed
    detail: タスクのカードに作成日時・更新日時が出て、それで並べ替える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: changed
    detail: スレッドを開くと最新の書き込みから読め、最新以外の長い書き込みは折りたたまれ、スクロールすると見出しのタイトルが 1 行になる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-3.yaml
    impact: run_only
    detail: レビュー中の書き込みの行のラベルが長い値でも折り返されないことを確認する
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-489-50.yaml
    impact: following
    detail: 変わった項目の詳細を開いて読み返す流れが、戻る・進むと前後の項目の変更に追随する
    depends_on:
      - docs/scenario/SC-489-46.yaml

scope_out:
  - item: 戻る・進むで戻ったときの一覧と詳細パネルのスクロールの位置の復元（#148 のタイトルの「スクロールの位置も戻す」）
    reason: '計画の行の判断で #452 が受け持つと決めた（詳細パネルだけを別の仕組みで戻すと #452 で作り替えになる）'
    plan: '#452'
  - item: タイトル・一覧の行・ツールチップの中の項目の ID のリンク（#688 のやりたいことの「画面のどこに記載していても」のうち、値の欄の外）
    reason: 押すと詳細を開く行・カードの中にリンクを入れると操作が重なるため、範囲を値の欄だけにした（単一ユースケース設計で確定。着手した planner が範囲を決めるとされている）
    plan: none
  - item: 検討事項の案のカードを押して案を選ぶ操作と、カードの中の ID のリンクの当たりの調整
    reason: '案のカードを押す操作は #363 の要望で、この束には含まない'
    plan: '#363'
  - item: スレッドの見出しの上のクローズ・オープンを、理由を聞かずに切り替える操作
    reason: '#377 の要望で、この束には含まない'
    plan: '#377'

use_cases:
  - kind: single
    scenario: docs/scenario/SC-582-1.yaml
    impact: changed
    detail: 使用中のアカウントの利用枠がしきい値以上になったら、利用上限のエラーを待たずに、応答の終わりを待って止め、別のアカウントで前の会話を引き継いで起動し直す契機を追加する。空いたアカウントが無いときは今のアカウントで続ける
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-570-1.yaml
    impact: following
    detail: しきい値での切り替えで止めたときの、止まった理由の通知に追随する
    depends_on:
      - docs/scenario/SC-582-1.yaml
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: none
    detail: 止まった後に別のアカウントで話し合いを続ける流れは変わらない
    depends_on: []

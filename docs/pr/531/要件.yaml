use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-20.yaml
    impact: changed
    detail: 常駐サーバーを端末に 1 つ、systemd --user で起動・停止する。プラグインのコードが更新されたのに常駐サーバーが古いコードのまま動いているとき、利用者が気づけて再起動できる（D-480）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-531-1.yaml
    impact: new
    detail: 外部のアプリがフォルダ・進め方の文書・追加の MCP・プラグインを指定してワークスペースを作り、MindStella のセッションを作って、画面の URL と MindStella のセッションの ID を受け取る（A-115）
    depends_on:
      - docs/scenario/SC-489-20.yaml
  - kind: single
    scenario: docs/scenario/SC-531-2.yaml
    impact: new
    detail: 外部のアプリが MindStella のセッションを止め、最後の書き込みが終わってから止まったことを確かめて、ワークスペースをクローズにする（A-116）
    depends_on:
      - docs/scenario/SC-531-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-41.yaml
    impact: changed
    detail: 端末の起動のコマンドが、外部のアプリと同じ MindStella の API でワークスペース（進め方の文書・追加の MCP・プラグインを指定）と MindStella のセッションを作る
    depends_on:
      - docs/scenario/SC-531-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-14.yaml
    impact: changed
    detail: ワークスペースを、スキルのツールではなく MindStella の API の作成で、許可するフォルダの下だけに作り、配信元に登録する
    depends_on:
      - docs/scenario/SC-531-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-2.yaml
    impact: changed
    detail: README の起動のコマンドの一覧に、起動のコマンドの引数（進め方の文書・追加の MCP・プラグイン）を加える
    depends_on:
      - docs/scenario/SC-489-41.yaml
  - kind: single
    scenario: docs/scenario/SC-489-37.yaml
    impact: following
    detail: '新しいワークスペースを作る段を、MindStella の API の作成に合わせる（セットアップのスキルの削除は #518）'
    depends_on:
      - docs/scenario/SC-489-14.yaml
  - kind: single
    scenario: docs/scenario/SC-489-12.yaml
    impact: following
    detail: ワークスペースの作成と MindStella のセッションの作成が返す画面の URL で開けることに合わせる
    depends_on:
      - docs/scenario/SC-531-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-9.yaml
    impact: run_only
    detail: プラグインのフックの定義が増えるので、利用者の入れ方でインストールして起動できることを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-42.yaml
    impact: following
    detail: 登録した alias が、題名を変えた『端末から起動する』の起動のコマンドを呼ぶことに合わせる。MindStella のセッションのアカウントは claude-balancer が選ぶので、アカウントごとの alias の扱いはインターフェース定義設計で決める
    depends_on:
      - docs/scenario/SC-489-41.yaml
  - kind: single
    scenario: docs/scenario/SC-489-10.yaml
    impact: run_only
    detail: 許可するホスト名からの画面の閲覧とコメントの送信が、MindStella の API を加えた後も通ることを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: following
    detail: 話し合いの始まりを、起動のコマンドが MindStella の API でワークスペースと MindStella のセッションを作る流れに合わせる
    depends_on:
      - docs/scenario/SC-489-41.yaml
      - docs/scenario/SC-489-14.yaml

scope_out:
  - item: 記録の検索と書き込みの project-index への移行、変更の検知のフォルダの監視、採番のツール（A-107 の No 2）
    reason: '親 #481 の分割で別の子にした。停止のときのまとめていない変更の commit は、今の commit・pending の仕組みで行う'
    plan: '#517'
  - item: 起動と再開・コメントの取り込み・記録の使い分けのエージェントフローと、setup・session・upgrade のスキル・プレイブック・削除する機能の削除（A-107 の No 3）
    reason: '親 #481 の分割で別の子にした。SessionStart のフックが注入する「起動と再開のエージェントフローを先に進める指示」もエージェントフローの中身と一緒にこちらへ回すと判断した。#516 は進め方の文書の場所を環境変数で渡し、注入するところまで。判断が分かれるためレビューで確定する'
    plan: '#518'
  - item: MindStella のセッションの自動の起動し直し（コメント・落ちた・利用の上限・PreCompact）、状態のフォルダに追加の MCP・プラグインの記録が無いときの警告と画面の通知、画面の起動のボタン（A-107 の No 5。A-115 の「追加の MCP・プラグインの記録が無いワークスペース」のシナリオ）
    reason: '親 #481 の分割で別の子にした。#516 では作成で必ず記録を作るので、記録が無い場合は生じない'
    plan: '#520'
  - item: 無操作の上限での停止（A-107 の No 6）
    reason: '親 #481 の分割で別の子にした'
    plan: '#521'
  - item: ワークスペースの状態の取得（GET /workspaces/{id}。A-126）
    reason: '親 #481 の分割で別の子にした。停止の完了の確認に使う MindStella のセッションの一覧（GET /workspaces/{id}/sessions）は #516 に含める'
    plan: '#522'
  - item: ワークスペースの開き直しと削除（POST /workspaces/{id}/reopen・DELETE /workspaces/{id}。A-107 の No 8）
    reason: '親 #481 の分割で別の子にした。クローズしたフォルダへのワークスペースの作成で配信元の行を戻す処理は #516 に含める'
    plan: '#523'
  - item: ワークスペースの設定の書き換え（PATCH /workspaces/{id}）と MindStella のセッションの起動し直し（restart。A-107 の No 9）
    reason: '親 #481 の分割で別の子にした'
    plan: '#524'
  - item: 常駐サーバーの起動時の状態の照合、ワークスペースの ID の一覧の作り直し、プラグインの配信元のパスの確認（A-107 の No 10）
    reason: '親 #481 の分割で別の子にした。プラグインのコードが更新されたときに古い常駐サーバーに気づけて再起動できること（D-480）は #516 に含める'
    plan: '#525'
  - item: 全てのワークスペースの画面を常駐サーバーの 1 つのポートで配る作りへの切り替え（A-119 の画面の配信）
    reason: '今はワークスペースごとに空きポートで配り、画面は `/api/...` を絶対のパスで呼ぶ。切り替えると画面（frontend・プレビュー）の全ての呼び出しが変わり、#516 の範囲（scope: に frontend が無い）を超える。#516 では、作成が返す画面の URL を今のワークスペースごとの配信の URL にすると判断した。判断が分かれるためレビューで確定する'
    plan: to_file
  - item: MindStella の MCP の引数を、共通の cwd・session_id・source・outside_scope に揃える作り直し（A-119 の MindStella の MCP の引数）
    reason: 記録のツールの行き先（#517）と一緒に決まる。#516 で足すツールは、今のセッションの値の注入（inject_session.py）の引数に合わせる
    plan: '#517'

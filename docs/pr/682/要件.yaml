use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: changed
    detail: 詳細パネルで読んだ項目を確認済みにする流れを削除し、詳細パネルの幅を指でつかんで変えられるようにする（#675・#676）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-36.yaml
    impact: changed
    detail: 設定の更新で図の種類（mdmark.map の kinds・lines）を書き換えられるようにし、確認済みの削除に合わせてコメントの送信で確認済みにするかの設定の扱いを決める（#651・#675）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-49.yaml
    impact: changed
    detail: 絞り込みのドロワーでの絞り込みと並べ替えの変更を 1 つずつ履歴に残し、戻る操作で 1 つずつ前の条件へ戻す（#650）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-6.yaml
    impact: changed
    detail: ボードのカードの無い所をドラッグして横にスクロールする（#669）。表示形式の切り替えの選択中とホバーを見分けられる（#671）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: following
    detail: コメントの一覧の状態のタブの選択中の見分けと未読のマーカーの見た目の変更（#671）に追随する
    depends_on:
      - docs/scenario/SC-489-46.yaml
  - kind: single
    scenario: docs/scenario/SC-489-3.yaml
    impact: following
    detail: 確認済みの削除（#675）に合わせ、コメントを送信したときに項目を確認済みにする記述に追随する
    depends_on:
      - docs/scenario/SC-489-36.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: following
    detail: 確認済みの削除（#675）に合わせ、書き換えで確認済みを解除する記述を削除する
    depends_on:
      - docs/scenario/SC-489-36.yaml
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: following
    detail: 確認済みの削除（#675）に合わせ、コメントを送信した項目が確認済みになる記述を削除する（流れは変えない）
    depends_on:
      - docs/scenario/SC-489-3.yaml

scope_out:
  - item: 画面からファイルをアップロードしてワークスペースに配置する操作
    reason: 要望に含まれない。配置は MindStella のセッション（D-267 の動画作成ノード）か利用者がファイルのフォルダへ置く
    plan: none
  - item: aituber の動画作成ノード（資料 A-103）が書き出した mp4 を配置する側の変更
    reason: 別のリポジトリ（aituber）の変更で、この PR は配置先のフォルダと埋め込み・再生だけを持つ
    plan: none
  - item: 資料の本文の動画・音声・画像を読み込めないときに、画面の要素の場所へ警告を表示する
    reason: mdmark の部品『動画と音声』は読み込みの失敗の警告を持たず、mindstella の画面で警告を持つと部品と画面設計が増える。この PR では点検が参照切れとして通知し、画面の警告は mdmark の描画で持つかを別に決める
    plan: to_file
  - item: 埋め込んだ動画・音声を書き出した先（資料を書き出す・配る書き出し）でも再生できるようにする
    reason: 書き出しの画像の埋め込みと動画・音声のコピーは mdmark の書き出しが持ち、mindstella に同じ処理を重ねない（ユーザーの決定）
    plan: '#589'

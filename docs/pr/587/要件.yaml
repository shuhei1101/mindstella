    scenario: docs/scenario/SC-540-1.yaml
    impact: changed
    detail: ファイルのフォルダへの配置・差し替え・削除を、項目の変更として記録せず、書き換えのまとまりも作らない。Git のリポジトリの中でも Git 管理外でも同じに動き、ワークスペースの Git は操作しない
    depends_on:
      - docs/scenario/SC-587-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-10.yaml
    impact: run_only
    detail: 外の入口の内側で開いたプレビューでも、埋め込んだ動画を再生できる。シナリオの記述は変わらないが、ファイルの配信の追加が外から開いたときの許可するホスト名の判定を壊しうる
    depends_on:
      - docs/scenario/SC-587-1.yaml
  - kind: single
    scenario: docs/scenario/SC-587-1.yaml
    impact: new
    detail: MindStella のセッションか利用者が、動画・音声・画像をワークスペースのファイルのフォルダに配置して資料に埋め込み、利用者が詳細パネルで再生・表示する。ファイルが無いときも本文のほかの部分は描かれ、フォルダの外のファイルは返却されない
    depends_on: []

use_cases:
  - kind: single
    scenario: docs/scenario/SC-568-1.yaml
    impact: changed
    detail: 作業の完了の通知を、応答の終わりではなく利用者に手番を返すときのまとまりの確定で 1 件だけ送る。サブエージェントやバックグラウンドの処理を待つだけの応答の終わりでは送らず、返信だけで手番を返すときも送る（#697）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-43.yaml
    impact: changed
    detail: コメントの取り込みの最後に、手番を返す直前の commit を 1 回だけ呼ぶ決まりを加える。返信へ差分のリンクを入れるスレッドごとの commit は作業の途中の commit として残す（#697）
    depends_on:
      - docs/scenario/SC-568-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-26.yaml
    impact: following
    detail: 起動と再開でのまとめ忘れの確定が、作業の完了の通知のきっかけの変更に追随する（#697）
    depends_on:
      - docs/scenario/SC-568-1.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: run_only
    detail: 応答の途中でない間の外部の変更の自動のまとまりで、作業の完了の通知を送らないことが変わらないかを確かめる（#697）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: changed
    detail: 利用者が画面でスレッドをクローズ・オープンに戻すときに理由を聞かずに押したらすぐ変え、クローズしたらコメントの一覧に戻る（#377）。iPhone の幅でスレッドを開いても画面が端末の幅に収まる（#585）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-12.yaml
    impact: changed
    detail: 利用者がトップバーの更新のボタンで、サーバーへ接続し直して最新の記録を読み込み直し、開いている項目・絞り込み・入力中のコメントを保ったまま復帰できる（#482）。トップバーの状態の表示とボタンを、幅に関わらずアイコンと件数だけにする（#573）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-45.yaml
    impact: run_only
    detail: トップバーの音声入力中の表示がアイコンと経過時間だけになっても、録音中の入力欄へ戻れることが変わらないかを確かめる（#573。シナリオの記述は変えない）
    depends_on: []

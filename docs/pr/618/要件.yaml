scope_out:
  - item: PR ドキュメント（docs/pr/ の README.md・要件.md・計画書）の .mark.md への改名
    reason: ファイル名は AI Monitor のツール（create_draft_pr・read_pr_document）とテンプレートが決める。AI Monitor が shuhei1101/ai-monitor#3427（PR shuhei1101/ai-monitor#3684）でファイル名を変えたバージョンを配布した後に、追従として改名する
    plan: to_file
  - item: 目次（index.yaml）から書き出す README.md（docs/README.md・docs/{種類}/README.md・docs/guide/README.md）の .mark.md への改名
    reason: ファイル名は AI Monitor の design_docs publish が決める。AI Monitor が shuhei1101/ai-monitor#3684 で書き出すファイル名を変えたバージョンを配布した後に、追従として書き出し直す
    plan: to_file
  - item: docs/guide/変更履歴.md の .mark.md への改名
    reason: AI Monitor の規約『マージ手順』が release の変更履歴を docs/guide/変更履歴.md の固定のパスで書き足すため、改名すると release で別のページが作られる。shuhei1101/ai-monitor#3506 が配布された後に改名する
    plan: to_file
  - item: モックの目次（docs/mock/ の index.md）のうち記法を含む 22 件の .mark.md への改名
    reason: モックのフォルダの目次のファイル名は AI Monitor の規約『モック画面』と Pages の共通レイアウト（docs/_theme/assets/app.js）が index.md で決める。AI Monitor の規約と共通レイアウトが .mark.md を扱うバージョンを配布した後に改名する。含めるかはレビューで確定する
    plan: to_file

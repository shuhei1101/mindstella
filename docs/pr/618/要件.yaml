use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-34.yaml
    impact: changed
    detail: MindStella のセッションが資料などの本文を記載するときの本文のファイル名が、mdmark の文書の拡張子になる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-17.yaml
    impact: changed
    detail: 既存のワークスペースを開く前に、本文のファイルを mdmark の文書の拡張子へ改名し、項目が指す本文のパスを書き換える移し替えが加わる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-16.yaml
    impact: following
    detail: 本文のずれの点検が、改名後の本文のファイル名を対象にする
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-33.yaml
    impact: following
    detail: 検索で返る本文のパスが改名後のパスになる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-18.yaml
    impact: following
    detail: 差分の表示で比べる本文のパスが改名後のパスになる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: run_only
    detail: 本文の書き換えを履歴に残す対象のファイル名が変わるため、履歴が残り続けるかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-40.yaml
    impact: run_only
    detail: 資料の本文を改名後のパスから取得して描けるかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-39.yaml
    impact: changed
    detail: 資料を Markdown で書き出したファイルの拡張子が mdmark の文書の拡張子になる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-11.yaml
    impact: run_only
    detail: 配る書き出しが改名後の本文を中に持つかを確かめる
    depends_on: []

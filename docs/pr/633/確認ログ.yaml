confirmations:
  - topic: エディタで直接編集した項目も未確認に戻すか
    decision: 画面から保存した変更以外は全て未確認に戻す（MindStella のセッション・通常の Claude Code のセッション・エディタでの直接の編集。推奨案 A）
    decided_by: thumbs_up
    approver: shuhei1101
    commit:
    thread: https://github.com/shuhei1101/mindstella/pull/633#discussion_r4638092598
  - topic: 確認済みのボタンの置き場所と文言
    decision: 詳細の見出しだけに配置する（推奨案 A）。文言は未確認・確認済みとも「確認済み」にし、チェックと色で状態を示す（ユーザーの返信で修正）
    decided_by: reply
    approver: shuhei1101
    commit:
    thread: https://github.com/shuhei1101/mindstella/pull/633#discussion_r4638526634
  - topic: 確認済みを記録する場所
    decision: history.yaml の項目の行に items.{ID}.confirmed として持つ（推奨案 A）
    decided_by: thumbs_up
    approver: shuhei1101
    commit: b05ae92ae72e82ebdd626bc9e8bdaaa834ab4a14
    thread: https://github.com/shuhei1101/mindstella/pull/633#discussion_r4638613688
  - topic: 「コメントの送信で確認済みにする」設定の置き場所
    decision: ワークスペースの設定 config.yaml に confirm_on_comment（既定 true）として持つ（推奨案 A）
    decided_by: thumbs_up
    approver: shuhei1101

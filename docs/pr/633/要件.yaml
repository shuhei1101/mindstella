use_cases:
  - kind: composite
    scenario: docs/scenario/SC-489-50.yaml
    impact: run_only
    detail: 読み返しの流れは変わらないが、項目の詳細に確認済みのマーカーが加わり、画面をまたいだ読み返しを壊しうる（#188）
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: changed
    detail: 画面からコメントを送信した項目が確認済みになり、取り込みで AI がその項目を書き換えると未確認に戻る（#188）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: changed
    detail: 項目の詳細で、確認済みかを見て、確認済みにする・解除する（#188）。#625 の最も狭い幅のボタンの収まりは、画面設計と結合テストで扱い、シナリオは変えない
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-47.yaml
    impact: none
    detail: コメントを溜めるだけでは確認済みは変わらず、送信で確認済みにするのは『コメントを選んで送る』が持つ（#188）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-3.yaml
    impact: changed
    detail: 選んだコメントをまとめて送ると、設定がオンなら送った項目が確認済みになる（#188）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: changed
    detail: 利用者が画面から保存した変更以外（MindStella のセッション・通常のセッション）の書き換えで項目が変わると、その項目の確認済みを解除する（#188）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-28.yaml
    impact: run_only
    detail: 利用者が画面で編集して保存した変更は AI の書き換えではないため確認済みを外さない。保存の流れは変わらないが、確認済みの扱いを壊しうる（#188）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-36.yaml
    impact: none
    detail: コメントの送信で確認済みにするかの設定の配置先はデータ設計で決める。ワークスペースの設定に決まったら、この行を changed に戻して設定を書き換えるシナリオを追加する（#188）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: changed
    detail: コメントの一覧のパネルで、スレッドの書き込みの本文がパネルの幅で折り返し、横スクロールは幅に収まらない表・コードブロックの中だけになる（#619）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-14.yaml
    impact: none
    detail: 許可するフォルダの外の指定は『外部のアプリから起動する』の異常シナリオが持ち、状態のフォルダが作られる原因はインターフェース定義設計で特定する。シナリオの記述は変えない（#624）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-17.yaml
    impact: changed
    detail: ワークスペースのバージョンと同じバージョンに後から追加した移し替えの手順も既存のワークスペースで実行され、既に該当したワークスペースが手作業なしで復旧する（#628）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-605-1.yaml
    impact: run_only
    detail: 常駐サーバーの起動時の照合が状態のフォルダを作る箇所を修正する場合に、起動の流れを壊しうる（#624）
    depends_on: []
docs:
  - page: docs/guide/プレビューを見る.mark.md
    new: false
    change: 項目を確認済みにする・外す操作と、AI が書き換えると未確認に戻ること、コメントを送ると確認済みになることを追加する（#188）
    status: todo
  - page: docs/guide/ワークスペースの書式.mark.md
    new: false
    change: 確認済みを持つキーと、コメントを送ったら確認済みにするかの設定のキーを追加する（#188）
    status: todo
  - page: docs/guide/セットアップ手順-ワークスペースを今の版へ移し替える.mark.md
    new: false
    change: 同じバージョンに後から追加した移し替えの手順も実行されることに合わせて、移し替えが当たる条件の記載を修正する（#628。記載が条件に触れていなければ変更なしで閉じる）
    status: todo

    reason: '今の画面は #371 で削除するため、React の画面だけを対象にする（#619 の受付判断と同じ扱い）。#625 は今の画面の結合テストの fail のため対象に含める'
    plan: '#371'
  - item: 確認済みかどうかで項目を絞り込む
    reason: '要望に含まれない。絞り込みの条件は #158 が扱う'
    plan: '#158'
  - item: 変更履歴の 1 件ごとの未読のマーカー
    reason: '#188 は項目に対して付けるもので、変更履歴ごとの未読は #156 が扱う'
    plan: '#156'
  - item: iPhone の幅でスレッドを開くと画面全体が横にスクロールする事象
    reason: 条件が違い、同じ原因とは決まっていない。#619 の原因を特定した時点で同じ原因と分かれば、統合をレビューで確定する
    plan: '#585'
  - item: 同じテストファイルの test_error_when_host_not_local の fail
    reason: 別のテストの別の事象
    plan: '#575'
  - item: test_detail_panel_screen.py の図の拡大・ミニマップなどのテストの fail
    reason: 別のテストの別の事象（#610 も同じ実行で fail した図の拡大のボタンを扱う）
    plan: '#553'

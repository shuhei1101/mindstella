use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-7.yaml
    impact: removed
    detail: ネットワークを辿るユースケースを削除する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-24.yaml

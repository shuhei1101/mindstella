    depends_on:
      - docs/scenario/SC-489-31.yaml
  - kind: single
    scenario: docs/scenario/SC-489-35.yaml
    impact: changed
    detail: 設定の再読み込みの例を、見た目の既定から表示する種類の既定へ置き換える
    depends_on:
      - docs/scenario/SC-489-31.yaml
  - kind: single
    scenario: docs/scenario/SC-489-36.yaml
    impact: changed
    detail: 設定の更新で書き換える表示の既定から見た目を外す
    depends_on:
      - docs/scenario/SC-489-31.yaml
  - kind: single
    scenario: docs/scenario/SC-489-11.yaml
    impact: changed
    detail: 配る書き出しで確かめる画面からネットワークと検討事項のマップと見た目の既定を外す
    depends_on:
      - docs/scenario/SC-489-7.yaml
      - docs/scenario/SC-489-24.yaml
  - kind: single
    scenario: docs/scenario/SC-489-47.yaml
    impact: changed
    detail: コメントの印を確かめる画面からネットワークと検討事項のマップを外す
    depends_on:
      - docs/scenario/SC-489-7.yaml
      - docs/scenario/SC-489-24.yaml
  - kind: single
    scenario: docs/scenario/SC-489-48.yaml
    impact: changed
    detail: 全体の検索を開く例を、検討事項のマップのキーワード欄からほかの画面の入力欄へ置き換える
    depends_on:
      - docs/scenario/SC-489-24.yaml
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: run_only
    detail: 詳細パネルからネットワークへ移る操作を削除するため、詳細を読む流れが壊れていないかを確かめる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-40.yaml
    impact: run_only
    detail: 依存（elkjs）を外したとき、資料の本文の図の描画が壊れていないかを確かめる
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-489-50.yaml
    impact: changed
    detail: プレビューで記録を読み返す流れから、ネットワークで項目を辿る段を外す
    depends_on:
      - docs/scenario/SC-489-7.yaml
  - kind: composite
    scenario: docs/scenario/SC-489-51.yaml
    impact: changed
    detail: 人ごとに分ける表示の好みから見た目を外し、表示する種類だけで上書きと既定の保存を確かめる
    depends_on:
      - docs/scenario/SC-489-31.yaml
      - docs/scenario/SC-489-15.yaml

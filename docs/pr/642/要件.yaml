    plan: '#371'
  - item: 常駐サーバーを起動し直した後に外部への公開を登録し直すフックの追加
    reason: 要望に含まれない。この作業 PR では、既にある配信の起動・終了のフックの呼ばれ方を 1 つのポートに合わせるだけ
    plan: '#600'
  - item: 作業の完了・停止の通知の URL を外部に公開した URL にする
    reason: 要望に含まれない。この作業 PR では、通知に載せるローカルの URL を常駐サーバーの入口の URL に合わせるだけ

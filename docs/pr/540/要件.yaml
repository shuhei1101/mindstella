    new: false
    change: 削除・新規作成するコードの行と、記録を配信する設定のテンプレートの行を修正する
    status: todo
scope_out:
  - item: '#390 の関連の when（いつ参照するか）を記録の関連に持たせる'
    reason: この時点の判断は捨てる。project-index の related は when を持たず、project-index には MindStella のための変更を入れない（D-290）。スコープに含めるか判断が分かれるため、レビューで確定する
    plan: none
  - item: session のスキルの手順と公開ドキュメント『スキル』の、find・show・add・update・remove・batch・tags・impact の呼び出しを project-index のツールへ書き換える
    reason: 'この時点の判断は #518 へ回す。#518 が session のスキルを削除し、project-index のツールで記録するエージェントフロー（A-112・A-113）へ置き換える。この作業 PR をマージしてから #518 をマージするまでの間、session のスキルは削除したツールを呼ぶ。スコープに含めるか判断が分かれるため、レビューで確定する'
    plan: '#518'
  - item: next・goal・status・write_release・clear_release の削除と、SessionStart のフックが前回参照した時点より後の変更を注入すること（D-326）
    reason: 話し合いの進め方に依存する機能の削除と再開の状況の注入は、A-107 の No 3（記録のエージェントフローと削除）の範囲
    plan: '#518'
  - item: 検討事項の depends_on・parent を related の type で表し、専用のキーを削除する（D-275 B）。項目の attrs・targets・categories・phase などの削除の候補のキーを削除する
    reason: A-107 の「削除の候補」は No 3 で作り直す。この作業 PR は今のキーのまま project-index の related の型へ対応させる
    plan: '#518'
  - item: migrate を常駐サーバーの読み込みのときの移し替えへ移し、upgrade のスキルを削除する（D-288）
    reason: スキルの削除は A-107 の No 3 の範囲。この作業 PR は今の移し替えの仕組みに手順を追加するだけにする
    plan: '#518'
  - item: update_settings を MindStella の API の設定の書き換え（PATCH /workspaces/{id}）と同じ操作のツールにまとめる
    reason: A-107 の No 9（ワークスペースの設定の書き換え）の範囲
    plan: '#524'
  - item: find・show など削除するツールを呼ぶ E2E のテストと、E2E の環境に project-index を入れること
    reason: 'E2E は 0.x の間は回さず、tests/e2e/ は #477 で削除する'
    plan: '#477'
  - item: project-index に、MindStella のための書き込みの前後のフック・採番・書き込みの制限を追加する
    reason: project-index は MindStella を知らず、MindStella だけが project-index に依存する（D-290・D-291）
    plan: none

use_cases:
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: following
    detail: 話し合いの中で記録を検索・追加・更新する手順を、project-index のツールと ID の採番で行う流れに合わせる
    depends_on:
      - docs/scenario/SC-489-33.yaml
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-33.yaml
    impact: changed
    detail: 記録の検索・1 件の中身と参照元・タグの一覧を、project-index の検索と関連のたどりで行う
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-34.yaml
    impact: changed
    detail: 記録の追加と更新を、ID を採番してから project-index の書き込みで行い、書き込んだ変更が履歴に残る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-32.yaml
    impact: changed
    detail: 記録の削除と取り下げを project-index の書き込み・削除で行い、ほかの記録が指す項目は削除しない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-23.yaml
    impact: none
    detail: 案の書き換えは MindStella の MCP に残し（同じ記号・採用中の案の検査は汎用の書き込みで表せない）、振る舞いは変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-21.yaml
    impact: changed
    detail: 採用する案の切り替えと決定済みへの変更は MindStella の MCP に残し、影響の洗い出しを project-index の関連のたどりで行う
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-16.yaml
    impact: changed
    detail: ワークスペースの点検は MindStella に残し、スキーマ違反は project-index の書き込みの検査が止める。重なった ID も洗い出す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-1.yaml
    impact: changed
    detail: スレッドを立てられるのを MindStella のセッションだけにする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-43.yaml
    impact: changed
    detail: スレッドの取り込みと書き換えのまとまりを、MindStella のセッションだけが行う
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-19.yaml
    impact: changed
    detail: ほかのセッションが書き込んだ変更（外部の変更）も、前回読んだ時点からの変更に含める
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-14.yaml
    impact: changed
    detail: ワークスペースを作成したら、記録を project-index で検索・書き込みできる状態になる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-17.yaml
    impact: changed
    detail: 既存のワークスペースを移し替えると、記録を配信する設定が置かれ、参照のキーが種類つきの related になり、project-index で検索・書き込み・関連のたどりができる
    depends_on:
      - docs/scenario/SC-489-14.yaml
  - kind: single
    scenario: docs/scenario/SC-489-18.yaml
    impact: changed
    detail: 変更履歴で、ほかのセッションが書き込んだ変更のまとまりを見分けて差分を参照できる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-28.yaml
    impact: none
    detail: 画面の保存は今と同じく自分で履歴を記録し、二重に記録しないことは『書き込みを履歴に残す』が確かめる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-29.yaml
    impact: following
    detail: 画面で追加した項目の ID の採番を、採番のツールと重ならないようにする
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-27.yaml
    impact: following
    detail: 画面で削除した項目が、今と同じく利用者の変更として履歴に残る
    depends_on:
      - docs/scenario/SC-489-32.yaml
  - kind: single
    scenario: docs/scenario/SC-531-1.yaml
    impact: none
    detail: 配信の設定はワークスペースの作成が配置し（『ワークスペースの作成』）、外部のアプリから起動する流れは変わらない
    depends_on:
      - docs/scenario/SC-489-14.yaml
  - kind: single
    scenario: docs/scenario/SC-489-30.yaml
    impact: following
    detail: 発言を記録する手順の記録のツールを、project-index のツールと ID の採番に合わせる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: new
    detail: どのセッションの書き込みも変更履歴に残り、MindStella のセッションの応答の途中でない間の変更は外部の変更のまとまりになる。重なった ID を知らせる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: following
    detail: 詳細パネルの関係（前提・後続・親子・関連）を、種類つきの related から出す。利用者から見た振る舞いは変わらず、表示と入力は画面設計・部品設計で合わせる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-24.yaml
    impact: following
    detail: 検討事項のマップの依存と親子を、種類つきの related から辿る
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-7.yaml
    impact: following
    detail: ネットワークのつながりを、種類つきの related から引く
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-6.yaml
    impact: following
    detail: タスクが向く検討事項を、種類 for の related から出す
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-22.yaml
    impact: following
    detail: 方針転換で影響を受ける項目を、種類つきの related を trace_related でたどって洗い出し、要見直しと見直しのタスクを project-index の書き込みで積む
    depends_on:
      - docs/scenario/SC-489-21.yaml
  - kind: single
    scenario: docs/scenario/SC-489-26.yaml
    impact: following
    detail: 要見直しと後続の件数を、種類 depends_on の related から数える
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-25.yaml
    impact: following
    detail: 概要のタイルの前提を、種類 depends_on の related から読む
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-8.yaml
    impact: following
    detail: 前提が揃った未決定を、種類 depends_on の related から選び、答えと会話ログを project-index の書き込みで残す
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-13.yaml
    impact: following
    detail: 調査・タスク・用語・会話ログを project-index の書き込みで足し、調査を元の検討事項へ種類つきの related でつなぐ
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-4.yaml
    impact: following
    detail: ゴール判定の手順の記録の読み書きを、project-index のツールと ID の採番に合わせる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-38.yaml
    impact: following
    detail: 話し合いの範囲の見直しのたたき台と会話ログの書き込みを、project-index のツールと ID の採番に合わせる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-12.yaml
    impact: following
    detail: 開いている画面に出る書き換えを、project-index の書き込みで作る
    depends_on:
      - docs/scenario/SC-489-34.yaml

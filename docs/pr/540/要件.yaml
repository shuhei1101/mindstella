use_cases:
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: following
    detail: 話し合いの中で記録を検索・追加・更新する手順を、project-index のツールと ID の採番で行う流れに合わせる
    depends_on:
      - docs/scenario/SC-489-33.yaml
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-33.yaml
    impact: changed
    detail: 記録の検索・1 件の中身と参照元・タグの一覧を、project-index の検索と関連のたどりで行う
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-34.yaml
    impact: changed
    detail: 記録の追加と更新を、ID を採番してから project-index の書き込みで行い、書き込んだ変更が履歴に残る
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-32.yaml
    impact: changed
    detail: 記録の削除と取り下げを project-index の書き込み・削除で行い、ほかの記録が指す項目は削除しない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-23.yaml
    impact: none
    detail: 案の書き換えは MindStella の MCP に残し（同じ記号・採用中の案の検査は汎用の書き込みで表せない）、振る舞いは変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-21.yaml
    impact: changed
    detail: 採用する案の切り替えと決定済みへの変更は MindStella の MCP に残し、影響の洗い出しを project-index の関連のたどりで行う
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-16.yaml
    impact: changed
    detail: ワークスペースの点検は MindStella に残し、スキーマ違反は project-index の書き込みの検査が止める。重なった ID も洗い出す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-1.yaml
    impact: changed
    detail: スレッドを立てられるのを MindStella のセッションだけにする
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-43.yaml
    impact: changed
    detail: スレッドの取り込みと書き換えのまとまりを、MindStella のセッションだけが行う
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-19.yaml
    impact: changed
    detail: ほかのセッションが書き込んだ変更（外部の変更）も、前回読んだ時点からの変更に含める
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-14.yaml
    impact: changed
    detail: ワークスペースを作成したら、記録を project-index で検索・書き込みできる状態になる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-17.yaml
    impact: changed
    detail: 既存のワークスペースを移し替えると、project-index で検索・書き込みできる状態になる
    depends_on:
      - docs/scenario/SC-489-14.yaml
  - kind: single
    scenario: docs/scenario/SC-489-18.yaml
    impact: changed
    detail: 変更履歴で、ほかのセッションが書き込んだ変更のまとまりを見分けて差分を参照できる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-28.yaml
    impact: none
    detail: 画面の保存は今と同じく自分で履歴を記録し、二重に記録しないことは『書き込みを履歴に残す』が確かめる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-29.yaml
    impact: following
    detail: 画面で追加した項目の ID の採番を、採番のツールと重ならないようにする
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-489-27.yaml
    impact: following
    detail: 画面で削除した項目が、今と同じく利用者の変更として履歴に残る
    depends_on:
      - docs/scenario/SC-489-32.yaml
  - kind: single
    scenario: docs/scenario/SC-531-1.yaml
    impact: none
    detail: 配信の設定はワークスペースの作成が配置し（『ワークスペースの作成』）、外部のアプリから起動する流れは変わらない
    depends_on:
      - docs/scenario/SC-489-14.yaml
  - kind: single
    scenario: docs/scenario/SC-489-30.yaml
    impact: following
    detail: 発言を記録する手順の記録のツールを、project-index のツールと ID の採番に合わせる
    depends_on:
      - docs/scenario/SC-489-34.yaml
  - kind: single
    scenario: docs/scenario/SC-540-1.yaml
    impact: new
    detail: どのセッションの書き込みも変更履歴に残り、MindStella のセッションの応答の途中でない間の変更は外部の変更のまとまりになる。重なった ID を知らせる
    depends_on:
      - docs/scenario/SC-489-34.yaml

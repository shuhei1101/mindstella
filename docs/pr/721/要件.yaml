use_cases:
  - kind: single
    scenario: docs/scenario/SC-582-1.yaml
    impact: changed
    detail: 圧縮を止めて再起動する契機（正常シナリオ（圧縮））を削除し、利用上限・利用枠のしきい値・落ちた後のコメント・再起動の依頼の契機だけを残す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-26.yaml
    impact: changed
    detail: '圧縮の契機を、PreCompact で止めて起動し直した後ではなく、Claude Code が圧縮した後の再開（source: compact）だけにする'
    depends_on:
      - docs/scenario/SC-582-1.yaml
  - kind: single
    scenario: docs/scenario/SC-721-1.yaml
    impact: new
    detail: 利用者が項目のカードの星でお気に入りに登録・解除し、カードの一覧の先頭に並べ、ボードでは星だけを出し、表の星の列で並べ替える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-31.yaml
    impact: changed
    detail: 表示の設定に「お気に入りを一番上にする」「お気に入りだけを表示する」の切り替えを追加する
    depends_on:
      - docs/scenario/SC-721-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-49.yaml
    impact: changed
    detail: 表の一番左に星の列を追加し、その列で並べ替えられるようにする
    depends_on:
      - docs/scenario/SC-721-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-15.yaml
    impact: following
    detail: お気に入りの表示の切り替えをワークスペースの既定に含めるかに追随する（置き場所は設計で決める）
    depends_on:
      - docs/scenario/SC-489-31.yaml
  - kind: composite
    scenario: docs/scenario/SC-489-51.yaml
    impact: following
    detail: お気に入りと表示の切り替えを人ごとに分けるかに追随する（置き場所は設計で決める）
    depends_on:
      - docs/scenario/SC-489-31.yaml

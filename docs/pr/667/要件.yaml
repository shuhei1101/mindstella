    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: changed
    detail: 本文の項目の ID にカーソルを合わせるかフォーカスすると、その項目のタイトルと状態が出る。スマホの幅では全画面表示のボタンが出ない。本文を mdmark の印刷で印刷できる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-49.yaml
    impact: run_only
    detail: ドロワーを開いている間のグレーアウトは記載済みで、記述は変わらない。グレーアウトと後ろを操作できないことを足す実装が壊しうる
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-25.yaml
    impact: run_only
    detail: 概要の並びがページの領域の幅で 1 列に切り替わる。シナリオの記述は変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-6.yaml
    impact: run_only
    detail: ボードの左右の余白とキーボードでの移動が変わる。シナリオの記述は変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-40.yaml
    impact: run_only
    detail: 資料のカードの見出しのレベルとボードの余白が変わり、カード表示の列の数が画面の領域の幅で切り替わる。シナリオの記述は変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-5.yaml
    impact: run_only
    detail: コメントの一覧のピン止めの解除の状態のアイコンが変わる。シナリオの記述は変わらない
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-31.yaml
    impact: changed
    detail: 表示の設定の端末の上書きから、削除する本文の差分の並べ方を外す
    depends_on:
      - docs/scenario/SC-489-18.yaml

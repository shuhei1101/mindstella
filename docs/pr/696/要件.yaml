use_cases:
  - kind: single
    scenario: docs/scenario/SC-489-30.yaml
    impact: changed
    detail: 方針の質問をスレッドで聞かずに理解・案・推奨を持つ検討事項にし、回答待ちを保留にせず、資料・タスクの状態の意味と資料の確認の依頼と描画の確認を加える
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-43.yaml
    impact: changed
    detail: 回ごとの報告を新規のスレッド 1 件にまとめて前の回の報告をクローズし、返信で回答を求めず、クローズの前に約束がタスクにあるかを確認し、回の最初に保留のタスクを見直す
    depends_on:
      - docs/scenario/SC-489-30.yaml
  - kind: single
    scenario: docs/scenario/SC-489-26.yaml
    impact: changed
    detail: 起動と再開の回の最初に保留のタスクを見直し、条件を満たしたものに着手する
    depends_on:
      - docs/scenario/SC-489-30.yaml
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: run_only
    detail: 回答が要ることを検討事項に挙げて通知する流れの記述は変わらないが、コメントの取り込みと記録の使い分けの手順が変わる

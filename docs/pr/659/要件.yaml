use_cases:
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: changed
    detail: 利用者の回答が要る検討事項を挙げて決めていく流れに、方針はスレッドで聞き細部は AI が決めて報告だけにする進め方を加える（#484・D-361 A）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-30.yaml
    impact: changed
    detail: AI が利用者に聞くことを、方針（選択肢を作る前に論点と AI の理解をスレッドで聞き、合ってから検討事項にする）と細部（AI が決めてスレッドで報告だけにする）に分ける（#484・D-361 A）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-34.yaml
    impact: changed
    detail: AI が細部を決めて検討事項を記録するとき、スレッドで報告する（#484）
    depends_on:
      - docs/scenario/SC-489-30.yaml
  - kind: single
    scenario: docs/scenario/SC-489-49.yaml
    impact: changed
    detail: 絞り込みのドロワーでプリセットを選ぶと、そのプリセットのタグと組み合わせ方が今のタグの条件に入り、状態・種類などほかの条件は残る。該当する件数が 0 のプリセットにマーカーを出す（#361）
    depends_on:
      - docs/scenario/SC-489-52.yaml
  - kind: single
    scenario: docs/scenario/SC-489-6.yaml
    impact: following
    detail: タスクの絞り込みのドロワーでプリセットを選べることに追随する（#361）
    depends_on:
      - docs/scenario/SC-489-49.yaml
  - kind: single
    scenario: docs/scenario/SC-489-40.yaml
    impact: following
    detail: 資料の絞り込みのドロワーでプリセットを選べることに追随する（#361）
    depends_on:
      - docs/scenario/SC-489-49.yaml
  - kind: single
    scenario: docs/scenario/SC-649-1.yaml
    impact: following
    detail: AI が作ったプリセットを画面の絞り込みのドロワーで選べることに、成功の保証と補足の記述を追随する（#361）
    depends_on:
      - docs/scenario/SC-489-49.yaml

scope_out:
  - item: 画面の今の絞り込みを、名前付きのプリセットとして保存する操作
    reason: '#361 の本文が後続として分けている。この作業 PR は AI が作ったプリセットを並べて開くだけを持つ'
    plan: '#362'
  - item: カードが 0 枚のボードの横スクロールの領域にキーボードで届かないこと（axe `scrollable-region-focusable`、`frontend/src/shared/components/board.tsx` の `Board`）
    reason: スクロールできる領域はキーボードで操作できる、という axe の規則から外れている。origin/develop にもある事象で、今回の要望に含まれない
    plan: '#664'
  - item: 未決定の検討事項を複数選び、推奨の案でまとめて決める画面の操作
    reason: 利用者が不要と回答した（https://github.com/shuhei1101/mindstella/pull/659#discussion_r4652925094）
    plan: none
  - item: 検討事項を誰が決めたか（利用者・AI）の記録と、一覧の列・絞り込みの条件・カードの表示
    reason: 利用者が不要と回答した（https://github.com/shuhei1101/mindstella/pull/659#discussion_r4652919851）
    plan: none
  - item: AI の通知のスレッドに検討事項を並べ、そこからまとめて回答すること
    reason: 利用者が不要と回答した（https://github.com/shuhei1101/mindstella/pull/659#discussion_r4652919851）
    plan: none

use_cases:
  - kind: single
    scenario: docs/scenario/SC-531-1.yaml
    impact: changed
    detail: アカウントを指定して MindStella のセッションを起動すると、claude-balancer からそのアカウントを借りて起動する。指定したアカウントを借りられないときの知らせ方と、起動したアカウントの示し方を追加する。配信元の行が無い新規のワークスペースを作れる（#554・#556）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-41.yaml
    impact: changed
    detail: 起動のコマンドでアカウントを指定したとき、そのアカウントで起動し、起動したアカウントを示す。配信元の行が無いワークスペースのフォルダ（新規作成・移したフォルダ）で起動できる（#554・#556）
    depends_on:
      - docs/scenario/SC-531-1.yaml
  - kind: single
    scenario: docs/scenario/SC-489-14.yaml
    impact: changed
    detail: 配信元の行が無い新規のワークスペースを作るときに登録が通る。ワークスペースのフォルダを移したときの、前の ID の配信元の行と状態の扱いを決める（#554）
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-42.yaml
    impact: following
    detail: アカウントごとの alias で起動したとき、claude-balancer がある端末でもそのアカウントで起動することに追随する（#556）
    depends_on:
      - docs/scenario/SC-489-41.yaml
  - kind: single
    scenario: docs/scenario/SC-489-17.yaml
    impact: run_only
    detail: 前のバージョンの形式の問題の判定を設計書に合わせて修正するため、移し替えの案内が出る条件を壊していないかを確かめる（#561）
    depends_on: []
  - kind: composite
    scenario: docs/scenario/SC-489-52.yaml
    impact: run_only
    detail: 起動のコマンドからワークスペースと MindStella のセッションを作る入口が変わるため、話し合いをゴールまで進める流れを壊していないかを確かめる
    depends_on: []

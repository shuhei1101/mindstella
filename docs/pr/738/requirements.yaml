use_cases:
  - kind: single
    scenario: docs/scenario/SC-721-1.yaml
    impact: changed
    detail: 詳細パネル（と詳細の全画面）の固定のヘッダーの星で、開いている項目をお気に入りに登録・解除する流れを足す。AI が登録したお気に入りも画面に出るよう、お気に入りの残り先（今は端末だけ）と、記録と config.yaml を変えないという保証を見直す
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-46.yaml
    impact: run_only
    detail: 詳細のヘッダーの星の操作は単一ユースケース『項目をお気に入りにする』が持ち、詳細を読む流れの記述は変わらない。ヘッダーにボタンが加わり目次・一覧の並びの前後・コメントのボタンの配置を壊しうるため確認する
    depends_on: []
  - kind: single
    scenario: docs/scenario/SC-489-31.yaml
    impact: changed
    detail: 「お気に入りの並びと絞り込みを変える」の前提と既定に戻した後の期待値を、端末の保存領域のお気に入りからワークスペースのお気に入りに書き換える。切り替えは今のまま端末の上書き
    depends_on:
      - docs/scenario/SC-721-1.yaml
  - kind: single
    scenario: docs/scenario/SC-727-1.yaml
    impact: new
    detail: MindStella のセッションの AI が、利用者の指示で項目をお気に入りに登録・解除し、利用者がプレビューでその項目の星が塗られているのを見る
    depends_on:
      - docs/scenario/SC-721-1.yaml

  description: mindstella のツールが Claude Code に無いとき、常駐サーバーの状態を確かめたいとき、常駐サーバーを止めたいとき、待ち受けのポートを変えたいとき、プラグインを上げた後に古いコードのままと出たときに実行する。systemd --user の常駐サーバーを起動・停止・再起動する手順を調べるときに読む。
  visibility: public

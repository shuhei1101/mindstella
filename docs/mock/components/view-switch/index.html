<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅でも等倍で開く（拡大は禁止しない） -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>表示形式の切り替え | mindmap 部品のモック</title>
  <!-- 文字: デザイン方針の Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <!-- トークンと、画面のモックと同じスタイル -->
  <link rel="stylesheet" href="../../../../plugins/mindstella/skills/mindmap/preview/tokens.css">
  <link rel="stylesheet" href="../../refs/21/assets/style.css">
  <style>
    /* カタログの節: 状態ごとの案を縦に並べる */
    .cat-sec { margin-top: 32px; }
    /* カタログの節の見出し */
    .cat-sec > h2 { margin: 0 0 4px; font-size: 1rem; }
    /* 状態の説明 */
    .cat-sec > p { margin: 0 0 12px; color: var(--text-2); font-size: var(--fs-small); }
    /* 部品を置く台 */
    .stage { border: 1px dashed var(--border); border-radius: var(--radius); padding: 12px; background: var(--bg); overflow: hidden; }
    /* 台の中では帯を流れに置く */
    .stage .topbar, .stage .tabbar { position: static; }
    /* 狭い幅の見本 */
    .stage.narrow { width: 390px; max-width: 100%; }
    /* 狭い幅の見本: 画面幅 960px 以下のときと同じ置き方にする */
    .stage.narrow .search-trigger { min-width: 0; }
    .stage.narrow .search-trigger .label, .stage.narrow .search-trigger kbd, .stage.narrow .brand-sub { display: none; }
    /* 状態を見せるための見本のクラス */
    .is-hover { background: var(--hover) !important; color: var(--text) !important; }
    .is-focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="content">
    <!-- パンくず -->
    <nav class="crumbs" aria-label="パンくず"><a href="../index.md">components</a> / view-switch</nav>
    <h1 style="margin: 0; font-size: var(--fs-h1); letter-spacing: -.02em;">表示形式の切り替え</h1>
    <section class="cat-sec">
      <h2>検討事項（マップ / ボード / 表）</h2>
      <p>1 つ 96px の同じ幅。選んだ形式は文字色で塗る。どのタブでもツールバーの左端の同じ位置に置く。</p>
      <div class="stage"><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h3l4-5M11.5 12l4 5"/></svg>マップ</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h3l4-5M11.5 12l4 5"/></svg>マップ</button><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h3l4-5M11.5 12l4 5"/></svg>マップ</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div></div>
    </section>
    <section class="cat-sec">
      <h2>タスク（ボード / 表）・資料（カード / ボード / 表）</h2>
      <p>形式の数が違っても、1 つの幅と左端の位置を揃え、切り替えでツールバーの右側を動かさない。</p>
      <div class="stage"><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/></svg>カード</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div></div>
    </section>
    <section class="cat-sec">
      <h2>ホバー・キーボードのフォーカス</h2>
      <p>ホバーは面の色、フォーカスは印の色の輪。</p>
      <div class="stage"><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h3l4-5M11.5 12l4 5"/></svg>マップ</button><button type="button" class="is-hover" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div><div class="toolbar"><div class="segment" role="group" aria-label="表示形式"><button type="button" class="" aria-pressed="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 12h3l4-5M11.5 12l4 5"/></svg>マップ</button><button type="button" class="" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="11" rx="1"/><rect x="17" y="4" width="4" height="7" rx="1"/></svg>ボード</button><button type="button" class="is-focus" aria-pressed="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 10v10"/></svg>表</button></div><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div></div>
    </section>
    <section class="cat-sec">
      <h2>調査・用語集・メモ・会話ログ</h2>
      <p>表しか無い画面には切り替えを出さない（押しても変わらない部品を置かない）。</p>
      <div class="stage"><div class="toolbar"><input class="input grow" type="search" placeholder="キーワード" aria-label="キーワードで絞り込み"></div></div>
    </section>
  </main>
</body>
</html>

summary: 条件が来たときに引く、1 条件 = 1 ページの手順
items:
  - page: プラグインをインストールする.md
    summary: mindstella を初めて使うときに実行する
  - page: 起動スクリプトを登録する.md
    summary: 起動スクリプトを短い名前で叩きたいとき、外から見る設定などの環境変数を毎回打たずに済ませたいとき、Claude Code のアカウントごとに立ち上げたいときに実行する
  - page: 起動スクリプトで立ち上げる.md
    summary: スキルを使い始めるとき、話し合いを再開するとき、止まったサーバーを立ち上げ直すときに実行する
  - page: スクリプトの依存を入れる.md
    summary: 起動スクリプトが依存の不足を示して止まったときに実行する
  - page: プレビューを外から見る.md
    summary: プレビューを、トンネル・リバースプロキシを通して端末の外から開くときに実行する
  - page: ワークスペースを今の版へ移し替える.md
    summary: プラグインを上げた後に、ワークスペースの版が古いと案内されたときに実行する

id: SC-489-41
title: "端末から起動する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。Claude Code の CLI を、`plugin list --json` に決めた `installPath` を返す偽のコマンドに差し替える。MindStella のセッションは単一ユースケース『外部のアプリから起動する』と同じ Mock（起動の引数と環境変数を記録し、SessionStart のフックを呼ぶ）・claude-balancer（`exec` を記録する）にする。`systemctl --user` は、受けた引数を記録し、`start` で常駐サーバーのプロセスを起動するコマンドに置き換える
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: インストールしたプラグイン
        description: コミットの SHA の名前のフォルダに置いたプラグインと、そのフォルダを `installPath` に返す偽の Claude Code
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: ワークスペースのフォルダ
        description: グローバルの設定のファイルの許可するフォルダ（`mindstella.allowed_dirs`）が指すテストごとの一時フォルダの下の、記録の無いフォルダ
      - name: project-index の配信元への登録
        description: Mock。登録の依頼を記録するだけにする（登録そのものは単一ユースケース『外部のアプリから起動する』で通す）。project-index の接続先（`PROJECT_INDEX_PORT`）はその Mock を指し、Mock が返すグローバルの設定のファイルはテストごとの一時ファイル
      - name: 落ちている常駐サーバー
        description: テストごとに選んだ空きポートを `MINDSTELLA_PORT` で渡し、そのポートで待ち受けているプロセスが無い
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー（MindStella の API）
        participant TM as tmux
        participant CC as MindStella のセッション

        U->>LS: 起動のコマンド {フォルダ}（進め方の文書・追加の MCP・プラグインは任意の引数）
        LS->>LS: 依存を確かめる
        LS->>SV: 待ち受けているか（MINDSTELLA_PORT で版とプラグインのフォルダを尋ねる）
        LS->>SV: ポートで待ち受けているプロセスが無いので、systemd --user のユニットを起動する
        LS->>SV: ワークスペースの作成を依頼する（POST /workspaces）
        SV-->>LS: ワークスペースの ID と画面の URL
        LS->>SV: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
        SV->>TM: ペインの中で claude-balancer exec で起動する
        TM->>CC: 立ち上げる
        CC->>SV: SessionStart のフックが状態に登録する
        SV-->>LS: MindStella のセッションの ID・tmux のペイン・画面の URL
        LS-->>U: 画面の URL を示す
        LS->>TM: MindStella のセッションのペインへつなぐ
      ```
    expected:
      - Mock の `systemctl --user` が mindstella のユニットの `start` を受け、常駐サーバーが `MINDSTELLA_PORT` のポートで待ち受けている
      - ワークスペースのフォルダにワークスペースの記録があり、状態のフォルダのワークスペースの ID の一覧にある
      - Mock の claude-balancer が `exec` を受け、tmux のペインの中で Mock の MindStella のセッションが起動している
      - 状態に MindStella のセッションの ID と tmux のペインが登録されている
      - 出力に画面の URL があり、起動のコマンドが MindStella のセッションのペインへつないでいる
    test: test_normal
  - name: 正常シナリオ（進め方の文書・追加の MCP・プラグインを指定する）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: 指定
        description: テストの一時フォルダに置いた進め方の文書（配信元の ID と文書の ID）・追加の MCP の定義のファイル・`.claude-plugin/plugin.json` を持つプラグインのフォルダ
      - name: ワークスペースのフォルダ
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー（MindStella の API）
        participant CC as MindStella のセッション

        U->>LS: 起動のコマンド {フォルダ} 進め方の文書・追加の MCP・プラグインの引数
        LS->>SV: 指定を付けてワークスペースの作成を依頼する（POST /workspaces）
        LS->>SV: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
        SV->>CC: 追加の MCP（--mcp-config）・プラグイン（--plugin-dir）・進め方の文書の場所の環境変数を指定して起動する
      ```
    expected:
      - ワークスペースの設定に進め方の文書が、状態のフォルダに追加の MCP・プラグインが記録されている
      - Mock の MindStella のセッションが、`--mcp-config`・`--plugin-dir` と、進め方の文書の場所の環境変数を受け取っている
    test: test_normal_when_options_given
  - name: 正常シナリオ（MindStella のセッションが既にある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: 起動しているワークスペース
        description: 正常シナリオで作ったワークスペースで、MindStella のセッションが起動している
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー（MindStella の API）
        participant TM as tmux

        U->>LS: 起動のコマンド {フォルダ}
        LS->>SV: ワークスペースの作成を依頼する（POST /workspaces）
        SV-->>LS: 既に開いているワークスペースの ID
        LS->>SV: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
        SV-->>LS: 既にあるエラーと、起動中の MindStella のセッションの ID・tmux のペイン
        LS->>TM: 起動中の MindStella のセッションのペインへつなぐ
      ```
    expected:
      - MindStella のセッションは 1 つのままで、Mock の claude-balancer が 2 回目の `exec` を受けていない
      - 起動のコマンドが、起動中の MindStella のセッションのペインへつないでいる
    test: test_normal_when_session_exists
  - name: 正常シナリオ（古いコードの常駐サーバーが待ち受けている）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: 古いコードの常駐サーバー
        description: 'インストールしたプラグインと別のフォルダ（コミットの SHA の名前が違う）のサーバーが `MINDSTELLA_PORT` のポートで待ち受け、別のワークスペースのプレビューを配信している。`version.ini` の版は同じ'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー（古いコード）

        U->>LS: 起動のコマンド {フォルダ}
        LS->>SV: 待ち受けているか（版とプラグインのフォルダを尋ねる）
        SV-->>LS: 同じ版、違うプラグインのフォルダ
        LS-->>U: 古いコードで動いていることと、起動のコマンドで再起動する手順を示す
        LS->>SV: ワークスペースの作成を依頼する（POST /workspaces）
        LS->>SV: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
      ```
    expected:
      - 出力に、常駐サーバーが読み込んだプラグインのフォルダの名前とインストールしたフォルダの名前、起動のコマンドで再起動する手順がある
      - 常駐サーバーは再起動されず、別のワークスペースのプレビューの配信が止まっていない
      - ワークスペースと MindStella のセッションが作られている
    test: test_normal_when_old_server_running
  - name: 異常シナリオ（依存が足りない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ偽の Claude Code
      - name: 依存が足りない環境
        description: PyYAML・jsonschema・MCP の SDK を入れていない Python の仮想環境
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド

        U->>LS: 起動のコマンド {フォルダ}
        LS->>LS: 依存を確かめる
        LS-->>U: 足りないライブラリと、そろえるコマンドを示して止まる
      ```
    expected:
      - 起動のコマンドが 0 以外の終了コードで終わる
      - 出力に、足りないライブラリの名前と、そろえるコマンドがある
      - 常駐サーバーが起動しておらず、ワークスペースと MindStella のセッションが作られていない
    test: test_error_when_dependency_missing
  - name: 異常シナリオ（常駐サーバーを起動できない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: 使われているポート
        description: テストが先に `127.0.0.1` で待ち受けたポートを `MINDSTELLA_PORT` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー

        U->>LS: 起動のコマンド {フォルダ}
        LS->>SV: 待ち受けているか（MINDSTELLA_PORT で版を尋ねる）
        LS->>LS: ポートは開いているが mindstella の応答が無いので、ユニットを起動しない
        LS-->>U: 使われているポートと、MINDSTELLA_PORT で変える手順を示して止まる
      ```
    expected:
      - 起動のコマンドが 0 以外の終了コードで終わる
      - 出力に、使われているポートと `MINDSTELLA_PORT` がある
      - Mock の `systemctl --user` が mindstella のユニットの `start` を受けておらず、ワークスペースと MindStella のセッションが作られていない
    test: test_error_when_server_not_started
  - name: 異常シナリオ（tmux が無い）
    setup:
      - name: Mock
        description: 正常シナリオと同じ偽の Claude Code
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: tmux の無い PATH
        description: tmux を含まない PATH で起動のコマンドを叩く
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド

        U->>LS: 起動のコマンド {フォルダ}
        LS->>LS: tmux を探して見つからない
        LS-->>U: tmux を入れるよう示して止まる
      ```
    expected:
      - 起動のコマンドが 0 以外の終了コードで終わり、出力に tmux が無い旨がある
      - ワークスペースと MindStella のセッションが作られていない
    test: test_error_when_tmux_missing
  - name: 異常シナリオ（ワークスペースを作れない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: 許可するフォルダの外
        description: グローバルの設定のファイルの許可するフォルダ（`mindstella.allowed_dirs`）が指す一時フォルダの外のフォルダを渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー（MindStella の API）

        U->>LS: 起動のコマンド {フォルダ}
        LS->>SV: ワークスペースの作成を依頼する（POST /workspaces）
        SV-->>LS: 許可するフォルダの外のエラー
        LS-->>U: エラーの理由を示して止まる
      ```
    expected:
      - 起動のコマンドが 0 以外の終了コードで終わり、出力に許可するフォルダの外である旨がある
      - MindStella のセッションの作成を依頼しておらず、tmux にペインが立っていない
    test: test_error_when_workspace_rejected
  - name: 異常シナリオ（MindStella のセッションを作れない）
    setup:
      - name: Mock
        description: 正常シナリオと同じ。claude-balancer は全てのアカウントが利用の上限に達していて、`exec` がエラーで終わる
      - name: 依存が揃った環境
        description: 正常シナリオと同じ
      - name: ワークスペースのフォルダ
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant LS as 起動のコマンド
        participant SV as 常駐サーバー（MindStella の API）

        U->>LS: 起動のコマンド {フォルダ}
        LS->>SV: ワークスペースの作成を依頼する（POST /workspaces）
        LS->>SV: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
        SV-->>LS: 空いたアカウントが無いエラー
        LS-->>U: エラーの理由と画面の URL を示して止まる
      ```
    expected:
      - 起動のコマンドが 0 以外の終了コードで終わり、出力に空いたアカウントが無い旨と画面の URL がある
      - ワークスペースは開いたままで、tmux にペインが残っていない
    test: test_error_when_session_not_created
lead: 利用者が起動のコマンドにワークスペースのフォルダ（と任意の進め方の文書・追加の MCP・プラグイン）を渡すと、依存を確かめ、常駐サーバーが落ちていれば systemd --user で起動してから、外部のアプリと同じ MindStella の API でワークスペースと MindStella のセッションを作り、そのペインへつなぐ単一ユースケース。
issue: 67
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: コメントを送ったときに入力される MindStella のセッションで話し合いを始められる。依存が足りない・作れないときは何をすればよいかが分かる
trigger: 利用者が起動のコマンド（『起動スクリプトの登録』で登録した alias を含む）にワークスペースのフォルダを渡して叩く
preconditions:
  - プラグイン mindstella がインストールされている
  - systemd --user と tmux が使える
  - ワークスペースのフォルダが、設定で許可するフォルダの下にある
success_guarantee: ワークスペースの記録があり、MindStella のセッションが tmux のペインの中で起動して状態に登録され、起動のコマンドがそのペインへつないでいる。利用者は画面の URL を受け取っている。
minimal_guarantee: 依存が足りないとき・常駐サーバーを起動できないときは、ワークスペースと MindStella のセッションを作らずに、足りないものとそろえるコマンドを示して止まる。ワークスペースを作れない・MindStella のセッションを作れないときは、API が返したエラーの理由を示して止まる。待ち受けている常駐サーバーは、古いコードでも再起動しない。
frequency: 話し合いを始める・再開するたびに 1 回
priority: 高
refs:
  - SC-531-1#
  - SC-489-20#
notes:
  外部のアプリとの関係: 起動のコマンドは、単一ユースケース『外部のアプリから起動する』と同じ MindStella の API を呼ぶ。API の中の分岐（記録が既にある・クローズしたフォルダ・読めない指定など）は、そのシナリオで確かめる
  アカウント: MindStella のセッションのアカウントは claude-balancer が選ぶ（D-292）。claude-balancer が無い端末では、利用者の既定のアカウントで起動する
  E2E の範囲: 本物の Claude Code と systemd --user は使わず、偽のコマンドが受け取った引数と環境変数と、常駐サーバー・状態のフォルダ・tmux のペインを確かめる
test_file: tests/e2e/単一ユースケース/test_launch_script.py

id: SC-489-10
title: "プレビューを外から見る"
scenarios:
  - name: 正常シナリオ（常駐サーバーのポートを外のホスト名で開く）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねるプレビューの URL の取得を再生する。外の入口の代わりに、外のホスト名の `Host` と `Origin` を付けて常駐サーバーのポートへ渡す転送を置き、その転送を通して実際のブラウザで開く
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 外から参照する設定
        description: 常駐サーバーの待ち受けのポート（`MINDSTELLA_PORT`）と、許可するホスト名。常駐サーバーを起動する環境で渡す
        notes: ポートはテストごとに選んだ空きポート、ホスト名は `preview.example.test`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant GW as 外の入口
        participant P as プレビュー（ブラウザ）

        U->>CC: 記録を見たい
        CC->>SV: プレビューの URL
        SV-->>CC: 127.0.0.1 の常駐サーバーのポートのこのワークスペースの画面の URL
        CC-->>U: URL を示す
        U->>P: 外のホスト名の URL を開く
        P->>GW: 外のホスト名で要求する
        GW->>SV: 常駐サーバーのポートへ渡す（Host は外のホスト名）
        SV-->>P: 画面とワークスペースの記録
        P-->>U: 概要
        U->>P: D-1 にコメントを書いて送信する
        P->>GW: 送信（Origin は外のホスト名）
        GW->>SV: 送信を渡す
        SV-->>P: 受け付けた
      ```
    expected:
      - 画面を配る待ち受けが `127.0.0.1` の、常駐サーバーのポート（`MINDSTELLA_PORT`）だけである
      - 外のホスト名で開いた画面に D-1 がある
      - 送信したコメントが、ワークスペースのスレッドの最初の書き込みに残る
    test: test_normal_when_opened_by_external_host
  - name: 正常シナリオ（フックで外の入口へ登録と削除をする）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねるプレビューの URL の取得を再生し、MCP のクライアントの接続を閉じた後に常駐サーバーを止める
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 外から参照する設定
        description: 許可するホスト名と、起動時と終了時のフック。常駐サーバーを起動する環境で渡す
        notes: フックは、受け取った引数をテストの一時フォルダのファイルへ 1 行ずつ追記するコマンド
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant HK as フック

        U->>SV: 常駐サーバーを起動する
        SV->>SV: 作成済みのワークスペースを常駐サーバーのポートで配り始める
        SV->>HK: 起動時のフック（常駐サーバーのポート・ワークスペースの名前・画面のパス）
        U->>CC: 記録を見たい
        CC->>SV: プレビューの URL
        SV-->>CC: 127.0.0.1 の URL
        U->>CC: Claude Code を閉じる
        U->>SV: 常駐サーバーを止める
        SV->>HK: 終了時のフック（常駐サーバーのポート・ワークスペースの名前・画面のパス）
        SV->>SV: 待ち受けを止める
      ```
    expected:
      - 起動時のフックが 1 回、常駐サーバーのポートとワークスペースのフォルダの名前と、そのワークスペースの画面のパスを受け取って呼ばれている（プレビューの URL の取得では呼ばれない）
      - Claude Code を閉じた時点では、終了時のフックが呼ばれていない
      - 終了時のフックが 1 回、起動時と同じポート・ワークスペースの名前・画面のパスを受け取って呼ばれている
      - 常駐サーバーのプロセスが残っていない
    test: test_normal_when_hooks_set
lead: 利用者が、待ち受けのポート・許可するホスト名・起動と終了のフックを設定し、トンネル・リバースプロキシなど外の入口の内側で、端末の外から開いたプレビューで記録を読み、コメントを送信する単一ユースケース。
issue: 138
primary_actor: 利用者
trigger: 利用者が、外の入口のホスト名でプレビューを開く
preconditions:
  - ワークスペースが作成済みである
  - mindstella の MCP のツールが使える
  - 外の入口（トンネル・リバースプロキシ）が、外のホスト名への要求を `127.0.0.1` の常駐サーバーのポートへ渡す。外から開く画面の認証は外の入口が持つ
success_guarantee: 外の入口のホスト名で開いた画面に今の記録が出て、コメントを送信できる。設定したフックが、ワークスペースを配り始めたときと常駐サーバーを止めるときに、常駐サーバーのポート・ワークスペースの名前・画面のパスを受け取って呼ばれる。
minimal_guarantee: 常駐サーバーは `127.0.0.1` だけで待ち受ける。許可していないホスト名からの要求には画面も記録も返さず、書き込みも受けない。
frequency: 話し合いを始めるたびに 1 回
priority: 中
notes:
  E2E の範囲: 外の入口そのもの（トンネル・リバースプロキシのサービス）と、その認証は確かめない。許可していないホスト名と `Origin` を断ることは、インターフェース定義の結合テストが確かめる
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を追加する
test_file: tests/e2e/単一ユースケース/test_preview_external_access.py

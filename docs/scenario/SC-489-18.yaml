id: SC-489-18
title: "前回からの差分を見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 検討事項 D-1〜D-5 とタスク T-1。D-3 は状態 `未決定` で、背景 `lead` に改行で区切った文を 2 つ持ち、本文に段落 3 つと mermaid の flowchart を 1 つ持つ
        notes: 記録は `commit`（説明「記録を作る」）で 1 つのまとまりにする
      - name: 書き換え
        description: MCP のツールで、D-3 の状態を `要見直し` にし、背景の 2 つ目の文の中の語を 1 つ書き換え（改行は残す）、本文の 1 つ目の段落の中の語を 1 つ書き換えて 3 つ目の段落を削除し、図のノードのラベルを 1 つ変える。検討事項 D-6 を追加する。`commit`（説明「D-3 を見直す」）で 1 つのまとまりにする
        notes: D-3 は変更履歴を 1 回分持ち、D-6 は変更履歴を持たない。T-1 は書き換えない。まとまり「記録を作る」「D-3 を見直す」はどちらも差分の表示で開いていないため未読
      - name: 配信
        description: 記録を配っているサーバー。差分の表示は出していない（既定）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 新しいタブでプレビューを開く
        P-->>U: 概要（差分の表示なし）と、変更履歴のボタンの未読の件数
        U->>P: 「変更履歴」を押す
        P-->>U: 先頭の「最新」と、まとまりの時系列の一覧（未読のマーカーつき）
        U->>P: 「D-3 を見直す」を選ぶ
        P-->>U: 検討事項のタブにマーカー
        U->>P: 検討事項の表を開く
        P-->>U: D-3 に変更、D-6 に新規のマーカー
        U->>P: D-3 を押す
        P-->>U: 状態・背景・本文・図の変更を出した詳細パネル
        U->>P: 本文の「原文の差分」に切り替える
        P-->>U: 本文の原文の行ごとの差分
        U->>P: 本文を描いた差分に戻し、図の Raw を押す
        P-->>U: 記法の行ごとの差分
        U->>P: ページを再読み込みする
        P-->>U: 同じ時点の差分の表示
        U->>P: 変更履歴から「最新」を選ぶ
        P-->>U: マーカーと差分のない画面
      ```
    expected:
      - 差分の表示に入る前は、どの項目にもタブにもマーカーが無く、トップバーの変更履歴のボタンに未読の件数 2 が出る
      - 変更履歴の一覧の先頭に「最新」、その次に「今回の差分」があり、その下にまとまり「D-3 を見直す」「記録を作る」が新しい順に日時と説明つきで並び、どちらにも未読のマーカーが付く。「前回開いてから」の行が無い
      - 「D-3 を見直す」を選ぶと、検討事項のタブにマーカーが付き、タスクのタブには付かない。タブの件数は選ぶ前と同じ
      - 差分の表示の間、トップバーに差分の表示をやめるボタンが無い
      - 検討事項の表で、D-3 に変更のマーカー（●）、D-6 に新規のマーカー（+）が付き、文言の札は出ない。D-1・D-2・D-4・D-5 にはマーカーが無い
      - D-3 の詳細パネルで、状態の前の値 `未決定` と今の値 `要見直し` を見分けられる
      - D-3 の背景の前の値と今の値で、書き換えた語にだけ濃い面（前の値は濃い赤、今の値は濃い緑）が付き、変えていない語には濃い面が付かない
      - D-3 の背景の前の値と今の値が、どちらも書かれた改行の位置で改行されて出る
      - D-3 の本文が Markdown として描かれたまま、書き換えた段落に追加したマーカー、削除した段落に削除したマーカーが付き、変えていない段落にはマーカーが無い
      - 本文の「原文の差分」に切り替えると、書き換えた段落の原文の行が削除した行と追加した行で出て、書き換えた語にだけ濃い面（削除した行は濃い赤、追加した行は濃い緑）が付き、同じ行の変えていない語には濃い面が付かない。「原文の差分」の中に「変更表示」のボタンと前と後の時点を選ぶ欄が無い
      - D-3 の図で、ラベルを変えたノードに変わった色が付き、ほかのノードと辺には付かない
      - 図の Raw で、変えた行が削除した行と追加した行として出て、変えたラベルの語にだけ濃い面が付く
      - 再読み込みした後も「D-3 を見直す」の差分の表示のままで、D-3 と D-6 のマーカーが残る
      - 「D-3 を見直す」は既読になり、変更履歴の一覧で未読のマーカーが消え、トップバーの変更履歴のボタンの未読の件数が 1（「記録を作る」）になる
      - 「最新」を選ぶと、マーカーと差分が消え、D-3 の本文は今の内容だけになる
      - ワークスペースの YAML と本文の中身が、開く前と同じ
    test: test_normal
  - name: 正常シナリオ（古いまとまりを選ぶ）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 本文を持つ資料 A-1 と検討事項 D-3
      - name: 書き換え
        description: MCP のツールで A-1 の本文を書き換えて `commit`（説明「仕様書を直す」）し、その後 D-3 の本文を書き換えて `commit`（説明「検討事項を直す」）する
        notes: まとまりが 2 つでき、それぞれで変わった項目が違う
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 「変更履歴」を押す
        P-->>U: まとまりの一覧
        U->>P: 「仕様書を直す」を選ぶ
        P-->>U: A-1 に変更のマーカー
        U->>P: A-1 を押す
        P-->>U: そのまとまりの前後の本文の差分
      ```
    expected:
      - 一覧に「検討事項を直す」「仕様書を直す」が新しい順に、日時と変わった項目の数つきで並ぶ
      - 「仕様書を直す」を選ぶと、資料のタブと A-1 にマーカーが付き、検討事項のタブと D-3 には付かない
      - A-1 の詳細パネルに、そのまとまりの前後の本文の追加した・削除したマーカーが出る
    test: test_normal_when_older_change_set_selected
  - name: 正常シナリオ（まだまとめていない変更）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 本文を持つ検討事項 D-1・D-3
      - name: 書き換え
        description: MCP のツールで D-3 の本文を書き換え、`commit` を呼ばない
        notes: D-3 の書き換えはまだまとめていない変更になる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 「変更履歴」を押す
        P-->>U: 先頭に「まだまとめていない変更」を含む一覧
        U->>P: 「まだまとめていない変更」を選ぶ
        P-->>U: D-3 に変更のマーカー
      ```
    expected:
      - 一覧の先頭に「まだまとめていない変更」があり、変わった項目の数が 1
      - 選ぶと D-3 に変更のマーカーが付き、D-1 には付かない
      - D-3 の詳細パネルに、書き換えた本文の差分が出る
    test: test_normal_when_pending_changes
  - name: 正常シナリオ（図の種類が色付けの対象外）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 本文に mermaid の gantt を 1 つ持つ資料 A-1
      - name: 書き換え
        description: MCP のツールで、A-1 の gantt のタスク 1 本の期間を変えて `commit` する
        notes: gantt はノード・辺に色を付ける対象（flowchart・sequenceDiagram・classDiagram・erDiagram・stateDiagram-v2）に入らない
      - name: 配信
        description: 記録を配っているサーバー。変更履歴からそのまとまりを選んである
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: A-1 の詳細パネルを開く
        P-->>U: 変わった図の枠に色
        U->>P: 図の Raw を押す
        P-->>U: 記法の行ごとの差分
      ```
    expected:
      - A-1 の図の枠に変わった色が付き、図の中の要素には色が付かない
      - 図の Raw で、期間を変えた行が削除した行と追加した行として出る
    test: test_normal_when_diagram_type_not_colored
  - name: 正常シナリオ（開いたまま書き換わる）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、端末の保存領域が空のブラウザでプレビューを開いたまま、MCP のクライアントで project-index の `write_docs` と MindStella の `commit` を呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 本文を持つ検討事項 D-1・D-3。作った後に `commit`（説明「記録を作る」）し、プレビューの変更履歴で「記録を作る」を選んで差分の表示で開いてから「最新」に戻す
        notes: 「記録を作る」は既読で、未読のまとまりは無い
      - name: 開いている画面
        description: 差分の表示を出していない検討事項の表。トップバーの変更履歴のボタンに未読の件数が出ていない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant PI as project-index
        participant P as プレビュー（ブラウザ）
        actor U as 利用者

        CC->>PI: write_docs（D-3 の本文を書き換える）と commit（説明「検討事項を直す」）
        SV-->>P: 書き換えを知らせる
        P->>SV: 記録を再読み込みする
        P-->>U: 変更履歴のボタンに未読の件数を出した検討事項の表
        U->>P: 「変更履歴」を押す
        P-->>U: 先頭の「最新」の下に、未読のマーカーを付けた「検討事項を直す」
        U->>P: 「検討事項を直す」を選び、D-3 を押す
        P-->>U: 本文の変更を出した詳細パネル
      ```
    expected:
      - 再読み込みの操作をせずに、トップバーの変更履歴のボタンに未読の件数 1 が出て、開いていた画面と URL の search params は変わらない
      - 変更履歴の一覧で、「検討事項を直す」が「記録を作る」より上に未読のマーカーつきで並び、「記録を作る」には未読のマーカーが無い
      - 「検討事項を直す」を選ぶと、D-3 に変更のマーカーが付き、D-1 には付かない。詳細パネルで、書き換えた本文に追加した・削除したマーカーがある
      - 「検討事項を直す」を選んだ後、トップバーの変更履歴のボタンに未読の件数が出ない
    test: test_normal_when_rewritten_while_open
  - name: 正常シナリオ（すべて既読にする）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、端末の保存領域が空のブラウザでプレビューを開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 検討事項 D-1・D-3。D-1 を追加して `commit`（説明「D-1 を足す」）し、D-3 を追加して `commit`（説明「D-3 を足す」）し、D-3 の本文を書き換えて `commit` を呼ばない
        notes: まとまりは 2 つで、どちらも未読。D-3 の本文の書き換えはまだまとめていない変更
      - name: 配信
        description: 記録を配っているサーバー。差分の表示は出していない（既定）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューを開く
        P-->>U: 変更履歴のボタンの未読の件数
        U->>P: 「変更履歴」を押す
        P-->>U: 未読のマーカーを付けたまとまりの一覧と「すべて既読にする」
        U->>P: 「すべて既読にする」を押す
        P-->>U: 未読のマーカーの無い一覧
        U->>P: モーダルを閉じ、ページを再読み込みする
        P-->>U: 未読の件数の無い変更履歴のボタン
      ```
    expected:
      - 開いた直後、トップバーの変更履歴のボタンに未読の件数 2 が出る（まだまとめていない変更は数えない）
      - 変更履歴のモーダルの一覧の上に「すべて既読にする」があり、「D-3 を足す」「D-1 を足す」に未読のマーカーが付き、「最新」「まだまとめていない変更」には付かない
      - 「すべて既読にする」を押すと、一覧の全てのまとまりの未読のマーカーが消え、差分の表示は出ていないまま
      - 再読み込みした後も、トップバーの変更履歴のボタンに未読の件数が出ず、一覧のまとまりに未読のマーカーが無い
      - ワークスペースの YAML と本文の中身が、開く前と同じ
    test: test_normal_when_mark_all_read
  - name: 正常シナリオ（保持する回数が 0）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 保持する回数を 0 にしたワークスペース
      - name: 記録
        description: 検討事項 D-1〜D-5。D-3 だけが本文を持つ
      - name: 書き換え
        description: MCP のツールで D-3 の本文を書き換え、検討事項 D-6 を追加して `commit`（説明「D-3 を直し、D-6 を足す」）する
        notes: 保持する回数が 0 のため、D-3 は変更履歴を持たない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューを開き、変更履歴から「D-3 を直し、D-6 を足す」を選ぶ
        P-->>U: 検討事項の表
        U->>P: D-3 を押す
        P-->>U: 今の内容だけの詳細パネル
      ```
    expected:
      - 検討事項の表で D-6 に新規のマーカーが付き、D-3 には変更のマーカーが付かない。D-1・D-2・D-4・D-5 にもマーカーが付かない
      - D-3 の詳細パネルに差分のマーカーが無く、今の本文だけが出る
    test: test_normal_when_history_limit_zero
  - name: 正常シナリオ（前後を組み立てられない古いまとまり）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `history_limit` を 1 にしたワークスペース
      - name: 記録
        description: 本文を持つ検討事項 D-3
      - name: 書き換え
        description: MCP のツールで D-3 の本文を書き換えて `commit`（説明「1 回目」）し、もう一度 D-3 の本文を書き換えて `commit`（説明「2 回目」）する
        notes: 保持する回数が 1 のため、「1 回目」の D-3 の変更履歴は消えている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 変更履歴から「1 回目」を選ぶ
        P-->>U: D-3 に変更のマーカー
        U->>P: D-3 を押す
        P-->>U: 今の本文と、そのまとまりの差分を出せない旨
      ```
    expected:
      - 「1 回目」を選ぶと D-3 に変更のマーカーが付く
      - D-3 の詳細パネルは今の本文を出し、そのまとまりの差分を出せない旨が出る
    test: test_normal_when_change_set_history_trimmed
  - name: 異常シナリオ（前のバージョンを組み立てられない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: MCP のツールで状態と本文を書き換えて `commit` し、変更履歴を 1 回分持つ検討事項 D-3
      - name: 手での書き換え
        description: その後、`docs/D-3.mark.md` の全ての行をツールを通さずに手で書き換える
        notes: 変更履歴の本文の差分が、今の本文に当たらない
      - name: 配信
        description: 記録を配っているサーバー。変更履歴からそのまとまりを選んである
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: D-3 の詳細パネルを開く
        P-->>U: 今の本文と、本文の差分を出せない旨
      ```
    expected:
      - D-3 の本文は今の内容が Markdown として描かれ、差分のマーカーが無い
      - 本文の差分を出せない旨が出る
      - 状態の前の値と今の値は、本文と関係なく見分けられる
    test: test_error_when_previous_version_unavailable
  - name: 正常シナリオ（削除した項目と取り下げた項目）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: メモ N-1・N-2（N-2 は N-1 と同じ中身を重ねて追加した重複）と調査 R-1・R-2
      - name: 書き換え
        description: 'N-2 を project-index の `delete_docs` で削除し、R-1 を `write_docs` で `withdrawn: true` と `reason`「別の調査で足りた」にして `commit`（説明「重複と不要な調査を片付ける」）する'
        notes: まとまりは `changed` に R-1、`removed` に N-2（種類 `note`・削除したときのタイトル）を持つ。N-1・R-2 は書き換えない
      - name: 配信
        description: 記録を配っているサーバー。差分の表示は出していない（既定）
    flow: |-

        P-->>U: 今回の差分の範囲が空になり、マーカーが消えた画面
      ```

      <!-- /map -->
    expected:
      - 変更履歴の一覧の「最新」の次に「今回の差分」が並び、変わった項目の数が 3
      - 「今回の差分」を選ぶと D-1・D-2・D-3 に変更のマーカーが付き、外部の変更のまとまり（D-3）とまだまとめていない変更（D-1 の状態）も 1 つの差分に入る
      - D-2 の詳細パネルに、始まりの時点の本文との差分が出る
      - まとめて送信したとき、まだまとめていない変更（D-1 の状態）が始まりより前の 1 つのまとまりになり、変更履歴の一覧に並ぶ。送信した後、同じタブを開いたままで今回の差分の範囲が送信の後になり、D-1・D-2・D-3 のマーカーが消え、変更履歴の一覧の「今回の差分」の変わった項目の数が 0
      - ワークスペースの YAML と本文の中身が、送信したスレッドの書き込みのほかは開く前と同じ
    test: test_normal_when_since_last_write_selected
  - name: 正常シナリオ（利用者の書き込みがまだ無い）
    setup:
      - name: Mock
        description: なし（MCP サーバーを起動し、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 検討事項 D-1 を追加して `commit`（説明「D-1 を追加する」）し、D-2 を追加して `commit`（説明「D-2 を追加する」）する
        notes: 利用者はまだコメントも返信も送信していない
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 「変更履歴」を押し、「今回の差分」を選ぶ
        P-->>U: 最初のまとまりからの全ての変更のマーカー
      ```

      <!-- /map -->
    expected:
      - 変更履歴の一覧の「最新」の次に「今回の差分」が並び、変わった項目の数が 2
      - 「今回の差分」を選ぶと、D-1・D-2 に新規のマーカーが付く
    test: test_normal_when_no_user_write_yet
lead: 利用者が、プレビューの変更履歴から書き換えのまとまりを選んで差分の表示にし、そのまとまりで追加された・変わった・削除された項目をマーカーで見つけ、詳細パネルで本文・図・Raw・キーの変更を読む単一ユースケース。
issue: 68
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: AI が書き換えた資料などのどこが変わったかを、本文を読み比べずに素早く読める
trigger: 利用者が、AI が記録を書き換えた後に、何が変わったかを確かめたくなる
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
  - 書き換えた項目が、保持する回数の分だけ変更履歴を持ち、その書き換えが `commit` でまとまりになっている
success_guarantee: |
  変更履歴から選んだまとまりで追加された項目に新規、変わった項目に変更のマーカーが付き、削除した項目がその種類の画面に削除したマーカーで出て、マーカーの付いた項目か削除した項目を持つタブにマーカーが付く。取り下げた項目には取り下げのマーカーが付く。詳細パネルで、そのまとまりの前後の本文・図・Raw・キーの変更を読め、変わった箇所のマーカーを並べたミニマップからその箇所へ飛べる。本文の差分は、インラインと、選んだ時点と今の本文を左右に並べる表示とで切り替えて読める。選んだ時点は URL の search params に残り、その URL を開くと端末の保存領域を持たないブラウザでも同じ時点の差分の表示で開く。詳細の本文の中のまとまりを指すリンク（`[文言](#diff=V-1)`）を押すと、変更履歴でそのまとまりを選んだときと同じ差分の表示に切り替わる。差分の表示に入る・抜けるだけではワークスペースの記録を書き換えない。差分の表示でまだ開いていないまとまりは変更履歴の一覧で未読のマーカーが付き、トップバーの変更履歴のボタンに未読の件数が出る。開いている間に AI が `commit` すると、再読み込みの操作をせずに未読の件数が増える。
minimal_guarantee: 前後を組み立てられない項目でも、今の内容は読める。差分の表示から抜ければ、差分の表示に入る前と同じ画面に戻る。
frequency: AI が記録を書き換えるたび
priority: 高
notes:
  抜ける操作: 'フローの「差分の表示から抜ける」は、変更履歴のモーダルで「最新」を選ぶ操作'
  検討事項の案: セットアップの検討事項は、単一ユースケース『記録の追加と更新』の補足「検討事項の案」の構造で作る
  未読: 差分の表示でまだ開いていないまとまりを未読にし、変更履歴の一覧の行の未読のマーカーと、トップバーの変更履歴のボタンの件数に出す。まだまとめていない変更は未読に数えない。既読の置き場所はデータ設計で決める
test_file: tests/e2e/単一ユースケース/test_diff_view.py

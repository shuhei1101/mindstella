        APP->>API: 一覧を依頼する（GET /workspaces）
        API->>WSM: ワークスペースの一覧を依頼する
        WSM->>WSM: 状態のフォルダの ID の一覧にある配信元の行から、クローズしていないものを選ぶ
        WSM-->>API: ID・題名・画面の URL・クローズ済みかの一覧
        API-->>APP: 一覧
      ```
    expected:
      - 外部のアプリが、クローズしていない 2 つのワークスペースだけを、ID・題名・画面の URL・クローズ済みでないことと一緒に受け取っている
    test: test_normal_when_list
  - name: 正常シナリオ（クローズしたものを含める一覧）
    setup:
      - name: Mock
        description: なし（Claude Code を起動しない）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: クローズしていないワークスペースが 2 つ、クローズしたワークスペースが 1 つある
      - name: 依頼
        description: クローズしたものを含める指定がある
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant API as MindStella の API
        participant WSM as ワークスペースの管理

        APP->>API: クローズしたものを含める一覧を依頼する（GET /workspaces）
        API->>WSM: ワークスペースの一覧を依頼する
        WSM-->>API: ID・題名・画面の URL・クローズ済みかの一覧
        API-->>APP: 一覧
      ```
    expected:
      - 外部のアプリが、クローズ済みかを添えた 3 つのワークスペースを受け取っている
    test: test_normal_when_list_with_closed
  - name: 異常シナリオ（知らないワークスペースの ID）
    setup:
      - name: Mock
        description: なし（Claude Code を起動しない）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: 依頼
        description: 状態のフォルダのワークスペースの ID の一覧に無い ID
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant API as MindStella の API
        participant WSM as ワークスペースの管理

        APP->>API: 状態の取得を依頼する（GET /workspaces/{id}）
        API->>WSM: ワークスペースの状態を依頼する
        WSM-->>API: ワークスペースが無い
        API-->>APP: ワークスペースが無いエラー
      ```
    expected:
      - 外部のアプリが、ワークスペースが無いエラーを受け取っている
    test: test_error_when_workspace_unknown
    notes:
      削除したワークスペース: 削除したワークスペースも同じエラーにする
  - name: 異常シナリオ（記録のフォルダが無い）
    setup:
      - name: Mock
        description: Claude Code のセッション（起動している）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 配信元の行はあるが、記録のフォルダ（`.mindstella/`）が削除されている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant API as MindStella の API
        participant WSM as ワークスペースの管理
        participant MGR as セッションの管理

        APP->>API: 状態の取得を依頼する（GET /workspaces/{id}）
        API->>WSM: ワークスペースの状態を依頼する
        WSM-->>API: 記録のフォルダが無い
        API->>MGR: MindStella のセッションの状態を依頼する
        MGR-->>API: MindStella のセッションの ID・起動中
        API-->>APP: MindStella のセッションの状態と、記録のフォルダが無いことの警告
      ```
    expected:
      - 外部のアプリが、MindStella のセッションの状態と、フォルダのパスを含む警告を受け取っている
      - 配信元の行が残っている
    test: test_error_when_records_missing
  - name: 異常シナリオ（グローバルの設定を読めない）
    setup:
      - name: Mock
        description: Claude Code のセッション（起動している）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: MindStella のセッションが起動した後に、グローバルの設定のファイルを YAML として読めない内容に書き換えた
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant API as MindStella の API
        participant WSM as ワークスペースの管理
        participant MGR as セッションの管理

        APP->>API: 状態の取得を依頼する（GET /workspaces/{id}）
        API->>WSM: ワークスペースの状態を依頼する
        WSM-->>API: 画面の URL。未読の 2 つの数・最後の更新・クローズ済みかは分からない
        API->>MGR: MindStella のセッションの状態を依頼する
        MGR-->>API: MindStella のセッションの ID・起動中
        API-->>APP: MindStella のセッションの状態と、分からない項目の警告
      ```
    expected:
      - 外部のアプリが、画面の URL と MindStella のセッションの状態と、未読の数・最後の更新・クローズ済みかが分からないことの警告を受け取っている
    test: test_error_when_settings_unreadable
    notes:
      分かる項目: ID の一覧は状態のフォルダにあるので、ワークスペースであることは分かる。記録のフォルダの場所とクローズ済みかは配信元の行にあるので、読めない間は分からない

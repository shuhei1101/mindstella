notes:
  ワークスペースの状態: |-
    | 状態 | 意味 |
    | --- | --- |
    | 進行中 | 話し合いを続けている。MindStella のセッションが無くても（落ちた）進行中 |
    | 停止 | API で MindStella のセッションの停止を依頼した後（クローズ待ち） |
    | 完了 | クローズした |
  使い道: 停止の完了の確認（MindStella のセッションの一覧で確認する）、活動の期限の判断、再度開くかの判断、追加の MCP・プラグインの記録が無いことに気づいて設定の書き換えで再指定する判断に使用する
  未読の数: 利用者が読んでいない AI の書き込みと、MindStella のセッションが取り込んでいない利用者のコメントの 2 つの数で返却する
  クローズの判定: 'ワークスペースの管理は、状態のフォルダのワークスペースの ID の一覧でワークスペースかを判定し、グローバルの設定のファイルの配信元の行を直接参照して記録のフォルダの場所を取得し、`outside_read: false` ならクローズ済みとする。project-index は呼ばない'
  落ちたセッションの判定: 状態に起動中とあっても、tmux のペインとプロセスの両方が合わなければ、落ちていると返却する。状態の取得と一覧は状態を書き換えず、『停止の通知』も呼ばない
  インターフェース定義で決めること: 返却のキーの名前と、一覧でクローズしたワークスペースを含める指定のキー
  E2E の範囲: MindStella のセッションのエージェントは Mock にする
  スコープ外: '画面への状態の表示は #586、再オープンと削除は #523 で扱う。無操作の上限での停止は利用者の判断で取りやめた（#521）'
  画面の URL: ホームの設定に画面の公開 URL の基底があれば、返却する画面の URL はその基底にワークスペースのプレビューのパス（`/w/{workspace}/`）を付けた URL にする（単一ユースケース『作業の完了を通知する』の通知の URL と同じ）。無ければ `127.0.0.1` の URL にする

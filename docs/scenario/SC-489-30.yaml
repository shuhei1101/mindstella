id: SC-489-30
title: "記録の使い分け"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねるタグの集計（`search_docs` の `group_by`）・`next_id`・`write_docs`・`commit` を、決めた引数で順に再生する
        notes: '-'
      - name: 作成済みのワークスペース
        description: 検討事項を持たず、タグ `topic:保存` を持つメモ N-1 だけを持つワークスペース
        notes: '-'
      - name: 再生する書き込み
        description: 決め事を持つ検討事項 D-1（決定済み。案 A・B を持ち、A を採用）、D-1 を `parent` の種類の `related` で指す派生の検討事項 D-2（未決定。案 A・B を持ち、A に推奨のマーカー）、質問の形状にならない D-3（未整理。案を持たない）、D-2 を進めるタスク T-1、会話ログ L-1 を、1 回の `write_docs` で渡す
        notes: どの項目も `target`・`category`・`phase` を持たない。D-2 の `parent` と T-1 の `for` の種類の `related` は、同じ呼び出しで先に追加する項目を指す。D-1・D-2・T-1 は使われているタグ `topic:保存` を主題として、D-3 は `topic:保存` と、同じ概念のタグが使われていない新しい話題のタグ `topic:通知` を持ち、中心に扱う `topic:通知` だけを主題にする。T-1 は D-2 の決定を待つため状態 `保留` で、`reason` に着手できる条件（D-2 が決定済みになる）を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（決め事を含む）
        CC->>SV: タグの一覧を出す
        SV-->>CC: 使われているタグと件数
        CC->>CC: 記録の種類に振り分け、付ける条件から話題のタグを決め（単語まで分けて facet つきで名付け、同じ概念の言い方・活用の違いの使われているタグがあれば使い回し、無ければ新しいタグを付ける）、その項目が中心に扱う話題のタグを主題にし、決める内容ごとに検討事項を分け（1 件に 1 つの質問）、未整理を除く検討事項ごとに案と推奨を書く
        CC->>PI: write_docs（案を持つ検討事項・派生の検討事項・未整理・タスク・会話ログ）
        PI->>WS: スキーマと突き合わせて書く
        SV-->>CC: 追加した項目
        CC->>SV: commit（取り込んだ内容の一言の説明）
        SV->>WS: まとまりを書く
      ```
    expected:
      - D-1 が決定済みで `answer` を持つ
      - 'D-1 が案を持ち、A だけが `adopted: true` である'
      - 'D-2 が `related: [{to: D-1, type: parent}]` と案を持ち、未決定で、案 A だけが推奨のマーカーを持つ'
      - D-3 が未整理で、案を持たない
      - 'T-1 が `related: [{to: D-2, type: for}]` を持ち、保留で、`reason` に着手できる条件を持つ'
      - 会話ログ L-1 がある
      - 追加した全ての項目が `target`・`category`・`phase` を持たない
      - D-3 がタグ `topic:保存`・`topic:通知` を持ち、`config.yaml` がタグのキー（`tags`）を持たない
      - D-1・D-2・T-1 の `topic:保存` と D-3 の `topic:通知` が主題で、D-3 の `topic:保存` が主題でない
      - 取り込みの前のタグの一覧が `topic:保存`（1 件）を返し、取り込んだ後のタグの一覧が `topic:保存`（5 件）と `topic:通知`（1 件）を返す
      - 追加した D-1・D-2・D-3・T-1・L-1 が 1 つのまとまりに属し、そのまとまりが説明を持つ。`pending` が空を返す
      - 点検が問題を 0 件で返す
    test: test_normal
  - name: 正常シナリオ（保留・解除・中止）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs` を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 未決定の D-1・保留の D-2（どちらも案 A・B を持つ）・保留のタスク T-1 を持つ
      - name: 再生する書き込み
        description: D-1 を保留に、D-2 を未決定に戻し、T-1 を中止にする。それぞれ `reason` を持たせ、会話ログと一緒に 1 回の `write_docs` で渡す
        notes: D-1 を保留にするのは、利用者が後回しを指示したため。利用者の回答待ちの検討事項は保留にしない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（後回し・再開・やめる）
        CC->>PI: write_docs（D-1 を保留、D-2 を未決定、T-1 を中止、会話ログを追加する）
        PI->>WS: 書く
      ```
    expected:
      - D-1 が保留で `reason` を持つ
      - D-2 が未決定である
      - T-1 が中止で `reason` を持つ
      - 会話ログが 1 件追加されている
    notes:
      E2E: 持たない。状態と `reason` を修正するのは `write_docs` だけで、既存の『記録の追加と更新』の『正常シナリオ』が確かめる
  - name: 正常シナリオ（図や文書を資料に残す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs`を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 再生する書き込み
        description: '会話で出した Mermaid の図を本文にした資料 A-1（`kind`: 図、`related: [{to: D-1, type: see_also}]`、エイリアス・説明を持つ）と会話ログを、1 回の `write_docs` で渡す'
        notes: 'A-1 はタイトル `画面遷移図`、`aliases: [画面遷移, 遷移図]`、`description: ログインから設定までの画面の移り方`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言
        CC->>CC: mdmark の点検で、A-1 の本文を描いたときの警告が無いことを確認する
        CC->>PI: write_docs（資料 A-1、本文は Markdown・会話ログ）
        PI->>WS: docs.yaml と docs/ の本文と logs.yaml を書く
      ```
    expected:
      - '資料 A-1 が `kind: 図` と `related: [{to: D-1, type: see_also}]` を持つ'
      - 資料 A-1 が渡したエイリアス（`画面遷移`・`遷移図`）と説明を持つ
      - '`docs/` に A-1 の本文の Markdown がある'
      - '`check` が YAML と Markdown のずれを 0 件で返す'
    test: test_normal_when_diagram_kept_as_doc
  - name: 正常シナリオ（脱線した質問）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs` を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: タスクを持たない
      - name: 再生する書き込み
        description: 言葉の意味を尋ねた質問は用語集 G-1、それ以外の脱線はメモ N-1（タグ `topic:脱線`。調べた経緯を `body_markdown` で本文にする）。どちらも会話ログと一緒に 1 回の `write_docs` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー

        U->>CC: 「○○って何？」
        CC-->>U: スレッドで回答する
        CC->>PI: write_docs（用語集 G-1 かメモ N-1・会話ログ）
      ```
    expected:
      - 用語集 G-1 が `meaning` を持つ
      - メモ N-1 がタグ `topic:脱線` を持つ
      - メモ N-1 が本文を持ち、`docs/` にその Markdown がある
      - タスクが 0 件のままである
    test: test_normal_when_off_topic_question
  - name: 正常シナリオ（タスクの成果を資料にする）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs` を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 と、D-1 を進める進行中の作業のタスク T-1 を持つ
      - name: 再生する書き込み
        description: 'T-1 で作った画面の一覧を本文にした資料 A-1 を追加し、T-1 を `related: [{to: A-1, type: see_also}]`・完了・`result` を持つように更新し、会話ログを追加する。この 3 つを 1 回の `write_docs` で渡す'
        notes: T-1 の `related` は、同じ呼び出しで先に追加する A-1 を指す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（画面の一覧ができた）
        CC->>CC: T-1 の成果と資料が 1 対 1 で揃っているかを確かめる
        CC->>PI: write_docs（資料 A-1 を追加する・T-1 を related: A-1・完了にする・会話ログを追加する）
        PI->>WS: docs.yaml・docs/ の本文・tasks.yaml・logs.yaml を書く
      ```
    expected:
      - T-1 が完了で、`related` に A-1 を持つ
      - '資料 A-1 が `deliverable` を持たず、`docs/` に本文がある'
      - '`config.yaml` が呼ぶ前と同じである'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_task_output_kept_as_doc
  - name: 正常シナリオ（誤って追加した項目を削除する）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる書き込みと削除するツール・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: '検討事項 D-1・D-2 と、D-2 を削除してよいかを聞いた検討事項 D-3（案 A「削除する」・B「削除しない」。利用者が A を採用して決定済み）を持ち、D-2 は D-1 と同じ質問を重ねて追加した重複。タスク T-1 が `related: [{to: D-2, type: for}]` で D-2 を指す'
      - name: 再生する書き込み
        description: T-1 の `for` の種類の `related` を D-1 に付け替え、会話ログと一緒に 1 回の `write_docs` で渡してから、D-2 を削除して `commit` する
        notes: 項目の削除は元に戻せないため、削除する前に D-2 を削除してよいかを検討事項 D-3 で聞き、利用者が案 A を採用している。D-3 は `related` で D-2 を指さない。スレッドとターミナルでは確認しない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: D-2 を削除してよいかを聞いた D-3 で案 A「削除する」を採用する
        CC->>PI: write_docs（T-1 の for を D-1 に付け替える・会話ログを追加する）
        PI->>WS: 書く
        CC->>PI: D-2 を削除する（delete_docs）
        PI->>WS: decisions.yaml から D-2 を除く
        CC->>SV: commit（重複した D-2 を削除する）
      ```
    expected:
      - '`.mindstella/decisions.yaml` に D-2 が無く、D-1 が残る'
      - 'T-1 が `related: [{to: D-1, type: for}]` を持つ'
      - 会話ログが 1 件追加されている
      - 増えたまとまりが、変えた項目に T-1、削除した項目に D-2 を持つ
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_mistaken_item_removed
  - name: 正常シナリオ（やめたメモを取り下げる）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる取り下げるツールと書き込み・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: メモ N-1 を持つ
      - name: 再生する書き込み
        description: N-1 を理由つきで取り下げ、会話ログを追加して `commit` する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（N-1 の話はもうやめる）
        CC->>PI: N-1 に取り下げのマーカーと理由を書き込む（write_docs）
        PI->>WS: notes.yaml に書く
        CC->>PI: 会話ログを書き込む（write_docs）
        CC->>SV: commit（N-1 を取り下げる）
      ```
    expected:
      - '`.mindstella/notes.yaml` に N-1 が残り、取り下げのマーカーと理由を持つ'
      - 会話ログが 1 件追加されている
      - 増えたまとまりが、変えた項目に N-1 を持ち、削除した項目を持たない
    test: test_normal_when_note_withdrawn
  - name: 正常シナリオ（見た目のある資料を HTML で残す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs`（本文は HTML）を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 再生する書き込み
        description: '会話で求められた画面のモックを HTML の本文にした資料 A-1（`kind`: モック、`related: [{to: D-1, type: see_also}]`）と会話ログを、1 回の `write_docs` で渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 画面のモックを作ってほしいという発言
        CC->>PI: write_docs（資料 A-1、本文は HTML・会話ログ）
        PI->>WS: docs.yaml と docs/ の HTML の本文と logs.yaml を書く
      ```
    expected:
      - '資料 A-1 が `kind: モック` と `related: [{to: D-1, type: see_also}]` を持ち、本文が HTML の形式である'
      - '`docs/` に A-1 の本文の HTML がある'
      - '`check` が YAML と本文のずれを 0 件で返す'
    test: test_normal_when_visual_doc_kept_as_html
  - name: 正常シナリオ（言い方の違うタグを使い回す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねるタグの集計（`search_docs` の `group_by`）・`next_id`・`write_docs`・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 検討事項を持たず、タグ `topic:サーバ` を持つメモ N-1 だけを持つ
      - name: 再生する書き込み
        description: サーバーの置き場所を主題にした検討事項 D-1 と会話ログを、1 回の `write_docs` で渡してから `commit` する
        notes: 発言では「サーバー」と呼んでいるが、使われているタグ `topic:サーバ` と同じ概念の言い方の違いなので、D-1 には `topic:サーバー` を作らず `topic:サーバ` を付ける
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（サーバーの置き場所の話）
        CC->>SV: タグの一覧を出す
        SV-->>CC: 使われているタグ `topic:サーバ`（1 件）
        CC->>CC: 「サーバー」が使われているタグ `topic:サーバ` と同じ概念の言い方の違いだと決める
        CC->>PI: write_docs（D-1 はタグ `topic:サーバ` を持つ・会話ログ）
        PI->>WS: 書く
        CC->>SV: commit
      ```
    expected:
      - D-1 のタグが `topic:サーバ` だけである
      - タグの一覧が `topic:サーバ`（2 件）だけを返し、`topic:サーバー` が無い
      - 点検が問題を 0 件で返す
    test: test_normal_when_variant_tag_reused
  - name: 正常シナリオ（方針を検討事項で聞く）
    setup:
      - name: Mock
        description: モデルを呼ばない。記録の使い分けの工程が連ねる `next_id`・`write_docs` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 決定済みの検討事項 D-1 を持ち、スレッドを持たない
      - name: 再生する書き込み
        description: 'D-1 へのコメント `この結果を Issue にしておいて` から、ワークスペースの外へ書き込む前の合意が要ると判断し、未決定の検討事項 D-2（案 A「起票する」・B「起票しない」。A に推奨のマーカー。`related: [{to: D-1, type: parent}]`）と会話ログを、1 回の `write_docs` で渡す'
        notes: D-2 の本文は、起票する先と本文の要点と、AI の理解（D-1 の決定を後続の作業として起票する）を持つ。スレッドは作成しない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        CC->>CC: コメントから、元に戻せないワークスペースの外への書き込みの合意が要ると判断する
        CC->>SV: next_id
        CC->>PI: write_docs（AI の理解と案と推奨を持つ未決定の D-2・会話ログ）
        PI->>WS: 書く
      ```
    expected:
      - D-2 が未決定で、案 A・B と推奨のマーカー A を持ち、案 A の `reason` に推奨する理由がある
      - 'D-2 が `related: [{to: D-1, type: parent}]` を持ち、`docs/` に起票する内容と AI の理解を持つ本文がある'
      - スレッドが 0 件のままである
      - 会話ログが 1 件追加されている
      - 点検が問題を 0 件で返す
    test: test_normal_when_asking_policy_in_decision
  - name: 正常シナリオ（細部を AI が決める）
    setup:
      - name: Mock
        description: モデルを呼ばない。記録の使い分けの工程が連ねるタグの集計（`search_docs` の `group_by`）・`next_id`・`write_docs`・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 検討事項を持たない
      - name: 再生する書き込み
        description: コメント `通知は Discord に送る。送る内容と再送は任せる` から、細部の検討事項 D-1（再送の回数。案 A・B、推奨 A。A を採用して決定済み）と、利用者の回答が要る検討事項 D-2（通知に含める内容。案 A・B、推奨 A。未決定）と会話ログを、1 回の `write_docs` で渡してから `commit` する
        notes: D-1 は後から変えられる値のため細部、D-2 は利用者の体験に関わるため回答を求める
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（送る内容と再送は任せる）
        CC->>CC: 後から変えられる D-1 を細部、利用者の体験に関わる D-2 を回答の要る検討事項に分ける
        CC->>SV: next_id
        CC->>PI: write_docs（AI が決めた決定済みの D-1・未決定の D-2・会話ログ）
        PI->>WS: スキーマと突き合わせて書く
        CC->>SV: commit
      ```
    expected:
      - D-1 が案 A を採用して決定済みで、`reason` に AI が決めた理由を持つ
      - D-2 が案 A・B と推奨のマーカー A を持つ未決定である
      - 会話ログが 1 件追加されている
      - 点検が問題を 0 件で返す
    test: test_normal_when_ai_decides_detail
  - name: 正常シナリオ（資料の確認を依頼する）
    setup:
      - name: Mock
        description: モデルを呼ばない。記録の使い分けの工程が連ねる `next_id`・`write_docs` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 状態 `下書き` の資料 A-1（画面の一覧）を持ち、A-1 の本文が新規に決めたこと 3 件を持つ
      - name: 再生する書き込み
        description: 'A-1 を `確認中` に更新し、未決定の検討事項 D-1（タイトル `A-1 で完成でよいか`。案 A「完成にする」・B「修正する」。A に推奨のマーカー。`related: [{to: A-1, type: see_also}]`）と会話ログを、1 回の `write_docs` で渡す'
        notes: D-1 の本文は A-1 の新規決定事項 3 件の表で、A-1 の全文を写さない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        CC->>CC: A-1 の新規決定事項を表にする
        CC->>SV: next_id
        CC->>PI: write_docs（A-1 を確認中にする・確認の D-1・会話ログ）
        PI->>WS: docs.yaml・decisions.yaml・docs/ の本文・logs.yaml を書く
      ```
    expected:
      - A-1 が `確認中` である
      - 'D-1 が未決定で、`related: [{to: A-1, type: see_also}]` と案 A・B と推奨のマーカー A を持つ'
      - D-1 の本文が A-1 の新規決定事項 3 件の表を持ち、A-1 の本文の全文を持たない
      - 会話ログが 1 件追加されている
      - 点検が問題を 0 件で返す
    test: test_normal_when_doc_review_requested
  - name: 正常シナリオ（後でやる作業をタスクに追加する）
    setup:
      - name: Mock
        description: モデルを呼ばない。記録の使い分けの工程が連ねる `next_id`・`write_docs` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 未決定の検討事項 D-1（画面の構成）を持ち、タスクを持たない
      - name: 再生する書き込み
        description: 'コメント `通知の方式は調べておいて。画面の一覧は後で作る` から、調査のタスク T-1（状態 `進行中`）と、作業のタスク T-2（状態 `保留`。`reason` に着手できる条件 `D-1 が決定済みになったら`。`related: [{to: D-1, type: depends_on}]`）と会話ログを、1 回の `write_docs` で渡す'
        notes: T-1 はその回に着手できるため進行中、T-2 は D-1 の決定を待つため保留にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（調べておいて・後で作る）
        CC->>CC: 後でやる作業を、着手できるものと着手できない条件があるものに分ける
        CC->>SV: next_id
        CC->>PI: write_docs（進行中の T-1・保留の T-2・会話ログ）
        PI->>WS: 書く
      ```
    expected:
      - T-1 が進行中である
      - 'T-2 が保留で、`reason` に着手できる条件を持ち、`related: [{to: D-1, type: depends_on}]` を持つ'
      - 状態が未着手のタスクが 0 件である
      - 会話ログが 1 件追加されている
      - 点検が問題を 0 件で返す
    test: test_normal_when_later_work_queued
lead: MindStella のセッションが、記録の使い分けのエージェントフロー（`mindstella/record`）に従い、利用者の発言・コメントを内容ごとに記録の種類へ振り分け、AI が利用者に聞くことは方針も含めて AI の理解・案・推奨を持つ未決定の検討事項にし、細部は AI が決めて決定済みにし、話題のタグを付けて記録に書き込む単一ユースケース。
issue: 4
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 抽象と具体を行き来する発言をそのままコメントしても、決め事とそこから派生する質問が記録に残る。脱線した質問がタスクに紛れない。回答が要ることは検討事項の 1 か所で回答できる
trigger: 'コメントの取り込みのエージェントフローが、利用者のコメントを記録に反映する'
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションが起動し、MindStella と project-index の MCP のツールが使える
success_guarantee: 発言・コメントごとに会話ログが 1 件追加され、記録した項目は対象・カテゴリー・フェーズを持たず、話題のタグを持つ。AI が利用者に聞くことは、方針も含めてスレッドで聞かず、案と推奨のマーカーを持つ未決定の検討事項として残る。AI が決めた細部は、AI が決めた理由を持つ決定済みの検討事項として残る。未着手のタスクは残らず、確認中の資料は、その資料の確認を聞く未決定の検討事項に指されている。
minimal_guarantee: スキーマに合わない書き込みは MCP のツールが拒み、ワークスペースは書き込みの前のまま残る。
frequency: 利用者の発言のたび
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、エージェントフローの工程が連ねる書き込みを再生してワークスペースの状態を確かめる。E2E を持つのは、既存のシナリオに無い組み合わせ（`parent`・`for` の種類の `related` と未整理を持つ書き込みの組・`docs/` の本文を持つ資料・タスクを積まない脱線の記録・タスクの成果の資料を `related` で指す完了・方針の論点を聞く検討事項・AI が決めた細部の検討事項・資料の確認の依頼・着手できるかで分けたタスク）を持つシナリオだけ。発言をどう振り分けるか・どの案や言葉を書くかというモデルの判断は確かめない
  利用者に聞くこと: AI が利用者に聞くこと（質問・未決定の点・未確認の点・AI の解釈の確認）は、スレッドで聞かず、全て検討事項に挙げる。方針（構成・責務・利用者の体験・費用・元に戻せないもの。ワークスペースの外へ書き込む前の合意・項目の削除の合意を含む）は、AI の理解を本文に記載し、案と推奨のマーカーを持つ未決定の検討事項にする。細部（キーの名前・型・エラーの扱いなど後から変えられるもの）は AI が決めて決定済みにし、AI が決めた理由を `reason` に残して、報告のスレッドで報告するだけにする。1 件の検討事項では 1 つの質問だけを聞き、決める内容が複数あるときは内容ごとに検討事項を分ける。回答が届くまで、その検討事項の先を進めない
  保留: 検討事項の保留は、利用者が後回しを指示したものだけにする。利用者の回答待ちの検討事項は保留にせず、未決定にする
  資料の状態: '`下書き` は AI が作成中、`確認中` は利用者に確認を依頼して回答を待っている、`完成` は利用者が OK にしたか利用者の確認が要らない資料。確認を依頼するときは、資料 1 件に「この資料で完成でよいか」の未決定の検討事項を 1 件作成して資料を指し、本文には資料の全文ではなく新規決定事項の表を記載する。確認中の資料は、この検討事項を必ず持つ'
  タスクの状態: 未着手のままのタスクを残さない。その回に着手できるタスクは進行中にし、着手できない条件があるタスクは保留にして `reason` に着手できる条件を記載する。「後でやる」と出た作業は、その回のうちにタスクにする
  描画の確認: 図や mdmark の記法を持つ資料は、書き込む前に mdmark の点検か書き出しで、描いたときの警告が無いことを確認する
test_file: tests/e2e/単一ユースケース/test_record_usage.py

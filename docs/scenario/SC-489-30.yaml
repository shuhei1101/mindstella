id: SC-489-30
title: "記録の使い分け"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねるタグの集計（`search_docs` の `group_by`）・`next_id`・`write_docs`・`commit` を、決めた引数で順に再生する
        notes: '-'
      - name: 作成済みのワークスペース
        description: 検討事項を持たず、タグ `topic:保存` を持つメモ N-1 だけを持つワークスペース
        notes: '-'
      - name: 再生する書き込み
        description: 決め事を持つ検討事項 D-1（決定済み。案 A・B を持ち、A を採用）、D-1 を `parent` の種類の `related` で指す派生の検討事項 D-2（未決定。案 A・B を持ち、A に推奨の印）、問いの形にならない D-3（未整理。案を持たない）、D-2 を進めるタスク T-1、会話ログ L-1 を、1 回の `write_docs` で渡す
        notes: どの項目も `target`・`category`・`phase` を持たない。D-2 の `parent` と T-1 の `for` の種類の `related` は、同じ呼び出しで先に足す項目を指す。D-1・D-2・T-1 は使われているタグ `topic:保存` を主題として、D-3 は `topic:保存` と、同じ概念のタグが使われていない新しい話題のタグ `topic:通知` を持ち、中心に扱う `topic:通知` だけを主題にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（決め事を含む）
        CC->>SV: タグの一覧を出す
        SV-->>CC: 使われているタグと件数
        CC->>CC: 記録の種類に振り分け、付ける条件から話題のタグを決め（単語まで分けて facet つきで名付け、同じ概念の言い方・活用の違いの使われているタグがあれば使い回し、無ければ新しいタグを付ける）、その項目が中心に扱う話題のタグを主題にし、未整理を除く検討事項ごとに案と推奨を書く
        CC->>PI: write_docs（案を持つ検討事項・派生の検討事項・未整理・タスク・会話ログ）
        PI->>WS: スキーマと突き合わせて書く
        SV-->>CC: 足した項目
        CC->>SV: commit（取り込んだ内容の一言の説明）
        SV->>WS: まとまりを書く
      ```
    expected:
      - D-1 が決定済みで `answer` を持つ
      - 'D-1 が案を持ち、A だけが `adopted: true` である'
      - 'D-2 が `related: [{to: D-1, type: parent}]` と案を持ち、未決定で、案 A だけが推奨の印を持つ'
      - D-3 が未整理で、案を持たない
      - 'T-1 が `related: [{to: D-2, type: for}]` を持つ'
      - 会話ログ L-1 がある
      - 足した全ての項目が `target`・`category`・`phase` を持たない
      - D-3 がタグ `topic:保存`・`topic:通知` を持ち、`config.yaml` がタグのキー（`tags`）を持たない
      - D-1・D-2・T-1 の `topic:保存` と D-3 の `topic:通知` が主題で、D-3 の `topic:保存` が主題でない
      - 取り込みの前のタグの一覧が `topic:保存`（1 件）を返し、取り込んだ後のタグの一覧が `topic:保存`（5 件）と `topic:通知`（1 件）を返す
      - 足した D-1・D-2・D-3・T-1・L-1 が 1 つのまとまりに属し、そのまとまりが説明を持つ。`pending` が空を返す
      - 点検が問題を 0 件で返す
    test: test_normal
  - name: 正常シナリオ（保留・解除・中止）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs` を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 未決定の D-1・保留の D-2（どちらも案 A・B を持つ）・未着手のタスク T-1 を持つ
      - name: 再生する書き込み
        description: D-1 を保留に、D-2 を未決定に戻し、T-1 を中止にする。それぞれ `reason` を持たせ、会話ログと一緒に 1 回の `write_docs` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（後回し・再開・やめる）
        CC->>PI: write_docs（D-1 を保留、D-2 を未決定、T-1 を中止、会話ログを足す）
        PI->>WS: 書く
      ```
    expected:
      - D-1 が保留で `reason` を持つ
      - D-2 が未決定である
      - T-1 が中止で `reason` を持つ
      - 会話ログが 1 件足されている
    notes:
      E2E: 持たない。状態と `reason` を直すのは `write_docs` だけで、既存の『記録の追加と更新』の『正常シナリオ』が確かめる
  - name: 正常シナリオ（図や文書を資料に残す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs`を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 再生する書き込み
        description: '会話で出した Mermaid の図を本文にした資料 A-1（`kind`: 図、`related: [{to: D-1, type: see_also}]`、エイリアス・説明を持つ）と会話ログを、1 回の `write_docs` で渡す'
        notes: 'A-1 はタイトル `画面遷移図`、`aliases: [画面遷移, 遷移図]`、`description: ログインから設定までの画面の移り方`'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言
        CC->>PI: write_docs（資料 A-1、本文は Markdown・会話ログ）
        PI->>WS: docs.yaml と docs/ の本文と logs.yaml を書く
      ```
    expected:
      - '資料 A-1 が `kind: 図` と `related: [{to: D-1, type: see_also}]` を持つ'
      - 資料 A-1 が渡したエイリアス（`画面遷移`・`遷移図`）と説明を持つ
      - '`.mindstella/docs/` に A-1 の本文の Markdown がある'
      - '`check` が YAML と Markdown のずれを 0 件で返す'
    test: test_normal_when_diagram_kept_as_doc
  - name: 正常シナリオ（脱線した質問）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs` を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: タスクを持たない
      - name: 再生する書き込み
        description: 言葉の意味を尋ねた質問は用語集 G-1、それ以外の脱線はメモ N-1（タグ `topic:脱線`。調べた経緯を `body_markdown` で本文にする）。どちらも会話ログと一緒に 1 回の `write_docs` で渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー

        U->>CC: 「○○って何？」
        CC-->>U: スレッドで回答する
        CC->>PI: write_docs（用語集 G-1 かメモ N-1・会話ログ）
      ```
    expected:
      - 用語集 G-1 が `meaning` を持つ
      - メモ N-1 がタグ `topic:脱線` を持つ
      - メモ N-1 が本文を持ち、`.mindstella/docs/` にその Markdown がある
      - タスクが 0 件のままである
    test: test_normal_when_off_topic_question
  - name: 正常シナリオ（タスクの成果を資料にする）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs` を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 と、D-1 を進める進行中の作業のタスク T-1 を持つ
      - name: 再生する書き込み
        description: 'T-1 で作った画面の一覧を本文にした資料 A-1 を足し、T-1 を `related: [{to: A-1, type: see_also}]`・完了・`result` を持つように更新し、会話ログを足す。この 3 つを 1 回の `write_docs` で渡す'
        notes: T-1 の `related` は、同じ呼び出しで先に足す A-1 を指す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（画面の一覧ができた）
        CC->>CC: T-1 の成果と資料が 1 対 1 で揃っているかを確かめる
        CC->>PI: write_docs（資料 A-1 を足す・T-1 を related: A-1・完了にする・会話ログを足す）
        PI->>WS: docs.yaml・docs/ の本文・tasks.yaml・logs.yaml を書く
      ```
    expected:
      - T-1 が完了で、`related` に A-1 を持つ
      - '資料 A-1 が `deliverable` を持たず、`.mindstella/docs/` に本文がある'
      - '`config.yaml` が呼ぶ前と同じである'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_task_output_kept_as_doc
  - name: 正常シナリオ（誤って足した項目を消す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる書き込みと消すツール・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: '検討事項 D-1・D-2 と、D-2 を削除してよいかを聞く未決定の検討事項 D-3 を持ち、D-2 は D-1 と同じ問いを重ねて足した重複。タスク T-1 が `related: [{to: D-2, type: for}]` で D-2 を指す'
      - name: 再生する書き込み
        description: T-1 の `for` の種類の `related` を D-1 に付け替え、会話ログと一緒に 1 回の `write_docs` で渡してから、D-2 を消して `commit` する
        notes: 消す前に、D-2 を削除してよいかを検討事項 D-3（案 A 削除する・B 残す。推奨 A）に挙げ、利用者の回答で A を採用している。スレッドやターミナルでは確かめない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 検討事項 D-3（D-2 を削除してよいか）へ案 A を回答する
        CC->>PI: write_docs（T-1 の for を D-1 に付け替える・会話ログを足す）
        PI->>WS: 書く
        CC->>PI: D-2 を削除する（delete_docs）
        PI->>WS: decisions.yaml から D-2 を除く
        CC->>SV: commit（重複した D-2 を消す）
      ```
    expected:
      - '`.mindstella/decisions.yaml` に D-2 が無く、D-1 が残る'
      - 'T-1 が `related: [{to: D-1, type: for}]` を持つ'
      - 会話ログが 1 件足されている
      - 増えたまとまりが、変えた項目に T-1、消した項目に D-2 を持つ
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_mistaken_item_removed
  - name: 正常シナリオ（やめたメモを取り下げる）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる取り下げるツールと書き込み・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: メモ N-1 を持つ
      - name: 再生する書き込み
        description: N-1 を理由つきで取り下げ、会話ログを足して `commit` する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（N-1 の話はもうやめる）
        CC->>PI: N-1 に取り下げの印と理由を書き込む（write_docs）
        PI->>WS: notes.yaml に書く
        CC->>PI: 会話ログを書き込む（write_docs）
        CC->>SV: commit（N-1 を取り下げる）
      ```
    expected:
      - '`.mindstella/notes.yaml` に N-1 が残り、取り下げの印と理由を持つ'
      - 会話ログが 1 件足されている
      - 増えたまとまりが、変えた項目に N-1 を持ち、消した項目を持たない
    test: test_normal_when_note_withdrawn
  - name: 正常シナリオ（見た目のある資料を HTML で残す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next_id`・`write_docs`（本文は HTML）を、決めた引数で再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 再生する書き込み
        description: '会話で求められた画面のモックを HTML の本文にした資料 A-1（`kind`: モック、`related: [{to: D-1, type: see_also}]`）と会話ログを、1 回の `write_docs` で渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 画面のモックを作ってほしいという発言
        CC->>PI: write_docs（資料 A-1、本文は HTML・会話ログ）
        PI->>WS: docs.yaml と docs/ の HTML の本文と logs.yaml を書く
      ```
    expected:
      - '資料 A-1 が `kind: モック` と `related: [{to: D-1, type: see_also}]` を持ち、本文が HTML の形式である'
      - '`.mindstella/docs/` に A-1 の本文の HTML がある'
      - '`check` が YAML と本文のずれを 0 件で返す'
    test: test_normal_when_visual_doc_kept_as_html
  - name: 正常シナリオ（言い方の違うタグを使い回す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねるタグの集計（`search_docs` の `group_by`）・`next_id`・`write_docs`・`commit` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 検討事項を持たず、タグ `topic:サーバ` を持つメモ N-1 だけを持つ
      - name: 再生する書き込み
        description: サーバーの置き場所を主題にした検討事項 D-1 と会話ログを、1 回の `write_docs` で渡してから `commit` する
        notes: 発言では「サーバー」と呼んでいるが、使われているタグ `topic:サーバ` と同じ概念の言い方の違いなので、D-1 には `topic:サーバー` を作らず `topic:サーバ` を付ける
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        U->>CC: 発言（サーバーの置き場所の話）
        CC->>SV: タグの一覧を出す
        SV-->>CC: 使われているタグ `topic:サーバ`（1 件）
        CC->>CC: 「サーバー」が使われているタグ `topic:サーバ` と同じ概念の言い方の違いだと決める
        CC->>PI: write_docs（D-1 はタグ `topic:サーバ` を持つ・会話ログ）
        PI->>WS: 書く
        CC->>SV: commit
      ```
    expected:
      - D-1 のタグが `topic:サーバ` だけである
      - タグの一覧が `topic:サーバ`（2 件）だけを返し、`topic:サーバー` が無い
      - 点検が問題を 0 件で返す
    test: test_normal_when_variant_tag_reused
  - name: 正常シナリオ（利用者に聞くこと）
    setup:
      - name: Mock
        description: モデルを呼ばない。記録の使い分けの工程が連ねるタグの集計（`search_docs` の `group_by`）・`next_id`・`write_docs` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 決定済みの検討事項 D-1 を持つ
      - name: 再生する書き込み
        description: 'D-1 へのコメント `この結果を Issue にしておいて` から、ワークスペースの外へ書き込む前の合意を聞く検討事項 D-2（「D-1 の結果を Issue に起票してよいか」。案 A 起票する・B 起票しない。A に推奨の印。`related: [{to: D-1, type: see_also}]`）と会話ログを、1 回の `write_docs` で渡す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース

        CC->>CC: コメントから、ワークスペースの外へ書き込む前の合意が要ると判断する
        CC->>SV: タグの一覧を出す
        SV-->>CC: 使われているタグと件数
        CC->>SV: next_id
        CC->>PI: write_docs（案と推奨の印を持つ未決定の D-2・会話ログ）
        PI->>WS: 書く
      ```
    expected:
      - D-2 が未決定で、案 A・B を持ち、案 A だけが推奨の印を持つ
      - D-2 が `related` で D-1 を指す
      - 会話ログが 1 件足されている
      - スレッドが作成されていない
      - 点検が問題を 0 件で返す
    test: test_normal_when_asking_user
lead: MindStella のセッションが、記録の使い分けのエージェントフロー（`mindstella/record`）に従い、利用者の発言・コメントを内容ごとに記録の種類へ振り分け、AI が利用者に聞くことは検討事項にして、話題のタグを付けて記録に書き込む単一ユースケース。
issue: 4
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 抽象と具体を行き来する発言をそのままコメントしても、決め事とそこから派生する問いが記録に残る。脱線した質問がタスクに紛れない。回答が要ることは検討事項の 1 か所で答えられる
trigger: 'コメントの取り込みのエージェントフローが、利用者のコメントを記録に反映する'
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションが起動し、MindStella と project-index の MCP のツールが使える
success_guarantee: 発言・コメントごとに会話ログが 1 件足され、記録した項目は対象・カテゴリー・フェーズを持たず、話題のタグを持つ。AI が利用者に聞くことは、案と推奨の印を持つ未決定の検討事項として残る。
minimal_guarantee: スキーマに合わない書き込みは MCP のツールが拒み、ワークスペースは書き込みの前のまま残る。
frequency: 利用者の発言のたび
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、エージェントフローの工程が連ねる書き込みを再生してワークスペースの状態を確かめる。E2E を持つのは、既存のシナリオに無い組み合わせ（`parent`・`for` の種類の `related` と未整理を持つ書き込みの組・`docs/` の本文を持つ資料・タスクを積まない脱線の記録・タスクの成果の資料を `related` で指す完了・利用者に聞くことの検討事項）を持つシナリオだけ。発言をどう振り分けるか・どの案や言葉を書くかというモデルの判断は確かめない
  利用者に聞くこと: AI が利用者に聞くこと（質問・確認・AI の解釈の確認・ワークスペースの外へ書き込む前の合意・項目の削除の合意）は、未決定・案・推奨の印を持つ検討事項にし、スレッドでは聞かない。回答が届くまで、その検討事項の先を進めない

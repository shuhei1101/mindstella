id: SC-489-36
title: "設定の更新"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: 題名 `ログイン`
      - name: 書き換える設定
        description: 題名・話し合いの概要を置き換える
        notes: 表示の既定と文字起こしの設定は渡さない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 書き換える設定のキーを渡す
        SV->>WS: config.yaml を読む
        SV->>SV: 渡したキーを置き換え、スキーマと突き合わせる
        SV->>WS: config.yaml を書く
        SV-->>CC: 書き換えた後の設定
      ```
    expected:
      - '`config.yaml` の `summary`・話し合いの概要が渡した値である'
      - '`config.yaml` が `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持たない'
      - '渡さなかったキーが呼ぶ前と同じである'
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal
  - name: 異常シナリオ（スキーマに合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き換える設定
        description: 削除したキー `phases` を渡す
        notes: '`phases: [目的]`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 削除したキー phases を渡す
        SV->>SV: スキーマと突き合わせて合わない
        SV-->>CC: 合わない箇所を示すエラー
      ```
    expected:
      - 設定を書き換えるツールがエラーを返す
      - エラーの本文に、合わないキー `phases` がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_schema_mismatch
  - name: 正常シナリオ（表示の既定を書き換える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が見た目の既定と表示する種類の既定を持たないワークスペース
      - name: 書き換える設定
        description: ネットワークの見た目の既定を `starlight` にし、表示する種類の既定から会話ログを外す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 見た目の既定と表示する種類の既定を渡す
        SV->>WS: config.yaml を読む
        SV->>SV: 渡したキーを置き換え、スキーマと突き合わせる
        SV->>WS: config.yaml を書く
        SV-->>CC: 書き換えた後の設定
      ```
    expected:
      - '`config.yaml` の見た目の既定が `starlight` で、表示する種類の既定が会話ログを除いた種類である'
      - '`summary`・`playbooks`・`phases`・`goal`・`history_limit` が呼ぶ前と同じである'
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_display_defaults_changed
  - name: 正常シナリオ（関連する場所と保持する回数）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、関連する場所を持たず、保持する回数のキーを持たないワークスペース
      - name: 書き換える設定
        description: 関連する場所を 1 件（`title`・`url`）にし、保持する回数を 3 にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 関連する場所と保持する回数を渡す
        SV->>WS: config.yaml を読む
        SV->>SV: 渡したキーを置き換え、スキーマと突き合わせる
        SV->>WS: config.yaml を書く
        SV-->>CC: 書き換えた後の設定
      ```
    expected:
      - '`config.yaml` の `links` が渡した 1 件で、`history_limit` が 3 である'
      - 題名・プレイブック・フェーズ・対象・カテゴリー・ゴールが呼ぶ前と同じである
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_links_and_history_limit
  - name: 正常シナリオ（文字起こしの設定を書き換える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が文字起こしの設定を持たないワークスペース
      - name: 書き換える設定
        description: 文字起こし後の挙動を `insert` にし、用語集のプリセットを `開発` にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 文字起こし後の挙動と用語集のプリセットを渡す
        SV->>WS: config.yaml を読む
        SV->>SV: 渡したキーを置き換え、スキーマと突き合わせる
        SV->>WS: config.yaml を書く
        SV-->>CC: 書き換えた後の設定
      ```
    expected:
      - '`config.yaml` の文字起こし後の挙動が `insert` で、用語集のプリセットが `開発` である'
      - '`summary`・`playbooks`・`phases`・`goal`・`display` が呼ぶ前と同じである'
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_transcription_settings_changed
  - name: 異常シナリオ（文字起こし後の挙動の値が合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き換える設定
        description: 文字起こし後の挙動を `review`・`send`・`insert` のどれでもない値にして渡す
        notes: '`paste`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー

        CC->>SV: 文字起こし後の挙動を paste にして渡す
        SV->>SV: スキーマと突き合わせて合わない
        SV-->>CC: 合わない箇所を示すエラー
      ```
    expected:
      - 設定を書き換えるツールがエラーを返す
      - エラーの本文に、合わない文字起こし後の挙動のキーがある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_transcription_action_invalid
lead: MindStella のセッションが、話し合いの途中でワークスペースの設定（題名・話し合いの概要・関連する場所・保持する回数・表示の既定・文字起こしの設定）を書き換える単一ユースケース。
issue: 44
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 話し合いの題名や概要が変わっても、同じワークスペースで続けられる
trigger: MindStella のセッションが、利用者のコメントか検討事項への回答で、設定の書き換えを求められる
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションが起動し、MindStella の MCP のツールが使える
success_guarantee: 渡したキーだけが置き換わり、渡さなかったキーは元のまま残る。ワークスペースの全ての YAML がスキーマに合い、点検が問題を 0 件で返す。
minimal_guarantee: スキーマに合わない設定（削除したキーを含む）の書き換えでは、どのファイルも書き換えない。
frequency: 話し合いの途中で、題名・概要・表示の既定などを変えるときに数回
priority: 高
notes:
  E2E の範囲: MCP サーバーを立て、MCP のクライアントで設定を書き換えるツールを呼んでワークスペースの状態を確かめる。ツールの名前と引数はインターフェース定義設計で決める
  フェーズの対応: 新しい `phases` に同じ名前があるフェーズは、対応を渡さなくてもそのまま残る。対応は、新しい `phases` に無いフェーズにだけ渡す
  対象とカテゴリーの対応: フェーズの対応と同じく、新しい設定に同じ名前がある対象・カテゴリーは対応を渡さなくてもそのまま残る。対象の対応は、項目の `target` とカテゴリーの `target` の両方に当てる。付け替えは、フェーズと同じく変更履歴にも書き換えのまとまりにも入れず、項目の通し番号も進めない
  削除したキー: プレイブック・フェーズ・最上位の軸の呼び名・ゴール・対象・カテゴリーは設定から削除し、書き換えでも受け付けない。項目のフェーズ・対象・カテゴリーの付け替えも無くなる
test_file: tests/e2e/単一ユースケース/test_settings_update.py

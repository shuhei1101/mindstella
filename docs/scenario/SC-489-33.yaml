id: SC-489-33
title: "記録の検索"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（project-index を立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、project-index の配信元として配信しているワークスペース
      - name: 検討事項 D-1
        description: タイトルに `スキーマ` を含み、タグ `データ` を持つ検討事項
      - name: 検討事項 D-2
        description: どの文字の欄にも `スキーマ` を含まず、D-1 に依存する検討事項
        notes: '`related: [{to: D-1, type: depends_on}]`・タグ `画面`'
      - name: タスク T-1
        description: どの文字の欄にも `スキーマ` を含まず、D-1 を進めるタスク
        notes: '`related: [{to: D-1, type: for}]`・タグ `データ`・`画面`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース

        CC->>PI: 「スキーマ」を含む項目を検索する
        PI->>WS: 配信元の文書を読む
        PI-->>CC: 合う項目の一覧と全体の件数
        CC->>PI: D-1 を本文まで検索する
        PI-->>CC: D-1 の中身
        CC->>PI: D-1 を参照している項目をたどる
        PI-->>CC: D-2・T-1
        CC->>PI: 使われているタグを件数つきで集計する
        PI-->>CC: タグごとの件数
        CC->>PI: タグ「データ」と「画面」を両方持つ項目を検索する
        PI-->>CC: 合う項目の一覧
        CC->>PI: タグ「データ」か「画面」を持つ項目を検索する
        PI-->>CC: 合う項目の一覧
        CC->>PI: タグ「保留」を持つ検討事項を検索する
        PI-->>CC: 空の一覧
      ```
    expected:
      - 「スキーマ」で検索した結果に D-1 があり、D-2・T-1 が無く、全体の件数が 1 である
      - D-1 の中身に、タイトル・状態・タグがある
      - D-1 を参照している項目として、D-2（種類 `depends_on`）と T-1（種類 `for`）が関連の種類つきで返る
      - タグの集計が `データ`（2 件）・`画面`（2 件）の 2 件だけを返す
      - タグ「データ」と「画面」を両方持つ項目で検索した結果が T-1 だけである
      - タグ「データ」か「画面」を持つ項目で検索した結果に D-1・D-2・T-1 がある
      - タグ「保留」を持つ検討事項で検索した結果がエラーにならず、全体の件数が 0 である
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal
  - name: 異常シナリオ（存在しない ID をたどる）
    setup:
      - name: Mock
        description: なし（project-index を立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: 存在しない ID を検索する
        PI-->>CC: 空の一覧
        CC->>PI: 存在しない ID から関連をたどる
        PI-->>CC: 文書が無いエラー
      ```
    expected:
      - 検索がエラーにならず、全体の件数が 0 である
      - 関連のたどりがエラーを返し、エラーの本文に渡した ID がある
    test: test_error_when_id_not_found
  - name: 正常シナリオ（ページを分けて読む）
    setup:
      - name: Mock
        description: なし（project-index を立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を `search_docs` の既定の件数より 5 件多く足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: 検討事項を検索する
        PI-->>CC: 最初のページ・全体の件数・続きを取る値
        CC->>PI: 続きを取る値を渡して検索する
        PI-->>CC: 残りの 5 件
      ```
    expected:
      - 最初のページが既定の件数の項目を持ち、全体の件数が既定の件数 + 5 で、続きを取る値がある
      - 続きを取る値で検索した結果が残りの 5 件で、続きを取る値が無い
      - 2 つのページを合わせると、全ての検討事項が 1 回ずつ出る
    test: test_normal_when_paged
  - name: 正常シナリオ（表記の違うタグで探す）
    setup:
      - name: Mock
        description: なし（project-index を立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: タグ `データ` を持つ検討事項
      - name: 検討事項 D-2
        description: 半角の大文字の英字のタグを持つ検討事項
        notes: タグ `API`
      - name: 検討事項 D-3
        description: 同じタグを全角の小文字で持つ検討事項
        notes: タグ `ａｐｉ`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: タグ「Api」を持つ項目を検索する
        PI->>PI: NFKC と casefold にそろえて比べる
        PI-->>CC: D-2・D-3
        CC->>PI: 使われているタグを件数つきで集計する
        PI-->>CC: タグごとの件数
      ```
    expected:
      - タグ「Api」で検索した結果が D-2・D-3 である
      - タグの集計が、`API` と `ａｐｉ` を 1 つのタグ（2 件）にまとめて返し、`データ`（1 件）を返す
      - D-2・D-3 のタグが、書いたときの表記（`API`・`ａｐｉ`）のままである
    test: test_normal_when_tag_normalized
  - name: 正常シナリオ（返す量を選ぶ）
    setup:
      - name: Mock
        description: なし（project-index を立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: Markdown の本文を持つ検討事項
        notes: タグ `データ`・`画面`
      - name: 検討事項 D-2
        description: 本文を持たない検討事項
        notes: タグ `データ`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: 検討事項を一覧で検索する
        PI-->>CC: 項目の表（本文なし）
        CC->>PI: D-1 を本文まで検索する
        PI-->>CC: D-1 の中身と本文
        CC->>PI: 件数だけを検索する
        PI-->>CC: 全体の件数
        CC->>PI: JSON で返すよう渡して検索する
        PI-->>CC: 同じ中身を JSON で
      ```
    expected:
      - 一覧の結果の各行が ID・種類・タイトル・文字数を持ち、本文を持たない
      - 本文まで検索した D-1 が、`.mindstella/docs/D-1.md` の本文を持つ
      - 件数だけの結果が全体の件数 2 を持ち、項目の一覧を持たない
      - JSON で返した結果が、全体の件数と項目の一覧を持つ
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_view_selected
  - name: 正常シナリオ（主題のタグで絞る）
    setup:
      - name: Mock
        description: なし（project-index を立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: タグ `データ` を主題でなく持つ検討事項
      - name: 検討事項 D-2
        description: タグ `データ` を主題として持つ検討事項
      - name: タスク T-1
        description: タグ `データ` を主題として、`画面` を主題でなく持つタスク
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: 主題のタグが「データ」の項目を検索する
        PI-->>CC: 合う項目の一覧
        CC->>PI: タグ「データ」を持つ項目を検索する
        PI-->>CC: 合う項目の一覧
      ```
    expected:
      - 主題のタグで検索した結果が D-2・T-1 で、D-1 を含まない
      - タグで検索した結果が D-1・D-2・T-1 である
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_main_tag_first
lead: MindStella のセッションが、project-index の検索と関連のたどりで、ワークスペースの項目を条件で探し、1 件の中身とそれを参照している項目、使っているタグを読む単一ユースケース。
issue: 3
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 前に決めたことを会話の中ですぐ引ける。同じ意味の属性が別の名前で増えない
trigger: 会話で前の記録に触れる、またはタグを付ける前に使っている名前を確かめる
preconditions:
  - ワークスペースが作成済みである
success_guarantee: 条件に合う項目のページと全体の件数・1 件の中身・参照元・使われているタグの一覧が出る。どのファイルも書き換えない。
test_file: tests/e2e/単一ユースケース/test_record_search.py
notes:
  project-index に移したもの: 探して空のときの外せる条件の案内・近いタグの案内・主題のタグを上に並べる並べ方は、project-index の `search_docs` が持たないため持ち越さない。主題のタグは `main_tags` の条件で絞る

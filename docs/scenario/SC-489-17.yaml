id: SC-489-17
title: "ワークスペースの移し替え"
scenarios:
  - name: 正常シナリオ（読み込みのとき）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 削除するキーを持つ前のバージョンのワークスペース
        description: この作業 PR の前のバージョンをバージョンのファイルに持ち、`config.yaml` に `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持ち、検討事項 D-1 が `phase`・`target`・`category`・`attrs`・`weight` を、資料 A-1 が `deliverable` を、調査 R-1 が `angles`・`confidence` を持ち、`.mindstella/release/` を持つワークスペース
        notes: 'YAML を直接書いて作る。D-1 の `target`・`category` は `認証`・`方式`、`attrs` は `{優先度: 高}`。R-1 の `angles` は `[費用, 運用]`、`confidence` は `中`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する（記録が残っているフォルダ）
        SV->>WS: バージョンのファイルを読む（前のバージョン）
        SV->>WS: コピーを取る
        SV->>WS: 削除するキーを除き、対象・カテゴリーをタグに、属性・観点・確かさを本文に移す
        SV->>WS: 点検し、バージョンのファイルを書き換える
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンである'
      - '`config.yaml` が `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持たず、ほかのキーは移し替える前と同じである'
      - D-1・A-1・R-1 が、削除するキー（`phase`・`target`・`category`・`attrs`・`weight`・`deliverable`・`angles`・`confidence`）を持たない
      - 'D-1 がタグ `topic:認証`・`topic:方式` を持ち、D-1 の本文の末尾の表に `優先度: 高` がある'
      - R-1 の本文の末尾の表に、観点 `費用`・`運用` と確かさ `中` がある
      - '`.mindstella/release/` が無い'
      - 既存の項目の ID が変わらず、project-index の `search_docs` で D-1 がヒットする
      - '`check` が問題を 0 件で返す'
      - '`.mindstella/schemas/` の各ファイルの中身が、プラグインの `skills/mindmap/schemas/` の同じ名前のファイルと同じである'
    test: test_normal_when_loaded
  - name: 正常シナリオ（バージョンが同じ）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: 今のバージョンのワークスペース
        description: '今のバージョンで作り、資料 A-1（`status: 完成`）を追加したワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（プラグインと同じ）
        SV->>WS: スキーマの複製をプラグインのスキーマと比べる（同じ）
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - ワークスペースの全てのファイルの中身と更新日時が、呼ぶ前と同じである
      - コピーが取られていない
    test: test_normal_when_same_version
  - name: 異常シナリオ（手順の途中で失敗する）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: 手順が読めないワークスペース
        description: この作業 PR の前のバージョンをバージョンのファイルに持ち、`decisions.yaml` が YAML として読めない中身のワークスペース
        notes: '`decisions.yaml` には閉じていない括弧（`items: [`）を書く'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取る
        SV->>SV: 手順を適用する途中で失敗する
        SV->>WS: コピーから戻す
        SV-->>CL: エラー（失敗したバージョン・手順・理由）
      ```
    expected:
      - ワークスペースの作成がエラーを返し、応答に失敗したバージョン・手順・`decisions.yaml` を読めない理由がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
      - ワークスペースが配信されていない
    test: test_error_when_step_fails
  - name: 異常シナリオ（バージョンが新しい）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: バージョンが新しいワークスペース
        description: 今のバージョンで作り、バージョンのファイルを `v99.0.0` に書き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（v99.0.0）
        SV-->>CL: エラー（ワークスペースのバージョンが新しい。プラグインを更新する）
      ```
    expected:
      - ワークスペースの作成がエラーを返し、理由にワークスペースのバージョンがプラグインより新しいことがある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_workspace_newer
  - name: 正常シナリオ（バージョンを記録する前の形式）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: バージョンを記録する前の形式のワークスペース
        description: 'バージョンのファイルを持たず、`mindmap.yaml` が `summary` を持たず `field: システム開発` を持ち、資料 A-1（`done: true`）・A-2（`done: false`）を持つワークスペース'
        notes: YAML を直接書いて作る。フォルダの名前は `要件出し`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（無い）
        SV->>WS: コピーを取り、バージョンを記録する前の形式からプラグインのバージョンまでの手順を順に適用する
        SV->>WS: 題名にフォルダの名前を仮に入れ、バージョンのファイルを書く
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンである'
      - '`docs.yaml` の A-1 が `status: 完成`、A-2 が `status: 下書き` で、どちらも `done` を持たない'
      - '`config.yaml` の `summary` が `要件出し` で、`field`・`playbooks` を持たない'
      - ワークスペースに `mindmap.yaml` が無く、種類ごとの YAML が `.mindstella/` の下にあり直下に無く、`docs/` が直下にある
      - 資料 A-1・A-2 の本文が、移し替える前と同じ中身で直下の `docs/` にある
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_unversioned_format
  - name: 正常シナリオ（利用者の判断が要る補正が残る）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成と、MindStella の MCP の `check` を呼ぶ
      - name: v0.6.0 のワークスペース
        description: '`.mindstella/mindstella-version.ini` が `v0.6.0` で、`answer` と `reason` を持ち案を持たない決定済みの D-1、案を持たない未決定の D-2、案 A を採用した未決定の D-4 を持つワークスペース'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取り、v0.6.0 より新しくプラグインのバージョンまでの手順を適用する（D-1 に回答から採用した案を作る）
        SV-->>CL: ワークスペースの ID と画面の URL
        CL->>SV: check
        SV-->>CL: D-2 が案を持たない・D-4 が採用した案を持つのに未決定
      ```
    expected:
      - D-1 が案を 1 つだけ持ち、その案が採用で、`content` が移し替えの前の `answer`、`reason` が移し替えの前の `reason` であり、D-1 は決定済みのままである
      - D-2・D-4 は移し替える前と同じ中身で、`check` が D-2 と D-4 を問題として返す
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンで、ワークスペースが配信されている
    test: test_normal_when_corrections_remain
  - name: 正常シナリオ（資料の図とマーカーを mdmark の今の書き方へ移す）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成と、MindStella の MCP の `check` を呼ぶ。mdmark の変換は実際に呼ぶ
      - name: 依存が揃った環境
        description: Node.js で mdmark の CLI を呼べる
      - name: mdmark の今の書き方より前の資料を持つワークスペース
        description: '`.mindstella/mindstella-version.ini` がこの移し替えの手順を持つバージョンより前で、資料 A-1 の本文に flow の図（種類 `llm`・`script` のノード）と sequence の図を、資料 A-2 の本文に今の書き方の引数のマーカー（`<!-- table: data +count -->`）を持つワークスペース'
        notes: 本文は mdmark の移行の試験の入力に合わせて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant MD as mdmark の変換
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取る
        SV->>MD: 資料の本文を渡して変換を呼ぶ
        MD-->>SV: 書き換えた本文・追加した map の種類・移行の報告
        SV->>WS: 資料の本文と、map の種類を持つ設定を書く
        SV->>WS: バージョンを書き換える
        SV-->>CL: ワークスペースの ID・画面の URL・移行の報告
        CL->>SV: check
        SV-->>CL: 問題 0 件
      ```
    expected:
      - A-1 の本文に flow・sequence の範囲が残らず、map の範囲が 2 件ある
      - 'A-2 の本文のマーカーが JSON の記載（`<!-- table: {...} -->`）である'
      - ワークスペースの設定の map の種類に `llm`・`script` がある
      - ワークスペースの作成の応答の移行の報告が、写さなかった値（`scope`・`updated` ほか）を資料と行つきで示す
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンで、ワークスペースが配信されている'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_mdmark_documents_migrated
    notes:
      写さなかった値の通知: '利用者に確認せずに適用し、写さなかった値は MindStella のセッションが通知のスレッドか検討事項で利用者に知らせる（PR #565 の確認ログ）。移し替えの前の中身はコピーに残る。利用者への知らせ方はインターフェース定義設計で決める'
  - name: 異常シナリオ（mdmark の変換が失敗する）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ。mdmark の変換は、終了コード 1 と理由を返す代わりのコマンドに差し替える
      - name: mdmark の今の書き方より前の資料を持つワークスペース
        description: 正常シナリオ（資料の図とマーカーを mdmark の今の書き方へ移す）と同じワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant MD as mdmark の変換
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取る
        SV->>MD: 変換を呼ぶ
        MD-->>SV: 終了コード 1 と理由
        SV->>WS: コピーから戻す
        SV-->>CL: エラー（失敗したバージョン・手順・mdmark が返した理由）
      ```
    expected:
      - ワークスペースの作成がエラーを返し、応答に失敗したバージョン・手順と mdmark が返した理由がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
      - ワークスペースが配信されていない
    test: test_error_when_mdmark_migration_fails
  - name: 正常シナリオ（バージョンが同じでスキーマの複製が更新前）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を起動し、MindStella の API のワークスペースの作成を呼ぶ
      - name: スキーマの複製が更新前の今のバージョンのワークスペース
        description: 今のバージョンで作り、資料 A-1 を追加した後、`.mindstella/schemas/docs.schema.json` を前のバージョンのスキーマ（`deliverable` を必須に持つ）に書き換えたワークスペース
        notes: 前のバージョンのスキーマはテストのデータとして持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース
        participant PI as project-index

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（プラグインと同じ）
        SV->>WS: スキーマの複製をプラグインのスキーマと比べ、違うファイルを再配置する
        SV->>PI: 配信元を読み修正させる
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - '`.mindstella/schemas/docs.schema.json` の中身が、プラグインの `skills/mindmap/schemas/docs.schema.json` と同じである'
      - '`.mindstella/schemas/` のほかのファイルと、記録の YAML・本文の中身と更新日時が、呼ぶ前と同じである'
      - コピーが取られていない
      - project-index の `search_docs` で A-1 を参照した結果に、スキーマに合わない旨の警告が無い
    test: test_normal_when_schema_copy_stale
  - name: 正常シナリオ（本文の Markdown を mdmark の文書の拡張子へ改名する）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を起動し、MindStella の API のワークスペースの作成と、MindStella の MCP の `check` を呼ぶ
      - name: 本文が `.md` のワークスペース
        description: '`.mindstella/mindstella-version.ini` がこの移し替えの手順を持つバージョンより前で、検討事項 D-1 が `body: docs/D-1.md`、資料 A-1 が `body: docs/A-1.md`、資料 A-2 が `body: docs/A-2.html` を持ち、`.mindstella/docs/` にそれぞれの本文のファイルがあるワークスペース'
        notes: YAML と本文を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取る
        SV->>WS: docs/ の Markdown の本文を .mark.md へ改名し、項目の body を書き換える
        SV->>WS: 点検し、バージョンのファイルを書き換える
        SV-->>CL: ワークスペースの ID と画面の URL
        CL->>SV: check
        SV-->>CL: 問題 0 件
      ```
    expected:
      - D-1 の `body` が `../docs/D-1.mark.md`、A-1 の `body` が `../docs/A-1.mark.md` で、直下の `docs/` の `D-1.mark.md`・`A-1.mark.md` の中身が移し替える前の `D-1.md`・`A-1.md` と同じである
      - '直下の `docs/` に `D-1.md`・`A-1.md` が残らない'
      - A-2 の `body` が `../docs/A-2.html` で、`A-2.html` の中身が移し替える前と同じである
      - 既存の項目の ID が変わらず、project-index の `search_docs` で D-1 の本文がヒットする
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンで、ワークスペースが配信されている'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_markdown_bodies_renamed
    notes:
      改名先が既にあるとき: 改名先の `.mark.md` が既にあるときは手順が失敗し、コピーから戻す。履歴（`history.yaml`）の `before.body` の改名前のパスも改名後のパスに書き換える（『記録の形式の移行』の v0.14.0 の手順）
  - name: 正常シナリオ（本文と埋め込むファイルを直下へ移す）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を起動し、MindStella の API のワークスペースの作成と、MindStella の MCP の `check` を呼ぶ
      - name: 本文を .mindstella/ に持つワークスペース
        description: '`.mindstella/mindstella-version.ini` がこの移し替えの手順を持つバージョンより前で、検討事項 D-1 が `body: docs/D-1.mark.md`、資料 A-1 が `body: docs/A-1.mark.md` を持ち、`.mindstella/docs/` にそれぞれの本文、`.mindstella/files/clip.mp4`、`.mindstella/release/A-1.mark.md` を持つワークスペース。直下には `docs/`・`files/` が無い'
        notes: 'YAML と本文を直接書いて作る。A-1 の本文は `![動画](../files/clip.mp4)` を持つ。D-1 の変更履歴（`history.yaml`）に `before.body: docs/D-1.md` の回を 1 件持つ'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取る
        SV->>WS: .mindstella/docs/ と .mindstella/files/ を直下へ移し、項目と変更履歴の body を書き換える
        SV->>WS: .mindstella/release/ を削除する
        SV->>WS: 配信の設定を直下の docs/ を指すように書き換える
        SV->>WS: 点検し、バージョンのファイルを書き換える
        SV-->>CL: ワークスペースの ID と画面の URL
        CL->>SV: check
        SV-->>CL: 問題 0 件
      ```

      <!-- /map -->
    expected:
      - 直下の `docs/` に `D-1.mark.md`・`A-1.mark.md` があり、中身が移し替える前の `.mindstella/docs/` の本文と同じである
      - 直下の `files/clip.mp4` の中身が、移し替える前の `.mindstella/files/clip.mp4` と同じである
      - '`.mindstella/` に `docs/`・`files/`・`release/` が無い'
      - D-1 の `body` が `../docs/D-1.mark.md`、A-1 の `body` が `../docs/A-1.mark.md` で、D-1 の変更履歴の `before.body` が `../docs/D-1.md` である
      - A-1 の本文の `../files/clip.mp4` が書き換わっていない
      - project-index の `search_docs` で、D-1 が移し替える前と同じ本文でヒットする
      - 移し替えの後に、どの項目も変更履歴の回が増えていない
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンで、ワークスペースが配信されている'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_bodies_moved_to_root
    notes:
      移し替えと変更の検知: 本文の移動を項目の変更として記録しない。移し替えを適用したら変更の検知の前回の中身を再作成する（『変更の検知』の `rebase_snapshot`）
  - name: 異常シナリオ（直下に docs/ が既にある）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を起動し、MindStella の API のワークスペースの作成を呼ぶ
      - name: 直下に利用者の docs/ を持つワークスペース
        description: 正常シナリオ（本文と埋め込むファイルを直下へ移す）と同じワークスペースに、利用者が作った `docs/memo.md` を直下に持つワークスペース
        notes: '`files/` が既にあるときも同じ振る舞いにする'
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: コピーを取る
        SV->>WS: 直下に docs/ が既にあることを確認し、手順を止める
        SV->>WS: コピーから戻す
        SV-->>CL: エラー（失敗したバージョン・手順と、直下の docs/ を改名する案内）
      ```

      <!-- /map -->
    expected:
      - ワークスペースの作成がエラーを返し、応答に失敗したバージョン・手順と、直下に `docs/` が既にあるため改名してから再度開く案内がある
      - 直下の `docs/memo.md` とワークスペースの全てのファイルの中身が、呼ぶ前と同じである
      - ワークスペースが配信されていない
    test: test_error_when_root_docs_exists
  - name: 正常シナリオ（同じバージョンに後から追加した手順を実行する）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を起動し、MindStella の API のワークスペースの作成を 2 回と、MindStella の MCP の `check` を呼ぶ
      - name: 後から追加した手順を実行していないワークスペース
        description: '`.mindstella/mindstella-version.ini` がプラグインと同じバージョンで、そのバージョンの手順のうち本文の Markdown を mdmark の文書の拡張子へ改名する手順を実行していない（検討事項 D-1 が `body: docs/D-1.md` を持ち、記録の読み込みがスキーマに合わない）ワークスペース'
        notes: YAML と本文を直接書いて作る。手順を追加する前にそのバージョンを記録したワークスペースに当たる
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（プラグインと同じ）
        SV->>SV: そのバージョンの手順のうち、実行していない手順を集める
        SV->>WS: コピーを取り、本文を .mark.md へ改名して項目の body を書き換える
        SV-->>CL: ワークスペースの ID と画面の URL
        CL->>SV: check
        SV-->>CL: 問題 0 件
        CL->>SV: もう一度ワークスペースを作成する
        SV->>SV: 実行していない手順が無い
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - D-1 の `body` が `../docs/D-1.mark.md` で、直下の `docs/D-1.mark.md` の中身が移し替える前の `D-1.md` と同じである
      - project-index の `search_docs` で D-1 がヒットし、スキーマに合わない旨の警告が無い
      - '`check` が問題を 0 件で返す'
      - 2 回目の作成ではコピーが取られず、ワークスペースの全てのファイルの中身が 1 回目の後と同じである
    test: test_normal_when_step_added_to_same_version
lead: 常駐サーバーが、ワークスペースを読み込むときに記録のバージョンとプラグインのバージョンを比べ、古ければバージョンごとの手順を順に適用して移し替え、スキーマの複製をプラグインのスキーマにそろえてから配信する単一ユースケース。
issue: 43
primary_actor: 常駐サーバー
stakeholders:
  - name: 利用者
    interest: プラグインを上げても、作ったワークスペースを壊さずに今のバージョンの形式で話し合いを続けられる。移し替えのためにスキルを呼ばなくてよい。失敗しても移し替える前の中身に戻る。削除するキーの値が記録から失われない
trigger: 常駐サーバーが、ワークスペースの作成（記録が残っているフォルダを開く）か MindStella のセッションの作成で、ワークスペースを読み込む
preconditions:
  - 常駐サーバーが起動している
  - ワークスペースのフォルダが、許可するフォルダの下にある
success_guarantee: 記録したバージョンより後でプラグインのバージョン以下のバージョンの手順がバージョンの順に適用され、全ての YAML が今のスキーマに合い、`.mindstella/mindstella-version.ini` がプラグインのバージョンになってから配信される。バージョンが同じで手順を適用しないときも含め、`.mindstella/schemas/` のスキーマの複製がプラグインのスキーマと同じ中身になってから配信される。削除するキーの値は記録から失われない。
minimal_guarantee: 手順の途中で失敗したときは、ワークスペースが移し替える前の中身に戻り、配信せずに、どのバージョンのどの手順で何が失敗したかを応答に返す。ワークスペースのバージョンがプラグインより新しいときは、何も書かずに配信を断る。
frequency: ワークスペースの形式を変えたバージョンへプラグインを上げた後、ワークスペースごとに最初に読み込むときに 1 回。スキーマの複製の照合は、ワークスペースを読み込むたび
priority: 高
notes:
  E2E の範囲: E2E はモデルを呼ばず、常駐サーバーにワークスペースの作成を依頼して、移し替えたワークスペースの状態と応答を確かめる
  対応テストファイル: '`tests/e2e/単一ユースケース/test_workspace_upgrade.py`。E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` へ移す'
  値が要る補正: 移し替えは利用者に確かめずに手順を適用する。利用者の判断が要る補正（案を持たない未決定の検討事項・案と状態の合わない検討事項など）は移し替えでは行わず、点検が問題として返し、MindStella のセッションが記録の使い分けで検討事項に挙げる。値が要るキー（題名など）は、フォルダの名前を仮の値として入れる
  削除するキーの値の残し方: 対象・カテゴリーの値は、その名前のタグ（`topic:{値}`）として項目に追加する。属性（`attrs`）・調査の観点（`angles`）と確かさ（`confidence`）は、本文の末尾の表として残す。フェーズ・重み・納品物のマーカー・プレイブック・ゴールは残さずに削除する。`.mindstella/release/` は、本文を直下へ移す手順で削除する
test_file: tests/e2e/単一ユースケース/test_workspace_upgrade.py

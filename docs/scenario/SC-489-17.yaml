id: SC-489-17
title: "ワークスペースの移し替え"
scenarios:
  - name: 正常シナリオ（読み込みのとき）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 削除するキーを持つ前のバージョンのワークスペース
        description: この作業 PR の前のバージョンをバージョンのファイルに持ち、`config.yaml` に `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持ち、検討事項 D-1 が `phase`・`target`・`category`・`attrs`・`weight` を、資料 A-1 が `deliverable` を、調査 R-1 が `angles`・`confidence` を持ち、`.mindstella/release/` を持つワークスペース
        notes: 'YAML を直接書いて作る。D-1 の `target`・`category` は `認証`・`方式`、`attrs` は `{優先度: 高}`。R-1 の `angles` は `[費用, 運用]`、`confidence` は `中`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する（記録が残っているフォルダ）
        SV->>WS: バージョンのファイルを読む（前のバージョン）
        SV->>WS: 写しを取る
        SV->>WS: 削除するキーを除き、対象・カテゴリーをタグに、属性・観点・確かさを本文に移す
        SV->>WS: 点検し、バージョンのファイルを書き換える
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンである'
      - '`config.yaml` が `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持たず、ほかのキーは移し替える前と同じである'
      - D-1・A-1・R-1 が、削除するキー（`phase`・`target`・`category`・`attrs`・`weight`・`deliverable`・`angles`・`confidence`）を持たない
      - 'D-1 がタグ `topic:認証`・`topic:方式` を持ち、D-1 の本文の末尾の表に `優先度: 高` がある'
      - R-1 の本文の末尾の表に、観点 `費用`・`運用` と確かさ `中` がある
      - '`.mindstella/release/` が移し替える前と同じ中身で残っている'
      - 既存の項目の ID が変わらず、project-index の `search_docs` で D-1 がヒットする
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_loaded
  - name: 正常シナリオ（バージョンが同じ）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: 今のバージョンのワークスペース
        description: '今のバージョンで作り、資料 A-1（`status: 完成`）を足したワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（プラグインと同じ）
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - ワークスペースの全てのファイルの中身と更新日時が、呼ぶ前と同じである
      - 写しが取られていない
    test: test_normal_when_same_version
  - name: 異常シナリオ（手順の途中で失敗する）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: 手順が読めないワークスペース
        description: この作業 PR の前のバージョンをバージョンのファイルに持ち、`decisions.yaml` が YAML として読めない中身のワークスペース
        notes: '`decisions.yaml` には閉じていない括弧（`items: [`）を書く'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: 写しを取る
        SV->>SV: 手順を適用する途中で失敗する
        SV->>WS: 写しから戻す
        SV-->>CL: エラー（失敗したバージョン・手順・理由）
      ```
    expected:
      - ワークスペースの作成がエラーを返し、応答に失敗したバージョン・手順・`decisions.yaml` を読めない理由がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
      - ワークスペースが配信されていない
    test: test_error_when_step_fails
  - name: 異常シナリオ（バージョンが新しい）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: バージョンが新しいワークスペース
        description: 今のバージョンで作り、バージョンのファイルを `v99.0.0` に書き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（v99.0.0）
        SV-->>CL: エラー（ワークスペースのバージョンが新しい。プラグインを更新する）
      ```
    expected:
      - ワークスペースの作成がエラーを返し、理由にワークスペースのバージョンがプラグインより新しいことがある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_workspace_newer
  - name: 正常シナリオ（バージョンを記録する前の形式）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成を呼ぶ
      - name: バージョンを記録する前の形式のワークスペース
        description: 'バージョンのファイルを持たず、`mindmap.yaml` が `summary` を持たず `field: システム開発` を持ち、資料 A-1（`done: true`）・A-2（`done: false`）を持つワークスペース'
        notes: YAML を直接書いて作る。フォルダの名前は `要件出し`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: バージョンのファイルを読む（無い）
        SV->>WS: 写しを取り、バージョンを記録する前の形式からプラグインのバージョンまでの手順を順に適用する
        SV->>WS: 題名にフォルダの名前を仮に入れ、バージョンのファイルを書く
        SV-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンである'
      - '`docs.yaml` の A-1 が `status: 完成`、A-2 が `status: 下書き` で、どちらも `done` を持たない'
      - '`config.yaml` の `summary` が `要件出し` で、`field`・`playbooks` を持たない'
      - ワークスペースに `mindmap.yaml` が無く、種類ごとの YAML・`docs/` が `.mindstella/` の下にあり、直下に残っていない
      - 資料 A-1・A-2 の本文が、移し替える前と同じ中身で `.mindstella/docs/` にある
      - '`check` が問題を 0 件で返す'
    test: test_normal
  - name: 正常シナリオ（利用者の判断が要る補正が残る）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーと project-index を立て、MindStella の API のワークスペースの作成と、MindStella の MCP の `check` を呼ぶ
      - name: v0.6.0 のワークスペース
        description: '`.mindstella/mindstella-version.ini` が `v0.6.0` で、`answer` と `reason` を持ち案を持たない決定済みの D-1、案を持たない未決定の D-2、案 A を採用した未決定の D-4 を持つワークスペース'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as 外部のアプリ（起動のコマンド）
        participant SV as 常駐サーバー
        participant WS as ワークスペース

        CL->>SV: ワークスペースを作成する
        SV->>WS: 写しを取り、v0.6.0 より新しくプラグインのバージョンまでの手順を適用する（D-1 に答えから採用した案を作る）
        SV-->>CL: ワークスペースの ID と画面の URL
        CL->>SV: check
        SV-->>CL: D-2 が案を持たない・D-4 が採用した案を持つのに未決定
      ```
    expected:
      - D-1 が案を 1 つだけ持ち、その案が採用で、`content` が移し替えの前の `answer`、`reason` が移し替えの前の `reason` であり、D-1 は決定済みのままである
      - D-2・D-4 は移し替える前と同じ中身で、`check` が D-2 と D-4 を問題として返す
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンで、ワークスペースが配信されている
    test: test_normal_when_corrections_remain
lead: 常駐サーバーが、ワークスペースを読み込むときに記録のバージョンとプラグインのバージョンを比べ、古ければバージョンごとの手順を順に適用して移し替えてから配信する単一ユースケース。
issue: 43
primary_actor: 常駐サーバー
stakeholders:
  - name: 利用者
    interest: プラグインを上げても、作ったワークスペースを壊さずに今のバージョンの形式で話し合いを続けられる。移し替えのためにスキルを呼ばなくてよい。失敗しても移し替える前の中身に戻る。削除するキーの値が記録から失われない
trigger: 常駐サーバーが、ワークスペースの作成（記録が残っているフォルダを開く）か MindStella のセッションの作成で、ワークスペースを読み込む
preconditions:
  - 常駐サーバーが起動している
  - ワークスペースのフォルダが、許可するフォルダの下にある
success_guarantee: 記録したバージョンより後でプラグインのバージョン以下のバージョンの手順がバージョンの順に適用され、全ての YAML が今のスキーマに合い、`.mindstella/mindstella-version.ini` がプラグインのバージョンになってから配信される。削除するキーの値は記録から失われない。
minimal_guarantee: 手順の途中で失敗したときは、ワークスペースが移し替える前の中身に戻り、配信せずに、どのバージョンのどの手順で何が失敗したかを応答に返す。ワークスペースのバージョンがプラグインより新しいときは、何も書かずに配信を断る。
frequency: ワークスペースの形式を変えたバージョンへプラグインを上げた後、ワークスペースごとに最初に読み込むときに 1 回
priority: 高
notes:
  E2E の範囲: E2E はモデルを呼ばず、常駐サーバーにワークスペースの作成を依頼して、移し替えたワークスペースの状態と応答を確かめる
  対応テストファイル: '`tests/e2e/単一ユースケース/test_workspace_upgrade.py`。E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` へ移す'
  値が要る補正: 移し替えは利用者に確かめずに手順を適用する。利用者の判断が要る補正（案を持たない未決定の検討事項・案と状態の合わない検討事項など）は移し替えでは行わず、点検が問題として返し、MindStella のセッションが記録の使い分けで検討事項に挙げる。値が要るキー（題名など）は、フォルダの名前を仮の値として入れる
  削除するキーの値の残し方: 対象・カテゴリーの値は、その名前のタグ（`topic:{値}`）として項目に足す。属性（`attrs`）・調査の観点（`angles`）と確かさ（`confidence`）は、本文の末尾の表として残す。フェーズ・重み・納品物の印・プレイブック・ゴールは残さずに削除する。`.mindstella/release/` は削除せずに残す
test_file: tests/e2e/単一ユースケース/test_workspace_upgrade.py

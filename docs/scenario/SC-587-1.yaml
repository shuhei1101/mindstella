id: SC-587-1
title: 動画などのファイルを配置して資料に埋め込む
lead: MindStella のセッションか利用者が、動画・音声・画像のファイルをワークスペースの直下のファイルのフォルダ `files/` に配置し、資料の本文に mdmark の `![キャプション](../files/{名前})` で埋め込み、利用者がサーバーが配るプレビューの詳細パネルで動画・音声を再生し、画像を確認する単一ユースケース。
issue: 519
test_file: tests/e2e/単一ユースケース/test_embed_files.py
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 話し合いで作った動画を、資料を開いたその場で再生して確認できる
  - name: 外部のアプリ（aituber）
    interest: 動画作成ノードが書き出した mp4 を、配置と資料への記載だけで利用者に見せられる
trigger: MindStella のセッションが動画などのファイルを作った、または利用者がファイルを資料に掲載したい
preconditions:
  - ワークスペースが作成済みである
  - サーバーが記録を配っている
success_guarantee: 資料の本文が `../files/{名前}` で指すファイルを、プレビューの詳細パネルと詳細の全画面で再生・表示できる。ファイルの配置は項目の変更として記録されない。
minimal_guarantee: ファイルのフォルダの外のファイルは、プレビューの配信から返却されない。ファイルが無いときも本文のほかの部分は描かれる。
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（常駐サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: ファイル
        description: 数秒の mp4 の動画・mp3 の音声・png の画像
        notes: '`files/clip.mp4`・`files/voice.mp3`・`files/shot.png` に、フローの中で配置する'
      - name: 記録
        description: 本文を Markdown で持つ資料 A-1
        notes: 本文に `![完成した動画](../files/clip.mp4)`・`![読み上げ](../files/voice.mp3)`・`![画面](../files/shot.png)` を持つ。本文の記載と `commit` を済ませておく
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant WS as ワークスペース
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        CC->>WS: ファイルをファイルのフォルダに配置する
        U->>P: 資料のカードで A-1 を押す
        P->>SV: 本文が指すファイルを要求する
        SV-->>P: ファイルのフォルダの中のファイル
        P-->>U: 再生バーを持つ動画・音声と画像を、キャプションつきで描いた詳細パネル
        U->>P: 動画の再生を押し、再生位置を途中へ移す
        P->>SV: 動画の途中からの範囲を要求する
        SV-->>P: 要求した範囲の部分の応答
        P-->>U: 移した位置から再生される動画
      ```
    expected:
      - A-1 の詳細パネルの本文に、再生バーを持つ動画と音声、表示された画像が、それぞれのキャプションつきで出る
      - 動画を再生すると再生位置が進み、再生位置を途中へ移すとその位置から再生される
      - 詳細の全画面でも、動画・音声・画像が同じく出る
      - サーバーの配信が、動画の範囲の要求に部分の応答（206）と要求した範囲の中身を返却する
      - ファイルの配置の後に、どの項目も変更履歴と `updated_at` が変わらない
      - 画面の幅 1280px と 390px のどちらでも、詳細パネルと詳細の全画面で、音声の再生バーが上下を切られずに全体で出る（再生バーの要素の高さが、包む要素に見えている高さと同じ）
    test: test_normal
  - name: 異常シナリオ（埋め込んだファイルが無い）
    setup:
      - name: Mock
        description: なし（常駐サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を Markdown で持つ資料 A-1
        notes: 本文に段落と `![完成した動画](../files/missing.mp4)` を持ち、`files/missing.mp4` は配置しない
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 資料のカードで A-1 を押す
        P->>SV: 本文が指すファイルを要求する
        SV-->>P: 404
        P-->>U: 本文のほかの部分と、動画の場所に読み込めないことの警告を描いた詳細パネル
      ```
    expected:
      - サーバーの配信が `../files/missing.mp4` の要求に 404 を返却し、動画の要素の場所に、ファイルを読み込めないことと本文のパス（`../files/missing.mp4`）を持つ警告が出る（単一ユースケース『ワークスペースの点検』も参照切れとして通知する）
      - A-1 の本文の段落は描かれる
    test: test_error_when_file_missing
  - name: 異常シナリオ（ファイルのフォルダの外を指す）
    setup:
      - name: Mock
        description: なし（常駐サーバーを立て、サーバーの配信へ HTTP のクライアントで要求する）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: フォルダの外のファイル
        description: ワークスペースの記録の `decisions.yaml` と、ワークスペースの外のファイル
        notes: '`files/outside` を、ワークスペースの外のファイルへのシンボリックリンクにする'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as HTTP のクライアント
        participant SV as サーバー

        C->>SV: ファイルのフォルダから .. で decisions.yaml を指すパスを要求する
        SV-->>C: 404
        C->>SV: フォルダの外を指すシンボリックリンクのパスを要求する
        SV-->>C: 404
      ```
    expected:
      - どちらの要求も 404 が返り、本文にファイルの中身を含まない
    test: test_error_when_outside_files_folder
  - name: 異常シナリオ（埋め込んだファイルの形式を再生できない）
    setup:
      - name: Mock
        description: なし（常駐サーバーを起動し、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: ファイル
        description: 拡張子が mp4 で中身が動画でないファイルと、拡張子が png で中身が画像でないファイル
        notes: '`files/broken.mp4`・`files/broken.png` に配置する'
      - name: 記録
        description: 本文を Markdown で持つ資料 A-1
        notes: 本文に段落と `![壊れた動画](../files/broken.mp4)`・`![壊れた画像](../files/broken.png)` を持つ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 資料のカードで A-1 を押す
        P->>SV: 本文が指すファイルを要求する
        SV-->>P: ファイルの中身（200）
        P-->>U: 動画と画像の場所に再生・表示できないことの警告を描いた詳細パネル
      ```

      <!-- /map -->
    expected:
      - 動画と画像のそれぞれの場所に、ファイルを再生・表示できないことと本文のパスを持つ警告が出る
      - A-1 の本文の段落は描かれる
      - 詳細の全画面でも同じ警告が出る
    test: test_error_when_file_unplayable
notes:
  パスの書き方: 資料（ワークスペースの直下の `docs/`）からの相対パス `../files/{名前}` で記載し、mdmark の書き出し・点検と画面で同じパスが通るようにする。ファイルのフォルダの下にフォルダを作ってよい
  E2E の範囲: React の画面で確認する
  HTML の本文: 本文を HTML で持つ資料は、`<img>`・`<video>` の `src` を本文の HTML のまま描き、`../files/{名前}` の解決をしない
  Git 管理外のワークスペース: mindstella はワークスペースの Git を操作しない（記録の YAML と同じ）。ワークスペースが Git のリポジトリの中にあっても Git 管理外でも、ファイルの配置・配信・再生・点検は同じに動く

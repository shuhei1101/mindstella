id: SC-489-45
title: 音声でコメントする
lead: 利用者が、サーバーが配るプレビューのコメントの入力・返信の入力のマイクのボタンで話した内容を、サーバーが文字起こしのインターフェース経由で voice-paste に文字起こしさせ、設定の挙動でレビュー中に追加するか（既定）、入力欄へ挿入するか、その書き込みだけを Claude Code へ送信する単一ユースケース。録音中は入力欄の場所に入力している音声の波形を出し、キーボードの入力を受け付けず、端末の画面を暗くしない。録音中もほかの項目・タブ・スレッドへ移れ、トップバーの音声入力中の表示から録音中の入力欄へ戻れる。音声入力は同時に 1 つだけ。
issue: 402
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: キーボードを使わずに、話した内容をコメント・返信にできる。既定では、確定の後に操作を足さずにレビュー中に溜まり、送信する前にレビュー中で確認・修正できる。録音中もほかの資料を見ながら話し、トップバーからすぐ録音中の入力欄へ戻れる。録音中に端末の画面が暗くならない。文字起こしを使えないときは、押す前に理由が分かる
trigger: 利用者がプレビューで項目やスレッドを読み、話して答えや意見を伝えたくなる
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
  - 同じ端末で voice-paste がブラウザの機能を組み込んで起動している
success_guarantee: '`review`（既定）では、文字起こしの結果を入力欄のカーソルの位置へ挿入した全文が、「レビューに追加」を押したときと同じくレビュー中に溜まり、何も送らない。`insert` では、結果が入力欄のカーソルの位置に入り、何も送らない。`send` では、文字起こしの結果を入力欄のカーソルの位置へ挿入した全文が、その 1 件だけのスレッドの書き込みになり、レビュー中の他の書き込みはそのまま残る。'
minimal_guarantee: キャンセル・文字起こしの失敗・マイクを使えないときは、入力欄の文字・レビュー中の書き込み・スレッドを変えず、理由を画面に出す。レビュー中への追加に失敗したときは、挿入した全文を入力欄に残して理由を出す。端末が画面の消灯の抑止に対応していないときも、録音と文字起こしはそのまま行う。
frequency: プレビューを読むたびに数回
priority: 中
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `done` と固定の文字「案 A にする」を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が文字起こし後の挙動を持たず（既定の `review`）、用語集のプリセットに `開発` を選んだワークスペース
      - name: 記録
        description: 案 A・B を持つ未決定の検討事項 D-1
      - name: レビュー中の書き込み
        description: D-1 への「案 B も見たい」の 1 件
      - name: 開いている画面
        description: 検討事項のボードで、D-1 の詳細パネルを開いている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant VP as voice-paste（偽のサーバー）
        participant WS as ワークスペース
        U->>P: コメントの入力のマイクのボタンを押す
        P-->>U: 録音中にし、入力欄の場所に入力している音声の波形を出し、「レビューに追加」の位置に × の「キャンセル」と ✓ の「文字起こし」を出し、トップバーに音声入力中の表示を出す
        P->>P: 端末の画面を暗くしないよう、ブラウザに画面の消灯の抑止（Screen Wake Lock）を求める
        U->>P: キーボードで文字を打つ
        P-->>U: 入力欄の文字を変えない
        U->>P: 話してから「文字起こし」を押す
        P->>P: 画面の消灯の抑止を解く
        P->>SV: 録音した音声を送る
        SV->>VP: 音声と用語集のプリセットを渡して文字起こしを依頼する
        SV->>VP: 終わるまで状態を待つ
        VP-->>SV: 「案 A にする」
        SV-->>P: 文字起こしの結果
        P->>P: 入力欄のカーソルの位置に「案 A にする」を挿入する
        P->>SV: 入力欄の全文「案 A にする」をレビュー中に溜める
        SV->>WS: D-1 への「案 A にする」をレビュー中の書き込みに足す
        SV-->>P: 溜めた結果
        P-->>U: 波形を入力欄に戻して空にし、レビュー中に溜めたことを出して、元のボタンに戻し、トップバーの音声入力中の表示を消す
      ```
    expected:
      - 録音中は、入力欄の場所に波形が出て、キーボードで打った文字が入力欄に入らない
      - 録音中は、トップバーに音声入力中の表示が出て、画面の消灯の抑止を取得している
      - 文字起こしの後、レビュー中の書き込みが「案 B も見たい」と「案 A にする」の 2 件になり、スレッドは 0 件のままで、Claude Code へ何も送っていない
      - 偽のサーバーが受けた依頼の用語集のプリセットが `開発` である
      - 入力欄が空で、「レビューに追加」とマイクのボタンが元の位置に戻り、トップバーの音声入力中の表示が消え、画面の消灯の抑止を解いている
    test: test_normal
  - name: 正常シナリオ（打ちかけの文字に続けて送信する）
    setup:
      - name: Mock
        description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `done` と固定の文字「案 A にする」を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の文字起こし後の挙動が `send` のワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 開いている画面
        description: 'D-1 の詳細パネルで、コメントの入力に「確認: 」と入れ、カーソルを末尾に置いている'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant VP as voice-paste（偽のサーバー）
        participant WS as ワークスペース
        U->>P: マイクのボタンを押し、話してから「文字起こし」を押す
        P->>SV: 録音した音声を送る
        SV->>VP: 文字起こしを依頼し、終わるまで待つ
        VP-->>SV: 「案 A にする」
        SV-->>P: 文字起こしの結果
        P->>P: 入力欄のカーソルの位置に「案 A にする」を挿入する
        P->>SV: 入力欄の全文「確認: 案 A にする」をその 1 件として送る
        SV->>WS: D-1 への「確認: 案 A にする」を、オープンのスレッドの最初の書き込みにする
        SV-->>P: 送った結果
        P-->>U: 送ったことを出し、元のボタンに戻す
      ```
    expected:
      - 'オープンのスレッドが 1 件増え、最初の書き込みが D-1 への利用者の「確認: 案 A にする」で、取り込み待ちである'
      - 入力の近くに送ったことと、Claude Code へ入力しなかったことが出る（MCP のクライアントがペインを引数に入れないため）
      - 入力欄が空で、「レビューに追加」とマイクのボタンが元の位置に戻る
      - レビュー中の書き込みが 0 件のままである
    test: test_normal_when_sent_after_typed_text
  - name: 正常シナリオ（返信を送信する）
    setup:
      - name: Mock
        description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `done` と固定の文字「案 A にする」を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の文字起こし後の挙動が `send` のワークスペース
      - name: スレッド
        description: AI の返信で終わるオープンのスレッド TH-1
      - name: レビュー中の書き込み
        description: TH-1 への返信「了解」の 1 件
      - name: 開いている画面
        description: コメントの一覧で TH-1 を開いている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant VP as voice-paste（偽のサーバー）
        participant WS as ワークスペース
        U->>P: 返信の入力のマイクのボタンを押し、話してから「文字起こし」を押す
        P->>SV: 録音した音声を送る
        SV->>VP: 文字起こしを依頼し、終わるまで待つ
        VP-->>SV: 「案 A にする」
        SV-->>P: 文字起こしの結果
        P->>P: 返信の入力欄のカーソルの位置に「案 A にする」を挿入する
        P->>SV: 入力欄の全文「案 A にする」を TH-1 への返信 1 件として送る
        SV->>WS: TH-1 の末尾に「案 A にする」を足す
        SV-->>P: 送った結果
        P-->>U: TH-1 の末尾に「案 A にする」を出す
      ```
    expected:
      - TH-1 の末尾に利用者の「案 A にする」が足され、AI の未読で、TH-1 が取り込み待ちである
      - レビュー中の書き込みが TH-1 への返信「了解」の 1 件のまま残る
      - 返信の入力の近くに送ったことと、Claude Code へ入力しなかったことが出る（MCP のクライアントがペインを引数に入れないため）
      - 返信の入力欄が空で、「レビューに追加」とマイクのボタンが元の位置に戻る
    test: test_normal_when_reply_sent
  - name: 正常シナリオ（入力欄へ挿入する）
    setup:
      - name: Mock
        description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `done` と固定の文字「案 A にする」を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の文字起こし後の挙動が `insert` のワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant VP as voice-paste（偽のサーバー）
        U->>P: D-1 の詳細パネルのコメントの入力に「確認: でよい」と入れ、カーソルを「確認: 」の後ろに置く
        U->>P: マイクのボタンを押し、話してから「文字起こし」を押す
        P->>SV: 録音した音声を送る
        SV->>VP: 文字起こしを依頼し、終わるまで待つ
        VP-->>SV: 「案 A にする」
        SV-->>P: 文字起こしの結果
        P-->>U: 入力欄のカーソルの位置に「案 A にする」を挿入する
      ```
    expected:
      - '入力欄が「確認: 案 A にするでよい」で、カーソルが挿入した文字の後ろにある'
      - スレッドとレビュー中の書き込みが 0 件のままである
    test: test_normal_when_inserted
  - name: 正常シナリオ（録音をキャンセルする）
    setup:
      - name: Mock
        description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `done` と固定の文字「案 A にする」を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 開いている画面
        description: D-1 の詳細パネルで、コメントの入力に「案 B も見たい」と入れている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        U->>P: マイクのボタンを押し、話してから「キャンセル」を押す
        P->>P: 録音を捨て、マイクと画面の消灯の抑止を解放する
        P-->>U: 波形を入力欄に戻し、元のボタンに戻し、トップバーの音声入力中の表示を消す
      ```
    expected:
      - 入力欄が「案 B も見たい」のままである
      - 偽のサーバーが文字起こしの依頼を 1 件も受けていない
      - スレッドとレビュー中の書き込みが 0 件のままで、「レビューに追加」とマイクのボタンが元の位置に戻る
      - トップバーの音声入力中の表示が消え、画面の消灯の抑止を解いている
    test: test_normal_when_cancelled
  - name: 正常シナリオ（録音中にほかの項目へ移って戻る）
    setup:
      - name: Mock
        description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `done` と固定の文字「案 A にする」を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませ、文字起こし後の挙動が既定の `review` のワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1・D-2 と、オープンのスレッド TH-1
      - name: 開いている画面
        description: 検討事項のボードで、D-1 の詳細パネルを開いている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース
        U->>P: D-1 のコメントの入力のマイクのボタンを押す
        P-->>U: 録音中にし、トップバーに音声入力中の表示を出す
        U->>P: D-2 を開く
        P-->>U: 録音を続けたまま D-2 の詳細パネルを出し、D-2 のコメントの入力のマイクのボタンを押せなくする
        U->>P: D-2 のコメントの入力に「D-2 も確認」と打つ
        P-->>U: D-2 の入力欄に「D-2 も確認」を出す
        U->>P: コメントの一覧で TH-1 を開く
        P-->>U: 録音を続けたまま TH-1 を出し、返信の入力のマイクのボタンを押せなくする
        U->>P: トップバーの音声入力中の表示を押す
        P-->>U: D-1 の詳細パネルを開き、コメントの入力の場所に録音中の波形と「キャンセル」「文字起こし」を出して、フォーカスを移す
        U->>P: 話してから「文字起こし」を押す
        P->>SV: 録音した音声を送り、結果の全文をレビュー中に溜める
        SV->>WS: D-1 への「案 A にする」をレビュー中の書き込みに足す
        P-->>U: レビュー中に溜めたことを出し、トップバーの音声入力中の表示を消して、ほかの入力欄のマイクのボタンを押せるように戻す
      ```
    expected:
      - D-2 と TH-1 を開いている間も録音が続き、トップバーに音声入力中の表示が出ている
      - 録音中は、D-2 のコメントの入力と TH-1 の返信の入力のマイクのボタンが押せず、D-2 の入力欄にはキーボードで「D-2 も確認」を打てる
      - トップバーの表示を押すと、D-1 の詳細パネルが開き、D-1 のコメントの入力にフォーカスがある
      - 文字起こしの後、レビュー中の書き込みが D-1 への「案 A にする」の 1 件で、D-2 の入力欄は「D-2 も確認」のままである
      - 録音を終えた後、D-2 のコメントの入力と TH-1 の返信の入力のマイクのボタンが押せる
    test: test_normal_when_moved_while_recording
  - name: 異常シナリオ（文字起こしのサービスが止まっている）
    setup:
      - name: Mock
        description: 偽のサーバーを立てず、MCP サーバーを誰も待ち受けていないポートへ向けて立てる。サーバーが配るプレビューを、偽のマイクを許した実際のブラウザで開く
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        U->>P: D-1 の詳細パネルを開く
        P->>SV: 文字起こしを使えるかを読む
        SV->>SV: サーバーが文字起こしのサービスに届かない
        SV-->>P: 使えない理由
        P-->>U: マイクのボタンを押せなくし、理由をツールチップに出す
      ```
    expected:
      - コメントの入力と返信の入力のマイクのボタンが押せない
      - マイクのボタンのツールチップに、文字起こしのサービスが起動していない旨が出る（画面に voice-paste の名前を出さない）
      - 「レビューに追加」は今までどおり押せる
    test: test_error_when_transcriber_stopped
  - name: 異常シナリオ（文字起こしのサービスが音声の受け付けに対応していない）
    setup:
      - name: Mock
        description: '`/web/` の下へ 404 を返す偽のサーバーを立て、MCP サーバーをその偽のサーバーへ向けて立てる。サーバーが配るプレビューを、偽のマイクを許した実際のブラウザで開く'
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者

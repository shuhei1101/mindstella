      - 削除する側では、レビュー中の書き込みの画面に C-1 が削除した行として出て、その他のマイクのボタンを押せる
      - '送信する側では、C-1 がオープンのスレッドの最初の書き込み「確認: 」になり、偽のサーバーが文字起こしの依頼を受けていない'

notes:
  画面の文言: マイクのボタン・録音中のボタン・ツールチップ・結果の文言はモック作成で決め、画面設計に書く
  録音中の波形: 波形の見た目はモック作成で決め、部品設計に書く
  トップバーの音声入力中の表示: 位置・見た目と、詳細の全画面で始めた録音へ戻るときに開く画面はモック作成で決め、部品設計・画面設計に書く。詳細の全画面などのモーダルを開いている間はトップバーを押せないため、モーダルを閉じてから戻る
  画面の消灯の抑止: 録音の開始で取得し、文字起こしへ進む・キャンセル・録音の失敗・録音を捨てたときに解く。録音中に画面が隠れて戻ったときは取り直す
  Claude Code への入力: '`send` で送った書き込みを Claude Code へ入力する手順と、入力できなかったときの扱いは、単一ユースケース『コメントを選んで送る』と同じ'
  対象の画面: 今の画面と React の画面の両方のコメントの入力・返信の入力にマイクのボタンを置く。レビュー中の書き込みの書き換えの入力には置かない
  配る書き出し: 配る書き出しはコメント・返信の入力を持たないため、マイクのボタンも持たない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を足す
test_file: tests/e2e/単一ユースケース/test_voice_comment.py

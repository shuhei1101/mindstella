        P-->>U: 録音を続けたまま C-2 を修正の入力にし、C-1 の行に「修正」「削除」を戻す
        U->>P: C-1 を削除する（送信する側では、C-1 をチェックしたまま「まとめて送信する」を押す）
        P->>SV: レビュー中の書き込みを削除する（送信する側では、チェックした書き込みを送信する）

        U->>P: 「修正」を押す
        P->>SV: レビュー中の書き込みの本文を書き換える
        SV->>WS: 書き込みの本文を「確認: 案 A にするでよい」にする
        P-->>U: 行の本文を「確認: 案 A にするでよい」で出す
      ```
    expected:
      - '文字起こしの後、修正の入力欄が「確認: 案 A にするでよい」で、カーソルが挿入した文字の後ろにあり、レビュー中の書き込みはまだ「確認: でよい」のままである'
      - 文字起こしの後、レビュー中の書き込みの件数とスレッドの件数が変わらず、Claude Code へ何も送信していない
      - '「修正」を押すと、修正した書き込みの本文が「確認: 案 A にするでよい」になり、ほかの書き込みは変わらない'

      participant MGR as セッションの管理
      participant PI as project-index

      APP->>API: ワークスペースの作成を依頼する（POST /workspaces）
      API->>WSM: ワークスペースの作成を依頼する
      WSM->>WSM: 記録を作り、進め方の文書を設定に記録する
      WSM->>MGR: 追加の MCP・プラグインの記録を依頼する
      WSM->>PI: 配信元に登録する
      PI-->>WSM: 登録の失敗
      WSM->>WSM: この依頼で作った記録を削除し、状態のフォルダの記録の削除を依頼する
      API-->>APP: 失敗した段階（配信元の登録）と理由
    ```
  expected:
  - この依頼で作った記録と、状態のフォルダの記録が残っていない
  - 外部のアプリが、失敗した段階（配信元の登録）と理由を含むエラーを受け取っている
  test: test_error_when_source_registration_fails
- name: 異常シナリオ（空いたアカウントが無い）
  setup:
  - name: Mock
    description: claude-balancer（全てのアカウントが利用の上限に達していて、`exec` がエラーで終わる）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: ワークスペース
    description: 作成済みで、MindStella のセッションが無い
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant MGR as セッションの管理
      participant CB as claude-balancer

      APP->>API: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
      API->>MGR: MindStella のセッションの作成を依頼する
      MGR->>CB: tmux のペインの中で claude-balancer exec を起動する
      CB-->>MGR: 空いたアカウントが無い
      MGR->>MGR: tmux のペインを閉じる
      API-->>APP: 空いたアカウントが無いエラー（ワークスペースは開いたまま）
    ```
  expected:
  - tmux のペインが残っておらず、状態に MindStella のセッションが登録されていない
  - ワークスペースは開いたままで、配信元の行も残っている
  - 外部のアプリが、空いたアカウントが無いエラーを受け取っている
  test: test_error_when_no_account
- name: 異常シナリオ（MindStella のセッションの準備ができない）
  setup:
  - name: Mock
    description: Claude Code のセッション（tmux では起動するが、上限の時間までに SessionStart のフックを呼ばない）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: ワークスペース
    description: 作成済みで、MindStella のセッションが無い
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant MGR as セッションの管理
      participant CC as MindStella のセッション

      APP->>API: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
      API->>MGR: MindStella のセッションの作成を依頼する
      MGR->>CC: tmux のペインの中で起動する
      MGR->>MGR: 上限の時間まで状態への登録を待つ
      MGR->>CC: 止めて tmux のペインを閉じる
      API-->>APP: 失敗した段階（MindStella のセッションの準備）と理由
    ```
  expected:
  - MindStella のセッションが止まり、tmux のペインが残っていない
  - ワークスペースは開いたままで、配信元の行も残っている
  - 外部のアプリが、失敗した段階（MindStella のセッションの準備）と理由を含むエラーを受け取っている
  test: test_error_when_session_not_ready
- name: 異常シナリオ（常駐サーバーが起動していない）
  setup:
  - name: Mock
    description: '`systemctl --user` は、受けた引数を記録し、`start` で常駐サーバーのプロセスを起動するコマンドに置き換える'
  - name: 常駐サーバー
    description: 起動していない
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant CMD as 起動のコマンド
      participant API as MindStella の API

      APP->>API: ワークスペースの作成を依頼する（POST /workspaces）
      API-->>APP: 接続できない
      APP->>CMD: 起動のコマンドで常駐サーバーを起動する（systemd --user のユニットを起動する）
      CMD-->>APP: 起動した
      APP->>API: ワークスペースの作成を依頼し直す
    ```
  expected:
  - 外部のアプリが接続できないことを受け取り、常駐サーバーを起動した後の依頼で正常シナリオと同じ結果になっている
  test: test_error_when_server_down
lead: 外部のアプリがフォルダ・進め方の文書・追加の MCP・プラグインを指定してワークスペースを作り、続けて MindStella のセッションの作成を依頼し、MindStella のセッションの準備ができてから画面の URL と MindStella のセッションの ID を受け取る単一ユースケース。
issue: 516
primary_actor: 外部のアプリ（aituber など）
stakeholders:
- name: 外部のアプリ
  interest: 自分の進め方の文書と MCP で、利用者と話し合う MindStella のセッションを API だけで始められる
- name: 利用者
  interest: 画面の URL を開けば、外部のアプリが始めた話し合いに加われる
trigger: 外部のアプリが MindStella の API にワークスペースの作成を依頼する
preconditions:
- 常駐サーバーが起動している
- 指定するフォルダが、設定で許可するフォルダの下にある
- 進め方の文書の配信元の `scope.read` が、ワークスペースを作るフォルダを含む
success_guarantee: ワークスペースの記録があり、その設定に進め方の文書が、状態のフォルダに追加の MCP・プラグインが記録され、ワークスペースが project-index の配信元に登録され、状態のフォルダのワークスペースの ID の一覧にある。MindStella のセッションが tmux で起動して準備ができ、外部のアプリが画面の URL と MindStella のセッションの ID を受け取っている。
minimal_guarantee: ワークスペースの作成に失敗したときは、記録も配信元の行も状態のフォルダの記録も作らずに失敗の理由を返却する。MindStella のセッションの作成に失敗したときは、起動したプロセスを止め、ワークスペースは開いたまま残し、失敗の理由を返却する。外部のアプリは MindStella のセッションの作成だけを依頼し直せる。
frequency: 外部のアプリが活動（台本作成など）を始めるたびに 1 回
priority: 高
refs:
- SC-531-2#
- SC-489-14#
- SC-489-41#
notes:
  読み替え: 端末からの起動は、起動のコマンドが同じ MindStella の API を呼ぶので、外部のアプリを利用者に読み替える（単一ユースケース『端末から起動する』）。MindStella の MCP の `create_workspace`・`create_session` からの作成は、外部のアプリを MCP を呼んだセッションに読み替える
  並行の依頼: ワークスペースの管理とセッションの管理は、ワークスペースごとに 1 つの順番を共有して依頼を処理する。ワークスペースの作成はフォルダごとに 1 つの順番で処理する
  MCP の接続の確認: 作成のときは定義の形とプラグインのフォルダだけを確かめる。MCP のサーバーが起動しない・つながらないことは検出しない
  準備の判定: 準備ができたことは、SessionStart のフックが状態に登録したことで判定し、セッションの管理は上限の時間まで待つ
  受ける Host: API は `Host` が `127.0.0.1`・`localhost` の要求だけを受ける（D-340）
  スコープ外: '状態のフォルダに追加の MCP・プラグインの記録が無いワークスペースの作成（警告と画面の通知）は #520 で扱う'
  E2E の範囲: MindStella のセッションのエージェントと claude-balancer は Mock にし、起動と再開のエージェントフローの中身は確かめない
test_file: tests/e2e/単一ユースケース/test_session_start.py

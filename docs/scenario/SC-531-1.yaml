id: SC-531-1
title: 外部のアプリから起動する
scenarios:
- name: 正常シナリオ
  setup:
  - name: Mock
    description: Claude Code のセッション（起動の引数と環境変数を記録し、SessionStart のフックを呼ぶ）・claude-balancer（`exec` で空いたアカウントを選んだことを記録する）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: project-index
    description: テストごとに立てた project-index の配信元の行の単位の API が、グローバルの設定のファイル（一時ファイル）に行を書く
  - name: ワークスペース
    description: 指定したフォルダにワークスペースの記録が無い
  - name: 依頼
    description: 進め方の文書（配信元の ID と文書の ID）・追加の MCP の定義（`--mcp-config` に渡す形）・プラグイン（`--plugin-dir` に渡すフォルダ）を指定する
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant WSM as ワークスペースの管理
      participant MGR as セッションの管理
      participant PI as project-index
      participant CB as claude-balancer
      participant CC as MindStella のセッション
      participant HK as フック

      APP->>API: ワークスペースの作成を依頼する（POST /workspaces）
      API->>API: 許可するフォルダと、追加の MCP の定義・プラグインを読めるか確かめる
      API->>WSM: ワークスペースの作成を依頼する
      WSM->>PI: 進め方の文書を参照できるか確かめる
      PI-->>WSM: 参照できる
      WSM->>WSM: 記録を作り、ワークスペースの ID と進め方の文書を設定に記録する
      WSM->>MGR: 追加の MCP・プラグインの記録を依頼する
      WSM->>PI: 配信元に登録する（sources[] にワークスペースの行を追加する）
      PI-->>WSM: 登録した結果
      WSM->>WSM: 状態のフォルダのワークスペースの ID の一覧に追加する
      API-->>APP: ワークスペースの ID・画面の URL・今回の追加の MCP とプラグインの指定を記録したか
      APP->>API: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
      API->>WSM: クローズ済みかを確かめる
      API->>MGR: MindStella のセッションの作成を依頼する
      MGR->>CB: tmux のペインの中で claude-balancer exec を起動する（cwd・環境変数・--mcp-config・--plugin-dir）
      CB->>CC: 空いたアカウントで Claude Code を起動する
      CC->>HK: SessionStart
      HK->>MGR: Claude Code の session_id と tmux のペインを状態に登録する
      HK-->>CC: 進め方の文書の場所を注入する
      API-->>APP: MindStella のセッションの ID と画面の URL
    ```
  expected:
  - 指定したフォルダにワークスペースの記録があり、設定にワークスペースの ID と進め方の文書が、状態のフォルダに追加の MCP・プラグインが記録されている
  - グローバルの設定のファイルにワークスペースの行があり、状態のフォルダのワークスペースの ID の一覧にある
  - 作成の応答が、今回の追加の MCP・プラグインの指定を記録したことを示している
  - Mock の claude-balancer が `exec` を受け、Mock のセッションが追加の MCP・プラグイン・MindStella のセッションを見分ける環境変数・進め方の文書の場所の環境変数を指定され、ワークスペースの配下を cwd にして起動している
  - SessionStart のフックの注入に、進め方の文書の場所が入っている
  - 状態に MindStella のセッションの ID・Claude Code の `session_id`・tmux のペインが登録されている
  - 外部のアプリが、SessionStart のフックが状態に登録した後に、MindStella のセッションの ID と画面の URL を受け取っている
  test: test_normal
- name: 正常シナリオ（ワークスペースの記録が既にある）
  setup:
  - name: Mock
    description: なし（Claude Code を起動しない）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: project-index
    description: テストごとに立てた project-index の配信元の行の単位の API が、グローバルの設定のファイル（一時ファイル）に行を書く
  - name: ワークスペース
    description: 指定したフォルダにワークスペースの記録があり、配信元の行と、状態のフォルダの追加の MCP・プラグインの記録が無い（削除した後に同じフォルダを指定した、または別の端末で作った記録を Git で取り込んだ）
  - name: 依頼
    description: 進め方の文書・追加の MCP の定義・プラグインを指定する
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant WSM as ワークスペースの管理
      participant MGR as セッションの管理
      participant PI as project-index

      APP->>API: ワークスペースの作成を依頼する（POST /workspaces）
      API->>WSM: ワークスペースの作成を依頼する
      WSM->>WSM: 残っている記録をそのまま開く（今回の進め方の文書の指定は使わず、設定のまま）
      WSM->>MGR: 状態のフォルダに追加の MCP・プラグインの記録があるかを問い合わせる
      MGR-->>WSM: 無い
      WSM->>MGR: 今回の追加の MCP・プラグインの記録を依頼する
      WSM->>PI: 配信元に登録する
      PI-->>WSM: 登録した結果
      WSM->>WSM: 状態のフォルダのワークスペースの ID の一覧に追加する
      API-->>APP: ワークスペースの ID・画面の URL・今回の指定を記録したこと
    ```
  expected:
  - ワークスペースの記録と設定（ワークスペースの ID・進め方の文書）は変わっていない
  - 状態のフォルダに、今回指定した追加の MCP・プラグインが記録されている
  - ワークスペースが再び配信元に登録され、状態のフォルダの ID の一覧にある
  test: test_normal_when_records_exist
- name: 正常シナリオ（ワークスペースが既に開いている）
  setup:
  - name: Mock
    description: なし（Claude Code を起動しない）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: ワークスペース
    description: 指定したフォルダにワークスペースの記録と配信元の行があり、状態のフォルダの ID の一覧と、追加の MCP・プラグインの記録がある
  - name: 依頼
    description: 記録と違う追加の MCP の定義・プラグインを指定する
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant WSM as ワークスペースの管理

      APP->>API: ワークスペースの作成を依頼する（POST /workspaces）
      API->>WSM: ワークスペースの作成を依頼する
      WSM-->>API: 既に開いているワークスペースの ID（記録・設定・配信元の行・状態のフォルダの記録は変えない）
      API-->>APP: ワークスペースの ID・画面の URL・今回の指定を記録しなかったこと
    ```
  expected:
  - 記録・設定・状態のフォルダの記録・配信元の行は変わらず、外部のアプリが既にあるワークスペースの ID を受け取っている
  - 作成の応答が、今回の追加の MCP・プラグインの指定を記録しなかったことを示している（外部のアプリは設定の書き換えで指定する。D-341）
  test: test_normal_when_workspace_open
- name: 正常シナリオ（クローズしたワークスペースのフォルダ）
  setup:
  - name: Mock
    description: なし（Claude Code を起動しない）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: project-index
    description: テストごとに立てた project-index の配信元の行の単位の API が、グローバルの設定のファイル（一時ファイル）に行を書く
  - name: ワークスペース
    description: '指定したフォルダにワークスペースの記録があり、配信元の行が `outside_read: false`（クローズ済み）。状態がクローズ待ちで、状態のフォルダに追加の MCP・プラグインの記録がある'
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant WSM as ワークスペースの管理
      participant MGR as セッションの管理
      participant PI as project-index

      APP->>API: ワークスペースの作成を依頼する（POST /workspaces）
      API->>WSM: ワークスペースの作成を依頼する
      WSM->>WSM: 残っている記録をそのまま開く（状態のフォルダに記録があるので、今回の追加の MCP・プラグインの指定は使わない）
      WSM->>PI: 配信元の行の outside_read を true に戻す
      PI-->>WSM: 変更した結果
      WSM->>MGR: クローズ待ちを解くよう依頼する
      API-->>APP: ワークスペースの ID と画面の URL
    ```
  expected:
  - ワークスペースの記録・設定・状態のフォルダの追加の MCP とプラグインの記録は変わっていない
  - '配信元の行が `outside_read: true` に戻り、外部のアプリがワークスペースの ID を受け取っている'
  - 状態がクローズ待ちでない
  test: test_normal_when_workspace_closed
- name: 正常シナリオ（claude-balancer が無い端末）
  setup:
  - name: Mock
    description: Claude Code のセッション（起動の引数と環境変数を記録し、SessionStart のフックを呼ぶ）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: 端末
    description: PATH に claude-balancer が無い
  - name: ワークスペース
    description: 作成済みで、MindStella のセッションが無い
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant MGR as セッションの管理
      participant CC as MindStella のセッション

      APP->>API: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
      API->>MGR: MindStella のセッションの作成を依頼する
      MGR->>CC: tmux のペインの中で利用者の既定のアカウントで起動する
      CC->>MGR: 状態に登録した（SessionStart のフック）
      API-->>APP: MindStella のセッションの ID と画面の URL
    ```
  expected:
  - Mock のセッションが claude-balancer を通さずに起動し、外部のアプリが MindStella のセッションの ID と画面の URL を受け取っている
  test: test_normal_when_no_balancer
- name: 異常シナリオ（MindStella のセッションが既にある）
  setup:
  - name: Mock
    description: なし（2 つ目の MindStella のセッションを起動しない）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す
  - name: ワークスペース
    description: 指定したワークスペースで、MindStella のセッションが起動している
  flow: |-
    ```mermaid
    sequenceDiagram
      participant APP as 外部のアプリ
      participant API as MindStella の API
      participant MGR as セッションの管理

      APP->>API: MindStella のセッションの作成を依頼する（POST /workspaces/{id}/sessions）
      API->>MGR: MindStella のセッションの作成を依頼する
      MGR-->>API: 既にある（1 つのワークスペースに 1 つだけ）
      API-->>APP: 既にあるエラーと、起動中の MindStella のセッションの ID・tmux のペイン
    ```
  expected:
  - MindStella のセッションは 1 つのまま
  - 外部のアプリが、既にあるエラーと起動中の MindStella のセッションの ID・tmux のペインを受け取っている
  test: test_error_when_session_exists
- name: 異常シナリオ（クローズしたワークスペース）
  setup:
  - name: Mock
    description: なし（Claude Code を起動しない）
  - name: 常駐サーバー
    description: 起動している。許可するフォルダの環境変数はテストごとの一時フォルダ、グローバルの設定のファイルの環境変数はテストごとの一時ファイル、状態のフォルダの環境変数はテストごとの一時フォルダを指す

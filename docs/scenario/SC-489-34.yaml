    expected:
      - '`write_docs` が違反を返し、書き込まない'
      - 違反に、合わない箇所 `tags[{番号}]` と、オブジェクトで渡すことが要るという理由がある
      - ワークスペースの全てのファイルの中身が、書き込みを呼ぶ前と同じである

lead: MindStella のセッションが、会話で出た検討事項・タスク・調査・資料・用語・メモ・会話ログを、MindStella の MCP で ID を取ってから project-index の書き込みでワークスペースに足し、後から直す単一ユースケース。
issue: 3
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 会話で決めたことが漏れなく残る。形の崩れた記録で、ワークスペースが読めなくならない
trigger: MindStella のセッションが記録の使い分けで、発言を記録する項目に振り分け終える
preconditions:
  - ワークスペースが作成済みである
success_guarantee: 足した項目は `next_id` が振った種類の頭の文字の ID を持ち、変更の検知が作成日・更新日・編集した人（MindStella のセッションの書き込みは `ai`）を記録し、直した項目の更新日が変わり、ワークスペースの全ての YAML がスキーマに合う。どの種類の項目も本文を持て、資料は本文を Markdown か HTML のどちらかで持てる。
minimal_guarantee: スキーマに合わない書き込み・存在しない ID への書き込みでは、project-index がどのファイルも書き換えない。
test_file: tests/e2e/単一ユースケース/test_record_add_update.py
notes:
  読んでいない回: AI が最後に読んだ時点より後の回は、保持する回数を超えても消さない。読んだ時点の記録が無いワークスペースでは、今までどおり超えた古い回を消す（正常シナリオ（保持する回数を超えて直す）はこの形）。保持する回数が 0 のときは、今までどおり積まない
  検討事項の案: 検討事項は、`未整理`・`対象外`・`取り下げ` を除く状態で案を 1 つ以上持つ。`決定済み` は採用した案を 1 つ持ち、採用した案を持つ検討事項は `未決定` にならない。この決まりは種類のスキーマが持ち、project-index の書き込みの検査で止まる。セットアップで足す検討事項もこの形で作る
  変更履歴: 変更履歴・作成日・更新日・編集した人・通し番号は、変更の検知が書き込みを見つけて記録する（単一ユースケース『書き込みを履歴に残す』）。保持する回数と読んでいない回の扱いも、そちらが持つ
  本文の書き込み: 本文のファイルは、project-index#83 で入る `write_docs` の本文の書き込みで書く。この作業 PR は project-index#83 のリリースの後にマージする

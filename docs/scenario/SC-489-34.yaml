    expected:
      - '`write_docs` が違反にせず、検討事項を書き込む'
      - '`.mindstella/decisions.yaml` の足した検討事項が、タグ `通知`・`通知機能` を持つ'
      - '`config.yaml` がタグのキー（`tags`）を持たない'
      - '書き込んだ後の `search_docs` の `group_by: tags` が、`通知`（2 件）と `通知機能`（1 件）を返す'
    test: test_normal_when_new_tag
  - name: 正常シナリオ（主題のタグを付け外しする）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 検討事項の中身
        description: 主題のタグと、主題でないタグを持つ検討事項
        notes: タグ `データ`（主題）・`画面`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース

        CC->>PI: 主題のタグを持つ検討事項を書き込む
        PI->>WS: decisions.yaml に書く
        CC->>PI: その ID の中身を検索する
        PI-->>CC: タグごとの名前と主題か
        CC->>PI: `画面` を主題にし、`データ` の主題を外したタグの並びを書き込む

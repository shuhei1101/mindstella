    expected:
      - 書き込みの後、`.mindstella/decisions.yaml` の検討事項のタグが、`データ`（主題）・`画面`（主題でない）である
      - 検索した結果のタグが、名前と主題かを持つ
      - 修正の後、検討事項のタグが `データ`（主題でない）・`画面`（主題）で、タグの並びが変わっていない
      - 主題でないタグが、主題かのキーを持たない
      - ワークスペースの全ての YAML がスキーマに合う

id: SC-489-34
title: "記録の追加と更新"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、project-index の配信元として配信している、項目を持たないワークスペース
      - name: MindStella のセッション
        description: 状態に登録した、応答の途中の MindStella のセッションの `session_id` で呼ぶ
      - name: 検討事項の中身
        description: タイトル・状態・問いの説明・影響度・案
        notes: 状態 `未決定`、影響度 `大`、案 A・B（推奨の印は A）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant MS as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース
        participant CD as 変更の検知

        CC->>MS: 検討事項の次の ID を取る
        MS-->>CC: D-1
        CC->>PI: D-1 の検討事項を書き込む
        PI->>PI: スキーマと突き合わせる
        PI->>WS: decisions.yaml に書く
        PI-->>CC: 書き込んだ文書の版
        CD->>WS: 書き換わった decisions.yaml を見つけ、D-1 に作成日・更新日・編集した人を記録する
        CC->>PI: D-1 の答えと状態を直し、案 A を採用にする
        PI->>WS: decisions.yaml に書く
        CD->>WS: 書き換わった decisions.yaml を見つけ、更新日を変えて直す前の値を変更履歴に積む
      ```
    expected:
      - '`next_id` が返した ID が `D-` で始まる'
      - '`.mindstella/decisions.yaml` にその ID の項目が 1 件あり、足したタイトル・問いの説明・影響度を持つ'
      - 足した項目が案 A・B を持ち、案 A だけが推奨の印を持つ
      - 更新の後、その項目の答えと状態が直した値になっている
      - 更新の後、その項目が決定済みで、案 A だけが採用である
      - その項目の作成日が追加のときの値のまま、更新日が記録されている
      - 足した時点と更新の後のどちらでも、その項目の `updated_by` が `ai` である
      - ワークスペースの全ての YAML がスキーマに合う
      - 足しただけの時点では、その項目は変更履歴を持たない
      - 更新の後、その項目が変更履歴を 1 回分持ち、直す前の答えと状態と、書き換えた人 `ai` が入っている
    test: test_normal
  - name: 正常シナリオ（並行して ID を取る）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C1 as Claude Code（1 つ目）
        participant C2 as Claude Code（2 つ目）
        participant MS as MindStella の MCP

        C1->>MS: 検討事項の次の ID を取る
        C2->>MS: 検討事項の次の ID を取る
        MS->>MS: ワークスペースの鍵を取り、振った ID を予約に残す
        MS-->>C1: D-2
        MS-->>C2: D-3
      ```
    expected:
      - 2 つの呼び出しが、重ならない ID（`D-2` と `D-3`）を返す
      - どちらの ID の項目もまだ書き込んでいなくても、続けて取った ID が `D-4` になる
  - name: 異常シナリオ（スキーマに合わない）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
      - name: 検討事項の中身
        description: 状態に、決めた状態の名前に無い値を入れた検討事項
        notes: 状態 `完了`（タスクの状態で、検討事項には無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース

        CC->>PI: 状態の値が誤った検討事項を書き込む
        PI->>PI: スキーマと突き合わせて合わない
        PI-->>CC: 合わない箇所を示す違反
      ```
    expected:
      - '`write_docs` が違反を返し、書き込まない'
      - 違反に、合わないキー `status` と、その値 `完了` がある
      - ワークスペースの全てのファイルの中身が、書き込みを呼ぶ前と同じである
    test: test_error_when_schema_mismatch
  - name: 異常シナリオ（存在しない ID を直す）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース

        CC->>PI: 存在しない ID の答えを直す
        PI->>WS: ID を探して見つからない
        PI-->>CC: 文書が無いエラー
      ```
    expected:
      - '`write_docs` がエラーを返す'
      - エラーの本文に、渡した ID がある
      - ワークスペースの全てのファイルの中身が、書き込みを呼ぶ前と同じである
    test: test_error_when_id_not_found
  - name: 正常シナリオ（書き換えをまとめる）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を 1 件足して `commit` したワークスペース
      - name: MindStella のセッション
        description: 状態に登録した、応答の途中の MindStella のセッションの `session_id` で呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant MS as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース
        participant CD as 変更の検知

        CC->>PI: D-1 の答えを直す
        CC->>MS: タスクの次の ID を取る
        CC->>PI: タスク T-1 を書き込む
        CD->>WS: 書き換えを見つけ、まだまとめていない変更に記録する
        CC->>MS: pending
        MS-->>CC: まだまとめていない変更（D-1・T-1）
        CC->>MS: commit（説明「D-1 を決め、T-1 を積む」）
        MS->>WS: まとまりを書く
        CC->>MS: pending
        MS-->>CC: 空
      ```
    expected:
      - 1 回目の `pending` が D-1（変えたキー `answer`）と T-1（足した）を返す
      - '`commit` の後、まとまりが 1 つ増え、日時と説明「D-1 を決め、T-1 を積む」を持つ'
      - D-1 の変更履歴と T-1 が、そのまとまりに属する
      - 2 回目の `pending` が空を返す
      - 書き換えは `commit` を呼ぶ前からワークスペースに書かれている
    test: test_normal_when_changes_committed
  - name: 正常シナリオ（1 回の書き込みで複数の項目を書く）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を 1 件足して `commit` したワークスペース
      - name: 書き込む操作
        description: 検討事項 D-2 を足す → D-2 を進めるタスク T-1 を足す → D-1 の答えと状態を直す、の 3 つをこの順に 1 回の `write_docs` で渡す
        notes: D-2・T-1 の ID は先に `next_id` で取る。T-1 の `related` は種類 `for` で D-2 を指す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant MS as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース
        participant CD as 変更の検知

        CC->>MS: 検討事項とタスクの次の ID を取る
        MS-->>CC: D-2・T-1
        CC->>PI: 追加・追加・更新の操作を並べて書き込む
        PI->>PI: 全てを当てた後に検査する
        PI->>WS: decisions.yaml と tasks.yaml を書く
        CD->>WS: 書き換えを見つけ、日時・通し番号・変更履歴を記録する
        CC->>PI: D-1 を検索する
        PI-->>CC: 直した後の D-1
      ```
    expected:
      - '`write_docs` が 3 つの操作の結果を渡した順に返す'
      - 'T-1 が `related: [{to: D-2, type: for}]` を持つ'
      - 検索した D-1 が、直した後の答えと状態を持つ
      - D-1 が変更履歴を 1 回分持ち、直す前の答えと状態が入っている
      - '`pending` が D-2・T-1（足した）と D-1（変えた）を返す'
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_batched
  - name: 異常シナリオ（まとめた操作の途中が合わない）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を 1 件足したワークスペース
      - name: 書き込む操作
        description: 正しい検討事項を足す → D-1 の状態を、決めた状態の名前に無い値に直す、の 2 つを 1 回の `write_docs` で渡す
        notes: 状態 `完了`（タスクの状態で、検討事項には無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース

        CC->>PI: 追加と誤った更新を並べて書き込む
        PI->>PI: 全てを当てた後に検査して 2 つ目が合わない
        PI-->>CC: 合わない操作と箇所を示す違反
      ```
    expected:
      - '`write_docs` が違反を返し、書き込まない'
      - 違反に、合わないのが 2 つ目の操作であることと、キー `status` と値 `完了` がある
      - 1 つ目の検討事項も足されていない
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_batch_has_invalid_operation
  - name: 正常シナリオ（タスク・用語集・メモに本文を書く）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 本文
        description: タスク T-1・用語 G-1・メモ N-1 にそれぞれ渡す 2 行の本文の Markdown と、N-1 の 2 行目を書き換える `text_edits`
        notes: 'T-1 の本文 `経緯: 会話で持ち越した\n終わり方: 検証の結果を残す`。N-1 は 2 行目を `補足: 書き直した` に直す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant MS as MindStella の MCP
        participant PI as project-index
        participant WS as ワークスペース
        participant CD as 変更の検知

        CC->>MS: タスク・用語・メモの次の ID を取る
        CC->>PI: 本文を渡してタスク・用語・メモを書き込む
        PI->>WS: 種類の YAML と .mindstella/docs/ の本文を書く
        CC->>PI: N-1 の本文の 2 行目だけを書き換える
        PI->>WS: .mindstella/docs/ の N-1 の本文を書く
        CD->>WS: 本文の差分を変更履歴に積む
        CC->>PI: T-1・G-1・N-1 を検索する
        PI-->>CC: 中身と本文
      ```
    expected:
      - 足した T-1・G-1・N-1 が、それぞれ `body` に `{ID}.md` を持ち、`.mindstella/docs/` にその Markdown がある
      - 検索した本文が、T-1・G-1 は渡した本文、N-1 は 2 行目を書き換えた後の本文である
      - N-1 の本文の 1 行目は、書き換えの前と同じである
      - N-1 が変更履歴を 1 回分持ち、その回が本文の 2 行目の差分を持つ
      - T-1・G-1・N-1 の `updated_by` が `ai` である
      - ワークスペースの全ての YAML がスキーマに合い、点検が問題を 0 件で返す
    test: test_normal_when_body_for_every_kind
  - name: 正常シナリオ（未整理の検討事項を案を持たずに足す）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース

        CC->>PI: 案を持たない未整理の検討事項 D-1 を書き込む
        PI->>PI: スキーマと突き合わせる（未整理は案の必須の対象でない）
        PI->>WS: decisions.yaml に書く
        CC->>PI: D-1 を、案を持たないまま取り下げにする
        PI->>WS: decisions.yaml に書く
      ```
    expected:
      - D-1 が足され、案を持たない
      - D-1 が取り下げで、案を持たない
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_unsorted_without_options
  - name: 異常シナリオ（案を持たない検討事項を足す）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: 案を持たない未決定の検討事項を書き込む
        PI->>PI: スキーマと突き合わせて、案が無い
        PI-->>CC: 案が要ることを示す違反
      ```
    expected:
      - '`write_docs` が違反を返し、書き込まない'
      - 違反に、合わないキー `options` がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_options_missing
  - name: 異常シナリオ（採用と状態が合わない）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませ、案 A・B を持つ未決定の検討事項 D-1 を足したワークスペース
      - name: 書き込み
        description: D-1 を採用した案を持たないまま決定済みに直す更新と、案 A を採用にしたまま未決定で足す追加
        notes: 2 回に分けて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: D-1 を、採用した案を持たないまま決定済みに直す
        PI->>PI: スキーマと突き合わせて、決定済みが採用した案を持たない
        PI-->>CC: 違反
        CC->>PI: 案 A を採用にした未決定の検討事項を書き込む
        PI->>PI: スキーマと突き合わせて、採用した案を持つのに未決定である
        PI-->>CC: 違反
      ```
    expected:
      - 1 回目の `write_docs` が違反を返し、違反に D-1 とキー `options` がある
      - 2 回目の `write_docs` が違反を返し、違反にキー `status` がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_adoption_and_status_mismatch
  - name: 正常シナリオ（資料の本文を HTML で書く）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 本文
        description: 資料 A-1 を足すときの 2 行の Markdown の本文と、形式を HTML に替えるときの 3 行の HTML の本文と、HTML の 2 行目を書き換える `text_edits` と、形式を Markdown に戻すときの 2 行の Markdown の本文
        notes: HTML の本文 `<h1>画面のモック</h1>\n<p>一覧の画面</p>\n<p>詳細の画面</p>`。書き換えは 2 行目を `<p>絞り込みの画面</p>` にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース
        participant CD as 変更の検知

        CC->>PI: Markdown の本文を渡して資料 A-1 を書き込む
        PI->>WS: docs.yaml と .mindstella/docs/A-1.md を書く
        CC->>PI: body を A-1.html にし、HTML の本文を渡して A-1 を直す
        PI->>WS: docs.yaml と .mindstella/docs/A-1.html を書く
        CD->>WS: どの項目も指さなくなった A-1.md を消す
        CC->>PI: A-1 の HTML の本文の 2 行目だけを書き換える
        CD->>WS: 本文の差分を変更履歴に積む
        CC->>PI: body を A-1.md にし、Markdown の本文を渡して A-1 を直す
        CD->>WS: どの項目も指さなくなった A-1.html を消す
      ```
    expected:
      - HTML に替えた後、A-1 の `body` が `A-1.html` で、`.mindstella/docs/` に渡した HTML の本文があり、`A-1.md` が残らない
      - 書き換えた後の HTML の本文の 2 行目が `<p>絞り込みの画面</p>` で、ほかの行は変わらない
      - A-1 の変更履歴が、HTML の本文の 2 行目の差分を持つ回を持つ
      - Markdown に戻した後、A-1 の `body` が `A-1.md` で、`.mindstella/docs/` に `A-1.html` が残らない
      - ワークスペースの全ての YAML がスキーマに合い、点検が問題を 0 件で返す
    test: test_normal_when_doc_body_html
    notes:
      本文の形式の持ち方: 形式は `body` のファイル名の拡張子（`{ID}.md` / `{ID}.html`）で表す。HTML の本文を持てる種類は種類のスキーマが決める
  - name: 異常シナリオ（資料以外に HTML の本文を渡す）
    setup:
      - name: Mock
        description: なし（MindStella の MCP サーバーと project-index を立て、両方の MCP にクライアントでつなぐ）
      - name: make_workspace
        description: 作成を済ませた、タスク T-1 を持つワークスペース
      - name: 本文
        description: タスクを足すときと T-1 を直すときに渡す HTML の本文（`body` が `{ID}.html`）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index

        CC->>PI: HTML の本文を渡してタスクを書き込む
        PI-->>CC: 違反（タスクの body は .md だけ）
        CC->>PI: HTML の本文を渡して T-1 を直す
        PI-->>CC: 違反（タスクの body は .md だけ）
      ```
    expected:
      - どちらの `write_docs` も違反を返し、違反にキー `body` がある
      - tasks.yaml と `.mindstella/docs/` が呼ぶ前と同じである
    test: test_error_when_html_body_for_non_doc
  - name: 正常シナリオ（資料・調査にエイリアスと説明を付ける）
    setup:

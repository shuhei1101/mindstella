        description: エイリアスと説明を持つ資料 A-1 と調査 R-1。A-1 を直すときはエイリアスを 1 つ足す
        notes: 'A-1 はタイトル `特殊効果のスキーマ`、`aliases: [特殊効果]`、`description: 特殊効果の設定ファイルのキーと型`。直して `aliases: [特殊効果, エフェクト]`（`add_to`）。R-1 は `aliases: [特殊効果の描画]`、`description` を持つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant PI as project-index
        participant WS as ワークスペース
        participant CD as 変更の検知

        CC->>PI: エイリアスと説明を渡して資料 A-1 と調査 R-1 を書き込む
        PI->>WS: docs.yaml と research.yaml に書く
        CC->>PI: A-1 のエイリアスに 1 つ足す
        PI->>WS: docs.yaml に書く
        CD->>WS: 更新日を変え、直す前のエイリアスを変更履歴に積む
      ```
    expected:
      - A-1 と R-1 が、渡したエイリアスと説明を持つ
      - 直した後、A-1 のエイリアスが `特殊効果`・`エフェクト` で、説明は足したときのままである
      - A-1 が変更履歴を 1 回分持ち、直す前のエイリアス（`特殊効果` だけ）が入っている
      - ワークスペースの全ての YAML がスキーマに合い、点検が問題を 0 件で返す
    test: test_normal_when_aliases_and_description
  - name: 正常シナリオ（新しいタグを付ける）
    setup:
      - name: Mock

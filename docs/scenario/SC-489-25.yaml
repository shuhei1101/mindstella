id: SC-489-25
title: "概要を見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '未決定の検討事項 D-2・D-6・要見直しの検討事項 D-3・保留の検討事項 D-4・決定済みの検討事項 D-1・進行中のタスク T-2・資料 A-1（状態: 完成）と A-2（状態: 確認中）と、AI が作成した通知のスレッド TH-1（利用者の未読）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューの URL を開く
        P-->>U: 概要のタイル
        U->>P: 要見直しのタイルの「すべて表示」を押す
        P-->>U: 検討事項の表（状態 = 要見直しの条件のチップ付き）
      ```
    expected:
      - 未読の AI の書き込みのタイルに TH-1 がある
      - 未決定のタイルに D-2・D-6 があり、D-1・D-4 が無い
      - 要見直しのタイルに D-3 がある
      - 確認中の資料のタイルに A-2 があり、A-1 が無い
      - ゴールまでの進捗・次に検討する項目・進み具合の表のタイルが無い
      - 「すべて表示」を押した後、検討事項の表に状態 = 要見直しの条件のチップがあり、行は D-3 だけ
      - 「すべて表示」を押した後、ドロワーの状態で要見直しだけが選ばれ、絞り込みのボタンに件数のバッジが付く
      - URL のハッシュが検討事項の表と表示形式を指す
    test: test_normal
  - name: 正常シナリオ（未読の AI の書き込みを開く）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: AI が作成した通知のスレッド TH-1（利用者の未読）と、AI の返信を利用者が既読にしたスレッド TH-2
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 概要を開く
        P-->>U: 未読の AI の書き込みのタイル（TH-1）
        U->>P: TH-1 の行を押す
        P-->>U: コメントの一覧で TH-1 を開く
      ```
    expected:
      - 未読の AI の書き込みのタイルに TH-1 だけがあり、TH-2 が無い
      - 行を押した後、コメントの一覧で TH-1 が開き、TH-1 の書き込みが利用者の既読になる
      - 既読になった後、概要に戻ると未読の AI の書き込みのタイルが空の表示である
    test: test_normal_when_unread_ai_post_opened
  - name: 正常シナリオ（並べる項目が無い）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 話し合いの概要を持ち、項目もスレッドも持たずに作成を済ませたワークスペース
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューの URL を開く
        P-->>U: 題名の上の概要と、空の表示のタイル
      ```
    expected:
      - 題名の上の行に話し合いの概要があり、プレイブックの名前が無い
      - 4 つのタイルがどれも空の表示である
      - ブラウザのコンソールにエラーが出ていない
    test: test_normal_when_empty
lead: 利用者が、プレビューの概要のタイルで未読の AI の書き込み・未決定の検討事項・要見直しの検討事項・確認中の資料を読み、タイルからその条件の一覧を開く単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者がプレビューを開く（概要は既定で開く画面）
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
  - ブラウザが CDN へ HTTPS で届く
test_file: tests/e2e/単一ユースケース/test_overview_view.py
notes:
  検討事項の案: セットアップの検討事項は、単一ユースケース『記録の追加と更新』の補足「検討事項の案」の形で作る
  並べるタイル: 概要は、未読の AI の書き込み・未決定の検討事項・要見直しの検討事項・確認中の資料だけを並べるトップにする。ゴールまでの進捗・次に検討する項目・フェーズやカテゴリー別の進み具合のタイルは持たない。タイルの配置と文言はモック作成で決める

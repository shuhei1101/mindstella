  - name: 正常シナリオ（変更があった項目だけを表示する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを起動し、端末の保存領域が空のブラウザでプレビューを開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 検討事項 D-1〜D-4 と資料 A-1・A-2 を追加して `commit`（説明「記録を作る」）し、プレビューの変更履歴で「記録を作る」を開いて既読にする
      - name: 書き換え
        description: MCP のツールで D-2 の本文と A-2 の本文を書き換え、検討事項 D-5 を追加して `commit`（説明「見直す」）する
        notes: 「見直す」は未読。未読のまとまりで変わった項目は D-2・D-5・A-2
      - name: 配信
        description: 記録を配っているサーバー。検討事項の表を開いている
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 絞り込みのボタンを押す
        P-->>U: 変更があった項目だけを表示する条件を持つドロワー
        U->>P: 変更があった項目だけを表示する条件をオンにする
        P-->>U: D-2・D-5 だけの検討事項の表と条件のチップ
        U->>P: 資料のタブへ移り、同じ条件をオンにする
        P-->>U: A-2 だけの資料の一覧
        U->>P: 変更履歴で「見直す」を開いて既読にし、「最新」に戻す
        P-->>U: 該当なしの資料の一覧と条件のチップ
        U->>P: 条件のチップの × を押す
        P-->>U: A-1・A-2 を並べた資料の一覧
      ```

      <!-- /map -->
    expected:
      - ドロワーに、変更があった項目だけを表示する条件があり、その画面で該当する件数（検討事項では 2）が出る
      - 条件をオンにすると、検討事項の表に D-2・D-5 だけが並び、一覧の上に条件のチップが出る
      - 資料のタブでも同じ条件があり、オンにすると A-2 だけが並ぶ（条件は画面ごとに持つ）
      - 「見直す」を既読にすると、条件に該当する項目が無くなり、該当なしの表示と条件を解除する操作が出る
      - 条件のチップの × を押すと、条件が解除され、全ての資料が並ぶ
      - ワークスペースの YAML と本文の中身が、開く前と同じ
    test: test_normal_when_filtered_by_unread_changes
lead: 利用者が、どの種類の項目も共通の表で並べ替え・絞り込みのボタンのドロワーでの絞り込み（列の値の文字・ID を含む）・ピン留め・表示する列の選択をして、初期設定に戻し、ドロワーで絞り込みのプリセットを選択して開き、今の絞り込みのタグの条件に名前を付けてプリセットとして保存し、タグの条件をプリセットと同じ式で詳細に指定する単一ユースケース。

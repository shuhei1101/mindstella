id: SC-489-49
title: "項目を表で絞り込む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '調査 R-1（確度: 高）・R-2（確度: 低）・R-3（確度: 高）。表が画面に収まらず縦にスクロールできる件数にする'
        notes: 縦にスクロールできるよう、調査をそのほかに 40 件追加する
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 調査のタブを開き、表を下へ送信する
        U->>P: 確度の列の見出しを 3 回押す
        P-->>U: 昇順 → 降順 → 解除
        U->>P: 絞り込みのボタンを押し、ドロワーで確度の「高」を選ぶ
        P-->>U: 絞り込んだ表と条件のチップ、ボタンの件数のバッジ
        U->>P: ドロワーの外側のグレーアウトした所を押す
        P-->>U: ドロワーを閉じる
        U->>P: 2 列目までピン留めし、列を 1 つ隠す
        U->>P: 初期設定に戻す
        P-->>U: 既定の列と並び
      ```
    expected:
      - 確度の見出しを押すたびに、並びが昇順 → 降順 → 既定の並びに変わり、見出しの `aria-sort` もそれに合う
      - 列の見出しに絞り込みのボタンが無く、表の上に絞り込みのボタンが 1 つある
      - ドロワーの確度の選択肢に値ごとの件数が出る
      - 「高」で絞ると行に R-2 が無く、表の上に確度 = 高のチップがあり、絞り込みのボタンに件数のバッジが付く
      - ドロワーを開いている間、ドロワーとトップバー以外がグレーアウトされる。外側のグレーアウトした所を押すとドロワーが閉じ、確度 = 高の条件は残る
      - 押した列のピン留めのボタンだけが押された見た目になり、横にスクロールしても 2 列目までが残る
      - 隠した列が表に無い
      - どの操作の後も、表の縦のスクロールの位置が操作の前と同じ
      - 表を下へ送信しても、トップバーとタブの帯が画面の上に見えたままで、ページ全体の縦のスクロールの位置は 0 のまま
      - 初期設定に戻すと、隠した列が戻り、ピン留めが外れる
    test: test_normal
  - name: 正常シナリオ（該当なし）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 完了）と T-2（種類: 調査・状態: 未着手）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表で、ドロワーで種類 = 作業 × 状態 = 未着手を選ぶ
        P-->>U: 該当なしの表示
        U->>P: 「すべて解除」を押す
        P-->>U: 全ての行
      ```
    expected:
      - 絞った後、表の場所に「該当するタスクはありません。別の条件を試してください。」が出る
      - 「すべて解除」を押すと T-1・T-2 の 2 行が戻り、チップが無くなり、絞り込みのボタンのバッジが消える
    test: test_normal_when_no_match
  - name: 正常シナリオ（話題のタグで絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 未着手・タグ: 保存・画面）、T-2（種類: 調査・状態: 進行中・タグ: 保存）、T-3（種類: 作業・状態: 未着手・タグ: 通知）、T-4（種類: 作業・状態: 完了・タグ無し）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表で絞り込みのボタンを押す
        P-->>U: 種類・状態・タグの条件を並べたドロワー（どの値も選ばれておらず、タグの組み合わせ方は AND）
        U->>P: タグの「保存」と「画面」を選ぶ
        P-->>U: 両方のタグを持つ行
        U->>P: タグの組み合わせ方を OR に切り替える
        P-->>U: どちらかのタグを持つ行
        U->>P: 種類の「作業」を選ぶ
        P-->>U: タグと種類の両方の条件に合う行
        U->>P: Esc でドロワーを閉じる
        U->>P: 表示形式をボードに切り替える
        P-->>U: 同じ条件で絞ったボード
      ```
    expected:
      - ドロワーに種類・状態・タグの条件があり、どの値も選ばれておらず、絞り込みのボタンにバッジが無い
      - タグの選択肢に「保存」（2）・「画面」（1）・「通知」（1）の件数が出る
      - ドロワーを初めて開いたとき、タグの組み合わせ方が AND を選んだ状態で出る
      - AND のままタグの「保存」と「画面」を選ぶと、表に T-1 だけがある
      - タグの組み合わせ方を OR に切り替えると、表に T-1・T-2 があり、T-3・T-4 が無い
      - 種類の「作業」を追加すると、表に T-1 だけがある（タグの条件とタグ以外の条件は AND で組み合わさる）
      - 表の上の条件のチップから、タグの組み合わせ方が OR であると分かる
      - ボードに切り替えても、T-1 のカードだけがあり、絞り込みのボタンに件数のバッジが付いたまま
    test: test_normal_when_topic_tags
    notes:
      組み合わせ方の UI: AND / OR を切り替える部品の位置と文言はモック作成で決める
  - name: 正常シナリオ（列の文字で絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 用語 G-1「シナリオの依頼」、G-2「シナリオ」、G-3「タスクの担当」、G-12「レビュー」
        notes: G-12 は ID に「G-1」を含むが G-1 とは別の項目
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 用語集のタブを表で開き、絞り込みのボタンを押す
        U->>P: ドロワーで用語の列に「シナリオ」を入れる
        P-->>U: 用語に「シナリオ」を含む行と条件のチップ
        U->>P: 用語の列の条件を解除し、ID の列に「g-1」を入れる
        P-->>U: ID に「G-1」を含む行
      ```
    expected:
      - 「シナリオ」を入れると、表に G-1・G-2 があり、G-3・G-12 が無い
      - 表の上に用語の列の文字の条件のチップがあり、絞り込みのボタンに件数のバッジが付く
      - ID の列に「g-1」を入れると、大文字・小文字を区別せず含む行に絞り、表に G-1・G-12 があり、G-2・G-3 が無い
      - 列の見出しに絞り込みのボタンが無く、表の上に絞り込みのボタンが 1 つある
    test: test_normal_when_text_condition
    notes:
      入口: 列の文字の条件を絞り込みのドロワーに置くのは、#47（D-44）で「どの画面も絞り込みのボタン 1 つにまとめ、ドロワーで条件を選ぶ」と決めたため。文字を入れる欄の構造はモック作成で決める
  - name: 正常シナリオ（画面を移って戻っても条件が残る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（状態: 未着手）、T-2（状態: 完了）、T-3（状態: 進行中）と、検討事項 D-1'
      - name: 配信
        description: 記録を配っているサーバーと、そのプレビューの URL。ブラウザのタブの保存領域（sessionStorage）は空。端末の保存領域（localStorage）には、前のバージョンが残したタスクの画面の絞り込みの条件（状態 = 進行中）がある
        notes: '`mindmap-preview` のキーの `filters` に `{tasks: {status: [進行中]}}` を書いておく'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SS as タブの保存領域

        U->>P: タスクの表を開く
        P-->>U: 絞っていない表（端末の保存領域に残った条件を参照せずに削除する）
        U->>P: ドロワーで状態 = 未着手を選ぶ
        P->>P: URL の search params に f.{列} を書く
        P->>SS: タスクの画面の絞り込みの条件を残す
        U->>P: タブの帯で検討事項を開き、タスクへ戻る
        P->>SS: タスクの画面の絞り込みの条件を読む
        P-->>U: 状態 = 未着手で絞った表（URL に f.{列} を書き戻す）
        U->>P: 画面を再読み込みする
        P-->>U: 状態 = 未着手で絞った表
        U->>P: URL の search params に状態 = 完了の f.{列} を付けてタスクを開く
        P->>SS: タスクの画面の絞り込みの条件を書き換える
        P-->>U: 状態 = 完了で絞った表
        U->>P: タブの帯で検討事項を開き、タスクへ戻る
        P-->>U: 状態 = 完了で絞った表
        U->>P: 同じプレビューを新しいブラウザのタブで、search params を付けずに開く
        P-->>U: 絞っていない表
      ```
    expected:
      - 開いた直後、表に T-1・T-2・T-3 の全ての行があり（端末の保存領域に残った状態 = 進行中の条件で絞らない）、端末の保存領域の `mindmap-preview` のキーから `filters` が無くなり、ほかの項目は残る
      - 検討事項からタスクへ戻ると、表に T-1 だけがあり、状態 = 未着手のチップと絞り込みのボタンの件数のバッジがあり、URL の search params に状態 = 未着手の `f.{列}` がある
      - タスクへ戻ったときの URL の書き戻しで、ブラウザの履歴が増えない（戻る操作で検討事項の画面へ戻る）
      - 再読み込みした後も、表に T-1 だけがある
      - '`f.{列}` で開くと表に T-2 だけがある（URL の条件をタブの保存領域の条件より優先する）'
      - '`f.{列}` で開いた後に検討事項からタスクへ戻ると、表に T-2 だけがある（URL の条件で開いたら、その条件をタブの保存領域へ残す）'
      - 新しいブラウザのタブで開くと、T-1・T-2・T-3 の全ての行がある
      - 端末の保存領域（localStorage）に絞り込みの条件が無い
      - ワークスペースの記録の項目の YAML と `config.yaml` の中身が、開く前と同じ
    test: test_normal_when_returned
    notes:
      配る書き出し: 配る書き出しは絞り込みの条件を保存しない。既存の『プレビューを配る』のシナリオを実行するだけで、ここでは確かめない
      保持先: 絞り込みの条件は、共有したい表示として URL の search params に持ち、そのタブで画面を移って戻ったときに戻すために、ブラウザのタブの保存領域へ画面ごとのキーで残す（knowledge の判定フローチャート『画面の状態の保持先』）
  - name: 正常シナリオ（ドロワーの外側を押す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 検討事項 D-1 と、前提に D-1 を持つ D-2
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項の表を開き、絞り込みのボタンを押す
        P-->>U: 左にドロワーを出し、ドロワーとトップバー以外をグレーアウトする
        U->>P: グレーアウトした表の D-2 の前提の D-1 を押す
        P-->>U: ドロワーを閉じる（D-1 の詳細パネルは開かない）
      ```
    expected:
      - グレーアウトした表の D-2 の前提の D-1 を押すとドロワーが閉じ、D-1 の詳細パネルは開かない
    test: test_normal_when_outside_pressed
  - name: 正常シナリオ（タグを押して絞り込みに加える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（タグ: 保存・画面）、T-2（タグ: 保存）、T-3（タグ: 通知）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表で、T-2 の行のタグ「保存」を押す
        P-->>U: 「保存」で絞った表と条件のチップ
        U->>P: T-1 の行のタグ「画面」を押す
        P-->>U: 「保存」と「画面」を AND で絞った表
        U->>P: T-1 の行のタグ「保存」を押す
        P-->>U: 条件の変わらない表
        U->>P: ブラウザの戻る操作
        P-->>U: 「保存」だけで絞った表
      ```
    expected:
      - 「保存」を押すと、表に T-1・T-2 があり、T-3 が無く、T-2 の詳細パネルは開かない
      - 表の上に タグ = 保存 のチップがあり、絞り込みのボタンに件数のバッジが付く
      - 続けて「画面」を押すと、表に T-1 だけがあり、タグの条件に「保存」「画面」の 2 つがある
      - 既に絞り込みにある「保存」を押しても、条件と表は変わらない
      - 戻る操作でタグを加える前の条件に 1 つずつ戻る
      - 表のタグはボタンで、キーボードのフォーカスを移して Enter で押せ、読み上げ名で絞り込みに加わると分かる
    test: test_normal_when_tag_pressed
  - name: 正常シナリオ（ほかの画面へ移って戻るとスクロール位置が戻る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 調査 R-1〜R-60 と検討事項 D-1〜D-60
        notes: どちらの表も画面に収まらず縦にスクロールできる件数にする
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 調査の表を R-40 が画面に入る位置まで下へ送信する
        U->>P: タブの帯で検討事項を開き、表を下へ送信する
        U->>P: タブの帯で調査へ戻る
        P-->>U: R-40 が画面に入る位置の調査の表
        U->>P: ブラウザの戻る操作
        P-->>U: 送信した位置の検討事項の表
        U->>P: ブラウザの進む操作
        P-->>U: R-40 が画面に入る位置の調査の表
        U->>P: プレビューの URL を新しいブラウザのタブで開き、調査の表を開く
        P-->>U: 先頭から表示した調査の表
      ```
    expected:
      - タブの帯で調査へ戻ると、調査の表が離れる前と同じスクロール位置で出る
      - 戻る操作で検討事項の表が、進む操作で調査の表が、それぞれ離れる前と同じスクロール位置で出る
      - 新しいブラウザのタブで開いた調査の表は、先頭から出る
      - どの操作の後も、ページ全体の縦のスクロールの位置は 0 のまま
      - URL の search params にスクロール位置が無い
    test: test_normal_when_scroll_restored
    notes:
      保持先: ページの中のスクロール領域の位置は、画面と表示形式を含む領域ごとのキーでブラウザのタブの保存領域に持つ（knowledge の規約『入力と文言』の「スクロール位置とタブの切り替え」）
  - name: 正常シナリオ（プリセットで開く）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（状態: 未着手・タグ: 画面）、T-2（状態: 未着手・タグ: 画面・廃止）、T-3（状態: 完了・タグ: 画面）、T-4（状態: 未着手・タグ: データ）'
      - name: プリセット
        description: 設定のプリセット「画面の設計」（タグ「画面」を持ち「廃止」を持たない。並び順 1）・「廃止する画面」（タグ「画面」と「廃止」を両方持つ。並び順 2）・「通知」（タグ「通知」を持つ。並び順 3。該当する件数 0）
        notes: 単一ユースケース『絞り込みのプリセットを作る』のツールで作る
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表を開き、絞り込みのボタンを押す
        P-->>U: ドロワーの先頭に「画面の設計」「廃止する画面」「通知」のプリセットを件数つきで並べ、「通知」に 0 件のマーカーを出す
        U->>P: 状態 = 未着手を選択し、プリセット「廃止する画面」を選択する
        P-->>U: タグの条件の簡易に「画面」「廃止」と「すべて含む」が入り、状態 = 未着手と組み合わせて絞った表
        U->>P: プリセット「画面の設計」を選択する
        P-->>U: タグの条件が詳細に切り替わり、「画面」を含む・「廃止」を含まないの条件で絞った表
        U->>P: 詳細の条件の「廃止」を含まないを解除し、ドロワーを閉じる
        P-->>U: タグの条件を文で出した条件のチップと、絞った表
        U->>P: 画面を再読み込みする
        P-->>U: 同じタグの条件と状態の条件で絞った表
      ```
    expected:
      - ドロワーの先頭に「画面の設計」「廃止する画面」「通知」が並び順どおりに件数つきで並び、該当する件数が 0 の「通知」だけにマーカーがあり、「通知」も選択できる
      - 「廃止する画面」を選択すると、タグの条件の簡易のチェックに「画面」「廃止」が入り、組み合わせが「すべて含む」で、表に T-2 だけがあり、選択したプリセットが選択済みの見た目になる
      - 「画面の設計」を選択すると、タグの条件が詳細になり、表に T-1 だけがある（T-2 は「廃止」を持ち、T-3 は完了、T-4 は「画面」を持たない）
      - 詳細の条件を編集すると、プリセットの選択済みの見た目が外れ、表に T-1・T-2 がある
      - 条件のチップにタグの条件の文と状態 = 未着手があり、タグの条件のチップの × でタグの条件だけを解除できる
      - 再読み込みした後も同じ条件で絞った表で、URL の search params にタグの条件がある
      - ワークスペースの記録の項目の YAML と `config.yaml` の中身が、開く前と同じ
    notes:
      プリセットとタグの条件: プリセットを選択すると、プリセットのタグの式でタグの条件を置き換える。簡易で表せる式は簡易に、表せない式は詳細に入る。プリセットを解除する操作は持たず、タグの条件を解除して解除する
      保持先: タグの条件は、そのほかの絞り込みの条件と同じく URL の search params とブラウザのタブの保存領域に持つ
    test: test_normal_when_preset_opened
  - name: 正常シナリオ（ドロワーの絞り込みと並べ替えを戻る操作で戻す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを起動し、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から参照する）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 未着手・タイトル「保存の画面」）、T-2（種類: 作業・状態: 完了・タイトル「通知」）、T-3（種類: 調査・状態: 未着手・タイトル「保存先」）、T-4（種類: 作業・状態: 未着手・タイトル「保存」）。既定の並びは ID の順'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表で、ドロワーで種類 = 作業を選ぶ
        P-->>U: T-1・T-2・T-4 の表
        U->>P: ドロワーで状態 = 未着手を選ぶ
        P-->>U: T-1・T-4 の表
        U->>P: ドロワーのタイトルの文字の欄に「保存」を打ち終える
        P-->>U: T-1・T-4 の表（文字の条件つき）
        U->>P: ドロワーを閉じ、タイトルの列の見出しを押す
        P-->>U: タイトルの昇順の表
        U->>P: ブラウザの戻る操作を 4 回
        P-->>U: 1 回ごとに 1 つ前の条件の表
      ```
    expected:
      - 1 回目の戻る操作で、並べ替えが解除され、種類 = 作業・状態 = 未着手・タイトルの文字「保存」の条件の表が T-1・T-4 の順に戻る
      - 2 回目の戻る操作で、文字の条件が解除され、種類 = 作業・状態 = 未着手の表に戻る（打ち終えるまでの 1 文字ごとの条件は履歴に残らない）
      - 3 回目の戻る操作で、種類 = 作業だけの表（T-1・T-2・T-4）に戻る
      - 4 回目の戻る操作で、条件の無い表（T-1・T-2・T-3・T-4）に戻る
      - どの戻る操作の後も、URL の search params と表の上の条件のチップが、戻った条件を指す
      - タイトルの列の見出しを押した後、表が T-4（保存）・T-1（保存の画面）の順に並ぶ
    test: test_normal_when_drawer_changes_go_back
  - name: 正常シナリオ（今の絞り込みをプリセットとして保存する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（状態: 未着手・タグ: 画面）、T-2（状態: 未着手・タグ: 画面・廃止）、T-3（状態: 完了・タグ: データ）'
      - name: プリセット
        description: 設定のプリセット「画面の設計」（タグ「画面」を持ち「廃止」を持たない。並び順 1）
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー

        U->>P: タスクの表で絞り込みのボタンを押す
        P-->>U: タグの条件が無く、プリセットとして保存する操作を押せないドロワー
        U->>P: タグの条件の簡易で「画面」と「廃止」を選び、状態 = 未着手を選ぶ
        P-->>U: プリセットとして保存する操作を押せるドロワー
        U->>P: プリセットとして保存する操作を押し、名前「廃止する画面」を入れて保存する
        P->>S: 名前とタグの条件の式を送信する
        S->>S: 設定のプリセットの末尾に追加する
        S-->>P: 保存したプリセットと該当する件数
        P-->>U: プリセットの並びの末尾に「廃止する画面」を件数つき・選択済みの見た目で出す
        U->>P: タグの条件を「データ」と「廃止」に替え、名前「削除するデータ」で保存する
        P-->>U: 「削除するデータ」に 0 件のマーカーを付けて並べる
        U->>P: 画面を再読み込みし、ドロワーを開く
        P-->>U: 「画面の設計」「廃止する画面」「削除するデータ」の順のプリセット
      ```
    expected:
      - タグの条件が無いときは、プリセットとして保存する操作が押せない見た目で、読み上げでも押せないと分かる
      - 保存すると、ドロワーのプリセットの並びの末尾に「廃止する画面」が件数 1 つきで並び、選択済みの見た目になり、表は T-2 だけのまま
      - '`config.yaml` の `presets` の末尾に、名前「廃止する画面」とタグ「画面」「廃止」を両方含む式のプリセットが入り、状態 = 未着手の条件はプリセットに入らない'
      - 「削除するデータ」に 0 件のマーカーが付き、選択できる
      - 再読み込みした後も、3 つのプリセットが並び順どおりに並ぶ
      - ワークスペースの記録の項目の YAML の中身が、開く前と同じ
      - 状態 = 未着手の条件があるとき、保存の入力に、タグの条件だけを保存する旨が出る（見せ方は部品設計で決める）
    notes:
      保存する範囲: プリセットはタグの式に名前を付けたもの（インターフェース定義『プリセットの作成』）なので、今の絞り込みのうちタグの条件だけを保存する。状態・種類・列の文字の条件は保存しない
      0 件のマーカー: 保存したプリセットも、AI が作ったプリセットと同じ件数とマーカーで出す
    test: test_normal_when_preset_saved
  - name: 異常シナリオ（プリセットの名前が重なる）
    setup:

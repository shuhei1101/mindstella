title: 項目をお気に入りにする
lead: 利用者が、プレビューのカード・ボード・表の星のボタンで項目をお気に入りに登録・解除し、カードの一覧ではお気に入りを先頭に並べ、表では星の列で並べ替える単一ユースケース。
issue: 353
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: よく参照する項目を、記録が増えても一覧の先頭ですぐに見つけられる。登録は自分の端末だけで有効で、同じワークスペースを開いている他の人の表示と記録を変えない
trigger: 利用者がカード・ボードのカード・表の行の星のボタンを押す
preconditions:
  - サーバーがプレビューを配っている
  - ワークスペースに項目が 2 件以上ある
success_guarantee: 星を押した項目がその場でお気に入りになり（もう一度押すと解除し）、そのブラウザの端末の保存領域にワークスペースごとに残って、再読み込みしても保たれる。カードの一覧ではお気に入りが先頭に並び、ボードでは並びを変えずに星だけを出し、表では星の列の見出しで並べ替えられる。ワークスペースの記録と `config.yaml` は変わらない。
minimal_guarantee: 端末の保存領域が使えないときも、開いている間は登録したお気に入りが画面に出る。記録に無くなった項目の ID は、お気に入りとして出さない。ワークスペースの記録と `config.yaml` は変わらない。
frequency: よく参照する項目ができたときと、参照しなくなったとき
priority: 中
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2・A-3
        notes: 連番の昇順で並ぶ
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL。端末の保存領域は空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant LS as 端末の保存領域

        U->>P: 資料の画面を開く
        P-->>U: A-1・A-2・A-3 のカード（どれも星は空）
        U->>P: A-3 のカードの右上の星を押す
        P->>LS: A-3 をお気に入りとして残す
        P-->>U: A-3 のカードの星を塗り、A-3・A-1・A-2 の順に並べる
        U->>P: 画面を再読み込みする
        P->>LS: お気に入りを参照する
        P-->>U: A-3（星）・A-1・A-2 の順のカード
        U->>P: A-3 のカードの星をもう一度押す
        P->>LS: A-3 のお気に入りを削除する
        P-->>U: A-1・A-2・A-3 の順のカード（どれも星は空）
      ```
    expected:
      - 星を押した直後と再読み込みした後のどちらも、A-3 のカードの右上に塗った星が出て、カードが A-3・A-1・A-2 の順に並ぶ
      - 星を押しても A-3 の詳細パネルが開かない
      - 端末の保存領域に、そのワークスペースのお気に入りとして A-3 が残っている
      - もう一度押すと、A-3 の星が空に戻り、カードが A-1・A-2・A-3 の順に戻り、端末の保存領域のお気に入りに A-3 が無い
      - ワークスペースの記録の項目の YAML と `config.yaml` の中身が、開く前と同じである
    test: test_normal
  - name: 正常シナリオ（ボード）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 状態が同じタスク T-1・T-2
      - name: 配信
        description: 記録を配っているサーバーと、タスクの画面（ボード）の URL。端末の保存領域は空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant LS as 端末の保存領域

        U->>P: タスクのボードを開く
        P-->>U: 同じ列に T-1・T-2 のカード
        U->>P: T-2 のカードの右上の星を押す
        P->>LS: T-2 をお気に入りとして残す
        P-->>U: T-2 のカードの星を塗る（並びは T-1・T-2 のまま）
      ```
    expected:
      - T-2 のカードの右上に塗った星が出る
      - 列の中の並びが T-1・T-2 のまま変わらない
      - 端末の保存領域に、そのワークスペースのお気に入りとして T-2 が残っている
    test: test_normal_when_board
  - name: 正常シナリオ（表で並べ替える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 用語 G-1・G-2・G-3
      - name: 端末の上書き
        description: 端末の保存領域に、そのワークスペースのお気に入りとして G-2 を残しておく
      - name: 配信
        description: 記録を配っているサーバーと、用語集の画面（表）の URL
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant LS as 端末の保存領域

        U->>P: 用語集の表を開く
        P->>LS: お気に入りを参照する
        P-->>U: 一番左の星の列で G-2 だけ星を塗った表（G-1・G-2・G-3 の順）
        U->>P: 星の列の見出しを押す
        P-->>U: G-2・G-1・G-3 の順に並べ替える
        U->>P: 星の列の見出しをもう一度押す
        P-->>U: G-1・G-3・G-2 の順に並べ替える
        U->>P: 星の列の見出しをもう一度押す
        P-->>U: 既定の並び（G-1・G-2・G-3）に戻す
        U->>P: G-3 の行の星を押す
        P->>LS: G-3 をお気に入りとして残す
        P-->>U: G-3 の星を塗る
      ```
    expected:
      - 表の一番左の列が星の列で、G-2 の行だけ星が塗られている
      - 星の列の見出しを押すと、お気に入りの G-2 が先頭になり、残りは前の並びのまま G-1・G-3 の順に並ぶ。もう一度押すとお気に入りが末尾（G-1・G-3・G-2）に、もう一度押すと既定の並び（G-1・G-2・G-3）に戻る。星の列の見出しの `aria-sort` は、ほかの列と同じくお気に入りが先頭のとき昇順・末尾のとき降順・既定の並びのとき無しに合う
      - G-3 の行の星を押すと、G-3 の星が塗られ、端末の保存領域のお気に入りに G-2 と G-3 がある
      - 行の星を押しても G-3 の詳細パネルが開かない
    test: test_normal_when_table_sorted
  - name: 正常シナリオ（記録に無い項目）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2
      - name: 端末の上書き
        description: 端末の保存領域に、そのワークスペースのお気に入りとして A-2 と、記録に無い A-9 を残しておく
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant LS as 端末の保存領域

        U->>P: 資料の画面を開く
        P->>LS: お気に入りを参照する
        P-->>U: A-2（星）・A-1 の順のカード（A-9 は出さない）
      ```
    expected:
      - カードが A-2・A-1 の順に並び、A-2 だけ星が塗られている
      - A-9 のカード・空のカードが出ず、画面にエラーが出ない
    test: test_normal_when_missing_item
notes:
  E2E の範囲: サーバーが配るプレビューを実際のブラウザで開き、星の操作と画面・端末の保存領域の状態を確認する。「お気に入りを一番上にする」「お気に入りだけを表示する」の切り替えは単一ユースケース『表示の設定を変える』で確認する
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を追加する

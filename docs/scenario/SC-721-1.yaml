title: 項目をお気に入りにする
lead: 利用者が、プレビューのカード・ボード・表と詳細パネル・詳細の全画面のヘッダーの星のボタンで項目をお気に入りに登録・解除し、カードの一覧ではお気に入りを先頭に並べ、表では星の列で並べ替える単一ユースケース。
issue: 727
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: よく参照する項目を、記録が増えても一覧の先頭ですぐに見つけられる。開いて読んでいる項目も、詳細のヘッダーからそのまま登録・解除できる。AI が登録したお気に入りも同じ星で見える
  - name: MindStella のセッションの AI
    interest: 利用者が星で登録したお気に入りも、AI の登録・解除と同じお気に入りとして扱われる
trigger: 利用者がカード・ボードのカード・表の行・詳細パネルか詳細の全画面のヘッダーの星のボタンを押す
preconditions:
  - サーバーがプレビューを配っている
  - ワークスペースに項目が 2 件以上ある
success_guarantee: 星を押した項目がその場でお気に入りになり（もう一度押すと解除し）、ワークスペースのお気に入りに残って、再読み込みしても、同じワークスペースを開いているほかの画面でも保たれる。カードの一覧ではお気に入りが先頭に並び、ボードでは並びを変えずに星だけを出し、表では星の列の見出しで並べ替えられる。カード・表の星と詳細のヘッダーの星は同じお気に入りを指し、どちらで変えても他方が同じ状態になる。項目の YAML・本文と `config.yaml` は変わらず、変更履歴に載らない。
minimal_guarantee: お気に入りを書き込めないときは、押した星を押す前の状態に戻し、書き込めなかったことを画面に出す。記録に無くなった項目の ID は、お気に入りとして出さない。項目の YAML・本文と `config.yaml` は変わらない。
frequency: よく参照する項目ができたときと、参照しなくなったとき
priority: 中
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2・A-3
        notes: 連番の昇順で並ぶ
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL。ワークスペースのお気に入りと端末の保存領域は空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー
        participant WS as ワークスペース

        U->>P: 資料の画面を開く
        P-->>U: A-1・A-2・A-3 のカード（どれも星は空）
        U->>P: A-3 のカードの右上の星を押す
        P->>S: A-3 をお気に入りに登録する
        S->>WS: お気に入りに A-3 を残す
        P-->>U: A-3 のカードの星を塗り、A-3・A-1・A-2 の順に並べる
        U->>P: 画面を再読み込みする
        P->>S: 記録を参照する
        P-->>U: A-3（星）・A-1・A-2 の順のカード
        U->>P: A-3 のカードの星をもう一度押す
        P->>S: A-3 のお気に入りを解除する
        S->>WS: お気に入りから A-3 を削除する
        P-->>U: A-1・A-2・A-3 の順のカード（どれも星は空）
      ```
    expected:
      - 星を押した直後と再読み込みした後のどちらも、A-3 のカードの右上に塗った星が出て、カードが A-3・A-1・A-2 の順に並ぶ
      - 星を押しても A-3 の詳細パネルが開かない
      - ワークスペースのお気に入りに A-3 が残っている
      - もう一度押すと、A-3 の星が空に戻り、カードが A-1・A-2・A-3 の順に戻り、ワークスペースのお気に入りに A-3 が無い
      - ワークスペースの記録の項目の YAML・本文と `config.yaml` の中身が開く前と同じで、変更履歴に A-3 の変更が無い
    test: test_normal
  - name: 正常シナリオ（ボード）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 状態が同じタスク T-1・T-2
      - name: 配信
        description: 記録を配っているサーバーと、タスクの画面（ボード）の URL。ワークスペースのお気に入りは空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー

        U->>P: タスクのボードを開く
        P-->>U: 同じ列に T-1・T-2 のカード
        U->>P: T-2 のカードの右上の星を押す
        P->>S: T-2 をお気に入りに登録する
        P-->>U: T-2 のカードの星を塗る（並びは T-1・T-2 のまま）
      ```
    expected:
      - T-2 のカードの右上に塗った星が出る
      - 列の中の並びが T-1・T-2 のまま変わらない
      - ワークスペースのお気に入りに T-2 が残っている
    test: test_normal_when_board
  - name: 正常シナリオ（表で並べ替える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 用語 G-1・G-2・G-3
      - name: お気に入り
        description: ワークスペースのお気に入りに G-2 を残しておく
      - name: 配信
        description: 記録を配っているサーバーと、用語集の画面（表）の URL
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー

        U->>P: 用語集の表を開く
        P->>S: 記録を参照する
        P-->>U: 一番左の星の列で G-2 だけ星を塗った表（G-1・G-2・G-3 の順）
        U->>P: 星の列の見出しを押す
        P-->>U: G-2・G-1・G-3 の順に並べ替える
        U->>P: 星の列の見出しをもう一度押す
        P-->>U: G-1・G-3・G-2 の順に並べ替える
        U->>P: 星の列の見出しをもう一度押す
        P-->>U: 既定の並び（G-1・G-2・G-3）に戻す
        U->>P: G-3 の行の星を押す
        P->>S: G-3 をお気に入りに登録する
        P-->>U: G-3 の星を塗る
      ```
    expected:
      - 表の一番左の列が星の列で、G-2 の行だけ星が塗られている
      - 星の列の見出しを押すと、お気に入りの G-2 が先頭になり、残りは前の並びのまま G-1・G-3 の順に並ぶ。もう一度押すとお気に入りが末尾（G-1・G-3・G-2）に、もう一度押すと既定の並び（G-1・G-2・G-3）に戻る。星の列の見出しの `aria-sort` は、ほかの列と同じくお気に入りが先頭のとき昇順・末尾のとき降順・既定の並びのとき無しに合う
      - G-3 の行の星を押すと、G-3 の星が塗られ、ワークスペースのお気に入りに G-2 と G-3 がある
      - 行の星を押しても G-3 の詳細パネルが開かない
    test: test_normal_when_table_sorted
  - name: 正常シナリオ（詳細のヘッダー）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL。ワークスペースのお気に入りは空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー

        U->>P: A-2 のカードを押して詳細パネルを開く
        P-->>U: ヘッダーに空の星を持つ A-2 の詳細パネル
        U->>P: 詳細パネルのヘッダーの星を押す
        P->>S: A-2 をお気に入りに登録する
        P-->>U: ヘッダーの星と A-2 のカードの星を塗り、カードを A-2・A-1 の順に並べる
        U->>P: 詳細の全画面を開く
        P-->>U: ヘッダーに塗った星を持つ A-2 の全画面
        U->>P: 全画面のヘッダーの星を押す
        P->>S: A-2 のお気に入りを解除する
        P-->>U: 全画面のヘッダーの星を空にする
        U->>P: 全画面を閉じる
        P-->>U: ヘッダーの星が空の詳細パネルと、A-1・A-2 の順のカード（どれも星は空）
      ```
    expected:
      - 詳細パネルと詳細の全画面の固定のヘッダーに、カードと同じ星のボタンがあり、開いている項目がお気に入りかを塗った星・空の星で出す
      - 詳細パネルのヘッダーの星を押すと、ヘッダーの星と A-2 のカードの星が塗られ、カードが A-2・A-1 の順に並び、ワークスペースのお気に入りに A-2 が残る
      - 星を押しても詳細パネルは閉じず、開いている項目も変わらない
      - 全画面のヘッダーの星を押すと、全画面を閉じた後の詳細パネルのヘッダーとカードの星も空に戻り、ワークスペースのお気に入りに A-2 が無い
      - ヘッダーの星の読み上げの名前と `aria-pressed` が、カードの星と同じ
    test: test_normal_when_detail_header
  - name: 正常シナリオ（記録に無い項目）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2
      - name: お気に入り
        description: ワークスペースのお気に入りに A-2 と、記録に無い A-9 を残しておく
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー

        U->>P: 資料の画面を開く
        P->>S: 記録を参照する
        P-->>U: A-2（星）・A-1 の順のカード（A-9 は出さない）
      ```
    expected:
      - カードが A-2・A-1 の順に並び、A-2 だけ星が塗られている
      - A-9 のカード・空のカードが出ず、画面にエラーが出ない
    test: test_normal_when_missing_item
  - name: 正常シナリオ（端末に残っていたお気に入り）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2・A-3
      - name: お気に入り
        description: ワークスペースのお気に入りに A-1 を残しておく
      - name: 端末の上書き
        description: 端末の保存領域に、そのワークスペースのお気に入り（前のバージョンの残り先）として A-3 と、記録に無い A-9 を残しておく
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant LS as 端末の保存領域
        participant S as サーバー

        U->>P: 資料の画面を開く
        P->>LS: 前のバージョンのお気に入りを参照する
        P->>S: 記録にある A-3 をお気に入りに登録する（記録に無い A-9 は登録しない）
        P->>LS: 前のバージョンのお気に入りを削除する
        P-->>U: A-1（星）・A-3（星）・A-2 の順のカード
      ```
    expected:
      - カードが A-1・A-3・A-2 の順に並び、A-1 と A-3 の星が塗られている
      - ワークスペースのお気に入りに A-1 と A-3 があり、記録に無い A-9 が無い
      - 端末の保存領域に、そのワークスペースの前のバージョンのお気に入りが無い
    test: test_normal_when_local_favorites_left
  - name: 異常シナリオ（お気に入りを書き込めない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1・A-2
      - name: 配信
        description: 記録を配っているサーバーと、資料の画面（カード）の URL。ワークスペースのお気に入りは空
      - name: 書き込めない状態
        description: 画面を開いた後に、ワークスペースのお気に入りを書き込めなくする
        notes: お気に入りのファイルの置き場所を、書き込みを許さないフォルダにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant S as サーバー

        U->>P: A-2 のカードの星を押す
        P->>S: A-2 をお気に入りに登録する
        S-->>P: 書き込めなかった
        P-->>U: A-2 の星を空に戻し、登録できなかったことを出す
      ```
    expected:
      - A-2 の星が空のまま（押す前の状態）で、カードの並びが A-1・A-2 のまま
      - お気に入りに登録できなかったことが画面に出る
      - ワークスペースのお気に入りに A-2 が無い
    test: test_error_when_write_failed
notes:
  E2E の範囲: サーバーが配るプレビューを実際のブラウザで開き、星の操作と画面・ワークスペースのお気に入りの状態を確認する。「お気に入りを一番上にする」「お気に入りだけを表示する」の切り替えは単一ユースケース『表示の設定を変える』で、AI からの登録・解除は単一ユースケース『AI が項目をお気に入りにする』で確認する
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を追加する
  お気に入りの残り先: ワークスペースに 1 つの共有のお気に入りで、利用者ごとに分けない。残り先のファイルとキーは ER 図『ワークスペース』で決める
  配る書き出し: 書き出した時点のお気に入りを塗った星で出し、星は押せない。お気に入りを先頭に並べる・お気に入りだけを表示する・星の列の並べ替えは有効のまま

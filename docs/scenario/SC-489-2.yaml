id: SC-489-2
title: "README の書き直し"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに常駐サーバーを立て、MindStella の API のワークスペースの作成と、プレビューの URL の取得を呼ぶ
      - name: make_workspace
        description: 作成を済ませ、直下の `README.md` の起動のコマンドを、別の版のプラグインのフォルダ（`/old/plugins/mindstella/0.6.0`）に書き換えたワークスペース
        notes: プラグインを上げた後のワークスペースと同じ形
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as 外部のアプリ（起動のコマンド）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを作成する
        SV->>WS: 直下の README.md の 1 行目に自動で書いた印があることを確かめる
        SV->>WS: 今のプラグインのフォルダ・セッションの名前で一覧を書き直す（プレビューは URL を持たない）
        SV-->>CC: 書いた README のパス
        CC->>SV: プレビューの URL
        SV->>SV: 配信を立てる
        SV->>WS: プレビューの節を URL にして書き直す
        SV-->>CC: 127.0.0.1 の URL
      ```
    expected:
      - README の書き直しの後、起動のコマンドが `{サーバーのプラグインのフォルダ}/bin/mindstella {ワークスペースの絶対パス}` で、`/old/plugins/mindstella/0.6.0` を含まない
      - 起動のコマンドの節に、任意の引数（進め方の文書・追加の MCP・プラグイン）の一覧がある
      - 接続のコマンドが、起動のコマンドでこのワークスペースの MindStella のセッションのペインへつなぐ呼び方である
      - スキルの呼び方（`/mindstella:session`・`/mindstella:setup`・`/mindstella:upgrade`）が無い
      - プレビューの URL を頼む前は、プレビューの節が URL を持たず、起動の応答が返す画面の URL を開く案内である
      - プレビューの URL を頼んだ後、プレビューの節が返った URL である
      - '`.mindstella/` の全てのファイルの中身が、呼ぶ前と同じである'
    test: test_normal
  - name: 正常シナリオ（README が無い）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: make_workspace
        description: 作成を済ませ、直下の `README.md` を消したワークスペース
        notes: この機能を入れる前のバージョンで作り、記録が残っているフォルダを開くワークスペースと同じ形
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as 外部のアプリ（起動のコマンド）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを作成する
        SV->>WS: 直下に README.md が無い
        SV->>WS: 一覧を書く
        SV-->>CC: 書いた README のパス
      ```
    expected:
      - 直下に `README.md` があり、1 行目が自動で書いた印である
      - プレビューの節と、起動・接続のコマンドがあり、スキルの呼び方が無い
    test: test_normal_when_readme_missing
  - name: 正常シナリオ（利用者が書いた README がある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: make_workspace
        description: 作成を済ませ、直下の `README.md` を利用者が書いた中身に置き換えたワークスペース
        notes: '`README.md` の中身は `# 家計簿アプリの話し合い`（自動で書いた印が無い）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as 外部のアプリ（起動のコマンド）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを作成する
        SV->>WS: 直下の README.md に自動で書いた印が無い
        SV-->>CC: 書かなかったこと
        CC->>SV: プレビューの URL
        SV->>SV: 配信を立てる
        SV-->>CC: 127.0.0.1 の URL（README は書かない）
      ```
    expected:
      - README の書き直しの結果が、書かなかったことを示す
      - README の書き直しとプレビューの URL の後も、直下の `README.md` の中身が呼ぶ前と同じである
      - プレビューの URL がエラーにならず、`127.0.0.1` の `/mindstella.html` を指す
    test: test_normal_when_user_readme_exists
lead: MindStella の API でワークスペースを作るときとプレビューを配り始めたときに、サーバーがワークスペースの直下の `README.md` を、今のプラグインのフォルダ・起動のコマンドの引数・プレビューの URL を使ったコマンドの一覧に書き直す単一ユースケース。
issue: 103
primary_actor: 常駐サーバー
stakeholders:
  - name: 利用者
    interest: フォルダを開いたときに、そのまま叩ける起動・接続のコマンドと、今のプレビューの URL が分かる
trigger: 'MindStella の API でワークスペースを作る（記録が残っているフォルダを開くことを含む）とき。プレビューの配信を立てたとき'
preconditions:
  - ワークスペースが今の版の形（`.mindstella/config.yaml` がある）
success_guarantee: 直下の `README.md` のプレビューの節と起動・接続のコマンドが、今のプラグインのフォルダ・セッションの名前・配っている URL を指し、スキルの呼び方を持たない
minimal_guarantee: 利用者が書いた `README.md`（自動で書いた印が無いもの）と `.mindstella/` の記録は変えない
test_file: tests/e2e/単一ユースケース/test_readme_rewrite.py

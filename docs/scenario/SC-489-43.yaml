lead: 'MindStella のセッションが、コメントの取り込みのエージェントフロー（`mindstella/on-comment`）に従い、取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド。オープンでもクローズでも）を 1 件ずつ読んで記録に反映し、commit してから返信か取り込み済みにしてクローズにし、最後に追加した検討事項と反映した回答を新しいスレッド 1 件で通知する単一ユースケース。'
issue: 67
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 画面から送ったコメントが記録に反映され、記録を変えたときは変えた項目が分かる返信が付く。検討事項への回答に余計な返信が付かず、話が済んだスレッドは閉じる。回答が要ることは検討事項にまとまり、通知のスレッドで一覧できる。同じ書き込みを 2 度取り込まない
trigger: MindStella のセッションに「[mindstella] ユーザーからのコメントが N 件」が入力されるか、起動と再開のエージェントフローが取り込み待ちのコメントを取り込む
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションが起動し、MindStella と project-index の MCP のツールが使える
success_guarantee: 取り込み待ちのスレッドが無くなり、利用者の書き込みは記録と会話ログに反映され、commit で 1 つのまとまりになっている。記録を変えたスレッドには変えた項目の ID を持つ AI の返信があり、検討事項への回答だけのスレッドには返信が無い。話が済んだスレッドはクローズで取り込み済みになっている。利用者の回答が要る検討事項を追加したか、検討事項への回答を反映した回には、それらを表で並べた通知のスレッドが 1 件立ち、前の回の通知のスレッドはクローズになっている。スレッドで利用者に回答を求めない。
minimal_guarantee: 取り込みの途中で MindStella のセッションが止まっても、まだ取り込み済みにしていない書き込みを持つスレッドは取り込み待ちのまま残り、次の取り込みで拾われる。記録に反映していない利用者の書き込みがあるスレッドはクローズにならない。
frequency: 利用者が画面からコメントを送るたびに 1 回と、MindStella のセッションの起動と再開のたびに 1 回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、エージェントフローの工程が連ねるツールの呼び出しを再生する。書き込みの本文から何を記録するか・返信するかクローズにするか・返信に何を書くかというモデルの判断は確かめない
  取り込む対象: 取り込むのは取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド）で、オープンでもクローズでも拾う。利用者が書き込みを送ってからクローズにしても、その書き込みを取り込む。既読かどうかでは決めないので、MindStella のセッションを起動し直して全ての書き込みが未読に戻っても、取り込み済みの書き込みを取り込み直さない
  入力された文字列の読み直し: サーバーが入力するのは `[mindstella]` で始まる件数だけの 1 行で、スレッドの ID も本文も含まない。取り込み待ちのスレッドの一覧を読み、一覧にあるスレッドだけを記録する
  返信する時点: 書き込みを記録した後に、スレッド 1 件ずつ、返信するか返信せずにクローズにするかを決めて取り込み済みにし、要約を書き直す。読んだだけでは取り込み待ちのまま残る。返事の要らない書き込み（「了解」など）には返信せず、取り込み済みにしてから、回答を待つ質問が残らず利用者が AI の書き込みを全て既読にしていればクローズにする。取り込み待ちの書き込みか利用者が未読の AI の書き込みがあるスレッドは、サーバーがクローズを拒むので開いたまま待つ。質問・依頼には返信し、クローズにしない。クローズのスレッドに返信が要るときは、オープンに戻してから返信する
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
  AI が聞いたスレッドへの回答: AI が質問や確認で立てたスレッドへの回答は、待っていたステップ（ヒアリング・リサーチ・方針転換・範囲の見直し・ゴール判定・配る書き出し）へ渡し、そのステップの続きを進める。届いたコメントには、ターミナルでなくスレッドへの返信で答える
  返信とクローズ: スレッド 1 件ごとに、記録に反映して commit した後、利用者の質問・依頼に回答するときか記録を変えたことを伝えるときは返信し（検討事項への回答だけのスレッドには返信しない）、返信が要らずクローズにもしないときは取り込み済みにする。話が済んだ（質問・依頼に回答した・検討事項への回答を反映した・報告だけ・別のスレッドや検討事項に移った）スレッドはクローズにして取り込み済みにする。利用者が未読の AI の書き込みがあってもクローズにできる。記録に反映していない利用者の書き込みがあるスレッドは、サーバーがクローズを拒む
  利用者に聞くこと: AI が利用者に聞くこと（質問・確認・未決定の点・AI の解釈の確認・ワークスペースの外へ書き込む前の合意）は、記録の使い分けで検討事項にし、スレッドでは聞かない。回答が届くまで、その検討事項の先を進めない
  通知のスレッド: 全てのスレッドを取り込んだ後に、その回で利用者の回答が要る検討事項を追加したか、検討事項への回答を反映したときだけ、新しいスレッドを 1 件作成し、追加した検討事項（ID・質問・推奨）と反映した回答（ID・反映した内容）を表で通知する。前の回の通知のスレッドは、このときクローズにする（この回に作成したものはクローズにしない）
  往復の上限: 利用者と AI の往復が 5 回を超えたスレッドは、続きを新しいスレッドに分け、元のスレッドを別のスレッドに移ったものとしてクローズにする

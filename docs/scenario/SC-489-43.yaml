lead: 'MindStella のセッションが、コメントの取り込みのエージェントフロー（`mindstella/on-comment`）に従い、取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド。オープンでもクローズでも）を 1 件ずつ読んで記録に反映し、commit してから返信か取り込み済みにしてクローズにし、最後にその回の報告を新規の報告のスレッド 1 件にまとめ、前の回の報告のスレッドをクローズにする単一ユースケース。'
issue: 67
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 画面から送信したコメントが記録に反映され、記録を変えたときは変えた項目が分かる返信が付く。検討事項への回答に余計な返信が付かず、話が済んだスレッドは閉じる。回答が要ることは検討事項にまとまり、報告のスレッドで一覧できる。同じ書き込みを 2 度取り込まない
trigger: MindStella のセッションに「[mindstella] ユーザーからのコメントが N 件」が入力されるか、起動と再開のエージェントフローが取り込み待ちのコメントを取り込む
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションが起動し、MindStella と project-index の MCP のツールが使える
success_guarantee: 取り込み待ちのスレッドが無くなり、利用者の書き込みは記録と会話ログに反映され、commit で 1 つのまとまりになっている。記録を変えたスレッドには変えた項目の ID を持つ AI の返信があり、検討事項への回答だけのスレッドには返信が無い。話が済んだスレッドはクローズで取り込み済みになっている。会話ログのほかに記録を追加・変更した回には、その回の報告を表で並べた報告のスレッドが 1 件立ち、前の回の報告のスレッドはクローズになっている。スレッドで利用者に回答を求めない。AI の書き込みの約束はタスクになっている。回の最初に保留のタスクを見直し、着手できる条件を満たしたものは進行中になっている。回の最後に、利用者の回答なしで進められる進め方の工程を進め、タスクを保留・完了・中止のどれかにしてから、手番を返す直前の commit を 1 回だけ呼んでいる（単一ユースケース『作業の完了を通知する』）。
minimal_guarantee: 取り込みの途中で MindStella のセッションが止まっても、まだ取り込み済みにしていない書き込みを持つスレッドは取り込み待ちのまま残り、次の取り込みで拾われる。記録に反映していない利用者の書き込みがあるスレッドはクローズにならない。
frequency: 利用者が画面からコメントを送信するたびに 1 回と、MindStella のセッションの起動と再開のたびに 1 回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、エージェントフローの工程が連ねるツールの呼び出しを再生する。書き込みの本文から何を記録するか・返信するかクローズにするか・返信に何を書くかというモデルの判断は確かめない
  取り込む対象: 取り込むのは取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド）で、オープンでもクローズでも拾う。利用者が書き込みを送信してからクローズにしても、その書き込みを取り込む。既読かどうかでは決めないので、MindStella のセッションを再起動して全ての書き込みが未読に戻っても、取り込み済みの書き込みを取り込み直さない
  入力された文字列の再読み込み: サーバーが入力するのは `[mindstella]` で始まる件数だけの 1 行で、スレッドの ID も本文も含まない。取り込み待ちのスレッドの一覧を読み、一覧にあるスレッドだけを記録する
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を追加する
  返信とクローズ: スレッド 1 件ごとに、記録に反映して commit した後、利用者の質問・依頼に回答するときか記録を変えたことを伝えるときは返信し（検討事項への回答だけのスレッドには返信しない）、返信が要らずクローズにもしないときは取り込み済みにする。話が済んだ（質問・依頼に回答した・検討事項への回答を反映した・報告だけ・別のスレッドや検討事項に移った）スレッドはクローズにして取り込み済みにする。利用者が未読の AI の書き込みがあってもクローズにできる。記録に反映していない利用者の書き込みがあるスレッドは、サーバーがクローズを拒む。返信では利用者に回答を求めない。クローズにする前に、そのスレッドの AI の書き込みの約束（後で行うと記載した作業）がタスクにあることを確認し、無ければその回のうちにタスクにする
  利用者に聞くこと: AI が利用者に聞くこと（質問・確認・未決定の点・AI の解釈の確認・ワークスペースの外へ書き込む前の合意）は、記録の使い分けで検討事項にし、スレッドでは聞かない。回答が届くまで、その検討事項の先を進めない
  往復の上限: 利用者と AI の往復が 5 回を超えたスレッドは、続きを新規スレッドに分け、元のスレッドを別のスレッドに移ったものとしてクローズにする
  報告のスレッド: 全てのスレッドを取り込んだ後に、その回で会話ログのほかに記録を追加・変更したときは、新規スレッドを 1 件作成し、その回の報告（追加した検討事項の ID・質問・推奨、AI が決めた細部、反映した回答の ID・反映した内容、追加・着手したタスク）を表で記載する。報告を前の回のスレッドに続けて書き込まない。前の回の報告のスレッドは、このときクローズにする（この回に作成したものはクローズにしない）。報告のスレッドでも利用者に回答を求めない
  保留のタスクの見直し: 取り込み待ちのスレッドを参照する前に、状態が保留のタスクを全て検索し、`reason` の着手できる条件を満たしたものを進行中にしてすぐに着手する
  手番を返す直前の commit: 利用者に手番を返す直前に、その間の修正と返信をまとめる commit を 1 回だけ呼ぶ（まとめる書き換えが無くても呼ぶ）。サブエージェント・バックグラウンドの処理を待つ前には呼ばない。スレッドごとに返信へ差分のリンクを入れるための commit は作業の途中の commit で、これとは分ける。分け方はインターフェース定義『書き換えのまとまり』が持つ
  手番を返す前の確認: 回の最後に手番を返す前に、進め方の工程のうち利用者の回答なしで進められる工程が残っていないかを確認して進め、確認が要る点は検討事項に挙げる。進めてよいかを報告で利用者に聞いて手番を返さない。タスクは保留（`reason` に着手できる条件）・完了・中止のどれかにし、未着手・進行中を残さない。未着手・進行中のタスクが残っていると、手番を返す直前の commit は残っているタスクの ID と状態を返却して拒む（インターフェース定義『書き換えのまとまり』）
test_file: tests/e2e/単一ユースケース/test_comment_intake.py

id: SC-489-43
title: "コメントの取り込み"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・記録の使い分けの `next_id` と project-index の `write_docs`・`commit`・`reply`・`set_thread_status`・`update_thread`・`new_thread` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 項目に紐づかない利用者の書き込み 1 件だけを持つオープンのスレッド TH-1 を持つ
        notes: 書き込みの本文は `ログインはメールとパスワードにする。SSO をいつ入れるかは決めていない`。AI の未読で、取り込んでいない。記録の使い分けでは決定済みの検討事項 D-1・案 A・B と推奨のマーカー A を持つ未決定の検討事項 D-2・会話ログを 1 回で書き込む
      - name: 入力された文字列
        description: 単一ユースケース『コメントを選んで送信する』でサーバーが MindStella のセッションへ入力した `[mindstella] ユーザーからのコメントが 1 件届きました。再読み込みしてください。`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SV as MindStella の MCP
        participant CC as MindStella のセッション
        participant PI as project-index の MCP
        participant WS as ワークスペース

        SV->>CC: 「ユーザーからのコメントが 1 件届きました」を入力する
        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: TH-1
        CC->>SV: スレッドの取得
        SV-->>CC: 項目に紐づかない書き込み
        CC->>SV: next_id
        CC->>PI: write_docs（D-1・D-2・会話ログ）
        CC->>SV: commit
        CC->>SV: 返信する（D-1・D-2 の ID と差分のリンク）
        CC->>SV: クローズにする・取り込み済みにする
        CC->>SV: 新規スレッドを作成する（追加した検討事項 D-2 の通知）
        CC->>SV: オープンのスレッドの一覧
        CC->>SV: 手番を返す直前の commit
        SV->>WS: 書く
      ```
    expected:
      - D-1 が採用した案を持って決定済みで、D-2 が案 A・B と推奨のマーカー A を持ち、未決定の間の案 A の `reason` に推奨する理由があり、未決定である
      - 会話ログに書き込みの本文がある
      - 書き込みの反映が 1 つのまとまりとして commit され、まだまとめていない変更が 0 件である。最後の呼び出しが手番を返す直前の commit である
      - TH-1 の最後の書き込みが、D-1・D-2 の ID と差分のリンクを持つ AI の返信で、TH-1 がクローズで取り込み済みである
      - 報告のスレッドが 1 件立ち、D-2 の ID・質問・推奨を表で持ち、オープンである
      - AI の返信と報告のスレッドの本文が、利用者に回答を求めない
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal
  - name: 正常シナリオ（取り込み待ちが無い）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、起動と再開から呼ばれたコメントの取り込みの取り込み待ちのスレッドの一覧を再生する
      - name: 作成済みのワークスペース
        description: クローズのスレッド 1 件と、利用者の書き込みと AI の返信を持つオープンのスレッド 1 件を持つ
        notes: 利用者の書き込みはどれも取り込み済みで、どの書き込みも AI の未読（MindStella のセッションを再起動して未読へ戻った状態）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: 0 件
        CC->>CC: コメントの取り込みを終える
      ```
    expected:
      - 取り込み待ちのスレッドの一覧が 0 件を返す
      - 報告のスレッドが作成されていない
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_nothing_awaiting
  - name: 正常シナリオ（検討事項への回答）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・`adopt`・`next_id` と project-index の `write_docs`（会話ログ）・`commit`・`set_thread_status`・`update_thread`・`new_thread`・`threads` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B と推奨のマーカー A を持つ未決定の検討事項 D-2 と、D-2 を指す利用者の `A にする` だけを持つオープンのスレッド TH-2 と、前の回に作成したオープンの報告のスレッド TH-1 を持つ
        notes: TH-2 の書き込みは AI の未読で、取り込んでいない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index の MCP
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: TH-2
        CC->>SV: スレッドの取得
        SV-->>CC: D-2 への「A にする」
        CC->>SV: adopt D-2 A
        CC->>PI: write_docs（会話ログ）
        CC->>SV: commit
        CC->>SV: TH-2 をクローズにする・取り込み済みにする（返信しない）
        CC->>SV: 新規スレッドを作成する（反映した回答の通知）
        CC->>SV: オープンのスレッドの一覧
        CC->>SV: 前の回の報告のスレッド TH-1 をクローズにする
        SV->>WS: 書く
      ```
    expected:
      - D-2 の採用する案が A で、決定済みである
      - TH-2 に AI の書き込みが無く、TH-2 がクローズで取り込み済みである
      - 新しい報告のスレッドが、反映した回答（D-2 と採用した案 A）を表で持つ
      - 前の回の報告のスレッド TH-1 がクローズで、新しい報告のスレッドはオープンである
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_decision_answered
  - name: 正常シナリオ（検討事項への回答と箇所への意見）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・`adopt`・`next_id` と project-index の `write_docs`・`commit`・`reply`・`set_thread_status`・`update_thread`・`new_thread` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、本文を持つ資料 A-1 と、利用者の書き込みだけを持つオープンのスレッド 2 件を持つ
        notes: 1 件目の書き込みは D-1 を指し、本文が `案 A にする`。2 件目の書き込みは A-1 を指し、箇所が本文の 2 行目と選んだ文「言い換えたい文」で、本文が `ここは言い換える`。取り込みでは D-1 の採用する案を A にし、A-1 の 2 行目を言い換え、会話ログに 2 件の書き込みの本文と A-1 の箇所を残す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index の MCP
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: 2 件
        CC->>SV: 1 件目のスレッドの取得
        SV-->>CC: D-1 への「案 A にする」
        CC->>SV: adopt D-1 A
        CC->>PI: write_docs（会話ログ）
        CC->>SV: commit
        CC->>SV: 1 件目をクローズにする・取り込み済みにする（返信しない）
        CC->>SV: 2 件目のスレッドの取得
        SV-->>CC: A-1 の 2 行目への「ここは言い換える」
        CC->>PI: write_docs（A-1 の本文の書き換えと会話ログ）
        CC->>SV: commit
        CC->>SV: 2 件目へ返信する（A-1 の ID と差分のリンク）
        CC->>SV: 2 件目をクローズにする・取り込み済みにする
        CC->>SV: 新規スレッドを作成する（反映した回答の通知）
        SV->>WS: 書く
      ```
    expected:
      - スレッドの取得と、D-1 への書き込みと、A-1 への書き込みの箇所（本文の 2 行目と選んだ文）が返る
      - D-1 の採用する案が A で決定済みで、1 件目のスレッドに AI の書き込みが無く、クローズで取り込み済みである
      - A-1 の本文の 2 行目が言い換えられ、2 件目のスレッドに A-1 の ID と差分のリンクを持つ AI の返信があり、クローズで取り込み済みである
      - 会話ログに、D-1 への書き込みの本文と、A-1 の本文の 2 行目と選んだ文を添えた書き込みの本文がある
      - スレッドごとに 1 つずつ、2 つのまとまりが commit されている
      - 報告のスレッドが 1 件立ち、反映した回答（D-1 と採用した案 A）を表で持つ
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_answer_and_location
  - name: 正常シナリオ（報告だけのスレッド）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・`next_id` と project-index の `write_docs`（会話ログ）・`commit`・`set_thread_status`・`update_thread` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A で決定済みの検討事項 D-1 と、D-1 を指すオープンのスレッド 1 件を持つ
        notes: 書き込みは利用者の `案 A にする`（取り込み済み）・AI の `D-1 を追加しました`（利用者の未読）・利用者の `了解`（未読で、取り込んでいない）。再生では、返信せずに理由 `報告だけ` でクローズにして取り込み済みにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index の MCP
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: D-1 へのスレッド
        CC->>SV: スレッドの取得
        SV-->>CC: 利用者の「了解」
        CC->>PI: write_docs（会話ログ）
        CC->>SV: commit
        CC->>SV: スレッドをクローズにする（理由つき）・取り込み済みにする
        SV->>WS: 状態をクローズに書き、書き手（AI）・理由・日時を残す
      ```
    expected:
      - スレッドの書き込みが 3 件のままで、AI の返信が追加されていない
      - 利用者が未読の AI の書き込みがあっても、スレッドの状態がクローズで、クローズにした書き手が AI・理由が `報告だけ` で、日時が残る
      - 利用者の `了解` が取り込み済みである
      - 報告のスレッドが作成されていない
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_report_only
  - name: 正常シナリオ（利用者がクローズにしたスレッドの書き込みを取り込む）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・`adopt`・`next_id` と project-index の `write_docs`（会話ログ）・`commit`・`update_thread`・`new_thread` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指す利用者の `B にする` だけを持つスレッド 1 件を持つ
        notes: 利用者の書き込みは未読で、取り込んでいない。利用者が送信した後に、理由を書かずにクローズにしている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index の MCP
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: クローズの D-1 へのスレッド
        CC->>SV: スレッドの取得
        SV-->>CC: 利用者の「B にする」
        CC->>SV: adopt D-1 B
        CC->>PI: write_docs（会話ログ）
        CC->>SV: commit
        CC->>SV: 取り込み済みにする
        CC->>SV: 新規スレッドを作成する（反映した回答の通知）
        SV->>WS: 書く
      ```
    expected:
      - 取り込み待ちのスレッドの一覧が、状態を渡さずに呼んでも、クローズのスレッドを返す
      - D-1 の採用する案が B で、決定済みである
      - スレッドはクローズのままで、AI の書き込みが増えていない
      - 利用者の `B にする` が取り込み済みで、取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_closed_by_user
  - name: 正常シナリオ（クローズのスレッドをオープンに戻して返信する）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・`next_id` と project-index の `write_docs`（会話ログ）・`commit`・オープンへの戻し・`reply`・`set_thread_status`・`update_thread` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 決定済みの検討事項 D-2 と、D-2 を指す利用者の `バージョンはどこに書く？` だけを持つスレッド 1 件を持つ
        notes: 利用者の書き込みは未読で、取り込んでいない。利用者が送信した後にクローズにしている。再生では、理由 `質問に答える` でオープンに戻してから返信し、理由 `回答した` でクローズにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index の MCP
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: クローズの D-2 へのスレッド
        CC->>SV: スレッドの取得
        SV-->>CC: 利用者の「バージョンはどこに書く？」
        CC->>PI: write_docs（会話ログ）
        CC->>SV: commit
        CC->>SV: スレッドをオープンに戻す（理由つき）
        CC->>SV: スレッドへ返信する（D-2 の ID を含む）
        CC->>SV: スレッドをクローズにする（理由つき）・取り込み済みにする
        SV->>WS: 状態の記録に書き手（AI）・理由・日時を残す
      ```
    expected:
      - スレッドの状態の記録に、AI がオープンに戻した記録（理由 `質問に答える`）とクローズにした記録（理由 `回答した`）が順に残る
      - スレッドの最後の書き込みが D-2 の ID を含む AI の返信である
      - 利用者の書き込みが取り込み済みで、取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_reopen_to_reply
  - name: 正常シナリオ（往復が 5 回を超えたスレッドを分ける）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーと project-index を立て、コメントの取り込みの工程が連ねる取り込み待ちのスレッドの一覧・スレッドの取得・`next_id` と project-index の `write_docs`（会話ログ）・`commit`・`new_thread`・`set_thread_status`・`update_thread` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を指し、利用者と AI の往復が 5 回あるオープンのスレッド TH-1 を持ち、最後の書き込みが利用者の質問（未読で、取り込んでいない）である
        notes: 再生では、続きを新規スレッドに分けてそこで回答し、TH-1 を理由 `別のスレッドに移った` でクローズにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant PI as project-index の MCP
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: TH-1
        CC->>SV: スレッドの取得
        SV-->>CC: 利用者の 6 回目の質問
        CC->>PI: write_docs（会話ログ）
        CC->>SV: commit
        CC->>SV: 新規スレッドを作成する（D-1 を指し、続きの回答を書く）
        CC->>SV: TH-1 をクローズにする（理由つき）・取り込み済みにする
        SV->>WS: 書く
      ```
    expected:
      - D-1 を指す新規スレッドがあり、最初の書き込みが AI の回答である
      - TH-1 に AI の書き込みが追加されておらず、クローズで、理由が `別のスレッドに移った` である
      - TH-1 の利用者の書き込みが取り込み済みで、取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_round_trips_exceeded
  - name: 異常シナリオ（取り込み済みにする前にクローズにする）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、工程から外れて取り込み済みにする前にクローズにする呼び出しを含め、取り込み待ちのスレッドの一覧・スレッドの取得・スレッドのクローズ・取り込み済みにする・スレッドのクローズを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 利用者の `全体に目を通した`（TH-1-1）だけを持つオープンのスレッド TH-1 を持つ
        notes: 利用者の書き込みは未読で、取り込んでいない。再生では、取り込み済みにせずに理由 `報告だけ` でクローズにし、拒まれた後に取り込み済みにしてからクローズにし直す

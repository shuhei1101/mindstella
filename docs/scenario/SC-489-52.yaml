id: SC-489-52
title: "話し合いを記録しながら進める"
scenarios:
  - name: 正常シナリオ（新しい話し合い）
    setup:
      - name: Mock
        description: モデル（エージェントフローを読む Claude）を呼ばない。起動のコマンドの代わりに MindStella の MCP サーバーを立て、MindStella と project-index の MCP にクライアントでつなぎ、エージェントフローの工程が連ねる MCP のツールの呼び出しを、決めた引数で順に再生する。SessionStart のフックは、フックのスクリプトを MindStella のセッションの環境変数で呼んで注入文を得る。利用者のコメントは、ブラウザを使わず、サーバーの配信の `POST /api/comments` と `POST /api/comments/send` で再生する（ブラウザでの送信は正常シナリオ（画面から送った回答を取り込む）で通す）。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている。テストごとの一時の端末の設定で project-index を起動している
      - name: 空のワークスペースのフォルダ
        description: まだ `.mindstella/config.yaml` を持たないフォルダで、グローバルの設定のファイルの許可するフォルダ（`mindstella.allowed_dirs`）が指すテストごとの一時フォルダの下にある
      - name: project-index の配信元への登録
        description: Mock にしない。project-index の接続先（`PROJECT_INDEX_PORT`）は「依存が揃った環境」で起動した project-index を指し、`create_workspace` がワークスペースを配信元の行として登録して、記録が `search_docs`・`write_docs`・`trace_related` で読み書きできる状態になる
      - name: 再生する手順
        description: '起動のコマンドが呼ぶ API と同じ操作の `create_workspace` → SessionStart のフック（起動）→ 起動と再開の `pending`・`threads`（取り込み待ちが無い）→ 利用者のコメントの送信 → コメントの取り込みの `threads`・`thread` → 記録の使い分けの `search_docs`（`group_by: tags`）・`next_id`・`write_docs`（決定済みの検討事項 D-1・未決定の検討事項 D-2・D-2 を `for` の種類の `related` で指す作業 T-1・会話ログを 1 回で）→ `commit` → `reply`（変えた項目の ID と差分のリンク）→ `set_thread_status`・`update_thread`（クローズにして取り込み済み）→ `new_thread`（追加した検討事項 D-2 の通知）→ プレビューの URL の取得'
        notes: '`create_workspace` には、空のワークスペースのフォルダと、進め方の文書・追加の MCP・プラグインの指定なし（どれも空）を渡す。コメントの本文は `ログインはメールとパスワードにする。SSO をいつ入れるかは決めていない`。D-1 は選ばれた案を採用にして決定済みで足し、D-2 は案 A・B と推奨の印 A を持つ未決定で足す'
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|空のワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|SessionStart のフックが起動の契機を注入する| S1([起動と再開:正常シナリオ（起動）])
        S1 -->|取り込み待ちのスレッドが無いので終える| P1([プレビューを開く:正常シナリオ])
        P1 -->|スレッドの一覧の「新しいスレッド」でコメントを書き、まとめて送る| A1([コメントを選んで送る:正常シナリオ])
        A1 -->|MindStella のセッションにコメントの通知が入力される| I1([コメントの取り込み:正常シナリオ])
        I1 -->|コメントを記録の種類に振り分ける| R1([記録の使い分け:正常シナリオ])
        R1 -->|commit して変えた項目の ID を返信し、クローズにして、追加した検討事項を通知する| N1([AIがスレッドを立てる:正常シナリオ（検討事項と回答の通知）])
        N1 --> DONE([コメントから記録が足され、回答の要る検討事項が通知された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-26#scenarios[正常シナリオ（起動）]"
        click P1 "id:SC-489-12#scenarios[正常シナリオ]"
        click A1 "id:SC-489-3#scenarios[正常シナリオ]"
        click I1 "id:SC-489-43#scenarios[正常シナリオ]"
        click R1 "id:SC-489-30#scenarios[正常シナリオ]"
        click N1 "id:SC-489-1#scenarios[正常シナリオ（検討事項と回答の通知）]"
      ```
    expected:
      - '`config.yaml` が `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持たない'
      - D-1 が採用した案を 1 つ持って決定済みで、D-2 が案 A・B と推奨の印 A を持って未決定である
      - T-1 が `for` の種類の `related` で D-2 を指す
      - 足した項目がどれも `phase`・`target`・`category`・`attrs` を持たず、`updated_by` が `ai` である
      - 会話ログが 1 件足されている
      - 送ったコメントのスレッドに、D-1・D-2・T-1 の ID と差分のリンクを持つ AI の返信があり、スレッドがクローズで取り込み済みである
      - 通知のスレッドが 1 件立ち、D-2 の ID・質問・推奨を表で持ち、オープンである
      - ワークスペースに `.mindstella/release/` が無い
      - 直下の `README.md` に、スキルの呼び方が無い
      - ワークスペースの直下には `.mindstella/` と `README.md` だけがある
      - サーバーが配るプレビューの記録が、最後の編集を含んでいる
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_new_discussion
  - name: 正常シナリオ（続きから再開）
    setup:
      - name: Mock
        description: モデル（エージェントフローを読む Claude）を呼ばない。起動のコマンドの代わりに MindStella の MCP サーバーを立て、MindStella と project-index の MCP にクライアントでつなぎ、SessionStart のフック（起動）・起動と再開の `pending` と `commit`・コメントの取り込みの `threads`・`thread`・記録の使い分けの `next_id` と `write_docs`・`commit`・`update_thread` を、決めた引数で再生する。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている。テストごとの一時の端末の設定で project-index を起動し、ワークスペースのフォルダが配信元の行に載って配信されている
      - name: 途中まで進んだワークスペース
        description: 要見直しの検討事項 D-1・進行中の作業 T-1・未決定の検討事項 D-2 と、まだまとめていない変更と、取り込み待ちのスレッド 1 件を持ち、バージョンのファイルにプラグインと同じバージョンを持つワークスペース。前回参照した時点を常駐サーバーの状態のフォルダに記録しており、その時点より後の書き換えで D-1 のタイトルと本文が変わっている
        notes: 最後の検討事項の ID は D-2、最後の作業の ID は T-1。前回参照した時点を記録した後に、`write_docs` で D-1 のタイトルと本文を書き換え、`commit` せずに残す。取り込み待ちのスレッドの本文は `D-2 の続きで、通知の方法を決めたい`
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|途中まで進んだワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|SessionStart のフックが再開の状況を注入する| S1([起動と再開:正常シナリオ（再開）])
        S1 -->|まとめ忘れを commit し、取り込み待ちのスレッドを取り込む| I1([コメントの取り込み:正常シナリオ])
        I1 -->|コメントを記録の種類に振り分ける| R1([記録の使い分け:正常シナリオ])
        R1 --> DONE([まとめ忘れが commit され、続きの番号で項目が足された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-26#scenarios[正常シナリオ（再開）]"
        click I1 "id:SC-489-43#scenarios[正常シナリオ]"
        click R1 "id:SC-489-30#scenarios[正常シナリオ]"
      ```
    expected:
      - 注入文に、要見直しの D-1・進行中の T-1・前回参照した後に変わった D-1 の ID と要約・取り込み待ちのスレッドの件数がある
      - 注入文が次の候補を持たず、起動と再開のエージェントフロー（`mindstella/startup`）を参照するよう案内する
      - まとめ忘れの変更が 1 つのまとまりとして commit され、まだまとめていない変更が 0 件である
      - 取り込み待ちのスレッドが取り込み済みで、取り込み待ちの一覧が 0 件を返す
      - 既存の項目の ID が変わらず、足した検討事項が D-3 である
      - 前回参照した時点が書き換わり、続けて SessionStart のフックを呼ぶと、前回参照した後に変わった項目が 0 件である
    test: test_normal_when_resume
  - name: 正常シナリオ（古いバージョンのワークスペースから再開）
    setup:
      - name: Mock
        description: モデル（エージェントフローを読む Claude）を呼ばない。起動のコマンドの代わりに MindStella の MCP サーバーを立て、MindStella と project-index の MCP にクライアントでつなぎ、SessionStart のフック（起動）・記録の使い分けの `next_id` と `write_docs` を、決めた引数で再生する。移し替えは常駐サーバーがワークスペースを読み込むときに行い、再生しない。コメントの送信とコメントの取り込みは正常シナリオ（新しい話し合い）で通すので再生せず、記録の使い分けの書き込みから再生する。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている。テストごとの一時の端末の設定で project-index を起動している
      - name: 削除するキーを持つ前のバージョンのワークスペース
        description: 前のバージョンをバージョンのファイルに持ち、`config.yaml` に `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持ち、検討事項 D-1 が `phase`・`target`・`category`・`attrs`・`weight` を、資料 A-1 が `deliverable` を、調査 R-1 が `angles`・`confidence` を持つワークスペース
        notes: 'YAML を直接書いて作る。最後の検討事項の ID は D-1。D-1 の `target`・`category` は `認証`・`方式`、`attrs` は `{優先度: 高}`。R-1 の `angles` は `[費用, 運用]`、`confidence` は `中`'
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|プラグインを上げた後、前のバージョンのワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|常駐サーバーがワークスペースを読み込む| M1([ワークスペースの移し替え:正常シナリオ（読み込みのとき）])
        M1 -->|SessionStart のフックが起動の契機を注入する| S1([起動と再開:正常シナリオ（起動）])
        S1 -->|取り込み待ちのスレッドが無いので終え、続きの番号で項目を足す| R1([記録の使い分け:正常シナリオ])
        R1 --> DONE([今のバージョンの形式で続きの番号の項目が足された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click M1 "id:SC-489-17#scenarios[正常シナリオ（読み込みのとき）]"
        click S1 "id:SC-489-26#scenarios[正常シナリオ（起動）]"
        click R1 "id:SC-489-30#scenarios[正常シナリオ]"
      ```
    expected:
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインのバージョンである'
      - '`config.yaml` が `playbooks`・`goal`・`phases`・`targets`・`target_label`・`categories` を持たない'
      - D-1・A-1・R-1 が、削除するキー（`phase`・`target`・`category`・`attrs`・`weight`・`deliverable`・`angles`・`confidence`）を持たない
      - 移し替えの前の D-1 の対象・カテゴリーと `attrs` の値、R-1 の観点と確かさの値が、記録から失われずに残っている
      - 移し替えの後、既存の検討事項 D-1 が project-index の `search_docs` でヒットする
      - 既存の項目の ID が変わらず、移し替えの後に `next_id` と `write_docs` で足した検討事項が D-2 である
      - '`check` が問題を 0 件で返す'
    notes:
      移し替えの前の値の残し方: 対象・カテゴリーをタグに、`attrs`・観点・確かさを本文に移すかは、単一ユースケース『ワークスペースの移し替え』で決める
    test: test_normal_when_resume_older_version
  - name: 正常シナリオ（画面から送った回答を取り込む）
    setup:
      - name: Mock
        description: モデル（エージェントフローを読む Claude）を呼ばない。起動のコマンドの代わりに MindStella の MCP サーバーを立て、MindStella と project-index の MCP にクライアントでつなぎ、SessionStart のフック（起動）・プレビューの URL の取得・コメントの取り込みの `threads`・`thread`・記録の使い分けの `adopt` と `next_id`・`write_docs`・`commit`・`reply`・`set_thread_status`・`update_thread`・`new_thread` を、決めた引数で再生する。コメントを溜めて送るのは実際のブラウザで、サーバーが配るプレビューの詳細パネルとコメントの一覧から行う。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている。テストごとの一時の端末の設定で project-index を起動し、ワークスペースのフォルダが配信元の行に載って配信されている
      - name: 未決定の検討事項と資料を持つワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、3 行の段落の本文を持つ資料 A-1 を持ち、バージョンのファイルにプラグインと同じバージョンを持ち、スレッドを持たないワークスペース
        notes: D-1 の詳細パネルで溜める本文は `案 A にする`。A-1 の本文の 2 行目の文を選んで溜める本文は `ここは言い換える`。スレッドの一覧の「新しいスレッド」で、項目に紐づかないコメント `全体に目を通した` を書いて溜め、レビュー中を確かめる画面でチェックを外す。取り込みでは D-1 の採用する案を A にし、A-1 の 2 行目を言い換え、会話ログに書き込みの本文と A-1 の箇所を残す
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|SessionStart のフックが起動の契機を注入する| S1([起動と再開:正常シナリオ（起動）])
        S1 -->|起動の応答が返した画面の URL を開く| P1([プレビューを開く:正常シナリオ])
        P1 -->|D-1 の詳細パネルを開く| A1([項目へコメントする:正常シナリオ])
        A1 -->|A-1 の詳細パネルで本文の 2 行目の文を選ぶ| A2([選んだ箇所へコメントする:正常シナリオ（本文の文を選ぶ）])
        A2 -->|コメントのボタンから一覧を開き、レビュー中を確かめる入口を押す| A3([コメントを選んで送る:正常シナリオ])
        A3 -->|MindStella のセッションにコメントの通知が入力される| I1([コメントの取り込み:正常シナリオ（検討事項への回答と箇所への意見）])
        I1 -->|スレッドごとに記録の種類に振り分ける| R1([記録の使い分け:正常シナリオ])
        R1 -->|反映した回答を通知する| N1([AIがスレッドを立てる:正常シナリオ（検討事項と回答の通知）])
        N1 --> DONE([送ったコメントで D-1 が決まり、A-1 が言い換えられ、反映した回答が通知された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-26#scenarios[正常シナリオ（起動）]"
        click P1 "id:SC-489-12#scenarios[正常シナリオ]"
        click A1 "id:SC-489-47#scenarios[正常シナリオ]"
        click A2 "id:SC-489-44#scenarios[正常シナリオ（本文の文を選ぶ）]"
        click A3 "id:SC-489-3#scenarios[正常シナリオ]"
        click I1 "id:SC-489-43#scenarios[正常シナリオ（検討事項への回答と箇所への意見）]"
        click R1 "id:SC-489-30#scenarios[正常シナリオ]"
        click N1 "id:SC-489-1#scenarios[正常シナリオ（検討事項と回答の通知）]"
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - D-1 へのスレッドに AI の返信が無く、スレッドがクローズで取り込み済みである
      - A-1 の本文の 2 行目が言い換えられ、A-1 の箇所へのスレッドに A-1 の ID と差分のリンクを持つ AI の返信がある
      - 会話ログに、D-1 への書き込みの本文と、A-1 の本文の 2 行目と選んだ文を添えた書き込みの本文が残っている
      - チェックを外した項目に紐づかないコメントはスレッドに無く、レビュー中に残っている
      - 通知のスレッドが 1 件立ち、反映した回答（D-1 と採用した案 A）を表で持つ
      - 送ったコメントの書き込みが AI の既読で、取り込み待ちの一覧が 0 件を返す
      - '`check` が問題を 0 件で返す'
    notes:
      シナリオの判定: 判定フローチャート『シナリオ』で、既存の複合ユースケースへのシナリオの追加とした。プレビューから送り、MindStella のセッションが取り込んで通知するまでは、プレビューとエージェントフローのサブシステムをまたぎ、単一ユースケースの E2E では再現できない（Q4）
    test: test_normal_when_submission_from_preview

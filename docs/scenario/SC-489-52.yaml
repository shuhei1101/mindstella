    expected:
      - D-1 へのスレッドの AI の返信が、D-2 を追加した旨だけを持ち、利用者に回答を求めない
      - D-2 が案 A・B と推奨の印 A を持って追加され、1 回目の通知のスレッドに D-2 の ID・質問・推奨がある
      - D-2 への回答の後、D-2 が案 A を採用して決定済みで、`answer` と `reason` を持つ
      - D-2 へのスレッドに AI の返信が無く、スレッドがクローズで取り込み済みである

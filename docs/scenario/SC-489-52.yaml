primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 抽象と具体を行き来する発言をそのまま話しても、決め事・派生する問い・調べものが記録に残り、ゴールまで迷わず進める
  - name: 受け取り手
    interest: ゴール判定で書き出した資料だけを読めば、決まったことと納品物が分かる
trigger: 利用者が起動のコマンドでワークスペースと MindStella のセッションを作り、セットアップのスキル（`/mindstella:setup`）を呼ぶ
preconditions:
  - プラグイン mindstella がインストールされている
  - tmux が入っている
  - 常駐サーバーが systemd --user で起動できる

id: SC-489-52
title: "話し合いをゴールまで進める"
scenarios:
  - name: 正常シナリオ（新しい話し合い）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動のコマンドの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、各ステップの手順が連ねる MCP のツールの呼び出しとファイルの書き出しを、決めた引数で順に再生する。起動のコマンドそのもの（依存の確認・常駐サーバーの起動・ワークスペースと MindStella のセッションの作成・tmux）は単一ユースケース『端末から起動する』で、スキルの読み込みと許可は結合テストで確かめる。AI が立てたスレッドへの利用者の回答と送信の取り込みは、正常シナリオ（ヒアリングの回答をスレッドで受ける）と正常シナリオ（AI がスレッドで確かめる）で通すため再生せず、回答が届いたものとして次の呼び出しを続ける
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 空のワークスペースのフォルダ
        description: まだ `.mindstella/config.yaml` を持たないフォルダで、許可するフォルダの環境変数が指すテストごとの一時フォルダの下にある
      - name: project-index の配信元への登録
        description: Mock。登録の依頼を記録するだけにする（登録そのものは単一ユースケース『外部のアプリから起動する』の正常シナリオで通す）。グローバルの設定のファイルの環境変数は、テストごとの一時ファイルを指す
      - name: 再生する手順
        description: '起動のコマンドが呼ぶ API と同じ操作の `create_workspace` → セットアップの `update_settings`（プレイブック: システム開発）→ 取り込みのまとめての書き込み（決め事を持つ検討事項・`parent` を持つ派生の検討事項・本文を持つタスク・会話ログを 1 回で）→ ヒアリングの `next` と、聞く検討事項ごとにその検討事項を向けたスレッドを立てる・`adopt` と `update` → 取り込みの案の書き換え（D-1 に案 B を足す）→ リサーチの起動前の確認のスレッドを立てる・`add`（調査を `related` で検討事項に繋ぐ）→ 方針転換の切り替えの確認のスレッドを立てる・`adopt` と `impact` と `update`（要見直し・見直しのタスク）→ 取り込みの `update`（要見直しを決め直し、見直しのタスクを完了）→ プレビューの URL の取得 → ゴール判定の `goal`・確定の確認のスレッドを立てる・リリースの資料を書き出すツールでの `.mindstella/release/` への書き出し'
        notes: '`create_workspace` には、空のワークスペースのフォルダと、進め方の文書・追加の MCP・プラグインの指定なし（どれも空）を渡す。ゴールは進め方ガイドの既定（システム開発: インターフェースまで）。依存は D-2 が D-1 に `depends_on` で依存する形にして、D-1 の採用する案の切り替えで D-2 が要見直しになるようにする。ゴールのフェーズまでの検討事項は、ゴール判定の前に全て決定済みにする。D-1 は案 A だけを持って足し、案 B は案の書き換えで足す。検討事項はどれも案を持って足し、未決定で足す検討事項は推奨の印を 1 つ持つ。ヒアリングで答えた検討事項は `adopt` で採用し、`update` で答えと理由を書く。決め事を持つ検討事項は選ばれた案を採用にして決定済みで足し、要見直しの D-2 は採用した案を持ったまま `update` で決定済みに戻す'
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（新しいワークスペース）])
        S1 -->|プレイブック・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールを決めて設定に書く +<br>/mindstella:session へ渡す| T1([発言の取り込み:正常シナリオ])
        T1 -->|決め事と派生の検討事項・タスクを積む| H1([ヒアリング:正常シナリオ])
        H1 -->|前提が揃った未決定を、検討事項ごとにスレッドを立てて 1 ラウンドで聞き、答えを取り込む| R1([リサーチ:正常シナリオ])
        R1 -->|スレッドで確認を取ってサブエージェントで調べ、調査を検討事項に繋ぐ| C1([方針転換:正常シナリオ])
        C1 -->|スレッドで確認を取って採用する案を切り替え、影響を要見直しにして見直しのタスクを積む| P1([プレビューを開く:正常シナリオ])
        P1 -->|サーバーが配るプレビューの URL を示す| G1([ゴール判定:正常シナリオ（ゴールに届いた）])
        G1 -->|スレッドで確定の確認を取り、リリースの資料を書き出すツールで書き出す| DONE([確定した検討事項と納品物が .mindstella/release/ に書き出された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-37#scenarios[正常シナリオ（新しいワークスペース）]"
        click T1 "id:SC-489-30#scenarios[正常シナリオ]"
        click H1 "id:SC-489-8#scenarios[正常シナリオ]"
        click R1 "id:SC-489-13#scenarios[正常シナリオ]"
        click C1 "id:SC-489-22#scenarios[正常シナリオ]"
        click P1 "id:SC-489-12#scenarios[正常シナリオ]"
        click G1 "id:SC-489-4#scenarios[正常シナリオ（ゴールに届いた）]"
      ```
    expected:
      - '`config.yaml` に、プレイブック・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールが入っている'
      - 取り込みで足した検討事項・派生の検討事項（`parent` を持つ）・タスク・会話ログがある
      - 足した検討事項がどれも案を 1 つ以上持ち、未決定で足した検討事項が推奨の印を 1 つ持つ
      - ヒアリングで答えた検討事項が、採用した案を 1 つ持って決定済みである
      - 取り込みで足したタスクが本文を持ち、`show` の `body_markdown` が書いた本文を返す
      - 足した・直した項目の `updated_by` が、どれも `ai` である
      - リサーチで足した調査が、元の検討事項と `related` でつながっている
      - D-1 の採用する案が B で、D-2 が決め直されて決定済み、D-2 の見直しのタスクが完了である
      - '`goal` の出力が「届いた」である'
      - '`.mindstella/release/` に、確定した検討事項と納品物の資料が書き出されている'
      - '`check` が参照切れと、YAML と Markdown のずれを 0 件で返す'
      - サーバーが配るプレビューの記録が、最後の編集を含んでいる
      - ワークスペースに `preview.html` が書き出されていない
      - ワークスペースの直下には `.mindstella/` と `README.md` だけがあり、`config.yaml`・種類ごとの YAML・`docs/`・`release/` は `.mindstella/` の下にある
      - 直下の `README.md` に、このフォルダの起動・接続のコマンドとスキルの呼び方の一覧があり、プレビューの節がプレビューを開くで示した URL である
      - ヒアリングで聞いた検討事項ごとに、その検討事項を向けた AI のスレッドがあり、リサーチの起動前の確認・方針転換の切り替えの確認・ゴール判定の確定の確認の AI のスレッドがある
    test: test_normal_when_new_discussion
  - name: 正常シナリオ（続きから再開）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動のコマンドの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、セットアップの `status`、準備の前回読んだ時点からの変更の読み取り、取り込みのまとめての書き込みを、決めた引数で再生する。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる。正常シナリオ（新しい話し合い）で通した方針転換・ゴール判定は通さない
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 途中まで進んだワークスペース
        description: 要見直しの検討事項 D-1・進行中のタスク T-1・前提が揃った未決定 D-2 を持ち、版のファイルにプラグインと同じ版を持ち、取り込み待ちのスレッドを持たないワークスペース。AI が最後に読んだ時点を記録しており、その時点より後の書き換えで D-1 のタイトルと本文が変わっている
        notes: 最後の検討事項の ID は D-2、最後のタスクの ID は T-1。前回読んだ時点からの変更を一度読んで読んだ時点を記録した後に、`update` で D-1 のタイトルと本文を書き換えて作る（AI がツールで書いた分も、次に読むまでは読んでいない変更に数える）。取り込みでは、1 つの発言から出た検討事項とタスクを 1 回の呼び出しで書く
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|途中まで進んだワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S1 -->|要見直し・進行中・再開可能・次の候補と続きの推奨を出す +<br>/mindstella:session へ渡す| D1([前回読んだ時点からの変更を読む:正常シナリオ])
        D1 -->|前回読んだ時点より後に変わった D-1 を示し、読んだ時点を書き換える| T1([発言の取り込み:正常シナリオ])
        T1 -->|1 つの発言から出た検討事項とタスクをまとめて書く| DONE([続きの番号で項目が足された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-37#scenarios[正常シナリオ（既存のワークスペース）]"
        click D1 "id:SC-489-19#scenarios[正常シナリオ]"
        click T1 "id:SC-489-30#scenarios[正常シナリオ]"
      ```
    expected:
      - '`status` の出力に、要見直しの D-1・進行中の T-1・次の候補の D-2 がある'
      - 前回読んだ時点からの変更の出力に、D-1 が変わったキー（タイトル・本文）と前の値つきである
      - 前回読んだ時点からの変更の出力の D-1 に、最後に編集した人 `ai` が載っている
      - 読んだ後、AI が最後に読んだ時点が最後の書き換えの通し番号になっており、続けてもう一度読むと変更が 0 件である
      - 既存の項目の ID が変わらず、取り込みの 1 回の呼び出しで足した検討事項が D-3、タスクが T-2 になっている
    test: test_normal_when_resume
  - name: 正常シナリオ（古い版のワークスペースから再開）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動のコマンドの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、セットアップの版の比較、移し替えのスキルの手順の一覧・写し・当てる・点検・版の書き換え、2 回目のセットアップの `status`、session の準備の README の書き直し、取り込みの `add` を、決めた引数で再生する。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版を記録する前の形式のワークスペース
        description: '版のファイルを持たず、`mindmap.yaml` が `summary` を持たず `field: システム開発` を持ち、資料 A-1 が `done: true` で、検討事項 D-1 を持つワークスペース'
        notes: YAML を直接書いて作る。点検で聞かれる題名には `要件出しのスキルを設計する` と答える。最後の検討事項の ID は D-1。D-1 は `answer` と `reason` を持つ決定済みで、案を持たない
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|プラグインを上げた後、版を記録する前の形式のワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（版が古いワークスペース）])
        S1 -->|ワークスペースの版が古いことと、移し替えのスキルを案内する| M1([ワークスペースの移し替え:正常シナリオ])
        M1 -->|手順の一覧を見せて写しを取り、手順を当て、題名を聞いて、版を書き換える| S2([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S2 -->|状況と続きの推奨を出す +<br>/mindstella:session へ渡す| RM1([README の書き直し:正常シナリオ（README が無い）])
        RM1 -->|準備で直下にコマンドの一覧を書く| T1([発言の取り込み:正常シナリオ])
        T1 --> DONE([今の版の形式で続きの番号の項目が足された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-37#scenarios[正常シナリオ（版が古いワークスペース）]"
        click M1 "id:SC-489-17#scenarios[正常シナリオ]"
        click S2 "id:SC-489-37#scenarios[正常シナリオ（既存のワークスペース）]"
        click RM1 "id:SC-489-2#scenarios[正常シナリオ（README が無い）]"
        click T1 "id:SC-489-30#scenarios[正常シナリオ]"
      ```
    expected:
      - 最初のセットアップが、どのファイルも書き換えずに移し替えのスキルを案内し、`/mindstella:session` へ渡さない
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である
      - '資料 A-1 が `status: 完成` で `done` を持たず、`config.yaml` の `summary` が答えた題名である'
      - '`config.yaml` が `field` を持たず、`playbooks` に元の分野のシステム開発の 1 件を持ち、`target_label` が移し替えの前と同じである'
      - D-1 が、移し替えの前の `answer` を内容に、`reason` を理由にした採用した案を 1 つ持ち、決定済みのままである
      - ワークスペースに `mindmap.yaml` が残っていない
      - 移し替えの後、`config.yaml`・種類ごとの YAML・`docs/`・`release/`・版のファイルが `.mindstella/` の下にあり、直下に残っていない
      - session の準備の後、直下に `README.md` があり、このフォルダの起動・接続のコマンドとスキルの呼び方の一覧がある
      - 2 回目のセットアップが版の案内を出さず、状況と続きの推奨を出す
      - 既存の項目の ID が変わらず、取り込みで足した検討事項が D-2 になっている
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_resume_older_version
  - name: 正常シナリオ（画面から送った回答を取り込む）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動のコマンドの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、セットアップの `status`・プレビューの URL の取得・取り込み待ちのスレッドの一覧・スレッドを読む・取り込みの `adopt` と `add`・スレッドへの返信と取り込み済みにする・要約の書き直しを、決めた引数で再生する。Claude Code の立ち上げ直しは、常駐サーバーを止めずに MCP のクライアントをつなぎ直すことで代える。コメントを溜めて送るのと、スレッドの一覧で返信を読んでクローズにするのは実際のブラウザで、サーバーが配るプレビューの詳細パネルとコメントの一覧から行う。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 未決定の検討事項と資料を持つワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、3 行の段落の本文を持つ資料 A-1 を持ち、版のファイルにプラグインと同じ版を持ち、スレッドを持たないワークスペース
        notes: D-1 の詳細パネルで溜める本文は `案 A にする`。A-1 の本文の 2 行目の文を選んで溜める本文は `ここは言い換える`。スレッドの一覧の「新しいスレッド」で、項目に紐づかないコメント `全体に目を通した` を書いて溜め、レビュー中を確かめる画面でチェックを外す。取り込みでは D-1 の採用する案を A にし、会話ログに書き込みの本文と A-1 の箇所を残す。D-1 へのスレッドの返信には D-1 の ID を書く
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|/mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S1 -->|記録を見たいと言う| P1([プレビューを開く:正常シナリオ])
        P1 -->|示された URL をブラウザで開き、D-1 の詳細パネルを開く| A1([項目へコメントする:正常シナリオ])
        A1 -->|A-1 の詳細パネルで本文の 2 行目の文を選ぶ| A2([選んだ箇所へコメントする:正常シナリオ（本文の文を選ぶ）])
        A2 -->|コメントのボタンから一覧を開き、レビュー中を確かめる入口を押す| A3([コメントを選んで送る:正常シナリオ])
        A3 -->|MindStella のセッションを止め、起動のコマンドで作り直して /mindstella:setup を呼ぶ| S2([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S2 -->|/mindstella:session へ渡す| I1([送信の取り込み:正常シナリオ（箇所と項目に紐づかない送信）])
        I1 -->|取り込み待ちのスレッドを 1 件ずつ取り込む| T1([発言の取り込み:正常シナリオ])
        T1 -->|スレッドの一覧で D-1 へのスレッドの AI の返信を読み、クローズにする| C1([スレッドで話す:正常シナリオ（クローズにする）])
        C1 --> DONE([送ったコメントで D-1 が決まり、A-1 の箇所への意見が残り、AI の返信を読んだ D-1 へのスレッドがクローズの状態])


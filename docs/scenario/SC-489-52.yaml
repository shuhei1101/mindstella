        description: モデル（エージェントフローを読む Claude）を呼ばない。起動のコマンドの代わりに MindStella の MCP サーバーを立て、MindStella と project-index の MCP にクライアントでつなぎ、SessionStart のフック（起動）・コメントの取り込みの `threads`・`thread`・記録の使い分けの `next_id`・`write_docs`・`adopt`・`commit`・`reply`・`set_thread_status`・`update_thread`・`new_thread` を、決めた引数で再生する。利用者のコメントは、ブラウザを使わず、サーバーの配信の `POST /api/comments` と `POST /api/comments/send` で再生する。Issue の起票（ワークスペースの外への書き込み）は再生しない。起動のコマンドそのものは単一ユースケース『端末から起動する』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている。テストごとの一時の端末の設定で project-index を起動し、ワークスペースのフォルダが配信元の行に載って配信されている
      - name: 決定済みの検討事項を持ちスレッドを持たないワークスペース
        description: 決定済みの検討事項 D-1 を持ち、バージョンのファイルにプラグインと同じバージョンを持ち、スレッドを持たないワークスペース
        notes: 利用者が D-1 へ送るコメントは `この結果を Issue にしておいて`。AI が足す検討事項 D-2 は「D-1 の結果を Issue に起票してよいか」で、案 A（起票する）・B（起票しない）と推奨の印 A を持つ。利用者が D-2 へ送るコメントは `A にする`
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して起動のコマンドを叩き、MindStella の API でワークスペースと MindStella のセッションを作る| L1([端末から起動する:正常シナリオ])
        L1 -->|SessionStart のフックが起動の契機を注入する| S1([起動と再開:正常シナリオ（起動）])
        S1 -->|D-1 へ Issue にしておいてとコメントを送る| I1([コメントの取り込み:正常シナリオ])
        I1 -->|ワークスペースの外へ書き込む前の合意を検討事項にする| R1([記録の使い分け:正常シナリオ（利用者に聞くこと）])
        R1 -->|D-2 を追加したことを通知する| N1([AIがスレッドを立てる:正常シナリオ（検討事項と回答の通知）])
        N1 -->|D-2 へ A にするとコメントを送る| I2([コメントの取り込み:正常シナリオ（検討事項への回答）])
        I2 -->|D-2 の案 A を採用する| R2([記録の使い分け:正常シナリオ])
        R2 -->|反映した回答を通知する| N2([AIがスレッドを立てる:正常シナリオ（検討事項と回答の通知）])
        N2 --> DONE([AI が利用者に聞くことが検討事項で決まり、反映した回答が通知された状態])

        click L1 "id:SC-489-41#scenarios[正常シナリオ]"
        click S1 "id:SC-489-26#scenarios[正常シナリオ（起動）]"
        click I1 "id:SC-489-43#scenarios[正常シナリオ]"
        click R1 "id:SC-489-30#scenarios[正常シナリオ（利用者に聞くこと）]"
        click N1 "id:SC-489-1#scenarios[正常シナリオ（検討事項と回答の通知）]"
        click I2 "id:SC-489-43#scenarios[正常シナリオ（検討事項への回答）]"
        click R2 "id:SC-489-30#scenarios[正常シナリオ]"
        click N2 "id:SC-489-1#scenarios[正常シナリオ（検討事項と回答の通知）]"

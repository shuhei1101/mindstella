lead: 利用者が起動のコマンドで MindStella の API からワークスペースと MindStella のセッションを作り、画面から送ったコメントを、MindStella のセッションが起動と再開・コメントの取り込み・記録の使い分けのエージェントフローで記録に取り込み、利用者の回答が要ることを検討事項に挙げて通知し、検討事項への回答で決めていく複合ユースケース。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 画面からコメントを送るだけで、決め事・派生する問い・作業が記録に残り、回答が要ることは検討事項の 1 か所で答えられる
  - name: 導入する側（外部のアプリ）
    interest: 話し合いの進め方とゴールを自分の文書で持ち、MindStella には記録の取り込みだけを任せられる
trigger: 利用者が起動のコマンドでワークスペースと MindStella のセッションを作る
preconditions:
  - プラグイン mindstella がインストールされている
  - tmux が入っている
  - 常駐サーバーが systemd --user で起動できる
success_guarantee: 利用者が画面から送ったコメントは、記録の種類ごとに振り分けて記録され、利用者の回答が要ることは検討事項として残り、検討事項への回答で決まる。ワークスペースの YAML はどの時点でもスキーマに合い、サーバーが配るプレビューは最後の編集を表示している。ワークスペースの直下には記録のフォルダ `.mindstella/` と `README.md` だけがある。
minimal_guarantee: 途中で MindStella のセッションを止めても、それまでに記録した項目と会話ログ、取り込み待ちのスレッドはワークスペースに残り、次に起動のコマンドで MindStella のセッションを作ると、起動と再開のエージェントフローで続きから再開できる。
frequency: 1 つの話し合いにつき、起動 1 回と、数回〜数十回のコメントの送信と取り込み
priority: 高
notes:
  E2E の範囲: E2E はモデルを呼ばず、起動のコマンドの代わりに MindStella の MCP サーバーを立て、MindStella と project-index の MCP にクライアントでつなぎ、ワークスペースは `create_workspace` で作り、エージェントフローの工程が連ねるツールの呼び出しの並びを再生してワークスペースの状態を確かめる。SessionStart のフックの注入は、フックのスクリプトを MindStella のセッションの環境変数で呼んで出力を確かめる。利用者のコメントから何を記録するかというモデルの判断は確かめない。起動のコマンドそのもの（依存の確認・常駐サーバーの起動・MindStella の API でのワークスペースと MindStella のセッションの作成・tmux）は、単一ユースケース『端末から起動する』で確かめる
  エージェントフローとの対応: 単一ユースケースはエージェントフローに当たる（起動と再開 → `mindstella/startup`、コメントの取り込み → `mindstella/on-comment`、記録の使い分け → `mindstella/record`）。MindStella のセッションは、SessionStart のフックが注入する起動の契機と再開の状況を受け、起動と再開のエージェントフローから進める。利用者は Claude Code の画面を参照せず、画面のコメントとスレッドでやり取りする。AI が利用者に聞くことはスレッドでは聞かず、検討事項に挙げ、取り込みの最後に 1 件のスレッドで通知する
  進め方: 話し合いの進め方とゴールは、導入する側が進め方の文書で持ち、起動のときに指定する。進め方の文書を指定しないときは、MindStella のセッションはコメントの取り込みだけを行う
test_file: tests/e2e/複合ユースケース/test_record_discussion.py

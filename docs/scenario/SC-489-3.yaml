id: SC-489-3
title: "コメントを選んで送信する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1 と、本文を持つ資料 A-1
      - name: レビュー中の書き込み
        description: D-1 への新規スレッド「案 A にする」と、A-1 の本文の 2 行目を指す新規スレッド「ここは言い換える」と、オープンのスレッド TH-1（AI の返信で終わる）への返信「了解」の 3 件
      - name: 開いている画面
        description: 検討事項のボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: コメントのボタンを押し、「新規スレッド」で項目に紐づかない「全体に目を通した」を書いてレビューに追加する
        P->>SV: レビュー中の書き込みを追加する（項目なし）
        U->>P: レビュー中を確かめる入口を押す
        P-->>U: レビュー中の書き込み（チェックした 4 件）
        U->>P: 「全体に目を通した」のチェックを外し、まとめて送信する
        P->>SV: チェックした 3 件を送信する
        SV->>WS: 新規スレッドの 2 件をそれぞれオープンのスレッドの最初の書き込みにし、返信の 1 件を TH-1 の末尾に追加し、3 件をレビュー中から外す
        SV-->>P: 受け付けた
        P-->>U: 送信したことと、残った 1 件
        P-->>U: ボードの D-1 のカードからコメントのマーカーを外す
      ```
    expected:
      - オープンのスレッドが 2 件増え、最初の書き込みが D-1 への「案 A にする」と、A-1 の本文の 2 行目の箇所を持つ「ここは言い換える」で、どちらも取り込み待ちである
      - TH-1 の末尾に利用者の「了解」が追加され、AI の未読で、TH-1 が取り込み待ちである
      - レビュー中の書き込みが項目に紐づかない「全体に目を通した」の 1 件だけで、レビュー中を確かめる入口とコメントのボタンの件数が 1 である
      - 画面を再度開かずに、検討事項のボードの D-1 のカードからコメントのマーカーが消える
      - 送信した結果に、Claude Code へ入力しなかったことが出る（MCP のクライアントがペインを引数に入れないため）
    test: test_normal
  - name: 正常シナリオ（一覧から元の箇所へ移る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文が画面の高さを超える長さの資料 A-1
      - name: レビュー中の書き込み
        description: A-1 の本文の終わり近くの行を指す新規スレッド 1 件
      - name: 配信
        description: 記録を配っているサーバー
      - name: 画面の幅
        description: 幅 900px 以下（コメントの一覧（左のパネル）を画面の幅いっぱいに出し、行から開いた詳細パネルを閉じるとパネルへ戻る幅。画面設計『コメントの一覧』）
        notes: 800px
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: レビュー中を確かめる画面で A-1 への行の向けた項目を押す
        P-->>U: A-1 の詳細パネルを開き、箇所までスクロールして示す
        U->>P: ブラウザの戻る操作
        P-->>U: 詳細パネルを閉じ、レビュー中を確かめる画面を出したままにする
      ```
    expected:
      - A-1 の詳細パネルが開き、箇所の行が画面の中にあり、示されている
      - 戻る操作で詳細パネルが閉じ、レビュー中を確かめる画面が開いたままで、URL の search params が `id` を持たない
    test: test_normal_when_jump_to_location
  - name: 正常シナリオ（修正して削除して戻す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中の書き込み
        description: D-1 への「案 A にする」と「案 B も見たい」の 2 件
      - name: 開いている画面
        description: 検討事項のボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 「案 A にする」を「案 A に決める」へ書き換える
        P->>SV: レビュー中のコメントを書き換える
        U->>P: 「案 B も見たい」を削除する
        P->>SV: レビュー中のコメントを削除する
        P-->>U: ボードの D-1 のカードの件数を 1 にする
        U->>P: 削除したコメントを戻す
        P->>SV: レビュー中のコメントを戻す
        P-->>U: 2 件の一覧と、D-1 のカードの件数 2
      ```
    expected:
      - レビュー中のコメントが「案 A に決める」と「案 B も見たい」の 2 件である
      - ページを再度開いても、一覧に同じ 2 件が出る
      - 検討事項のボードの D-1 のカードのコメントのマーカーの件数が、削除した後に 1、戻した後に 2 になる
    test: test_normal_when_edit_remove_restore
  - name: 異常シナリオ（サーバーにつながらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。レビュー中を確かめる画面を開いた後にサーバーを止める）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中の書き込み
        description: D-1 への 2 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー（止まっている）

        U->>P: チェックした 2 件をまとめて送信する
        P->>SV: 送信する
        SV--xP: つながらない
        P-->>U: 送信できなかったことを出す
      ```
    expected:
      - 画面に、送信できなかった旨が出る
      - レビュー中を確かめる画面に 2 件がチェックしたまま残っている
      - ワークスペースのスレッドが 0 件で、レビュー中の書き込みが 2 件のままである
    test: test_error_when_server_unreachable
  - name: 異常シナリオ（チェックが 0 件）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: レビュー中の書き込み
        description: D-1 への 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: レビュー中を確かめる画面で、ただ 1 件のチェックを外す
        P-->>U: まとめて送信するボタンを押せなくする
      ```
    expected:
      - まとめて送信するボタンが押せない
      - ワークスペースのスレッドが 0 件である
    test: test_error_when_nothing_checked
  - name: 異常シナリオ（箇所が本文に合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1 と、本文を持つ資料 A-1
      - name: レビュー中の書き込み
        description: A-1 の本文の 5 行目を指す 1 件と、D-1 への 1 件
        notes: 溜めた後に A-1 の本文を 3 行に縮める（話し合いの途中で Claude Code が資料を書き換えた状態）
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: チェックした 2 件をまとめて送信する
        P->>SV: 送信する
        SV-->>P: A-1 へのコメントの箇所が本文に合わない（何も送信していない）
        P-->>U: A-1 への行に、箇所が合わない理由を出す
        U->>P: A-1 へのコメントから箇所を外し、もう一度まとめて送信する
        P->>SV: 送信する
        SV-->>P: 受け付けた
      ```
    expected:
      - 最初に送信したとき、スレッドが 0 件で、2 件ともレビュー中に残る
      - A-1 への行に、箇所が本文に合わない理由が出る
      - 箇所を外して再送信すると、オープンのスレッドが 2 件になり、A-1 へのスレッドの最初の書き込みは箇所を持たない
    test: test_error_when_location_stale
  - name: 正常シナリオ（Claude Code へ入力する）
    setup:
      - name: Mock
        description: モデルを呼ばない。Claude Code の代わりに、貼られた文字列を 1 件の user のメッセージ（`cwd` はワークスペースのフォルダ）として、設定のフォルダの `projects` の下の作業フォルダに当たるフォルダの会話の記録（jsonl）へ書く偽のコマンドを tmux のペインで動かす。MCP サーバーを立て、プレビューの URL の取得で、PreToolUse のフックが入れるセッションの値（`TMUX`・`TMUX_PANE`・`CLAUDE_CONFIG_DIR`・作業フォルダ）として、そのペインの値を MCP のクライアントが引数に入れる。サーバーが配るプレビューを実際のブラウザで開く
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中の書き込み
        description: D-1 への「案 A にする」と、項目に紐づかない 2 行の「全体に目を通した」の 2 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース
        participant TM as tmux
        participant CC as Claude Code（偽のコマンド）

        U->>P: 2 件をまとめて送信する
        P->>SV: 送信する
        SV->>WS: 2 件をそれぞれオープンのスレッドの最初の書き込みにし、レビュー中から外す
        SV->>TM: 「ユーザーからのコメントが 2 件届きました」の 1 行を Claude Code のペインへ貼って確定する
        TM->>CC: 1 回の入力
        CC->>CC: 会話の記録へ書く
        SV->>SV: 会話の記録に入力した文字列が入ったことを確かめる
        SV-->>P: 受け付けた（Claude Code へ入力した）
        P-->>U: 送信して Claude Code へ入力したこと
      ```
    expected:
      - オープンのスレッドが 2 件ある
      - 会話の記録に user のメッセージが 1 件だけ増え、その中身が `[mindstella] ユーザーからのコメントが 2 件届きました。再読み込みしてください。` である
      - 送信した結果に、Claude Code へ入力したことが出る
      - 2 件のスレッドとも取り込み待ちのままである（取り込み済みにするのは Claude Code が記録した後）
    test: test_normal_when_entered_to_claude_code
  - name: 異常シナリオ（入力が会話に入らない）
    setup:
      - name: Mock
        description: モデルを呼ばない。貼られた文字列を受けても会話の記録へ何も書かない偽のコマンドを tmux のペインで動かす。MCP サーバーを立て、プレビューの URL の取得で、そのペインのセッションの値を MCP のクライアントが引数に入れる。サーバーが配るプレビューを実際のブラウザで開く
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: レビュー中の書き込み
        description: 未決定の検討事項 D-1 への「案 A にする」の 1 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant TM as tmux
        participant CC as Claude Code（偽のコマンド）

        U->>P: まとめて送信する
        P->>SV: 送信する
        SV->>SV: スレッドにし、レビュー中から外す
        SV->>TM: 文字列を貼って確定する
        TM->>CC: 入力
        SV->>SV: 待つ上限までに会話の記録へ ID が入らない
        SV-->>P: 受け付けた（Claude Code へは入力できなかった）
        P-->>U: スレッドは残したが Claude Code へ入力できなかったこと
      ```
    expected:
      - オープンのスレッドが 1 件あり、レビュー中の書き込みが 0 件である
      - 送信した結果に、スレッドは残したが Claude Code へ入力できなかったことが出る
    test: test_error_when_not_entered
  - name: 正常シナリオ（2 つのセッションが別々のワークスペースを開く）
    setup:
      - name: Mock
        description: 正常シナリオ（Claude Code へ入力する）と同じ偽のコマンドを、tmux の 2 つのペインで、それぞれ別の設定のフォルダで動かす。MCP サーバーを 1 つ立て、ワークスペース A のプレビューの URL の取得にペイン 1 のセッションの値を、ワークスペース B の取得にペイン 2 のセッションの値を MCP のクライアントが引数に入れる。サーバーが配る 2 つのプレビューを実際のブラウザで開く
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: make_workspace
        description: 作成を済ませたワークスペース A と B
      - name: レビュー中の書き込み
        description: A の未決定の検討事項 D-1 への「案 A にする」と、B の未決定の検討事項 D-1 への「案 B にする」
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant PA as プレビュー A（ブラウザ）
        participant PB as プレビュー B（ブラウザ）
        participant SV as サーバー
        participant TM as tmux
        participant C1 as Claude Code（ペイン 1）
        participant C2 as Claude Code（ペイン 2）

        U->>PA: まとめて送信する
        PA->>SV: 送信する
        SV->>TM: ペイン 1 へ貼って確定する
        TM->>C1: 1 回の入力
        U->>PB: まとめて送信する
        PB->>SV: 送信する
        SV->>TM: ペイン 2 へ貼って確定する
        TM->>C2: 1 回の入力
      ```
    expected:
      - ペイン 1 の設定のフォルダの会話の記録に user のメッセージが 1 件だけ増え、ペイン 2 の設定のフォルダの会話の記録にも 1 件だけ増える
      - どちらの送信した結果にも、Claude Code へ入力したことが出る
    test: test_normal_when_two_sessions
  - name: 異常シナリオ（値を入れたセッションが終わった）
    setup:
      - name: Mock
        description: 正常シナリオ（Claude Code へ入力する）と同じ偽のコマンドを、tmux のペインのシェルから起動する。プレビューの URL を取得した後、偽のコマンドを終わらせ、ペインをシェルに戻す。サーバーが配るプレビューを実際のブラウザで開く
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: レビュー中の書き込み
        description: 未決定の検討事項 D-1 への「案 A にする」の 1 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant TM as tmux

        U->>P: まとめて送信する
        P->>SV: 送信する
        SV->>SV: スレッドにし、レビュー中から外す
        SV->>SV: 値を入れたセッションが終わっているので貼らずにログに残す
        SV-->>P: 受け付けた（Claude Code へは入力できなかった）
        P-->>U: スレッドは残したが Claude Code へ入力できなかったこと
      ```
    expected:
      - オープンのスレッドが 1 件あり、レビュー中の書き込みが 0 件である
      - ペインのシェルに何も入力されていない
      - 送信した結果に、スレッドは残したが Claude Code へ入力できなかったことが出る
    test: test_error_when_session_ended
  - name: 正常シナリオ（HTML の本文を指すコメントを送信する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を HTML で持ち、原文の 4 行目に `<p>言い<b>換え</b>たい文</p>` を持つ資料 A-1
        notes: 4 行目より前に `<style>` とコメントを置く
      - name: レビュー中の書き込み
        description: A-1 の本文の 4 行目を指し、選んだ文が「言い換えたい文」の 1 件
        notes: 選んだ文は `<b>` のタグをまたぐ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: A-1 へのコメントをチェックして送信する
        P->>SV: 送信する
        SV->>SV: 箇所を HTML の本文の 4 行目の描いた文と照らす
        SV-->>P: 受け付けた
      ```
    expected:
      - オープンのスレッドが 1 件あり、最初の書き込みが A-1 の本文の 4 行目と選んだ文「言い換えたい文」の箇所を持つ
      - レビュー中の書き込みが 0 件である
    test: test_normal_when_html_body_location
  - name: 異常シナリオ（HTML の本文の箇所が合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を HTML で持ち、原文の 4 行目に `<p>言い<b>換え</b>たい文</p>` を持つ資料 A-1
      - name: レビュー中の書き込み
        description: A-1 の本文の 4 行目を指し、選んだ文が「言い換えたい文」の 1 件
        notes: 溜めた後に A-1 の HTML の本文の 4 行目を `<p>書き直した文</p>` に書き換える
      - name: 配信

  - name: 正常シナリオ（MindStella のセッションが落ちた後に送信する）
    setup:
      - name: Mock
        description: claude-balancer（`exec` で受けた引数を記録して `--` の後のコマンドを実行する）・Claude Code（引数を記録し、SessionStart のフックを呼んで待ち、貼られた入力を会話の記録に書く）

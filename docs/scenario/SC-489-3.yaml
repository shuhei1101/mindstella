lead: 利用者が、レビュー中を確かめる画面でレビュー中の書き込み（新規スレッドの最初の書き込みと、既存のスレッドへの返信）を確かめ、修正・削除して、チェックしたものだけをまとめて送信する単一ユースケース。新規スレッドの分は 1 件ずつオープンのスレッドの最初の書き込みになり、返信の分は向けたスレッドの末尾に追加し、そのワークスペースを指してツールを呼んだ tmux のセッションの Claude Code へすぐに入力する。書き込みは単一ユースケース『項目へコメントする』『選んだ箇所へコメントする』『スレッドで話す』と、スレッドの一覧の「新規スレッド」で溜める。
issue: 13
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 送信する前に溜めたコメントを見直し、送りたくないものを外して送信できる。間違えて削除しても戻せる
trigger: 利用者がコメントの一覧（左のパネル）の見出しの帯にある、レビュー中を確かめる入口を押す
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
success_guarantee: チェックしたレビュー中の書き込みのうち、新規スレッドの分は向けた項目・箇所・本文のまま 1 件ずつオープンのスレッドの最初の書き込みになり、返信の分は向けたスレッドの末尾に利用者の書き込みとして追加され、どちらも取り込み待ちになってレビュー中から外れる。チェックしなかったものはレビュー中に残る。そのワークスペースを指して最後にツールを呼んだのが tmux の中で立てた Claude Code なら、そのセッションの会話に送信したことが 1 回の入力として入り、画面に入力したことが出る。
minimal_guarantee: 送信できなかったときは、どの書き込みもスレッドにせずレビュー中に残し、送信できなかったことを出す。Claude Code へ入力できなかったときもスレッドは残し、入力できなかったことを出して、話し合いの取り込みに任せる。値を入れたセッションが終わっていれば貼らない。
frequency: プレビューを読み終えるたびに 1 回
priority: 高
notes:
  削除したものの戻し方: 「元に戻す」で戻すか確認のモーダルを挟むかはモック作成で決める。確認のモーダルに決まったときは、正常シナリオ（修正して削除して戻す）の戻す手順を、モーダルで取り消す手順へ書き換える
  まとめて送信するときの一部の失敗: チェックしたものは全て送信するか、何も送信しないかのどちらかにする。一部だけ送信した状態にはしない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を追加する
  箇所が合わなくなったコメント: 溜めた後に本文や値が書き換わり、箇所が合わなくなったコメントは送信しない。一覧のその行に理由を出し、利用者が箇所を外すか削除するまで、チェックしたものはどれも送信しない
  Claude Code への入力: 入力欄に打ちかけがあるときや選択の表示が出ているときも、ペインの状態を見ずに貼って確定する。打ちかけとつながったり選択の表示で失われたりしたときは、利用者が tmux のセッションで気づいて修正する。入力した文字列の取り込みは単一ユースケース『送信の取り込み』が持つ
  送信した結果の文言: 入力したときと入力できなかったときの文言はモック作成で決める
  音声での修正: レビュー中の書き込みの修正の入力でも、マイクのボタンで話した内容を入力欄へ挿入できる。録音・文字起こしの流れは単一ユースケース [音声でコメントする](id:SC-489-45) が持つ
test_file: tests/e2e/単一ユースケース/test_comment_select_send.py

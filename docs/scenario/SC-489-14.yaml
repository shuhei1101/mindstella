id: SC-489-14
title: "ワークスペースの作成"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 常駐サーバーを立て、MCP のクライアントで `create_workspace` を呼ぶ。project-index の配信元への登録は、登録の依頼を記録するだけの Mock にする（登録そのものは単一ユースケース『外部のアプリから起動する』で通す）
      - name: ワークスペースの場所
        description: 許可するフォルダの環境変数が指すテストごとの一時フォルダの下の、まだ無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: フォルダを渡してワークスペースを作る（POST /workspaces・create_workspace）
        WSM->>WS: .mindstella/ に既定の設定（ワークスペースの ID・進め方の文書を含む）・空の YAML・docs/・release/・版のファイルを書く
        WSM->>WS: 直下に README.md（コマンドの一覧）を書く
        WSM-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - ワークスペースに `.mindstella/config.yaml` があり、既定の設定と、返したワークスペースの ID を持つ
      - ワークスペースの `.mindstella/` に `decisions.yaml`・`tasks.yaml`・`research.yaml`・`docs.yaml`・`terms.yaml`・`notes.yaml`・`logs.yaml` があり、どれも項目を持たない
      - ワークスペースの `.mindstella/` に `docs/` と `release/` のフォルダがある
      - ワークスペースに `.mindstella/mindstella-version.ini` があり、1 行目がプラグインの版である
      - ワークスペースの直下に、設定・種類ごとの YAML・`docs/`・`release/`・版のファイルが無い
      - ワークスペースの直下に `README.md` があり、このフォルダの起動・接続のコマンドとスキルの呼び方の一覧がある
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal
  - name: 異常シナリオ（移す前の形のワークスペースがある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 移す前の形のワークスペース
        description: '`.mindstella/` を持たず、直下に `mindmap.yaml` と種類ごとの YAML を持ち、検討事項 D-1 を持つフォルダ'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: 移す前の形のワークスペースのフォルダを渡して作る
        WSM->>WS: 直下に mindmap.yaml があることを確かめる
        WSM-->>CL: 既にワークスペースがあるエラー（移し替えを案内する）
      ```
    expected:
      - 作成のツールがエラーを返す
      - エラーの本文に、既にワークスペースがある旨と、移し替えの案内がある
      - '`.mindstella/` が作られておらず、配信元の登録の依頼と状態のフォルダのワークスペースの ID の一覧が無い'
      - 直下に `README.md` が作られていない
      - ワークスペースの全てのファイルの中身が、作成を呼ぶ前と同じである
    test: test_error_when_unmigrated_workspace_exists
  - name: 正常シナリオ（README.md が既にある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: README.md を持つフォルダ
        description: 利用者が書いた `README.md` だけを直下に持ち、`.mindstella/` を持たないフォルダ
        notes: '`README.md` の中身は `# 家計簿アプリの話し合い`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: フォルダを渡してワークスペースを作る
        WSM->>WS: .mindstella/ に既定の設定・空の YAML・docs/・release/・版のファイルを書く
        WSM->>WS: 直下に、自動で書いた印の無い README.md があることを確かめ、書かない
        WSM-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - 作成のツールがエラーを返さない
      - ワークスペースに `.mindstella/config.yaml` がある
      - 直下の `README.md` の中身が、作成を呼ぶ前と同じである
    test: test_normal_when_readme_exists
lead: MindStella の API のワークスペースの作成が、許可するフォルダの下に、1 つの話し合いのフォルダ（ワークスペース）の記録を既定の設定で新しく作る単一ユースケース。題名・プレイブックなどの設定は、作った後に設定の更新で書く。
issue: 3
primary_actor: MindStella の API を呼ぶ側（外部のアプリ・起動のコマンド・`create_workspace` を呼ぶセッション）
stakeholders:
  - name: 利用者
    interest: 話し合いの記録を始められる。既にある話し合いの記録を上書きされない
trigger: 呼ぶ側が、記録の無いフォルダを渡してワークスペースの作成を依頼する
preconditions:
  - プラグイン mindstella がインストールされている
  - 常駐サーバーが起動している
  - 渡すフォルダが、設定で許可するフォルダの下にある
success_guarantee: 指定したフォルダの `.mindstella/` に、既定の設定とワークスペースの ID を持つ `config.yaml` と、空の種類ごとの YAML・`docs/`・`release/`・プラグインの版を書いた `mindstella-version.ini` があり、全ての YAML がスキーマに合う。
minimal_guarantee: 移す前の形のワークスペースがあるときは、フォルダの中身を書き換えない。記録が既にあるフォルダは作り直さずに開く（単一ユースケース『外部のアプリから起動する』）。
test_file: tests/e2e/単一ユースケース/test_workspace_create.py
refs:
  - SC-531-1#
notes:
  既定の設定: 既定の設定の値は、インターフェース定義で決める

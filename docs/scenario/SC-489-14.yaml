id: SC-489-14
title: "ワークスペースの作成"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: 常駐サーバーを立て、MCP のクライアントで `create_workspace` を呼ぶ。project-index の配信元への登録は、登録の依頼を記録するだけの Mock にする（登録そのものは単一ユースケース『外部のアプリから起動する』で通す）
      - name: ワークスペースの場所
        description: グローバルの設定のファイルの許可するフォルダ（`mindstella.allowed_dirs`）が指すテストごとの一時フォルダの下の、まだ無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: フォルダを渡してワークスペースを作る（POST /workspaces・create_workspace）
        WSM->>WS: .mindstella/ に既定の設定（ワークスペースの ID・進め方の文書を含む）・空の YAML・バージョンのファイルと、記録を project-index で配信する設定を書く
        WSM->>WS: 直下に本文のフォルダ docs/ を作る
        WSM->>WS: 直下に README.md（コマンドの一覧）を書く
        WSM-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - ワークスペースに `.mindstella/config.yaml` があり、既定の設定と、返したワークスペースの ID を持つ
      - ワークスペースの `.mindstella/` に `decisions.yaml`・`tasks.yaml`・`research.yaml`・`docs.yaml`・`terms.yaml`・`notes.yaml`・`logs.yaml` があり、どれも項目を持たない
      - ワークスペースの直下に `docs/` のフォルダがあり、`.mindstella/` に `docs/`・`release/` のフォルダが無い
      - ワークスペースに `.mindstella/mindstella-version.ini` があり、1 行目がプラグインのバージョンである
      - ワークスペースの直下に、設定・種類ごとの YAML・バージョンのファイルが無い
      - ワークスペースの直下に `README.md` があり、このフォルダの起動・接続のコマンドの一覧があり、スキルの呼び方が無い
      - ワークスペースの全ての YAML がスキーマに合う
      - ワークスペースの `.mindstella/` に記録を配信する設定があり、種類ごとの YAML の項目を 1 件ずつの文書として、直下の `docs/` の本文をその項目の本文として指す
      - 配信元の登録の依頼の `config` が、その配信の設定のパスである
    test: test_normal
  - name: 異常シナリオ（移す前の構造のワークスペースがある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 移す前の構造のワークスペース
        description: '`.mindstella/` を持たず、直下に `mindmap.yaml` と種類ごとの YAML を持ち、検討事項 D-1 を持つフォルダ'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: 移す前の構造のワークスペースのフォルダを渡して作る
        WSM->>WS: 直下に mindmap.yaml があることを確かめる
        WSM-->>CL: 既にワークスペースがあるエラー（移し替えを案内する）
      ```
    expected:
      - 作成のツールがエラーを返す
      - エラーの本文に、既にワークスペースがある旨と、移し替えの案内がある
      - '`.mindstella/` が作られておらず、配信元の登録の依頼と状態のフォルダのワークスペースの ID の一覧が無い'
      - 直下に `README.md` が作られていない
      - ワークスペースの全てのファイルの中身が、作成を呼ぶ前と同じである
    test: test_error_when_unmigrated_workspace_exists
  - name: 正常シナリオ（README.md が既にある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: README.md を持つフォルダ
        description: 利用者が書いた `README.md` だけを直下に持ち、`.mindstella/` を持たないフォルダ
        notes: '`README.md` の中身は `# 家計簿アプリの話し合い`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: フォルダを渡してワークスペースを作る
        WSM->>WS: .mindstella/ に既定の設定・空の YAML・バージョンのファイルを書き、直下に docs/ を作る
        WSM->>WS: 直下に、自動で書いたマーカーの無い README.md があることを確かめ、書かない
        WSM-->>CL: ワークスペースの ID と画面の URL
      ```
    expected:
      - 作成のツールがエラーを返さない
      - ワークスペースに `.mindstella/config.yaml` がある
      - 直下の `README.md` の中身が、作成を呼ぶ前と同じである
    test: test_normal_when_readme_exists
  - name: 異常シナリオ（直下に docs/ か files/ が既にある）
    setup:
      - name: Mock
        description: 正常シナリオと同じ
      - name: 利用者の docs/ を持つフォルダ
        description: 利用者が作った `docs/memo.md` だけを直下に持ち、`.mindstella/` を持たないフォルダ
        notes: 直下に `files/` だけがあるときも同じ振る舞いにする
    flow: |-
      <!-- map -->

      ```mermaid
      sequenceDiagram
        participant CL as MindStella の API を呼ぶ側
        participant WSM as ワークスペースの管理
        participant WS as ワークスペース

        CL->>WSM: フォルダを渡してワークスペースを作る
        WSM->>WS: 直下に docs/ が既にあることを確認する
        WSM-->>CL: 直下に docs/ が既にあるエラー（改名してから再作成する案内）
      ```

      <!-- /map -->
    expected:
      - 作成のツールがエラーを返し、エラーの本文に、直下に `docs/` が既にあるため改名してから再作成する案内がある
      - '`.mindstella/` と直下の `README.md` が作られておらず、配信元の登録の依頼と状態のフォルダのワークスペースの ID の一覧が無い'
      - 直下の `docs/memo.md` の中身が、作成を呼ぶ前と同じである
    test: test_error_when_root_docs_exists
lead: MindStella の API のワークスペースの作成が、許可するフォルダの下に、1 つの話し合いのフォルダ（ワークスペース）の記録を既定の設定で新しく作る単一ユースケース。題名・プレイブックなどの設定は、作った後に設定の更新で書く。
issue: 3
primary_actor: MindStella の API を呼ぶ側（外部のアプリ・起動のコマンド・`create_workspace` を呼ぶセッション）
stakeholders:
  - name: 利用者
    interest: 話し合いの記録を始められる。既にある話し合いの記録を上書きされない
trigger: 呼ぶ側が、記録の無いフォルダを渡してワークスペースの作成を依頼する
preconditions:
  - プラグイン mindstella がインストールされている
  - 常駐サーバーが起動している
  - 渡すフォルダが、設定で許可するフォルダの下にある
success_guarantee: 指定したフォルダの直下に本文のフォルダ `docs/` があり、`.mindstella/` に、既定の設定とワークスペースの ID を持つ `config.yaml` と、空の種類ごとの YAML・プラグインのバージョンを書いた `mindstella-version.ini`・記録を project-index で配信する設定があり、全ての YAML がスキーマに合う。
minimal_guarantee: 移す前の構造のワークスペースがあるときと、記録の無いフォルダの直下に `docs/`・`files/` が既にあるときは、フォルダの中身を書き換えない。記録が既にあるフォルダは再作成せずに開く（単一ユースケース『外部のアプリから起動する』）。
test_file: tests/e2e/単一ユースケース/test_workspace_create.py
refs:
  - SC-531-1#
notes:
  既定の設定: 既定の設定の値は、インターフェース定義で決める
  画面の URL: ホームの設定に画面の公開 URL の基底があれば、返却する画面の URL はその基底にワークスペースのプレビューのパス（`/w/{workspace}/`）を付けた URL にする（単一ユースケース『作業の完了を通知する』の通知の URL と同じ）。無ければ `127.0.0.1` の URL にする

title: 止まったことを通知する
lead: MindStella のセッションが止まったときに、常駐サーバーが、利用者が用意した Webhook の設定のファイルの Webhook で、利用者の Discord のチャンネルへ止まったことと止まった理由を通知する単一ユースケース。
issue: 570
primary_actor: 常駐サーバー
stakeholders:
  - name: 利用者
    interest: MindStella の画面を開かずに、MindStella のセッションが止まったことと理由を知り、起動し直すかを決められる。1 回の停止で通知が何件も届かない
  - name: 外部のアプリ
    interest: 通知に失敗しても、MindStella のセッションの停止・状態の記録・まとめていない変更の commit が変わらない
trigger: MindStella のセッションの状態が、停止済みか落ちた状態に変わる（停止の依頼・SessionEnd のフック・落ちたことの検知）
preconditions:
  - 常駐サーバーが、環境変数で指定された Webhook の設定のファイル（中身は Webhook の URL の 1 行）を参照できる
  - MindStella のセッションが、単一ユースケース『外部のアプリから起動する』か『端末から起動する』で起動している
success_guarantee: MindStella のセッションが止まるたびに、止まったことと止まった理由を記載した 1 件の通知が Discord のチャンネルに届く。
minimal_guarantee: Webhook の設定が無い・送信に失敗したときも、停止・状態の記録・まとめていない変更の commit は変わらない。Webhook の URL は、ログ・応答・ワークスペースの記録に記載しない。
frequency: MindStella のセッションが止まるたびに 1 回
priority: 高
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、受けた要求を記録して 200 を返却する）と、Claude Code のセッション（`/exit` が貼られたら SessionEnd のフックを呼んで終わる）
      - name: 常駐サーバー
        description: 起動している。状態のフォルダ（`XDG_STATE_HOME`）はテストごとの一時フォルダで、Webhook の設定のファイルはテストのエンドポイントの URL を記載した一時ファイル
      - name: ワークスペース
        description: 題名を持ち、プレビューを配信している。MindStella のセッションが応答の途中でない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant SRV as 常駐サーバー
        participant CC as MindStella のセッション
        participant HK as フック
        participant DC as Discord

        APP->>SRV: 停止を依頼する
        SRV-->>APP: 受け付けた
        SRV->>CC: 止めて tmux のペインを閉じる
        CC->>HK: SessionEnd
        HK->>SRV: 停止済みを記録する
        SRV->>DC: 停止の依頼で止まったことを 1 件の通知で送信する
        DC-->>SRV: 受けた
      ```
    expected:
      - エンドポイントに 1 件だけ要求が届いている（停止の依頼と SessionEnd で重ねて送信していない）
      - 通知に、ワークスペースの名前・止まったこと・止まった理由（停止の依頼）・プレビューの URL が記載されている
      - 常駐サーバーのログに送信が成功したことが記録され、ログに Webhook の URL が記載されていない
    test: test_normal
  - name: 正常シナリオ（MindStella のセッションが落ちている）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、200 を返却する）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 状態は起動中だが tmux のペインとプロセスが無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant SRV as 常駐サーバー
        participant DC as Discord

        APP->>SRV: MindStella のセッションの一覧を取得する
        SRV->>SRV: ペインとプロセスが無いので、落ちたことを記録する
        SRV-->>APP: 落ちている
        SRV->>DC: 落ちたことを 1 件の通知で送信する
        APP->>SRV: 停止を依頼する
        SRV->>SRV: 停止済みを記録する（既に落ちたことを通知したので送信しない）
        SRV-->>APP: 停止済み
      ```
    expected:
      - エンドポイントに 1 件だけ要求が届き、止まった理由が落ちたことになっている
      - 一覧の後の停止の依頼で、通知が重ねて届いていない
    test: test_normal_when_session_crashed
  - name: 正常シナリオ（MindStella のセッションが自分で終了する）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、200 を返却する）と、Claude Code のセッション（停止の依頼なしに、`clear`・`resume` 以外の理由の SessionEnd のフックを呼んで終わる）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant HK as フック
        participant SRV as 常駐サーバー
        participant DC as Discord

        CC->>HK: SessionEnd（clear・resume 以外）
        HK->>SRV: 停止済みを記録する
        SRV->>DC: Claude Code が終了したことを 1 件の通知で送信する
      ```
    expected:
      - エンドポイントに 1 件だけ要求が届き、止まった理由が Claude Code の終了になっている
    test: test_normal_when_session_ended
  - name: 正常シナリオ（clear の後の終了）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント）と、Claude Code のセッション（理由が `clear` の SessionEnd のフックを呼ぶ）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant HK as フック
        participant SRV as 常駐サーバー

        CC->>HK: SessionEnd（clear）
        HK->>SRV: 終了を記録する
        SRV->>SRV: 起動中のままなので送信しない
      ```
    expected:
      - エンドポイントに要求が届いていない
      - 状態が起動中のまま
    test: test_normal_when_cleared
  - name: 正常シナリオ（Webhook の設定が無い）
    setup:
      - name: Mock
        description: Claude Code のセッション（`/exit` が貼られたら SessionEnd のフックを呼んで終わる）
      - name: 常駐サーバー
        description: 起動している。Webhook の設定のファイルの環境変数を指定していない
      - name: ワークスペース
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant SRV as 常駐サーバー
        participant CC as MindStella のセッション

        APP->>SRV: 停止を依頼する
        SRV->>CC: 止めて tmux のペインを閉じる
        CC->>SRV: 停止済み（SessionEnd のフック）
        SRV->>SRV: Webhook の設定が無いので送信しない
      ```
    expected:
      - 状態に停止済みが記録されている
      - どこにも要求を送信していない
    test: test_normal_when_webhook_not_configured
  - name: 異常シナリオ（止める間に失敗する）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、200 を返却する）と、Claude Code のセッション（止める工程の途中でプロセスが無くなる）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant SRV as 常駐サーバー
        participant CC as MindStella のセッション
        participant DC as Discord

        APP->>SRV: 停止を依頼する
        SRV-->>APP: 受け付けた
        SRV->>CC: 止める
        SRV->>SRV: 止める間に失敗し、落ちたことと失敗の理由を記録する
        SRV->>DC: 止める間に失敗して落ちたことを 1 件の通知で送信する
      ```
    expected:
      - エンドポイントに 1 件だけ要求が届き、止まった理由が止める間の失敗になっている
      - 止める間に失敗しても MindStella のセッションが生きていて起動中に戻ったときは、要求が届いていない
    test: test_error_when_stop_failed
  - name: 異常シナリオ（送信に失敗する）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、500 を返却する）と、Claude Code のセッション（`/exit` が貼られたら SessionEnd のフックを呼んで終わる）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant APP as 外部のアプリ
        participant SRV as 常駐サーバー
        participant CC as MindStella のセッション
        participant DC as Discord

        APP->>SRV: 停止を依頼する
        SRV->>CC: 止めて tmux のペインを閉じる
        CC->>SRV: 停止済み（SessionEnd のフック）
        SRV->>DC: 通知を送信する
        DC-->>SRV: 失敗（500）
        SRV->>SRV: 送信の失敗をログに記録する（URL を含めない）
      ```
    expected:
      - 状態に停止済みが記録されている
      - エンドポイントに 1 件だけ要求が届いている（再送信しない）
      - 常駐サーバーのログに送信の失敗が記録され、ログに Webhook の URL が記載されていない
    test: test_error_when_send_failed
refs:
  - SC-568-1#
  - SC-531-2#
notes:
  通知の文面: |-
    本文は次の 2 行だけにする（絵文字を使用しない）。

    ```text
    {ワークスペースの名前}: 止まりました（{止まった理由}）
    {プレビューの URL}
    ```

    ワークスペースの名前とプレビューの URL は、単一ユースケース『作業の完了を通知する』と同じ。

    | 止まった理由 | 止まったとき |
    | --- | --- |
    | 停止の依頼 | 外部のアプリか起動のコマンドが停止を依頼し、止め終えた |
    | 強制の停止 | 強制を指定した停止の依頼で止めた |
    | 落ちた | ペインか Claude Code のプロセスが無いことを検知した |
    | 止める間の失敗 | 止める工程の途中で失敗し、落ちたことを記録した |
    | Claude Code の終了 | 停止の依頼なしに、Claude Code が `clear`・`resume` 以外の理由で終了した |
  通知しない出来事: 応答がエラーで終わったとき（StopFailure）は MindStella のセッションが止まらないため通知しない。既に停止済みか落ちた状態から、停止済みか落ちた状態へ書き換えるときは通知しない（1 回の停止で 1 件）。利用上限・無操作の上限で止めたときの通知は、その停止を作る単一ユースケースが、この単一ユースケースの通知を止まった理由を添えて呼ぶ。
id: SC-570-1

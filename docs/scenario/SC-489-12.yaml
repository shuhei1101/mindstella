id: SC-489-12
title: "プレビューを開く"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、手順が連ねるプレビューの URL の取得を再生する。示された URL を実際のブラウザで開く
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        U->>CC: 記録を見たい
        CC->>SV: プレビューの URL
        SV->>SV: 直下の README.md のプレビューのセクションを、常駐サーバーのポートのこのワークスペースの画面の URL にして書き直す
        SV-->>CC: 127.0.0.1 の URL
        CC-->>U: URL を示し、ブラウザで開くよう案内する
        U->>P: URL を開く
        P->>SV: 記録を読む
        SV-->>P: ワークスペースの記録
        P-->>U: 概要
      ```
    expected:
      - URL が `127.0.0.1` の常駐サーバーの待ち受けのポート（`MINDSTELLA_PORT`）を指し、パスでこのワークスペースの画面を指す
      - 開いた画面に D-1 がある
      - ワークスペースに `preview.html` が無い
      - 直下の `README.md` のプレビューのセクションが、示した URL である
    test: test_normal
  - name: 正常シナリオ（ワークスペースの作成が返した URL で開く）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーを立て、MCP のクライアントで `create_workspace` を呼ぶ。project-index の配信元への登録は、登録の依頼を記録するだけの Mock にする。返った画面の URL を実際のブラウザで開く
      - name: ワークスペースのフォルダ
        description: グローバルの設定のファイルの許可するフォルダ（`mindstella.allowed_dirs`）が指すテストごとの一時フォルダの下の、記録の無いフォルダ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CL as MindStella の API を呼ぶ側
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        CL->>SV: ワークスペースの作成（create_workspace）
        SV->>SV: このワークスペースを常駐サーバーのポートで配り始める
        SV-->>CL: ワークスペースの ID と画面の URL
        CL-->>U: 画面の URL を示す
        U->>P: URL を開く
        P->>SV: 記録を読む
        P-->>U: 概要
      ```
    expected:
      - 返った画面の URL が、そのワークスペースのプレビューの URL の取得が返す URL と同じである
      - 開いた画面が、作ったワークスペースの概要である
  - name: 正常シナリオ（Claude Code を閉じた後も開ける）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐の MCP サーバーを立て、MCP のクライアントでプレビューの URL を取得した後、クライアントの接続を閉じる。別の MCP のクライアントで再接続する。示された URL を実際のブラウザで開く
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as 常駐サーバー
        participant P as プレビュー（ブラウザ）

        CC->>SV: プレビューの URL
        SV-->>CC: 127.0.0.1 の URL
        U->>CC: Claude Code を閉じる
        U->>P: URL を開く
        P-->>U: 概要
        U->>CC: Claude Code を再起動して記録を見たい
        CC->>SV: プレビューの URL
        SV-->>CC: 同じ URL
      ```
    expected:
      - クライアントの接続を閉じた後に開いた画面に D-1 がある
      - 再接続した後に取得した URL が、閉じる前と同じである
    test: test_normal_when_session_closed
  - name: 正常シナリオ（記録を書き換える）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、`next_id`・`write_docs` を MCP のクライアントで呼ぶ。プレビューは実際のブラウザで開いておく
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 開いている画面
        description: 検討事項の表
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant PI as project-index
        participant WS as ワークスペース
        participant P as プレビュー（ブラウザ）

        CC->>PI: write_docs（検討事項 D-2）
        PI->>WS: decisions.yaml に書く
        SV->>SV: 書き換えを見つける
        SV-->>P: 書き換えを知らせる
        P->>SV: 記録を再読み込みする
        P-->>P: 開いている画面を再描画する
      ```
    expected:
      - 再読み込みの操作をせずに、検討事項の表に D-2 が出る
      - 再描画した後も、開いていた画面と URL のハッシュが変わらない
    test: test_normal_when_rewritten
  - name: 異常シナリオ（設定がスキーマに合わない）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、手順が連ねるプレビューの URL の取得を再生する
      - name: 設定を手で崩したワークスペース
        description: '`config.yaml` の表示する種類の既定に、選べる値に無い `rainbow` を加えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 記録を見たい
        CC->>SV: プレビューの URL
        SV->>WS: config.yaml を読む
        SV->>SV: スキーマと突き合わせて合わない
        SV-->>CC: 違う箇所（キーと理由）を示すエラー
        CC-->>U: 違う箇所を示し、config.yaml を修正するよう案内する
      ```
    expected:
      - プレビューの URL の取得がエラーを返し、本文に表示する種類の既定のキーと、選べる値が `decisions`・`tasks`・`research`・`docs`・`terms`・`notes`・`logs` である理由がある
      - このワークスペースの画面を配り始めていない（画面の URL を開くと 404 になる）
      - '`config.yaml` の中身が、呼ぶ前と同じである'
    test: test_error_when_config_invalid
  - name: 正常シナリオ（HTML の本文を書き換える）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、プレビューは実際のブラウザで開いておく
      - name: 作成済みのワークスペース
        description: 本文を HTML で持ち、段落「一覧の画面」を持つ資料 A-1
      - name: 開いている画面
        description: 資料のタブと A-1 の詳細パネル
      - name: 書き換え
        description: '`docs/` の A-1 の HTML の本文のファイルを、段落「絞り込みの画面」を持つ中身に書き換える'
        notes: docs.yaml は書き換えない（本文のファイルだけが変わる）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant WS as ワークスペース
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        WS-->>SV: A-1 の HTML の本文のファイルが変わる
        SV->>SV: 書き換えを見つける
        SV-->>P: 書き換えを知らせる
        P->>SV: 記録を再読み込みする
        P-->>P: 開いている画面を再描画する
      ```
    expected:
      - 再読み込みの操作をせずに、A-1 の詳細パネルの本文が書き換えた後の HTML（「絞り込みの画面」）で描かれ、「一覧の画面」が消える
      - 再描画した後も、開いていた画面と URL のハッシュが変わらない
    test: test_normal_when_html_body_rewritten
  - name: 正常シナリオ（修正したまとまりを指すリンク）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、手順が連ねる記録の書き換え・`commit`・プレビューの URL の取得を再生する。示されたリンクを端末の保存領域が空のブラウザで開く
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 と D-2 を持ち、まとまり V-1 を 1 つ持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        U->>CC: D-1 を修正してほしい
        CC->>SV: D-1 を書き換え、書き換えをまとめる
        SV-->>CC: まとまり V-2
        CC->>SV: プレビューの URL
        SV-->>CC: 127.0.0.1 の URL
        CC-->>U: D-1 を修正したことと、V-2 を指すリンクを示す
        U->>P: リンクを開く
        P->>SV: 記録を読む
        SV-->>P: ワークスペースの記録
        P-->>U: V-2 の差分の表示
      ```
    expected:
      - 示したリンクが `127.0.0.1` の常駐サーバーのポートのこのワークスペースの画面を指し、ハッシュが V-2 を持つ
      - リンクを開くと、トップバーに V-2 の説明の札が出て、D-1 に変更のマーカーが付き、D-2 には付かない
    test: test_normal_when_link_to_change_set
  - name: 正常シナリオ（記録の本文に変更したまとまりを書く）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、手順が連ねる記録の書き換え・`commit`・会話ログの追加を再生する。常駐サーバーを止めて別のポート（`MINDSTELLA_PORT`）で起動し直し、端末の保存領域が空のブラウザで開く。起動し直す間、前のポートをテストが `127.0.0.1` で待ち受けて塞いでおく
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 と D-2 を持ち、まとまり V-1 を 1 つ持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        U->>CC: D-1 を修正してほしい
        CC->>SV: D-1 を書き換え、書き換えをまとめる
        SV-->>CC: まとまり V-2
        CC->>SV: V-2 を指すリンクを本文に書いた会話ログを追加し、書き換えをまとめる
        SV-->>CC: まとまり V-3
        Note over SV: 常駐サーバーを別のポートで起動し直す
        U->>P: 起動し直した常駐サーバーの画面で会話ログの詳細パネルを開く
        U->>P: 本文の V-2 を指すリンクを押す
        P-->>U: V-2 の差分の表示
      ```
    expected:
      - 追加した会話ログの本文のリンクの先が `#diff=V-2` で、ホストとポートを含まない
      - 起動し直した常駐サーバーのポートが、起動し直す前と違う
      - リンクを押すと、トップバーに V-2 の説明の札が出て、D-1 に変更のマーカーが付き、D-2 には付かず、会話ログの詳細パネルが開いたまま
    test: test_normal_when_body_link_written_to_record
  - name: 正常シナリオ（スレッドに変更したまとまりを書く）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、手順が連ねる記録の書き換え・`commit`・スレッドへの返信を再生する。常駐サーバーを止めて別のポート（`MINDSTELLA_PORT`）で起動し直し、端末の保存領域が空のブラウザで開く。起動し直す間、前のポートをテストが `127.0.0.1` で待ち受けて塞いでおく
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 と D-2 を持ち、まとまり V-1 を 1 つ持つ
      - name: スレッド
        description: D-1 へのオープンのスレッド 1 件
        notes: 書き込みは利用者の `D-1 を直してほしい` だけで、取り込み待ち
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        CC->>SV: 取り込み待ちのスレッドの取得
        SV-->>CC: D-1 へのスレッド（D-1 を修正してほしい）
        CC->>SV: D-1 を書き換え、書き換えをまとめる
        SV-->>CC: まとまり V-2
        CC->>SV: V-2 を指すリンクを本文に書いた返信をスレッドに追加する
        Note over SV: 常駐サーバーを別のポートで起動し直す
        U->>P: 起動し直した常駐サーバーの画面でコメントの一覧から D-1 へのスレッドを開く
        U->>P: AI の返信の V-2 を指すリンクを押す
        P-->>U: V-2 の差分の表示
      ```
    expected:
      - 追加した返信の本文が `(#diff=V-2)` で終わるリンクを持ち、ホストとポートを含まない
      - 起動し直した常駐サーバーのポートが、起動し直す前と違う
      - リンクを押すと、トップバーに V-2 の説明の札が出て、D-1 に変更のマーカーが付き、D-2 には付かず、D-1 へのスレッドの画面が開いたまま
    test: test_normal_when_thread_link_written
  - name: 正常シナリオ（設定したバージョンの mdmark と map の種類で描く）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、プレビューの URL を取得して実際のブラウザで開く（mdmark は jsDelivr から取る）
      - name: 作成済みのワークスペース
        description: 画面が読み込む mdmark のバージョンと、map の種類 `llm`（札とアイコン）を設定し、本文の Markdown に map の図（種類 `llm` のノード）を 1 つ持つ資料 A-1 を持つ
        notes: バージョンは map を持つタグ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）
        participant CDN as jsDelivr

        U->>P: プレビューの URL を開き、A-1 の詳細パネルを開く
        P->>SV: 記録と設定を読む
        P->>CDN: 設定のバージョンの mdmark を読む
        P-->>U: map の図を描いた本文
      ```
    expected:
      - 画面が mdmark を、設定したバージョンのタグの jsDelivr の URL から参照する
      - A-1 の詳細パネルの本文に map の図が描かれ、ノードが種類 `llm` の札とアイコンを持つ
      - どの画面にも、読めなかったライブラリの知らせが出ない
    test: test_normal_when_mdmark_version_and_map_kinds_set
  - name: 正常シナリオ（mdmark のバージョンを設定しない）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、プレビューの URL を取得して実際のブラウザで開く
      - name: 作成済みのワークスペース
        description: '`config.yaml` が mdmark の設定を持たず、検討事項 D-1 を持つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant CDN as jsDelivr

        U->>P: プレビューの URL を開く
        P->>CDN: mdmark の develop の最新を読む
        P-->>U: 概要
      ```
    expected:
      - 画面が mdmark を、jsDelivr の `gh/shuhei1101/mdmark@develop` の URL から参照する
      - 開いた画面に D-1 がある
    test: test_normal_when_mdmark_version_unset
  - name: 正常シナリオ（入力中に記録を書き換える）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動のコマンドの代わりに MCP サーバーを立て、`next_id`・`write_docs` を MCP のクライアントで呼ぶ。プレビューは実際のブラウザで開いておく
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 開いている画面
        description: 検討事項の表と D-1 の詳細パネルで、コメントの入力に「途中まで」と入れ、カーソルを入力欄に置いている
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）

        CC->>SV: 検討事項 D-2 を書く
        SV-->>P: 書き換えを知らせる
        P-->>U: 記録を再読み込みせず、「更新があります」を出す
        U->>P: カーソルを入力欄の外へ移す
        P->>SV: 記録を再読み込みする
        P-->>U: 開いている画面を再描画し、「更新があります」を削除する
      ```
    expected:
      - カーソルが入力欄にある間は、検討事項の表に D-2 が出ず、コメントの入力の文字「途中まで」とカーソルの位置が変わらず、「更新があります」が出る
      - カーソルを入力欄の外へ移すと、再読み込みの操作をせずに検討事項の表に D-2 が出て、「更新があります」が消える
      - 再描画した後も、コメントの入力の文字が「途中まで」のままで、開いていた画面と URL のハッシュが変わらない
  - name: 正常シナリオ（2 つのワークスペースを同じポートで開く）
    setup:
      - name: Mock
        description: モデルを呼ばない。常駐サーバーを起動し、MCP のクライアントで 2 つのワークスペースのプレビューの URL を取得し、それぞれを実際のブラウザの別のタブで開く
      - name: 作成済みのワークスペース A
        description: 検討事項 D-1 を持つ
      - name: 作成済みのワークスペース B
        description: 検討事項 D-1（A の D-1 と別のタイトル）を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as MindStella のセッション
        participant SV as 常駐サーバー
        participant P as プレビュー（ブラウザ）

        CC->>SV: A のプレビューの URL
        SV-->>CC: 常駐サーバーのポートの A の画面の URL
        CC->>SV: B のプレビューの URL
        SV-->>CC: 常駐サーバーのポートの B の画面の URL
        U->>P: A と B の URL を別のタブで開く
        P->>SV: A の記録を読む・B の記録を読む
        P-->>U: A のタブに A の概要、B のタブに B の概要
        U->>P: A のタブで D-1 にコメントを送信する
        P->>SV: A へのコメント
      ```
    expected:
      - 2 つの URL のホストとポートが同じ（`127.0.0.1` の `MINDSTELLA_PORT`）で、パスが違う
      - A のタブの D-1 のタイトルが A の D-1、B のタブの D-1 のタイトルが B の D-1 である
      - A のタブで送信したコメントが A のワークスペースにだけ記録され、B のワークスペースのコメントが変わらない
      - A の記録を書き換えると A のタブだけが再描画され、B のタブは再描画されない
  - name: 異常シナリオ（削除したワークスペースの画面を開く）
    setup:
      - name: Mock

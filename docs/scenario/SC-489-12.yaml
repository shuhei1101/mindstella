lead: 'MindStella のセッションが、サーバーが配るプレビューの URL を示し、利用者がブラウザで開いて、記録を書き換えるたびに画面が再描画される単一ユースケース。記録を修正したときは、そのまとまりの差分を開くリンクを示す。'
issue: 4
primary_actor: 利用者
trigger: 利用者が記録を見たいと言う
preconditions:
  - ワークスペースが作成済みである
  - mindstella の MCP のツールが使える
success_guarantee: '応答にサーバーが配るプレビューの URL があり、開くと今の記録が出る。Claude Code を閉じても、常駐サーバーが止まるまで配信は続く。ワークスペースの YAML を書き換えると、開いている画面が再読み込みの操作なしで再描画される。入力欄にカーソルがある間と、音声入力の録音を始めてから文字起こしの結果が入るまでの間は再描画せずに「更新があります」を出し、カーソルが入力欄から離れ、音声入力もしていないときに 1 回だけ再描画する。記録を修正したときは、応答にそのまとまりの差分を開くリンクがあり、開くとそのまとまりの差分の表示で開く。記録の本文とワークスペースの中のスレッドに変更したまとまりを書くときは、ホストとポートを含まないリンクで書き、常駐サーバーのポートが変わっても押すとそのまとまりの差分の表示に切り替わる。'
frequency: 話し合いの中で数回
priority: 中
notes:
  E2E の範囲: 書き換えから画面への反映までの時間は非機能要件のテストが確かめる。URL の示し方はモデルの応答で、確かめない
  開き方: MindStella のセッションはブラウザを起動するコマンドを持たず、URL を示して利用者が開く。OS ごとの起動コマンドを `allowed-tools` に追加せずに済み、Claude Code が動く端末とブラウザの端末が違うとき（WSL・リモート）にも崩れない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を追加する

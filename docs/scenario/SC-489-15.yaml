id: SC-489-15
title: "ワークスペースの既定を変える"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域を共有しない 2 つのブラウザのコンテキスト（A と B）で開く）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が表示する種類の既定を持たないワークスペース
      - name: 記録
        description: 検討事項 D-1・用語 G-1
      - name: A の上書き
        description: A の端末の保存領域に、用語集を除いた表示する種類を残しておく。B の端末の保存領域は空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者（A）
        participant PA as プレビュー（A）
        participant SV as サーバー
        participant WS as ワークスペース
        participant PB as プレビュー（B）

        U->>PA: 表示の設定で「ワークスペースの既定にする」を押す
        PA-->>U: 確かめのモーダル（保存する表示する種類）
        U->>PA: 保存する
        PA->>SV: 既定の書き換え（用語集を除いた種類）
        SV->>SV: スキーマと突き合わせる
        SV->>WS: config.yaml を書く
        SV-->>PA: 保存した
        SV-->>PB: 書き換えを知らせる
        PB->>SV: 記録と設定を再読み込みする
        PB-->>PB: 上書きを持たない項目に新しい既定を当てる
      ```
    expected:
      - 確かめのモーダルに、保存する表示する種類（用語集を除いた種類）が出る
      - '`config.yaml` の表示する種類の既定が用語集を除いた種類である'
      - '`config.yaml` のそのほかのキーが、操作の前と同じである'
      - B の画面が、再度開かずに用語集のタブを外す
      - A の端末の保存領域の上書きが残っている
    test: test_normal
  - name: 正常シナリオ（取り消す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が表示する種類の既定を持たないワークスペース
      - name: 端末の上書き
        description: 端末の保存領域に、会話ログを除いた表示する種類を残しておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 表示の設定で「ワークスペースの既定にする」を押す
        P-->>U: 確かめのモーダル
        U->>P: 取り消す
        P-->>U: モーダルを閉じ、表示の設定のパネルに戻る
      ```
    expected:
      - モーダルが閉じ、表示の設定のパネルが開いたままである
      - 既定の書き換えの要求がサーバーへ出ていない
      - '`config.yaml` の中身が、操作の前と同じである'
    test: test_normal_when_cancelled
  - name: 異常シナリオ（保存に失敗する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域を共有しない 2 つのブラウザのコンテキスト（A と B）で開く）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が表示する種類の既定を持たないワークスペース
      - name: 書き込めないワークスペース
        description: 画面を開いた後に、ワークスペースのフォルダを読み取り専用にする
        notes: '`0o500`（結合テストの書き込めないワークスペースと同じ）。設定は一時ファイルから置き換えて書くため、`config.yaml` だけを読み取り専用にしても失敗しない'
      - name: A の上書き
        description: A の端末の保存領域に、用語集を除いた表示する種類を残しておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者（A）
        participant PA as プレビュー（A）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>PA: 「ワークスペースの既定にする」→ 保存する
        PA->>SV: 既定の書き換え
        SV->>WS: config.yaml を書く（書けない）
        SV-->>PA: 書けなかった理由を示すエラー
        PA-->>U: 確かめのモーダルの中に理由を出す
      ```
    expected:
      - 確かめのモーダルの中に、保存できなかった理由が出る
      - '`config.yaml` の中身が、操作の前と同じである'
      - B の画面のタブが、操作の前と同じである
      - A の画面に用語集のタブが無いままである
    test: test_error_when_save_fails
  - name: 正常シナリオ（上書きを持つ人の画面は変わらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域を共有しない 2 つのブラウザのコンテキスト（A と B）で開く）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が表示する種類の既定を持たないワークスペース
      - name: 記録
        description: 検討事項 D-1・用語 G-1・メモ N-1
      - name: A の上書き
        description: A の端末の保存領域に、用語集を除いた表示する種類を残しておく
      - name: B の上書き
        description: B の端末の保存領域に、メモを除いた表示する種類を残しておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者（A）
        participant PA as プレビュー（A）
        participant SV as サーバー
        participant WS as ワークスペース
        participant PB as プレビュー（B）

        U->>PA: 表示の設定で「ワークスペースの既定にする」→ 保存する
        PA->>SV: 既定の書き換え（用語集を除いた種類）
        SV->>WS: config.yaml を書く
        SV-->>PA: 保存した
        SV-->>PB: 書き換えを知らせる
        PB->>SV: 記録と設定を再読み込みする
        PB-->>PB: 表示する種類は上書きを持つため、B の上書きのまま
      ```
    expected:
      - '`config.yaml` の表示する種類の既定が用語集を除いた種類である'
      - B の画面は、既定を保存した後も用語集のタブがあり、メモのタブが無いままである
      - B の端末の保存領域に、メモを除いた表示する種類の上書きが残っている
    test: test_normal_when_other_has_override
  - name: 正常シナリオ（保存を待つ間にもう一度押す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。ブラウザの要求の経路で、既定の書き換えの要求の応答を 2 秒遅らせる）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` が表示する種類の既定を持たないワークスペース
      - name: 記録
        description: 検討事項 D-1・用語 G-1
      - name: 上書き
        description: 端末の保存領域に、用語集を除いた表示する種類を残しておく
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: 表示の設定で「ワークスペースの既定にする」を押し、確かめのモーダルで保存する
        P->>SV: 既定の書き換え（用語集を除いた種類）
        P-->>U: 保存するボタンを押せなくする
        P-->>U: 押してから 1 秒を過ぎたら、ボタンの上に回る読み込み中のアイコンを出す
        U->>P: 応答を待つ間に、保存するボタンをもう一度押す
        P-->>U: 何も送信しない
        SV->>WS: config.yaml を書く
        SV-->>P: 保存した
        P->>SV: 設定を読み直す
        P-->>U: 確かめのモーダルを閉じる
      ```
    expected:
      - '`config.yaml` の表示する種類の既定が用語集を除いた種類である'
      - 既定の書き換えの要求が 1 回だけ送信されている
      - 押した直後からワークスペースの既定に反映されるまで、保存するボタンが押せず、ボタンの幅が押す前と同じである
      - 押してから 1 秒未満はボタンの上に読み込み中のアイコンが出ず、1 秒を過ぎるとボタンの上に回る読み込み中のアイコンが出る
    test: test_normal_when_pressed_again_while_saving
lead: 利用者が、表示の設定のパネルで選んだ表示する種類を、確かめてからワークスペースの既定として `config.yaml` に保存し、上書きを持たない人の画面がその既定に変わる単一ユースケース。
issue: 24
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 自分が選んだ表示を、同じワークスペースを見る人の既定にできる。誤って押しても、確かめで取り消せる
  - name: 同じワークスペースを見る他の人
    interest: 自分で変えていない項目だけが、再度開かずに新しい既定になる
trigger: 利用者が表示の設定のパネルで「ワークスペースの既定にする」を押す
preconditions:
  - サーバーがプレビューを配っている（配る書き出しにはこの操作が無い）
success_guarantee: '`config.yaml` の表示する種類の既定が保存した値になり、そのほかのキーは変わらない。開いている画面のうち上書きを持たない項目が、再度開かずにその値になる。'
minimal_guarantee: 取り消したときと保存に失敗したときは、`config.yaml` を書き換えず、どの画面の表示も保存の前のまま。
frequency: 話し合いごとに数回
priority: 中
notes:
  保存できる人: '開けた人は誰でも保存できる。管理者だけに絞るのは #25'
  保存した人の上書き: 保存しても、保存した人の端末の上書きはそのまま残る
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を追加する
test_file: tests/e2e/単一ユースケース/test_workspace_default_change.py

id: SC-489-47
title: 項目へコメントする
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 案 A・B を持つ未決定の検討事項 D-1。レビュー中のコメントもスレッドも持たない
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: 検討事項のボードで D-1 のカードを押し、詳細パネルを開く
        P-->>U: コメントの入力
        U->>P: 「案 A にする」を入れて溜める
        P->>SV: レビュー中のコメントを足す（D-1・本文）
        SV->>WS: レビュー中のコメントとして書く
        SV-->>P: 受け付けた
        P-->>U: 溜めたことと件数を出し、入力欄を空にする
        P-->>U: ボードの D-1 のカードに、コメントの印と件数 1 を出す
      ```
    expected:
      - ワークスペースに、D-1 を指し本文が「案 A にする」のレビュー中のコメントが 1 件ある
      - スレッドが 0 件である
      - 入力の近くに溜めたことが出て、入力欄が空になる
      - コメントのボタンの件数が 1 である
      - 画面を開き直さずに、検討事項のボードの D-1 のカードの右端に、読み上げの名前が「コメント 1 件」のコメントの印が出る
      - 検討事項の YAML の中身が、溜める前と同じである
    test: test_normal
  - name: 異常シナリオ（本文が空）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: D-1 の詳細パネルで、本文を空のまま溜めようとする
        P-->>U: 溜めず、本文が要ることを出す
      ```
    expected:
      - レビュー中のコメントが 0 件である
      - 画面に、本文が要る旨が出る
    test: test_error_when_body_empty
  - name: 異常シナリオ（サーバーにつながらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。開いた後にサーバーを止める）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー（止まっている）

        U->>P: D-1 の詳細パネルで「案 A にする」を入れて溜める
        P->>SV: レビュー中のコメントを足す
        SV--xP: つながらない
        P-->>U: 溜められなかったことを出す
      ```
    expected:
      - 画面に、溜められなかった旨が出る
      - 入力欄に「案 A にする」が残っている
      - ワークスペースにレビュー中のコメントが 1 件も無い
    test: test_error_when_server_unreachable
  - name: 正常シナリオ（立ち上げ直した後に書きかけを戻す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。立ち上げ直しは、MCP サーバーを止めて立て直し、新しい URL を開くことで代える）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: D-1 の詳細パネルで「案 B も見たい」と入れ、溜めずにパネルを閉じる
        P->>SV: 書きかけを保つ
        U->>SV: サーバーを立ち上げ直す
        U->>P: 新しい URL で D-1 の詳細パネルを開く
        P->>SV: 書きかけを読む
        P-->>U: 入力欄に「案 B も見たい」
      ```
    expected:
      - 新しい URL で開いた D-1 の詳細パネルの入力欄に「案 B も見たい」が入っている
      - レビュー中のコメントが 0 件である（書きかけは溜めたコメントにならない）
    test: test_normal_when_draft_restored_after_restart
  - name: 正常シナリオ（一覧の画面で印を見る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1・D-2、タスク T-1、本文を持つ資料 A-1
      - name: レビュー中のコメント
        description: D-1 への 1 件と D-1 の本文の箇所を指す 1 件、T-1 への 1 件、A-1 への 1 件、項目を指さない 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 検討事項のボードを開く
        P->>SV: レビュー中のコメントを読む
        P-->>U: D-1 のカードにコメントの印と件数 2
        U->>P: マップ・表へ切り替える
        P-->>U: D-1 の節点・行にコメントの印と件数 2
        U->>P: タスクのボードと表・資料のカードと表を開く
        P-->>U: T-1・A-1 のカードと行にコメントの印と件数 1
        U->>P: ネットワークを開く
        P-->>U: 全体を表示した距離では、どの玉にも印を出さない
        U->>P: D-1・T-1・A-1・D-2 の玉を順に押して寄せ、名前が読める距離までホイールで寄る
        P-->>U: D-1・T-1・A-1 の名前の右にコメントの印、D-2 には出さない
      ```
    expected:
      - 検討事項のボード・マップ・表で、D-1 に件数 2 のコメントの印が出て、D-2 には出ない
      - タスクのボードと表の T-1、資料のカードと表の A-1 に、件数 1 のコメントの印が出る
      - ネットワークを開いた直後（全体を表示した距離）は、どの玉にもコメントの印が出ない
      - ネットワークで寄った後、名前が描く枠に収まる D-1・T-1・A-1 の名前の右にコメントの印が出て、D-2 には出ない
      - コメントの印の読み上げの名前が「コメント {件数} 件」である
      - コメントのボタンの件数が 5 である
    test: test_normal_when_marks_shown_in_lists
  - name: 正常シナリオ（詳細パネルで直して消して戻す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域が空の実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中のコメント
        description: D-1 への「案 A にする」と「案 B も見たい」の 2 件
      - name: 開いている画面
        description: 検討事項のボードで、D-1 の詳細パネルを開いている。コメントの一覧は閉じている
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 詳細パネルのレビュー中のコメントで、「案 A にする」を「案 A に決める」へ書き換える
        P->>SV: レビュー中のコメントを書き換える
        P-->>U: 行の本文を「案 A に決める」にする
        U->>P: 詳細パネルのレビュー中のコメントで、「案 B も見たい」を消す
        P->>SV: レビュー中のコメントを消す
        P-->>U: 行を消したことと戻す操作に置き換え、コメントのボタンとボードの D-1 のカードの件数を 1 にする
        U->>P: 消したコメントを戻す
        P->>SV: レビュー中のコメントを戻す
        P-->>U: 2 件の行と、コメントのボタンとボードの D-1 のカードの件数 2
      ```
    expected:
      - コメントの一覧を開かずに、レビュー中のコメントが「案 A に決める」と「案 B も見たい」の 2 件になる
      - 詳細パネルのレビュー中のコメントに、同じ 2 件が既定の新しい順（「案 B も見たい」が上）に出る
      - コメントのボタンの件数と、検討事項のボードの D-1 のカードのコメントの印の件数が、消した後に 1、戻した後に 2 になる
      - ページを開き直しても、D-1 の詳細パネルのレビュー中のコメントに同じ 2 件が出る
      - 検討事項の YAML の中身が、操作の前と同じである
    test: test_normal_when_edit_remove_restore_in_detail
  - name: 正常シナリオ（詳細パネルで並びを切り替える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域が空の実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中のコメント
        description: D-1 への「案 A にする」「案 B も見たい」「案 C は外す」の 3 件（この順に溜めた）
      - name: 開いている画面
        description: 検討事項のボードで、D-1 の詳細パネルを開いている
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        P-->>U: レビュー中のコメントを新しい順に出す
        U->>P: 並びを古い順へ切り替える
        P-->>U: 3 件を溜めた順に並べ直す
        U->>P: ページを開き直し、D-1 の詳細パネルを開く
        P-->>U: 3 件を古い順のまま出す
        U->>P: 並びを新しい順へ戻す
        P-->>U: 3 件を新しい順に並べ直す
      ```
    expected:
      - 開いた直後、詳細パネルのレビュー中のコメントが「案 C は外す」「案 B も見たい」「案 A にする」の順に並ぶ
      - 古い順へ切り替えた後、「案 A にする」「案 B も見たい」「案 C は外す」の順に並ぶ
      - 古い順へ切り替えた状態でページを開き直した後も、古い順のまま並ぶ
      - 新しい順へ戻した後、開いた直後と同じ順に並ぶ
      - 切り替えの前後で、見出しの件数が 3 のままで、ワークスペースのレビュー中のコメントの中身が変わらない
    test: test_normal_when_review_order_switched
  - name: 正常シナリオ（詳細パネルで長いコメントを開いて確かめる）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中のコメント
        description: D-1 へのコメント 1 件。本文は 1 行ずつ改行した 8 行
        notes: 各行は詳細パネルの幅で折り返さない短さにする（5 行の数え方によらず畳まれる）
      - name: 開いている画面
        description: 検討事項のボードで、D-1 の詳細パネルを開いている
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        P-->>U: レビュー中のコメントの本文を 5 行までで畳み「続きを読む」を出す
        U->>P: 「続きを読む」を押す
        P-->>U: 本文の 8 行を全て出し、「折りたたむ」を出す
      ```
    expected:
      - 詳細パネルを開いた直後、レビュー中のコメントの本文は 5 行目までが見え、6 行目以降は見えず、「続きを読む」がある
      - 「続きを読む」を押すと、本文の 8 行が全て見える
      - ワークスペースのレビュー中のコメントの中身は変わらない
    test: test_normal_when_read_long_comment_in_detail
lead: 利用者が、サーバーが配るプレビューの詳細パネルで、開いている項目へのコメントを書き、送らずにレビュー中として溜める単一ユースケース。溜めたコメントは単一ユースケース『コメントを選んで送る』でまとめて送る。
issue: 67
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: プレビューで読んだその場で、答えや意見をどの項目へのものかを付けて書き留められる。送る前に見直せ、書きかけも溜めたコメントも、パネルを閉じても・立ち上げ直しても消えない
trigger: 利用者がプレビューで項目を読み、答えや意見を伝えたくなる
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
success_guarantee: 書いたコメントが、項目の ID とともにレビュー中のコメントとしてワークスペースに残る。スレッドにはしない。
minimal_guarantee: 溜められなかったときは、入力した本文を消さずに、溜められなかったことを画面に出す。記録の YAML は書き換えない。
frequency: プレビューを読むたびに数回
priority: 高
notes:
  入力の置き場所: 詳細パネルのどこに入力を置くか、状態の名前と溜めるボタンの文言はモック作成で決め、画面設計に書く
  配る書き出し: 配る書き出しは送信の入口を持たない（単一ユースケース『プレビューを配る』が確かめる）
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
  コメントの印: コメントの印の見た目と画面ごとの置き場所は、部品設計『コメントの印』と各画面の画面設計が持つ。サーバーにつながらないで開いたプレビューと配る書き出しには出さない
test_file: tests/e2e/単一ユースケース/test_submission_send.py

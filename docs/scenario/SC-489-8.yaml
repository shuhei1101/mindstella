id: SC-489-8
title: "ヒアリング"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `next`・`edit_option`（推奨の印）・スレッドを立てる・取り込み待ちのスレッドの一覧・スレッドを読む・`adopt`・`update`・`add`（会話ログ）・スレッドへの返信を、決めた引数で順に再生する。利用者の回答は、サーバーの配信の `POST /api/comments` と `POST /api/comments/send` で再生する
      - name: 作成済みのワークスペース
        description: 前提が揃った未決定 D-1・D-2（どちらも案 A・B を持ち、推奨の印を持たない）と、D-1 に `depends_on` で依存する未決定 D-3 を持つ
      - name: 再生する答え
        description: 聞く前に D-1 は案 A、D-2 は案 A に推奨の印を立てる。D-1 のスレッドへ `A にする`、D-2 のスレッドへ `B にする` と回答し、答えで D-1 は案 A、D-2 は案 B を `adopt` で採用し、`update` で `answer` と `reason` を入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: next
        SV->>WS: 全ての YAML を読む
        SV-->>CC: 前提が揃った未決定（D-1・D-2）
        CC->>SV: edit_option（D-1・D-2 の推奨する案に推奨の印を立てる）
        CC->>SV: スレッドを立てる（D-1 を向け、D-1 の案の表と記録した推奨を質問の書式で書く）
        CC->>SV: スレッドを立てる（D-2 を向け、D-2 の案の表と記録した推奨を質問の書式で書く）
        U->>SV: D-1・D-2 のスレッドへ回答を送る
        CC->>SV: 取り込み待ちのスレッドの一覧・スレッドを読む（未読だけ）
        SV-->>CC: D-1 への「A にする」・D-2 への「B にする」
        CC->>SV: adopt（D-1 は案 A、D-2 は案 B。どちらも決定済みになる）
        CC->>SV: update（D-1・D-2 に answer と reason を入れる）
        CC->>SV: add（会話ログ）
        CC->>SV: D-1・D-2 のスレッドへ返信する（検討事項の ID を含む）・取り込み済みにする・要約を書き直す
      ```
    expected:
      - '`next` の候補に D-1・D-2 があり、D-3 が無い'
      - 聞く前に、D-1 は案 A、D-2 は案 A が推奨の印を持つ
      - D-1・D-2 が決定済みで `answer` を持つ
      - 'D-1 は案 A、D-2 は案 B だけが `adopted: true` である'
      - 書き込みの後の `next` の候補に D-3 がある
      - 会話ログが 1 件足されている
      - D-1・D-2 それぞれを向けた AI のスレッドがあり、最初の書き込みが案の表と推奨を持つ
      - D-1・D-2 のスレッドの最後の書き込みが、検討事項の ID を含む AI の返信で、取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal
lead: '`session` が、前提が揃った未決定の検討事項を選び、1 ラウンドの検討事項ごとにその検討事項を向けたスレッドを立てて利用者に聞き、スレッドで届いた答えを記録する単一ユースケース。'
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 答えが他の問いに左右される問いを先に聞かれない。事実で分かることを聞かれず、決めることだけを答えればよい
trigger: 取り込みの後に前提が揃った未決定がある、または利用者が次に決めることを求める
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 1 ラウンドで聞くのは `next` が返した前提が揃った未決定だけで、ターミナルに書かず、検討事項ごとにその検討事項を向けたスレッドで質問の書式（タイトル → 冒頭の文 → 案の表と推奨）に従って聞く。答えた検討事項は決定済みになる。聞く検討事項は推奨の印を記録してから聞く。
frequency: 話し合いの中で何度も
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねるツールの呼び出しを再生する。質問の文面は確かめない
test_file: tests/e2e/単一ユースケース/test_hearing.py

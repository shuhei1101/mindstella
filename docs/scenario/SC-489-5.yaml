id: SC-489-5
title: スレッドで話す
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: スレッド
        description: AI が立てたオープンのスレッド 1 件
        notes: 最初の書き込みは AI の `D-1 の比べた結果を Issue に起票してよいですか`。返信の本文は `起票してよい`
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: コメントのボタンを押す
        P-->>U: オープンのスレッドの一覧（1 件）
        U->>P: スレッドの行を押す
        P-->>U: スレッドの書き込み（AI の質問）
        P->>SV: スレッドを利用者の既読にする
        SV->>WS: AI の質問を利用者の既読に書く
        U->>P: 「起票してよい」を書いてレビューに追加する
        P->>SV: レビュー中の返信を追加する（向けた先はそのスレッド）
        SV->>WS: レビュー中の書き込みに追加する
        SV-->>P: 受け付けた
        P-->>U: スレッドの末尾に返信をレビュー中のマーカーつきで出し、入力欄を空にする
        U->>P: レビュー中を確かめる画面を開き、まとめて送信する
        P->>SV: チェックした 1 件を送信する（『コメントを選んで送信する』）
        SV->>WS: 利用者の書き込みをスレッドの末尾に追加し、レビュー中から外す
        SV-->>P: 受け付けた
      ```
    expected:
      - レビューに追加した時点で、スレッドの末尾に `起票してよい` がレビュー中のマーカーつきで出て、一覧のこのスレッドの行にレビュー中のマーカーが出る。スレッドの書き込みは AI の質問の 1 件のままである
      - まとめて送信した後、スレッドの書き込みが AI の質問・利用者の `起票してよい` の順に並び、利用者の書き込みが AI の未読である
      - 取り込み待ちのスレッドの一覧に、このスレッドが出る
      - 一覧のこのスレッドの行に、最後の書き手として利用者が出る（AI の返信を待っているかどうかの札は出ない）
      - レビュー中の書き込みが 0 件で、スレッドの行からレビュー中のマーカーが消える
      - AI の質問と利用者の `起票してよい` がどちらも利用者の既読で、一覧のこのスレッドの行とトップバーのコメントのボタンに未読のマーカーが出ない
    test: test_normal
  - name: 正常シナリオ（クローズにする）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 決定済みの検討事項 D-1
      - name: スレッド
        description: D-1 へのオープンのスレッド 1 件
        notes: 書き込みは利用者の `案 A にする` と、D-1 の ID を含む AI の返信
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: スレッドの一覧で D-1 へのスレッドを開く
        P-->>U: 利用者の書き込みと AI の返信
        U->>P: AI の返信の中の D-1 を押す
        P-->>U: D-1 の詳細パネルを右に開く
        U->>P: 詳細パネルを閉じ、理由に「案 A で決着」を書いてクローズにする
        P->>SV: スレッドをクローズにする（理由つき）
        SV->>WS: 状態をクローズに書き、書き手（利用者）・理由・日時を残す
        SV-->>P: 受け付けた
        U->>P: 一覧へ戻る
        P-->>U: オープンだけの一覧（0 件）
      ```
    expected:
      - AI の返信の中の D-1 から、D-1 の詳細パネルが開く
      - スレッドから開いた D-1 の詳細パネルはグレーアウトされず、コメントの一覧と D-1 の詳細パネルの両方を操作できる
      - スレッドの状態がクローズで、クローズにした書き手（利用者）・理由 `案 A で決着`・日時がスレッドに残り、書き込みの並びに出る
      - クローズにしたスレッドに、返信の入力が出ない
      - 一覧へ戻ると、オープンだけの一覧にこのスレッドが無く、クローズに切り替えると出る
    test: test_normal_when_close
  - name: 正常シナリオ（オープンに戻す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: クローズのスレッド 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: スレッドの一覧でクローズに切り替え、スレッドを開く
        U->>P: 理由を書かずにオープンに戻す
        P->>SV: スレッドをオープンに戻す（理由なし）
        SV->>WS: 状態をオープンに書き、日時を残す
        SV-->>P: 受け付けた
      ```
    expected:
      - スレッドの状態がオープンで、オープンに戻した日時がスレッドに残る（理由は持たない）
      - スレッドに返信の入力が出る
      - 一覧へ戻り、オープンだけの一覧にこのスレッドが出る
    test: test_normal_when_reopen
  - name: 正常シナリオ（AI の返信が画面に届く）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開いた後に、スレッドへ返信するツールを決めた引数で呼ぶ。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: 利用者の `案 A にする` だけを持つオープンのスレッド 1 件
      - name: 開いている画面
        description: そのスレッド
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース
        participant CC as MindStella のセッション

        CC->>SV: スレッドへ返信する
        SV-->>P: 書き換えの通知
        P->>SV: 記録を再読み込みする
        P-->>U: スレッドの末尾に AI の返信を出す
        P->>SV: スレッドを利用者の既読にする
        SV->>WS: AI の返信を利用者の既読に書く
      ```
    expected:
      - 画面を再度開かずに、開いているスレッドの末尾に AI の返信が出る
      - 入力欄に下書きの文があれば、そのまま残る
      - 開いているスレッドに届いた AI の返信は利用者の既読になり、一覧へ戻ってもこのスレッドの行とトップバーのコメントのボタンに未読のマーカーが出ない
    test: test_normal_when_ai_reply_arrives
  - name: 正常シナリオ（状態とタグで絞る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: タグ `画面` のオープン、タグ `調査` のオープン、タグ `画面` のクローズの 3 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: スレッドの一覧で、行のタグ「画面」を押す
        P-->>U: オープンでタグ「画面」の 1 件と、解除のチップ
        U->>P: すべてに切り替える
        P-->>U: タグ「画面」の 2 件
        U->>P: 解除のチップを押す
        P-->>U: すべての 3 件
      ```
    expected:
      - タグ `画面` で絞ると、オープンだけでは 1 件、すべてでは 2 件が出る
      - 解除のチップを押すと、すべての 3 件が出る
      - 状態のタブ（オープン・クローズ・全て）のうち選んでいるタブが、ほかのタブとホバーしているタブのどちらとも、背景と文字の色のコントラストで見分けられる
    test: test_normal_when_filtered
  - name: 正常シナリオ（下書きを残す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: オープンのスレッド 2 件
        notes: どちらも利用者の書き込みと AI の返信を持つ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: 1 件目のスレッドを開き、返信の入力欄に下書きる
        P->>SV: 下書きを保つ（向けた先はそのスレッド）
        SV->>WS: 下書きを書く
        U->>P: 一覧へ戻り、2 件目のスレッドを開く
        P-->>U: 2 件目の返信の入力欄は空
        U->>P: パネルを閉じ、画面を再読み込みして 1 件目のスレッドを開く
        P->>SV: 下書きを読む
        SV-->>P: 1 件目のスレッドの下書き
        P-->>U: 返信の入力欄に下書きを戻す
      ```
    expected:
      - 一覧へ戻る・別のスレッドを開く・パネルを閉じる・画面を再読み込みするのどれでも、1 件目のスレッドの下書きが消えない
      - 1 件目のスレッドを再度開くと、返信の入力欄に下書きが戻る
      - 2 件目のスレッドの返信の入力欄には、1 件目の下書きが入らない
      - 返信をレビューに追加すると、そのスレッドの下書きが消える
    test: test_normal_when_draft_kept
  - name: 正常シナリオ（レビュー中の返信を修正する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: AI の返信で終わるオープンのスレッド 1 件
      - name: レビュー中の書き込み
        description: そのスレッドへの返信「案 A にする」の 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: スレッドを開き、末尾のレビュー中の返信を「案 A に決める」へ書き換える
        P->>SV: レビュー中の書き込みを書き換える
        U->>P: その返信を削除する
        P->>SV: レビュー中の書き込みを削除する
        P-->>U: 末尾の返信と、一覧のこのスレッドの行のレビュー中のマーカーを外す
        U->>P: 削除した返信を元に戻す
        P->>SV: レビュー中の書き込みを戻す
        P-->>U: 末尾に「案 A に決める」をレビュー中のマーカーつきで出す
      ```
    expected:
      - スレッドの末尾のレビュー中の返信と、レビュー中を確かめる画面の行の本文が、どちらも「案 A に決める」である
      - 削除した後は、スレッドの末尾と一覧の行からレビュー中のマーカーが外れ、元に戻すと両方に戻る
      - スレッドの書き込みは送信する前のままで、レビュー中の書き込みが 1 件である
    test: test_normal_when_pending_reply_edited
  - name: 異常シナリオ（サーバーにつながらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。スレッドを開いた後にサーバーを止める）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: AI が立てたオープンのスレッド 1 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー（止まっている）

        U->>P: 「起票してよい」を書いてレビューに追加する
        P->>SV: レビュー中の返信を追加する
        SV--xP: つながらない
        P-->>U: レビューに追加できなかったことを出す
      ```
    expected:
      - 画面に、レビューに追加できなかった旨が出る
      - 入力欄に `起票してよい` が残っている
      - レビュー中の書き込みが 0 件で、スレッドの書き込みが AI の質問の 1 件のままである
    test: test_error_when_server_unreachable
  - name: 異常シナリオ（返信が空）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: AI が立てたオープンのスレッド 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: スレッドを開き、入力欄を空のままにする
        P-->>U: レビューに追加のボタンを押せなくする
      ```
    expected:
      - レビューに追加のボタンが押せない
      - スレッドの書き込みが AI の質問の 1 件のままで、レビュー中の書き込みが 0 件である
    test: test_error_when_reply_empty
  - name: 正常シナリオ（AI のクローズが画面に届く）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開いた後に、スレッドをクローズにするツールを決めた引数で呼ぶ。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: 利用者の `案 A にする`・AI の返信・利用者の `了解` を持つオープンのスレッド 1 件
        notes: 利用者の書き込みはどちらも取り込み済みで、AI の返信は利用者の既読。ツールへ渡す理由は `了解を受けた`
      - name: 開いている画面
        description: そのスレッド
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant CC as MindStella のセッション

        CC->>SV: スレッドをクローズにする（理由つき）
        SV-->>P: 書き換えの通知
        P->>SV: 記録を再読み込みする
        P-->>U: 並びの末尾に、AI がクローズにした記録と理由を出す
        U->>P: 理由を書かずにオープンに戻す
        P->>SV: スレッドをオープンに戻す（理由なし）
        SV-->>P: 受け付けた
      ```
    expected:
      - 画面を再度開かずに、開いているスレッドの並びの末尾に、AI がクローズにした記録と理由 `了解を受けた` が出る
      - スレッドの状態の札がクローズになり、返信の入力が出ず、「オープンに戻す」が出る
      - 利用者がオープンに戻すと、並びに利用者がオープンに戻した記録が追加され、返信の入力が出る
    test: test_normal_when_ai_close_arrives
  - name: 正常シナリオ（未読の返信を開いて既読にする）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開いた後に、スレッドへ返信するツールを決めた引数で呼ぶ。描画のライブラリは CDN から読む
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: スレッド
        description: オープンのスレッド 2 件
        notes: 1 件目は利用者の `案 A にする` だけを持つ。2 件目は利用者の書き込みと AI の返信を持ち、どちらも利用者の既読。ツールでは 1 件目へ返信する
      - name: 開いている画面
        description: コメントの一覧（左のパネル）のスレッドの一覧
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース
        participant CC as MindStella のセッション

        CC->>SV: 1 件目のスレッドへ返信する
        SV->>WS: AI の返信を利用者の未読で追加する
        SV-->>P: 書き換えの通知
        P->>SV: 記録を再読み込みする
        P-->>U: 1 件目の行とコメントのボタンに未読のマーカーを出す
        U->>P: 1 件目の行を押す
        P-->>U: スレッドの書き込み（末尾に AI の返信）
        P->>SV: 1 件目のスレッドを利用者の既読にする
        SV->>WS: AI の返信を利用者の既読に書く
        SV-->>P: 書き換えの通知
        U->>P: 一覧へ戻る
        P-->>U: 未読のマーカーの無い一覧
      ```
    expected:
      - 画面を再度開かずに、1 件目の行とトップバーのコメントのボタンに未読のマーカーが出て、2 件目の行には出ない
      - 未読のマーカーは色に加えて形状で示され、1 件目の行とコメントのボタンの読み上げの名前に未読であることが含まれる
      - 1 件目を開いた後、AI の返信が利用者の既読で、利用者の書き込みの AI の既読と取り込み待ちは変わらない
      - 一覧へ戻ると、1 件目の行とコメントのボタンから未読のマーカーが消える
      - 画面を再読み込みしても、未読のマーカーが出ない
      - 未読のマーカーの色が、行の背景との間でコントラスト比 3:1 以上で、文字の色とも別の色である
    test: test_normal_when_unseen_reply_opened
  - name: 正常シナリオ（書き込みのまとまりのリンクを押す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域が空の実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 検討事項 D-1 と D-2。D-1 を書き換えてまとめた V-1 と、その後 D-2 を書き換えてまとめた V-2 を持つ
      - name: スレッド
        description: AI が立てたオープンのスレッド 1 件

lead: 利用者が、プレビューのコメントの一覧（左のパネル）でスレッドを開き、書き込みを読んで返信をレビューに追加し、レビュー中を確かめる画面からまとめて送信し、話が済んだら任意の理由つきでクローズにする単一ユースケース。スレッドは単一ユースケース『コメントを選んで送信する』で送信した新規スレッドと、単一ユースケース『AIがスレッドの作成』でできる。返信を送信する手順は『コメントを選んで送信する』が持つ。
issue: 208
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: AI の返信と質問を画面で読み、返事を溜めてまとめて返せる。済んだ話を理由を添えて一覧から片付け、要るときに戻せる。AI がクローズにしたスレッドも、誰がなぜ閉じたかを読んで戻せる。AI の返信と質問が届いたスレッドを、まだ読んでいないかで見分けられる
trigger: 利用者がコメントのボタンか、詳細パネルのコメントの一覧のボタンを押し、スレッドの一覧を開く
preconditions:
  - ワークスペースに記録とスレッドがあり、サーバーがプレビューを配っている
success_guarantee: |-
  レビューに追加した返信は、そのスレッドの末尾にレビュー中のマーカーつきで出て、一覧のそのスレッドの行にレビュー中のマーカーが出る。まとめて送信すると、利用者の書き込みとしてスレッドの末尾に積まれ、AI の未読で、取り込み待ちになる。クローズ・オープンへの戻しは、書き手（利用者・AI）・書いた理由（任意）・日時とともにスレッドに残り、クローズにしたスレッドは既定の一覧（オープンだけ）から外れる。書き込みとレビュー中の返信は、本文と同じく Markdown として描かれる。書き込みの中の、記録にあるまとまりを指すリンクを押すと、スレッドを開いたままそのまとまりの差分の表示に切り替わる。
  AI の書き込みは届いた時点で利用者の未読で、利用者の未読の書き込みを持つスレッドの行とトップバーのコメントのボタンに未読のマーカーが出る。スレッドを開くと、その書き込みが利用者の既読になってマーカーが消える。利用者の書き込みは送信した時点で利用者の既読である。
  詳細パネルのコメントの一覧のボタンから開くと、一覧は向けた項目がその項目のスレッドと、その項目へのまだ送信していない新規スレッドだけに絞られ、状態の絞り込みと組み合わせられる。項目の絞り込みは、解除するか別の項目のボタンを押すまで変わらない。コメントの一覧を開いたままボタンを押したときは、状態とタグの絞り込みを保ち、項目の絞り込みだけを差し替える。
minimal_guarantee: レビューに追加できなかったときは、返信を溜めずに入力欄に残し、追加できなかったことを出す。
frequency: AI の返信や質問が届くたびに
priority: 高
notes:
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を追加する
test_file: tests/e2e/単一ユースケース/test_thread_talk.py

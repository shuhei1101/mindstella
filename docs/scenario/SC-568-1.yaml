id: SC-568-1
title: 作業の完了を通知する
lead: MindStella のセッションが 1 回の作業を終えて利用者に手番を返すときに、常駐サーバーが、利用者が用意した Webhook の設定のファイルの Webhook で、利用者の Discord のチャンネルへ通知する単一ユースケース。
issue: 568
primary_actor: 常駐サーバー
stakeholders:
  - name: 利用者
    interest: MindStella の画面を開かずに、依頼した作業が終わったことを知れる。1 回の作業で通知が何件も届かない
  - name: 外部のアプリ
    interest: 通知に失敗しても、MindStella のセッションの起動・停止・記録の書き込みが変わらない
trigger: MindStella のセッションが、利用者に手番を返す直前に、その間の修正と返信をまとめる `commit` を呼ぶ
preconditions:
  - 常駐サーバーが、環境変数で指定された Webhook の設定のファイル（中身は Webhook の URL の 1 行）を参照できる
  - MindStella のセッションが、単一ユースケース『外部のアプリから起動する』か『端末から起動する』で起動している
  - MindStella のセッションが、エージェントフローの決まりに従い、利用者に手番を返す直前に、成功する `commit` を 1 回だけ呼ぶ（単一ユースケース『コメントの取り込み』）。拒まれたら、残っているタスクの状態を変えてから呼び直す
success_guarantee: MindStella のセッションが手番を返す直前の `commit` が成功するたびに、1 件の通知が Discord のチャンネルに届く。返信に差分のリンクを入れるために作業の途中で呼ぶ `commit` では届かない。修正が無く返信だけで手番を返す `commit` でも届く。サブエージェントやバックグラウンドの処理を待つだけで応答が終了したときと、未着手・進行中のタスクが残っていて手番を返す直前の `commit` が拒まれたときは届かない。
minimal_guarantee: Webhook の設定が無い・送信に失敗したときも、出来事の記録・スレッドの書き込み・commit は変わらない。Webhook の URL は、ログ・応答・ワークスペースの記録に記載しない。
frequency: MindStella のセッションが利用者に手番を返すたびに 1 回
priority: 高
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、受けた要求を記録して 200 を返却する。常駐サーバーは `wait=true` で送信する）と、Claude Code のセッション（MindStella のセッションとして MCP のツールを呼ぶ）
      - name: 常駐サーバー
        description: 起動している。状態のフォルダ（`XDG_STATE_HOME`）はテストごとの一時フォルダで、Webhook の設定のファイルはテストのエンドポイントの URL を記載した一時ファイル
      - name: ワークスペース
        description: 題名を持ち、プレビューを配信している
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SRV as 常駐サーバー
        participant DC as Discord

        CC->>SRV: 記録を修正し、スレッドに返信する
        CC->>SRV: 手番を返す直前に書き換えをまとめる（commit）
        SRV->>SRV: まとまりを追加する
        SRV-->>CC: まとめた
        SRV->>DC: 作業が終わったことを 1 件の通知で送信する
        DC-->>SRV: 受けた
      ```
    expected:
      - エンドポイントに、手番を返す直前の `commit` 1 回につき 1 件の要求が届いている
      - 通知に、ワークスペースの名前・作業が終わったこと・プレビューの URL が記載されている
      - 常駐サーバーのログに送信が成功したことが記録され、ログに Webhook の URL が記載されていない
    test: test_normal
  - name: 正常シナリオ（返信だけで手番を返す）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、200 を返却する）と、Claude Code のセッション（記録を修正せずにスレッドへ返信し、`commit` を呼ぶ）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ。まとめていない書き換えが無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SRV as 常駐サーバー
        participant DC as Discord

        CC->>SRV: スレッドに返信する
        CC->>SRV: 手番を返す直前に書き換えをまとめる（commit）
        SRV->>SRV: まとめる書き換えが無いので、まとまりを追加しない
        SRV-->>CC: まとめる書き換えが無い
        SRV->>DC: 作業が終わったことを 1 件の通知で送信する
        DC-->>SRV: 受けた
      ```
    expected:
      - エンドポイントに 1 件の要求が届いている
      - 書き換えのまとまりが増えていない
    test: test_normal_when_reply_only
  - name: 正常シナリオ（処理を待つだけで応答が終了する）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイント）と、Claude Code のセッション（スレッドに返信し、`commit` を呼ばずに応答の終了（Stop）のフックを呼ぶ。サブエージェントやバックグラウンドの Bash を待つ応答に該当する）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant HK as フック
        participant SRV as 常駐サーバー

        CC->>SRV: スレッドに返信する
        CC->>HK: 処理を待つあいだに応答の終了（Stop）
        HK->>SRV: 応答の終了を記録する
        SRV-->>HK: 受けた
        SRV->>SRV: commit が無いので送信しない
      ```
    expected:
      - エンドポイントに要求が届いていない
      - スレッドの返信が残っている
    test: test_normal_when_waiting
  - name: 正常シナリオ（Webhook の設定が無い）
    setup:
      - name: Mock
        description: Claude Code のセッション（スレッドに返信して `commit` を呼ぶ）
      - name: 常駐サーバー
        description: 起動している。Webhook の設定のファイルの環境変数を指定していない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SRV as 常駐サーバー

        CC->>SRV: スレッドに返信する
        CC->>SRV: 書き換えをまとめる（commit）
        SRV-->>CC: まとめた
        SRV->>SRV: Webhook の設定が無いので送信しない
      ```
    expected:
      - '`commit` が成功し、スレッドの返信が残っている'
      - どこにも要求を送信していない
    test: test_normal_when_webhook_not_configured
  - name: 異常シナリオ（送信に失敗する）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、500 を返却するか、送信を待つ上限より長く応答しない）と、Claude Code のセッション（スレッドに返信して `commit` を呼ぶ）
      - name: 常駐サーバー
        description: 起動している。Webhook の設定のファイルはテストのエンドポイントの URL を記載した一時ファイル
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SRV as 常駐サーバー
        participant DC as Discord

        CC->>SRV: スレッドに返信する
        CC->>SRV: 書き換えをまとめる（commit）
        SRV-->>CC: まとめた
        SRV->>DC: 通知を送信する
        DC-->>SRV: 失敗（500・上限を過ぎても応答しない）
        SRV->>SRV: 送信の失敗をログに記録する（URL を含めない）
      ```
    expected:
      - '`commit` の応答が、送信の結果を待たずに返却されている'
      - まとまりとスレッドの返信が残っている
      - 常駐サーバーのログに送信の失敗が記録され、ログに Webhook の URL が記載されていない
    test: test_error_when_send_failed
  - name: 正常シナリオ（作業の途中で commit する）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、200 を返却する）と、Claude Code のセッション（2 件のスレッドをそれぞれ記録に反映して作業の途中の `commit` を呼び、返信した後、手番を返す直前の `commit` を呼ぶ）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SRV as 常駐サーバー
        participant DC as Discord

        CC->>SRV: 1 件目を記録に反映して作業の途中の commit
        SRV-->>CC: まとめた（差分のリンク）
        CC->>SRV: 1 件目へ返信する
        CC->>SRV: 2 件目を記録に反映して作業の途中の commit
        SRV-->>CC: まとめた（差分のリンク）
        CC->>SRV: 2 件目へ返信する
        CC->>SRV: 手番を返す直前の commit
        SRV-->>CC: まとめる書き換えが無い
        SRV->>DC: 作業が終わったことを 1 件の通知で送信する
      ```
    expected:
      - エンドポイントに届いた要求が 1 件だけである
      - 書き換えのまとまりが 2 つ増えている
    test: test_normal_when_committed_during_work
  - name: 正常シナリオ（タスクが残っていて手番を返せない）
    setup:
      - name: Mock
        description: Discord の Webhook（テストごとに起動した HTTP のエンドポイントで、200 を返却する）と、Claude Code のセッション（未着手のタスクを残したまま手番を返す直前の `commit` を呼び、拒まれた後に project-index の `write_docs` でタスクを保留にして呼び直す。project-index はテストが起動する）
      - name: 常駐サーバー
        description: 正常シナリオと同じ
      - name: ワークスペース
        description: 正常シナリオと同じ。未着手のタスク T-1 を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SRV as 常駐サーバー
        participant PI as project-index の MCP
        participant DC as Discord

        CC->>SRV: 手番を返す直前に書き換えをまとめる（commit）
        SRV-->>CC: エラー（未着手の T-1）
        CC->>PI: write_docs（T-1 を保留にする）
        CC->>SRV: 手番を返す直前に書き換えをまとめる（commit）
        SRV-->>CC: まとめた
        SRV->>DC: 作業が終わったことを 1 件の通知で送信する
      ```
    expected:
      - 1 回目の `commit` がエラーになり、その時点でエンドポイントに要求が届いていない
      - 呼び直した `commit` が成功した後に、エンドポイントに届いた要求が 1 件だけである
    test: test_normal_when_hand_back_refused
refs:
  - SC-540-1#
  - IF-568-1#
  - SC-570-1#
notes:
  通知の文面: |-
    本文は次の 2 行だけにする（絵文字を使用しない）。

    ```text
    {ワークスペースの名前}: 作業が完了しました
    {プレビューの URL}
    ```

    ワークスペースの名前は `config.yaml` の題名（`summary`）で、空ならフォルダの名前にする。
  通知しない出来事: 外部の変更のまとまりの自動の commit（単一ユースケース『書き込みを履歴に残す』）と、停止の工程が依頼するまとめていない変更の commit は、MindStella のセッションが呼ぶ `commit` ではないため通知の対象にしない。応答の終了（Stop・StopFailure）と MindStella のセッションが止まったとき（SessionEnd）は通知のきっかけにしない（止まったときは単一ユースケース『止まったことを通知する』が通知する）。

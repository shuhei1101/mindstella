summary: "単一 / 複合ユースケースの業務フロー設計（E2E テストの元）"
items:
  - page: SC-489-9.yaml
    summary: "マーケットプレイスを登録してプラグイン mindstella をインストールする"
  - page: SC-489-41.yaml
    summary: "依存を確かめ、常駐サーバーが落ちていれば起動して、MindStella の API でワークスペースと MindStella のセッションを作り、そのペインへつなぐ"
  - page: SC-489-20.yaml
    summary: "Claude Code を立ち上げたときに落ちていた常駐サーバーを systemd --user で起動し、古いコードで動いていれば再起動を案内し、状態を確かめ、止める"
  - page: SC-489-14.yaml
    summary: "許可するフォルダの下に、新しいワークスペースの記録を既定の設定で作る"
  - page: SC-531-1.yaml
    summary: "外部のアプリからワークスペースと MindStella のセッションを作り、画面の URL を受け取る"
  - page: SC-531-2.yaml
    summary: "MindStella のセッションを止めて、ワークスペースをクローズにする"
  - page: SC-489-34.yaml
    summary: "検討事項・タスクなどの項目を足す・直す。複数の項目の追加・更新・取得を 1 回で行う"
  - page: SC-489-21.yaml
    summary: "検討事項の採用する案を切り替え、影響を受ける項目を洗い出す"
  - page: SC-489-26.yaml
    summary: "再開時の状況と、次に検討する項目の候補を読む"
  - page: SC-489-33.yaml
    summary: "項目を探し、1 件の中身と参照元・使っている属性名を読む"
  - page: SC-489-16.yaml
    summary: "参照切れと、YAML と本文の Markdown のずれと、設定に無いフェーズを洗い出す"
  - page: SC-489-37.yaml
    summary: "新しいワークスペースを作るか既存の続きを選ぶ"
  - page: SC-489-43.yaml
    summary: "取り込み待ちのスレッドを拾い、書き込みを記録して、返信するか返信せずにクローズにする"
  - page: SC-489-30.yaml
    summary: "発言を記録し、派生の検討事項・未整理・タスクを積む"
  - page: SC-489-8.yaml
    summary: "前提が揃った未決定を 1 ラウンドにまとめて聞き、答えを記録する"
  - page: SC-489-13.yaml
    summary: "確認を取ってサブエージェントで調べ、調査を検討事項に繋ぐ"
  - page: SC-489-22.yaml
    summary: "採用する案を切り替え、影響を要見直しにして見直しのタスクを積む"
  - page: SC-489-12.yaml
    summary: "サーバーが配るプレビューの URL を示し、記録の書き換えを開いている画面へ反映する"
  - page: SC-489-4.yaml
    summary: "ゴールに届いたかを確かめ、確定した記録をリリースの資料に書き出す"
  - page: SC-489-25.yaml
    summary: "プレビューの概要のタイルを読み、その条件の一覧を開く"
  - page: SC-489-24.yaml
    summary: "検討事項をマップで見て、枝と依存を辿る"
  - page: SC-489-6.yaml
    summary: "タスクを状態ごとの列のボードで見る"
  - page: SC-489-49.yaml
    summary: "項目を表で並べ替え・絞り込み・ピン留めする"
  - page: SC-489-40.yaml
    summary: "資料を納品物を先頭にしたカードと状態の列のボードで見て、本文を開く"
  - page: SC-489-46.yaml
    summary: "詳細パネルで項目の案・関係・本文を読む"
  - page: SC-489-48.yaml
    summary: "全体の検索で項目を探し、詳細を開く"
  - page: SC-489-7.yaml
    summary: "3D のネットワークを回し、玉を押して詳細を開き、起点の項目をロックして辿る"
  - page: SC-489-11.yaml
    summary: "記録を見るだけの 1 枚の HTML に書き出し、ネットにつながらない端末で開いて読む"
  - page: SC-489-17.yaml
    summary: "プラグインを上げた後、ワークスペースを版ごとの手順で今の版へ移し替える"
  - page: SC-489-18.yaml
    summary: "変更履歴から書き換えのまとまりを選び、足された・変わった項目の印と、本文・図・Raw・キーの変更を読む"
  - page: SC-489-36.yaml
    summary: "題名・プレイブック・フェーズ・最上位の軸の呼び名・ゴール・対象・カテゴリー・関連する場所・保持する回数・文字起こしの設定を書き換え、項目のフェーズ・対象・カテゴリーを付け替える"
  - page: SC-489-38.yaml
    summary: "書き換えのたたき台とフェーズの対応を確かめ、話し合いの設定を書き換える"
  - page: SC-489-44.yaml
    summary: "詳細パネルで本文の文章か値を選び、その箇所を指すコメントを溜める"
  - page: SC-489-3.yaml
    summary: "レビュー中を確かめる画面で、溜めた新しいスレッドと返信を見直し、チェックしたものだけをまとめて送る"
  - page: SC-489-47.yaml
    summary: "詳細パネルから、項目へのコメントを書いてレビュー中に溜める"
  - page: SC-489-45.yaml
    summary: "コメント・返信の入力のマイクのボタンで録音し、文字起こしの結果をその書き込みだけで送信するか入力欄へ挿入する"
  - page: SC-489-31.yaml
    summary: "見た目と表示する種類を自分の端末だけで変え、既定に戻す"
  - page: SC-489-15.yaml
    summary: "選んだ見た目と表示する種類を、確かめてからワークスペースの既定として保存する"
  - page: SC-489-35.yaml
    summary: "手で直した config.yaml を再読み込みし、検査に通らなければ前の設定のまま違う箇所を返す"
  - page: SC-489-23.yaml
    summary: "検討事項の案を記号で指して足す・直す・消す"
  - page: SC-489-19.yaml
    summary: "AI が前回読んだ時点より後に足した・変えた・消した項目を読む"
  - page: SC-489-2.yaml
    summary: "話し合いの始めとプレビューの配り始めに、直下の README を起動・接続・スキル・プレビューの一覧に書き直す"
  - page: SC-489-10.yaml
    summary: "ポートの固定・許可するホスト名・起動と終了のフックを設定し、外の入口の内側で開いたプレビューで記録を読み、コメントを送る"
  - page: SC-489-32.yaml
    summary: "やめた項目を取り下げ、誤って足した・重複した項目を消す"
  - page: SC-489-42.yaml
    summary: "起動スクリプトを呼ぶ alias と環境変数を、シェルの設定に登録する"
  - page: SC-489-5.yaml
    summary: "スレッドの一覧でスレッドを開き、読んで返信をレビューに追加し、済んだら理由を添えてクローズにする"
  - page: SC-489-1.yaml
    summary: "ワークスペースの外へ書き込む前の確認や知らせを、スレッドを立てて利用者に返事を求める"
  - page: SC-489-28.yaml
    summary: "項目と設定を画面で書き換えて保存待ちに溜め、1 件ずつ取り消し、まとめて保存する"
  - page: SC-489-29.yaml
    summary: "種類ごとの画面から項目を足す編集を溜め、まとめて保存する"
  - page: SC-489-27.yaml
    summary: "詳細から項目を消す編集を溜め、まとめて保存する。指されている項目は消せない"
  - page: SC-489-39.yaml
    summary: "開いた資料 1 件を、Markdown か共通のスタイルと用語のツールチップを中に持つ 1 枚の HTML で書き出す"
  - page: SC-489-52.yaml
    summary: "セットアップから発言の取り込み・ヒアリング・リサーチ・方針転換を重ね、ゴール判定でリリースするまで"
  - page: SC-489-50.yaml
    summary: "プレビューを開き、概要から項目を探して詳細とネットワークを読む"
  - page: SC-489-51.yaml
    summary: "同じワークスペースを見る 2 人が表示の設定を各自で変え、既定の保存だけが上書きを持たない項目に効く"

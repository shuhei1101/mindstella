notes:
  契機ごとの会話とアカウント: |-
    | 契機 | 会話 | アカウント |
    | --- | --- | --- |
    | 利用上限 | 前の会話を引き継ぐ（`--resume`） | 利用上限に達したアカウントは claude-balancer の貸与の判定で除外される |
    | しきい値 | 前の会話を引き継ぐ（`--resume`） | しきい値以上のアカウントは claude-balancer の貸与の判定で除外される。切り替え先のアカウントが無ければ再起動しない |
    | 圧縮 | 新規の会話 | 指定しない |
    | 落ちた・無操作の上限で止めた後のコメント | 前の会話を引き継ぐ | `--resume` で claude-balancer が前回のアカウントを優先する |
    | 再起動の依頼 | 前の会話を引き継ぐ | `--resume` で claude-balancer が前回のアカウントを優先する |

    アカウントを指定して起動した MindStella のセッションは、どの契機でも指定したアカウントを `--account` で借りる。ただし、利用上限・しきい値の契機では、mindstella のホームの設定の指定の解除がオン（既定）なら指定を解除して上の表のとおりに借り、以降はアカウントを指定しない MindStella のセッションとして扱う。指定の解除がオフなら、しきい値では再起動せず、利用上限では止めたまま再起動しない。
    それ以外の契機で、指定したアカウントがしきい値以上か利用上限で `exec --account` が借りられず `125` で終わったときは、指定の解除がオンなら指定を解除してアカウントを指定せずに 1 回だけ再度借りること、オフなら落ちた状態と理由を記録する。
  再起動しないとき: クローズ待ち（API で停止を受けた）とクローズの後は、コメントが届いても再起動しない（単一ユースケース『MindStella のセッションを止めてワークスペースをクローズにする』）。
  利用上限の通知: 利用上限の到達の claude-balancer への通知は、子プロセスが利用上限で終わったときに `claude-balancer exec` が自分で行う。常駐サーバーは `exec` が終わるのを待ってから再起動し、`report-limit` を呼ばない。
  画面の表示: '再起動している間と失敗の理由を画面に出すことは、この単一ユースケースの範囲の外（PR #582 の確認ログで別の Issue にすると決定）。'

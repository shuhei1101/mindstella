id: SC-489-1
title: "AIがスレッドを立てる"
scenarios:
  - name: 正常シナリオ（検討事項と回答の通知）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、コメントの取り込みの最後の工程が連ねる新しいスレッドの作成・オープンのスレッドの一覧・前の回の通知のスレッドのクローズを、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: この回に追加した未決定の検討事項 D-2（案 A・B、推奨 A）と、この回に採用した検討事項 D-1（案 B を採用）と、前の回に作成したオープンの通知のスレッド TH-1 を持つ
        notes: 通知の本文は、追加した検討事項の表（ID・質問・推奨）と反映した回答の表（ID・反映した内容）。2 件とも利用者に回答を求める文を含まない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant WS as ワークスペース

        CC->>SV: 新しいスレッドを作成する（追加した検討事項と反映した回答の表・タグ・要約）
        SV->>WS: オープンのスレッドを書く
        SV-->>CC: 作成したスレッド
        CC->>SV: オープンのスレッドの一覧
        SV-->>CC: TH-1 と作成したスレッド
        CC->>SV: 前の回の通知のスレッド TH-1 をクローズにする（理由つき）
        SV->>WS: 状態をクローズに書き、書き手（AI）・理由・日時を残す
      ```
    expected:
      - オープンの通知のスレッドが 1 件あり、最初の書き込みが AI の通知で、D-2 の ID・質問・推奨 A の行と、D-1 の ID・採用した案 B の行を表で持つ
      - 通知の本文が利用者に回答を求める文を含まない
      - 前の回の通知のスレッド TH-1 がクローズで、作成した通知のスレッドはオープンである
      - 取り込み待ちのスレッドの一覧が 0 件を返す
      - 最初の書き込みが利用者の未読である
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_notify_decisions
  - name: 正常シナリオ（開いている画面に出る）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開いた後に、通知のスレッドを作成するツールを決めた引数で呼ぶ。描画のライブラリは CDN から読む
      - name: 作成済みのワークスペース
        description: スレッドを持たない
      - name: 開いている画面
        description: コメントの一覧（左のパネル）のスレッドの一覧
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as MindStella の MCP
        participant CC as MindStella のセッション

        CC->>SV: 通知のスレッドを作成する
        SV-->>P: 書き換えの知らせ
        P->>SV: 記録を読み直す
        P-->>U: スレッドの一覧に AI のスレッドの行を足す
      ```
    expected:
      - 画面を開き直さずに、スレッドの一覧に AI が作成した通知のスレッドの行が出る
      - オープンだけの一覧の件数が 1 になる
      - 足した行とトップバーのコメントのボタンに未読の印が出る
    test: test_normal_when_shown_on_open_screen
  - name: 異常シナリオ（本文が空）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、スレッドを作成するツールを空の本文で呼ぶ
      - name: 作成済みのワークスペース
        description: 前の回に作成したオープンの通知のスレッド TH-1 だけを持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP

        CC->>SV: スレッドを作成する（本文が空）
        SV-->>CC: エラー（本文が空）
        CC->>CC: 前の回の通知のスレッドをクローズにしない
      ```
    expected:
      - ツールがエラーを返し、理由に本文が空であることがある
      - スレッドが TH-1 の 1 件のままで、TH-1 がオープンである
    test: test_error_when_body_empty
  - name: 異常シナリオ（MindStella のセッションでない）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、状態に登録していない `session_id` でスレッドを作成するツールを呼ぶ
      - name: 作成済みのワークスペース
        description: スレッドを持たず、MindStella のセッションを持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（通常のセッション）
        participant SV as MindStella の MCP

        CC->>SV: スレッドを作成する
        SV->>SV: session_id が状態の MindStella のセッションと合わない
        SV-->>CC: エラー（MindStella のセッションだけがスレッドを作成できる）
      ```
    expected:
      - ツールがエラーを返し、理由に MindStella のセッションだけがスレッドを書き込めることがある
      - スレッドが 0 件のままである
lead: 'MindStella のセッションが、コメントの取り込みの最後に、その回で追加した利用者の回答が要る検討事項と反映した回答を、新しいスレッド 1 件に表で通知する単一ユースケース。スレッドでは利用者に回答を求めず、利用者は検討事項へ回答する。'
issue: 208
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 回答が要る検討事項と、自分の回答がどう反映されたかを、画面の 1 件のスレッドで一覧できる。回答する場所は検討事項の 1 か所で、スレッドごとに返信を求められない
trigger: 'コメントの取り込みで、利用者の回答が要る検討事項を追加したか、検討事項への回答を反映した回の、全てのスレッドを取り込んだ後'
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションとして起動し、状態に `session_id` が登録されている
success_guarantee: |-
  オープンの通知のスレッドが 1 件でき、最初の書き込みが、追加した検討事項（ID・質問・推奨）と反映した回答（ID・反映した内容）を表で持ち、利用者に回答を求めない。前の回の通知のスレッドはクローズになる。最初の書き込みは利用者の未読で、プレビューのスレッドの行とトップバーのコメントのボタンに未読の印が出る。
minimal_guarantee: 通知のスレッドを作成できなかったときも、追加した検討事項と反映した回答は記録に残り、前の回の通知のスレッドはクローズにしない。ターミナルでは聞かない。
frequency: 利用者の回答が要る検討事項を追加したか、検討事項への回答を反映した取り込みのたびに 1 回
priority: 中
notes:
  スレッドで聞く場面とターミナルで聞く場面: スレッドで聞くのは、利用者に返事を求める全ての質問と知らせ（ヒアリングの質問・方針転換の確認・リサーチを始めてよいか・範囲の見直しのたたき台の確認・ゴール判定の確定・記録を消してよいか・配る書き出しの書き出す先・ワークスペースの外へ書き込む前の確認 など）。既にある検討事項で決めること（ヒアリングの質問・方針転換の確認）は、その検討事項に案と推奨を記録してからその検討事項を向けて立てる。長いたたき台（範囲の見直し）は資料に起こしてその資料を向けて立てる。それ以外（リサーチを始めてよいか・ゴール判定の確定・記録を消してよいか・書き出す先 など）は、検討事項を作らずにスレッドだけで聞く。ターミナルで聞くのは、スレッドを立てられなかったときだけ。返事を待つ間も返事に左右されない取り込み・記録を続け、返事は単一ユースケース『送信の取り込み』で拾う
  E2E の範囲: モデルを呼ばず、エージェントフローの工程が連ねるツールの呼び出しを再生する。何を検討事項にするかというモデルの判断と、ワークスペースの外への書き込み（Issue の起票）は確かめない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
  利用者に聞くこと: AI が利用者に聞くこと（質問・確認・未決定の点・AI の解釈の確認・ワークスペースの外へ書き込む前の合意・項目の削除の合意）は、単一ユースケース『記録の使い分け』で検討事項にし、この通知で知らせる。スレッドでもターミナルでも聞かない。回答が届くまで、その検討事項の先の作業（ワークスペースの外への書き込みを含む）をしない
test_file: tests/e2e/単一ユースケース/test_thread_ai_ask.py

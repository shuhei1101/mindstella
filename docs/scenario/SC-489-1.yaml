id: SC-489-1
title: "AIがスレッドを立てる"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねるスレッドを立てるツールの呼び出しを、決めた引数で再生する
        notes: '-'
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
        notes: '-'
      - name: 作成済みのワークスペース
        description: 未決定の検討事項 D-1 を持ち、スレッドを持たない
        notes: 立てるスレッドの本文は `D-1 の比べた結果を Issue に起票してよいですか`、タグは `起票`、要約は `D-1 の比べた結果を Issue に起票してよいかの確認。返事待ち`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>CC: D-1 の比べた結果を Issue に起票する前の確認に当たる
        CC->>SV: スレッドを立てる（本文・タグ・要約）
        SV->>WS: オープンのスレッドを書く
        SV-->>CC: 立てたスレッド
        CC->>CC: 起票せずに話し合いを続ける
      ```
    expected:
      - オープンのスレッドが 1 件あり、最初の書き込みが AI の `D-1 の比べた結果を Issue に起票してよいですか` である
      - スレッドがタグ `起票` と、本文と分けた要約を持つ
      - 取り込み待ちのスレッドの一覧が 0 件を返す
      - '`check` が問題を 0 件で返す'
      - 最初の書き込みが利用者の未読である
    test: test_normal
  - name: 正常シナリオ（開いている画面に出る）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開いた後に、スレッドを立てるツールを決めた引数で呼ぶ。描画のライブラリは CDN から読む
      - name: 作成済みのワークスペース
        description: スレッドを持たない
      - name: 開いている画面
        description: コメントの一覧（左のパネル）のスレッドの一覧
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant CC as Claude Code（session）

        CC->>SV: スレッドを立てる
        SV-->>P: 書き換えの知らせ
        P->>SV: 記録を読み直す
        P-->>U: スレッドの一覧に AI のスレッドの行を足す
      ```
    expected:
      - 画面を開き直さずに、スレッドの一覧に AI が立てたスレッドの行が出る
      - オープンだけの一覧の件数が 1 になる
      - 足した行とトップバーのコメントのボタンに未読の印が出る
    test: test_normal_when_shown_on_open_screen
  - name: 異常シナリオ（本文が空）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、スレッドを立てるツールを空の本文で呼ぶ
      - name: 作成済みのワークスペース
        description: スレッドを持たない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー

        CC->>SV: スレッドを立てる（本文が空）
        SV-->>CC: エラー（本文が空）
        CC->>CC: 同じことをターミナルで聞く
      ```
    expected:
      - ツールがエラーを返し、理由に本文が空であることがある
      - スレッドが 0 件のままである
    test: test_error_when_body_empty
  - name: 正常シナリオ（検討事項を向けて聞く）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる `edit_option`（推奨の印）・スレッドを立てるツールの呼び出しを、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持ち推奨の印を持たない未決定の検討事項 D-1 を持ち、スレッドを持たない
        notes: 立てるスレッドは D-1 を向け、本文は質問の書式で D-1 の案 A・B の表と推奨 A を書く。タグは記録の話題のタグ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>CC: D-1 を利用者に決めてもらう
        CC->>SV: edit_option（D-1 の案 A に推奨の印を立てる）
        CC->>SV: スレッドを立てる（D-1 を向け、案の表と推奨を書いた本文・タグ・要約）
        SV->>WS: D-1 を向けたオープンのスレッドを書く
        SV-->>CC: 立てたスレッド
        CC->>CC: ターミナルには書かず、回答に左右されない取り込みを続ける
      ```
    expected:
      - オープンのスレッドが 1 件あり、向けた項目が D-1 で、最初の書き込みが D-1 の案 A・B と推奨 A を持つ
      - D-1 の推奨の印が案 A にある
      - 最初の書き込みが利用者の未読である
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_targeting_decision
lead: '`session` が、利用者に返事を求める質問と知らせを、ターミナルに書かずにスレッドを立てて利用者に返事を求める単一ユースケース。既にある検討事項で決めることはその検討事項を、長いたたき台は資料を向けて立てる。'
issue: 208
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 話の流れを切らずに AI からの確認をプレビューで受け、手の空いたときに返事できる
trigger: '`session` の手順が、利用者に返事を求める質問か知らせに当たる'
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: |-
  オープンのスレッドが 1 件でき、最初の書き込みが AI の問いで、要約とタグを持つ。利用者の返事を待つスレッドで、取り込み待ちには出ない。返事が届くまで、その質問の先の作業（ワークスペースの外への書き込みを含む）をしない。
  最初の書き込みは利用者の未読で、プレビューのスレッドの行とトップバーのコメントのボタンに未読の印が出る。
minimal_guarantee: スレッドを立てられなかったときは、その質問の先の作業をせず、同じことをターミナルで聞く。
frequency: 利用者に返事を求める質問か知らせがあるたびに 1 回
priority: 中
notes:
  スレッドで聞く場面とターミナルで聞く場面: スレッドで聞くのは、利用者に返事を求める全ての質問と知らせ（ヒアリングの質問・方針転換の確認・リサーチを始めてよいか・範囲の見直しのたたき台の確認・ゴール判定の確定・記録を消してよいか・配る書き出しの書き出す先・ワークスペースの外へ書き込む前の確認 など）。既にある検討事項で決めること（ヒアリングの質問・方針転換の確認）は、その検討事項に案と推奨を記録してからその検討事項を向けて立てる。長いたたき台（範囲の見直し）は資料に起こしてその資料を向けて立てる。それ以外（リサーチを始めてよいか・ゴール判定の確定・記録を消してよいか・書き出す先 など）は、検討事項を作らずにスレッドだけで聞く。ターミナルで聞くのは、スレッドを立てられなかったときだけ。返事を待つ間も返事に左右されない取り込み・記録を続け、返事は単一ユースケース『送信の取り込み』で拾う
  E2E の範囲: モデルを呼ばず、手順が連ねるツールの呼び出しを再生する。どの場面をスレッドで聞くかというモデルの判断と、ワークスペースの外への書き込み（Issue の起票）は確かめない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
test_file: tests/e2e/単一ユースケース/test_thread_ai_ask.py

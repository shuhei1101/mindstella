id: SC-489-1
title: "AIがスレッドの作成"
scenarios:
  - name: 正常シナリオ（検討事項と回答の通知）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、コメントの取り込みの最後の工程が連ねる新規スレッドの作成・オープンのスレッドの一覧・前の回の報告のスレッドのクローズを、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: この回に追加した未決定の検討事項 D-2（案 A・B、推奨 A）と、この回に採用した検討事項 D-1（案 B を採用）と、この回に AI が決めた検討事項 D-3（案 A を採用して決定済み）と、この回に追加した進行中のタスク T-1 と、前の回に作成したオープンの報告のスレッド TH-1 を持つ
        notes: 通知の本文は、追加した検討事項の表（ID・質問・推奨）と AI が決めた検討事項の表（ID・質問・採用した案）と反映した回答の表（ID・反映した内容）と追加・着手したタスクの表（ID・タイトル・状態）。4 件とも利用者に回答を求める文を含まない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP
        participant WS as ワークスペース

        CC->>SV: 新規スレッドを作成する（追加した検討事項と反映した回答の表・タグ・要約）
        SV->>WS: オープンのスレッドを書く
        SV-->>CC: 作成したスレッド
        CC->>SV: オープンのスレッドの一覧
        SV-->>CC: TH-1 と作成したスレッド
        CC->>SV: 前の回の報告のスレッド TH-1 をクローズにする（理由つき）
        SV->>WS: 状態をクローズに書き、書き手（AI）・理由・日時を残す
      ```
    expected:
      - オープンの報告のスレッドが 1 件あり、最初の書き込みが AI の通知で、D-2 の ID・質問・推奨 A の行と、AI が決めた D-3 の ID・質問・採用した案 A の行と、D-1 の ID・採用した案 B の行と、T-1 の ID・タイトル・状態 `進行中` の行を表で持つ
      - 通知の本文が利用者に回答を求める文を含まない
      - 前の回の報告のスレッド TH-1 がクローズで、作成した報告のスレッドはオープンである
      - 取り込み待ちのスレッドの一覧が 0 件を返す
      - 最初の書き込みが利用者の未読である
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_notify_decisions
  - name: 正常シナリオ（開いている画面に出る）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開いた後に、報告のスレッドを作成するツールを決めた引数で呼ぶ。描画のライブラリは CDN から読む
      - name: 作成済みのワークスペース
        description: スレッドを持たない
      - name: 開いている画面
        description: コメントの一覧（左のパネル）のスレッドの一覧
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as MindStella の MCP
        participant CC as MindStella のセッション

        CC->>SV: 報告のスレッドを作成する
        SV-->>P: 書き換えの通知
        P->>SV: 記録を再読み込みする
        P-->>U: スレッドの一覧に AI のスレッドの行を追加する
      ```
    expected:
      - 画面を再度開かずに、スレッドの一覧に AI が作成した報告のスレッドの行が出る
      - オープンだけの一覧の件数が 1 になる
      - 追加した行とトップバーのコメントのボタンに未読のマーカーが出る
    test: test_normal_when_shown_on_open_screen
  - name: 異常シナリオ（本文が空）
    setup:
      - name: Mock
        description: モデルを呼ばない。MindStella の MCP サーバーを立て、スレッドを作成するツールを空の本文で呼ぶ
      - name: 作成済みのワークスペース
        description: 前の回に作成したオープンの報告のスレッド TH-1 だけを持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as MindStella のセッション
        participant SV as MindStella の MCP

        CC->>SV: スレッドを作成する（本文が空）
        SV-->>CC: エラー（本文が空）
        CC->>CC: 前の回の報告のスレッドをクローズにしない
      ```
    expected:
      - ツールがエラーを返し、理由に本文が空であることがある
      - スレッドが TH-1 の 1 件のままで、TH-1 がオープンである
    test: test_error_when_body_empty
  - name: 異常シナリオ（MindStella のセッションでない）
    setup:
      - name: Mock
        description: モデルを呼ばない。MCP サーバーを立て、状態に登録していない `session_id` でスレッドを作成するツールを呼ぶ
      - name: 作成済みのワークスペース
        description: スレッドを持たず、MindStella のセッションを持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（通常のセッション）
        participant SV as MindStella の MCP

        CC->>SV: スレッドを作成する
        SV->>SV: session_id が状態の MindStella のセッションと合わない
        SV-->>CC: エラー（MindStella のセッションだけがスレッドを作成できる）
      ```
    expected:
      - ツールがエラーを返し、理由に MindStella のセッションだけがスレッドを書き込めることがある
      - スレッドが 0 件のままである
lead: 'MindStella のセッションが、コメントの取り込みの最後に、会話ログのほかに記録を追加・変更した回に、その回の報告を新規の報告のスレッド 1 件に表で記載する単一ユースケース。スレッドでは利用者に返信を求めず、利用者は検討事項へ回答する。'
issue: 208
primary_actor: MindStella のセッション
stakeholders:
  - name: 利用者
    interest: 回答が要る検討事項と、自分の回答がどう反映されたかを、画面の 1 件のスレッドで一覧できる。回答する場所は検討事項の 1 か所で、スレッドごとに返信を求められない
trigger: 'コメントの取り込みで、会話ログのほかに記録を追加・変更した回の、全てのスレッドを取り込んだ後'
preconditions:
  - ワークスペースが作成済みである
  - MindStella のセッションとして起動し、状態に `session_id` が登録されている
success_guarantee: |-
  オープンの報告のスレッドが 1 件でき、最初の書き込みが、単一ユースケース『コメントの取り込み』の補足「報告のスレッド」の報告を表で持ち、利用者に回答を求めない。前の回の報告のスレッドはクローズになる。最初の書き込みは利用者の未読で、プレビューのスレッドの行とトップバーのコメントのボタンに未読のマーカーが出る。
minimal_guarantee: 報告のスレッドを作成できなかったときも、追加した検討事項と反映した回答は記録に残り、前の回の報告のスレッドはクローズにしない。ターミナルでは聞かない。
frequency: 会話ログのほかに記録を追加・変更した取り込みのたびに 1 回
priority: 中
notes:
  E2E の範囲: モデルを呼ばず、エージェントフローの工程が連ねるツールの呼び出しを再生する。何を検討事項にするかというモデルの判断と、ワークスペースの外への書き込み（Issue の起票）は確かめない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を追加する
  利用者に聞くこと: AI が利用者に聞くことは、単一ユースケース『記録の使い分け』の補足「利用者に聞くこと」のとおり、方針も含めて全て検討事項に挙げ、この報告で知らせる。報告のスレッドを作成する条件と記載する中身は、単一ユースケース『コメントの取り込み』の補足「報告のスレッド」に従う。ターミナルでは聞かない
test_file: tests/e2e/単一ユースケース/test_thread_ai_notify.py

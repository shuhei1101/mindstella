id: LIB-644-2
title: rollup-plugin-license
kind: ライブラリ
version:
  current: 3.7.2
  latest: 3.7.2
  checked_on: '2026-11-21'
  source: package.json
  pinning: 3.7.2 に固定する（`^` を付けない）
catalogs:
  - name: 使うもの
    version: 3.7.2
    entries:
      - name: license({ thirdParty })
        kind: Vite（Rollup 互換）のプラグイン
        purpose: 書き出し用のビルド（vite.export.config.ts）で、ビルドに入った依存ごとの名前・バージョン・ライセンスの本文を plugins/mindstella/skills/mindmap/preview/licenses/frontend-licenses.txt に書く
lead: ビルドに入った依存のライセンスの一覧を書き出す Rollup のプラグイン。
purl: pkg:npm/rollup-plugin-license
dependency_scope: 開発のみ
adoption: 採用
used_in:
  - vite.export.config.ts
upstream: mjeanroy/rollup-plugin-license
verification:
  state: 未確認
  detail: Vite 8 の Rolldown のビルドで `thirdParty.output` が書かれるかは未確認（peerDependencies は rollup ^4）。実装の工程で書き出し用のビルドを流して確かめる
license: MIT（開発用だけで配る物に入らない）
official_url: https://github.com/mjeanroy/rollup-plugin-license
docs_url: https://github.com/mjeanroy/rollup-plugin-license#readme
install: '```bash

  npm install --save-dev --save-exact rollup-plugin-license@3.7.2

  ```'
limitations:
  - item: Rolldown との互換
    content: Rollup のプラグインの API で動くため、Rolldown が対応しないフックに依ると一覧が書かれない。書かれないときは、依存の `package.json` と LICENSE を node_modules から集めるスクリプトに替える

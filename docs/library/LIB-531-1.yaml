id: LIB-531-1
title: claude-balancer
kind: CLI
version:
  current: 端末に入っているもの（バージョンの文字列を出さない）
  checked_on: '2026-11-15'
  pinning: バージョンは固定しない。セッションの管理は `PATH` の `claude-balancer` を使い、無ければ claude-balancer を通さずに起動する
catalogs:
  - name: コマンド
    version: 2026-11-15 に端末で確かめた引数
    entries:
      - name: claude-balancer exec --client {名前} -- {コマンド}
        kind: コマンド
        purpose: 一番空いているアカウントを借り、そのアカウントでコマンド（`claude`）を実行する。子プロセスが終わるとアカウントを返し、子プロセスの終了コードで終わる。借りられない・`--client` が `clients` に無い・バックエンドへつながらないときは子プロセスを起動せず、理由を標準エラーに書いて 125 で終わる。コマンドが見つからなければ 127。セッションの管理が `--client mindstella` で MindStella のセッションを起動する
      - name: claude-balancer exec --client {名前} --account {アカウント} -- {コマンド}
        kind: コマンド
        purpose: 指定したアカウント（claude-balancer の設定のアカウント名か、設定のフォルダのパス。`~` を展開した絶対パスで照合する）だけを借りてコマンドを実行する。貸せない・設定に無いときはほかのアカウントに切り替えず、子プロセスを起動せずに理由を標準エラーに出力して 125 で終わる。既定の設定のフォルダ（`~/.claude`）のアカウントを貸すときは、子プロセスの環境変数から `CLAUDE_CONFIG_DIR` を除外して起動する。セッションの管理が、アカウントを指定した MindStella のセッションを起動する
      - name: claude-balancer exec --client {名前} -- claude --resume {会話の ID}
        kind: コマンド
        purpose: 会話の再開とみなし、その会話を前回実行したアカウントを優先して借りる（利用上限などで貸せなければほかのアカウント）。子プロセスが終わった後、会話の記録の最も新しい assistant の記録の `error` が `rate_limit` なら、返却の前に利用上限の到達を自分で通知する。各アカウントの設定のフォルダの `projects/` が共通の置き場へのリンクなので、別のアカウントでも同じ会話を再開できる。セッションの管理が MindStella のセッションを再起動する
  - name: 常駐の API と子プロセスの環境変数
    version: 2026-11-19 に claude-balancer の develop の設計書とこの端末で確かめた入出力
    entries:
      - name: GET {CLAUDE_BALANCER_URL}/accounts
        kind: API
        purpose: アカウントごとの `account`（アカウント名）・`fiveHour`・`sevenDay` の消費率・`unavailableReason`（貸せない理由。しきい値以上は `five_hour_over_threshold`・`seven_day_over_threshold`）を返す（claude-balancer の『アカウント一覧の取得』）。『利用枠の見回り』が、使用中のアカウントがしきい値以上かと切り替え先があるかを確かめる
      - name: OTEL_RESOURCE_ATTRIBUTES の claude_balancer.account
        kind: 環境変数
        purpose: '`exec` が子プロセスの `OTEL_RESOURCE_ATTRIBUTES` に `claude_balancer.client`・`claude_balancer.account`・`claude_balancer.lease_id` を追加する（claude-balancer の『借りて実行』）。『MindStella のセッションのフック』が SessionStart で `claude_balancer.account` を読み、借りたアカウント名を状態に入れる'
lead: 複数の Claude Code のアカウントから空いているものを貸し、そのアカウントでコマンドを実行する CLI。
supplier: shuhei1101
dependency_scope: 任意
adoption: 採用
used_in:
  - plugins/mindstella/skills/mindmap/scripts/server.py
upstream: shuhei1101/claude-balancer
verification:
  state: 済
  detail: 'claude-balancer の develop の設計書『借りて実行』（IF-275-21）で終了コードを確かめ、この端末の `claude-balancer exec --help` で引数を確かめた。この端末の `clients` は `ai-monitor`・`user`・`small-worker`・`aituber`・`ai-monitor-e2e` で、`mindstella` は無い。`--client user` で `exec -- claude` を tmux のペインの中で起動し、SessionStart のフックまでの時間を測った（非機能要件『MindStella のセッションの準備を待つ上限』）。`clients` に無い `--client mindstella` で `claude-balancer exec -- true` を流し、子プロセスを起動せずに「知らないクライアントです: mindstella」を標準エラーに出して終了コード 125 で終わることを確かめた（2026-11-15）。この端末の常駐の `GET http://127.0.0.1:8770/accounts` が `accounts[].account`・`accounts[].unavailableReason`（`five_hour_over_threshold`・`seven_day_over_threshold`・`quota_unknown`・`null`）を返すことと、`exec` で起動した Claude Code のプロセスの `OTEL_RESOURCE_ATTRIBUTES` が `claude_balancer.account=`・`claude_balancer.client=`・`claude_balancer.lease_id=` を持つことを確かめた（2026-11-19）'
  date: '2026-11-19'
limitations:
  - item: 利用の上限
    content: '全てのアカウントが利用の上限に達していると、`exec` はエラーで終わる。セッションの管理は 503（`stage: account`）を返す'
  - item: 無い端末
    content: '`PATH` に無い端末では、利用者の既定のアカウントで起動する（D-292）'
  - item: クライアント
    content: '`--client` は claude-balancer の設定の `clients` にある名前だけを受ける。MindStella を使う端末では `clients` に `mindstella` を追加し、claude-balancer を再起動する'
  - item: アカウントの指定
    content: '`exec --account` は shuhei1101/claude-balancer#346（develop の 353d665a）で入った。それより前の claude-balancer は `--account` を知らない引数として使い方の誤りにし、子プロセスを起動せずに 125 で終わる。そのためアカウントを指定した起動は 503（`stage: account`）になり、`detail` に `unrecognized arguments` の行が入る'
  - item: 貸せない理由の貸与の種類
    content: '`GET /accounts` の `unavailableReason` は `kind: short` の貸与で判定した値で、`exec` が借りる `kind: long` の 5 時間枠のしきい値はより厳しい。`null` のアカウントがあっても `exec` が借りられず `125` で終わることがある'
docs_url: https://github.com/shuhei1101/claude-balancer/tree/develop/docs/interface

  state: 済
  date: '2026-11-04'
  detail: Vitest と Storybook の概要の画面が、同じ handler（testing/msw/handlers.ts）の記録で描かれることを確かめた
license: MIT（開発用だけで配る物に入らない）
official_url: https://mswjs.io/
docs_url: https://mswjs.io/docs/api/setup-server
install: '```bash

  npm install --save-dev --save-exact msw@3.0.3


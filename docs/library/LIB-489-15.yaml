  latest: 3.0.3
  checked_on: '2026-11-04'
  source: package.json
  pinning: 3.0.3 に固定する（`^` を付けない）
catalogs:
  - name: 使うもの
    version: 3.0.3
    entries:
      - name: setupServer（msw/node）
        kind: 関数
        purpose: Vitest の要求を handler で返す
      - name: setupWorker（msw/browser）
        kind: 関数
        purpose: Storybook の要求を handler で返す（.storybook-react/public/mockServiceWorker.js）
      - name: onUnhandledFrame
        kind: 設定
        purpose: handler の無い要求の扱い（Vitest は error、Storybook は bypass）
lead: Service Worker（ブラウザ）と要求の横取り（Node）で、API の応答を差し替える。

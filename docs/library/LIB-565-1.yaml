id: LIB-565-1
title: Jinja2
kind: ライブラリ
lead: Python のテンプレートエンジン。変数・分岐・繰り返しを書いた文字列を、渡した値で描く。
purl: pkg:pypi/Jinja2
dependency_scope: 必須
adoption: 採用
used_in:
  - plugins/mindstella/skills/mindmap/scripts/resume.py
upstream: pallets/jinja
verification:
  state: 済
  date: '2026-11-18'
  detail: 3.1.6 で `Environment(undefined=StrictUndefined, autoescape=False, keep_trailing_newline=True)` の `from_string(...).render(...)` と `compile_expression` を動かした。日本語と `<` はそのまま出力され、定義していない変数は本文でも式でも `jinja2.UndefinedError` になった
version:
  current: 3.1 以上（確かめたのは 3.1.6）
  latest: 3.1.6
  checked_on: '2026-11-18'
  pinning: 下限だけを決める。`check-env` が下限を確かめる
license: BSD-3-Clause（商用利用可）
official_url: https://palletsprojects.com/projects/jinja/
docs_url: https://jinja.palletsprojects.com/en/stable/api/
install: |-
  ```bash
  ~/.mindmap/venv/bin/python -m pip install 'Jinja2>=3.1'
  ```

  スキル専用の仮想環境へ入れる。コマンドは `check-env` の `install` が返す
catalogs:
  - name: API
    version: 3.1.6
    entries:
      - name: jinja2.Environment
        kind: クラス
        purpose: 未定義の変数を誤りにし、HTML のエスケープをしない描き方を決める
        params:
          - name: undefined
            type: type[Undefined]
            required: false
            default: Undefined
            description: 未定義の変数の扱い。`StrictUndefined` で誤りにする
          - name: autoescape
            type: bool
            required: false
            default: 'False'
            description: HTML のエスケープ
          - name: keep_trailing_newline
            type: bool
            required: false
            default: 'False'
            description: 本文の末尾の改行を残すか
      - name: Environment.from_string
        kind: 関数
        purpose: 文字列の本文からテンプレートを作る
      - name: Environment.compile_expression
        kind: 関数
        purpose: 部品の `when` の式を評価できる関数にする
      - name: Template.render
        kind: 関数
        purpose: 渡した値で本文を描いた文字列を返す
      - name: jinja2.StrictUndefined
        kind: クラス
        purpose: 未定義の変数を使うと `UndefinedError` にする
      - name: jinja2.TemplateError
        kind: クラス
        purpose: 描けないときの例外の親（`UndefinedError`・`TemplateSyntaxError` を含む）
limitations:
  - item: 依存
    content: MarkupSafe に依存し、`pip install` で一緒に入る

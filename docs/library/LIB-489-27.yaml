id: LIB-489-27
title: "typescript"
kind: "CLI"
version:
  current: 6.0.3
  latest: 6.0.3
  checked_on: '2026-11-04'
  source: package.json
  pinning: 6.0.3 に固定する（`^` を付けない）。型だけを使う描画のライブラリは、雛形が jsDelivr から読むバージョンと同じバージョンに固定する
catalogs:
  - name: コマンド
    version: 6.0.3
    entries:
      - name: tsc -p frontend
        kind: コマンド
        purpose: React の側の型検査（`noEmit`。書き出しは Vite が行う）
  - name: 設定
    version: 6.0.3
    entries:
      - name: strict
        kind: 設定
        purpose: 厳しい型検査（6.0 からの既定）
      - name: skipLibCheck
        kind: 設定
        purpose: React の側の型検査（`frontend/tsconfig.json`）で、依存の型（@storybook/react・vitest・@rolldown/plugin-babel など）にある誤りで止まらないようにする
      - name: types
        kind: 設定
        purpose: 自動で読む @types を空にする（6.0 からの既定）
      - name: rootDir
        kind: 設定
        purpose: 型検査の対象の置き場所（6.0 で既定が ./ に変わったため明示する）
lead: TypeScript のコンパイラ `tsc`。型検査と、`.ts` から `.js` への変換を 1 つで行う。7.0 から Go 製のネイティブバージョンになった。
purl: pkg:npm/typescript
dependency_scope: 開発のみ
adoption: 採用
used_in:
  - frontend/tsconfig.json
upstream: microsoft/TypeScript
verification:
  state: 済
  date: '2026-11-04'
  detail: '6.0.3 で `tsc -p frontend` の React の側の型検査が終了コード 0 になり、typescript-eslint の parser が 6.0.3 を読むことを確かめた（PoC 検証 #430 と #429 の実装）'
license: Apache-2.0（開発用だけで配る物に入らない）
official_url: https://www.typescriptlang.org/
docs_url: https://www.typescriptlang.org/tsconfig/
selection:
  candidates: typescript 7.0.2（tsc）・esbuild 0.28.2・SWC（@swc/core 1.16.13 + @swc/cli 0.8.1）・oxc-transform 0.152.0 を比べた（[選定の案](https://github.com/shuhei1101/mindmap/pull/21#discussion_r4170820233)）。tsgo（`@typescript/native-preview`）は 7.0 の本体に吸収済み
  decision: tsc だけにする。esbuild・SWC・Oxc は型を削除するだけで、型検査のために tsc が残る。外部規約『ビルドレス原則』が許す変換も tsc の 1 段階だけ
  consequences: React の側の型情報つきの lint（typescript-eslint。peer は `<6.1.0`）に合わせ、6.0.3 に揃える。`.js` への変換は Vite（Rolldown）が行い、tsc は型検査だけにする
install: |-
  ```bash
  npm install --save-dev --save-exact typescript@6.0.3
  npx tsc -p frontend
  ```

  `tsconfig.json` は `frontend/` に置き、`strict: true`・`noEmit: true`・`lib: ["es2022", "dom", "dom.iterable"]` を持つ。
limitations:
  - item: モジュールの扱い
    content: '`.ts` の本体に import / export を書くとモジュール扱いになり、出力の末尾に `export {};` が残る。雛形が classic script として差し込むと構文エラーになり、ほかのファイルの名前空間ともつながらない。グローバルの型の割り当ては、出力しない `.d.ts` に置く'
  - item: ファイルの連結
    content: '6.0 からは `--outFile` が使えない（`module: none` が TS6046）。生成した `.js` をつなぐのは `build` の役目'

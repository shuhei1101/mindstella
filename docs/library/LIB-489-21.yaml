id: LIB-489-21
title: "storybook"
kind: "フレームワーク"
version:
  current: 10.6.1
  latest: 10.6.1
  checked_on: '2026-11-04'
  source: package.json
  pinning: '`storybook`・`@storybook/react-vite` を 10.6.1、`vite` を 8.3.2 に固定する（`^` を付けない）'
catalogs:
  - name: コマンド
    version: 10.6.1
    entries:
      - name: npm run storybook-react / npm run build-storybook-react
        kind: コマンド
        purpose: '`-c .storybook-react` で React の部品のストーリー（`frontend/src/**/*.stories.tsx`）を開く・書き出す（`storybook-react-static/`）'
  - name: 設定（.storybook-react/）
    version: 10.6.1
    entries:
      - name: framework（@storybook/react-vite）
        kind: 設定
        purpose: ルートの vite.config.ts の Tailwind・React Compiler を使う。`viteFinal` で root と出力のフォルダを外す
      - name: preview.tsx の loaders・decorators
        kind: 設定
        purpose: MSW の worker（`public/mockServiceWorker.js`）を始め、QueryClientProvider で包む
      - name: previewHead
        kind: 設定
        purpose: '`frontend/index.html` から Google Fonts の link 要素を取り出して差し込み、ストーリーを画面と同じ文字で描く'
      - name: core.disableTelemetry
        kind: 設定
        purpose: 利用状況の送信を止める
  - name: API
    version: 10.6.1
    entries:
      - name: args
        kind: 設定
        purpose: ストーリーごとに部品の props を渡す
      - name: play
        kind: 関数
        purpose: ストーリーの中でクリックなどの操作と確かめを書く
lead: UI の部品を状態ごとのストーリーとして一覧・操作できる開発用のツール。React の framework（`@storybook/react-vite`）とビルダーの Vite を含む。
purl: pkg:npm/storybook
dependency_scope: 開発のみ
adoption: 採用
used_in:
  - .storybook-react/main.ts
upstream: storybookjs/storybook
verification:
  state: 済
  date: '2026-11-04'
  detail: PoC 検証（#430）で、storybook 10.6.1・@storybook/react-vite 10.6.1・vite 8.3.2 で React の部品のストーリーをビルドし、MSW の handler でデータを差し込んだストーリーが描けることを確かめた
license: MIT（storybook・@storybook/react-vite・vite。開発用だけで配る物に入らない）
official_url: https://storybook.js.org/
docs_url: https://storybook.js.org/docs
install: |
  ```bash
  npm install --save-dev --save-exact storybook@10.6.1 @storybook/react-vite@10.6.1 vite@8.3.2
  npm run storybook-react
  ```
limitations:
  - item: Node のバージョン
    content: vite 8.3.2 が `^20.19.0 || >=22.12.0` を求める

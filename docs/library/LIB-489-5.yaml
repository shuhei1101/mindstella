id: LIB-489-5
title: "elkjs"
kind: "CDN の JS"
version:
  current: 0.12.0
  latest: 0.12.0
  checked_on: '2026-10-02'
  source: https://cdn.jsdelivr.net/npm/elkjs@0.12.0/lib/elk.bundled.js
  pinning: 版を固定し、script 要素に integrity（`sha384-ww57TDqx4cGknIavPm0QKO+aygLUR1BLSn2Vhbnt1XdYKWcwLyWTFKX7aZMaKIi2`）と `crossorigin="anonymous"` を付ける。上げるときは integrity も書き換える
catalogs:
  - name: API
    version: 0.12.0
    entries:
      - name: ELK.layout
        kind: 関数
        purpose: 検討事項のマップ（対象 → カテゴリー → フェーズ → 検討事項の木）の節の座標と直角の枝を計算する
lead: グラフの配置を計算する Eclipse Layout Kernel（ELK）の JavaScript 版。
purl: pkg:npm/elkjs
dependency_scope: 必須
adoption: 採用
upstream: kieler/elkjs
used_in:
  - plugins/mindstella/skills/mindmap/preview/template.html
  - plugins/mindstella/skills/mindmap/scripts/builder.py
  - frontend/src/shared/adapters/libraries.ts
verification:
  state: 済
  date: '2026-10-02'
  detail: file:// で開いた HTML から jsDelivr の `lib/elk.bundled.js` を下の integrity と `crossorigin="anonymous"` 付きで読み、Chromium で `new ELK().layout` が `layered`・直角の枝（`ORTHOGONAL`）で 2 つの節の座標を返すことを確かめた
license: EPL-2.0 OR GPL-3.0-or-later から EPL-2.0 を選ぶ（商用利用可）。配る書き出しに入れるときは、版・著作権の表示（(c) Kiel University and others）・EPL-2.0 の本文を残し、ソースコードの入手先（https://github.com/kieler/elkjs と `{版}` のタグ）を表示に含める。改変しない
official_url: https://github.com/kieler/elkjs
selection:
  candidates: '配信元として jsDelivr・unpkg・raw.esm.sh・cdnjs を比べた（[選定の案](https://github.com/shuhei1101/mindmap/pull/21#discussion_r4165328069)）。ライブラリそのものは Issue #5 で決まっている'
  decision: jsDelivr から読む（marked と同じ理由。cdnjs には elkjs が無い）
install: |-
  ```html
  <script src="https://cdn.jsdelivr.net/npm/elkjs@0.12.0/lib/elk.bundled.js" integrity="sha384-ww57TDqx4cGknIavPm0QKO+aygLUR1BLSn2Vhbnt1XdYKWcwLyWTFKX7aZMaKIi2" crossorigin="anonymous"></script>
  ```

  プレビューの雛形が読む。グローバルの `ELK` に入る

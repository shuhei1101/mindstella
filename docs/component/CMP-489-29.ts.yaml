id: CMP-489-29
title: "差分のミニマップ"
implementation: "plugins/mindstella/skills/mindmap/preview/components/diff-minimap.ts#MindmapPreview.diffMinimapFrame"
story: "Preview/DiffMinimap"
states:
  - name: Kinds
    description: 追加した・削除した・変わったのマーカー。追加したは塗りつぶし、削除したは枠だけの中抜き、変わったは斜めの縞。前に無かったキーは追加した、値が変わったキーは変わった。削除した塊のすぐ後ろの追加した塊は変わった 1 つにまとめる
    args:
      - name: shown
        value: 'true'
  - name: SingleMark
    description: マーカーが 1 つ。帯を出し、マーカーの長さは最小の 12px
    args:
      - name: shown
        value: 'true'
  - name: NotScrollable
    description: 本文がスクロール領域に収まる。帯とマーカーは出し、見えている範囲の面は出さない
    args:
      - name: shown
        value: 'true'
  - name: ManyMarks
    description: マーカーが 30 か所。帯に収まるようマーカーの最小の長さを詰め（下限 4px）、重なるマーカーは後ろへずらして全て並べる
    args:
      - name: shown
        value: 'true'
  - name: Dragging
    description: 見えている範囲の面をマウスでつかんで下へ動かしている間。面を 1 段階濃くし、本文の文を選ばない
    args:
      - name: shown
        value: 'true'
  - name: NoMarks
    description: 差分の表示だが、本文に変わった箇所のマーカーが無い。帯を出さず、本文の幅は帯の無いときと同じ
    args:
      - name: shown
        value: 'true'
  - name: Hidden
    description: 差分の表示でないか、表示の設定で差分のミニマップを外した。本文の差分のマーカーがあっても帯を出さない
    args:
      - name: shown
        value: 'false'
  - name: Narrow
    description: 幅 390px。帯の太さとマーカーの押せる的は変えず、本文の幅を帯の分だけ詰める
    args:
      - name: shown
        value: 'true'
  - name: SideBySide
    description: 本文を左右に並べている。左の削除した塊と右の追加した塊が向かい合う箇所は「変わった」1 つ、片側だけの塊はその種類のマーカーを、高さの順に並べる
    args:
      - name: shown
        value: 'true'
lead: 差分の表示の間、詳細パネル・詳細の全画面の本文のスクロール領域を包み、スクロールバーの外側に縦の帯を並べる。帯には、本文の中の変わった箇所の高さに追加した・削除した・変わったを構造で分けたマーカーと、見えている範囲の面を置き、マーカー・マーカーの無い所を押すとその箇所へ、マウスで押したまま上下に動かすとスクロールバーと同じように本文を送信する。
args:
  - name: shown
    type: 真偽値
    required: true
    description: ミニマップを置くか。使う側が、差分の表示の間で、表示の設定で差分のミニマップを外していないときだけ真を渡す。偽のときは本文のスクロール領域だけを包んだ枠を返す。真でも、本文に変わった箇所のマーカーが 1 つも無いときは帯を出さない
slots:
  - name: default
    description: 詳細パネル・詳細の全画面の本文のスクロール領域（`.panel-body`）。部品はこの中の差分のマーカー（キーの差分の行・本文の追加した / 削除した塊・箇条書きの項目・表の行・図の差分の枠・Raw の追加した / 削除した行・HTML の本文の枠の中のマーカー）を文書の順に集め、中身と高さが変わるたびにマーカーを置き修正する。本文を左右に並べているときは、左右の列のマーカーを高さの順に再整列し、同じ高さで向かい合う削除した塊と追加した塊を「変わった」1 つにする
accessibility:
  - 帯は `role="toolbar"`、`aria-orientation="vertical"`、読み上げの名前「変わった箇所」。マーカーは 1 つのタブの止まりにまとめ（最後に選んだマーカーだけ `tabindex="0"`）、上下の矢印キーと Home / End でマーカーの間を移る
  - マーカーはボタンで、読み上げの名前と `title` は「{追加した箇所・削除した箇所・変わった箇所}（{順番} / {件数}）」。Enter / Space でその箇所へ送信する
  - 見えている範囲の面は `aria-hidden` にする
  - 追加した・削除した・変わったは、色だけでなく塗りつぶし・中抜き・斜めの縞の形状でも分ける
  - 'マーカーの箇所へ送信するとき、`prefers-reduced-motion: reduce` ではなめらかに送信せず、すぐにその位置にする'
  - ホバーは面の色、キーボードのフォーカスはマーカーの色の輪で見分ける
refs:
  - IF-489-71#
  - CMP-489-31#
status: implemented
notes:
  マーカーの集め方: 本文のスクロール領域の中の差分のマーカーを文書の順に集める。見えていないマーカー（畳んだ Raw の行など）と、Raw を出している図の枠は並べない（Raw を畳んだ図は枠を「変わった」にし、Raw を出した図は Raw の行を並べる）。すぐ後ろに続く同じ種類の塊・行は 1 つにまとめ、削除した塊のすぐ後ろの追加した塊は「変わった」1 つにする。キーの差分は、前に無かったキーを「追加した」、値が変わったキーを「変わった」にする。図の差分の枠は「変わった」。HTML の本文の枠の中のマーカーは、追加した行を「追加した」、変えた行を「変わった」にする
  マーカーの置き方: マーカーの上端は、本文の全体の高さに対するその箇所の位置の割合。マーカーの長さはその箇所の高さの割合で、最小は 12px。マーカーが帯に収まらないほど多いときは最小を 4px まで詰める。重なるマーカーは 2px の間を空けて後ろへずらし、帯の終わりを出たマーカーは後ろから前へ詰める。本文の高さが変わったとき（図の描き終わり・HTML の本文の枠の高さ・Raw の切り替え・パネルの幅）だけ置き修正し、本文を送信するたびには見えている範囲の面だけを動かす
  マーカーを押したとき: その箇所の上端が本文のスクロール領域の高さの 1/4 の位置に来るまで送信し、その箇所を 1.6 秒の間だけ枠で示す（HTML の本文の枠の中の箇所は示さない）。履歴に積まず、URL のハッシュも変えない
  マーカーの無い所を押したとき: 押した位置に見えている範囲の面の中央が来るまで、本文をすぐに送信する（タッチの端末も同じ）。本文が送信できない長さのときは何もしない
  ドラッグ: マウスの左ボタンで帯を押したまま上下に動かすと、スクロールバーと同じように本文を送信する。見えている範囲の面の中を押したときはつかんだ位置を保ち、面の外を押したときは面の中央を押した所に合わせる。押した位置から 5px（`PRESS_SLOP_PX`）より動かすまでは押しただけとして扱い、その後に離してもマーカーへは飛ばない。ボタンを押していない動き（帯の外で離した後）を受けたらドラッグを終える。タッチの端末ではドラッグしない。帯に乗せるとつかむ形状のポインタ（マーカーの上は押す形状）、ドラッグの間は帯の外でもつかんでいる形状

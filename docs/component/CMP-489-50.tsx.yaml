id: CMP-489-50
title: 表示の設定
implementation: frontend/src/features/settings/display-settings/components/settings-panel.tsx#SettingsPanel
story: Settings/SettingsPanel
states:
  - name: Default
    description: 開いた直後（ワークスペースの既定のまま）。「既定に戻す」と「ワークスペースの既定にする」を出さず、そのことを文言で示す
    args:
      - name: overrides
        value: '[]'
  - name: Overridden
    description: この端末で変えている。上書きを持つ 4 項目を並べて「既定に戻す」を出し、線で区切った下に「ワークスペースの既定にする」を置く
    args:
      - name: defaultKinds
        value: メモを除いた 6 種類
      - name: overrides
        value: '["表示する種類", "ライト / ダーク", "表の列（調査）", "絞り込み（タスク）"]'
  - name: SomeKindsHidden
    description: 用語集と会話ログを外した。「すべて」を途中の印にし、`5/7` を出す
    args:
      - name: visibleKinds
        value: 用語集・会話ログを除いた 5 種類
      - name: overrides
        value: '["表示する種類"]'
  - name: Saved
    description: 既定にした直後。今の選びが既定と同じになり、ボタンの代わりにそのことと保存した知らせを出す
    args:
      - name: visibleKinds
        value: 会話ログを除いた 6 種類
      - name: defaultKinds
        value: 会話ログを除いた 6 種類
      - name: overrides
        value: '["表示する種類"]'
      - name: message
        value: '{"kind": "ok", "text": "ワークスペースの既定にしました（10/05 14:20）。"}'
  - name: DefaultsArrived
    description: 他の人が保存した既定が届いた。上書きを持たない項目に新しい既定が当たり、パネルに知らせを残す
    args:
      - name: visibleKinds
        value: 会話ログを除いた 6 種類
      - name: defaultKinds
        value: 会話ログを除いた 6 種類
      - name: message
        value: '{"kind": "info", "text": "ワークスペースの既定が変わりました（10/05 14:22）。"}'
  - name: NoStorage
    description: 端末の保存領域に書けない。選んだ表示は当てるが、開いている間だけであることを先頭に出す
    args:
      - name: storageAvailable
        value: 'false'
      - name: visibleKinds
        value: 会話ログを除いた 6 種類
      - name: overrides
        value: '["表示する種類"]'
  - name: Export
    description: 配る書き出し。表示する種類は変えられ、「ワークスペースの既定にする」は出さない
    args:
      - name: canSave
        value: 'false'
      - name: visibleKinds
        value: 会話ログを除いた 6 種類
      - name: overrides
        value: '["表示する種類"]'
  - name: Narrow
    description: 幅 390px。画面の幅いっぱいに出し、行の高さと押せる的は変えない
    args:
      - name: visibleKinds
        value: メモを除いた 6 種類
      - name: overrides
        value: '["表示する種類"]'
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる
  - name: MinimapHidden
    description: 差分のミニマップだけを表示しないにした。「詳細に表示するもの」のチェックを外し、変えている項目に「差分のミニマップ」と「既定に戻す」を出す。表示する種類は既定のままなので、「ワークスペースの既定にする」の代わりに「表示する種類は、ワークスペースの既定と同じです。」を出す
    args:
      - name: minimap
        value: 'false'
      - name: overrides
        value: '["差分のミニマップ"]'
  - name: BodyDiffLayoutOverridden
    description: 詳細で本文の差分を左右に並べるを選んだ。変えている項目に「本文の差分の並べ方」と「既定に戻す」を出す。表示する種類は既定のままなので、「ワークスペースの既定にする」の代わりに「表示する種類は、ワークスペースの既定と同じです。」を出す
    args:
      - name: overrides
        value: '["本文の差分の並べ方"]'
  - name: ReviewOrderOverridden
    description: 詳細のレビュー中のコメントの並びを古い順にした。変えている項目に「コメントの並び」と「既定に戻す」を出す。表示する種類は既定のままなので、「ワークスペースの既定にする」の代わりに「表示する種類は、ワークスペースの既定と同じです。」を出す
    args:
      - name: overrides
        value: '["コメントの並び"]'
  - name: BodyViewOverridden
    description: セクションの折りたたみをオフにした。「詳細に表示するもの」のチェックを切り替え、変えている項目に「セクションの折りたたみ」と「既定に戻す」を出す。表示する種類は既定のままなので、「ワークスペースの既定にする」の代わりに「表示する種類は、ワークスペースの既定と同じです。」を出す
    args:
      - name: bodyView
        value: '{"fold": false}'
      - name: overrides
        value: '["セクションの折りたたみ"]'
  - name: FocusAfterAddCoarse
    description: タッチの端末で、「レビューに追加」の後のフォーカスが既定の自動。「自動」の下に「この端末では戻しません」を出す
    args:
      - name: pointerCoarse
        value: 'true'
  - name: FocusAfterAddOverridden
    description: 「レビューに追加」の後のフォーカスを「戻さない」にした。変えている項目に「レビューに追加した後のフォーカス」と「既定に戻す」を出す。表示する種類は既定のままなので、「ワークスペースの既定にする」の代わりに「表示する種類は、ワークスペースの既定と同じです。」を出す
    args:
      - name: focusAfterAdd
        value: none
      - name: overrides
        value: '["レビューに追加した後のフォーカス"]'
lead: トップバーの「表示の設定」で左から出すパネルの中身。表示する種類と、区画「詳細に表示するもの」の差分のミニマップとセクションの折りたたみを選ばせ、この端末で変えている項目と「既定に戻す」、線で区切った下に「ワークスペースの既定にする」を出す。差分のミニマップ・セクションの折りたたみと、詳細で選んだ本文の差分の並べ方は変えている項目・既定に戻すの対象にだけ含める。枠と開閉はコメントの一覧と同じ左のパネルを使う。
args:
  - name: visibleKinds
    type: 配列
    required: true
    choices: decisions・tasks・research・docs・terms・notes・logs の重複しない並び
    description: 今当てている表示する種類。先頭に「すべて」のチェック（一部だけのときは途中の印と `{数}/7`）、7 つの種類のチェックを並べ、概要は「常に表示」の行で出す
  - name: defaultKinds
    type: 配列
    required: true
    description: ワークスペースの既定の表示する種類（`config.yaml` の `display.visible_kinds`。無ければ全ての種類）。`visibleKinds` と比べて「ワークスペースの既定にする」を出すかを決める
  - name: counts
    type: オブジェクト
    required: true
    description: 種類の識別子 → 項目の件数。種類の行の右に出す
  - name: overrides
    type: 配列
    required: true
    description: この端末で変えている項目の名前（「表示する種類」・「ライト / ダーク」・「表の列（{種類}）」・「絞り込み（{画面}）」・「差分のミニマップ」・「セクションの折りたたみ」・「本文の差分の並べ方」・「コメントの並び」）。あるときは「この端末で変えている項目」に「・」でつないで並べ、「既定に戻す」を出す。空のときは「ワークスペースの既定のまま表示しています。」を出し、ボタンを出さない
  - name: canSave
    type: 真偽値
    required: false
    default: 'true'
    description: 「ワークスペースの既定にする」を置くか。配る書き出しでは false。true で `visibleKinds` が既定と同じときは、ボタンの代わりに「表示する種類は、ワークスペースの既定と同じです。」を出す（差分のミニマップだけを変えていても同じ）
  - name: message
    type: オブジェクト
    required: false
    default: なし（知らせを出さない）
    description: パネルの下端に残す知らせ。`kind`（ok は既定にした、info は既定が変わった）と `text`（時刻つきの文言。例「ワークスペースの既定が変わりました（10/05 14:22）。」）を持つ
  - name: storageAvailable
    type: 真偽値
    required: false
    default: 'true'
    description: 端末の保存領域に書けるか。false のとき、先頭に「この端末に保存できません。選んだ表示は、このページを開いている間だけ当たります。」を出す
  - name: minimap
    type: 真偽値
    default: 'true'
    description: 今当てている差分のミニマップの表示する・しない。表示する種類の下の区画「詳細に表示するもの」に、「差分のミニマップ」のチェックボックス 1 行で出す。ワークスペースの既定は持たず、「ワークスペースの既定にする」を出すかの比べには使わない
    status: implemented
  - name: bodyView
    type: オブジェクト
    required: false
    default: '{"fold": true}'
    description: 今当てている本文の見せ方（`fold` セクションの折りたたみの真偽値）。区画「詳細に表示するもの」の差分のミニマップの下に、チェックボックス 1 行で出す。ワークスペースの既定は持たず、「ワークスペースの既定にする」を出すかの比べには使わない
    status: planned
  - name: focusAfterAdd
    type: 列挙
    required: false
    default: auto
    choices: auto・input・none
    description: 今当てている「レビューに追加」の後のフォーカス。区画「詳細に表示するもの」の下の区画「コメントの入力」に、ラジオのグループ「レビューに追加した後のフォーカス」の「自動」「入力欄へ戻す」「戻さない」で出す。ワークスペースの既定は持たず、「ワークスペースの既定にする」を出すかの比べには使わない
    status: planned
  - name: pointerCoarse
    type: 真偽値
    required: false
    default: 'false'
    description: '端末の主な入力がタッチか（`matchMedia("(pointer: coarse)")`）。「自動」の下に、真なら「この端末では戻しません」、偽なら「この端末では入力欄へ戻します」を出す'
    status: planned
events:
  - name: 表示する種類を変える
    when: 種類のチェックか「すべて」を付け外ししたとき
    value: '`onKindsChange(kinds)`（変えた後の種類の並び）'
    description: 使う側が個人の上書きとして残し、タブの帯を描き直す。開いている画面の種類を外したときは概要へ移し、履歴は置き換える
  - name: 既定に戻す
    when: 「既定に戻す」を押したとき
    description: 使う側が個人の上書き（表示する種類・ライト / ダーク・表の列・絞り込みの条件・差分のミニマップ・セクションの折りたたみ・本文の差分の並べ方・レビュー中のコメントの並び）を全て外し、ワークスペースの既定と画面の既定の条件で描き直す。フォーカスを「ワークスペースの既定のまま表示しています。」の文に移す
    value: '`onReset()`'
  - name: ワークスペースの既定にする
    when: 「ワークスペースの既定にする」を押したとき
    description: 使う側が確かめのモーダル（部品設計『既定の保存の確かめ』）を、今の既定と今の選びで開く
    value: '`onSaveDefault()`'
  - name: 閉じる
    when: 見出しの帯の × か Esc を押したとき、グレーアウトした所を押したとき
    description: 使う側がパネルを閉じ、トップバーの表示の設定のボタンにフォーカスを戻す。履歴に積まない
    value: '`onClose()`'
  - name: 差分のミニマップを切り替える
    when: 「差分のミニマップ」のチェックを付け外ししたとき
    value: '`onMinimapChange(shown)`（切り替えた後の表示する・しない（真偽値））'
    description: 使う側が、表示しないときは個人の上書きとして残し、表示するときは上書きを外す。開いている詳細パネル・詳細の全画面をその場で描き直し、履歴には積まない
  - name: 本文の見せ方を切り替える
    when: 「セクションの折りたたみ」のチェックを付け外ししたとき
    value: '`onBodyViewChange(key, value)`（`{key, value}`。`key` は `fold`、`value` は切り替えた後の真偽値）'
    description: 使う側が、既定と違う値のときは個人の上書きとして残し、既定と同じ値のときは上書きを外す。開いている詳細パネル・詳細の全画面をその場で描き直し、履歴には積まない
  - name: 「レビューに追加」の後のフォーカスを切り替える
    when: 区画「コメントの入力」のラジオを選んだとき
    value: 選んだ値（`auto`・`input`・`none`）
    description: 使う側が、`auto` のときは個人の上書きを外し、それ以外は個人の上書き `focus_after_add` に残す。描き直す画面は無く、履歴には積まない
accessibility:
  - 表示する種類は凡例「表示する種類」の `fieldset` の中のチェックボックスにする。「すべて」の途中の状態は `indeterminate` で示す
  - 知らせは `role="status"`、端末に保存できないことは `role="alert"` で読み上げに伝える
  - 「ワークスペースの既定にする」は `aria-haspopup="dialog"` を持つ
  - ホバーは面の色、キーボードのフォーカスは印の色の輪で見分ける
  - 差分のミニマップは凡例「詳細に表示するもの」の `fieldset` の中のチェックボックスにし、読み上げの名前は「差分のミニマップ」
  - セクションの折りたたみは同じ `fieldset` の中のチェックボックスにし、読み上げの名前は「セクションの折りたたみ」
  - 「レビューに追加」の後のフォーカスは凡例「コメントの入力」の `fieldset` の中に、凡例「レビューに追加した後のフォーカス」の `fieldset` のラジオで置く。「自動」の下の今の端末での振る舞いは選択肢の名前に含め、区画の下の説明「自動は、マウスで操作する端末では入力欄へ戻し、タッチで操作する端末では戻しません。」をグループの `aria-describedby` で指す

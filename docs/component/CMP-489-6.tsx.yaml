id: CMP-489-6
title: Markdownの本文
implementation: frontend/src/shared/components/markdown-body.tsx#MarkdownBody
story: Shared/MarkdownBody
states:
  - name: MdmarkTable
    description: 8 列の表。mdmark の表の機能で描かれ、列の幅と折り返し・並べ替え・ピン止め・列の幅の変更のボタンは mdmark のまま。表が本文の幅からはみ出し、表の中だけが横にスクロールする。描いた直後はどの列も左端に留まらない（mdmark の既定。`table.pin_default` を指定しない）。画面の CSS が当てた列の幅・フェード・しま模様は無い
  - name: PinnedColumns
    description: 「名前」のピン止めのボタンを押して右へスクロールした。ID と名前の 2 列が左端に留まり、その間の状態の列は留まらない
  - name: OpaqueBackground
    description: 本文の背景は周りの面になじむ透明で、ピン止めのボタンで留めた列・表の左右の端の影を隠す覆い・ツールチップは周りの面の色（`--mdmark-color-bg-opaque`）で塗られる。横にスクロールできない側の端に影が出ない
  - name: Sections
    description: 本文で使っている上位 2 つの階層の見出しの頭に開閉の矢印を置き、開いた状態で描く。中身の無い見出しには置かない。見出しの文言は選べる
  - name: Folded
    description: 「料金」の矢印を押して畳んだ。次の同じか上の階層の見出しまでを隠し、下の階層の見出しも一緒に隠す。矢印は `aria-expanded="false"`
  - name: FoldOff
    description: 表示の設定でセクションの折りたたみをオフにした。見出しに開閉を置かない
    args:
      - name: display
        value: '{"fold": false}'
  - name: CodeBlock
    description: 言語を書いたコードブロックは mdmark のコードブロックのバー（言語の札・コピー）と行の部品（字下げの縦線・行の開閉）と色分けで描き、画面の言語の札とコピーのボタンを重ねない。長い行は折り返さず、コードブロックの中だけで横にスクロールできる。言語の札とコピーのボタンは横にスクロールしても同じ位置に残る
  - name: CodeCopied
    description: mdmark のコピーのボタンを押した直後。ボタンの見た目は mdmark のままで、クリップボードには札とボタンを含まないコードだけが入る
  - name: Callouts
    description: '`> [!NOTE]`・`[!TIP]`・`[!IMPORTANT]`・`[!WARNING]`・`[!CAUTION]` の引用は、mdmark が種類の色の薄い面と細い枠の囲み（`markdown-alert`）と見出し「補足」「ヒント」「重要」「警告」「注意」で描き、見出しの頭に種類のアイコンを追加する。マーカーの無い引用は mdmark の引用の見た目のまま'
  - name: Narrow
    description: 画面の幅 320px。表は mdmark の表のまま表の中だけで横にスクロールし、本文の区画は横にスクロールしない
  - name: InThreadPost
    description: スレッドの書き込みの本文。コードブロックは mdmark のバー・行の部品・色分けのまま描き、Alert の見出しのアイコンを当て、表は mdmark の表の機能をオフにした共通のスタイルのまま描き、セクションの開閉は当てない
    args:
      - name: tables
        value: 'false'
      - name: fold
        value: 'false'
  - name: EmbeddedHtml
    description: 本文に `<!-- html -->` の範囲（`.mdmark-html`）があり、中に表・見出し・チャート・スライダーを持つ。範囲の中の見出しには開閉を当てず、範囲の中の表・見出しは書いた HTML と mdmark の部品の見た目のまま描く。範囲の前後の見出しには今までどおり開閉を当てる
    notes:
      理由: 範囲の HTML は書き手が見た目を決めており、見出しに開閉を置くと範囲の中のつながりを切るため
  - name: TableInDiff
    description: 本文の差分の中の表。追加した行・削除した行を持ち、mdmark の表で描かれる。追加した行・削除した行の面の色と削除した行の取り消し線は、ピン止めのボタンで左端に留めた列のセルにも付き、開閉を置かない
    args:
      - name: fold
        value: 'false'
  - name: DiffRendered
    description: 差分の表示で「描いた結果」。書き換えた段落と追加した箇条書きの項目は追加の色と左の余白の `+`、削除した段落は削除の色と `−` で変更前の位置に出る。本文の区画は、記号が見える左の余白を空ける。書き換えた段落の前の文と変わった単語は出さない
    args:
      - name: base
        value: 1 つ目の段落の単語を書き換え、3 つ目の段落を削除し、箇条書きに 1 行追加する前の本文
      - name: fold
        value: 'false'
  - name: DiffSource
    description: '差分の表示で「原文の差分」。mdmark の「変更表示」のボタンとリビジョンの欄を配置せず（`diffControls: false`）、選んだ時点と今の行の差分を出し、書き換えた行の変わった単語だけが濃い色になる'
    args:
      - name: base
        value: DiffRendered と同じ
      - name: diffView
        value: source
      - name: fold
        value: 'false'
  - name: DiffUnchanged
    description: 差分の表示で、選んだ時点から変わっていない本文。色を付けずに今の本文だけを出す
    args:
      - name: base
        value: 今と同じ本文
      - name: fold
        value: 'false'
  - name: WideTableInNarrowPane
    description: 列が多く画面の幅を超える表を、最も狭めたパネルの幅で描く。表は mdmark の表の部品の中だけで横にスクロールし、本文の区画は横にスクロールせず、区画の幅を超えて描かれない
  - name: AudioEmbed
    description: 本文に `![キャプション](../files/{名前}.mp3)` で埋め込んだ音声。mdmark が描いた再生バー（`audio` の `controls`）を、入れ物の高さ・`overflow`・`line-height` で上下を切らずに全体を表示する。キャプションの位置と再生バーの高さは、mdmark だけで描いたときと同じになる
  - name: AudioEmbedNarrow
    description: 幅 390px で埋め込んだ音声。再生バーを本文の幅に収め、上下を切らず、本文の区画を横にスクロールさせない
    notes:
      見せ方: Storybook（React）の画面幅を 390px にして見せる
  - name: CodeMarkdownRaw
    description: 言語 `markdown` のコードブロック。mdmark が描いた結果で出し、バーの「Raw」を押すと元の Markdown のコードに切り替わる
    notes:
      見せ方: ストーリーの play で「Raw」を押す
  - name: CodeIndentGuides
    description: 言語 `python` の 2 階層の字下げを持つコードブロック。字下げの縦線と行の開閉のボタンがあり、キーワードが色分けされる
  - name: SectionSpacing
    description: 見出しの下に段落・表・map の図・リストを並べた本文。見出しごとに包む要素（`md-section-body`）の直下のブロック同士に、mdmark の本文と同じ間（`--mdmark-space`）が空く
  - name: ExternalLink
    description: 本文に外部の URL へのリンクと、同じオリジン・`#` で始まるリンクを持つ。外部の URL へのリンクだけが `target="_blank"` と `rel="noopener noreferrer"` を持つ
lead: Markdown の本文を mdmark の `mount` で描き、mdmark の共通のスタイルに重ねるスタイルを当てる。表は mdmark の表の機能のまま描き、コードブロックは mdmark のバー・行の部品・色分けのまま描き、GitHub の Alert の見出しのアイコンを常に当て、セクションの折りたたみを表示の設定の値で当てる。差分の表示の間は、選んだ時点の本文と比べて mdmark の差分で描く（「描いた結果」は比較元の Markdown の色分け、「原文の差分」は取り出し元の行の差分）。mdmark の印刷の機能をオンにして描く。詳細パネル・詳細の全画面・本文の差分の本文で使う。
args:
  - name: source
    type: 文字列
    required: true
    description: 描く Markdown の本文。部品が `useEffect` の中で mdmark の `mount` を呼んで描き、本文が変わったら再描画する。描いた要素（class `mdmark`）の中の見出し・コードブロック・引用に見せ方を当てる
  - name: display
    type: オブジェクト
    required: false
    default: '{"fold": true}'
    description: 表示の設定の本文の見せ方（`fold` セクションの折りたたみの真偽値）
  - name: fold
    type: 真偽値
    required: false
    default: 'true'
    description: セクションの開閉を置ける本文か。本文の差分（`base` を指定するとき）では false にし、`display.fold` が true でも開閉を置かない
  - name: tables
    type: 真偽値
    required: false
    default: 'true'
    description: mdmark の `mount` に表の機能（`features.table`）をオンで指定するか。スレッドの書き込みでは false にし、表は mdmark の共通のスタイルのまま描く
  - name: base
    type: 文字列
    required: false
    default: なし（差分を出さず、`source` だけを描く）
    description: '差分の表示で選んだ時点の本文。指定すると `diffView` に応じて mdmark の差分で描く。`rendered` は `mount` の比較元の Markdown（`baseMarkdown`）に指定し、追加・変更したブロックを追加の色、削除したブロックを削除の色で変更前の位置に出す。`source` は選んだ時点と今の 2 つだけを返却する取り出し元（`diffSource`）と `diffMode: "open"` で行の差分を出し、`diffControls: false` を指定して mdmark の「変更表示」のボタンとリビジョンの欄を配置させない（比べる時点は画面の差分の時点で選ぶ）。`base` と `source` が同じときは色を付けずに描く'
  - name: diffView
    type: 列挙
    required: false
    default: rendered
    choices: rendered・source
    description: 本文の差分の見せ方。`base` を指定したときだけ使用する。使用する側が部品設計『本文の差分の見せ方の切り替え』の選択を指定する
accessibility:
  - 表の入れ物・ピン止め・並べ替え・列の幅の変更のボタンの読み上げの名前とキーボードの操作は mdmark の表のままにし、上書きしない
  - 開閉の矢印は `button` で `aria-expanded` と `aria-controls` を持ち、読み上げの名前は「{見出し}を開閉」
  - コードブロックのバー・行の開閉のボタンの読み上げの名前とキーボードの操作は mdmark のままにし、上書きしない
  - Alert の種類は色だけでなく見出しの文言でも示す
  - 'コードブロックの `pre` は `tabindex="0"` と読み上げの名前「コード: {言語}」（言語を書かないものは「コード」）を持ち、キーボードで横にスクロールできる（フェンスのコードブロックは mdmark が付け、mdmark が付けない字下げのコードブロックには描画の関数が「コード」で付ける）'
  - 差分の色分け・行の差分の読み上げ（「追加:」「削除:」）は mdmark のままにし、上書きしない
refs:

id: CMP-489-6
title: Markdownの本文
implementation: frontend/src/shared/components/markdown-body.tsx#MarkdownBody
story: Shared/MarkdownBody
states:
  - name: MdmarkTable
    description: 8 列の表。mdmark の表の機能で描かれ、列の幅と折り返し・並べ替え・ピン止め・列の幅の変更のボタンは mdmark のまま。表が本文の幅からはみ出すため、先頭の列が左端に留まり、表の中だけが横にスクロールする。画面の CSS が当てた列の幅・フェード・しま模様は無い
  - name: PinnedColumns
    description: 「名前」のピン止めのボタンを押して右へスクロールした。ID と名前の 2 列が左端に留まり、その間の状態の列は留まらない
  - name: OpaqueBackground
    description: 本文の背景は周りの面になじむ透明で、ピン止めした列・表の左右の端の影を隠す覆い・ツールチップは周りの面の色（`--mdmark-color-bg-opaque`）で塗られる。横にスクロールできない側の端に影が出ない
  - name: Sections
    description: 本文で使っている上位 2 つの階層の見出しの頭に開閉の矢印を置き、開いた状態で描く。中身の無い見出しには置かない。見出しの文言は選べる
  - name: Folded
    description: 「料金」の矢印を押して畳んだ。次の同じか上の階層の見出しまでを隠し、下の階層の見出しも一緒に隠す。矢印は `aria-expanded="false"`
  - name: FoldOff
    description: 表示の設定でセクションの折りたたみをオフにした。見出しに開閉を置かない
    args:
      - name: display
        value: '{"fold": false}'
  - name: CodeBlock
    description: 言語を書いたコードブロックは左上に言語の札を出し、ホバーで右上にコピーのボタンを出す。言語を書かないコードブロックには札を出さない。長い行は折り返さず、コードブロックの中だけで横にスクロールできる。言語の札とコピーのボタンは横にスクロールしても同じ位置に残る
  - name: CodeCopied
    description: コピーのボタンを押した直後。ボタンがチェックのアイコンに変わり、クリップボードには札とボタンを含まないコードだけが入る
  - name: Callouts
    description: '`> [!NOTE]`・`[!TIP]`・`[!IMPORTANT]`・`[!WARNING]`・`[!CAUTION]` の引用は、mdmark が種類の色の薄い面と細い枠の囲み（`markdown-alert`）と見出し「補足」「ヒント」「重要」「警告」「注意」で描き、見出しの頭に種類のアイコンを追加する。マーカーの無い引用は mdmark の引用の見た目のまま'
  - name: Narrow
    description: 画面の幅 320px。表は mdmark の表のまま表の中だけで横にスクロールし、本文の区画は横にスクロールしない
  - name: InThreadPost
    description: スレッドの書き込みの本文。コードブロックの言語の札とコピーのボタン、Alert の見出しのアイコンを当て、表は mdmark の表の機能をオフにした共通のスタイルのまま描き、セクションの開閉は当てない
    args:
      - name: tables
        value: 'false'
      - name: fold
        value: 'false'
  - name: EmbeddedHtml
    description: 本文に `<!-- html -->` の範囲（`.mdmark-html`）があり、中に表・見出し・チャート・スライダーを持つ。範囲の中の見出しには開閉を当てず、範囲の中の表・見出しは書いた HTML と mdmark の部品の見た目のまま描く。範囲の前後の見出しには今までどおり開閉を当てる
    notes:
      理由: 範囲の HTML は書き手が見た目を決めており、見出しに開閉を置くと範囲の中のつながりを切るため
  - name: TableInDiff
    description: 本文の差分の中の表。追加した行・削除した行を持ち、mdmark の表で描かれる。追加した行・削除した行の面の色と削除した行の取り消し線は、ピン止めして左端に留まった列のセルにも付き、開閉を置かない
    args:
      - name: fold
        value: 'false'
lead: Markdown の本文を mdmark の `mount` で描き、mdmark の共通のスタイルに重ねるスタイルを当てる。表は mdmark の表の機能のまま描き、コードブロックの言語の札とコピー・GitHub の Alert の見出しのアイコンを常に当て、セクションの折りたたみを表示の設定の値で当てる。詳細パネル・詳細の全画面・本文の差分（インライン・左右に並べる）の本文で使う。
args:
  - name: source
    type: 文字列
    required: true
    description: 描く Markdown の本文。部品が `useEffect` の中で mdmark の `mount` を呼んで描き、本文が変わったら再描画する。描いた要素（class `mdmark`）の中の見出し・コードブロック・引用に見せ方を当てる
  - name: display
    type: オブジェクト
    required: false
    default: '{"fold": true}'
    description: 表示の設定の本文の見せ方（`fold` セクションの折りたたみの真偽値）
  - name: fold
    type: 真偽値
    required: false
    default: 'true'
    description: セクションの開閉を置ける本文か。本文の差分（インライン・左右に並べる）では false にし、`display.fold` が true でも開閉を置かない
  - name: tables
    type: 真偽値
    required: false
    default: 'true'
    description: mdmark の `mount` に表の機能（`features.table`）をオンで指定するか。スレッドの書き込みでは false にし、表は mdmark の共通のスタイルのまま描く
accessibility:
  - 表の入れ物・ピン止め・並べ替え・列の幅の変更のボタンの読み上げの名前とキーボードの操作は mdmark の表のままにし、上書きしない
  - 開閉の矢印は `button` で `aria-expanded` と `aria-controls` を持ち、読み上げの名前は「{見出し}を開閉」
  - コピーのボタンは読み上げの名前「コードをコピー」を持ち、コピーしたことを `role="status"` で伝える
  - Alert の種類は色だけでなく見出しの文言でも示す
  - 'コードブロックの `pre` は `tabindex="0"` と読み上げの名前「コード: {言語}」（言語を書かないものは「コード」）を持ち、キーボードで横にスクロールできる（フェンスのコードブロックは mdmark が付け、mdmark が付けない字下げのコードブロックには描画の関数が「コード」で付ける）'
refs:
  - IF-489-71#
  - CMP-489-50#
  - LIB-489-13#
  - CMP-489-5#
notes:
  モック: '`docs/mock/components/markdown-body/`'
  当て方: 開閉の境目の値と振る舞い、表を mdmark の表の機能のまま描くことは、インターフェース定義『プレビューを開く』の制約「本文の表とセクションの見せ方」のとおりにする。畳んだ状態は残さず、再描画すると初めの状態に戻る。表の見出し行の固定は外部ライブラリ『mdmark』の制限「表の見出し行の固定」のため、この部品の状態に持たない
  描き方: mdmark の `mount` は部品が持つ要素へ `useEffect` の中で呼び、本文と `display` が変わったときと部品を外すときに前の描画を片付ける。mdmark を読めないときは原文を出し、読めなかったことを使う側へ渡す（インターフェース定義『SPAを開く』の制約「描画のライブラリ」）
test_file: tests/integration/storybook_react/test_markdown_body_stories.py

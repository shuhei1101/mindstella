id: CMP-649-1
title: 項目のカード
lead: ボードの列に並べる項目 1 件のカード。タイトル・種類などの文字・マーカーと、押して絞り込めるタグを出し、タグ以外の所を押すと詳細を開く。
implementation: frontend/src/shared/components/board.tsx#ItemCard
story: Shared/ItemCard
test_file: tests/integration/storybook_react/test_item_card_stories.py
args:
  - name: item
    type: オブジェクト
    required: true
    description: カードにする項目（埋め込みのデータの項目そのもの）。`created`・`updated` をタイトルの下の文字の行の次に部品『項目の日時』で出す
  - name: index
    type: オブジェクト
    required: true
    description: 記録の索引。関係する項目のタイトルを引く
  - name: meta
    type: 配列
    required: true
    description: タイトルの下に並べる文字（種類・状態など）
  - name: links
    type: 配列
    required: true
    description: 関係する項目の ID
  - name: selected
    type: 真偽値
    required: true
    description: 詳細パネルで開いている項目か。真のとき枠と背景で選択中を示す
  - name: marks
    type: オブジェクト
    required: false
    default: なし（マーカーを出さない）
    choices: new・changed
    description: 項目の ID → `new`（新規）か `changed`（変更）。差分の表示の間だけ渡され、この項目の ID の値があるときタイトルの右に部品『差分のマーカー』を置く
  - name: comments
    type: オブジェクト
    required: true
    description: 項目の ID → レビュー中のコメントの件数。1 以上のとき部品『コメントのマーカー』を置く
  - name: edit
    type: オブジェクト
    required: true
    choices: add・edit・remove・null
    description: 画面の保存待ちの編集か null。`edit.marks` のこの項目の ID の値で部品『保存待ちのマーカー』を置き、値が `remove` のときはカードを薄くする。null のときはマーカーを出さない
  - name: lookup
    type: 関数
    required: true
    description: タイトルと関係する項目のタイトルの中の ID から記録の項目・スレッドを検索する関数。部品『記録の文字』の `lookup` にそのまま指定し、記録にある ID をマーカーにする
  - name: favorite
    type: オブジェクト
    required: false
    default: なし（星を出さない）
    description: お気に入りの星。渡すとカードの右上に部品『お気に入りの星』を配置し、タイトルと星が重ならないようカードの右の余白を広げる
  - name: favorite.on
    type: 真偽値
    required: true
    enabled_when: '`favorite` を渡したとき'
    description: お気に入りに登録しているか
events:
  - name: 詳細を開く
    when: タグ以外のカードの所を押したとき
    value: '`onOpen(id)`（項目の ID。`data-id`）'
    description: 使う側が詳細パネルを開く
  - name: タグの選択
    when: カードのタグを押したとき（`onSelectTag` を指定したときだけタグを並べる）
    value: '`onSelectTag(name)`（タグの名前。`data-tag`）'
    description: 使う側がそのタグを画面の絞り込みに加える。詳細は開かない
  - name: お気に入りの登録・解除
    when: カードの右上の星を押したとき（`favorite` を渡したときだけ）
    value: '`favorite.onToggle()`'
    description: 使う側がお気に入りに登録・解除する。詳細は開かない
states:
  - name: SelectableTags
    description: タグを押せるカード。タグを押すと `onSelectTag` だけが呼ばれ、カードのタグ以外の所を押すと `onOpen` が呼ばれる。カードの外枠は div で、ボタンの入れ子は無い
  - name: SelectableTagsSelected
    description: 開いている項目のカード。タグを押せるまま、枠（`--mark`）と背景（`--row-selected`。`--mark` を 14% 混ぜた面）で選択中を示す
    args:
      - name: selected
        value: 'true'
  - name: Default
    description: '`onSelectTag` を指定しないカード。タグを並べない'
  - name: WithComments
    description: コメントが 3 件ある項目のカード。コメントのマーカーをカードの右下に配置する
    args:
      - name: comments
        value: '{T-1: 3}'
  - name: SelectedWithComments
    description: 開いている、コメントのある項目のカード。選択中の枠と背景がほかのカードと見分けられ、右下のコメントのマーカーの色は変えない
    args:
      - name: comments
        value: '{T-1: 3}'
      - name: selected
        value: 'true'
  - name: Dates
    description: 作成の後に更新した項目のカード。種類・状態の文字の行の次に「作成 {日時}　更新 {日時}」を出す
  - name: DatesNarrow
    description: 列の幅 240px。日時は「作成 {日時}」と「更新 {日時}」の組ごとに折り返し、カードの外へはみ出さない
  - name: TitleIdMarkers
    description: タイトルに記録にある D-1 と記録に無い D-99、関係する項目のタイトルに D-1 を持つカード。D-1 は点線の下線のマーカーにし、乗せるとタイトルと状態のツールチップを出す。押すとカードを押したときと同じく詳細を開く
  - name: FavoriteOff
    description: お気に入りに登録していないカード。右上に線だけの星を出す
    args:
      - name: favorite
        value: '{"on": false}'
  - name: FavoriteOn
    description: お気に入りに登録したカード。右上に塗った星を出し、星を押すと `favorite.onToggle` だけが呼ばれる
    args:
      - name: favorite
        value: '{"on": true}'
  - name: FavoriteLongTitle
    description: 長いタイトルのお気に入りのカード。タイトルは星と重ならずに折り返し、空白の無い長い語もカードの中で折り返す
    args:
      - name: favorite
        value: '{"on": true}'
uses:
  - component: CMP-489-16#
    how: 押して絞り込めるタグ
  - component: CMP-489-32#
    how: タイトルの右の差分のマーカー
  - component: CMP-489-10#
    how: コメントのマーカー。カードの一番下の行に右寄せで配置し、ID の行には配置しない
  - component: CMP-489-22#
    how: 保存待ちのマーカー
  - component: CMP-695-2#
    how: 種類・状態の文字の行の次の作成日時・更新日時
  - component: CMP-701-1#
    how: タイトルと関係する項目のタイトルを `mode` を `marker` にして描き、`descriptionId` をタイトルのボタンの `aria-describedby` に指定する
  - component: CMP-721-1#
    how: カードの右上のお気に入りの星
accessibility:
  - カードの外枠は `div` にし、タイトルを `button` にして、その押せる範囲をカード全体へ広げる。タグのボタンをタイトルのボタンより前面に置き、ボタンを入れ子にしない
  - 開いている項目のタイトルに `aria-current="true"` を付ける
  - タイトルにフォーカスがあるとき、カードの外枠に輪郭を出す
  - 外枠に `data-card={ID}`、タイトルのボタンに `data-id={ID}` を付ける。タイトルの文字は `button[data-id]` で、カードの中のマーカーは `[data-card]` で引く
  - タイトルと関係する項目のタイトルの中の ID はマーカーにし、カードの中にフォーカスできる要素を増やさない。タイトルのボタンにフォーカスしたとき、`aria-describedby` で ID の項目・スレッドのタイトルと状態を読み上げ、ツールチップを出す
refs:
  - IF-489-70#

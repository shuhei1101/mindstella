id: CMP-489-46
title: 絞り込み
implementation: frontend/src/shared/components/filter-drawer.tsx#FilterDrawer
story: Shared/FilterDrawer
states:
  - name: Default
    description: '何も選んでいない（タスク: 種類・状態・タグ）。見出しの右は「8 件」で、「解除」と「すべて解除」を出さない'
  - name: Selected
    description: 検討事項で状態に 4 つ・タグに 1 つを選んでいる。見出しの右は「36 件中 3 件」、選んだ条件に「{件数} 件を選択」と「解除」、下端に「すべて解除」と「3 件を表示」
    args:
      - name: selected
        value: '{"status": ["要見直し", "未決定", "保留", "未整理"], "tags": ["プレビュー"]}'
  - name: ZeroValue
    description: 今の条件では 0 件になる値がある。その値は文字と件数を薄くし、選べるまま残す
  - name: LongTag
    description: 長いタグ。値の文字を折り返し、件数の列を押し出さない
  - name: NoMatch
    description: 該当なし。見出しの右は「8 件中 0 件」、下端のボタンは「0 件を表示」
    args:
      - name: selected
        value: '{"kind": ["作業"], "status": ["未着手"]}'
  - name: Narrow
    description: 幅 390px。トップバーの下から画面の幅いっぱいに重ねる
    args:
      - name: narrow
        value: 'true'
  - name: TextConditions
    description: 用語集で、用語の欄に「移し」を入れている。値の条件より上に「文字を含む」と ID・用語・意味・別名・使わない表記の欄を並べ、見出しの右は「6 件中 1 件」。タグの件数は文字で絞った 1 件で数える。入っている欄は中身を削除する × を出す
    args:
      - name: texts
        value: '`id`（ID）・`title`（用語、文字は「移し」）・`meaning`（意味）・`aliases`（別名）・`avoid`（使わない表記）'
      - name: selected
        value: '{"~title": ["移し"]}'
  - name: TagMatchAll
    description: タスクでタグ「プレビュー」と「サーバー」を選び、組み合わせ方は既定の「すべて含む」。タグの条件の見出しの下に「すべて含む / どれかを含む」の切り替えを出し、「すべて含む」が押された状態
    args:
      - name: selected
        value: '{"tags": ["プレビュー", "サーバー"]}'
      - name: shown
        value: '2'
      - name: tagMatch
        value: all
  - name: TagMatchAny
    description: 組み合わせ方を「どれかを含む」に切り替えた。見出しの右の件数がどちらかのタグを持つ 6 件になる
    args:
      - name: selected
        value: '{"tags": ["プレビュー", "サーバー"]}'
      - name: shown
        value: '6'
      - name: tagMatch
        value: any
lead: 項目を並べる画面で、列ごとに文字を入れる欄と、条件ごとに値を件数つきのチェックボックスで並べて選ぶドロワー。タブの帯の下から左に重ねるパネルで、開いている間はトップバーとタブの帯とドロワー以外をグレーアウトする。開閉はトップバーの絞り込みのボタン（部品設計『トップバー』）が持つ。
args:
  - name: groups
    type: オブジェクトの配列
    required: true
    description: 条件の並び。種類・状態・タグを先に置き、残りは表の列の順。値を 1 つも持たない条件は渡さない。各値の `count` は、文字の条件で絞った項目で数える
  - name: groups[].key
    type: 文字列
    required: true
    description: 条件の識別子（表の列の `key`）。URL の search params の `f.{列}` と同じ値
  - name: groups[].label
    type: 文字列
    required: true
    description: 条件の見出し（`legend`）
  - name: groups[].values
    type: オブジェクトの配列
    required: true
    description: 選べる値の並び（`value`・`count`）。並びは状態などの決まった順、ほかは五十音の順。`count` は、その条件以外の条件で絞った項目のうち、その値を持つ件数。0 件の値も並べ、文字を薄くする
  - name: groups[].mark
    type: 列挙
    default: none
    choices: none・status・kind
    description: 値の左に添えるマーカー。status は状態のマーカー（色と形状）、kind は項目の種類の色の点
  - name: selected
    type: オブジェクト
    default: なし（どの条件でも絞らない）
    description: 条件の `key` → 選んだ値の配列。文字の条件は `~{列}` → 入っている文字 1 つの配列。値を選んだ条件の見出しの右に「{件数} 件を選択」と「解除」を出す。件数は、その条件の `values` に並ぶ値のうち選んだものの数（並ばない値は数えない）
  - name: total
    type: 整数
    required: true
    description: 画面の項目の件数
  - name: shown
    type: 整数
    required: true
    description: 今の条件に合う項目の件数。値を選んだ条件があるときは見出しの右に「{total} 件中 {shown} 件」、無いときは「{total} 件」と出し、下端のボタンを「{shown} 件を表示」にする
  - name: narrow
    type: 真偽値
    default: 'false'
    description: 画面の幅が 900px 以下か。偽のときはコメントの一覧と同じ 420px の幅で、真のときはトップバーの下から画面の幅いっぱいに重ねる（コメントの一覧と同じ）
  - name: texts
    type: オブジェクトの配列
    required: false
    default: なし（文字の欄を出さない）
    description: 文字で絞れる列（`key`・`label`・今入っている文字 `value`）。値を選ぶ条件にしない、数でない列（ID・タイトル・用語・意味など）だけを表の列の順に渡す。値の条件より上に「文字を含む」のまとまりとして、列ごとに見出しと文字の欄を並べる
  - name: tagMatch
    type: 列挙
    required: false
    default: all
    choices: all・any
    description: タグの組み合わせ方。all は選んだタグを全て持つ項目、any はどれかを持つ項目に絞る。タグの条件の見出しの下に「すべて含む / どれかを含む」の切り替えを出し、今の値を押された見た目にする
    enabled_when: '`onTagMatchChange` を渡したとき'
events:
  - name: 値の選択
    when: 値のチェックボックスを入れた・外したとき
    value: '`onToggleValue(key, value)`（引数は key と値）'
    description: 使う側が `selected` を変えて画面とドロワーを再描画し、押した値へフォーカスを戻す。サーバーの配信では、使う側が変えた後の条件をその画面の条件としてそのタブの保存領域に残す（配る書き出しでは残さない）
  - name: 条件の解除
    when: 条件の見出しの右の「解除」を押したとき
    value: '`onClearGroup(key)`（引数は key）'
    description: 使う側がその条件の選びを外して再描画し、その条件の最初の値へフォーカスを移す。サーバーの配信では、外した後の条件をそのタブの保存領域に残す
  - name: すべて解除
    when: 下端の「すべて解除」を押したとき（値を選んだ条件があるときだけ出す）
    description: 使う側が全ての条件の選びを外して再描画し、最初の値へフォーカスを移す。サーバーの配信では、外した後の条件をそのタブの保存領域に残す
    value: '`onClearAll()`'
  - name: 閉じる
    when: 見出しの × か下端の「{shown} 件を表示」を押したとき、ドロワーの中で Esc を押したとき、グレーアウトした所を押したとき
    description: 使う側がドロワーを閉じ、絞り込みのボタンへフォーカスを戻す。グレーアウトした所を押した操作は、後ろの部品へ届けない
    value: '`onClose()`'
  - name: 文字の入力
    when: 文字の欄で打ち終えて 250 ミリ秒たったとき
    value: '`onTextChange(key, text)`（引数は key と入っている文字）'
    description: 使う側が前後の空白を除いた文字を `selected` の `~{列}` に入れ替え（空なら外す）、画面とドロワーを再描画する。再描画した後も同じ欄の同じ位置にカーソルを戻す。サーバーの配信では、変えた後の条件をそのタブの保存領域に残す
  - name: タグの組み合わせ方の変更
    when: タグの条件の「すべて含む」「どれかを含む」を押したとき
    value: '`onTagMatchChange(match)`（`all` か `any`。`data-tag-match`）'
    description: 使う側が組み合わせ方を変えて画面とドロワーを再描画する。サーバーの配信では、変えた後の組み合わせ方をその画面の条件としてそのタブの保存領域に残す
accessibility:
  - ドロワーは `dialog` 要素を `show()` で開き、読み上げの名前を「絞り込み」にする。開いたら最初の値へフォーカスを移す。開いている間は、トップバーとタブの帯とドロワー以外を `inert` にする
  - 条件のまとまりは `fieldset` と `legend` で組み、値はチェックボックスにする
  - 「解除」に「{条件}の条件を解除」の読み上げ名を付ける
  - 値の件数に「{件数} 件」、キーワードに一致した件数に「キーワードに一致した項目 {件数} 件」の読み上げ名を付ける
  - 0 件の値を色だけでなく件数の 0 でも伝える
  - 閉じたら絞り込みのボタンへフォーカスを戻す（コメントの一覧に切り替えて閉じたときはコメントの一覧に残す）
  - 文字の欄は「文字を含む」の `fieldset` と `legend` で組み、各欄に列の名前の `label` を付ける。初めて開くときは先頭の文字の欄へフォーカスを移す
  - タグの組み合わせ方は `fieldset` と読み上げだけの `legend`「タグの組み合わせ方」で組み、2 つの選択肢をラジオボタン（`name="tag-match"`）にする。見た目はラベルのボタンにし、フォーカスはラベルに輪郭で出す

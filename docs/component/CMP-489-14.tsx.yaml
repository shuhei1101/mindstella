id: CMP-489-14
title: スレッドの行
implementation: frontend/src/features/comments/shared/thread-row.tsx#ThreadRow
story: Comments/ThreadRow
states:
  - name: Replied
    description: オープンで AI が返信した。1 行目に状態の札「オープン」と要約（2 行まで）、2 行目に向けた項目の ID・最後の書き手「AI」・最後の書き込みの日時、行の下にタグ
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（コピーから戻す）で決まった","target":"D-12","posts":[{"author":"user","body":"D-12 は案 B にしたい。失敗したらコピーから戻せるなら十分","created":"2026-10-12T01:20:00+00:00"},{"author":"ai","body":"D-12 を案 B（コピーから戻す）で決定にしました。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
  - name: PendingReply
    description: レビュー中の返信を持つ。2 行目の末尾に破線の枠・鉛筆のアイコン・「レビュー中」の記号
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（コピーから戻す）で決まった","target":"D-12","posts":[{"author":"user","body":"D-12 は案 B にしたい","created":"2026-10-12T01:20:00+00:00"},{"author":"ai","body":"D-12 を案 B で決定にしました。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
      - name: hasPendingReply
        value: 'true'
  - name: Asking
    description: AI が立てたスレッド（利用者の返事待ち）。最後の書き手は「AI」
    args:
      - name: thread
        value: '{"id":"TH-2","status":"open","tags":["起票"],"summary":"D-16 の比べた結果を Issue に起票してよいかの確認。返事待ち","target":"D-16","posts":[{"author":"ai","body":"D-16 の比べた結果を Issue に起票してよいですか。","created":"2026-10-12T04:02:00+00:00"}],"events":[]}'
  - name: NoSummary
    description: 要約がまだ無く、最後の書き手が利用者。タイトルは最初の書き込みの 1 行目を太さを落として出し、書き手は「あなた」
    args:
      - name: thread
        value: '{"id":"TH-3","status":"open","tags":["資料"],"summary":null,"target":"A-1","posts":[{"author":"user","body":"A-1 の背景のセクションが長いので、3 行にまとめてほしい。経緯は会話ログへのリンクで足りる","created":"2026-10-12T05:01:00+00:00"}],"events":[]}'
  - name: PendingNewToItem
    description: まだ送信していない、項目へ向けた新規スレッド。状態の札の代わりに鉛筆のアイコンと「レビュー中」の札、行の下の区切りの線を破線にする。タイトルは最初の書き込みの 1 行目、書き手は「あなた」、日時は溜めた日時。タグは出さない
    args:
      - name: pending
        value: '{"id":"C-41","target":"D-5","thread":null,"body":"コピーは git のコミットで取るほうが戻しやすいと思う","created":"2026-10-12T05:10:00+00:00"}'
  - name: PendingNewFree
    description: まだ送信していない、項目を指さない新規スレッド。2 行目に ID を出さない
    args:
      - name: pending
        value: '{"id":"C-42","target":null,"thread":null,"body":"移し替えの手順の名前はバージョンの番号だけでよい？","created":"2026-10-12T05:12:00+00:00"}'
  - name: Closed
    description: クローズ。状態の札をチェックのアイコンと「クローズ」にし、薄い文字で出す。利用者と AI のどちらがクローズにしても同じ見た目
    args:
      - name: thread
        value: '{"id":"TH-5","status":"closed","tags":["画面"],"summary":"D-2 のバージョンの置き場所の質問。config.yaml に書くと回答","target":"D-2","posts":[{"author":"user","body":"バージョンはどこに書く？","created":"2026-10-12T02:00:00+00:00"},{"author":"ai","body":"config.yaml の version に書きます。","created":"2026-10-12T02:03:00+00:00"}],"events":[{"kind":"closed","author":"user","reason":"config.yaml に書くと分かった","created":"2026-10-12T02:10:00+00:00"}]}'
  - name: Long
    description: 長い要約・タグが 2 つ・項目を指さない。要約は 2 行で末尾を省き、2 行目に ID を出さない
    args:
      - name: thread
        value: '{"id":"TH-4","status":"open","tags":["調査","画面"],"summary":"移し替えの手順を画面で見られるかの質問。今は見られず、T-6 の点検の結果を、バージョンごとの操作の一覧にした資料 A-9 にまとめることになった","target":null,"posts":[{"author":"user","body":"移し替えの手順は、プレビューのどこかで見られる？","created":"2026-10-12T00:10:00+00:00"},{"author":"ai","body":"資料 A-9 を追加ました。","created":"2026-10-12T00:41:00+00:00"}],"events":[]}'
  - name: Tagged
    description: タグ「画面」で絞っている。そのタグの札を枠の全体と面で示し、押した状態として読み上げる
    args:
      - name: thread
        value: '{"id":"TH-4","status":"open","tags":["調査","画面"],"summary":"移し替えの手順を画面で見られるかの質問","target":null,"posts":[{"author":"ai","body":"資料 A-9 を追加ました。","created":"2026-10-12T00:41:00+00:00"}],"events":[]}'
      - name: activeTag
        value: 画面
  - name: Narrow
    description: 幅 390px。2 行目の値は折り返さず、日時を残して ID から詰める。タグは行の下で折り返す
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（コピーから戻す）で決まった","target":"D-12","posts":[{"author":"ai","body":"D-12 を案 B で決定にしました。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
      - name: hasPendingReply
        value: 'true'
  - name: Unread
    description: オープンで AI の返信が利用者の未読。2 行目の先頭にマーカーの色（`--mark`）で塗りつぶした札「● 未読」（文字は `--on-mark`。行の面とのコントラスト比 3:1 以上）を出し、向けた項目の ID・最後の書き手「AI」・日時をその右に並べる
    args:
      - name: thread
        value: '{"id":"TH-2","status":"open","tags":["起票"],"summary":"D-16 の比べた結果を Issue に起票してよいかの確認。返事待ち","target":"D-16","posts":[{"author":"ai","body":"D-16 の比べた結果を Issue に起票してよいですか。","created":"2026-10-12T04:02:00+00:00","seen":false}],"events":[]}'
  - name: UnreadPendingReply
    description: 未読で、レビュー中の返信も持つ。2 行目の先頭に「● 未読」、末尾に破線の枠の「レビュー中」を出し、形状（塗りつぶしと破線の枠）で見分ける
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（コピーから戻す）で決まった","target":"D-12","posts":[{"author":"user","body":"D-12 は案 B にしたい","created":"2026-10-12T01:20:00+00:00","seen":true},{"author":"ai","body":"D-12 を案 B で決定にしました。","created":"2026-10-12T01:24:00+00:00","seen":false}],"events":[]}'
      - name: hasPendingReply
        value: 'true'
  - name: UnreadClosed
    description: AI が返信してからクローズにし、返信が利用者の未読。状態の札「クローズ」のまま、2 行目の先頭に「● 未読」を出す
    args:
      - name: thread
        value: '{"id":"TH-6","status":"closed","tags":["起票"],"summary":"T-4 の Issue の起票の確認。起票して完了","target":"T-4","posts":[{"author":"user","body":"起票してよい","created":"2026-10-12T03:00:00+00:00","seen":true},{"author":"ai","body":"T-4 の Issue を起票しました。","created":"2026-10-12T03:07:00+00:00","seen":false}],"events":[{"kind":"closed","author":"ai","reason":"起票した","created":"2026-10-12T03:07:00+00:00"}]}'
  - name: LongValuesNarrow
    description: 幅 390px で、値を最大の長さにした行（改行の無い長い要約・5 桁のスレッドの ID・5 桁の向けた項目の ID・未読・レビュー中の返信あり）。状態の札・未読の札・レビュー中のマーカー・書き手の文字は折り返さず、要約は 2 行で末尾を省き、2 行目は日時を残して ID から詰める
    args:
      - name: thread
        value: '{"id":"TH-12345","status":"open","tags":["画面"],"summary":"詳細パネルのヘッダーに並べる前後の項目へ移るボタンと位置の文字の置き場所と、狭い幅で折り返さずに省略する範囲と、長い値を入れたストーリーでスクリーンショットを確かめる方法の相談","target":"D-12345","posts":[{"author":"user","body":"狭い幅でも札を折り返さないで","created":"2026-10-12T01:20:00+00:00","seen":true},{"author":"ai","body":"札を折り返さず、要約の側で省きます。","created":"2026-10-12T01:24:00+00:00","seen":false}],"events":[]}'
      - name: hasPendingReply
        value: 'true'
  - name: TitleIdMarkers
    description: 要約に記録にある D-1・TH-1 と記録に無い D-99 を持つ。D-1・TH-1 は点線の下線のマーカーにし、乗せても行のボタンにフォーカスしてもツールチップを出さない。押すと行を押したときと同じくスレッドを開く
    args:
      - name: thread
        value: '{"id":"TH-2","status":"open","tags":["画面"],"summary":"D-1 の決め方（TH-1 の続き、D-99 は除く）","target":"D-1","posts":[{"author":"ai","body":"D-1 は TH-1 の候補から選びます。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
  - name: LongTitlePending
    description: 改行の無い長いタイトルと「レビュー中」の札を持つ行を、最も狭めたパネルの幅で出す。タイトルは行の幅に収まるように省略し、札は折り返さない
  - name: List
    description: 状態の違う 5 件の行（オープン・未読・レビュー中の返信あり・クローズ・まだ送信していない新規スレッド）を並べた一覧。行を角丸のカードにせず、背景を付けずに行の下の区切りの線で分ける。新規スレッドは区切りの線を破線にし、ホバーで行の全体に `--accent` の面を出す
    notes:
      見せ方: ストーリーで 5 件の行を `ul` に並べ、幅をコメントの一覧のパネルと同じ 384px（画面の幅が狭いときは画面の幅）にする
  - name: Many
    description: 100 件の行を並べた一覧。区切りの線で分けたまま詰まって見えず、横にはみ出さない
    notes:
      見せ方: '`List` と同じ幅で、100 件の行を `ul` に並べる'
lead: スレッドの一覧に並べる 1 件の行。状態の札・タイトル・向けた項目・最後の書き手と日時・レビュー中のマーカー・タグを出し、押すとそのスレッドを開く。まだ送信していない新規スレッドも同じ構造で「レビュー中」の札にする。
args:
  - name: thread
    type: オブジェクト
    default: なし（`pending` を渡す）
    description: 送信したスレッド（『スレッドの読み取り』の `threads[]` の 1 件）。`pending` とどちらか片方を渡す。タイトルは `summary`、無ければ最初の書き込みの 1 行目。2 行目の書き手と日時は最後の書き込みのもの。書き込みに `seen` が `false` のものがあれば、2 行目の先頭に未読の札を出す（クローズのスレッドでも出す）
    status: implemented
  - name: pending
    type: オブジェクト
    default: なし（`thread` を渡す）
    description: まだ送信していない新規スレッドの最初の書き込み（『レビュー中のコメントの読み取り』の `items[]` のうち `thread` を持たないもの）。タイトルは本文の 1 行目、書き手は「あなた」、日時は溜めた日時（`created`）。タグを出さない
    status: implemented
  - name: hasPendingReply
    type: 真偽値
    default: 'false'
    enabled_when: '`thread` を渡したとき'
    description: そのスレッドへのレビュー中の返信を持つか。持てば 2 行目の末尾に「レビュー中」の記号を出す
    status: implemented
  - name: activeTag
    type: 文字列
    default: なし（タグで絞っていない）
    enabled_when: '`thread` を渡したとき'
    description: 一覧を絞っているタグ。同じタグの札を押した見た目にする
    status: implemented
  - name: lookup
    type: 関数
    required: true
    description: タイトルの中の ID から記録の項目・スレッドを検索する関数。部品『記録の文字』の `lookup` にそのまま指定し、記録にある ID をマーカーにする
events:
  - name: 開く
    when: 行のタグ以外の所を押したとき（Enter・Space を含む）
    value: '`onOpen(id)`（送信したスレッドは `thread.id`、まだ送信していない新規スレッドは `pending.id`）'
    description: 使う側がパネルの中をスレッドの画面に切り替える
  - name: タグで絞る
    when: タグの札を押したとき
    value: '`onTag(tag)`（タグ）'
    description: 使う側がそのタグで一覧を絞る。絞っているタグの札なら絞り込みを外す
accessibility:
  - 行を開く操作は 1 つのボタンにし、読み上げの名前は状態・タイトル・向けた項目・最後の書き手・日時をこの順で読む。レビュー中のマーカーは「レビュー中の返信あり」と読む
  - 状態の札とレビュー中のマーカーは、色に加えてマーカーのアイコンと文字で示す
  - 未読の札は、色に加えて塗りつぶしの形状・点のマーカー・「未読」の文字で示す。行を開くボタンの読み上げの名前は、状態の次に「未読」を読む
  - タグの札は行を開くボタンと別のボタンにし、`aria-pressed` と読み上げの名前「タグ「{タグ}」で絞る」を持つ
  - 行を開くボタンとタグの札のそれぞれに Tab で届き、フォーカスは枠の全体にマーカーの色の輪で出す
  - タイトルの中の ID はマーカーにし、行を開くボタンの中にフォーカスできる要素を増やさない。行を開くボタンにフォーカスしたとき、`aria-describedby` で ID の項目・スレッドのタイトルと状態を読み上げる。行のボタンと重なるため、ID のツールチップは出さない
refs:
  - SCR-489-2#
test_file: tests/integration/storybook_react/test_thread_row_stories.py
uses:

id: CMP-489-36
title: 本文のマーカーのツールチップ
implementation: frontend/src/shared/components/term-tip.tsx#TermTip
story: Shared/TermTip
states:
  - name: TermOnly
    description: 用語 1 件だけに一致したマーカー。今と同じく用語・ID・意味だけを出し、リンクを持たない
  - name: Few
    description: 用語・資料・調査に 1 件ずつ一致したマーカー。種類ごとの見出しと区切り線で分け、全てのタイトルがリンクになる
  - name: DocOnly
    description: 資料 1 件だけに一致したマーカー。「資料 1」の見出しの下に 1 件
  - name: NoDescription
    description: 説明を持たない資料。タイトルと ID だけを出す
  - name: Many
    description: 用語 1・資料 6・調査 1 に一致したマーカー。最大の高さ（360px）で止まり、中をスクロールして末尾の調査まで読める
  - name: Below
    description: マーカーの上に収まらない。マーカーの下に出す
  - name: Shrunk
    description: 上下どちらにも収まらない。広い側（上）に出してその高さに縮め、下端をマーカーに留める
    notes:
      見せ方: Storybook の画面の高さを 520px にして見せる
  - name: LinkFocus
    description: マーカーから Tab で中の最初のリンクへ移った。マーカーの色の輪でフォーカスを示す
    notes:
      見せ方: ストーリーの play でマーカーにフォーカスして Tab を押す
  - name: LongNarrow
    description: 長いタイトル・説明を幅 390px で出す。折り返し、画面の端から 8px の内側に収める
    notes:
      見せ方: Storybook の画面幅を 390px にする
  - name: SeveralTerms
    description: 用語 2 件だけに一致したマーカー（ある用語のタイトルが別の用語の別名と同じ）。「用語 2」の見出しの下に 2 件を区切り線で分けて並べ、それぞれ用語・ID・意味を出してタイトルをリンクにする
  - name: ItemId
    description: 本文の項目の ID（未決定の検討事項 D-3）に乗せた。1 行目にタイトルと ID、2 行目に「検討事項」・状態のマーカー・「未決定」を出し、リンクを持たない
  - name: ItemIdWithoutStatus
    description: 状態を持たない資料の ID。2 行目は「資料」だけ
  - name: ItemIdWithdrawn
    description: 取り下げた調査の ID。2 行目の状態の後ろに「取り下げ」を同じ間隔で並べる
  - name: ThreadId
    description: 本文のスレッドの ID（オープンの TH-2）に乗せた。1 行目にスレッドのタイトルと ID、2 行目に「スレッド」・状態のマーカー・「オープン」を出し、リンクを持たない。書き込みの ID（TH-2-3）でも同じスレッドの中身を出す
lead: 詳細パネルと詳細の全画面で、本文のマーカー（用語のタイトルと別名・資料と調査のエイリアスに一致した語）に乗せる・フォーカスすると、マーカーの上に出すツールチップ。一致した項目を用語 → 資料 → 調査の順に並べ、資料・調査の詳細へ移るリンクを持つ。項目の本文の項目の ID のリンクと、スレッドの書き込みの本文の項目の ID のボタンに乗せる・フォーカスすると、同じブロックでその項目のタイトルと状態を出す。
args:
  - name: entries
    type: オブジェクトの配列
    required: true
    description: マーカーの語に一致した項目（`{kind, item}`。`kind` は `terms`・`docs`・`research`）を、用語 → 資料 → 調査の順に並べたもの。開いている項目自身と、取り下げた資料・調査は使う側が除いて渡す。用語 1 件だけのときは用語・ID・意味だけを出し、用語が 2 件以上か、資料・調査を 1 件でも含むときは種類ごとの見出し（種類名と件数）と区切り線で分け、全ての項目のタイトルを詳細へのリンクにする。資料・調査はタイトル・ID・説明（無ければ出さない）を出す。項目の ID のリンク・ボタンでは `kind` を `item` にした 1 件、スレッドの ID・書き込みの ID のリンクでは `kind` を `thread`（スレッドのタイトル・ID・オープンかクローズの状態）にした 1 件だけを指定し、1 行目にタイトルと ID、2 行目に種類と状態のマーカー・状態名（状態を持たない種類は種類だけ、取り下げた項目は末尾に「取り下げ」）を出し、リンクを持たない
  - name: anchor
    type: 部品
    required: true
    description: 本文のマーカーの要素。矩形（`getBoundingClientRect()`）を取って、マーカーの上に 6px 空け、下端をマーカーに留めて出す。上に収まらなければマーカーの下に出し、上下どちらにも収まらなければ広い側に出してその高さに縮める。左右は画面の端から 8px の内側に収める。中の最初のリンクの Shift+Tab と Esc でフォーカスをこの要素へ戻し、最後のリンクの次は、この要素を含む本文の中でこの要素の次にフォーカスできる要素へ移す
  - name: pinned
    type: 真偽値
    required: false
    default: 'false'
    description: 押して残した状態か。真のときはマーカーからポインターが外れても閉じず、外を押すか Esc で閉じる
events:
  - name: 項目へ移る
    when: 中の項目のリンクを押したときと、フォーカスして Enter を押したとき
    value: '`onNavigate(id)`（引数はリンクの項目の ID）'
    description: 使う側がツールチップを閉じ、その項目の詳細へ移って履歴に積む
  - name: 閉じる
    when: Esc を押したとき、押して残した状態で外を押したとき、中からフォーカスがマーカーでもツールチップでもない所へ出たとき
    description: 使う側がツールチップを閉じる。中にフォーカスがあったときの Esc は、フォーカスをマーカーへ戻し、詳細の全画面の Esc（元の大きさに戻す）を起こさない
    value: '`onClose()`'
accessibility:
  - 用語 1 件だけに一致したマーカーのツールチップは、今と同じく `role="tooltip"` にし、マーカーの `aria-describedby` で指す
  - 用語が 2 件以上か、資料・調査を含むツールチップは中にリンクを持つため `role="tooltip"` を付けず、マーカーの `aria-details` で指す
  - 種類ごとの並びはリストにし、見出し（種類名と件数）で名前を付ける
  - 用語が 2 件以上か、資料・調査を含むマーカーから Tab で中の最初のリンクへ移れ、最後のリンクの次は本文のマーカーの次の要素へ、最初のリンクの Shift+Tab はマーカーへ戻る。Esc で閉じる
  - リンクのフォーカスはマーカーの色の輪で、ホバーと見分ける
  - マーカーからツールチップへポインターを動かす間（150 ミリ秒）は閉じない
  - 項目の ID のツールチップはリンクを持たないため `role="tooltip"` にし、リンク・ボタンの `aria-describedby` で指す。状態はマーカーの色だけでなく状態名でも示す
test_file: tests/integration/storybook_react/test_term_tip_stories.py

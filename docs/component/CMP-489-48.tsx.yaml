id: CMP-489-48
title: 表
lead: 項目の一覧の表。列の見出しで並べ替え・ピン留めでき、表の上に絞り込みの条件（値と列の文字）のチップを並べる。絞り込みの条件は部品『絞り込み』で選び、表は受け取った条件で行を絞る。チップの行の右端の「列の表示」のボタンから、列の付け外しと初期設定に戻すのポップオーバーを開く。
implementation: frontend/src/shared/components/table.tsx#Table
story: Shared/Table
test_file: tests/integration/storybook_react/test_table_stories.py
args:
  - name: kind
    type: 列挙
    required: true
    choices: decisions・tasks・research・docs・terms・notes・logs
    description: 項目の種類。該当なしの文言と、端末の保存領域のキーに使う
  - name: columns
    type: オブジェクトの配列
    required: true
    description: 列の定義。並びが列の並び。`filterable` が偽で数でない列は、絞り込みのドロワーの文字の欄で絞れる
  - name: columns[].key
    type: 文字列
    required: true
    description: 列の識別子。並べ替え・絞り込み・ピン留めの対象を指す
  - name: columns[].label
    type: 文字列
    required: true
    description: 見出しの文字
  - name: columns[].filterable
    type: 真偽値
    required: false
    default: 'false'
    description: 値で絞り込めるか。真の列を絞り込みのドロワーの条件にする。列の見出しには絞り込みのボタンを出さない
  - name: columns[].fixed
    type: 真偽値
    required: false
    default: 'false'
    description: 列の表示で外せないか（タイトルの列）
  - name: columns[].hidden
    type: 真偽値
    required: false
    default: 'false'
    description: 初期設定で隠すか
  - name: rows
    type: オブジェクトの配列
    required: true
    description: 行にする項目（埋め込みのデータの項目そのもの）。`withdrawn` が真の行は、差分の表示によらずタイトルの右、差分のマーカーより前に部品『取り下げの札』を置き、行の文字を薄くする
  - name: sort
    type: オブジェクト
    required: false
    default: なし（並べ替えない）
    description: 並べ替えている列と向き（`key`・`dir` は asc・desc）
  - name: filters
    type: オブジェクト
    required: false
    default: なし（絞り込まない）
    description: 列の `key` → 選んだ値の配列。絞り込みのドロワーで選んだ条件をそのまま受ける。同じ列の中はどれかに合う行（タグの列は `tagMatch` に従う）、列どうしは全てに合う行を出し、値を 1 つも選んでいない列では絞らない。`~{列}` のキーは文字の条件で、その列の値に文字を含む行を出す（大文字・小文字を区別しない）
  - name: pinTo
    type: 文字列
    required: false
    default: なし（固定しない）
    description: 左端からこの列までを横スクロールでも固定する列の `key`
  - name: hiddenColumns
    type: 配列
    required: false
    default: '`columns[].hidden` が真の列'
    description: 隠している列の `key`
  - name: marks
    type: オブジェクト
    required: false
    default: なし（マーカーを出さない）
    description: 項目の ID → `new`（新規）か `changed`（変更）。差分の表示の間だけ渡され、当たる行のタイトルの右に部品『差分のマーカー』を文言なしで置く
  - name: comments
    type: オブジェクト
    required: false
    default: なし（マーカーを出さない）
    description: 項目の ID → レビュー中のコメントの件数（1 以上）。サーバーにつながって開いたときだけ渡され、当たる行のタイトルの右、差分のマーカーの後ろに部品『コメントのマーカー』を置く。収まらなければ次の行へ送信する
  - name: tagMatch
    type: 列挙
    required: false
    default: all
    choices: all・any
    description: タグの列の組み合わせ方。all は選んだタグを全て持つ行、any はどれかを持つ行を出す。チップ（部品『絞り込みの条件のチップ』）へそのまま渡す
  - name: tagExprText
    type: 文字列
    required: false
    default: なし（タグの条件の式のチップを出さない）
    description: '簡易で表せないタグの条件の式を文にしたもの。チップ（部品『絞り込みの条件のチップ』）へそのまま渡し、先頭に「タグ: {文}」のチップを出す。式に合う行は使う側が `rows` に絞って渡す'
    enabled_when: '`onClearTagExpr` を渡したとき'
  - name: columns[].cell
    type: 関数
    required: false
    default: なし（値を文字にして出す）
    description: セルの中身を描く関数（`cell(row)`）。作成日時・更新日時の列は、部品『項目の日時』と同じ書式（今年は `MM/DD HH:mm`、今年でない日時は `YYYY/MM/DD HH:mm`）を `time` 要素で出す。並べ替えと絞り込みは元の値で行う
  - name: lookup
    type: 関数
    required: true
    description: 行のタイトルの中の ID から記録の項目・スレッドを検索する関数。部品『記録の文字』の `lookup` にそのまま指定し、記録にある ID をマーカーにする
events:
  - name: タグの条件の式の解除
    when: チップの、タグの条件の式のチップの × か「すべて解除」を押したとき
    value: '`onClearTagExpr()`'
    description: 使う側がタグの条件を解除して表と絞り込みのドロワーを再描画する
  - name: 並べ替え
    when: 見出しの文字を押したとき
    value: '`onSort(key)`（引数は key）'
    description: 使う側が 昇順 → 降順 → 解除 と巡る
  - name: 絞り込み
    when: チップの × か「すべて解除」を押したとき
    value: '`onFilter(key, values)`（引数は key と値の配列）'
    description: 使う側が `filters` を変えて表と絞り込みのドロワーを再描画する。サーバーの配信では、外した後の条件をその画面の条件としてそのタブの保存領域に残す（配る書き出しでは残さない）
  - name: ピン留め
    when: 見出しのピンのボタンを押したとき
    value: '`onPin(key)`（引数は key）'
    description: 使う側が押した列までを固定する。固定中の列をもう一度押すと外す
  - name: 列の表示
    when: 列の表示のポップオーバーで列を付け外ししたとき
    value: '`onHiddenColumnsChange(hiddenColumns)`（引数は hiddenColumns）'
    description: 使う側が端末の保存領域に残す
  - name: 初期設定に戻す
    when: 列の表示のポップオーバーで初期設定に戻すを押したとき
    description: 使う側が列・並べ替え・固定を戻す
    value: '`onResetColumns()`'
  - name: 詳細を開く
    when: 行のタイトルを押したとき
    value: '`onOpenItem(id)`（引数は id）'
    description: 使う側が詳細パネルを開く
  - name: タグの選択
    when: タグの列のセルのタグを押したとき（`onSelectTag` を指定したときだけタグをボタンにする）
    value: '`onSelectTag(name)`（引数はタグの名前）'
    description: 使う側がそのタグを `filters` の `tags` に加え（既にあれば何もしない）、詳細パネルは開かない
states:
  - name: Default
    description: 通常。並べ替えのマーカーは見出しにホバーかフォーカスしたときだけ出す。チップの行の右端に列のアイコンと「列の表示」のボタンを置き、チップの行と表の間を 12px 空ける
  - name: SortedAsc
    description: タイトルで昇順。向きの矢印を出し、`aria-sort="ascending"`
    args:
      - name: sort
        value: '{"key": "title", "dir": "asc"}'
  - name: SortedDesc
    description: タイトルで降順。`aria-sort="descending"`
    args:
      - name: sort
        value: '{"key": "title", "dir": "desc"}'
  - name: Filtered
    description: 確度 = 高で絞り込み中。表の上にチップと「すべて解除」を並べる。列の見出しには並べ替えとピン留めだけを置き、絞り込みのボタンを出さない
    args:
      - name: filters
        value: '{"conf": ["高"]}'
  - name: Pinned
    description: ID の列までピン留め。押した列のボタンだけが押された見た目で、固定した列の境に影
    args:
      - name: pinTo
        value: id
  - name: LongTitle
    description: 長いタイトル。タイトルの列は折り返し、ほかの列は崩れない
  - name: NoMatch
    description: 該当なし（ピン留め中）。表の場所に該当なしと次の操作を書き、横にスクロールしても文言は表の枠の左に留める
    args:
      - name: filters
        value: '{"conf": ["中"]}'
      - name: pinTo
        value: id
  - name: ColumnsPopover
    description: 列の表示のポップオーバーを開いている。タイトルは「列の表示」。タイトルの列は外せない
    notes:
      見せ方: '`play` で「列の表示」のボタンを押して開く'
  - name: Marked
    description: 差分の表示の間。変えた行のタイトルの右に ●、追加した行に + を置き、マーカーの無い行は変わらない
    args:
      - name: marks
        value: '{"D-5": "changed", "D-37": "new"}'
  - name: TextFiltered
    description: 用語集で、用語に「移し」を含む行に絞っている。表の上に「用語に「移し」を含む」のチップと「すべて解除」を並べる。英数字で終わる列名（ID）は「ID に「G-」を含む」のように空白を挟む。列の見出しに絞り込みのボタンを出さない
    args:
      - name: kind
        value: terms
      - name: columns
        value: 用語集の列（`id`・`title` の `label` が「用語」・`meaning`・`aliases`・`avoid`・`tags`）
      - name: filters
        value: '{"~title": ["移し"]}'
  - name: Commented
    description: コメントを書いた行。タイトルの右に差分のマーカー、その後ろにコメントのマーカーを置き、マーカーの無い行は変わらない
    args:
      - name: marks
        value: '{"D-5": "changed"}'
      - name: comments
        value: '{"D-5": 1, "D-37": 12}'
  - name: Withdrawn
    description: 取り下げた行。タイトルの右に取り下げの札、その後ろに差分のマーカーを置き、行の文字を薄くする。取り下げていない行は変わらない。ホバー・フォーカスの見せ方はほかの行と同じ
    args:
      - name: marks
        value: '{"R-1": "changed"}'
  - name: TagMatchAny
    description: 'タグ「画面」と「保存」をどれかを含むで絞っている。どちらかのタグを持つ行を出し、チップは「タグ（どれかを含む）: {名前}」'
    args:
      - name: filters
        value: '{"tags": ["画面", "保存"]}'
      - name: tagMatch
        value: any
  - name: TagExpr
    description: '簡易で表せないタグの条件（「画面」を含み「廃止」を含まない）で絞った行を受けた。チップの先頭に「タグ: 「画面」を含む かつ 「廃止」を含まない」を出す'
    args:
      - name: tagExprText
        value: '「画面」を含む かつ 「廃止」を含まない'
  - name: SelectableTags
    description: タグの列のタグを押せる。タグを押すと `onSelectTag` だけが呼ばれ、行のタイトルを押したときだけ詳細を開く
  - name: DatetimeColumns
    description: 作成日時・更新日時の列を持つ表。日時のセルは JST の日時を折り返さずに出す
    args:
      - name: columns
        value: 検討事項の列に `created`（作成日時）・`updated`（更新日時）を加えた列
  - name: SortedByUpdatedDesc
    description: 更新日時の新しい順。更新日時の見出しに向きの矢印を出し、`aria-sort="descending"`
    args:
      - name: columns
        value: 検討事項の列に `created`・`updated` を加えた列
      - name: sort
        value: '{"key": "updated", "dir": "desc"}'
  - name: TitleIdMarkers
    description: タイトルに記録にある D-1 と記録に無い D-99 を持つ行。D-1 は点線の下線のマーカーにし、乗せるとタイトルと状態のツールチップを出す。押すとタイトルを押したときと同じく詳細を開く
accessibility:
  - 並べ替え中の列の見出しに `aria-sort`（ascending・descending）を付け、ほかは `none`
  - ピン留めのボタンは `aria-pressed` で押した状態を伝え、`{列}まで固定` の読み上げ名を付ける
  - 'チップの × に `{列}: {値} の条件を解除` の読み上げ名を付ける'
  - 行のタイトルは `button` 要素にし、キーボードで詳細を開ける
  - 操作してもスクロールの位置を保つ
  - 文字の条件のチップの × に `{列}に「{文字}」を含む の条件を解除` の読み上げ名を付ける
  - 列の表示のボタンに「列の表示」の読み上げ名を付け、幅 720px 以下で文言を隠してアイコンだけにしても読み上げ名は残す
  - 行のタイトルの中の ID はマーカーにし、タイトルのボタンの中にフォーカスできる要素を増やさない。タイトルのボタンにフォーカスしたとき、`aria-describedby` で ID の項目・スレッドのタイトルと状態を読み上げ、ツールチップを出す
refs:
  - IF-489-70#
notes:
  組み方: TanStack Table の `useReactTable` に列と行を渡し、shadcn の data-table のガイドの形式（`Table`・`TableHeader`・`TableRow`・`TableCell` の部品と、並べ替え・絞り込み・列の表示・列のピン留めの状態）で組む。並べ替えと絞り込みの状態は使う側が URL の search params から渡し、表は受け取った状態で行を並べて絞る（インターフェース定義『プレビューを開く』の `sort`・`f.{列}`）
uses:
  - component: CMP-649-2#
    how: 表の上の絞り込みの条件のチップ
  - component: CMP-489-16#
    how: タグの列のセル
  - component: CMP-701-1#
    how: 行のタイトルを `mode` を `marker` にして描き、`descriptionId` をタイトルのボタンの `aria-describedby` に指定する

<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- viewport: 計測の表示の幅を Playwright の viewport でそのまま使う -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PoC: ネットワークの 5 つの見た目の描画の重さ</title>
  <style>
    /* 色: 前回の PoC（poc/graph3d/index.html）のライトの値に、見本 style.css の状態の色を足す */
    :root {
      --panel-w: 480px;
      --k-dec: #3f8f7c; --k-task: #5b7fc9; --k-res: #c08a3e; --k-doc: #8a6fc4; --k-term: #5f6873; --k-note: #a48466; --k-log: #b9bec5;
      --g-label: #2a2f36; --g-line: rgba(30, 60, 55, .3); --g-dot: #2f8a74;
      --g-bg: #f1f1ee; --g-bg-center: #fbfbf9;
      --accent: #2f8a74; --surface: #ffffff; --border: #dcdcd6;
      --st-done: #15803d; --st-open: #1d4ed8; --st-review: #b91c1c; --st-hold: #b45309; --st-loose: #6d28d9; --st-off: #71717a;
    }
    /* ダークの色 */
    :root[data-theme="dark"] {
      --k-dec: #7ee0c3; --k-task: #8fb4ff; --k-res: #f5c37a; --k-doc: #c9b2ff; --k-term: #b6bfcc; --k-note: #c7a98d; --k-log: #6f7782;
      --g-label: #e3e6ea; --g-line: rgba(190, 230, 220, .3); --g-dot: #a0f0d7;
      --g-bg: #141417; --g-bg-center: #1e1f24;
      --accent: #7ee0c3; --surface: #1b1c20; --border: #2a2c33;
      --st-done: #4ade80; --st-open: #7aa2ff; --st-review: #f87171; --st-hold: #fbbf24; --st-loose: #c4a7ff; --st-off: #8f8f99;
    }
    /* ページ: 余白なし */
    body { margin: 0; background: var(--g-bg); font-family: "Noto Sans JP", sans-serif; }
    /* 本文: 前回の PoC と同じく、パネルを開くと右の余白を 0.45 秒で広げる */
    .content { padding: 16px; transition: margin-right .45s cubic-bezier(.22, .8, .24, 1); }
    /* 1680px 以上だけ、パネルの分だけ本文を寄せる */
    @media (min-width: 1680px) { body.panel-open .content { margin-right: var(--panel-w); } }
    /* ネットワークの枠: 地は見た目ごとにキャンバスへ描くので、枠は角丸と線だけ */
    .map-frame { border-radius: 16px; overflow: hidden; border: 1px solid var(--border); background: var(--g-bg); }
    /* キャンバス: 前回の PoC と同じく、画面の高さから上の帯の分を引く */
    .g3-wrap { display: block; width: 100%; height: calc(100dvh - 34px); min-height: 460px; cursor: grab; touch-action: none; }
    /* 詳細パネル: 0.45 秒ですべり込む。中身は空 */
    .panel { position: fixed; top: 0; right: 0; bottom: 0; width: var(--panel-w); background: var(--surface); border-left: 1px solid var(--border);
      transform: translateX(102%); visibility: hidden; transition: transform .45s cubic-bezier(.22, .8, .24, 1), visibility 0s linear .45s; }
    /* 開いたパネル */
    .panel.open { transform: none; visibility: visible; transition: transform .45s cubic-bezier(.22, .8, .24, 1); }
  </style>
  <!-- 見本の 5 つの見た目の描き方（tmp/snapshots/issue28-network-2026-10-02/preview/stella.js をそのまま写した） -->
  <script src="stella.js"></script>
</head>
<body>
  <!-- 本文: ネットワークの枠だけを置く -->
  <main class="content">
    <div class="map-frame"><canvas class="g3-wrap" id="fg3"></canvas></div>
  </main>

  <!-- 詳細パネル: 押下で開く。重さだけを測るため中身は持たない -->
  <aside class="panel" id="panel"></aside>

  <script>
    // 計測の条件: ?n=件数&theme=dark|light&look=glow|starlight|constellation|deep|dust
    const Q = new URLSearchParams(location.search);
    const N = Number(Q.get("n") || 1000);
    const LOOK = Q.get("look") || "deep";
    // 文字の画像の解像度: 10px の文字をこの倍で描いておく（前回の PoC で採用した描き方）
    const LABEL_RES = 4;
    document.documentElement.dataset.theme = Q.get("theme") || "dark";
    const S = window.STELLA.styles[LOOK];

    // 合成データ: 前回の PoC と同じ種で同じ形にし、状態と資料の成果物を足す
    const KINDS = ["decisions", "decisions", "decisions", "tasks", "tasks", "research", "docs", "terms", "notes", "logs"];
    const KIND_VAR = { decisions: "--k-dec", tasks: "--k-task", research: "--k-res", docs: "--k-doc", terms: "--k-term", notes: "--k-note", logs: "--k-log" };
    const STATUSES = { decisions: ["決定済み", "未決定", "要見直し", "保留", "未整理"], tasks: ["未着手", "進行中", "保留"], docs: ["未着手", "進行中", "決定済み"] };
    const LINK_TYPES = ["dep", "rel", "src", "for"];
    let seed = 20261002;
    const rand = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
    const WORDS = "検討事項の決め方と画面の構成を見直す保存先の形式つながりの描画プレビューの書き出し用語集の呼び名";
    const items = Array.from({ length: N }, (_, i) => {
      const len = 8 + Math.floor(rand() * 18), at = Math.floor(rand() * (WORDS.length - len));
      const kind = KINDS[i % KINDS.length], st = STATUSES[kind];
      return { id: `X-${i + 1}`, kind, title: WORDS.slice(at, at + len), status: st ? st[i % st.length] : null, deliverable: kind === "docs" && i % 3 === 0 };
    });
    const linksRaw = [];
    for (let i = 0; i < N * 2; i++) {
      const a = Math.floor(rand() * N); let b = Math.floor(rand() * N);
      if (a === b) b = (b + 1) % N;
      linksRaw.push({ a: items[a].id, b: items[b].id, type: LINK_TYPES[i % LINK_TYPES.length] });
    }

    // 計測: 記録中だけ、コマの間隔・1 コマの処理時間・長いタスクをためる
    const M = { rec: false, intervals: [], work: [], longtasks: [], last: 0 };
    window.__startRec = () => { M.rec = true; M.intervals = []; M.work = []; M.longtasks = []; M.last = 0; };
    window.__stopRec = () => { M.rec = false; return { intervals: M.intervals, work: M.work, longtasks: M.longtasks }; };
    new PerformanceObserver((list) => { if (M.rec) for (const e of list.getEntries()) M.longtasks.push(e.duration); }).observe({ type: "longtask", buffered: false });

    const css = (k) => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
    const FONT_N = '400 10px "JetBrains Mono", "Noto Sans JP", monospace';
    const FONT_B = '500 10px "JetBrains Mono", "Noto Sans JP", monospace';
    const state = { panel: null, lock: null };
    let G = null;

    // 文字の画像: 玉ごと・太さと色ごとに 1 回だけ描いて取っておく（前回の PoC と同じ）
    const labelCache = new Map();
    const labelImage = (n, bold, color) => {
      const key = `${n.id}|${bold}|${color}`;
      let img = labelCache.get(key);
      if (img) return img;
      const font = (bold ? FONT_B : FONT_N).replace("10px", `${10 * LABEL_RES}px`);
      const probe = document.createElement("canvas").getContext("2d");
      probe.font = font; probe.letterSpacing = `${0.8 * LABEL_RES}px`;
      img = document.createElement("canvas");
      img.width = Math.ceil(probe.measureText(n.label).width) + 2 * LABEL_RES;
      img.height = 14 * LABEL_RES;
      const c = img.getContext("2d");
      c.font = font; c.letterSpacing = `${0.8 * LABEL_RES}px`; c.fillStyle = color;
      c.textAlign = "center"; c.textBaseline = "bottom";
      c.fillText(n.label, img.width / 2, img.height);
      labelCache.set(key, img);
      return img;
    };

    // ===== 状態の印と鍵: 見本 app.js の MARKS・markImg・drawMarks・lockIcon・drawLock を写す =====
    const MARKS = {
      "決定済み": '<circle cx="5" cy="5" r="4.5" fill="var(--st-done)"/>',
      "未決定": '<circle cx="5" cy="5" r="3.8" fill="none" stroke="var(--st-open)" stroke-width="1.6"/>',
      "未着手": '<circle cx="5" cy="5" r="3.8" fill="none" stroke="var(--st-off)" stroke-width="1.6"/>',
      "進行中": '<circle cx="5" cy="5" r="3.8" fill="none" stroke="var(--st-open)" stroke-width="1.6"/><path d="M5 1.2a3.8 3.8 0 0 1 0 7.6Z" fill="var(--st-open)"/>',
      "要見直し": '<path d="M5 .3 9.7 5 5 9.7.3 5Z" fill="var(--st-review)"/>',
      "保留": '<rect x="1.2" y="1" width="2.6" height="8" fill="var(--st-hold)"/><rect x="6.2" y="1" width="2.6" height="8" fill="var(--st-hold)"/>',
      "未整理": '<circle cx="5" cy="5" r="3.8" fill="none" stroke="var(--st-loose)" stroke-width="1.6" stroke-dasharray="2 1.6"/>',
    };
    const BOX = '<path d="M3 7l9-4 9 4v10l-9 4-9-4Z"/><path d="M3 7l9 4 9-4M12 11v10"/>';
    const SHAKE_MS = 900;        // 鍵が震える時間
    const SHAKE_COLOR = "#ef4444";
    const LOCK_PATH = new Path2D("M7 11V7a5 5 0 0 1 10 0v4");
    const UNLOCK_PATH = new Path2D("M7 11V7a5 5 0 0 1 9.9-1");
    /** 鍵のマーク（24 の枠の線画）を、中心と一辺を指定して描く */
    const lockIcon = (ctx, x, y, size, locked, color, alpha, swing = 0) => {
      ctx.save();
      ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.translate(x, y - size / 2); ctx.rotate(swing); ctx.translate(-size / 2, 0); ctx.scale(size / 24, size / 24);
      ctx.beginPath(); ctx.roundRect(3, 11, 18, 11, 2); ctx.stroke();
      ctx.stroke(locked ? LOCK_PATH : UNLOCK_PATH);
      ctx.restore();
    };
    const markImgs = new Map();
    /** 状態の印を、今の配色で絵にして返す。読み込み中は null */
    const markImg = (key, svg) => {
      if (!markImgs.has(key)) {
        const im = new Image();
        im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace(/var\((--[\w-]+)\)/g, (_, v) => css(v)));
        markImgs.set(key, im);
      }
      const im = markImgs.get(key);
      return im.complete && im.naturalWidth ? im : null;
    };
    /** 注目しているときだけ、起点とつながる項目の名前の左に状態の印を出す */
    const drawMarks = (e) => {
      if (!e.sel) return;
      const { ctx } = e;
      for (const d of e.nodes) {
        if (!e.near.has(d.n.id) || !d.labelW) continue;
        const it = d.n.it;
        const img = it.deliverable
          ? markImg("deliv", `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="${e.C.ring}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${BOX}</svg>`)
          : MARKS[it.status] ? markImg(it.status, `<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -1 12 12" width="24" height="24">${MARKS[it.status]}</svg>`) : null;
        if (!img) continue;
        const size = d.labelFs * 0.8, x = d.p.sx - d.labelW / 2 - d.labelFs * 0.4 - size / 2, y = d.labelY;
        ctx.globalAlpha = d.labelA; ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
      }
    };
    /** 鍵を名前の右に置く。ロックした項目の閉じた鍵はいつも出す */
    const drawLock = (e) => {
      const { ctx, nodes, C } = e;
      const target = nodes.find((d) => d.n.id === state.lock) ?? (state.lock ? null : nodes.find((d) => d.n.id === state.panel));
      if (!target) return;
      const locked = target.n.id === state.lock, size = 12, badge = !target.labelW;
      const x = badge ? target.p.sx + target.rad * 0.8 + 8 : target.p.sx + target.labelW / 2 + 9;
      const y = badge ? target.p.sy - target.rad * 0.8 - 8 : target.labelY;
      if (!locked && G.hover !== target.n) return;
      const el = e.now - (G.lockShake ?? -Infinity), shaking = locked && el < SHAKE_MS;
      const decay = shaking ? 1 - el / SHAKE_MS : 0, wave = shaking ? Math.sin((el / SHAKE_MS) * Math.PI * 10) : 0;
      const sx = x + wave * 6 * decay;
      const color = shaking ? SHAKE_COLOR : locked ? C.ring : C.label;
      if (shaking) { ctx.globalAlpha = 0.55 * decay; ctx.drawImage(window.STELLA.glow(SHAKE_COLOR, 2), sx - 22, y - 22, 44, 44); }
      if (badge) {
        ctx.globalAlpha = locked ? 0.95 : 0.6; ctx.fillStyle = e.dark ? "#0b0d14" : "#ffffff";
        ctx.beginPath(); ctx.arc(sx, y, size * 0.85, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.stroke();
      }
      lockIcon(ctx, sx, y, size * (1 + 0.45 * decay), locked, color, locked ? 0.95 : 0.45, wave * 0.45 * decay);
    };

    // グラフの組み立て: 前回の PoC と同じ（黄金角の螺旋で球面に散らす）
    const buildGraph3 = () => {
      const nodes = items.map((it, i, arr) => {
        const t = (i + 0.5) / arr.length, phi = Math.acos(1 - 2 * t), th = Math.PI * (1 + Math.sqrt(5)) * i;
        return { id: it.id, kind: it.kind, it, x: 120 * Math.sin(phi) * Math.cos(th), y: 120 * Math.cos(phi), z: 120 * Math.sin(phi) * Math.sin(th), vx: 0, vy: 0, vz: 0, deg: 0,
          p: { sx: 0, sy: 0, f: 0, z: 0 }, seed: window.STELLA.hash(it.id) };
      });
      const idx = new Map(nodes.map((n, i) => [n.id, i]));
      const links = linksRaw.map((l) => ({ ...l, s: nodes[idx.get(l.a)], t: nodes[idx.get(l.b)] }));
      for (const l of links) { l.s.deg++; l.t.deg++; }
      for (const n of nodes) { n.r = 4 + Math.sqrt(n.deg) * 2.2; n.label = n.it.title.length > 22 ? n.it.title.slice(0, 21) + "…" : n.it.title; }
      return {
        nodes, idx, links, order: [...nodes],
        rot: { yaw: 0.6, pitch: -0.25, yawT: 0.6, pitchT: -0.25, vy: 0, vp: 0 },
        dist: 520, distT: 520, center: { x: 0, y: 0, z: 0 }, centerT: { x: 0, y: 0, z: 0 },
        born: performance.now(), lastInput: 0, hover: null, focus: null, alpha: 1,
      };
    };

    // 力学の 1 歩: 前回の PoC と同じ（落ち着くと止まる）
    const stepForces = (g) => {
      const ns = g.nodes, sel = g.focus;
      if (g.alpha < 0.004) return;
      for (let i = 0; i < ns.length; i++) for (let j = i + 1; j < ns.length; j++) {
        const a = ns[i], b = ns[j]; let dx = a.x - b.x, dy = a.y - b.y, dz = a.z - b.z;
        const d2 = dx * dx + dy * dy + dz * dz + 1, f = (4400 / d2) * g.alpha;
        dx *= f; dy *= f; dz *= f; a.vx += dx; a.vy += dy; a.vz += dz; b.vx -= dx; b.vy -= dy; b.vz -= dz;
      }
      for (const l of g.links) {
        const near = sel && (l.a === sel || l.b === sel);
        const want = near ? 48 : l.type === "dep" ? 84 : l.type === "rel" ? 140 : 110;
        let dx = l.t.x - l.s.x, dy = l.t.y - l.s.y, dz = l.t.z - l.s.z;
        const d = Math.sqrt(dx * dx + dy * dy + dz * dz) || 1, k = ((d - want) / d) * (near ? 0.018 : 0.03) * g.alpha;
        dx *= k; dy *= k; dz *= k;
        if (l.a !== sel) { l.s.vx += dx; l.s.vy += dy; l.s.vz += dz; }
        if (l.b !== sel) { l.t.vx -= dx; l.t.vy -= dy; l.t.vz -= dz; }
      }
      for (const n of ns) {
        if (n.id === sel) { n.vx = n.vy = n.vz = 0; continue; }
        n.vx -= n.x * 0.012 * g.alpha; n.vy -= n.y * 0.012 * g.alpha; n.vz -= n.z * 0.012 * g.alpha;
        n.vx *= 0.9; n.vy *= 0.9; n.vz *= 0.9; n.x += n.vx * 0.28; n.y += n.vy * 0.28; n.z += n.vz * 0.28;
      }
      g.alpha *= 0.994;
    };

    const setFocus = (id, strong = false) => {
      if (!G || G.focus === id) return;
      G.focus = id;
      G.alpha = Math.max(G.alpha, strong ? 0.2 : 0.1);
    };
    /** 注目の起点の ID（ロックしていればロックした項目、無ければ詳細を開いている項目） */
    const anchorId = () => (state.lock && G?.idx.has(state.lock) ? state.lock : state.panel);
    const graphSelect = () => {
      const n = G.nodes[G.idx.get(anchorId())];
      setFocus(n ? n.id : G.hover?.id ?? null, !!n);
      G.distT = n ? G.fit * 0.38 : G.fit;
      if (!n) G.centerT = { x: 0, y: 0, z: 0 };
    };
    const openPanel = (id) => { state.panel = id; document.getElementById("panel").classList.add("open"); document.body.classList.add("panel-open"); graphSelect(); };
    const closePanel = () => { state.panel = null; document.getElementById("panel").classList.remove("open"); document.body.classList.remove("panel-open"); graphSelect(); };

    const drawGraph3 = () => {
      const cv = document.getElementById("fg3");
      G = buildGraph3();
      for (let i = 0; i < 260; i++) stepForces(G);
      G.alpha = 0.06;
      const radii = G.nodes.map((n) => Math.hypot(n.x, n.y, n.z)).sort((a, b) => a - b);
      const R = Math.max(40, radii[Math.floor(radii.length * 0.9)] || 40);
      G.fit = G.dist = G.distT = ((700 * R) / (Math.min(cv.clientWidth, cv.clientHeight) * 0.42) + R * 0.4) * 0.72;
      G.colors = { kind: Object.fromEntries(Object.entries(KIND_VAR).map(([k, x]) => [k, css(x)])), label: css("--g-label"), line: css("--g-line"), dot: css("--g-dot"), ring: css("--accent") };
      const ctx = cv.getContext("2d");
      let W = 0, H = 0, dpr = 1;
      const resize = () => { dpr = Math.min(2, devicePixelRatio || 1); W = cv.clientWidth; H = cv.clientHeight; cv.width = W * dpr; cv.height = H * dpr; };
      resize(); new ResizeObserver(resize).observe(cv);
      const f0 = () => 700 / G.fit;
      // 投影: out を渡すと使い回し、渡さなければ新しく作る（見た目の描き方が地の点・網に使う）
      const proj = (n, out) => {
        const c = G.center, x = n.x - c.x, y = n.y - c.y, z = n.z - c.z;
        const cy = Math.cos(G.rot.yaw), sy = Math.sin(G.rot.yaw), cp = Math.cos(G.rot.pitch), sp = Math.sin(G.rot.pitch);
        const x1 = x * cy - z * sy, z1 = x * sy + z * cy, y1 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
        const f = 700 / (z2 + G.dist);
        const o = out || {};
        o.sx = W / 2 + x1 * f; o.sy = H / 2 + y1 * f; o.f = f; o.z = z2;
        return o;
      };
      // 天球の向き: 中心を引かずに回転だけをかける（遠くの星・星図の線に使う）
      const rot = (x, y, z) => {
        const cy = Math.cos(G.rot.yaw), sy = Math.sin(G.rot.yaw), cp = Math.cos(G.rot.pitch), sp = Math.sin(G.rot.pitch);
        const x1 = x * cy - z * sy, z1 = x * sy + z * cy;
        return { x: x1, y: y * cp - z1 * sp, z: y * sp + z1 * cp };
      };
      const screenToWorld = (dx, dy) => {
        const cy = Math.cos(G.rot.yaw), sy = Math.sin(G.rot.yaw), cp = Math.cos(G.rot.pitch), sp = Math.sin(G.rot.pitch);
        const y = dy * cp, z1 = -dy * sp;
        return { x: dx * cy + z1 * sy, y, z: -dx * sy + z1 * cy };
      };
      const radOf = (n, p) => n.r * 1.05 * (p.f / f0());
      const onScreen = (x, y, m) => x > -m && y > -m && x < W + m && y < H + m;
      const hit = (x, y) => {
        let best = null, bd = 1e9;
        for (const n of G.nodes) { const p = proj(n); if (p.z + G.dist <= 10) continue; if (Math.hypot(p.sx - x, p.sy - y) < Math.max(8, radOf(n, p)) + 4 && p.z < bd) { best = n; bd = p.z; } }
        return best;
      };
      // 計測の操作が押す玉: 画面の中心に近く、手前にある玉の画面の座標を返す（前回の PoC と同じ）
      window.__pickNode = (skip) => {
        const r = cv.getBoundingClientRect();
        let best = null, bd = 1e9;
        for (const n of G.nodes) {
          if (n.id === skip) continue;
          const p = proj(n);
          if (p.z + G.dist <= 10) continue;
          const d = Math.hypot(p.sx - W / 2, p.sy - H / 2) + p.z * 0.1;
          if (d < bd) { bd = d; best = { id: n.id, x: r.left + p.sx, y: r.top + p.sy }; }
        }
        return best;
      };
      // 計測の操作が使う: つながりの多い玉の詳細を開いてロックする / ロックを外して詳細を閉じる / 鍵を震わせる
      window.__lockNode = () => {
        const n = [...G.nodes].sort((a, b) => b.deg - a.deg)[0];
        openPanel(n.id); state.lock = n.id; graphSelect();
        return n.id;
      };
      window.__unlock = () => { state.lock = null; closePanel(); };
      window.__shake = () => { G.lockShake = performance.now(); };

      // 操作: 見本と同じ（ドラッグで回す・押して開く・ホイールで寄る）。ロック中の押下は見本の app.js と同じ扱い
      let drag = null, moved = 0;
      cv.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, t: performance.now() }; moved = 0; cv.setPointerCapture(e.pointerId); G.lastInput = performance.now(); G.rot.vy = G.rot.vp = 0; };
      cv.onpointermove = (e) => {
        const r = cv.getBoundingClientRect();
        if (drag) {
          const dx = e.clientX - drag.x, dy = e.clientY - drag.y, now = performance.now(), dt = Math.max(8, now - drag.t);
          moved += Math.abs(dx) + Math.abs(dy);
          G.rot.yawT += dx * 0.0032; G.rot.pitchT = Math.max(-1.3, Math.min(1.3, G.rot.pitchT + dy * 0.0032));
          G.rot.vy = (dx * 0.0032) * (16 / dt); G.rot.vp = (dy * 0.0032) * (16 / dt);
          drag = { x: e.clientX, y: e.clientY, t: now }; G.lastInput = now;
          return;
        }
        const h = hit(e.clientX - r.left, e.clientY - r.top);
        if (h !== G.hover) { G.hover = h; if (!anchorId()) setFocus(h ? h.id : null); }
      };
      cv.onpointerup = (e) => {
        const r = cv.getBoundingClientRect();
        if (drag && moved < 5) {
          const h = hit(e.clientX - r.left, e.clientY - r.top), now = performance.now();
          if (h && state.lock) { if (h.id === state.lock) { if (state.panel === h.id) { state.lock = null; graphSelect(); } else openPanel(h.id); } else if (h.id === state.panel) G.lockShake = now; else openPanel(h.id); }
          else if (h) openPanel(h.id);
          else if (state.lock) G.lockShake = now;
          else if (state.panel) closePanel();
        }
        if (drag && performance.now() - drag.t > 80) G.rot.vy = G.rot.vp = 0;
        drag = null;
      };
      cv.onwheel = (e) => {
        e.preventDefault();
        const r = cv.getBoundingClientRect(), mx = e.clientX - r.left - W / 2, my = e.clientY - r.top - H / 2;
        const old = G.distT, next = Math.max(G.fit * 0.15, Math.min(G.fit * 2.5, old * Math.exp(e.deltaY * 0.0016)));
        if (!anchorId()) {
          const f = 700 / old, w = screenToWorld((mx / f) * (1 - next / old), (my / f) * (1 - next / old));
          G.centerT = { x: G.centerT.x + w.x, y: G.centerT.y + w.y, z: G.centerT.z + w.z };
        }
        G.distT = next; G.lastInput = performance.now();
        const lim = G.fit * 0.35, m = Math.hypot(G.centerT.x, G.centerT.y, G.centerT.z);
        if (m > lim) G.centerT = { x: (G.centerT.x * lim) / m, y: (G.centerT.y * lim) / m, z: (G.centerT.z * lim) / m };
        if (next >= G.fit * 0.95 && !anchorId()) G.centerT = { x: 0, y: 0, z: 0 };
      };

      // 1 コマ: 投影と並べ替えは前回の PoC で採用した使い回し、描画は見本の見た目の draw に渡す
      const near = new Set();
      const tmp = { x: 0, y: 0, z: 0 };
      const links = [], selLinks = [], nodes = [];
      const frame = (now) => {
        const t0 = performance.now();
        if (M.rec) { if (M.last) M.intervals.push(now - M.last); M.last = now; }
        stepForces(G);
        const R0 = G.rot;
        if (!drag) {
          R0.yawT += R0.vy; R0.pitchT = Math.max(-1.3, Math.min(1.3, R0.pitchT + R0.vp));
          R0.vy *= 0.955; R0.vp *= 0.93;
          if (now - G.lastInput > 2500 && !G.hover) R0.yawT += 0.00018;
        }
        R0.yaw += (R0.yawT - R0.yaw) * 0.07; R0.pitch += (R0.pitchT - R0.pitch) * 0.07;
        const n0 = G.nodes[G.idx.get(anchorId())];
        if (n0) G.centerT = { x: n0.x, y: n0.y, z: n0.z };
        for (const k of ["x", "y", "z"]) G.center[k] += (G.centerT[k] - G.center[k]) * 0.025;
        G.dist += (G.distT - G.dist) * 0.04;
        const born = Math.min(1, (now - G.born) / 1400), ease = 1 - Math.pow(1 - born, 3);
        const sel = G.focus && G.idx.has(G.focus) ? G.focus : null;
        near.clear();
        if (sel) { near.add(sel); for (const l of G.links) { if (l.a === sel) near.add(l.b); if (l.b === sel) near.add(l.a); } }
        const C = G.colors, k0 = f0();
        const dark = document.documentElement.dataset.theme === "dark";
        for (const n of G.nodes) { tmp.x = n.x * ease + G.center.x * (1 - ease); tmp.y = n.y * ease + G.center.y * (1 - ease); tmp.z = n.z * ease + G.center.z * (1 - ease); proj(tmp, n.p); }
        // 線: 画面に入るものだけを、奥行きの濃さつきで渡す（見本の frame と同じ中身。入れ物は線ごとに使い回す）
        links.length = 0;
        for (const l of G.links) {
          const a = l.s.p, b = l.t.p;
          if (a.z + G.dist <= 10 || b.z + G.dist <= 10) continue;
          if ((a.sx < 0 && b.sx < 0) || (a.sx > W && b.sx > W) || (a.sy < 0 && b.sy < 0) || (a.sy > H && b.sy > H)) continue;
          const k = l.k ??= { l, a, b, ca: C.kind[l.s.kind], cb: C.kind[l.t.kind] };
          k.dep = Math.max(0, Math.min(1, 1.25 - ((a.z + b.z) / 2 + G.dist) / (G.dist * 2.2)));
          k.fade = Math.min(l.s.fade ?? 1, l.t.fade ?? 1);
          links.push(k);
        }
        selLinks.length = 0;
        if (sel) for (const l of G.links) {
          if (l.a !== sel && l.b !== sel) continue;
          const other = l.a === sel ? l.t : l.s, self = l.a === sel ? l.s : l.t;
          if (self.p.z + G.dist <= 10 || other.p.z + G.dist <= 10) continue;
          selLinks.push({ l, from: self.p, to: other.p, other, cf: C.kind[self.kind], ct: C.kind[other.kind] });
        }
        // 玉: 奥から順に、大きさ・濃さ・沈み具合を計算して渡す（入れ物は玉ごとに使い回す）
        nodes.length = 0;
        for (const n of G.order.sort((a, b) => b.p.z - a.p.z)) {
          const p = n.p;
          if (p.z + G.dist <= 10) continue;
          const r0 = radOf(n, p);
          if (!onScreen(p.sx, p.sy, r0 * 6 + 40) || r0 > Math.max(W, H)) continue;
          const depth = Math.max(0.15, Math.min(1, 1.25 - (p.z + G.dist) / (G.dist * 2.2)));
          n.fade ??= 1;
          n.fade += ((sel && !near.has(n.id) && n.id !== state.panel ? 0.18 : 1) - n.fade) * 0.03;
          const rad = Math.max(1.2, r0 * ease);
          const close = Math.min(1, Math.max(0, ((p.z + G.dist) / G.dist - 0.08) / 0.2));
          if (close <= 0.02) continue;
          const d = n.d ??= { n, p, color: C.kind[n.kind], seed: n.seed };
          d.depth = depth; d.dim = n.fade; d.rad = rad; d.close = close;
          d.strong = near.has(n.id) || n === G.hover; d.selected = n.id === state.panel; d.hover = n === G.hover;
          d.labelW = 0;
          nodes.push(d);
        }
        const env = { ctx, W, H, dpr, now, dark, C, G, sel, near, k0, ease, rot, proj, links, selLinks, nodes };

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalCompositeOperation = "source-over";
        ctx.clearRect(0, 0, W, H);
        S.draw(env);
        ctx.globalCompositeOperation = "source-over";
        // 名前: どの見た目でも同じ規則で玉の上に置く。文字は一度だけ画像に描き、毎コマは置くだけ
        for (const d of nodes) {
          const { n, p, depth, dim, rad, close, strong } = d;
          const sc = p.f / k0, fs = 4.6 * sc;
          const la = (strong ? 0.85 : 0.42 * dim) * Math.pow(depth, 1.4) * Math.max(0, Math.min(1, (fs - 3.5) / 2.5));
          if (la > 0.03 && ease > 0.9 && onScreen(p.sx, p.sy - rad, 400)) {
            ctx.globalAlpha = la * close;
            const bold = n.id === state.panel || n === G.hover;
            const color = n.id === state.panel ? C.ring : (S.labelColor?.(env, d) ?? C.label);
            const img = labelImage(n, bold, color);
            const lift = rad * (S.labelLift ?? 1) + 3 * sc;
            const k = (dpr * fs / 10) / LABEL_RES;
            ctx.setTransform(k, 0, 0, k, dpr * p.sx, dpr * (p.sy - lift));
            ctx.drawImage(img, -img.width / 2, -img.height);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            d.labelW = (img.width / LABEL_RES) * fs / 10; d.labelFs = fs; d.labelA = la * close; d.labelY = p.sy - lift - fs / 2;
          }
        }
        drawMarks(env);
        drawLock(env);
        ctx.globalAlpha = 1;
        if (M.rec) M.work.push(performance.now() - t0);
        requestAnimationFrame(frame);
      };
      requestAnimationFrame(frame);
    };
    drawGraph3();
  </script>

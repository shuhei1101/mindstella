<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: スマホ幅でも等倍で開く（拡大は禁止しない） -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ネットワークの見た目の選び | mindstella 部品のモック</title>
  <!-- 文字: デザイン方針の Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <!-- トークンと、画面のモックと同じスタイル -->
  <link rel="stylesheet" href="../../../../plugins/mindstella/skills/mindmap/preview/tokens.css">
  <link rel="stylesheet" href="../../refs/65/assets/style.css">
  <!-- 見た目の選びの分 -->
  <link rel="stylesheet" href="../../refs/123/assets/style.css">
  <style>
    /* カタログの節: 状態ごとの案を縦に並べる */
    .cat-sec { margin-top: 32px; }
    /* カタログの節の見出し */
    .cat-sec > h2 { margin: 0 0 4px; font-size: 1rem; }
    /* 状態の説明 */
    .cat-sec > p { margin: 0 0 12px; color: var(--text-2); font-size: var(--fs-small); }
    /* 部品を置く台: ネットワークの枠の右上の角だけを切り出す */
    .stage { position: relative; height: 120px; border: 1px dashed var(--border); border-radius: var(--radius); overflow: hidden; }
    /* 台の地: プレビューの地（グロウ・星の光・星図の昼） */
    .stage.light { background: #f1f1ee; }
    /* 台の地: 深宇宙の夜の地 */
    .stage.deep-dark { background: radial-gradient(ellipse at 40% 60%, #0d1428 0%, #070a16 60%, #030409 100%); }
    /* 台の地: 深宇宙の昼の地 */
    .stage.deep-light { background: linear-gradient(#e8edf8, #f3f1f6 55%, #f8f4ec); }
    /* 台の地: 星屑の夜の地 */
    .stage.dust-dark { background: radial-gradient(#101114, #060607); }
    /* ダークの台の上の選び: ダークのときの面・文字・枠の色にする */
    .stage.deep-dark select, .stage.dust-dark select { background-color: var(--ink-100); color: var(--ink-900); border-color: var(--ink-400); }
    /* 狭い幅の見本 */
    .stage.narrow { width: 390px; max-width: 100%; }
    /* 開いた一覧の見本: 5 つの選択肢を並べた高さにする */
    .stage.tall { height: 200px; }
    /* 開いた一覧の見本の本体: 高さを選択肢の行に任せる */
    .stage.tall select { height: auto; padding: 4px; }
    /* 状態を見せるための見本のクラス */
    .is-hover select { border-color: var(--text-3); }
    .is-focus select { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="content">
    <!-- パンくず -->
    <nav class="crumbs" aria-label="パンくず"><a href="../index.md">components</a> / look-pick</nav>
    <h1 style="margin: 0; font-size: var(--fs-h1); letter-spacing: -.02em;">ネットワークの見た目の選び</h1>
    <!-- 状態ごとの見本: 下のスクリプトが中身を描く -->
    <div id="catalog"></div>
  </main>
  <!-- 見本の描き分け: 選びの HTML は画面のモック（refs/123/assets/app.js の renderGraphTab）と同じ形 -->
  <script>
    addEventListener("DOMContentLoaded", () => {
      const LOOKS = [["glow", "グロウ"], ["starlight", "星の光"], ["constellation", "星図"], ["deep", "深宇宙"], ["dust", "星屑"]];
      // def: ワークスペースの既定の見た目。選択肢の名前に「既定」を添える
      const pick = (cur, cls, size, def = "deep") => `<label class="look-pick ${cls}"><span class="sr-only">ネットワークの見た目</span><select${size ? ` size="${size}"` : ""}>${LOOKS.map(([k, l]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${l}${k === def ? "（既定）" : ""}</option>`).join("")}</select></label>`;
      // [見出し, 説明, 台のクラス, 選んでいる見た目, 選びのクラス, 一覧の行数, ワークスペースの既定の見た目]
      const DEMOS = [
        ["既定（深宇宙・ダーク）", "キャンバスの右上に、アイコンの無いドロップダウンを置く。どの地の上でも面の色で塗って読めるようにする。ワークスペースの既定の見た目には「既定」を添える。", "deep-dark", "deep", "", 0],
        ["深宇宙・ライト", "昼の地でも同じ形・同じ高さで置く。", "deep-light", "deep", "", 0],
        ["グロウ・ライト", "グロウ・星の光・星図はプレビューの地の上に描く。", "light", "glow", "", 0],
        ["星屑・ダーク", "星屑は自分で無彩色の地を塗る。", "dust-dark", "dust", "", 0],
        ["ホバー", "枠の色を濃くする。", "light", "deep", "is-hover", 0],
        ["フォーカス", "キーボードで移ったときに印の色の枠を出す。", "light", "deep", "is-focus", 0],
        ["開いている", "5 つの見た目を名前で並べる。選ぶと個人の上書きを書き、その場で描き方が変わる。見た目はここだけで選ぶ。", "light tall", "starlight", "", 5],
        ["ワークスペースの既定が別の見た目", "既定が星の光のワークスペース。「既定」は星の光に付く。", "light tall", "dust", "", 5, "starlight"],
        ["狭い幅（390px）", "枠の右上に同じ大きさで置く。", "deep-dark narrow", "deep", "", 0],
      ];
      document.getElementById("catalog").innerHTML = DEMOS.map(([h, p, stage, cur, cls, size, def]) =>
        `<section class="cat-sec"><h2>${h}</h2><p>${p}</p><div class="stage ${stage}">${pick(cur, cls, size, def)}</div></section>`).join("");
    });
  </script>
</body>
</html>

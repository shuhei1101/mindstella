    .is-focus { outline: 2px solid var(--accent-line); outline-offset: 2px; }

span class="count">18</span></a><a class="tab" href="#tab=research" data-tab="research"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"></circle><path d="m15 15 5 5"></path><path d="M8 10.5h5"></path></svg>調査<span class="count">2</span></a><a class="tab" href="#tab=docs" data-tab="docs"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6Z"></path><path d="M14 3v4h4"></path></svg>資料<span class="count">16</span></a><a class="tab" href="#tab=terms" data-tab="terms"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3Z"></path><path d="M4 17a3 3 0 0 1 3-3h11"></path></svg>用語集<span class="count">6</span></a><a class="tab" href="#tab=notes" data-tab="notes"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12l-4 4H5Z"></path><path d="M15 20v-4h4"></path></svg>メモ<span class="count">5</span></a><a class="tab" href="#tab=logs" data-tab="logs"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v10H9l-5 4Z"></path></svg>会話ログ<span class="count">12</span></a><span class="tab-gap"></span><a class="tab tab-special" href="#tab=graph" data-tab="graph"><svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18.5 10 13.5l5 3M10 13.5 7.5 6.5M15 16.5l3.2-6.6" stroke-width="1.15"></path><circle cx="4" cy="18.5" r="2" fill="currentColor" stroke="none"></circle><circle cx="10" cy="13.5" r="2.2" fill="currentColor" stroke="none"></circle><circle cx="15" cy="16.5" r="1.8" fill="currentColor" stroke="none"></circle><circle cx="7.5" cy="6.5" r="1.8" fill="currentColor" stroke="none"></circle><path d="m19 1.8 1.05 3.15L23.2 6l-3.15 1.05L19 10.2l-1.05-3.15L14.8 6l3.15-1.05Z" fill="currentColor" stroke="none"></path></svg>ネットワーク</a></nav></div>
  <!-- 見本の状態: count 件数 / blocked=1 書き込めない編集あり / open=1 保存待ちのパネルを開いている / save=b 保存のボタンを並べる案 / hover・focus / theme=dark -->
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      if (params.get("theme") === "dark") document.documentElement.dataset.theme = "dark";
      const button = document.querySelector(".pending-btn");
      const count = params.get("count") ?? "5";
      button.querySelector(".count").textContent = count;
      button.setAttribute("aria-label", `保存待ち（${count} 件）`);
      if (params.get("blocked") === "1") {
        button.classList.add("blocked");
        button.querySelector(".pb-icon").innerHTML = '<svg class="icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4 2.5 20h19Z"></path><path d="M12 10v4M12 17v.5"></path></svg>';
      }
      if (params.get("open") === "1") button.classList.add("open");
      if (params.get("save") !== "b") document.querySelector(".pending-save-btn")?.remove();
      if (params.get("hover") === "1") button.classList.add("is-hover");
      if (params.get("focus") === "1") button.classList.add("is-focus");
    })();
  </script>
</body>
</html>

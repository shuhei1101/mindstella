<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- viewport: 埋め込んだ枠の幅をそのまま画面幅にして、実装の @media を効かせる -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>トップバーの見本の枠 | mindstella 部品のモック</title>
  <!-- 文字: デザイン方針の Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
  <!-- 実装のトークンとスタイルをそのまま読む -->
  <link rel="stylesheet" href="../../../../plugins/mindstella/skills/mindmap/preview/tokens.css">
  <link rel="stylesheet" href="../../../../plugins/mindstella/skills/mindmap/preview/style.css">
  <!-- 押せる的の下限: 実装の style.css に足す規則。?plan=current のとき外して今の見た目を出す -->
  <style id="plan-a">
    /* 狭い幅（389px 以下）: 表示の設定・絞り込み・コメントのボタンを、件数の札を持たない間も幅 --target-min 以上にし、印を中央に置く */
    @media (max-width: 389px) {
      .topbar :is(.comments-btn, .filter-btn, .settings-btn) { min-width: var(--target-min); justify-content: center; }
      /* つながらない・差分ありの間: 印だけのボタン（検索・変更履歴・ライト / ダーク）を幅 26px にし、下限で広がった分を右の余白から取らない */
      .topbar:has(.conn):has(.df-chip) :is(.search-trigger, .top-btn, .hist-btn) { width: 26px; }
    }
    /* 幅 390〜480px で件数の札が幅の広い中身の詰め方が効く間: 表示の設定・絞り込み・コメントのボタンを幅 --target-min 以上にし、印を中央に置く */
    @media (min-width: 390px) and (max-width: 480px) {
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) :is(.comments-btn, .filter-btn, .settings-btn) { min-width: var(--target-min); justify-content: center; }
    }
  </style>
  <!-- 幅 390px 以上の最大の中身の畳み方: ?fit=a〜d のときだけ効かせる。指定が無ければ今の実装の見た目 -->
  <style id="fit-a" media="not all">
    /* 案 A: 幅 389px 以下の詰め方を効かせる境を 400px へ上げる。はみ出す組み合わせ（差分の札か接続の状態を出している間）だけに効かせ、つながる・差分なしは今のまま */
    @media (min-width: 390px) and (max-width: 400px) {
      .topbar:is(:has(.df-chip), :has(.conn)) .brand-name, .topbar:has(.df-chip) .brand { display: none; }
      .topbar:is(:has(.df-chip), :has(.conn)), .topbar:has(.conn):has(.df-chip) { gap: 1px; padding: 0 8px; }
      .topbar:is(:has(.df-chip), :has(.conn)) :is(.search-trigger, .top-btn, .hist-btn) { flex: none; width: 28px; }
      .topbar:is(:has(.df-chip), :has(.conn)) :is(.comments-btn, .filter-btn, .settings-btn), .topbar:has(.conn):has(.df-chip) .settings-btn { gap: 2px; padding: 0 2px; }
    }
  </style>
  <style id="fit-b" media="not all">
    /* 案 B: 幅 480px 以下で、収まらない分だけを縮む要素が受け止める。収まる中身では何も縮まず、見た目は今と同じ */
    @media (min-width: 390px) and (max-width: 480px) {
      /* 差分の札: 名前を先に縮める。札が 5.5em に届くまでボタンは縮まない */
      .topbar .df-chip { flex-shrink: 10000; }
      /* 印だけのボタン（検索・変更履歴・ライト / ダーク）: 札が縮みきってもはみ出す分だけ、幅 32px から 28px まで縮む。高さは保つ */
      .topbar :is(.search-trigger, .hist-btn, .top-btn), .topbar:has(.conn) :is(.search-trigger, .hist-btn) { flex: 0 1 32px; min-width: 28px; }
    }
  </style>
  <style id="fit-c" media="not all">
    /* 案 C: 件数の札が幅の広い中身（絞り込み 2 桁以上・コメント 99+）のときだけ、案 A と同じ詰め方を幅 400px まで効かせる。既定の中身は今のまま */
    @media (min-width: 390px) and (max-width: 400px) {
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) .brand-name, .topbar:has([data-wide]):has(.df-chip) .brand { display: none; }
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) { gap: 1px; padding: 0 8px; }
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) :is(.search-trigger, .top-btn, .hist-btn) { flex: none; width: 28px; }
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) :is(.comments-btn, .filter-btn, .settings-btn) { gap: 2px; padding: 0 2px; }
    }
  </style>
  <style id="fit-d" media="not all">
    /* 案 D: 案 C と同じ条件の詰め方を、既にある幅 480px 以下の範囲で効かせる。既定の中身は今のまま */
    @media (min-width: 390px) and (max-width: 480px) {
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) .brand-name, .topbar:has([data-wide]):has(.df-chip) .brand { display: none; }
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) { gap: 1px; padding: 0 8px; }
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) :is(.search-trigger, .top-btn, .hist-btn) { flex: none; width: 28px; }
      .topbar:has([data-wide]):is(:has(.df-chip), :has(.conn)) :is(.comments-btn, .filter-btn, .settings-btn) { gap: 2px; padding: 0 2px; }
    }
  </style>
  <style>
    /* 枠の中ではトップバーを流れに置き、下に余白を残さない */
    body { margin: 0; overflow-x: auto; }
  </style>
</head>
<body>
  <!-- トップバーの置き場所: 実装の部品（topbar.js）がここへ描く -->
  <div id="mount"></div>
  <!-- 実装の部品と、部品が使う要素の組み立て・日時の整形 -->
  <script src="../../../../plugins/mindstella/skills/mindmap/preview/core/dom.js"></script>
  <script src="../../../../plugins/mindstella/skills/mindmap/preview/components/send-form.js"></script>
  <script src="../../../../plugins/mindstella/skills/mindmap/preview/components/topbar.js"></script>
  <script>
    // URL の ?conn=offline&diff=1&fc=12&cc=120&theme=dark&plan=current で組み合わせを選ぶ
    const params = new URLSearchParams(location.search);
    const theme = params.get("theme") === "dark" ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
    if (params.get("plan") === "current") document.getElementById("plan-a").remove();
    // ?fit=a / ?fit=b: 幅 390px 以上の最大の中身の畳み方の案を効かせる
    const fit = document.getElementById(`fit-${params.get("fit")}`);
    if (fit) fit.media = "all";
    const noop = () => {};
    document.getElementById("mount").replaceWith(MindmapPreview.topbar({
      title: "要件出しのスキル mindmap を設計する",
      tabs: [
        { key: "overview", label: "概要", icon: "home" },
        { key: "decisions", label: "検討事項", icon: "decision", count: 12 },
        { key: "tasks", label: "タスク", icon: "task", count: 8 },
        { key: "research", label: "調査", icon: "research", count: 3 },
        { key: "docs", label: "資料", icon: "doc", count: 5 },
        { key: "terms", label: "用語集", icon: "term", count: 9 },
        { key: "notes", label: "メモ", icon: "note", count: 4 },
        { key: "logs", label: "会話ログ", icon: "log", count: 20 },
      ],
      current: "decisions",
      theme,
      onNavigate: noop,
      onSearch: noop,
      onTheme: noop,
      connection: params.get("conn") === "offline" ? "offline" : "online",
      readAt: "2026-10-15T01:20:00+00:00",
      comments: true,
      commentCount: Number(params.get("cc") ?? 3),
      onComments: noop,
      diffPoint: params.get("diff") === "1" ? { name: "前回開いてから", sub: "10/15 10:20" } : null,
      onHistory: noop,
      onDiffOff: noop,
      onSettings: noop,
      filter: true,
      filterCount: Number(params.get("fc") ?? 0),
      onFilter: noop,
    }));
    // 件数の札の幅の広い中身の印: 部品のスクリプトが付ける想定の data-wide を、見本では描いた後に付ける
    if (Number(params.get("fc") ?? 0) >= 10) document.querySelector(".filter-btn .fbadge")?.setAttribute("data-wide", "");
    if (Number(params.get("cc") ?? 3) > 99) document.querySelector(".comments-btn .count")?.setAttribute("data-wide", "");
  </script>
</body>
</html>

title: "非機能要件"
requirements:
  - name: Claude Code の版
    english_name: claude_code_version
    category: 動作環境
    external_constraint: スキルを持つプラグインは 2.0.20 から読み込める。シェルの `claude plugin` のサブコマンドが入った版は CHANGELOG から引けない
    source_kind: 実行基盤の制限
    value: 2.1.287 以上
    rationale: 動かして確かめた版。設計どおりのマニフェストで `claude plugin validate`・`marketplace add`・`install`・`list`・`uninstall`・`marketplace remove` が通ることを確かめた（https://github.com/shuhei1101/mindmap/pull/9#discussion_r4160895275）。これより古い版は確かめていない
    source: https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md#2020
  - name: OS
    english_name: os
    category: 動作環境
    external_constraint: Claude Code が動く OS（macOS・Linux・Windows）
    source_kind: 実行基盤の制限
    value: Linux・macOS・Windows（WSL を含む）
    rationale: スクリプトは標準ライブラリのファイル操作と PyYAML・jsonschema だけを使い、OS ごとの分岐を持たない。テストは Linux（WSL2 の Ubuntu 24.04）で流し、macOS・Windows は確かめていない
    source: https://github.com/shuhei1101/mindmap/pull/12
    measurement: '実機での確認: macOS・Windows の端末で `check-env`・`init`・`add`・`build` を流す'
    overflow: Windows で、ほかのプロセスが開いている YAML を `os.replace` で置き換えようとすると失敗する。そのとき書き込みのコマンドはエラーで終わり、元のファイルは変わらない
  - name: Python の版
    english_name: python_version
    category: 動作環境
    external_constraint: PyYAML 5.1 以上・jsonschema 4.18.0 以上が動く版
    source_kind: 外部ライブラリの制限
    value: 3.12 以上
    rationale: コーディング規約が 3.12 の書き方（PEP 695）を前提にし、既存のテスト（`tests/conftest.py`）も 3.12 の構文を使う。ライブラリが求める版より新しい側で揃える
    source: dev/設計書/外部ライブラリ/jsonschema#
    overflow: '仮想環境の Python が古ければ、依存の確認（`check_env.py`）が `python_ok: false` と作り直すコマンドを終了コード 1 で返し、起動スクリプトは Claude Code を立てずに止まる。仮想環境を作るシステムの `python3` も古ければ、`base_python_ok: false` で `install` を `null` にし、利用者が 3.12 以上を入れる。版の判定より前に読まれる `check_env.py` は Python 3.8 で読める構文で書き、それより古い `python3` では構文エラーで終わる'
  - name: ブラウザ
    english_name: browser
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: Chrome と Edge の最新版（PC）。スマートフォンは閲覧できれば足りる
    rationale: コーディング規約『対応ブラウザ』の既定（PC は Chrome と Edge、スマートフォンは閲覧できれば足りる）に従う。使う描画のライブラリ（marked・DOMPurify・elkjs・mermaid）は jsDelivr の配布物を file:// で開いた Chromium で動かして確かめ、性能は Chrome 154 で測った。Edge・Firefox・Safari の実機では確かめていない
    measurement: '実機での確認: Chrome と Edge で `preview.html` を file:// で開き、概要から詳細パネルとネットワークまでの操作を最後まで済ませる'
  - name: 画面サイズ
    english_name: screen_size
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 幅 390px 以上
    rationale: PC の画面に加えて、スマートフォンの縦向き（幅 390px）で閲覧できるようにする。幅 900px 以下は狭い幅の作り（マップは字下げした縦の一覧、詳細パネルは本文に重なる）、幅 1100px 以上（マップは 901px 以上）は詳細パネルの分だけ本文を寄せる。性能は 1280×800 と 1920×1080 で測った
    measurement: ブラウザの表示幅を 390px・900px・901px・1100px・1280px・1920px にして全ての画面を開き、操作が最後まで済むことを見る
  - name: 入力方式
    english_name: input_method
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: マウスとキーボード（PC）。スマートフォンは閲覧できれば足りる
    rationale: ネットワークの回転・拡大・玉への寄せ（カーソルを乗せる）と、マップ・図の移動（背景のドラッグ）はマウスの操作を前提にする。押せるものはボタンかリンクにし、全ての操作にキーボードで届く。タッチでの回転・拡大は対象にしない
    measurement: '実機での確認: PC で、マウスで全ての操作を済ませ、続けてキーボードだけで項目を開く・閉じる・切り替える操作を済ませる'
  - name: 通信
    english_name: network
    category: 動作環境
    external_constraint: 制限なし
    source_kind: 制限なし
    value: 'サーバーが配るプレビューを開くブラウザは、配信（`127.0.0.1`）と jsDelivr（描画のライブラリ）・Google Fonts（文字）へ HTTPS で届くこと。配る書き出しを開くのは通信しない。サーバーは `export` が書き出すときだけ jsDelivr へ HTTPS で届くこと（1 回の要求で接続と 1 回の読み取りをそれぞれ 30 秒まで待ち、取れなければ何も書かずにエラーで終える）。それ以外のツールと配信は外へ通信しない'
    rationale: サーバーの仕事はワークスペースのファイルの読み書きと端末の中への配信で、`export` だけが書き出すときに配布ファイルとライセンスの本文を jsDelivr から取る（ユーザーの決定。リポジトリには同梱しない）。サーバーが配るプレビューの描画のライブラリは jsDelivr から、文字は Google Fonts から読むと決めている（アーキテクチャ図の制約）。届かないときは、読めなかったライブラリの名前を画面に出す（インターフェース定義『プレビューを開く』の異常系）。配る書き出しは描画のライブラリを中に持つため、開くときに通信せず、読めなかったライブラリの知らせは出ない（インターフェース定義『配る書き出し』）
  - name: ネットワークで扱う項目の数
    english_name: graph_item_count
    category: 性能
    external_constraint: 制限なし
    source_kind: ユーザー要望
    source: https://github.com/shuhei1101/mindmap/pull/21#discussion_r4162670745
    value: '1000'
    unit: 件
    rationale: ユーザーが推奨案で決めた。1000 件は PoC で測った最大の件数で、1000 件まで全 60 条件（拡大・縮小・回転・押下）で、落ちたコマ・1 コマの処理時間・長いタスクの基準を満たした（https://github.com/shuhei1101/mindmap/pull/23）
    measurement: 'PoC と同じ条件で測る: 項目 1000 件・表示の幅 1280×800 と 1920×1080・画素の倍率 1 と 2・操作は拡大・縮小・回転・押下の各 5 秒'
    overflow: 1000 件を超えても件数で切らず全て描く。そのときの 1 コマの時間とメモリは確かめていない
  - name: ネットワークの落ちたコマの割合
    english_name: graph_dropped_frames
    category: 性能
    external_constraint: 画面の 1 コマの間隔（60Hz で約 16.7ms）
    source_kind: PC 性能
    source: https://github.com/shuhei1101/mindmap/pull/23
    value: '1'
    unit: '%以下（25ms を超えたコマの割合）'
    rationale: 1000 件の PoC の成功条件。採用した描き方（文字を一度だけ画像に描き、毎コマは画像を置く）で最大 0.9%。測った端末は Windows・Chrome 154・Ryzen 7 9800X3D・RTX 5070・画面 143Hz で、それより低い性能の端末は確かめていない。143Hz の画面では 25ms は 3 コマ分に当たるため、間隔の中央値の 1.5 倍を超えたコマも数えた。そちらは最大 1.6%（600 件の押下）で、1% をわずかに超える条件が 600 件以上に数件ある
    measurement: PoC と同じ条件で、操作中の各コマの間隔を測り、25ms を超えたコマの割合を求める
  - name: ネットワークの 1 コマの処理時間
    english_name: graph_frame_time
    category: 性能
    external_constraint: 画面の 1 コマの間隔（60Hz で約 16.7ms）
    source_kind: PC 性能
    source: https://github.com/shuhei1101/mindmap/pull/23
    value: '8'
    unit: ms（1 コマの処理時間の p95 の上限）
    rationale: 1000 件の PoC の成功条件（JavaScript の側の処理時間）。採用した描き方で最大 5.0ms、長いタスクは 0 回だった。測った端末は Windows・Chrome 154・Ryzen 7 9800X3D・RTX 5070・画面 143Hz で、それより低い性能の端末は確かめていない
    measurement: PoC と同じ条件で、1 コマの JavaScript の処理時間を測り、p95 を求める。同じ条件で長いタスクが 0 回であることも見る
  - name: ネットワークで使うメモリ
    english_name: graph_memory
    category: 性能
    external_constraint: 制限なし
    source_kind: PC 性能
    source: https://github.com/shuhei1101/mindmap/pull/23
    value: 2GB 以上の空きメモリ
    rationale: 1000 件の PoC で、ブラウザ全体の私用メモリは最大 1,462MB（表示の幅 1920×1080 の押下）。安全率 20%（規約『資源の値の決め方』の既定）を足して 1,754MB とし、切りよく 2GB にする。ブラウザ全体はタブ 1 枚にブラウザ本体と描画の支援（GPU）のプロセスを含む値。PoC の画面にはネットワーク以外が無いため、本番の表や本文の分は含まない。JavaScript のヒープは 1000 件でも 6MB 以下で、重さの元はブラウザの描画の側（キャンバスと文字の画像）にある。測った端末は Windows・Chrome 154・Ryzen 7 9800X3D・RTX 5070・画面 143Hz
    measurement: PoC と同じ条件で、操作の直後のブラウザ全体の私用メモリを測る
    breakdown:
      - part: 1000 件の最大
        value: 1,462MB
        notes: 表示の幅 1920×1080 の押下（ブラウザ全体の私用メモリ）
      - part: 安全率 20%
        value: 292MB
        notes: 規約『資源の値の決め方』の既定
      - part: アプリの決定値
        value: 2GB
        notes: 合計 1,754MB を切りよく丸める
  - name: tmux の版
    english_name: tmux_version
    category: 動作環境
    external_constraint: 未確定
    source_kind: 実行基盤の制限
    source: dev/設計書/外部ライブラリ/tmux#
    value: 3.4 以上
    rationale: PoC（https://github.com/shuhei1101/mindstella/pull/73）で動かして確かめた版。起動スクリプトは `new-session -e` で Claude Code の設定のフォルダを渡すため、これを持たない版では動かない。3.4 より古い版は確かめていない
    overflow: 起動スクリプトは版を確かめない。`new-session` が引数の誤りで終われば、tmux の標準エラーをそのまま出して終了コード 1 で終わる
  - name: 待ち受けの範囲
    english_name: listen_scope
    category: セキュリティ
    external_constraint: 制限なし
    source_kind: 制限なし
    source: https://github.com/shuhei1101/mindstella/issues/67
    value: '`127.0.0.1` だけ。ポートは OS が選んだ空きポート'
    rationale: '#67 の要件で、待ち受けるのは端末の中だけにすると決めている。配信は記録を読ませ、送信でワークスペースへ書くため、端末の外からつながせない。同じ端末の別のサイトからの読み書きは、`Host`・`Origin`・`Content-Type` の確かめで防ぐ（インターフェース定義『プレビューの配信』『コメントをまとめて送る』）'
    measurement: 配信を立てた後に、待ち受けのソケットのアドレスが `127.0.0.1` であることと、端末の別のアドレス（LAN の IP）からつながらないことを確かめる
  - name: 画面への反映の時間
    english_name: preview_reflect_time
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    source: https://github.com/shuhei1101/mindstella/pull/73
    value: '1'
    unit: 秒（ワークスペースの YAML を書き換えてから、開いている画面が描き直すまで）
    rationale: '#67 の要件の「再読み込みの操作なしで反映」を、話し合いの中で書き換えを待っていると感じない 1 秒にする。PoC では 250ms ごとに書き換えの印を見る作りで、同じプロセス・別のプロセスの書き換えとも最大 252ms だった。内訳はほぼ全てが検知の間隔で、1 秒に対して 4 倍の余裕がある'
    measurement: MCP サーバーを立ててプレビューを実際のブラウザで開き、ツールで項目を足してから画面の表に行が出るまでを、計測の側の単調な時計で 10 回測り、最大を求める
    test_file: tests/nfr/test_preview_reflect_time.py
    overflow: 超えても描き直しは遅れて届くだけで、記録は失わない
    breakdown:
      - part: 書き換えの検知
        value: 250ms 以下
        notes: 書き換えの印を見る間隔（インターフェース定義『書き換えの知らせ』）
      - part: 記録の読み直しと描き直し
        value: PoC で数十 ms
        notes: '`GET /api/records` とブラウザの描画'
      - part: アプリの決定値
        value: 1 秒
        notes: 検知の間隔の 4 倍の余裕を見る
      - part: 差分の表示の間の差分の計算と描き直し
        value: PoC で 505ms 以下
        notes: 前後とも描き直して、ノード 100・本文 5000 行で 375〜505ms（#83）。検知の 250ms と足しても 1 秒に収まる
    tests:
      - name: test_preview_reflect_time
        summary: 書き換えから画面の描き直しまでが 1 秒以内
        condition: 検討事項を 1 件持つワークスペース。`add` で 1 件ずつ 10 回足す
        measurement: '`add` を呼ぶ直前から、検討事項の表に足した行が出るまでを計測の側の単調な時計で測る'
        expected: 10 回の最大が 1 秒以下
  - name: 送信の本文の長さ
    english_name: submission_body_length
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    value: '10000'
    unit: 文字（前後の空白を除いたコメントの本文と、選んだ文のそれぞれ）
    rationale: コメントは項目への数行の答えを想定し、長い資料は話し合いの中で渡す。上限が無いと 1 件の送信で `submissions.yaml` と会話ログが際限なく太る。リクエストの本文の上限 128KiB に、本文と選んだ文の 2 万文字（UTF-8 で最大 4 バイトとして 80KB）とキーが収まる
    measurement: 10000 文字と 10001 文字の本文・選んだ文をそれぞれ溜め、前者が 201、後者が 400 になることを確かめる
    overflow: サーバーは 400 を返して何も書かない。画面は溜められなかった理由（`detail`）を入力の近くに出し、本文を残す
  - name: 差分の表示の切り替えの時間
    english_name: diff_toggle_time
    category: 性能
    external_constraint: 制限なし
    source_kind: 制限なし
    source: https://github.com/shuhei1101/mindstella/pull/83
    value: '200'
    unit: ミリ秒（変更履歴で時点を選んでから、詳細パネルの本文と図に差分が出るまで。図のノード 50・本文 1000 行まで）
    rationale: 操作への応答と感じる 200 ミリ秒を上限にする。PoC（#83）で、今の版の図を使い回して前の版だけを描く形が、ノード 50・本文 1000 行で 117〜160ms（2 回とも満たした最大の規模）。ノード 100・本文 5000 行は 198〜284ms で境目をまたぐため、規模を決定値の条件に含める
    measurement: MCP サーバーを立ててプレビューを実際のブラウザで開き、詳細パネルを開いたまま変更履歴でまとまりを選んでから、本文と図に差分の印が出るまでを 5 回測り、中央値を求める
    overflow: 超えても差分は遅れて出るだけで、今の内容は読める
lead: mindstella が外部の制約から逆算して決める値。

title: vite
kind: CLI
version:
  current: 8.3.2
  latest: 8.3.2
  checked_on: '2026-11-04'
  source: package.json
  pinning: 8.3.2 に固定する（`^` を付けない）
catalogs:
- name: 使うもの
  version: 8.3.2
  entries:
  - name: vite build
    kind: コマンド
    purpose: frontend/ を root にして plugins/mindstella/skills/mindmap/preview/spa/ へ書き出す（base は /spa/）
  - name: '@vitejs/plugin-react'
    kind: プラグイン
    purpose: JSX の変換と、reactCompilerPreset で React Compiler の設定を返す
  - name: '@rolldown/plugin-babel'
    kind: プラグイン
    purpose: React Compiler（babel-plugin-react-compiler）を Babel で当てる
lead: ES Modules を使う開発サーバーとビルドの道具。ビルドは Rolldown で束ねる。
purl: pkg:npm/vite
dependency_scope: 開発のみ
adoption: 採用
used_in:
- vite.config.ts
upstream: vitejs/vite
verification:
  state: 済
  date: '2026-11-04'
  detail: vite build が終了コード 0 で index.html と 1 つの .js・.css を spa/ に書き、serve.py の /spa/ から開けることを確かめた
license: MIT（開発用だけで配る物に入らない）
official_url: https://vite.dev/
docs_url: https://vite.dev/config/
install: '```bash

  npm install --save-dev --save-exact vite@8.3.2 @vitejs/plugin-react@6.2.1 @rolldown/plugin-babel@0.3.0 babel-plugin-react-compiler@1.0.0

  ```'
limitations:
- item: Node のバージョン
  content: Node 20.19 以上（22 系なら 22.12 以上）が要る（engines）

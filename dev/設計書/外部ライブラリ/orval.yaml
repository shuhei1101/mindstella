title: orval
kind: CLI
version:
  current: 8.46.0
  latest: 8.46.0
  checked_on: '2026-11-04'
  source: package.json
  pinning: 8.46.0 に固定する（`^` を付けない）
catalogs:
- name: 使うもの
  version: 8.46.0
  entries:
  - name: npm run generate-api
    kind: コマンド
    purpose: frontend/openapi.yaml から frontend/src/shared/api/generated/ へ生成する
  - name: override.mutator
    kind: 設定
    purpose: fetch を api-client.ts の apiClient 1 か所で呼ぶ
  - name: 'client: zod'
    kind: 設定
    purpose: 応答の Zod のスキーマ（preview.zod.ts）
  - name: 'mock: true'
    kind: 設定
    purpose: MSW の handler と faker の値（preview.msw.ts・preview.faker.ts）
lead: OpenAPI の定義から、型・API の呼び出し・TanStack Query のフック・Zod のスキーマ・MSW の handler を生成する。
purl: pkg:npm/orval
dependency_scope: 開発のみ
adoption: 採用
used_in:
- orval.config.ts
- frontend/openapi.yaml
upstream: orval-labs/orval
verification:
  state: 済
  date: '2026-11-04'
  detail: npx orval が終了コード 0 で生成し、生成物が tsc -p frontend を通ることを確かめた
license: MIT（開発用だけで配る物に入らない）
official_url: https://orval.dev/
docs_url: https://orval.dev/reference/configuration/output
install: '```bash

  npm install --save-dev --save-exact orval@8.46.0 @faker-js/faker@10.6.0

  ```'
limitations:
- item: exactOptionalPropertyTypes
  content: 生成物（faker・queryOptions）が exactOptionalPropertyTypes を満たさないため、frontend/tsconfig.json では有効にしない
- item: override.query.queryOptions
  content: 真偽値ではなく mutator を受ける。queryOptions は既定で生成される

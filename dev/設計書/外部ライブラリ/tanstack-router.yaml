title: '@tanstack/react-router'
kind: ライブラリ
version:
  current: 1.170.46
  latest: 1.170.46
  checked_on: '2026-11-04'
  source: package.json
  pinning: 1.170.46 に固定する（`^` を付けない）
catalogs:
- name: 使うもの
  version: 1.170.46
  entries:
  - name: 'createRouter（basepath: /spa）'
    kind: 関数
    purpose: 生成したルートのツリーでルーターを作る
  - name: createFileRoute / validateSearch
    kind: 関数
    purpose: 概要のルートの search を Zod で検証する
  - name: redirect（beforeLoad）
    kind: 関数
    purpose: 決めた値以外の search を URL から外して開き直す
  - name: '@tanstack/router-plugin/vite'
    kind: プラグイン
    purpose: routes/ から route-tree.gen.ts を生成する
lead: 型の付いたルートと search params の検証を持つ React のルーター。
purl: pkg:npm/@tanstack/react-router
dependency_scope: 必須
adoption: 採用
used_in:
- frontend/src/app/router.tsx
- frontend/src/routes/
upstream: TanStack/router
verification:
  state: 済
  date: '2026-11-04'
  detail: /spa/?tab=unknown が /spa/ に送り直され概要が開くこと、Vitest で createAppRouter の basepath と context を確かめた
license: MIT
official_url: https://tanstack.com/router
docs_url: https://tanstack.com/router/latest/docs/framework/react/api/router
install: '```bash

  npm install --save-exact @tanstack/react-router@1.170.46

  npm install --save-dev --save-exact @tanstack/router-plugin@1.168.48

  ```'
limitations:

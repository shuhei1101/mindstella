title: "marked"
kind: "CDN の JS"
version:
  current: 18.0.14
  latest: 18.0.14
  checked_on: '2026-10-02'
  source: https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js
  pinning: 版を固定し、script 要素に integrity（`sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo`）と `crossorigin="anonymous"` を付ける。上げるときは integrity も書き換える
catalogs:
  - name: API
    version: 18.0.14
    entries:
      - name: marked.lexer
        kind: 関数
        purpose: 本文の Markdown を最上位の token の並びにする（本文の差分の塊を分ける。描画は mdmark が担う）
        params:
          - name: src
            type: string
            required: true
            description: 分ける Markdown
          - name: options.gfm
            type: boolean
            required: false
            default: 'true'
            description: '`true` で GitHub Flavored Markdown（表など）として分ける。プレビューは渡さず既定のまま'
        returns:
          - name: '-'
            type: Token[]
            description: 最上位の token。各 token の `raw` が元の文字列で、`type` が `space` のものは空行
lead: Markdown を HTML に描く JavaScript のライブラリ。
purl: pkg:npm/marked
dependency_scope: 必須
adoption: 採用
upstream: markedjs/marked
used_in:
  - plugins/mindstella/skills/mindmap/preview/template.html
  - plugins/mindstella/skills/mindmap/scripts/builder.py
verification:
  state: 済
  date: '2026-10-02'
  detail: file:// で開いた HTML から jsDelivr の `lib/marked.umd.js` を下の integrity と `crossorigin="anonymous"` 付きで読み、Chromium で `marked.parse` が見出しと表を描くことを確かめた
license: MIT（商用利用可）。配る書き出しに入れるときは、版・著作権の表示（Copyright (c) 2018+, MarkedJS / Copyright (c) 2011-2018, Christopher Jeffrey）・MIT の本文・ソースの入手先（https://github.com/markedjs/marked の `v{版}` のタグ）を残す
official_url: https://marked.js.org/
selection:
  candidates: '配信元として jsDelivr・unpkg・raw.esm.sh・cdnjs を比べた（[選定の案](https://github.com/shuhei1101/mindmap/pull/21#discussion_r4165328069)）。ライブラリそのものは Issue #5 で決まっている'
  decision: jsDelivr から読む。4 つの描画のライブラリが揃い、npm の原本と同じバイトで、利用規約とプライバシーが明記されている
install: |-
  ```html
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js" integrity="sha384-2vpGtuKqJvFlwJqYnf/wUMuzUfhUnYBt9oay0e2yaFcq0Dh6/aEbQ8YAOeKGzlYo" crossorigin="anonymous"></script>
  ```

  プレビューの雛形が読む。グローバルの `marked` に入る
limitations:
  - item: 用途
    content: 本文の差分の塊を分ける `marked.lexer` だけに使い、HTML には描かない（`marked.parse` は本文中の HTML をそのまま通すため、使うときは無害化が要る）

summary: 採用済みの外部ライブラリ / 外部ツールのリファレンス
items:
- page: claude-code.yaml
  summary: プラグインを読み込み、スキルを動かす CLI
- page: PyYAML.yaml
  summary: ワークスペースの YAML を読み書きする
- page: jsonschema.yaml
  summary: ワークスペースの YAML を JSON Schema で検証する
- page: marked.yaml
  summary: プレビューで本文の差分の塊を Markdown の token ごとに分ける
- page: elkjs.yaml
  summary: プレビューの検討事項のマップの配置を計算する
- page: mermaid.yaml
  summary: プレビューで本文の図を SVG に描く
- page: storybook.yaml
  summary: プレビューの部品を状態ごとのストーリーで見る（開発用）
- page: playwright.yaml
  summary: プレビューのテストでブラウザを動かす（pytest-playwright。開発用）
- page: typescript.yaml
  summary: プレビューのスクリプトを型検査し、.ts から .js へ変換する（開発用）
- page: git.yaml
  summary: 移し替える前の写しを、git のコミットで取る・戻す
- page: mcp.yaml
  summary: MCP のサーバーを立て、スキルが呼ぶツールを載せる（Python の公式の SDK）
- page: tmux.yaml
  summary: 起動スクリプトが、MCP サーバーを渡した Claude Code を動かすセッションを立てる
- page: uvicorn.yaml
  summary: 常駐サーバーの HTTP の待ち受けを動かす
- page: starlette.yaml
  summary: 常駐サーバーの状態の入口の JSON を返す
- page: jsdiff.yaml
  summary: プレビューで本文と図の記法の前後を行ごとに比べる
- page: axe-core.yaml
  summary: プレビューのテストでアクセシビリティの規則（WCAG）を画面に当てる（開発用）
- page: ruff.yaml
  summary: Python のソースを ruff.toml の規則で検査する（開発用）
- page: mdmark.yaml
  summary: プレビューで本文とスレッドの書き込みの Markdown を共通のスタイルで HTML に描き、無害化する
- page: react.yaml
  summary: プレビュー（React）の画面を部品で描く
- page: vite.yaml
  summary: プレビュー（React）を開発し、spa/ へビルドする（開発用）
- page: tailwindcss.yaml
  summary: プレビュー（React）のスタイルをトークンのクラスで書く
- page: base-ui.yaml
  summary: プレビュー（React）の shadcn/ui の部品の土台
- page: tanstack-router.yaml
  summary: プレビュー（React）のルートと search params の検証
- page: tanstack-query.yaml
  summary: プレビュー（React）がサーバーの記録を取得し、書き換えで読み直す
- page: tanstack-table.yaml
  summary: プレビュー（React）の表の並べ替え・絞り込み・列の表示・ピン留めの状態を持つ
- page: zustand.yaml
  summary: プレビュー（React）の接続の状態とライト / ダークを持つ
- page: zod.yaml
  summary: プレビュー（React）の search params を検証する
- page: orval.yaml
  summary: OpenAPI から API の呼び出し・query・Zod・MSW を生成する（開発用）
- page: msw.yaml
  summary: 単体テストとストーリーで API の応答を差し替える（開発用）
- page: eslint.yaml
  summary: プレビュー（React）のソースを規則で検査する（開発用）
- page: lefthook.yaml
  summary: commit の前に、ビルドの出力がソースと合うかを確認する（開発用）
- page: vitest.yaml
  summary: プレビュー（React）の単体テストを流す（開発用）

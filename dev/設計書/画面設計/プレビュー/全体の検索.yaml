title: "全体の検索"
elements:
  - name: 検索の言葉
    kind: input
    description: 空白で区切った語を全て含む項目を検索する（大文字・小文字を区別しない）。読み上げの名前は「検索キーワード」。空のときは結果の場所に「ID・タイトル・本文で、すべての項目を検索します。」。開いている間に `Ctrl+K` を押すと、言葉を選び直す
    io: 入力
    type: 文字列
    placeholder: ID・タイトル・本文で検索
    autofocus: true
    initial_value: 空
  - name: 検索の結果
    kind: list
    description: 当たった項目の種類・ID・タイトル。ID かタイトルが言葉と完全に一致する項目（大文字・小文字と前後の空白を区別しない）は、種類の見出しより上の見出し「完全に一致」の下に出し、下の種類のまとまりには重ねて出さない。残りは種類ごとの見出しの下に並べる。見出し「完全に一致」と種類ごとの見出しは、画面の見出し（`h1`）の 1 段下の見出し（`h2`）にする。ID は折り返さない。押すか、上下の矢印で選んで Enter で、その項目のタブと詳細パネルを開き、検索を閉じる
    io: 表示
    source: プレビューを開く.mindmap-data（7 種類の項目と bodies）
    visible_when: 検索の言葉が空でない（当たらないときは「該当する項目はありません。別の条件を試してください。」）
  - name: 閉じる
    kind: button
    description: 検索を閉じる。Esc と外側の押下でも閉じる
lead: 全種類の項目を ID・タイトル・本文で検索するモーダル。トップバーの入口か `Ctrl+K`（macOS は `Cmd+K`）で開く。
mock: dev/mock/pages/search/126/standard/index.html
test_file: tests/integration/preview/test_search_screen.py

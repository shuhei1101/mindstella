title: "概要"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要・検討事項・タスク・調査・資料・用語集・メモ・会話ログ（件数はプレビューを開く.mindmap-data.{種類} の件数）
      - name: current
        value: overview
      - name: theme
        value: 端末の保存領域の値（無ければ OS の設定）
      - name: connection
        value: サーバーの配信で、`GET /api/events` のつながりが切れている間と `GET /api/records` に届かないときは offline、それ以外と配る書き出しは online（プレビューを開く.接続の状態）
      - name: read_at
        value: 記録の取得.built_at（最後に読めた記録）
      - name: diffPoint
        value: 変更履歴で選んだ時点の名前と日時（プレビューを開く.変更履歴で選んだ時点。選んでいなければ渡さない）。`tabs[].marked` はその時点で印の付く項目を持つ種類
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 次に検討する項目
    id: tile-next
    kind: list
    description: 前提（`depends_on`）が全て決着（決定済み・対象外・取り下げ）した未決定の検討事項を、`build` が `next` と同じ並びで埋め込んだ順に、タイルの枠に収まるだけ並べる（縦に積む幅では上位 3 件）。影響度は目盛りに「影響度 大」のように軸の名前を添えて出す。押すと詳細パネルを開く
    io: 表示
    source: プレビューを開く.mindmap-data.derived.next
    visible_when: 常時（0 件のときは「次に検討する項目はありません。」）
  - name: 次に検討する項目のすべて表示
    kind: link
    description: 検討事項の表を状態 = 未決定 × 着手可否 = 着手可能で絞って開く（`#tab=decisions&view=table&f.status=未決定&f.ready=着手可能`）
    label: すべて表示（{件数} 件）
    visible_when: 次に検討する項目が 1 件以上
  - name: ゴールまでの進捗
    id: tile-goal
    kind: section
    description: ゴールがあるときは、ゴールのフェーズまでの決定済みの数と、フェーズごとの棒（決定済み / 全体）。ゴールが無いとき（`derived.goal.has_goal` が偽）は、見出しを「フェーズ別の進捗」にし、見出しの下に「ゴールは決まっていません」を出して、全フェーズの決定済みの数と棒だけを出す。数は `goal` と同じ決着で数え、対象外・取り下げも決定済みに含める。見出しのアイコンはどちらも旗（モックで合意した形）
    io: 表示
    source: プレビューを開く.mindmap-data.derived.goal
    visible_when: 常時
    label: ゴールまでの進捗（ゴールが無いときはフェーズ別の進捗）
  - name: 納品物のチェックリスト
    kind: list
    position: ゴールまでの進捗
    description: ゴールの納品物。`derived.goal.remaining_deliverables` に無い納品物をチェック済みにする（判定は `goal` と同じ。`doc` の資料の状態が完成）。押すとその資料の詳細パネルを開く
    io: 表示
    source: プレビューを開く.mindmap-data.settings.goal.deliverables・プレビューを開く.mindmap-data.derived.goal.remaining_deliverables
    visible_when: ゴールがあるとき。納品物が 5 件以下のとき全て、5 件を超えたら先頭 5 件
  - name: 納品物のすべて表示
    kind: link
    position: ゴールまでの進捗
    description: 資料を納品物で絞ってカードで開く（`#tab=docs&f.deliverable=納品物`）
    label: すべて表示（{件数} 件）
    visible_when: 納品物が 5 件を超える
  - name: 要見直し
    id: tile-review
    kind: list
    description: 状態が要見直しの検討事項の件数と名前。押すと詳細パネルを開く。「すべて表示」で検討事項の表を状態 = 要見直しで絞って開く
    io: 表示
    source: プレビューを開く.mindmap-data.decisions
    visible_when: 常時（0 件のときは「要見直しの検討事項はありません。」）
  - name: 保留
    id: tile-hold
    kind: list
    description: 状態が保留の検討事項の件数と名前だけ。待っている前提などの補足の行とタスクは出さない。「すべて表示」で検討事項の表を状態 = 保留で絞って開く
    io: 表示
    source: プレビューを開く.mindmap-data.decisions
    visible_when: 常時（0 件のときは「保留の検討事項はありません。」）
  - name: 進行中のタスク
    id: tile-running
    kind: list
    description: 状態が進行中のタスクの件数と名前。「すべて表示」でタスクの表を状態 = 進行中で絞って開く
    io: 表示
    source: プレビューを開く.mindmap-data.tasks
    visible_when: 常時（0 件のときは「進行中のタスクはありません。」）
  - name: カテゴリー別の進捗
    id: tile-progress
    kind: table
    description: カテゴリーを行、フェーズを列にした表。セルは決定済み / 全体と棒（対象外・取り下げも決定済みに含める）。セルを押すと検討事項の表をそのカテゴリーとフェーズで絞って開く。行の見出しを押すとカテゴリーだけで絞る
    io: 表示
    source: プレビューを開く.mindmap-data.derived.progress
    visible_when: 常時（そのカテゴリーとフェーズに項目が無いセルは「—」で押せない）
    label: カテゴリー別の進捗
  - name: ゴールが無いこと
    kind: label
    position: ゴールまでの進捗
    description: ゴールが無いことを示す 1 行
    label: ゴールは決まっていません
    io: 表示
    visible_when: ゴールが無いとき（`derived.goal.has_goal` が偽）
    source: プレビューを開く.mindmap-data.derived.goal.has_goal
  - name: 話し合いの概要
    id: overview-description
    kind: label
    description: 題名の上に、設定の話し合いの概要（1 文の短い文）を出す。プレイブックの名前とゴールのフェーズは出さない。読める幅（46em）で折り返す
    io: 表示
    type: 文字列
    visible_when: 設定が話し合いの概要を持つとき（無ければ行を出さない）
    source: プレビューを開く.mindmap-data.settings.description
  - name: タイルの項目の差分の印
    kind: label
    component: dev/設計書/部品設計/プレビュー/差分の印.ts#
    args:
      - name: kind
        value: 選んだ時点で足した項目は new、変えた項目は changed（記録の取得.changes）
    description: 次に検討する項目・要見直し・保留・進行中のタスクのタイルの各行で、項目のタイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で足されたか変わったとき
lead: プレビューを開いたときの既定の画面。次に検討する項目・ゴールまでの進捗・要見直し・保留・進行中のタスク・カテゴリー別の進捗のタイルを並べる。
mock: dev/mock/pages/overview/81/b-phase-progress/index.html
test_file: tests/integration/preview/test_overview_screen.py

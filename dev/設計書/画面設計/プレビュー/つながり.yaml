title: "つながり"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: graph
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 条件のチップ
    kind: list
    position: タブの帯の下、3D のキャンバスの上
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・3D のキャンバスを描き直す'
    io: 入力
    visible_when: 値を 1 つ以上選んでいる条件があるとき
  - name: 3D のキャンバス
    id: graph-canvas
    kind: canvas
    description: 絞り込みのドロワーの条件に合う項目を平たい円、その間の関連（依存・関連・根拠・進めるタスク）を線で、透視で描く。種類の帯は出さない。線の種類は実線・点線などの見た目で分ける。上下左右に回す・ホイールでマウスの位置へ寄る・背景のダブルクリックで戻る。向きは目標へ毎コマ少しずつ寄せ、離すと慣性でゆっくり止まり、操作が止まって少しすると、ごくゆっくり自動で回る。玉にカーソルを乗せるとつながる玉が距離の 1 割ほど寄り、押すとそこへ寄って詳細を開き、つながる線に小さな玉を流す
    io: 表示
    source: 'プレビューを開く.mindmap-data（7 種類の項目と `depends_on`・`related`・`sources`・`for`）。見た目は個人の上書きか、無ければ記録の取得.settings.display.network_look、それも無ければ `deep` を受け取る（見た目ごとの描き分けは #28）'
    visible_when: 常時
  - name: 条件に合う項目が無い旨
    kind: label
    position: 3D のキャンバスの枠の中央
    description: 絞り込みの条件に合う項目が無いときに、条件のせいで空だと伝える文（どの幅でも出す）
    label: 表示する項目はありません。
    io: 表示
    visible_when: 絞り込みの条件に合う項目が 1 件も無いとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: dev/設計書/部品設計/プレビュー/絞り込み.ts#
    position: タブの帯の下から左に重ねる
    description: 画面設計『検討事項』の絞り込みのドロワーと同じ出し方で、描く玉を選ぶ。条件を変えると玉と線を作り直す
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: どの値も選んでいない（全ての玉を描く）。URL のハッシュに `f.{列}` があるときはその条件で開く
    args:
      - name: groups
        value: 種類（type。項目の種類の検討事項・タスク・調査・資料・用語集・メモ・会話ログ。印は kind）・状態（status。検討事項・タスク・資料の状態。印は status。状態を持たない種類の玉は、状態の値を選ぶと外れる）・タグ（tags）
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーで変えた条件
      - name: total
        value: 7 種類の項目の件数
      - name: shown
        value: 条件に合う項目の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
  - name: 名前の横のコメントの印
    kind: label
    component: dev/設計書/部品設計/プレビュー/コメントの印.ts#
    args:
      - name: count
        value: その項目を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    position: 3D のキャンバスの上に重ねる層
    description: 玉の上に出る名前の右端に続け、縦は名前の中央に揃えて、玉に付いて動かす。名前を隠さない。手前の玉の印ほど上に重ね、名前と同じ濃さにする。印の重なり順は描く枠の中に閉じ、詳細パネルより上に出さない。コメントを溜める・直す・消す・戻す・送ると、視点を動かさずに印だけを描き替える。印だけを押す操作は持たない
    io: 表示
    visible_when: サーバーにつながって開いていて、その項目を指すレビュー中のコメントが 1 件以上あり、玉の名前が読める大きさ（文字 8px 以上）で描かれ、名前と印が描く枠に収まるとき。遠いときは何も出さない
lead: 全種類の項目を関連でつないで 3D で描く画面。タブの帯の右端の入口から開く。
mock: dev/mock/pages/graph/89/standard/index.html
test_file: tests/integration/preview/test_graph_screen.py

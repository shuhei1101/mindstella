title: "ネットワーク"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: graph
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 条件のチップ
    kind: list
    position: タブの帯の下、3D のキャンバスの上
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・3D のキャンバスを描き直す'
    io: 入力
    visible_when: 値を 1 つ以上選んでいる条件があるとき
  - name: 3D のキャンバス
    id: graph-canvas
    kind: canvas
    description: '絞り込みのドロワーの条件に合う項目を星、その間の関連（依存・関連・根拠・進めるタスク）を線で、透視で描く。種類の帯は出さない。線の種類は実線・点線などの見た目で分ける。星と線と地は今当てている見た目（`glow`・`starlight`・`constellation`・`deep`・`dust`）とライト / ダークで描き分ける（見た目ごとの中身は Issue #28 の表、色はデザイン方針）。上下左右に回す・ホイールでマウスの位置へ寄る・背景のダブルクリックで戻る。向きは目標へ毎コマ少しずつ寄せ、離すと慣性でゆっくり止まり、操作が止まって少しすると、ごくゆっくり自動で回る。星のまたたきと、選んだ星から広がる輪はゆっくり自動で動かす（デザイン方針の例外）。`prefers-reduced-motion: reduce` のときは、操作によらず自分で動くもの（自動で回る・星のまたたき・広がる輪・線を流れる光と彗星・照準の目盛りの回転）を止め、星はまたたかない明るさ、輪は出さず、注目の線は流れる光の代わりに強調した線で描く。設定が変わったら次のコマから当てる。鍵の震えは止めない。玉にカーソルを乗せるとつながる玉が距離の 1 割ほど寄り、押すと「ロックの操作」の規則で詳細を開く。注目の起点（ロックした項目、ロックしていなければ詳細を開いている項目）へ寄り、起点とつながる玉を強調して、つながる線に光を流す'
    io: 表示
    source: プレビューを開く.mindmap-data（7 種類の項目と `depends_on`・`related`・`sources`・`for`）。見た目は個人の上書きか、無ければ記録の取得.settings.display.network_look、それも無ければ `deep`
    visible_when: 常時
    initial_value: URL のハッシュに `id` があるときは、その項目を選んだ項目として開く（項目を開いたままタブの帯で移ってきたときを含む。『プレビューを開く』の制約「画面の移動と項目」）
  - name: 見た目のドロップダウン
    kind: select
    position: 3D のキャンバスの右上に重ねる
    description: ネットワークの見た目を 5 つから選ぶ。アイコンは付けない。選択肢はグロウ・星の光・星図・深宇宙・星屑の順で、ワークスペースの既定の見た目に「（既定）」を添える。どの地の上でも読めるよう面の色で塗り、狭い幅でも同じ大きさで右上に置く。読み上げの名前は「ネットワークの見た目」。見た目はここだけで選び、表示の設定のパネルには置かない
    io: 入力
    type: 列挙（glow・starlight・constellation・deep・dust）
    visible_when: 常時
    initial_value: 個人の上書きの見た目。無ければワークスペースの既定（記録の取得.settings.display.network_look、無ければ `deep`）
    source: プレビューを開く.個人の上書き.network_look・記録の取得.settings.display.network_look
    action: 選ぶと個人の上書きとして端末の保存領域に残し（サーバーへは送らない）、玉と線を作り直さずに次のコマからその見た目で描く。視点・選んだ項目・ロックは変えない。表示の設定のパネルの「この端末で変えている項目」に「ネットワークの見た目」を出す
  - name: 状態の印
    kind: label
    position: 3D のキャンバスの中。玉の名前の左
    description: 一覧と同じ状態の印（決定済み・未決定・進行中・要見直し・未整理・保留 など）を名前の左に描く。資料の成果物は箱の印にする。大きさは名前の文字の高さの 8 割で、名前と同じく空間の中で大きさが決まり（遠近で大きさが変わる）、濃さも名前と同じにする
    io: 表示
    visible_when: 注目しているとき（選んだ・ロックした）だけ、注目の起点とそれにつながる項目に出す。名前が消える距離では印も消す。何も注目していないときは出さない
    source: プレビューを開く.mindmap-data の各項目の `status` と資料の成果物の印
  - name: 鍵
    kind: label
    position: 3D のキャンバスの中。玉の名前のすぐ右（名前が出ない遠い距離では、玉の右上の札の中）
    description: ロックの状態を示す印。閉じた鍵はロックした項目に、開いた鍵はロックしていないときに詳細を開いている項目に出す。名前とコメントの印の間に置き、鍵を出しているときだけ鍵の幅を空ける。押しても何も起きない。ロック中に外れない操作（「ロックの操作」の震え）をされたときは、赤く光らせて大きくし、南京錠のように上を軸に左右へ振れさせて約 1 秒で収める。震えは CSS のアニメーションに頼らず毎コマ当て、描き直しても途切れさせず、`prefers-reduced-motion` でも止めない
    io: 表示
    visible_when: 閉じた鍵はロック中いつも（詳細を閉じても、ほかの項目へ移っても、タブを行き来しても残す）。開いた鍵はロックしていないとき、詳細を開いている項目の玉にカーソルを乗せたときだけ。幅 900px 以下では出さない
  - name: ロックの操作
    kind: gesture
    position: 3D のキャンバスの上
    description: 注目の起点を 1 つの項目に留める。ロック中は、中心・強調・線を流れる光をロックした項目に留め、ほかの項目を押すと詳細だけを切り替えて、押した項目には選択の輪だけを付ける。ロックはページを開いている間だけ保ち、タブを行き来しても残す（URL のハッシュにも端末の保存領域にも書かない）。検討事項のマップとは別々に持ち、押したときの規則は同じにする
    io: 入力
    visible_when: 幅 901px 以上。幅 900px 以下では詳細が全面に出るためロックしない
    action: '玉か余白を押したとき、押した項目（余白なら無し）・詳細を開いている項目・ロックした項目で次のどれかをする。ロックしていないとき: 詳細を開いている項目を押すとロックする。ほかの項目を押すと詳細を開く。余白を押すと全体の表示へ戻る。ロック中: ロックした項目の詳細を開いている状態でその項目を押すとロックを外す。ほかの項目を開いているときにロックした項目を押すと、詳細をロックした項目に戻すだけにする。詳細を開いている別の項目をもう一度押す・余白を押すと、ロック・詳細・表示を変えずに鍵を震わせる。それ以外の項目を押すと詳細だけを切り替える。前に押してから 450ms 未満・24px 未満の位置で押した 2 回目は、詳細が開いて枠がずれても、前に押した項目への 2 回押しとして扱う'
  - name: 条件に合う項目が無い旨
    kind: label
    position: 3D のキャンバスの枠の中央
    description: 絞り込みの条件に合う項目が無いときに、条件のせいで空だと伝える文（どの幅でも出す）
    label: 表示する項目はありません。
    io: 表示
    visible_when: 絞り込みの条件に合う項目が 1 件も無いとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: dev/設計書/部品設計/プレビュー/絞り込み.ts#
    position: タブの帯の下から左に重ねる
    description: 画面設計『検討事項』の絞り込みのドロワーと同じ出し方で、描く玉を選ぶ。条件を変えると玉と線を作り直す
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: どの値も選んでいない（全ての玉を描く）。URL のハッシュに `f.{列}` があるときはその条件で開く
    args:
      - name: groups
        value: 種類（type。項目の種類の検討事項・タスク・調査・資料・用語集・メモ・会話ログ。印は kind）・状態（status。検討事項・タスク・資料の状態。印は status。状態を持たない種類の玉は、状態の値を選ぶと外れる）・タグ（tags）
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーで変えた条件
      - name: total
        value: 7 種類の項目の件数
      - name: shown
        value: 条件に合う項目の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。3D のキャンバスはこの領域の高さいっぱいに広げる
    visible_when: 常時
  - name: 名前の横のコメントの印
    kind: label
    component: dev/設計書/部品設計/プレビュー/コメントの印.ts#
    args:
      - name: count
        value: その項目を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    position: 3D のキャンバスの上に重ねる層
    description: 玉の上に出る名前の右に続け（鍵を出しているときは名前・鍵・コメントの印の順で、鍵の右）、縦は名前の中央に揃えて、玉に付いて動かす。名前を隠さない。手前の玉の印ほど上に重ね、名前と同じ遠近・濃さにする（5 つの見た目のどれでも）。印の重なり順は描く枠の中に閉じ、詳細パネルより上に出さない。コメントを溜める・直す・消す・戻す・送ると、視点を動かさずに印だけを描き替える。印だけを押す操作は持たない
    io: 表示
    visible_when: サーバーにつながって開いていて、その項目を指すレビュー中のコメントが 1 件以上あり、玉の名前が読める大きさ（文字 8px 以上）で描かれ、名前と印が描く枠に収まるとき。遠いときは何も出さない
  - name: ロックのキー操作
    kind: shortcut
    position: ネットワークの画面
    description: 「ロックの操作」にキーボードで届く道。`L` を押すと、詳細を開いている項目の玉をもう一度押したのと同じ規則でロックを付け外しする（ロックしていなければロックする。ロックした項目の詳細を開いていればロックを外す。別の項目の詳細を開いていれば鍵を震わせる）。詳細を開いていないときは何もしない。修飾キー付き・入力欄（input・textarea・select・編集できる要素）にフォーカスがあるとき・変換中・重ねる面（ダイアログ・ポップオーバー）を開いているときは受けない。3D のキャンバスの読み上げの説明に「L キーで、詳細を開いている項目をロック・解除」を添える
    io: 入力
    visible_when: ネットワークの画面を開いていて、幅 901px 以上（「ロックの操作」と同じ）
    reason: 非機能要件の入力方式（全ての操作にキーボードで届く）を満たすため
lead: 全種類の項目を星として関連でつなぎ、3D で描く画面。タブの帯の右端の入口から開く。5 つの見た目から 1 つを選んで眺め、注目の起点の項目をロックして辿る。
mock: dev/mock/pages/graph/123/standard/index.html
test_file: tests/integration/preview/test_graph_screen.py
notes:
  コメントの印のモック: コメントの印の見本は `dev/mock/pages/graph/121/standard/index.html` の操作列「つながり」の案 A（近づくと名前の横）。鍵との並びと 5 つの見た目での出方は `dev/mock/pages/graph/123/standard/index.html`

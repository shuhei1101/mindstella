title: "詳細パネル"
elements:
  - name: 戻る・進む
    kind: button
    position: 見出し
    description: パネルと全画面の中で移ってきた項目を行き来する（ブラウザの戻る・進むと同じ履歴）。読み上げの名前は「前の項目へ戻る」「次の項目へ進む」
    label: ← →
    enabled_when: その向きに見てきた項目がある
  - name: タイトル
    kind: heading
    position: 見出し
    description: 項目の ID・タイトル・状態。納品物の資料はタイトルの右に余白を空けて納品物の印を置く（状態の横に並べない）
    io: 表示
    source: プレビューを開く.id の項目
  - name: 全画面表示
    kind: button
    position: 見出し
    description: 詳細の全画面を開く（履歴に積まない）。ラベルとアイコンは全画面の中でも変えず、全画面の中では押された状態（`aria-pressed`）で出す
    label: 全画面表示
  - name: 閉じる
    kind: button
    position: 見出し
    description: パネルを閉じる。Esc でも閉じる
  - name: 案
    kind: list
    description: 検討事項の案をカードの縦並びで出し、採用 / 不採用と理由を出す
    io: 表示
    source: プレビューを開く.mindmap-data.decisions[].options
    visible_when: 検討事項で案を持つ
  - name: 本文
    kind: article
    description: 本文の Markdown を marked で描き DOMPurify で無害化して差し込む。mermaid の図は SVG に描き、「拡大表示」「Raw」「コピー」を置く。図を描けないときは「この図は表示できませんでした。原文を表示します。」と原文。ライブラリが読めないときは読めなかったライブラリの知らせと原文
    io: 表示
    source: プレビューを開く.mindmap-data.bodies[{項目の body}]
    visible_when: 項目が `body` を持つ
  - name: 図の拡大表示
    kind: button
    position: 本文 > 図
    description: 図の拡大を開く。読み上げの名前は「図を拡大表示」
    label: 拡大表示
  - name: 図の Raw
    kind: button
    position: 本文 > 図
    description: 図と mermaid の原文を切り替える（`aria-pressed`）
    label: Raw
  - name: 図のコピー
    kind: button
    position: 本文 > 図
    description: mermaid の原文をクリップボードに写す
    label: コピー
  - name: 関係する項目
    kind: list
    description: 前提・後続の項目・関連タスク・経緯・関連・参照元。押すとその項目へ移り、履歴に積む
    io: 表示
    source: プレビューを開く.mindmap-data（`depends_on`・`for`・`related`・`sources` とその逆向き）
    visible_when: その種類の項目が 1 件以上
  - name: 回答・意見の送信
    kind: form
    component: dev/設計書/部品設計/プレビュー/回答・意見の送信.ts#
    args:
      - name: target
        value: プレビューを開く.id
      - name: body
        value: その項目で書きかけた本文（描き直しと項目の移動をまたいで、開いている間だけ項目の ID ごとに保つ）
      - name: status
        value: 回答・意見の送信（POST /api/submissions）の結果
      - name: sent_at
        value: 回答・意見の送信.sent
      - name: detail
        value: 回答・意見の送信のエラーの detail（届かなかったときはなし）
    position: 下端
    description: 開いている項目へ回答・意見を送る。パネルの下端に留め、本文と線で区切る。見出しとこの部品の間の案・本文・関係する項目だけをスクロールする
    io: 入力
    visible_when: サーバーの配信で開いたとき（配る書き出しでは出さず、パネルは関係する項目で終わる）
    status: planned
lead: 項目 1 件の中身を本文の右に出すパネル。幅 1100px 以上（マップは 901px 以上）は本文を寄せて並べ、それより狭いと本文に重ねる。本文の寄せは開閉と同時に切り替え、パネルだけがすべり込む。
mock: dev/mock/pages/detail-panel/71/a-footer/index.html
test_file: tests/integration/preview/test_detail_panel_screen.py

title: "詳細パネル"
elements:
  - name: 戻る・進む
    kind: button
    position: 見出し
    description: パネルと全画面の中で移ってきた項目を行き来する（ブラウザの戻る・進むと同じ履歴）。読み上げの名前は「前の項目へ戻る」「次の項目へ進む」
    label: ← →
    enabled_when: その向きに見てきた項目がある
  - name: タイトル
    kind: heading
    position: 見出し
    description: 項目の ID・タイトル・状態。納品物の資料はタイトルの右に余白を空けて納品物の印を置く（状態の横に並べない）
    io: 表示
    source: プレビューを開く.id の項目
  - name: 全画面表示
    kind: button
    position: 見出し
    description: 詳細の全画面を開く（履歴に積まない）。全画面の中では、画面設計『詳細の全画面』の「元の大きさに戻す」に替わる
    label: 全画面表示
  - name: 閉じる
    kind: button
    position: 見出し
    description: パネルを閉じる。Esc でも閉じる。検討事項のマップでは、余白を押しても閉じる
  - name: 案
    kind: list
    description: 背景の後に、検討事項の案をカードの縦並びで出す。カードの見出しに記号と内容、その下にメリット・デメリット・備考・理由を出し、値は文字列の値の描画で描く。採用した案に「採用」、`adopted` が偽の案に「不採用」を出し、どちらでもない案には何も出さない
    io: 表示
    source: プレビューを開く.mindmap-data.decisions[].options
    visible_when: 検討事項で案を持つ
  - name: 本文
    kind: article
    description: 本文の Markdown を marked で描き DOMPurify で無害化して差し込み、見出しのリンク・用語の印・項目の ID のリンクを付ける。mermaid の図は SVG に描き、「拡大表示」「Raw」「コピー」を置く。図を描けないときは「この図は表示できませんでした。原文を表示します。」と原文。ライブラリが読めないときは読めなかったライブラリの知らせと原文。コードブロックと図の原文（Raw・描けないときの原文・Raw の差分）は、長い行を折り返して本文の幅に収め、横にスクロールさせない
    io: 表示
    source: プレビューを開く.mindmap-data.bodies[{項目の body}]
    visible_when: 項目が `body` を持つ
  - name: 図の拡大表示
    kind: button
    position: 本文 > 図
    description: 図の拡大を開く。読み上げの名前は「図を拡大表示」
    label: 拡大表示
  - name: 図の Raw
    kind: button
    position: 本文 > 図
    description: 図と mermaid の原文を切り替える（`aria-pressed`）
    label: Raw
  - name: 図のコピー
    kind: button
    position: 本文 > 図
    description: mermaid の原文をクリップボードに写す
    label: コピー
  - name: 関係する項目
    kind: list
    description: 前提・後続の項目・関連タスク・経緯・関連・参照元。押すとその項目へ移り、履歴に積む
    io: 表示
    source: プレビューを開く.mindmap-data（`depends_on`・`for`・`related`・`sources` とその逆向き）
    visible_when: その種類の項目が 1 件以上
  - name: コメントの入力
    kind: form
    component: dev/設計書/部品設計/プレビュー/コメントの入力.ts#
    args:
      - name: target
        value: プレビューを開く.id
      - name: loc
        value: 選んだ箇所のコメントの入口を押して添えた箇所（添えていなければなし）
      - name: body
        value: レビュー中のコメントの読み取り.drafts のうち、同じ target と loc の書きかけ（入力中は画面が持ち、項目の移動・描き直し・パネルと全画面の行き来をまたいで保つ）
      - name: status
        value: レビュー中のコメントの追加（POST /api/comments）の結果
      - name: count
        value: レビュー中のコメントの追加.count
      - name: detail
        value: レビュー中のコメントの追加のエラーの detail（届かなかったときはなし）
    position: 下端
    description: 開いている項目へのコメントをレビュー中に溜める。パネルの下端に留め、本文と線で区切る。書きかけは入力が止まったときとパネルを閉じるときに『書きかけの保存』へ送る。溜めたら入力欄と添えた箇所を空にし、コメントのボタンの件数とレビュー中のコメントを描き直す
    io: 入力
    visible_when: サーバーの配信で開いたとき（配る書き出しでは出さず、パネルは関係する項目で終わる）
    status: planned
  - name: 選んだ時点
    kind: label
    description: 本文の冒頭に、変更履歴で選んだ時点の名前と日時（前回開いてからは範囲の始まり）を出す
    io: 表示
    source: プレビューを開く.変更履歴で選んだ時点と記録の取得.changes
    visible_when: 差分の表示の間で、開いた項目がその時点で足されたか変わったとき
  - name: 新規の札
    kind: label
    component: dev/設計書/部品設計/プレビュー/差分の印.ts#
    args:
      - name: kind
        value: new
      - name: labeled
        value: 'true'
    description: タイトルの横に「新規」の札を置く
    io: 表示
    visible_when: 差分の表示の間で、開いた項目がその時点で足されたとき
  - name: キーの差分
    kind: label
    description: 変わったキー（状態・答え・案 など）の前の値と今の値を並べる。前の値は消した色の面と取り消し線、今の値は足した色の面と下線。状態のキーだけは面を塗らず、取り消し線・下線と矢印で示す。前に無かったキーは今の値だけを足した印で出す。`withdrawn` はキーの一覧に値を出さず（取り下げの札が示す）、選んだ時点で変わったときだけ「取り下げ」の行に前後を並べ、真の値を取り下げの札で出す
    io: 表示
    source: 記録の取得.{種類}[].history から組み立てた前の値
    visible_when: 差分の表示の間で、そのキーが選んだ時点で変わったとき
  - name: 本文の差分
    kind: label
    description: 本文を Markdown として描いたまま、足した段落・見出し・箇条書き・表の行に足した印（足した色の面と +・下線）、消したものを消した印（消した色の面と −・取り消し線）つきで元の位置に差し込む。変えていないものには印を付けない。足した部分と変えていない部分は今の本文の行で選んだ箇所に対応づき、消した部分は選んだ箇所の対応づけの外にする
    io: 表示
    source: 記録の取得.bodies と、history の body_diff から組み立てた前の本文
    visible_when: 差分の表示の間で、本文が選んだ時点で変わったとき
  - name: 図の差分
    kind: label
    description: flowchart・sequenceDiagram・classDiagram・erDiagram・stateDiagram-v2 は、足した・変えたノードと辺に色を付け、図の下に凡例と「消したもの」の札を並べる。それ以外の種類は変わった図の枠に色を付け、Raw で差分を見るよう案内する
    io: 表示
    visible_when: 差分の表示の間で、本文のその図の記法が選んだ時点で変わったとき
  - name: 図の Raw の差分
    kind: label
    description: 図の Raw で、記法の行ごとに足した行（+）と消した行（−）を印つきで出す。記法の行の差分を打ち切ったときは、今の記法を差分なしで出す。長い行の折り返した続きは印の幅だけ下げて、印の列の下へ回り込ませない
    io: 表示
    visible_when: 差分の表示の間で、jsdiff を読めていて、図の Raw を押していて、その図の記法が変わったとき
  - name: 前後を組み立てられない旨
    kind: label
    description: 選んだまとまりの変更履歴が保持する回数を超えて消えているとき、本文の頭に出し、今の内容を差分なしで描く
    label: このまとまりの前後を組み立てられません。保持する回数を超えた古い変更履歴は消えています。今の内容を出しています。
    io: 表示
    visible_when: 差分の表示の間で、開いた項目が選んだ時点で変わっていて、その変更履歴が無いとき
  - name: 本文の差分を出せない旨
    kind: label
    description: 本文の差分が今の本文に当たらないとき、本文の頭に出し、今の本文を差分なしで描く。キーの差分は出す
    label: 本文の差分を出せません。書き換えの後に、本文のファイルが直接書き換えられています。今の本文を出しています。
    io: 表示
    visible_when: 差分の表示の間で、body_diff の now が今の本文に当たらないとき
  - name: 本文の差分を計算しきれない旨
    kind: label
    description: 本文の行の差分を打ち切ったとき、本文の頭に出し、今の本文を差分なしで描く。キーの差分は出す
    label: 本文の差分を出せません。書き換えが大きく、差分を計算しきれませんでした。今の本文を出しています。
    io: 表示
    visible_when: 差分の表示の間で、jsdiff を読めていて、本文の行の差分を打ち切ったとき（モジュール構成『差分』の `diffLineParts` が `null`）
  - name: 差分のライブラリを読めない旨
    kind: label
    description: jsdiff を読めなかったとき、本文の頭に出し、本文・図・図の Raw を今の版で差分なしで描く。キーの差分は出す
    label: '本文と図の差分を表示できません。読み込めなかったライブラリ: jsdiff 通信を確認して、ページを再読み込みしてください。'
    io: 表示
    visible_when: 差分の表示の間で、開いた項目が選んだ時点で変わっていて、jsdiff を読めなかったとき（モジュール構成『基盤』の `missingLibraries`）
  - name: レビュー中のコメント
    kind: list
    position: 関係する項目の後
    description: その項目へのレビュー中のコメントを溜めた順に並べる。見出し「レビュー中のコメント」と件数、行ごとに箇所（名前と選んだ文）と本文を出し、行の右上に「修正」「削除」を置く。消した行は溜めた順の元の場所に「元に戻す」と共に残す。チェックとまとめて送るはコメントの一覧で行う。0 件のときは「レビュー中のコメントはありません。」。件数は消した行を数えない
    io: 表示
    source: レビュー中のコメントの読み取り.items（target がこの項目のもの）
    visible_when: サーバーの配信で開いたとき
    status: planned
  - name: 選んだ箇所のコメントの入口
    kind: button
    component: dev/設計書/部品設計/プレビュー/選んだ箇所のコメントの入口.ts#
    args:
      - name: anchor
        value: 選んだ範囲の端の矩形
    position: 本文・値 > 選んだ範囲の近く
    description: 本文の文章か項目の値（案の中の値を含む）を選び終えたときに出す。本文は元の行の印から行の範囲を、値は描いた要素のキーのパスを求める（『プレビューを開く』の選んだ箇所の対応づけ）。押すと入口を閉じ、コメントの入力に箇所を添えて入力欄へフォーカスを移す。履歴に積まない
    visible_when: サーバーの配信で、選んだ範囲が空でなく、始まりと終わりがどちらも本文か同じ値の中にあるとき（見出しの帯・関係する項目・図・レビュー中のコメント・入力を含む選択と、差分の表示の間の消した部分を含む選択、古いまとまりを選んでいてその後に本文を直した項目の本文の選択では出さない）
    status: planned
  - name: 示す箇所
    kind: highlight
    position: 本文・値
    description: コメントの一覧の行から開いたとき、そのコメントの箇所（本文はその行の範囲のブロック、値はそのキーの要素）までスクロールし、印の色の地で示す。別の項目へ移るかパネルを閉じると消す。箇所が今の本文に合わなければ示さず、項目の先頭を出す
    io: 表示
    visible_when: コメントの一覧から箇所を持つコメントの行を押して開いたとき
    status: planned
  - name: 本文のスクロール領域
    kind: region
    position: 見出しと下端の間
    description: 背景・案・採用した案と理由・本文・関係する項目・レビュー中のコメントを入れ、見出しと下端の間だけを縦にスクロールする。Tab の順で見出しのボタンの後・中の要素の前に入り、フォーカスしたら矢印・PageUp / PageDown・Home / End・Space で送る。中にフォーカスできる要素が無い項目でもキーボードで送れる。読み上げの名前は「詳細の本文」で、フォーカスの輪郭は全画面で共通の輪郭の色と太さで、領域の内側に描く。フォーカスがあるときに描き直したら、描き直した後のこの領域へフォーカスを戻し、スクロールの位置も保つ
    io: 表示
    visible_when: 常時
    reason: 非機能要件の入力方式（全ての操作にキーボードで届く）を満たすため
    status: planned
  - name: 見出しのリンク
    kind: link
    position: 本文 > 見出しの右
    description: '本文の見出しを指す #。乗せる・フォーカスで出す（乗せる操作の無い端末は常に出す）。押すと本文の中でその見出しまで送り、URL のハッシュの `h` をその見出しにする（履歴に積まない）。本文の中の `[文言](#見出し)` のリンクも同じく、その見出しまで送る。読み上げの名前は「見出し「{見出し}」へのリンク」'
    label: '#'
    visible_when: 本文に見出しがあるとき
  - name: 用語の印
    kind: link
    position: 本文 > 文中
    description: 本文の文中（コードブロック・図・リンク・見出しの外。インラインコードは中身がちょうど用語のときだけ）に出てくる用語集の用語（用語の項目のタイトル）を、文字の色を変えない点線の下線で示す。出てくる全ての箇所に付け、長い用語から順に当て、英数字の用語は語の切れ目でだけ当てる。用語の項目自身の本文の中のその用語には付けない。押すとその用語の詳細へ移り、履歴に積む
    visible_when: 本文に用語集の用語が出てくるとき
    source: プレビューを開く.mindmap-data.terms
  - name: 用語のツールチップ
    kind: tooltip
    position: 用語の印の下（収まらなければ上）
    description: 用語の印に乗せる・フォーカスすると、用語・ID・意味を出す。ツールチップに乗せている間は消さず、Esc で消す。印から外れて 150 ミリ秒たつと消す（その間にツールチップへ乗せれば消さない）。用語の印は `aria-describedby` でツールチップを指す
    io: 表示
    visible_when: 用語の印に乗せる・フォーカスしている間
    source: プレビューを開く.mindmap-data.terms[].meaning
  - name: 項目の ID のリンク
    kind: link
    position: 本文 > 文中
    description: 本文の文中（コードブロック・図・リンクの外。インラインコードは中身がちょうど ID のときだけ）に出てくる、記録にある項目の ID を、等幅の印の色の文字と下線のリンクにする（折り返さない）。記録に無い ID と、開いている項目自身の ID はリンクにしない。押すとその項目の詳細へ移り、履歴に積む
    visible_when: 本文に記録にある項目の ID が出てくるとき
    source: プレビューを開く.mindmap-data
  - name: 背景
    kind: label
    position: タイトルの下
    description: 検討事項のリード（何を決めるか）を出す。値は文字列の値の描画で描く
    io: 表示
    visible_when: 検討事項が `lead` を持つ
    source: プレビューを開く.mindmap-data.decisions[].lead
    status: planned
  - name: 推奨の印
    kind: label
    position: 案 > 推奨の案のカードの見出しの右
    description: AI が推す案のカードに、星のアイコンと「推奨」の枠線のバッジを出す
    label: 推奨
    io: 表示
    visible_when: 推奨の印を持つ案があり、どの案も採用でないとき
    source: プレビューを開く.mindmap-data.decisions[].options[].recommended
    status: planned
  - name: 採用した案と理由
    kind: section
    position: 案の後・本文の前
    description: 見出し「採用した案と理由」の節に、「決定内容」（`answer`）と「理由」（`reason`）を値のあるものだけ並べる。値は文字列の値の描画で描く
    label: 採用した案と理由
    io: 表示
    visible_when: 検討事項が `answer`・`reason` のどちらかを持つ
    source: プレビューを開く.mindmap-data.decisions[].answer・reason
    status: planned
  - name: 文字列の値の描画
    kind: label
    position: 背景・案・採用した案と理由と、ほかの種類の値
    description: 詳細に出す文字列の値（検討事項の `lead`・`answer`・`reason`・案の各値、タスクの `reason`、調査の `question`・`conclusion`、用語の `meaning`、メモの `content`、調査・資料・用語集・メモ・会話ログの取り下げた理由 `reason`）を、本文と同じく marked で描き DOMPurify で無害化して差し込む。値の要素はキーのパスを持ち、選んだ箇所のコメント・示す箇所・キーの差分が指せる。marked か DOMPurify を読めないときは文字のまま出す。差分の表示の間で変わった値は、キーの差分で前の値と今の値を文字で並べる
    io: 表示
    visible_when: 項目がその値を持つ
    source: プレビューを開く.mindmap-data
    status: planned
  - name: 取り下げの札
    kind: label
    component: dev/設計書/部品設計/プレビュー/取り下げの札.ts#
    args:
      - name: large
        value: 'true'
    position: タイトル > 納品物の印・新規の札の右
    description: 取り下げた調査・資料・用語集・メモ・会話ログのタイトルの右に置く。タイトルの文字は薄くしない（薄くするのは表の行とカード）
    io: 表示
    source: プレビューを開く.id の項目の withdrawn
    visible_when: 開いた項目の `withdrawn` が真のとき（差分の表示によらない）
    status: planned
  - name: 取り下げた理由
    kind: section
    position: タイトルの下のキーの一覧の後
    description: 見出し「取り下げた理由」の節に、取り下げた理由 `reason` を出す。値は文字列の値の描画で描く。差分の表示で選んだ時点に取り下げたときは、キーの差分と同じく前の値（なし）と今の値を並べる。検討事項・タスクの `reason` はこの節に出さない（採用した案と理由・タスクの理由が持つ）
    label: 取り下げた理由
    io: 表示
    source: プレビューを開く.mindmap-data.{research・docs・terms・notes・logs}[].reason
    visible_when: 調査・資料・用語集・メモ・会話ログが `reason` を持つか、差分の表示で `reason` が選んだ時点に変わったとき
    status: planned
  - name: 行の修正
    kind: button
    position: レビュー中のコメント > 行 > 右上
    description: 行の本文をその場で「行の本文の書き換え」に切り替え、入力欄へフォーカスを移す。アイコンのボタンを常に出す（コメントの一覧の行の「修正」と同じ置き方とアイコン）。読み上げの名前は「{項目の ID} へのコメントを修正」、`title` は「修正」。書き換えている行には出さない
    label: （鉛筆の印）
    visible_when: サーバーの配信で開いたとき、書き換えていない行
    status: planned
  - name: 行の削除
    kind: button
    position: レビュー中のコメント > 行 > 右上

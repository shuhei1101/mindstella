title: "記録の表"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: プレビューを開く.tab（research・terms・notes・logs）
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
      - name: comments_unread
        value: 概要と同じ
      - name: pending
        value: 概要と同じ
      - name: pending_count
        value: 概要と同じ
      - name: pending_open
        value: 概要と同じ
      - name: pending_blocked
        value: 概要と同じ
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: プレビューを開く.tab
      - name: columns
        value: '調査: ID・タイトル・問い・結論・確度（絞れる）・タグ（絞れる） / 用語集: ID・用語・意味・別名・使わない表記・タグ（絞れる） / メモ: ID・タイトル・内容・タグ（絞れる）・関連 / 会話ログ: ID・日付・タイトル・更新した項目・タグ（絞れる）'
      - name: rows
        value: プレビューを開く.mindmap-data.{research・terms・notes・logs}
      - name: filters
        value: 絞り込みのドロワーの selected
      - name: marks
        value: 差分の表示の間、選んだ時点で足した・変えた項目（記録の取得.changes）
      - name: comments
        value: サーバーにつながって開いたとき、項目の ID → その項目を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target）
    description: その種類の表。表示形式の切り替えは出さない。表の上に、値の条件と列の文字の条件（`{列}に「{文字}」を含む`）のチップを並べる。列の見出しには絞り込みのボタンを置かない。取り下げた項目（`withdrawn` が真）の行は、差分の表示によらずタイトルの右に取り下げの札を置き、行の文字を薄くする（部品設計『表』の `rows`）
    visible_when: 常時
  - name: 絞り込みのドロワー
    kind: dialog
    component: dev/設計書/部品設計/プレビュー/絞り込み.ts#
    description: 画面設計『検討事項』の絞り込みのドロワーと同じ出し方で、表の条件を選ぶ。値の条件より上に、文字で絞れる列（値を選ぶ条件にしない、数でない列）の「文字を含む」の欄を並べる（部品設計『絞り込み』の `texts`）。用語集では ID・用語・意味・別名・使わない表記の欄になる。条件は種類（調査・用語集・メモ・会話ログ）ごとに持ち、別の種類へ移っても持ち越さない
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: どの値も選んでいない。サーバーの配信でその種類の残した条件があればその条件（今の記録に無い値は外す）。URL のハッシュに `f.{列}` があるときはその条件で開き、残した条件を書き換えない
    args:
      - name: groups
        value: '調査: タグ（tags）・確度（confidence） / 用語集・メモ・会話ログ: タグ（tags）。どれも種類（`kind`）と状態を持たないので、その条件を出さない'
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: プレビューを開く.mindmap-data.{research・terms・notes・logs} の件数
      - name: shown
        value: 条件に合う行の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。表は幅 721px 以上でこの領域の高さいっぱいに広げ、中で縦・横にスクロールする。それより狭い幅では、この領域ごと縦にスクロールする
    visible_when: 常時
  - name: 消した項目の帯
    kind: list
    component: dev/設計書/部品設計/プレビュー/消した項目の帯.ts#
    args:
      - name: items
        value: 選んだ時点で消した項目（記録の取得.changes の removed）のうち、種類がこの画面の種類（research・term・note・log）のものの id・title を ID の順に並べたもの。合わせた範囲で足して消した項目も含む
    position: 表の上
    description: 選んだ時点で消したその種類の項目を並べる。絞り込みの条件によらず全て出す。項目は押せず、詳細パネルを開かない
    io: 表示
    source: 記録の取得.changes
    visible_when: 差分の表示の間で、選んだ時点でその種類の項目を 1 件以上消したとき
    status: implemented
  - name: 項目を追加
    kind: button
    position: 表の上の帯 > 列の表示の左
    description: 開いているタブの種類（調査・用語集・メモ・会話ログ）の項目を追加する入力を、詳細パネルと同じ置き方で開く（開いていた詳細パネルは閉じる）。タイトルを書いて入力欄を離れたときに `item-add` を 1 件溜め、残りのキーは、返った仮の ID で同じ `item-add` の `value` を書き換えて溜める（1 件のまま）。幅 480px 以下は「＋」の印だけにし、文字を読み上げに残す
    label: 項目を追加
    visible_when: サーバーの配信で、差分の表示をしていないとき（配る書き出しでは出さない）
    action_ref: dev/設計書/画面設計/プレビュー/詳細パネル#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
  - name: 一覧の保存待ちの印
    kind: label
    component: dev/設計書/部品設計/プレビュー/保存待ちの印.ts#
    args:
      - name: kind
        value: その項目の削除を溜めていれば remove、直前の保存で書き込めなかった編集を持てば blocked、それ以外は pending
      - name: compact
        value: 'false'
    position: 表の行のタイトルの後ろ（レビュー中のコメントの印の左）
    description: 保存待ちの編集がある項目に印を付け、削除を溜めた項目はタイトルに取り消し線を引く。保存待ちが変わるたびに付け直す
    io: 表示
    visible_when: その項目に保存待ちの編集が 1 件以上あり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（target がその項目のもの）
    status: planned
    introduced:
      pr: 325
  - name: 追加する項目
    kind: list
    position: 表の先頭
    description: 溜めた `item-add` の項目を、表の先頭の行に出す。ID は保存で決まるため出さず、ID の列に「—」を置き、タイトルが空なら「（タイトル未入力）」と出す。保存待ちの印（直前の保存で書き込めなかったときは blocked、それ以外は pending）を付け、押すと追加する入力を開き直す
    io: 表示
    visible_when: 開いているタブの種類の `item-add` が保存待ちにあり、差分の表示をしていない
    source: 保存待ちの編集の読み取り.items（op が item-add で key が開いているタブの種類）
    action_ref: dev/設計書/画面設計/プレビュー/詳細パネル#elements[編集の表示]
    status: planned
    introduced:
      pr: 325
lead: 調査・用語集・メモ・会話ログを表だけで見る画面。種類ごとに同じ画面を使い回す。
mock: dev/mock/pages/records/223/a-above-table/index.html
test_file: tests/integration/preview/test_records_screen.py
notes:
  コメントの印のモック: コメントの印の見本は `dev/mock/pages/records/121/standard/index.html`
  消した項目と取り下げのモック: 消した項目の帯と取り下げの札の見本は `dev/mock/pages/records/179/b-band/index.html`

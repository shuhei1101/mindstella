title: "記録の表"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: プレビューを開く.tab（research・terms・notes・logs）
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: プレビューを開く.tab
      - name: columns
        value: '調査: ID・タイトル・問い・結論・確度（絞れる）・タグ（絞れる） / 用語集: ID・用語・意味・別名・使わない表記・タグ（絞れる） / メモ: ID・タイトル・内容・タグ（絞れる）・関連 / 会話ログ: ID・日付・タイトル・更新した項目'
      - name: rows
        value: プレビューを開く.mindmap-data.{research・terms・notes・logs}
      - name: filters
        value: プレビューを開く.f.{列}（開いたときだけ）
      - name: marks
        value: 差分の表示の間、選んだ時点で足した・変えた項目（記録の取得.changes）
    description: その種類の表。表示形式の切り替えは出さない
    visible_when: 常時
lead: 調査・用語集・メモ・会話ログを表だけで見る画面。種類ごとに同じ画面を使い回す。

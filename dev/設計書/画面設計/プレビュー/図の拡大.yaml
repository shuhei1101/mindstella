title: "図の拡大"
elements:
  - name: 図
    kind: svg
    description: mermaid で描いた図。ホイールで拡大・縮小し、背景のドラッグで動かす。図の文字は選んでコピーできる（文字の上のドラッグは動かさずに選ぶ）
    io: 表示
    source: 詳細パネルの本文の図
  - name: 閉じる
    kind: button
    description: 図の拡大を閉じ、開いた元（詳細パネルか詳細の全画面の本文）に戻る。Esc でも閉じる
  - name: 図の差分
    kind: label
    description: 詳細パネルの図の差分と同じ色を付け、窓の下端に凡例と「消したもの」の札を並べる
    io: 表示
    visible_when: 差分の表示の間で、その図の記法が選んだ時点で変わったとき
  - name: Raw
    kind: button
    description: 上の帯に置き、押すと図の代わりに記法を出す。差分の表示の間は、記法の行ごとに足した行（+）と消した行（−）を印つきで出す。jsdiff を読めないときと記法の行の差分を打ち切ったときは、今の記法を差分なしで出す。押した状態を `aria-pressed` で伝える
    label: Raw
    visible_when: 常時
lead: 本文の図を大きく見る。詳細パネルからはモーダルで開き、詳細の全画面からは全画面の中身を切り替える。
mock: dev/mock/pages/diagram-viewer/21/standard/index.html
test_file: tests/integration/preview/test_diagram_viewer_screen.py

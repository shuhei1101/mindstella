title: "コメントの一覧"
elements:
  - name: パネルの見出し
    kind: heading
    position: 見出しの帯
    description: 「コメント」。スレッド・レビュー中の書き込みの画面でも同じ帯を出す
    label: コメント
    io: 表示
  - name: レビュー中の入口
    kind: button
    position: 見出しの帯 > 右
    description: 「レビュー中」とレビュー中の書き込みの件数（トップバーのコメントのボタンと同じ丸い札）。押すとパネルの中をレビュー中の書き込みの画面に切り替える（履歴に積まない）。スレッドの画面でも同じ場所に出し、レビュー中の書き込みの画面では出さない。0 件のときも出し、件数の塗りを外す。読み上げの名前は「レビュー中の書き込みを確かめる（{件数} 件）」
    label: レビュー中（{件数}）
    visible_when: レビュー中の書き込みの画面を開いていない
    source: レビュー中のコメントの読み取り.items の件数
    action_ref: dev/設計書/画面設計/プレビュー/レビュー中の書き込み#
  - name: 一覧を閉じる
    kind: button
    position: 見出しの帯 > 右端
    description: パネルを閉じ、重ねていた画面に戻る（履歴に積まない）。トップバーのコメントのボタンでも閉じ、スレッドの一覧では Esc でも閉じる。幅 901px 以上で詳細パネルを開いているときの Esc は詳細パネルを先に閉じる。幅 900px 以下の Esc は前に出ている側から閉じる。次に開くときはいつもスレッドの一覧から始める。読み上げの名前は「コメントの一覧を閉じる」
  - name: 状態の絞り込み
    kind: segment
    position: 絞り込みの帯
    description: 「オープン」「クローズ」「すべて」を、それぞれの件数（タグで絞っていればそのタグのスレッドの件数）つきで並べる。押した状態を `aria-pressed` で持ち、グループの読み上げの名前は「スレッドの状態で絞る」。パネルを開いている間はスレッドの画面との行き来をまたいで保つ
    io: 入力
    initial_value: オープン
    options: オープン・クローズ・すべての 1 つ
  - name: タグの絞り込み
    kind: chip
    position: 絞り込みの帯 > 状態の絞り込みの下
    description: '# の印と絞っているタグ、外す ×（読み上げの名前「タグ「{タグ}」の絞り込みを外す」）と「{残った件数} / {状態で絞った件数} 件」。スレッドの行のタグを押すとそのタグで絞り、同じタグを押し直すか × で外す。タグは 1 つだけで絞る'
    io: 表示
    visible_when: タグで絞っている
  - name: スレッドの行
    kind: list
    component: dev/設計書/部品設計/プレビュー/スレッドの行.ts#
    args:
      - name: thread
        value: スレッドの読み取り.threads[] の 1 件
      - name: pending
        value: レビュー中のコメントの読み取り.items のうち thread を持たない 1 件
      - name: has_pending_reply
        value: レビュー中のコメントの読み取り.items にそのスレッドへの返信があるとき true
      - name: active_tag
        value: タグの絞り込みのタグ
    position: 一覧
    description: 状態とタグで絞ったスレッドを最後の書き込みの新しい順に並べる。状態の絞り込みがクローズでなく、タグで絞っていないときは、まだ送っていない新しいスレッドを溜めた順に先頭へ並べる。行を押すとパネルの中をそのスレッドの画面に切り替える（履歴に積まない）。書き換えの知らせが届いたらスレッドを読み直して描き直す（スクロールの位置と絞り込みは保つ）。クローズにしたスレッドは、絞り込みがオープンなら一覧へ戻ったときに外れる
    io: 表示
    source: スレッドの読み取り.threads
    action_ref: dev/設計書/画面設計/プレビュー/スレッド#
  - name: 空の状態
    kind: label
    position: 一覧
    description: 印と、絞り込みを含めた文言（「オープンのスレッドはありません。」「クローズのスレッドはありません。」「スレッドはありません。」。タグで絞っていれば頭に「タグ「{タグ}」の」を付ける）
    io: 表示
    visible_when: 並べる行が 0 件
  - name: 読めない理由
    kind: label
    position: 一覧
    description: '`role="alert"`。スレッドを読めなかったとき、印のアイコンと「スレッドを読めませんでした。」に、届かないときは「サーバーが止まっています。立ち上げ直してから開いてください。」、422 は `detail` を続ける。まだ送っていない新しいスレッドは並べる。次に読めたら消す'
    io: 表示
    visible_when: 直前のスレッドの読み取りが 200 以外か届かなかった
    source: スレッドの読み取りのエラーの detail
  - name: 新しいスレッド
    kind: button
    position: 下端
    description: 押すと同じ場所に新しいスレッドの入力を出し、入力欄へフォーカスを移す
    label: 新しいスレッド
    visible_when: 新しいスレッドの入力を出していない
  - name: 新しいスレッドの入力を閉じる
    kind: button
    position: 下端 > 新しいスレッドの入力の見出し
    description: 見出し「新しいスレッド」の右の ×。入力を畳んで「新しいスレッド」に戻し、書きかけは残す。読み上げの名前は「新しいスレッドの入力を閉じる」
    visible_when: 新しいスレッドの入力を出している
  - name: 新しいスレッドの入力
    kind: form
    component: dev/設計書/部品設計/プレビュー/コメントの入力.ts#
    args:
      - name: body
        value: レビュー中のコメントの読み取り.drafts のうち target も thread も持たない書きかけ
      - name: status
        value: レビュー中のコメントの追加（POST /api/comments）の結果
      - name: count
        value: レビュー中のコメントの追加.count
      - name: detail
        value: レビュー中のコメントの追加のエラーの detail
      - name: collapsed
        value: 'false'
      - name: label
        value: 新しいスレッド
    position: 下端
    description: 見出し「新しいスレッド」の下に、項目を指さない新しいスレッドの最初の書き込みを溜める入力を出す（`target` を渡さない）。溜めたら入力欄を空にし、まだ送っていない新しいスレッドとして一覧の先頭に足し、コメントのボタンと「レビュー中」の入口の件数を描き直す（この画面に留まる）
    io: 入力
    visible_when: 「新しいスレッド」を押した後
    target: レビュー中のコメントの追加.body
    action_ref: dev/設計書/インターフェース定義/サーバー/レビュー中のコメントの追加#
lead: スレッドを状態とタグで絞って並べ、新しいスレッドを立てる。トップバーのコメントのボタンで開き、見ている画面に重ねて左から出すパネル。パネルの中をスレッド・レビュー中の書き込みの画面と切り替える。開いている間、パネルが覆った範囲の本文の部品を `inert` にする。絞り込みのドロワーとは同時に開かず、どちらかを開くと他方を閉じる。幅 900px 以下は画面の幅いっぱいに出し、パネルから開いた詳細パネルを閉じるとパネルへ戻る。配る書き出しには無い。
mock: dev/mock/pages/comments/235/a2-open-thread/index.html
screen: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
test_file: tests/integration/preview/test_comments_screen.py
notes:
  幅 900px 以下の重なり: 詳細パネルと重なるときは後から開いた側を前に出す。詳細パネルを開いたままトップバーから開いたときはパネルを、パネルから詳細パネルを開いたときは詳細パネルを前に出し、後ろになった側の部品を `inert` にする。パネルを閉じると開く前の詳細パネルが見える

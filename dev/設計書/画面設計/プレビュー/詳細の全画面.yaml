title: "詳細の全画面"
elements:
  - name: 押された全画面表示
    kind: button
    position: 見出し
    description: 押された状態（`aria-pressed`）の全画面表示のボタン。ラベルとアイコンは詳細パネルと同じ。押すと詳細パネルに戻す。全てを閉じるボタンは置かない
    label: 全画面表示
  - name: 後ろの幕
    kind: backdrop
    description: 薄い幕。押すと元の大きさ（詳細パネル）に戻す。Esc でも戻す
  - name: 詳細の中身
    kind: article
    description: 詳細パネルと同じ要素（戻る・進む・タイトル・案・本文・図の操作・関係する項目・レビュー中のコメント・選んだ箇所のコメントの入口・示す箇所）。図を拡大表示するときは、モーダルを重ねずにこの中身を図の拡大に切り替え、閉じると本文に戻す。図の拡大を開いている間は選んだ箇所のコメントの入口を出さない
    io: 表示
    source: 詳細パネルと同じ
  - name: コメントの入力
    kind: form
    component: dev/設計書/部品設計/プレビュー/コメントの入力.ts#
    args:
      - name: target
        value: プレビューを開く.id
      - name: loc
        value: 詳細パネルと同じ
      - name: body
        value: 詳細パネルと同じ（パネルと全画面を行き来しても書きかけと添えた箇所を保つ）
      - name: status
        value: 詳細パネルと同じ
      - name: count
        value: 詳細パネルと同じ
      - name: detail
        value: 詳細パネルと同じ
    position: 詳細の中身 > 下端
    description: 詳細パネルと同じ部品をモーダルの下端に留め、本文だけをスクロールする。図の拡大を開いている間は拡大の下に隠れる
    io: 入力
    visible_when: サーバーの配信で開いたとき（配る書き出しでは出さない）
    status: planned
lead: 詳細パネルの中身を画面の中央のモーダルで大きく出す。後ろの幕は薄くし、元の画面が透けて見える。
mock: dev/mock/pages/detail-full/78/a-footer-quote/index.html
test_file: tests/integration/preview/test_detail_full_screen.py

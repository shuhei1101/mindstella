title: "詳細の全画面"
elements:
  - name: 元の大きさに戻す
    kind: button
    position: 見出し
    description: 全画面の間の全画面表示のボタン。縮小（矢印が内向き）のアイコンにし、ボタンの色は詳細パネルと同じで変えない。押された状態（`aria-pressed`）は持たない。押すと詳細パネルに戻す。全てを閉じるボタンは置かない
    label: 元の大きさに戻す
  - name: 後ろの幕
    kind: backdrop
    description: 薄い幕。押すと元の大きさ（詳細パネル）に戻す。Esc でも戻す。開いている間は、モーダルの中でスクロールしても後ろの画面をスクロールさせない
  - name: 詳細の中身
    kind: article
    description: 詳細パネルと同じ要素（戻る・進む・タイトル・取り下げの札・取り下げた理由・背景・案・推奨の印・採用した案と理由・文字列の値の描画・本文・見出しのリンク・用語の印とツールチップ・項目の ID のリンク・図の操作・関係する項目・レビュー中のコメント・選んだ箇所のコメントの入口・示す箇所・本文のスクロール領域）。本文はモーダルの幅いっぱいに広げる。図を拡大表示するときは、モーダルを重ねずにこの中身を図の拡大に切り替え、閉じると本文に戻す。図の拡大を開いている間は選んだ箇所のコメントの入口を出さない
    io: 表示
    source: 詳細パネルと同じ
  - name: コメントの入力
    kind: form
    component: dev/設計書/部品設計/プレビュー/コメントの入力.ts#
    args:
      - name: target
        value: プレビューを開く.id
      - name: loc
        value: 詳細パネルと同じ
      - name: body
        value: 詳細パネルと同じ（パネルと全画面を行き来しても書きかけと添えた箇所を保つ）
      - name: status
        value: 詳細パネルと同じ
      - name: count
        value: 詳細パネルと同じ
      - name: detail
        value: 詳細パネルと同じ
    position: 詳細の中身 > 下端
    description: 詳細パネルと同じ部品をモーダルの下端に留め、本文だけをスクロールする。図の拡大を開いている間は拡大の下に隠れる
    io: 入力
    visible_when: サーバーの配信で開いたとき（配る書き出しでは出さない）
    status: planned
lead: 詳細パネルの中身を画面の中央のモーダルで大きく出す。モーダルは窓から 32px 内側（幅 720px 以下は 8px）で、幅の上限は 1600px。後ろの幕は薄くし、元の画面が透けて見える。
mock: dev/mock/pages/detail-full/127/a-badge/index.html
test_file: tests/integration/preview/test_detail_full_screen.py

title: "検討事項"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: decisions
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数（開いたときは既定の状態の条件で 1）
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: dev/設計書/部品設計/プレビュー/表示形式の切り替え.ts#
    args:
      - name: views
        value: マップ・ボード・表
      - name: current
        value: プレビューを開く.view（既定 map）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: キーワード
    kind: input
    position: マップ > ツールバー
    description: タイトルに含む項目を黄色で強調する。読み上げの名前は「タイトルで強調するキーワード」
    io: 入力
    type: 文字列
    placeholder: タイトルで強調
    initial_value: 空
    visible_when: 表示形式がマップ
  - name: マップ
    id: decision-map
    kind: canvas
    description: 対象 → カテゴリー → フェーズ → 検討事項の木を ELK で配置した直角の枝で描く（SVG）。絞り込みのドロワーの条件に合う検討事項だけを描き、条件に合う検討事項を持たない対象・カテゴリー・フェーズの節は描かない。状態の帯は出さない。項目は 2 行目に ID・状態・影響度を補足の下の段（12px）で出す。項目を押すと根までの枝と前提・後続の依存の線を強調し、ほかを薄くし、依存の線に小さな玉を流して詳細パネルを開く。余白を押すと選びを外す。背景のドラッグで動かす
    io: 表示
    source: プレビューを開く.mindmap-data.decisions・プレビューを開く.mindmap-data.settings
    visible_when: 表示形式がマップで幅 901px 以上。elkjs が読めないときは読めなかったライブラリの知らせ
    action: 余白（マップの枠の中で項目の節の上でない所。対象・カテゴリー・フェーズの節と枝・依存の線の上を含む）を左ボタンで押してから離すまでの移動が上限以内なら、選んでいる項目があるときだけ、詳細パネルの「閉じる」と同じく選びを外す（詳細パネルを閉じ、URL のハッシュから項目の ID を外し、強調・薄い表示・玉を消す）。拡大・縮小で決めた倍率は保ち、「全体を表示」のときは広がった枠に合わせて倍率を求め直す。スクロールの位置は、選んだ項目を中央へ送り直さず、縦・横それぞれ、押す前の位置と、広がった枠で送れる端の位置のうち小さい方にする。移動が上限を超えたら背景のドラッグとして扱い、選びを保つ
  - name: 拡大・縮小・全体を表示
    kind: button
    position: マップの枠の外
    description: マップの倍率を変える・全体が収まる倍率にする。枠の外に固定する
    visible_when: 表示形式がマップで幅 901px 以上
  - name: 字下げの一覧
    kind: list
    description: 狭い幅のマップ。木を字下げした縦の一覧で出し、押すと詳細を開く
    io: 表示
    source: マップと同じ
    visible_when: 表示形式がマップで幅 900px 以下
  - name: ボード
    kind: board
    description: 状態ごとの列に、絞り込みのドロワーの条件に合う検討事項をカードで並べる。状態の条件から外した状態の列も残し、列の中に「状態の条件で外しています。」と書く。ほかの 0 件の列は「検討事項はありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横に送り、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む。カードを押すと詳細を開く
    io: 表示
    source: プレビューを開く.mindmap-data.decisions
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: decisions
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・対象（絞れる）・カテゴリー（category、絞れる）・フェーズ（phase、絞れる）・影響度（絞れる）・着手可否（ready、絞れる）・前提・タグ（絞れる）
      - name: rows
        value: プレビューを開く.mindmap-data.decisions
      - name: filters
        value: 絞り込みのドロワーの selected（マップ・ボードと共有）
      - name: marks
        value: 差分の表示の間、選んだ時点で足した・変えた検討事項（記録の取得.changes）
    description: 検討事項の表。列「着手可否」は、`derived.next` にある未決定は「着手可能」、それ以外の未決定は「前提待ち」、未決定以外は「なし」
    visible_when: 表示形式が表
  - name: 条件に合う検討事項が無い旨
    kind: label
    position: マップの枠の中央（幅 901px 以上）・字下げの一覧（幅 900px 以下）
    description: 絞り込みの条件に合う検討事項が無いときに、条件のせいで空だと伝える文
    label: 表示する検討事項はありません。
    io: 表示
    visible_when: 表示形式がマップで、絞り込みの条件に合う検討事項が 1 件も無いとき
  - name: マップ・ボードの差分の印
    kind: label
    component: dev/設計書/部品設計/プレビュー/差分の印.ts#
    args:
      - name: kind
        value: 選んだ時点で足した項目は new、変えた項目は changed（記録の取得.changes）
    description: マップの箱とボードのカードで、タイトルの横に文言なしで置く。字下げの一覧にも同じ印を置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で足されたか変わったとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: dev/設計書/部品設計/プレビュー/絞り込み.ts#
    position: タブの帯の下から左に重ねる
    description: トップバーの絞り込みのボタンで開閉する。マップ・ボード・表で 1 つの条件を共有し、表示形式を切り替えても保つ。幕を付けず、重ねていない右側は見えたまま操作できる。開いている間、ドロワーが覆った範囲の本文の部品を `inert` にする。外側を押しても閉じず、コメントの一覧とは同時に開かない（どちらかを開くと他方を閉じる）。条件を変えると、開いたままマップ・ボード・表を描き直す
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: 状態で要見直し・未決定・未整理・保留を選んだ状態。URL のハッシュに `f.{列}` があるときは既定に代えてその条件だけで開く
    args:
      - name: groups
        value: 状態（status。印は status）・タグ（tags）・対象（target）・カテゴリー（category）・フェーズ（phase）・影響度（weight）・着手可否（ready）。検討事項は種類（`kind`）を持たないので種類の条件を出さない。表示形式がマップのときは、キーワードに一致した件数を `hit` に渡す
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: プレビューを開く.mindmap-data.decisions の件数
      - name: shown
        value: 条件に合う検討事項の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
lead: 検討事項をマップ（既定）・ボード・表で見る画面。
mock: dev/mock/pages/decisions/89/standard/index.html
test_file: tests/integration/preview/test_decisions_screen.py

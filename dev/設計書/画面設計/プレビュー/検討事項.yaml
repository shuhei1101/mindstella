title: "検討事項"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: decisions
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数（開いたときは既定の状態の条件で 1）
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: dev/設計書/部品設計/プレビュー/表示形式の切り替え.ts#
    args:
      - name: views
        value: ボード・マップ・表
      - name: current
        value: プレビューを開く.view（既定 board）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: キーワード
    kind: input
    position: マップ > ツールバー
    description: タイトルに含む項目を黄色で強調する。読み上げの名前は「タイトルで強調するキーワード」
    io: 入力
    type: 文字列
    placeholder: タイトルで強調
    initial_value: 空
    visible_when: 表示形式がマップ
  - name: 条件のチップ
    kind: list
    position: ツールバーの下
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで、列の文字の条件を `{列}に「{文字}」を含む` のチップ（英数字で終わる列名の後は空白を挟む）で並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・マップ・ボードを描き直す'
    io: 入力
    visible_when: 表示形式がマップ・ボードで、値を 1 つ以上選んでいる条件があるとき
  - name: マップ
    id: decision-map
    kind: canvas
    description: 対象 → カテゴリー → フェーズ → 検討事項の木を ELK で配置した直角の枝で描く（SVG）。絞り込みのドロワーの条件に合う検討事項だけを描き、条件に合う検討事項を持たない対象・カテゴリー・フェーズの節は描かない。状態の帯は出さない。項目は 2 行目に ID・状態・影響度を補足の下の段（12px）で出す。項目を押すと「節のロックの操作」の規則で詳細パネルを開く。注目の起点（ロックした節、ロックしていなければ詳細を開いている節）から根までの枝と前提・後続の依存の線を強調し、ほかを薄くし、依存の線に小さな玉を流す。ロック中は、詳細を開いている節を強調の外でも薄くしない。中央へ送る節も注目の起点とし、ロック中にほかの節を開いても送り直さない。余白を押すと選びを外す（ロック中は鍵を震わせるだけ）。背景のドラッグで動かす。ホイールで拡大・縮小する
    io: 表示
    source: プレビューを開く.mindmap-data.decisions・プレビューを開く.mindmap-data.settings
    visible_when: 表示形式がマップで幅 901px 以上。elkjs が読めないときは読めなかったライブラリの知らせ
    action: 余白（マップの枠の中で項目の節の上でない所。対象・カテゴリー・フェーズの節と枝・依存の線の上を含む）を左ボタンで押してから離すまでの移動が上限以内なら、選んでいる項目があるときだけ、詳細パネルの「閉じる」と同じく選びを外す（詳細パネルを閉じ、URL のハッシュから項目の ID を外し、強調・薄い表示・玉を消す）。ロック中は選びを外さず、「節のロックの操作」のとおり鍵を震わせる。拡大・縮小で決めた倍率は保ち、「全体を表示」のときは広がった枠に合わせて倍率を求め直す。スクロールの位置は、選んだ項目を中央へ送り直さず、縦・横それぞれ、押す前の位置と、広がった枠で送れる端の位置のうち小さい方にする。移動が上限を超えたら背景のドラッグとして扱い、選びを保つ
  - name: 拡大・縮小・全体を表示
    kind: button
    position: マップの枠の外
    description: マップの倍率を変える・全体が収まる倍率にする。枠の外に固定する。ホイールを持たないキーボードの操作でも倍率を変えられるよう、ホイールと並べて残す
    visible_when: 表示形式がマップで幅 901px 以上
  - name: 字下げの一覧
    kind: list
    description: 狭い幅のマップ。木を字下げした縦の一覧で出し、押すと詳細を開く
    io: 表示
    source: マップと同じ
    visible_when: 表示形式がマップで幅 900px 以下
  - name: ボード
    kind: board
    description: 状態ごとの列に、絞り込みのドロワーの条件に合う検討事項をカードで並べる。状態の条件から外した状態の列も残し、列の中に「状態の条件で外しています。」と書く。ほかの 0 件の列は「検討事項はありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横に送り、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む。列は最も長い列の高さまで伸ばし、列の見出しはボードを縦に送ってもボードの上に留める。列の見出しは、画面の見出し（`h1`）の 1 段下の見出し（`h2`）にする。カードを押すと詳細を開く
    io: 表示
    source: プレビューを開く.mindmap-data.decisions
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: decisions
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・対象（絞れる）・カテゴリー（category、絞れる）・フェーズ（phase、絞れる）・影響度（絞れる）・着手可否（ready、絞れる）・前提・タグ（絞れる）
      - name: rows
        value: プレビューを開く.mindmap-data.decisions
      - name: filters
        value: 絞り込みのドロワーの selected（マップ・ボードと共有）
      - name: marks
        value: 差分の表示の間、選んだ時点で足した・変えた検討事項（記録の取得.changes）
      - name: comments
        value: サーバーにつながって開いたとき、検討事項の ID → その検討事項を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target）
    description: 検討事項の表。列「着手可否」は、`derived.next` にある未決定は「着手可能」、それ以外の未決定は「前提待ち」、未決定以外は「なし」
    visible_when: 表示形式が表
  - name: 条件に合う検討事項が無い旨
    kind: label
    position: マップの枠の中央（幅 901px 以上）・字下げの一覧（幅 900px 以下）
    description: 絞り込みの条件に合う検討事項が無いときに、条件のせいで空だと伝える文
    label: 表示する検討事項はありません。
    io: 表示
    visible_when: 表示形式がマップで、絞り込みの条件に合う検討事項が 1 件も無いとき
  - name: マップ・ボードの差分の印
    kind: label
    component: dev/設計書/部品設計/プレビュー/差分の印.ts#
    args:
      - name: kind
        value: 選んだ時点で足した項目は new、変えた項目は changed（記録の取得.changes）
    description: マップの箱とボードのカードで、タイトルの横に文言なしで置く。字下げの一覧にも同じ印を置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で足されたか変わったとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: dev/設計書/部品設計/プレビュー/絞り込み.ts#
    position: タブの帯の下から左に重ねる
    description: トップバーの絞り込みのボタンで開閉する。値の条件より上に、文字で絞れる列（値を選ぶ条件にしない、数でない列）の「文字を含む」の欄を並べる（部品設計『絞り込み』の `texts`）。マップ・ボード・表で 1 つの条件を共有し、表示形式を切り替えても保つ。幕を付けず、重ねていない右側は見えたまま操作できる。開いている間、ドロワーが覆った範囲の本文の部品を `inert` にする。外側を押しても閉じず、コメントの一覧とは同時に開かない（どちらかを開くと他方を閉じる）。条件を変えると、開いたままマップ・ボード・表を描き直す
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: 状態で要見直し・未決定・未整理・保留を選んだ状態。URL のハッシュに `f.{列}` があるときは既定に代えてその条件だけで開く
    args:
      - name: groups
        value: 状態（status。印は status）・タグ（tags）・対象（target）・カテゴリー（category）・フェーズ（phase）・影響度（weight）・着手可否（ready）。検討事項は種類（`kind`）を持たないので種類の条件を出さない。表示形式がマップのときは、キーワードに一致した件数を `hit` に渡す
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: プレビューを開く.mindmap-data.decisions の件数
      - name: shown
        value: 条件に合う検討事項の件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
  - name: ホイールでの拡大・縮小
    kind: gesture
    position: マップの枠の上
    description: マップの枠の上でホイールを回すと、マップを拡大・縮小する。ページ全体はスクロールしない
    io: 入力
    visible_when: 表示形式がマップで幅 901px 以上。elkjs が読めてマップを描いているとき
    action: ホイール 1 回（`wheel` の 1 件）ごとに、奥へ回す（`deltaY` が負）と倍率を 1.12 倍、手前へ回すと 1 / 1.12 倍にし、40%〜150% の範囲の端で止める（図の拡大と同じ刻み）。`deltaY` が 0 の件（横にだけ回した）は倍率を変えず、枠の横スクロールに任せる。倍率が「全体を表示」のときは、そのとき当たっている倍率を起点にする。「全体を表示」の倍率が 40% を下回っているときに手前へ回しても、倍率は変えない。倍率を変えた後、回す前にマウスの下にあったマップの点がマウスの下に残るように、枠のスクロールの位置を合わせる。倍率が数値のあいだは、マップの右と下に枠の幅・高さの分の余白を持たせ、マップが枠より小さくても拡大で点を残せるだけ送れるようにする（「全体を表示」のときの余白は変えない）。縮小で、マップの左端・上端より外へ送ることになるときは、左端・上端で止める。倍率を変えたら「全体を表示」の押された状態を外す。範囲の端で倍率が変わらないときも、ページはスクロールしない
  - name: 画面の領域
    kind: region
    description: トップバーとタブの帯の下の、窓の高さに収めた領域。ページ全体は縦にも横にもスクロールさせず、トップバーとタブの帯は常に見えたままにする。表・ボードは幅 721px 以上、マップは幅 901px 以上で、この領域の高さいっぱいに広げて中で縦・横にスクロールする。それより狭い幅では、この領域ごと縦にスクロールする
    visible_when: 常時
  - name: 中間の層のラベル
    kind: label
    position: マップ
    description: マップの対象と検討事項の間のカテゴリー・フェーズの節。カテゴリーは面（`--surface`）と線（`--border`）と太字、フェーズは地（`--bg`）と薄い線（`--border-soft`）と小さい文字で、枝の線と重ならない面を持つ
    io: 表示
    visible_when: 表示形式がマップで幅 901px 以上
    source: プレビューを開く.mindmap-data.decisions・プレビューを開く.mindmap-data.settings
  - name: マップ・ボードのコメントの印
    kind: label
    component: dev/設計書/部品設計/プレビュー/コメントの印.ts#
    args:
      - name: count
        value: その検討事項を指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    description: ボードのカードとマップの節点では 2 行目（メタ情報の並び）の右端、字下げの一覧ではタイトルと差分の印の右に置く。マップの節点の幅は、印の有無によらず全て 268px にする。コメントを溜める・直す・消す・戻す・送ると、マップの拡大と位置・スクロールの位置を動かさずに印だけを描き替える。印だけを押す操作は持たず、カード・節点・行を押すと今と同じく詳細パネルを開く
    io: 表示
    visible_when: サーバーにつながって開いていて、その検討事項を指すレビュー中のコメントが 1 件以上あるとき
  - name: 節の鍵
    kind: label
    position: マップ > 検討事項の節の右上の内側（1 行目の右端。コメントの印は 2 行目の右端なので重ならない）
    description: ロックの状態を示す印。閉じた鍵はロックした節に、開いた鍵はロックしていないときに詳細を開いている節に出す。押しても何も起きない。震えは画面設計『ネットワーク』の鍵と同じ動き（赤く光らせて大きくし、上を軸に左右へ振れさせて約 1 秒で収める）を、CSS のアニメーションに頼らず毎コマ当て、描き直して節の要素が変わっても続きから震わせる。`prefers-reduced-motion` でも止めない
    io: 表示
    visible_when: 表示形式がマップで幅 901px 以上。閉じた鍵はロック中いつも（詳細を閉じても、ほかの節へ移っても、タブを行き来しても残す）。開いた鍵はロックしていないとき、詳細を開いている節にカーソルを乗せたときだけ
  - name: 節のロックの操作
    kind: gesture
    position: マップの枠の上
    description: 注目の起点を 1 つの検討事項の節に留める。押したときの規則・素早い 2 回押しの扱い・鍵を震わせる場面は、画面設計『ネットワーク』の「ロックの操作」と同じにする（2 回目は、描き直しで節が消えた位置を押しても前に押した節への 2 回押しとして扱う）。ロックはネットワークとは別に持ち、ページを開いている間だけ保ってタブを行き来しても残す
    io: 入力
    visible_when: 表示形式がマップで幅 901px 以上。幅 900px 以下の字下げの一覧ではロックしない
  - name: 消した項目の帯
    kind: list
    component: dev/設計書/部品設計/プレビュー/消した項目の帯.ts#
    args:
      - name: items
        value: 選んだ時点で消した項目（記録の取得.changes の removed）のうち、種類が decision のものの id・title を ID の順に並べたもの。合わせた範囲で足して消した項目も含む
    position: ツールバー・条件のチップの下、マップ（幅 900px 以下は字下げの一覧）・ボード・表の上
    description: 選んだ時点で消した検討事項を並べる。表示形式と絞り込みの条件によらず同じ帯を出す。項目は押せず、詳細パネルを開かず、マップの節にもしない
    io: 表示
    source: 記録の取得.changes
    visible_when: 差分の表示の間で、選んだ時点で検討事項を 1 件以上消したとき
    status: planned
lead: 検討事項をボード（既定）・マップ・表で見る画面。
mock: dev/mock/pages/decisions/123/standard/index.html
test_file: tests/integration/preview/test_decisions_screen.py
notes:
  コメントの印のモック: コメントの印の見本は `dev/mock/pages/decisions/121/standard/index.html`（マップのホイールでの拡大・縮小は持たない）
  消した項目のモック: 消した項目の帯の見本は `dev/mock/pages/decisions/179/b-band/index.html`

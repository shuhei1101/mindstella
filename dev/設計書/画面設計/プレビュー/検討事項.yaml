title: "検討事項"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: decisions
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: dev/設計書/部品設計/プレビュー/表示形式の切り替え.ts#
    args:
      - name: views
        value: マップ・ボード・表
      - name: current
        value: プレビューを開く.view（既定 map）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: 状態の印
    kind: checkbox
    position: マップ > ツールバー
    description: 状態ごとの印（色と形）を付けたチェックボックス。外すとその状態の項目を非表示にする。非表示の印は薄い色と点線の枠で出す。キーワードに一致した項目を含む印に件数のバッジ（非表示の状態の項目も数える。読み上げの名前は「キーワードに一致した項目 {件数} 件」）
    initial_value: 要見直し・未決定・未整理・保留を表示、決定済み・対象外・取り下げを非表示
    visible_when: 表示形式がマップ
    action: 外すとその状態の項目を隠し、入れると出して、マップを描き直す。「すべての状態を表示」の箱を結果にそろえる
  - name: キーワード
    kind: input
    position: マップ > ツールバー
    description: タイトルに含む項目を黄色で強調する。読み上げの名前は「タイトルで強調するキーワード」
    io: 入力
    type: 文字列
    placeholder: タイトルで強調
    initial_value: 空
    visible_when: 表示形式がマップ
  - name: マップ
    id: decision-map
    kind: canvas
    description: 対象 → カテゴリー → フェーズ → 検討事項の木を ELK で配置した直角の枝で描く（SVG）。項目は 2 行目に ID・状態・影響度を補足の下の段（12px）で出す。項目を押すと根までの枝と前提・後続の依存の線を強調し、ほかを薄くし、依存の線に小さな玉を流して詳細パネルを開く。余白を押すと選びを外す。背景のドラッグで動かす
    io: 表示
    source: プレビューを開く.mindmap-data.decisions・プレビューを開く.mindmap-data.settings
    visible_when: 表示形式がマップで幅 901px 以上。elkjs が読めないときは読めなかったライブラリの知らせ
    action: 余白（マップの枠の中で項目の節の上でない所。対象・カテゴリー・フェーズの節と枝・依存の線の上を含む）を左ボタンで押してから離すまでの移動が上限以内なら、選んでいる項目があるときだけ、詳細パネルの「閉じる」と同じく選びを外す（詳細パネルを閉じ、URL のハッシュから項目の ID を外し、強調・薄い表示・玉を消す）。スクロールの位置と、拡大・縮小で決めた倍率は保ち、「全体を表示」のときは広がった枠に合わせて倍率を求め直す。移動が上限を超えたら背景のドラッグとして扱い、選びを保つ
  - name: 拡大・縮小・全体を表示
    kind: button
    position: マップの枠の外
    description: マップの倍率を変える・全体が収まる倍率にする。枠の外に固定する
    visible_when: 表示形式がマップで幅 901px 以上
  - name: 字下げの一覧
    kind: list
    description: 狭い幅のマップ。木を字下げした縦の一覧で出し、押すと詳細を開く
    io: 表示
    source: マップと同じ
    visible_when: 表示形式がマップで幅 900px 以下
  - name: ボード
    kind: board
    description: 状態ごとの列にカードを並べる。0 件の列は「検討事項はありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横に送り、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む。カードを押すと詳細を開く
    io: 表示
    source: プレビューを開く.mindmap-data.decisions
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: decisions
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・対象（絞れる）・カテゴリー（category、絞れる）・フェーズ（phase、絞れる）・影響度（絞れる）・着手可否（ready、絞れる）・前提・タグ（絞れる）
      - name: rows
        value: プレビューを開く.mindmap-data.decisions
      - name: filters
        value: プレビューを開く.f.{列}（開いたときだけ）
    description: 検討事項の表。列「着手可否」は、`derived.next` にある未決定は「着手可能」、それ以外の未決定は「前提待ち」、未決定以外は「なし」
    visible_when: 表示形式が表
  - name: すべての状態を表示
    kind: checkbox
    position: マップ > ツールバー > 状態の印の右端
    description: 状態の印をまとめて切り替える、文字を添えないチェックの箱。帯に並ぶ全ての状態を表示していればチェック、一部なら横棒（`indeterminate`）、全て隠していれば空。空か横棒のときに押すと全ての状態を表示し、チェックのときに押すと全て隠す。押した後、各状態の印のチェックを結果にそろえる。箱は背景を透過にして枠と記号だけで描き、枠の色は印の枠と同じ、記号は箱の中心に置く。横棒も枠線で描き、ハイコントラストでも消えないようにする。読み上げの名前は `aria-label` の「すべての状態を表示」
    io: 入力
    type: 真偽値
    visible_when: 表示形式がマップ
    initial_value: 横棒（要見直し・未決定・未整理・保留を表示し、決定済み・対象外・取り下げを隠すため）。隠す状態が帯に 1 つも無いときはチェック
    action: 空か横棒のときに押すと全ての状態を表示し、チェックのときに押すと全て隠す。各状態の印のチェックを結果にそろえ、マップを描き直す
  - name: 表示する状態の検討事項が無い旨
    kind: label
    position: マップの枠の中央（幅 901px 以上）・字下げの一覧（幅 900px 以下）
    description: 全ての状態を隠したときに、隠したせいで空だと伝える文
    label: 表示する検討事項はありません。
    io: 表示
    visible_when: 表示形式がマップで、表示する状態の検討事項が 1 件も無いとき
lead: 検討事項をマップ（既定）・ボード・表で見る画面。
mock: dev/mock/pages/decisions/38/b-check/index.html
test_file: tests/integration/preview/test_decisions_screen.py

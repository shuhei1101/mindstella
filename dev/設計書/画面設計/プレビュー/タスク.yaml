title: "タスク"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: tasks
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
      - name: filter
        value: 'true'
      - name: filter_count
        value: 絞り込みのドロワーで値を 1 つ以上選んでいる条件の数
      - name: filter_open
        value: 絞り込みのドロワーを開いているか
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: dev/設計書/部品設計/プレビュー/表示形式の切り替え.ts#
    args:
      - name: views
        value: ボード・表
      - name: current
        value: プレビューを開く.view（既定 board）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: 条件のチップ
    kind: list
    position: ツールバーの下
    description: '絞り込みのドロワーで選んでいる値を `{列}: {値}` のチップで並べ、× で 1 つ解除し、末尾の「すべて解除」で全ての条件を外す（表の上のチップと同じ行。モジュール構成『画面と部品』の `filterChips`）。解除するとドロワー・バッジ・ボードを描き直す'
    io: 入力
    visible_when: 表示形式がボードで、値を 1 つ以上選んでいる条件があるとき
  - name: ボード
    kind: board
    description: 状態（未着手・進行中・保留・完了・中止）ごとの列に、絞り込みのドロワーの条件に合うタスクをカードで並べる。完了・中止の列も出す。状態の条件から外した状態の列も残し、列の中に「状態の条件で外しています。」と書く。ほかの 0 件の列は「タスクはありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横に送り、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む。カードに進める検討事項（`for`）を出し、押すと詳細を開く
    io: 表示
    source: プレビューを開く.mindmap-data.tasks
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: tasks
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・種類（絞れる）・進める検討事項・対象（絞れる）・カテゴリー（絞れる）・フェーズ（絞れる）・タグ（絞れる）
      - name: rows
        value: プレビューを開く.mindmap-data.tasks
      - name: filters
        value: 絞り込みのドロワーの selected（ボードと共有）
      - name: marks
        value: 差分の表示の間、選んだ時点で足した・変えたタスク（記録の取得.changes）
      - name: comments
        value: サーバーにつながって開いたとき、タスクの ID → そのタスクを指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target）
    description: タスクの表
    visible_when: 表示形式が表
  - name: ボードの差分の印
    kind: label
    component: dev/設計書/部品設計/プレビュー/差分の印.ts#
    args:
      - name: kind
        value: 選んだ時点で足した項目は new、変えた項目は changed（記録の取得.changes）
    description: ボードのカードのタイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で足されたか変わったとき
  - name: 絞り込みのドロワー
    kind: dialog
    component: dev/設計書/部品設計/プレビュー/絞り込み.ts#
    position: タブの帯の下から左に重ねる
    description: 画面設計『検討事項』の絞り込みのドロワーと同じ出し方で、ボード・表で 1 つの条件を共有する
    io: 入力
    visible_when: トップバーの絞り込みのボタンを押したとき
    initial_value: どの値も選んでいない。URL のハッシュに `f.{列}` があるときはその条件で開く
    args:
      - name: groups
        value: 種類（kind）・状態（status。印は status）・タグ（tags）・対象（target）・カテゴリー（category）・フェーズ（phase）
      - name: selected
        value: 開いたときは「初期値」。以降はドロワーと表のチップで変えた条件
      - name: total
        value: プレビューを開く.mindmap-data.tasks の件数
      - name: shown
        value: 条件に合うタスクの件数
      - name: narrow
        value: 画面の幅が 900px 以下のとき true
  - name: ボードのコメントの印
    kind: label
    component: dev/設計書/部品設計/プレビュー/コメントの印.ts#
    args:
      - name: count
        value: そのタスクを指すレビュー中のコメントの件数（レビュー中のコメントの読み取り.items[].target で数える）
    description: ボードのカードのメタ情報の並びの右端に置く。コメントを溜める・直す・消す・戻す・送ると、スクロールの位置を動かさずに印だけを描き替える。印だけを押す操作は持たない
    io: 表示
    visible_when: サーバーにつながって開いていて、そのタスクを指すレビュー中のコメントが 1 件以上あるとき
lead: タスクをボード（既定）・表で見る画面。
mock: dev/mock/pages/tasks/89/standard/index.html
test_file: tests/integration/preview/test_tasks_screen.py

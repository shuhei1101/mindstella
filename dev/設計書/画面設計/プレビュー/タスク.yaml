title: "タスク"
elements:
  - name: トップバー
    kind: nav
    component: dev/設計書/部品設計/プレビュー/トップバー.ts#
    args:
      - name: title
        value: プレビューを開く.mindmap-data.settings.summary
      - name: tabs
        value: 概要と同じ
      - name: current
        value: tasks
      - name: theme
        value: 概要と同じ
      - name: connection
        value: 概要と同じ
      - name: read_at
        value: 概要と同じ
      - name: diffPoint
        value: 『概要』のトップバーと同じ
      - name: comments
        value: サーバーの配信では true、配る書き出しでは false
      - name: comment_count
        value: レビュー中のコメントの読み取り.items の件数（溜める・消す・元に戻す・まとめて送るの後に描き直す）
      - name: comments_open
        value: コメントの一覧を開いているか
      - name: settings_open
        value: 概要と同じ
    description: 全ての画面で共通の帯
    visible_when: 常時
  - name: 表示形式の切り替え
    kind: segment
    component: dev/設計書/部品設計/プレビュー/表示形式の切り替え.ts#
    args:
      - name: views
        value: ボード・表
      - name: current
        value: プレビューを開く.view（既定 board）
    position: ツールバーの左端
    description: 表示形式を切り替える
    visible_when: 常時
  - name: ボード
    kind: board
    description: 状態（未着手・進行中・保留・完了・中止）ごとの列にカードを並べる。完了・中止の列も出す。0 件の列は「タスクはありません。」。列の左端とカードの間に余白を空け、カードの端はツールバーに揃える。幅 721px 以上は列を 290px の幅で横に並べ、横に送り、背景のドラッグで動かす。幅 720px 以下は列を縦に 1 列に積む。カードに進める検討事項（`for`）を出し、押すと詳細を開く
    io: 表示
    source: プレビューを開く.mindmap-data.tasks
    visible_when: 表示形式がボード
  - name: 表
    kind: table
    component: dev/設計書/部品設計/プレビュー/表.ts#
    args:
      - name: kind
        value: tasks
      - name: columns
        value: ID・タイトル（外せない）・状態（status、絞れる）・種類（絞れる）・進める検討事項・対象（絞れる）・カテゴリー（絞れる）・フェーズ（絞れる）・タグ（絞れる）
      - name: rows
        value: プレビューを開く.mindmap-data.tasks
      - name: filters
        value: プレビューを開く.f.{列}（開いたときだけ）
      - name: marks
        value: 差分の表示の間、選んだ時点で足した・変えたタスク（記録の取得.changes）
    description: タスクの表
    visible_when: 表示形式が表
  - name: ボードの差分の印
    kind: label
    component: dev/設計書/部品設計/プレビュー/差分の印.ts#
    args:
      - name: kind
        value: 選んだ時点で足した項目は new、変えた項目は changed（記録の取得.changes）
    description: ボードのカードのタイトルの横に文言なしで置く
    io: 表示
    visible_when: 差分の表示の間で、その項目が選んだ時点で足されたか変わったとき
lead: タスクをボード（既定）・表で見る画面。
mock: dev/mock/pages/tasks/60/standard/index.html
test_file: tests/integration/preview/test_tasks_screen.py

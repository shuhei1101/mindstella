title: プレビュー / topbar
lead: 部品設計『トップバー.tsx』の props・イベント・状態を持つ。
components:
- name: Topbar
  title: トップバー
  kind: コンポーネント
  container: frontend/src/shared/components/topbar.tsx
  usecase: 共通
  summary: 部品設計『トップバー.tsx』の props・イベント・状態を持つ
  refs:
  - dev/設計書/部品設計/プレビュー/トップバー.tsx#
  unit_tests:
  - name: test_topbar_when_navigate
    case: 正常
    summary: タブを押すと onNavigate
    condition: '`tabs` に概要と検討事項を渡し、検討事項のタブを押す'
    mock: なし
    expected: '`onNavigate` が `decisions` で 1 回呼ばれる'
  - name: test_topbar_when_offline
    case: 正常
    summary: offline で接続の状態を出す
    condition: '`connection` に offline、`readAt` を渡す'
    mock: なし
    expected: 「サーバーにつながりません」を含む状態が出る
  - name: test_topbar_when_many_comments
    case: 正常
    summary: 100 件以上は 99+
    condition: '`comments` true・`commentCount` 120'
    mock: なし
    expected: 件数の札が `99+`、読み上げの名前に 120
notes:
  単体テスト: 同じフォルダの `topbar.test.tsx` に置く（knowledge の規約『フォルダ構成』）

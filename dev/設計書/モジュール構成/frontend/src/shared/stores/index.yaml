summary: '`frontend/src/shared/stores/` の React のプレビューのモジュール'
items:
- page: connection-store.ts.yaml
  summary: 書き換えの知らせがつながっているか（インターフェース定義『SPAを開く』の制約「接続の状態」）
- page: theme-store.ts.yaml
  summary: 今の画面と同じキー。値の JSON の `theme` だけを読み書きし、他のキーは残す
- page: prefs-store.ts.yaml
  summary: 表の列・ピン留め・差分のミニマップ・本文の差分の並べ方・本文の見せ方・絞り込みの条件・表示する種類・ネットワークの見た目・コメントの一覧のピン止め・レビュー中のコメントの並びを、今の画面と同じ `localStorage` のキーで読み書きする（制約「端末の保存領域」）
- page: edit-session-store.ts.yaml
  summary: 開いている追加の入力と、直前の保存で書き込めなかった編集
- page: display-notice-store.ts.yaml
  summary: 表示の設定の知らせ（ワークスペースの既定が変わった知らせと、表示の設定のパネルの `message`）
- page: location-highlight-store.ts.yaml
  summary: コメントの一覧（レビュー中の書き込みの行・スレッドの向けた項目）から開いた項目の中で示す箇所

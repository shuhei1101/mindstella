id: MOD-489-119
title: プレビュー / post-links
lead: 書き込みの描いた本文に、項目の ID のボタンとまとまりのリンクを付ける（今の画面の `components/thread-post.ts` と同じ振る舞い）。
functions:
  - name: linkChangeSets
    title: まとまりのリンク
    kind: 関数
    usecase: 前回からの差分を見る
    summary: '`#` で始まるリンクのうち、記録にあるまとまりを指すものをまとまりのリンクにし、それ以外は中の文字に置き換える'
    args:
      - name: root
        type: HTMLElement
        description: 描いた本文
      - name: changeSets
        type: LookupTitle
        description: まとまりの ID から説明を引く
      - name: onChangeSet
        type: '(id: string) => void'
        description: まとまりのリンクを押したとき
    returns:
      type: void
      description: root を書き換える
    container: frontend/src/shared/core/post-links.ts
  - name: buttonizeItemIds
    title: 項目の ID のボタン
    kind: 関数
    usecase: スレッドで話す
    summary: 描いた本文の文字のうち、記録にある項目の ID をその項目を開くボタンにする（コード・リンク・ボタン・図・HTML の本文の枠の中と、記録に無い ID・スレッドの ID は文字のまま）
    args:
      - name: root
        type: HTMLElement
        description: 描いた本文
      - name: titles
        type: LookupTitle
        description: 項目の ID からタイトルを引く
      - name: onOpen
        type: '(id: string) => void'
        description: ボタンを押したとき
    returns:
      type: void
      description: root を書き換える
    container: frontend/src/shared/core/post-links.ts

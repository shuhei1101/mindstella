title: プレビュー / filters
lead: 画面ごとの絞り込みの条件を行に当てる計算。
functions:
- name: matchesFilters
  title: 絞り込みの判定
  kind: 関数
  usecase: 項目を表で絞り込む
  summary: '`f.{列}` の値の条件と `~{列}` の文字の条件に行が合うかを返す'
  args:
  - name: row
    type: Record<string, unknown>
    required: true
    description: 行
  - name: filters
    type: Record<string, string>
    required: true
    description: 条件
  returns:
    type: boolean
    description: 合うか
  unit_tests:
  - name: test_matches_filters
    case: 正常
    summary: 値の条件
    condition: '`{status: ''要見直し|保留''}` と状態が保留の行'
    mock: なし
    expected: 'true'
  - name: test_matches_filters_when_text
    case: 正常
    summary: 文字の条件は大文字・小文字を区別しない
    condition: '`{''~title'': ''abc''}` と `ABCD` の行'
    mock: なし
    expected: 'true'
  - name: test_matches_filters_when_not_match
    case: 正常
    summary: 合わない
    condition: '`{status: ''保留''}` と状態が完了の行'
    mock: なし
    expected: 'false'
  container: frontend/src/shared/core/filters.ts
- name: defaultFilters
  title: 画面の既定の条件
  kind: 関数
  usecase: 項目を表で絞り込む
  summary: 検討事項は状態の 4 値、ほかは空を返す
  args:
  - name: tab
    type: PreviewTab
    required: true
    description: 画面
  returns:
    type: Record<string, string>
    description: 条件
  unit_tests:
  - name: test_default_filters
    case: 正常
    summary: 検討事項の既定
    condition: '`decisions`'
    mock: なし
    expected: '`status` に 要見直し・未決定・未整理・保留'
  container: frontend/src/shared/core/filters.ts
notes:
  単体テスト: 同じフォルダの `filters.test.ts` に置く（knowledge の規約『フォルダ構成』）

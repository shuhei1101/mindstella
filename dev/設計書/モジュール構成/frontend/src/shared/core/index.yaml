summary: '`frontend/src/shared/core/` の React のプレビューのモジュール'
items:
- page: app-error.ts.yaml
  summary: 失敗した応答から作るエラー。`detail` を画面に出す
- page: legacy-url.ts.yaml
  summary: React に無い画面を開くときの今の画面（インターフェース定義『プレビューの配信』）
- page: preview-search.ts.yaml
  summary: SPA の search params（インターフェース定義『SPAを開く』の request）の Zod スキーマと、記録に合わない値を外す処理、今の画面へ写すハッシュ
- page: records.ts.yaml
  summary: 記録の型・索引・関係する項目（今の画面の `core/records.ts` と同じ振る舞い）
- page: filters.ts.yaml
  summary: 画面ごとの絞り込みの条件を行に当てる計算
- page: diff.ts.yaml
  summary: 差分の表示の計算（今の画面の `core/diff.ts` と同じ振る舞い
- page: edits.ts.yaml
  summary: 保存待ちの編集を記録に重ねる計算（今の画面の `core/edits.ts` と同じ振る舞い）
- page: doc-export.ts.yaml
  summary: 資料のエクスポートの HTML と Markdown の組み立て（今の画面の `core/doc-export.ts` と同じ振る舞い）
- page: body-links.ts.yaml
  summary: 描いた本文に、見出しのリンク・本文の印・項目の ID のリンクを付ける処理（今の画面の `core/libs.ts` の `linkHeadings`・`linkBody` と同じ振る舞い）
- page: markdown-decorate.ts.yaml
  summary: 描いた Markdown の本文の見せ方（表の列の幅・固定・見出しの固定・しま模様・セクションの折りたたみ・コードブロックの札とコピー・Alert の見出し）
- page: minimap.ts.yaml
  summary: 差分のミニマップの印の計算と操作
- page: body-render.ts.yaml
  summary: 本文の差分の描画（足した・消した塊・語の面・図の差分）
- page: side-by-side.ts.yaml
  summary: 左右に並べた本文の差分の組み立て
- page: html-body-diff.ts.yaml
  summary: HTML の本文の差分の組み立て
- page: html-frame.ts.yaml
  summary: スクリプトを動かさない HTML の本文の枠の組み立て
- page: term-tips.ts.yaml
  summary: 本文の印のツールチップと、見出しへの送り・示す箇所
- page: list-rows.ts.yaml
  summary: 一覧の行の絞り込み・並べ替え・ドロワーの条件の組み立て
- page: format.ts.yaml
  summary: 日時と値の文字の組み立て
- page: dom-parts.ts.yaml
  summary: mdmark が描いた本文の中へ足す要素の組み立て
- page: lock.ts.yaml
  summary: 注目の起点のロックの判定と鍵の震え
- page: comments.ts.yaml
  summary: コメントの一覧・スレッド・レビュー中の書き込みの計算（今の画面の `screens/comments.ts`・`components/thread-row.ts` の DOM に触らない関数と同じ振る舞い）
- page: display.ts.yaml
  summary: 表示の設定の計算（今の画面の `components/settings-panel.ts`・`settings-confirm.ts` の DOM に触らない関数と、`app.ts` の既定に戻すと同じ振る舞い）
- page: post-links.ts.yaml
  summary: 書き込みの描いた本文に、項目の ID のボタンとまとまりのリンクを付ける
- page: voice.ts.yaml
  summary: コメント・返信の入力の録音と、カーソルの位置への挿入（今の画面の `core/voice.ts` と同じ振る舞い）

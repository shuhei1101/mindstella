title: プレビュー / use-voice-input
lead: 文字起こしの可否の query と、コメント・返信の入力の録音・文字起こし・すぐ送るをまとめて、部品へ渡す音声入力の props を返す。
functions:
- name: useTranscriptionStatus
  title: 文字起こしの可否
  kind: フック
  usecase: 音声でコメントする
  summary: '`GET /api/transcription` の query。マイクのボタンを描く画面と設定の画面が開いたときに読み、押せないマイクのボタンを押したときと設定の画面を開いたときに読み直す（書き換えの知らせでは読み直さない）'
  returns:
    type: UseQueryResult<TranscriptionStatus>
    description: query
  unit_tests:
  - name: test_use_transcription_status
    case: 正常
    summary: 可否を読む
    condition: '200・`{available: false, reason: stopped}`'
    mock: MSW
    expected: '`data.reason` が `stopped`'
  container: frontend/src/shared/hooks/use-voice-input.ts
- name: useVoiceInput
  title: 音声入力
  kind: フック
  usecase: 音声でコメントする
  summary: 向けた先（`{target, loc}` か `{thread}`）と入力欄の中身の書き換えを受け、`voice`・`voiceReason`・`elapsed` と `onVoiceStart`・`onVoiceCancel`・`onVoiceDone`・`onVoiceBlocked` を返す。録音は同時に 1 つで、ほかの入力が録っている間はマイクを押しても何もしない
  description: |-
    - `voice` は、`micSupported()` が偽なら `disabled`（`VOICE_TEXT.noMicrophone`）、可否の `available` が偽なら `disabled`（`detail`）、それ以外は録音の段階
    - `onVoiceDone` は、録音を止めて `POST /api/transcriptions` へ送り、返った文字を `insertAtCursor` で挿入する。記録の `settings.transcription.action`（無ければ `send`）が `insert` なら中身を書き換えて `inserted`、`send` なら `POST /api/comments/send-now` へ全文を送り、送れたら中身を空にしてスレッドを読み直し `sent`（`entered`）、送れなければ挿入した中身を残して `VOICE_TEXT.sendFailed`
    - 503 は可否の query のデータを返った `reason`・`detail` に書き換え、`voice` を `disabled` にする
    - 向けた先が変わったときと、使う部品が外れたとき（unmount）は録音を `cancel` し、文字起こし中の結果を捨てる。書き換えの知らせでの描き直しでは止めない
  returns:
    type: '{voice, voiceReason, elapsed, status, detail, entered, onVoiceStart, onVoiceCancel, onVoiceDone, onVoiceBlocked}'
    description: 部品設計『コメントの入力.tsx』『返信の入力.tsx』の音声入力の props
  unit_tests:
  - name: test_use_voice_input
    case: 正常
    summary: 録音して挙動で分ける
    condition: '偽の録音。`POST /api/transcriptions` が `{text: 案 A にする}`。`settings.transcription.action` が `insert` / 無い（`send`）'
    mock: MSW と `vi.stubGlobal`
    expected: '中身が `確認: 案 A にする` で `status` が `inserted`、`send-now` は呼ばれない / `send-now` が全文で 1 回呼ばれ、中身が空で `status` が `sent`'
  - name: test_use_voice_input_when_unavailable
    case: 異常
    summary: 押せない理由と 503
    condition: '`micSupported()` が偽 / `POST /api/transcriptions` が 503・`reason: unsupported`'
    mock: MSW と `vi.stubGlobal`
    expected: '`voice` が `disabled` で `voiceReason` が `VOICE_TEXT.noMicrophone` / `voice` が `disabled` で `voiceReason` がその `detail`'
  - name: test_use_voice_input_when_destination_changed
    case: 正常
    summary: 向けた先が変わったら録音を捨てる
    condition: 録音中に向けた先を D-1 から D-2 に変える / 文字起こし中に unmount する
    mock: MSW と `vi.stubGlobal`
    expected: 録音の `cancel` が呼ばれ `voice` が `idle` / 返った文字を挿入も送信もしない
  container: frontend/src/shared/hooks/use-voice-input.ts
notes:
  単体テスト: 同じフォルダの `use-voice-input.test.ts` に置く（knowledge の規約『フォルダ構成』）
  API: '`frontend/openapi.yaml` に `GET /api/transcription`・`POST /api/transcriptions`・`POST /api/comments/send-now` を足し、orval で生成した呼び出しを使う'

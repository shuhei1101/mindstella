summary: '`frontend/src/shared/hooks/` の React のプレビューのモジュール'
items:
- page: preview-queries.ts.yaml
  summary: SPA が読む query（記録・レビュー中のコメント・保存待ちの編集・スレッド）と invalidate
- page: use-preview-search.ts.yaml
  summary: search の読み書き
- page: use-diff-view.ts.yaml
  summary: 差分の表示の時点と、項目ごとの印を返す
- page: use-edits.ts.yaml
  summary: 保存待ちの編集を溜める・取り消す・まとめて保存する mutation
- page: use-screen-filters.ts.yaml
  summary: 画面の絞り込みの条件を URL と端末の保存領域で持つ（制約「保存した絞り込みの条件」）
- page: use-records.ts.yaml
  summary: 記録に保存待ちの編集を重ねた索引を読む
- page: use-screen-edit.ts.yaml
  summary: 一覧の画面の編集の入口を組む
- page: use-visible-kinds.ts.yaml
  summary: 表示する種類を返す
- page: use-comments.ts.yaml
  summary: レビュー中の書き込みを溜める・書き換える・消す・まとめて送る mutation と、書きかけの保存
- page: use-voice-input.ts.yaml
  summary: 文字起こしの可否の query と、コメント・返信の入力の録音・文字起こし・すぐ送るの props

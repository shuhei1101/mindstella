title: プレビュー / use-diff-view
lead: 差分の表示の時点と、項目ごとの印を返す。
functions:
- name: useDiffView
  title: 差分の表示
  kind: フック
  usecase: 前回からの差分を見る
  summary: search の `diff` と端末の保存領域の時点から `DiffPoint` を解決し、`POST /api/opened` の時点を `sessionStorage` に持つ
  returns:
    type: DiffView
    description: 時点・印・消した項目
  unit_tests:
  - name: test_use_diff_view
    case: 正常
    summary: URL の時点で解決する
    condition: '`diff=V-2`'
    mock: MSW
    expected: V-2 の時点
  - name: test_use_diff_view_when_saved
    case: 正常
    summary: 端末の時点を URL に書く
    condition: URL に無く端末に `V-1`
    mock: MSW
    expected: '`setDiff(''V-1'')` が呼ばれる'
  - name: test_use_diff_view_when_opened_stored
    case: 正常
    summary: 同じタブで呼び直さない
    condition: '`sessionStorage` に時点がある'
    mock: MSW
    expected: '`POST /api/opened` が呼ばれない'
  container: frontend/src/shared/hooks/use-diff-view.ts
notes:
  単体テスト: 同じフォルダの `use-diff-view.test.ts` に置く（knowledge の規約『フォルダ構成』）

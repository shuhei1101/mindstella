title: プレビュー / workspace-settings-screen
lead: 画面設計『設定の画面.tsx』の要素と操作を描く。
components:
- name: WorkspaceSettingsScreen
  title: 設定の画面
  kind: 画面
  usecase: 画面で項目を編集して保存する
  summary: 画面設計『設定の画面.tsx』の要素と操作を描く
  refs:
  - dev/設計書/画面設計/プレビュー/設定の画面.tsx#
  unit_tests:
  - name: test_workspace_settings_screen
    case: 正常
    summary: 題名を溜める
    condition: 題名を書いて入力欄を離れる
    mock: MSW
    expected: '`POST /api/edits` が `setting` で呼ばれる'
  - name: test_workspace_settings_screen_when_transcription
    case: 正常
    summary: 音声入力のまとまり
    condition: '`GET /api/transcription` が `{available: true, presets: [一般, 開発]}` で「入力欄へ挿入する」を選ぶ / `{available: false, reason: stopped}`'
    mock: MSW
    expected: '`POST /api/edits` が `{op: setting, key: transcription, value: {action: insert, preset: null}}` で呼ばれる / プリセットのセレクトが押せず「文字起こしのサービスが起動していないため、候補を取得できません。サービスを起動してから設定の画面を開き直してください。」'
  container: frontend/src/features/settings/workspace-settings/workspace-settings-screen.tsx
notes:
  単体テスト: 同じフォルダの `workspace-settings-screen.test.tsx` に置く（knowledge の規約『フォルダ構成』）

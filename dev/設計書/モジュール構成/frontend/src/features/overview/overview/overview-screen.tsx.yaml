title: プレビュー / overview-screen
lead: 画面設計『概要.tsx』のトップバーとタイルを描く。記録が読めないときは detail の行を出す。
components:
- name: OverviewScreen
  title: 概要の画面
  kind: 画面
  container: frontend/src/features/overview/overview/overview-screen.tsx
  usecase: 概要を見る
  summary: 画面設計『概要.tsx』のトップバーとタイルを描く。記録が読めないときは detail の行を出す
  refs:
  - dev/設計書/画面設計/プレビュー/概要.tsx#
  unit_tests:
  - name: test_overview_screen
    case: 正常
    summary: 記録でタイルを描く
    condition: MSW で記録・コメント・保存待ち・スレッドを返す
    mock: MSW
    expected: 6 つのタイルが項目 ID で引け、トップバーの題名が `settings.summary`
  - name: test_overview_screen_when_records_invalid
    case: 異常
    summary: 422 で detail を出す
    condition: MSW で `GET /api/records` に 422 と problem+json
    mock: MSW
    expected: detail の行が出て、タイルが無い
  - name: test_overview_screen_when_show_all
    case: 正常
    summary: すべて表示は今の画面へ
    condition: 要見直しの検討事項を返し、要見直しの「すべて表示」を押す
    mock: MSW・`window.location.assign`
    expected: '`assign` が今の画面の要見直しの条件のハッシュで呼ばれる'
notes:
  単体テスト: 同じフォルダの `overview-screen.test.tsx` に置く（knowledge の規約『フォルダ構成』）

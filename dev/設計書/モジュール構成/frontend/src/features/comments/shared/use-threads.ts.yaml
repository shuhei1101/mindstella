title: プレビュー / use-threads
lead: スレッドの状態の書き換えと利用者の既読の mutation。
functions:
- name: useSetThreadStatus
  title: スレッドの状態の書き換え
  kind: フック
  usecase: スレッドで話す
  summary: '`PATCH /api/threads/{id}` へ `status` と `reason` を送り、成功でスレッドを読み直す'
  returns:
    type: UseMutationResult
    description: mutation
  unit_tests:
  - name: test_use_set_thread_status
    case: 正常
    summary: 読み直す
    condition: '200'
    mock: MSW
    expected: スレッドの query が読み直される
  - name: test_use_set_thread_status_when_error
    case: 異常
    summary: エラーの detail
    condition: '409'
    mock: MSW
    expected: '`AppError` の `detail`'
  container: frontend/src/features/comments/shared/use-threads.ts
- name: useMarkThreadSeen
  title: スレッドの既読
  kind: フック
  usecase: スレッドで話す
  summary: '`POST /api/threads/{id}/seen` を呼ぶ。応答を待たずに `withSeen` でスレッドの query の値を書き換える（楽観更新の許可リストの既読の状態）'
  returns:
    type: UseMutationResult
    description: mutation
  unit_tests:
  - name: test_use_mark_thread_seen
    case: 正常
    summary: 印をすぐ消す
    condition: 未読の TH-1
    mock: MSW
    expected: 応答の前にスレッドの query の TH-1 が既読
  container: frontend/src/features/comments/shared/use-threads.ts
notes:
  単体テスト: 同じフォルダの `use-threads.test.ts` に置く（knowledge の規約『フォルダ構成』）

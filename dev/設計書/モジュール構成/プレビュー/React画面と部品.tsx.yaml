title: プレビュー / React の画面と部品
lead: React のプレビューの共通の部品（トップバー・shadcn/ui の部品）と概要の画面。
directory: "```\nfrontend/src/\n  shared/components/\n    ui/button.tsx         shadcn/ui の Button（Base UI 版）\n    topbar.tsx            トップバー\n    topbar.stories.tsx    トップバーの状態ごとのストーリー\n  shared/styles/\n    tokens.css            :root の 3 ティアのトークン（デザイン方針の値）\n    index.css             Tailwind の読み込みと @theme inline\n  features/overview/overview/\n    overview-screen.tsx   概要の画面\n    overview-screen.stories.tsx  概要の画面のストーリー（MSW）\n    queries.ts            概要が読む query の合成と invalidate\n    search.ts             概要の search（React の入口）\n    components/\n      next-tile.tsx       次に検討する項目のタイル\n      goal-tile.tsx       ゴールまでの進捗のタイル\n      list-tile.tsx       要見直し・保留・進行中のタスクのタイル\n      progress-table.tsx  カテゴリー別の進捗のタイル\n```"
components:
- name: Topbar
  title: トップバー
  kind: コンポーネント
  container: frontend/src/shared/components/topbar.tsx
  usecase: 共通
  summary: 部品設計『トップバー.tsx』の props・イベント・状態を持つ
  refs:
  - dev/設計書/部品設計/プレビュー/トップバー.tsx#
  unit_tests:
  - name: test_topbar_when_navigate
    case: 正常
    summary: タブを押すと onNavigate
    condition: '`tabs` に概要と検討事項を渡し、検討事項のタブを押す'
    mock: なし
    expected: '`onNavigate` が `decisions` で 1 回呼ばれる'
  - name: test_topbar_when_offline
    case: 正常
    summary: offline で接続の状態を出す
    condition: '`connection` に offline、`readAt` を渡す'
    mock: なし
    expected: 「サーバーにつながりません」を含む状態が出る
  - name: test_topbar_when_many_comments
    case: 正常
    summary: 100 件以上は 99+
    condition: '`comments` true・`commentCount` 120'
    mock: なし
    expected: 件数の札が `99+`、読み上げの名前に 120
- name: Button
  title: ボタン
  kind: コンポーネント
  container: frontend/src/shared/components/ui/button.tsx
  usecase: 共通
  summary: shadcn/ui の Button（Base UI 版）。見た目の違いは variants（default・secondary・ghost・outline・destructive）で持つ
- name: OverviewScreen
  title: 概要の画面
  kind: 画面
  container: frontend/src/features/overview/overview/overview-screen.tsx
  usecase: 概要を見る
  summary: 画面設計『概要.tsx』のトップバーとタイルを描く。記録が読めないときは detail の行を出す
  refs:
  - dev/設計書/画面設計/プレビュー/概要.tsx#
  unit_tests:
  - name: test_overview_screen
    case: 正常
    summary: 記録でタイルを描く
    condition: MSW で記録・コメント・保存待ち・スレッドを返す
    mock: MSW
    expected: 6 つのタイルが項目 ID で引け、トップバーの題名が `settings.summary`
  - name: test_overview_screen_when_records_invalid
    case: 異常
    summary: 422 で detail を出す
    condition: MSW で `GET /api/records` に 422 と problem+json
    mock: MSW
    expected: detail の行が出て、タイルが無い
  - name: test_overview_screen_when_show_all
    case: 正常
    summary: すべて表示は今の画面へ
    condition: 要見直しの検討事項を返し、要見直しの「すべて表示」を押す
    mock: MSW・`window.location.assign`
    expected: '`assign` が今の画面の要見直しの条件のハッシュで呼ばれる'
- name: NextTile
  title: 次に検討する項目のタイル
  kind: コンポーネント
  container: frontend/src/features/overview/overview/components/next-tile.tsx
  usecase: 概要を見る
  summary: '`derived.next` を並べる'
- name: GoalTile
  title: ゴールまでの進捗のタイル
  kind: コンポーネント
  container: frontend/src/features/overview/overview/components/goal-tile.tsx
  usecase: 概要を見る
  summary: '`derived.goal` の数・棒・納品物。ゴールが無いときはフェーズ別の進捗'
- name: ListTile
  title: 件数と名前のタイル
  kind: コンポーネント
  container: frontend/src/features/overview/overview/components/list-tile.tsx
  usecase: 概要を見る
  summary: 要見直し・保留・進行中のタスクに共通の、件数と名前と「すべて表示」
- name: ProgressTable
  title: カテゴリー別の進捗のタイル
  kind: コンポーネント
  container: frontend/src/features/overview/overview/components/progress-table.tsx
  usecase: 概要を見る
  summary: '`derived.progress` の表'
functions:
- name: overviewQueries
  title: 概要の query
  kind: 関数
  container: frontend/src/features/overview/overview/queries.ts
  usecase: 概要を見る
  summary: 生成した queryOptions（記録・レビュー中のコメント・保存待ちの編集・スレッド）をまとめ、ルートの loader で先読みする
  returns:
    type: QueryOptions[]
    description: 概要が読む queryOptions
  unit_tests:
  - name: test_overview_queries
    case: 正常
    summary: 4 つの API の query
    condition: なし
    mock: なし
    expected: queryKey が `/api/records`・`/api/comments`・`/api/edits`・`/api/threads` の 4 つ
styles:
- name: tokens
  title: トークン
  container: frontend/src/shared/styles/tokens.css
  usecase: 共通
  summary: デザイン方針のトークンを :root の 3 ティア（プリミティブ・セマンティック・派生）で持つ。値は採用した見本（`dev/mock/styles/shadcn-swiss-cards/`）から写す
- name: index
  title: Tailwind の割り当て
  container: frontend/src/shared/styles/index.css
  usecase: 共通
  summary: 'Tailwind を読み、`--color-*: initial` で標準のパレットを消し、`@theme inline` でトークンを割り当てる'
notes:
  ストーリー: 共通の部品（`shared/components/`）は状態ごとのストーリーを横に置き、画面の部品（`components/`）にはストーリーを置かない（knowledge の規約『Storybook』）。概要の画面の本体のストーリーは MSW の handler でデータを差し込む
  単体テスト: Vitest と Testing Library で、テストのファイルを対象の横に `{名前}.test.ts(x)` で置く（knowledge の規約『フォルダ構成』『Unit / Component テスト』）。単体テストの表の名前は、各テストの `it` の名前にする

title: プレビュー / React
lead: React のプレビューのファイルの並び・つながり・置き場所の決まり。各ファイルの設計書は `モジュール構成/frontend/` の下に置く。
directory: "```\npackage.json            依存と npm scripts（dev・build・typecheck・lint・test・storybook-react・generate-api）\nvite.config.ts          root を frontend/ にし、出力を plugins/mindstella/skills/mindmap/preview/spa/ へ書く\nvitest.config.ts        jsdom・setupFiles・coverage\norval.config.ts         frontend/openapi.yaml から shared/api/generated/ へ生成する\neslint.config.js        React の側（frontend/src）だけに当てる lint\nlefthook.yml            commit の前に lint・型検査と、ビルドの出力がソースと合うかの検査を流す\n.storybook-react/       @storybook/react-vite の設定（main.ts・preview.tsx・public/mockServiceWorker.js）\nfrontend/\n  index.html            SPA の HTML\n  openapi.yaml          SPA が読む配信の API の OpenAPI の定義\n  tsconfig.json         React の側の型検査（paths の @/* は src/*）\n  src/\n    main.tsx            起動\n    route-tree.gen.ts   TanStack Router の生成したルートのツリー\n    app/\n      query-client.ts   QueryClient を作る\n      router.tsx        ルーターを作る\n      app.tsx           Provider を組む\n      preview-shell.tsx `tab` の画面と詳細・パネルを重ねて描く（features を組むのはここだけ）\n    routes/\n      __root.tsx        ルートの外枠\n      index.tsx         SPA のルート（/）。search は `shared/core/preview-search.ts`、loader は `shared/hooks/preview-queries.ts`\n```\n\n```\nfrontend/src/shared/\n  adapters/\n    api-client.ts       orval の mutator。fetch を呼び、失敗を AppError にする\n    libraries.ts        描画のライブラリの読み込み\n    events-client.ts    書き換えの知らせ（EventSource）につなぎ、query を読み直す\n  api/generated/        orval の生成物（手で書かない）\n  core/\n    app-error.ts        AppError\n    legacy-url.ts       今の画面の URL を組み立てる\n    preview-search.ts   SPA の search の Zod と、記録に合わせた補正\n    records.ts          記録の型・索引・関係する項目\n    filters.ts          絞り込みの判定と既定\n    diff.ts             差分の表示の計算\n    edits.ts            保存待ちの編集の重ね合わせ\n    doc-export.ts       資料のエクスポート\n    body-links.ts       本文の見出し・印・項目のリンク\n  hooks/\n    preview-queries.ts  SPA が読む query と読み直し\n    use-preview-search.ts  search の読み書き\n    use-diff-view.ts    差分の表示の時点と印\n    use-edits.ts        保存待ちの編集の mutation\n    use-screen-filters.ts  画面の絞り込みの条件\n  stores/\n    connection-store.ts 接続の状態（Zustand）\n    theme-store.ts      ライト / ダーク（Zustand・端末の保存領域）\n    prefs-store.ts      表・本文の見せ方・絞り込みの個人の上書き（端末の保存領域）\n  lib/\n    cn.ts               クラス名を合わせる\n```\n\n```\nfrontend/src/\n  shared/components/\n    ui/                   shadcn/ui の部品（Base UI 版）\n    icon.tsx              線のアイコンと状態の印\n    topbar.tsx            トップバー\n    topbar.stories.tsx    トップバーの状態ごとのストーリー\n    {部品}.tsx            部品設計の `.tsx` の部品（表・絞り込み・差分の印 など）と横のストーリー\n  shared/styles/\n    tokens.css            :root の 3 ティアのトークン（デザイン方針の値）\n    index.css             Tailwind の読み込みと @theme inline\n  features/overview/overview/\n    overview-screen.tsx   概要の画面\n    overview-screen.stories.tsx  概要の画面のストーリー（MSW）\n    components/\n      next-tile.tsx       次に検討する項目のタイル\n      goal-tile.tsx       ゴールまでの進捗のタイル\n      list-tile.tsx       要見直し・保留・進行中のタスクのタイル\n      progress-table.tsx  カテゴリー別の進捗のタイル\n  features/decisions/decisions/    検討事項の画面・マップ・字下げの一覧・ボード\n  features/tasks/tasks/            タスクの画面とボード\n  features/docs/docs/              資料の画面とカード・ボード\n  features/records/records/        記録の表の画面\n  features/detail/detail-panel/    詳細パネルと中の部品\n  features/detail/detail-fullscreen/  詳細の全画面\n  features/detail/diagram-viewer/  図の拡大\n  features/history/history/        変更履歴\n  features/edits/pending-edits/    保存待ちのパネル\n  features/settings/workspace-settings/  設定の画面\n```"
diagrams:
- name: React の入口
  diagram: "```mermaid\nclassDiagram\n  direction LR\n  class 起動\n  class アプリ\n  class QueryClientの作成\n  class ルーターの作成\n  class SPAのルート\n  class searchの検証\n  class 先読みするquery\n  class プレビューの外枠\n  起動 --> アプリ\n  アプリ --> QueryClientの作成\n  アプリ --> ルーターの作成\n  ルーターの作成 --> SPAのルート\n  SPAのルート --> searchの検証\n  SPAのルート --> 先読みするquery\n  SPAのルート --> プレビューの外枠\n```"
- name: プレビューの外枠
  diagram: "```mermaid\nclassDiagram\n  direction LR\n  class プレビューの外枠\n  class 概要の画面\n  class 検討事項の画面\n  class タスクの画面\n  class 資料の画面\n  class 記録の表の画面\n  class 設定の画面\n  class 詳細パネル\n  class 詳細の全画面\n  class 保存待ちのパネル\n  プレビューの外枠 --> 概要の画面\n  プレビューの外枠 --> 検討事項の画面\n  プレビューの外枠 --> タスクの画面\n  プレビューの外枠 --> 資料の画面\n  プレビューの外枠 --> 記録の表の画面\n  プレビューの外枠 --> 設定の画面\n  プレビューの外枠 --> 詳細パネル\n  プレビューの外枠 --> 詳細の全画面\n  プレビューの外枠 --> 保存待ちのパネル\n```"
- name: React の基盤
  diagram: "```mermaid\nclassDiagram\n  direction LR\n  class API の呼び出し\n  class アプリのエラー\n  class 書き換えの知らせへの接続\n  class 接続の状態\n  API の呼び出し --> アプリのエラー\n  書き換えの知らせへの接続 --> 接続の状態\n```"
notes:
  置き場所: knowledge の規約『ビルド構成』『フォルダ構成』のとおり、package.json と各ツールの設定をリポジトリの直下に、ソースを `frontend/` に置く。React の側の `tsconfig.json` だけは `frontend/` に置く（typescript-eslint の `projectService` が対象に最も近い `tsconfig.json` を引き、直下の `tsconfig.json` は今の画面の設定のため。PoC 検証の所見）
  ルート: TanStack Router のファイルのルートで `routes/` を置き、`@tanstack/router-plugin` の Vite のプラグインで `route-tree.gen.ts` を生成する
  ストーリー: 共通の部品（`shared/components/`）は状態ごとのストーリーを横に置き、画面の部品（`components/`）にはストーリーを置かない（knowledge の規約『Storybook』）。概要の画面の本体のストーリーは MSW の handler でデータを差し込む
  単体テスト: Vitest と Testing Library で、テストのファイルを対象の横に `{名前}.test.ts(x)` で置く（knowledge の規約『フォルダ構成』『Unit / Component テスト』）。単体テストの表の名前から先頭の `test_` を除いた名前を、各テストの `test` の名前にする
  features のつながり: features どうしは import しない（boundaries の向き）。画面と詳細・パネルを組むのは `app/preview-shell.tsx` で、複数の画面が使う search・query・計算は `shared/` に置く
  今の画面の計算の移し方: '`shared/core/` の計算は今の画面の `core/*.ts` と同じ振る舞いを ES モジュールで書き直す。今の画面は namespace の連結で import できず、子 6（#371）で消すため、共有しない'
  入力: 画面での編集は 1 キーごとに入力欄を離れたときに溜める今の振る舞いを再現するため、React Hook Form を使わず、`useAddEdit` をイベントハンドラから呼ぶ。設定の画面の入力の検証だけ `form.ts` の Zod を使う

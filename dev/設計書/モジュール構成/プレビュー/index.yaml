summary: "サーバーが配るプレビューの画面と部品の TypeScript"
docs_index: true
items:
  - page: 入口.ts.yaml
    summary: 起動・画面の振り分け・端末の保存領域
  - page: 基盤.ts.yaml
    summary: 記録の索引と画面に出す値・描画のライブラリ・URL のハッシュと履歴・サーバーの配信とのやり取り
  - page: 画面と部品.ts.yaml
    summary: 表・トップバー・表示形式の切り替え・コメントの入力・選んだ箇所の入口と、概要からネットワーク・コメントの一覧までの画面
  - page: 差分.ts.yaml
    summary: 選んだ時点の印・前の版の組み立て・行の差分・図の要素の突き合わせ

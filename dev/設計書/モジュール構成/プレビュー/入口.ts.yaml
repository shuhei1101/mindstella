title: "プレビュー / 入口"
lead: 'プレビューを開いたときに記録を読み（配る書き出しは埋め込みから、サーバーの配信は『記録の取得』から）、URL のハッシュが指す画面を描き、操作を画面の移動・書き換えの知らせ・コメントの読み書き・端末の保存領域につなぐ。'
directory: |-
  ```
  plugins/mindstella/skills/mindmap/preview/
    template.html   雛形（描画のライブラリ（mdmark は import map と CSS の link）・文字の読み込みと、CSS・JavaScript・データの差し込み口）
    tokens.css      デザイン方針のトークン（ライト / ダーク）
    style.css       画面と部品のスタイル
    app.ts          起動・画面の振り分け・端末の保存領域（差し込む順の最後）
  ```

  `.ts` の書き方と生成した `.js` の扱いは、モジュール構成『基盤』のディレクトリ構成と同じ。
data_models:
  - name: Prefs
    title: 端末に残す設定
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: '`localStorage` の 1 つのキーに JSON で残す値。見た目・表示する種類・ライト / ダーク・表の列・絞り込みの条件・差分のミニマップ・本文の表とセクションの見せ方・本文の差分の並べ方は個人の上書きで、無い（`null`・種類や画面のキーが無い）項目はワークスペースの既定か画面の既定に従う（`resolveDisplay`・`initialFilters`）'
    properties:
      - name: theme
        type: "'light' | 'dark' | null"
        description: ライト / ダーク。`null` は OS の設定に従う
      - name: columns
        type: 'Record<string, {hidden: string[], pinTo: string | null}>'
        description: 種類ごとの表示する列とピン留め。種類のキーが無ければ既定の列
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust' | null"
        description: ネットワークの見た目。`null` はワークスペースの既定
      - name: kinds
        type: string[] | null
        description: 表示する種類（`decisions` など）。`null` はワークスペースの既定
      - name: diffSel
        type: string | null
        description: 変更履歴で選んだ時点（`since`・`pending`・まとまりの ID）。`null` は差分を出さない。個人の上書きではなく、「既定に戻す」でも消さない
      - name: filters
        type: Record<string, Record<string, string[]>>
        description: サーバーの配信で残した、画面（記録の表は種類）ごとの絞り込みの条件（`FilterState.byTab` と同じ形）。画面のキーが無ければ画面の既定の条件で開く。配る書き出しでは読まず書かない
      - name: minimap
        type: false | null
        description: 差分のミニマップを表示しない上書き。`null` は表示する（ワークスペースの既定は持たない）。表示するに戻すと `null` にする
      - name: bodyLayout
        type: "'side' | null"
        description: 本文の差分を左右に並べる上書き（インターフェース定義の `body_diff_layout`）。`null` はインライン（ワークスペースの既定は持たない）。「インライン」を押すと `null` にする
      - name: opened
        type: unknown
        description: 配る書き出しだけが持つ、前回開いた時点（`OpenedPoint`）。`resolveSince` が `isOpenedPoint` で確かめてから読み、通し番号を持たない前の版の値（日時の文字列）は無いものとして扱う。サーバーの配信では読まず書かない
      - name: tablePin
        type: false | null
        description: 表の列の固定をオフにする上書き（インターフェース定義の `table_pin`）。`null` はオン（ワークスペースの既定は持たない）。オンに戻すと `null` にする
      - name: tableHead
        type: false | null
        description: 表の見出しの固定をオフにする上書き（`table_head`）。`null` はオン。オンに戻すと `null` にする
      - name: tableStripes
        type: true | null
        description: 表のしま模様をオンにする上書き（`table_stripes`）。`null` はオフ。オフに戻すと `null` にする
      - name: sectionFold
        type: false | null
        description: セクションの折りたたみをオフにする上書き（`section_fold`）。`null` はオン。オンに戻すと `null` にする
  - name: CommentState
    title: コメントの画面の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: コメントを選んで送る
    summary: 開いている間だけ持つコメントの状態。描き直し・項目の移動・詳細パネルと全画面の行き来でも保つ。書きかけとレビュー中のコメントはサーバーが持ち、ここには読んだ写しを置く
    properties:
      - name: review
        type: ReviewState
        description: 最後に読んだレビュー中のコメントと書きかけ
      - name: forms
        type: Map<string, {target, loc, thread, body, status, count, detail}>
        description: 入力欄ごと（`formKey`）の書きかけと溜める状態。スレッドの返信の入力欄は `thread` を持ち、`target`・`loc` を `null` にする
      - name: pendingLoc
        type: Map<string, Location>
        description: 項目の ID → 選んだ箇所の入口を押して入力に添えた箇所
      - name: checked
        type: Set<string>
        description: コメントの一覧でチェックしたコメントの ID（読んだときと溜めたときに足す）
      - name: removed
        type: ReviewState['items']
        description: コメントの一覧か詳細パネルで消したコメント（一覧と詳細パネルで同じものを見る。一覧を閉じるかまとめて送ると空にする。一覧を開いていない間は、詳細パネルで別の項目へ移るかパネルを閉じると空にする）
      - name: stale
        type: Map<string, string>
        description: 送れなかった書き込みの ID → 理由（箇所を外す・削除・次に送るで消す）
      - name: listOpen
        type: boolean
        description: コメントの一覧を開いているか
      - name: opened
        type: string | null
        description: レビュー中の書き込みの行から項目を開いたコメントの ID
      - name: threads
        type: Thread[]
        description: 最後に読めたスレッド（読めなかったときは前のまま残す）
      - name: threadsError
        type: '{detail: string | null} | null'
        description: 直前のスレッドの読み取りが断られた・届かなかったときの理由。読めたら `null`
      - name: view
        type: "'list' | 'thread' | 'review'"
        description: パネルの中に出している画面。パネルを開くたびに `list` に戻す
      - name: reviewFrom
        type: "'list' | 'thread'"
        description: レビュー中の書き込みを開く前の画面（「戻る」の戻り先）
      - name: filter
        type: "'open' | 'closed' | 'all'"
        description: スレッドの状態の絞り込み。ページを開いたときは `open` で、パネルを閉じても保つ
      - name: tag
        type: string | null
        description: スレッドを絞っているタグ。パネルを閉じても保つ
      - name: openedThread
        type: '{id: string, pending: boolean} | null'
        description: 開いているスレッド（`pending` が真なら `id` はまだ送っていない新しいスレッドのコメントの ID）
      - name: composing
        type: boolean
        description: 新しいスレッドの入力を出しているか
      - name: reason
        type: "{open: boolean, body: string, status: 'idle' | 'saving' | 'failed', detail: string | null}"
        description: 開いているスレッドの理由の入力の状態。スレッドを開く・一覧へ戻るときに閉じて空にする
      - name: reviewFocus
        type: string | null
        description: スレッドの画面からレビュー中の書き込みを開いたときの、そのスレッドの ID（一覧から開いたときは `null`）
      - name: expanded
        type: Set<string>
        description: レビュー中の書き込みの画面で本文を開いている書き込みの ID（`on.fold` で足し引きする。描き直しと本文の書き換えでは保ち、パネルを閉じると空にする）
  - name: DisplayState
    title: 表示の設定の画面の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 表示の設定を変える
    summary: 開いている間だけ持つ、表示の設定のパネル・確かめ・知らせの状態。描き直し・書き換えの知らせでも保つ
    properties:
      - name: open
        type: boolean
        description: 表示の設定のパネルを開いているか（コメントの一覧の `CommentState.listOpen`・絞り込みの `FilterState.drawerOpen` とは 1 つだけが真）
      - name: confirm
        type: '{busy: boolean, error: string | null} | null'
        description: 既定の保存の確かめを開いている間の状態。閉じていれば `null`
      - name: message
        type: "{kind: 'ok' | 'info', text: string} | null"
        description: パネルに残す最後の知らせ（既定にした・既定が変わった。時刻つき）
      - name: savedDisplay
        type: '{network_look, visible_kinds} | null'
        description: 自分が既定にした直後の値。次に読んだ記録の `settings.display` がこれと等しければ、画面の下の知らせを出さずに `null` に戻す
      - name: storageOk
        type: boolean
        description: 端末の保存領域に書けたか（`savePrefs` の結果）
  - name: FilterState
    title: 絞り込みの状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目を表で絞り込む
    summary: 開いている間の絞り込みの状態。表示形式の切り替え・描き直し・書き換えの知らせでも保つ。サーバーの配信では、条件を変えるたびに `Prefs.filters` へ写して端末に残す
    properties:
      - name: byTab
        type: Record<string, Record<string, string[]>>
        description: 画面（記録の表は種類）ごとの絞り込み。初めて開いた画面は `initialFilters` で入れる（サーバーの配信では `Prefs.filters` の分を `pruneFilters` にかけて渡す）
      - name: drawerOpen
        type: boolean
        description: 絞り込みのドロワーを開いているか。コメントの一覧（`CommentState.listOpen`）・表示の設定のパネル（`DisplayState.open`）と同時に真にしない
  - name: LockState
    title: ロックの状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: ネットワークを辿る
    summary: ページを開いている間だけ持つ、画面ごとのロックした項目。タブの行き来・描き直し・書き換えの知らせでも保ち、URL のハッシュにも端末の保存領域にも書かない（読み込み直すと外れる）。絞り込みの条件で描かれなくなっても外さず、画面と `lockTap` へは描いている間だけ渡す（`start` の 12 の効いているロック）
    properties:
      - name: graph
        type: string | null
        description: ネットワークでロックしている項目
      - name: map
        type: string | null
        description: 検討事項のマップでロックしている検討事項
  - name: StackState
    title: 重なりの状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: 幅 900px 以下で詳細パネルと左のパネル（絞り込みのドロワー・コメントの一覧・表示の設定のパネル）を両方開いているときに前に出す側。ページを開いている間だけ持ち、URL のハッシュにも端末の保存領域にも書かない（`start` の 5）
    properties:
      - name: front
        type: "'left' | 'detail'"
        default: "'detail'"
        description: 後から開いた側。左のパネルをトップバーから開いたら `left`、詳細パネルを開く・別の項目へ移ったら `detail`
  - name: EditState
    title: 編集の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 画面で項目を編集して保存する
    summary: 開いている間だけ持つ編集・保存待ちの状態。保存待ちの編集はサーバーが持ち、ここには読んだ写しを置く。描き直し・書き換えの知らせでも保つ
    properties:
      - name: edits
        type: PendingEdit[]
        description: 最後に読んだ保存待ちの編集
      - name: blocked
        type: BlockedEdit[]
        description: 直前の保存で書き込めなかった編集（その編集を取り消すか、次に保存できたら外す）
      - name: open
        type: boolean
        description: 保存待ちのパネルを開いているか（コメントの一覧・表示の設定・絞り込みのドロワーとは 1 つだけが真）
      - name: editing
        type: string | null
        description: 詳細パネルで編集の表示にしている項目の ID（足す項目は仮の ID。別の項目を開くと `null`）
      - name: adding
        type: Kind | null
        description: 仮の ID をまだ振られていない、開いたばかりの項目を追加する入力の種類
      - name: status
        type: "'idle' | 'saving' | 'offline'"
        description: まとめて保存の状態
      - name: errors
        type: Map<string, string>
        description: '`{target}:{key}` → 溜められなかった理由（届かない・断られた）'
      - name: toast
        type: string | null
        description: 保存した知らせの文言（「{n} 件を保存しました。」。`NOTICE_MS` で消す）
      - name: workspaceOpen
        type: boolean
        description: 設定の画面を開いているか
      - name: optionDrafts
        type: 'Map<string, {key: string; content: string}[]>'
        description: 項目の ID（足す項目は仮の ID、仮の ID が振られる前は `NEW_ID_PREFIX`）→「案を追加」で置いた、まだ溜めていない書きかけの案の記号と中身
      - name: sentEdits
        type: Map<string, unknown>
        description: '`{target}:{key}` → 送信したが、まだ当てた読み取りに載っていない編集の値。描き直しで `edits` の上に重ねて入力欄に描く'
      - name: editsReadSeq
        type: number
        description: 最後に送った保存待ちの編集の読み取りの番号
      - name: editsAppliedSeq
        type: number
        description: '`edits` に当てた読み取りの番号'
constants:
  - name: PREFS_KEY
    title: 端末の保存領域のキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: '`Prefs` を残す `localStorage` のキー'
    value: '"mindmap-preview"'
  - name: DRAFT_SAVE_DELAY_MS
    title: 書きかけを保つまでの待ち
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目へコメントする
    summary: 入力が止まってから『書きかけの保存』を呼ぶまでの待ち（打つたびに書かず、打ち終えた直後に閉じても失うのがこの待ちの分だけで済む長さ。閉じるときは待たずに呼ぶ）
    value: '500'
  - name: SINCE_KEY
    title: 「前回開いてから」の始まりのキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 前回からの差分を見る
    summary: そのタブの「前回開いてから」の始まり（`OpenedPoint` の JSON）を残す sessionStorage のキー。あれば `POST /api/opened` を呼ばない（同じタブで読み込み直しても範囲を変えない）。配る書き出しでは、前回開いた時点を `Prefs.opened` に持つ
    value: '"mindmap-since"'
  - name: NOTICE_MS
    title: 既定が変わった知らせを出す長さ
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: ワークスペースの既定を変える
    summary: 画面の下に「ワークスペースの既定が変わりました。」を出すミリ秒（画面設計『表示の設定』と確認ログの決定）
    value: '6000'
  - name: PANEL_WIDTH_KEY
    title: 詳細パネルの幅のキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目の詳細を読む
    summary: そのタブで変えた詳細パネルの幅（px の整数の文字列）を残す sessionStorage のキー。種類で分けない。配る書き出しでも同じ
    value: '"mindmap-panel-width"'
functions:
  - name: readEmbeddedData
    title: 埋め込みのデータを読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: '`mindmap-data` の要素の中身を `JSON.parse` して返す。中身が空なら（サーバーの配信）`null` を返す'
    args:
      - name: doc
        type: Document
        required: true
        passing: positional
        description: 文書
    returns:
      type: object | null
      description: 埋め込みのデータ。中身が空白だけなら `null`
    exceptions:
      - name: Error
        condition: 要素が無いか、中身を JSON として読めない（同梱の雛形か書き出しの誤り）
        message: 記録を読み込めませんでした。
    unit_tests:
      - name: test_read_embedded_data
        case: 正常
        summary: 要素の JSON を読む
        condition: '`</script>` を `</script>` で持つ JSON を入れた要素'
        mock: なし
        expected: 元の文字（`</script>`）に戻った値
      - name: test_read_embedded_data_when_empty
        case: 正常
        summary: 中身が空なら null
        condition: 中身が空の `mindmap-data`（サーバーの配信の画面）
        mock: なし
        expected: '`null`'
      - name: test_read_embedded_data_when_missing
        case: 異常
        summary: 要素が無ければ送る
        condition: '`mindmap-data` を持たない文書'
        mock: なし
        expected: '`Error`'
        exception: 要素が無いか読めない
  - name: loadPrefs
    title: 端末の設定を読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: '`localStorage` から `Prefs` を読む。読めないときは既定（`theme: null`、`columns: {}`、`look: null`、`kinds: null`、`diffSel: null`、`filters: {}`、`minimap: null`、`bodyLayout: null`、`tablePin`・`tableHead`・`tableStripes`・`sectionFold` が `null`）を返し、選べない値の `look`・`kinds`、画面ごとの条件が値の配列の対応でない `filters`、`false` でない `minimap`、`side` でない `bodyLayout`、`false` でない `tablePin`・`tableHead`・`sectionFold`、`true` でない `tableStripes` はその項目だけ既定にする'
    description: 保存領域が使えない環境（例外を送る）では、開いている間だけ設定を保つ（インターフェース定義『プレビューを開く』の端末の保存領域）。
    args:
      - name: storage
        type: Storage
        required: true
        passing: positional
        description: '`localStorage`'
    returns:
      type: Prefs
      description: 設定
    unit_tests:
      - name: test_load_prefs
        case: 正常
        summary: 残した設定を読み、読めなければ既定
        condition: '`parametrize`: `theme: dark` を残した / 値が壊れた JSON / `getItem` が例外を送る保存領域 / `look: rainbow` と `kinds: [decisions, graph]` を残した / `look: dust` と `kinds: [tasks]` を残した（前の版が残した `theme`・`columns` だけの値もそのまま読める） / `filters: {tasks: {status: [未着手]}}` を残した / `filters: [1]` を残した'
        mock: 保存領域（引数で渡す）
        expected: '`dark` / 既定 / 既定 / `look` と `kinds` が `null` / `look` が `dust`、`kinds` が `[tasks]`（`filters` は `{}`） / `filters` が `{tasks: {status: [未着手]}}` / `filters` が `{}`'
      - name: test_load_prefs_when_minimap
        summary: 差分のミニマップの上書きは false だけを読む
        case: 正常
        condition: '`parametrize`: `minimap: false` を残した / `minimap: true` を残した / `minimap: "no"` を残した / `minimap` を持たない前の版の値'
        expected: '`minimap` が `false` / `null` / `null` / `null`（ほかの項目はそのまま読める）'
        mock: 保存領域（引数で渡す）
      - name: test_load_prefs_when_body_layout
        case: 正常
        summary: 本文の差分の並べ方の上書きは side だけを読む
        condition: '`parametrize`: `bodyLayout: side` を残した / `bodyLayout: inline` を残した / `bodyLayout: 1` を残した / `bodyLayout` を持たない前の版の値'
        mock: 保存領域（引数で渡す）
        expected: '`bodyLayout` が `side` / `null` / `null` / `null`（ほかの項目はそのまま読める）'
      - name: test_load_prefs_when_body_view
        case: 正常
        summary: 本文の表とセクションの見せ方の上書きは、既定と違う値だけを読む
        condition: '`parametrize`: `tablePin`・`tableHead`・`sectionFold` が `false`、`tableStripes` が `true` を残した / 4 つとも反対の値（`true`・`false`）を残した / 4 つとも `"no"` を残した / 4 つを持たない前の版の値'
        mock: 保存領域（引数で渡す）
        expected: 残した値のまま / 4 つとも `null` / 4 つとも `null` / 4 つとも `null`（ほかの項目はそのまま読める）
  - name: savePrefs
    title: 端末の設定を残す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: '`Prefs` を `localStorage` に残し、書けたかを返す。保存領域が例外を送るときは偽を返す（表示の設定の「この端末に保存できません」に使う）'
    side_effects: '`localStorage` の `PREFS_KEY` を書き換える'
    args:
      - name: storage
        type: Storage
        required: true
        passing: keyword
        description: '`localStorage`'
      - name: prefs
        type: Prefs
        required: true
        passing: keyword
        description: 設定
    returns:
      type: boolean
      description: 書けたか
    unit_tests:
      - name: test_save_prefs
        case: 正常
        summary: 残した設定を読める
        condition: '`parametrize`: 使える保存領域 / `setItem` が例外を送る保存領域'
        mock: 保存領域（引数で渡す）
        expected: '真を返し `loadPrefs` で同じ値が読める / 偽を返し例外を送らない'
  - name: start
    title: 起動
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: 記録を読み、ハッシュが指す画面を描き、操作と履歴をつなぐ
    side_effects: '`document.body` に画面を描く。`hashchange`・`popstate`・`keydown`（`Ctrl+K`・`Cmd+K` で検索・Esc）・`selectionchange`・`pointerup` を受ける。端末の保存領域に個人の上書き（サーバーの配信では画面ごとの絞り込みの条件も）を残す。サーバーの配信では `GET /api/records` と `GET /api/comments` を読み、`GET /api/events` につなぎ、コメント・書きかけ・既定の書き換えの API へ送る'
    args: []
    returns:
      type: void
      description: '-'
    process: |-
      1. mdmark を読み終えるのを待ち（`loadMdmark`。読めなくても続ける）、埋め込みのデータを読む（`readEmbeddedData`）
         - 読めない場合、本文にそのメッセージを出して終える
         - データがある場合、配る書き出しとしてそれを記録にし、コメントのボタン・一覧・入力・選んだ箇所の入口と接続の状態を出さない（以降の 2・6・7・8 をしない）。表示の設定は出し、「ワークスペースの既定にする」を出さない（`can_save: false`）
         - `null` の場合、サーバーの配信として 2 へ進む
      2. 記録とレビュー中を読む（`fetchRecords`、`commentApi().read`。読んだコメントは全て `checked` に入れる）
         - 記録が届かない・読めない場合、接続の状態だけを出したトップバーと、読めなかった理由を本文に出し、書き換えの知らせのつなぎ直しを待つ（13 へ）
      3. 索引を作る（`buildIndex`）。端末の設定を読み（`loadPrefs`）、表示を読み分けて（`resolveDisplay`。記録の `settings.display`）テーマを当てる。ページの題（`document.title`）を `{設定の summary} | mindstella` にする
         - 「前回開いてから」の始まりを決める（`resolveSince`。読んだ記録の先頭のまとまりの `until_seq` を渡す）
         - 選んだ時点を引く（`resolveDiffPoint`。ハッシュの `diff`（`parseHash` の `Route.diff`）があればそれ、無ければ `Prefs.diffSel` と、始まり）。引けたら `Prefs.diffSel` と `Route.diff` をその時点にし、引けなければどちらも `null` にして残す（`savePrefs`）
      4. ハッシュを読み（`parseHash`）、記録に無い `id` だった場合は `id` の無いハッシュに置き換える（`navigate`、`push: false`）。`tab` が表示しない種類を指す場合は `overview` のハッシュに置き換える（`id` は残し、詳細パネルは開く）。3 で `Route.diff` が読んだハッシュの `diff` と変わった場合も、そのハッシュに置き換える（`navigate`、`push: false`）
      5. トップバーと画面を描き、`id` があれば詳細パネルを開く。トップバーのタブは概要と表示する種類だけにし、表示の設定のボタン（`DisplayState.open`）を渡す。概要に表示する種類を、ネットワークに見た目・ワークスペースの既定の見た目・効いているロック（12）を、検討事項に効いているロックを渡す。選んだ時点があれば、トップバーに `diffPoint` とタブの `marked`、表に `marks`、画面と詳細パネル・図の拡大に `diff` を渡す。タブの `marked` は、その種類に印の付く項目があるか `removedOf` が空でない種類を真にする。検討事項・タスク・資料・記録の表には `removedOf` で引いたその種類の消した項目を `removed` で渡す。ハッシュの絞り込みは、その画面を初めて開いたとき（`f.{列}` があるときは開き直したときも）`initialFilters` で `FilterState.byTab` に入れてから、ハッシュから消す（`navigate`、`push: false`）。サーバーの配信では、`Prefs.filters` のその画面の分を今の記録で `pruneFilters` にかけてから `initialFilters` の `saved` に渡す（`f.{列}` で開いたときは `Prefs.filters` を書き換えない）。画面に `FilterState` のその画面の絞り込みと `drawerOpen` を渡し、概要以外ではトップバーに絞り込みのボタン（件数は `activeConditionCount`）を渡す。サーバーの配信では、トップバーにコメントのボタン（件数は `review.items` の件数）を、詳細パネルにその項目へのコメントの入力（`forms` に無ければ、同じ向けた先の `review.drafts` の本文で `idle` で作る）とレビュー中のコメントを渡す。`listOpen` ならコメントの一覧を、`DisplayState.open` なら表示の設定を重ねる（`settingsDrawer`）
         - 描き直しで詳細パネルを作り直すときは、本文のスクロールの位置を保ち、作り直す前に本文のスクロール領域にフォーカスがあれば、作り直した後の本文のスクロール領域へフォーカスを戻す
         - 絞り込みのドロワー・コメントの一覧・表示の設定のパネルのどれかを開いているときは、描いた後に前の `inertBehind` が返した解除を呼んでから、開いているパネルで `inertBehind` を呼び直す（条件の変更・表示形式の切り替え・書き換えの知らせで作り直した本文にも乗せる）
         - 詳細パネルを開く・別の項目へ移るときは `StackState.front` を `detail` にする。幅 900px 以下（`NARROW_QUERY`）で詳細パネルと左のパネル（絞り込みのドロワー・コメントの一覧・表示の設定のパネル）を両方開いているときは、`front` の側を前に出す。`left` なら `body` に `left-front` を付け、詳細パネル（`aside.panel`）に `inert` を付ける。`detail` なら `left-front` を外し、開いている左のパネルに `inert` を付ける。それ以外（幅 901px 以上・片方だけ開いている）では `left-front` と、この 2 つに付けた `inert` を外す。幅が 900px をまたいだとき（`NARROW_QUERY` の `change`）もやり直す
      6. コメントの入力のコールバックを次で扱う
         - 「入力」では `forms` の `body` を書き換え、`DRAFT_SAVE_DELAY_MS` 待って書きかけを保つ（`saveDraft`。詳細パネル・一覧を閉じるときと項目を移るときは待たずに保つ。届かないときは何も出さない）
         - 「溜める」では、本文が空白だけなら `empty` にして入力欄へフォーカスを戻す。そうでなければ `saving` にして送り（`add`）、溜めたら入力欄と添えた箇所を空にして `saved`（`count`）、レビュー中を読み直して溜めた ID を `checked` に足し、トップバー・詳細の一番下・一覧を描き直す。断られた・届かないなら本文を残して `failed`
         - 「箇所を外す」では `pendingLoc` から外し、書きかけは箇所を持たない向けた先へ移す
         - 「本文を写す」では `navigator.clipboard.writeText` で写す
         - 項目を指さない入力は、幅 720px 以下でフォーカスが無く本文が空なら `collapsed`
      7. 選んだ箇所の入口を次で扱う
         - `pointerup` と、ポインターを押していない間の `selectionchange` で、全画面を開いている間は全画面の中、それ以外は詳細パネルの中の選択から箇所を求め（`selectionLocation`）、あれば入口を出し、無ければ閉じる（図の拡大を開いている間は出さない）
         - 「押す」では入口を閉じ、`pendingLoc` に入れて下端の入力（全画面を開いている間は全画面の下端の入力）を描き直し、その入力欄へフォーカスを移す。「閉じる」では入口を閉じて本文へフォーカスを戻す
      8. コメントの一覧のコールバックを次で扱う（どれも履歴に積まない）
         - トップバーのコメントのボタンで一覧を開くときは、表示の設定を閉じる（`DisplayState.open` を偽）。`StackState.front` を `left` にする
         - 「行の項目を開く」では一覧を開いたまま詳細パネルを開き、`highlight` にその箇所を渡す
         - 「直しを送る」「箇所を外す」では `update`、「削除」では `remove` して消した中身を `removed` に入れ、「元に戻す」ではその中身を `id`・`created` ごと `add` して `removed` から外す。終えたらレビュー中を読み直して描き直す
         - 「まとめて送る」ではチェックした ID を溜めた順に `send` し、201 なら `removed`・`stale` を空にして、結果を `sent`（`count` は送った件数、`at` は応答の `sent`、`entered` は応答の `entered`）にする（文言は `commentsPanel` が `entered` で出し分ける）。409 なら `stale` を入れて理由を出し、届かない・そのほかは理由を出す。どの場合もレビュー中を読み直す
         - Esc は、幅 901px 以上か `StackState.front` が `detail` で詳細パネルを開いていれば、詳細パネルを閉じる。それ以外は「スレッドの画面の操作」の Esc（`isTyping` の扱い・`view` ごとの戻る / 閉じる）に従う
         - 一覧を開くときは、絞り込みのドロワーと表示の設定のパネルを閉じる（`drawerOpen`・`DisplayState.open` を偽）
      9. 絞り込みのコールバックを次で扱う（どれも履歴に積まない）
         - トップバーの絞り込みのボタンでは `drawerOpen` を入れ替える。開くときはコメントの一覧と表示の設定のパネルを閉じ、`StackState.front` を `left` にする
         - Esc は、幅 900px 以下で `StackState.front` が `left` ならドロワーだけを閉じ、詳細パネルは閉じない
         - 画面の「条件を変える」では `FilterState.byTab` のその画面の分を置き換え、トップバーと画面を描き直す（ドロワーは開いたまま）。サーバーの配信では、`Prefs.filters` のその画面の分も同じ条件に置き換えて残す（`savePrefs`。結果を `DisplayState.storageOk` に入れる。表示の設定を開いていれば描き直す）
         - 画面の「ドロワーを閉じる」では `drawerOpen` を偽にして描き直し、トップバーの絞り込みのボタンへフォーカスを戻す
         - 概要へ移ったときは `drawerOpen` を偽にする
      10. 変更履歴のコールバックを次で扱う（どれも記録を読み直さず、履歴に積まない）
         - 「変更履歴を開く」では変更履歴のモーダルを開く（`historyDialog`。時点の件数は `resolveDiffPoint` の `added`・`changed`・`removed` の件数の和）
         - 「時点を選ぶ」「差分の表示をやめる」では `Prefs.diffSel` を書き換えて残し（`savePrefs`）、3 の時点の引き直しと 5 をやり直す。`Route.diff` をその時点（やめるときは `null`）にしたハッシュに置き換える（`navigate`、`push: false`）
      11. 表示の設定のコールバックを次で扱う（どれも記録を読み直さず、履歴に積まない）
         - トップバーの表示の設定のボタンで `DisplayState.open` を入れ替える。開くときはコメントの一覧と絞り込みのドロワーを閉じ（`listOpen`・`drawerOpen` を偽）、詳細パネルは開いたままにし、`StackState.front` を `left` にする。閉じる（×・Esc。幅 900px 以下で `StackState.front` が `left` なら Esc は表示の設定を閉じる。それ以外で詳細パネルを開いていれば Esc は詳細パネルを先に閉じる）ときはトップバーのボタンにフォーカスを戻す
         - 「表示する種類を変える」では `Prefs.kinds` を書き換えて残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けと 5 をやり直す。開いている画面の種類を外したときは概要へ移す（`navigate`、`push: false`）
         - ネットワークの見た目のドロップダウンの「見た目を選ぶ」では `Prefs.look` を書き換えて残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けをやり直してネットワークを作り直さずに `setGraphLook` で差し替える。表示の設定を開いていれば描き直す（「この端末で変えている項目」を合わせる）
         - 「既定に戻す」では個人の上書きを外して残し（`clearOverrides`、`savePrefs`）、`FilterState.byTab` を空にして、3 と 5 をやり直す（開いている画面は画面の既定の条件で開き直る）。フォーカスは「ワークスペースの既定のまま表示しています。」へ移す
         - 「ワークスペースの既定にする」では `DisplayState.confirm` を `{busy: false, error: null}` にして確かめを開く（`settingsConfirm`。`from` は既定、`to` は今当てている値）
         - 確かめの「保存する」では `busy` にして送る（`putDisplay`）。200 なら確かめを閉じ、返った `display` を記録の `settings.display` と `savedDisplay` に入れ、`message` を「ワークスペースの既定にしました（{MM/DD HH:mm}）。」にして 3 と 5 をやり直す（個人の上書きはそのまま残す）。断られたら `error` に「保存できませんでした。{detail}」、届かないなら立ち上げ直しの案内を入れて確かめを描き直す（画面設計『既定の保存の確かめ』の文言）
         - 確かめの「取り消す」と Esc（`busy` の間は受けない）では確かめを閉じ、「ワークスペースの既定にする」にフォーカスを戻す
         - トップバーのライト / ダークと表の「列の表示」「初期設定に戻す」も `Prefs` の上書きとして残し、開いていれば表示の設定を描き直す（「この端末で変えている項目」を合わせる）
      12. ロックのコールバックを次で扱う（`LockState` はページを開いている間だけ持ち、URL のハッシュにも端末の保存領域にも書かない）
         - 効いているロックは、`LockState` のその画面の分（ネットワークは `graph`、検討事項は `map`）の項目が、その画面の `FilterState` の条件で `filterRows` を通る（描いている）ならその ID、通らなければ `null` にする。絞り込みでロックした項目が描かれなくなっても `LockState` は残し、描いていない間はロックしていないものとして扱う。条件を戻して描かれたら、またロック中に戻る
         - ネットワークと検討事項の「押した」（押した項目の ID か `null`）では、`lockTap` に効いているロック・押した項目・詳細パネルの項目を渡し、`action` を画面へ返す。返った `locked` は、`action` が `lock`・`unlock` のときだけ `LockState` のその画面の分に入れる（描いていないロックを、ほかの操作で消さない）
         - `lock`・`unlock` では、詳細パネルはそのままで画面を描き直す（履歴に積まない）
         - `open` では、押した項目の詳細パネルを開く（ロック中に押した項目は詳細だけを切り替え、注目の起点はロックした項目のまま）
         - `blank` では、詳細パネルの「閉じる」と同じ処理をして全体の表示へ戻す
         - `shake` では何も変えない（画面が鍵を震わせる）
         - 記録を読み直してロックした項目が無くなっていれば、その画面の `LockState` を `null` にする
      13. 書き換えの知らせにつなぐ（`subscribeEvents`）。`changed` では保存待ちの編集も読み直す（`editApi().read`）。読み直しは 1 回ずつ順に流し、流している間に `changed` を受けたら、終わった後にもう 1 回だけ読み直す（その間に続けて受けた知らせは 1 回にまとめる）。保存できた後とつながり直した後の読み直しも同じ順番に載せる
         - `changed` を受けた場合、記録を読み直し、開いている画面・表示形式・ハッシュ・詳細パネルの項目・表の並べ替え・`FilterState`・`CommentState`・`DisplayState`・選んだ時点と「前回開いてから」の始まりを保ったまま 3・5 を履歴に積まずに描き直す。開いていた項目が消えていれば詳細パネルを閉じる。読み直しが読めない（422）場合は描き直さない
         - 読み直した記録で選んだ時点が引けなくなった（まとまりが消えた・`pending` が空になった）場合、`Prefs.diffSel` と `Route.diff` を `null` にして残し（`savePrefs`）、ハッシュを置き換える（`navigate`、`push: false`）
         - 読み直した `settings.display` が前と違う場合、`savedDisplay` と等しければ `savedDisplay` を `null` に戻すだけにする。そうでなければ、画面の下に「ワークスペースの既定が変わりました。」を `NOTICE_MS` の間出し、`message` を「ワークスペースの既定が変わりました（{MM/DD HH:mm}）。」にする（上書きを持たない項目だけが、読み分けで新しい既定になる）
         - つながりが切れた場合、接続の状態を `offline`（読んだ日時は最後に読めた記録の `built_at`）にしてトップバーを描き直す
         - つながり直した場合、記録とレビュー中を読み直して接続の状態を `online` に戻す
      14. `hashchange`・`popstate` で 3 の選んだ時点の引き直しと 4・5 を繰り返す
      15. サーバーの配信では、編集を次で扱う（`EditState`。どれも履歴に積まない）
         - 2 で保存待ちの編集も読む（`editApi().read`）。3 の索引は、差分の表示中でなければ `applyEdits` で当てた記録から作る（差分の表示中は当てない。保存待ちの編集は残し、やめると描き直す）
         - 5 で、差分の表示中でなければ、トップバーに `pending`（件数・`EditState.open`・`blocked` があるか）、一覧の 4 画面に `edit`（`pendingMarkOf` で求めた印とその種類の `item-add`）、詳細パネルに `edit`、表示の設定に `onWorkspace` を渡す。`EditState.open` なら保存待ちのパネルを重ね、`workspaceOpen` なら本文の区画を設定の画面に置き換える
         - 差分の表示に移ったときは、保存待ちのパネルと設定の画面を閉じ、`editing` を `null` にする
         - 「編集する」では `editing` をその項目と `null` で入れ替える。「項目を追加」では開いていた詳細パネルを閉じ、`adding` に種類を入れて空の項目の `detailEditForm` を詳細パネルと同じ置き方で開く
         - 編集の表示の `on.change`・設定の画面の `on.change`・「項目を削除」では `editApi().add` で溜める（足す項目は、タイトルを書いたときに `target` を省いた `item-add` を送り、返った仮の ID を `editing` に入れて `adding` を `null` にする。続くキーは同じ `item-add` の `value` を送り直す）。溜めたら保存待ちの編集を読み直して 3・5 をやり直し、その入力欄へフォーカスを戻す。断られた・届かないときは `errors` に理由を入れ、入力を残して描き直す。「削除を取り消す」ではその `item-remove` を `editApi().remove` で外す
         - トップバーの保存待ちのボタンでは `EditState.open` を入れ替える。開くときはコメントの一覧・表示の設定・絞り込みのドロワーを閉じ、`StackState.front` を `left` にする。Esc と「閉じる」はコメントの一覧と同じに扱い、閉じたらトップバーの保存待ちのボタンへフォーカスを戻す
         - 保存待ちのパネルの「開く」では、項目は詳細パネルを編集の表示で開き、`settings` は設定の画面を開く（幅 900px 以下ではパネルを閉じ、詳細パネルを閉じたら開き直す）。「取り消す」では `editApi().remove` して外した ID を `blocked` からも外し、読み直して描き直す
         - 「まとめて保存する」では `status` を `saving` にして `editApi().save` を呼ぶ。200 なら `blocked` を空にしてパネルを閉じ、`editing` を `null`、`toast` を「{送った件数} 件を保存しました。」にして記録と保存待ちの編集を読み直す。409 なら `blocked` に結果を入れてパネルを開いたまま書き込めない編集の知らせへフォーカスを移す。届かないときは `offline` にする。どの場合も `idle` に戻してから描き直す（`offline` は次に保存するまで残す）
         - 表示の設定の「設定を編集する」では表示の設定を閉じ、`workspaceOpen` を真にする（幅 900px 以下では保存待ちのパネルも閉じる）。設定の画面の「閉じる」では偽にして開く前の画面を描く
         - 保存待ちの編集の読み取り（`editApi().read`。2・13 と、溜めた・取り消した・保存した後）は送った順に `EditState.editsReadSeq` で番号を振る。届いた読み取りの番号が `editsAppliedSeq` より小さければ結果を `edits` に当てずに捨て、当てたら `editsAppliedSeq` をその番号にする
         - 編集の表示・設定の画面の `on.change` では、`editApi().add` を送る前に値を `EditState.sentEdits` に入れる。溜められたら、その後に送った読み取りを当てたときに外す。断られた・届かないときは外さず、理由と一緒に入力欄に残す
         - 編集の表示の `on.draft` では、`EditState.optionDrafts` のその項目の分の記号の中身を書き換える（無ければ足す）。足したときだけ描き直し、その案の中身の入力欄へフォーカスを移す（打つたびには描き直さない）。その記号の `option-add` を溜められたら書きかけから外す。`editing` を変えたとき（追加の入力で仮の ID が振られたときを除く）・差分の表示に移ったとき・保存できたときは `optionDrafts` を空にする。詳細パネルの `form` に、その項目の書きかけを `optionDrafts` で渡す
         - 追加の入力のパネルの `form` にも `optionDrafts` と `on.draft` を渡す。仮の ID が振られる前の書きかけは `NEW_ID_PREFIX` をキーにし、`item-add` を溜めて仮の ID が振られたら、そのキーの書きかけを仮の ID へ移す

      文書の `keydown` で `L`（大文字・小文字を問わない）を受けたら、修飾キー（Ctrl・Alt・Meta）が無く、変換中（`isComposing`）でなく、フォーカスが入力欄（`input`・`textarea`・`select`・編集できる要素）に無く、`dialog[open]` と `:popover-open` が無く、幅 901px 以上で、ネットワークを開いていて詳細パネルの項目があるときだけ、`lockTap` に `pressed` と `open` を詳細パネルの項目として渡し、ネットワークの「押した」と同じに扱う（`shake` では `shakeGraphKey` を呼ぶ）。それ以外は何もしない

      トップバーのタブの帯でネットワークへ移るときは、詳細パネルの項目の `id` をハッシュに残し（`navigate`、履歴に積む）、ネットワークをその項目を選んだ状態で開く。ほかのタブへ移るときは今のまま
    notes:
      確かめ方: 単体テストは持たない。インターフェース定義『プレビューを開く』の結合テストがこの流れを確かめる
      キー操作: 文書の `keydown` で `Ctrl+K`（`metaKey` の `Cmd+K` を含む）を受けたら、入力欄にフォーカスがあっても既定の動作を止め、全体の検索を開く（開いていれば検索の言葉を選び直す）。`/` では開かない
      画面の作り: '`body` を窓の高さに固定し、トップバーとタブの帯の下に画面ごとの領域（画面設計の「画面の領域」）を 1 つ置く（`style.css`）。ページ全体はスクロールさせず、表・ボード（幅 721px 以上）とマップ（幅 901px 以上）は領域の高さいっぱいに広げて中でスクロールさせ、それより狭い幅では領域ごとスクロールさせる。`100dvh` から帯と余白を引く高さの計算（`.table-wrap`・`.map-wrap`・`.fg-wrap`・`.g3-wrap`）はやめる。詳細パネルの位置（`.panel` の `top`）は帯の下のまま'
      見出しのハッシュ: '5 で詳細パネルに `Route.heading` を渡す。詳細パネルの `on.heading` では `Route.heading` を書き換え、履歴に積まずにハッシュを置き換える（`navigate`、`push: false`）。項目へ移るときは `heading` を `null` にする'
      詳細パネルのレビュー中のコメントの操作: 詳細パネルには、コメントの一覧へ渡すのと同じ書き換えている行（`editing`・`editingIn`・`editError`・`editBody`）と、`CommentState.removed` のうちその項目へのものを `comment.edit` で渡し、`comment.edit.on` には一覧と同じ処理（修正を始める・`saveEdit`・キャンセル・`removeComment`・`restoreComment`）を渡す。書き換えている行は一覧と詳細パネルを合わせて 1 つで、修正を始めると前の書き換えを捨てる。修正を始めた場所（一覧なら `'list'`、詳細パネルなら `'detail'`）を `editingIn` に持ち、入力欄はその場所だけに描かせる。修正を始める・キャンセル・直せなかったときは、詳細パネルと一覧を両方描き直す（`refreshComments`）。詳細パネルの操作の後は、描き直した詳細パネルの中で、修正を始めたら入力欄（`detail-edit:{ID}`）、送るかキャンセルしたらその行の「修正」（`detail-edit-open:{ID}`）、削除したら「元に戻す」（`detail-restore:{ID}`）、戻したら戻した行の「修正」へフォーカスを移し、本文のスクロールの位置を保つ。コメントの一覧を開いていない間に、詳細パネルで別の項目へ移るかパネルを閉じたら、`CommentState.removed` と書き換えている行を捨てる。一覧を開いている間でも、詳細パネルで別の項目へ移るかパネルを閉じたら、`editingIn` が `'detail'` の書き換えを捨てる（`CommentState.removed` は残す）。一覧を閉じたら（表示の設定を開いて一覧を閉じるときも）、`editingIn` が `'list'` の書き換えを捨てる。どちらも、入力欄の無い側に「修正」「削除」の無い行を残さないため。配る書き出しとサーバーにつながらないときは、今と同じく `comment` を `null` で渡す
      差分の時点の引き継ぎ: 画面・項目を移るとき（画面と部品から受けた移る先の `Route` と、全体の検索から開くとき。`go`）は、移る先の `Route.diff` を今の `Route.diff` にしてから `route` に入れて書く（`navigate`）。概要の `tableRoute` のように `Route` を一から作る移る先でも `diff` を落とさない。`Route.diff` を変えるのは 3・10・13・14 だけ
      本文のまとまりのリンク: 詳細パネルの `on.changeSet` では、渡された値を `resolveDiffPoint` で引き、まとまりの ID として引けたときだけ 10 の「時点を選ぶ」と同じに扱う（`Prefs.diffSel` と `Route.diff` をそのまとまりにし、履歴に積まずにハッシュを置き換える。開いている画面・項目・全画面はそのまま）。引けなければ何もしない
      幅 900px 以下の重なり: 幅 900px 以下で `body.left-front` のとき、`.comments-panel`・`.settings-drawer`・`dialog.drawer.narrow` の `z-index` を `.panel`（35）より上にする（`style.css`）。`body.left-front` が無いときと幅 901px 以上の重なり順は変えない
      書き込みのまとまりのリンク: コメントの一覧に `changeSetOf`（記録の `changes.sets` からまとまりの ID で説明を引く。無ければ `null`）を渡す。コメントの一覧の `on.changeSet` は詳細パネルの `on.changeSet` と同じく扱う（`resolveDiffPoint` で引けたときだけ 10 の「時点を選ぶ」と同じにし、履歴に積まずにハッシュを置き換える）。コメントの一覧（`listOpen`）と、その中の画面・開いているスレッドは変えない
      本文の差分の並べ方: 詳細パネルに `resolveDisplay` の `bodyLayout` を渡す。詳細パネルの `on.layout`（押した並べ方）では、`side` なら `Prefs.bodyLayout` を `side`、`inline` なら `null` にして残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けをやり直して開いている詳細パネル・詳細の全画面だけを描き直す。本文のスクロール領域の `scrollTop` を保ち、押した並べ方のボタン（`[data-layout]`）にフォーカスを戻す。履歴に積まず、ハッシュも変えない。表示の設定を開いていれば描き直す（「この端末で変えている項目」を合わせる）
      本文の表とセクションの見せ方: 詳細パネルと表示の設定に `resolveDisplay` の `bodyView` を渡す。表示の設定の `on.bodyView`（`{key, value}`）では、`value` が `BODY_VIEW_DEFAULT` のその項目と同じなら `Prefs` の対応する項目（`pin` → `tablePin`、`head` → `tableHead`、`stripes` → `tableStripes`、`fold` → `sectionFold`）を `null`、違えば `value` にして残し（`savePrefs`。結果を `DisplayState.storageOk` に入れる）、3 の読み分けをやり直して開いている詳細パネル・詳細の全画面と表示の設定だけを描き直す。本文のスクロール領域の `scrollTop` を保ち、押したチェックボックスにフォーカスを戻す。履歴に積まず、ハッシュも変えない
  - name: formKey
    title: 入力欄のキー
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目へコメントする
    scope: public
    summary: 向けた先（`target` と `loc` の組か、`thread`）を 1 つの文字列にする（サーバーの書きかけの同じさと同じ比べ方）
    args:
      - name: target
        type: string | null
        required: true
        passing: positional
        description: 向ける項目の ID
      - name: loc
        type: Location | null
        required: true
        passing: positional
        description: 添えた箇所
      - name: thread
        type: string | null
        required: false
        default: 'null'
        passing: positional
        description: 返信先のスレッドの ID
    returns:
      type: string
      description: '`target`・`kind`・`start`・`end`・`key`・`text`・`thread` をこの順に並べた JSON の文字列'
    process: 1. 無い値を `null` にした配列を `JSON.stringify` して返す
    unit_tests:
      - name: test_form_key
        case: 正常
        summary: 同じ向けた先は同じキー、箇所が違えば別のキー
        condition: '`parametrize`: `(D-1, null)` と `(D-1, null)` / `(D-1, null)` と `(D-1, 本文の 2 行目)` / キーの並びが違う同じ `loc` / `(null, null)` と `(D-1, null)`'
        mock: なし
        expected: 同じ / 違う / 同じ / 違う
      - name: test_form_key_when_thread
        case: 正常
        summary: スレッドごとに別のキーで、新しいスレッドの入力とも別
        condition: '`parametrize`: `(null, null, TH-1)` と `(null, null, TH-1)` / `(null, null, TH-1)` と `(null, null, TH-2)` / `(null, null, TH-1)` と `(null, null)`'
        mock: なし
        expected: 同じ / 違う / 違う
  - name: resolveDisplay
    title: 表示の読み分け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 表示の設定を変える
    scope: public
    summary: 項目ごとに、個人の上書きがあればそれを、無ければワークスペースの既定を、それも無ければ組み込みの既定を使って、今当てる見た目・表示する種類と、既定と上書きを持つ項目を返す
    args:
      - name: prefs
        type: Prefs
        required: true
        passing: positional
        description: 端末の設定
      - name: display
        type: '{network_look?, visible_kinds?} | undefined'
        required: true
        passing: positional
        description: 記録の `settings.display`（配る書き出しは埋め込みの値）
    returns:
      type: "{look, kinds: Set<string>, defaultLook, defaultKinds: Set<string>, overrides: string[], minimap: boolean, bodyLayout: 'inline' | 'side', bodyView: {pin: boolean, head: boolean, stripes: boolean, fold: boolean}}"
      description: 当てる見た目と種類、ワークスペースの既定（無ければ `deep` と全ての種類）、上書きを持つ項目の名前（「ネットワークの見た目」・「表示する種類」・「ライト / ダーク」・「表の列（{種類の名前}）」・「絞り込み（{画面の名前}）」・「差分のミニマップ」・「表の列の固定」・「表の見出しの固定」・「表のしま模様」・「セクションの折りたたみ」・「本文の差分の並べ方」の順）、差分のミニマップを置くか、本文の差分の並べ方、本文の表とセクションの見せ方
    process: |-
      1. 既定を決める（`display.network_look` が無ければ `deep`、`display.visible_kinds` が無ければ 7 つの種類全て）
      2. `prefs.look`・`prefs.kinds` が `null` でなければその値を、`null` なら既定を当てる。`minimap` は `prefs.minimap` が `false` のときだけ偽にする。`bodyLayout` は `prefs.bodyLayout` が `side` のときだけ `side`、それ以外は `inline` にする。`bodyView` は `BODY_VIEW_DEFAULT` に、`prefs.tablePin`・`prefs.tableHead`・`prefs.sectionFold` が `false` の項目を偽、`prefs.tableStripes` が `true` なら `stripes` を真にして当てる
      3. `prefs.look`・`prefs.kinds`・`prefs.theme` が `null` でない項目と、`prefs.columns` の種類ごとに「表の列（{種類の名前}）」を `overrides` に並べる
      4. `prefs.filters` の画面ごとに、条件が画面の既定（`initialFilters(画面, {}, null)`）と違えば「絞り込み（{画面の名前}）」を `overrides` に並べる（記録の表は種類の名前）
      5. `prefs.minimap` が `false` なら `MINIMAP_LABEL`（「差分のミニマップ」）を、上書きを持つ `tablePin`・`tableHead`・`tableStripes`・`sectionFold` の `BODY_VIEW_LABELS` の名前をこの順に、`prefs.bodyLayout` が `side` なら `BODY_LAYOUT_LABEL`（「本文の差分の並べ方」）を、この順に `overrides` の末尾に並べる
    unit_tests:
      - name: test_resolve_display
        case: 正常
        summary: 上書き → ワークスペースの既定 → 組み込みの既定の順に項目ごとに読み分ける
        condition: '`parametrize`: 上書きも既定も無い / 既定が `starlight`・メモを除く 6 種類で上書きが無い / 同じ既定で `look: dust`・`theme: dark`・`columns.research` の上書き / `filters` が `{tasks: {status: [未着手]}, decisions: {status: [要見直し, 未決定, 未整理, 保留]}}`'
        mock: なし
        expected: '`deep`・7 種類・`overrides` が空 / `starlight`・6 種類・`overrides` が空 / `look` が `dust`、`kinds` が 6 種類、`defaultLook` が `starlight`、`overrides` が「ネットワークの見た目」・「ライト / ダーク」・「表の列（調査）」 / `overrides` が「絞り込み（タスク）」だけ（検討事項は画面の既定と同じなので並べない）'
      - name: test_resolve_display_when_minimap
        summary: 差分のミニマップは上書きが false のときだけ偽で、変えている項目の末尾に並ぶ
        case: 正常
        condition: '既定の無い `display`。`parametrize`: `minimap: null` / `minimap: false` / `minimap: false`・`theme: dark`'
        expected: '`minimap` が真で `overrides` が空 / `minimap` が偽で `overrides` が「差分のミニマップ」 / `overrides` が「ライト / ダーク」・「差分のミニマップ」の順。どれも `look`・`kinds` は既定のまま'
        mock: なし
      - name: test_resolve_display_when_body_layout
        case: 正常
        summary: 本文の差分の並べ方は上書きが side のときだけ side で、変えている項目の末尾に並ぶ
        condition: '既定の無い `display`。`parametrize`: `bodyLayout: null` / `bodyLayout: side` / `bodyLayout: side`・`minimap: false`'
        mock: なし
        expected: '`bodyLayout` が `inline` で `overrides` が空 / `bodyLayout` が `side` で `overrides` が「本文の差分の並べ方」 / `overrides` が「差分のミニマップ」・「本文の差分の並べ方」の順'
      - name: test_resolve_display_when_body_view
        case: 正常
        summary: 本文の見せ方は上書きのある項目だけ既定と逆にし、変えている項目に差分のミニマップと本文の差分の並べ方の間で並ぶ
        condition: '既定の無い `display`。`parametrize`: 上書きが無い / `tableStripes: true`・`sectionFold: false` / `minimap: false`・`tablePin: false`・`bodyLayout: side`'
        mock: なし
        expected: '`bodyView` が `{pin: true, head: true, stripes: false, fold: true}` で `overrides` が空 / `stripes` が真で `fold` が偽、`overrides` が「表のしま模様」・「セクションの折りたたみ」 / `pin` が偽、`overrides` が「差分のミニマップ」・「表の列の固定」・「本文の差分の並べ方」の順'
  - name: clearOverrides
    title: 個人の上書きを外す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 表示の設定を変える
    scope: public
    summary: 「既定に戻す」で、見た目・表示する種類・ライト / ダーク・表の列・絞り込みの条件・差分のミニマップ・本文の表とセクションの見せ方・本文の差分の並べ方を外した `Prefs` を返す（`diffSel` は残す）
    args:
      - name: prefs
        type: Prefs
        required: true
        passing: positional
        description: 今の端末の設定
    returns:
      type: Prefs
      description: '`theme`・`look`・`kinds`・`minimap`・`bodyLayout`・`tablePin`・`tableHead`・`tableStripes`・`sectionFold` を `null`、`columns`・`filters` を空にした写し'
    process: 1. `prefs` を写し、上の 11 項目を外して返す（渡した `prefs` は変えない）
    unit_tests:
      - name: test_clear_overrides
        case: 正常
        summary: 上書きだけを外し、差分の時点は残す
        condition: '`theme: dark`・`look: dust`・`kinds: [tasks]`・`columns.research`・`filters.tasks`・`minimap: false`・`bodyLayout: side`・`tablePin: false`・`tableHead: false`・`tableStripes: true`・`sectionFold: false`・`diffSel: since` の `Prefs`'
        mock: なし

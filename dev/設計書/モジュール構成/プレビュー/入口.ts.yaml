  - name: resolveSince
    title: 「前回開いてから」の始まりを決める
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 前回からの差分を見る
    scope: public
    is_async: true
    summary: そのタブの「前回開いてから」の始まりを決めて `SINCE_KEY` に残す。同じタブで読み込み直したときは、残した始まりをそのまま使う
    side_effects: '`session` の `SINCE_KEY` を書く。サーバーの配信では `post` がワークスペースの前回開いた時点を書き換える。配る書き出しでは `prefs.opened` を書き換えて `persist` を呼ぶ'
    args:
      - name: serverMode
        type: boolean
        required: true
        passing: keyword
        description: サーバーの配信か（偽は配る書き出し）
      - name: prefs
        type: Prefs
        required: true
        passing: keyword
        description: 端末の設定
      - name: persist
        type: () => void
        required: true
        passing: keyword
        description: 端末の設定を残す
      - name: headSeq
        type: number
        required: true
        passing: keyword
        description: 読んだ記録の先頭のまとまりの `until_seq`（まとまりが無ければ 0）
      - name: session
        type: Storage
        required: true
        passing: injected
        description: そのタブの保存領域（`sessionStorage`。使えないときは `openStorage` の代わり）
      - name: post
        type: () => Promise<OpenedReply | null>
        required: false
        default: postOpened
        passing: injected
        description: 前回開いた日時を引く
      - name: now
        type: () => string
        required: false
        default: () => new Date().toISOString()
        passing: injected
        description: 今の日時を返す
    returns:
      type: Promise<OpenedPoint>
      description: そのタブの「前回開いてから」の始まり
    process: |-
      1. `session` の `SINCE_KEY` を JSON として読み、`isOpenedPoint` ならそれを返す（読めない・前の版の日時の文字列は残っていないものとして続ける）
      2. タブを開いた時点を `{at: now(), seq: headSeq}` にする
      3. サーバーの配信では `post` を呼び、前回の時点を `previous`、今の時点を `opened` にする（`null` なら前回の時点は無く、今の時点はタブを開いた時点）。配る書き出しでは、前回の時点を `prefs.opened`（`isOpenedPoint` でなければ無い）、今の時点をタブを開いた時点にし、`prefs.opened` を今の時点に書き換えて `persist` を呼ぶ
      4. 前回の時点があり、その `seq` が `headSeq` 以下ならそれを、それ以外（無い・`seq` が `headSeq` より大きい）は今の時点を始まりにする
      5. 始まりを JSON で `SINCE_KEY` に書き（書けなければ何もしない。読み込み直すたびに決め直す）、返す
    unit_tests:
      - name: test_resolve_since
        case: 正常
        summary: サーバーの配信では前回の時点を始まりにし、無い・通し番号が先のときは今の時点にする
        condition: '`serverMode` 真、`headSeq` 2、空の `session`。`parametrize`: `post` が `{previous: {at: A, seq: 1}, opened: {at: B, seq: 2}}` / `{previous: null, opened: {at: B, seq: 2}}` / `{previous: {at: A, seq: 5}, opened: {at: B, seq: 2}}` / `null`'
        mock: '`post`・`now`（引数で渡す）'
        expected: '`{at: A, seq: 1}` / `{at: B, seq: 2}` / `{at: B, seq: 2}` / `{at: now, seq: 2}`。どれも `session` の `SINCE_KEY` に返した値の JSON が入る'
      - name: test_resolve_since_when_kept
        case: 正常
        summary: 同じタブに残した始まりを使い、前の版の値は使わない
        condition: '`serverMode` 真。`parametrize`: `SINCE_KEY` に `{"at": A, "seq": 1}` / 日時の文字列 `2026-10-04T13:05:00+00:00`'
        mock: '`post`（呼んだ回数を数える）'
        expected: '`{at: A, seq: 1}` を返し `post` を呼ばない / `post` を 1 回呼び、その結果から決める'
      - name: test_resolve_since_when_exported
        case: 正常
        summary: 配る書き出しは端末の設定の前回の時点を使い、今の時点に書き換える
        condition: '`serverMode` 偽、`headSeq` 2。`parametrize`: `prefs.opened` が `{at: A, seq: 1}` / 日時の文字列 / 無い'
        mock: '`persist`・`now`（引数で渡す）'
        expected: '`{at: A, seq: 1}` / `{at: now, seq: 2}` / `{at: now, seq: 2}`。どれも `prefs.opened` が `{at: now, seq: 2}` になり `persist` を 1 回呼ぶ'

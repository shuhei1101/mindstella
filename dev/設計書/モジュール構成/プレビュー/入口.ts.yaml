title: "プレビュー / 入口"
lead: 'プレビューを開いたときに記録を読み（配る書き出しは埋め込みから、サーバーの配信は『記録の取得』から）、URL のハッシュが指す画面を描き、操作を画面の移動・書き換えの知らせ・コメントの読み書き・端末の保存領域につなぐ。'
directory: |-
  ```
  plugins/mindstella/skills/mindmap/preview/
    template.html   雛形（描画のライブラリ・文字の読み込みと、CSS・JavaScript・データの差し込み口）
    tokens.css      デザイン方針のトークン（ライト / ダーク）
    style.css       画面と部品のスタイル
    app.ts          起動・画面の振り分け・端末の保存領域（差し込む順の最後）
  ```

  `.ts` の書き方と生成した `.js` の扱いは、モジュール構成『基盤』のディレクトリ構成と同じ。
data_models:
  - name: Prefs
    title: 端末に残す設定
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: '`localStorage` の 1 つのキーに JSON で残す値'
    properties:
      - name: theme
        type: "'light' | 'dark' | null"
        description: ライト / ダーク。`null` は OS の設定に従う
      - name: columns
        type: 'Record<string, {hidden: string[], pinTo: string | null}>'
        description: 種類ごとの表示する列とピン留め
  - name: CommentState
    title: コメントの画面の状態
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: コメントを選んで送る
    summary: 開いている間だけ持つコメントの状態。描き直し・項目の移動・詳細パネルと全画面の行き来でも保つ。書きかけとレビュー中のコメントはサーバーが持ち、ここには読んだ写しを置く
    properties:
      - name: review
        type: ReviewState
        description: 最後に読んだレビュー中のコメントと書きかけ
      - name: forms
        type: Map<string, {target, loc, body, status, count, detail}>
        description: 入力欄ごと（`formKey`）の書きかけと溜める状態
      - name: pendingLoc
        type: Map<string, Location>
        description: 項目の ID → 選んだ箇所の入口を押して入力に添えた箇所
      - name: checked
        type: Set<string>
        description: コメントの一覧でチェックしたコメントの ID（読んだときと溜めたときに足す）
      - name: removed
        type: ReviewState['items']
        description: 一覧を開いている間に消したコメント（閉じるかまとめて送ると空にする）
      - name: stale
        type: Map<string, string>
        description: 箇所が合わないコメントの ID → 理由（箇所を外す・削除・次に送るで消す）
      - name: listOpen
        type: boolean
        description: コメントの一覧を開いているか
      - name: opened
        type: string | null
        description: 一覧の行から開いたコメントの ID
constants:
  - name: PREFS_KEY
    title: 端末の保存領域のキー
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    summary: '`Prefs` を残す `localStorage` のキー'
    value: '"mindmap-preview"'
  - name: DRAFT_SAVE_DELAY_MS
    title: 書きかけを保つまでの待ち
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目へコメントする
    summary: 入力が止まってから『書きかけの保存』を呼ぶまでの待ち（打つたびに書かず、打ち終えた直後に閉じても失うのがこの待ちの分だけで済む長さ。閉じるときは待たずに呼ぶ）
    value: '500'
functions:
  - name: readEmbeddedData
    title: 埋め込みのデータを読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: '`mindmap-data` の要素の中身を `JSON.parse` して返す。中身が空なら（サーバーの配信）`null` を返す'
    args:
      - name: doc
        type: Document
        required: true
        passing: positional
        description: 文書
    returns:
      type: object | null
      description: 埋め込みのデータ。中身が空白だけなら `null`
    exceptions:
      - name: Error
        condition: 要素が無いか、中身を JSON として読めない（同梱の雛形か書き出しの誤り）
        message: 記録を読み込めませんでした。
    unit_tests:
      - name: test_read_embedded_data
        case: 正常
        summary: 要素の JSON を読む
        condition: '`</script>` を `</script>` で持つ JSON を入れた要素'
        mock: なし
        expected: 元の文字（`</script>`）に戻った値
      - name: test_read_embedded_data_when_empty
        case: 正常
        summary: 中身が空なら null
        condition: 中身が空の `mindmap-data`（サーバーの配信の画面）
        mock: なし
        expected: '`null`'
      - name: test_read_embedded_data_when_missing
        case: 異常
        summary: 要素が無ければ送る
        condition: '`mindmap-data` を持たない文書'
        mock: なし
        expected: '`Error`'
        exception: 要素が無いか読めない
  - name: loadPrefs
    title: 端末の設定を読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: '`localStorage` から `Prefs` を読む。読めないときは既定（`theme: null`、`columns: {}`）を返す'
    description: 保存領域が使えない環境（例外を送る）では、開いている間だけ設定を保つ（インターフェース定義『プレビューを開く』の端末の保存領域）。
    args:
      - name: storage
        type: Storage
        required: true
        passing: positional
        description: '`localStorage`'
    returns:
      type: Prefs
      description: 設定
    unit_tests:
      - name: test_load_prefs
        case: 正常
        summary: 残した設定を読み、読めなければ既定
        condition: '`parametrize`: `theme: dark` を残した / 値が壊れた JSON / `getItem` が例外を送る保存領域'
        mock: 保存領域（引数で渡す）
        expected: '`dark` / 既定 / 既定'
  - name: savePrefs
    title: 端末の設定を残す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: '`Prefs` を `localStorage` に残す。保存領域が例外を送るときは何もしない'
    side_effects: '`localStorage` の `PREFS_KEY` を書き換える'
    args:
      - name: storage
        type: Storage
        required: true
        passing: keyword
        description: '`localStorage`'
      - name: prefs
        type: Prefs
        required: true
        passing: keyword
        description: 設定
    returns:
      type: void
      description: '-'
    unit_tests:
      - name: test_save_prefs
        case: 正常
        summary: 残した設定を読める
        condition: '`parametrize`: 使える保存領域 / `setItem` が例外を送る保存領域'
        mock: 保存領域（引数で渡す）
        expected: '`loadPrefs` で同じ値が読める / 例外を送らない'
  - name: start
    title: 起動
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 共通
    scope: public
    summary: 記録を読み、ハッシュが指す画面を描き、操作と履歴をつなぐ
    side_effects: '`document.body` に画面を描く。`hashchange`・`popstate`・`keydown`（`/` で検索・Esc）・`selectionchange`・`pointerup` を受ける。サーバーの配信では `GET /api/records` と `GET /api/comments` を読み、`GET /api/events` につなぎ、コメント・書きかけの API へ送る'
    args: []
    returns:
      type: void
      description: '-'
    process: |-
      1. 埋め込みのデータを読む（`readEmbeddedData`）
         - 読めない場合、本文にそのメッセージを出して終える
         - データがある場合、配る書き出しとしてそれを記録にし、コメントのボタン・一覧・入力・選んだ箇所の入口と接続の状態を出さない（以降の 2・6・7・8 をしない）
         - `null` の場合、サーバーの配信として 2 へ進む
      2. 記録とレビュー中を読む（`fetchRecords`、`commentApi().read`。読んだコメントは全て `checked` に入れる）
         - 記録が届かない・読めない場合、接続の状態だけを出したトップバーと、読めなかった理由を本文に出し、書き換えの知らせのつなぎ直しを待つ（9 へ）
      3. 索引を作る（`buildIndex`）。端末の設定を読み、テーマを当てる（`loadPrefs`）。ページの題（`document.title`）を `{設定の summary} | mindstella` にする
      4. ハッシュを読み（`parseHash`）、記録に無い `id` だった場合は `id` の無いハッシュに置き換える（`navigate`、`push: false`）
      5. トップバーと画面を描き、`id` があれば詳細パネルを開く。絞り込みは画面に渡した後、ハッシュから消す（`navigate`、`push: false`）。サーバーの配信では、トップバーにコメントのボタン（件数は `review.items` の件数）を、詳細パネルにその項目へのコメントの入力（`forms` に無ければ、同じ向けた先の `review.drafts` の本文で `idle` で作る）とレビュー中のコメントを渡す。`listOpen` ならコメントの一覧を重ねる
      6. コメントの入力のコールバックを次で扱う
         - 「入力」では `forms` の `body` を書き換え、`DRAFT_SAVE_DELAY_MS` 待って書きかけを保つ（`saveDraft`。詳細パネル・一覧を閉じるときと項目を移るときは待たずに保つ。届かないときは何も出さない）
         - 「溜める」では、本文が空白だけなら `empty` にして入力欄へフォーカスを戻す。そうでなければ `saving` にして送り（`add`）、溜めたら入力欄と添えた箇所を空にして `saved`（`count`）、レビュー中を読み直して溜めた ID を `checked` に足し、トップバー・詳細の一番下・一覧を描き直す。断られた・届かないなら本文を残して `failed`
         - 「箇所を外す」では `pendingLoc` から外し、書きかけは箇所を持たない向けた先へ移す
         - 「本文を写す」では `navigator.clipboard.writeText` で写す
         - 項目を指さない入力は、幅 720px 以下でフォーカスが無く本文が空なら `collapsed`
      7. 選んだ箇所の入口を次で扱う
         - `pointerup` と、ポインターを押していない間の `selectionchange` で、詳細パネル・全画面の中の選択から箇所を求め（`selectionLocation`）、あれば入口を出し、無ければ閉じる（図の拡大を開いている間は出さない）
         - 「押す」では入口を閉じ、`pendingLoc` に入れて下端の入力を描き直し、入力欄へフォーカスを移す。「閉じる」では入口を閉じて本文へフォーカスを戻す
      8. コメントの一覧のコールバックを次で扱う（どれも履歴に積まない）
         - 「行の項目を開く」では一覧を開いたまま詳細パネルを開き、`highlight` にその箇所を渡す
         - 「直しを送る」「箇所を外す」では `update`、「削除」では `remove` して消した中身を `removed` に入れ、「元に戻す」ではその中身を `id`・`created` ごと `add` して `removed` から外す。終えたらレビュー中を読み直して描き直す
         - 「まとめて送る」ではチェックした ID を溜めた順に `send` し、201 なら `removed`・`stale` を空にして「{件数} 件を送りました（{HH:mm}）。」、409 なら `stale` を入れて理由を出し、届かない・そのほかは理由を出す。どの場合もレビュー中を読み直す
         - Esc は、詳細パネルを開いていれば詳細パネルを、無ければ一覧を閉じる
      9. 書き換えの知らせにつなぐ（`subscribeEvents`）
         - `changed` を受けた場合、記録を読み直し、開いている画面・表示形式・ハッシュ・詳細パネルの項目・表の絞り込みと並べ替え・`CommentState` を保ったまま 3・5 を履歴に積まずに描き直す。開いていた項目が消えていれば詳細パネルを閉じる。読み直しが読めない（422）場合は描き直さない
         - つながりが切れた場合、接続の状態を `offline`（読んだ日時は最後に読めた記録の `built_at`）にしてトップバーを描き直す
         - つながり直した場合、記録とレビュー中を読み直して接続の状態を `online` に戻す
      10. `hashchange`・`popstate` で 4・5 を繰り返す
    notes:
      確かめ方: 単体テストは持たない。インターフェース定義『プレビューを開く』の結合テストがこの流れを確かめる
  - name: formKey
    title: 入力欄のキー
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/app.ts
    usecase: 項目へコメントする
    scope: public
    summary: 向けた先（`target` と `loc` の組）を 1 つの文字列にする（サーバーの書きかけの同じさと同じ比べ方）
    args:
      - name: target
        type: string | null
        required: true
        passing: positional
        description: 向ける項目の ID
      - name: loc
        type: Location | null
        required: true
        passing: positional
        description: 添えた箇所
    returns:
      type: string
      description: '`target`・`kind`・`start`・`end`・`key`・`text` をこの順に並べた JSON の文字列'
    process: 1. 無い値を `null` にした配列を `JSON.stringify` して返す
    unit_tests:
      - name: test_form_key
        case: 正常
        summary: 同じ向けた先は同じキー、箇所が違えば別のキー
        condition: '`parametrize`: `(D-1, null)` と `(D-1, null)` / `(D-1, null)` と `(D-1, 本文の 2 行目)` / キーの並びが違う同じ `loc` / `(null, null)` と `(D-1, null)`'
        mock: なし
        expected: 同じ / 違う / 同じ / 違う
test_files:
  - tests/unit/preview/test_app.py

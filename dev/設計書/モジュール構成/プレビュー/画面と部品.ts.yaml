        mock: 描画のライブラリの配信元（`page.route`）
        expected: 左の列の 1 行目が `del.df-blk`、右の列の 1 行目が `sbs-gap`、右の列の最後の行が `ins.df-blk`、左の列の最後の行が `sbs-gap`。左の列は `data-line-start` を持たない。右の列は `data-line-start` を持つ / 持たない。列の読み上げの名前は「選んだ時点の本文」「今の本文」
      - name: test_side_by_side_body_diff_when_aligned
        case: 正常
        summary: 変えていない塊は左右で上端の高さが揃う
        condition: 1 つ目の段落を 3 段落の長さに書き換えた前後を幅 600px の本文で描く
        mock: 描画のライブラリの配信元（`page.route`）

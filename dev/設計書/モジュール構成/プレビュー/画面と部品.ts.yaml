title: "プレビュー / 画面と部品"
lead: 部品（表・トップバー・表示形式の切り替え）と画面。どれも「引数を受けて要素を返す関数」で、操作は引数のコールバックで入口に知らせる。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/preview/
    components/
      view-switch.ts      表示形式の切り替え（部品設計『表示形式の切り替え』）
      topbar.ts           トップバー（部品設計『トップバー』）
      diff-mark.ts        差分の印（部品設計『差分の印』）
      history-dialog.ts   変更履歴（部品設計『変更履歴』）
      table.ts            表と、並べ替え・絞り込みの計算（部品設計『表』）
      send-form.ts        回答・意見の送信（部品設計『回答・意見の送信』）
    screens/
      overview.ts         概要
      decisions.ts        検討事項（マップ・ボード・表）
      tasks.ts            タスク（ボード・表）
      docs.ts             資料（カード・ボード・表）
      records.ts          調査・用語集・メモ・会話ログ（表）
      detail.ts           詳細パネルと詳細の全画面
      search.ts           全体の検索
      diagram-viewer.ts   図の拡大
    graph/
      graph.ts            つながり（3D）。見本の作りを関数に分けて整える
  ```

  `.ts` の書き方と生成した `.js` の扱いは、モジュール構成『基盤』のディレクトリ構成と同じ。
components:
  - name: viewSwitch
    title: 表示形式の切り替え
    container: plugins/mindstella/skills/mindmap/preview/components/view-switch.ts
    usecase: 共通
    kind: コンポーネント
    summary: 部品設計『表示形式の切り替え』の引数を受け、切り替えを `onChange(key)` で知らせる
    props:
      - name: views
        type: '{key, label}[]'
        required: true
        description: 並べる表示形式
      - name: current
        type: string
        required: true
        description: 選んでいる表示形式
      - name: onChange
        type: '(key: string) => void'
        required: true
        description: 切り替えのイベント
  - name: topbar
    title: トップバー
    container: plugins/mindstella/skills/mindmap/preview/components/topbar.ts
    usecase: 共通
    kind: コンポーネント
    summary: 部品設計『トップバー』の引数を受け、画面を移る・検索を開く・テーマの切り替えをコールバックで知らせる
    props:
      - name: title
        type: string
        required: true
        description: 題名
      - name: tabs
        type: '''{key, label, icon, count?, marked?}[]'''
        required: true
        description: タブ
      - name: current
        type: string
        required: true
        description: 開いている画面
      - name: theme
        type: "'light' | 'dark'"
        required: true
        description: 今のテーマ
      - name: onNavigate
        type: '(key: string) => void'
        required: true
        description: 画面を移る
      - name: onSearch
        type: () => void
        required: true
        description: 検索を開く
      - name: onTheme
        type: (theme) => void
        required: true
        description: テーマの切り替え
      - name: connection
        type: "'online' | 'offline'"
        required: false
        default: "'online'"
        description: サーバーにつながっているか。`offline` のとき接続の状態を出す
      - name: readAt
        type: string | null
        required: false
        default: 'null'
        description: 描いている記録を読んだ日時（`built_at`）。接続の状態に JST で添える（`formatJst`）
      - name: diffPoint
        type: '{name, sub} | null'
        required: false
        default: 'null'
        description: 選んだ時点。あるとき「変更履歴」の右に札と × を出す（部品設計『トップバー』の `diffPoint`）。`tabs[].marked` でタブに点を重ねる
      - name: onHistory
        type: () => void
        required: false
        default: なし（「変更履歴」を出さない）
        description: 変更履歴を開く
      - name: onDiffOff
        type: () => void
        required: false
        default: なし
        description: 札の × で差分の表示をやめる
  - name: table
    title: 表
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    kind: コンポーネント
    summary: 部品設計『表』の引数を受け、並べ替え・絞り込み・ピン留め・表示する列・初期設定に戻す・詳細を開くをコールバックで知らせる。行の絞り込みと並べ替えは `filterRows`・`sortRows`
    description: 描き直す前に表の入れ物の `scrollLeft`・`scrollTop` を控え、描いた後に戻す。
    props:
      - name: kind
        type: string
        required: true
        description: 項目の種類
      - name: columns
        type: Column[]
        required: true
        description: 列の定義（`key`・`label`・`filterable`・`fixed`・`hidden`・値を取る `get`・セルを描く `cell`）
      - name: rows
        type: object[]
        required: true
        description: 行にする項目
      - name: sort
        type: '{key, dir} | null'
        required: false
        default: 'null'
        description: 並べ替え
      - name: filters
        type: Record<string, string[]>
        required: false
        default: '{}'
        description: 絞り込み
      - name: pinTo
        type: string | null
        required: false
        default: 'null'
        description: この列まで固定
      - name: hiddenColumns
        type: string[]
        required: false
        description: 隠している列
      - name: on
        type: '{sort, filter, pin, columns, reset, open}'
        required: true
        description: 部品設計のイベントごとのコールバック
      - name: marks
        type: Record<string, 'new' | 'changed'>
        required: false
        default: '{}'
        description: 項目の ID → 差分の印。当たる行のタイトルの右に `diffMark` を置く（部品設計『表』の `marks`）
  - name: overviewScreen
    title: 概要
    container: plugins/mindstella/skills/mindmap/preview/screens/overview.ts
    usecase: 概要を見る
    kind: 画面
    summary: 画面設計『概要』のタイルを描く。次の候補・ゴールまでの進捗・カテゴリー別の進捗は埋め込みのデータの `derived` をそのまま並べる（画面で計算しない）。題名の上には `settings.description` があるときだけその 1 行を出す。`derived.goal.has_goal` が偽のときは、ゴールまでの進捗のタイルの見出しを「フェーズ別の進捗」にして「ゴールは決まっていません」と `phase_progress` だけを出し、納品物は出さない（`settings.goal` を読まない）
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, navigate}'
        required: true
        description: 項目を開く・絞った表へ移る（`Route`）
  - name: decisionsScreen
    title: 検討事項
    container: plugins/mindstella/skills/mindmap/preview/screens/decisions.ts
    usecase: 検討事項をマップで辿る
    kind: 画面
    summary: 画面設計『検討事項』を描く。マップは `buildDecisionTree` の木を `ELK.layout` で配置して SVG にし、幅 900px 以下では字下げの一覧にする。elkjs が読めないときは `libraryNotice`。状態の印の右端に `toggleAllBox` を置き、`shownStatuses` をまとめて入れ替えて描き直す。表示する状態の検討事項が 1 件も無いときは、マップの枠と字下げの一覧に空の旨を出す
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view}'
        required: true
        description: 項目を開く・表示形式を切り替える
    state:
      - name: shownStatuses
        type: Set<string>
        initial: 要見直し・未決定・未整理・保留
        description: マップで表示する状態
      - name: keyword
        type: string
        initial: 空
        description: マップのキーワード
      - name: zoom
        type: number
        initial: 全体が収まる倍率
        description: マップの倍率
  - name: tasksScreen
    title: タスク
    container: plugins/mindstella/skills/mindmap/preview/screens/tasks.ts
    usecase: タスクをボードで見る
    kind: 画面
    summary: 画面設計『タスク』を描く。ボードの列は `boardColumns`
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view}'
        required: true
        description: 項目を開く・表示形式を切り替える
  - name: docsScreen
    title: 資料
    container: plugins/mindstella/skills/mindmap/preview/screens/docs.ts
    usecase: 資料を読む
    kind: 画面
    summary: 画面設計『資料』を描く。カードの並びは `orderDocs`、絞り込みは `filterRows`（カードとボードで同じ条件）。ボードは絞り込んだ資料を `boardColumns`（`DOC_STATUSES`）で列に分け、列ごとに `orderDocs` で並べ直して `board` に渡す。ボードのカードは資料のカードから状態の印を外したもの
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view}'
        required: true
        description: 項目を開く・表示形式を切り替える
  - name: recordsScreen
    title: 記録の表
    container: plugins/mindstella/skills/mindmap/preview/screens/records.ts
    usecase: 項目を表で絞り込む
    kind: 画面
    summary: 画面設計『記録の表』を描く。調査・用語集・メモ・会話ログの列の定義を種類ごとに持ち、`table` に渡す
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 種類（`tab`）と絞り込み
      - name: on
        type: '{open}'
        required: true
        description: 項目を開く
  - name: detailPanel
    title: 詳細パネル
    container: plugins/mindstella/skills/mindmap/preview/screens/detail.ts
    usecase: 項目の詳細を読む
    kind: 画面
    summary: 画面設計『詳細パネル』『詳細の全画面』を描く。本文は `renderMarkdown`・`renderDiagrams`、関係する項目は `relatedItems`。`full` が真なら中央のモーダルで出し、図の拡大は中身を切り替える。`send` があれば下端に `sendForm` を留め、見出しと下端の間だけをスクロールする
    props:
      - name: id
        type: string
        required: true
        description: 項目の ID
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: full
        type: boolean
        required: true
        description: 全画面か
      - name: on
        type: '{open, close, full, back, forward, diagram}'
        required: true
        description: 項目へ移る・閉じる・全画面の切り替え・戻る進む・図を拡大する
      - name: send
        type: SendFormProps | null
        required: true
        description: 下端に置く回答・意見の送信の引数。配る書き出しでは `null`（置かない）
      - name: diff
        type: DiffPoint | null
        required: false
        default: 'null'
        description: '選んだ時点。あり、項目がその時点で足されたか変わったとき、前後の版を組み立て（`buildVersions`）、画面設計『詳細パネル』の選んだ時点・新規の札・キー・本文（`diffLineParts`）・図（`diffDiagram`）・Raw の差分と、組み立てられない旨を描く。本文・図・Raw の差分を描く前に jsdiff を読めたか確かめ（`missingLibraries(["Diff"])`）、読めていなければ本文の頭に `libraryNotice({names: ["jsdiff"], what: "本文と図の差分"})` を出し、本文・図・Raw は今の版を差分なしで描き、図の拡大へは `diff` を `null` で渡す。本文の差分を打ち切ったら「本文の差分を計算しきれない旨」、図を打ち切ったらその図だけ枠に色を付け、図の Raw の差分を打ち切ったらその図の Raw は今の記法を差分なしで出す'
  - name: searchDialog
    title: 全体の検索
    container: plugins/mindstella/skills/mindmap/preview/screens/search.ts
    usecase: 項目を検索する
    kind: 画面
    summary: 画面設計『全体の検索』を `dialog` 要素で描く。結果は `searchItems`
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, close}'
        required: true
        description: 結果の項目を開く・閉じる
  - name: diagramViewer
    title: 図の拡大
    container: plugins/mindstella/skills/mindmap/preview/screens/diagram-viewer.ts
    usecase: 項目の詳細を読む
    kind: 画面
    summary: 画面設計『図の拡大』を描く。ホイールで倍率、背景のドラッグで位置を変え、文字の上のドラッグは選択に任せる
    props:
      - name: svg
        type: SVGElement
        required: true
        description: 描いた図
      - name: on
        type: '{close}'
        required: true
        description: 閉じる
      - name: diff
        type: '{beforeSource: string} | null'
        required: false
        default: 'null'
        description: 差分の表示の間、その図の前の版の記法。あるとき詳細パネルと同じ色と「消したもの」を窓の下端に出し、Raw で記法の行の差分（`diffLineParts`）を出す。`diffLineParts` が `null` のときは Raw に今の記法を差分なしで出す
  - name: graphScreen
    title: つながり
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: つながりを辿る
    kind: 画面
    summary: 画面設計『つながり』をキャンバスに描く。玉と線は `buildGraph`、毎コマの描画は玉ごとに一度だけ画像にした文字を倍率をかけて置く（PoC の `opt-each-bitmap`）。画面の外は描かない。項目の種類の右端に `toggleAllBox` を置き、`shownKinds` をまとめて入れ替えて玉と線を作り直す。表示する種類が 1 つも無いときは、枠の中央に空の旨を出す
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open}'
        required: true
        description: 玉を押して項目を開く
    state:
      - name: shownKinds
        type: Set<string>
        initial: 全ての種類
        description: 表示する項目の種類
      - name: camera
        type: '{yaw, pitch, distance, target}'
        initial: 全体が収まる向きと距離
        description: 視点
      - name: labelCache
        type: Map<string, HTMLCanvasElement>
        initial: 空
        description: 玉・太さ・色ごとに描いた文字の画像
  - name: sendForm
    title: 回答・意見の送信
    container: plugins/mindstella/skills/mindmap/preview/components/send-form.ts
    usecase: 回答・意見を送る
    kind: コンポーネント
    summary: 部品設計『回答・意見の送信』の引数を受け、入力・送る・本文を写すをコールバックで知らせる。入力の幅が 360px 以下では結果を下の行へ回す（コンテナクエリ。`style.css`）
    props:
      - name: target
        type: string
        required: true
        description: 送る先の項目の ID
      - name: body
        type: string
        required: false
        default: "''"
        description: 入力欄の中身
      - name: status
        type: "'idle' | 'sending' | 'sent' | 'empty' | 'failed'"
        required: false
        default: "'idle'"
        description: 送信の状態
      - name: sentAt
        type: string | null
        required: false
        default: 'null'
        description: 受けた日時。`sent` のとき JST で出す（`formatJst`）
      - name: detail
        type: string | null
        required: false
        default: 'null'
        description: サーバーが返した理由。`failed` で `null` なら届かなかったとして立ち上げ直しの案内と「本文を写す」を出す
      - name: onInput
        type: '(body: string) => void'
        required: true
        description: 入力欄の中身が変わった
      - name: onSend
        type: '(body: string) => void'
        required: true
        description: 送るボタンか Ctrl+Enter（macOS は Cmd+Enter）。`sending` の間は呼ばない
      - name: onCopy
        type: '(body: string) => void'
        required: true
        description: 「本文を写す」
    unit_tests:
      - name: test_send_form
        case: 正常
        summary: 状態ごとの入力欄と結果
        condition: '`parametrize`: `sending` / `empty` / `failed` で `detail` が `null` / `failed` で `detail` あり'
        mock: なし（DOM を作って見る）
        expected: '`sending` は送るボタンが `disabled` で入力欄が `readonly` / `empty` は入力欄が `aria-invalid="true"` / 「本文を写す」がある / 理由が出て「本文を写す」が無い。どれも結果の要素が `role="status"` で入力欄の `aria-describedby` が指す'
      - name: test_send_form_when_ctrl_enter
        case: 正常
        summary: Ctrl+Enter で送り、送っている間は送らない
        condition: '`parametrize`: `idle` で Ctrl+Enter / `sending` で Ctrl+Enter'
        mock: '`onSend`'
        expected: '`onSend` が入力欄の中身で 1 回 / 呼ばれない'
  - name: diffMark
    title: 差分の印
    container: plugins/mindstella/skills/mindmap/preview/components/diff-mark.ts
    usecase: 前回からの差分を見る
    kind: コンポーネント
    summary: 部品設計『差分の印』の引数を受け、新規（+）か変更（●）の印を返す。表・ボード・カード・マップ・概要のタイル・詳細パネルが使う
    props:
      - name: kind
        type: "'new' | 'changed'"
        required: true
        description: 新規か変更か
      - name: labeled
        type: boolean
        required: false
        default: 'false'
        description: 文言つきの札にするか
  - name: historyDialog
    title: 変更履歴
    container: plugins/mindstella/skills/mindmap/preview/components/history-dialog.ts
    usecase: 前回からの差分を見る
    kind: コンポーネント
    summary: 部品設計『変更履歴』の引数を受け、`dialog` を `showModal()` で開く。行を押すと選んだ `sel` を知らせて閉じる。閉じたら「変更履歴」のボタンにフォーカスを戻す。並べる時点は入口が記録の `changes` と「前回開いてから」の始まりから作る（画面設計『変更履歴』の時点の一覧）
    props:
      - name: points
        type: '{sel, name, sub, count?}[]'
        required: true
        description: 並べる時点
      - name: current
        type: string
        required: true
        description: 今選んでいる時点の `sel`（差分を出さないときは空文字列）
      - name: onPick
        type: '(sel: string) => void'
        required: true
        description: 時点を選ぶ（空文字列は差分の表示をやめる）
      - name: onClose
        type: () => void
        required: true
        description: 閉じる
functions:
  - name: filterRows
    title: 行の絞り込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 列ごとの条件に合う行を返す（列の中はどれかに当たればよく、列の間は全てに当たる）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: 絞り込み
    returns:
      type: object[]
      description: 合う行（元の順）。値が配列の列は、要素のどれかが条件にあれば合う
    unit_tests:
      - name: test_filter_rows
        case: 正常
        summary: 列の中はどれか、列の間は全て
        condition: '`parametrize`: 状態 = 要見直し・保留 / 状態 = 未決定 かつ 着手可否 = 着手可能 / タグ（配列）= a / 条件なし'
        mock: なし
        expected: それぞれの条件に合う行だけが元の順で残る
  - name: sortRows
    title: 行の並べ替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 列の値で行を並べ替える（元の配列は変えない）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義（`order` を持つ列はその並びの順）
      - name: sort
        type: '{key, dir} | null'
        required: true
        passing: keyword
        description: 並べ替え。`null` なら元の順
    returns:
      type: object[]
      description: 並べ替えた行。数値は数の順、文字は `localeCompare(…, "ja")`、同じ値は元の順
    unit_tests:
      - name: test_sort_rows
        case: 正常
        summary: 昇順・降順・解除
        condition: '`parametrize`: タイトルで asc / 状態（`order` あり）で desc / `null`'
        mock: なし
        expected: あいうえお順 / `order` の逆順 / 元の順で、渡した配列が変わらない
  - name: filterCounts
    title: 絞り込みの値ごとの件数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 絞り込みのポップオーバーに出す、列の値ごとの件数を返す（その列以外の条件で絞った行で数える）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: 絞り込み
      - name: key
        type: string
        required: true
        passing: keyword
        description: 数える列
    returns:
      type: '{value, count}[]'
      description: 値ごとの件数（`order` を持つ列はその順、それ以外は値の順）
    unit_tests:
      - name: test_filter_counts
        case: 正常
        summary: ほかの列の条件だけを当てて数える
        condition: 状態とカテゴリーの列。状態 = 未決定、カテゴリー = A で絞っているときの状態の列
        mock: なし
        expected: カテゴリー A の行の状態ごとの件数（状態の条件は当てない）
  - name: boardColumns
    title: ボードの列
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/tasks.ts
    usecase: タスクをボードで見る
    scope: public
    summary: 状態の並びの順に、状態ごとの項目を返す（検討事項・資料のボードも使う）
    args:
      - name: items
        type: object[]
        required: true
        passing: keyword
        description: 項目
      - name: statuses
        type: string[]
        required: true
        passing: keyword
        description: 列にする状態の並び（スキーマの列挙の順。タスクは完了・中止も含む）
    returns:
      type: '{status, items}[]'
      description: 状態ごとの項目（項目が 0 件の列も返す。列の中は連番の順）
    unit_tests:
      - name: test_board_columns
        case: 正常
        summary: 状態の並びの順に分ける
        condition: 未着手の T-2・T-1、完了の T-3
        mock: なし
        expected: 未着手の列が T-1・T-2、進行中・保留・中止が空、完了が T-3
  - name: orderDocs
    title: 資料の並び
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/docs.ts
    usecase: 資料を読む
    scope: public
    summary: 納品物を先頭に、それぞれ連番の順に並べた資料を返す
    args:
      - name: docs
        type: object[]
        required: true
        passing: positional
        description: 資料
    returns:
      type: object[]
      description: 並べた資料
    unit_tests:
      - name: test_order_docs
        case: 正常
        summary: 納品物が先
        condition: A-1（納品物でない）・A-3（納品物）・A-2（納品物）
        mock: なし
        expected: A-2・A-3・A-1
  - name: buildDecisionTree
    title: 検討事項の木
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/decisions.ts
    usecase: 検討事項をマップで辿る
    scope: public
    summary: 対象 → カテゴリー → フェーズ → 検討事項の木を、表示する状態で絞って返す（ELK に渡す節と枝の形）
    args:
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
      - name: shownStatuses
        type: Set<string>
        required: true
        passing: keyword
        description: 表示する状態
    returns:
      type: '{children, edges}'
      description: ELK のグラフ。検討事項が 1 つも残らない枝（カテゴリー・フェーズ）は含めない。対象・カテゴリー・フェーズの節の ID は項目の ID と重ならない形（`target:{名前}` など）
    unit_tests:
      - name: test_build_decision_tree
        case: 正常
        summary: 非表示の状態だけの枝を落とす
        condition: カテゴリー A に未決定の D-1、カテゴリー B に決定済みの D-2 だけ。表示する状態は未決定だけ
        mock: なし
        expected: 節に D-1 とその対象・カテゴリー A・フェーズがあり、D-2 とカテゴリー B が無い
  - name: buildGraph
    title: つながりの玉と線
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: つながりを辿る
    scope: public
    summary: 表示する種類の項目を玉に、関連（依存・関連・根拠・進めるタスク）を線にして返す
    args:
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
      - name: shownKinds
        type: Set<string>
        required: true
        passing: keyword
        description: 表示する種類
    returns:
      type: '{nodes: {id, kind}[], links: {source, target, type}[]}'
      description: '`type` は `depends`・`related`・`source`・`for`。両端のどちらかが非表示か記録に無い線は含めない'
    unit_tests:
      - name: test_build_graph
        case: 正常
        summary: 線の種類を分け、非表示の種類の線を落とす
        condition: 'D-2（`depends_on: [D-1]`、`sources: [R-1]`）・T-1（`for: [D-1]`）・N-1（`related: [D-1]`）。表示する種類からメモを外す'
        mock: なし
        expected: 線が `depends`（D-2→D-1）・`source`（D-2→R-1）・`for`（T-1→D-1）の 3 本で、N-1 とその線が無い
  - name: formatJst
    title: 日時の表示
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/send-form.ts
    usecase: 回答・意見を送る
    scope: public
    summary: UTC のタイムゾーン付き ISO 8601 を JST の `MM/DD HH:mm` にする（送信の結果と接続の状態が使う）
    args:
      - name: iso
        type: string
        required: true
        passing: positional
        description: 日時
    returns:
      type: string
      description: JST の `MM/DD HH:mm`
    process: "1. `Intl.DateTimeFormat` に `timeZone: 'Asia/Tokyo'` を渡して月・日・時・分を 2 桁で並べる"
    unit_tests:
      - name: test_format_jst
        case: 正常
        summary: UTC を JST にする
        condition: '`parametrize`: `2026-10-04T02:23:00+00:00` / `2026-10-04T16:05:00+00:00`'
        mock: なし
        expected: '`10/04 11:23` / `10/05 01:05`'
test_files:
  - tests/unit/preview/test_table.py
  - tests/unit/preview/test_tasks.py
  - tests/unit/preview/test_docs.py
  - tests/unit/preview/test_decisions.py
  - tests/unit/preview/test_graph.py
  - tests/unit/preview/test_send_form.py

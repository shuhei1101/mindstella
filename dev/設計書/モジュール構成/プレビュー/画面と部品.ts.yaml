  - name: searchDialog
    title: 全体の検索
    container: plugins/mindstella/skills/mindmap/preview/screens/search.ts
    usecase: 項目を検索する
    kind: 画面
    summary: 画面設計『全体の検索』を `dialog` 要素で描く。結果は `searchItems` で、`tier` ごとに見出し「完全に一致」「タイトルに一致」「ほかの所に一致」の下に並べ、結果ごとに種類の札を添える。当たった項目の無い段の見出しは出さない。ID は折り返さない
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, close}'
        required: true
        description: 結果の項目を開く・閉じる
  - name: diagramViewer
    title: 図の拡大
    container: plugins/mindstella/skills/mindmap/preview/screens/diagram-viewer.ts
    usecase: 項目の詳細を読む
    kind: 画面
    summary: 画面設計『図の拡大』を描く。ホイールで倍率、背景のドラッグで位置を変え、文字の上のドラッグは選択に任せる
    props:
      - name: svg
        type: SVGElement
        required: true
        description: 描いた図
      - name: on
        type: '{close}'
        required: true
        description: 閉じる
      - name: diff
        type: '{beforeSource: string} | null'
        required: false
        default: 'null'
        description: 差分の表示の間、その図の前の版の記法。あるとき詳細パネルと同じ色と「消したもの」を窓の下端に出し、Raw で記法の行の差分（`diffLineParts`）を出す。`diffLineParts` が `null` のときは Raw に今の記法を差分なしで出す。Raw の変えた行の対には、詳細パネルの図の Raw の差分と同じく語の面（`span.df-word`）を付ける
  - name: graphScreen
    title: ネットワーク
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    kind: 画面
    summary: '画面設計『ネットワーク』をキャンバスに描く。`graphConditions` の条件と `filters` で項目を絞り（`filterRows`）、玉と線はその ID で作った `buildGraph`。種類の帯は出さない。毎コマ、玉と線の画面の位置・大きさ・濃さを求めて `LookFrame` にまとめ、`drawLook` で `look` の見た目に描かせてから（`reducedMotion` には毎コマ `matchMedia("(prefers-reduced-motion: reduce)")` の結果を入れる。真のときは、操作が止まった後の自動の回転もしない。鍵の震えは止めない）、名前（玉ごとに一度だけ画像にした文字を倍率をかけて置く。PoC の `opt-each-bitmap`。色は `lookLabelColor`）・状態の印・鍵を重ねる。画面の外は描かない。条件が変わったら玉と線を作り直し、見た目が変わっても作り直さない（`setGraphLook`）。条件に合う項目が 1 件も無いときは、枠の中央に空の旨を出す。キャンバスの上に `filterChips` を、右上に見た目のドロップダウン（`select`。`NETWORK_LOOKS` の順に名前を並べ、`defaultLook` の名前に「（既定）」を添える。読み上げの名前は「ネットワークの見た目」）を描く。`drawerOpen` のときは `drawerGroups` で組んだ `filterDrawer` を描く。注目の起点は `lockedId`、無ければ `selectedId` で、起点へ寄り、起点とつながる玉を強調して線に光を流す。注目の起点があるときだけ、起点とつながる玉の名前の左に状態の印（`statusMark` の SVG か、資料の成果物は `icon("box")` を、状態・成果物・ライト / ダークごとに一度だけ絵にしたもの）を、名前の文字の高さの 8 割で名前と同じ遠近・濃さで描く。鍵は名前の右（名前が 8px 未満なら玉の右上の札の中）に 24 の枠の線画で描き、閉じた鍵は `lockedId` の玉に、開いた鍵はロックしていないときに `selectedId` の玉へカーソルを乗せている間だけ出す。鍵を出す玉は、コメントの印を鍵の右へずらす。玉か余白を押したら、`resolvePress` で 2 回押しを読み替えた項目（余白は `null`）で `on.lock` を呼び、`shake` が返ったら鍵を震わせる（`shakeAt` の量を毎コマ当てる。震えている間に描き直しても始まりの時刻を保つ）。幅 900px 以下では `on.lock` を呼ばず、押した玉の項目を `on.open` で開き、鍵を出さない。キャンバスの読み上げの説明に「L キーで、詳細を開いている項目をロック・解除」を添える'
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, filter, closeDrawer, lock, look}'
        required: true
        description: 玉を押して項目を開く（幅 900px 以下）・条件を変える（新しい `filters`）・ドロワーを閉じる・玉か余白を押した（押した項目の ID か `null`。入口が `lockTap` で判定し、`LockAction` を返す）・見た目のドロップダウンで選んだ（見た目の値）
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みの条件（入口の `FilterState` のネットワークの分）
      - name: drawerOpen
        type: boolean
        required: true
        description: 絞り込みのドロワーを開いているか
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        description: '今当てているネットワークの見た目（`resolveDisplay`）。キャンバスの入れ物の `data-look` に入れて `drawLook` に渡し、見た目のドロップダウンで選んでいる値にする'
      - name: comments
        type: Record<string, number>
        required: false
        default: なし（印を出さない）
        description: 項目の ID → レビュー中のコメントの件数（入口の `commentCounts`。描いている間は `setGraphComments` で差し替える）。毎コマ、名前を文字 8px 以上で描いた玉のうち件数のある玉に、名前の右端に続けて縦は名前の中央に `commentMark` を置く（キャンバスの上に重ねる層。重なり順は層の中に閉じ、手前の玉ほど上、濃さは名前と同じ）。名前と印が描く枠に収まらない玉と、名前が 8px 未満の玉には置かない
      - name: defaultLook
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        description: ワークスペースの既定の見た目（`resolveDisplay`）。見た目のドロップダウンで、この見た目の名前に「（既定）」を添える
      - name: selectedId
        type: string | null
        required: true
        description: 詳細パネルで開いている項目（`Route.id`）。ロックしていなければ注目の起点にする
      - name: lockedId
        type: string | null
        required: true
        description: 効いているロック（入口の `LockState.graph` の項目を描いていればその ID、絞り込みで描いていなければ `null`）。注目の起点にし、閉じた鍵を出す
    state:
      - name: camera
        type: '{yaw, pitch, distance, target}'
        initial: 全体が収まる向きと距離
        description: 視点
      - name: labelCache
        type: Map<string, HTMLCanvasElement>
        initial: 空
        description: 玉・太さ・色ごとに描いた文字の画像
      - name: lastPress
        type: '{time, x, y, id} | null'
        initial: 'null'
        description: 前に押した時刻・位置・項目（`resolvePress` に渡す。押すたびに置き換える）
      - name: shakeStart
        type: number
        initial: -Infinity
        description: 鍵が震え始めた時刻（`SHAKE_MS` を過ぎたら震えを当てない）
      - name: markCache
        type: Map<string, HTMLImageElement>
        initial: 空
        description: 状態・成果物・ライト / ダークごとに絵にした状態の印
  - name: sendForm
    title: コメントの入力
    container: plugins/mindstella/skills/mindmap/preview/components/send-form.ts
    usecase: 項目へコメントする
    kind: コンポーネント
    summary: 部品設計『コメントの入力』の引数を受け、入力・溜める・箇所を外す・本文を写す・入力欄に入る・出るをコールバックで知らせる。入力の幅が 360px 以下では結果を下の行へ回す（コンテナクエリ。`style.css`）
    props:
      - name: target
        type: string | null
        required: true
        description: 向ける項目の ID。`null` は項目を指さないコメント（ラベルを見せず `aria-label`）
      - name: loc
        type: Location | null
        required: false
        default: 'null'
        description: 添えた箇所。入力欄の上に `locationLabel` と選んだ文（3 行まで）と × を出す
      - name: body
        type: string
        required: false
        default: "''"
        description: 入力欄の中身
      - name: status
        type: "'idle' | 'saving' | 'saved' | 'empty' | 'failed'"
        required: false
        default: "'idle'"
        description: 溜める状態。`saving` が 1 秒を超えたら回る印と文言を出す（`SENDING_NOTICE_DELAY_MS`）
      - name: count
        type: number | null
        required: false
        default: 'null'
        description: 溜めた後の件数。`saved` のときに出す
      - name: detail
        type: string | null
        required: false
        default: 'null'
        description: サーバーが返した理由。`failed` で `null` なら届かなかったとして立ち上げ直しの案内と「本文を写す」を出す
      - name: collapsed
        type: boolean
        required: false
        default: 'false'
        description: 畳んだ形（`target` が `null` のときだけ使う）
      - name: on
        type: '{input, save, unquote, copy, focus, blur}'
        required: true
        description: 入力欄の中身が変わった・「レビューに追加」か Ctrl+Enter（macOS は Cmd+Enter。`saving` の間は呼ばない）・箇所の ×・「本文を写す」・入力欄に入った・部品の外へ出た
      - name: label
        type: string
        required: false
        default: "'項目を指さないコメント'"
        description: '`target` が `null` のときの入力欄の `aria-label`（コメントの一覧の新しいスレッドの入力は「新しいスレッド」）'
    unit_tests:
      - name: test_send_form
        case: 正常
        summary: 状態ごとの入力欄と結果
        condition: '`parametrize`: `saving` / `saved`（`count: 3`）/ `empty` / `failed` で `detail` が `null` / `failed` で `detail` あり'
        mock: なし（DOM を作って見る）
        expected: '`saving` はボタンが `disabled` で入力欄が `readonly` / 「レビューに追加しました（レビュー中 3 件）。」/ 入力欄が `aria-invalid="true"` / 「本文を写す」がある / 「レビューに追加できませんでした。{理由}」で「本文を写す」が無い。どれも結果の要素が `role="status"` で入力欄の `aria-describedby` が指す'
      - name: test_send_form_when_location_and_no_target
        case: 正常
        summary: 添えた箇所と項目を指さない形
        condition: '`parametrize`: `target: A-005`・`loc` が本文の 3 行目 / `target: null` / `target: null`・`collapsed: true`'
        mock: '`on.unquote`'
        expected: 「本文 3 行目」と選んだ文が出て × で `on.unquote` が 1 回、入力欄が 1 行 / ラベルが見えず入力欄の `aria-label` が「項目を指さないコメント」で入力欄が 1 行 / 「レビューに追加」が無く入力欄が 1 行
      - name: test_send_form_when_ctrl_enter
        case: 正常
        summary: Ctrl+Enter で溜め、溜めている間は溜めない
        condition: '`parametrize`: `idle` で Ctrl+Enter / `saving` で Ctrl+Enter'
        mock: '`on.save`'
        expected: '`on.save` が入力欄の中身で 1 回 / 呼ばれない'
  - name: selectionComment
    title: 選んだ箇所のコメントの入口
    container: plugins/mindstella/skills/mindmap/preview/components/selection-comment.ts
    usecase: 選んだ箇所へコメントする
    kind: コンポーネント
    summary: 部品設計『選んだ箇所のコメントの入口』のピル。選んだ範囲の矩形から位置を決め（下に収まらなければ上、左右は画面の端から 8px の内側）、押す・Esc をコールバックで知らせる。押したときに選択が外れないよう `pointerdown` の既定の動きを止める
    props:
      - name: anchor
        type: '{first: DOMRect, last: DOMRect}'
        required: true
        description: 選んだ範囲の最初と最後の矩形（`Range.getClientRects()`）
      - name: viewport
        type: '{width: number, height: number}'
        required: true
        description: 画面の大きさ
      - name: on
        type: '{press, close}'
        required: true
        description: 押した（Enter・Space を含む）・Esc
    unit_tests:
      - name: test_selection_comment_position
        case: 正常
        summary: 下に収まらなければ上、端は内側に収める
        condition: '`parametrize`: 画面の中ほど / 最後の矩形が画面の下端の近く / 右端に寄った幅 390px'
        mock: なし
        expected: 最後の矩形の下 / 最初の矩形の上 / 右端から 8px の内側
      - name: test_selection_comment_keys
        case: 正常
        summary: Enter で押し、Esc で閉じる
        condition: 入口にフォーカスして Enter、Esc
        mock: '`on.press`・`on.close`'
        expected: それぞれ 1 回呼ばれる。読み上げの名前が「選んだ箇所にコメント」
  - name: commentsPanel
    title: コメントの一覧
    container: plugins/mindstella/skills/mindmap/preview/screens/comments.ts
    usecase: スレッドで話す
    kind: 画面
    summary: 左から出すパネル（`aside`。読み上げの名前「コメントの一覧」）を描く。見出しの帯（「コメント」・レビュー中の入口・閉じる）の下に、`view` で画面設計『コメントの一覧』（`threadListView`）・『スレッド』（`threadView`）・『レビュー中の書き込み』（`reviewView`）のどれかを入れる。レビュー中の入口は `view` が `review` のとき出さず、0 件のときは件数の塗りを外す（`data-focus` は `review`）。操作はコールバックで入口に知らせ、描き直しても操作していた部品にフォーカスを戻す。開いている間は `inertBehind` で覆った本文の部品を止め、閉じたら外す
    props:
      - name: view
        type: "'list' | 'thread' | 'review'"
        required: true
        description: パネルの中に出す画面
      - name: items
        type: ReviewState['items']
        required: true
        description: レビュー中の書き込み（新しいスレッドと返信）
      - name: removed
        type: ReviewState['items']
        required: true
        description: パネルを開いている間に消した書き込み（元の場所に「元に戻す」を出す）
      - name: threads
        type: Thread[]
        required: true
        description: 最後に読めたスレッド
      - name: threadsError
        type: '{detail: string | null} | null'
        required: true
        description: スレッドを読めなかったときの理由（届かなければ `detail` が `null`）。読めていれば `null`
      - name: filter
        type: "'open' | 'closed' | 'all'"
        required: true
        description: 状態の絞り込み
      - name: tag
        type: string | null
        required: true
        description: 絞っているタグ
      - name: opened
        type: '{id: string, pending: boolean} | null'
        required: true
        description: 開いているスレッド（`pending` が真なら `id` はまだ送っていない新しいスレッドのコメントの ID）
      - name: composing
        type: boolean
        required: true
        description: 新しいスレッドの入力を出しているか
      - name: free
        type: SendFormProps
        required: true
        description: "新しいスレッドの入力の引数（`target: null`・`label: '新しいスレッド'`・`collapsed: false`）"
      - name: reply
        type: '{body, status, count, detail}'
        required: true
        description: 開いているスレッドの返信の入力の引数
      - name: reason
        type: "{open: boolean, body: string, status: 'idle' | 'saving' | 'failed', detail: string | null}"
        required: true
        description: 理由の入力の状態（`failed` で `detail` が `null` なら届かなかった）
      - name: checked
        type: Set<string>
        required: true
        description: チェックした書き込みの ID
      - name: editing
        type: string | null
        required: true
        description: 本文を書き換えている書き込みの ID（詳細パネルと共に 1 つ）。入力欄は `editingIn` が `'list'` で、その書き込みを出している画面にだけ描く
      - name: editingIn
        type: "'list' | 'detail'"
        required: false
        default: "'list'"
        description: "`editing` の修正を始めた場所（パネルの中なら `'list'`、詳細パネルなら `'detail'`）"
      - name: editError
        type: string | null
        required: false
        default: 'null'
        description: 本文を直せなかった理由
      - name: editBody
        type: string | null
        required: false
        default: 'null'
        description: 本文を直せなかったとき、入力欄に残す書き換えていた中身
      - name: stale
        type: Map<string, string>
        required: true
        description: 送れなかった書き込みの ID → 理由
      - name: result
        type: "{kind: 'sending' | 'sent' | 'failed' | 'stale', count?, at?, detail?, entered?} | null"
        required: true
        description: まとめて送った結果（文言は画面設計『レビュー中の書き込み』の「送った結果」）
      - name: selected
        type: string | null
        required: true
        description: 行から開いて詳細パネルに出している書き込みの ID
      - name: reviewFocus
        type: string | null
        required: true
        description: スレッドの画面からレビュー中の書き込みを開いたときの、そのスレッドの ID（そのスレッドの書き込みの行を示す）
      - name: titleOf
        type: '(id: string) => string | null'
        required: true
        description: 項目のタイトル（記録から消えていれば `null`）
      - name: on
        type: '{close, review, back, filter, tag, clearTag, compose, openThread, openId, changeSet, reply, replyInput, reasonOpen, reasonInput, setStatus, check, checkAll, send, open, edit, saveEdit, cancelEdit, remove, restore, unloc}'
        required: true
        description: 閉じる・レビュー中を開く・戻る・状態で絞る・タグで絞る・タグを外す・新しいスレッドの入力を出す／畳む・スレッドを開く・項目を開く・まとまりのリンクを押した（まとまりの ID）・返信を溜める・返信の入力・理由の入力を出す／閉じる・理由の入力・状態を変える・チェック・すべて選ぶ・まとめて送る・行の項目を開く・修正・書き換えを送る・キャンセル・削除・元に戻す・箇所を外す
      - name: changeSetOf
        type: '(id: string) => string | null'
        required: true
        description: まとまりの説明（記録の `changes.sets` に無ければ `null`）
    unit_tests:
      - name: test_comments_panel
        case: 正常
        summary: 見出しの帯と、view ごとの中身
        condition: 'レビュー中 3 件。`parametrize`: `view` が `list` / `thread`（TH-1 を開く）/ `review`'
        mock: '`on.review`・`on.close`'
        expected: どれも見出し「コメント」と読み上げの名前「コメントの一覧を閉じる」のボタンを持つ。`list`・`thread` は読み上げの名前「レビュー中の書き込みを確かめる（3 件）」の入口があり（押すと `on.review` が 1 回）、`review` は入口が無い。中身が順にスレッドの一覧・スレッド・レビュー中の書き込み
      - name: test_comments_panel_when_no_pending
        case: 正常
        summary: レビュー中が 0 件でも入口を出す
        condition: '`items` が空で `view` が `list`'
        mock: なし
        expected: 入口があり、クラス `zero` を持ち、読み上げの名前が「レビュー中の書き込みを確かめる（0 件）」

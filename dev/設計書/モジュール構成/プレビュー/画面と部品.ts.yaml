    returns:
      type: Record<string, string[]>
      description: 今の記録にある値だけの条件。値が 1 つも残らない列はキーごと外す（渡した `saved` は変えない）
    process: |-
      1. `saved` のキーごとに見る。`~` で始まるキーはそのまま写す
      2. `columns` に無いキーは外す
      3. それ以外は、`rows` のその列の値（`get`。配列は要素ごと）に現れる値だけを残し、残らなければキーごと外す

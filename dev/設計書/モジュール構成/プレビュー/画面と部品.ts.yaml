        required: true
        description: 見た目を選ぶ（値）・表示する種類を変える（変えた後の並び）・既定に戻す・ワークスペースの既定にする・閉じる
    unit_tests:
      - name: test_settings_panel
        case: 正常
        summary: 上書きの有無と既定との違いで、既定に戻すと保存のボタンを出し分ける
        condition: '`parametrize`: `overrides` が空で既定と同じ / `look: dust`・`defaultLook: starlight`・`overrides` 2 件 / 同じで `canSave: false` / `look`・`kinds` が既定と同じで `overrides` が「ライト / ダーク」'
        mock: なし（DOM を作って見る）
        expected: 「ワークスペースの既定のまま表示しています。」と「今の選びはワークスペースの既定と同じです。」でボタンが無い / 「既定に戻す」と「ワークスペースの既定にする」があり、星の光の行に「既定」の札 / 「既定に戻す」だけがある / 「既定に戻す」があり、保存のボタンの代わりに「今の選びは…同じです。」
      - name: test_settings_panel_when_kinds_changed
        case: 正常
        summary: 種類のチェックと「すべて」で変えた後の並びを知らせる
        condition: 用語集と会話ログを除く 5 種類。タスクのチェックを外し、次に「すべて」を押す
        mock: '`on.kinds`'
        expected: 「すべて」が `indeterminate` で `5/7`。`on.kinds` がタスクを除いた 4 種類、続けて 7 種類で呼ばれる。概要とつながりの行はチェックボックスを持たない
  - name: settingsConfirm

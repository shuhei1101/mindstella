    summary: 画面設計『保存待ちのパネル』を、コメントの一覧と同じ左から出すパネル（幅 900px 以下は画面の幅いっぱい）に描く。編集を項目ごとにまとめ（`groupEdits`）、行の文言は `editRowText`。保存した知らせ（`role="status"`）もここに置き、使う側が 5 秒で消す
    props:
      - name: edits
        type: PendingEdit[]
        required: true
        description: 保存待ちの編集
      - name: blocked
        type: BlockedEdit[]
        required: true
        description: 直前の保存で書き込めなかった編集（無ければ空）
      - name: index
        type: RecordIndex
        required: true
        description: 編集を当てる前の記録の索引（項目の種類・タイトルを引く）
      - name: status
        type: "'idle' | 'saving' | 'offline'"
        required: true
        description: 保存の状態（`offline` は直前の保存が届かなかった）
      - name: on
        type: '{close, open, undo, save}'
        required: true
        description: パネルを閉じる・まとまりの項目を開く（項目の ID・仮の ID・`settings`）・1 件を取り消す（編集の ID）・まとめて保存する
    unit_tests:
      - name: test_pending_edits_panel
        case: 正常
        summary: 項目ごとのまとまりと件数、削除の件数を出し、操作を知らせる
        condition: E-1（D-1 の `answer`）・E-2（N-1 の削除）・E-3（題名）。E-1 の取り消すと「まとめて保存する」を押す
        mock: '`on.undo`・`on.save`'
        expected: 見出しが「保存待ち」「3 件」、まとまりが D-1・N-1・設定の 3 つ、合計が「3 件（うち削除 1 件）をワークスペースに書きます」、ボタンが「まとめて保存する（1 件を削除）」。`on.undo` が E-1 で 1 回、`on.save` が 1 回
      - name: test_pending_edits_panel_when_empty_or_blocked
        case: 異常
        summary: 空・書き込めない・届かない・送信中の表示
        condition: '`parametrize`: 編集 0 件 / `blocked` に E-1（`changed`）/ `status: offline` / `status: saving`'
        mock: なし
        expected: 「保存待ちの編集はありません。」で保存のボタンが押せない / 「1 件の編集を書き込めないため、何も保存していません。」が `role="alert"` で E-1 の行に理由 / 「サーバーにつながらないため、保存できませんでした。」/ ボタンが「保存しています…」で `aria-busy` が真
  - name: workspaceSettings
    title: 設定の画面
    container: plugins/mindstella/skills/mindmap/preview/screens/workspace-settings.ts
    usecase: 画面で項目を編集して保存する
    kind: 画面
    summary: 画面設計『設定の画面』を描く。入力は保存待ちの編集を当てた設定（`applyEdits`）で描き、溜めたキーの名前の右に `pendingEditMark`（`compact`）を置く。使われている値を外したときは `usageCount` で件数を数えて「付け替え先」を出し、選ぶまでは `on.change` を呼ばない。対象・カテゴリーの行の名前を書き換えたときは古い名前 → 新しい名前を `map` に付ける
    props:
      - name: settings
        type: object
        required: true
        description: 保存待ちの編集を当てた設定
      - name: index
        type: RecordIndex
        required: true
        description: 編集を当てた記録の索引（使われている値の件数を数える）
      - name: marks
        type: Record<string, 'pending' | 'blocked'>
        required: true
        description: 設定のキー → 印の種類（`pendingMarkOf` の `target` を `settings` にした値）
      - name: errors
        type: Record<string, string>
        required: true
        description: 設定のキー → 溜められなかった理由（入力を残してキーの下に出す）
      - name: on
        type: '{change, close}'
        required: true
        description: 設定のキーを溜める（`{key, value, map}`）・画面を閉じる
    unit_tests:
      - name: test_workspace_settings
        case: 正常
        summary: まとまりごとに並べ、離れたときにキーを溜める
        condition: 題名 話し合い。題名を「画面の編集」にして入力欄を離れる。保持する回数を 3 にして離れる
        mock: '`on.change`'
        expected: '`fieldset` の見出しが「話し合い」「進め方」「タグと関連」「変更履歴」の順。`on.change` が `{key: summary, value: 画面の編集}`・`{key: history_limit, value: 3}` で 1 回ずつ'
      - name: test_workspace_settings_when_used_value_removed
        case: 正常
        summary: 使われている値を外すと付け替え先を選ぶまで溜めない
        condition: フェーズ 問い・発散、問い を持つ D-1・D-2。問い のチップの × を押し、付け替え先に 発散 を選ぶ
        mock: '`on.change`'
        expected: '「問い を使っている 2 件の付け替え先」と「付け替え先を選ぶと保存待ちに入ります。」が出て、選ぶ前は `on.change` が呼ばれない。選んだ後に `{key: phases, value: [発散], map: {問い: 発散}}` で 1 回'
  - name: detailEditForm
    title: 編集の表示
    container: plugins/mindstella/skills/mindmap/preview/screens/detail-edit.ts
    usecase: 画面で項目を編集して保存する
    kind: 画面
    summary: 画面設計『詳細パネル』の「編集の表示」「タイトルの入力」「案の入力」「項目を削除」「書き込めない理由」を描く `form` を返す。並べるキーは `editableKeys`。入力欄を離れたとき（選ぶ・チェックは選んだとき）に `on.change` を呼ぶ。タイトルが空白だけなら呼ばず「タイトルを書いてください。」を出して `aria-invalid="true"` にする。削除を溜めた項目は入力を読むだけにして頭に「削除を溜めています。削除を取り消すと編集できます。」を出す。`target` が仮の ID のときは項目を追加する入力として描き、「項目を削除」を置かない
    props:
      - name: kind
        type: Kind
        required: true
        description: 項目の種類
      - name: item
        type: object
        required: true
        description: 保存待ちの編集を当てた項目（`applyEdits`）
      - name: settings
        type: object
        required: true
        description: 編集を当てた設定（フェーズ・対象・カテゴリー・タグの選択肢）
      - name: marks
        type: Record<string, 'pending' | 'remove' | 'blocked'>
        required: true
        description: キーか案の記号 → 印の種類（入力欄の枠と名前の後ろの印）
      - name: removing
        type: boolean
        required: true
        description: その項目の削除を溜めているか
      - name: removedOptions
        type: string[]
        required: true
        description: 削除を溜めた案の記号（中身に取り消し線を引く）
      - name: blocked
        type: Record<string, BlockedEdit>
        required: true
        description: キーか案の記号 → 直前の保存で書き込めなかった編集
      - name: referrers
        type: string[]
        required: true
        description: その項目を指している項目の ID（「項目を削除」の下の警告）
      - name: errors
        type: Record<string, string>
        required: true
        description: キー → 溜められなかった理由（入力を残してキーの下に出す）
      - name: on
        type: '{change, remove, cancelRemove}'
        required: true
        description: キー・案を溜める（`{op, key, value}`）・削除を溜める・削除を取り消す
    unit_tests:
      - name: test_detail_edit_form
        case: 正常
        summary: 離れたときにキー・案を溜める
        condition: 案 A・B の検討事項 D-1。`answer` を書いて離れる。案 B の「採用」を選ぶ。「案を追加」で足した案 C の中身を書いて離れる
        mock: '`on.change`'
        expected: '`on.change` が `{op: set, key: answer}`・`{op: adopt, key: B, value: B}`・`{op: option-add, key: C}` の順で 1 回ずつ'
      - name: test_detail_edit_form_when_removing_or_referenced
        case: 異常
        summary: 削除を溜めた項目は読むだけにし、指されている項目は警告を出す
        condition: '`parametrize`: `removing: true` で描く / `referrers: [D-2]` で描く'
        mock: '`on.change`'
        expected: '`on.change` が呼ばれない。入力が読むだけで「削除を溜めています。削除を取り消すと編集できます。」と「削除を取り消す」 / 「D-2 が指しているため、保存のときに削除できません。指している項目から外すと削除できます。」'
      - name: test_detail_edit_form_when_title_blank
        case: 異常
        summary: 空のタイトルは溜めない
        condition: タイトルを空白だけにして離れる
        mock: '`on.change`'
        expected: '`on.change` が呼ばれず、「タイトルを書いてください。」と `aria-invalid="true"`'
  - name: decorateMarkdown
    title: Markdownの本文
    kind: コンポーネント
    container: plugins/mindstella/skills/mindmap/preview/components/markdown-body.ts
    usecase: 項目の詳細を読む
    summary: '部品設計『Markdownの本文』。`renderMarkdown` で描いた本文の要素に、次の順で見せ方を当てる（戻り値は無く、`root` の中を書き換える）。(1) 表ごとに、列の見出しと本体のセルの `textWidth` の最大を `columnSize` にかけ、列のセルに `data-col-size`（`short`・`medium`・`long`）と中くらいの列の `--md-col-min`（em）を付ける。`div.md-table-wrap` を送らない枠 `div.md-table-frame` で包み、右へまだ送れる間だけ枠に `data-fade` を付ける（入れ物の `scroll` と `ResizeObserver` で見直す）。(2) `display.pin` が真なら、最後の列を除く見出しのセルに固定のボタン（`button.md-pin`、`aria-pressed`、読み上げの名前「{列名}まで固定」）を置き、押した列までのセルに `position: sticky` の左の位置と、固定した列の右端の影を付ける（もう一度押すと外す。画面の幅 720px 以下は `style.css` でボタンを隠し固定を外す）。(3) `display.head` が真なら表に `md-head-stick` を付ける（ずらしは `bindTableHeads` が入れる）。(4) `display.stripes` が真なら表に `md-stripes` を付ける（差分の印の行は差分の面のまま）。(5) `fold` と `display.fold` がどちらも真なら、本文で使っている見出しの階層のうち上から `FOLD_LEVELS` の階層の見出しごとに、次の同じか上の階層の見出しまでを `div.md-section-body` で包み（中身の無い見出しは包まず開閉も置かない）、見出しの頭に開閉の矢印（`button.md-fold`、24px、`aria-expanded`・`aria-controls`、読み上げの名前「{見出し}を開閉」）を置く。開いた状態で描き、畳むと入れ物を `hidden="until-found"` にする（`beforematch` で開く）。見出しの文言はボタンに入れず、選んだ箇所の対応づけに使う `data-line-start` を変えない。(6) コードブロック（図と `html` のコードブロックを除く）を `div.md-code` で包み、`pre` の外に言語を書いたものだけ言語の札と、コピーのボタン（読み上げの名前「コードをコピー」）を置く。押すと `code` の文字だけをクリップボードに入れ、`CODE_COPIED_MS` の間チェックの印に変えて `role="status"` で伝える。(7) 先頭の段落が `[!NOTE]` 等（`CALLOUT_KINDS`）で始まる引用を、印を消して `blockquote.md-callout` にし、種類のアイコンと見出しの文言を先頭に置く（行の印は引き継ぐ）。同じ `root` に 2 回当てても包み・ボタンを重ねない'
    props:
      - name: root
        type: HTMLElement
        required: true
        description: '`renderMarkdown` で描いた本文の要素'
      - name: display
        type: '{pin: boolean, head: boolean, stripes: boolean, fold: boolean}'
        required: false
        default: BODY_VIEW_DEFAULT
        description: 表示の設定の本文の見せ方
      - name: fold
        type: boolean
        required: false
        default: 'true'
        description: 開閉を置ける本文か（本文の差分では偽）
    unit_tests:
      - name: test_decorate_markdown_when_table
        case: 正常
        summary: 列の文字数で幅の印を付け、表を送らない枠で包む
        condition: ID（3 文字）・名前（12 文字）・説明（30 文字）の 3 列の表を持つ本文。幅 400px の親に置く
        mock: なし（DOM を作って見る）
        expected: 列のセルが `data-col-size` で `short`・`medium`・`long`、名前の列の `--md-col-min` が `8em`。`div.md-table-wrap` が `div.md-table-frame` に入り、枠に `data-fade` がある。表の行の `data-line-start` が変わらない
      - name: test_decorate_markdown_when_pin
        case: 正常
        summary: 固定のボタンで押した列までを固定し、もう一度押すと外す
        condition: '4 列の表。`parametrize`: `display.pin` が真で 2 列目のボタンを押す / 同じボタンを 2 回押す / `display.pin` が偽'
        mock: なし（DOM を作って見る）
        expected: ボタンは 3 つ（最後の列に無い）、2 列目のボタンが `aria-pressed="true"` で 1・2 列目のセルが固定の印を持つ / どのセルも固定の印を持たず、ボタンが `aria-pressed="false"` / ボタンが無い
      - name: test_decorate_markdown_when_stripes_and_head
        case: 正常
        summary: しま模様と見出しの固定を設定のとおりに付ける
        condition: '`parametrize`: `BODY_VIEW_DEFAULT` / `stripes` が真で `head` が偽'
        mock: なし（DOM を作って見る）
        expected: 表が `md-head-stick` を持ち `md-stripes` を持たない / `md-stripes` を持ち `md-head-stick` を持たない
      - name: test_decorate_markdown_when_fold
        case: 正常
        summary: 上位 2 つの階層の見出しにだけ開閉を置き、畳むと次の同じか上の階層の見出しまでを隠す
        condition: 'h2「候補」（下に h3「料金」と h4「内訳」）・h2「まとめ」・中身の無い h2「付録」を持つ本文。`parametrize`: 「料金」の矢印を押す / `fold` が偽 / `display.fold` が偽'
        mock: なし（DOM を作って見る）
        expected: 矢印は「候補」「料金」「まとめ」の 3 つで「内訳」「付録」には無い。押すと「料金」の矢印が `aria-expanded="false"` で「内訳」を含む入れ物が `hidden="until-found"`、「まとめ」は見えている / 矢印が無い / 矢印が無い
      - name: test_decorate_markdown_when_code_and_callout
        case: 正常
        summary: コードブロックに札とコピーを、Alert の引用に囲みを付ける
        condition: 言語 `bash` のコードブロック・言語の無いコードブロック・`> [!WARNING]` の引用・印の無い引用を持つ本文。`bash` のコピーを押す
        mock: '`navigator.clipboard.writeText`'
        expected: '`bash` だけ言語の札「bash」を持ち、どちらもコピーのボタンを `pre` の外に持つ。クリップボードにはコードの文字だけが入る。`[!WARNING]` の引用が `md-callout` で見出し「警告」を持ち `[!WARNING]` の文字が消える。印の無い引用は変わらない'
functions:
  - name: filterRows
    title: 行の絞り込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 列ごとの条件に合う行を返す（列の中はどれかに当たればよく、列の間は全てに当たる）。`~{列}` のキーは文字の条件で、その列の値のどれかが文字を含む行に当てる（大文字・小文字を区別しない）。知らない列の条件は無視する
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: '{key, get}[]'
        required: true
        passing: keyword
        description: 条件の定義（表の列か、ネットワークの `graphConditions`）
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: 絞り込み
    returns:
      type: object[]
      description: 合う行（元の順）。値が配列の列は、要素のどれかが条件にあれば合う
    unit_tests:
      - name: test_filter_rows
        case: 正常
        summary: 列の中はどれか、列の間は全て
        condition: '`parametrize`: 状態 = 要見直し・保留 / 状態 = 未決定 かつ 着手可否 = 着手可能 / タグ（配列）= a / 条件なし'
        mock: なし
        expected: それぞれの条件に合う行だけが元の順で残る
      - name: test_filter_rows_text
        case: 正常
        summary: 文字の条件は含む一致で、値の条件と重ねられる
        condition: '`parametrize`: `{"~title": ["シナリオ"]}` / `{"~id": ["g-1"]}`（G-1・G-12・G-2 の行） / `{"~title": ["移し"], "tags": ["a"]}` / `{"~nope": ["x"]}`'
        mock: なし
        expected: タイトルに「シナリオ」を含む行 / G-1・G-12 / 両方に合う行 / 全ての行
  - name: sortRows
    title: 行の並べ替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 列の値で行を並べ替える（元の配列は変えない）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義（`order` を持つ列はその並びの順）
      - name: sort
        type: '{key, dir} | null'
        required: true
        passing: keyword
        description: 並べ替え。`null` なら元の順
    returns:
      type: object[]
      description: 並べ替えた行。数値は数の順、文字は `localeCompare(…, "ja")`、同じ値は元の順
    unit_tests:
      - name: test_sort_rows
        case: 正常
        summary: 昇順・降順・解除
        condition: '`parametrize`: タイトルで asc / 状態（`order` あり）で desc / `null`'
        mock: なし
        expected: あいうえお順 / `order` の逆順 / 元の順で、渡した配列が変わらない
  - name: filterCounts
    title: 絞り込みの値ごとの件数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 絞り込みのドロワーに出す、条件の値ごとの件数を返す（その条件以外の条件で絞った行で数える）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: 絞り込み
      - name: key
        type: string
        required: true
        passing: keyword
        description: 数える列
    returns:
      type: '{value, count}[]'
      description: 値ごとの件数（`order` を持つ列はその順、それ以外は値の順）
    unit_tests:
      - name: test_filter_counts
        case: 正常
        summary: ほかの列の条件だけを当てて数える
        condition: 状態とカテゴリーの列。状態 = 未決定、カテゴリー = A で絞っているときの状態の列
        mock: なし
        expected: カテゴリー A の行の状態ごとの件数（状態の条件は当てない）
  - name: boardColumns
    title: ボードの列
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/tasks.ts
    usecase: タスクをボードで見る
    scope: public
    summary: 状態の並びの順に、状態ごとの項目を返す（検討事項・資料のボードも使う）
    args:
      - name: items
        type: object[]
        required: true
        passing: keyword
        description: 項目
      - name: statuses
        type: string[]
        required: true
        passing: keyword
        description: 列にする状態の並び（スキーマの列挙の順。タスクは完了・中止も含む）
      - name: statusFilter
        type: string[]
        required: false
        passing: keyword
        description: 状態の条件で選んだ値（空なら状態で絞っていない）
    returns:
      type: '{status, items, excluded}[]'
      description: 状態ごとの項目（項目が 0 件の列も返す。列の中は連番の順）。`excluded` は状態の条件で外した列（`statusFilter` が空でなく、その状態を含まない）か
    unit_tests:

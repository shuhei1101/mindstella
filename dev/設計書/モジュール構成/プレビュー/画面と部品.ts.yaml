    usecase: 項目を検索する
    kind: 画面
    summary: 画面設計『全体の検索』を `dialog` 要素で描く。結果は `searchItems` で、`exact` が真の項目を見出し「完全に一致」の下に、残りを種類ごとの見出しの下に並べる。ID は折り返さない
    props:

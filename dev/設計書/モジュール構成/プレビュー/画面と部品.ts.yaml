    kind: 関数
    scope: public
    summary: '1 コマ分の玉と線を、`look` の見た目で地・線・注目の線を流れる光・星の順に描く（名前・状態の印・鍵・コメントの印は描かない）。見た目ごとの中身は Issue #28 の表と合意済みのモック（`dev/mock/refs/123/assets/stella.js`）。`glow` は今の円に光のにじみを足し、芯は円を塗る。`starlight` は夜に白い芯・色のにじみ・つながりの多い星の光条、昼に 4 方向にとがった星形。`constellation` は回転に合わせて回る天球の経線 12 本・緯線 5 本、星の手前で切った線、選んだ星の照準の輪（目盛りがゆっくり回る）。`deep` は回転に合わせて流れる遠い星・天の川・星雲（`deepSky`）と寄ると視差で動く塵、光のにじむ星と光条、注目の線を尾を引いて流れる彗星と選んだ星から広がる輪、昼は夜明けの空と光沢のある玉。`dust` は無彩色の細かな点と細い線で、注目の起点とつながる星にだけ種類の色を灯す。星のまたたき（周期 1,900ms）と広がる輪（周期 3,600ms）は `now` で自動で動かす。`frame.reducedMotion` が真のときは、`now` で自分で動くもの（星のまたたき・広がる輪・注目の線を流れる光と彗星・照準の目盛りの回転）を止め、星はまたたきの中ほどの明るさで、輪は描かず、注目の線は流れる光の代わりに強調した線で描く。PoC の判定どおり、`starlight`・`deep` の線は両端の色の `midColor` の単色で 1 本ずつ引き、1 本のパスに線分を 2 本以上入れない。`glow` 以外の星のにじみ・芯・光条は `bakeGlow`・`bakeRay` の絵を置くだけにし、毎コマ作るグラデーションは `deep` と `dust` の地の 1 枚だけにする'
    args:
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        passing: keyword
        description: 当てる見た目
      - name: frame
        type: LookFrame（{context, width, height, dark, colors, now, stars, links, focusLinks, focusId, near, rotate, project, spread, reducedMotion}）
        required: true
        passing: keyword
        description: '1 コマ分の描く材料。`stars` は手前の玉ほど後ろに並べた玉（`{id, kind, degree, x, y, radius, alpha, color, selected, hover, strong, seed}`。`dust` は描いた点の半径を `radius` に書き戻し、名前・鍵をその大きさに合わせて置かせる）、`links` は描く線（`{from, to, type, fromColor, toColor, alpha}`）、`focusLinks` は注目の起点につながる線、`near` は起点とつながる玉の ID、`rotate`・`project` は視点の回転と透視、`spread` は群れのおおよその半径（近い順に 9 割目の玉まで）。`colors` は `tokens.css` から読んだ線・選択の輪・流れる玉の色。`reducedMotion` は `prefers-reduced-motion: reduce` が効いているか'
    returns:
      type: void
      description: なし
    unit_tests:
      - name: test_draw_look_when_reduced_motion
        case: 正常
        summary: 動きを減らす設定では、時刻が進んでも同じ絵を描く
        condition: '`parametrize`: 5 つの見た目。注目の起点と、それにつながる線を 1 本持つ同じ `frame` を、`reducedMotion: true` で `now` を 0・950・1,800ms に変えて 3 回描く。比べに `reducedMotion: false` で同じく 3 回描く'
        mock: なし（キャンバスに描いて画素を読む）
        expected: '`reducedMotion: true` の 3 枚は画素が全て同じ。`reducedMotion: false` の 3 枚は、どの見た目でも 1 枚以上が違う'

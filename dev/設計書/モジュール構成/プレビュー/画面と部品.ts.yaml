        required: true
        description: 一覧を開いている間に消したコメント（元の場所に「元に戻す」を出す）
      - name: checked
        type: Set<string>
        required: true
        description: チェックしたコメントの ID
      - name: editing
        type: string | null
        required: true
        description: 本文を直しているコメントの ID
      - name: stale
        type: Map<string, string>
        required: true
        description: 箇所が合わないコメントの ID → 理由
      - name: result
        type: "{kind: 'sending' | 'sent' | 'failed' | 'stale', count?, at?, detail?} | null"
        required: true
        description: まとめて送った結果（送った結果の文言は画面設計どおり）
      - name: selected
        type: string | null
        required: true
        description: 行から開いて詳細パネルに出しているコメントの ID（選んだ見た目にする）
      - name: titleOf
        type: '(id: string) => string | null'
        required: true
        description: 項目のタイトル（記録から消えていれば `null`。押せない ID だけを出し、箇所を外すを出さない）
      - name: free
        type: SendFormProps
        required: true
        description: 下端の項目を指さない入力の引数
      - name: on
        type: '{close, check, checkAll, send, open, edit, saveEdit, cancelEdit, remove, restore, unloc}'
        required: true
        description: 閉じる・チェック・すべて選ぶ・まとめて送る・行の項目を開く・直す・直しを送る・やめる・削除・元に戻す・箇所を外す
    unit_tests:
      - name: test_comments_panel
        case: 正常
        summary: 送る帯と行を描く
        condition: C-1（D-1）・C-2（消えた D-9、箇所が合わない）・C-3（項目を指さない）、C-1・C-3 をチェック、削除した C-4
        mock: なし（DOM を作って見る）
        expected: 「2 / 3 件」と「まとめて送る（2 件）」、すべて選ぶが `indeterminate`。C-2 の行に理由（`role="alert"`）があり「箇所を外す」が無い。C-3 の向けた項目が「項目を指さない」。C-4 の場所に「元に戻す」
      - name: test_comments_panel_when_empty
        case: 正常
        summary: 0 件は空の状態と入力だけ
        condition: '`items`・`removed` が空'
        mock: なし
        expected: 「レビュー中のコメントはありません。」と下端の入力があり、送る帯が無い
      - name: test_comments_panel_when_send_disabled
        case: 正常
        summary: チェック 0 件と送っている間は送れない
        condition: '`parametrize`: チェックが 0 件 / `result.kind` が `sending`'
        mock: '`on.send`'
        expected: まとめて送るが `disabled` で、押しても `on.send` が呼ばれない。前者は「送るコメントにチェックを付けてください。」
  - name: diffMark

title: "プレビュー / 画面と部品"
lead: 部品（表・トップバー・表示形式の切り替え）と画面。どれも「引数を受けて要素を返す関数」で、操作は引数のコールバックで入口に知らせる。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/preview/
    components/
      view-switch.ts        表示形式の切り替え（部品設計『表示形式の切り替え』）
      topbar.ts             トップバー（部品設計『トップバー』）
      diff-mark.ts          差分の印（部品設計『差分の印』）
      comment-mark.ts       コメントの印と、画面を描き直さずに印を差し替える処理（部品設計『コメントの印』）
      history-dialog.ts     変更履歴（部品設計『変更履歴』）
      table.ts              表と、並べ替え・絞り込みの計算（部品設計『表』）
      filter-drawer.ts      絞り込みのドロワー（部品設計『絞り込み』）
      send-form.ts          コメントの入力（部品設計『コメントの入力』）
      selection-comment.ts  選んだ箇所のコメントの入口（部品設計『選んだ箇所のコメントの入口』）
      settings-panel.ts     表示の設定の中身（部品設計『表示の設定』）
      settings-confirm.ts   既定の保存の確かめ（部品設計『既定の保存の確かめ』）
    screens/
      overview.ts         概要
      decisions.ts        検討事項（ボード・マップ・表）
      tasks.ts            タスク（ボード・表）
      docs.ts             資料（カード・ボード・表）
      records.ts          調査・用語集・メモ・会話ログ（表）
      detail.ts           詳細パネルと詳細の全画面
      comments.ts         コメントの一覧（左から出すパネル）
      settings.ts         表示の設定（左から出すパネル）と既定の保存の確かめ・既定が変わった知らせ
      search.ts           全体の検索
      diagram-viewer.ts   図の拡大
    graph/
      looks.ts            ネットワークの 5 つの見た目の描き方と、一度だけ焼く絵（光の玉・光条・深宇宙の空）
      graph.ts            ネットワーク（3D）。玉と線の配置・視点・押下とロック・名前と印の重ね描き
  ```

  `.ts` の書き方と生成した `.js` の扱いは、モジュール構成『基盤』のディレクトリ構成と同じ。
components:
  - name: viewSwitch
    title: 表示形式の切り替え
    container: plugins/mindstella/skills/mindmap/preview/components/view-switch.ts
    usecase: 共通
    kind: コンポーネント
    summary: 部品設計『表示形式の切り替え』の引数を受け、切り替えを `onChange(key)` で知らせる
    props:
      - name: views
        type: '{key, label}[]'
        required: true
        description: 並べる表示形式
      - name: current
        type: string
        required: true
        description: 選んでいる表示形式
      - name: onChange
        type: '(key: string) => void'
        required: true
        description: 切り替えのイベント
  - name: topbar
    title: トップバー
    container: plugins/mindstella/skills/mindmap/preview/components/topbar.ts
    usecase: 共通
    kind: コンポーネント
    summary: 部品設計『トップバー』の引数を受け、画面を移る・検索を開く・テーマの切り替えをコールバックで知らせる。検索の入口は `aria-keyshortcuts="Control+K Meta+K"` を持ち、右端の `kbd` にキーの案内（`navigator.platform` が Mac・iPhone・iPad なら `⌘K`、それ以外は `Ctrl+K`）を出す
    props:
      - name: title
        type: string
        required: true
        description: 題名
      - name: tabs
        type: '{key, label, icon, count?, marked?}[]'
        required: true
        description: タブ
      - name: current
        type: string
        required: true
        description: 開いている画面
      - name: theme
        type: "'light' | 'dark'"
        required: true
        description: 今のテーマ。切り替えのボタンはトップバーの右端に置く
      - name: onNavigate
        type: '(key: string) => void'
        required: true
        description: 画面を移る
      - name: onSearch
        type: () => void
        required: true
        description: 検索を開く
      - name: onTheme
        type: (theme) => void
        required: true
        description: テーマの切り替え
      - name: connection
        type: "'online' | 'offline'"
        required: false
        default: "'online'"
        description: サーバーにつながっているか。`offline` のとき接続の状態を出す
      - name: readAt
        type: string | null
        required: false
        default: 'null'
        description: 描いている記録を読んだ日時（`built_at`）。接続の状態に JST で添える（`formatJst`）
      - name: diffPoint
        type: '{name, sub} | null'
        required: false
        default: 'null'
        description: 選んだ時点。あるとき「変更履歴」の右に札と × を出す（部品設計『トップバー』の `diffPoint`）。`tabs[].marked` でタブに点を重ねる
      - name: onHistory
        type: () => void
        required: false
        default: なし（「変更履歴」を出さない）
        description: 変更履歴を開く
      - name: onDiffOff
        type: () => void
        required: false
        default: なし
        description: 札の × で差分の表示をやめる
      - name: comments
        type: boolean
        required: false
        default: 'false'
        description: コメントのボタンを置くか（配る書き出しでは false。置かないときは検索の入口も今の位置のまま）。置くときはテーマの切り替えの左。件数は `commentCount`（99 を超えたら `99+`、読み上げの名前には実際の件数）、一覧を開いているかは `commentsOpen`、押したときは `onComments`
      - name: settingsOpen
        type: boolean
        required: false
        default: 'false'
        description: 表示の設定のパネルを開いているか（部品設計『トップバー』の `settings_open`）
      - name: onSettings
        type: () => void
        required: false
        default: なし（表示の設定のボタンを出さない）
        description: 表示の設定のボタンを押したとき。絞り込みのボタンがあればその左、無ければコメントのボタンの左に置く。配る書き出しでも渡す。`tabs` には使う側が表示する種類だけを渡す
      - name: filter
        type: boolean
        required: false
        default: 'false'
        description: 絞り込みのボタンを置くか（概要では false）。置くときはコメントのボタンの左（無ければテーマの切り替えの左）。値を 1 つ以上選んでいる条件の数は `filterCount`（0 ならバッジを出さない）、ドロワーを開いているかは `filterOpen`、押したときは `onFilter`
  - name: table
    title: 表
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    kind: コンポーネント
    summary: 部品設計『表』の引数を受け、並べ替え・チップでの条件の解除・ピン留め・表示する列・初期設定に戻す・詳細を開くをコールバックで知らせる。表の上の条件のチップの行は `filterChips` で描く。列の見出しに絞り込みのボタンとポップオーバーを置かない。行の絞り込みと並べ替えは `filterRows`・`sortRows`
    description: 描き直す前に表の入れ物の `scrollLeft`・`scrollTop` を控え、描いた後に戻す。
    props:
      - name: kind
        type: string
        required: true
        description: 項目の種類
      - name: columns
        type: Column[]
        required: true
        description: 列の定義（`key`・`label`・`filterable`・`fixed`・`hidden`・値を取る `get`・セルを描く `cell`）
      - name: rows
        type: object[]
        required: true
        description: 行にする項目
      - name: sort
        type: '{key, dir} | null'
        required: false
        default: 'null'
        description: 並べ替え
      - name: filters
        type: Record<string, string[]>
        required: false
        default: '{}'
        description: 絞り込み（画面が絞り込みのドロワーと共有する条件）
      - name: pinTo
        type: string | null
        required: false
        default: 'null'
        description: この列まで固定
      - name: hiddenColumns
        type: string[]
        required: false
        description: 隠している列
      - name: on
        type: '{sort, filter, pin, columns, reset, open}'
        required: true
        description: 部品設計のイベントごとのコールバック
      - name: marks
        type: Record<string, 'new' | 'changed'>
        required: false
        default: '{}'
        description: 項目の ID → 差分の印。当たる行のタイトルの右に `diffMark` を置く（部品設計『表』の `marks`）
      - name: comments
        type: Record<string, number>
        required: false
        default: '{}'
        description: 項目の ID → レビュー中のコメントの件数。行のタイトルの右、`diffMark` の後ろに `data-comment-target` の場所を置き、件数のある行に `commentMark` を入れる（部品設計『表』の `comments`）
  - name: filterChips
    title: 条件のチップの行
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    kind: コンポーネント
    summary: '選んでいる値を 1 つずつ `{列}: {値}` のチップに、文字の条件（`~{列}`）を `{列}に「{文字}」を含む` のチップ（英数字で終わる列名の後は空白を挟む）にし、× と「すべて解除」で条件の解除を知らせる行を返す。表と、表以外の表示形式（マップ・ボード・カード・ネットワーク）のツールバーの下で同じものを使う。条件が無いときは中身の無い行を返す'
    props:
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みのドロワーと共有する条件
      - name: labels
        type: Record<string, string>
        required: true
        description: 条件の `key` → チップに出す列の名前
      - name: onFilter
        type: '(filters: Record<string, string[]>) => void'
        required: true
        description: 解除した後の新しい条件を知らせる（部品設計『表』の `絞り込み` のイベント）。× は押した値を外し、値が残らない条件は `key` ごと消す。「すべて解除」は `{}`。組み立ては `filterChips` が持ち、`table` も同じものを使う
  - name: overviewScreen
    title: 概要
    container: plugins/mindstella/skills/mindmap/preview/screens/overview.ts
    usecase: 概要を見る
    kind: 画面
    summary: 画面設計『概要』のタイルを描く。次の候補・ゴールまでの進捗・カテゴリー別の進捗は埋め込みのデータの `derived` をそのまま並べる（画面で計算しない）。題名の上には `settings.description` があるときだけその 1 行を出す。`derived.goal.has_goal` が偽のときは、ゴールまでの進捗のタイルの見出しを「フェーズ別の進捗」にして「ゴールは決まっていません」と `phase_progress` だけを出し、納品物は出さない（`settings.goal` を読まない）
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, navigate}'
        required: true
        description: 項目を開く・絞った表へ移る（`Route`）
      - name: visibleKinds
        type: Set<string>
        required: true
        description: 表示する種類（`resolveDisplay`）。表示しない種類へ移る「すべて表示」を出さず、検討事項を表示しないときはカテゴリー別の進捗のセルと行の見出しを押せなくする（タイルと中の項目は残す。画面設計『概要』）
    unit_tests:
      - name: test_overview_screen_when_kinds_hidden
        case: 正常
        summary: 表示しない種類へのリンクだけを外し、タイルは残す
        condition: '要見直しの D-1・進行中の T-1・納品物 6 件を持つ索引。`parametrize`: `visibleKinds` が 7 種類 / 検討事項・タスク・資料を除く 4 種類'
        mock: なし（DOM を作って見る）
        expected: どちらも要見直し・進行中のタスク・納品物のタイルと D-1・T-1 の行がある。前者は「すべて表示」と押せるカテゴリー別の進捗のセルがあり、後者は「すべて表示」が無くセルが押せない（数と棒はある）
  - name: decisionsScreen
    title: 検討事項
    container: plugins/mindstella/skills/mindmap/preview/screens/decisions.ts
    usecase: 検討事項をマップで辿る
    kind: 画面
    summary: '画面設計『検討事項』を描く。検討事項を `filters` で絞り（`filterRows`）、ボード・マップ・表に同じ結果を渡す。表示形式の切り替えは `VIEWS_OF` の並び（ボード・マップ・表）で出す。マップは絞った検討事項で作った `buildDecisionTree` の木を `ELK.layout` で配置して SVG にし、幅 900px 以下では字下げの一覧にする。状態の帯は出さない。elkjs が読めないときは `libraryNotice`。条件に合う検討事項が 1 件も無いときは、マップの枠と字下げの一覧に空の旨を出す。ボードは `boardColumns` に状態の条件を渡し、外した列に「状態の条件で外しています。」を出す。マップ・ボードではツールバーの下に `filterChips` を描く。`drawerOpen` のときは `drawerGroups` で組んだ `filterDrawer` を描き、マップではキーワードに一致した件数を値ごとに添える。マップの枠には `enableDragScroll` を `onPress` つきで付ける（押したときの扱いは下のロック）。選んだ項目が変わってその節があるときだけ節を中央へ送り、それ以外（選びを外したときを含む）は描き直す前のスクロールの位置（`mapState.scroll`）へ戻す。マップの枠には `wheel` を `passive: false` で付け、既定の動作を止めて `wheelZoom` の倍率とスクロールの位置を当てる（倍率が `fit` のときは当たっている倍率を起点にし、当てた後は数値にして「全体を表示」の `aria-pressed` を外す）。`applyZoom` は、倍率が数値のとき `sizer` の幅・高さの右と下の余白を、枠の `clientWidth` / `clientHeight` にする（`fit` のときは今の 240px / 160px）。木が枠より小さくても、拡大で `wheelZoom` が返した位置まで送れるようにするため。マップの中間の層の節は、描く要素の class（`n-category` / `n-phase`）にスタイルを当て、カテゴリーは面（`--surface`）と線（`--border`）と太字、フェーズは地（`--bg`）と薄い線（`--border-soft`）と小さい文字にする（今の `style.css` の `.n-cat` / `.n-stage` は描く要素に当たっていない）。ボードの列は最も長い列の高さまで伸ばし（`align-items: stretch`）、列の見出しを `position: sticky` でボードの上に留める（タスク・資料のボードも同じ）。マップの項目の節点の大きさは、コメントの印の有無によらず 268×48 にする。マップの検討事項の節を押したら、`resolvePress` で 2 回押しを読み替えた項目で `on.lock` を呼び、マップの余白を押したら `null` で呼ぶ（`blank` のときは入口が詳細パネルの「閉じる」と同じ処理をする）。`shake` が返ったら `shakeKeyElement` で節の鍵を震わせる。節の 1 行目の右端に鍵の場所を置き、閉じた鍵は `lockedId` の節に、開いた鍵はロックしていないときに `route.id` の節へカーソルを乗せている間だけ出す（CSS の `:hover`）。ロック中は `lockedId` の節を中央へ送る起点にし、`route.id` の節は強調の外でも薄くしない。幅 900px 以下（字下げの一覧）では `on.lock` を呼ばず、鍵を出さない'
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view, clear, filter, closeDrawer, lock}'
        required: true
        description: 項目を開く・表示形式を切り替える・選びを外す（入口が詳細パネルの「閉じる」と同じ処理を渡す）・条件を変える（新しい `filters`。ドロワーと表のチップから）・ドロワーを閉じる・マップの節か余白を押した（押した項目の ID か `null`。入口が `lockTap` で判定し、`LockAction` を返す）
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みの条件（入口の `FilterState` のこの画面の分）
      - name: drawerOpen
        type: boolean
        required: true
        description: 絞り込みのドロワーを開いているか
      - name: comments
        type: Record<string, number>
        required: false
        default: なし（印を出さない）
        description: 項目の ID → レビュー中のコメントの件数（入口の `commentCounts`）。ボードのカード・マップの節点の 2 行目の右端、字下げの一覧の行のタイトルと差分の印の右に `data-comment-target` の場所を置き、表へは `comments` で渡す
      - name: lockedId
        type: string | null
        required: true
        description: 効いているロック（入口の `LockState.map` の検討事項を描いていればその ID、絞り込みで描いていなければ `null`）。マップの節に閉じた鍵を出す
    state:
      - name: keyword
        type: string
        initial: 空
        description: マップのキーワード
      - name: zoom
        type: number
        initial: 全体が収まる倍率
        description: マップの倍率。縮小・拡大のボタンとホイール（`wheelZoom`）で 0.4〜1.5 の数値にし、「全体を表示」で全体が収まる倍率に戻す
      - name: lastPress
        type: '{time, x, y, id} | null'
        initial: 'null'
        description: マップで前に押した時刻・位置・項目（`resolvePress` に渡す）
  - name: tasksScreen
    title: タスク
    container: plugins/mindstella/skills/mindmap/preview/screens/tasks.ts
    usecase: タスクをボードで見る
    kind: 画面
    summary: 画面設計『タスク』を描く。タスクを `filters` で絞り（`filterRows`）、ボードと表に同じ結果を渡す。ボードの列は `boardColumns`（状態の条件を渡し、外した列に「状態の条件で外しています。」を出す）。ボードではツールバーの下に `filterChips` を描く。`drawerOpen` のときは `drawerGroups` で組んだ `filterDrawer` を描く
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view, filter, closeDrawer}'
        required: true
        description: 項目を開く・表示形式を切り替える・条件を変える（新しい `filters`）・ドロワーを閉じる
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みの条件（入口の `FilterState` のこの画面の分）
      - name: drawerOpen
        type: boolean
        required: true
        description: 絞り込みのドロワーを開いているか
      - name: comments
        type: Record<string, number>
        required: false
        default: なし（印を出さない）
        description: 項目の ID → レビュー中のコメントの件数（入口の `commentCounts`）。ボードのカードのメタ情報の並びの右端に `data-comment-target` の場所を置き、表へは `comments` で渡す
  - name: docsScreen
    title: 資料
    container: plugins/mindstella/skills/mindmap/preview/screens/docs.ts
    usecase: 資料を読む
    kind: 画面
    summary: 画面設計『資料』を描く。資料を `filters` で絞り（`filterRows`）、カード・ボード・表に同じ結果を渡す。カードの並びは `orderDocs`。ボードは絞った資料を `boardColumns`（`DOC_STATUSES` と状態の条件）で列に分け、列ごとに `orderDocs` で並べ直して `board` に渡す。ボードのカードは資料のカードから状態の印を外したもの。ツールバーに絞り込みのボタンとポップオーバーを置かない。カード・ボードではツールバーの下に `filterChips` を描く。`drawerOpen` のときは `drawerGroups` で組んだ `filterDrawer` を描く
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view, filter, closeDrawer}'
        required: true
        description: 項目を開く・表示形式を切り替える・条件を変える（新しい `filters`）・ドロワーを閉じる
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みの条件（入口の `FilterState` のこの画面の分）
      - name: drawerOpen
        type: boolean
        required: true
        description: 絞り込みのドロワーを開いているか
      - name: comments

    kind: コンポーネント
    container: plugins/mindstella/skills/mindmap/preview/components/settings-panel.ts
    usecase: 表示の設定を変える
    summary: 部品設計『表示の設定』の引数を受け、表示する種類を変える・差分のミニマップを切り替える・本文の見せ方を切り替える・既定に戻す・ワークスペースの既定にする・閉じるをコールバックで知らせる。見た目は選ばせず、`look`・`defaultLook` は「ワークスペースの既定にする」を出すかの比較にだけ使う（`minimap` は比べに含めない）。「すべて」は `toggleAllBox` と同じく途中の印を持つ。表示する種類の下に `fieldset`（凡例「詳細に表示するもの」）を置き、`MINIMAP_LABEL` のチェックボックスと、`BODY_VIEW_LABELS` の `pin`・`head`・`stripes`・`fold` のチェックボックスをこの順に 1 行ずつ出す（`bodyView` は比べに含めない）。描き直しても操作していた部品にフォーカスを戻す
    props:

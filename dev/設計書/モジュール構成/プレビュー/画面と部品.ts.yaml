    props:
      - name: durationMs
        type: number
        required: true
        description: 出しておく長さ（`NOTICE_MS`）
functions:
  - name: filterRows
    title: 行の絞り込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 列ごとの条件に合う行を返す（列の中はどれかに当たればよく、列の間は全てに当たる）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: 絞り込み
    returns:
      type: object[]
      description: 合う行（元の順）。値が配列の列は、要素のどれかが条件にあれば合う
    unit_tests:
      - name: test_filter_rows
        case: 正常
        summary: 列の中はどれか、列の間は全て
        condition: '`parametrize`: 状態 = 要見直し・保留 / 状態 = 未決定 かつ 着手可否 = 着手可能 / タグ（配列）= a / 条件なし'
        mock: なし
        expected: それぞれの条件に合う行だけが元の順で残る
  - name: sortRows
    title: 行の並べ替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 列の値で行を並べ替える（元の配列は変えない）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義（`order` を持つ列はその並びの順）
      - name: sort
        type: '{key, dir} | null'
        required: true
        passing: keyword
        description: 並べ替え。`null` なら元の順
    returns:
      type: object[]
      description: 並べ替えた行。数値は数の順、文字は `localeCompare(…, "ja")`、同じ値は元の順
    unit_tests:
      - name: test_sort_rows
        case: 正常
        summary: 昇順・降順・解除
        condition: '`parametrize`: タイトルで asc / 状態（`order` あり）で desc / `null`'
        mock: なし
        expected: あいうえお順 / `order` の逆順 / 元の順で、渡した配列が変わらない
  - name: filterCounts
    title: 絞り込みの値ごとの件数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    scope: public
    summary: 絞り込みのポップオーバーに出す、列の値ごとの件数を返す（その列以外の条件で絞った行で数える）
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: 行
      - name: columns
        type: Column[]
        required: true
        passing: keyword
        description: 列の定義
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: 絞り込み
      - name: key
        type: string
        required: true
        passing: keyword
        description: 数える列
    returns:
      type: '{value, count}[]'
      description: 値ごとの件数（`order` を持つ列はその順、それ以外は値の順）
    unit_tests:
      - name: test_filter_counts
        case: 正常
        summary: ほかの列の条件だけを当てて数える
        condition: 状態とカテゴリーの列。状態 = 未決定、カテゴリー = A で絞っているときの状態の列
        mock: なし
        expected: カテゴリー A の行の状態ごとの件数（状態の条件は当てない）
  - name: boardColumns
    title: ボードの列
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/tasks.ts
    usecase: タスクをボードで見る
    scope: public
    summary: 状態の並びの順に、状態ごとの項目を返す（検討事項・資料のボードも使う）
    args:
      - name: items
        type: object[]
        required: true
        passing: keyword
        description: 項目
      - name: statuses
        type: string[]
        required: true
        passing: keyword
        description: 列にする状態の並び（スキーマの列挙の順。タスクは完了・中止も含む）
    returns:
      type: '{status, items}[]'
      description: 状態ごとの項目（項目が 0 件の列も返す。列の中は連番の順）
    unit_tests:
      - name: test_board_columns
        case: 正常
        summary: 状態の並びの順に分ける
        condition: 未着手の T-2・T-1、完了の T-3
        mock: なし
        expected: 未着手の列が T-1・T-2、進行中・保留・中止が空、完了が T-3
  - name: orderDocs
    title: 資料の並び
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/docs.ts
    usecase: 資料を読む
    scope: public
    summary: 納品物を先頭に、それぞれ連番の順に並べた資料を返す
    args:
      - name: docs
        type: object[]
        required: true
        passing: positional
        description: 資料
    returns:
      type: object[]
      description: 並べた資料
    unit_tests:
      - name: test_order_docs
        case: 正常
        summary: 納品物が先
        condition: A-1（納品物でない）・A-3（納品物）・A-2（納品物）
        mock: なし
        expected: A-2・A-3・A-1
  - name: buildDecisionTree
    title: 検討事項の木
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/screens/decisions.ts
    usecase: 検討事項をマップで辿る
    scope: public
    summary: 対象 → カテゴリー → フェーズ → 検討事項の木を、表示する状態で絞って返す（ELK に渡す節と枝の形）
    args:
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
      - name: shownStatuses
        type: Set<string>
        required: true
        passing: keyword
        description: 表示する状態
    returns:
      type: '{children, edges}'
      description: ELK のグラフ。検討事項が 1 つも残らない枝（カテゴリー・フェーズ）は含めない。対象・カテゴリー・フェーズの節の ID は項目の ID と重ならない形（`target:{名前}` など）
    unit_tests:
      - name: test_build_decision_tree
        case: 正常
        summary: 非表示の状態だけの枝を落とす
        condition: カテゴリー A に未決定の D-1、カテゴリー B に決定済みの D-2 だけ。表示する状態は未決定だけ
        mock: なし
        expected: 節に D-1 とその対象・カテゴリー A・フェーズがあり、D-2 とカテゴリー B が無い
  - name: buildGraph
    title: つながりの玉と線
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: つながりを辿る
    scope: public
    summary: 表示する種類の項目を玉に、関連（依存・関連・根拠・進めるタスク）を線にして返す
    args:
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
      - name: shownKinds
        type: Set<string>
        required: true
        passing: keyword
        description: 表示する種類
    returns:
      type: '{nodes: {id, kind}[], links: {source, target, type}[]}'
      description: '`type` は `depends`・`related`・`source`・`for`。両端のどちらかが非表示か記録に無い線は含めない'
    unit_tests:
      - name: test_build_graph
        case: 正常
        summary: 線の種類を分け、非表示の種類の線を落とす
        condition: 'D-2（`depends_on: [D-1]`、`sources: [R-1]`）・T-1（`for: [D-1]`）・N-1（`related: [D-1]`）。表示する種類からメモを外す'
        mock: なし
        expected: 線が `depends`（D-2→D-1）・`source`（D-2→R-1）・`for`（T-1→D-1）の 3 本で、N-1 とその線が無い
  - name: formatJst
    title: 日時の表示
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/send-form.ts
    usecase: 回答・意見を送る
    scope: public
    summary: UTC のタイムゾーン付き ISO 8601 を JST の `MM/DD HH:mm` にする（送信の結果と接続の状態が使う）
    args:
      - name: iso
        type: string
        required: true
        passing: positional
        description: 日時
    returns:
      type: string
      description: JST の `MM/DD HH:mm`
    process: "1. `Intl.DateTimeFormat` に `timeZone: 'Asia/Tokyo'` を渡して月・日・時・分を 2 桁で並べる"
    unit_tests:
      - name: test_format_jst
        case: 正常
        summary: UTC を JST にする
        condition: '`parametrize`: `2026-10-04T02:23:00+00:00` / `2026-10-04T16:05:00+00:00`'
        mock: なし
        expected: '`10/04 11:23` / `10/05 01:05`'

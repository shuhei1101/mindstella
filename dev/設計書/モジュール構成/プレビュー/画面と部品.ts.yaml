  - name: splitPostBody
    title: 本文の切り分け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/components/thread-post.ts
    usecase: スレッドで話す
    scope: public
    summary: 書き込みの本文を、文字の部分・記録にある項目の ID の部分・記録にあるまとまりを指すまとまりのリンクの部分に切り分ける
    args:
      - name: body
        type: string
        required: true
        passing: positional
        description: 本文
      - name: titles
        type: '(id: string) => string | null'
        required: true
        passing: positional
        description: 項目のタイトル（記録に無ければ `null`）
      - name: changeSets
        type: '(id: string) => string | null'
        required: false
        default: () => null
        passing: positional
        description: まとまりの説明（記録に無いまとまりの ID と `since`・`pending`・空の値は `null`）
    returns:
      type: '({text: string} | {id: string, title: string} | {set: string, label: string, summary: string})[]'
      description: 本文の順の部分。`set` はまとまりの ID、`label` は `[文言](#...)` の文言。まとまりのリンクの部分を `[{label}](#...)` に戻してつなぐと元の本文になる
    process: |-
      1. `\[([^\]\n]+)\]\(#([^)\s]*)\)` に合う文字列を順に見る。`#` の後ろを `URLSearchParams` で読んだ `diff` の値を `changeSets` で引き、`null` でなければ `{set: 値, label: 文言, summary}` にする（文言の中の項目の ID は切り出さない。`diff` 以外の引数は見ない）
      2. まとまりのリンクにしなかった文字（まとまりのリンクにならない `[文言](...)` を含む）は、`\b[A-Z]{1,2}-\d+\b` に合う文字列のうち `titles` が `null` でないものだけを `{id, title}` にし、その前後の文字を `{text}` にする（記録に無い ID とスレッドの ID `TH-1` は文字のまま）
    unit_tests:
      - name: test_split_post_body
        case: 正常
        summary: 記録にある ID だけを切り出す
        condition: '`parametrize`: `D-12 を案 B に。T-14 も` / `D-99 は無い` / `TH-1 と AD-12 と D-12x` / 空文字。`titles` は D-12・T-14 だけ'
        mock: なし
        expected: "`[{id: D-12}, {text}, {id: T-14}, {text}]` / `[{text}]` / `[{text}]` / `[{text: ''}]`。どれもつなぐと元の本文"
      - name: test_split_post_body_when_change_set_link
        case: 正常
        summary: 記録にあるまとまりを指すリンクだけを切り出し、文言の中の ID は切り出さない
        condition: 本文 `[D-1 を直した](#diff=V-1)。[無い](#diff=V-99)・[前回](#diff=since)・[未](#diff=pending)・[空](#diff=)・[見出し](#決め方)・[外](https://example.com)・[他](#tab=tasks&id=D-2&diff=V-2)・D-2`。`titles` は D-1・D-2、`changeSets` は V-1・V-2 だけ
        mock: なし
        expected: "順に `{set: 'V-1', label: 'D-1 を直した'}`・`{text: '。[無い](#diff=V-99)・[前回](#diff=since)・[未](#diff=pending)・[空](#diff=)・[見出し](#決め方)・[外](https://example.com)・'}`・`{set: 'V-2', label: '他'}`・`{text: '・'}`・`{id: 'D-2'}`。まとまりのリンクの部分の `summary` は `changeSets` の説明"

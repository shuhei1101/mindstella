  - name: detailPanel
    title: 詳細パネル
    container: plugins/mindstella/skills/mindmap/preview/screens/detail.ts
    usecase: 項目の詳細を読む
    kind: 画面
    summary: '画面設計『詳細パネル』『詳細の全画面』を描く。本文は `renderMarkdown`・`renderDiagrams`（見出しを段下げするときは `data-line-start` を引き継ぐ）で描いた後、`linkHeadings`（`on.heading`）と `linkBody`（`on.open`）を当てる。用語の印に乗せる・フォーカスすると、使い回す 1 つのツールチップ（`role="tooltip"`・`popover="manual"`）を印の下（収まらなければ上）に出し、用語・ID・意味を入れる。印から外れて 150 ミリ秒たつと隠し（その間にツールチップへ乗せれば隠さない）、Esc でも隠す。`heading` があれば、描いた後にその見出しを本文のスクロール領域の中で画面に入れる。関係する項目は `relatedItems`。案・タイトルなどの値を描いた要素にキーのパスを `data-key` で持たせる。`full` が真なら中央のモーダル（窓から 32px 内側、幅 720px 以下は 8px、幅の上限 1600px、本文は幅いっぱい、モーダルの中のスクロールを後ろへ伝えない `overscroll-behavior: contain`）で出し、図の拡大は中身を切り替える。全画面表示のボタンは、`full` の間は縮小のアイコンと読み上げ名「元の大きさに戻す」にし、色は変えず `aria-pressed` を持たない。`comment` があれば下端に `sendForm` を留め、関係する項目の後にその項目へのレビュー中のコメントを並べ、見出しと下端の間だけをスクロールする。スクロールする本文の領域（`.panel-body`）は `tabindex="0"`・`role="region"`・`aria-label="詳細の本文"` を持ち、キーボードで届く。`highlight` があればその箇所の要素までスクロールして印の色の地で示す'
    props:
      - name: id
        type: string
        required: true
        description: 項目の ID
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: full
        type: boolean
        required: true
        description: 全画面か
      - name: on
        type: '{open, close, full, back, forward, diagram, heading}'
        required: true
        description: 項目へ移る（関係する項目・本文の用語の印・項目の ID のリンク。履歴に積む）・閉じる・全画面の切り替え・戻る進む・図を拡大する・本文の見出しへ移る（見出しの名前。使う側がハッシュの `h` を履歴に積まずに置き換える）
      - name: comment
        type: "{form: SendFormProps, reviews: ReviewState['items']} | null"
        required: true
        description: 下端に置くコメントの入力の引数と、その項目へのレビュー中のコメント。配る書き出しでは `null`（どちらも置かず、選んだ箇所の入口も出さない）
      - name: highlight
        type: Location | null
        required: false
        default: 'null'
        description: コメントの一覧から開いたときに示す箇所。本文は `start` の行を含む `data-line-start` のブロック、値は `data-key` が `key` の要素。見つからなければ示さず、項目の先頭を出す
      - name: diff
        type: DiffPoint | null
        required: false
        default: 'null'
        description: '選んだ時点。あり、項目がその時点で足されたか変わったとき、前後の版を組み立て（`buildVersions`）、画面設計『詳細パネル』の選んだ時点・新規の札・キー・本文（`diffLineParts`）・図（`diffDiagramFromSource` / `diffDiagram`）・Raw の差分と、組み立てられない旨を描く。キーの差分は、ツールが付けるキー（`id`・`created`・`updated`・`updated_by`・`history`・`history_dropped_seq`）と `body` を除いて並べる。本文の差分は、今の本文を `renderMarkdown` で描き（`data-line-start` は今の本文の行のまま）、足した部分の印を今の本文の要素に付ける。消した行のかたまりは `placeRemovedBlocks` のものごとに別に `renderMarkdown` し（`tableHeader` があれば頭に付けて描き、表の本体の行だけを取り出す）、`data-line-start` を外して `beforeLine` の行を持つ今のブロック（表の中はその行）の前へ、`null` なら本文の最後へ差し込む。`highlight` は差分の表示の間も今の本文の `data-line-start` から引く。後の版の本文が今の本文と違うとき（古いまとまりを選び、その後に本文を直した）は、描いた本文の `data-line-start` を全て外し、`highlight` は項目の先頭を示す。本文・図・Raw の差分を描く前に jsdiff を読めたか確かめ（`missingLibraries(["Diff"])`）、読めていなければ本文の頭に `libraryNotice({names: ["jsdiff"], what: "本文と図の差分"})` を出し、本文・図・Raw は今の版を差分なしで描き、図の拡大へは `diff` を `null` で渡す。本文の差分を打ち切ったら「本文の差分を計算しきれない旨」、図を打ち切ったらその図だけ枠に色を付け、図の Raw の差分を打ち切ったらその図の Raw は今の記法を差分なしで出す。図の差分は、今の版の図を `renderDiagrams` で描き（直前の呼び出しで描いた同じ記法の図は描き直さずに写す）、flowchart の図は `diffDiagramFromSource` で前後の記法を解析して突き合わせ、前の版の図を描かない。`diffDiagramFromSource` が `null` を返した図（flowchart でない・解析できない）だけ、前の版の図を `renderDiagramSvg` で描いて `diffDiagram` で突き合わせる。'
      - name: heading
        type: string | null
        required: false
        description: 開いたときに本文の中で画面に入れる見出しの名前（`Route.heading`）。本文に無ければ本文の頭で開き、`on.heading` を `null` で呼んでハッシュから `h` を外させる
    unit_tests:
      - name: test_detail_panel_when_diff_highlight
        case: 正常
        summary: 差分の表示の間も、消した部分の後ろの箇所を今の行のブロックで示す
        condition: 前の版の 2、3 行目の段落を消した D-1 を `diff` つきで開き、`highlight` に今の本文の 3 行目（消した部分の後ろの段落）を渡す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 示されたブロックの `data-line-start` が 3 で文字が今の 3 行目。消した部分の要素は `data-line-start` を持たない
      - name: test_detail_panel_when_old_set_after_body_edit
        case: 正常
        summary: 古いまとまりを選び、その後に本文を直した項目では、本文の行の印を外す
        condition: V-1 で本文を直し、V-2 で本文の頭に段落を足して行をずらした D-1 を、V-1 を選んだ `diff` と今の本文の 3 行目の `highlight` つきで開く
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 本文のどの要素も `data-line-start` を持たず、`highlight` は項目の先頭を示す
      - name: test_detail_panel_when_diff_editor_only
        case: 正常
        summary: 編集した人だけが変わったキーは差分に出さない
        condition: 選んだ時点の後に `answer` と `updated_by`（`user` → `ai`）が変わった D-1 を `diff` つきで開く
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 差分の印が `answer` にだけ付き、`updated_by` の前後はどこにも出ない
      - name: test_detail_panel_when_diff_reuses_current_diagram
        case: 正常
        summary: 開いたまま時点を選ぶと、flowchart の図は今の版を描き直さず、前の版も描かずに差分の印を付ける
        condition: 本文に flowchart の図を 1 つ持ち、選んだ時点の後に図のノードの文字を 1 つ変えた D-1 を `diff` なしで開いて描き終えた後、同じ D-1 を `diff` つきで開き直す。`mermaid.render` を数える包みを `page.evaluate` で被せる
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 開き直してからの `mermaid.render` の呼び出しは 0 回。今の版の図の SVG に変わったノードの印（`df-n-chg`）が付く
      - name: test_detail_panel_when_diff_renders_before_sequence
        case: 正常
        summary: flowchart でない図は、前の版の図だけを描いて突き合わせる
        condition: 本文に sequenceDiagram の図を 1 つ持ち、選んだ時点の後にメッセージの文字を 1 つ変えた D-1 を `diff` なしで開いて描き終えた後、同じ D-1 を `diff` つきで開き直す。`mermaid.render` を数える包みを `page.evaluate` で被せる
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 開き直してからの `mermaid.render` の呼び出しは 1 回で、渡した記法は前の版の図。変えたメッセージに変えた印（`df-t-chg`）が付く
      - name: test_detail_panel_when_heading
        case: 正常
        summary: 指した見出しを画面に入れて開く
        condition: '`parametrize`: 本文に見出し「決め方」を 2 つ持つ A-1 を `heading` が `決め方-1` で開く / `heading` が `無い` で開く'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 2 つ目の「決め方」が本文のスクロール領域の中で画面に入る / 本文の頭で開き `on.heading` が `null` で呼ばれる
  - name: searchDialog
    title: 全体の検索

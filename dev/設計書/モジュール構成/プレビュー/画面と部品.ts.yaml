        required: false
        default: 'false'
        description: 保存している途中か
      - name: error
        type: string | null
        required: false
        default: 'null'
        description: 保存できなかった理由（`role="alert"`）
      - name: on
        type: '{save, cancel}'
        required: true
        description: 保存する・取り消す（Esc を含む）
    unit_tests:
      - name: test_settings_confirm
        case: 正常
        summary: 変える項目と変えない項目、保存している間と失敗を描き分ける
        condition: '`parametrize`: `from` が `deep`・7 種類、`to` が `glow`・7 種類 / 同じで `busy: true` / 同じで `error` あり'
        mock: '`on.cancel`'
        expected: 見た目の行に「深宇宙」と「グロウ」、種類の行に「すべて表示」と「変えない」。フォーカスが取り消す / 2 つのボタンが `disabled` で「保存しています」。Esc で `on.cancel` が呼ばれない / `role="alert"` の理由があり、「保存する」が押せる

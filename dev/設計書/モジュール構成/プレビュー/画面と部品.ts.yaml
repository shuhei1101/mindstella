        mock: なし（DOM を作って見る）
        expected: ボタンが `disabled` / 押せる / `disabled` で入力欄が `readonly` / 「レビューに追加しました（レビュー中 3 件）。」/ 「レビューに追加できませんでした。サーバーが止まっています。立ち上げ直してから追加してください。」/ 「レビューに追加できませんでした。{理由}」。どれもラベル「返信」が見え、入力欄が 1 行で、結果の要素が `role="status"` で入力欄の `aria-describedby` が指す
      - name: test_reply_form_when_keys
        case: 正常
        summary: Ctrl+Enter で溜め、空・溜めている間・変換中は溜めず、Esc は外へ伝えない
        condition: '`parametrize`: `body` ありで Ctrl+Enter / 空で Ctrl+Enter / `saving` で Ctrl+Enter / `isComposing` の Ctrl+Enter / Esc'
        mock: '`on.save`、親要素の `keydown` のリスナー'
        expected: '`on.save` がスレッドの ID と中身で 1 回 / 呼ばれない / 呼ばれない / 呼ばれない / 入力欄からフォーカスが外れ、親のリスナーが呼ばれない'
  - name: threadRow
    title: スレッドの行
    container: plugins/mindstella/skills/mindmap/preview/components/thread-row.ts
    usecase: スレッドで話す
    kind: コンポーネント
    summary: 部品設計『スレッドの行』の引数を受け、行を開くボタンとタグのボタンを持つ `li` を返す。題は `threadTitle`、日時は `formatJst`。状態の札（`threadState`）とレビュー中の印（`pendingMark`）もこのファイルが持ち、スレッドの画面とレビュー中の書き込みの行が使う。`data-focus` は行が `thread:{ID}`（まだ送っていないものは `thread:new:{コメントの ID}`）、タグが `tag:{ID}:{タグ}`。`hasUnseen` が真のスレッドは 2 行目の先頭に塗りつぶしの「● 未読」の札を出し、行を開くボタンの読み上げの名前の状態の次に「未読」を読む
    props:
      - name: thread

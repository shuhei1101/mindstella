    usecase: 項目を表で絞り込む
    scope: public
    summary: 端末に残した条件から、今の記録のどの行にも無い値を外す。文字の条件（`~{列}`）はそのまま残し、知らない列の条件は外す
    args:
      - name: rows
        type: object[]
        required: true
        passing: keyword
        description: その画面の今の行
      - name: columns
        type: '{key, get}[]'
        required: true
        passing: keyword
        description: 条件の定義（`filterRows` と同じ。表の列か、ネットワークの `graphConditions`）
      - name: saved

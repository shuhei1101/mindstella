    usecase: 表示の設定を変える
    summary: 部品設計『表示の設定』の引数を受け、見た目を選ぶ・表示する種類を変える・既定に戻す・ワークスペースの既定にする・閉じるをコールバックで知らせる。見た目の名前と短い説明は部品の中の定数に持つ。「すべて」は `toggleAllBox` と同じく途中の印を持つ。描き直しても操作していた部品にフォーカスを戻す
    props:

      - name: hit
        type: (row) => boolean
        required: false
        passing: keyword
        description: キーワードに一致した行か（検討事項のマップだけが渡す）
    returns:
      type: FilterGroup[]
      description: 条件の並び。キーが `kind`・`type`・`status`・`tags` の条件をこの順で先に置き、残りは元の順。値を 1 つも持たない条件は含めない。`FilterGroup` は部品設計『絞り込み』の `groups[]`（`key`・`label`・`values`・`mark`）
    process: |-
      1. 条件ごとに、全ての行が持つ値を集め（配列の値は要素ごと）、`order` を持つ条件はその順、ほかは値の順に並べる
      2. 値ごとの `count` は `filterCounts`（少ない値は 0）、`hit` を渡されたときはその条件以外の条件で絞った行のうちキーワードに一致した件数も数える
      3. `status` の条件に `mark: status`、`type` の条件に `mark: kind` を付ける
    unit_tests:
      - name: test_drawer_groups
        case: 正常
        summary: 種類・状態・タグを先に並べ、件数はその条件以外で絞って数える
        condition: 列の順が 対象・タグ・状態・種類。T-1（作業・未着手・タグ a）・T-2（調査・完了・タグ a・b）。種類 = 作業で絞っている
        mock: なし
        expected: 並びが 種類・状態・タグ・対象。種類は 作業 1・調査 1、状態は 未着手 1・完了 0、タグは a 1・b 0。状態の `mark` が status
      - name: test_drawer_groups_when_no_values
        case: 正常
        summary: 値を持たない条件は含めない
        condition: どの行もタグを持たない
        mock: なし
        expected: タグの条件が無い
      - name: test_drawer_groups_when_hit
        case: 正常
        summary: キーワードに一致した件数を添える
        condition: 状態の条件は `order`（未決定・保留）を持つ。D-1（未決定・一致）・D-2（未決定）・D-3（保留）。`hit` は D-1 だけ真
        mock: なし
        expected: '状態の未決定が `count: 2`・`hit: 1`、保留が `hit: 0`'

title: "プレビュー / 画面と部品"
lead: 部品（表・トップバー・表示形式の切り替え）と画面。どれも「引数を受けて要素を返す関数」で、操作は引数のコールバックで入口に知らせる。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/preview/
    components/
      view-switch.ts        表示形式の切り替え（部品設計『表示形式の切り替え』）
      topbar.ts             トップバー（部品設計『トップバー』）
      diff-mark.ts          差分の印（部品設計『差分の印』）
      history-dialog.ts     変更履歴（部品設計『変更履歴』）
      table.ts              表と、並べ替え・絞り込みの計算（部品設計『表』）
      send-form.ts          コメントの入力（部品設計『コメントの入力』）
      selection-comment.ts  選んだ箇所のコメントの入口（部品設計『選んだ箇所のコメントの入口』）
      settings-panel.ts     表示の設定の中身（部品設計『表示の設定』）
      settings-confirm.ts   既定の保存の確かめ（部品設計『既定の保存の確かめ』）
    screens/
      overview.ts         概要
      decisions.ts        検討事項（マップ・ボード・表）
      tasks.ts            タスク（ボード・表）
      docs.ts             資料（カード・ボード・表）
      records.ts          調査・用語集・メモ・会話ログ（表）
      detail.ts           詳細パネルと詳細の全画面
      comments.ts         コメントの一覧（左から出すパネル）
      settings.ts         表示の設定（左から出すパネル）と既定の保存の確かめ・既定が変わった知らせ
      search.ts           全体の検索
      diagram-viewer.ts   図の拡大
    graph/
      graph.ts            つながり（3D）。見本の作りを関数に分けて整える
  ```

  `.ts` の書き方と生成した `.js` の扱いは、モジュール構成『基盤』のディレクトリ構成と同じ。
components:
  - name: viewSwitch
    title: 表示形式の切り替え
    container: plugins/mindstella/skills/mindmap/preview/components/view-switch.ts
    usecase: 共通
    kind: コンポーネント
    summary: 部品設計『表示形式の切り替え』の引数を受け、切り替えを `onChange(key)` で知らせる
    props:
      - name: views
        type: '{key, label}[]'
        required: true
        description: 並べる表示形式
      - name: current
        type: string
        required: true
        description: 選んでいる表示形式
      - name: onChange
        type: '(key: string) => void'
        required: true
        description: 切り替えのイベント
  - name: topbar
    title: トップバー
    container: plugins/mindstella/skills/mindmap/preview/components/topbar.ts
    usecase: 共通
    kind: コンポーネント
    summary: 部品設計『トップバー』の引数を受け、画面を移る・検索を開く・テーマの切り替えをコールバックで知らせる
    props:
      - name: title
        type: string
        required: true
        description: 題名
      - name: tabs
        type: '{key, label, icon, count?, marked?}[]'
        required: true
        description: タブ
      - name: current
        type: string
        required: true
        description: 開いている画面
      - name: theme
        type: "'light' | 'dark'"
        required: true
        description: 今のテーマ
      - name: onNavigate
        type: '(key: string) => void'
        required: true
        description: 画面を移る
      - name: onSearch
        type: () => void
        required: true
        description: 検索を開く
      - name: onTheme
        type: (theme) => void
        required: true
        description: テーマの切り替え
      - name: connection
        type: "'online' | 'offline'"
        required: false
        default: "'online'"
        description: サーバーにつながっているか。`offline` のとき接続の状態を出す
      - name: readAt
        type: string | null
        required: false
        default: 'null'
        description: 描いている記録を読んだ日時（`built_at`）。接続の状態に JST で添える（`formatJst`）
      - name: diffPoint
        type: '{name, sub} | null'
        required: false
        default: 'null'
        description: 選んだ時点。あるとき「変更履歴」の右に札と × を出す（部品設計『トップバー』の `diffPoint`）。`tabs[].marked` でタブに点を重ねる
      - name: onHistory
        type: () => void
        required: false
        default: なし（「変更履歴」を出さない）
        description: 変更履歴を開く
      - name: onDiffOff
        type: () => void
        required: false
        default: なし
        description: 札の × で差分の表示をやめる
      - name: comments
        type: '{count: number, open: boolean, onToggle: () => void} | null'
        required: false
        default: 'null'
        description: コメントのボタンの件数・一覧を開いているか・押したとき。`null`（配る書き出し）ならボタンを置かず、検索の入口も今の位置のまま。件数は 99 を超えたら `99+`、読み上げの名前には実際の件数
      - name: settings
        type: '{open: boolean, onToggle: () => void}'
        required: false
        default: 'null'
        description: 表示の設定のボタンのパネルを開いているか・押したとき（部品設計『トップバー』の `settings_open`）。コメントのボタンがあればその左に置く。配る書き出しでも渡す。`tabs` には使う側が表示する種類だけを渡す
  - name: table
    title: 表
    container: plugins/mindstella/skills/mindmap/preview/components/table.ts
    usecase: 項目を表で絞り込む
    kind: コンポーネント
    summary: 部品設計『表』の引数を受け、並べ替え・絞り込み・ピン留め・表示する列・初期設定に戻す・詳細を開くをコールバックで知らせる。行の絞り込みと並べ替えは `filterRows`・`sortRows`
    description: 描き直す前に表の入れ物の `scrollLeft`・`scrollTop` を控え、描いた後に戻す。
    props:
      - name: kind
        type: string
        required: true
        description: 項目の種類
      - name: columns
        type: Column[]
        required: true
        description: 列の定義（`key`・`label`・`filterable`・`fixed`・`hidden`・値を取る `get`・セルを描く `cell`）
      - name: rows
        type: object[]
        required: true
        description: 行にする項目
      - name: sort
        type: '{key, dir} | null'
        required: false
        default: 'null'
        description: 並べ替え
      - name: filters
        type: Record<string, string[]>
        required: false
        default: '{}'
        description: 絞り込み
      - name: pinTo
        type: string | null
        required: false
        default: 'null'
        description: この列まで固定
      - name: hiddenColumns
        type: string[]
        required: false
        description: 隠している列
      - name: on
        type: '{sort, filter, pin, columns, reset, open}'
        required: true
        description: 部品設計のイベントごとのコールバック
      - name: marks
        type: Record<string, 'new' | 'changed'>
        required: false
        default: '{}'
        description: 項目の ID → 差分の印。当たる行のタイトルの右に `diffMark` を置く（部品設計『表』の `marks`）
  - name: overviewScreen
    title: 概要
    container: plugins/mindstella/skills/mindmap/preview/screens/overview.ts
    usecase: 概要を見る
    kind: 画面
    summary: 画面設計『概要』のタイルを描く。次の候補・ゴールまでの進捗・カテゴリー別の進捗は埋め込みのデータの `derived` をそのまま並べる（画面で計算しない）。題名の上には `settings.description` があるときだけその 1 行を出す。`derived.goal.has_goal` が偽のときは、ゴールまでの進捗のタイルの見出しを「フェーズ別の進捗」にして「ゴールは決まっていません」と `phase_progress` だけを出し、納品物は出さない（`settings.goal` を読まない）
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, navigate}'
        required: true
        description: 項目を開く・絞った表へ移る（`Route`）
      - name: visibleKinds
        type: Set<string>
        required: true
        description: 表示する種類（`resolveDisplay`）。表示しない種類へ移る「すべて表示」を出さず、検討事項を表示しないときはカテゴリー別の進捗のセルと行の見出しを押せなくする（タイルと中の項目は残す。画面設計『概要』）
    unit_tests:
      - name: test_overview_screen_when_kinds_hidden
        case: 正常
        summary: 表示しない種類へのリンクだけを外し、タイルは残す
        condition: '要見直しの D-1・進行中の T-1・納品物 6 件を持つ索引。`parametrize`: `visibleKinds` が 7 種類 / 検討事項・タスク・資料を除く 4 種類'
        mock: なし（DOM を作って見る）
        expected: どちらも要見直し・進行中のタスク・納品物のタイルと D-1・T-1 の行がある。前者は「すべて表示」と押せるカテゴリー別の進捗のセルがあり、後者は「すべて表示」が無くセルが押せない（数と棒はある）
  - name: decisionsScreen
    title: 検討事項
    container: plugins/mindstella/skills/mindmap/preview/screens/decisions.ts
    usecase: 検討事項をマップで辿る
    kind: 画面
    summary: 画面設計『検討事項』を描く。マップは `buildDecisionTree` の木を `ELK.layout` で配置して SVG にし、幅 900px 以下では字下げの一覧にする。elkjs が読めないときは `libraryNotice`。状態の印の右端に `toggleAllBox` を置き、`shownStatuses` をまとめて入れ替えて描き直す。表示する状態の検討事項が 1 件も無いときは、マップの枠と字下げの一覧に空の旨を出す。マップの枠には `enableDragScroll` を `onPress` つきで付け、押されたとき `route.id` があれば `on.clear` を呼ぶ。選んだ項目が変わってその節があるときだけ節を中央へ送り、それ以外（選びを外したときを含む）は描き直す前のスクロールの位置（`mapState.scroll`）へ戻す
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view, clear}'
        required: true
        description: 項目を開く・表示形式を切り替える・選びを外す（入口が詳細パネルの「閉じる」と同じ処理を渡す）
    state:
      - name: shownStatuses
        type: Set<string>
        initial: 要見直し・未決定・未整理・保留
        description: マップで表示する状態
      - name: keyword
        type: string
        initial: 空
        description: マップのキーワード
      - name: zoom
        type: number
        initial: 全体が収まる倍率
        description: マップの倍率
  - name: tasksScreen
    title: タスク
    container: plugins/mindstella/skills/mindmap/preview/screens/tasks.ts
    usecase: タスクをボードで見る
    kind: 画面
    summary: 画面設計『タスク』を描く。ボードの列は `boardColumns`
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view}'
        required: true
        description: 項目を開く・表示形式を切り替える
  - name: docsScreen
    title: 資料
    container: plugins/mindstella/skills/mindmap/preview/screens/docs.ts
    usecase: 資料を読む
    kind: 画面
    summary: 画面設計『資料』を描く。カードの並びは `orderDocs`、絞り込みは `filterRows`（カードとボードで同じ条件）。ボードは絞り込んだ資料を `boardColumns`（`DOC_STATUSES`）で列に分け、列ごとに `orderDocs` で並べ直して `board` に渡す。ボードのカードは資料のカードから状態の印を外したもの
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 表示形式と絞り込み
      - name: on
        type: '{open, view}'
        required: true
        description: 項目を開く・表示形式を切り替える
  - name: recordsScreen
    title: 記録の表
    container: plugins/mindstella/skills/mindmap/preview/screens/records.ts
    usecase: 項目を表で絞り込む
    kind: 画面
    summary: 画面設計『記録の表』を描く。調査・用語集・メモ・会話ログの列の定義を種類ごとに持ち、`table` に渡す
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: route
        type: Route
        required: true
        description: 種類（`tab`）と絞り込み
      - name: on
        type: '{open}'
        required: true
        description: 項目を開く
  - name: detailPanel
    title: 詳細パネル
    container: plugins/mindstella/skills/mindmap/preview/screens/detail.ts
    usecase: 項目の詳細を読む
    kind: 画面
    summary: 画面設計『詳細パネル』『詳細の全画面』を描く。本文は `renderMarkdown`・`renderDiagrams`（見出しを段下げするときは `data-line-start` を引き継ぐ）、関係する項目は `relatedItems`。案・タイトルなどの値を描いた要素にキーのパスを `data-key` で持たせる。`full` が真なら中央のモーダルで出し、図の拡大は中身を切り替える。`comment` があれば下端に `sendForm` を留め、関係する項目の後にその項目へのレビュー中のコメントを並べ、見出しと下端の間だけをスクロールする。スクロールする本文の領域（`.panel-body`）は `tabindex="0"`・`role="region"`・`aria-label="詳細の本文"` を持ち、キーボードで届く。`highlight` があればその箇所の要素までスクロールして印の色の地で示す
    props:
      - name: id
        type: string
        required: true
        description: 項目の ID
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: full
        type: boolean
        required: true
        description: 全画面か
      - name: on
        type: '{open, close, full, back, forward, diagram}'
        required: true
        description: 項目へ移る・閉じる・全画面の切り替え・戻る進む・図を拡大する
      - name: comment
        type: "{form: SendFormProps, reviews: ReviewState['items']} | null"
        required: true
        description: 下端に置くコメントの入力の引数と、その項目へのレビュー中のコメント。配る書き出しでは `null`（どちらも置かず、選んだ箇所の入口も出さない）
      - name: highlight
        type: Location | null
        required: false
        default: 'null'
        description: コメントの一覧から開いたときに示す箇所。本文は `start` の行を含む `data-line-start` のブロック、値は `data-key` が `key` の要素。見つからなければ示さず、項目の先頭を出す
      - name: diff
        type: DiffPoint | null
        required: false
        default: 'null'
        description: '選んだ時点。あり、項目がその時点で足されたか変わったとき、前後の版を組み立て（`buildVersions`）、画面設計『詳細パネル』の選んだ時点・新規の札・キー・本文（`diffLineParts`）・図（`diffDiagram`）・Raw の差分と、組み立てられない旨を描く。本文の差分は、今の本文を `renderMarkdown` で描き（`data-line-start` は今の本文の行のまま）、足した部分の印を今の本文の要素に付ける。消した行のかたまりは `placeRemovedBlocks` のものごとに別に `renderMarkdown` し（`tableHeader` があれば頭に付けて描き、表の本体の行だけを取り出す）、`data-line-start` を外して `beforeLine` の行を持つ今のブロック（表の中はその行）の前へ、`null` なら本文の最後へ差し込む。`highlight` は差分の表示の間も今の本文の `data-line-start` から引く。後の版の本文が今の本文と違うとき（古いまとまりを選び、その後に本文を直した）は、描いた本文の `data-line-start` を全て外し、`highlight` は項目の先頭を示す。本文・図・Raw の差分を描く前に jsdiff を読めたか確かめ（`missingLibraries(["Diff"])`）、読めていなければ本文の頭に `libraryNotice({names: ["jsdiff"], what: "本文と図の差分"})` を出し、本文・図・Raw は今の版を差分なしで描き、図の拡大へは `diff` を `null` で渡す。本文の差分を打ち切ったら「本文の差分を計算しきれない旨」、図を打ち切ったらその図だけ枠に色を付け、図の Raw の差分を打ち切ったらその図の Raw は今の記法を差分なしで出す'
    unit_tests:
      - name: test_detail_panel_when_diff_highlight
        case: 正常
        summary: 差分の表示の間も、消した部分の後ろの箇所を今の行のブロックで示す
        condition: 前の版の 2、3 行目の段落を消した D-1 を `diff` つきで開き、`highlight` に今の本文の 3 行目（消した部分の後ろの段落）を渡す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 示されたブロックの `data-line-start` が 3 で文字が今の 3 行目。消した部分の要素は `data-line-start` を持たない
      - name: test_detail_panel_when_old_set_after_body_edit
        case: 正常
        summary: 古いまとまりを選び、その後に本文を直した項目では、本文の行の印を外す
        condition: V-1 で本文を直し、V-2 で本文の頭に段落を足して行をずらした D-1 を、V-1 を選んだ `diff` と今の本文の 3 行目の `highlight` つきで開く
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 本文のどの要素も `data-line-start` を持たず、`highlight` は項目の先頭を示す
  - name: searchDialog
    title: 全体の検索
    container: plugins/mindstella/skills/mindmap/preview/screens/search.ts
    usecase: 項目を検索する
    kind: 画面
    summary: 画面設計『全体の検索』を `dialog` 要素で描く。結果は `searchItems`
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, close}'
        required: true
        description: 結果の項目を開く・閉じる
  - name: diagramViewer
    title: 図の拡大
    container: plugins/mindstella/skills/mindmap/preview/screens/diagram-viewer.ts
    usecase: 項目の詳細を読む
    kind: 画面
    summary: 画面設計『図の拡大』を描く。ホイールで倍率、背景のドラッグで位置を変え、文字の上のドラッグは選択に任せる
    props:
      - name: svg
        type: SVGElement
        required: true
        description: 描いた図
      - name: on
        type: '{close}'
        required: true
        description: 閉じる
      - name: diff
        type: '{beforeSource: string} | null'
        required: false
        default: 'null'
        description: 差分の表示の間、その図の前の版の記法。あるとき詳細パネルと同じ色と「消したもの」を窓の下端に出し、Raw で記法の行の差分（`diffLineParts`）を出す。`diffLineParts` が `null` のときは Raw に今の記法を差分なしで出す
  - name: graphScreen
    title: つながり
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: つながりを辿る
    kind: 画面
    summary: 画面設計『つながり』をキャンバスに描く。玉と線は `buildGraph`、毎コマの描画は玉ごとに一度だけ画像にした文字を倍率をかけて置く（PoC の `opt-each-bitmap`）。画面の外は描かない。項目の種類の右端に `toggleAllBox` を置き、`shownKinds` をまとめて入れ替えて玉と線を作り直す。表示する種類が 1 つも無いときは、枠の中央に空の旨を出す
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open}'
        required: true
        description: 玉を押して項目を開く
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        description: 'つながりの見た目（`resolveDisplay`）。キャンバスの入れ物の `data-look` に入れる。値ごとの描き分けは #28 が作る'
    state:
      - name: shownKinds
        type: Set<string>
        initial: 全ての種類
        description: 表示する項目の種類
      - name: camera
        type: '{yaw, pitch, distance, target}'
        initial: 全体が収まる向きと距離
        description: 視点
      - name: labelCache
        type: Map<string, HTMLCanvasElement>
        initial: 空
        description: 玉・太さ・色ごとに描いた文字の画像
  - name: sendForm
    title: コメントの入力
    container: plugins/mindstella/skills/mindmap/preview/components/send-form.ts
    usecase: 項目へコメントする
    kind: コンポーネント
    summary: 部品設計『コメントの入力』の引数を受け、入力・溜める・箇所を外す・本文を写す・入力欄に入る・出るをコールバックで知らせる。入力の幅が 360px 以下では結果を下の行へ回す（コンテナクエリ。`style.css`）
    props:
      - name: target
        type: string | null
        required: true
        description: 向ける項目の ID。`null` は項目を指さないコメント（ラベルを見せず `aria-label`）
      - name: loc
        type: Location | null
        required: false
        default: 'null'
        description: 添えた箇所。入力欄の上に `locationLabel` と選んだ文（3 行まで）と × を出す
      - name: body
        type: string
        required: false
        default: "''"
        description: 入力欄の中身
      - name: status
        type: "'idle' | 'saving' | 'saved' | 'empty' | 'failed'"
        required: false
        default: "'idle'"
        description: 溜める状態。`saving` が 1 秒を超えたら回る印と文言を出す（`SENDING_NOTICE_DELAY_MS`）
      - name: count
        type: number | null
        required: false
        default: 'null'
        description: 溜めた後の件数。`saved` のときに出す
      - name: detail
        type: string | null
        required: false
        default: 'null'
        description: サーバーが返した理由。`failed` で `null` なら届かなかったとして立ち上げ直しの案内と「本文を写す」を出す
      - name: collapsed
        type: boolean
        required: false
        default: 'false'
        description: 畳んだ形（`target` が `null` のときだけ使う）
      - name: on
        type: '{input, save, unquote, copy, focus, blur}'
        required: true
        description: 入力欄の中身が変わった・「レビューに追加」か Ctrl+Enter（macOS は Cmd+Enter。`saving` の間は呼ばない）・箇所の ×・「本文を写す」・入力欄に入った・部品の外へ出た
    unit_tests:
      - name: test_send_form
        case: 正常
        summary: 状態ごとの入力欄と結果
        condition: '`parametrize`: `saving` / `saved`（`count: 3`）/ `empty` / `failed` で `detail` が `null` / `failed` で `detail` あり'
        mock: なし（DOM を作って見る）
        expected: '`saving` はボタンが `disabled` で入力欄が `readonly` / 「レビューに追加しました（レビュー中 3 件）。」/ 入力欄が `aria-invalid="true"` / 「本文を写す」がある / 「レビューに追加できませんでした。{理由}」で「本文を写す」が無い。どれも結果の要素が `role="status"` で入力欄の `aria-describedby` が指す'
      - name: test_send_form_when_location_and_no_target
        case: 正常
        summary: 添えた箇所と項目を指さない形
        condition: '`parametrize`: `target: A-005`・`loc` が本文の 3 行目 / `target: null` / `target: null`・`collapsed: true`'
        mock: '`on.unquote`'
        expected: 「本文 3 行目」と選んだ文が出て × で `on.unquote` が 1 回 / ラベルが見えず入力欄の `aria-label` が「項目を指さないコメント」/ 「レビューに追加」が無く入力欄が 1 行
      - name: test_send_form_when_ctrl_enter
        case: 正常
        summary: Ctrl+Enter で溜め、溜めている間は溜めない
        condition: '`parametrize`: `idle` で Ctrl+Enter / `saving` で Ctrl+Enter'
        mock: '`on.save`'
        expected: '`on.save` が入力欄の中身で 1 回 / 呼ばれない'
  - name: selectionComment
    title: 選んだ箇所のコメントの入口
    container: plugins/mindstella/skills/mindmap/preview/components/selection-comment.ts
    usecase: 選んだ箇所へコメントする
    kind: コンポーネント
    summary: 部品設計『選んだ箇所のコメントの入口』のピル。選んだ範囲の矩形から位置を決め（下に収まらなければ上、左右は画面の端から 8px の内側）、押す・Esc をコールバックで知らせる。押したときに選択が外れないよう `pointerdown` の既定の動きを止める
    props:

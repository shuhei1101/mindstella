title: プレビュー / React の入口
lead: React のプレビューの起動・Provider と QueryClient とルーターの組み立て・ルートの定義。
directory: "```\npackage.json            依存と npm scripts（dev・build・typecheck・lint・test・storybook-react・generate-api）\nvite.config.ts          root を frontend/ にし、出力を plugins/mindstella/skills/mindmap/preview/spa/ へ書く\nvitest.config.ts        jsdom・setupFiles・coverage\norval.config.ts         frontend/openapi.yaml から shared/api/generated/ へ生成する\neslint.config.js        React の側（frontend/src）だけに当てる lint\nlefthook.yml            commit の前に lint と型検査を流す\n.storybook-react/       @storybook/react-vite の設定（main.ts・preview.tsx・public/mockServiceWorker.js）\nfrontend/\n  index.html            SPA の HTML\n  openapi.yaml          SPA が読む配信の API の OpenAPI の定義\n  tsconfig.json         React の側の型検査（paths の @/* は src/*）\n  src/\n    main.tsx            起動\n    route-tree.gen.ts   TanStack Router の生成したルートのツリー\n    app/\n      query-client.ts   QueryClient を作る\n      router.tsx        ルーターを作る\n      app.tsx           Provider を組む\n    routes/\n      __root.tsx        ルートの外枠\n      index.tsx         概要のルート（/）\n\
  ```"
diagrams:
- name: 全体
  diagram: "```mermaid\nclassDiagram\n  direction LR\n  class 起動\n  class アプリ\n  class QueryClientの作成\n  class ルーターの作成\n  class 概要のルート\n  class 概要のsearch\n  起動 --> アプリ\n  アプリ --> QueryClientの作成\n  アプリ --> ルーターの作成\n  ルーターの作成 --> 概要のルート\n  概要のルート --> 概要のsearch\n```"
constants:
- name: QUERY_DEFAULT_OPTIONS
  title: QueryClient の既定
  container: frontend/src/app/query-client.ts
  usecase: 共通
  summary: knowledge の規約『QueryClient』の defaultOptions
  entries:
  - key: staleTime
    value: 60 * 1000
  - key: refetchOnWindowFocus
    value: 'false'
  - key: retry
    value: 'false'
- name: ROUTER_BASEPATH
  title: ルーターの頭
  container: frontend/src/app/router.tsx
  usecase: 共通
  summary: SPA を配るパスの頭（インターフェース定義『SPAの配信』）
  value: '"/spa"'
data_models:
- name: OverviewSearchSchema
  title: 概要の search
  container: frontend/src/features/overview/overview/search.ts
  usecase: SPAを開く
  role: Zod スキーマ
  summary: 概要のルートの search params。`tab` は `overview` だけを受け、他の値と無い値は既定に落とす
  properties:
  - name: tab
    type: '''overview'' | undefined'
    description: 開く画面。決めた値以外は `undefined` に落とし、URL から外す
functions:
- name: createQueryClient
  title: QueryClient の作成
  kind: 関数
  container: frontend/src/app/query-client.ts
  usecase: 共通
  summary: '`QUERY_DEFAULT_OPTIONS` で QueryClient を 1 つ作る'
  returns:
    type: QueryClient
    description: アプリで 1 つの QueryClient
  unit_tests:
  - name: test_create_query_client
    case: 正常
    summary: 既定の option で作る
    condition: なし
    mock: なし
    expected: '`getDefaultOptions().queries` の `staleTime` が 60000、`refetchOnWindowFocus` と `retry` が false'
- name: createAppRouter
  title: ルーターの作成
  kind: 関数
  container: frontend/src/app/router.tsx
  usecase: 共通
  summary: 生成したルートのツリーで、`ROUTER_BASEPATH` を頭にしたルーターを作る
  args:
  - name: queryClient
    type: QueryClient
    required: true
    description: ルーターの context に入れる QueryClient
  returns:
    type: Router
    description: context に `queryClient` を持つルーター
  unit_tests:
  - name: test_create_app_router
    case: 正常
    summary: basepath と context を持つ
    condition: QueryClient を渡す
    mock: なし
    expected: '`options.basepath` が `/spa`、`options.context.queryClient` が渡した QueryClient'
- name: parseOverviewSearch
  title: 概要の search の検証
  kind: 関数
  container: frontend/src/features/overview/overview/search.ts
  usecase: SPAを開く
  summary: 概要のルートの `validateSearch`。`OverviewSearchSchema` で parse する
  args:
  - name: search
    type: Record<string, unknown>
    required: true
    description: URL の search params
  returns:
    type: OverviewSearch
    description: 検証した search
  unit_tests:
  - name: test_parse_overview_search
    case: 正常
    summary: overview を受ける
    condition: '`{tab: ''overview''}`'
    mock: なし
    expected: '`{tab: ''overview''}`'
  - name: test_parse_overview_search_when_unknown
    case: 正常
    summary: 決めた値以外は落とす
    condition: '`{tab: ''unknown''}`'
    mock: なし
    expected: '`{tab: undefined}`'
components:
- name: App
  title: アプリ
  kind: コンポーネント
  container: frontend/src/app/app.tsx
  usecase: 共通
  summary: QueryClientProvider と RouterProvider を組み、書き換えの知らせへつなぐ（書き換えの知らせへの接続）
  props:
  - name: queryClient
    type: QueryClient
    required: true
    description: createQueryClient が作った QueryClient
  - name: router
    type: Router
    required: true
    description: createAppRouter が作ったルーター
  unit_tests:
  - name: test_app
    case: 正常
    summary: ルートの画面を描く
    condition: MSW で `GET /api/records` を返す
    mock: MSW（`GET /api/records`）・EventSource（偽物）
    expected: 概要の画面が描かれ、EventSource が `/api/events` へつながる
- name: RootLayout
  title: ルートの外枠
  kind: コンポーネント
  container: frontend/src/routes/__root.tsx
  usecase: 共通
  summary: 子のルートを描く外枠。描画中のエラーは ErrorBoundary で受ける
notes:
  置き場所: knowledge の規約『ビルド構成』『フォルダ構成』のとおり、package.json と各ツールの設定をリポジトリの直下に、ソースを `frontend/` に置く。React の側の `tsconfig.json` だけは `frontend/` に置く（typescript-eslint の `projectService` が対象に最も近い `tsconfig.json` を引き、直下の `tsconfig.json` は今の画面の設定のため。PoC 検証の所見）
  ルート: TanStack Router のファイルのルートで `routes/` を置き、`@tanstack/router-plugin` の Vite のプラグインで `route-tree.gen.ts` を生成する

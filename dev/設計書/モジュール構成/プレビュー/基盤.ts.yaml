  - name: fetchRecords
    title: 記録の取得
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: プレビューを開く
    scope: public
    is_async: true
    summary: '`GET /api/records` を読んで結果にする'
    args:
      - name: fetchFn

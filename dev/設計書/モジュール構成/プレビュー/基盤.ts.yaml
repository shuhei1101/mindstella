  - name: callApi
    title: 配信の呼び出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: 共通
    scope: public
    is_async: true
    summary: コメント・書きかけの API を 1 回呼び、`ApiResult` にする
    args:
      - name: method
        type: "'GET' | 'POST' | 'PATCH' | 'PUT' | 'DELETE'"
        required: true
        passing: positional
        description: メソッド
      - name: path
        type: string
        required: true
        passing: positional
        description: 画面が開いた URL からの相対パス（`API_PATHS` の値。`/{id}` は `encodeURIComponent` で足す）
      - name: body
        type: object | null
        required: false
        default: 'null'
        passing: positional
        description: 送る本文。`null` なら送らず `Content-Type` も付けない
      - name: fetchFn
        type: typeof fetch
        required: false
        default: window.fetch
        passing: injected
        description: 要求を送る関数
    returns:
      type: Promise<ApiResult>
      description: 結果
    process: |-
      1. `body` があれば `Content-Type: application/json` で JSON にして送る
         - 例外を送った場合（届かない）、`{ok: false, status: null, detail: null, stale: []}` を返す
      2. 2xx なら本文の JSON（204 は `null`）を `data` に、それ以外は本文の `detail`（読めなければステータスの文言）と `stale`（無ければ空）を返す
    unit_tests:
      - name: test_call_api
        case: 正常
        summary: 成功の本文を返し、本文を JSON で送る
        condition: '`parametrize`: `POST api/comments` に `{target: D-1, body: x}` で 201・`{"id": "C-1", "count": 1}` / `PUT api/drafts` で 204 / `DELETE api/comments/C-1` で 200'
        mock: '`fetchFn`'
        expected: '`{ok: true, data: {id: C-1, count: 1}}` で渡った本文が JSON・`Content-Type` が `application/json` / `{ok: true, data: null}` / `DELETE` に `Content-Type` が無い'
      - name: test_call_api_when_failed
        case: 正常
        summary: 断られた・届かないを分ける
        condition: '`parametrize`: 409・`{"detail": "…", "stale": [{"id": "C-2", "reason": "…"}]}` / 500・本文が JSON でない / `fetchFn` が `TypeError` を送る'
        mock: '`fetchFn`'
        expected: "`{ok: false, status: 409, stale: [C-2]}` / `{ok: false, status: 500, detail: 'Internal Server Error'}` / `{ok: false, status: null, detail: null}`"
  - name: commentApi
    title: コメントの API
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: コメントを選んで送る
    scope: public
    summary: コメント・書きかけの 6 つの呼び出しを `callApi` に当てた関数の束を返す
    args:
      - name: fetchFn
        type: typeof fetch
        required: false
        default: window.fetch
        passing: injected
        description: 要求を送る関数
    returns:
      type: '{read, add, update, remove, saveDraft, send}'
      description: '`read()` は `GET api/comments`、`add(input)` は `POST api/comments`、`update(id, patch)` は `PATCH api/comments/{id}`、`remove(id)` は `DELETE api/comments/{id}`、`saveDraft(draft)` は `PUT api/drafts`、`send(ids)` は `POST api/comments/send` を呼ぶ'
    process: 1. それぞれのメソッド・パス・本文で `callApi` を呼ぶ関数を束ねて返す
    unit_tests:
      - name: test_comment_api
        case: 正常
        summary: 各呼び出しのメソッドとパス
        condition: "`parametrize`: `read()` / `add({body: x})` / `update('C-1', {loc: null})` / `remove('C-1')` / `saveDraft({target: D-1, body: x})` / `send(['C-1'])`"
        mock: '`fetchFn`'
        expected: '`GET api/comments` / `POST api/comments` / `PATCH api/comments/C-1`（本文 `{"loc":null}`）/ `DELETE api/comments/C-1` / `PUT api/drafts` / `POST api/comments/send`（本文 `{"ids":["C-1"]}`）'
  - name: selectionLocation
    title: 選んだ範囲の箇所
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 選んだ箇所へコメントする
    scope: public
    summary: 選んだ範囲を、本文なら元の Markdown の行の範囲、値ならキーのパスの箇所にする。本文と値の外は `null`
    args:
      - name: range
        type: Range
        required: true
        passing: positional
        description: 選んだ範囲
    returns:
      type: Location | null
      description: 箇所（`text` は `range.toString()` の前後の空白を除いたもの）。空の選択・本文と値の外・本文と値をまたぐ選択・異なる値をまたぐ選択は `null`
    process: |-
      1. 空の選択か、文が空白だけなら `null`
      2. 始点と終点から `[data-key]` を持つ最も近い祖先を引き、どちらも同じ要素なら `{kind: value, key}` を返す
      3. 始点と終点から `.md` の中で `data-line-start` を持つ最も近い祖先を引き（無ければ `null`）、祖先の先頭から端までを `cloneContents` した中の `\n` の数と `br` の数を印の行に足す（表の行は数えない。PoC #80 の `selectionLines`）
      4. `{kind: body, start, end, text}` を返す
    unit_tests:
      - name: test_selection_location
        case: 正常
        summary: 本文の行の範囲と値のキーを求める
        condition: 'PoC #80 の選択のケース 19 件（見出し・段落・入れ子の項目・番号付きリスト・表・コード・引用・ソフト改行・ハードブレイク・ブロックをまたぐ選択）と、`data-key="options[B].cons"` の値の中の選択。差分の表示の間に、消した部分の後ろの段落を選んだとき'
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '本文は各ケースの元の行の範囲（差分の表示の間は今の本文の行）。値は `{kind: value, key: options[B].cons, text}`'
      - name: test_selection_location_when_outside
        case: 正常
        summary: 本文と値の外は null
        condition: '`parametrize`: 空の選択 / 見出しの帯 / 関係する項目 / 図の SVG / 図の Raw の原文 / 本文から値へまたぐ選択 / 差分の表示の間の消した部分 / 消した部分と今の部分をまたぐ選択'
        mock: なし
        expected: どれも `null`
  - name: locationLabel
    title: 箇所の名前
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/records.ts
    usecase: 選んだ箇所へコメントする
    scope: public
    summary: 箇所を画面に出す名前にする
    args:
      - name: loc
        type: Location
        required: true
        passing: positional
        description: 箇所
    returns:
      type: string
      description: 本文は `本文 {start} 行目`（`start` と `end` が違えば `本文 {start}〜{end} 行目`）、値は詳細パネルがそのキーに出す見出し（案の中は `案 {key} の{見出し}`）
    process: 1. `kind` で分け、値はキーの最後の段の見出し（詳細パネルと同じ辞書。無ければキーそのまま）を使う
    unit_tests:
      - name: test_location_label
        case: 正常
        summary: 箇所の名前
        condition: '`parametrize`: `{kind: body, start: 3, end: 3}` / `{kind: body, start: 2, end: 4}` / `{kind: value, key: options[C].cons}` / `{kind: value, key: unknown_key}`'
        mock: なし
        expected: '`本文 3 行目` / `本文 2〜4 行目` / `案 C のデメリット` / `unknown_key`'

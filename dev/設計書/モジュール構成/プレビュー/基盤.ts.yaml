title: "プレビュー / 基盤"
lead: 画面が共通で使う土台。記録の索引と画面に出す値の計算、描画のライブラリの呼び出しと読めないときの知らせ、URL のハッシュと履歴を持つ。
directory: |-
  ```
  tsconfig.json      tsc の設定（リポジトリの直下。外部ライブラリ『typescript』）
  plugins/mindstella/skills/mindmap/preview/
    core/
      globals.d.ts   描画のライブラリ（marked・DOMPurify・ELK・mermaid）のグローバルに npm の型を割り当てる（出力しない）
      dom.ts         要素の組み立て（`h`）・アイコン・状態の印など、画面が共通で使う DOM の部品
      records.ts     記録の索引・関係する項目・検索・箇所の名前（次の候補・ゴールまでの進捗・カテゴリー別の進捗はサーバーが計算した `derived` を使う）
      libs.ts        描画のライブラリの有無と呼び出し（Markdown・図・配置）と、選んだ範囲から箇所を求める処理
      router.ts      URL のハッシュの読み書きと履歴
      api.ts         サーバーの配信とのやり取り（記録の取得・書き換えの知らせ・レビュー中のコメント・書きかけ・まとめて送る）
  ```

  全ての `.ts` は import / export を持たない script で、`namespace MindmapPreview` の下に関数を置く。読んだだけでは DOM に触らない。
  `tsc -p .` が `.ts` と同じ階層に即時実行関数の形の `.js` を出し、その `.js` を commit する。各 `.js` が名前空間を無ければ作り、あれば足すので、名前空間を作るだけのファイルは要らない。サーバーはこの `.js` をつないで雛形に差し込む（モジュール構成『ビルド』の `SCRIPT_FILES`）。
data_models:
  - name: RecordIndex
    title: 記録の索引
    container: plugins/mindstella/skills/mindmap/preview/core/records.ts
    usecase: 共通
    summary: 埋め込みのデータを ID で引けるようにし、参照の逆向きを持つ
    properties:
      - name: data
        type: object
        description: 埋め込みのデータ（`settings`・7 種類・`bodies`・`derived`・`built_at`）そのもの。次の候補・ゴールまでの進捗・カテゴリー別の進捗は `derived` をそのまま使い、画面で計算し直さない
      - name: byId
        type: Map<string, {kind, item}>
        description: ID → 種類と項目
      - name: referencedBy
        type: Map<string, string[]>
        description: ID → その項目を `depends_on`・`for`・`related`・`sources` で指す項目の ID（ID の順）
      - name: readyIds
        type: Set<string>
        description: 着手可能な検討事項の ID（`data.derived.next` の ID）。表の「着手可否」の列は、ここにある未決定を「着手可能」、ほかの未決定を「前提待ち」、未決定以外を「なし」にする
  - name: Route
    title: 画面の場所
    container: plugins/mindstella/skills/mindmap/preview/core/router.ts
    usecase: 共通
    summary: URL のハッシュが指す画面・表示形式・項目・絞り込み（インターフェース定義『プレビューを開く』のリクエスト）
    properties:
      - name: tab
        type: "'overview' | 'decisions' | 'tasks' | 'research' | 'docs' | 'terms' | 'notes' | 'logs' | 'graph'"
        description: 画面
      - name: view
        type: "'map' | 'board' | 'cards' | 'table'"
        description: 表示形式
      - name: id
        type: string | null
        description: 開いている項目
      - name: full
        type: boolean
        description: 詳細を全画面で開いているか
      - name: filters
        type: Record<string, string[]>
        description: 開いたときの `f.{列}`。どの表示形式でも、入口が絞り込みのドロワーの条件として受ける（`initialFilters`。書き戻さない）
  - name: FetchResult
    title: 記録の取得の結果
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: プレビューを開く
    summary: "`fetchRecords` の結果（`{ok: true, data} | {ok: false, reason: 'unreachable' | 'invalid', detail}`）"
    properties:
      - name: ok
        type: boolean
        description: 記録を読めたか
      - name: data
        type: object
        description: '`ok` のとき、インターフェース定義『記録の取得』のレスポンス'
      - name: reason
        type: "'unreachable' | 'invalid'"
        description: 読めなかったとき、届かなかったかサーバーが 422 を返したか
      - name: detail
        type: string | null
        description: 422 の `detail`
  - name: ApiResult
    title: 配信の結果
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: コメントを選んで送る
    summary: 'コメント・書きかけの API を呼んだ結果（`{ok: true, data} | {ok: false, status, detail, stale}`。届かなければ `status`・`detail` は `null`）'
    properties:
      - name: ok
        type: boolean
        description: 2xx が返ったか
      - name: data
        type: T | null
        description: '`ok` のときの本文（204 は `null`）'
      - name: status
        type: number | null
        description: 断られたときのステータスコード。届かなかったときは `null`
      - name: detail
        type: string | null
        description: 断られたときの `detail`。届かなかったときは `null`
      - name: stale
        type: '{id, reason}[]'
        description: 409 のときの箇所が合わないコメント（それ以外は空）
  - name: Location
    title: 箇所
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: 選んだ箇所へコメントする
    summary: コメント・書きかけが持つ `loc`（ER 図『ワークスペース』）
    properties:
      - name: kind
        type: "'body' | 'value'"
        description: 箇所の種類
      - name: start
        type: number
        description: '`body` のときの始めの行（無ければ持たない）'
      - name: end
        type: number
        description: '`body` のときの終わりの行'
      - name: key
        type: string
        description: '`value` のときのキーのパス'
      - name: text
        type: string
        description: 選んだ文
  - name: ReviewState
    title: レビュー中
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: コメントを選んで送る
    summary: 『レビュー中のコメントの読み取り』の本文
    properties:
      - name: items
        type: '{id, target, target_title, loc, body, created}[]'
        description: レビュー中のコメント（溜めた順）
      - name: drafts
        type: '{target, loc, body}[]'
        description: 書きかけ
constants:
  - name: DEFAULT_VIEW
    title: 画面ごとの既定の表示形式
    container: plugins/mindstella/skills/mindmap/preview/core/router.ts
    usecase: 共通
    summary: '`tab` → 既定の `view`'
    entries:
      - key: decisions
        value: map
      - key: tasks
        value: board
      - key: docs
        value: cards
      - key: そのほか
        value: table
  - name: VIEWS_OF
    title: 画面が持つ表示形式
    container: plugins/mindstella/skills/mindmap/preview/core/router.ts
    usecase: 共通
    summary: '`tab` → 切り替えられる `view` の並び'
    entries:
      - key: decisions
        value: '["map", "board", "table"]'
      - key: tasks
        value: '["board", "table"]'
      - key: docs
        value: '["cards", "board", "table"]'
      - key: そのほか
        value: '["table"]'
  - name: LIBRARIES
    title: 描画のライブラリ
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 共通
    summary: ライブラリの名前 → 読めたときに置かれるグローバル
    entries:
      - key: marked
        value: marked
      - key: DOMPurify
        value: DOMPurify
      - key: elkjs
        value: ELK
      - key: mermaid
        value: mermaid
      - key: jsdiff
        value: Diff
  - name: API_PATHS
    title: 配信のパス
    container: plugins/mindstella/skills/mindmap/preview/core/api.ts
    usecase: プレビューを開く
    summary: 画面が開いた URL からの相対パス
    entries:
      - key: records
        value: '"api/records"'
      - key: events
        value: '"api/events"'
      - key: comments
        value: '"api/comments"'
      - key: commentsSend
        value: '"api/comments/send"'
      - key: drafts
        value: '"api/drafts"'
      - key: opened
        value: '"api/opened"'
  - name: PRESS_SLOP_PX
    title: 押したとみなす移動の上限
    container: plugins/mindstella/skills/mindmap/preview/core/dom.ts
    usecase: 検討事項をマップで辿る
    summary: 背景を押してから離すまでのポインターの移動（縦・横それぞれの px）がこの値以内なら、ドラッグではなく押したとみなす（タッチパッド・ペンで 1 回押すときのぶれを吸収し、マップを動かすつもりのドラッグとは取り違えない幅）
    value: '5'
functions:
  - name: buildIndex
    title: 記録の索引を作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/records.ts
    usecase: 共通
    scope: public
    summary: 埋め込みのデータから `RecordIndex` を作る
    args:
      - name: data
        type: object
        required: true
        passing: positional
        description: '`mindmap-data` を `JSON.parse` した値'
    returns:
      type: RecordIndex
      description: 索引
    process: |-
      1. 7 種類の項目を ID で `byId` に入れる
      2. 各項目の `depends_on`・`for`・`related`・`sources` が指す ID ごとに、指した側の ID を `referencedBy` に足す（記録に無い ID もそのまま持つ）
      3. `derived.next` の ID を `readyIds` に入れる
    unit_tests:
      - name: test_build_index
        case: 正常
        summary: ID で引け、参照元を逆に引ける
        condition: 'D-1・D-2（`depends_on: [D-1]`）・T-1（`for: [D-1]`）を持ち、`derived.next` が D-1 だけのデータ'
        mock: なし
        expected: '`byId.get("T-1").kind` が `tasks`。`referencedBy.get("D-1")` が `["D-2", "T-1"]`。`readyIds` が D-1 だけ'
  - name: relatedItems
    title: 関係する項目
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/records.ts
    usecase: 項目の詳細を読む
    scope: public
    summary: 詳細パネルに出す前提・後続・関連タスク・経緯・関連・参照している項目を返す
    args:
      - name: id
        type: string
        required: true
        passing: keyword
        description: 項目の ID
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
    returns:
      type: '{prerequisites, successors, tasks, logs, related, referencedBy}'
      description: それぞれ ID の並び。前提は `depends_on`、後続はその逆向き、関連タスクは `for` で指すタスク、経緯は `related` で指す会話ログ、参照している項目はそれ以外の `referencedBy`
    unit_tests:
      - name: test_related_items
        case: 正常
        summary: 関係の種類ごとに分ける
        condition: 'D-2（`depends_on: [D-1]`）・T-1（`for: [D-1]`）・L-1（`related: [D-1]`）・N-1（`related: [D-1]`）と D-1（`depends_on: [D-0]`）'
        mock: なし
        expected: D-1 の `prerequisites` が D-0、`successors` が D-2、`tasks` が T-1、`logs` が L-1、`referencedBy` が N-1
  - name: searchItems
    title: 全体の検索
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/records.ts
    usecase: 項目を検索する
    scope: public
    summary: 空白で区切った語を全て含む項目を返す
    args:
      - name: query
        type: string
        required: true
        passing: keyword
        description: 検索の言葉
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
    returns:
      type: '{id, kind, title}[]'
      description: ID・タイトル・項目の文字の値・本文（`bodies`）のどこかに語が全てある項目。大文字・小文字を区別しない。種類の順 → 連番の順。言葉が空なら空
    unit_tests:
      - name: test_search_items
        case: 正常
        summary: 全ての語を含む項目を返す
        condition: '`parametrize`: `"d-1"` / 本文にだけある語 / 2 語のうち 1 語だけ含む項目 / 空白だけ'
        mock: なし
        expected: D-1 / その項目 / 返らない / 空
  - name: missingLibraries
    title: 読めなかったライブラリ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 共通
    scope: public
    summary: 渡したライブラリのうち、グローバルが無いものの名前を返す
    args:
      - name: names
        type: string[]
        required: true
        passing: positional
        description: '`LIBRARIES` のキー'
    returns:
      type: string[]
      description: 読めなかったライブラリの名前（渡した順）
    unit_tests:
      - name: test_missing_libraries
        case: 正常
        summary: グローバルが無いものだけ返す
        condition: '`window.marked` だけを置いて `["marked", "DOMPurify"]`'
        mock: なし
        expected: '`["DOMPurify"]`'
  - name: libraryNotice
    title: 読めなかったライブラリの知らせ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 共通
    scope: public
    summary: 読めなかったライブラリの名前を出す `role="alert"` の要素を返す
    args:
      - name: names
        type: string[]
        required: true
        passing: keyword
        description: 読めなかったライブラリの名前
      - name: what
        type: string
        required: true
        passing: keyword
        description: 表示できないもの（本文・図・マップ）
    returns:
      type: HTMLElement
      description: '`{what}を表示できません。読み込めなかったライブラリ: {名前を「・」でつなぐ}` と、「通信を確認して、ページを再読み込みしてください。」を持つ要素（文字は `textContent` で入れる）'
    unit_tests:
      - name: test_library_notice
        case: 正常
        summary: 名前を並べた知らせを返す
        condition: '`{names: ["marked", "DOMPurify"], what: "本文"}`'
        mock: なし
        expected: '`role` が `alert` で、文字に `読み込めなかったライブラリ: marked・DOMPurify` と `通信を確認して、ページを再読み込みしてください。`'
  - name: renderMarkdown
    title: 本文を描く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    summary: 本文の Markdown を無害化した要素にする。mermaid のコードブロックは図の入れ物に置き換える
    args:
      - name: source
        type: string
        required: true
        passing: positional
        description: 本文の Markdown
    returns:
      type: HTMLElement
      description: 描いた本文。marked か DOMPurify が読めないときは、`libraryNotice` と原文の `pre` を持つ要素
    process: |-
      1. marked・DOMPurify が読めたか確かめる（`missingLibraries`）
         - 読めていない場合、知らせと原文を返す（本文に mermaid のコードブロックがあり mermaid も読めていなければ名前に足す）
      2. `marked.lexer` の token に先頭の行から `raw` の改行を足し進めた行を持たせ（リストの項目と引用は中の token にも）、見出し・段落・コード・リストの項目・表の行の最初の開きタグに `data-line-start` を付けて HTML にする（`marked.Renderer` を包む。段落を持つ項目は中の段落に任せ、mermaid のコードには付けない。フェンスのコードは次の行、表は見出しの行と区切りの行の次から 1 行ずつ。PoC #80 の方式）
      3. `DOMPurify.sanitize`（`data-line-start` を残す）して要素に入れる
      4. `language-mermaid` のコードブロックを、原文を `data-source` に持つ図の入れ物に置き換える（描くのは `renderDiagrams`）
    unit_tests:
      - name: test_render_markdown
        case: 正常
        summary: 無害化して描き、図の入れ物を作る
        condition: 見出し・表・`<img src=x onerror=alert(1)>`・mermaid のコードブロックを持つ本文。marked・DOMPurify はリポジトリの外部ライブラリの設計書の版を `page.route` で返す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`h1`・`table` があり、`onerror` が無く、図の入れ物が 1 つで `data-source` に原文'
      - name: test_render_markdown_when_library_missing
        case: 正常
        summary: ライブラリが無ければ知らせと原文
        condition: marked を読まない。本文に mermaid のコードブロック
        mock: なし
        expected: '`role="alert"` に `marked`・`DOMPurify`・`mermaid`、`pre` に原文'
      - name: test_render_markdown_when_line_marks
        case: 正常
        summary: ブロックに元の行の印を付け、見た目を変えない
        condition: 見出し（1 行目）・段落（3 行目）・入れ子のリスト・表・フェンスのコード・mermaid のコードブロックを持つ本文
        mock: 描画のライブラリの配信元（`page.route`）
        expected: '`h1` の `data-line-start` が 1、段落が 3、表の各行とコードが PoC #80 の対応づけどおり。図の入れ物には付かない。`data-line-start` を除いた HTML が印を付けないときと同じ'
  - name: renderDiagrams
    title: 図を描く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/libs.ts
    usecase: 項目の詳細を読む
    scope: public
    is_async: true
    summary: 要素の中の図の入れ物を mermaid で SVG に描く
    args:
      - name: root
        type: HTMLElement
        required: true
        passing: positional
        description: '`renderMarkdown` の戻り値'
    returns:
      type: Promise<void>
      description: 全て描き終えたら解決する
    process: |-
      1. mermaid が読めていない場合、各入れ物に知らせ（`libraryNotice({names: ["mermaid"], what: "図"})`）と原文を入れる
      2. 初めて描くときに `mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: "base"})` を呼ぶ
      3. 入れ物ごとに `mermaid.render` した SVG を入れる
         - 描けなかった場合、その入れ物に「この図は表示できませんでした。原文を表示します。」と原文を入れる（ほかの図は続ける）
    unit_tests:
      - name: test_render_diagrams
        case: 正常
        summary: 図を SVG に描き、描けない図は原文を残す
        condition: 正しいフローチャートと、構文の誤った図の入れ物。mermaid は `page.route` で返す
        mock: 描画のライブラリの配信元（`page.route`）
        expected: 1 つ目に `svg`、2 つ目に「この図は表示できませんでした。原文を表示します。」と原文
  - name: parseHash
    title: ハッシュを読む
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/router.ts
    usecase: 共通
    scope: public
    summary: URL のハッシュを `Route` にする
    args:
      - name: hash
        type: string
        required: true
        passing: keyword
        description: '`location.hash`'
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引（`id` が記録にあるかを見る）
    returns:
      type: Route
      description: 画面の場所
    process: |-
      1. `#` の後ろを `URLSearchParams` で読む
      2. `tab` が画面の値でなければ `overview`、`view` が `VIEWS_OF` に無ければ `DEFAULT_VIEW`
      3. `id` が記録に無ければ `null`。`full` は `id` があり `1` のときだけ真
      4. `f.` で始まるキーを `filters` に、値を `|` で分けて入れる
    unit_tests:
      - name: test_parse_hash
        case: 正常
        summary: 既定と誤った値を扱う
        condition: '`parametrize`: 空 / `#tab=decisions&view=table&id=D-1&f.status=要見直し|保留` / `#tab=nope&view=cards` / `#tab=decisions&id=D-99&full=1` / `#tab=tasks&view=map` / `#tab=docs&view=board`'
        mock: なし
        expected: 'overview・table・null / decisions・table・D-1・`{status: [要見直し, 保留]}` / overview・table / decisions・map・null・full 偽 / tasks・board / docs・board'
  - name: toHash
    title: ハッシュを作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/core/router.ts
    usecase: 共通
    scope: public
    summary: '`Route` を URL のハッシュにする（既定の値と `filters` は書かない）'
    args:
      - name: route
        type: Route
        required: true
        passing: positional
        description: 画面の場所

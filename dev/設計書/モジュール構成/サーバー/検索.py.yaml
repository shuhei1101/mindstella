title: "サーバー / 検索"
lead: 条件で項目を探してページに分け、返す量を選んで JSON か Markdown にし、1 件の中身と参照元、使っている属性名とタグを出す。読み書きと検証・タグの表記だけに依存し、ファイルを書かない。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    query.py   検索・返す量と文字数・結果の Markdown・1 件の表示と参照元・属性名とタグの一覧
  ```
data_models:
  - name: SearchFilter
    title: 検索の条件
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    role: DTO
    summary: '`find` の引数をまとめた条件。`None` の条件は絞らない'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: text
        type: str | None
        default: None
        description: 文字の欄に含まれる文字
      - name: kind
        type: Kind | None
        default: None
        description: 種類
      - name: status
        type: str | None
        default: None
        description: 状態
      - name: target
        type: str | None
        default: None
        description: 対象
      - name: category
        type: str | None
        default: None
        description: カテゴリー
      - name: phase
        type: str | None
        default: None
        description: フェーズ
      - name: attrs
        type: list[tuple[str, str | None]]
        default: '[]'
        description: 属性名と値（値が `None` ならその属性を持つことだけ）
      - name: tags
        type: tuple[str, ...]
        default: ()
        description: 全てを持つ項目に絞るタグ（AND。空なら絞らない）
      - name: any_tags
        type: tuple[str, ...]
        default: ()
        description: いずれかを持つ項目に絞るタグ（OR。空なら絞らない）
  - name: SearchHit
    title: 検索で当たった項目
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    role: DTO
    summary: 条件に合った 1 項目と、その種類・文字数
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 種類
      - name: item
        type: dict[str, Any]
        description: 読んだ項目（書き換えない）
      - name: chars
        type: int
        description: 項目の文字数（`item_chars`）
constants:
  - name: REFERENCE_KEYS
    title: 参照のキー
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: 参照元として拾うキーとその並び
    value: ("depends_on", "parent", "for", "related", "sources")
  - name: DEFAULT_LIMIT
    title: 既定の件数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: '`find` が 1 ページに返す既定の件数（インターフェース定義『項目の検索』の制約「件数」）'
    value: '20'
  - name: MAX_LIMIT
    title: 件数の上限
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: '`find` の `limit` に渡せる件数の上限（インターフェース定義『項目の検索』の制約「件数」が導き方を持つ）'
    value: '80'
  - name: NARROWING_ARGUMENTS
    title: 絞り込める引数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: 切り詰めたときの案内に並べる引数の名前とその並び
    value: ("tags", "kind", "status", "phase", "category", "text")
  - name: FIELD_NAMES
    title: 返す項目の名前
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: '`find` の `include`・`exclude` に渡せる名前とその並び。結果の列と `omitted` もこの並び（インターフェース定義『項目の検索』の `include`）'
    value: ("title", "status", "tags", "chars", "target", "category", "phase", "attrs", "updated", "extra", "body")
  - name: VIEW_FIELDS
    title: 返す量ごとの項目
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: '`view` ごとに返す項目の名前（`FIELD_NAMES` の頭から）'
    value: '{"brief": FIELD_NAMES[:4], "standard": FIELD_NAMES[:9], "full": FIELD_NAMES}'
  - name: NAMED_ITEM_KEYS
    title: 名前で返す項目のキー
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    summary: '`extra` に入れない項目の YAML のキー（`id` と、`FIELD_NAMES` が名前で返すキー。`body` は本文のファイル名）'
    value: ("id", "title", "status", "tags", "target", "category", "phase", "attrs", "updated", "body")
functions:
  - name: search_items
    title: 項目の検索
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 条件の全てに合う項目を、文字数を添えて並べて返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 条件
    returns:
      type: list[SearchHit]
      description: 合った項目の並び（インターフェース定義『項目の検索』の制約「並び」の順）
    process: |-
      1. `KINDS` の順に、`kind` の条件に合う種類の項目を見る
      2. `status`・`target`・`category`・`phase` は一致、`tags` は全てを `tags` の名前に含む、`any_tags` はどれかを `tags` の名前に含む（タグは渡した側も項目の側も `normalize_tag` でそろえて比べる。項目の側の名前は `tag_name` で取る）、`attrs` は全ての名前と値（値は文字列にして）が一致、で絞る
      3. `text` は項目の全ての文字列の値のどれかに、英字の大小を区別せず含まれるかで絞る（`_contains_text`）
      4. 各種類の中は連番の小さい順に並べる
      5. `tags`・`any_tags` のどちらかを渡したときは、渡したタグのどれかを主題（`main: true`）として持つ項目を先に、持たない項目を後に置く（それぞれの中は 4 までの順を保つ安定な並べ替え）
      6. 合った項目ごとに `item_chars` で文字数を数え、`SearchHit` にする
    unit_tests:
      - name: test_search_items_when_text_and_attr
        case: 正常
        summary: 文字と属性の両方に合う項目だけを返す
        condition: 'D-1: タイトルに `スキーマ`・属性 `担当: 自分`／D-2: 案の `content` に `スキーマ`・属性なし／T-1: 属性 `担当: 自分`。`text=スキーマ`・`attrs=[(担当, 自分)]`'
        mock: なし
        expected: D-1 の 1 件
      - name: test_search_items_when_nested_text
        case: 正常
        summary: 入れ子の文字列にも当たる
        condition: 同じワークスペースで `text=スキーマ` だけ
        mock: なし
        expected: D-1・D-2
      - name: test_search_items_when_fields
        case: 正常
        summary: 種類・状態・タグ・対象・カテゴリー・フェーズで絞る
        condition: '`parametrize` で各条件を 1 つずつ渡す（例: `kind=task`・`status=未決定`・`tags=(データ,)`）'
        mock: なし
        expected: それぞれの条件に合う ID だけ
      - name: test_search_items_when_no_filter
        case: 正常
        summary: 条件が無ければ全てを種類の順に返す
        condition: T-1・D-2・D-1 の順にファイルに書いたワークスペース（D は D-2 が先）
        mock: なし
        expected: D-1・D-2・T-1
      - name: test_search_items_when_tags_and_any_tags
        case: 正常
        summary: tags は全てを持つ項目、any_tags はいずれかを持つ項目
        condition: 'D-1: `[{name: データ}]`／D-2: `[{name: 画面}]`／T-1: `[{name: データ}, {name: 画面}]`／N-1: タグ無し。`parametrize`: `tags=(データ, 画面)` / `any_tags=(データ, 画面)` / 両方 `tags=(データ,)`・`any_tags=(画面,)`'
        mock: なし
        expected: T-1 / D-1・D-2・T-1 / T-1
      - name: test_search_items_when_tag_normalized
        case: 正常
        summary: 全角・大文字の違うタグでも当たる
        condition: 'D-1: `[{name: API}]`／D-2: `[{name: ａｐｉ}]`／D-3: `[{name: データ}]`。`tags=(api,)`'
        mock: なし
        expected: D-1・D-2（`item` の `tags` は書いたときの表記のまま）
      - name: test_search_items_when_main_tag_first
        case: 正常
        summary: 渡したタグを主題として持つ項目を先に並べ、それぞれの中は種類の順・連番の順
        condition: 'D-1: `[{name: データ}]`／D-2: `[{name: データ, main: true}]`／T-1: `[{name: ﾃﾞｰﾀ, main: true}, {name: 画面}]`／T-2: `[{name: 画面, main: true}]`。`parametrize`: `tags=(データ,)` / `any_tags=(データ, 画面)` / 条件なし'
        mock: なし
        expected: D-2・T-1・D-1 / D-2・T-1・T-2・D-1 / D-1・D-2・T-1・T-2
      - name: test_search_items_when_chars
        case: 正常
        summary: 各項目に `item_chars` の文字数を添える
        condition: 本文 `D-1.md` を持つ D-1 と、本文の無い N-1
        mock: なし
        expected: D-1 の `chars` が `item_chars(workspace, D-1)`、N-1 の `chars` が `item_chars(workspace, N-1)`
  - name: _contains_text
    title: 文字の包含
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: internal
    summary: 値の中の文字列（配列・辞書の値をたどる）に文字が含まれるか
    args:
      - name: value
        type: Any
        required: true
        passing: positional
        description: 項目の値
      - name: needle
        type: str
        required: true
        passing: positional
        description: 小文字にした探す文字
    returns:
      type: bool
      description: 含まれれば真
    process: |-
      1. 文字列なら小文字にして `needle` を含むかを返す
      2. 配列は要素、辞書は値をたどり、どれかが真なら真（辞書のキーは見ない）
      3. それ以外は偽
    unit_tests:
      - name: test_contains_text
        case: 正常
        summary: 入れ子の値をたどり、キーと数値は見ない
        condition: '`parametrize`: `{"a": ["Schema"]}` と `schema` / `{"schema": 1}` と `schema` / `3` と `3`'
        mock: なし
        expected: 真 / 偽 / 偽
  - name: parse_attr
    title: 属性の条件の解釈
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: '`--attr` の `名前=値`・`名前` を名前と値に分ける'
    args:
      - name: text
        type: str
        required: true
        passing: positional
        description: '`--attr` の値'
    returns:
      type: tuple[str, str | None]
      description: 名前と値（`=` が無ければ値は `None`）
    process: 1. 最初の `=` で分ける（無ければ値は `None`）
    unit_tests:
      - name: test_parse_attr
        case: 正常
        summary: 名前と値に分ける
        condition: '`parametrize`: `担当=自分` / `担当` / `式=a=b`'
        mock: なし
        expected: '`(担当, 自分)` / `(担当, None)` / `(式, a=b)`'
  - name: show_item
    title: 項目の表示
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 1 項目の全てのキー・種類・本文・参照元をまとめる
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: item_id
        type: str
        required: true
        passing: positional
        description: ID
    returns:
      type: dict[str, Any]
      description: '`{item, kind, body_markdown, body_html, body_format, referenced_by}`'
    process: |-
      1. 項目を引く（項目の引き当て。`find_item`）
      2. `body` があれば本文を読み（本文の読み込み。`read_body`）、形式（`body_format`）が `markdown` なら `body_markdown`、`html` なら `body_html` に入れる（もう片方は `None`）
      3. 参照元を引く（`list_referrers`）
    exceptions:
      - name: ItemNotFoundError
        condition: ID の項目が無い（`find_item` から伝わる）
    unit_tests:
      - name: test_show_item
        case: 正常
        summary: 中身・本文・参照元をまとめる
        condition: 'D-1（`body: D-1.md`、`docs/D-1.md` あり）・D-2 `depends_on: [D-1]`・`related: [D-1]`・T-1 `for: [D-1]`'
        mock: なし
        expected: '`kind: decision`、`body_markdown` が本文、`referenced_by` が `[D-2 depends_on, D-2 related, T-1 for]`'
      - name: test_show_item_when_body_missing
        case: 正常
        summary: 本文を持たない項目は body_markdown が None
        condition: '`body` を持たない D-1'
        mock: なし
        expected: '`body_markdown` が `None`'
      - name: test_show_item_when_html_body
        case: 正常
        summary: HTML の本文は `body_html` と形式で返す
        condition: 'A-1（`body: A-1.html`、`docs/A-1.html` あり）'
        expected: '`body_html` がファイルの中身、`body_format` が `html`、`body_markdown` が `None`'
        mock: なし
  - name: list_referrers
    title: 参照元の一覧
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: その ID を `REFERENCE_KEYS` のどれかで指す項目を、キーごとに 1 行で返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: item_id
        type: str
        required: true
        passing: positional
        description: ID
    returns:
      type: list[dict[str, str]]
      description: '`{id, key}` の並び（種類の順 → 連番の順 → `REFERENCE_KEYS` の順）'
    process: |-
      1. 全ての項目の `REFERENCE_KEYS` を見て、値（`parent` は文字列、ほかは配列）に ID を含むものを拾う
         - 同じ項目が複数のキーで指す場合、キーごとに行を分ける
    unit_tests:
      - name: test_list_referrers
        case: 正常
        summary: parent・sources を含む全ての参照のキーを拾い、キーごとに行を分ける
        condition: 'L-1 を指す D-1 `sources: [L-1]`・D-2 `related: [L-1]`、D-1 を指す D-3 `parent: D-1`'
        mock: なし
        expected: L-1 に対して `[D-1 sources, D-2 related]`、D-1 に対して `[D-3 parent]`
  - name: list_attrs
    title: 属性名の一覧
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 全ての項目の `attrs` の名前ごとに、持つ項目の数と種類を数える
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: list[dict[str, Any]]
      description: '`{name, count, kinds}` の並び（名前の順。`kinds` は `KINDS` の順で重なりなし）'
    process: |-
      1. 全ての項目の `attrs` のキーごとに件数と種類を数える
      2. 名前の順に並べる
    unit_tests:
      - name: test_list_attrs
        case: 正常
        summary: 種類をまたいで数える
        condition: 'D-1・D-2: `担当`／T-1: `期限`・`担当`'
        mock: なし
        expected: '`担当`（3・`[decision, task]`）・`期限`（1・`[task]`）'
      - name: test_list_attrs_when_none
        case: 正常
        summary: 属性が無ければ空
        condition: '`attrs` を持たない D-1 だけ'
        mock: なし
        expected: 空の並び
  - name: list_tags
    title: タグの一覧
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 項目とスレッドが使っているタグを、正規化した表記ごとに持つ数と種類を数える
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: thread_tags
        type: list[list[str]]
        required: true
        passing: positional
        description: スレッドごとの `tags`（呼ぶ側が `load_threads` で読んで渡す）
    returns:
      type: list[dict[str, Any]]
      description: '`{name, count, kinds}` の並び（件数の多い順、同じ件数は名前の順。`kinds` は `KINDS` の順で、スレッドは最後の `thread`。重なりなし。タグが無ければ空）。インターフェース定義『タグの一覧』の `tags`'
    process: |-
      1. 全ての項目の `tags` の名前（`tag_name`。主題かどうかによらない）と `thread_tags` の文字列を `normalize_tag` でそろえ、項目かスレッドごとに重なりを除いてから、そろえた表記ごとに件数と種類（スレッドは `thread`）を数える（名前を取れない要素は飛ばす）
      2. 件数の多い順、同じ件数は名前の順に `{name, count, kinds}` を並べる
    unit_tests:
      - name: test_list_tags
        case: 正常
        summary: 表記の違いをまとめ、種類とスレッドをまたいで件数の多い順に並べる
        condition: 'D-1: `[{name: API, main: true}]`／D-2: `[{name: 画面}]`／T-1: `[{name: ａｐｉ}]`／N-1: タグ無し。`thread_tags=[[api, 画面]]`'
        mock: なし
        expected: '`api`（3・`[decision, task, thread]`）・`画面`（2・`[decision, thread]`）の順'
      - name: test_list_tags_when_duplicated
        case: 正常
        summary: 1 つの項目が同じタグを表記を変えて 2 回持っても 1 件と数える
        condition: 'D-1: `[{name: データ}, {name: ﾃﾞｰﾀ}]`。`thread_tags=[]`'
        mock: なし
        expected: '`データ`（1・`[decision]`）だけ'
      - name: test_list_tags_when_none
        case: 正常
        summary: タグが無ければ空
        condition: タグを持たない D-1 だけ。`thread_tags=[[]]`
        mock: なし
        expected: 空の並び
  - name: page_results
    title: ページ分け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 検索結果を続きの値の位置から件数だけ切り出し、全体の件数・次の続きの値・絞り込みの案内を添える
    args:
      - name: results
        type: Sequence[T]
        required: true
        passing: positional
        description: '`search_items` の結果（並べ終えた全件。中身は見ない）'
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 結果を作った条件（続きの値の照合と案内に使う）
      - name: limit
        type: int
        required: true
        passing: keyword
        description: 1 ページの件数（1〜`MAX_LIMIT`。確かめは呼ぶ側）
      - name: cursor
        type: str | None
        required: true
        passing: keyword
        description: 前のページの `next_cursor`（`None` なら最初のページ）
      - name: stray_tags
        type: list[tuple[str, list[str]]]
        required: false
        default: '[]'
        passing: keyword
        description: どの項目も使っていない渡したタグと近い使われているタグ（`list_stray_tags`。案内に使う）
    returns:
      type: dict[str, Any]
      description: '`{items, total, next_cursor, hint}`（`items` は切り出した `results` の要素）'
    process: |-
      1. `cursor` があれば読んだ位置を取り出す（`_decode_cursor`）。無ければ 0
      2. その位置から `limit` 件を切り出す
      3. 切り出した後ろに結果が残れば、次の位置を続きの値にする（`_encode_cursor`）。残らなければ `None`
      4. `total` は結果の全件数、`hint` は案内の文（`build_hint`。`stray_tags` を渡す）
    exceptions:
      - name: ArgumentError
        condition: '`cursor` が読めない、または今の条件と違う条件で作られた（`_decode_cursor` から伝わる）'
    unit_tests:
      - name: test_page_results
        case: 正常
        summary: 件数で切り、続きの値で残りを返す
        condition: D-1〜D-5 の結果、`limit=3`。最初のページの `next_cursor` でもう一度呼ぶ
        mock: なし
        expected: '1 回目は D-1〜D-3・`total: 5`・`next_cursor` が文字列。2 回目は D-4・D-5・`total: 5`・`next_cursor: None`'
      - name: test_page_results_when_fits
        case: 正常
        summary: 件数に収まれば続きの値も案内も無い
        condition: D-1 だけの結果、条件なし、`limit=20`
        mock: なし
        expected: '`next_cursor: None`・`hint: None`'
      - name: test_page_results_when_cursor_mismatched
        case: 異常
        summary: 違う条件の続きの値は引数の誤り
        condition: 条件なしで作った続きの値を、`kind=task` の条件で渡す
        mock: なし
        expected: '`ArgumentError`（引数 `cursor`）'
      - name: test_page_results_when_cursor_broken
        case: 異常
        summary: 読めない続きの値は引数の誤り
        condition: '`cursor="!!"`'
        mock: なし
        expected: '`ArgumentError`（引数 `cursor`）'
  - name: _encode_cursor
    title: 続きの値の組み立て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: internal
    summary: 読んだ位置と条件を、不透明な文字列にする
    args:
      - name: offset
        type: int
        required: true
        passing: positional
        description: 次のページの先頭の位置
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 条件
    returns:
      type: str
      description: 続きの値
    process: '1. 条件の指紋（`_filter_fingerprint`）と位置を `{"o": 位置, "f": 指紋}` の JSON にし、URL 安全な Base64 にする（末尾の `=` は外す）'
    unit_tests:
      - name: test_encode_cursor_round_trip
        case: 正常
        summary: 組み立てた値を同じ条件で読むと同じ位置に戻る
        condition: '`offset=20`、`kind=decision` の条件'
        mock: なし
        expected: '`_decode_cursor` が 20 を返し、文字列に `=`・`/`・`+` を含まない'
  - name: _decode_cursor
    title: 続きの値の読み取り
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: internal
    summary: 続きの値から読んだ位置を取り出し、今の条件と同じ条件で作られたかを確かめる
    args:
      - name: cursor
        type: str
        required: true
        passing: positional
        description: 続きの値
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 今の条件
    returns:
      type: int
      description: 読んだ位置（0 以上）
    process: |-
      1. 末尾の `=` を補って Base64 と JSON を解く
      2. `o` が 0 以上の整数、`f` が今の条件の指紋と同じであることを確かめる
      3. `o` を返す（結果の件数を超えていてもそのまま返し、空のページになる）
    exceptions:
      - name: ArgumentError
        condition: Base64 か JSON として読めない、`o`・`f` の形が合わない（理由 `読めない続きの値です`）、または指紋が違う（理由 `前のページと同じ条件で渡してください`）。引数の名前は `cursor`
  - name: _filter_fingerprint
    title: 条件の指紋
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: internal
    summary: 条件を短い文字列にする（同じ条件なら同じ値）
    args:
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 条件
    returns:
      type: str
      description: SHA-256 の 16 進の先頭 16 文字
    process: 1. 条件の全てのフィールドを、キーを並べた JSON（`sort_keys=True`、`ensure_ascii=False`。タプルは配列）にして SHA-256 を取る
  - name: build_hint
    title: 絞り込みの案内
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 切り詰めたときは絞り込める引数、0 件のときは外せる条件を案内する文を組み立てる
    args:
      - name: total
        type: int
        required: true
        passing: positional
        description: 全体の件数
      - name: returned
        type: int
        required: true
        passing: positional
        description: このページに返した件数
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 条件
      - name: has_next
        type: bool
        required: true
        passing: keyword
        description: 続きがあるか
      - name: stray_tags
        type: list[tuple[str, list[str]]]
        required: false
        default: '[]'
        passing: keyword
        description: どの項目も使っていない渡したタグと近い使われているタグ
    returns:
      type: str | None
      description: 案内の文。どちらにも当たらないときは `None`
    process: |-
      1. `total` が 0 で条件を 1 つ以上渡していれば、渡した条件の引数の名前を並べ、`合う項目がありません。{引数を・でつないだもの} のどれかを外して探してください` を返す（`attrs` は引数名 `attr` で並べる）
         - `stray_tags` があれば、タグごとに ` {タグ} はどの項目も使っていないタグです（近いタグ: {近いタグを・でつないだもの}）` を続ける（近いタグが無ければ `（近いタグなし）`）
      2. `has_next` が真なら、`NARROWING_ARGUMENTS` のうちまだ渡していない引数を並べ、`全 {total} 件のうち {returned} 件を返しました。{引数を・でつないだもの} で絞るか、next_cursor で続きを読んでください` を返す（渡していない引数が無ければ `next_cursor で続きを読んでください` だけ）
      3. どちらでもなければ `None`
    unit_tests:
      - name: test_build_hint_when_truncated
        case: 正常
        summary: 切り詰めたときは、渡していない絞り込みの引数を並べる
        condition: '`total=45`・`returned=20`・`has_next=True`、条件 `kind=decision`'
        mock: なし
        expected: '`45` と `20`・`tags`・`status`・`next_cursor` を含み、`kind` を含まない'
      - name: test_build_hint_when_empty
        case: 正常
        summary: 0 件のときは、渡した条件の引数を並べる
        condition: '`total=0`・`returned=0`・`has_next=False`、条件 `kind=decision`・`tags=(保留,)`'
        mock: なし
        expected: '`kind` と `tags` を含む'
      - name: test_build_hint_when_none
        case: 正常
        summary: 収まったときと、条件なしで 0 件のときは案内しない
        condition: '`parametrize`: `total=3`・`returned=3`・`has_next=False` / `total=0`・条件なし'
        mock: なし
        expected: '`None` / `None`'
      - name: test_build_hint_when_stray_tag
        case: 正常
        summary: 0 件でどの項目も使っていないタグは、近いタグを案内する
        condition: '`total=0`・`returned=0`・`has_next=False`、条件 `tags=(データー,)`、`stray_tags=[(データー, [データ])]`'
        mock: なし
        expected: '`tags` と `データー はどの項目も使っていないタグです（近いタグ: データ）` を含む'
  - name: list_stray_tags
    title: どこにも無いタグ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 条件の `tags`・`any_tags` のうち、どの項目も使っていないタグを、近い使われているタグを添えて返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: search_filter
        type: SearchFilter
        required: true
        passing: positional
        description: 条件
    returns:
      type: list[tuple[str, list[str]]]
      description: （タグ, 近い使われているタグ）の並び（タグは渡した表記、近いタグは正規化した表記。`tags` → `any_tags` の渡した順で、正規化して重なりなし。無ければ空）
    process: |-
      1. 全ての項目の `tags` の名前（`tag_name`）を `normalize_tag` でそろえて集める
      2. `tags`・`any_tags` を渡した順に見て、そろえた表記が 1 で集めたタグに無いタグを重ならないように拾い、それぞれに近い使われているタグ（`similar_tags`）を添える
    unit_tests:
      - name: test_list_stray_tags
        case: 正常
        summary: 項目が使うタグは表記が違っても除き、どの項目も使っていないタグだけを返す
        condition: 'D-1: `[{name: データ}, {name: API}]`。条件 `tags=(ａｐｉ, データー)`・`any_tags=(データ, データー)`'
        mock: なし
        expected: '`[(データー, [データ])]`'
  - name: item_chars
    title: 項目の文字数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 項目を YAML に書き出した文字数と、本文のファイルの文字数の和を返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 項目
    returns:
      type: int
      description: 文字数（コードポイントで数える）
    process: |-
      1. 項目を `dump_yaml` で YAML の文字列にし、その長さを数える
      2. `body` が文字列で `read_body` が中身を返せば、その長さを加える（本文が無い・読めないときは加えない）
    unit_tests:
      - name: test_item_chars
        case: 正常
        summary: YAML の文字数に本文の文字数を加える
        condition: '`parametrize`: 本文 `D-1.md`（`あいう` の 3 文字）を持つ D-1 / 本文を持たない N-1 / `body: D-9.md` を持つが本文のファイルが無い D-9'
        mock: なし
        expected: '`len(dump_yaml(D-1)) + 3` / `len(dump_yaml(N-1))` / `len(dump_yaml(D-9))`'
  - name: resolve_fields
    title: 返す項目の決定
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: '`view` の項目に `include` を加え、`exclude` を外した名前を `FIELD_NAMES` の順で返す'
    args:
      - name: view
        type: Literal["brief", "standard", "full"]
        required: true
        passing: positional
        description: 返す量
      - name: include
        type: Sequence[str]
        required: true
        passing: keyword
        description: 加える名前（型の確かめは呼ぶ側）
      - name: exclude
        type: Sequence[str]
        required: true
        passing: keyword
        description: 外す名前
    returns:
      type: tuple[str, ...]
      description: 返す項目の名前（`FIELD_NAMES` の順）
    process: |-
      1. `include` と `exclude` に同じ名前があれば `ArgumentError` を送る
      2. `VIEW_FIELDS[view]` と `include` の和から `exclude` を除き、`FIELD_NAMES` の順に並べる
    exceptions:
      - name: ArgumentError
        condition: '`include` と `exclude` に同じ名前を渡した（引数の名前は `include`。理由に `exclude` と重なった名前を書く）'
    unit_tests:
      - name: test_resolve_fields
        case: 正常
        summary: 返す量に加え・外した名前を決まった順で返す
        condition: '`parametrize`: `brief` / `standard`・`include=[body]`・`exclude=[tags]` / `full`・`exclude=[extra, body]`'
        mock: なし
        expected: '`(title, status, tags, chars)` / `(title, status, chars, target, category, phase, attrs, updated, body)` / `(title, status, tags, chars, target, category, phase, attrs, updated)`'
      - name: test_resolve_fields_when_overlapped
        case: 異常
        summary: include と exclude に同じ名前は引数の誤り
        condition: '`brief`・`include=[attrs]`・`exclude=[attrs]`'
        mock: なし
        expected: '`ArgumentError`（引数 `include`。理由に `exclude` と `attrs`）'
  - name: build_row
    title: 結果の行
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 当たった項目を、選んだ項目の名前だけを持つ結果の 1 行にする
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース（本文を読む）
      - name: hit
        type: SearchHit
        required: true
        passing: positional
        description: 当たった項目
      - name: fields
        type: tuple[str, ...]
        required: true
        passing: positional
        description: 返す項目の名前（`resolve_fields`）
    returns:
      type: dict[str, Any]
      description: '`id`・`kind` と `fields` の順の名前を持つ辞書（インターフェース定義『項目の検索』の `items[]`）'
    process: |-
      1. `id`・`kind` を入れる
      2. `fields` の順に値を入れる。`title`・`status`・`target`・`category`・`phase`・`updated` は項目の値（無ければ `None`）、`tags` は項目の並び（無ければ空の並び）、`attrs` は辞書（無ければ空の辞書）、`chars` は `hit.chars`、`extra` は `NAMED_ITEM_KEYS` に無いキーとその値の辞書、`body` は `read_body` の中身（`body` が無いか読めなければ `None`）と `body_format` の値を `body`・`body_format` に入れる
    unit_tests:
      - name: test_build_row
        case: 正常
        summary: 選んだ名前だけを決まった中身で入れる
        condition: '案 A・B・`depends_on: [D-2]`・属性・本文 `D-1.md` を持つ D-1。`parametrize`: `(title, status, tags, chars)` / `(target, attrs, extra, body)` / 本文の無い N-1 を `(body,)`'
        mock: なし
        expected: '`id`・`kind`・`title`・`status`・`tags`・`chars` だけ / `id`・`kind`・`target`・`attrs`・`extra`（`options`・`depends_on` を持ち `title` を持たない）・`body`（`D-1.md` の中身）・`body_format: markdown` / `body: None`・`body_format: None`'
  - name: count_tags
    title: 結果のタグの件数
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: 当たった項目が使っているタグを、正規化した表記ごとに数える
    args:
      - name: hits
        type: Sequence[SearchHit]
        required: true
        passing: positional
        description: 当たった全ての項目
    returns:
      type: list[dict[str, Any]]
      description: '`{tag, count}` の並び（件数の多い順、同じ件数は名前の順）。インターフェース定義『項目の検索』の `tag_counts`'
    process: |-
      1. 項目ごとに `tags` の名前を `normalize_tag` でそろえて重なりを除き、そろえた表記ごとに件数を数える（主題かどうかによらない）
      2. 件数の多い順、同じ件数は名前の順に並べる
    unit_tests:
      - name: test_count_tags
        case: 正常
        summary: 表記の違いをまとめ、件数の多い順に並べる
        condition: 'D-1: `[{name: データ, main: true}, {name: 画面}]`／D-2: `[{name: ﾃﾞｰﾀ}]`／N-1: タグ無し'
        mock: なし
        expected: '`[{tag: データ, count: 2}, {tag: 画面, count: 1}]`'
  - name: render_find_markdown
    title: 検索の結果の Markdown
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/query.py
    usecase: 記録の検索
    scope: public
    summary: '`find` の結果の辞書を、インターフェース定義『項目の検索』の制約「Markdown の形」の本文にする'
    args:
      - name: result
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`run_find` の出力（`count_only` のときは `total`・`total_chars`・`tag_counts` だけ）'
    returns:
      type: str
      description: Markdown の本文
    process: |-
      1. 先頭の行に `全 {total} 件・合計 {total_chars} 文字` を置く
      2. `tag_counts` を持つときは、`タグ`・`件数` の表を続けて返す
      3. 項目があれば表を置く。列は 1 件目の行のキーの並びから `extra`・`body`・`body_format` を除いたもの。タグは名前を `、` で区切り、主題のタグは `{名前} [main]`。属性は `名前=値` を `、` で区切る。`None` は空のセル。セルの `|` と改行はエスケープする
      4. 行が `extra`・`body` を持つときは、表の後に項目ごとに `## {id} {title}` のセクションを置き、`extra` を YAML のコードブロック（`dump_yaml`）で、本文をそのまま続ける
      5. 末尾に `next_cursor: {値}`（`None` でないとき）、`hint` の文（`None` でないとき）、`omitted` が空でなければ `省いた項目: {名前を・でつなぐ}（view か include で取れる）` の行を置く
    unit_tests:
      - name: test_render_find_markdown
        case: 正常
        summary: 件数の行・表・省いた項目の行を書く
        condition: 'D-1（`tags: [{name: データ, main: true}, {name: 画面}]`）・D-2 の 2 件、`total: 2`・`total_chars: 300`・`next_cursor: None`・`hint: None`・`omitted: [target, extra]`'
        mock: なし
        expected: '1 行目が `全 2 件・合計 300 文字`、表の見出しが `id`・`kind`・`title`・`status`・`tags`・`chars`、D-1 の行のタグが `データ [main]、画面`、末尾が `省いた項目: target・extra（view か include で取れる）`'
      - name: test_render_find_markdown_when_body
        case: 正常
        summary: extra と本文は表の後のセクションに書く
        condition: "`extra: {options: [...]}`・`body: '# 本文'`・`body_format: markdown` を持つ D-1 の 1 件、`next_cursor: abc`・`hint: 続きを読んでください`・`omitted: []`"
        mock: なし
        expected: '表に `extra`・`body`・`body_format` の列が無く、`## D-1 {title}` の後に `options` を持つ YAML のコードブロックと `# 本文` が続き、末尾に `next_cursor: abc` と hint の行があり、省いた項目の行が無い'
      - name: test_render_find_markdown_when_count_only
        case: 正常
        summary: 件数だけのときは先頭の行とタグの件数の表だけ
        condition: '`total: 2`・`total_chars: 300`・`tag_counts: [{tag: データ, count: 2}, {tag: 画面, count: 1}]`'
        mock: なし
        expected: '`全 2 件・合計 300 文字` の後に `タグ`・`件数` の表（`データ`・2、`画面`・1）だけ'
test_files:
  - tests/unit/scripts/test_query.py

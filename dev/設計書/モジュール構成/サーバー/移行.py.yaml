        expected: '`WriteFailedError`。`mindmap.yaml` が呼ぶ前と同じで `.tmp` のファイルが無い'
        exception: 置き換えで OSError
  - name: record_version
    title: 版を書く
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/migrator.py
    usecase: 記録の形式の移行
    scope: public
    summary: ワークスペースを点検し、スキーマに合えば版のファイルを書く
    side_effects: '`mindstella-version.ini` を書く'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 'ワークスペース（`workspace`）'
      - name: to_version
        type: Version | None
        required: false
        default: None
        passing: keyword
        description: '`to_version`（`None` ならプラグインの版）'
    returns:
      type: Version

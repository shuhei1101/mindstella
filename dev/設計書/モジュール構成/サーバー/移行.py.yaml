        mock: なし
        expected: 例外にならない / 例外にならない / `WorkspaceNotFoundError`
  - name: renamed_file
    title: 改めた先のファイル名
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/migrator.py
    usecase: 記録の形式の移行
    scope: public
    summary: ファイル名を、その後に並ぶ `rename_file` を順に辿った先の名前にする（値が要るキーを、全ての手順を当てた後の名前で返すため）
    args:
      - name: file

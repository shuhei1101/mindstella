    process: |-
      1. ワークスペースの版が `to` より新しければ `WorkspaceNewerError` を送る
      2. ワークスペースを読み、検証する（`load_workspace`・`validate_workspace`）
         - 問題がある場合、`SchemaMismatchError` を送る（`build_mismatch_error`。版のファイルを書かない）
      3. 版を書く（`write_workspace_version`）
    exceptions:
      - name: WorkspaceNewerError

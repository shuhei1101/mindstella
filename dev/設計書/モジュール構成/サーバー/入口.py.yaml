  - name: main
    title: 入口
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: MCP サーバーを組み立てて stdio で動かし、標準入力が閉じたら配信を止めて終える
    description: 末尾で `sys.exit(main())`。
    side_effects: 標準入力・標準出力で MCP をやり取りし、記録を標準エラーに書く
    args:
      - name: build
        type: Callable[..., MCPServer]
        required: false
        default: build_server
        passing: injected
        description: MCP サーバーを組み立てる関数
    returns:
      type: int
      description: 終了コード（標準入力が閉じて終えたら 0）
    process: |-
      1. `logging` の出力先を標準エラーにする
      2. プロセスの中の書き換えの鍵（`threading.Lock()`）と配信の台帳（`PreviewRegistry`）を作る
      3. サーバーを組み立て（`build_server`。`cwd` は `Path.cwd()`）、`run("stdio")` で動かす
      4. `run` が戻ったら（例外で戻ったときも）、立てた配信を止める（`PreviewRegistry.stop_all`）
      5. 0 を返す
    unit_tests:
      - name: test_main
        case: 正常
        summary: サーバーが戻ったら配信を止めて 0
        condition: '`build` を、`run` がすぐ戻る偽のサーバーを返す関数に差し替える。受け取った `previews` を控える'
        mock: '`build`'
        expected: 0 を返し、`run` が `"stdio"` で 1 回呼ばれ、控えた `previews.stop_all` が呼ばれている
      - name: test_main_when_server_raises
        case: 正常
        summary: サーバーが例外で戻っても配信を止める
        condition: '`run` が `RuntimeError` を送る偽のサーバー'
        mock: '`build`'
        expected: '`RuntimeError` が伝わり、`previews.stop_all` が呼ばれている'
  - name: build_server
    title: サーバーの組み立て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: '`TOOL_NAMES` のツールを登録した `MCPServer` を作る'
    args:
      - name: previews
        type: PreviewRegistry
        required: true
        passing: keyword
        description: 配信の台帳（`preview_url` が使う）
      - name: write_lock
        type: threading.Lock
        required: true
        passing: keyword
        description: プロセスの中の書き換えの鍵（配信の送信の受け付けと同じもの）
      - name: cwd
        type: Path
        required: true
        passing: keyword
        description: 相対パスの `workspace`・`out` を読む基準（サーバーの作業フォルダ）
    returns:
      type: MCPServer
      description: 名前が `SERVER_NAME` で、ツールを `TOOL_NAMES` の順に持つサーバー
    process: |-
      1. `MCPServer(SERVER_NAME)` を作る
      2. ツールごとに、インターフェース定義のリクエストと同じ名前・型の引数を持つ関数を `@server.tool(name=...)` で登録する（ツールの説明はインターフェース定義の冒頭リード）
         - 各関数は `workspace` を絶対パスにし（`resolve_workspace`）、ツールの処理を呼んで結果にする（`call_tool`、`run_{ツール}`）
         - ワークスペースを書き換えるツール（`init`・`add`・`update`・`update_settings`・`adopt`・`edit_option`・`batch`・`changes_since_read`・`clear_release`・`take_submission` と、`plan` でない `migrate`）は、`call_tool` に `lock_root` を渡す。`init` だけ `lock_create=True` も渡す
      3. サーバーを返す
    unit_tests:
      - name: test_build_server
        case: 正常
        summary: 全てのツールを workspace つきで登録する
        condition: 空の `PreviewRegistry` と `tmp_path`。作ったサーバーの `list_tools()` を呼ぶ
        mock: なし
        expected: ツールの名前が `TOOL_NAMES` と一致し、どれも入力のスキーマの `required` に `workspace` を持つ
      - name: test_build_server_when_relative_workspace
        case: 正常
        summary: 相対パスの workspace を作業フォルダから読む
        condition: '`cwd=tmp_path`、`tmp_path / "ws"` に作成済みのワークスペース。`call_tool("attrs", {"workspace": "ws"})`'
        mock: なし
        expected: '結果の `is_error` が偽で、`structured_content` が `{"attrs": []}`'
  - name: call_tool
    title: ツールの呼び出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: ツールの処理を呼び、結果を構造化の結果に、エラーをツールのエラーにする
    description: 例外を送って SDK に任せると本文の頭に `Error executing tool` が付くため、ここで全ての例外を `CallToolResult` にする（インターフェース定義『MCP サーバーの起動』の結果の組み立て）。
    args:
      - name: handler
        type: Callable[[], dict[str, Any]]
        required: true
        passing: positional
        description: 引数を渡し終えたツールの処理
      - name: write_lock
        type: threading.Lock
        required: true
        passing: keyword
        description: プロセスの中の書き換えの鍵
      - name: lock_root
        type: Path | None
        required: false
        default: None
        passing: keyword
        description: 書き換えるワークスペース。渡したときだけ鍵とロックを取る
      - name: lock_create
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 鍵を取るとき、まだ無いワークスペースのフォルダを作るか（`init` だけ真。`workspace_lock` の `create`）
    returns:
      type: CallToolResult
      description: 成功は `ok_result`、エラーは `error_result` の結果
    process: |-
      1. `lock_root` がある場合、ワークスペースの鍵を取ってから（`workspace_lock`、`create=lock_create`）、無い場合はそのまま `handler()` を呼ぶ。鍵を取るときの `WorkspaceNotFoundError` も 2 の `MindmapError` として扱う
      2. 結果を分ける
         - 辞書が返った場合、それを結果にする（`ok_result`）
         - `MindmapError` を捕まえた場合、ツールのエラーにする（`error_result`）
         - それ以外の例外を捕まえた場合、トレースバックを記録し、`UNEXPECTED_ERROR` の文言の `MindmapError` としてツールのエラーにする
           - `[ERROR]` ツールの予期しないエラー（例外のトレースバック）
    unit_tests:
      - name: test_call_tool
        case: 正常
        summary: 辞書を結果にする
        condition: '`handler` が `{"id": "D-1"}` を返す'
        mock: なし
        expected: '`is_error` が偽、`structured_content` が `{"id": "D-1"}`'
      - name: test_call_tool_when_mindmap_error
        case: 正常
        summary: MindmapError はツールのエラー
        condition: '`handler` が `WorkspaceNotFoundError` を送る'
        mock: なし
        expected: '`is_error` が真で、本文が `エラー: ` で始まる'
      - name: test_call_tool_when_unexpected_error
        case: 正常
        summary: 予期しない例外もトレースバックを出さずツールのエラー
        condition: '`handler` が `KeyError("x")` を送る'
        mock: なし
        expected: '`is_error` が真で、本文が `エラー: 予期しないエラー（KeyError）` で始まり `Traceback` を含まない'
      - name: test_call_tool_when_lock_root
        case: 正常
        summary: 書き換えるツールは鍵を取って呼ぶ
        condition: '`config.yaml` を置いた `tmp_path` を `lock_root` に渡す。`handler` は呼ばれたときに `write_lock.locked()` を控える'
        mock: なし
        expected: 控えた値が真で、呼んだ後は鍵が外れている。`tmp_path / ".mindstella.lock"` がある
  - name: ok_result
    title: 成功の結果
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: 辞書を、構造化の結果と同じ JSON の本文を持つ `CallToolResult` にする
    args:
      - name: payload
        type: dict[str, Any]
        required: true
        passing: positional
        description: ツールの処理が返した辞書
    returns:
      type: CallToolResult
      description: '`structured_content` が `payload`、`content` が `json.dumps(payload, ensure_ascii=False)` の文字列 1 つ'
    process: 1. `payload` を `ensure_ascii=False` で JSON の文字列にし、`TextContent` と `structured_content` に入れた結果を返す
    unit_tests:
      - name: test_ok_result
        case: 正常
        summary: 日本語をエスケープしない本文と構造化の結果
        condition: '`{"title": "問い"}`'
        mock: なし
        expected: '`structured_content` がその辞書、本文が `{"title": "問い"}`'
  - name: error_result
    title: エラーの結果
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    scope: public
    summary: '`MindmapError` を、`エラー: {内容}` で始まる本文のツールのエラーにする'
    args:
      - name: error
        type: MindmapError
        required: true
        passing: positional
        description: 送られた例外
    returns:
      type: CallToolResult
      description: '`is_error` が真で、本文がエラーの行を改行でつないだ文字列 1 つ'
    process: |-
      1. 1 行目を `エラー: {メッセージ}` にし、`lines` を持つ例外はその行を続ける
         - `SchemaMismatchError` で `legacy` が真の場合、最後に `LEGACY_HINT` の 1 行を続ける
      2. `is_error=True` の結果を返す
    unit_tests:
      - name: test_error_result
        case: 正常
        summary: 合わない箇所の行を続ける
        condition: '`SchemaMismatchError(lines=["decisions.yaml: items[0].status: 理由"])`'

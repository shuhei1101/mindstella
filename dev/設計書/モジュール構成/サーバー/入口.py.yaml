  - name: run_migrate
    title: migrate の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の形式の移行
    scope: public
    summary: '`plan`・`values`・`record` で分けて移し替えの処理を呼び、結果を出力の形にする'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: plan
        type: bool
        required: true
        passing: keyword
        description: '`plan`'
      - name: record
        type: bool
        required: true
        passing: keyword
        description: '`record`'
      - name: values
        type: list[dict[str, Any]] | None
        required: true
        passing: keyword
        description: '`values`（`{file, key, value}` の並び）'
      - name: from_version
        type: str | None
        required: true
        passing: keyword
        description: '`from_version`'
      - name: to_version
        type: str | None
        required: true
        passing: keyword
        description: '`to_version`'
    returns:
      type: dict[str, Any]
      description: インターフェース定義『記録の形式の移行』のレスポンス
    process: |-
      1. 引数を確かめる。合わなければ、その引数の名前を持った `ArgumentError` を送る
         - `plan`・`record`・`values` の 2 つ以上を渡した場合
         - `from_version`・`to_version` が版の形でない場合（`parse_release_version` が送る `ValueError`）、または `to_version` が `from_version` より前の場合
         - `values` の要素が `file`・`key`・`value` を文字列で持たない場合
      2. `plan` なら手順を並べる（`plan_migration`）、`values` があれば `(file, key, value)` の組にして値を入れてから並べ直し（`set_values`・`plan_migration`。`steps` は空にする）、`record` なら版を書いてから並べ直す（`record_version`・`plan_migration`。`steps` は空にし `recorded` を添える）。どれでもなければ手順を当てる（`apply_migration`）
      3. `MigrationReport` を出力の辞書にする（版は `str()`、手順は `{version, index, op, destructive: op が DESTRUCTIVE_OPS にあるか, summary: describe_step}`、`needs_values`・`backup` は `asdict`）
    unit_tests:
      - name: test_run_migrate
        case: 正常
        summary: 手順を並べて出力の形にする
        condition: '版のファイルと `summary` を持たず A-1（`done: true`）を持つワークスペース、`plan=True`'
        mock: '`read_plugin_version`（`v0.3.0`）'
        expected: '`workspace_version` が `null`、`plugin_version` が `"v0.3.0"`、`relation` が `older`、`steps` の先頭が `{version: "v0.3.0", index: 1, op: rename_key, destructive: false, summary: ...}`、`needs_values` に `summary`、`backup` が `null`'
      - name: test_run_migrate_when_values
        case: 正常
        summary: values の値を入れて並べ直す
        condition: '手順を当てた後の `summary` を持たないワークスペース、`values=[{file: config.yaml, key: summary, value: 題名}]`'
        mock: '`read_plugin_version`（`v0.3.0`）'
        expected: '`steps` と `needs_values` が空で、`config.yaml` の `summary` が `題名`'
      - name: test_run_migrate_when_argument_invalid
        case: 異常
        summary: 一緒に使わない引数・版の形の誤り・形の違う values
        condition: '`parametrize`: `plan=True, record=True` / `to_version="0.3"` / `from_version="v0.3.0", to_version="v0.2.0"` / `values=[{file: config.yaml}]`'
        mock: なし
        expected: '`ArgumentError`（メッセージに `plan` / `to_version` / `to_version` / `values`）。ワークスペースを書き換えていない'
        exception: 引数の誤り
    exceptions:
      - name: ArgumentError
        condition: 一緒に使わない引数を渡した・版の形が違う・`to_version` が `from_version` より前・`values` の形が違う
        message: '引数の誤り: {引数の名前}: {理由}'

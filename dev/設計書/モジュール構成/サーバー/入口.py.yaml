title: "サーバー / 入口"
lead: MCP サーバー `mindstella` にツールを登録し、ツールの引数を各機能へ渡して、結果を構造化の結果・エラーをツールのエラーにする。プレビューの配信も同じプロセスに立てる。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    server.py     入口（MCP サーバーの組み立て・ツールの登録・結果とエラー・書き換えの鍵）
    commands.py   ツールごとの処理（引数 → 各機能 → 結果の辞書）
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 入口
        class ツールの処理
        class 配信
        class 送信
        class コメント
        class 読み書きと検証
        class 検索
        class 依存と影響
        class 点検
        class ビルド
        class 移行
        class 設定の更新
        入口 --> ツールの処理 : ツールごとに呼ぶ
        入口 --> 読み書きと検証 : 書き換えの鍵
        入口 --> 配信 : 終わるときに止める
        ツールの処理 --> 配信 : preview_url
        ツールの処理 --> 送信
        ツールの処理 --> 読み書きと検証
        ツールの処理 --> 検索
        ツールの処理 --> 依存と影響
        ツールの処理 --> 点検
        ツールの処理 --> ビルド
        ツールの処理 --> 移行
        ツールの処理 --> 設定の更新 : update_settings
        配信 --> ビルド : 雛形と記録
        配信 --> コメント : /api/comments・/api/drafts
        コメント --> 送信 : まとめて送る
      ```
constants:
  - name: RESERVED_KEYS
    title: スクリプトが付けるキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`item` で渡させないキー'
    value: ("id", "created", "updated", "body", "history", "history_dropped_seq", "seq", "added_seq")
  - name: BODY_INPUT_KEY
    title: 本文を渡すキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`item` で本文の Markdown を渡すキー（YAML には残さない）'
    value: '"body_markdown"'
  - name: SERVER_NAME
    title: サーバーの名前
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    summary: MCP サーバーの名前。Claude Code の中のツールの名前は `mcp__mindstella__{ツール}` になる
    value: '"mindstella"'
  - name: TOOL_NAMES
    title: ツールの名前
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    summary: 登録するツールの名前の並び（インターフェース定義『MCP サーバーの起動』のツール）
    value: ("init", "add", "update", "update_settings", "adopt", "edit_option", "batch", "changes_since_read", "commit", "pending", "status", "next", "impact", "find", "show", "attrs", "tags", "check", "goal", "migrate", "clear_release", "export", "preview_url", "submissions", "take_submission")
  - name: UNEXPECTED_ERROR
    title: 予期しないエラーの文言
    container: plugins/mindstella/skills/mindmap/scripts/server.py
    usecase: 共通
    summary: '`MindmapError` でない例外をツールのエラーにするときの文言（`{type}` は例外のクラス名）'
    value: '"予期しないエラー（{type}）: {message}"'
  - name: OPTION_KEYS
    title: 案で渡せるキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 検討事項の案の編集
    summary: '`edit_option` の `option` に渡せるキー'
    value: ("content", "pros", "cons", "note", "reason")
  - name: REF_KEYS
    title: 参照のキー
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    summary: '`batch` が `$番号` を置き換えるキー'
    value: ("parent", "depends_on", "for", "related", "sources")
functions:
  - name: validate_input_keys
    title: 渡せないキーの確認
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: ツールが付けるキーと、本文を持てない種類への `body_markdown` を弾く
    args:
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: 種類
      - name: data
        type: dict[str, Any]
        required: true
        passing: positional
        description: ツールの `item`
    process: |-
      1. `RESERVED_KEYS` のキーがあれば `SchemaMismatchError`（`item: {キー}: ツールが付けるキーです`）を送る
      2. `body_markdown` があり、`KINDS[kind].has_body` が偽なら `SchemaMismatchError` を送る
    exceptions:
      - name: SchemaMismatchError
        condition: '`id`・`created`・`updated`・`body` のどれかを持つ'
      - name: SchemaMismatchError
        condition: 本文を持てない種類に `body_markdown` を持つ
    unit_tests:
      - name: test_validate_input_keys
        case: 正常
        summary: 渡せるキーだけなら何もしない
        condition: '`decision` に `{"title": "t", "body_markdown": "b"}`'
        mock: なし
        expected: 例外を送らない
      - name: test_validate_input_keys_when_reserved
        case: 異常
        summary: スクリプトが付けるキーを弾く
        condition: '`parametrize`: `id` / `created` / `updated` / `body` / `history` / `history_dropped_seq`'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` にそのキー）'
        exception: スクリプトが付けるキーを持つ
      - name: test_validate_input_keys_when_body_not_allowed
        case: 異常
        summary: 本文を持てない種類への body_markdown を弾く
        condition: '`task` に `{"body_markdown": "b"}`'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `body_markdown`）'
        exception: 本文を持てない種類に body_markdown を持つ
  - name: merge_changes
    title: 変更の当てはめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 渡したキーを値ごと置き換え、`null` のキーを消した新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 元の項目（書き換えない）
      - name: changes
        type: dict[str, Any]
        required: true
        passing: positional
        description: 置き換えるキーと値（`body_markdown` を除いたもの）
    returns:
      type: tuple[dict[str, Any], list[str]]
      description: 新しい項目と、値が変わった・消えたキー（渡した順）
    process: |-
      1. 元の項目を写し、渡したキーごとに当てはめる
         - 値が `None` の場合、キーがあれば消して変わったキーに加える
         - それ以外で元の値と違う場合、置き換えて変わったキーに加える（新しいキーは末尾に足す）
    unit_tests:
      - name: test_merge_changes
        case: 正常
        summary: 置き換え・消す・同じ値を見分ける
        condition: '元 `{"id": "D-1", "status": "未決定", "weight": "大", "lead": "l"}` に `{"status": "決定済み", "weight": null, "lead": "l", "answer": "a"}`'
        mock: なし
        expected: '`{"id": "D-1", "status": "決定済み", "lead": "l", "answer": "a"}` と `[status, weight, answer]`。元の項目は変わらない'
  - name: switch_adopted
    title: 採用する案の切り替え
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 指定した記号の案だけを採用にした新しい項目を返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 検討事項（書き換えない）
      - name: key
        type: str
        required: true
        passing: positional
        description: 採用する案の記号
    returns:
      type: tuple[dict[str, Any], str | None]
      description: 新しい項目と、それまで採用していた案の記号（無ければ `None`）
    process: |-
      1. `options` にその記号の案が無ければ `OptionNotFoundError`（持っている記号の一覧つき）を送る
      2. それまで `adopted` が真だった最初の案の記号を控える
      3. 指定した案の `adopted` を真、ほかを偽にした新しい項目を返す
    exceptions:
      - name: OptionNotFoundError
        condition: 検討事項がその記号の案を持たない（`options` が無いときも含む）
        message: '案がありません: {key}（持っている案: {記号の一覧}）'
    unit_tests:
      - name: test_switch_adopted
        case: 正常
        summary: 採用を切り替え、前の記号を返す
        condition: 案 A（採用）・案 B を持つ項目と `B`
        mock: なし
        expected: '案 A `adopted: false`・案 B `adopted: true` の項目と `A`'
      - name: test_switch_adopted_when_none_adopted
        case: 正常
        summary: 採用が無ければ前の記号は None
        condition: どの案も採用していない項目と `A`
        mock: なし
        expected: '案 A だけ `adopted: true` の項目と `None`'
      - name: test_switch_adopted_when_option_missing
        case: 異常
        summary: 無い記号は切り替えない
        condition: 案 A・B を持つ項目と `Z`
        mock: なし
        expected: '`OptionNotFoundError`（メッセージに `Z`・`A`・`B`）'
        exception: その記号の案を持たない
  - name: run_init
    title: init の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: ワークスペースの作成
    scope: public
    summary: ツールの `settings` でワークスペースを作る
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`settings`'
    returns:
      type: dict[str, Any]
      description: '`{workspace, files}`'
    process: |-
      1. プラグインの版を読み（`read_plugin_version`）、ワークスペースを作る（ワークスペースの作成。`create_workspace(version=str(版))`）
    unit_tests:
      - name: test_run_init
        case: 正常
        summary: 作ったワークスペースとファイルを返す
        condition: まだ無い `tmp_path / "ws"` と正しい設定の辞書
        mock: なし
        expected: '`workspace` が絶対パス、`files` が 11 件（8 つの YAML・`mindstella-version.ini`・2 つのフォルダ）、`mindstella-version.ini` が `plugins/mindstella/version.ini` と同じ版'
  - name: run_add
    title: add の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: ID・日時・本文を付けて 1 項目を足す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: '`kind`'
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`item`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: dict[str, Any]
      description: '`{id, file, body}`'
    process: |-
      1. ワークスペースとまとまりを読む（`load_workspace`、`load_changes`）
      2. 1 項目を当てる（`stage_add`）
      3. 当てた種類の並び・本文・まとまりを書き込む（`save_batch`）
    unit_tests:
      - name: test_run_add
        case: 正常
        summary: 本文つきの検討事項を足す
        condition: D-1 を持つワークスペース、`body_markdown` つきの検討事項。`now` は `2026-10-02T08:00:00+00:00` を返す
        mock: '`now`'
        expected: '`{id: D-2, file: decisions.yaml, body: docs/D-2.md}`。D-2 の `created`・`updated` がその日時で `body` が `D-2.md`'
      - name: test_run_add_when_no_body
        case: 正常
        summary: 本文が無ければ body を付けない
        condition: 空のワークスペースにタスク
        mock: '`now`'
        expected: '`{id: T-1, file: tasks.yaml, body: null}`。T-1 に `body` のキーが無い'
  - name: run_update
    title: update の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 1 項目のキーを置き換え、更新日時を変える
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: item_id
        type: str
        required: true
        passing: positional
        description: '`id`'
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`item`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: dict[str, Any]
      description: '`{id, file, changed}`'
    process: |-
      1. ワークスペースとまとまりを読む（`load_workspace`、`load_changes`）
      2. 1 項目の変更を当てる（`stage_update`）
      3. 当てた種類の並び・本文・まとまりを書き込む（`save_batch`）
    unit_tests:
      - name: test_run_update
        case: 正常
        summary: キーを置き換えて更新日時を変える
        condition: 'D-1（`created`・`updated` が `2026-10-01T00:00:00+00:00`）に `{"answer": "a", "weight": null}`。`now` は `2026-10-02T08:00:00+00:00`'
        mock: '`now`'
        expected: '`changed` が `[answer, weight]`、D-1 の `updated` が `now` の値で `created` はそのまま'
      - name: test_run_update_stacks_history
        case: 正常
        summary: 変わったキーを変更履歴に積み、まだまとめていない変更に足す
        condition: '`commit` 済みの D-1（`status: 未決定`）に `{"status": "決定済み"}`。保持する回数は既定'
        mock: '`now`'
        expected: 'D-1 の `history[0].before` が `{status: 未決定}`、`changes.yaml` の `pending.changed` が `[D-1]` で `last_seq` が `history[0].seq`'
  - name: run_adopt
    title: adopt の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 検討事項の採用する案を切り替えて書き込む
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 検討事項の ID
      - name: key
        type: str
        required: true
        passing: positional
        description: 案の記号
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: dict[str, Any]
      description: '`{id, adopted, previous}`'
    process: |-
      1. ワークスペースとまとまりを読み、項目を引く（`load_workspace`、`load_changes`、`find_item`）
         - 種類が `decision` でない場合、`ItemNotFoundError` を送る
      2. 採用を切り替え、`updated` を今の日時にする（`switch_adopted`）
      3. 変更履歴と通し番号を `stage_update` の 3. と同じく付ける（本文は変えないので `before_body` と `after_body` は同じ）
      4. 差し替えた並びと、まとまりが変わったときは新しい記録を書き込む（`save_change`）
    exceptions:
      - name: ItemNotFoundError
        condition: ID が検討事項でない
        message: '検討事項がありません: {item_id}'
    unit_tests:
      - name: test_run_adopt
        case: 正常
        summary: 切り替えて書き込む
        condition: 案 A（採用）・B を持つ D-1 と `B`
        mock: '`now`'
        expected: '`{id: D-1, adopted: B, previous: A}`。`decisions.yaml` の D-1 の案 B が採用'
      - name: test_run_adopt_when_not_decision
        case: 異常
        summary: 検討事項でない ID は切り替えない
        condition: T-1 を持つワークスペースで `T-1`
        mock: なし
        expected: '`ItemNotFoundError`（メッセージに `T-1`）'
        exception: ID が検討事項でない
  - name: run_check
    title: check の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: ワークスペースの点検
    scope: public
    summary: 点検して、問題の有無と問題の並びを返す（問題があってもツールのエラーにしない）
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`{ok, problems}`'
    process: |-
      1. ワークスペースを読み、点検する（`load_workspace`、`check_workspace`）
      2. 前の版の形式の問題（`is_legacy_problem`）は、`detail` に続けて `（/mindstella:upgrade で今の形式に移せます）` を足す
      3. 問題が無ければ `ok: true`、あれば `ok: false` を返す
    unit_tests:
      - name: test_run_check
        case: 正常
        summary: 問題が無ければ ok
        condition: 整った D-1
        mock: なし
        expected: '`{ok: true, problems: []}`'
      - name: test_run_check_when_problems
        case: 正常
        summary: 問題があれば ok が偽
        condition: 'D-1 `depends_on: [D-9]`'
        mock: なし
        expected: '`ok: false`・`problems` が 1 件（例外を送らない）'
      - name: test_run_check_when_legacy_format
        case: 正常
        summary: 前の版の形式の問題に /mindstella:upgrade を案内する
        condition: 'A-1（`done: true`）を YAML で直接書いたワークスペース'
        mock: なし
        expected: '`ok: false`。A-1 の問題の `detail` が `（/mindstella:upgrade で今の形式に移せます）` で終わる'
  - name: run_impact
    title: impact の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 採用する案の切り替え
    scope: public
    summary: 影響を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 起点の ID
    returns:
      type: dict[str, Any]
      description: '`{id, affected}`'
    process: |-
      1. ワークスペースを読み、影響を洗い出す（`load_workspace`、`trace_impact`）
      2. `affected` を `asdict` して返す
    unit_tests:
      - name: test_run_impact
        case: 正常
        summary: 影響を出力の形にする
        condition: 'D-2 `depends_on: [D-1]` で `D-1`'
        mock: なし
        expected: '`{id: D-1, affected: [{id: D-2, title, status, via: [], key: depends_on}]}`'
  - name: run_next
    title: next の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 状況の確認
    scope: public
    summary: 次の候補を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: limit
        type: int | None
        required: true
        passing: positional
        description: '`limit`'
    returns:
      type: dict[str, Any]
      description: '`{candidates}`'
    process: |-
      1. `limit` が 1 未満なら `ArgumentError`（`limit`・`1 以上を渡してください`）を送る
      2. ワークスペースを読み、候補を並べる（`load_workspace`、`list_next_candidates`）
      3. `asdict` して返す
    unit_tests:
      - name: test_run_next
        case: 正常
        summary: 候補を出力の形にする
        condition: 未決定の D-1 だけで `limit=None`

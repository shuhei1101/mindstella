        required: true
        passing: positional
        description: その操作より前の `add` の番号（1 始まり）→ 振った ID
    returns:
      type: dict[str, Any]
      description: 置き換えた `item`
    process: |-
      1. `REF_KEYS` のキーの値（文字列か、文字列の配列）のうち、全体が `$` と数字だけの文字列を `added` で引いた ID にする
         - `added` に無い番号なら `ArgumentError`（理由にその `$番号`）
      2. ほかのキーはそのままにする
    exceptions:
      - name: ArgumentError
        condition: '`$番号` がその操作より前の `add` を指していない'
        message: '引数の誤り: {キー}: {$番号} はこの操作より前の add を指していません'
    unit_tests:
      - name: test_resolve_refs
        case: 正常
        summary: 参照のキーの番号だけを ID にする
        condition: '`{"for": ["$1", "D-3"], "parent": "$1", "title": "$1"}` と `{1: "D-5"}`'
        mock: なし
        expected: '`for` が `[D-5, D-3]`、`parent` が `D-5`、`title` が `$1` のまま'
      - name: test_resolve_refs_when_unknown
        case: 異常
        summary: 前の add を指さない番号を拒む
        condition: '`{"for": ["$2"]}` と `{1: "D-5"}`'
        mock: なし
        expected: '`ArgumentError`（メッセージに `$2`）'
  - name: run_batch
    title: batch の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 追加・更新・取得の操作を並べた順に当て、最後に 1 回だけ書き込む
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
      - name: operations
        type: list[dict[str, Any]]
        required: true
        passing: positional
        description: '`operations`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: dict[str, Any]
      description: '`{results: [{op, result}]}`'
    process: |-
      1. `operations` が空なら `ArgumentError`（`operations`）
      2. ワークスペースとまとまりを読み、`Staged` を作る（`load_workspace`、`load_changes`）
      3. 操作ごとに並べた順に当てる。操作に要るキーが無いか要らないキーがあれば `ArgumentError`
         - `add`: `$番号` を置き換え（`resolve_refs`）、追加を当て、振った ID をその番号で控える（`stage_add`）
         - `update`: `id` が `$番号` なら ID にし、`$番号` を置き換えて更新を当てる（`resolve_refs`、`stage_update`）
         - `show`: `staged.items` と当てた本文を使って、`run_show` と同じ形の結果を作る
         - どの操作で `MindmapError` が起きても、メッセージの頭に `{番号} 番目の操作（{op}）: ` を付けた同じ種類のエラーを送る（何も書かない）
      4. 書き換えた種類があれば、`touched` の種類の並び・本文・まとまりを 1 回だけ書き込む（`save_batch`）
         - `SchemaMismatchError` の場合、合わない箇所の項目の ID を最後に書いた操作の番号を頭に付ける
    exceptions:
      - name: ArgumentError
        condition: '`operations` が空・操作のキーが合わない・`$番号` が前の `add` を指さない'
        message: '{番号} 番目の操作（{op}）: 引数の誤り: {理由}'
    unit_tests:
      - name: test_run_batch
        case: 正常
        summary: 先に足した項目を指す追加・更新・取得を 1 回で書く
        condition: 'D-1 を持つワークスペースに、検討事項の `add`、`for: ["$1"]` のタスクの `add`、D-1 の `update`、D-1 の `show`'
        mock: '`now`'
        expected: '`results` が 4 件で D-2・T-1（`for: [D-2]`）・D-1 の `changed`・直した後の D-1。`save_batch` を 1 回だけ呼ぶ'
      - name: test_run_batch_when_operation_fails
        case: 異常
        summary: 途中の操作が失敗したら番号を付けて止め、何も書かない
        condition: 検討事項の `add` と D-9 の `update`
        mock: なし
        expected: '`ItemNotFoundError`（メッセージが `2 番目の操作（update）: ` で始まる）。ワークスペースの全てのファイルが呼ぶ前と同じ'
  - name: run_changes_since_read
    title: changes_since_read の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 前回読んだ時点からの変更を読む
    scope: public
    summary: 読んだ時点からの変更を並べ、読んだ時点を進めて書き込む
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`{had_read_point, read_seq, until_seq, added, changed}`'
    process: |-
      1. ワークスペースとまとまりを読む（`load_workspace`、`load_changes`）
      2. 変更を並べる（`changes_since`）
      3. 読んだ時点を進めた記録だけを、`changes.yaml` だけを置き換えて書く（`mark_read`、`run_commit` と同じ `_write_changes`）。項目の YAML は書かず、ワークスペースのスキーマの検証もしない（今あるスキーマ違反で止めない）
      4. 2. の結果を返す（3. で失敗したら返さずにエラーを伝える）
    unit_tests:
      - name: test_run_changes_since_read
        case: 正常
        summary: 変更を返して読んだ時点を進める
        condition: '`read_seq` 2、`last_seq` 4 で、`added_seq` 3 の T-1 を持つワークスペース'
        mock: なし
        expected: '`added` が T-1、`until_seq` が 4。`changes.yaml` の `read_seq` が 4'
      - name: test_run_changes_since_read_when_schema_mismatch
        case: 正常
        summary: ワークスペースにスキーマ違反があっても読んだ時点を進める
        condition: '`status: 完了`（検討事項に無い状態）の D-1 と、`read_seq` 2・`last_seq` 3 の `changes.yaml` を持つワークスペース'
        mock: なし
        expected: 例外にならず、`changes.yaml` の `read_seq` が 3。`decisions.yaml` が呼ぶ前と同じ
  - name: run_tags
    title: tags の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の検索
    scope: public
    summary: タグの一覧を出力の形にする
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: '`workspace`（絶対パス）'
    returns:
      type: dict[str, Any]
      description: '`{tags}`'
    process: 1. ワークスペースを読み、数える（`load_workspace`、`list_tags`）
    unit_tests:
      - name: test_run_tags
        case: 正常
        summary: タグを出力の形にする
        condition: タグ `データ` の D-1
        mock: なし
        expected: '`{tags: [{name: データ, count: 1, kinds: [decision]}]}`'
notes:
  モジュールの読み込み: サーバーはパッケージとして入れず、起動スクリプトが書いた MCP の設定で Claude Code が `{仮想環境の Python} {プラグインのフォルダ}/skills/mindmap/scripts/server.py` を起動する。起動したファイルのフォルダが `sys.path` の先頭に入るので、各モジュールは `import store` のように同じフォルダの名前で読む。単体テストは `tests/unit/scripts/conftest.py` で `plugins/mindstella/skills/mindmap/scripts` を `sys.path` に足して同じ名前で読む
  標準出力: 標準出力は MCP の JSON-RPC が使う。サーバーのどのモジュールも `print` を使わず、記録は `logging` で標準エラーへ書く
test_files:
  - tests/unit/scripts/test_server.py
  - tests/unit/scripts/test_commands.py
data_models:
  - name: Staged
    title: 当てた書き換え
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    role: DTO
    summary: 書き込む前にメモリの上で当てた、種類ごとの項目・本文・まとまり
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。`stage_add`・`stage_update` が新しいものを返し、`run_add`・`run_update`・`run_batch` が最後に `BatchChange` にして書く。'
    properties:
      - name: workspace
        type: Workspace
        description: 読んだワークスペース（書き込みの前の中身。`save_batch` に渡す）
      - name: items
        type: dict[Kind, list[dict[str, Any]]]
        description: 当てた後の種類ごとの項目の並び（書き換えた種類だけでなく全て）
      - name: touched
        type: frozenset[Kind]
        description: 書き換えた種類
      - name: bodies
        type: dict[str, BodyWrite]
        description: 書く本文（ファイル名 → 本文。同じ項目を二度直すと後の本文で置き換える）
      - name: changes
        type: Changes
        description: 当てた後のまとまりの記録

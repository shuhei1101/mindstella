  - name: stage_add
    title: 追加を当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: ID・日時・通し番号・本文を付けた 1 項目を、メモリの上の並びに足す
    args:
      - name: staged
        type: Staged
        required: true
        passing: positional
        description: 今までに当てた書き換え
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: '`kind`'
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`item`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[Staged, dict[str, Any]]
      description: 新しい `Staged` と、`add` の結果 `{id, file, body}`
    process: |-
      1. 渡せないキーを確かめる（`validate_input_keys`）
      2. `staged.items` のその種類で ID を振る（`next_id`）
      3. 通し番号を振り（`advance_seq`）、`id` を先頭に、`created`・`updated`・`seq`・`added_seq` を末尾に置いた項目を作る
         - `body_markdown` がある場合、項目の `body` を `{ID}.md` にし、本文の書き込みを足す
      4. まだまとめていない変更の `added` に ID を足す（`note_pending`）
      5. 末尾に足した並びと、`touched` にその種類を足した `Staged` を返す
    unit_tests:
      - name: test_stage_add
        case: 正常
        summary: 通し番号を振って足す
        condition: '`last_seq` 3 の記録と D-1 を持つ `Staged` に検討事項を足す'
        mock: '`now`'
        expected: 結果の `id` が D-2。D-2 の `seq`・`added_seq` が 4、新しい記録の `last_seq` が 4 で `pending.added` に D-2。渡した `Staged` はそのまま
  - name: stage_update
    title: 更新を当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 記録の追加と更新
    scope: public
    summary: 1 項目のキーを置き換え、変更履歴と通し番号を付けて、メモリの上の並びを差し替える
    args:
      - name: staged
        type: Staged
        required: true
        passing: positional
        description: 今までに当てた書き換え
      - name: item_id
        type: str
        required: true
        passing: positional
        description: '`id`'
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`item`'
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[Staged, dict[str, Any]]
      description: 新しい `Staged` と、`update` の結果 `{id, file, changed}`
    process: |-
      1. `staged.items` から項目を引き、渡せないキーを確かめる（`validate_input_keys`）
      2. 変更を当てはめ、`updated` を今の日時にする（`merge_changes`）
         - `body_markdown` がある場合、`body` を `{ID}.md` にし、本文の書き込みを作る
      3. 書き換える前の本文（`staged.bodies` にあればそれ、無ければ `read_body`）と比べて変更履歴の 1 回分を作る（`make_entry`。`seq` は `last_seq` + 1）
         - 変わったものがある場合、通し番号を振り（`advance_seq`）、項目の `seq` をその番号にして、変更履歴を積む（`history_limit`、`stack_history`。`read_seq` は記録のもの）。保持する回数が 0 より大きければ、まだまとめていない変更の `changed` に ID を足す（`note_pending`）
      4. その位置を差し替えた並びと、`touched` にその種類を足した `Staged` を返す
    exceptions:
      - name: ItemNotFoundError
        condition: '`staged.items` に ID が無い'
        message: '項目がありません: {item_id}'
    unit_tests:
      - name: test_stage_update_when_limit_zero
        case: 正常
        summary: 保持する回数が 0 でも通し番号を進める
        condition: '`history_limit` 0、`last_seq` 3、D-1 に `{"answer": "a"}`'
        mock: '`now`'
        expected: D-1 の `seq` が 4 で `history` を持たず、新しい記録の `last_seq` が 4 で `pending.changed` が空
      - name: test_stage_update_when_nothing_changed
        case: 正常
        summary: 変わったものが無ければ通し番号を進めない
        condition: '`answer: a` の D-1 に `{"answer": "a"}`'
        mock: '`now`'
        expected: '`changed` が空で、記録の `last_seq` と D-1 の `seq` が呼ぶ前と同じ'
  - name: apply_option_edit
    title: 案の書き換えを当てる
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 検討事項の案の編集
    scope: public
    summary: 検討事項の案の並びに、記号で指した 1 つの足す・直す・消すを当てた新しい並びを返す
    args:
      - name: item
        type: dict[str, Any]
        required: true
        passing: positional
        description: 検討事項
      - name: action
        type: Literal['add', 'update', 'remove']
        required: true
        passing: positional
        description: '`action`'
      - name: key
        type: str
        required: true
        passing: positional
        description: '`key`'
      - name: option
        type: dict[str, Any] | None
        required: true
        passing: positional
        description: '`option`'
    returns:
      type: list[dict[str, Any]]
      description: 書き換えた後の `options`（新しい並び）
    process: |-
      1. `add`・`update` で `option` が無いか、`remove` で `option` があるか、`option` が `OPTION_KEYS` に無いキーを持つなら `ArgumentError`（`option`）
      2. `add` の場合、同じ記号の案があれば `OptionExistsError`。無ければ `{key, **option}` を末尾に足す
      3. `update`・`remove` の場合、その記号の案が無ければ `OptionNotFoundError`
         - `update` はその案に `option` を当てる（値が `None` のキーは消す）
         - `remove` はその案が `adopted` なら `AdoptedOptionError`、そうでなければ抜く
    exceptions:
      - name: ArgumentError
        condition: '`option` の渡し方が合わない'
        message: '引数の誤り: option: {理由}'
      - name: OptionExistsError
        condition: '`add` で同じ記号の案がある'
        message: '{ID} の案 {記号}: 同じ記号の案が既にあります'
      - name: OptionNotFoundError
        condition: '`update`・`remove` でその記号の案が無い'
        message: '{ID} の案 {記号}: その記号の案がありません'
      - name: AdoptedOptionError
        condition: '`remove` で採用している案を指した'
        message: '{ID} の案 {記号}: 採用している案は消せません。先に adopt で採用をほかの案へ移してください'
    unit_tests:
      - name: test_apply_option_edit
        case: 正常
        summary: 足す・直す・消すで指した案だけが変わる
        condition: '案 A（`pros`・`cons`）・B を持つ検討事項。`parametrize`: `add` C / `update` A に `{"pros": "x", "cons": null}` / `remove` B'
        mock: なし
        expected: A・B・C / A の `pros` が x で `cons` が無く B はそのまま / A だけ
      - name: test_apply_option_edit_when_rejected
        case: 異常
        summary: 記号と採用と引数の誤りを拒む
        condition: '案 A（採用）・B。`parametrize`: `add` B / `update` Z / `remove` A / `update` B に `{"adopted": true}`'
        mock: なし
        expected: '`OptionExistsError` / `OptionNotFoundError` / `AdoptedOptionError` / `ArgumentError`'
  - name: run_edit_option
    title: edit_option の処理
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/commands.py
    usecase: 検討事項の案の編集
    scope: public
    summary: 検討事項の案を 1 つ足す・直す・消す

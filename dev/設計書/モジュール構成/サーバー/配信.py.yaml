title: "サーバー / 配信"
lead: ワークスペースごとに `127.0.0.1` の空きポートでプレビューを配る。画面・記録・書き換えの知らせを返し、レビュー中のコメント・書きかけ・まとめて送る・設定の既定の書き換え・設定の再読み込みを受け付ける。ビルド（雛形と記録）とコメントと設定の更新と読み書きと検証に依存する。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    serve.py   配信の台帳・待ち受け・要求の振り分け・画面と記録・書き換えの知らせ・コメントの受け付け・最後に検査に通った設定と再読み込み
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class 配信の台帳
        class 配信
        class 要求の受け口
        class ビルド
        class コメント
        class 外から見る設定
        class フックの呼び出し
        配信の台帳 --> 配信 : ワークスペースごとに 1 つ
        配信の台帳 --> 外から見る設定
        配信の台帳 --> フックの呼び出し : 立てたとき・止めるとき
        配信 --> 要求の受け口
        要求の受け口 --> ビルド : 雛形・記録
        要求の受け口 --> コメント : /api/comments・/api/drafts
      ```
constants:
  - name: LISTEN_HOST
    title: 待ち受けのアドレス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 非機能要件の「待ち受けの範囲」。ポートは `config.yaml` の `preview.port` があればそれ、無ければ 0 で OS に選ばせる
    value: '"127.0.0.1"'
  - name: POLL_INTERVAL_SEC
    title: 書き換えを見る間隔
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 書き換えの印を作り直す間隔（非機能要件の「画面への反映の時間」の内訳）
    value: '0.25'
  - name: KEEPALIVE_SEC
    title: 保つための行の間隔
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: '知らせが無いままこの秒数が過ぎたら `: keepalive` を送る（インターフェース定義『書き換えの知らせ』）'
    value: '15'
  - name: MAX_REQUEST_BYTES
    title: 要求の本文の上限
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    summary: 書き込む要求の本文を読む上限。`Content-Length` がこれを超えたら読まずに 400（非機能要件の「送信の本文の長さ」の根拠）
    value: '131072'
  - name: PAGE_PATH
    title: 画面のパス
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    summary: 配信が画面を返すパス。`/` はここへ送り直し、`PreviewServer.url` はこのパスで終わる
    value: '"/mindstella.html"'
  - name: ALLOWED_HOSTS_ENV
    title: 許可するホスト名の環境変数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: 許可するホスト名を読む環境変数の名前（設定『サーバー』）
    value: '"MINDSTELLA_ALLOWED_HOSTS"'
  - name: START_HOOK_ENV
    title: 起動時のフックの環境変数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: 配信を立てたときのフックを読む環境変数の名前（設定『サーバー』）
    value: '"MINDSTELLA_PREVIEW_START_HOOK"'
  - name: STOP_HOOK_ENV
    title: 終了時のフックの環境変数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    summary: 配信を止めるときのフックを読む環境変数の名前（設定『サーバー』）
    value: '"MINDSTELLA_PREVIEW_STOP_HOOK"'
classes:
  - name: PreviewRegistry
    title: 配信の台帳
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: 長期保持のランタイム状態
    summary: このプロセスが立てた配信をワークスペースの絶対パスごとに 1 つ持ち、プロセスが終わるときに全て止める。作るときにツールと共有する書き換えの鍵を位置引数で、外から見る設定をキーワード引数で受け取る（`PreviewRegistry(write_lock, external=ExternalAccess())`）
    kind: クラス
    properties:
      - name: _servers
        type: dict[Path, PreviewServer]
        access: 内部 (_)
        description: ワークスペース → 立てた配信
      - name: _write_lock
        type: threading.Lock
        access: 内部 (_)
        description: ツールと共有するプロセスの中の書き換えの鍵（コメントの受け付けが取る）
      - name: _guard
        type: threading.Lock
        access: 内部 (_)
        description: '`_servers` を触る間だけ取る鍵'
      - name: _external
        type: ExternalAccess
        access: 内部 (_)
        description: 外から見る設定（許可するホスト名を配信へ渡し、フックを呼ぶ）
    methods:
      - name: start
        title: 配信を立てる
        kind: メソッド
        summary: そのワークスペースの配信を立て、URL と今立てたかを返す。立っていればその URL を返す
        args:
          - name: root
            type: Path
            required: true
            passing: positional
            description: ワークスペースの絶対パス
        returns:
          type: tuple[str, bool]
          description: 配信の画面の URL（`http://127.0.0.1:{ポート}/mindstella.html`）と、この呼び出しで立てたか
        process: |-
          1. `_guard` を取り、`_servers` にあればその URL と `False` を返す（検査しない・フックを呼ばない）
          2. `config.yaml` を検査する（設定の検査。`check_settings`）
             - 問題がある場合、問題ごとの `config.yaml: {キーのパス}: {理由}` を `lines` に持った `SchemaMismatchError` を送る（配信を立てない）
          3. 読んだ設定を初めの値に、`preview.port`（無ければ 0）と `_external.allowed_hosts` を渡して配信を立て（`start_preview_server`）`_servers` に入れる
             - `[INFO]` 配信を立てた（ワークスペース、URL）
          4. `_external.start_hook` があれば、配信のポートとワークスペースのフォルダの名前を渡してフックを呼ぶ（`run_hook`）
          5. URL と `True` を返す
        unit_tests:
          - name: test_start
            case: 正常
            summary: 同じワークスペースは同じ URL、別なら別の URL
            condition: 作成済みのワークスペース 2 つ。一つ目を 2 回、二つ目を 1 回 `start` する
            mock: なし（本物の待ち受け。後で `stop_all`）
            expected: 1 回目 `(url1, True)`、2 回目 `(url1, False)`、二つ目 `(url2, True)` で url1 と url2 のポートが違う。どちらも `http://127.0.0.1:` で始まり `/mindstella.html` で終わる
          - name: test_start_when_settings_invalid
            case: 異常
            summary: config.yaml が合わなければ配信を立てず、直せば立てる
            condition: '`display.network_look` を `rainbow` にしたワークスペースで 2 回 `start` し、`deep` に直してもう 1 回 `start` する'
            mock: なし（本物の待ち受け。後で `stop_all`）
            expected: '1・2 回目は `SchemaMismatchError`（`lines` に `config.yaml: display.network_look: ` で始まる行）で台帳が空。3 回目は `(url, True)`'
          - name: test_start_when_port_fixed
            case: 正常
            summary: preview.port のポートで立てる
            condition: '`config.yaml` の `preview.port` に、テストの中で取って閉じた空きポートを書いたワークスペース'
            mock: なし（本物の待ち受け。後で `stop_all`）
            expected: '`url` が `http://127.0.0.1:{そのポート}/mindstella.html`'
          - name: test_start_when_start_hook_set
            case: 正常
            summary: 立てたときだけ起動時のフックを呼ぶ
            condition: '`external=ExternalAccess(start_hook=("hook",))` で作り、同じワークスペースを 2 回 `start` する'
            mock: '`run_hook`（`serve` モジュールの参照を monkeypatch し、受け取った引数を記録する）'
            expected: '`run_hook` が 1 回だけ、`(("hook",), {配信のポート}, {フォルダの名前})` で呼ばれる'
          - name: test_start_when_port_in_use
            case: 異常
            summary: preview.port が使われていれば ServeFailedError でフックを呼ばない
            condition: テストが `127.0.0.1` で待ち受けたままのポートを `preview.port` に書き、`external=ExternalAccess(start_hook=("hook",))` で `start` する
            mock: '`run_hook`（呼ばれたかを記録する）'
            expected: '`ServeFailedError` で、台帳が空、`run_hook` が呼ばれていない'
            exception: 待ち受けを立てられない
      - name: stop_all
        title: 全ての配信を止める
        kind: メソッド
        summary: 立てた配信ごとに終了時のフックを呼んでから全て止め、台帳を空にする。2 回呼んでも 2 回目は何もしない
        returns:
          type: None
          description: '-'
        process: |-
          1. `_guard` を取り、`_external.stop_hook` があれば、台帳の配信ごとに配信のポートとワークスペースのフォルダの名前を渡してフックを呼ぶ（`run_hook`。配信を止める前に全て立てる）
          2. 台帳の配信ごとに `PreviewServer.stop` を呼ぶ
          3. 台帳を空にする（2 回目の呼び出しではフックも `stop` も呼ばれない）
        unit_tests:
          - name: test_stop_all
            case: 正常
            summary: 止めた配信にはつながらない
            condition: 1 つ立ててから `stop_all`
            mock: なし
            expected: その URL への `GET /` が `ConnectionRefusedError`
          - name: test_stop_all_when_stop_hook_set
            case: 正常
            summary: 配信ごとに 1 回だけ終了時のフックを呼ぶ
            condition: '`external=ExternalAccess(stop_hook=("hook",))` で作り、ワークスペース 2 つを `start` してから `stop_all` を 2 回呼ぶ'
            mock: '`run_hook`（`serve` モジュールの参照を monkeypatch し、受け取った引数を記録する）'
            expected: '`run_hook` が 2 回だけ、それぞれの配信のポートとフォルダの名前で呼ばれる'
      - name: url_of
        title: 配っている URL
        kind: メソッド
        summary: そのワークスペースを配っていれば画面の URL を、配っていなければ `None` を返す（配信を立てない）
        args:
          - name: root
            type: Path
            required: true
            passing: positional
            description: ワークスペースの絶対パス
        returns:
          type: str | None
          description: 配信の画面の URL。台帳に無ければ `None`
        process: |-
          1. `_guard` を取り、`_servers` を `root.resolve()` で引いて URL を返す
             - 無い場合、`None` を返す
        unit_tests:
          - name: test_url_of
            case: 正常
            summary: 立てたワークスペースだけ URL を返す
            condition: 作成済みのワークスペース 2 つ。一つ目だけ `start` する
            mock: なし（本物の待ち受け。後で `stop_all`）
            expected: 一つ目は `start` が返した URL、二つ目は `None`。台帳の配信が 1 つのまま
  - name: PreviewServer
    title: 配信
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: 長期保持のランタイム状態
    summary: 1 つのワークスペースの待ち受けと、それを動かすスレッド。`@dataclass(frozen=True, slots=True, kw_only=True)`
    kind: クラス
    properties:
      - name: root
        type: Path
        description: 配っているワークスペース
      - name: url
        type: str
        description: '`http://127.0.0.1:{ポート}/mindstella.html`'
      - name: httpd
        type: ThreadingHTTPServer
        description: 待ち受け（`daemon_threads=True`）
      - name: thread
        type: threading.Thread
        description: '`serve_forever` を動かすデーモンのスレッド'
      - name: port
        type: int
        description: 待ち受けのポート（フックへ渡す）
    methods:
      - name: stop
        title: 配信を止める
        kind: メソッド
        summary: 待ち受けを止めて閉じる
        returns:
          type: None
          description: '-'
        process: 1. `httpd.shutdown()` と `httpd.server_close()` を呼ぶ（つながっている書き換えの知らせは、書き込みが失敗して終わる）
  - name: PreviewHandler
    title: 要求の受け口
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: ライブラリが要求するクラス
    summary: '`BaseHTTPRequestHandler` を継いで、パスごとに処理の関数へ振り分け、返ったステータスコード・ヘッダー・本文を書く。振り分けた先の処理は関数で書き、このクラスは要求と応答の読み書きだけを持つ'
    kind: クラス
    inherits: BaseHTTPRequestHandler
    properties:
      - name: context
        type: ServeContext
        description: ワークスペース・ポート・書き換えの鍵（`start_preview_server` が待ち受けに持たせ、`self.server.context` で引く）
    methods:
      - name: do_GET
        title: GET の振り分け
        kind: メソッド
        summary: '`Host` を確かめ、`/`・`/mindstella.html`・`/api/records`・`/api/events`・`/api/comments` を処理の関数へ振り分ける'
        returns:
          type: None
          description: '-'
        process: |-
          1. `Host` が合わなければ 403 を返す（`check_host`、`problem_response`）
          2. パスで分ける（クエリとハッシュは見ない）
             - `/` の場合、`302`・`Location: /mindstella.html`・本文なしで送り直す（`PAGE_PATH`）
             - `/mindstella.html` の場合、画面を返す（`index_response`）
             - `/api/records` の場合、記録を返す（`records_response`。配信の文脈を渡す）
             - `/api/events` の場合、`200`・`Content-Type: text/event-stream`・`Cache-Control: no-store` を書き、書き換えを知らせ続ける（`stream_events`。書き換えの印は `workspace_signature` の後ろに `|settings:{SettingsHolder.revision}` をつないだもの。書き込みが `BrokenPipeError`・`ConnectionResetError` で失敗したら終える）
             - `/api/comments` の場合、レビュー中のコメントと書きかけを返す（`comments_response`）
             - それ以外は 404 を返す
      - name: do_POST
        title: POST の振り分け
        kind: メソッド
        summary: '`Host` を確かめ、`/api/comments` と `/api/comments/send` を受け付けの関数へ、`/api/opened` を前回開いた日時の関数へ、`/api/config/reload` を設定の再読み込みの関数へ渡す'
        returns:
          type: None
          description: '-'
        process: |-
          1. `Host` が合わなければ 403 を返す
          2. パスで分ける
             - `/api/opened` の場合、本文を読まずに前回開いた日時を返す（`opened_response`）
             - `/api/config/reload` の場合、本文を読まずに設定を読み直す（`reload_response`）
             - `/api/comments` なら `add_comment`、`/api/comments/send` なら `send_comments` を受け付けの処理にする。それ以外は 404 を返す
          3. `Content-Length` が無いか `MAX_REQUEST_BYTES` を超えれば、本文を読まずに 400 を返す
          4. 本文を読み、受け付ける（`write_response`。成功は 201）
      - name: log_message
        title: 要求の記録
        kind: メソッド
        summary: 標準の要求の記録を `logging` の `DEBUG` に回す（標準エラーへの直接の書き込みをやめる）
        returns:
          type: None
          description: '-'
        process: 1. `[DEBUG]` 受けた要求（メソッド・パス・ステータス）
      - name: do_PATCH
        title: PATCH の振り分け
        kind: メソッド
        summary: '`Host` を確かめ、`/api/comments/{id}` をコメントを直す受け付けへ渡す'
        returns:
          type: None
          description: '-'
        process: |-
          1. `Host` が合わなければ 403 を返す
          2. パスが `/api/comments/{id}`（`id` は `/` を含まず `send` でない）でなければ 404 を返す
          3. `do_POST` と同じく本文の大きさを確かめて読み、`update_comment` を `id` で受け付ける（`write_response`。成功は 200）
      - name: do_PUT
        title: PUT の振り分け
        kind: メソッド
        summary: '`Host` を確かめ、`/api/drafts` を書きかけを保つ受け付けへ、`/api/config/display` を設定の既定の書き換えへ渡す'
        returns:
          type: None
          description: '-'
        process: |-
          1. `Host` が合わなければ 403 を返す
          2. パスで分ける
             - `/api/drafts` なら `save_draft`（成功は本文を持たない 204）
             - `/api/config/display` なら `update_display`（モジュール構成『設定の更新』。成功は `{display}` の 200）
             - それ以外は 404 を返す
          3. `do_POST` と同じく本文の大きさを確かめて読み、受け付ける（`write_response`）
      - name: do_DELETE
        title: DELETE の振り分け
        kind: メソッド
        summary: '`Host` を確かめ、`/api/comments/{id}` をコメントを消す受け付けへ渡す'
        returns:
          type: None
          description: '-'
        process: |-
          1. `Host` が合わなければ 403 を返す
          2. パスが `/api/comments/{id}` でなければ 404 を返す
          3. 本文を読まずに受け付ける（`delete_response`）
  - name: SettingsHolder
    title: 最後に検査に通った設定
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 設定の再読み込み
    role: 長期保持のランタイム状態
    summary: 1 つの配信が持つ、最後に検査に通った `config.yaml` の中身と、再読み込みの回数。要求ごとのスレッドから読み書きするため、触る間だけ鍵を取る。作るときに初めの設定を位置引数で受け取る（`SettingsHolder(settings)`）
    kind: クラス
    properties:
      - name: _settings
        type: dict[str, Any]
        access: 内部 (_)
        description: 最後に検査に通った設定
      - name: _revision
        type: int
        access: 内部 (_)
        description: 再読み込みで差し替えた回数（0 から）。書き換えの印に混ぜて、ファイルが変わらない再読み込みでも知らせる
      - name: _guard
        type: threading.Lock
        access: 内部 (_)
        description: 触る間だけ取る鍵
    methods:
      - name: current
        title: 今の設定
        summary: 最後に検査に通った設定を返す
        kind: メソッド
        returns:
          type: dict[str, Any]
          description: 設定
        process: 1. `_guard` を取り、`_settings` を返す
      - name: accept
        title: 通った設定を控える
        summary: 記録の取得が検査に通した設定に差し替える（回数は進めない）
        kind: メソッド
        args:
          - name: settings
            type: dict[str, Any]
            required: true
            passing: positional
            description: 検査に通った設定
        returns:
          type: None
          description: '-'
        process: 1. `_guard` を取り、`_settings` を差し替える
      - name: reload
        title: 再読み込みで差し替える
        summary: 設定を差し替え、`_revision` を 1 進める
        kind: メソッド
        args:
          - name: settings
            type: dict[str, Any]
            required: true
            passing: positional
            description: 検査に通った設定
        returns:
          type: None
          description: '-'
        process: 1. `_guard` を取り、`_settings` を差し替えて `_revision` を 1 進める
        unit_tests:
          - name: test_settings_holder
            case: 正常
            summary: accept は回数を変えず、reload だけが進める
            condition: '`{summary: a}` で作り、`accept({summary: b})`、`reload({summary: c})` の順に呼ぶ'
            mock: なし
            expected: '`current()` が `a` → `b` → `c`、`revision()` が `0` → `0` → `1`'
      - name: revision
        title: 再読み込みの回数
        summary: '`_revision` を返す'
        kind: メソッド
        returns:
          type: int
          description: 回数
        process: 1. `_guard` を取り、`_revision` を返す
data_models:
  - name: ServeContext
    title: 配信の文脈
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: DTO
    summary: 要求の受け口が使う、配っているワークスペースと待ち受けの値。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: root
        type: Path
        description: 配っているワークスペース
      - name: port
        type: int
        description: 待ち受けのポート
      - name: write_lock
        type: threading.Lock
        description: プロセスの中の書き換えの鍵
      - name: settings
        type: SettingsHolder
        description: 最後に検査に通った設定
      - name: preview_dir
        type: Path
        default: PREVIEW_DIR
        description: 雛形のフォルダ
      - name: allowed_hosts
        type: frozenset[str]
        default: frozenset()
        description: 許可するホスト名（`check_host`・`check_origin` に渡す）
  - name: Response
    title: 応答
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    role: DTO
    summary: 処理の関数が返す、書く前の応答。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: status
        type: int
        description: ステータスコード
      - name: content_type
        type: str
        description: '`Content-Type`'
      - name: body
        type: bytes
        description: 本文
  - name: ExternalAccess
    title: 外から見る設定
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    role: DTO
    summary: 環境変数から読んだ、許可するホスト名と起動時・終了時のフック。`@dataclass(frozen=True, slots=True, kw_only=True)`。どの値も無いときは空の既定値（`ExternalAccess()`）で、今と同じ動きになる
    properties:
      - name: allowed_hosts
        type: frozenset[str]
        default: frozenset()
        description: 許可するホスト名（小文字）
      - name: start_hook
        type: tuple[str, ...]
        default: ()
        description: 起動時のフックのコマンドと引数（空なら呼ばない）
      - name: stop_hook
        type: tuple[str, ...]
        default: ()
        description: 終了時のフックのコマンドと引数（空なら呼ばない）
functions:
  - name: start_preview_server
    title: 待ち受けの立ち上げ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: '`LISTEN_HOST` の渡したポート（0 なら空きポート）で待ち受け、デーモンのスレッドで動かし始める'
    side_effects: ソケットを開き、スレッドを立てる
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配るワークスペース
      - name: write_lock
        type: threading.Lock
        required: true
        passing: keyword
        description: プロセスの中の書き換えの鍵
      - name: settings
        type: dict[str, Any]
        required: true
        passing: keyword
        description: 立てる前に検査に通った設定（`SettingsHolder` の初めの値）
      - name: port
        type: int
        required: false
        default: '0'
        passing: keyword
        description: 待ち受けるポート。0 は OS に選ばせる
      - name: allowed_hosts
        type: frozenset[str]
        required: false
        default: frozenset()
        passing: keyword
        description: 許可するホスト名（`ServeContext` に持たせる）
    returns:
      type: PreviewServer
      description: 立てた配信
    process: |-
      1. `ThreadingHTTPServer((LISTEN_HOST, port), PreviewHandler)` を作り、`daemon_threads` を真にする
         - `OSError` が起きた場合、`ServeFailedError` を送る
      2. 割り当てられたポート・`SettingsHolder(settings)`・`allowed_hosts` で `ServeContext` を作り、待ち受けの `context` に持たせる
      3. `serve_forever` をデーモンのスレッドで動かし、`http://127.0.0.1:{ポート}{PAGE_PATH}` とポートを持つ `PreviewServer` を返す
    exceptions:
      - name: ServeFailedError
        condition: 待ち受けを立てられない（`OSError`）
        message: 'プレビューの配信を立てられません（ポート {port}）: {理由}'
    unit_tests:
      - name: test_start_preview_server
        case: 正常
        summary: 127.0.0.1 だけで待ち受ける
        condition: 作成済みのワークスペース
        mock: なし（後で `stop`）
        expected: '`httpd.server_address[0]` が `127.0.0.1`、ポートが 0 でない。`url` が `/mindstella.html` で終わり、`url` への GET が 200、`/` への GET（送り直しを辿らない）が 302 で `Location` が `/mindstella.html`'
      - name: test_start_preview_server_when_bind_fails
        case: 異常
        summary: 待ち受けを立てられなければ ServeFailedError
        condition: '`ThreadingHTTPServer` を `OSError` を送る関数に差し替える'
        mock: '`ThreadingHTTPServer`（`serve` モジュールの参照を monkeypatch）'
        expected: '`ServeFailedError`'
        exception: 待ち受けを立てられない
  - name: check_host
    title: 接続先の確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: '`Host` が `127.0.0.1:{ポート}`・`localhost:{ポート}` か、ポートを外したホスト名の部分が許可するホスト名のどれかと同じかを返す（別のサイトの名前をこの端末に向ける DNS の付け替えを防ぐ）'
    args:
      - name: host
        type: str | None
        required: true
        passing: positional
        description: '`Host` の値'
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
      - name: allowed_hosts
        type: frozenset[str]
        required: true
        passing: keyword
        description: 許可するホスト名（小文字）。呼ぶ側は `ServeContext.allowed_hosts` を渡す
    returns:
      type: bool
      description: 合うか
    process: |-
      1. `None` は偽
      2. 小文字にした `host` が `127.0.0.1:{port}`・`localhost:{port}` のどちらかと等しければ真
      3. ポートを外したホスト名の部分（`host_part`）が `allowed_hosts` にあれば真、無ければ偽
    unit_tests:
      - name: test_check_host
        case: 正常
        summary: 端末の中の名前と同じポートだけ通す
        condition: '`parametrize`: `127.0.0.1:5000` / `LOCALHOST:5000` / `127.0.0.1:5001` / `attacker.example:5000` / `None`。`port=5000`、`allowed_hosts=frozenset()`'
        mock: なし
        expected: 真 / 真 / 偽 / 偽 / 偽
      - name: test_check_host_when_allowed
        case: 正常
        summary: 許可したホスト名はポートを問わず通す
        condition: '`parametrize`: `preview.example.test` / `PREVIEW.example.test:8443` / `other.example.test` / `preview.example.test.attacker.example`。`port=5000`、`allowed_hosts=frozenset({"preview.example.test"})`'
        mock: なし
        expected: 真 / 真 / 偽 / 偽
  - name: check_origin
    title: 送り元の確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    scope: public
    summary: '`Origin` が無いか、配信の URL（`http://127.0.0.1:{ポート}`・`http://localhost:{ポート}`）と同じか、スキームが `https`・`http` でポートを外したホスト名が許可するホスト名のどれかと同じかを返す'
    args:
      - name: origin
        type: str | None
        required: true
        passing: positional
        description: '`Origin` の値'
      - name: port
        type: int
        required: true
        passing: positional
        description: 待ち受けのポート
      - name: allowed_hosts
        type: frozenset[str]
        required: true
        passing: keyword
        description: 許可するホスト名（小文字）。呼ぶ側は `ServeContext.allowed_hosts` を渡す
    returns:
      type: bool
      description: 合うか（無いときは真）
    process: |-
      1. `None` なら真
      2. 2 つの URL のどちらかと等しければ真
      3. `urlsplit` で分け、スキームが `https`・`http` で、`netloc` のポートを外したホスト名の部分（`host_part`）が `allowed_hosts` にあれば真、無ければ偽
    unit_tests:
      - name: test_check_origin
        case: 正常
        summary: 無いか配信と同じ送り元だけ通す
        condition: '`parametrize`: `None` / `http://127.0.0.1:5000` / `http://localhost:5000` / `https://attacker.example` / `http://127.0.0.1:5001`。`port=5000`、`allowed_hosts=frozenset()`'
        mock: なし
        expected: 真 / 真 / 真 / 偽 / 偽
      - name: test_check_origin_when_allowed
        case: 正常
        summary: 許可したホスト名の https / http の送り元を通す
        condition: '`parametrize`: `https://preview.example.test` / `http://preview.example.test:8443` / `ftp://preview.example.test` / `https://other.example.test`。`port=5000`、`allowed_hosts=frozenset({"preview.example.test"})`'
        mock: なし
        expected: 真 / 真 / 偽 / 偽
  - name: problem_response
    title: 問題の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: RFC 9457 の `application/problem+json` の応答を作る
    args:
      - name: status
        type: int
        required: true
        passing: positional
        description: ステータスコード
      - name: detail
        type: str
        required: true
        passing: positional
        description: 日本語の中身
    returns:
      type: Response
      description: '本文が `{type: about:blank, title: {標準の理由の文言}, status, detail}`（`ensure_ascii=False`）の応答'
    process: 1. `http.HTTPStatus(status).phrase` を `title` にして本文を作る
    unit_tests:
      - name: test_problem_response
        case: 正常
        summary: 問題の JSON を作る
        condition: '`404` と `項目がありません: D-99`'
        mock: なし
        expected: '`content_type` が `application/problem+json; charset=utf-8`、本文の `status` が 404・`title` が `Not Found`・`detail` が渡した文字列'
  - name: index_response
    title: 画面の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: 雛形に CSS と JavaScript を差し込んだ画面を返す（記録は埋め込まない）
    args:
      - name: preview_dir
        type: Path
        required: true
        passing: positional
        description: 雛形のフォルダ
    returns:
      type: Response
      description: 200・`text/html; charset=utf-8` の応答。雛形の誤りは 500
    process: |-
      1. 雛形を組み立てる（雛形の組み立て。`assemble_template`）
         - `ValueError` の場合、500 を返す（`problem_response`）
           - `[ERROR]` 同梱の雛形の誤り（例外のメッセージ）
      2. 組み立てた HTML を UTF-8 にして返す（要求ごとに読み直し、控えない。プラグインを上げた後に古い画面を返さない）
    unit_tests:
      - name: test_index_response
        case: 正常
        summary: 差し込んだ雛形を返し、記録は空のまま
        condition: 差し込み口と `DATA_ELEMENT` を持つ小さな雛形のフォルダ
        mock: なし
        expected: 200 で、本文に `DATA_ELEMENT` がそのままあり、`STYLE_FILES` の中身が入っている
      - name: test_index_response_when_template_invalid
        case: 正常
        summary: 雛形の誤りは 500
        condition: JavaScript に `</script>` を含む雛形のフォルダ
        mock: なし
        expected: 500 の問題の応答
  - name: records_response
    title: 記録の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: ワークスペースをその場で読んだ記録の JSON を返す。`config.yaml` が検査に通れば最後に通った設定を差し替え、通らなければ最後に通った設定で返す
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈（ワークスペースと最後に検査に通った設定）
      - name: read
        type: Callable[..., dict[str, Any]]
        required: false
        default: read_records
        passing: injected
        description: 記録を読む関数
    returns:
      type: Response
      description: 200・`application/json; charset=utf-8` の応答。読めなければ 422
    process: |-
      1. 記録を読む（記録の読み出し。`read_records`、`last_settings` に `SettingsHolder.current`）
         - `SchemaMismatchError` の場合、`lines` を改行でつないだ `detail` の 422 を返す
         - `WorkspaceNotFoundError` の場合、そのメッセージの 422 を返す
      2. `settings_problem` が `None` なら、読んだ `settings` を最後に検査に通った設定にする（`SettingsHolder.accept`）
      3. `ensure_ascii=False` の JSON を返す
    unit_tests:
      - name: test_records_response
        case: 正常
        summary: 記録を JSON で返す
        condition: D-1 を持つワークスペース
        mock: なし
        expected: 200、本文を `json.loads` すると `decisions` に D-1
      - name: test_records_response_when_schema_mismatch
        case: 正常
        summary: スキーマに合わなければ 422
        condition: '`read` が `SchemaMismatchError(lines=["decisions.yaml: items[0].status: 理由"])` を送る'
        mock: '`read`'
        expected: 422、`detail` がその行
      - name: test_records_response_when_workspace_removed
        case: 正常
        summary: config.yaml が無くなったら 422
        condition: '`read` が `WorkspaceNotFoundError` を送る'
        mock: '`read`'
        expected: '422'
      - name: test_records_response_when_settings_changed
        case: 正常
        summary: 通った設定は控え、崩れた設定では控えた設定で返す
        condition: '`display.network_look: starlight` の設定で作った文脈。`config.yaml` を `dust` にして 1 回、`rainbow` にして 1 回呼ぶ'
        mock: なし
        expected: '1 回目は 200 で `settings.display.network_look` が `dust`、`settings_problem` が `null`。控えが `dust` になる。2 回目は 200 で `dust` のまま、`settings_problem` に `config.yaml: display.network_look: ` で始まる行'
  - name: workspace_signature
    title: 書き換えの印
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: 見ているファイルの名前・更新日時（ナノ秒）・大きさをつないだ文字列を返す
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配っているワークスペース
    returns:
      type: str
      description: 書き換えの印。どれかのファイルが変わる・足される・消されると変わる
    process: |-
      1. `records_root(root)` の下の `config.yaml`・種類ごとの 7 つの YAML・`submissions.yaml`・`changes.yaml`・`docs/` の直下の `*.md` を名前の順に並べる（`.mindstella-opened` は見ない）
      2. ファイルごとに `{名前}:{st_mtime_ns}:{st_size}` を作り（無いファイルは `{名前}:-`）、`|` でつなぐ
    unit_tests:
      - name: test_workspace_signature
        case: 正常
        summary: 書き換え・足す・消すで印が変わる
        condition: '作成済みのワークスペース。`parametrize`: `.mindstella/decisions.yaml` を書き換える / `.mindstella/docs/D-1.md` を足す / `.mindstella/submissions.yaml` を足す / `.mindstella/.mindstella.lock` を足す / `.mindstella/comments.yaml` を足す / `.mindstella/drafts.yaml` を足す'
        mock: なし
        expected: 前の 3 つは印が変わり、`.mindstella.lock`・`comments.yaml`・`drafts.yaml` は変わらない
      - name: test_workspace_signature_with_changes
        case: 正常
        summary: まとまりは見て、前回開いた日時は見ない
        condition: '`parametrize`: `.mindstella/changes.yaml` を足す / `.mindstella/.mindstella-opened` を足す'
        mock: なし
        expected: '`changes.yaml` では印が変わり、`.mindstella-opened` では変わらない'
  - name: stream_events
    title: 書き換えの知らせ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを開く
    scope: public
    summary: 書き換えの印を `POLL_INTERVAL_SEC` ごとに作り直し、変わったら `changed` を、知らせが無いまま `KEEPALIVE_SEC` が過ぎたら保つための行を書き続ける
    side_effects: '`write` で書き続ける'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 配っているワークスペース
      - name: write
        type: Callable[[bytes], None]
        required: true
        passing: positional
        description: 書いて送り出す関数（`wfile.write` と `flush`）
      - name: sleep
        type: Callable[[float], None]
        required: false
        default: time.sleep
        passing: injected
        description: 待つ関数
      - name: clock
        type: Callable[[], float]
        required: false
        default: time.monotonic
        passing: injected
        description: 単調な時計
      - name: signature
        type: Callable[[Path], str]
        required: false
        default: workspace_signature
        passing: injected
        description: 書き換えの印を作る関数
    returns:
      type: None
      description: '`write` が `BrokenPipeError`・`ConnectionResetError` を送ったら戻る'
    process: |-
      1. 今の印を控え、最後に書いた時刻を今にする
      2. つながっている間、繰り返す
         - `POLL_INTERVAL_SEC` 待ち、印を作り直す
         - 印が前と違う場合、`event: changed` と `data: {印}` の知らせを書き、控えと時刻を更める
         - そうでなく、最後に書いてから `KEEPALIVE_SEC` 以上経った場合、`: keepalive` を書く
      3. `write` が `BrokenPipeError`・`ConnectionResetError` を送ったら戻る（画面が閉じた）
    unit_tests:
      - name: test_stream_events
        case: 正常
        summary: 印が変わったときだけ changed を書く
        condition: '`signature` が `a` → `a` → `b` → `b` → `c` を返し、2 回目の `write`（`c` への `changed`）が `BrokenPipeError` を送る。`sleep` は待たない。`clock` は 0.25 ずつ進む'
        mock: '`signature`・`sleep`・`clock`・`write`'
        expected: '書いたものが `event: changed\ndata: b\n\n` の 1 つだけで、戻る'
      - name: test_stream_events_when_idle
        case: 正常
        summary: 変わらないまま 15 秒経つと保つための行を書く
        condition: '`signature` は常に `a`。`clock` は 1 回ごとに 5 秒進む。2 回目の `write` が `ConnectionResetError` を送る'
        mock: '`signature`・`sleep`・`clock`・`write`'
        expected: '1 回目に書いたものが `: keepalive\n\n` で、戻る'
  - name: comments_response
    title: レビュー中の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: コメントを選んで送る
    scope: public

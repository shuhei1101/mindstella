         - `SchemaMismatchError`・`WorkspaceNotFoundError` の場合、422 を返す（`error_response`）
      2. `ensure_ascii=False` の JSON を返す
    unit_tests:
      - name: test_comments_response
        case: 正常
        summary: レビュー中と書きかけを返す。無ければ空
        condition: '`parametrize`: D-1 への C-1 と書きかけを持つ / `comments.yaml`・`drafts.yaml` が無い'
        mock: なし
        expected: 200。`items` に C-1（`target_title` 付き）、`drafts` に 1 件 / `items`・`drafts` が空
      - name: test_comments_response_when_invalid
        case: 正常
        summary: 崩れたファイルは 422
        condition: '`items: [` の `comments.yaml`'
        mock: なし
        expected: '422'
  - name: write_response
    title: 書き込む要求の受け付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    scope: public
    summary: 本文の形と送り元を確かめ、書き換えの鍵を取って渡した処理を呼び、結果の応答を返す
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: content_type
        type: str | None
        required: true
        passing: keyword
        description: '`Content-Type`'
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
      - name: body
        type: bytes
        required: true
        passing: keyword
        description: 要求の本文（`MAX_REQUEST_BYTES` 以下）
      - name: handle
        type: Callable[[Path, dict[str, Any]], dict[str, Any] | None]
        required: true
        passing: keyword
        description: 鍵を取った中で呼ぶ処理。応答の本文（無ければ `None`）を返す
      - name: status
        type: int
        required: true
        passing: keyword
        description: 成功のステータスコード（201・200・204）
    returns:
      type: Response
      description: 成功の応答か、問題の応答
    process: |-
      1. `Content-Type` のメディアタイプが `application/json` でなければ 415 を返す
      2. `Origin` が合わなければ 403 を返す（`check_origin`）
      3. 本文を UTF-8 の JSON として読む
         - 読めないかオブジェクトでなければ 400 を返す
      4. 書き換えの鍵を取って（`workspace_lock`）`handle` を呼ぶ
         - `MindmapError` の場合、`error_response` の応答を返す
      5. `status` で返す（204 は本文を持たない。それ以外は `ensure_ascii=False` の JSON）
    unit_tests:
      - name: test_write_response
        case: 正常
        summary: 処理の結果を指定のステータスで返す
        condition: '`application/json`、`Origin` 無し、`{"a": 1}`。`handle` は `{"ok": true}` を返す。`parametrize`: `status=201` / `status=204`（`handle` は `None`）'
        mock: '`handle`'
        expected: '201 で本文 `{"ok": true}` / 204 で本文が空。`handle` が `(root, {"a": 1})` で 1 回呼ばれる'
      - name: test_write_response_when_rejected
        case: 正常
        summary: 形・送り元の誤りは処理を呼ばずに問題の応答
        condition: '`parametrize`: `text/plain` / `Origin: https://attacker.example` / 本文 `[1]` / 本文 `{`'
        mock: '`handle`'
        expected: 415 / 403 / 400 / 400。`handle` が呼ばれない
  - name: delete_response
    title: コメントを消す受け付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: コメントを選んで送る
    scope: public
    summary: 送り元を確かめ、書き換えの鍵を取ってコメントを消し、消した中身を返す（本文を持たないため `Content-Type` は確かめない）
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
      - name: comment_id
        type: str
        required: true
        passing: keyword
        description: 消すコメントの ID
    returns:
      type: Response
      description: 200 の `{id, target, loc, body, created, count}`、または問題の応答
    process: |-
      1. `Origin` が合わなければ 403 を返す（`check_origin`）
      2. 書き換えの鍵を取って（`workspace_lock`）コメントを消す（`delete_comment`）
         - `MindmapError` の場合、`error_response` の応答を返す
      3. 200 で消した中身と件数を返す
    unit_tests:
      - name: test_delete_response
        case: 正常
        summary: 消して中身を返し、送り元が違えば消さない
        condition: 'C-1・C-2 を持つワークスペース。`parametrize`: `Origin` 無しで `C-2` / `Origin: https://attacker.example` で `C-2` / `Origin` 無しで `C-9`'
        mock: なし
        expected: 200 で `id` が C-2・`count` が 1 / 403 / 404。後の 2 つは `comments.yaml` が呼ぶ前と同じ
  - name: error_response
    title: エラーの応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 共通
    scope: public
    summary: ツールのエラーの種類からステータスコードを決めて問題の応答にする
    args:
      - name: error
        type: MindmapError
        required: true
        passing: positional
        description: 処理が送った例外
    returns:
      type: Response
      description: 問題の応答
    process: |-
      1. 種類で分ける
         - `CommentInvalidError`・`SettingsInvalidError` は 400
         - `ItemNotFoundError`・`CommentNotFoundError` は 404
         - `CommentConflictError` は 409（`stale` があれば本文に `stale: [{id, reason}]` を足す）
         - `WorkspaceNotFoundError`・`SchemaMismatchError` は 422（`detail` はメッセージに `lines` を改行でつないだもの）
         - `WriteFailedError` は 500
         - それ以外は 500
           - `[ERROR]` 渡された種類のないエラー（例外の種類・メッセージ）
      2. `detail` にメッセージを入れた問題の応答を返す（`problem_response`。トレースバックを含めない）
    unit_tests:
      - name: test_error_response
        case: 正常
        summary: 種類ごとのステータスコード
        condition: '`parametrize`: `CommentInvalidError` / `SettingsInvalidError` / `ItemNotFoundError` / `CommentNotFoundError` / `CommentConflictError(stale=[(C-2, 理由)])` / `SchemaMismatchError(lines=[行])` / `WriteFailedError`'
        mock: なし
        expected: '400 / 400 / 404 / 404 / 409（本文の `stale` が `[{id: C-2, reason: 理由}]`）/ 422（`detail` にその行）/ 500'
  - name: opened_response
    title: 前回開いた日時の応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 前回からの差分を見る
    scope: public
    summary: 前回開いた日時を返し、今の日時に書き換える（インターフェース定義『前回開いた日時』）
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配っているワークスペース
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: Response
      description: 200 と `{previous, opened}`、書けなければ 500 の problem+json
    process: |-
      1. 前回開いた日時を書き換える（`touch_opened`。記録のロックは取らない）
         - `WriteFailedError` の場合、500 を返す（`problem_response`、`detail` に理由）
      2. 200・`application/json; charset=utf-8`・`Cache-Control: no-store` で `{previous, opened}` を返す
    unit_tests:
      - name: test_opened_response
        case: 正常
        summary: 2 回目は 1 回目の日時を返す
        condition: '`.mindstella-opened` を持たないワークスペースで 2 回呼ぶ。`now` は 1 回目と 2 回目で違う日時'
        mock: '`now`'
        expected: 1 回目の `previous` が `null`、2 回目の `previous` が 1 回目の `opened`
      - name: test_opened_response_when_write_fails
        case: 異常
        summary: 書けなければ 500
        condition: '`touch_opened` を `WriteFailedError` を送る関数に差し替える'
        mock: '`touch_opened`（`serve` モジュールの参照を monkeypatch）'
        expected: ステータスが 500、`Content-Type` が `application/problem+json`
        exception: 書き込めない
  - name: reload_response
    title: 設定の再読み込みの応答
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: 設定の再読み込み
    scope: public
    summary: '`config.yaml` を検査し、通れば最後に検査に通った設定を差し替えて知らせ、通らなければ違う箇所を返す（インターフェース定義『設定の再読み込み』）'
    args:
      - name: context
        type: ServeContext
        required: true
        passing: positional
        description: 配信の文脈
      - name: origin
        type: str | None
        required: true
        passing: keyword
        description: '`Origin`'
    returns:
      type: Response
      description: 200 と `{settings}`、または問題の応答
    process: |-
      1. `Origin` が合わなければ 403 を返す（`check_origin`）
      2. `config.yaml` を検査する（`check_settings`。書き換えの鍵は取らない）
         - `WorkspaceNotFoundError` の場合、422 を返す（`error_response`）
         - 問題がある場合、問題ごとの `config.yaml: {キーのパス}: {理由}` を改行でつないだ `detail` の 422 を返す（最後に通った設定はそのまま）
      3. 読んだ設定に差し替えて回数を進め（`SettingsHolder.reload`。書き換えの印が変わり、書き換えの知らせが届く）、200 で `{settings}` を返す
    unit_tests:
      - name: test_reload_response
        case: 正常
        summary: 通れば差し替え、通らなければ前の設定のまま違う箇所を返す
        condition: '`display.network_look: starlight` の設定で作った文脈。`parametrize`: `config.yaml` を `dust` にして `Origin` 無し / `rainbow` にして `Origin` 無し / `dust` にして `Origin: https://attacker.example`'
        mock: なし
        expected: '200 で `settings.display.network_look` が `dust`、控えが `dust` で `revision` が 1 / 422 で `detail` に `config.yaml: display.network_look: `、控えが `starlight` で `revision` が 0 / 403 で控えが `starlight`。どれも `config.yaml` を書き換えていない'
  - name: host_part
    title: ホスト名の部分
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    scope: public
    summary: '`Host` か `Origin` の `netloc` から、末尾の `:{数字}` を外して小文字にしたホスト名を返す'
    args:
      - name: value
        type: str
        required: true
        passing: positional
        description: '`host` か `host:port`'
    returns:
      type: str
      description: 小文字のホスト名
    process: |-
      1. 最後の `:` より後ろが全て数字なら、その `:` から後ろを外す
      2. 小文字にして返す
    unit_tests:
      - name: test_host_part
        case: 正常
        summary: 末尾のポートだけを外して小文字にする
        condition: '`parametrize`: `Preview.Example.test:8443` / `preview.example.test` / `preview.example.test:` '
        mock: なし
        expected: '`preview.example.test` / `preview.example.test` / `preview.example.test:`'
  - name: load_external_access
    title: 外から見る設定の読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    scope: public
    summary: 環境変数から許可するホスト名とフックを読み、`ExternalAccess` を返す
    args:
      - name: environ
        type: Mapping[str, str]
        required: true
        passing: positional
        description: 読む環境変数（`os.environ`）
    returns:
      type: ExternalAccess
      description: 外から見る設定（どれも無ければ空の既定値）
    process: |-
      1. `ALLOWED_HOSTS_ENV` をカンマで分け、前後の空白を外して小文字にする
         - 空の要素は捨てる
         - `:`・`/` を含む要素は捨てる
           - `[WARNING]` 許可するホスト名に使えない値を外した（値）
      2. `START_HOOK_ENV`・`STOP_HOOK_ENV` を `shlex.split` で分ける
         - 分けられない（`ValueError`）場合、その値は空にする
           - `[WARNING]` フックのコマンドを分けられない（環境変数の名前、理由）
      3. 3 つの値で `ExternalAccess` を返す
    unit_tests:
      - name: test_load_external_access
        case: 正常
        summary: 3 つの環境変数を読み分ける
        condition: '`{ALLOWED_HOSTS_ENV: " Preview.example.test , ,https://x.example,a.example:443 ", START_HOOK_ENV: "pub add", STOP_HOOK_ENV: "pub rm"}`'
        mock: なし
        expected: '`allowed_hosts` が `{"preview.example.test"}`、`start_hook` が `("pub", "add")`、`stop_hook` が `("pub", "rm")`'
      - name: test_load_external_access_when_empty
        case: 正常
        summary: どれも無ければ空の既定値
        condition: 空の辞書
        mock: なし
        expected: '`ExternalAccess()` と等しい'
      - name: test_load_external_access_when_hook_unparsable
        case: 異常
        summary: 分けられないフックは空にする
        condition: '`{START_HOOK_ENV: "pub \"add"}`（閉じない引用符）'
        mock: なし
        expected: '`start_hook` が `()` で、例外を送らない'
  - name: run_hook
    title: フックの呼び出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/serve.py
    usecase: プレビューを外から見る
    scope: public
    summary: フックのコマンドの末尾にポートとワークスペースの名前を足し、新しいセッションで立てて終わりを待たずに返す
    side_effects: 子プロセスを立てる
    args:
      - name: command
        type: tuple[str, ...]
        required: true
        passing: positional
        description: フックのコマンドと引数（空でない）
      - name: port
        type: int
        required: true
        passing: positional
        description: 配信のポート
      - name: name
        type: str
        required: true
        passing: positional
        description: ワークスペースのフォルダの名前
    returns:
      type: bool
      description: 立てられたか
    process: |-
      1. `subprocess.Popen([*command, str(port), name], start_new_session=True, stdin=DEVNULL, stdout=DEVNULL, stderr=DEVNULL)` で立てる（シェルを通さない・終わりを待たない）
         - `OSError` が起きた場合、偽を返す
           - `[WARNING]` フックを立てられない（コマンド、理由）
      2. 真を返す
    unit_tests:
      - name: test_run_hook
        case: 正常
        summary: 末尾にポートと名前を足して立てる
        condition: "`command=(sys.executable, \"-c\", \"import sys,pathlib; pathlib.Path(sys.argv[1]).write_text(' '.join(sys.argv[2:]))\", {一時ファイル})`、`port=47800`、`name=\"家計簿\"`"
        mock: なし（本物の子プロセス）
        expected: 真を返し、待つと一時ファイルの中身が `47800 家計簿`
      - name: test_run_hook_when_command_missing
        case: 異常
        summary: コマンドが無ければ偽で例外を送らない
        condition: '`command=("mindstella-no-such-command",)`'
        mock: なし
        expected: 偽
test_files:
  - tests/unit/scripts/test_serve.py

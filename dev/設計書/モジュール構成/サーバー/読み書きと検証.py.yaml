title: "サーバー / 読み書きと検証"
lead: ワークスペースの YAML と本文を読み書きし、JSON Schema と突き合わせる。ほかの全てのモジュールがここに依存し、ここはほかに依存しない。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    schemas/
      common.schema.json       共通のキー（$defs）
      settings.schema.json     config.yaml
      decisions.schema.json    ほか 6 種類も同じ名前の付け方（tasks / research / docs / terms / notes / logs）
      submissions.schema.json  submissions.yaml（『送信』が使う）
      comments.schema.json     comments.yaml（『コメント』が使う）
      drafts.schema.json       drafts.yaml（『コメント』が使う）
    scripts/
      kinds.py                 種類の定義と状態の分類（定数）
      errors.py                ツールのエラーにする例外
      store.py                 読み込み・検証・採番・書き込み・書き換えの鍵
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class ワークスペース
        class 種類の定義
        class 問題
        class 書き込みの変更
        class 本文の書き込み
        class 項目の場所
        ワークスペース --> 問題 : 読めなかったファイル
        書き込みの変更 --> 本文の書き込み
        項目の場所 --> 種類の定義
      ```
data_models:
  - name: KindSpec
    title: 種類の定義
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    role: DTO
    summary: 1 種類のファイル・ID の頭の文字・スキーマ・状態の有無（本文はどの種類も持てる）
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 種類（`decision` など）
      - name: file
        type: str
        description: ワークスペースの中の YAML のファイル名
        example: decisions.yaml
      - name: prefix
        type: str
        description: ID の頭の文字
        example: D
      - name: schema
        type: str
        description: '`schemas/` のスキーマのファイル名'
        example: decisions.schema.json
      - name: settled_statuses
        type: frozenset[str]
        description: 決着とみなす状態。状態を持たない種類は空
  - name: Workspace
    title: ワークスペース
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: 読み込んだ設定・種類ごとの項目・読めなかったファイル
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。項目は YAML のままの `dict` で持ち、型はスキーマが守る。'
    properties:
      - name: root
        type: Path
        description: ワークスペースのフォルダ（絶対パス）
      - name: raw
        type: dict[str, Any]
        description: 'ファイル名 → 読んだ値そのまま（設定と 7 種類。無い種類のファイルは `{"items": []}`、YAML として読めないファイルは含めない）。検証はこの値をスキーマと突き合わせる'
      - name: settings
        type: dict[str, Any]
        description: '`config.yaml` の値。辞書でない・読めないときは空'
      - name: items
        type: dict[Kind, list[dict[str, Any]]]
        description: 種類ごとの `items`（ファイルの並びのまま）。一番上が辞書で `items` が配列のときだけ取り出し、それ以外は空（配列の要素のうち辞書でないものも除く）
      - name: load_problems
        type: list[Problem]
        description: 'YAML として読めなかったファイル（`kind: schema`・`key: (全体)`）'
  - name: Problem
    title: 問題
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: スキーマ違反・参照切れなど 1 件の問題
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。点検の出力の `problems[]` と同じキーを持ち、`dataclasses.asdict` で JSON にする。'
    properties:
      - name: kind
        type: Literal["schema", "duplicate_id", "broken_ref", "missing_body", "orphan_body", "unknown_phase", "stale_history", "decision_state"]
        description: 問題の種類
      - name: file
        type: str
        description: 記録のフォルダ（`records_root(root)`）からの相対パス（`decisions.yaml` の形）。点検の結果に返すときは、モジュール構成『点検』の `check_workspace` がワークスペースからの相対パス（`.mindstella/decisions.yaml`）にする
      - name: id
        type: str | None
        description: 問題のある項目の ID
      - name: key
        type: str | None
        description: キーのパス（`items[0].status` の形）
      - name: detail
        type: str
        description: 中身
  - name: ItemRef
    title: 項目の場所
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: ID で引いた項目と、その種類・並びの位置
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 種類
      - name: index
        type: int
        description: '`items` の中の位置'
      - name: item
        type: dict[str, Any]
        description: 項目
  - name: BodyWrite
    title: 本文の書き込み
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: '`docs/` に書く 1 つの本文'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: name
        type: str
        description: '`docs/` の中のファイル名（`{ID}.md`）'
      - name: text
        type: str
        description: 本文の Markdown
  - name: Change
    title: 書き込みの変更
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: 1 つの種類の項目の並びを丸ごと置き換える変更と、一緒に書く本文
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 書き換える種類
      - name: items
        type: list[dict[str, Any]]
        description: 書き換えた後の `items` の並び全体
      - name: body
        type: BodyWrite | None
        default: None
        description: 一緒に書く本文
      - name: changes
        type: Changes | None
        default: None
        description: 一緒に書く `changes.yaml` の新しい中身（モジュール構成『変更履歴』）。変えないときは `None`
  - name: BatchChange
    title: まとめた書き込みの変更
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の追加と更新
    role: DTO
    summary: 複数の種類の項目の並びと複数の本文とまとまりを、一緒に書く変更
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。`add`・`update`・`edit_option`・`batch` が使う。'
    properties:
      - name: items
        type: dict[Kind, list[dict[str, Any]]]
        description: 書き換える種類 → 書き換えた後の `items` の並び全体（書き換えない種類は持たない）
      - name: bodies
        type: list[BodyWrite]
        default: '[]'
        description: 一緒に書く本文（同じ名前は 1 つだけ。後のものを残す）
      - name: changes
        type: Changes | None
        default: None
        description: 一緒に書く `changes.yaml` の新しい中身。変えないときは `None`
enums:
  - name: Kind
    title: 種類
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: ワークスペースの項目の種類（`Literal` の型エイリアス）
    values:
      - value: decision
        title: 検討事項
        description: decisions.yaml・D
      - value: task
        title: タスク
        description: tasks.yaml・T
      - value: research
        title: 調査
        description: research.yaml・R
      - value: doc
        title: 資料
        description: docs.yaml・A
      - value: term
        title: 用語集
        description: terms.yaml・G
      - value: note
        title: メモ
        description: notes.yaml・N
      - value: log
        title: 会話ログ
        description: logs.yaml・L
classes:
  - name: MindmapError
    title: ツールのエラー
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: 入口（`call_tool`）が捕まえてツールのエラーにする例外の親。配信は子の種類でステータスコードを決める
    kind: クラス
    inherits: Exception
    properties:
      - name: lines
        type: list[str]
        description: '`エラー: {内容}` の後に続けて本文に出す行'
  - name: WorkspaceNotFoundError
    title: ワークスペースが無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: '`config.yaml` が無いフォルダを指した。メッセージにフォルダのパス。`mindmap.yaml`（前の版の設定ファイル）だけがあるフォルダでは、`lines` に `UPGRADE_HINT` を持つ（`require_workspace`）'
    kind: クラス
    inherits: MindmapError
  - name: WorkspaceExistsError
    title: ワークスペースが既にある
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: ワークスペースの作成
    summary: '`config.yaml` か `mindmap.yaml`（前の版の設定ファイル）が既にあるフォルダに作ろうとした。メッセージにフォルダのパス'
    kind: クラス
    inherits: MindmapError
  - name: SchemaMismatchError
    title: スキーマに合わない
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: '書き込もうとした・書き出そうとした・読もうとしたワークスペースがスキーマに合わない。`lines` は問題ごとの `{ファイル名}: {キーのパス}: {理由}`。`legacy`（既定 `False`）は、問題に前の版の形式のものがあるか（ワークスペースを検証して送る側が `is_legacy_problem` で決める。`save_change`・`export_preview`・`read_records` が当たる）'
    kind: クラス
    inherits: MindmapError
  - name: ItemNotFoundError
    title: ID が無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: 渡した ID の項目が無い。メッセージに ID
    kind: クラス
    inherits: MindmapError
  - name: OptionNotFoundError
    title: 案が無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: '検討事項が渡した記号の案を持たない。メッセージは送る側が決める（採用する案の切り替えの `switch_adopted` は渡した記号と持っている記号の一覧、案の書き換えの `apply_option_edit` は `{ID} の案 {記号}: その記号の案がありません`）'
    kind: クラス
    inherits: MindmapError
  - name: WriteFailedError
    title: 書き込みに失敗した
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: ファイルの書き込み・置き換えで `OSError` が起きた。後始末をした後に送る。メッセージに置き換え先のパスと `OSError` の理由（`raise ... from` で元の例外をつなぐ）
    kind: クラス
    inherits: MindmapError
  - name: DownloadFailedError
    title: 取れなかった
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 配る書き出し
    summary: 配る書き出しで jsDelivr から配布ファイルかライセンスの本文を取れないか、配布ファイルが雛形の `integrity` と合わない。メッセージに URL と理由（`raise ... from` で元の例外をつなぐ）
    kind: クラス
    inherits: MindmapError
  - name: WorkspaceNewerError
    title: ワークスペースの版が新しい
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 記録の形式の移行
    summary: ワークスペースの版がプラグインの版より新しいのに手順を当てる・版を書く。メッセージに 2 つの版とプラグインの更新の案内
    kind: クラス
    inherits: MindmapError
  - name: StepFailedError
    title: 手順が失敗した
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 記録の形式の移行
    summary: '移し替えの手順が失敗し、写しから戻した。メッセージは `{版} の手順 {番号}（{操作}）: {理由}`'
    kind: クラス
    inherits: MindmapError
  - name: StepsInvalidError
    title: 手順の形が違う
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 記録の形式の移行
    summary: プラグインの `steps.yaml` が読めないか、手順の形のスキーマに合わない。`lines` は合わない箇所
    kind: クラス
    inherits: MindmapError
  - name: ArgumentError
    title: 引数の誤り
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: 'ツールが確かめる引数の誤り（一緒に使わない引数・値の形が違う・`out` が `.html` で終わらない）。メッセージは `引数の誤り: {引数の名前}: {理由}`'
    kind: クラス
    inherits: MindmapError
    properties:
      - name: argument
        type: str
        description: 誤った引数の名前
  - name: SubmissionNotFoundError
    title: 送信が無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 送信の取り込み
    summary: 渡した ID の送信が無い。メッセージに ID
    kind: クラス
    inherits: MindmapError
  - name: ServeFailedError
    title: 配信を立てられない
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: プレビューを開く
    summary: プレビューの配信の待ち受けを立てられない（`OSError`）。メッセージに理由（`raise ... from` で元の例外をつなぐ）
    kind: クラス
    inherits: MindmapError
  - name: UnmappedPhaseError
    title: 対応の無いフェーズ
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 設定の更新
    summary: '新しい `phases` に対応の無いフェーズを持つ項目か `goal.phase` が残る。メッセージは `新しいフェーズに対応の無いフェーズが残ります`、`lines` に残るものごとの `{ID か goal}: {フェーズ}`'
    kind: クラス
    inherits: MindmapError
    properties:
      - name: unmapped
        type: list[tuple[str, str]]
        description: 残るもの（ID か `goal`、フェーズ）
  - name: CommentInvalidError
    title: コメントの中身の誤り
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 項目へコメントする
    summary: 'コメント・書きかけ・まとめて送るの要求のキーが無い・型が違う、本文が空白だけか上限を超える、箇所の形が崩れている。配信は 400 にする。メッセージは `{キーのパス}: {理由}`'
    kind: クラス
    inherits: MindmapError
  - name: CommentNotFoundError
    title: コメントが無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: コメントを選んで送る
    summary: 渡した ID のコメントがレビュー中に無い。配信は 404 にする。メッセージに無い ID（複数なら、でつなぐ）
    kind: クラス
    inherits: MindmapError
  - name: CommentConflictError
    title: コメントが今の記録に合わない
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: コメントを選んで送る
    summary: 箇所が今の項目に合わない、向けた項目が消えた、または元に戻す ID が使えない。配信は 409 にする。メッセージは合わない理由。`stale` にコメントごとの `(ID, 理由)` を持つ（まとめて送るときだけ。それ以外は空）
    kind: クラス
    inherits: MindmapError
    properties:
      - name: stale
        type: list[tuple[str, str]]
        description: 合わないコメントの ID と理由。溜めた順
  - name: OptionExistsError
    title: 同じ記号の案がある
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 検討事項の案の編集
    summary: '足そうとした記号の案を検討事項が既に持つ。メッセージは `{ID} の案 {記号}: 同じ記号の案が既にあります`'
    kind: クラス
    inherits: MindmapError
  - name: AdoptedOptionError
    title: 採用している案
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 検討事項の案の編集
    summary: '採用している案を消そうとした。メッセージは `{ID} の案 {記号}: 採用している案は消せません。先に adopt で採用をほかの案へ移してください`'
    kind: クラス
    inherits: MindmapError
  - name: UnmappedTargetError
    title: 対応の無い対象・カテゴリー
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 設定の更新
    summary: '新しい `targets`・`categories` に対応の無い対象・カテゴリーを持つ項目かカテゴリーが残る。メッセージは `新しい設定に対応の無い対象・カテゴリーが残ります`、`lines` に残るものごとの `{ID か categories[{名前}]}: {target か category}: {名前}`'
    kind: クラス
    inherits: MindmapError
    properties:
      - name: unmapped
        type: list[tuple[str, str, str]]
        description: 残るもの（ID か `categories[{名前}]`、キー、名前）
  - name: SettingsInvalidError
    title: 表示の既定の中身の誤り
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: ワークスペースの既定を変える
    summary: '既定の書き換えの要求の本文に `network_look`・`visible_kinds` が無い・値が合わない。配信は 400 にする。メッセージは `{キー}: {理由}`（選べる値を含む）'
    kind: クラス
    inherits: MindmapError
  - name: LastOptionError
    title: 最後の案
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 検討事項の案の編集
    summary: '案を必須にする状態の検討事項の最後の案を消そうとした。メッセージは `{ID} の案 {記号}: 状態 {状態} の検討事項は案を 1 つ以上持ちます。先に add で別の案を足してください`'
    kind: クラス
    inherits: MindmapError
constants:
  - name: KINDS
    title: 種類の一覧
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: 種類 → 種類の定義。並びは D・T・R・A・G・N・L の順で、一覧を出す並びにも使う
    entries:
      - key: decision
        value: decisions.yaml / D / decisions.schema.json
        description: '決着: 決定済み・対象外・取り下げ'
      - key: task
        value: tasks.yaml / T / tasks.schema.json
        description: '決着: 完了・中止'
      - key: research
        value: research.yaml / R / research.schema.json
        description: 状態なし
      - key: doc
        value: docs.yaml / A / docs.schema.json
        description: 状態なし
      - key: term
        value: terms.yaml / G / terms.schema.json
        description: 状態なし
      - key: note
        value: notes.yaml / N / notes.schema.json
        description: 状態なし
      - key: log
        value: logs.yaml / L / logs.schema.json
        description: 状態なし
  - name: SETTINGS_FILE
    title: 設定のファイル名
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: ワークスペースの設定のファイル名（`records_root(root)` の下）
    value: '"config.yaml"'
  - name: BODY_DIR
    title: 本文のフォルダ名
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: 本文の Markdown を置くフォルダ名（`records_root(root)` の下）
    value: '"docs"'
  - name: RELEASE_DIR
    title: リリースのフォルダ名
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: ワークスペースの作成
    summary: ゴール判定で書き出す資料のフォルダ名（`records_root(root)` の下）
    value: '"release"'
  - name: SCHEMA_DIR
    title: スキーマのフォルダ
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: このファイルから見た `plugins/mindstella/skills/mindmap/schemas/`
    value: Path(__file__).resolve().parent.parent / "schemas"
  - name: COMMON_SCHEMA
    title: 共通のスキーマのファイル名
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: Registry に登録し、各種類のスキーマが `$ref` で指す名前
    value: '"common.schema.json"'
  - name: SETTINGS_SCHEMA

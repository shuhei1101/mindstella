  - name: find_item
    title: 項目の引き当て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: ID で項目を引く
    args:
      - name: workspace
        type: Workspace
        required: true

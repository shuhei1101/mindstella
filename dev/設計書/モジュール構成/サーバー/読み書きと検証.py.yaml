      type: str
      description: YAML の文字列
    process: 1. `yaml.safe_dump(data, allow_unicode=True, sort_keys=False)` を返す
    unit_tests:
      - name: test_dump_yaml
        case: 正常
        summary: 日本語とキーの並びを保つ
        condition: '`{"title": "問い", "id": "D-1"}`'
        mock: なし
        expected: '`title: 問い` の行が `id: D-1` の行より前にある'
  - name: _read_yaml
    title: YAML の読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: 1 ファイルを `yaml.safe_load` で読む
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 読むファイル
    returns:
      type: Any
      description: 読んだ値（空のファイルは `None`）
    process: 1. UTF-8 で読み、`yaml.safe_load` の結果を返す（`yaml.YAMLError` はそのまま伝える）
  - name: _format_path
    title: キーのパスの文字列化
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: '`absolute_path` を `items[0].status` の形の文字列にする'
    args:
      - name: path
        type: Iterable[str | int]
        required: true
        passing: positional
        description: キーと添字の並び
    returns:
      type: str
      description: 添字は `[n]`、キーは `.` でつなぐ。空なら `(全体)`
    process: |-
      1. 整数は直前に `[n]` をつなぎ、文字列は `.` でつなぐ（先頭は `.` を付けない）
      2. 空のときは `(全体)` を返す
    unit_tests:
      - name: test_format_path
        case: 正常
        summary: キーと添字をつなぐ
        condition: '`["items", 0, "options", 1, "key"]`・`[]`'
        mock: なし
        expected: '`items[0].options[1].key`・`(全体)`'
  - name: _write_temp
    title: 一時ファイルの書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: 置き換え先と同じフォルダに一時ファイルを書き、そのパスを返す
    args:
      - name: target
        type: Path
        required: true
        passing: positional
        description: 置き換え先
      - name: text
        type: str
        required: true
        passing: positional
        description: 中身
    returns:
      type: Path
      description: 一時ファイルのパス
    process: |-
      1. `tempfile.mkstemp(dir=target.parent, suffix=TEMP_SUFFIX)` で作り、UTF-8 で書く
      2. 一時ファイルの権限を揃える（`mkstemp` は `0600` で作るため、置き換えた後の権限が変わらないようにする）
         - `target` がある場合、その権限を写す（`shutil.copymode`）
         - 無い場合、`0o666 & ~umask` にする
      3. 一時ファイルのパスを返す
    unit_tests:
      - name: test_write_temp_when_mode
        case: 正常
        summary: 置き換え先の権限を一時ファイルに写す
        condition: '`parametrize`: `0o640` の置き換え先がある / 置き換え先が無く umask が `0o022`。Windows では skip'
        mock: なし（umask は `os.umask` で設定し、後で戻す）
        expected: 一時ファイルの権限が `0o640` / `0o644`
  - name: is_legacy_problem
    title: 前の版の形式の問題か
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の形式の移行
    scope: public
    summary: 問題が、前の版の形式（資料の `done`・題名の無い設定）から来ているかを返す
    args:
      - name: problem
        type: Problem
        required: true
        passing: positional
        description: 問題
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 問題を出したワークスペース
    returns:
      type: bool
      description: 前の版の形式から来ていれば真
    process: |-
      1. `kind` が `schema` でない場合、偽を返す
      2. `file` が `mindmap.yaml` の場合、`raw` の設定が辞書で `summary` を持たなければ真
      3. `file` が `docs.yaml` で `id` がある場合、その ID の資料が `done` を持ち `status` を持たなければ真
      4. それ以外は偽
    unit_tests:
      - name: test_is_legacy_problem
        case: 正常
        summary: 前の版の形式の問題を見分ける
        condition: '`summary` を持たない設定と A-1（`done: true`）、`status` を `完了` にした D-1 を持つワークスペースを検証した問題。`parametrize`: `mindmap.yaml` の問題 / A-1 の問題 / D-1 の問題 / `kind: broken_ref` の問題'
        mock: なし
        expected: 真 / 真 / 偽 / 偽
  - name: clear_release
    title: リリースの片付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: リリースの片付け
    scope: public
    summary: '`release/` の中身を消し、空の `release/` を残す'
    side_effects: '`release/` の中のファイルとフォルダを消す（`release/` が無ければ作る）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: list[str]
      description: 消したものの `release/` からのパス（フォルダは末尾に `/`。名前の順）
    process: |-
      1. `root/mindmap.yaml` が無ければ `WorkspaceNotFoundError` を送る
      2. `root / RELEASE_DIR` を作る（あればそのまま）
      3. 中の項目を名前の順に消す（シンボリックリンクとファイルは `Path.unlink`、リンクでないフォルダは `shutil.rmtree`。リンク先は消さない）。消したものを戻り値に足す
         - `OSError` が起きた場合、そこで止めて `WriteFailedError` を送る（それまでに消したものは戻さない。次の呼び出しで片付く）
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`root` に `mindmap.yaml` が無い'
        message: 'ワークスペースがありません: {root}'
      - name: WriteFailedError
        condition: '`release/` を作るか中のものを消す途中で `OSError` が起きた'
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_clear_release
        case: 正常
        summary: release/ の中のファイルとフォルダを消す
        condition: 作成済みのワークスペースの `release/` に `古い資料.md` と、ファイルを 1 つ持つ `図/`
        mock: なし
        expected: 戻り値が `["古い資料.md", "図/"]`。`release/` があり、中身が空。`mindmap.yaml` が呼ぶ前と同じ
      - name: test_clear_release_when_release_dir_missing
        case: 正常
        summary: release/ が無ければ空の release/ を作る
        condition: '`release/` を消し、`handoff/` に `資料.md` を置いたワークスペース'
        mock: なし
        expected: 戻り値が空。空の `release/` がある。`handoff/` が呼ぶ前と同じ
      - name: test_clear_release_when_workspace_missing
        case: 異常
        summary: mindmap.yaml が無ければ何も消さない
        condition: '`mindmap.yaml` が無く、`release/` に `資料.md` がある `tmp_path`'
        mock: なし
        expected: '`WorkspaceNotFoundError`。`release/資料.md` が残っている'
        exception: mindmap.yaml が無い
      - name: test_clear_release_when_remove_fails
        case: 異常
        summary: 消せないものに当たったらそこで止める
        condition: '`release/` に `一.md`・`二.md`。`Path.unlink` を `二.md` のときだけ `PermissionError` を送るように差し替える（`failing_unlink`）'
        mock: '`Path.unlink`（monkeypatch）'
        expected: '`WriteFailedError`（メッセージに `二.md` のパス）。`二.md` が残り、`一.md` は無い'
        exception: 消す途中で OSError
  - name: workspace_lock
    title: 書き換えの鍵
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: プロセスの中の鍵と、ワークスペースの `LOCK_FILE` の排他ロックをこの順に取る、`with` で使う文脈
    description: '`@contextlib.contextmanager` で書く。ワークスペースを書き換えるツール（`call_tool`）と送信の受け付け（配信）が、読む前から書き終えるまでの間だけ持つ。'
    side_effects: '`LOCK_FILE` が無ければ作る。`create` が真のときだけ、フォルダが無ければ作る（`init` がまだ無いフォルダへ書くため）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
      - name: process_lock
        type: threading.Lock
        required: true
        passing: positional
        description: プロセスの中の書き換えの鍵
      - name: create
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: まだ無いワークスペースを作るか（`init` だけ真）
    returns:
      type: Iterator[None]
      description: 鍵とロックを持っている間だけ返す
    process: |-
      1. `process_lock` を取る
      2. `create` が真なら `root` を作る（`exist_ok`）。偽なら、`root/mindmap.yaml` が無ければ何も作らずに `WorkspaceNotFoundError` を送る（`process_lock` は放す）
      3. `LOCK_FILE` を追記で開いて `fcntl.flock(LOCK_EX)` で取れるまで待つ
      4. 呼び出し元の処理を動かす
      5. 処理が例外で終わったときも、`LOCK_UN` してファイルを閉じ、`process_lock` を放す
    unit_tests:
      - name: test_workspace_lock
        case: 正常
        summary: 鍵とロックを持ち、抜けたら放す
        condition: '`mindmap.yaml` を置いた `tmp_path` と `threading.Lock()`。`with` の中で別の子プロセスが同じ `LOCK_FILE` に `flock(LOCK_EX | LOCK_NB)` を試す'
        mock: なし
        expected: '`with` の中では子プロセスが `BlockingIOError` で取れず、`process_lock.locked()` が真。抜けた後は子プロセスが取れ、`process_lock` が外れている'
      - name: test_workspace_lock_when_raises
        case: 正常
        summary: 中の処理が例外でも放す
        condition: '`mindmap.yaml` を置いた `tmp_path`。`with` の中で `ValueError` を送る'
        mock: なし
        expected: '`ValueError` が伝わり、`process_lock` が外れ、子プロセスがロックを取れる'
      - name: test_workspace_lock_when_folder_missing
        case: 正常
        summary: まだ無いフォルダも作って取る
        condition: '`tmp_path / "ws"`（無い）と `create=True`'
        mock: なし
        expected: '`tmp_path / "ws" / ".mindstella.lock"` がある'
      - name: test_workspace_lock_when_not_workspace
        case: 異常
        summary: ワークスペースでないフォルダには何も作らない
        condition: '`parametrize`: 空の `tmp_path` / `tmp_path / "typo" / "ws"`（無い）。`create` は既定（偽）'
        mock: なし
        expected: '`WorkspaceNotFoundError` が伝わり、`process_lock` が外れている。`tmp_path` の中は空のまま（`typo` も作られない）'
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`create` が偽で、`root` に `mindmap.yaml` が無い'
        message: 'ワークスペースがありません: {root}'
test_files:
  - tests/unit/scripts/test_kinds.py
  - tests/unit/scripts/test_store.py

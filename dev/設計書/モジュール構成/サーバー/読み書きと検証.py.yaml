title: "サーバー / 読み書きと検証"
lead: ワークスペースの YAML と本文を読み書きし、JSON Schema と突き合わせる。ほかの全てのモジュールがここに依存し、ここはほかに依存しない。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    schemas/
      common.schema.json       共通のキー（$defs）
      settings.schema.json     mindmap.yaml
      decisions.schema.json    ほか 6 種類も同じ名前の付け方（tasks / research / docs / terms / notes / logs）
      submissions.schema.json  submissions.yaml（『送信』が使う）
    scripts/
      kinds.py                 種類の定義と状態の分類（定数）
      errors.py                ツールのエラーにする例外
      store.py                 読み込み・検証・採番・書き込み・書き換えの鍵
  ```
diagrams:
  - name: 全体
    diagram: |-
      ```mermaid
      classDiagram
        direction LR
        class ワークスペース
        class 種類の定義
        class 問題
        class 書き込みの変更
        class 本文の書き込み
        class 項目の場所
        ワークスペース --> 問題 : 読めなかったファイル
        書き込みの変更 --> 本文の書き込み
        項目の場所 --> 種類の定義
      ```
data_models:
  - name: KindSpec
    title: 種類の定義
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    role: DTO
    summary: 1 種類のファイル・ID の頭の文字・スキーマ・本文と状態の有無
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 種類（`decision` など）
      - name: file
        type: str
        description: ワークスペースの中の YAML のファイル名
        example: decisions.yaml
      - name: prefix
        type: str
        description: ID の頭の文字
        example: D
      - name: schema
        type: str
        description: '`schemas/` のスキーマのファイル名'
        example: decisions.schema.json
      - name: has_body
        type: bool
        description: 本文（`body`）を持てるか
      - name: settled_statuses
        type: frozenset[str]
        description: 決着とみなす状態。状態を持たない種類は空
  - name: Workspace
    title: ワークスペース
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: 読み込んだ設定・種類ごとの項目・読めなかったファイル
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。項目は YAML のままの `dict` で持ち、型はスキーマが守る。'
    properties:
      - name: root
        type: Path
        description: ワークスペースのフォルダ（絶対パス）
      - name: raw
        type: dict[str, Any]
        description: 'ファイル名 → 読んだ値そのまま（設定と 7 種類。無い種類のファイルは `{"items": []}`、YAML として読めないファイルは含めない）。検証はこの値をスキーマと突き合わせる'
      - name: settings
        type: dict[str, Any]
        description: '`mindmap.yaml` の値。辞書でない・読めないときは空'
      - name: items
        type: dict[Kind, list[dict[str, Any]]]
        description: 種類ごとの `items`（ファイルの並びのまま）。一番上が辞書で `items` が配列のときだけ取り出し、それ以外は空（配列の要素のうち辞書でないものも除く）
      - name: load_problems
        type: list[Problem]
        description: 'YAML として読めなかったファイル（`kind: schema`・`key: (全体)`）'
  - name: Problem
    title: 問題
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: スキーマ違反・参照切れなど 1 件の問題
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。点検の出力の `problems[]` と同じキーを持ち、`dataclasses.asdict` で JSON にする。'
    properties:
      - name: kind
        type: Literal["schema", "duplicate_id", "broken_ref", "missing_body", "orphan_body"]
        description: 問題の種類
      - name: file
        type: str
        description: ワークスペースからの相対パス
      - name: id
        type: str | None
        description: 問題のある項目の ID
      - name: key
        type: str | None
        description: キーのパス（`items[0].status` の形）
      - name: detail
        type: str
        description: 中身
  - name: ItemRef
    title: 項目の場所
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: ID で引いた項目と、その種類・並びの位置
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 種類
      - name: index
        type: int
        description: '`items` の中の位置'
      - name: item
        type: dict[str, Any]
        description: 項目
  - name: BodyWrite
    title: 本文の書き込み
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: '`docs/` に書く 1 つの本文'
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: name
        type: str
        description: '`docs/` の中のファイル名（`{ID}.md`）'
      - name: text
        type: str
        description: 本文の Markdown
  - name: Change
    title: 書き込みの変更
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    role: DTO
    summary: 1 つの種類の項目の並びを丸ごと置き換える変更と、一緒に書く本文
    description: '`@dataclass(frozen=True, slots=True, kw_only=True)`。'
    properties:
      - name: kind
        type: Kind
        description: 書き換える種類
      - name: items
        type: list[dict[str, Any]]
        description: 書き換えた後の `items` の並び全体
      - name: body
        type: BodyWrite | None
        default: None
        description: 一緒に書く本文
enums:
  - name: Kind
    title: 種類
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: ワークスペースの項目の種類（`Literal` の型エイリアス）
    values:
      - value: decision
        title: 検討事項
        description: decisions.yaml・D
      - value: task
        title: タスク
        description: tasks.yaml・T
      - value: research
        title: 調査
        description: research.yaml・R
      - value: doc
        title: 資料
        description: docs.yaml・A
      - value: term
        title: 用語集
        description: terms.yaml・G
      - value: note
        title: メモ
        description: notes.yaml・N
      - value: log
        title: 会話ログ
        description: logs.yaml・L
classes:
  - name: MindmapError
    title: ツールのエラー
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: 入口（`call_tool`）が捕まえてツールのエラーにする例外の親。配信は子の種類でステータスコードを決める
    kind: クラス
    inherits: Exception
    properties:
      - name: lines
        type: list[str]
        description: '`エラー: {内容}` の後に続けて本文に出す行'
  - name: WorkspaceNotFoundError
    title: ワークスペースが無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: '`mindmap.yaml` が無いフォルダを指した。メッセージにフォルダのパス'
    kind: クラス
    inherits: MindmapError
  - name: WorkspaceExistsError
    title: ワークスペースが既にある
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: ワークスペースの作成
    summary: '`mindmap.yaml` が既にあるフォルダに作ろうとした。メッセージにフォルダのパス'
    kind: クラス
    inherits: MindmapError
  - name: SchemaMismatchError
    title: スキーマに合わない
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: '書き込もうとした・書き出そうとした・読もうとしたワークスペースがスキーマに合わない。`lines` は問題ごとの `{ファイル名}: {キーのパス}: {理由}`。`legacy`（既定 `False`）は、問題に前の版の形式のものがあるか（ワークスペースを検証して送る側が `is_legacy_problem` で決める。`save_change`・`export_preview`・`read_records` が当たる）'
    kind: クラス
    inherits: MindmapError
  - name: ItemNotFoundError
    title: ID が無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: 渡した ID の項目が無い。メッセージに ID
    kind: クラス
    inherits: MindmapError
  - name: OptionNotFoundError
    title: 案が無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 採用する案の切り替え
    summary: 検討事項が渡した記号の案を持たない。メッセージに渡した記号と持っている記号の一覧
    kind: クラス
    inherits: MindmapError
  - name: WriteFailedError
    title: 書き込みに失敗した
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: ファイルの書き込み・置き換えで `OSError` が起きた。後始末をした後に送る。メッセージに置き換え先のパスと `OSError` の理由（`raise ... from` で元の例外をつなぐ）
    kind: クラス
    inherits: MindmapError
  - name: DownloadFailedError
    title: 取れなかった
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 配る書き出し
    summary: 配る書き出しで jsDelivr から配布ファイルかライセンスの本文を取れないか、配布ファイルが雛形の `integrity` と合わない。メッセージに URL と理由（`raise ... from` で元の例外をつなぐ）
    kind: クラス
    inherits: MindmapError
  - name: WorkspaceNewerError
    title: ワークスペースの版が新しい
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 記録の形式の移行
    summary: ワークスペースの版がプラグインの版より新しいのに手順を当てる・版を書く。メッセージに 2 つの版とプラグインの更新の案内
    kind: クラス
    inherits: MindmapError
  - name: StepFailedError
    title: 手順が失敗した
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 記録の形式の移行
    summary: '移し替えの手順が失敗し、写しから戻した。メッセージは `{版} の手順 {番号}（{操作}）: {理由}`'
    kind: クラス
    inherits: MindmapError
  - name: StepsInvalidError
    title: 手順の形が違う
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 記録の形式の移行
    summary: プラグインの `steps.yaml` が読めないか、手順の形のスキーマに合わない。`lines` は合わない箇所
    kind: クラス
    inherits: MindmapError
  - name: ArgumentError
    title: 引数の誤り
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 共通
    summary: 'ツールが確かめる引数の誤り（一緒に使わない引数・値の形が違う・`out` が `.html` で終わらない）。メッセージは `引数の誤り: {引数の名前}: {理由}`'
    kind: クラス
    inherits: MindmapError
    properties:
      - name: argument
        type: str
        description: 誤った引数の名前
  - name: SubmissionNotFoundError
    title: 送信が無い
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 送信の取り込み
    summary: 渡した ID の送信が無い。メッセージに ID
    kind: クラス
    inherits: MindmapError
  - name: SubmissionInvalidError
    title: 送信の中身の誤り
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: 回答・意見を送る
    summary: 送信の `target`・`body` が無い・文字列でない、または `body` が空白だけか上限を超える。配信は 400 にする。メッセージにキーの名前と理由
    kind: クラス
    inherits: MindmapError
  - name: ServeFailedError
    title: 配信を立てられない
    container: plugins/mindstella/skills/mindmap/scripts/errors.py
    usecase: プレビューを開く
    summary: プレビューの配信の待ち受けを立てられない（`OSError`）。メッセージに理由（`raise ... from` で元の例外をつなぐ）
    kind: クラス
    inherits: MindmapError
constants:
  - name: KINDS
    title: 種類の一覧
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: 種類 → 種類の定義。並びは D・T・R・A・G・N・L の順で、一覧を出す並びにも使う
    entries:
      - key: decision
        value: decisions.yaml / D / decisions.schema.json / 本文あり
        description: '決着: 決定済み・対象外・取り下げ'
      - key: task
        value: tasks.yaml / T / tasks.schema.json / 本文なし
        description: '決着: 完了・中止'
      - key: research
        value: research.yaml / R / research.schema.json / 本文あり
        description: 状態なし
      - key: doc
        value: docs.yaml / A / docs.schema.json / 本文あり
        description: 状態なし
      - key: term
        value: terms.yaml / G / terms.schema.json / 本文なし
        description: 状態なし
      - key: note
        value: notes.yaml / N / notes.schema.json / 本文なし
        description: 状態なし
      - key: log
        value: logs.yaml / L / logs.schema.json / 本文あり
        description: 状態なし
  - name: SETTINGS_FILE
    title: 設定のファイル名
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: ワークスペースの設定のファイル名
    value: '"mindmap.yaml"'
  - name: BODY_DIR
    title: 本文のフォルダ名
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    summary: 本文の Markdown を置くフォルダ名
    value: '"docs"'
  - name: RELEASE_DIR
    title: リリースのフォルダ名
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: ワークスペースの作成
    summary: ゴール判定で書き出す資料のフォルダ名
    value: '"release"'
  - name: SCHEMA_DIR
    title: スキーマのフォルダ
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: このファイルから見た `plugins/mindstella/skills/mindmap/schemas/`
    value: Path(__file__).resolve().parent.parent / "schemas"
  - name: COMMON_SCHEMA
    title: 共通のスキーマのファイル名
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: Registry に登録し、各種類のスキーマが `$ref` で指す名前
    value: '"common.schema.json"'
  - name: SETTINGS_SCHEMA
    title: 設定のスキーマのファイル名
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: '`mindmap.yaml` を検証するスキーマ'
    value: '"settings.schema.json"'
  - name: TEMP_SUFFIX
    title: 一時ファイルの拡張子
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: 置き換える前に書く一時ファイルの拡張子（置き換えるファイルと同じフォルダに作る）
    value: '".tmp"'
  - name: LEGACY_HINT
    title: 前の版の形式の案内
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の形式の移行
    summary: 前の版の形式でスキーマに合わないときに続ける 1 行
    value: '"ヒント: 前の版の形式の記録は /mindstella:upgrade で今の形式に移せます"'
  - name: VERSION_FILE
    title: 版のファイル
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: ワークスペースの版を持つファイルの名前
    value: '"mindstella-version.ini"'
  - name: LOCK_FILE
    title: 書き換えのロックのファイル
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    summary: プロセスをまたいだ書き換えの排他に使う空のファイルの名前（ER 図『ワークスペース』）
    value: '".mindstella.lock"'
functions:
  - name: kind_of_id
    title: ID の種類
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    scope: public
    summary: ID の頭の文字から種類を引く
    args:
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 項目の ID
    returns:
      type: Kind | None
      description: 種類。`{頭の文字}-{正の整数}` の形でないか、頭の文字がどの種類にも当たらなければ `None`
    process: |-
      1. `{英大文字}-{数字}` の形かを確かめる
         - 形が合わない場合、`None` を返す
      2. 頭の文字が `prefix` に一致する種類を `KINDS` から引いて返す（無ければ `None`）
    unit_tests:
      - name: test_kind_of_id_when_known_prefix
        case: 正常
        summary: 頭の文字から種類を引く
        condition: '`D-12`・`L-1`'
        mock: なし
        expected: '`decision`・`log`'
      - name: test_kind_of_id_when_unknown
        case: 正常
        summary: 形が合わない・頭の文字が無い ID は None
        condition: '`X-1`・`D-`・`D-0x`・`d-1`'
        mock: なし
        expected: どれも `None`
  - name: load_workspace
    title: ワークスペースの読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 設定と 7 種類の YAML を読む。読めないファイルは問題に記録して空として扱う
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: Workspace
      description: 読み込んだワークスペース
    process: |-
      1. `root` を絶対パスにし、`mindmap.yaml` があるか確かめる
         - 無い場合、`WorkspaceNotFoundError` を送る
      2. 設定と `KINDS` の順の種類ごとの YAML を読み、読んだ値をそのまま `raw` に入れる（読む。`_read_yaml`）
         - 種類のファイルが無い場合、`{"items": []}` を入れる
         - YAML として読めない場合（設定も含む）、`kind: schema`・`key: (全体)` の問題を `load_problems` に足し、`raw` には入れない
      3. `settings` は設定の値が辞書のときだけその値、それ以外は空にする
      4. `items` は、値が辞書で `items` が配列のときだけその要素のうち辞書のものを取り出し、それ以外は空にする（形の誤りは検証が `raw` から拾う）
      5. `Workspace` を返す
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`root` に `mindmap.yaml` が無い'
        message: 'ワークスペースがありません: {root}'
    test_setup:
      - name: ワークスペースのフォルダ
        description: '`tmp_path` に YAML を書いて作る'
        notes: fixture `make_workspace`（`tests/unit/scripts/conftest.py`）
    unit_tests:
      - name: test_load_workspace
        case: 正常
        summary: 設定と種類ごとの項目を読む
        condition: 設定と、D-1 を持つ `decisions.yaml` を置く。ほかの種類のファイルは置かない
        mock: なし
        expected: '`items["decision"]` が D-1 の 1 件、ほかの種類が空、`load_problems` が空'
      - name: test_load_workspace_when_yaml_broken
        case: 正常
        summary: 読めない YAML を問題に記録して続ける
        condition: '`tasks.yaml` に YAML として読めない文字列を置く'
        mock: なし
        expected: '`items["task"]` が空、`load_problems` に `file: tasks.yaml`・`kind: schema` の 1 件'
      - name: test_load_workspace_when_settings_missing
        case: 異常
        summary: mindmap.yaml が無いフォルダは読まない
        condition: 空の `tmp_path`
        mock: なし
        expected: '`WorkspaceNotFoundError`（メッセージに `tmp_path`）'
        exception: mindmap.yaml が無い
      - name: test_load_workspace_when_top_level_list
        case: 正常
        summary: 一番上が配列のファイルは項目を空にし、読んだ値は raw に残す
        condition: '`decisions.yaml` を `- id: D-1` から書き始めた配列にする'

        mock: '`Path.unlink`（monkeypatch）'
        expected: '`WriteFailedError`（メッセージに `二.md` のパス）。`二.md` が残り、`一.md` は無い'
        exception: 消す途中で OSError
  - name: workspace_lock
    title: 書き換えの鍵
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: プロセスの中の鍵と、ワークスペースの `LOCK_FILE` の排他ロックをこの順に取る、`with` で使う文脈
    description: '`@contextlib.contextmanager` で書く。ワークスペースを書き換えるツール（`call_tool`）と送信の受け付け（配信）が、読む前から書き終えるまでの間だけ持つ。'
    side_effects: '`LOCK_FILE` が無ければ作る。`create` が真のときだけ、フォルダが無ければ作る（`init` がまだ無いフォルダへ書くため）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
      - name: process_lock
        type: threading.Lock
        required: true
        passing: positional
        description: プロセスの中の書き換えの鍵
      - name: create
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: まだ無いワークスペースを作るか（`init` だけ真）
      - name: require
        type: Callable[[Path], None]
        required: false
        default: require_workspace
        passing: keyword
        description: '`create` が偽のときにワークスペースを確かめる関数。`plan` でない `migrate` だけが、前の版の `mindmap.yaml` だけのフォルダも通す `require_migratable`（モジュール構成『移行』）を渡す'
    returns:
      type: Iterator[None]
      description: 鍵とロックを持っている間だけ返す
    process: |-
      1. `process_lock` を取る
      2. `create` が真なら `records_root(root)` を作る（`parents=True`・`exist_ok`）。偽なら、ワークスペースを確かめ（`require(root)`）、送られたら何も作らずに伝える（`process_lock` は放す）
      3. ロックファイルを追記で開いて `fcntl.flock(LOCK_EX)` で取れるまで待つ。ロックファイルは `records_root(root) / LOCK_FILE`。`require` が `require_migratable` で `records_root(root)` が無い（移す前の形）ときだけ、直下の `root / LOCK_FILE` を使う。開けない（`OSError`）ときは `WriteFailedError` を送る
      4. 呼び出し元の処理を動かす
      5. 処理が例外で終わったときも、`LOCK_UN` してファイルを閉じ、`process_lock` を放す。2 でフォルダを作っていて、中が `LOCK_FILE` だけのまま例外で終わったときは、`LOCK_FILE` と作ったフォルダ（`records_root(root)` と、無かった `root`）を消してから例外を伝える（インターフェース定義『ワークスペースの作成』の「フォルダが作られていない」）
    unit_tests:
      - name: test_workspace_lock
        case: 正常
        summary: 鍵とロックを持ち、抜けたら放す
        condition: '`config.yaml` を置いた `tmp_path` と `threading.Lock()`。`with` の中で別の子プロセスが同じ `LOCK_FILE` に `flock(LOCK_EX | LOCK_NB)` を試す'
        mock: なし
        expected: '`with` の中では子プロセスが `BlockingIOError` で取れず、`process_lock.locked()` が真。抜けた後は子プロセスが取れ、`process_lock` が外れている'
      - name: test_workspace_lock_when_raises
        case: 正常
        summary: 中の処理が例外でも放す
        condition: '`config.yaml` を置いた `tmp_path`。`with` の中で `ValueError` を送る'
        mock: なし
        expected: '`ValueError` が伝わり、`process_lock` が外れ、子プロセスがロックを取れる'
      - name: test_workspace_lock_when_folder_missing
        case: 正常
        summary: まだ無いフォルダも作って取る
        condition: '`tmp_path / "ws"`（無い）と `create=True`'
        mock: なし
        expected: '`tmp_path / "ws" / ".mindstella" / ".mindstella.lock"` がある'
      - name: test_workspace_lock_when_not_workspace
        case: 異常
        summary: ワークスペースでないフォルダには何も作らない
        condition: '`parametrize`: 空の `tmp_path` / `tmp_path / "typo" / "ws"`（無い）。`create` は既定（偽）'
        mock: なし
        expected: '`WorkspaceNotFoundError` が伝わり、`process_lock` が外れている。`tmp_path` の中は空のまま（`typo` も作られない）'
      - name: test_workspace_lock_when_require_given
        case: 正常
        summary: 渡した確かめの関数でワークスペースを確かめる
        condition: '`mindmap.yaml` だけを置いた `tmp_path`。`parametrize`: `require` が `require_migratable` / 既定'
        mock: なし
        expected: '`require_migratable` では `with` の中に入り、`tmp_path / ".mindstella.lock"` がある。既定では `WorkspaceNotFoundError`（`lines` に移し替えの案内）が伝わり、`.mindstella.lock` は作られない'
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`create` が偽で、`require` が送った（既定の `require_workspace` では `root` に `config.yaml` が無い）'
        message: 'ワークスペースがありません: {root}'
      - name: WriteFailedError
        condition: '`LOCK_FILE` を開けない（書き込みの権限が無い等）'
        message: '書き込めませんでした: {パス}（{理由}）'
  - name: save_batch
    title: まとめた変更の書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の追加と更新
    scope: public
    summary: 複数の種類の項目の並びと本文とまとまりを、検証してから全て書き換えるか、どれも書き換えない
    side_effects: 種類の YAML と `docs/{ID}.md` と `changes.yaml` を置き換える
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 書き込む前のワークスペース
      - name: change
        type: BatchChange
        required: true
        passing: positional
        description: 書き込む変更
    process: |-
      1. `items` の種類ごとに、書き戻しても中身を失わない形かを確かめる（`save_change` の 1. と同じ）
      2. `raw` の `items` の種類のファイルを全て差し替えたワークスペースを作り、検証する（`validate_workspace`）
         - 問題がある場合、書き換える項目の ID（種類ごとの `_written_ids` の和）を `written_ids` にして `SchemaMismatchError` を送る（`build_mismatch_error`。何も書かない）
      3. 書く全てのファイル（本文・種類の YAML・`changes.yaml`）の一時ファイルを書き、置き換える前の中身を控える（無ければ `None`）
         - 一時ファイルの書き込みで `OSError` が起きた場合、書いた一時ファイルを消して `WriteFailedError` を送る
      4. 本文 → 種類の YAML（`KINDS` の順）→ `changes.yaml` の順に `os.replace` で置き換える
         - 途中で `OSError` が起きた場合、置き換えたファイルを控えに戻し（控えが `None` なら消し）、残った一時ファイルを消して `WriteFailedError` を送る
    exceptions:
      - name: SchemaMismatchError
        condition: 変更する種類のファイルが読めないか書き戻すと中身を失う形、または差し替えた後のワークスペースに問題がある
        message: スキーマに合いません（`lines` に問題ごとの行）
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError` が起きた（置き換えたものを戻した後）
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_save_batch
        case: 正常
        summary: 複数の種類と本文とまとまりを書き、一時ファイルを残さない
        condition: D-1 を足した検討事項の並び、T-1 を足したタスクの並び、本文 `D-1.md`、新しいまとまり
        mock: なし
        expected: '`decisions.yaml`・`tasks.yaml`・`docs/D-1.md`・`changes.yaml` を読むと渡した中身。`.tmp` のファイルが無い'
      - name: test_save_batch_when_schema_mismatch
        case: 異常
        summary: 1 つの種類でもスキーマに合わなければ何も書かない
        condition: '正しい T-1 のタスクの並びと、`status: 完了` の D-1 の検討事項の並び'
        mock: なし
        expected: '`SchemaMismatchError`。ワークスペースの全てのファイルが呼ぶ前と同じ'
      - name: test_save_batch_when_replace_fails
        case: 異常
        summary: 途中の置き換えに失敗したら、置き換えたファイルを戻す
        condition: 検討事項とタスクの並びと本文。`os.replace` を、置き換え先が `tasks.yaml` のときだけ `OSError` を送る関数に差し替える
        mock: '`os.replace`（`store` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`（メッセージに `tasks.yaml`）。`decisions.yaml`・`tasks.yaml`・`docs/` が呼ぶ前と同じで、`.tmp` のファイルが無い'
      - name: test_save_batch_when_decision_state
        case: 異常
        summary: 書き換える項目以外の案と状態の合わない検討事項があるときだけ、前の版の形式とする
        condition: '`parametrize`: 案を持たない未決定の D-2 が残るワークスペースで、案を持つ未決定の D-3 と T-1 を足した並び / 決まりに合うワークスペースで、案を持たない未決定の D-3 を足した並び'
        mock: なし
        expected: どちらも `SchemaMismatchError` でファイルは呼ぶ前と同じ。`legacy` が真 / 偽
  - name: require_workspace
    title: ワークスペースの確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: '`.mindstella/config.yaml` があるかを確かめ、無ければ送る。直下に前の版の設定ファイルだけがあれば移し替えを案内する'

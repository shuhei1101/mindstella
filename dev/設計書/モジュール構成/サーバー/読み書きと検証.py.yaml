functions:
  - name: kind_of_id
    title: ID の種類
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/kinds.py
    usecase: 共通
    scope: public
    summary: ID の頭の文字から種類を引く
    args:
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 項目の ID
    returns:
      type: Kind | None
      description: 種類。`{頭の文字}-{正の整数}` の形でないか、頭の文字がどの種類にも当たらなければ `None`
    process: |-
      1. `{英大文字}-{数字}` の形かを確かめる
         - 形が合わない場合、`None` を返す
      2. 頭の文字が `prefix` に一致する種類を `KINDS` から引いて返す（無ければ `None`）
    unit_tests:
      - name: test_kind_of_id_when_known_prefix
        case: 正常
        summary: 頭の文字から種類を引く
        condition: '`D-12`・`L-1`'
        mock: なし
        expected: '`decision`・`log`'
      - name: test_kind_of_id_when_unknown
        case: 正常
        summary: 形が合わない・頭の文字が無い ID は None
        condition: '`X-1`・`D-`・`D-0x`・`d-1`'
        mock: なし
        expected: どれも `None`
  - name: load_workspace
    title: ワークスペースの読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 設定と 7 種類の YAML を読む。読めないファイルは問題に記録して空として扱う
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: Workspace
      description: 読み込んだワークスペース
    process: |-
      1. `root` を絶対パスにし、ワークスペースを確かめる（`require_workspace`）
      2. `records_root(root)` の下の設定と `KINDS` の順の種類ごとの YAML を読み、読んだ値をそのまま `raw` に入れる（読む。`_read_yaml`）
         - 種類のファイルが無い場合、`{"items": []}` を入れる
         - YAML として読めない場合（設定も含む）、`kind: schema`・`key: (全体)` の問題を `load_problems` に足し、`raw` には入れない
      3. `settings` は設定の値が辞書のときだけその値、それ以外は空にする
      4. `items` は、値が辞書で `items` が配列のときだけその要素のうち辞書のものを取り出し、それ以外は空にする（形の誤りは検証が `raw` から拾う）
      5. `Workspace` を返す（`root` は直下のフォルダのまま）
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`root` に `config.yaml` が無い（`require_workspace`）'
        message: 'ワークスペースがありません: {root}'
    test_setup:
      - name: ワークスペースのフォルダ
        description: '`tmp_path` に YAML を書いて作る'
        notes: fixture `make_workspace`（`tests/unit/scripts/conftest.py`）
    unit_tests:
      - name: test_load_workspace
        case: 正常
        summary: 設定と種類ごとの項目を読む
        condition: 設定と、D-1 を持つ `decisions.yaml` を置く。ほかの種類のファイルは置かない
        mock: なし
        expected: '`items["decision"]` が D-1 の 1 件、ほかの種類が空、`load_problems` が空'
      - name: test_load_workspace_when_yaml_broken
        case: 正常
        summary: 読めない YAML を問題に記録して続ける
        condition: '`tasks.yaml` に YAML として読めない文字列を置く'
        mock: なし
        expected: '`items["task"]` が空、`load_problems` に `file: tasks.yaml`・`kind: schema` の 1 件'
      - name: test_load_workspace_when_settings_missing
        case: 異常
        summary: config.yaml が無いフォルダは読まない
        condition: 空の `tmp_path`
        mock: なし
        expected: '`WorkspaceNotFoundError`（メッセージに `tmp_path`）'
        exception: config.yaml が無い
      - name: test_load_workspace_when_top_level_list
        case: 正常
        summary: 一番上が配列のファイルは項目を空にし、読んだ値は raw に残す
        condition: '`decisions.yaml` を `- id: D-1` から書き始めた配列にする'
        mock: なし
        expected: '`items["decision"]` が空、`raw["decisions.yaml"]` がその配列、`load_problems` が空'
      - name: test_load_workspace_when_settings_broken
        case: 正常
        summary: 設定が YAML として読めなければ問題に記録して空にする
        condition: '`config.yaml` に YAML として読めない文字列を置く'
        mock: なし
        expected: '`settings` が空、`load_problems` に `file: config.yaml`・`key: (全体)` の 1 件、`raw` に `config.yaml` が無い'
  - name: validate_workspace
    title: ワークスペースの検証
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 設定と 7 種類をスキーマと、検討事項を案と状態の決まりと突き合わせ、合わない箇所を問題の並びにする
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 検証するワークスペース
    returns:
      type: list[Problem]
      description: '`load_problems` とスキーマ違反（`kind: schema`）と案と状態の決まりに合わない検討事項（`kind: decision_state`）。ファイル名の順、同じファイルの中はキーのパスの順'
    process: |-
      1. スキーマの検証器を作る（検証器の用意。`load_validators`）
      2. `raw` の値をそのまま、ファイルに対応するスキーマと突き合わせ、`iter_errors` のエラーごとに問題を作る（一番上の形の誤りもここで拾う）
         - キーのパスは `absolute_path` を `items[0].status` の形にする（`_format_path`。一番上は `(全体)`）
         - パスが `items[{n}]` を含み、その要素が `id` を持つ場合、その `id` を問題の `id` に入れる
      3. `raw` に `decisions.yaml` があれば、`check_decision_rules` の問題を足す（キーのパスの順に並べる）
      4. `load_problems` と合わせて並べて返す
    unit_tests:
      - name: test_validate_workspace
        case: 正常
        summary: 合うワークスペースは問題 0 件
        condition: '`init` と同じ設定と、正しい D-1'
        mock: なし
        expected: 空の並び
      - name: test_validate_workspace_when_status_invalid
        case: 正常
        summary: 共通でない種類固有の値の誤りを拾う
        condition: D-2 の `status` が `完了`（items の 2 つめ）
        mock: なし
        expected: '`file: decisions.yaml`・`key: items[1].status`・`id: D-2`・`kind: schema` の 1 件'
      - name: test_validate_workspace_when_common_key_invalid
        case: 正常
        summary: 共通のスキーマ側で決めたキーの誤りも拾う（ファイルをまたぐ $ref）
        condition: T-1 の `tags` が文字列（配列でない）
        mock: なし
        expected: '`file: tasks.yaml`・`key: items[0].tags` の 1 件'
      - name: test_validate_workspace_when_load_problem
        case: 正常
        summary: 読めなかったファイルの問題も含める
        condition: '`load_problems` に `notes.yaml` の問題を 1 件持つワークスペース'
        mock: なし
        expected: その 1 件を含む
      - name: test_validate_workspace_when_top_level_invalid
        case: 正常
        summary: 一番上の形の誤りを拾う
        condition: '`parametrize`: `decisions.yaml` が一番上の配列 / `decisions.yaml` が `items` の横に `extra` のキーを持つ'
        mock: なし
        expected: '`file: decisions.yaml`・`kind: schema` の問題があり、`key` が `(全体)`'
      - name: test_validate_workspace_when_decision_state
        case: 正常
        summary: 案と状態の決まりに合わない検討事項も問題に含める
        condition: スキーマに合い、案を持たない未決定の D-1 を持つワークスペース
        mock: なし
        expected: '`file: decisions.yaml`・`key: items[0].options`・`id: D-1`・`kind: decision_state` の 1 件'
  - name: load_validators
    title: 検証器の用意
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 共通のスキーマを Registry に登録し、設定と 7 種類の検証器を作る
    returns:
      type: dict[str, Draft202012Validator]
      description: スキーマのファイル名 → 検証器
    process: |-
      1. `SCHEMA_DIR` の `common.schema.json` を読み、`DRAFT202012.create_resource` で `Registry` に `common.schema.json` の名前で登録する
      2. 設定と 7 種類のスキーマを読み、`Draft202012Validator(schema, registry=registry)` を作って返す
    unit_tests:
      - name: test_load_validators
        case: 正常
        summary: 同梱のスキーマから 8 つの検証器を作り、各スキーマがそれ自体として正しい
        condition: リポジトリの `plugins/mindstella/skills/mindmap/schemas/`
        mock: なし
        expected: キーが `settings.schema.json` と 7 種類のスキーマ名で、`Draft202012Validator.check_schema` がどれも通る
  - name: find_item
    title: 項目の引き当て
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: ID で項目を引く
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: item_id
        type: str
        required: true
        passing: positional
        description: 項目の ID
    returns:
      type: ItemRef
      description: 項目の場所
    process: |-
      1. 種類を引く（ID の種類。`kind_of_id`）
         - 種類が無い場合、`ItemNotFoundError` を送る
      2. その種類の `items` から `id` が一致する最初の項目を探す
         - 無い場合、`ItemNotFoundError` を送る
    exceptions:
      - name: ItemNotFoundError
        condition: ID の形が合わないか、頭の文字がどの種類にも当たらない
        message: '項目がありません: {item_id}'
      - name: ItemNotFoundError
        condition: その種類に ID の項目が無い
        message: '項目がありません: {item_id}'
    unit_tests:
      - name: test_find_item
        case: 正常
        summary: ID の項目と位置を返す
        condition: D-1・D-2 を持つワークスペースで `D-2`
        mock: なし
        expected: '`kind: decision`・`index: 1`・`item` が D-2'
      - name: test_find_item_when_unknown_prefix
        case: 異常
        summary: 種類に当たらない ID
        condition: '`X-1`'
        mock: なし
        expected: '`ItemNotFoundError`（メッセージに `X-1`）'
        exception: 頭の文字がどの種類にも当たらない
      - name: test_find_item_when_id_missing
        case: 異常
        summary: 種類に当たるが項目が無い ID
        condition: '`D-9`'
        mock: なし
        expected: '`ItemNotFoundError`（メッセージに `D-9`）'
        exception: その種類に ID の項目が無い
  - name: next_id
    title: 採番
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の追加と更新
    scope: public
    summary: その種類の連番の最大 + 1 の ID を返す
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: kind
        type: Kind
        required: true
        passing: positional
        description: 種類
    returns:
      type: str
      description: '`{頭の文字}-{連番}`'
    process: |-
      1. その種類の項目の `id` のうち、頭の文字が一致し連番が数字のものの最大を取る（無ければ 0）
      2. 最大 + 1 で ID を作って返す
    unit_tests:
      - name: test_next_id
        case: 正常
        summary: 間が空いていても最大 + 1 を振る
        condition: D-1・D-3 を持つ
        mock: なし
        expected: '`D-4`'
      - name: test_next_id_when_empty
        case: 正常
        summary: 項目が無ければ 1 を振る
        condition: タスクが 0 件
        mock: なし
        expected: '`T-1`'
  - name: now_utc
    title: 今の日時
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 今の日時を UTC のタイムゾーン付き ISO 8601（秒まで）で返す
    returns:
      type: str
      description: 例 `2026-10-02T08:00:00+00:00`
    process: 1. `datetime.now(UTC)` を秒で切り捨て、`isoformat()` の文字列を返す
    notes:
      テスト: 分岐を持たないため単体テストを置かず、呼ぶ側のテストで `monkeypatch` で差し替える
  - name: save_change
    title: 変更の書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 1 種類の項目の並びと本文とまとまりを、検証してから全て書き換えるか、どれも書き換えない
    side_effects: 種類の YAML と `docs/{ID}.md` と `changes.yaml` を置き換える
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 書き込む前のワークスペース
      - name: change
        type: Change
        required: true
        passing: positional
        description: 書き込む変更
    process: |-
      1. 変更する種類のファイルが、書き戻しても中身を失わない形かを確かめる
         - そのファイルが `load_problems` にある（YAML として読めない）か、`raw` のそのファイルの値が `{"items": items のその種類}` と等しくない（一番上が辞書でない・`items` の横にキーがある・`items` が配列でない・辞書でない要素があるなど、`_extract_items` が落とすものがある）場合、変更を当てる前のワークスペースのそのファイルの問題（`validate_workspace` のうち `file` がそのファイルのもの）を持った `SchemaMismatchError` を送る（何も書かない）
         - 項目の中の値だけが合わない問題はここでは止めない（変更で直せるため。残っていれば 2. で止まる）
      2. `raw` のその種類のファイルを `{"items": 変更後の並び}` に差し替えたワークスペースを作り、検証する（ワークスペースの検証。`validate_workspace`）
         - 問題がある場合、書き換える項目の ID（`_written_ids`）を `written_ids` にして `SchemaMismatchError` を送る（`build_mismatch_error`。何も書かない）
      3. YAML の一時ファイルを書く（`dump_yaml`、`write_temp`）。本文があれば本文の一時ファイルも書き、置き換える前の本文を控える（無ければ `None`）。`changes` があれば `changes.yaml` の一時ファイルも書き、置き換える前の種類の YAML を控える
         - 一時ファイルの書き込みで `OSError` が起きた場合、書いた一時ファイルを消して `WriteFailedError` を送る
      4. 本文 → YAML → `changes.yaml` の順に `os.replace` で置き換える
         - 本文の置き換えで `OSError` が起きた場合、一時ファイルを消して `WriteFailedError` を送る
         - YAML の置き換えで `OSError` が起きた場合、本文を控えに戻し（控えが `None` なら本文を消し）、残った一時ファイルを消して `WriteFailedError` を送る
         - `changes.yaml` の置き換えで `OSError` が起きた場合、YAML を控えに戻し、本文も YAML のときと同じく戻し、残った一時ファイルを消して `WriteFailedError` を送る
    exceptions:
      - name: SchemaMismatchError
        condition: 変更する種類のファイルが読めないか書き戻すと中身を失う形、または変更を当てた後のワークスペースに問題がある
        message: スキーマに合いません（`lines` に問題ごとの行）
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか、本文・YAML・`changes.yaml` の置き換えで `OSError` が起きた（置き換えたものを戻し、一時ファイルを消した後）
        message: '書き込めませんでした: {パス}（{理由}）'
      - name: WriteFailedError
        condition: YAML の置き換えで `OSError` が起きた（本文を戻した後）
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_save_change
        case: 正常
        summary: 項目の並びと本文を書き、一時ファイルを残さない
        condition: D-1 を足した並びと本文 `D-1.md`
        mock: なし
        expected: '`decisions.yaml` を読むと D-1 があり、`docs/D-1.md` が渡した本文。ワークスペースに `.tmp` のファイルが無い'
      - name: test_save_change_when_schema_mismatch
        case: 異常
        summary: スキーマに合わない変更は書かない
        condition: '`status: 完了` の D-1 を足した並びと本文'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `decisions.yaml: items[0].status:` で始まる行）。`decisions.yaml` と `docs/` が呼ぶ前と同じ'
        exception: 変更を当てた後のワークスペースに問題がある
      - name: test_save_change_when_temp_write_fails
        case: 異常
        summary: 一時ファイルを書けなければ何も置き換えない
        condition: '`_write_temp` を、本文の一時ファイルのときだけ `OSError` を送る関数に差し替える'
        mock: '`_write_temp`（`store` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`。`decisions.yaml` と `docs/` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: 一時ファイルの書き込みで OSError
      - name: test_save_change_when_yaml_replace_fails_with_previous_body
        case: 異常
        summary: YAML の置き換えに失敗したら前の本文に戻す
        condition: '`docs/D-1.md` がある状態で本文を書き換える変更。`os.replace` を、置き換え先が `decisions.yaml` のときだけ `OSError` を送る関数に差し替える'
        mock: '`os.replace`（`store` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`（メッセージに `decisions.yaml`）。`docs/D-1.md` と `decisions.yaml` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: YAML の置き換えで OSError
      - name: test_save_change_when_yaml_replace_fails_without_previous_body
        case: 異常
        summary: YAML の置き換えに失敗したら新しく書いた本文を消す
        condition: '`docs/D-1.md` が無い状態で本文を足す変更。`os.replace` を同じように差し替える'
        mock: '`os.replace`'
        expected: '`WriteFailedError`。`docs/D-1.md` が無く、`decisions.yaml` が呼ぶ前と同じ'
        exception: YAML の置き換えで OSError
      - name: test_save_change_when_file_shape_broken
        case: 異常
        summary: 書き戻すと中身を失うファイルには書かない
        condition: 'D-1・D-2 を持つ `decisions.yaml` を崩してから読み、D-1 だけの並びの変更を渡す。`parametrize`: 一番上が配列 / `items` の横に `extra` のキー / `items` に文字列の要素 / YAML として読めない'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` がどれも `decisions.yaml: ` で始まる）。`decisions.yaml` と `docs/` が呼ぶ前と同じ'
        exception: 書き戻すと中身を失う形
      - name: test_save_change_when_item_value_fixed
        case: 正常
        summary: 項目の中の合わない値は、それを直す変更なら書ける
        condition: '`status: 完了` の D-1 を持つ `decisions.yaml` を読み、`status: 未決定` に直した並びの変更を渡す'
        mock: なし
        expected: 例外にならず、`decisions.yaml` を読むと D-1 の `status` が `未決定`
      - name: test_save_change_when_changes_replace_fails
        case: 異常
        summary: まとまりの置き換えに失敗したら項目と本文を戻す
        condition: D-1 の本文を書き換え、`changes` を渡す変更。`os.replace` を、置き換え先が `changes.yaml` のときだけ `OSError` を送る関数に差し替える
        mock: '`os.replace`（`store` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`（メッセージに `changes.yaml`）。`decisions.yaml`・`docs/D-1.md`・`changes.yaml` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: changes.yaml の置き換えで OSError
      - name: test_save_change_when_decision_state
        case: 異常
        summary: 書き換える項目以外の案と状態の合わない検討事項があるときだけ、前の版の形式とする
        condition: '`parametrize`: 案を持たない未決定の D-2 が残るワークスペースで、決まりに合う D-1 の `lead` だけを直した並び / 決まりに合う D-1・D-2 のワークスペースで、D-1 を採用した案の無い決定済みに直した並び'
        mock: なし
        expected: どちらも `SchemaMismatchError` でファイルは呼ぶ前と同じ。`legacy` が真（`lines` が D-2 の行） / 偽（`lines` が D-1 の行）
  - name: create_workspace
    title: ワークスペースの作成
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: ワークスペースの作成
    scope: public
    summary: 設定を検証してから、`.mindstella/` に設定・空の 7 種類の YAML・版のファイル・`docs/`・`release/` を作り、直下に README を書く
    side_effects: フォルダとファイルを作る
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: 作るワークスペースのフォルダ
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: 設定の中身
      - name: version
        type: str
        required: true
        passing: keyword
        description: 版のファイルに書くプラグインの版（`v0.3.0` の形。入口が `read_plugin_version` で読んで渡す）
    returns:
      type: list[str]
      description: 作ったファイルとフォルダ（ワークスペースからの相対パス。フォルダは末尾に `/`）。`README.md` はこの呼び出しで書いたときだけ末尾に載せ、ほかは `.mindstella/` から始まる
    process: |-
      1. `records_root(root) / SETTINGS_FILE` があれば `WorkspaceExistsError` を送る。直下に `SETTINGS_FILE` か `LEGACY_SETTINGS_FILE` があれば、`lines` に `UPGRADE_HINT` を持つ `WorkspaceExistsError` を送る（前の版のワークスペースの記録を残したまま空の記録を作らない）
      2. 設定と空の 7 種類で `Workspace` を組み、検証する（ワークスペースの検証。`validate_workspace`）
         - 問題がある場合、`SchemaMismatchError` を送る（フォルダも作らない）
      3. `records_root(root)` とその中の `docs/`・`release/` を作り、7 種類の YAML（`items: []`）と `VERSION_FILE`（`version` と改行）を書き、直下の README を書き（README の書き込み。`write_readme(root)`）、最後に `config.yaml` を書く（`dump_yaml`。README のほかはどれも `records_root(root)` の下）
         - `OSError` か README の `WriteFailedError` が起きた場合、この関数が作ったファイルとフォルダ（この呼び出しで書いた README を含む。前からあった README は消さない）を消して `WriteFailedError` を送る（`config.yaml` を最後に書くので、途中で止まってもワークスペースとして扱われない）
    exceptions:
      - name: WorkspaceExistsError
        condition: '`root` に `.mindstella/config.yaml` が既にあるか、直下に `config.yaml` か `mindmap.yaml` がある'
        message: '既にワークスペースがあります: {root}（直下の設定ファイルのときは `lines` に移し替えの案内）'
      - name: SchemaMismatchError
        condition: 設定が設定のスキーマに合わない
      - name: WriteFailedError
        condition: フォルダ・ファイルを作る途中で `OSError` が起きた（作ったものを消した後）
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_create_workspace
        case: 正常
        summary: まだ無いフォルダにワークスペースを作る
        condition: '`tmp_path / "ws"`（無い）と正しい設定、`version="v0.3.0"`'
        mock: なし
        expected: 戻り値が 8 つの YAMLと `mindstella-version.ini`・`docs/`・`release/`・`README.md`。`config.yaml` を読むと渡した設定。`mindstella-version.ini` が `v0.3.0\n`。直下の `README.md` の 1 行目が `README_MARK`
      - name: test_create_workspace_when_exists
        case: 異常
        summary: config.yaml か mindmap.yaml があるフォルダには作らない
        condition: '`parametrize`: `config.yaml` を置いた `tmp_path` / `mindmap.yaml` と D-1 を持つ `decisions.yaml` を置いた `tmp_path`'
        mock: なし
        expected: 'どちらも `WorkspaceExistsError`。フォルダの全てのファイルが呼ぶ前と同じで、後者に `config.yaml` が作られていない'
        exception: config.yaml か mindmap.yaml が既にある
      - name: test_create_workspace_when_settings_invalid
        case: 異常
        summary: 設定がスキーマに合わなければフォルダも作らない
        condition: '`phases` の無い設定と `tmp_path / "ws"`（無い）'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` に `config.yaml` と `phases`）。`tmp_path / "ws"` が無い'
        exception: 設定が設定のスキーマに合わない
      - name: test_create_workspace_when_write_fails
        case: 異常
        summary: 途中で書けなくなったら作ったものを消す
        condition: '`dump_yaml` で作った文字列を書く処理を、`logs.yaml` のときだけ `OSError` を送るように `Path.write_text` を差し替える。`tmp_path / "ws"`（無い）'
        mock: '`Path.write_text`（monkeypatch）'
        expected: '`WriteFailedError`。`tmp_path / "ws"` が無い'
        exception: 作る途中で OSError
      - name: test_create_workspace_when_user_readme_exists
        case: 正常
        summary: 利用者の README があるフォルダには README を書かずに作る
        condition: '`# 家計簿アプリの話し合い` の `README.md` だけを置いた `tmp_path` と正しい設定'
        mock: なし
        expected: 戻り値に `README.md` が無く、`.mindstella/config.yaml` がある。`README.md` の中身が呼ぶ前と同じ
      - name: test_create_workspace_when_readme_write_fails
        case: 異常
        summary: README を書けなければ作ったものを消す
        condition: '`README.md` という名前のフォルダだけを置いた `tmp_path` と正しい設定'
        mock: なし
        expected: '`WriteFailedError`。`.mindstella/` が無く、`README.md` のフォルダが残っている'
        exception: 作る途中で OSError
  - name: read_body
    title: 本文の読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: '`docs/` の本文を読む'
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース
      - name: name
        type: str
        required: true
        passing: positional
        description: '`docs/` の中のファイル名'
    returns:
      type: str | None
      description: 本文。ファイルが無いか、名前が `docs/` の外を指すときは `None`
    process: |-
      1. `docs/{name}` を解決し、`docs/` の配下にあるか確かめる
         - 配下に無い場合、`None` を返す
      2. ファイルがあれば UTF-8 で読んで返し、無ければ `None` を返す
    unit_tests:
      - name: test_read_body
        case: 正常
        summary: ある本文を読む
        condition: '`docs/D-1.md` を置く'
        mock: なし
        expected: その中身
      - name: test_read_body_when_missing
        case: 正常
        summary: 無い本文は None
        condition: '`docs/D-9.md` を置かない'
        mock: なし
        expected: '`None`'
      - name: test_read_body_when_outside
        case: 正常
        summary: docs/ の外を指す名前は読まない
        condition: '`../config.yaml`'
        mock: なし
        expected: '`None`'
  - name: dump_yaml
    title: YAML の文字列化
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 日本語をそのままにし、キーの並びを保って YAML の文字列にする
    args:
      - name: data
        type: Any
        required: true
        passing: positional
        description: YAML にする値
    returns:
      type: str
      description: YAML の文字列
    process: 1. `yaml.safe_dump(data, allow_unicode=True, sort_keys=False)` を返す
    unit_tests:
      - name: test_dump_yaml
        case: 正常
        summary: 日本語とキーの並びを保つ
        condition: '`{"title": "問い", "id": "D-1"}`'
        mock: なし
        expected: '`title: 問い` の行が `id: D-1` の行より前にある'
  - name: _read_yaml
    title: YAML の読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: 1 ファイルを `yaml.safe_load` で読む
    args:
      - name: path
        type: Path
        required: true
        passing: positional
        description: 読むファイル
    returns:
      type: Any
      description: 読んだ値（空のファイルは `None`）
    process: 1. UTF-8 で読み、`yaml.safe_load` の結果を返す（`yaml.YAMLError` はそのまま伝える）
  - name: _format_path
    title: キーのパスの文字列化
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: '`absolute_path` を `items[0].status` の形の文字列にする'
    args:
      - name: path
        type: Iterable[str | int]
        required: true
        passing: positional
        description: キーと添字の並び
    returns:
      type: str
      description: 添字は `[n]`、キーは `.` でつなぐ。空なら `(全体)`
    process: |-
      1. 整数は直前に `[n]` をつなぎ、文字列は `.` でつなぐ（先頭は `.` を付けない）
      2. 空のときは `(全体)` を返す
    unit_tests:
      - name: test_format_path
        case: 正常
        summary: キーと添字をつなぐ
        condition: '`["items", 0, "options", 1, "key"]`・`[]`'
        mock: なし
        expected: '`items[0].options[1].key`・`(全体)`'
  - name: _write_temp
    title: 一時ファイルの書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: 置き換え先と同じフォルダに一時ファイルを書き、そのパスを返す
    args:
      - name: target
        type: Path
        required: true
        passing: positional
        description: 置き換え先
      - name: text
        type: str
        required: true
        passing: positional
        description: 中身
    returns:
      type: Path
      description: 一時ファイルのパス
    process: |-
      1. `tempfile.mkstemp(dir=target.parent, suffix=TEMP_SUFFIX)` で作り、UTF-8 で書く
      2. 一時ファイルの権限を揃える（`mkstemp` は `0600` で作るため、置き換えた後の権限が変わらないようにする）
         - `target` がある場合、その権限を写す（`shutil.copymode`）
         - 無い場合、`0o666 & ~umask` にする
      3. 一時ファイルのパスを返す
    unit_tests:
      - name: test_write_temp_when_mode
        case: 正常
        summary: 置き換え先の権限を一時ファイルに写す
        condition: '`parametrize`: `0o640` の置き換え先がある / 置き換え先が無く umask が `0o022`。Windows では skip'
        mock: なし（umask は `os.umask` で設定し、後で戻す）
        expected: 一時ファイルの権限が `0o640` / `0o644`
  - name: is_legacy_problem
    title: 前の版の形式の問題か
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の形式の移行
    scope: public
    summary: 問題が、前の版の形式（資料の `done`・題名の無い設定・`field` を持つ設定・書き込む項目以外の案と状態の合わない検討事項）から来ているかを返す
    args:
      - name: problem
        type: Problem
        required: true
        passing: positional
        description: 問題
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 問題を出したワークスペース
      - name: written_ids
        type: frozenset[str]
        required: false
        default: frozenset()
        passing: keyword
        description: 書き込むツールが書き換える項目の ID（`build_mismatch_error` が渡す）。点検・読み込みは渡さない
    returns:
      type: bool
      description: 前の版の形式から来ていれば真
    process: |-
      1. `kind` が `decision_state` の場合、`id` が `written_ids` に無ければ真、あれば偽を返す
      2. `kind` が `schema` でない場合、偽を返す
      3. `file` が `config.yaml` の場合、`raw` の設定が辞書で `summary` を持たないか、`field` を持ち `playbooks` を持たなければ真
      4. `file` が `docs.yaml` で `id` がある場合、その ID の資料が `done` を持ち `status` を持たなければ真
      5. それ以外は偽
    unit_tests:
      - name: test_is_legacy_problem
        case: 正常
        summary: 前の版の形式の問題を見分ける
        condition: '`summary` を持たない設定と A-1（`done: true`）、`status` を `完了` にした D-1 を持つワークスペースを検証した問題。`parametrize`: `config.yaml` の問題 / A-1 の問題 / D-1 の問題 / `kind: broken_ref` の問題 / `summary` と `field` を持ち `playbooks` を持たない設定の `config.yaml` の問題'
        mock: なし
        expected: 真 / 真 / 偽 / 偽 / 真
      - name: test_is_legacy_problem_when_decision_state
        case: 正常
        summary: 書き込む項目以外の案と状態の合わない検討事項だけを前の版の形式とする
        condition: 'D-1 の `kind: decision_state` の問題。`parametrize`: `written_ids` なし / `written_ids` が `{D-1}` / `written_ids` が `{D-2}`'
        mock: なし
        expected: 真 / 偽 / 真
  - name: clear_release
    title: リリースの片付け
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: リリースの片付け
    scope: public
    summary: '`release/` の中身を消し、空の `release/` を残す'
    side_effects: '`release/` の中のファイルとフォルダを消す（`release/` が無ければ作る）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペースのフォルダ
    returns:
      type: list[str]
      description: 消したものの `release/` からのパス（フォルダは末尾に `/`。名前の順）
    process: |-
      1. ワークスペースを確かめる（`require_workspace`）
      2. `records_root(root) / RELEASE_DIR` を作る（あればそのまま）
      3. 中の項目を名前の順に消す（シンボリックリンクとファイルは `Path.unlink`、リンクでないフォルダは `shutil.rmtree`。リンク先は消さない）。消したものを戻り値に足す
         - `OSError` が起きた場合、そこで止めて `WriteFailedError` を送る（それまでに消したものは戻さない。次の呼び出しで片付く）
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`root` に `config.yaml` が無い（`require_workspace`）'
        message: 'ワークスペースがありません: {root}'
      - name: WriteFailedError
        condition: '`release/` を作るか中のものを消す途中で `OSError` が起きた'
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_clear_release
        case: 正常
        summary: release/ の中のファイルとフォルダを消す
        condition: 作成済みのワークスペースの `release/` に `古い資料.md` と、ファイルを 1 つ持つ `図/`
        mock: なし
        expected: 戻り値が `["古い資料.md", "図/"]`。`release/` があり、中身が空。`config.yaml` が呼ぶ前と同じ
      - name: test_clear_release_when_release_dir_missing
        case: 正常

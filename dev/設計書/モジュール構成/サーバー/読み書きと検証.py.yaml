  - name: check_decision_rules
    title: 案と状態の決まりの検証
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 記録の追加と更新
    scope: public
    summary: 検討事項の並びを、案と状態の決まり（ER 図『ワークスペース』の decisions.yaml）と突き合わせ、合わない決まりごとに問題にする
    args:
      - name: decisions
        type: Any
        required: true
        passing: positional
        description: '`raw` の `decisions.yaml` の値（形が崩れていてもよい）'
    returns:
      type: list[Problem]
      description: '`kind: decision_state`・`file: decisions.yaml` の問題。項目の並びの順、同じ項目の中は ER 図の決まりの順'
    process: |-
      1. 値から `items` の要素を取り出す（`_extract_items`）。辞書でない要素と、`status`・`options` の型がスキーマに合わない要素は飛ばす（スキーマの検証が拾う）
      2. 要素ごとに、`options` の要素のうち `adopted` が真の案を引く
      3. 状態が `OPTIONS_OPTIONAL_STATUSES` に無く、`options` が無いか空の場合、`key: items[{n}].options`・`detail` は ER 図の 1 つ目の理由の行
      4. 状態が `決定済み` で、採用した案が無い場合、`key: items[{n}].options`・`detail` は ER 図の 2 つ目の理由の行
      5. 状態が `未決定` で、採用した案がある場合、`key: items[{n}].status`・`detail` は ER 図の 3 つ目の理由の行（記号は採用した案の `key`）
      6. `id` は要素の `id`（無ければ `None`）
    unit_tests:
      - name: test_check_decision_rules
        case: 正常
        summary: 決まりに合う検討事項は問題 0 件
        condition: '`parametrize`: 案を持つ未決定 / 案 A を採用した決定済み / 案 A を採用した要見直し / 案を持たない未整理・対象外・取り下げ'
        mock: なし
        expected: 空の並び
      - name: test_check_decision_rules_when_mismatch
        case: 正常
        summary: 合わない決まりを 1 件ずつ拾う
        condition: '案を持たない未決定の D-1（`options: []`）、案 A・B を持ち採用した案を持たない決定済みの D-2、案 A を採用した未決定の D-3'
        mock: なし
        expected: 3 件で、`id`・`key` が D-1 の `items[0].options`・D-2 の `items[1].options`・D-3 の `items[2].status`。D-3 の `detail` に `A` と `未決定` を含む
      - name: test_check_decision_rules_when_malformed
        case: 正常
        summary: 形の崩れた要素は飛ばす
        condition: '`items` の要素に文字列と、`options` が文字列の検討事項'
        mock: なし
        expected: 空の並び
  - name: build_mismatch_error
    title: スキーマに合わない例外を作る
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: '問題ごとの `{ファイル名}: {キーのパス}: {理由}` の行と、前の版の形式の問題を含むかを持つ `SchemaMismatchError` を作る'
    args:
      - name: problems
        type: list[Problem]
        required: true
        passing: positional
        description: 検証で拾った問題
      - name: workspace
        type: Workspace | None
        required: false
        default: None
        passing: positional
        description: 問題を出したワークスペース。渡すと前の版の形式の問題かも決める
      - name: written_ids
        type: frozenset[str]
        required: false
        default: frozenset()
        passing: keyword
        description: 書き込むツールが書き換える項目の ID。`is_legacy_problem` へそのまま渡す
    returns:
      type: SchemaMismatchError
      description: '`lines` に問題ごとの行、`legacy` に前の版の形式の問題を 1 件でも含むか'
    process: |-
      1. 問題ごとに `{file}: {key。無ければ (全体)}: {detail}` の行を作る
      2. `workspace` がある場合、問題のどれかが前の版の形式かを決める（`is_legacy_problem(problem, workspace, written_ids=written_ids)`）。無ければ `legacy` は偽
    unit_tests:
      - name: test_build_mismatch_error_when_decision_state
        case: 正常
        summary: 書き込む項目だけが案と状態に合わないときは前の版の形式にしない
        condition: 'D-1 の `kind: decision_state` の問題 1 件とワークスペース。`parametrize`: `written_ids` が `{D-1}` / `written_ids` なし'
        mock: なし
        expected: '`legacy` が偽 / 真。どちらも `lines` が `decisions.yaml: items[0].options:` で始まる 1 行'
  - name: _written_ids
    title: 書き換える項目の ID
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: internal
    summary: 読んだ時点の並びと変更後の並びを比べ、足した項目と中身が違う項目の ID を返す
    args:
      - name: before
        type: list[dict[str, Any]]
        required: true
        passing: positional
        description: 読んだ時点のその種類の並び（`workspace.items[kind]`）
      - name: after
        type: list[dict[str, Any]]
        required: true
        passing: positional
        description: 変更後の並び
    returns:
      type: frozenset[str]
      description: 変更後の並びのうち、読んだ時点に同じ ID の項目が無いか、あっても中身が等しくない項目の ID（`id` が文字列でない項目は含めない）
    process: |-
      1. 読んだ時点の並びを ID → 項目の辞書にする
      2. 変更後の並びの項目ごとに、同じ ID の項目が無いか `!=` なら ID を集める
    unit_tests:
      - name: test_written_ids
        case: 正常
        summary: 足した項目と直した項目だけを返す
        condition: 読んだ時点が D-1・D-2、変更後が D-1（そのまま）・D-2（`status` を直した）・D-3（足した）
        mock: なし
        expected: '`{D-2, D-3}`'
test_files:
  - tests/unit/scripts/test_kinds.py
  - tests/unit/scripts/test_store.py

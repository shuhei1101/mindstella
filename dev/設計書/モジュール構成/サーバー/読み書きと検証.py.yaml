      3. どれも無ければ `WorkspaceNotFoundError` を送る

      `load_workspace`・`clear_release`・`workspace_lock`（`create` が偽で `require` を渡さないとき）と、入口・配信の確かめがこれを呼ぶ。移し替え（モジュール構成『移行』）だけは前の版の形も通すため呼ばない
    exceptions:
      - name: WorkspaceNotFoundError
        condition: '`root` に `.mindstella/config.yaml` が無い'
        message: 'ワークスペースがありません: {root}（直下に前の版の設定ファイルがあるときは `lines` に移し替えの案内）'
    unit_tests:
      - name: test_require_workspace
        case: 正常
        summary: .mindstella/config.yaml があれば通す
        condition: '`.mindstella/config.yaml` を置いた `tmp_path`'
        mock: なし
        expected: 例外にならない
      - name: test_require_workspace_when_missing
        case: 異常
        summary: 無いフォルダと、前の版の形のフォルダを分けて送る
        condition: '`parametrize`: 空の `tmp_path` / 直下に `mindmap.yaml` だけを置いた `tmp_path` / 直下に `config.yaml` だけを置いた `tmp_path`'
        mock: なし
        expected: どれも `WorkspaceNotFoundError`（メッセージに `tmp_path`）。空のフォルダは `lines` が空、ほかの 2 つは `lines` が `/mindstella:upgrade {tmp_path}` を含む 1 行
        exception: .mindstella/config.yaml が無い

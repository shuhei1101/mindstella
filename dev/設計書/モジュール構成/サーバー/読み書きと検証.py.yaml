  - name: validate_workspace
    title: ワークスペースの検証
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/store.py
    usecase: 共通
    scope: public
    summary: 設定と 7 種類をスキーマと突き合わせ、合わない箇所を問題の並びにする
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: 検証するワークスペース
    returns:
      type: list[Problem]
      description: '`load_problems` とスキーマ違反（どれも `kind: schema`）。ファイル名の順、同じファイルの中はキーのパスの順'
    process: |-
      1. スキーマの検証器を作る（検証器の用意。`load_validators`）
      2. `raw` の値をそのまま、ファイルに対応するスキーマと突き合わせ、`iter_errors` のエラーごとに問題を作る（一番上の形の誤りもここで拾う）
         - キーのパスは `absolute_path` を `items[0].status` の形にする（`_format_path`。一番上は `(全体)`）
         - パスが `items[{n}]` を含み、その要素が `id` を持つ場合、その `id` を問題の `id` に入れる
      3. `load_problems` と合わせて並べて返す
    unit_tests:
      - name: test_validate_workspace
        case: 正常
        summary: 合うワークスペースは問題 0 件
        condition: '`init` と同じ設定と、正しい D-1'
        mock: なし
        expected: 空の並び
      - name: test_validate_workspace_when_status_invalid
        case: 正常
        summary: 共通でない種類固有の値の誤りを拾う
        condition: D-2 の `status` が `完了`（items の 2 つめ）
        mock: なし
        expected: '`file: decisions.yaml`・`key: items[1].status`・`id: D-2`・`kind: schema` の 1 件'
      - name: test_validate_workspace_when_common_key_invalid
        case: 正常
        summary: 共通のスキーマ側で決めたキーの誤りも拾う（ファイルをまたぐ $ref）
        condition: T-1 の `tags` が文字列（配列でない）
        mock: なし
        expected: '`file: tasks.yaml`・`key: items[0].tags` の 1 件'
      - name: test_validate_workspace_when_load_problem
        case: 正常
        summary: 読めなかったファイルの問題も含める
        condition: '`load_problems` に `notes.yaml` の問題を 1 件持つワークスペース'
        mock: なし
        expected: その 1 件を含む
      - name: test_validate_workspace_when_top_level_invalid
        case: 正常
        summary: 一番上の形の誤りを拾う
        condition: '`parametrize`: `decisions.yaml` が一番上の配列 / `decisions.yaml` が `items` の横に `extra` のキーを持つ'
        mock: なし
        expected: '`file: decisions.yaml`・`kind: schema` の問題があり、`key` が `(全体)`'
  - name: load_validators

title: "サーバー / 送信"
lead: コメントの一覧からまとめて送られたコメントを `submissions.yaml` に足し、取り込んでいない送信を返し、取り込み済みにする。読み書きと検証だけに依存し、鍵は呼ぶ側（入口・コメント）が取る。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    schemas/submissions.schema.json  submissions.yaml の形（ER 図『ワークスペース』の送信）
    scripts/submissions.py           送信の読み書き
  ```
data_models:
  - name: Submission
    title: 送信
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 送信の取り込み
    role: DTO
    summary: '`submissions.yaml` の 1 件。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: id
        type: str
        description: '`S-{連番}`'
      - name: target
        type: str | None
        description: 向けた項目の ID。項目に紐づかない送信は `None`（キーを書かない）
      - name: body
        type: str
        description: 本文（前後の空白を除いたもの）
      - name: sent
        type: str
        description: 送った日時
      - name: taken
        type: str | None
        description: 取り込んだ日時。取り込んでいなければ `None`
      - name: loc
        type: dict[str, Any] | None
        default: None
        description: 選んだ箇所（ER 図『ワークスペース』の `loc`）。持たない送信は `None`（キーを書かない）
      - name: comment
        type: str | None
        default: None
        description: 送ったレビュー中のコメントの ID。まとめて送る途中で落ちたときに二重に送らないために持つ。前の版の送信は `None`（キーを書かない）
  - name: PendingSubmission
    title: 取り込んでいない送信
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 送信の取り込み
    role: DTO
    summary: '`submissions` の出力の `items[]` の 1 行。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: id
        type: str
        description: 送信の ID
      - name: target
        type: str | None
        description: 向けた項目の ID。項目に紐づかない送信は `None`
      - name: target_title
        type: str | None
        description: その項目のタイトル。項目に紐づかないか、項目が消えていれば `None`
      - name: body
        type: str
        description: 本文
      - name: sent
        type: str
        description: 送った日時
      - name: loc
        type: dict[str, Any] | None
        description: 選んだ箇所。持たなければ `None`
constants:
  - name: SUBMISSIONS_FILE
    title: 送信のファイル名
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 共通
    summary: ワークスペースの送信のファイル名（`records_root(root)` の下。無ければ送信 0 件）
    value: '"submissions.yaml"'
  - name: SUBMISSIONS_SCHEMA
    title: 送信のスキーマ
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 共通
    summary: '`SCHEMA_DIR` の下の送信のスキーマのファイル名'
    value: '"submissions.schema.json"'
  - name: MAX_BODY_CHARS
    title: 本文の上限
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 共通
    summary: 非機能要件の「送信の本文の長さ」（前後の空白を除いた文字数）。コメントの本文と選んだ文のそれぞれに使う
    value: '10000'
  - name: ID_PREFIX
    title: 送信の ID の頭
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: コメントを選んで送る
    summary: 送信の ID の頭の文字（項目の種類の頭の文字と重ならない）
    value: '"S"'
functions:
  - name: load_submissions
    title: 送信の読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 共通
    scope: public
    summary: '`submissions.yaml` を読み、スキーマと突き合わせて送信の並びにする'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: list[Submission]
      description: ファイルの並びの順の送信。ファイルが無ければ空
    process: |-
      1. ファイルが無ければ空を返す
      2. `yaml.safe_load` で読み、`SUBMISSIONS_SCHEMA` と突き合わせる
         - 読めないか合わない場合、合わない箇所ごとの `submissions.yaml: {キーのパス}: {理由}` を持った `SchemaMismatchError` を送る
      3. `items` の要素を `Submission` にして返す
    exceptions:
      - name: SchemaMismatchError
        condition: '`submissions.yaml` が YAML として読めないか、スキーマに合わない'
    unit_tests:
      - name: test_load_submissions
        case: 正常
        summary: 並びの順に読む
        condition: S-1・S-2 を持つ `submissions.yaml`
        mock: なし
        expected: '`[S-1, S-2]` の `Submission`'
      - name: test_load_submissions_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: '`submissions.yaml` が無いワークスペース'
        mock: なし
        expected: '`[]`'
      - name: test_load_submissions_when_invalid
        case: 異常
        summary: 読めない・合わないファイルは読まない
        condition: '`parametrize`: `items: [` / S-1 から `body` を消したもの'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` が `submissions.yaml: ` で始まる。後者は `items[0]`）'
        exception: 読めないかスキーマに合わない
      - name: test_load_submissions_when_previous_version
        case: 正常
        summary: '`loc`・`comment` を持たない前の版の送信も読む'
        condition: '`id`・`target`・`body`・`sent`・`taken` だけの S-1'
        mock: なし
        expected: '`loc` と `comment` が `None` の `Submission`'
  - name: list_pending_submissions
    title: 取り込んでいない送信
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 送信の取り込み
    scope: public
    summary: '`taken` が `null` の送信を連番の小さい順に、向けた項目のタイトルを付けて返す'
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース（項目のタイトルを引く）
    returns:
      type: list[PendingSubmission]
      description: 取り込んでいない送信
    process: |-
      1. 送信を読む（`load_submissions`）
      2. `taken` が `None` のものを連番の順に並べ、`target` の項目の `title`（`target` が `None` か項目が無ければ `None`）と `loc` を付ける（`find_item` の `ItemNotFoundError` は `None` にする）
    unit_tests:
      - name: test_list_pending_submissions
        case: 正常
        summary: 取り込んでいないものだけを送った順に
        condition: D-1 と、S-1（取り込み済み）・S-3（D-1）・S-2（D-1）をこの順に持つ `submissions.yaml`
        mock: なし
        expected: '`[S-2, S-3]` で、どちらも `target_title` が D-1 のタイトル'
      - name: test_list_pending_submissions_when_target_removed
        case: 正常
        summary: 消えた項目への送信はタイトルを None にする
        condition: D-9 への取り込んでいない S-1（D-9 は無い）
        mock: なし
        expected: '`target_title` が `None` の S-1'
      - name: test_list_pending_submissions_when_location_and_no_target
        case: 正常
        summary: 箇所を持つ送信と項目に紐づかない送信を返す
        condition: A-1 と、S-1（A-1 の本文の 2 行目の `loc`）・S-2（`target`・`loc` を持たない）
        mock: なし
        expected: S-1 の `loc` が書いた箇所。S-2 の `target`・`target_title`・`loc` が `None`
  - name: take_submission
    title: 取り込み済みにする
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: 送信の取り込み
    scope: public
    summary: 送信 1 件の `taken` に日時を書く。既に取り込み済みなら書き換えずに前の日時を返す（鍵は呼ぶ側が取る）
    side_effects: '`submissions.yaml` を一時ファイルから置き換える（取り込み済みのときは書かない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: submission_id
        type: str
        required: true
        passing: positional
        description: 送信の ID
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[str, bool]
      description: 取り込んだ日時と、呼ぶ前から取り込み済みだったか
    process: |-
      1. 送信を読み（`load_submissions`）、ID で引く
         - 無い場合、`SubmissionNotFoundError` を送る
      2. 既に `taken` があれば `(taken, True)` を返す
      3. その送信の `taken` を今の日時にした並びを一時ファイルに書いて置き換え、`(日時, False)` を返す
         - `OSError` の場合、一時ファイルを消して `WriteFailedError` を送る
    exceptions:
      - name: SubmissionNotFoundError
        condition: その ID の送信が無い
        message: '送信がありません: {ID}'
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError` が起きた
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_take_submission
        case: 正常
        summary: 取り込んでいない送信に日時を付ける
        condition: S-1（取り込み済み）・S-2（取り込んでいない）で `S-2`。`now` は `2026-10-04T03:00:00+00:00`
        mock: '`now`'
        expected: '`(now の値, False)`。S-2 の `taken` がその日時で、S-1 は呼ぶ前と同じ'
      - name: test_take_submission_when_already_taken
        case: 正常
        summary: 取り込み済みなら前の日時を返して書かない
        condition: 'S-1（`taken: 2026-10-03T00:00:00+00:00`）で `S-1`'
        mock: '`now`（呼ばれないことを確かめる）'
        expected: '`(2026-10-03T00:00:00+00:00, True)`。`submissions.yaml` の更新日時が呼ぶ前と同じ'
      - name: test_take_submission_when_not_found
        case: 異常
        summary: 無い ID は取り込み済みにしない
        condition: S-1 だけで `S-9`
        mock: なし
        expected: '`SubmissionNotFoundError`（メッセージに `S-9`）'
        exception: その ID の送信が無い
      - name: test_take_submission_when_write_fails
        case: 異常
        summary: 置き換えに失敗したら前の送信を残す
        condition: S-1（取り込んでいない）。`os.replace` を `OSError` を送る関数に差し替える
        mock: '`os.replace`'
        expected: '`WriteFailedError`。`submissions.yaml` が呼ぶ前と同じ'
        exception: 置き換えで OSError
  - name: append_submissions
    title: 送信のまとめた追加
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/submissions.py
    usecase: コメントを選んで送る
    scope: public
    summary: レビュー中のコメントを並びの順に取り込んでいない送信として足す。同じコメントの送信が既にあれば足さずにそれを返す（鍵は呼ぶ側が取る。確かめは呼ぶ側が済ませる）
    side_effects: '`submissions.yaml` を一時ファイルから 1 回で置き換える（無ければ作る。足すものが無ければ書かない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: comments
        type: list[ReviewComment]
        required: true
        passing: positional
        description: 送るレビュー中のコメント（溜めた順）
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: list[Submission]
      description: '`comments` と同じ並びの、足したか既にあった送信'
    process: |-
      1. 送信を読む（`load_submissions`）
      2. コメントごとに、同じ `comment` の送信があればそれを使い、無ければ連番の最大 + 1 の ID で `target`・`loc`・`body`・`sent`（この呼び出しで 1 つの日時）・`taken: null`・`comment` の 1 件を末尾に足す
         - `[WARNING]` 既に送っていたコメント（コメントの ID・送信の ID）
      3. 足したものがあれば `{"items": [...]}` を一時ファイルに書いて置き換える（`dump_yaml`、`write_temp`、`os.replace`。`None` の `target`・`loc`・`comment` はキーを書かない）
         - `OSError` の場合、一時ファイルを消して `WriteFailedError` を送る（前の `submissions.yaml` は残る）
    exceptions:
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError` が起きた（一時ファイルを消した後）
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_append_submissions
        case: 正常
        summary: 連番を振って並びの順に末尾へ足す
        condition: S-1・S-3 を持つワークスペース、C-1（D-1）・C-2（A-1 の本文の 2 行目）・C-3（項目を指さない）。`now` は `2026-10-05T03:00:00+00:00`
        mock: '`now`'
        expected: '`[S-4, S-5, S-6]` で `comment` が C-1・C-2・C-3。S-4 は `loc` を持たず、S-5 は `loc` を持ち、S-6 は `target`・`loc` のキーを持たない。どれも `sent` が now の値で `taken: null`'
      - name: test_append_submissions_when_first
        case: 正常
        summary: ファイルが無ければ作って S-1
        condition: '`submissions.yaml` が無いワークスペース、C-1'
        mock: '`now`'
        expected: '`[S-1]` で、`submissions.yaml` ができている'
      - name: test_append_submissions_when_already_sent
        case: 正常
        summary: 既に送ったコメントは足さずにその送信を返す
        condition: '`comment: C-1` の S-1 を持つワークスペース、C-1・C-2'
        mock: '`now`'
        expected: '`[S-1, S-2]`。`submissions.yaml` の件数が 2'
      - name: test_append_submissions_when_write_fails
        case: 異常
        summary: 置き換えに失敗したら前の送信を残す
        condition: S-1 を持つワークスペース、C-1。`os.replace` を `OSError` を送る関数に差し替える
        mock: '`os.replace`（`submissions` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`。`submissions.yaml` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: 置き換えで OSError
test_files:
  - tests/unit/scripts/test_submissions.py

title: "サーバー / タグの語彙"
lead: 設定の `tags` からタグの語彙を読み、渡したタグのうち語彙に無い未登録の候補を、付けた項目かスレッドと字面の近い語彙のタグを添えて並べる。検索・書き込み・スレッド・点検・設定の更新から使う。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    vocabulary.py   タグの語彙の読み取り・未登録の候補の洗い出し・近いタグの候補
  ```
constants:
  - name: CANDIDATE_LIMIT
    title: 候補の上限
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    summary: 未登録の候補のタグ 1 つに添える近いタグの数の上限（インターフェース定義『項目の追加』の `candidate_tags[].similar`・『項目の検索』の制約「近いタグの候補」）
    value: '5'
functions:
  - name: tag_entries
    title: 語彙の読み取り
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    scope: public
    summary: 設定の `tags` を `{name, summary, include, exclude, examples}` の並びにして、名前の順に返す
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: list[dict[str, Any]]
      description: '`{name, summary, include, exclude, examples}` の並び（名前の順。`summary`・`include`・`exclude` は持たなければ `None`、`examples` は持たなければ空の配列）'
    process: |-
      1. `settings.get("tags")` が配列でなければ空の並びを返す
      2. 要素のうち `name` が空でない文字列のものだけを `{name, summary, include, exclude, examples}` にする（形が合わない要素は飛ばす。スキーマの誤りは点検が返す）
         - `summary`・`include`・`exclude` は文字列でなければ `None`
         - `examples` は文字列の配列でなければ空の配列（文字列でない要素は飛ばす）
      3. 名前の順に並べる
    unit_tests:
      - name: test_tag_entries
        case: 正常
        summary: 語彙を名前の順に並べ、持たないキーは None か空の配列にする
        condition: '`tags: [{name: 画面, summary: s, include: i, exclude: e, examples: [x]}, {name: データ}]`'
        mock: なし
        expected: '`[{name: データ, summary: None, include: None, exclude: None, examples: []}, {name: 画面, summary: s, include: i, exclude: e, examples: [x]}]`'
      - name: test_tag_entries_when_missing
        case: 正常
        summary: 語彙が無ければ空
        condition: '`tags` を持たない設定'
        mock: なし
        expected: '`[]`'
  - name: tag_names
    title: 語彙の名前
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    scope: public
    summary: 設定の語彙のタグの名前を集める
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: frozenset[str]
      description: 語彙のタグの名前
    process: 1. `tag_entries` の `name` を集める
    unit_tests:
      - name: test_tag_names
        case: 正常
        summary: 語彙の名前を集める
        condition: '`tags: [{name: 画面}, {name: データ}]`'
        mock: なし
        expected: '`{画面, データ}`'
  - name: similar_tags
    title: 近いタグの候補
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    scope: public
    summary: 語彙のタグを、渡したタグと字面が近い順に最大 `CANDIDATE_LIMIT` 件返す
    args:
      - name: tag
        type: str
        required: true
        passing: positional
        description: 未登録の候補のタグ
      - name: names
        type: Iterable[str]
        required: true
        passing: positional
        description: 語彙のタグの名前
    returns:
      type: list[str]
      description: 近い順の候補（語彙が空なら空）
    process: |-
      1. 語彙のタグごとに、渡したタグとの近さを `difflib.SequenceMatcher(None, tag, name).ratio()` で測る（英字は小文字にして比べる）
      2. 近さが 0 より大きいものを、近さの大きい順・同じ近さは名前の順に並べ、先頭の `CANDIDATE_LIMIT` 件を返す
    reason: 標準ライブラリで済み、日本語の文字列も文字の並びで比べられるため。字面の揺れ（`データ`・`データー`、`通知`・`通知機能`）を拾えればよく、意味の近さはスキルが説明を読んで判断する
    unit_tests:
      - name: test_similar_tags
        case: 正常
        summary: 字面の近い順に並べ、近さが 0 のタグは入れない
        condition: '`tag=通知機能`、語彙 `通知`・`保存`・`通信`'
        mock: なし
        expected: 先頭が `通知`、`保存` を含まない
      - name: test_similar_tags_limit
        case: 正常
        summary: 候補は上限まで
        condition: '`tag=a`、語彙 `a1`〜`a7`'
        mock: なし
        expected: 5 件
  - name: list_candidate_tags
    title: 未登録の候補の洗い出し
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の追加と更新
    scope: public
    summary: 渡したタグのうち語彙に無い未登録の候補を、付けた項目かスレッドの ID と近い語彙のタグを添えて、タグごとに並べる
    args:
      - name: owned_tags
        type: list[tuple[str, Any]]
        required: true
        passing: positional
        description: 項目かスレッドの ID と、そこへ渡したタグの並びの組（書き込んだ順）
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: list[dict[str, Any]]
      description: '`{tag, ids, similar}` の並び（タグの名前の順。候補が無ければ空）。インターフェース定義『項目の追加』の `candidate_tags`'
    process: |-
      1. 語彙の名前を集める（`tag_names`）
      2. 組を渡した順に見て、並びの中の文字列で語彙に無いタグごとに、ID を重ならないように控える（並びでない値・文字列でない要素は、スキーマと引数の確かめに任せて飛ばす）
      3. 控えたタグを名前の順に並べ、それぞれ `{tag, ids, similar}` にする（`similar` は `similar_tags`）
    unit_tests:
      - name: test_list_candidate_tags
        case: 正常
        summary: 候補をタグごとにまとめ、付けた ID を重ならないように並べる
        condition: 語彙 `通知`・`データ`。`[(D-2, [通知機能, データ]), (T-1, [通知機能]), (T-1, [通知機能]), (D-3, [保存処理])]`
        mock: なし
        expected: '`[{tag: 保存処理, ids: [D-3], similar: []}, {tag: 通知機能, ids: [D-2, T-1], similar: [通知]}]`'
      - name: test_list_candidate_tags_when_none
        case: 正常
        summary: 全て語彙にあれば空
        condition: 語彙 `データ`。`[(D-1, [データ]), (D-2, None)]`
        mock: なし
        expected: '`[]`'
test_files:
  - tests/unit/scripts/test_vocabulary.py

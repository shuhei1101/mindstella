title: "サーバー / タグの語彙"
lead: 設定の `tags` からタグの語彙を読み、渡したタグが語彙にあるかを確かめて、無いタグに字面の近い候補を添える。例外の定義だけに依存し、検索・書き込み・スレッド・点検・設定の更新から使う。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/scripts/
    vocabulary.py   タグの語彙の読み取り・語彙にあるかの確かめ・近いタグの候補
  ```
constants:
  - name: CANDIDATE_LIMIT
    title: 候補の上限
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    summary: 語彙に無いタグ 1 つに添える近いタグの数の上限（インターフェース定義『項目の検索』の制約「近いタグの候補」）
    value: '5'
functions:
  - name: tag_entries
    title: 語彙の読み取り
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    scope: public
    summary: 設定の `tags` を `{name, summary}` の並びにして、名前の順に返す
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: list[dict[str, str | None]]
      description: '`{name, summary}` の並び（名前の順。説明が無ければ `summary` は `None`）'
    process: |-
      1. `settings.get("tags")` が配列でなければ空の並びを返す
      2. 要素のうち `name` が空でない文字列のものだけを `{name, summary}` にする（形が合わない要素は飛ばす。スキーマの誤りは点検が返す）
      3. 名前の順に並べる
    unit_tests:
      - name: test_tag_entries
        case: 正常
        summary: 語彙を名前の順に並べ、説明が無ければ None にする
        condition: '`tags: [{name: 画面, summary: s}, {name: データ}]`'
        mock: なし
        expected: '`[{name: データ, summary: None}, {name: 画面, summary: s}]`'
      - name: test_tag_entries_when_missing
        case: 正常
        summary: 語彙が無ければ空
        condition: '`tags` を持たない設定'
        mock: なし
        expected: '`[]`'
  - name: tag_names
    title: 語彙の名前
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    scope: public
    summary: 設定の語彙のタグの名前を集める
    args:
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: frozenset[str]
      description: 語彙のタグの名前
    process: 1. `tag_entries` の `name` を集める
    unit_tests:
      - name: test_tag_names
        case: 正常
        summary: 語彙の名前を集める
        condition: '`tags: [{name: 画面}, {name: データ}]`'
        mock: なし
        expected: '`{画面, データ}`'
  - name: similar_tags
    title: 近いタグの候補
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の検索
    scope: public
    summary: 語彙のタグを、渡したタグと字面が近い順に最大 `CANDIDATE_LIMIT` 件返す
    args:
      - name: tag
        type: str
        required: true
        passing: positional
        description: 語彙に無いタグ
      - name: names
        type: Iterable[str]
        required: true
        passing: positional
        description: 語彙のタグの名前
    returns:
      type: list[str]
      description: 近い順の候補（語彙が空なら空）
    process: |-
      1. 語彙のタグごとに、渡したタグとの近さを `difflib.SequenceMatcher(None, tag, name).ratio()` で測る（英字は小文字にして比べる）
      2. 近さが 0 より大きいものを、近さの大きい順・同じ近さは名前の順に並べ、先頭の `CANDIDATE_LIMIT` 件を返す
    reason: 標準ライブラリで済み、日本語の文字列も文字の並びで比べられるため。字面の揺れ（`データ`・`データー`、`通知`・`通知機能`）を拾えればよく、意味の近さはスキルが説明を読んで判断する
    unit_tests:
      - name: test_similar_tags
        case: 正常
        summary: 字面の近い順に並べ、近さが 0 のタグは入れない
        condition: '`tag=通知機能`、語彙 `通知`・`保存`・`通信`'
        mock: なし
        expected: 先頭が `通知`、`保存` を含まない
      - name: test_similar_tags_limit
        case: 正常
        summary: 候補は上限まで
        condition: '`tag=a`、語彙 `a1`〜`a7`'
        mock: なし
        expected: 5 件
  - name: require_known_tags
    title: 語彙にあるかの確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/vocabulary.py
    usecase: 記録の追加と更新
    scope: public
    summary: 渡したタグが全て語彙にあるかを確かめ、無いタグがあれば候補を添えて `UnknownTagError` を送る
    args:
      - name: tags_by_argument
        type: list[tuple[str, Any]]
        required: true
        passing: positional
        description: 引数の名前（`tags`・`any_tags` など）と、その引数で渡したタグの並びの組
      - name: settings
        type: dict[str, Any]
        required: true
        passing: positional
        description: '`config.yaml` の中身'
    returns:
      type: None
      description: 全て語彙にあれば何も返さない
    process: |-
      1. 語彙の名前を集める（`tag_names`）
      2. 引数ごとに、並びの中の文字列で語彙に無いものを、渡した順に拾う（並びでない値・文字列でない要素は、スキーマと引数の確かめに任せて飛ばす）
      3. 拾ったタグがあれば、それぞれに候補（`similar_tags`）を添えて `UnknownTagError` を送る
    exceptions:
      - name: UnknownTagError
        condition: 語彙に無いタグが 1 つ以上ある
    unit_tests:
      - name: test_require_known_tags
        case: 正常
        summary: 全て語彙にあれば何も送らない
        condition: 語彙 `データ`・`画面`、`[(tags, [データ]), (any_tags, [画面])]`
        mock: なし
        expected: 例外が起きない
      - name: test_require_known_tags_when_unknown
        case: 異常
        summary: 無いタグを引数ごとに候補つきで返す
        condition: 語彙 `データ`、`[(tags, [データー]), (any_tags, [データ])]`
        mock: なし
        expected: '`UnknownTagError` の `unknown` が `[(tags, データー, [データ])]`、`lines` に `tags: データー（候補: データ）`'
      - name: test_require_known_tags_when_empty_vocabulary
        case: 異常
        summary: 語彙が空なら候補なしで返す
        condition: '`tags` を持たない設定、`[(tags, [通知])]`'
        mock: なし
        expected: '`lines` に `tags: 通知（候補なし）`'

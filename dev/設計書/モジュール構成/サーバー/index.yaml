summary: "起動と、MCP のツール・プレビューの配信でワークスペースを読み書きするサーバーのモジュール"
docs_index: true
items:
  - page: 入口.py.yaml
    summary: MCP サーバーのツールの登録・結果とエラーの組み立て・ツールごとの処理
  - page: 読み書きと検証.py.yaml
    summary: 種類の定義・例外・ワークスペースの読み書きと検証
  - page: 検索.py.yaml
    summary: 検索とページ分け・1 件の表示と参照元・属性名の一覧・タグの一覧
  - page: 依存と影響.py.yaml
    summary: 影響・後続の件数・次の候補・再開時の状況
  - page: 点検.py.yaml
    summary: スキーマ違反・ID の重複・参照切れ・本文のずれ・設定に無いフェーズ・語彙に無いタグ
  - page: ビルド.py.yaml
    summary: プレビューの記録の収集・雛形の組み立て・配る書き出し
  - page: ゴール判定.py.yaml
    summary: ゴールに届いたかの判定と goal の処理
  - page: 移行.py.yaml
    summary: 版の比較と、版ごとの移し替えの手順を並べる・写しを取って当てる・値を入れる・版を書く
  - page: 起動.py.yaml
    summary: 依存の確認と、起動スクリプトが使うプラグインのフォルダ・セッションの名前・MCP の設定
  - page: 配信.py.yaml
    summary: プレビューの配信の待ち受け・画面と記録とスレッドを返す・書き換えの知らせ・コメントとスレッドの状態の受け付け
  - page: 設定の更新.py.yaml
    summary: 設定の更新の引数の確かめ・設定の置き換え・フェーズの付け替え・設定と種類の YAML のまとめた書き込み
  - page: 変更履歴.py.yaml
    summary: 変更履歴の 1 回分・本文の差分・書き換えのまとまり・前回開いた日時
  - page: コメント.py.yaml
    summary: レビュー中のコメントと書きかけの読み書き・スレッドへまとめて送る
  - page: 箇所.py.yaml
    summary: コメントが指す箇所の形と、今の項目に合うかの確かめ
  - page: ワークスペースのREADME.py.yaml
    summary: 直下の README.md の中身の組み立て・書くかの判定・書き込み
  - page: 登録.py.yaml
    summary: 起動スクリプトを呼ぶ alias と環境変数の登録・読み返し・外す
  - page: ClaudeCodeへの入力.py.yaml
    summary: まとめて送った後に Claude Code のペインへ貼り、会話の記録で届いたかを確かめる
  - page: HTMLの本文.py.yaml
    summary: HTML の本文の行の印と、行の範囲の描いた文
  - page: スレッド.py.yaml
    summary: スレッドの読み書き・一覧と既読・返信・状態と要約の書き換え・取り込み済み・まとめて送った書き込みの追加
  - page: 未読へ戻す.py.yaml
    summary: SessionStart のフックが呼ぶ、ワークスペースを探してスレッドの書き込みを未読に戻すスクリプト
  - page: タグの語彙.py.yaml
    summary: タグの語彙の読み取り・語彙にあるかの確かめ・近いタグの候補
  - page: 保存待ちの編集.py.yaml
    summary: 保存待ちの編集の読み書き・取り消し・まとめて保存

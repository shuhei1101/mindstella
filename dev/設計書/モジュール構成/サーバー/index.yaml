summary: "起動と、MCP のツール・プレビューの配信でワークスペースを読み書きするサーバーのモジュール"
docs_index: true
items:
  - page: 入口.py.yaml
    summary: MCP サーバーのツールの登録・結果とエラーの組み立て・ツールごとの処理
  - page: 読み書きと検証.py.yaml
    summary: 種類の定義・例外・ワークスペースの読み書きと検証
  - page: 検索.py.yaml
    summary: 検索・1 件の表示と参照元・属性名の一覧
  - page: 依存と影響.py.yaml
    summary: 影響・後続の件数・次の候補・再開時の状況
  - page: 点検.py.yaml
    summary: スキーマ違反・ID の重複・参照切れ・本文のずれ・設定に無いフェーズ
  - page: ビルド.py.yaml
    summary: プレビューの記録の収集・雛形の組み立て・配る書き出し
  - page: ゴール判定.py.yaml
    summary: ゴールに届いたかの判定と goal の処理
  - page: 移行.py.yaml
    summary: 版の比較と、版ごとの移し替えの手順を並べる・写しを取って当てる・値を入れる・版を書く
  - page: 起動.py.yaml
    summary: 依存の確認と、起動スクリプトが使うプラグインのフォルダ・セッションの名前・MCP の設定
  - page: 配信.py.yaml
    summary: プレビューの配信の待ち受け・画面と記録を返す・書き換えの知らせ・コメントの受け付け
  - page: 送信.py.yaml
    summary: まとめて送ったコメントを送信に足す・取り込んでいない送信を返す・取り込み済みにする
  - page: 設定の更新.py.yaml
    summary: 設定の更新の引数の確かめ・設定の置き換え・フェーズの付け替え・設定と種類の YAML のまとめた書き込み
  - page: コメント.py.yaml
    summary: レビュー中のコメントと書きかけの読み書き・まとめて送る
  - page: 箇所.py.yaml
    summary: コメントが指す箇所の形と、今の項目に合うかの確かめ

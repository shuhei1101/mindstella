    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 送信の取り込み
    scope: public
    summary: スレッドの要約とタグを置き換え、AI が既読にした利用者の書き込みを取り込み済みにする。クローズのスレッドも書き換える（鍵は呼ぶ側が取る）
    side_effects: '`threads.yaml` を置き換える'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: スレッドの ID
      - name: summary
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 書き直した要約。`None` は変えない
      - name: tags
        type: list[str] | None
        required: false
        default: None
        passing: keyword

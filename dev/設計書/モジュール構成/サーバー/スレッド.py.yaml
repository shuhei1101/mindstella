  - name: set_thread_status
    title: 状態を変える
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    scope: public
    summary: スレッドをクローズにするかオープンに戻し、書き手・理由・日時を状態の記録に足す。既にその状態なら書かない（鍵は呼ぶ側が取る。AI のツールと画面の受け口が書き手を渡す）
    side_effects: '`threads.yaml` を置き換える（状態が変わるときだけ）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: スレッドの ID
      - name: status
        type: str
        required: true
        passing: keyword
        description: 変えた後の状態（`open`・`closed`）
      - name: reason
        type: str | None
        required: false
        default: None
        passing: keyword
        description: 理由
      - name: author
        type: Literal['user', 'ai']
        required: true
        passing: keyword
        description: 状態を変える書き手
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: bool
      description: 状態を変えたか（既にその状態なら偽）
    process: |-
      1. `status` が `open`・`closed` のどちらかで、`reason` が `None` か文字列で前後の空白を除いて `MAX_SUMMARY_CHARS` 文字以下かを確かめる（空白だけは `None` にする）
      2. スレッドを読み、ID で引く（無ければ `ThreadNotFoundError`）
         - 既にその状態の場合、書かずに偽を返す
      3. `status` を置き換え、`events` の末尾に `kind`（`closed` へは `closed`、`open` へは `reopened`）・`author`・`reason`・今の日時を足して書く（`_write_threads`）。書き込みの `taken`・`read` は変えない
         - `[INFO]` スレッドの状態を変えた（スレッドの ID・状態・書き手）
    exceptions:
      - name: ArgumentError
        condition: '`status` が `open`・`closed` でない、`reason` が文字列でないか上限を超える'
        message: '引数の誤り: {引数の名前}: {理由}'
      - name: ThreadNotFoundError
        condition: その ID のスレッドが無い
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_set_thread_status
        case: 正常
        summary: クローズにして記録を足し、取り込み待ちは変えない
        condition: 取り込んでいない利用者の書き込みを持つオープンの TH-1。`status="closed"`・`reason=" 案 A で決着 "`・`author="ai"`。`now` は `2026-10-13T03:00:00+00:00`
        mock: '`now`'
        expected: '真。`status` が `closed`、`events` の末尾が `{kind: closed, author: ai, reason: 案 A で決着, created: now の値}`。書き込みの `taken` が `None` のまま'
      - name: test_set_thread_status_when_reopen
        case: 正常
        summary: オープンに戻す。空白だけの理由は持たない
        condition: クローズの TH-1。`status="open"`・`reason="  "`・`author="user"`
        mock: '`now`'
        expected: '真。`events` の末尾が `kind: reopened`・`author: user`・`reason: None`'
      - name: test_set_thread_status_when_same
        case: 正常
        summary: 既にその状態なら書かない
        condition: オープンの TH-1 で `status="open"`
        mock: '`now`（呼ばれないことを確かめる）'
        expected: 偽。`threads.yaml` の更新日時が呼ぶ前と同じ
      - name: test_set_thread_status_when_rejected
        case: 異常
        summary: 形の誤りと無い ID は書かない
        condition: '`parametrize`: `status="done"` / `reason` が 401 文字 / `TH-9`'
        mock: なし
        expected: '`ArgumentError`（`argument` が `status`）/ `ArgumentError`（`reason`）/ `ThreadNotFoundError`。`threads.yaml` が呼ぶ前と同じ'
        exception: 形の誤り・無い ID
  - name: update_thread

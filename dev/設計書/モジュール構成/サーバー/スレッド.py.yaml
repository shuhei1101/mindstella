        mock: '`now`'
        expected: '`["起票", "資料"]` / `[]`。どちらも返した取り込み済みが空で、`summary` が呼ぶ前と同じ'
      - name: test_update_thread_when_rejected
        case: 異常
        summary: 変えるものが無い・形の誤り・無い ID は書かない
        condition: '`parametrize`: 何も渡さない / `summary=" "` / `tags=["a", "a"]` / `TH-9` に `take=True`'
        mock: なし
        expected: '`ArgumentError`（`argument` が `summary`）/ `ArgumentError`（`summary`）/ `ArgumentError`（`tags`）/ `ThreadNotFoundError`。`threads.yaml` が呼ぶ前と同じ'
        exception: 変えるものが無い・形の誤り・無い ID
      - name: test_update_thread_when_candidate_tag
        case: 正常

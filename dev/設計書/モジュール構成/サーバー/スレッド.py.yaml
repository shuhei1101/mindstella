title: "サーバー / スレッド"
lead: スレッド（`threads.yaml`）を読み書きする。まとめて送られた利用者の書き込みを足し、AI の一覧・既読・返信・状態と要約の書き換え・取り込み済みを担い、画面へ返す形を作る。読み書きと検証だけに依存し、鍵は呼ぶ側（入口・コメント・配信・未読へ戻す）が取る。単体テストは `tests/unit/scripts/test_threads.py` に置く。
directory: |-
  ```
  plugins/mindstella/skills/mindmap/
    schemas/threads.schema.json  threads.yaml の形（ER 図『ワークスペース』のスレッド）
    scripts/threads.py           スレッドの読み書き
  ```
constants:
  - name: THREADS_FILE
    title: スレッドのファイル名
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    summary: '`records_root(root)` の下。無ければスレッド 0 件'
    value: '"threads.yaml"'
  - name: THREADS_SCHEMA
    title: スレッドのスキーマ
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    summary: '`SCHEMA_DIR` の下のファイル名'
    value: '"threads.schema.json"'
  - name: MAX_BODY_CHARS
    title: 本文の上限
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    summary: 非機能要件の「送信の本文の長さ」（前後の空白を除いた文字数）。書き込みの本文・レビュー中のコメントの本文・選んだ文のそれぞれに使う
    value: '10000'
  - name: MAX_SUMMARY_CHARS
    title: 要約と理由の上限
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    summary: 非機能要件の「スレッドの要約と理由の長さ」（前後の空白を除いた文字数）。要約と、状態を変える理由のそれぞれに使う
    value: '400'
  - name: THREAD_ID_PREFIX
    title: スレッドの ID の頭
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    summary: スレッドの ID の頭の文字（項目の種類とコメントの頭の文字と重ならない）。書き込みの ID は `{スレッドの ID}-{スレッドの中の連番}`
    value: '"TH"'
  - name: HEAD_CHARS
    title: 先頭の長さ
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    summary: 一覧の `head`（最初の書き込みの先頭）の文字数
    value: '80'
data_models:
  - name: Post
    title: 書き込み
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    role: DTO
    summary: スレッドの書き込み 1 件。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: id
        type: str
        description: '`{スレッドの ID}-{連番}`'
      - name: author
        type: Literal['user', 'ai']
        description: 書き手
      - name: body
        type: str
        description: 本文（前後の空白を除いたもの）
      - name: created
        type: str
        description: 書いた日時
      - name: read
        type: bool
        description: AI の既読
      - name: taken
        type: str | None
        default: None
        description: 利用者の書き込みを AI が取り込んだ日時。取り込んでいなければ `None`。AI の書き込みはキーを書かない
      - name: comment
        type: str | None
        default: None
        description: 送ったレビュー中のコメントの ID。まとめて送る途中で落ちたときに二重に足さないために持つ。AI の書き込みと移し替えた書き込みは `None`（キーを書かない）
      - name: seen
        type: bool
        description: 利用者の既読。AI の書き込みは `False`、利用者の書き込みと移し替えた書き込みは `True` で足し、画面で開いたときに `mark_seen` が `True` にする。`read`（AI の既読）とは別に持ち、`reset_unread` は変えない
  - name: ThreadEvent
    title: 状態の記録
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    role: DTO
    summary: クローズかオープンへの戻しの 1 件。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: kind
        type: Literal['closed', 'reopened']
        description: 記録の種類
      - name: author
        type: Literal['user', 'ai']
        description: 状態を変えた書き手
      - name: reason
        type: str | None
        description: 理由。持たなければ `None`（`null` で書く）
      - name: created
        type: str
        description: 変えた日時
  - name: Thread
    title: スレッド
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    role: DTO
    summary: '`threads.yaml` の 1 件。`@dataclass(frozen=True, slots=True, kw_only=True)`'
    properties:
      - name: id
        type: str
        description: '`TH-{連番}`'
      - name: status
        type: Literal['open', 'closed']
        description: 状態
      - name: tags
        type: list[str]
        description: タグ
      - name: summary
        type: str | None
        description: 要約。まだ書いていなければ `None`（`null` で書く）
      - name: target
        type: str | None
        default: None
        description: 向けた項目の ID。項目に紐づかないスレッドは `None`（キーを書かない）
      - name: loc
        type: dict[str, Any] | None
        default: None
        description: 最初の書き込みに添えた箇所（ER 図『ワークスペース』の `loc`）。持たなければ `None`（キーを書かない）
      - name: posts
        type: list[Post]
        description: 書いた順の書き込み（1 件以上）
      - name: events
        type: list[ThreadEvent]
        description: 書いた順の状態の記録
  - name: UserPostInput
    title: 足す利用者の書き込み
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: コメントを選んで送る
    role: DTO
    summary: まとめて送るレビュー中のコメント 1 件を、スレッドへ足す形にしたもの（コメントのモジュールが作る）。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: comment
        type: str
        description: レビュー中のコメントの ID
      - name: thread
        type: str | None
        description: 返信先のスレッドの ID。新しいスレッドの最初の書き込みは `None`
      - name: target
        type: str | None
        description: 新しいスレッドの向けた項目の ID
      - name: loc
        type: dict[str, Any] | None
        description: 新しいスレッドの最初の書き込みに添えた箇所
      - name: body
        type: str
        description: 本文
  - name: SentPost
    title: 足した書き込み
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: コメントを選んで送る
    role: DTO
    summary: 『コメントをまとめて送る』の `items[]` の 1 行。`@dataclass(frozen=True, slots=True, kw_only=True)`
    properties:
      - name: comment
        type: str
        description: 送ったレビュー中のコメントの ID
      - name: thread
        type: str
        description: 書き込みを足したスレッドの ID
      - name: post
        type: str
        description: 足した（既にあった）書き込みの ID
functions:
  - name: load_threads
    title: スレッドの読み込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    scope: public
    summary: '`threads.yaml` を読み、スキーマと突き合わせてスレッドの並びにする'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: list[Thread]
      description: ファイルの並びの順のスレッド。ファイルが無ければ空
    process: |-
      1. ファイルが無ければ空を返す
      2. `yaml.safe_load` で読み、`THREADS_SCHEMA` と突き合わせる
         - 読めないか合わない場合、合わない箇所ごとの `threads.yaml: {キーのパス}: {理由}` を持った `SchemaMismatchError` を送る
      3. `items` の要素を `Thread`（`posts` は `Post`、`events` は `ThreadEvent`）にして返す
    exceptions:
      - name: SchemaMismatchError
        condition: '`threads.yaml` が YAML として読めないか、スキーマに合わない'
    unit_tests:
      - name: test_load_threads
        case: 正常
        summary: 並びの順に読む
        condition: TH-1（利用者と AI の書き込み・クローズの記録）・TH-2（`target`・`loc` を持たない）を持つ `threads.yaml`
        mock: なし
        expected: '`[TH-1, TH-2]`。TH-1 の `posts` が 2 件で `events` が 1 件、TH-2 の `target`・`loc` が `None`'
      - name: test_load_threads_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: '`threads.yaml` が無いワークスペース'
        mock: なし
        expected: '`[]`'
      - name: test_load_threads_when_invalid
        case: 異常
        summary: 読めない・合わないファイルは読まない
        condition: '`parametrize`: `items: [` / TH-1 から `posts` を消したもの / `status: done`'
        mock: なし
        expected: '`SchemaMismatchError`（`lines` が `threads.yaml: ` で始まる）'
        exception: 読めないかスキーマに合わない
  - name: _write_threads
    title: スレッドの書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    scope: internal
    summary: スレッドの並びを `threads.yaml` に一時ファイルから置き換える
    side_effects: '`threads.yaml` を置き換える（無ければ作る）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: threads
        type: list[Thread]
        required: true
        passing: positional
        description: 書くスレッド（並びのまま書く）
    returns:
      type: None
      description: '-'
    process: |-
      1. `{"items": [...]}` を `dump_yaml` し、一時ファイルに書いて（`write_temp`）`os.replace` で置き換える。`None` の `target`・`loc`・`comment` と、AI の書き込みの `taken` はキーを書かない。`summary`・`reason` と利用者の書き込みの `taken` は `None` を `null` で書く
         - `OSError` の場合、一時ファイルを消して `WriteFailedError` を送る（前の `threads.yaml` は残る）
    exceptions:
      - name: WriteFailedError
        condition: 一時ファイルの書き込みか置き換えで `OSError` が起きた
        message: '書き込めませんでした: {パス}（{理由}）'
    unit_tests:
      - name: test_write_threads
        case: 正常
        summary: 持たないキーを書かず、読み直すと同じになる
        condition: 項目を指さない TH-1（利用者の取り込んでいない書き込みと AI の書き込み、要約なし）を書いて `load_threads` で読む
        mock: なし
        expected: '読み直した並びが書いた並びと等しい。ファイルに `target`・`loc` のキーが無く、`summary: null`、利用者の書き込みに `taken: null`、AI の書き込みに `taken` のキーが無い'
      - name: test_write_threads_when_write_fails
        case: 異常
        summary: 置き換えに失敗したら前のスレッドを残す
        condition: TH-1 を持つワークスペース。`os.replace` を `OSError` を送る関数に差し替える
        mock: '`os.replace`（`threads` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`。`threads.yaml` が呼ぶ前と同じで、`.tmp` のファイルが無い'
        exception: 置き換えで OSError
  - name: awaiting_posts
    title: 取り込み待ちの書き込み
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 送信の取り込み
    scope: public
    summary: スレッドの、AI が取り込んでいない利用者の書き込みを返す（1 件以上あれば取り込み待ちのスレッド。点検と項目の削除も使う）
    args:
      - name: thread
        type: Thread
        required: true
        passing: positional
        description: スレッド
    returns:
      type: list[Post]
      description: '`author` が `user` で `taken` が `None` の書き込み（書いた順）'
    unit_tests:
      - name: test_awaiting_posts
        case: 正常
        summary: 取り込んでいない利用者の書き込みだけを返す
        condition: 利用者（取り込み済み）・AI・利用者（取り込んでいない）の 3 件を持つスレッド / AI の書き込みだけのスレッド
        mock: なし
        expected: 3 件目だけ / 空
  - name: list_threads
    title: スレッドの一覧
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 送信の取り込み
    scope: public
    summary: スレッドを状態・タグ・未読・取り込み待ちで絞り、本文を含めないキーだけの行にする（『スレッドの一覧』の `items`。読むだけ）
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース（項目のタイトルを引く）
      - name: status
        type: Literal['open', 'closed', 'all'] | None
        required: false
        default: None
        passing: keyword
        description: 返す状態。`None` は `awaiting` が偽なら `open`、真なら `all`
      - name: tag
        type: str | None
        required: false
        default: None
        passing: keyword
        description: このタグを持つものだけ
      - name: unread
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: AI の未読の書き込みを持つものだけ
      - name: awaiting
        type: bool
        required: false
        default: 'False'
        passing: keyword
        description: 取り込み待ちのものだけ
    returns:
      type: list[dict[str, Any]]
      description: '`{id, status, tags, summary, head, target, target_title, last_author, last_at, posts, unread, awaiting}` の行'
    process: |-
      1. スレッドを読む（`load_threads`）
      2. 渡した条件を全て満たすものを残す（`status` が `None` なら `awaiting` で決めた状態。取り込み待ちは `awaiting_posts` が 1 件以上）
      3. 最後の書き込みの日時の新しい順、同じ日時は ID の連番の大きい順に並べる
      4. 行にする。`head` は最初の書き込みの本文の改行を空白にした先頭 `HEAD_CHARS` 文字、`target_title` は `target` の項目の `title`（`target` が `None` か項目が無ければ `None`。`find_item` の `ItemNotFoundError` は `None` にする）、`posts`・`unread`・`awaiting` は件数
    exceptions:
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
    unit_tests:
      - name: test_list_threads
        case: 正常
        summary: 既定はオープンだけを最後の書き込みの新しい順に
        condition: D-1 と、TH-1（オープン・D-1・最後の書き込み 01:00）・TH-2（クローズ）・TH-3（オープン・最後の書き込み 02:00・要約なし・本文が 2 行で 100 文字）
        mock: なし
        expected: '`[TH-3, TH-1]`。TH-1 の `target_title` が D-1 のタイトル。TH-3 の `summary` が `None` で `head` が改行を含まない 80 文字'
      - name: test_list_threads_when_awaiting
        case: 正常
        summary: 取り込み待ちは状態を渡さなければクローズも返す
        condition: '取り込んでいない利用者の書き込みを持つ TH-1（オープン）・TH-2（クローズ）と、取り込み済みだけの TH-3。`parametrize`: `awaiting=True` / `awaiting=True, status="open"`'
        mock: なし
        expected: TH-1・TH-2（どちらも `awaiting` が 1 以上）/ TH-1 だけ
      - name: test_list_threads_when_tag_and_unread
        case: 正常
        summary: タグと未読を両方満たすものだけ
        condition: TH-1（タグ `画面`・未読あり）・TH-2（タグ `画面`・全て既読）・TH-3（タグ `起票`・未読あり）で `tag="画面", unread=True`
        mock: なし
        expected: TH-1 だけで `unread` が未読の件数
      - name: test_list_threads_when_same_time_or_missing
        case: 正常
        summary: 同じ日時は連番の大きい順。ファイルが無ければ空。消えた項目はタイトルを None に
        condition: '`parametrize`: 最後の書き込みが同じ日時の TH-2・TH-10 / `threads.yaml` が無い / 消えた D-9 への TH-1'
        mock: なし
        expected: '`[TH-10, TH-2]` / `[]` / `target` が D-9 で `target_title` が `None`'
  - name: view_thread
    title: スレッドを読む形
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    scope: public
    summary: スレッド 1 件を『スレッドを読む』の結果の形にし、返した書き込みのうち未読の ID を添える（読むだけ。既読は `mark_read` が書く）
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース（項目のタイトルを引く）
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: スレッドの ID
      - name: unread_only
        type: bool
        required: false
        default: 'True'
        passing: keyword
        description: 未読の書き込みだけを返すか
    returns:
      type: tuple[dict[str, Any], list[str]]
      description: '`{id, status, tags, summary, target, target_title, loc, posts, events}` と、返した書き込みのうち未読の ID'
    process: |-
      1. スレッドを読み、ID で引く（無ければ `ThreadNotFoundError`）
      2. `posts` を、`unread_only` が真なら `read` が偽のものだけ、偽なら全て、書いた順に `{id, author, body, created, read, taken}` にする（`read` は読む前の値。AI の書き込みの `taken` は `None`）
      3. `events` は全ての記録を書いた順に `{kind, author, reason, created}` にする
    exceptions:
      - name: ThreadNotFoundError
        condition: その ID のスレッドが無い
        message: 'スレッドがありません: {ID}'
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
    unit_tests:
      - name: test_view_thread
        case: 正常
        summary: 未読だけか全部かを選ぶ
        condition: '既読の TH-1-1（利用者・取り込み済み）・既読の TH-1-2（AI）・未読の TH-1-3（利用者）とクローズの記録を持つ TH-1。`parametrize`: 既定 / `unread_only=False`'
        mock: なし
        expected: '`posts` が TH-1-3 だけ・未読の ID が `[TH-1-3]` / `posts` が 3 件・未読の ID が `[TH-1-3]`。どちらも `events` が 1 件で、TH-1-3 の `read` が偽'
      - name: test_view_thread_when_not_found
        case: 異常
        summary: 無い ID は読まない
        condition: TH-1 だけで `TH-9`
        mock: なし
        expected: '`ThreadNotFoundError`（メッセージに `TH-9`）'
        exception: その ID のスレッドが無い
  - name: mark_read
    title: 既読にする
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    scope: public
    summary: スレッドの渡した書き込みの `read` を真にする（鍵は呼ぶ側が取る。`taken` は書かない）
    side_effects: '`threads.yaml` を置き換える（変わるものが無ければ書かない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: スレッドの ID
      - name: post_ids
        type: list[str]
        required: true
        passing: positional
        description: 既読にする書き込みの ID
    returns:
      type: None
      description: '-'
    process: |-
      1. スレッドを読み直し、ID で引く（無ければ `ThreadNotFoundError`）
      2. `post_ids` の書き込みの `read` を真にした並びを書く（`_write_threads`）。`post_ids` に無い書き込み（鍵を取るまでに足された書き込み）は変えない
    exceptions:
      - name: ThreadNotFoundError
        condition: その ID のスレッドが無い
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_mark_read
        case: 正常
        summary: 渡した書き込みだけを既読にし、取り込み済みは変えない
        condition: 未読の TH-1-1・TH-1-2（どちらも利用者・取り込んでいない）で `[TH-1-1]`
        mock: なし

  - name: append_user_posts
    title: 利用者の書き込みのまとめた追加
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: コメントを選んで送る
    scope: public
    summary: まとめて送る書き込みを並びの順に足す。返信先を持たないものは 1 件ごとにオープンのスレッドを立て、持つものはそのスレッドの末尾に足す。同じコメントの書き込みが既にあれば足さずにそれを返す（鍵は呼ぶ側が取る。向けた項目・箇所・返信先の確かめは呼ぶ側が済ませる）
    side_effects: '`threads.yaml` を一時ファイルから 1 回で置き換える（無ければ作る。足すものが無ければ書かない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: posts
        type: list[UserPostInput]
        required: true
        passing: positional
        description: 足す書き込み（溜めた順）
      - name: now
        type: Callable[[], str]
        required: false
        default: now_utc
        passing: injected
        description: 今の日時を返す関数
    returns:
      type: tuple[str, list[SentPost]]
      description: 送った日時と、`posts` と同じ並びの足したか既にあった書き込み
    process: |-
      1. スレッドを読む（`load_threads`）
      2. 書き込みごとに、同じ `comment` を持つ書き込みが既にあればそのスレッドと書き込みの ID を使う
         - `[WARNING]` 既に送っていたコメント（コメントの ID・書き込みの ID）
      3. 無ければ足す。足す書き込みは `author: user`・`body`・`created`（この呼び出しで 1 つの日時）・`read: False`・`seen: True`・`taken: None`・`comment`
         - `thread` が `None` の場合、`TH-{連番の最大 + 1 から順}`・`status: open`・`tags: []`・`summary: None`・`target`・`loc`・`events: []` のスレッドを末尾に足し、その最初の書き込みにする
         - `thread` がある場合、そのスレッドの末尾に `{ID}-{書き込みの件数 + 1}` で足す（無ければ `ThreadNotFoundError`）
      4. 足したものがあれば書く（`_write_threads`）
    exceptions:
      - name: ThreadNotFoundError
        condition: 返信先のスレッドが無い（呼ぶ側の確かめを通さない呼び出しに備える）
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない（前の `threads.yaml` は残る）'
    unit_tests:
      - name: test_append_user_posts
        case: 正常
        summary: 新しいスレッドを立て、返信を末尾に足す
        condition: '書き込み 2 件の TH-1・TH-3 を持つワークスペース。C-1（D-1）・C-2（A-1 の本文の 2 行目）・C-3（項目を指さない）・C-4（`thread: TH-1`）。`now` は `2026-10-13T03:00:00+00:00`'
        mock: '`now`'
        expected: '`(now の値, [C-1 → TH-4・TH-4-1, C-2 → TH-5・TH-5-1, C-3 → TH-6・TH-6-1, C-4 → TH-1・TH-1-3])`。TH-4 が `open`・`tags: []`・`summary: None`・`target: D-1`、TH-5 が `loc` を持ち、TH-6 が `target`・`loc` のキーを持たない。足した書き込みはどれも `author: user`・`read: False`・`seen: True`・`taken: None`・`comment` が元のコメントの ID'
      - name: test_append_user_posts_when_first
        case: 正常
        summary: ファイルが無ければ作って TH-1
        condition: '`threads.yaml` が無いワークスペース、C-1'
        mock: '`now`'
        expected: '`[C-1 → TH-1・TH-1-1]` で、`threads.yaml` ができている'
      - name: test_append_user_posts_when_already_sent
        case: 正常
        summary: 既に送ったコメントは足さずにその書き込みを返す
        condition: '`comment: C-1` の書き込み TH-1-1 を持つワークスペース、C-1・C-2'
        mock: '`now`'
        expected: '`[C-1 → TH-1・TH-1-1, C-2 → TH-2・TH-2-1]`。スレッドが 2 件で、TH-1 の書き込みが 1 件のまま'
      - name: test_append_user_posts_when_write_fails
        case: 異常
        summary: 置き換えに失敗したら前のスレッドを残す
        condition: TH-1 を持つワークスペース、C-1。`os.replace` を `OSError` を送る関数に差し替える
        mock: '`os.replace`（`threads` モジュールの参照を monkeypatch）'
        expected: '`WriteFailedError`。`threads.yaml` が呼ぶ前と同じ'
        exception: 置き換えで OSError
  - name: threads_for_preview
    title: 画面へ返すスレッド
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    scope: public
    summary: 全てのスレッドを『スレッドの読み取り』の本文の形にする（読むだけ。AI の既読と取り込み済みは含めず、利用者の既読は含める）
    args:
      - name: workspace
        type: Workspace
        required: true
        passing: positional
        description: ワークスペース（項目のタイトルを引く）
    returns:
      type: dict[str, Any]
      description: '`{threads: [{id, status, tags, summary, target, target_title, loc, posts: [{id, author, body, created, seen}], events: [{kind, author, reason, created}]}]}`'
    process: |-
      1. スレッドを読み、最後の書き込みの日時の新しい順（同じ日時は ID の連番の大きい順）に並べる
      2. `target_title` を付ける（`list_threads` と同じ引き方）
    exceptions:
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
    unit_tests:
      - name: test_threads_for_preview
        case: 正常
        summary: クローズも含めて返し、既読と取り込み済みを含めない
        condition: D-1 と、TH-1（オープン・D-1・最後の書き込み 01:00）・TH-2（クローズ・消えた D-9・最後の書き込み 02:00・クローズの記録）
        mock: なし
        expected: '`threads` が TH-2・TH-1 の順。TH-1 の `target_title` が D-1 のタイトル、TH-2 は `None` で `events` が 1 件。どの書き込みにも `read`・`taken`・`comment` のキーが無い。どの書き込みも `seen` を持つ'
      - name: test_threads_for_preview_when_missing
        case: 正常
        summary: ファイルが無ければ空
        condition: '`threads.yaml` が無いワークスペース'
        mock: なし
        expected: '`{threads: []}`'
  - name: reset_unread
    title: 未読へ戻す
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    scope: public
    summary: 全てのスレッドの書き込みの `read` を偽にする。`seen`（利用者の既読）・`taken`・状態・要約・タグ・状態の記録は変えない（鍵は呼ぶ側が取る）
    side_effects: '`threads.yaml` を置き換える（既に全て未読なら書かない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: int
      description: 未読に戻した書き込みの件数
    process: |-
      1. スレッドを読み、`read` が真の書き込みを数える
         - 0 件の場合、書かずに 0 を返す
      2. 全ての書き込みの `read` を偽にして書き（`_write_threads`）、数えた件数を返す
    exceptions:
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_reset_unread
        case: 正常
        summary: 既読を全て未読に戻し、ほかは変えない
        condition: 既読 3 件（1 件は取り込み済み）と未読 1 件を持つ TH-1（クローズ・要約とタグあり）
        mock: なし
        expected: 3。全ての書き込みの `read` が偽で、`seen`・`taken`・`status`・`summary`・`tags`・`events` が呼ぶ前と同じ
      - name: test_reset_unread_when_nothing
        case: 正常
        summary: 全て未読かファイルが無ければ書かない
        condition: '`parametrize`: 未読だけの TH-1 / `threads.yaml` が無い'
        mock: なし
        expected: 0。前者は `threads.yaml` の更新日時が呼ぶ前と同じ、後者は `threads.yaml` ができない
  - name: _take_read
    title: 既読の書き込みを取り込み済みにする
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 送信の取り込み
    scope: internal
    summary: スレッドの、AI が既読にした取り込んでいない利用者の書き込みの `taken` に日時を入れたスレッドと、その書き込みの ID を返す（単体テストは `reply_thread`・`update_thread` が持つ）
    args:
      - name: thread
        type: Thread
        required: true
        passing: positional
        description: スレッド
      - name: at
        type: str
        required: true
        passing: positional
        description: 取り込んだ日時
    returns:
      type: tuple[Thread, list[str]]
      description: 書き換えたスレッドと、取り込み済みにした書き込みの ID（書いた順）
    process: 1. `author` が `user`・`read` が真・`taken` が `None` の書き込みの `taken` を `at` にする。未読の書き込みは取り込み待ちに残す
  - name: _check_text
    title: 文の確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    scope: internal
    summary: 本文・要約が文字列で、前後の空白を除いて 1 文字以上・上限以下かを確かめ、空白を除いた文を返す（単体テストは呼ぶ側の `_when_rejected`・`_when_boundary` が持つ）
    args:
      - name: argument
        type: str
        required: true
        passing: positional
        description: 引数の名前（`body`・`summary`）
      - name: value
        type: Any
        required: true
        passing: positional
        description: 渡された値
      - name: max_chars
        type: int
        required: true
        passing: positional
        description: 上限（`MAX_BODY_CHARS`・`MAX_SUMMARY_CHARS`）
    returns:
      type: str
      description: 前後の空白を除いた文
    exceptions:
      - name: ArgumentError
        condition: 文字列でない・空白だけ・上限を超える
        message: '引数の誤り: {引数の名前}: {理由}'
  - name: _check_tags
    title: タグの確かめ
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: 共通
    scope: internal
    summary: タグが文字列の並びで、重なりと空の文字列を持たないかを確かめる（単体テストは呼ぶ側の `_when_rejected` が持つ）
    args:
      - name: tags
        type: Any
        required: true
        passing: positional
        description: 渡された値
    returns:
      type: list[str]
      description: 渡された並びのままのタグ
    exceptions:
      - name: ArgumentError
        condition: 文字列の並びでない・重なりがある・空の文字列を含む
        message: '引数の誤り: tags: {理由}'
  - name: raw_thread_targets
    title: 崩れたスレッドの向けた項目
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: ワークスペースの点検
    scope: public
    summary: スキーマに合わない `threads.yaml` から、項目を指すスレッドを読める範囲で拾う
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
    returns:
      type: list[tuple[str, str, bool]]
      description: スレッドの（ID・向けた項目・取り込み待ちか）の並び
    process: |-
      1. `threads.yaml` を `yaml.safe_load` で読む。読めないか、`items` が配列でなければ空を返す
      2. `id` と `target` が文字列の要素だけを、`posts` に取り込んでいない利用者の書き込み（`author` が `user` で `taken` が無い）を持つかを添えて並べる
    unit_tests:
      - name: test_raw_thread_targets
        case: 正常
        summary: ID と向けた項目が文字列のスレッドだけを、取り込み待ちかを添えて拾う
        condition: スキーマに合わない `threads.yaml`（取り込み待ちのスレッド・取り込み済みのスレッド・`target` が文字列でない要素）
        mock: なし
        expected: 文字列の `id`・`target` を持つ要素だけが、取り込み待ちかを添えて並ぶ
      - name: test_raw_thread_targets_when_unreadable
        case: 正常
        summary: 読めない・スレッドの並びでないファイルは拾えるものが無い
        condition: '`parametrize`: YAML として読めない中身 / `items` が配列でない中身'
        mock: なし
        expected: 空の並び
  - name: mark_seen
    title: 利用者の既読にする
    kind: 関数
    container: plugins/mindstella/skills/mindmap/scripts/threads.py
    usecase: スレッドで話す
    scope: public
    summary: スレッドの `seen` が偽の書き込みを全て真にする（鍵は呼ぶ側が取る。`read`・`taken`・状態・要約・タグ・状態の記録は変えない）。`mark_read` と違い ID を受け取らず、鍵を取るまでに足された書き込みも既読にする
    side_effects: '`threads.yaml` を置き換える（未読が無ければ書かない）'
    args:
      - name: root
        type: Path
        required: true
        passing: positional
        description: ワークスペース
      - name: thread_id
        type: str
        required: true
        passing: positional
        description: スレッドの ID
    returns:
      type: list[str]
      description: 利用者の既読にした書き込みの ID（書いた順）。未読が無ければ空
    process: |-
      1. スレッドを読み、ID で引く（無ければ `ThreadNotFoundError`）
      2. `seen` が偽の書き込みを集める
         - 0 件の場合、書かずに空を返す
      3. その書き込みの `seen` を真にした並びを書き（`_write_threads`）、ID を返す
         - `[INFO]` 利用者の既読にした（スレッドの ID・件数）
    exceptions:
      - name: ThreadNotFoundError
        condition: その ID のスレッドが無い
      - name: SchemaMismatchError
        condition: '`load_threads` が送るもの'
      - name: WriteFailedError
        condition: '`threads.yaml` を書けない'
    unit_tests:
      - name: test_mark_seen
        case: 正常
        summary: 未読を全て既読にし、ほかは変えない
        condition: '利用者の TH-1-1（`seen: True`・取り込み済み）と AI の TH-1-2・TH-1-3（どちらも `seen: False`）を持つクローズの TH-1、未読を持つ TH-2 で `TH-1`'
        mock: なし
        expected: '`[TH-1-2, TH-1-3]`。TH-1 の全ての書き込みの `seen` が真で、`read`・`taken`・`status`・`summary`・`tags`・`events` と TH-2 が呼ぶ前と同じ'
      - name: test_mark_seen_when_nothing_unseen
        case: 正常
        summary: 未読が無ければ書かない
        condition: '全て `seen: True` の TH-1 で `TH-1`'
        mock: なし
        expected: '`[]`。`threads.yaml` の更新日時が呼ぶ前と同じ'
      - name: test_mark_seen_when_thread_not_found
        case: 異常
        summary: 無いスレッドは書かない
        condition: TH-1 だけを持つワークスペースで `TH-9`
        mock: なし
        expected: '`ThreadNotFoundError`。`threads.yaml` が呼ぶ前と同じ'
        exception: 無い ID
test_files:
  - tests/unit/scripts/test_threads.py

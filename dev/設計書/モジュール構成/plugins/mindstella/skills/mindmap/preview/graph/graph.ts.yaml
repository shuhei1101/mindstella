id: MOD-489-213
title: プレビュー / 画面と部品 / graph.ts
test_files:
  - tests/unit/preview/test_graph.py
functions:
  - name: buildGraph
    title: ネットワークの玉と線
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    scope: public
    summary: 渡した ID の項目を玉に、その間の関連（依存・関連・根拠・進めるタスク）を線にして返す
    args:
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
      - name: shownIds
        type: Set<string>
        required: true
        passing: keyword
        description: 絞り込みの条件に合う項目の ID
    returns:
      type: '{nodes: {id, kind}[], links: {source, target, type}[]}'
      description: '`type` は `depends`・`related`・`source`・`for`。両端のどちらかが非表示か記録に無い線は含めない'
    unit_tests:
      - name: test_build_graph
        case: 正常
        summary: 線の種類を分け、渡していない項目の線を落とす
        condition: 'D-2（`depends_on: [D-1]`、`sources: [R-1]`）・T-1（`for: [D-1]`）・N-1（`related: [D-1]`）。`shownIds` から N-1 を外す'
        mock: なし
        expected: 線が `depends`（D-2→D-1）・`source`（D-2→R-1）・`for`（T-1→D-1）の 3 本で、N-1 とその線が無い
  - name: graphConditions
    title: ネットワークの条件
    kind: 関数
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    scope: public
    summary: ネットワークで絞る条件（種類・状態・タグ）の定義を返す
    returns:
      type: '{key, label, get, order?}[]'
      description: '`type`（項目の種類の名前。検討事項・タスク・調査・資料・用語集・メモ・会話ログの順）・`status`（検討事項・タスク・資料の状態の順。状態を持たない項目は値無し）・`tags`（`tagNames` の名前）。`get` は索引の項目（`{kind, item}`）から値を取る'
    unit_tests:
      - name: test_graph_conditions
        case: 正常
        summary: 種類・状態・タグの値を取る
        condition: '未決定・タグ `[{name: a, main: true}]` の D-1 と、タグの無い N-1'
        mock: なし
        expected: D-1 は `検討事項`・`未決定`・`[a]`、N-1 は `メモ`・状態無し・`[]`
  - name: setGraphComments
    title: ネットワークのコメントの件数の差し替え
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: コメントを選んで送る
    kind: 関数
    scope: public
    summary: 描いているネットワークの、名前の横の印に使う件数を差し替える。玉と線と視点は作り直さず、次のコマから新しい件数で印を置く。ネットワークを描いていないときは何もしない
    args:
      - name: counts
        type: Record<string, number>
        required: true
        passing: positional
        description: 項目の ID → 件数（入口の `commentCounts`）
    returns:
      type: void
      description: なし
  - name: setGraphLook
    title: ネットワークの見た目の差し替え
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 描いているネットワークの見た目を差し替える。キャンバスの入れ物の `data-look` とドロップダウンの値を変え、玉・線・視点・選んだ項目・ロックは作り直さず、次のコマからその見た目で描く。ネットワークを描いていないときは何もしない
    args:
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        passing: positional
        description: 当てる見た目
    returns:
      type: void
      description: なし
  - name: shakeGraphKey
    title: ネットワークの鍵の震え
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 描いているネットワークの閉じた鍵を震わせる（`L` キーで `shake` になったときに入口が呼ぶ。玉や余白を押したときは画面の中で同じ処理をする）。震えの始まりを今にし、毎コマ `shakeAt` の量で鍵を左右へずらし、上を軸に傾け、大きくして赤く光らせる（色はライトで `--red-700`、ダークで `--red-300`）。CSS のアニメーションを使わないので `prefers-reduced-motion` でも止まらない。ネットワークを描いていないときは何もしない
    args: []
    returns:
      type: void
      description: なし
  - name: shownGraphIds
    title: ネットワークが描く項目
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: '`graphConditions` の条件と `filters` で `filterRows` を通る項目の ID を返す。入口が、ロックした項目を描いているか（効いているロック）の判定に使う。単体テストは持たず、画面設計『ネットワーク』の結合テストが確かめる'
    args:
      - name: index
        type: RecordIndex
        required: true
        passing: keyword
        description: 索引
      - name: filters
        type: Record<string, string[]>
        required: true
        passing: keyword
        description: ネットワークの絞り込みの条件
    returns:
      type: Set<string>
      description: 描く項目の ID
  - name: setGraphLock
    title: ネットワークのロックの差し替え
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    kind: 関数
    scope: public
    summary: 描いているネットワークの効いているロックを差し替える。玉・線・視点は作り直さず、中心と強調を新しい注目の起点へ寄せる。ネットワークを描いていないときは何もしない
    args:
      - name: id
        type: string | null
        required: true
        passing: positional
        description: 効いているロック（無ければ `null`）
    returns:
      type: void
      description: なし
components:
  - name: graphScreen
    title: ネットワーク
    container: plugins/mindstella/skills/mindmap/preview/graph/graph.ts
    usecase: ネットワークを辿る
    kind: 画面
    summary: '画面設計『ネットワーク』をキャンバスに描く。`graphConditions` の条件と `filters` で項目を絞り（`filterRows`）、玉と線はその ID で作った `buildGraph`。種類の帯は出さない。毎コマ、玉と線の画面の位置・大きさ・濃さを求めて `LookFrame` にまとめ、`drawLook` で `look` の見た目に描かせてから（`reducedMotion` には毎コマ `matchMedia("(prefers-reduced-motion: reduce)")` の結果を入れる。真のときは、操作が止まった後の自動の回転もしない。鍵の震えは止めない）、名前（玉ごとに一度だけ画像にした文字を倍率をかけて置く。PoC の `opt-each-bitmap`。色は `lookLabelColor`）・状態の印・鍵を重ねる。画面の外は描かない。条件が変わったら玉と線を作り直し、見た目が変わっても作り直さない（`setGraphLook`）。条件に合う項目が 1 件も無いときは、枠の中央に空の旨を出す。キャンバスの上に `filterChips` を、右上に見た目のドロップダウン（`select`。`NETWORK_LOOKS` の順に名前を並べ、`defaultLook` の名前に「（既定）」を添える。読み上げの名前は「ネットワークの見た目」）を描く。`drawerOpen` のときは `drawerGroups` で組んだ `filterDrawer` を描く。注目の起点は `lockedId`、無ければ `selectedId` で、起点へ寄り、起点とつながる玉を強調して線に光を流す。注目の起点があるときだけ、起点とつながる玉の名前の左に状態の印（`statusMark` の SVG か、資料の成果物は `icon("box")` を、状態・成果物・ライト / ダークごとに一度だけ絵にしたもの）を、名前の文字の高さの 8 割で名前と同じ遠近・濃さで描く。鍵は名前の右（名前が 8px 未満なら玉の右上の札の中）に 24 の枠の線画で描き、閉じた鍵は `lockedId` の玉に、開いた鍵はロックしていないときに `selectedId` の玉へカーソルを乗せている間だけ出す。鍵を出す玉は、コメントの印を鍵の右へずらす。玉か余白を押したら、`resolvePress` で 2 回押しを読み替えた項目（余白は `null`）で `on.lock` を呼び、`shake` が返ったら鍵を震わせる（`shakeAt` の量を毎コマ当てる。震えている間に描き直しても始まりの時刻を保つ）。幅 900px 以下では `on.lock` を呼ばず、押した玉の項目を `on.open` で開き、鍵を出さない。キャンバスの読み上げの説明に「L キーで、詳細を開いている項目をロック・解除」を添える'
    props:
      - name: index
        type: RecordIndex
        required: true
        description: 索引
      - name: on
        type: '{open, filter, closeDrawer, lock, look}'
        required: true
        description: 玉を押して項目を開く（幅 900px 以下）・条件を変える（新しい `filters`）・ドロワーを閉じる・玉か余白を押した（押した項目の ID か `null`。入口が `lockTap` で判定し、`LockAction` を返す）・見た目のドロップダウンで選んだ（見た目の値）
      - name: filters
        type: Record<string, string[]>
        required: true
        description: 絞り込みの条件（入口の `FilterState` のネットワークの分）
      - name: drawerOpen
        type: boolean
        required: true
        description: 絞り込みのドロワーを開いているか
      - name: look
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        description: 今当てているネットワークの見た目（`resolveDisplay`）。キャンバスの入れ物の `data-look` に入れて `drawLook` に渡し、見た目のドロップダウンで選んでいる値にする
      - name: comments
        type: Record<string, number>
        required: false
        default: なし（印を出さない）
        description: 項目の ID → レビュー中のコメントの件数（入口の `commentCounts`。描いている間は `setGraphComments` で差し替える）。毎コマ、名前を文字 8px 以上で描いた玉のうち件数のある玉に、名前の右端に続けて縦は名前の中央に `commentMark` を置く（キャンバスの上に重ねる層。重なり順は層の中に閉じ、手前の玉ほど上、濃さは名前と同じ）。名前と印が描く枠に収まらない玉と、名前が 8px 未満の玉には置かない
      - name: defaultLook
        type: "'glow' | 'starlight' | 'constellation' | 'deep' | 'dust'"
        required: true
        description: ワークスペースの既定の見た目（`resolveDisplay`）。見た目のドロップダウンで、この見た目の名前に「（既定）」を添える
      - name: selectedId
        type: string | null
        required: true
        description: 詳細パネルで開いている項目（`Route.id`）。ロックしていなければ注目の起点にする
      - name: lockedId
        type: string | null
        required: true
        description: 効いているロック（入口の `LockState.graph` の項目を描いていればその ID、絞り込みで描いていなければ `null`）。注目の起点にし、閉じた鍵を出す
    state:
      - name: camera
        type: '{yaw, pitch, distance, target}'
        initial: 全体が収まる向きと距離
        description: 視点
      - name: labelCache
        type: Map<string, HTMLCanvasElement>
        initial: 空
        description: 玉・太さ・色ごとに描いた文字の画像
      - name: lastPress
        type: '{time, x, y, id} | null'
        initial: 'null'
        description: 前に押した時刻・位置・項目（`resolvePress` に渡す。押すたびに置き換える）
      - name: shakeStart
        type: number
        initial: -Infinity
        description: 鍵が震え始めた時刻（`SHAKE_MS` を過ぎたら震えを当てない）
      - name: markCache
        type: Map<string, HTMLImageElement>
        initial: 空
        description: 状態・成果物・ライト / ダークごとに絵にした状態の印

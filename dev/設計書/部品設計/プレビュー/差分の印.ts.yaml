title: "差分の印"
implementation: "plugins/mindstella/skills/mindmap/preview/components/diff-mark.ts#MindmapPreview.diffMark"
story: "Preview/DiffMark"
states:
  - name: New
    description: 新規。丸や枠で囲まず太い + だけ
    args:
      - name: kind
        value: new
  - name: Changed
    description: 変更。丸や枠で囲まず塗った ● だけ。決定済みの状態の印とは色で分かれる
    args:
      - name: kind
        value: changed
  - name: NewLabeled
    description: 詳細パネルの題の横の新規の札
    args:
      - name: kind
        value: new
      - name: labeled
        value: 'true'
lead: 差分の表示の間、選んだ時点で足した項目に新規（太い +）、変えた項目に変更（塗った ●）の印を出す。表・ボード・カード・マップ・概要のタイルでは記号だけ、詳細パネルの題の横では文言つきの札にする。
args:
  - name: kind
    type: 列挙
    required: true
    choices: new・changed
    description: 新規か変更か。色だけでなく形（+ と ●）でも分ける
    status: planned
  - name: labeled
    type: 真偽値
    required: false
    default: 'false'
    description: 真のとき記号に文言（「新規」「変更」）を付けた札にする。詳細パネルの題の横だけが使う
    status: planned
accessibility:
  - 記号は `aria-hidden` にし、「新規」「変更」を読み上げにだけ残す文字と `title` を持つ
  - 色だけに頼らず、新規と変更を記号の形でも分ける

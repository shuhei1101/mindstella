title: "本文の印のツールチップ"
implementation: "plugins/mindstella/skills/mindmap/preview/components/term-tip.ts#MindmapPreview.termTip"
story: "Preview/TermTip"
states:
  - name: TermOnly
    description: 用語だけに一致した印。今と同じく用語・ID・意味だけを出し、リンクを持たない
  - name: Few
    description: 用語・資料・調査に 1 件ずつ一致した印。種類ごとの見出しと区切り線で分け、全てのタイトルがリンクになる
  - name: DocOnly
    description: 資料 1 件だけに一致した印。「資料 1」の見出しの下に 1 件
  - name: NoDescription
    description: 説明を持たない資料。タイトルと ID だけを出す
  - name: Many
    description: 用語 1・資料 6・調査 1 に一致した印。最大の高さ（360px）で止まり、中をスクロールして末尾の調査まで読める
  - name: Below
    description: 印の上に収まらない。印の下に出す
  - name: Shrunk
    description: 上下どちらにも収まらない。広い側（上）に出してその高さに縮め、下端を印に留める
    notes:
      見せ方: Storybook の画面の高さを 520px にして見せる
  - name: LinkFocus
    description: 印から Tab で中の最初のリンクへ移った。印の色の輪でフォーカスを示す
    notes:
      見せ方: ストーリーの play で印にフォーカスして Tab を押す
  - name: LongNarrow
    description: 長いタイトル・説明を幅 390px で出す。折り返し、画面の端から 8px の内側に収める
    notes:
      見せ方: Storybook の画面幅を 390px にする
lead: 詳細パネルと詳細の全画面で、本文の印（用語のタイトル・資料と調査のエイリアスに一致した語）に乗せる・フォーカスすると、印の上に出すツールチップ。一致した項目を用語 → 資料 → 調査の順に並べ、資料・調査の詳細へ移るリンクを持つ。
status: planned
args:
  - name: entries
    type: オブジェクトの配列
    required: true
    description: 印の語に一致した項目（`{kind, item}`。`kind` は `terms`・`docs`・`research`）を、用語 → 資料 → 調査の順に並べたもの。開いている項目自身と、取り下げた資料・調査は使う側が除いて渡す。用語だけのときは用語・ID・意味だけを出し、資料・調査を 1 件でも含むときは種類ごとの見出し（種類名と件数）と区切り線で分け、全ての項目のタイトルを詳細へのリンクにする。資料・調査はタイトル・ID・説明（無ければ出さない）を出す
  - name: anchor
    type: オブジェクト
    required: true
    description: 印の画面上の矩形（`getBoundingClientRect()`）。印の上に 6px 空け、下端を印に留めて出す。上に収まらなければ印の下に出し、上下どちらにも収まらなければ広い側に出してその高さに縮める。左右は画面の端から 8px の内側に収める
  - name: pinned
    type: 真偽値
    required: false
    default: 'false'
    description: 押して残した状態か。真のときは印からポインターが外れても閉じず、外を押すか Esc で閉じる
events:
  - name: 項目へ移る
    when: 中の項目のリンクを押したときと、フォーカスして Enter を押したとき
    value: リンクの `data-id` の項目の ID
    description: 使う側がツールチップを閉じ、その項目の詳細へ移って履歴に積む
  - name: 閉じる
    when: Esc を押したとき、押して残した状態で外を押したとき、中からフォーカスが印でもツールチップでもない所へ出たとき
    description: 使う側がツールチップを閉じる。中にフォーカスがあったときの Esc は、フォーカスを印へ戻し、詳細の全画面の Esc（元の大きさに戻す）を起こさない
accessibility:
  - 用語だけに一致した印のツールチップは、今と同じく `role="tooltip"` にし、印の `aria-describedby` で指す
  - 資料・調査を含むツールチップは中にリンクを持つため `role="tooltip"` を付けず、印の `aria-details` で指す
  - 種類ごとの並びはリストにし、見出し（種類名と件数）で名前を付ける
  - 資料・調査を含む印から Tab で中の最初のリンクへ移れ、最後のリンクの次は本文の印の次の要素へ、最初のリンクの Shift+Tab は印へ戻る。Esc で閉じる
  - リンクのフォーカスは印の色の輪で、ホバーと見分ける
  - 印からツールチップへポインターを動かす間（150 ミリ秒）は閉じない

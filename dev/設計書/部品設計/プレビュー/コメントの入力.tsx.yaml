title: コメントの入力
implementation: frontend/src/shared/components/send-form.tsx#SendForm
story: Shared/SendForm
states:
  - name: Idle
    description: 入力欄が空。本文と線で区切って下端に置き、ラベル「{ID} へのコメント」を常に見せる。「レビューに追加」は入力欄の右に置くアイコンだけのボタン（吹き出し）にし、結果が無い間は入力欄の下に行を取らない
    args:
      - name: target
        value: D-022
  - name: Typing
    description: 入力中。入力欄に印の色の輪
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
  - name: WithBodyLocation
    description: 本文の箇所を添えた。入力欄の上に「本文 3 行目」と選んだ文を出し、× で外せる
    args:
      - name: target
        value: A-005
      - name: loc
        value: '{kind: body, start: 3, end: 3, text: 受け取る人へ渡す形}'
  - name: WithValueLocation
    description: 値の箇所を添えた。箇所の名前にキーの名前を出し、選んだ文は 3 行までにして末尾を省く
    args:
      - name: target
        value: D-022
      - name: loc
        value: '{kind: value, key: options[C].cons, text: 表の密度が下がる。表の列を詰めて並べるため、1 行に出せる項目の数が減り、ID と状態の列が画面の外へ押し出される。狭い幅では横に送らないと読めない列が増え、比べるのに手間がかかる}'
      - name: body
        value: ここは別の言い方にしたい
  - name: Saving
    description: 溜めている。入力欄を書き換えられなくし、ボタンを押せなくして面を沈める。1 秒を超えたら回る印と「レビューに追加しています」を出す
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
      - name: status
        value: saving
  - name: Saved
    description: 溜めた。入力欄を空にし、「レビューに追加しました（レビュー中 3 件）。」を出す。入力を始めたら消す
    args:
      - name: target
        value: D-022
      - name: status
        value: saved
      - name: count
        value: '3'
  - name: Empty
    description: 本文が空で溜めようとした。入力欄の枠の全体と印を要見直しの赤（`--st-review`）、「コメントを入れてから追加してください。」を本文の文字色で出す。ボタンは押せるまま
    args:
      - name: target
        value: D-022
      - name: status
        value: empty
  - name: FailedUnreachable
    description: サーバーに届かなかった。本文を残し、「レビューに追加できませんでした。サーバーが止まっています。起動スクリプトで立ち上げ直し、示された新しい URL で開いてから追加してください。」と、コピーのアイコンだけのボタン（読み上げの名前とツールチップは「本文をコピー」）を出す
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
      - name: status
        value: failed
  - name: FailedDetail
    description: サーバーが溜めなかった理由を返した。本文を残し、「レビューに追加できませんでした。{理由}」を出す（本文のコピーのボタンは出さない）
    args:
      - name: target
        value: A-005
      - name: body
        value: ここは言い換える
      - name: status
        value: failed
      - name: detail
        value: 選んだ文が本文の 3 行目にありません
  - name: Long
    description: 長文。8 行を超えたら入力欄の中を送る。「レビューに追加」は入力欄の下端に合わせる
    args:
      - name: target
        value: D-022
      - name: body
        value: |-
          案 A にする。
          理由: 読み返す画面なので、表と数値を長く読んでも疲れない無彩色の骨格がよい。
          印の色は 1 色に絞る。
          状態の色は状態の表示だけに使う。
          B のカード中心は一覧が長くなると縦に伸びる。
          C のダークは明暗の切り替えで足りる。
          トップバーは暗い帯にしておきたい。
          ID の等幅は残す。
          以上。
  - name: NoTarget
    description: 項目を指さないコメント（コメントの一覧の新しいスレッドの入力）。見出しを出さず、入力欄と右の「レビューに追加」だけにする。名前「項目を指さないコメント」は読み上げにだけ持つ
  - name: Narrow
    description: 幅 390px。左右の余白をパネルの本文に揃える。部品の幅によらず入力欄と「レビューに追加」を 1 行に並べ、結果は入力欄の下に幅いっぱいで出す
    args:
      - name: target
        value: A-005
      - name: loc
        value: '{kind: body, start: 3, end: 3, text: 受け取る人へ渡す形}'
      - name: body
        value: 案 A にする
      - name: status
        value: failed
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる。320px でも結果の文言は折り返し、ボタンの幅は保つ
  - name: NoTargetCollapsed
    description: 項目を指さないコメントを畳んだ形。読み上げのラベルと 1 行の入力欄だけを出す
    args:
      - name: collapsed
        value: 'true'
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる
  - name: NoTargetExpanded
    description: 項目を指さないコメントを狭い幅で広げた形。入力欄と「レビューに追加」を出す
    args:
      - name: collapsed
        value: 'false'
      - name: body
        value: 全体に目を通した
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる
  - name: Closed
    description: 閉じた。「{ID} へのコメント」の 1 行と、右端の ^ の開閉のボタン（コメントの入力を開く）だけを出す。入力欄・添えた箇所・結果・「レビューに追加」は出さない
    args:
      - name: target
        value: D-022
      - name: open
        value: 'false'
  - name: ClosedWithDraft
    description: 書きかけを残して閉じた。「{ID} へのコメント」の右に鉛筆の印と「書きかけ」を出す
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
      - name: open
        value: 'false'
  - name: Recording
    description: 録音中。マイクと「レビューに追加」の位置に × の「キャンセル」（枠だけ）と ✓ の「文字起こし」（塗り）を置き、結果の行に失敗の色の丸と経過の時間だけを出す（丸は点滅させない）
    args:
      - name: target
        value: D-022
      - name: voice
        value: recording
      - name: elapsed
        value: '12'
  - name: Transcribing
    description: 文字起こし中。2 つのボタンを押せなくし、✓ の位置と結果の行に回る印だけを出す。入力欄は読み取りだけ
    args:
      - name: target
        value: D-022
      - name: voice
        value: transcribing
      - name: body
        value: '確認: '
  - name: RecordingWithDraft
    description: '打ちかけがある録音中。入力欄の「確認: 」とカーソルの位置を残し、文字起こしの結果はカーソルの位置へ挿入する'
    args:
      - name: target
        value: D-022
      - name: voice
        value: recording
      - name: elapsed
        value: '12'
      - name: body
        value: '確認: '
  - name: Sent
    description: 送信した。入力欄を空にし、元のボタンに戻して「送信し、Claude Code へ入力しました。」
    args:
      - name: target
        value: D-022
      - name: status
        value: sent
      - name: entered
        value: 'true'
  - name: SentNotEntered
    description: 送信したが Claude Code へ入力しなかった。「送信しました。Claude Code へは入力していません。」
    args:
      - name: target
        value: D-022
      - name: status
        value: sent
      - name: entered
        value: 'false'
  - name: Inserted
    description: 入力欄へ挿入した。カーソルは挿入した文字の後ろで、「文字起こしの結果を挿入しました。」
    args:
      - name: target
        value: D-022
      - name: status
        value: inserted
      - name: body
        value: '確認: 案 A にする'
  - name: VoiceDisabled
    description: 文字起こしのサービスが起動していない。マイクのボタンを押せない見た目にし、ホバーとフォーカスで理由のツールチップを出す。「レビューに追加」は押せるまま
    args:
      - name: target
        value: D-022
      - name: voice
        value: disabled
      - name: voiceReason
        value: 文字起こしのサービスが起動していないため、音声で入力できません。
  - name: VoiceUnsupported
    description: 文字起こしのサービスが音声の受け付けに対応していない。押せない理由のツールチップ
    args:
      - name: target
        value: D-022
      - name: voice
        value: disabled
      - name: voiceReason
        value: 文字起こしのサービスが音声の受け付けに対応していないため、音声で入力できません。
  - name: VoiceNoMicrophone
    description: ブラウザがマイクを使えない（HTTPS でない経路から外の端末で開いた）。押せない理由のツールチップ
    args:
      - name: target
        value: D-022
      - name: voice
        value: disabled
      - name: voiceReason
        value: このページではマイクを使用できません。HTTPS か localhost の URL で開いてください。
  - name: VoiceFailed
    description: 文字起こしに失敗した。入力欄の中身を残し、元のボタンに戻して理由を結果の行に出す
    args:
      - name: target
        value: D-022
      - name: status
        value: voice-failed
      - name: detail
        value: 文字起こしできませんでした。もう一度お試しください。
      - name: body
        value: 案 B も見たい
  - name: VoiceDenied
    description: マイクの許可を拒否した。録音を始めず、許可が要ることを結果の行に出す
    args:
      - name: target
        value: D-022
      - name: status
        value: voice-failed
      - name: detail
        value: マイクを使用できませんでした。ブラウザの設定でこのページのマイクを許可してください。
  - name: RecordingNarrow
    description: 最も狭い幅（320px）の録音中。2 つのボタンはマイクと「レビューに追加」と同じ大きさで、入力欄の右に並んだまま収まる
    args:
      - name: target
        value: D-022
      - name: voice
        value: recording
      - name: elapsed
        value: '12'
  - name: VoiceSendFailed
    description: 文字起こしはできたが送信できなかった。挿入した全文を入力欄に残す
    args:
      - name: target
        value: D-022
      - name: status
        value: voice-failed
      - name: detail
        value: 送信できませんでした。文字起こしの結果は入力欄に残しています。
      - name: body
        value: '確認: 案 A にする'
lead: 詳細パネル・詳細の全画面の下端と、コメントの一覧の新しいスレッドの入力に置く、コメントをレビュー中に溜める入力欄と「レビューに追加」のボタン。選んだ箇所を添えられ、溜めた結果を入力の近くに出す。
test_file: tests/integration/storybook_react/test_send_form_stories.py
args:
  - name: target
    type: 文字列
    required: false
    default: なし（項目を指さないコメント）
    description: コメントを向ける項目の ID。ラベル「{ID} へのコメント」に等幅で出す。無いときはラベルを見せず、読み上げの名前「項目を指さないコメント」だけを持つ
  - name: loc
    type: オブジェクト
    required: false
    default: なし（箇所を添えない）
    enabled_when: '`target` があるとき'
    description: 添えた箇所（『レビュー中のコメントの追加』の `loc`）。入力欄の上に箇所の名前（本文は「本文 {行} 行目」、行の範囲は「本文 {始め}〜{終わり} 行目」、値はキーの名前（例 「案 C のデメリット」）。部品が `loc` から作る）と選んだ文を 3 行まで出し（超えたら末尾を省く）、外す × を添える
  - name: body
    type: 文字列
    required: false
    default: '""'
    description: 入力欄の中身。1 行から始まり、中身に合わせて 8 行まで伸び、それより長いと入力欄の中を送る
  - name: status
    type: 列挙
    required: false
    default: idle
    choices: idle・saving・saved・empty・failed・sent・inserted・voice-failed
    description: 溜める状態。idle は結果を出さない。saving はボタンを押せなくし入力欄を書き換えられなくする。sent は送信した結果、inserted は入力欄へ挿入した結果、voice-failed は音声入力の失敗の理由（`detail`）を出す。empty・failed は入力欄の中身を残す
  - name: count
    type: 整数
    required: false
    choices: 1 以上
    enabled_when: '`status` が `saved` のとき'
    description: 溜めた後のレビュー中のコメントの件数（『レビュー中のコメントの追加』の `count`）。「レビューに追加しました（レビュー中 {件数} 件）。」と出す
  - name: detail
    type: 文字列
    required: false
    default: なし（サーバーに届かなかった）
    enabled_when: '`status` が `failed` のとき'
    description: サーバーが返した溜められなかった理由（`detail`）。無ければ、サーバーが止まっているので起動スクリプトで立ち上げ直して新しい URL で開くよう出し、本文をコピーするアイコンだけのボタンを添える
  - name: collapsed
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`target` が無いとき'
    description: 畳んだ形にするか。畳むと余白を詰め、読み上げのラベルと 1 行の入力欄だけを出す（入力欄は伸ばさず、結果と「レビューに追加」を出さない）。畳むかは使う側が決める
  - name: label
    type: 文字列
    default: 項目を指さないコメント
    enabled_when: '`target` が無いとき'
    description: 入力欄の読み上げの名前（`aria-label`）。使う側が見出しを出すときは、その見出しと同じ文言を渡す
    status: implemented
  - name: open
    type: 真偽値
    required: false
    default: 'true'
    enabled_when: '`target` があるとき'
    description: 開いているか。「{ID} へのコメント」の行の右端に開閉のボタンを置き、開いている間は v（コメントの入力を閉じる）、閉じている間は ^（コメントの入力を開く）を出す。閉じている間は見出しの行だけを出し、入力欄・添えた箇所・結果・「レビューに追加」を出さない。`body` が空白だけでなければ、見出しの右に鉛筆の印と「書きかけ」を出す
  - name: voice
    type: 列挙
    required: false
    default: idle
    choices: idle・disabled・recording・transcribing
    description: 音声入力の状態。idle は「レビューに追加」の左にマイクのアイコンだけのボタンを置く。disabled はマイクのボタンを押せない見た目にし、フォーカスは受けたまま `voiceReason` をツールチップに出す。recording はマイクと「レビューに追加」の位置を × の「キャンセル」と ✓ の「文字起こし」のアイコンだけのボタンに切り替え、結果の行に失敗の色の丸と `elapsed` を出す。transcribing は 2 つのボタンを押せなくし、✓ の位置と結果の行に回る印だけを出し、入力欄を書き換えられなくする
  - name: voiceReason
    type: 文字列
    required: false
    enabled_when: '`voice` が `disabled` のとき'
    description: マイクのボタンを押せない理由（『文字起こしの可否』の `detail`、ブラウザがマイクを使えないときは使う側が持つ文）。ツールチップと読み上げの説明に出す
  - name: elapsed
    type: 整数
    required: false
    default: '0'
    choices: 0 以上
    enabled_when: '`voice` が `recording` のとき'
    description: 録音を始めてからの秒数。`m:ss` で出す（経過の時間は読み上げない）
  - name: entered
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`status` が `sent` のとき'
    description: 送信した書き込みを Claude Code へ入力したか（『書き込みをすぐ送る』の `entered`）。true は「送信し、Claude Code へ入力しました。」、false は「送信しました。Claude Code へは入力していません。」
events:
  - name: 溜める
    when: 「レビューに追加」を押したときと、入力欄で Ctrl+Enter（macOS は Cmd+Enter）を押したとき。`status` が `saving` の間は発火しない
    value: '`onSubmit(target, loc, body)`（target・loc・body（入力欄の中身そのまま））'
    description: 使う側が、空白だけなら `empty` にして入力欄へフォーカスを戻し、そうでなければ `saving` にして `POST /api/comments` へ送り、201 なら入力欄と箇所を空にして `saved`、それ以外は `failed` にする
  - name: 入力
    when: 入力欄の中身が変わったとき
    value: '`onInput(body)`（body）'
    description: 使う側が書きかけを `PUT /api/drafts` で保ち、`saved`・`empty` の結果を消して `idle` に戻す（`failed` は次に溜めるまで残す）
  - name: 箇所を外す
    when: 添えた箇所の × を押したとき
    description: 使う側が `loc` を外して項目へのコメントに戻す。入力欄の中身は残し、フォーカスを入力欄へ移す
    value: '`onClearLoc()`'
  - name: 本文をコピー
    when: '`failed` で `detail` が無いときに出るコピーのボタン（本文をコピー）を押したとき'
    value: '`onCopyBody(body)`（body）'
    description: 使う側が入力欄の中身をクリップボードへコピーする（サーバーが止まっている間は書きかけを保てないため）
  - name: 入力欄に入る
    when: 入力欄にフォーカスしたとき
    description: 使う側が `collapsed` を false にして広げる
    value: '`onFocus()`'
  - name: 入力から出る
    when: フォーカスが部品の外へ出たとき
    value: '`onBlur(body)`（body）'
    description: 使う側が、畳む幅で入力欄が空白だけなら `collapsed` を true に戻す
  - name: 開閉
    when: 開閉のボタンを押したとき
    value: '`onToggleOpen(open)`（押した後の開閉）'
    description: 使う側が開閉を端末の保存領域に覚え、`open` を書き換えて描き直す。描き直した後のフォーカスは開閉のボタンに置く
  - name: 録音を始める
    when: マイクのボタンを押したとき（`voice` が `idle`）
    value: '`onVoiceStart()`'
    description: 使う側が `getUserMedia` と `MediaRecorder` で録り始め、`voice` を `recording` にして `elapsed` を進める。許可が得られなければ `status` を `voice-failed`（マイクの許可が要る旨）にして `voice` を `idle` のままにする
  - name: 録音をキャンセル
    when: × のボタンを押したとき（`voice` が `recording`）
    value: '`onVoiceCancel()`'
    description: 使う側が録音を捨ててマイクを解放し、`voice` を `idle` に戻す。入力欄の中身は変えない。録音中に入力が無くなるか向けた先が変わるとき（パネル・全画面・一覧・スレッドを閉じる・入力を畳む・別の項目やタブへ移る）も、使う側が同じく録音を捨ててマイクを解放する。書き換えの知らせでの描き直しでは録音を止めない
  - name: 文字起こし
    when: ✓ のボタンを押したとき（`voice` が `recording`）
    value: '`onVoiceDone(target, loc, body)`（target・loc・body（入力欄の中身そのまま））'
    description: 使う側が録音を止めて `voice` を `transcribing` にし、`POST /api/transcriptions` へ送る。返った文字を入力欄のカーソルの位置へ挿入し、設定の挙動が `send` なら挿入した全文を `POST /api/comments/send-now` へ送って入力欄を空にし `sent`、`insert` なら `inserted` にする。失敗は入力欄の中身を残して `voice-failed`。どの場合も `voice` を `idle` に戻す（503 のときは `disabled`）。文字起こし中に入力が無くなったときと、返った時点の向けた先が押したときと違うときは、返った文字を捨てる（挿入も送信もしない）
  - name: 押せないマイクを押す
    when: '`voice` が `disabled` のマイクのボタンを押したとき'
    value: '`onVoiceBlocked()`'

accessibility:
  - 「レビューに追加」はアイコンだけのボタンにし、読み上げの名前（`aria-label`）「レビューに追加」とツールチップ（`title`）「レビューに追加（Ctrl+Enter）」を持つ。本文のコピーのボタンは `aria-label`・`title` に「本文をコピー」を持つ
  - 入力欄にラベル「{ID} へのコメント」を常に見せ、入力欄の中の例示文をラベルの代わりにしない。`target` が無いときは `aria-label`「項目を指さないコメント」
  - 添えた箇所は入力欄の `aria-describedby` から指し、× のボタンに読み上げの名前「箇所を外す」を付ける
  - 結果の文言は `role="status"` で読み上げに伝え、入力欄の `aria-describedby` から指す。本文が空のときは入力欄に `aria-invalid="true"`
  - 開閉のボタン・入力欄・箇所を外す・音声で入力・レビューに追加・本文をコピーに Tab で届き、印の色の輪でフォーカスを見せる
  - 失敗と本文が空は、赤の色だけでなく印のアイコンと文言でも伝える
  - '「レビューに追加」は 1 行の入力欄と同じ高さの正方形にし、タッチが主な端末（`pointer: coarse`）では 44 x 44 CSS px にする'
  - 開閉のボタンは `aria-label`・`title` に、開いている間は「コメントの入力を閉じる」、閉じている間は「コメントの入力を開く」を持ち、`aria-expanded` で開閉を、`aria-controls` で開閉する範囲を指す
  - 書きかけの印は「書きかけ」を文字で出し、鉛筆のアイコンは読み上げから外す
  - マイクのボタンはアイコンだけのボタンにし、`aria-label`・`title` に「音声で入力」を持つ。押せないときは `aria-disabled="true"` でフォーカスを受けたまま、ツールチップに理由を出して `aria-describedby` から指す
  - 録音中の × と ✓ はアイコンだけのボタンにし、`aria-label`・`title` にそれぞれ「キャンセル」（ツールチップは「キャンセル（録音を破棄）」）と「文字起こし」を持つ。文字起こし中は ✓ を「文字起こし中」にして押せなくする
  - 録音を始めた・終えたことは結果の行（`role="status"`）の読み上げだけの「録音中」で伝え、経過の時間は読み上げない
  - 'マイク・× ・✓ のボタンは「レビューに追加」と同じ大きさにし、タッチが主な端末（`pointer: coarse`）では 44 x 44 CSS px にする'
  - 画面の文言に文字起こしのサービスの名前（voice-paste）を出さない

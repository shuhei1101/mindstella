title: "差分のミニマップ"
implementation: "plugins/mindstella/skills/mindmap/preview/components/diff-minimap.ts#MindmapPreview.diffMinimapFrame"
story: "Preview/DiffMinimap"
states:
  - name: Kinds
    description: 足した・消した・変わったの印。足したは塗りつぶし、消したは枠だけの中抜き、変わったは斜めの縞。前に無かったキーは足した、値が変わったキーは変わった。消した塊のすぐ後ろの足した塊は変わった 1 つにまとめる
    args:
      - name: shown
        value: 'true'
  - name: SingleMark
    description: 印が 1 つ。帯を出し、印の長さは最小の 12px
    args:
      - name: shown
        value: 'true'
  - name: NotScrollable
    description: 本文がスクロール領域に収まる。帯と印は出し、見えている範囲の面は出さない
    args:
      - name: shown
        value: 'true'
  - name: ManyMarks
    description: 印が 30 か所。帯に収まるよう印の最小の長さを詰め（下限 4px）、重なる印は後ろへずらして全て並べる
    args:
      - name: shown
        value: 'true'
  - name: Dragging
    description: 見えている範囲の面をマウスでつかんで下へ動かしている間。面を 1 段濃くし、本文の文を選ばない
    args:
      - name: shown
        value: 'true'
  - name: NoMarks
    description: 差分の表示だが、本文に変わった箇所の印が無い。帯を出さず、本文の幅は帯の無いときと同じ
    args:
      - name: shown
        value: 'true'
  - name: Hidden
    description: 差分の表示でないか、表示の設定で差分のミニマップを外した。本文の差分の印があっても帯を出さない
    args:
      - name: shown
        value: 'false'
  - name: Narrow
    description: 幅 390px。帯の太さと印の押せる的は変えず、本文の幅を帯の分だけ詰める
    args:
      - name: shown
        value: 'true'
  - name: SideBySide
    description: 本文を左右に並べている。左の消した塊と右の足した塊が向かい合う箇所は「変わった」1 つ、片側だけの塊はその種類の印を、高さの順に並べる
    args:
      - name: shown
        value: 'true'
lead: 差分の表示の間、詳細パネル・詳細の全画面の本文のスクロール領域を包み、スクロールバーの外側に縦の帯を並べる。帯には、本文の中の変わった箇所の高さに足した・消した・変わったを形で分けた印と、見えている範囲の面を置き、印・印の無い所を押すとその箇所へ、マウスで押したまま上下に動かすとスクロールバーと同じように本文を送る。
args:
  - name: shown
    type: 真偽値
    required: true
    description: ミニマップを置くか。使う側が、差分の表示の間で、表示の設定で差分のミニマップを外していないときだけ真を渡す。偽のときは本文のスクロール領域だけを包んだ枠を返す。真でも、本文に変わった箇所の印が 1 つも無いときは帯を出さない
slots:
  - name: default
    description: 詳細パネル・詳細の全画面の本文のスクロール領域（`.panel-body`）。部品はこの中の差分の印（キーの差分の行・本文の足した / 消した塊・箇条書きの項目・表の行・図の差分の枠・Raw の足した / 消した行・HTML の本文の枠の中の印）を文書の順に集め、中身と高さが変わるたびに印を置き直す。本文を左右に並べているときは、左右の列の印を高さの順に並べ直し、同じ高さで向かい合う消した塊と足した塊を「変わった」1 つにする
accessibility:
  - 帯は `role="toolbar"`、`aria-orientation="vertical"`、読み上げの名前「変わった箇所」。印は 1 つのタブの止まりにまとめ（最後に選んだ印だけ `tabindex="0"`）、上下の矢印キーと Home / End で印の間を移る
  - 印はボタンで、読み上げの名前と `title` は「{足した箇所・消した箇所・変わった箇所}（{順番} / {件数}）」。Enter / Space でその箇所へ送る
  - 見えている範囲の面は `aria-hidden` にする
  - 足した・消した・変わったは、色だけでなく塗りつぶし・中抜き・斜めの縞の形でも分ける
  - '印の箇所へ送るとき、`prefers-reduced-motion: reduce` ではなめらかに送らず、すぐにその位置にする'
  - ホバーは面の色、キーボードのフォーカスは印の色の輪で見分ける
refs:
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
  - dev/設計書/部品設計/プレビュー/差分の印.ts#
status: implemented
notes:
  印の集め方: 本文のスクロール領域の中の差分の印を文書の順に集める。見えていない印（畳んだ Raw の行など）と、Raw を出している図の枠は並べない（Raw を畳んだ図は枠を「変わった」にし、Raw を出した図は Raw の行を並べる）。すぐ後ろに続く同じ種類の塊・行は 1 つにまとめ、消した塊のすぐ後ろの足した塊は「変わった」1 つにする。キーの差分は、前に無かったキーを「足した」、値が変わったキーを「変わった」にする。図の差分の枠は「変わった」。HTML の本文の枠の中の印は、足した行を「足した」、変えた行を「変わった」にする
  印の置き方: 印の上端は、本文の全体の高さに対するその箇所の位置の割合。印の長さはその箇所の高さの割合で、最小は 12px。印が帯に収まらないほど多いときは最小を 4px まで詰める。重なる印は 2px の間を空けて後ろへずらし、帯の終わりを出た印は後ろから前へ詰める。本文の高さが変わったとき（図の描き終わり・HTML の本文の枠の高さ・Raw の切り替え・パネルの幅）だけ置き直し、本文を送るたびには見えている範囲の面だけを動かす
  印を押したとき: その箇所の上端が本文のスクロール領域の高さの 1/4 の位置に来るまで送り、その箇所を 1.6 秒の間だけ枠で示す（HTML の本文の枠の中の箇所は示さない）。履歴に積まず、URL のハッシュも変えない
  印の無い所を押したとき: 押した位置に見えている範囲の面の中央が来るまで、本文をすぐに送る（タッチの端末も同じ）。本文が送れない長さのときは何もしない
  ドラッグ: マウスの左ボタンで帯を押したまま上下に動かすと、スクロールバーと同じように本文を送る。見えている範囲の面の中を押したときはつかんだ位置を保ち、面の外を押したときは面の中央を押した所に合わせる。押した位置から 5px（`PRESS_SLOP_PX`）より動かすまでは押しただけとして扱い、その後に離しても印へは飛ばない。ボタンを押していない動き（帯の外で離した後）を受けたらドラッグを終える。タッチの端末ではドラッグしない。帯に乗せるとつかむ形のポインタ（印の上は押す形）、ドラッグの間は帯の外でもつかんでいる形
test_file: tests/integration/storybook/test_diff_minimap_stories.py

title: "コメントの入力"
implementation: "plugins/mindstella/skills/mindmap/preview/components/send-form.ts#MindmapPreview.sendForm"
story: "Preview/SendForm"
states:
  - name: Idle
    description: 入力欄が空。本文と線で区切って下端に置き、ラベル「{ID} へのコメント」を常に見せる
    args:
      - name: target
        value: D-022
  - name: Typing
    description: 入力中。入力欄に印の色の輪
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
  - name: WithBodyLocation
    description: 本文の箇所を添えた。入力欄の上に「本文 3 行目」と選んだ文を出し、× で外せる
    args:
      - name: target
        value: A-005
      - name: loc
        value: '{kind: body, start: 3, end: 3, text: 受け取る人へ渡す形}'
      - name: loc_label
        value: 本文 3 行目
  - name: WithValueLocation
    description: 値の箇所を添えた。箇所の名前にキーの名前を出し、選んだ文は 3 行までにして末尾を省く
    args:
      - name: target
        value: D-022
      - name: loc
        value: '{kind: value, key: options[C].cons, text: 表の密度が下がる。表の列を詰めて並べるため、1 行に出せる項目の数が減り、ID と状態の列が画面の外へ押し出される。狭い幅では横に送らないと読めない列が増え、比べるのに手間がかかる}'
      - name: loc_label
        value: 案 C のデメリット
      - name: body
        value: ここは別の言い方にしたい
  - name: Saving
    description: 溜めている。入力欄を書き換えられなくし、ボタンを押せなくする。1 秒を超えたら回る印と「レビューに追加しています」を出す
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
      - name: status
        value: saving
  - name: Saved
    description: 溜めた。入力欄を空にし、「レビューに追加しました（レビュー中 3 件）。」を出す。入力を始めたら消す
    args:
      - name: target
        value: D-022
      - name: status
        value: saved
      - name: count
        value: '3'
  - name: Empty
    description: 本文が空で溜めようとした。入力欄の枠の全体と印を要見直しの赤（`--st-review`）、「コメントを入れてから追加してください。」を本文の文字色で出す。ボタンは押せるまま
    args:
      - name: target
        value: D-022
      - name: status
        value: empty
  - name: FailedUnreachable
    description: サーバーに届かなかった。本文を残し、「レビューに追加できませんでした。サーバーが止まっています。起動スクリプトで立ち上げ直し、示された新しい URL で開いてから追加してください。」と「本文を写す」を出す
    args:
      - name: target
        value: D-022
      - name: body
        value: 案 A にする
      - name: status
        value: failed
  - name: FailedDetail
    description: サーバーが溜めなかった理由を返した。本文を残し、「レビューに追加できませんでした。{理由}」を出す（「本文を写す」は出さない）
    args:
      - name: target
        value: A-005
      - name: body
        value: ここは言い換える
      - name: status
        value: failed
      - name: detail
        value: 選んだ文が本文の 3 行目にありません
  - name: Long
    description: 長文。8 行を超えたら入力欄の中を送る
    args:
      - name: target
        value: D-022
      - name: body
        value: |-
          案 A にする。
          理由: 読み返す画面なので、表と数値を長く読んでも疲れない無彩色の骨格がよい。
          印の色は 1 色に絞る。
          状態の色は状態の表示だけに使う。
          B のカード中心は一覧が長くなると縦に伸びる。
          C のダークは明暗の切り替えで足りる。
          トップバーは暗い帯にしておきたい。
          ID の等幅は残す。
          以上。
  - name: NoTarget
    description: 項目を指さないコメント（コメントの一覧の下端）。見出しを出さず、入力欄と「レビューに追加」だけにする。名前「項目を指さないコメント」は読み上げにだけ持つ
  - name: Narrow
    description: 幅 390px。左右の余白をパネルの本文に揃える。入力の幅が 360px 以下では、ボタンを右に置いたまま、結果を下の行に幅いっぱいで出す。条件は画面の幅ではなく部品の幅（コンテナクエリ）で持つ
    args:
      - name: target
        value: A-005
      - name: loc
        value: '{kind: body, start: 3, end: 3, text: 受け取る人へ渡す形}'
      - name: loc_label
        value: 本文 3 行目
      - name: body
        value: 案 A にする
      - name: status
        value: failed
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる。320px でも結果の文言は折り返し、ボタンの幅は保つ
  - name: NoTargetCollapsed
    description: 項目を指さないコメントを畳んだ形。読み上げのラベルと 1 行の入力欄だけを出す
    args:
      - name: collapsed
        value: 'true'
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる
  - name: NoTargetExpanded
    description: 項目を指さないコメントを狭い幅で広げた形。入力欄と「レビューに追加」を出す
    args:
      - name: collapsed
        value: 'false'
      - name: body
        value: 全体に目を通した
    notes:
      見せ方: Storybook の画面幅を 390px にして見せる
lead: 詳細パネル・詳細の全画面の下端と、コメントの一覧の下端に留める、コメントをレビュー中に溜める入力欄と「レビューに追加」のボタン。選んだ箇所を添えられ、溜めた結果を入力の近くに出す。
test_file: tests/integration/storybook/test_send_form_stories.py
status: planned
args:
  - name: target
    type: 文字列
    required: false
    default: なし（項目を指さないコメント）
    description: コメントを向ける項目の ID。ラベル「{ID} へのコメント」に等幅で出す。無いときはラベルを見せず、読み上げの名前「項目を指さないコメント」だけを持つ
  - name: loc
    type: オブジェクト
    required: false
    default: なし（箇所を添えない）
    enabled_when: '`target` があるとき'
    description: 添えた箇所（『レビュー中のコメントの追加』の `loc`）。入力欄の上に箇所の名前と選んだ文を 3 行まで出し（超えたら末尾を省く）、外す × を添える
  - name: loc_label
    type: 文字列
    required: false
    enabled_when: '`loc` があるとき'
    description: 箇所の名前。本文は「本文 {行} 行目」（行の範囲は「本文 {始め}〜{終わり} 行目」）、値はキーの名前（例 「案 C のデメリット」）。使う側が `loc` から作って渡す
  - name: body
    type: 文字列
    required: false
    default: '""'
    description: 入力欄の中身。2 行から始まり、中身に合わせて 8 行まで伸び、それより長いと入力欄の中を送る
  - name: status
    type: 列挙
    required: false
    default: idle
    choices: idle・saving・saved・empty・failed
    description: 溜める状態。idle は結果を出さない。saving はボタンを押せなくし入力欄を書き換えられなくする。empty・failed は入力欄の中身を残す
  - name: count
    type: 整数
    required: false
    choices: 1 以上
    enabled_when: '`status` が `saved` のとき'
    description: 溜めた後のレビュー中のコメントの件数（『レビュー中のコメントの追加』の `count`）。「レビューに追加しました（レビュー中 {件数} 件）。」と出す
  - name: detail
    type: 文字列
    required: false
    default: なし（サーバーに届かなかった）
    enabled_when: '`status` が `failed` のとき'
    description: サーバーが返した溜められなかった理由（`detail`）。無ければ、サーバーが止まっているので起動スクリプトで立ち上げ直して新しい URL で開くよう出し、本文を写すボタンを添える
  - name: collapsed
    type: 真偽値
    required: false
    default: 'false'
    enabled_when: '`target` が無いとき'
    description: 畳んだ形にするか。畳むと余白を詰め、読み上げのラベルと 1 行の入力欄だけを出す（入力欄は伸ばさず、結果と「レビューに追加」を出さない）。畳むかは使う側が決める
events:
  - name: 溜める
    when: 「レビューに追加」を押したときと、入力欄で Ctrl+Enter（macOS は Cmd+Enter）を押したとき。`status` が `saving` の間は発火しない
    value: target・loc・body（入力欄の中身そのまま）
    description: 使う側が、空白だけなら `empty` にして入力欄へフォーカスを戻し、そうでなければ `saving` にして `POST /api/comments` へ送り、201 なら入力欄と箇所を空にして `saved`、それ以外は `failed` にする
  - name: 入力
    when: 入力欄の中身が変わったとき
    value: body
    description: 使う側が書きかけを `PUT /api/drafts` で保ち、`saved`・`empty` の結果を消して `idle` に戻す（`failed` は次に溜めるまで残す）
  - name: 箇所を外す
    when: 添えた箇所の × を押したとき
    description: 使う側が `loc` を外して項目へのコメントに戻す。入力欄の中身は残し、フォーカスを入力欄へ移す
  - name: 本文を写す
    when: '`failed` で `detail` が無いときに出る「本文を写す」を押したとき'
    value: body
    description: 使う側が入力欄の中身をクリップボードへ写す（サーバーが止まっている間は書きかけを保てないため）
  - name: 入力欄に入る
    when: 入力欄にフォーカスしたとき
    description: 使う側が `collapsed` を false にして広げる
  - name: 入力から出る
    when: フォーカスが部品の外へ出たとき
    value: body
    description: 使う側が、畳む幅で入力欄が空白だけなら `collapsed` を true に戻す
accessibility:
  - 入力欄にラベル「{ID} へのコメント」を常に見せ、入力欄の中の例示文をラベルの代わりにしない。`target` が無いときは `aria-label`「項目を指さないコメント」
  - 添えた箇所は入力欄の `aria-describedby` から指し、× のボタンに読み上げの名前「箇所を外す」を付ける
  - 結果の文言は `role="status"` で読み上げに伝え、入力欄の `aria-describedby` から指す。本文が空のときは入力欄に `aria-invalid="true"`
  - 入力欄・箇所を外す・レビューに追加・本文を写すに Tab で届き、印の色の輪でフォーカスを見せる
  - 失敗と本文が空は、赤の色だけでなく印のアイコンと文言でも伝える

summary: "プレビューの画面が共通で使う部品"
docs_index: true
items:
  - page: トップバー.ts.yaml
    summary: 題名・検索の入口・ライト / ダークと、画面を移るタブの帯
  - page: 表示形式の切り替え.ts.yaml
    summary: マップ・ボード・カード・表を切り替えるセグメント
  - page: 表.ts.yaml
    summary: 並べ替え・絞り込み・ピン留め・表示する列を持つ項目の一覧
  - page: 回答・意見の送信.ts.yaml
    summary: 詳細パネルと詳細の全画面の下端に留める、項目へ回答・意見を送る入力欄と送るボタン
  - page: 差分の印.ts.yaml
    summary: 差分の表示の間、足した項目に新規（+）、変えた項目に変更（●）の印
  - page: 変更履歴.ts.yaml
    summary: 差分の表示で比べる時点を選ぶモーダル

summary: "プレビューの画面が共通で使う部品"
docs_index: true
items:
  - page: トップバー.ts.yaml
    summary: 題名・検索の入口・ライト / ダークと、画面を移るタブの帯
  - page: 表示形式の切り替え.ts.yaml
    summary: マップ・ボード・カード・表を切り替えるセグメント
  - page: 表.ts.yaml
    summary: 並べ替え・絞り込み・ピン留め・表示する列を持つ項目の一覧
  - page: 差分の印.ts.yaml
    summary: 差分の表示の間、足した項目に新規（+）、変えた項目に変更（●）、消した項目に消した（−）の印
  - page: 変更履歴.ts.yaml
    summary: 差分の表示で比べる時点を選ぶモーダル
  - page: コメントの入力.ts.yaml
    summary: 詳細パネル・詳細の全画面・コメントの一覧の下端に留める、コメントをレビュー中に溜める入力欄とボタン
  - page: 選んだ箇所のコメントの入口.ts.yaml
    summary: 本文の文章か項目の値を選んだときに、選んだ範囲の近くに出すピルの形の入口
  - page: 表示の設定.ts.yaml
    summary: 表示する種類を選び、既定に戻す・ワークスペースの既定にするを持つ左のパネルの中身
  - page: 既定の保存の確かめ.ts.yaml
    summary: ワークスペースの既定として保存する前に、今の既定と保存する値を並べるモーダル
  - page: 絞り込み.ts.yaml
    summary: 条件ごとに値を件数つきのチェックボックスで選ぶ、左に重ねる絞り込みのドロワー
  - page: コメントの印.ts.yaml
    summary: レビュー中のコメントを書いた項目に出す、吹き出しと件数の小さなピル
  - page: 消した項目の帯.ts.yaml
    summary: 差分の表示の間、選んだ時点で消した項目を一覧の上に消した印・ID・タイトルで並べる帯
  - page: 取り下げの札.ts.yaml
    summary: 取り下げた調査・資料・用語集・メモ・会話ログのタイトルの右に置く、枠付きの × と「取り下げ」の札
  - page: 本文の形式の札.ts.yaml
    summary: 資料の種類の右に置く、本文の形式を `MD` / `HTML` で示す札
  - page: HTMLの本文の枠.ts.yaml
    summary: HTML の本文と `html` のコードブロックを、スクリプトを動かさない枠に描く
  - page: HTMLの本文の差分.ts.yaml
    summary: HTML の本文の差分を、描いた結果の印と原文の差分で切り替えて見せる

title: "スレッドの行"
implementation: "plugins/mindstella/skills/mindmap/preview/components/thread-row.ts#MindmapPreview.threadRow"
story: "Preview/ThreadRow"
states:
  - name: Replied
    description: オープンで AI が返信した。1 行目に状態の札「オープン」と要約（2 行まで）、2 行目に向けた項目の ID・最後の書き手「AI」・最後の書き込みの日時、行の下にタグ
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（写しから戻す）で決まった","target":"D-12","posts":[{"author":"user","body":"D-12 は案 B にしたい。失敗したら写しから戻せるなら十分","created":"2026-10-12T01:20:00+00:00"},{"author":"ai","body":"D-12 を案 B（写しから戻す）で決定にしました。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
  - name: PendingReply
    description: レビュー中の返信を持つ。2 行目の末尾に破線の枠・鉛筆の印・「レビュー中」の印
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（写しから戻す）で決まった","target":"D-12","posts":[{"author":"user","body":"D-12 は案 B にしたい","created":"2026-10-12T01:20:00+00:00"},{"author":"ai","body":"D-12 を案 B で決定にしました。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
      - name: has_pending_reply
        value: 'true'
  - name: Asking
    description: AI が立てたスレッド（利用者の返事待ち）。最後の書き手は「AI」
    args:
      - name: thread
        value: '{"id":"TH-2","status":"open","tags":["起票"],"summary":"D-16 の比べた結果を Issue に起票してよいかの確認。返事待ち","target":"D-16","posts":[{"author":"ai","body":"D-16 の比べた結果を Issue に起票してよいですか。","created":"2026-10-12T04:02:00+00:00"}],"events":[]}'
  - name: NoSummary
    description: 要約がまだ無く、最後の書き手が利用者。題は最初の書き込みの 1 行目を太さを落として出し、書き手は「あなた」
    args:
      - name: thread
        value: '{"id":"TH-3","status":"open","tags":["資料"],"summary":null,"target":"A-1","posts":[{"author":"user","body":"A-1 の背景の節が長いので、3 行にまとめてほしい。経緯は会話ログへのリンクで足りる","created":"2026-10-12T05:01:00+00:00"}],"events":[]}'
  - name: PendingNewToItem
    description: まだ送っていない、項目へ向けた新しいスレッド。状態の札の代わりに鉛筆の印と「レビュー中」の札、行の枠を破線にする。題は最初の書き込みの 1 行目、書き手は「あなた」、日時は溜めた日時。タグは出さない
    args:
      - name: pending
        value: '{"id":"C-41","target":"D-5","thread":null,"body":"写しは git のコミットで取るほうが戻しやすいと思う","created":"2026-10-12T05:10:00+00:00"}'
  - name: PendingNewFree
    description: まだ送っていない、項目を指さない新しいスレッド。2 行目に ID を出さない
    args:
      - name: pending
        value: '{"id":"C-42","target":null,"thread":null,"body":"移し替えの手順の名前は版の番号だけでよい？","created":"2026-10-12T05:12:00+00:00"}'
  - name: Closed
    description: クローズ。状態の札をチェックの印と「クローズ」にし、薄い文字で出す。利用者と AI のどちらがクローズにしても同じ見た目
    args:
      - name: thread
        value: '{"id":"TH-5","status":"closed","tags":["画面"],"summary":"D-2 の版の置き場所の質問。config.yaml に書くと回答","target":"D-2","posts":[{"author":"user","body":"版はどこに書く？","created":"2026-10-12T02:00:00+00:00"},{"author":"ai","body":"config.yaml の version に書きます。","created":"2026-10-12T02:03:00+00:00"}],"events":[{"kind":"closed","author":"user","reason":"config.yaml に書くと分かった","created":"2026-10-12T02:10:00+00:00"}]}'
  - name: Long
    description: 長い要約・タグが 2 つ・項目を指さない。要約は 2 行で末尾を省き、2 行目に ID を出さない
    args:
      - name: thread
        value: '{"id":"TH-4","status":"open","tags":["調査","画面"],"summary":"移し替えの手順を画面で見られるかの質問。今は見られず、T-6 の点検の結果を、版ごとの操作の一覧にした資料 A-9 にまとめることになった","target":null,"posts":[{"author":"user","body":"移し替えの手順は、プレビューのどこかで見られる？","created":"2026-10-12T00:10:00+00:00"},{"author":"ai","body":"資料 A-9 を足しました。","created":"2026-10-12T00:41:00+00:00"}],"events":[]}'
  - name: Tagged
    description: タグ「画面」で絞っている。そのタグの札を枠の全体と面で示し、押した状態として読み上げる
    args:
      - name: thread
        value: '{"id":"TH-4","status":"open","tags":["調査","画面"],"summary":"移し替えの手順を画面で見られるかの質問","target":null,"posts":[{"author":"ai","body":"資料 A-9 を足しました。","created":"2026-10-12T00:41:00+00:00"}],"events":[]}'
      - name: active_tag
        value: 画面
  - name: Narrow
    description: 幅 390px。2 行目の値は折り返さず、日時を残して ID から詰める。タグは行の下で折り返す
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（写しから戻す）で決まった","target":"D-12","posts":[{"author":"ai","body":"D-12 を案 B で決定にしました。","created":"2026-10-12T01:24:00+00:00"}],"events":[]}'
      - name: has_pending_reply
        value: 'true'
  - name: Unread
    description: オープンで AI の返信が利用者の未読。2 行目の先頭に塗りつぶしの札「● 未読」を出し、向けた項目の ID・最後の書き手「AI」・日時をその右に並べる
    args:
      - name: thread
        value: '{"id":"TH-2","status":"open","tags":["起票"],"summary":"D-16 の比べた結果を Issue に起票してよいかの確認。返事待ち","target":"D-16","posts":[{"author":"ai","body":"D-16 の比べた結果を Issue に起票してよいですか。","created":"2026-10-12T04:02:00+00:00","seen":false}],"events":[]}'
  - name: UnreadPendingReply
    description: 未読で、レビュー中の返信も持つ。2 行目の先頭に「● 未読」、末尾に破線の枠の「レビュー中」を出し、形（塗りつぶしと破線の枠）で見分ける
    args:
      - name: thread
        value: '{"id":"TH-1","status":"open","tags":["画面"],"summary":"D-12 の失敗時の扱いの相談。案 B（写しから戻す）で決まった","target":"D-12","posts":[{"author":"user","body":"D-12 は案 B にしたい","created":"2026-10-12T01:20:00+00:00","seen":true},{"author":"ai","body":"D-12 を案 B で決定にしました。","created":"2026-10-12T01:24:00+00:00","seen":false}],"events":[]}'
      - name: has_pending_reply
        value: 'true'
  - name: UnreadClosed
    description: AI が返信してからクローズにし、返信が利用者の未読。状態の札「クローズ」のまま、2 行目の先頭に「● 未読」を出す
    args:
      - name: thread
        value: '{"id":"TH-6","status":"closed","tags":["起票"],"summary":"T-4 の Issue の起票の確認。起票して完了","target":"T-4","posts":[{"author":"user","body":"起票してよい","created":"2026-10-12T03:00:00+00:00","seen":true},{"author":"ai","body":"T-4 の Issue を起票しました。","created":"2026-10-12T03:07:00+00:00","seen":false}],"events":[{"kind":"closed","author":"ai","reason":"起票した","created":"2026-10-12T03:07:00+00:00"}]}'
lead: スレッドの一覧に並べる 1 件の行。状態の札・題・向けた項目・最後の書き手と日時・レビュー中の印・タグを出し、押すとそのスレッドを開く。まだ送っていない新しいスレッドも同じ形で「レビュー中」の札にする。
status: implemented
args:
  - name: thread
    type: オブジェクト
    default: なし（`pending` を渡す）
    description: 送ったスレッド（『スレッドの読み取り』の `threads[]` の 1 件）。`pending` とどちらか片方を渡す。題は `summary`、無ければ最初の書き込みの 1 行目。2 行目の書き手と日時は最後の書き込みのもの。書き込みに `seen` が `false` のものがあれば、2 行目の先頭に未読の札を出す（クローズのスレッドでも出す）
    status: implemented
  - name: pending
    type: オブジェクト
    default: なし（`thread` を渡す）
    description: まだ送っていない新しいスレッドの最初の書き込み（『レビュー中のコメントの読み取り』の `items[]` のうち `thread` を持たないもの）。題は本文の 1 行目、書き手は「あなた」、日時は溜めた日時（`created`）。タグを出さない
    status: implemented
  - name: has_pending_reply
    type: 真偽値
    default: 'false'
    enabled_when: '`thread` を渡したとき'
    description: そのスレッドへのレビュー中の返信を持つか。持てば 2 行目の末尾に「レビュー中」の印を出す
    status: implemented
  - name: active_tag
    type: 文字列
    default: なし（タグで絞っていない）
    enabled_when: '`thread` を渡したとき'
    description: 一覧を絞っているタグ。同じタグの札を押した見た目にする
    status: implemented
events:
  - name: 開く
    when: 行のタグ以外の所を押したとき（Enter・Space を含む）
    value: 送ったスレッドは `thread.id`、まだ送っていない新しいスレッドは `pending.id`
    description: 使う側がパネルの中をスレッドの画面に切り替える
  - name: タグで絞る
    when: タグの札を押したとき
    value: タグ
    description: 使う側がそのタグで一覧を絞る。絞っているタグの札なら絞り込みを外す
accessibility:
  - 行を開く操作は 1 つのボタンにし、読み上げの名前は状態・題・向けた項目・最後の書き手・日時をこの順で読む。レビュー中の印は「レビュー中の返信あり」と読む
  - 状態の札とレビュー中の印は、色に加えて印のアイコンと文字で示す
  - 未読の札は、色に加えて塗りつぶしの形・点の印・「未読」の文字で示す。行を開くボタンの読み上げの名前は、状態の次に「未読」を読む
  - タグの札は行を開くボタンと別のボタンにし、`aria-pressed` と読み上げの名前「タグ「{タグ}」で絞る」を持つ
  - 行を開くボタンとタグの札のそれぞれに Tab で届き、フォーカスは枠の全体に印の色の輪で出す
refs:
  - dev/設計書/画面設計/プレビュー/コメントの一覧#
test_file: tests/integration/storybook/test_thread_row_stories.py

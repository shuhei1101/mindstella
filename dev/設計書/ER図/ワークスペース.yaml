title: "ER 図: ワークスペース"
lead: 1 つの話し合いのフォルダ（ワークスペース）が持つ YAML の形。正本は `plugins/mindstella/skills/mindmap/schemas/` の JSON Schema で、書き込む前に突き合わせる。
er:
  entities:
    - name: 設定
    - name: 検討事項
    - name: タスク
    - name: 調査
    - name: 資料
    - name: 用語集
    - name: メモ
    - name: 会話ログ
    - name: 本文
    - name: 送信
  relations:
    - from: 設定
      to: 検討事項
      cardinality: '||--o{'
      label: 対象・カテゴリー・フェーズで振り分ける
    - from: 検討事項
      to: 検討事項
      cardinality: '}o--o{'
      label: depends_on・parent
    - from: 検討事項
      to: タスク
      cardinality: '||--o{'
      label: for で進められる
    - from: 会話ログ
      to: 検討事項
      cardinality: '}o--o{'
      label: sources
    - from: 検討事項
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 調査
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 資料
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 会話ログ
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 送信
      to: 検討事項
      cardinality: '}o--||'
      label: target（どの種類の項目も指す）
tables:
  - name: mindmap.yaml
    title: 設定
    datastore: YAML
    summary: 題名・話し合いの概要・プレイブック・最上位の軸の呼び名・フェーズ・対象とカテゴリー・ゴール・関連する場所
    scale: 1 件
    access: 全件
    columns:
      - name: playbooks
        title: プレイブック
        type: array
        not_null: true
        description: 並べて使う進め方ガイドの名前。1 件以上・重複なし。AI は並べたガイドをすべて読む
        example: '[壁打ち, システム開発]'
      - name: target_label
        title: 最上位の軸の呼び名
        type: string
        not_null: true
        description: 対象を画面で何と呼ぶか
        example: システム
      - name: phases
        title: フェーズ
        type: array
        not_null: true
        description: フェーズの名前を浅い順に並べる。`next` の並べ替えはこの順を使う。プレイブックを複数並べても 1 本の並びで持つ。項目の `phase` と `goal.phase` はこのどれか（点検が確かめる）
        example: '[目的, 要件, 構成]'
      - name: targets
        title: 対象
        type: array
        not_null: true
        description: 要素は `name`・`summary`
      - name: categories
        title: カテゴリー
        type: array
        not_null: true
        description: 要素は `name`・`target`（`targets[].name` のどれか）・`summary`
      - name: goal
        title: ゴール
        type: object
        not_null: false
        description: 任意。`phase`（どのフェーズまでやるか）・`summary`・`deliverables[]`（`title` と、できた資料の `doc`（`A-` の ID。任意））。無いときはゴールを決めていない話し合い
      - name: links
        title: 関連する場所
        type: array
        description: 要素は `title`・`url`
      - name: summary
        title: 題名
        type: string
        not_null: true
        description: 話し合いの題名（何についての話し合いかを 1 文で）。プレビューのトップバーに出す
        example: 要件出しのスキル mindmap を設計する
      - name: description
        title: 話し合いの概要
        type: string
        not_null: false
        length: 1 字以上 60 字以内
        description: 任意。何についての話し合いかを 1 文の短い文で。AI がセットアップと範囲の見直しで書き、利用者は `mindmap.yaml` を直して書き換える。プレビューの概要の画面の題名の上に出す。題名（`summary`）・ゴールの概要（`goal.summary`）とは別のもの
        example: スキル mindmap の記録の形とプレビューの画面を、作り始められるところまで決める話し合い。
      - name: history_limit
        title: 保持する回数
        type: number
        default: '1'
        description: 項目ごとに変更履歴を何回分持つか。0 以上の整数で上限は設けない。0 は変更履歴を持たず、差分を出さない。無ければ 1 として扱う
        example: '3'
  - name: plugins/mindstella/skills/mindmap/schemas/common.schema.json
    title: 共通のキー
    datastore: JSON
    summary: 種類ごとの YAML の項目が共通で持つキー（各種類のスキーマが `$ref` で指す）
    description: 種類ごとの YAML はどれも `items:` の配列を持ち、1 要素 = 1 項目。この表のキーは全ての種類の項目が持つ。
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: 種類の頭の文字 + `-` + 連番。頭の文字で種類が決まる（D 検討事項 / T タスク / R 調査 / A 資料 / G 用語集 / N メモ / L 会話ログ）。連番はその種類の最大 + 1 で、消した番号を使い回さない
        example: D-12
      - name: title
        title: タイトル
        type: string
        not_null: true
        description: 題
      - name: target
        title: 対象
        type: string
        description: 設定の `targets[].name` のどれか
      - name: category
        title: カテゴリー
        type: string
        description: 設定の `categories[].name` のどれか
      - name: phase
        title: フェーズ
        type: string
        description: 設定の `phases` のどれか
      - name: tags
        title: タグ
        type: array
        description: 自由な文字列
      - name: attrs
        title: 属性
        type: object
        description: 自由なキーと値（値は文字列・数値・真偽値）。使っているキーの名前は `attrs` のコマンドで引く
      - name: related
        title: 関連
        type: array
        description: 関連する項目の ID。向きを持たず、`impact` はたどらない
      - name: links
        title: リンク
        type: array
        description: 要素は `title`・`url`
      - name: created
        title: 作成日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-02T08:00:00+00:00'
      - name: updated
        title: 更新日時
        type: string
        not_null: true
        auto: 更新日時
        description: UTC のタイムゾーン付き ISO 8601
      - name: history
        title: 変更履歴
        type: array
        description: '`update`・`adopt` が値を変えるたびに先頭に 1 要素を足し、新しい順に並べる。要素は `seq`（`changes.yaml` の通し番号）・`at`（書き換えた日時）・`before`（変わったキー → 書き換える前の値。前に無かったキーは `null`）・`body_diff`（本文が変わったときだけ。要素は `line`（その書き換えの後の本文の 1 始まりの行）・`now`（そこからの今の行の並び）・`before`（置き換える前の行の並び））。後ろの行から当てると前の本文になる。`updated`・`history`・`body` は `before` に入れず、本文の全文も持たない。数は設定の `history_limit` までで、超えた古い要素は次に積むときに消す。無ければ変更履歴 0 回分として扱う。ツールが付け、`add`・`update` の `item` では渡せない'
  - name: decisions.yaml
    title: 検討事項
    datastore: YAML
    summary: 問いと答えの単位（未決定のものも入る）
    primary_key: id
    scale: ~1000
    access: 全件
    deletion: 消さず、状態を `取り下げ` か `対象外` にする
    columns:
      - name: status
        title: 状態
        type: string
        not_null: true
        enum_values: 未決定 / 決定済み / 要見直し / 保留 / 未整理 / 対象外 / 取り下げ
        description: 検討事項の状態
      - name: lead
        title: 問いの説明
        type: string
        description: 何を決める問いか
      - name: answer
        title: 答え
        type: string
        description: 決まった答え
      - name: options
        title: 案
        type: array
        description: 要素は `key`（記号）・`content`・`pros`・`cons`・`note`・`adopted`（真偽値）・`reason`。`adopted` が真の案は 0 か 1 つ
      - name: weight
        title: 影響度
        type: string
        enum_values: 大 / 中 / 小
        description: 派生の多さ
      - name: parent
        title: 派生元
        type: string
        description: この検討事項が派生した検討事項の ID（`D-`）
      - name: depends_on
        title: 前提
        type: array
        description: 先に決まっている必要がある検討事項の ID（`D-`）。保留の待ち先もここで持つ
      - name: reason
        title: 理由
        type: string
        description: 決めた理由・保留や取り下げの理由
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）'
        example: D-12.md
      - name: sources
        title: 経緯
        type: array
        description: 決めた会話ログの ID（`L-`）
  - name: tasks.yaml
    title: タスク
    datastore: YAML
    summary: 検討事項を決めるための作業と「後でやっといて」
    primary_key: id
    scale: ~1000
    access: 全件
    deletion: 消さず、状態を `中止` にする
    columns:
      - name: kind
        title: 種類
        type: string
        not_null: true
        enum_values: 作業 / 調査 / 検証
        description: タスクの種類
      - name: status
        title: 状態
        type: string
        not_null: true
        enum_values: 未着手 / 進行中 / 保留 / 完了 / 中止
        description: タスクの状態
      - name: for
        title: 進める検討事項
        type: array
        description: このタスクが進める検討事項の ID（`D-`）
      - name: depends_on
        title: 前提
        type: array
        description: 先に終わっている必要があるタスクの ID（`T-`）
      - name: reason
        title: 理由
        type: string
        description: 積んだ理由・保留や中止の理由
      - name: result
        title: 結果
        type: string
        description: 終えたときの結果
  - name: research.yaml
    title: 調査
    datastore: YAML
    summary: 調べた結果
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: question
        title: 問い
        type: string
        not_null: true
        description: 何を調べたか
      - name: conclusion
        title: 結論
        type: string
        description: 調べた結論
      - name: confidence
        title: 確度
        type: string
        enum_values: 高 / 中 / 低
        description: 結論の確からしさ
      - name: angles
        title: 調査の観点
        type: array
        description: 調べた観点
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）'
  - name: docs.yaml
    title: 資料
    datastore: YAML
    summary: 会話の中で作った図・文書。納品物もこの中で印を付ける
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: kind
        title: 種類
        type: string
        not_null: true
        description: 図 / 文書 など（自由な文字列）
      - name: deliverable
        title: 納品物か
        type: boolean
        not_null: true
        default: 'false'
        description: ゴールでリリースする納品物か
      - name: status
        title: 状態
        type: string
        not_null: true
        default: 下書き
        description: 資料の状態。納品物は `完成` でできたとみなす
        enum_values: 下書き / 確認中 / 完成
      - name: body
        title: 本文
        type: string
        not_null: true
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）'
  - name: terms.yaml
    title: 用語集
    datastore: YAML
    summary: 話し合いの中で決めた言い方
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: meaning
        title: 意味
        type: string
        not_null: true
        description: 用語の意味（`title` が用語）
      - name: aliases
        title: 別名
        type: array
        description: 同じものを指す別の言い方
      - name: avoid
        title: 使わない表記
        type: array
        description: やめた言い方
  - name: notes.yaml
    title: メモ
    datastore: YAML
    summary: 検討事項にしない覚え書き（脱線で調べたことはタグ `脱線`）
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: content
        title: 内容
        type: string
        not_null: true
        description: メモの中身
  - name: logs.yaml
    title: 会話ログ
    datastore: YAML
    summary: 会話の要約と残しておきたい言葉。後から書き換えない
    primary_key: id
    scale: ~1000
    growth: 会話ごとに足す
    access: 全件
    deletion: 消さない
    columns:
      - name: date
        title: 日付
        type: string
        not_null: true
        description: 会話の日（`YYYY-MM-DD`）
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）。`related` はこの会話で更新した項目'
  - name: docs/{ID}.md
    title: 本文
    datastore: Markdown
    summary: 項目の本文。メタデータは持たず、YAML の `body` から指される
    access: ファイル名で引く
    columns:
      - name: (本文)
        title: 本文
        type: string
        description: Markdown の本文。front matter を持たない。書き込みは `add` / `update` が行い、ファイル名は項目の ID に揃える
  - name: mindstella-version.ini
    title: 版
    datastore: テキスト
    summary: ワークスペースを最後に整えたときのプラグインの版
    scale: 1 行
    access: 全件
    description: '`init` が作るときに書き、`migrate --record` が移し替えた後に書き換える。無ければ版を記録する前の形式として扱う'
    columns:
      - name: (1 行目)
        title: 版
        type: string
        not_null: true
        description: '`v{メジャー}.{マイナー}.{パッチ}`。2 行目より後は読まない'
        example: v0.3.0
  - name: submissions.yaml
    title: 送信
    datastore: YAML
    summary: プレビューの詳細パネルから送られた、項目ごとの回答・意見
    primary_key: id
    scale: ~1000
    growth: 画面から送るたびに 1 件足す
    deletion: 消さず、取り込んだら `taken` に日時を書く
    access: 全件
    description: '`items:` の配列を持ち、1 要素 = 1 件の送信。初めて送ったときにサーバーが作り、無ければ送信 0 件として扱う。書くのはサーバーの送信（`POST /api/submissions`）と `take_submission` だけで、`add`・`update` の対象にしない。共通のキー（`common.schema.json`）は持たない'
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: '`S-` + 連番。連番は最大 + 1 で、番号を使い回さない'
        example: S-3
      - name: target
        title: 向けた項目
        type: string
        not_null: true
        description: 回答・意見を向けた項目の ID（どの種類でもよい）。送ったときにワークスペースにあった項目
        example: D-22
      - name: body
        title: 本文
        type: string
        not_null: true
        description: 回答・意見の本文。前後の空白を除いて 1〜10000 文字
        example: 案 A にする
      - name: sent
        title: 送った日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-04T03:00:00+00:00'
      - name: taken
        title: 取り込んだ日時
        type: string
        not_null: false
        description: 取り込んだ日時（UTC のタイムゾーン付き ISO 8601）。取り込んでいなければ `null`
  - name: .mindstella.lock
    title: 書き換えのロック
    datastore: テキスト
    summary: 同じワークスペースを書き換えるプロセスどうしの排他に使う空のファイル
    scale: 1 件
    deletion: 消さない
    access: '`fcntl.flock` の排他ロックだけを取り、中身は読み書きしない'
    description: 書き換えるツールと送信の受け付けが初めてロックを取るときに作る。点検・書き換えの知らせ・移し替えの対象にしない
    columns:
      - name: (中身)
        title: 中身
        type: string
        description: 空。ロックの対象としてだけ使う
  - name: changes.yaml
    title: 書き換えのまとまり
    datastore: YAML
    summary: '`commit` でまとめた書き換えのまとまりと、まだまとめていない変更'
    scale: ~1000
    growth: ステップごとに `commit` で 1 件足す
    deletion: 消さない
    access: 全件
    description: '`add`・`update`・`adopt` が初めて書き換えたときにサーバーが作り、無ければまとまり 0 件・まだまとめていない変更なしとして扱う。まとまりに入る項目の変更履歴は、1 つ前のまとまりの `until_seq` より大きく、そのまとまりの `until_seq` 以下の `seq` を持つもの。`add`・`update` の対象にしない'
    columns:
      - name: last_seq
        title: 最後の通し番号
        type: number
        not_null: true
        description: 最後に積んだ変更履歴の `seq`。積むたびに 1 足す
      - name: sets
        title: まとまり
        type: array
        not_null: true
        description: 新しい順。要素は `id`（`C-` + 連番）・`at`（まとめた日時）・`summary`（一言の説明）・`until_seq`（まとめたときの `last_seq`）・`added`（足した項目の ID）・`changed`（変えた項目の ID。足した項目は入れない）
      - name: pending
        title: まだまとめていない変更
        type: object
        not_null: true
        description: '`added`・`changed`（書き換えた順の ID）。保持する回数が 0 の書き換えは `changed` に入れない'
  - name: .mindstella-opened
    title: 前回開いた日時
    datastore: テキスト
    summary: プレビューを最後に開いた日時
    scale: 1 行
    access: 全件
    description: プレビューのタブが開いたときにサーバーが書き換える（『前回開いた日時』）。書き換えの知らせ・点検・移し替えの対象にしない
    columns:
      - name: (1 行目)
        title: 日時
        type: string
        not_null: true
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-04T13:05:00+00:00'

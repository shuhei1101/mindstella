title: "ER 図: ワークスペース"
lead: 1 つの話し合いのフォルダ（ワークスペース）が持つ YAML の形。正本は `plugins/mindstella/skills/mindmap/schemas/` の JSON Schema で、書き込む前に突き合わせる。ファイルとフォルダ（`docs/`・`release/` を含む）は全てワークスペースの直下の記録のフォルダ `.mindstella/` に置き、表の物理名は `.mindstella/` からのパス。画面はサーバーの配信で開き、ワークスペースには置かない。直下には `.mindstella/` のほかに、このフォルダの起動・接続のコマンドとプレビューの URL を一覧にした `README.md` をサーバーが書く（記録ではなく、1 行目の自動で書いた印を確かめるほかにどのツールも読まない）。
er:
  entities:
    - name: 設定
    - name: 検討事項
    - name: タスク
    - name: 調査
    - name: 資料
    - name: 用語集
    - name: メモ
    - name: 会話ログ
    - name: 本文
    - name: 送信
    - name: レビュー中のコメント
    - name: 書きかけ
  relations:
    - from: 設定
      to: 検討事項
      cardinality: '||--o{'
      label: 対象・カテゴリー・フェーズで振り分ける
    - from: 検討事項
      to: 検討事項
      cardinality: '}o--o{'
      label: depends_on・parent
    - from: 検討事項
      to: タスク
      cardinality: '||--o{'
      label: for で進められる
    - from: 会話ログ
      to: 検討事項
      cardinality: '}o--o{'
      label: sources
    - from: 検討事項
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 調査
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 資料
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 会話ログ
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 送信
      to: 検討事項
      cardinality: '}o--o|'
      label: target（どの種類の項目も指す。無ければ項目に紐づかない）
    - from: レビュー中のコメント
      to: 検討事項
      cardinality: '}o--o|'
      label: target（送信と同じ）
    - from: 書きかけ
      to: 検討事項
      cardinality: '}o--o|'
      label: target（送信と同じ）
    - from: レビュー中のコメント
      to: 送信
      cardinality: '||--o|'
      label: まとめて送ると移る
    - from: タスク
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: 用語集
      to: 本文
      cardinality: '||--o|'
      label: body
    - from: メモ
      to: 本文
      cardinality: '||--o|'
      label: body
tables:
  - name: config.yaml
    title: 設定
    datastore: YAML
    summary: 題名・話し合いの概要・プレイブック・最上位の軸の呼び名・フェーズ・対象とカテゴリー・ゴール・関連する場所・変更履歴を保持する回数・表示の既定・プレビューの配信のポート
    scale: 1 件
    access: 全件
    columns:
      - name: playbooks
        title: プレイブック
        type: array
        not_null: true
        description: 並べて使う進め方ガイドの名前。1 件以上・重複なし。AI は並べたガイドをすべて読む
        example: '[壁打ち, システム開発]'
      - name: target_label
        title: 最上位の軸の呼び名
        type: string
        not_null: true
        description: 対象を画面で何と呼ぶか
        example: システム
      - name: phases
        title: フェーズ
        type: array
        not_null: true
        description: フェーズの名前を浅い順に並べる。`next` の並べ替えはこの順を使う。プレイブックを複数並べても 1 本の並びで持つ。項目の `phase` と `goal.phase` はこのどれか（点検が確かめる）
        example: '[目的, 要件, 構成]'
      - name: targets
        title: 対象
        type: array
        not_null: true
        description: 要素は `name`・`summary`
      - name: categories
        title: カテゴリー
        type: array
        not_null: true
        description: 要素は `name`・`target`（`targets[].name` のどれか）・`summary`
      - name: goal
        title: ゴール
        type: object
        not_null: false
        description: 任意。`phase`（どのフェーズまでやるか）・`summary`・`deliverables[]`（`title` と、できた資料の `doc`（`A-` の ID。任意））。無いときはゴールを決めていない話し合い
      - name: links
        title: 関連する場所
        type: array
        description: 要素は `title`・`url`
      - name: summary
        title: 題名
        type: string
        not_null: true
        description: 話し合いの題名（何についての話し合いかを 1 文で）。プレビューのトップバーに出す
        example: 要件出しのスキル mindmap を設計する
      - name: description
        title: 話し合いの概要
        type: string
        not_null: false
        length: 1 字以上 60 字以内
        description: 任意。何についての話し合いかを 1 文の短い文で。AI がセットアップと範囲の見直しで書き、利用者は `config.yaml` を直して書き換える。プレビューの概要の画面の題名の上に出す。題名（`summary`）・ゴールの概要（`goal.summary`）とは別のもの
        example: スキル mindmap の記録の形とプレビューの画面を、作り始められるところまで決める話し合い。
      - name: history_limit
        title: 保持する回数
        type: number
        default: '5'
        description: 項目ごとに変更履歴を何回分持つか。0 以上の整数で上限は設けない。0 は変更履歴を持たず、差分を出さない。無ければ 5 として扱う。AI がまだ読んでいない回（`changes.yaml` の `read_seq` より後の回）は、この回数を超えても消さない
        example: '3'
      - name: display
        title: 表示の既定
        type: object
        description: 任意。プレビューのワークスペースの既定。`network_look`（ネットワークの見た目。`glow`・`starlight`・`constellation`・`deep`・`dust` のどれか。無ければ `deep`）と `visible_kinds`（表示する種類。`decisions`・`tasks`・`research`・`docs`・`terms`・`notes`・`logs` の重複しない配列。無ければ全ての種類）を持つ。利用者の個人の上書き（ブラウザの `localStorage`）が無い項目に使う。`update_settings` と画面の『設定の既定の書き換え』が書く
        example: '{network_look: deep, visible_kinds: [decisions, tasks, research, docs, terms, notes, logs]}'
      - name: preview
        title: プレビューの配信
        type: object
        description: 任意。`port`（配信が `127.0.0.1` で待ち受けるポート。1〜65535 の整数。無ければ OS が選んだ空きポート）を持つ。外の入口（トンネル・リバースプロキシ）にポートを 1 回だけ登録するときに書く。配信を立てるときだけ読み、『設定の再読み込み』では待ち受けを変えない（Claude Code を開き直して立て直すと効く）
        example: '{port: 47800}'
  - name: plugins/mindstella/skills/mindmap/schemas/common.schema.json
    title: 共通のキー
    datastore: JSON
    summary: 種類ごとの YAML の項目が共通で持つキー（各種類のスキーマが `$ref` で指す）
    description: 種類ごとの YAML はどれも `items:` の配列を持ち、1 要素 = 1 項目。この表のキーは全ての種類の項目が持つ。
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: 種類の頭の文字 + `-` + 連番。頭の文字で種類が決まる（D 検討事項 / T タスク / R 調査 / A 資料 / G 用語集 / N メモ / L 会話ログ）。連番はその種類の最大 + 1 で、消した番号を使い回さない
        example: D-12
      - name: title
        title: タイトル
        type: string
        not_null: true
        description: 題
      - name: target
        title: 対象
        type: string
        description: 設定の `targets[].name` のどれか
      - name: category
        title: カテゴリー
        type: string
        description: 設定の `categories[].name` のどれか
      - name: phase
        title: フェーズ
        type: string
        description: 設定の `phases` のどれか
      - name: tags
        title: タグ
        type: array
        description: 自由な文字列
      - name: attrs
        title: 属性
        type: object
        description: 自由なキーと値（値は文字列・数値・真偽値）。使っているキーの名前は `attrs` のコマンドで引く
      - name: related
        title: 関連
        type: array
        description: 関連する項目の ID。向きを持たず、`impact` はたどらない
      - name: links
        title: リンク
        type: array
        description: 要素は `title`・`url`
      - name: created
        title: 作成日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-02T08:00:00+00:00'
      - name: updated
        title: 更新日時
        type: string
        not_null: true
        auto: 更新日時
        description: UTC のタイムゾーン付き ISO 8601
      - name: history
        title: 変更履歴
        type: array
        description: '`update`・`adopt`・案の書き換えが値を変えるたびに先頭に 1 要素を足し、新しい順に並べる。要素は `seq`（`changes.yaml` の通し番号）・`at`（書き換えた日時）・`by`（その回を書き換えたのが `ai` か `user` か。このキーを入れる前に積んだ回は持たない）・`before`（変わったキー → 書き換える前の値。前に無かったキーは `null`）・`body_diff`（本文が変わったときだけ。要素は `line`（その書き換えの後の本文の 1 始まりの行）・`now`（そこからの今の行の並び）・`before`（置き換える前の行の並び））。後ろの行から当てると前の本文になる。`updated`・`updated_by`・`history`・`history_dropped_seq`・`seq`・`added_seq`・`body` は `before` に入れず、本文の全文も持たない。数は設定の `history_limit` までで、超えた古い要素は次に積むときに消す。ただし `changes.yaml` の `read_seq` より大きい `seq` の要素（AI がまだ読んでいない回）は、超えても消さない。無ければ変更履歴 0 回分として扱う。ツールが付け、`add`・`update` の `item` では渡せない'
      - name: history_dropped_seq
        title: 消した変更履歴の通し番号
        type: number
        not_null: false
        description: 保持する回数を超えて `history` から消した要素のうち、最も大きい `seq`。消すたびに大きい方へ書き換える。差分の表示で、選んだ時点の範囲の中の回が消えたかを見分けるのに使う。一度も消していなければキーを持たない。ツールが付け、`add`・`update` の `item` では渡せない
        example: '5'
      - name: seq
        title: 最後に振った通し番号
        type: number
        not_null: false
        description: その項目を足した・値を変えたときに振った `changes.yaml` の通し番号のうち、最も新しいもの。『前回読んだ時点からの変更』が `read_seq` と比べる。フェーズ・対象・カテゴリーの付け替えでは進めない。このキーを入れる前に足した項目は、次に値を変えるまでキーを持たない。ツールが付け、`add`・`update` の `item` では渡せない
        example: '14'
      - name: added_seq
        title: 足したときの通し番号
        type: number
        not_null: false
        description: その項目を足したときに振った `changes.yaml` の通し番号。『前回読んだ時点からの変更』が、読んだ時点より後に足した項目と変えた項目を分けるのに使う。このキーを入れる前に足した項目は持たない。ツールが付け、`add`・`update` の `item` では渡せない
        example: '14'
      - name: updated_by
        title: 編集した人
        type: string
        description: 最後に項目を足した・値を変えたのが AI か利用者か。`ai`（MCP のツールの書き込み）か `user`（画面からの編集）。`updated` を書き換える全ての書き込み（`update_settings` のフェーズ・対象・カテゴリーの付け替えを含む）が一緒に書く。このキーを入れる前に書いた項目は、次に書き換えるまで持たず、編集した人が分からないものとして扱う。ツールが付け、`add`・`update` の `item` では渡せない
        example: ai
  - name: decisions.yaml
    title: 検討事項
    datastore: YAML
    summary: 問いと答えの単位（未決定のものも入る）
    primary_key: id
    scale: ~1000
    access: 全件
    deletion: 消さず、状態を `取り下げ` か `対象外` にする
    columns:
      - name: status
        title: 状態
        type: string
        not_null: true
        enum_values: 未決定 / 決定済み / 要見直し / 保留 / 未整理 / 対象外 / 取り下げ
        description: 検討事項の状態
      - name: lead
        title: 問いの説明
        type: string
        description: 何を決める問いか
      - name: answer
        title: 答え
        type: string
        description: 決まった答え
      - name: options
        title: 案
        type: array
        description: 要素は `key`（記号）・`content`・`pros`・`cons`・`note`・`adopted`（真偽値）・`recommended`（真偽値。AI が推す案の印）・`reason`。`adopted` が真の案と `recommended` が真の案は、それぞれ 0 か 1 つ。状態との決まりはこの表の説明
      - name: weight
        title: 影響度
        type: string
        enum_values: 大 / 中 / 小
        description: 派生の多さ
      - name: parent
        title: 派生元
        type: string
        description: この検討事項が派生した検討事項の ID（`D-`）
      - name: depends_on
        title: 前提
        type: array
        description: 先に決まっている必要がある検討事項の ID（`D-`）。保留の待ち先もここで持つ
      - name: reason
        title: 理由
        type: string
        description: 決めた理由・保留や取り下げの理由
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）'
        example: D-12.md
      - name: sources
        title: 経緯
        type: array
        description: 決めた会話ログの ID（`L-`）
    description: |-
      案と状態の決まり（書き込むツールと読み込みの検証、点検が見る）:

      | 決まり | 合わないときの理由の行 |
      | --- | --- |
      | `未整理`・`対象外`・`取り下げ` を除く状態は、`options` を 1 つ以上持つ | `{ID} は状態 {状態} のため案を 1 つ以上持つ（options に案を書く）` |
      | `決定済み` は、`adopted` が真の案を 1 つ持つ | `{ID} は決定済みなのに採用した案を持たない（adopt で案を採用する）` |
      | `adopted` が真の案を持つ検討事項は `未決定` にしない（方針転換で `要見直し` にした検討事項は、前に採用した案を持ったままでよい） | `{ID} は採用した案 {記号} を持つのに未決定（adopt で決定済みにするか、採用を外す）` |

      理由の行は、スキーマに合わない箇所と同じ `decisions.yaml: items[{番号}].{options か status}: {理由}` の形で返す。
  - name: tasks.yaml
    title: タスク
    datastore: YAML
    summary: 検討事項を決めるための作業と「後でやっといて」
    primary_key: id
    scale: ~1000
    access: 全件
    deletion: 消さず、状態を `中止` にする
    columns:
      - name: kind
        title: 種類
        type: string
        not_null: true
        enum_values: 作業 / 調査 / 検証
        description: タスクの種類
      - name: status
        title: 状態
        type: string
        not_null: true
        enum_values: 未着手 / 進行中 / 保留 / 完了 / 中止
        description: タスクの状態
      - name: for
        title: 進める検討事項
        type: array
        description: このタスクが進める検討事項の ID（`D-`）
      - name: depends_on
        title: 前提
        type: array
        description: 先に終わっている必要があるタスクの ID（`T-`）
      - name: reason
        title: 理由
        type: string
        description: 積んだ理由・保留や中止の理由
      - name: result
        title: 結果
        type: string
        description: 終えたときの結果
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）。経緯や補足を残す'
        example: T-3.md
  - name: research.yaml
    title: 調査
    datastore: YAML
    summary: 調べた結果
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: question
        title: 問い
        type: string
        not_null: true
        description: 何を調べたか
      - name: conclusion
        title: 結論
        type: string
        description: 調べた結論
      - name: confidence
        title: 確度
        type: string
        enum_values: 高 / 中 / 低
        description: 結論の確からしさ
      - name: angles
        title: 調査の観点
        type: array
        description: 調べた観点
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）'
      - name: withdrawn
        title: 取り下げ
        type: boolean
        description: やめた項目を記録に残したまま取り下げた印。取り下げていなければキーを持たない
      - name: reason
        title: 理由
        type: string
        description: 取り下げた理由
  - name: docs.yaml
    title: 資料
    datastore: YAML
    summary: 会話の中で作った図・文書。納品物もこの中で印を付ける
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: kind
        title: 種類
        type: string
        not_null: true
        description: 図 / 文書 など（自由な文字列）
      - name: deliverable
        title: 納品物か
        type: boolean
        not_null: true
        default: 'false'
        description: ゴールでリリースする納品物か
      - name: status
        title: 状態
        type: string
        not_null: true
        default: 下書き
        description: 資料の状態。納品物は `完成` でできたとみなす
        enum_values: 下書き / 確認中 / 完成
      - name: body
        title: 本文
        type: string
        not_null: true
        description: '`docs/` の本文のファイル名。拡張子で本文の形式を表し、Markdown は `{ID}.md`、HTML は `{ID}.html`。どちらか 1 つだけを指す'
        check: '`/`・`\` を含まず `.md` か `.html` で終わる（ほかの種類の `body` は `.md` だけ）'
        example: A-3.html
      - name: withdrawn
        title: 取り下げ
        type: boolean
        description: やめた項目を記録に残したまま取り下げた印。取り下げていなければキーを持たない
      - name: reason
        title: 理由
        type: string
        description: 取り下げた理由
  - name: terms.yaml
    title: 用語集
    datastore: YAML
    summary: 話し合いの中で決めた言い方
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: meaning
        title: 意味
        type: string
        not_null: true
        description: 用語の意味（`title` が用語）
      - name: aliases
        title: 別名
        type: array
        description: 同じものを指す別の言い方
      - name: avoid
        title: 使わない表記
        type: array
        description: やめた言い方
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）。経緯や補足を残す'
        example: G-2.md
      - name: withdrawn
        title: 取り下げ
        type: boolean
        description: やめた項目を記録に残したまま取り下げた印。取り下げていなければキーを持たない
      - name: reason
        title: 理由
        type: string
        description: 取り下げた理由
  - name: notes.yaml
    title: メモ
    datastore: YAML
    summary: 検討事項にしない覚え書き（脱線で調べたことはタグ `脱線`）
    primary_key: id
    scale: ~100
    access: 全件
    columns:
      - name: content
        title: 内容
        type: string
        not_null: true
        description: メモの中身
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）。経緯や補足を残す'
        example: N-4.md
      - name: withdrawn
        title: 取り下げ
        type: boolean
        description: やめた項目を記録に残したまま取り下げた印。取り下げていなければキーを持たない
      - name: reason
        title: 理由
        type: string
        description: 取り下げた理由
  - name: logs.yaml
    title: 会話ログ
    datastore: YAML
    summary: 会話の要約と残しておきたい言葉。後から書き換えない
    primary_key: id
    scale: ~1000
    growth: 会話ごとに足す
    access: 全件
    deletion: 消さない
    columns:
      - name: date
        title: 日付
        type: string
        not_null: true
        description: 会話の日（`YYYY-MM-DD`）
      - name: body
        title: 本文
        type: string
        description: '`docs/` の本文の Markdown のファイル名（`{ID}.md`）。`related` はこの会話で更新した項目'
      - name: withdrawn
        title: 取り下げ
        type: boolean
        description: やめた項目を記録に残したまま取り下げた印。取り下げていなければキーを持たない
      - name: reason
        title: 理由
        type: string
        description: 取り下げた理由
  - name: docs/{ID}.md
    title: 本文
    datastore: Markdown
    summary: 項目の本文。メタデータは持たず、YAML の `body` から指される
    access: ファイル名で引く
    columns:
      - name: (本文)
        title: 本文
        type: string
        description: Markdown の本文。front matter を持たない。書き込みは `add` / `update` が行い、ファイル名は項目の ID に揃える
  - name: mindstella-version.ini
    title: 版
    datastore: テキスト
    summary: ワークスペースを最後に整えたときのプラグインの版
    scale: 1 行
    access: 全件
    description: '`init` が作るときに書き、`migrate --record` が移し替えた後に書き換える。無ければ、ワークスペースの直下の版のファイル（v0.6.0 より前の置き場所）を読み、それも無ければ版を記録する前の形式として扱う'
    columns:
      - name: (1 行目)
        title: 版
        type: string
        not_null: true
        description: '`v{メジャー}.{マイナー}.{パッチ}`。2 行目より後は読まない'
        example: v0.3.0
  - name: submissions.yaml
    title: 送信
    datastore: YAML
    summary: プレビューのコメントの一覧からまとめて送られた、項目・箇所へのコメントと項目に紐づかないコメント
    primary_key: id
    scale: ~1000
    growth: コメントの一覧からまとめて送るたびに、送った件数を足す
    deletion: 消さず、取り込んだら `taken` に日時を書く
    access: 全件
    description: '`items:` の配列を持ち、1 要素 = 1 件の送信。初めて送ったときにサーバーが作り、無ければ送信 0 件として扱う。書くのはサーバーのまとめて送る（`POST /api/comments/send`）と `take_submission` だけで、`add`・`update` の対象にしない。共通のキー（`common.schema.json`）は持たない。`target` と `loc` を持たない前の版の送信もそのまま読める（移し替えの手順は要らない）'
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: '`S-` + 連番。連番は最大 + 1 で、番号を使い回さない'
        example: S-3
      - name: target
        title: 向けた項目
        type: string
        not_null: false
        description: コメントを向けた項目の ID（どの種類でもよい）。送ったときにワークスペースにあった項目。項目に紐づかないコメントはキーを持たない
        example: D-22
      - name: body
        title: 本文
        type: string
        not_null: true
        description: コメントの本文。前後の空白を除いて 1〜10000 文字
        example: 案 A にする
      - name: sent
        title: 送った日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-04T03:00:00+00:00'
      - name: taken
        title: 取り込んだ日時
        type: string
        not_null: false
        description: 取り込んだ日時（UTC のタイムゾーン付き ISO 8601）。取り込んでいなければ `null`
      - name: loc
        title: 箇所
        type: object
        not_null: false
        description: 選んだ箇所。`kind`・`start`・`end`・`key`・`text` の形はレビュー中のコメント（`comments.yaml`）の `loc` と同じ。箇所を持たないコメントはキーを持たない。`target` を持つときだけ持つ
      - name: comment
        title: 元のコメント
        type: string
        not_null: false
        description: 送ったレビュー中のコメントの ID。まとめて送る途中で落ち、同じコメントがレビュー中に残ったとき、次に送ったときに二重に足さないために持つ。前の版の送信はキーを持たない
        example: C-1
  - name: .mindstella.lock
    title: 書き換えのロック
    datastore: テキスト
    summary: 同じワークスペースを書き換えるプロセスどうしの排他に使う空のファイル
    scale: 1 件
    deletion: 消さない
    access: '`fcntl.flock` の排他ロックだけを取り、中身は読み書きしない'
    description: 書き換えるツールと、送信・レビュー中のコメント・書きかけの受け付けが初めてロックを取るときに作る。点検・書き換えの知らせ・移し替えの対象にしない
    columns:
      - name: (中身)
        title: 中身
        type: string
        description: 空。ロックの対象としてだけ使う
  - name: changes.yaml
    title: 書き換えのまとまり
    datastore: YAML
    summary: '`commit` でまとめた書き換えのまとまりと、まだまとめていない変更'
    scale: ~1000
    growth: ステップごとに `commit` で 1 件足す
    deletion: 消さない
    access: 全件
    description: '`add`・`update`・`adopt`・`remove` が初めて書き換えたときにサーバーが作り、無ければまとまり 0 件・まだまとめていない変更なしとして扱う。まとまりに入る項目の変更履歴は、1 つ前のまとまりの `until_seq` より大きく、そのまとまりの `until_seq` 以下の `seq` を持つもの。`sets[].removed`・`pending.removed` は消した項目のただ 1 つの記録で、新しい ID を振るときに消した ID を避けるのにも使う。`add`・`update` の対象にしない'
    columns:
      - name: last_seq
        title: 最後の通し番号
        type: number
        not_null: true
        description: 最後に振った通し番号。変更履歴を積むとき・項目を足すとき・項目を消すとき・保持する回数が 0 で変更履歴を積まずに値を変えるときに 1 足す
      - name: sets
        title: まとまり
        type: array
        not_null: true
        description: 新しい順。要素は `id`（`V-` + 連番）・`at`（まとめた日時）・`summary`（一言の説明）・`until_seq`（まとめたときの `last_seq`）・`added`（足した項目の ID）・`changed`（変えた項目の ID。足した項目は入れない）・`removed`（消した項目。要素は `pending.removed` と同じ形。消した項目が無いまとまりはキーを持たない）
      - name: pending
        title: まだまとめていない変更
        type: object
        not_null: true
        description: '`added`・`changed`（書き換えた順の ID）と `removed`（消した順。要素は `id`・`kind`（種類）・`title`（消したときのタイトル）・`seq`（消したときに振った通し番号）・`added_seq`（消した項目が持っていた `added_seq`。持たなければ 0））。`removed` は任意で、無ければ消した項目なしとして扱う。保持する回数が 0 の書き換えは `changed` に入れない。最後のまとまりより後に足して消した項目は `added` から除き、`removed` に記録する'
      - name: read_seq
        title: AI が最後に読んだ時点
        type: number
        not_null: false
        description: 『前回読んだ時点からの変更』を最後に呼んだときの `last_seq`。そのツールだけが書き換える。一度も呼んでいなければキーを持たず、そのうちは保持する回数を超えた古い変更履歴を今までどおり消す
        example: '12'
  - name: .mindstella-opened
    title: 前回開いた日時
    datastore: テキスト
    summary: プレビューを最後に開いた日時
    scale: 1 行
    access: 全件
    description: プレビューのタブが開いたときにサーバーが書き換える（『前回開いた日時』）。書き換えの知らせ・点検・移し替えの対象にしない
    columns:
      - name: (1 行目)
        title: 日時
        type: string
        not_null: true
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-04T13:05:00+00:00'
  - name: comments.yaml
    title: レビュー中のコメント
    datastore: YAML
    summary: プレビューで書いて溜め、まだ送っていないコメント
    primary_key: id
    scale: ~100
    growth: 詳細パネル・詳細の全画面・コメントの一覧で溜めるたびに 1 件足す
    deletion: 削除と、まとめて送ったときに物理削除する（送ったものは `submissions.yaml` へ移る）
    access: 全件
    description: 最上位に `seq`（最後に振った連番。振った番号を使い回さないために持つ）と `items:` の配列を持ち、1 要素 = 1 件のコメント。初めて溜めたときにサーバーが作り、無ければ 0 件として扱う。書くのはサーバーのコメントの受け付け（`/api/comments`）だけで、`add`・`update` の対象にしない。共通のキー（`common.schema.json`）は持たない。並びは連番の小さい順（溜めた順）。チェックの状態は画面だけが持ち、ここには書かない
    columns:
      - name: id
        title: ID
        type: string
        not_null: true
        primary_key: true
        auto: 採番
        description: '`C-` + 連番。連番は `seq` + 1。削除したコメントを元に戻すときだけ、同じ ID で戻す'
        example: C-3
      - name: target
        title: 向けた項目
        type: string
        not_null: false
        description: コメントを向けた項目の ID（どの種類でもよい）。項目に紐づかないコメントはキーを持たない
        example: D-22
      - name: loc
        title: 箇所
        type: object
        not_null: false
        description: 選んだ箇所。箇所を持たないコメントはキーを持たない。`target` を持つときだけ持つ
      - name: loc.kind
        title: 箇所の種類
        type: string
        not_null: true
        description: '`body`（本文の文を選んだ）か `value`（項目の値を選んだ）'
        example: body
      - name: loc.start
        title: 始めの行
        type: number
        not_null: false
        description: '`body` のとき。本文の Markdown の行（1 始まり）'
        example: '2'
      - name: loc.end
        title: 終わりの行
        type: number
        not_null: false
        description: '`body` のとき。本文の Markdown の行（1 始まり）。`start` 以上'
        example: '2'
      - name: loc.key
        title: 値のキー
        type: string
        not_null: false
        description: '`value` のとき。項目のキーのパス。案の中は `options[{案の key}].{キー}`'
        example: options[B].cons
      - name: loc.text
        title: 選んだ文
        type: string
        not_null: true
        description: 画面で選んだ文（描いた文のまま）。前後の空白を除いて 1〜10000 文字
        example: 言い換えたい文
      - name: body
        title: 本文
        type: string
        not_null: true
        description: コメントの本文。前後の空白を除いて 1〜10000 文字
        example: ここは言い換える
      - name: created
        title: 溜めた日時
        type: string
        not_null: true
        auto: 作成日時
        description: UTC のタイムゾーン付き ISO 8601。元に戻したときは元の日時
        example: '2026-10-05T03:00:00+00:00'
  - name: drafts.yaml
    title: 書きかけ
    datastore: YAML
    summary: コメントの入力欄に書いて、まだ溜めていない本文
    primary_key: (target, loc)
    scale: ~100
    growth: 入力欄に書くたびに、向けた先ごとに 1 件を書き換える
    deletion: 溜めたとき・入力欄を空にしたときに物理削除する
    access: 全件
    description: '`items:` の配列を持ち、1 要素 = 1 つの入力欄の書きかけ。向けた先（`target` と `loc` の組）ごとに 1 件。初めて書きかけを保つときにサーバーが作り、無ければ 0 件として扱う。書くのはサーバーの書きかけの保存（`PUT /api/drafts`）とコメントの追加だけで、`add`・`update` の対象にしない。共通のキー（`common.schema.json`）は持たない'
    columns:
      - name: target
        title: 向けた項目
        type: string
        not_null: false
        description: 入力欄が向ける項目の ID。項目に紐づかないコメントの入力欄はキーを持たない
        example: D-22
      - name: loc
        title: 箇所
        type: object
        not_null: false
        description: 入力欄に添えた箇所。形は `comments.yaml` の `loc` と同じ
      - name: body
        title: 本文
        type: string
        not_null: true
        description: 書きかけの本文。1〜10000 文字（空白だけも保つ）
        example: 案 B も見たい
      - name: updated
        title: 書いた日時
        type: string
        not_null: true
        auto: 更新日時
        description: UTC のタイムゾーン付き ISO 8601
        example: '2026-10-05T03:00:00+00:00'
  - name: docs/{ID}.html
    title: HTML の本文
    datastore: HTML
    summary: 資料の HTML の本文。メタデータは持たず、`docs.yaml` の `body` から指される
    access: ファイル名で引く
    columns:
      - name: (本文)
        title: 本文
        type: string
        description: HTML の本文（文書全体でも断片でもよい）。書き込みは `add` / `update` の `body_html` が行い、ファイル名は項目の ID に揃える。サーバーは中身を解釈・実行せず、画面はスクリプトを動かさない枠に描く。同じ項目の `{ID}.md` とは並んで持たない

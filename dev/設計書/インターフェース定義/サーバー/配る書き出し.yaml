title: "配る書き出し"
entry:
  kind: mcp_tool
  value: '`export`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__export`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 記録・画面・描画のライブラリ・ライセンスの表示を中に持つ 1 枚の HTML を out へ書き出す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて MCP のクライアントでツールを呼び、描画のライブラリの配布ファイルとライセンスの本文は jsDelivr から取る）
      - name: make_workspace
        description: 7 つの種類を 1 件ずつ持ち、資料 A-1 の本文に `</script>` を含むワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as ワークスペース
        participant CDN as jsDelivr
        participant OUT as 書き出す先

        クライアント->>IF: export workspace out
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: スキーマと突き合わせる
        IF-->>CDN: 雛形が指す配布ファイルとライセンスの本文を取る
        IF->>IF: 配布ファイルを integrity と突き合わせ、雛形に画面・描画のライブラリ・ライセンスの表示・データを入れる
        IF->>OUT: HTML を書く
        IF-->>クライアント: JSON（path）
      ```
    expected:
      - ツールのエラーにならない
      - '`path` が `配る.html` の絶対パス'
      - '`配る.html` の `mindmap-data` の中身を JSON として読むと、`settings` と 7 つの種類の項目が YAML と同じで、`bodies` に `A-1.md` の本文、`changes` に書き換えのまとまりがある'
      - '`配る.html` の `script`・`link`・`img` に `src`・`href` を持つものが無い'
      - '`配る.html` の中の `</script>` の数が、雛形の数にライセンスの表示の要素の 1 つを足した数（本文の `</script>` で要素が閉じていない）'
      - '`mindmap-licenses` の中身に、marked・DOMPurify・elkjs・mermaid・jsdiff のそれぞれの名前・版・著作権の表示・ライセンスの名前があり、elkjs のソースコードの入手先の URL がある'
    test: test_normal
  - name: 異常系（out の末尾が .html でない・引数の誤り）
    summary: 書き出す先の末尾が .html でないと、何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
        notes: '`out` はワークスペースの外の一時フォルダの `配る.txt`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）

        クライアント->>IF: export workspace out（配る.txt）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文に `out` がある
      - '`配る.txt` が無い'
    test: test_error_when_out_not_html
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すと何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
      - name: 書き出す先
        description: 別の一時フォルダの `配る.html`（まだ無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: export workspace out
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
      - '`配る.html` が無い'
    test: test_error_when_workspace_not_found
  - name: 異常系（YAML がスキーマに合わない・SchemaMismatchError）
    summary: 手で崩した YAML があると、前に書き出した out のファイルを残して終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 一度 `export` で書き出した後、`decisions.yaml` の D-1 の `status` を `完了` に直接書き換えたワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの、一度書き出した `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: export workspace out
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文に `decisions.yaml: items[0].status:` で始まる行がある'
      - '`配る.html` の中身が呼ぶ前と同じ'
    test: test_error_when_schema_mismatch
  - name: 異常系（書き出す先のフォルダが無い・WriteFailedError）
    summary: out の親のフォルダが無いと、フォルダを作らずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き出す先
        description: 一時フォルダの中の無いフォルダ `無い/` の `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant OUT as 書き出す先

        クライアント->>IF: export workspace out
        IF-->>OUT: 親のフォルダが無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、`配る.html` のパスを含み、トレースバックを含まない'
      - フォルダ `無い/` が無い
    test: test_error_when_out_dir_missing
  - name: 異常系（ライブラリを取れない・DownloadFailedError）
    summary: jsDelivr に届かないと、何も書かずに終わる
    setup:
      - name: Mock
        description: 環境変数 `HTTPS_PROXY` に届かないアドレスを入れて起動し、jsDelivr への要求を全て失敗させる
        notes: '`HTTPS_PROXY=http://127.0.0.1:9`'
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの、一度書き出した `配る.html`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as export（MCP のツール）
        participant CDN as jsDelivr

        クライアント->>IF: export workspace out
        IF-->>CDN: 配布ファイルを取る（届かない）
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、取れなかった URL を含み、トレースバックを含まない'
      - '`配る.html` の中身が呼ぶ前と同じ'
    test: test_error_when_download_fails
lead: ワークスペースの記録を、画面と描画のライブラリまで中に持つ見るだけの 1 枚の HTML にして、指定したパスへ書き出す。ワークスペースもサーバーもネットも持たない人へ配るために使う。
idempotent: true
side_effects: '`out` のファイルを、同じフォルダの一時ファイルから `os.replace` で置き換える。ワークスペースは読むだけ。プレビューの配信は立てず、ブラウザも開かない。描画のライブラリの配布ファイルとライセンスの本文を jsDelivr から取る'
callers:
  - dev/設計書/インターフェース定義/スキル/話し合いの進行#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: out
    type: str
    required: true
    location: argument
    description: 書き出す HTML のファイルのパス。相対パスは MCP サーバーの作業フォルダ（起動スクリプトが Claude Code を立ち上げたフォルダ）から読む。既にあるファイルは置き換える
    constraints: 末尾が `.html`。親のフォルダがある
    example: ~/渡す/新規事業の検討.html
response:
  - name: path
    type: str
    description: 書き出した HTML の絶対パス
  - name: 埋め込みのデータ
    type: dict
    description: 『記録の取得』のレスポンスと同じ形で、`<script type="application/json" id="mindmap-data">` の中身に入る
  - name: ライセンスの表示
    type: str
    description: '`<script type="text/plain" id="mindmap-licenses">` の中身。中に持つライブラリごとに、名前・版・著作権の表示・ライセンスの名前と本文を並べる。elkjs は EPL-2.0 を選んだ旨と、ソースコードの入手先（リポジトリと版のタグの URL）を持つ。DOMPurify は Apache-2.0 を選ぶ。mermaid は、配布ファイルが中に束ねた依存ごとの名前・版とライセンスの本文も続ける。画面には出さない'
exceptions:
  - name: なし（正常終了）
    condition: 書き出せた
    notes: 結果を返す
  - name: 引数の誤り
    condition: '`out` の末尾が `.html` でない'
    notes: ツールのエラー。何も書き込まない
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `mindmap.yaml` が無い'
    notes: ツールのエラー。何も書き込まない
  - name: SchemaMismatchError
    condition: ワークスペースのどれかの YAML がスキーマに合わないか、YAML として読めない
    notes: ツールのエラー。エラーの本文に合わない箇所。`out` のファイルを書き換えない
  - name: DownloadFailedError
    condition: jsDelivr から配布ファイルかライセンスの本文を取れない（届かない・待ちの上限を超えた・200 以外が返った）か、取った配布ファイルが雛形の `integrity` と合わない
    notes: ツールのエラー。エラーの本文に取れなかった URL と理由。`out` のファイルを書き換えない
  - name: WriteFailedError
    condition: '`out` の親のフォルダが無い、または書き込みか置き換えに失敗した'
    notes: ツールのエラー。エラーの本文に書けなかったパスと理由。親のフォルダは作らず、前の `out` のファイルを残す
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。スキーマに合わないときは、合わない箇所ごとに `{ファイル名}: {キーのパス}: {理由}` の行を続ける。引数の誤りは引数の名前を出す'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 雛形
    constraint: サーバーが配るプレビューと同じ `template.html` と画面の CSS・JavaScript を使い、CSS を `<style>`、JavaScript を `<script>` の中身として差し込む。雛形の描画のライブラリの `<script src>` と文字の `<link>` を外し、`<script src>` の URL から取った配布ファイルの中身を、画面の JavaScript より前の `<script>` の中身として差し込む。記録は `<script type="application/json" id="mindmap-data"></script>` の中身に入れる
  - item: 埋め込みの安全
    constraint: 埋め込む JSON の `<`・`>`・`&` を、それぞれ JSON の Unicode エスケープ（バックスラッシュに続けて `u003c`・`u003e`・`u0026`）に置き換える。`JSON.parse` で元の文字に戻り、本文に `</script>` があっても要素を閉じさせない。差し込む CSS・JavaScript・ライブラリ・ライセンスの本文が `</style>`・`</script`・`<script` を含むときは、書き出さずにエラーにする（大文字・小文字を区別しない）
  - item: 読み込むファイル
    constraint: 書き出した HTML は外のファイルも URL も指さない（`script`・`link`・`img` に `src`・`href` を持たない）。文字は端末の文字で描く
  - item: 見るだけ
    constraint: 画面の JavaScript はサーバーが配るものと同じものを差し込む。記録を埋め込みのデータから読み、コメントのボタン・一覧・入力・選んだ箇所の入口と書き換えの知らせの購読を出さない
  - item: 通信
    constraint: ツールは、雛形の描画のライブラリの `<script src>` の URL（jsDelivr、版を固定）と、ライブラリのライセンスの本文の URL（同じ版）を取るときだけ通信する。取った配布ファイルは雛形の `integrity`（sha384）と突き合わせ、合わなければ書き出さない。書き出した HTML は通信しない
  - item: 待ちの上限
    constraint: 1 回の要求で、接続と 1 回の読み取りをそれぞれ 30 秒まで待つ。取り直さず、届かなければ `DownloadFailedError` で終える
    notes: jsDelivr から 4 つの配布ファイル（最大 5.5MB）とライセンスの本文を取る時間の実測は 1 件あたり最大 0.65 秒（2026-10-03、手元の回線）。待ちは読み取り 1 回ごとに効くので、遅い回線で全体が長くなっても途切れない限り止めない。取り直しは利用者が `export` を呼び直す
refs:
  - dev/設計書/インターフェース定義/サーバー/記録の取得#
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
  - dev/設計書/シナリオ/単一ユースケース/プレビューを配る#
notes:
  書き出すときに取る理由: 書き出す側は Claude Code が動く端末でネットにつながっているため、配布ファイルをリポジトリに同梱せず、書き出すときに jsDelivr から取る（ユーザーの決定）。開く側は書き出した HTML だけで足り、通信しない
  書き出す先を既定にしない理由: ワークスペースの `release/` はゴール判定のたびに `clear_release` が中身を消すため、既定の置き場所にすると配る書き出しが消える。置き場所は利用者が渡したい先で決まるので、`out` を必須にして `session` が利用者に聞く
test_file: tests/integration/server/test_export.py

title: "ゴール判定"
entry:
  kind: mcp_tool
  value: '`goal`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__goal`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系（届いた）
    summary: ゴールのフェーズまでが決着し納品物が揃っていれば、届いたと返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`phases` が 目的 → 要件 → 構成、`goal.phase` が 要件、`goal.deliverables` が A-1 を指すワークスペース'
        notes: 'D-1 `目的`・`決定済み`／D-2 `要件`・`対象外`／D-3 `要件`・`取り下げ`／D-4 `構成`・`未決定`／A-1 `status: 完成`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as goal（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: goal workspace
        IF-->>WS: mindmap.yaml と全ての YAML を読む
        IF->>IF: ゴールのフェーズまでの検討事項と納品物を確かめる
        IF-->>クライアント: JSON
      ```
    expected:
      - ツールのエラーにならない
      - '`reached` が真、`goal_phase` が `要件`、`phases` が `目的`・`要件`'
      - '`remaining_decisions` と `remaining_deliverables` が空（ゴールより後ろの D-4 を含まない）'
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じ
    test: test_normal_when_reached
  - name: 正常系（届いていない）
    summary: 決着していない検討事項と揃っていない納品物を残りとして返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`phases` が 目的 → 要件 → 構成、`goal.phase` が 要件、`goal.deliverables` が「要件定義書」（`doc: A-1`）と「用語集」（`doc` なし）のワークスペース'
        notes: 'D-1 `目的`・`未決定`／D-2 `要件`・`要見直し`／D-3 `要件`・`決定済み`／A-1 `status: 確認中`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as goal（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: goal workspace
        IF-->>WS: mindmap.yaml と全ての YAML を読む
        IF->>IF: 残りを集める
        IF-->>クライアント: JSON
      ```
    expected:
      - ツールのエラーにならない
      - '`reached` が偽'
      - '`remaining_decisions` が D-1・D-2 の順で、それぞれ `phase` と `status` を持つ'
      - '`remaining_deliverables` が「要件定義書」（`doc: A-1`）と「用語集」（`doc: null`）の順'
    test: test_normal_when_not_reached
  - name: 正常系（ゴールが無い）
    summary: ゴールが無いときは判定せず、全フェーズの決着していない検討事項を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`phases` が 目的 → 要件 → 構成で、ゴールを持たないワークスペース'
        notes: D-1 `目的`・`決定済み`／D-2 `構成`・`未決定`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as goal（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: goal workspace
        IF-->>WS: mindmap.yaml と全ての YAML を読む
        IF->>IF: ゴールが無いので全フェーズの残りを集める
        IF-->>クライアント: JSON
      ```
    expected:
      - ツールのエラーにならない
      - '`has_goal` が偽、`reached` と `goal_phase` が `null`'
      - '`phases` が `目的`・`要件`・`構成`'
      - '`remaining_decisions` が D-2 だけ、`remaining_deliverables` が空'
    test: test_normal_when_no_goal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as goal（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: goal workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
lead: ゴールのフェーズまでの検討事項が決着し、ゴールの納品物が揃ったかを判定し、届いたかと残りの項目を返す。ゴールが無いときは判定せず、全フェーズの決着していない検討事項を返す。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
response:
  - name: has_goal
    type: bool
    description: '`mindmap.yaml` がゴールを持つか'
  - name: reached
    type: bool | None
    description: ゴールに届いたか。`remaining_decisions` と `remaining_deliverables` がどちらも空のときだけ真。ゴールが無いときは判定せず `null`
  - name: goal_phase
    type: str | None
    description: '`mindmap.yaml` の `goal.phase`。ゴールが無いときは `null`'
  - name: phases
    type: list[str]
    description: 判定に入れたフェーズ（`phases` の先頭から `goal.phase` まで）。ゴールが無いときは `phases` の全て
  - name: remaining_decisions[]
    type: list[{id, title, phase, status}]
    description: 判定に入れたフェーズの検討事項のうち、決着していないもの
  - name: remaining_deliverables[]
    type: list[{title, doc}]
    description: '`goal.deliverables` のうち、`doc` を持たないか、`doc` が指す資料が `status: 完成` でないもの。`doc` が無いときは `null`。ゴールが無いときは空'
exceptions:
  - name: なし（正常終了）
    condition: 判定できた（届いたかどうかによらない）
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `mindmap.yaml` が無い'
    notes: ツールのエラー
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 決着
    constraint: 検討事項の `決定済み`・`対象外`・`取り下げ`（再開時の状況と同じ）
  - item: 判定に入れる検討事項
    constraint: '`phase` が `phases` の先頭から `goal.phase` までのどれか。それより後ろのフェーズと、`phases` に無いフェーズの項目は入れない'
  - item: 各一覧の並び
    constraint: '`remaining_decisions` はフェーズの順、同じフェーズの中は連番の小さい順。`remaining_deliverables` は `goal.deliverables` の並び'
test_file: tests/integration/server/test_goal.py

title: "ワークスペースの点検"
entry:
  kind: mcp_tool
  value: '`check`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__check`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系（問題が無い）
    summary: 整ったワークスペースで問題 0 件を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: D-1（本文 `docs/D-1.md` あり）と、D-1 に依存する D-2 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: true）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が真で `problems` が空'
    test: test_normal_when_clean
  - name: 正常系（問題がある）
    summary: スキーマ違反・参照切れ・本文のずれを全て返し、ツールのエラーにせずに終える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 次の問題を手で仕込んだワークスペース
        notes: 'D-1: `depends_on: [D-9]`（D-9 は無い）／D-2: `status: 完了`／R-1: `body: R-1.md` だが `docs/R-1.md` が無い／`docs/X-1.md` をどの項目も指さない／送信 S-1: `target: D-8`（D-8 は無い）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: false・problems）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が偽'
      - '`problems` に `broken_ref`（D-1・`depends_on`・`D-9`）がある'
      - '`problems` に `broken_ref`（`submissions.yaml`・S-1・`target`・`D-8`）がある'
      - '`problems` に `schema`（`decisions.yaml`・`items[1].status`）がある'
      - '`problems` に `missing_body`（R-1）と `orphan_body`（`docs/X-1.md`）がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_normal_when_problems_found
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: check workspace
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 正常系（変更履歴が本文とずれている）
    summary: 手で書き換えた本文に当たらない変更履歴を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 本文を持つ検討事項 D-1 の本文を `update` で直した後、`docs/D-1.md` の全ての行を手で書き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: false・problems）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が偽'
      - '`problems` に `stale_history`（D-1・`history[0].body_diff`）がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
lead: ワークスペースのスキーマに合わない箇所・参照切れ・YAML と `docs/` の Markdown のずれを全て洗い出す。
idempotent: true
side_effects: なし（読むだけ。見つけた問題は直さない）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
response:
  - name: ok
    type: bool
    description: 問題が 1 つも無いか
  - name: problems[].kind
    type: '"schema" | "duplicate_id" | "broken_ref" | "missing_body" | "orphan_body" | "stale_history"'
    description: 問題の種類（スキーマに合わない・ID の重複・参照切れ・指す本文が無い・どの項目からも指されない本文・変更履歴から前の本文を組み立てられない）
  - name: problems[].file
    type: str
    description: 問題のあるファイル（ワークスペースからの相対パス）
  - name: problems[].id
    type: str | None
    description: 問題のある項目の ID（`orphan_body` と項目を特定できない `schema` は `null`）
  - name: problems[].key
    type: str | None
    description: 問題のあるキーのパス（`items[0].status`・`depends_on` など）
  - name: problems[].detail
    type: str
    description: 中身（参照先の ID・スキーマの理由など）。前の版の形式（資料の `done`・`mindmap.yaml` の `summary` が無い）で合わない `schema` は、理由に続けて `/mindstella:upgrade` で今の形式に移せることを書く
response_notes: |-
  > [!NOTE]
  > 問題があるときも点検そのものは正常に終えているので、ツールのエラーにせず、同じ形の結果（`ok: false`）を返す。
exceptions:
  - name: なし（正常終了）
    condition: 点検できた
    notes: 結果を返す（問題があるときも）
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `mindmap.yaml` が無い'
    notes: ツールのエラー
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 点検するファイル
    constraint: '`mindmap.yaml`・種類ごとの 7 つの YAML・`submissions.yaml`（無ければ送信 0 件として扱う）・`changes.yaml`（無ければまとまり 0 件として扱う）・`docs/`'
  - item: 参照切れを確かめるキー
    constraint: '`depends_on`・`parent`・`for`・`related`・`sources` と設定の `goal.deliverables[].doc`、送信の `target`、`changes.yaml` の `sets[].added`・`sets[].changed`・`pending.added`・`pending.changed`。存在しない ID と、キーが決めた種類でない ID（`parent` が `D-` 以外など）を `broken_ref` にする'
  - item: 本文のずれ
    constraint: '`body` が指す `docs/` のファイルが無いものを `missing_body`、どの項目の `body` からも指されない `docs/*.md` を `orphan_body` にする'
  - item: 問題の並び
    constraint: ファイル名の順、同じファイルの中は項目の並びの順
  - item: 変更履歴のずれ
    constraint: 本文を持つ項目の `history` を新しいものから順に今の本文へ当て、`body_diff` の `now` の行が当てる先の行と合わないものを `stale_history` にする（ツールを通さずに本文を書き換えたときに起きる）。`key` は合わなかった要素の `history[{位置}].body_diff`、`detail` はその回より前の本文の差分を出せないこと
refs:
  - dev/設計書/ER図/ワークスペース#
test_file: tests/integration/server/test_check.py

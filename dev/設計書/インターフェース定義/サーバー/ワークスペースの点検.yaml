title: "ワークスペースの点検"
entry:
  kind: mcp_tool
  value: '`check`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__check`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系（問題が無い）
    summary: 整ったワークスペースで問題 0 件を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: D-1（本文 `docs/D-1.md` あり）と、D-1 に依存する D-2 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: true）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が真で `problems` が空'
    test: test_normal_when_clean
  - name: 正常系（問題がある）
    summary: スキーマ違反・参照切れ・本文のずれを全て返し、ツールのエラーにせずに終える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 次の問題を手で仕込んだワークスペース
        notes: 'D-1: `depends_on: [D-9]`（D-9 は無い）／D-2: `status: 完了`／R-1: `body: R-1.md` だが `docs/R-1.md` が無い／`docs/X-1.md` をどの項目も指さない／送信 S-1: `target: D-8`（D-8 は無い）'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: false・problems）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が偽'
      - '`problems` に `broken_ref`（D-1・`depends_on`・`D-9`）がある'
      - '`problems` に `broken_ref`（`.mindstella/submissions.yaml`・S-1・`target`・`D-8`）がある'
      - '`problems` に `schema`（`.mindstella/decisions.yaml`・`items[1].status`）がある'
      - '`problems` に `missing_body`（R-1）と `orphan_body`（`.mindstella/docs/X-1.md`）がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_normal_when_problems_found
  - name: 正常系（設定に無いフェーズがある）
    summary: 項目の phase と goal.phase が設定の phases に無ければ unknown_phase を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`phases` が 目的 → 要件で、`goal.phase` が `結論`、検討事項 D-1 の `phase` が `発散` のワークスペース'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: config.yaml と全ての YAML を読む
        IF->>IF: phase と goal.phase を phases と突き合わせる
        IF-->>クライアント: JSON（ok: false）
      ```
    expected:
      - ツールのエラーにならず、`ok` が偽
      - '`problems` に `kind: unknown_phase`・`file: .mindstella/decisions.yaml`・`id: D-1`・`key: items[0].phase`・`detail` に `発散` がある'
      - '`problems` に `kind: unknown_phase`・`file: .mindstella/config.yaml`・`key: goal.phase`・`detail` に `結論` がある'
      - ワークスペースの全てのファイルの中身が、点検を呼ぶ前と同じ
    test: test_normal_when_unknown_phase
  - name: 正常系（変更履歴が本文とずれている）
    summary: 手で書き換えた本文に当たらない変更履歴を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 本文を持つ検討事項 D-1 の本文を `update` で直した後、`docs/D-1.md` の全ての行を手で書き換えたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: false・problems）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が偽'
      - '`problems` に `stale_history`（D-1・`history[0].body_diff`）がある'
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_normal_when_history_stale
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: check workspace
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 正常系（検討事項の案と状態が合わない）
    summary: 案を持たない・採用した案を持たない決定済み・採用した案を持つ未決定を拾い、必須の対象でない状態は拾わない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 案を持たない未決定の D-1、案 A・B を持ち採用した案を持たない決定済みの D-2、案 A を採用した未決定の D-3、案を持たない未整理の D-4・対象外の D-5・取り下げの D-6 を持つワークスペース
        notes: decisions.yaml を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML を読む
        IF->>IF: 検討事項の案と状態を決まりと突き合わせる
        IF-->>クライアント: JSON（ok: false、decision_state 3 件）
      ```
    expected:
      - ツールのエラーにならず、`ok` が偽
      - '`kind` が `decision_state` の問題が 3 件で、`id` が D-1・D-2・D-3 の順'
      - D-1 の `key` が `items[0].options` で、`detail` に `options に案を書く` がある
      - D-2 の `key` が `items[1].options` で、`detail` に `adopt` がある
      - D-3 の `key` が `items[2].status` で、`detail` に `未決定` と `A` がある
      - D-4・D-5・D-6 の問題が無い
      - ワークスペースの全てのファイルの中身が呼ぶ前と同じ
    test: test_normal_when_options_and_status_mismatch
  - name: 正常系（消した項目がまとまりに残る）
    summary: 過去のまとまりと取り込み済みの送信が消した項目を指していても、参照切れにしない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
        notes: '-'
      - name: make_workspace
        description: メモ N-1 を足して `commit` し、N-1 へ向けた送信 S-1 を取り込み済みにしてから、`remove` で N-1 を消してもう一度 `commit` したワークスペース
        notes: 1 つ目のまとまりの `added` と S-1 の `target` が N-1 を指す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML・changes.yaml・submissions.yaml を読む
        IF->>IF: 消した項目の記録にある N-1 を参照切れから外す
        IF-->>クライアント: JSON（ok が真）
      ```
    expected:
      - ツールのエラーにならない
      - '`ok` が真で、`problems` が空'
    test: test_normal_when_removed_item_in_change_set
  - name: 正常系（HTML の本文にずれがある）
    summary: HTML の本文も、指す本文が無い・どこからも指されないの対象にする
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 本文を HTML で持つ資料 A-1・A-2 を持ち、A-1 の本文のファイルを消して、どの項目も指さない `docs/A-9.html` を置いたワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as check（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: check workspace
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: JSON（ok: false・problems）
      ```
    expected:
      - ツールのエラーにならない
      - '`problems` が `missing_body`（A-1）と `orphan_body`（`.mindstella/docs/A-9.html`）の 2 件だけで、A-2 の問題が無い'
    test: test_normal_when_html_body_problems_found
lead: ワークスペースのスキーマに合わない箇所・参照切れ・YAML と `docs/` の本文（Markdown と HTML）のずれ・案と状態の合わない検討事項を全て洗い出す。
idempotent: true
side_effects: なし（読むだけ。見つけた問題は直さない）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ'
response:
  - name: ok
    type: bool
    description: 問題が 1 つも無いか
  - name: problems[].kind
    type: '"schema" | "duplicate_id" | "broken_ref" | "missing_body" | "orphan_body" | "unknown_phase" | "stale_history" | "decision_state"'
    description: 問題の種類（スキーマに合わない・ID の重複・参照切れ・指す本文が無い・どの項目からも指されない本文・設定の `phases` に無いフェーズ・変更履歴から前の本文を組み立てられない・検討事項の案と状態が合わない）
  - name: problems[].file
    type: str
    description: 問題のあるファイル（ワークスペースからの相対パス。例 `.mindstella/decisions.yaml`）
  - name: problems[].id
    type: str | None
    description: 問題のある項目の ID（`orphan_body` と項目を特定できない `schema` は `null`）
  - name: problems[].key
    type: str | None
    description: 問題のあるキーのパス（`items[0].status`・`depends_on` など）
  - name: problems[].detail
    type: str
    description: 中身（参照先の ID・スキーマの理由など）。前の版の形式（資料の `done`・`config.yaml` の `summary` が無い・`config.yaml` の `field`）で合わない `schema` と `decision_state` は、理由に続けて `/mindstella:upgrade` で今の形式に移せることを書く
response_notes: |-
  > [!NOTE]
  > 問題があるときも点検そのものは正常に終えているので、ツールのエラーにせず、同じ形の結果（`ok: false`）を返す。
exceptions:
  - name: なし（正常終了）
    condition: 点検できた
    notes: 結果を返す（問題があるときも）
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 点検するファイル
    constraint: '`config.yaml`・種類ごとの 7 つの YAML・`submissions.yaml`（無ければ送信 0 件として扱う）・`changes.yaml`（無ければまとまり 0 件として扱う）・`comments.yaml`・`drafts.yaml`（無ければ 0 件として扱い、スキーマ違反だけを確かめる）・`docs/`'
  - item: 参照切れを確かめるキー
    constraint: '`depends_on`・`parent`・`for`・`related`・`sources` と設定の `goal.deliverables[].doc`、送信の `target`（持つときだけ）、`changes.yaml` の `sets[].added`・`sets[].changed`・`pending.added`・`pending.changed`。存在しない ID と、キーが決めた種類でない ID（`parent` が `D-` 以外など）を `broken_ref` にする。`changes.yaml` のまとまり・`pending` と、取り込み済みの送信の `target` が指す ID のうち、`changes.yaml` の `sets[].removed`・`pending.removed` にある ID（『項目の削除』で消した項目）は参照切れにしない。レビュー中のコメントと書きかけの `target` は確かめない（項目が消えたコメントは『コメントをまとめて送る』の 409 で画面に出る）'
  - item: 本文のずれ
    constraint: '`body` が指す `docs/` のファイルが無いものを `missing_body`、どの項目の `body` からも指されない `docs/*.md`・`docs/*.html` を `orphan_body` にする'
  - item: 問題の並び
    constraint: ファイル名の順、同じファイルの中は項目の並びの順
  - item: フェーズを確かめるキー
    constraint: '種類ごとの YAML の項目の `phase` と設定の `goal.phase` が、設定の `phases` のどれかでないものを `unknown_phase` にする（`goal.phase` は `file: .mindstella/config.yaml`・`id: null`・`key: goal.phase`）。`detail` にそのフェーズの名前'
  - item: 変更履歴のずれ
    constraint: 本文を持つ項目の `history` を新しいものから順に今の本文へ当て、`body_diff` の `now` の行が当てる先の行と合わないものを `stale_history` にする（ツールを通さずに本文を書き換えたときに起きる）。`key` は合わなかった要素の `history[{位置}].body_diff`、`detail` はその回より前の本文の差分を出せないこと
  - item: 案と状態
    constraint: 検討事項の案と状態の決まり（ER 図『ワークスペース』の decisions.yaml）に合わない検討事項を `decision_state` にする。合わない決まり 1 つ = 1 件で、`key` は `items[{番号}].options` か `items[{番号}].status`、`detail` は ER 図の理由の行。`未整理`・`対象外`・`取り下げ` の検討事項が案を持たないことは問題にしない
refs:
  - dev/設計書/ER図/ワークスペース#
test_file: tests/integration/server/test_check.py

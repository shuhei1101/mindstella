title: "レビュー中のコメントの削除"
entry:
  kind: endpoint
  value: DELETE /api/comments/{id}
flows:
  - name: 正常系
    summary: 1 件を消し、元に戻すための中身を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送る）
      - name: make_workspace
        description: 検討事項 D-1 と、レビュー中のコメント C-1・C-2（D-1・「案 B も見たい」）を持ち、`seq` が 2 のワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as DELETE /api/comments/{id}
        participant WS as ワークスペース

        クライアント->>IF: DELETE /api/comments/C-2
        IF->>WS: comments.yaml から C-2 を消す
        IF-->>クライアント: 200、消した中身
      ```
    expected:
      - ステータスが 200 で、`body` が `案 B も見たい`、`count` が 1
      - '`comments.yaml` に C-1 だけが残り、`seq` が 2 のまま'
    test: test_normal
  - name: 異常系（送り元が違う・403）
    summary: 別のサイトのページからは消さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送る）
      - name: make_workspace
        description: レビュー中のコメント C-1 を持つワークスペース
        notes: '`Origin: https://attacker.example` を付ける'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as DELETE /api/comments/{id}

        クライアント->>IF: DELETE（Origin: attacker.example）
        IF-->>クライアント: 403
      ```
    expected:
      - ステータスが 403
      - '`comments.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_origin_mismatch
  - name: 異常系（コメントが無い・404）
    summary: 無い ID は消さない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントで送る）
      - name: make_workspace
        description: レビュー中のコメント C-1 だけを持つワークスペース
        notes: '`DELETE /api/comments/C-9`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as DELETE /api/comments/{id}

        クライアント->>IF: DELETE /api/comments/C-9
        IF-->>クライアント: 404
      ```
    expected:
      - ステータスが 404 で、`detail` に `C-9` がある
      - '`comments.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_comment_not_found
lead: コメントの一覧から、レビュー中のコメント 1 件を消し、消した中身を返す。画面は「元に戻す」で、返った中身を『レビュー中のコメントの追加』へ同じ ID で渡して戻す。
idempotent: false
side_effects: '`comments.yaml` からそのコメントを消す（`seq` は変えない）。一時ファイルから `os.replace` で置き換える。ほかのファイルは書き換えない'
callers:
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
request:
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '『プレビューの配信』の制約「接続先の確かめ」に合うもの（`127.0.0.1:{ポート}`・`localhost:{ポート}`・許可するホスト名）'
  - name: Origin
    type: str
    required: false
    default: なし（確かめない）
    location: header
    description: ブラウザが付ける送り元
    constraints: 付いていれば『プレビューの配信』の制約「送り元の確かめ」に合うもの（`http://127.0.0.1:{ポート}`・`http://localhost:{ポート}`・許可するホスト名の `https` / `http`）
  - name: id
    type: str
    required: true
    location: path
    description: 消すコメントの ID
    example: C-2
response:
  - name: id
    type: str
    description: 消したコメントの ID
  - name: target
    type: str | None
    description: 消したコメントの向けた項目
  - name: loc
    type: dict | None
    description: 消したコメントの箇所
  - name: body
    type: str
    description: 消したコメントの本文
  - name: created
    type: str
    description: 消したコメントの溜めた日時
  - name: count
    type: int
    description: 消した後のレビュー中のコメントの件数
status_codes:
  - code: '200'
    condition: 消した
  - code: '403'
    condition: '`Origin` が『プレビューの配信』の制約「送り元の確かめ」に合わない'
    notes: 何も書かない
  - code: '404'
    condition: '`id` のコメントがレビュー中に無い（既に消した・送ったものを含む）'
    notes: 何も書かない
  - code: '422'
    condition: '`comments.yaml` がスキーマに合わないか YAML として読めない、または `config.yaml` が無くなった'
    notes: 何も書かない
  - code: '500'
    condition: '`comments.yaml` を書けない'
    notes: '`detail` に書けなかったパスと理由。`comments.yaml` は前のまま'
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 元に戻せる間
    constraint: サーバーは消した中身を持たない。画面が返った中身を持ち、コメントの一覧を出している間だけ「元に戻す」を出す
  - item: 送り元の確かめ
    constraint: '`Host` は『プレビューの配信』と同じ。`Origin` が付いていれば『プレビューの配信』の制約「送り元の確かめ」で確かめる（本文を持たないため `Content-Type` は確かめない）'
  - item: 同時の書き込み
    constraint: 書き換えの鍵とワークスペースのロック（『MCP サーバーの起動』の同時の呼び出し）を取ってから読み・書く
refs:
  - dev/設計書/ER図/ワークスペース#
  - dev/設計書/シナリオ/単一ユースケース/コメントを選んで送る#
test_file: tests/integration/server/test_comment_delete.py

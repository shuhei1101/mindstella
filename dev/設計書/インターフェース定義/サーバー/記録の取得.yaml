title: "記録の取得"
entry:
  kind: endpoint
  value: GET /api/records
flows:
  - name: 正常系
    summary: 全ての種類と本文と導いた値を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 7 つの種類を 1 件ずつ持ち、検討事項 D-1 が本文 `docs/D-1.md` を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /api/records
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`settings` と 7 つの種類の項目が YAML と同じ'
      - '`bodies` に `D-1.md` の本文がある'
      - '`derived.next` が `next` の結果の `candidates` と同じ'
      - '`derived.goal` が `goal` の結果のキーと `phase_progress` を持つ'
    test: test_normal
  - name: 正常系（書き換えた後）
    summary: ツールで書き換えると、次に読んだ記録に書き換えが入っている
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant T as add（MCP のツール）

        クライアント->>IF: GET /api/records
        IF-->>クライアント: D-1 だけ
        クライアント->>T: add workspace kind decision（D-2）
        クライアント->>IF: GET /api/records
        IF-->>クライアント: D-1・D-2
      ```
    expected:
      - 2 回目の `decisions` に D-2 がある
      - 2 回目の `built_at` が 1 回目以降の日時
    test: test_normal_when_rewritten
  - name: 正常系（変更履歴がある）
    summary: 項目の変更履歴と、書き換えのまとまりを返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 検討事項 D-1 を足して `commit`（説明「足す」）し、D-1 の `answer` を `update` で直したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /api/records
        IF-->>WS: 全ての YAML と changes.yaml と docs/ を読む
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`decisions` の D-1 が `history` を 1 回分持ち、YAML と同じ'
      - '`changes.sets` が「足す」の 1 つで、`added` が `[D-1]`'
      - '`changes.pending.changed` が `[D-1]`'
    test: test_normal_when_history
  - name: 異常系（YAML がスキーマに合わない・422）
    summary: 手で崩した YAML があると、合わない箇所を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: '`decisions.yaml` の D-1 の `status` を `完了` に直接書き換えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /api/records
        IF-->>WS: 全ての YAML を読む
        IF->>IF: スキーマと突き合わせて合わない
        IF-->>クライアント: 422
      ```
    expected:
      - ステータスが 422、`Content-Type` が `application/problem+json`
      - '`detail` に `decisions.yaml: items[0].status:` で始まる行がある'
    test: test_error_when_schema_mismatch
  - name: 正常系（ゴールが無い）
    summary: ゴールが無いときは derived.goal が全フェーズの進捗を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: '`phases` が 目的 → 要件で、ゴールを持たないワークスペース'
        notes: D-1 `目的`・`決定済み`／D-2 `要件`・`未決定`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /api/records
        IF-->>WS: 全ての YAML と docs/ を読む
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`derived.goal.has_goal` が偽、`derived.goal.reached` が `null`'
      - '`derived.goal.phase_progress` が 目的 1/1・要件 0/1'
      - '`derived.goal` が `goal` の結果と同じキーで同じ値を持つ'
    test: test_normal_when_no_goal
  - name: 正常系（設定がスキーマに合わない）
    summary: 配信中に `config.yaml` を崩しても、最後に検査に通った設定で記録を返し、合わない箇所を添える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: '`config.yaml` の `display.network_look` を `starlight` にしたワークスペース。`preview_url` を呼んだ後に `display.network_look` を `rainbow` に直接書き換える'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /api/records
        IF-->>WS: 全ての YAML を読む
        IF->>IF: config.yaml だけが合わない
        IF-->>クライアント: 200、最後に通った設定と合わない箇所
      ```
    expected:
      - ステータスが 200
      - '`settings.display.network_look` が `starlight`'
      - '`settings_problem` に `config.yaml: display.network_look: ` で始まる行がある'
    test: test_normal_when_config_invalid
  - name: 正常系（HTML の本文がある）
    summary: HTML の本文は原文を `bodies` に、行の印を足したものを `marked_bodies` に返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` を呼び、返った URL へ HTTP のクライアントでつなぐ）
      - name: make_workspace
        description: 本文を Markdown で持つ資料 A-1 と、本文を HTML で持つ資料 A-2 を持つワークスペース
        notes: 'A-2 の本文は 1 行目が `<!doctype html>`、2 行目が `<style>p { color: red; }</style>`、3・4 行目にまたがる開きタグ `<p\n  class="lead">一覧の画面</p>`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as GET /api/records
        participant WS as ワークスペース

        クライアント->>IF: GET /api/records
        IF-->>WS: 全ての YAML と docs/ を読む
        IF->>IF: HTML の本文に行の印を足す
        IF-->>クライアント: 200、JSON
      ```
    expected:
      - ステータスが 200
      - '`bodies` の `A-1.md`・`A-2.html` がそれぞれのファイルの中身と同じ'
      - '`marked_bodies` が `A-2.html` だけを持ち、`<p` の直後に ` data-line="4"` がある'
      - '`marked_bodies` の `A-2.html` の `<style>` に `data-line` が無く、`data-line` を取り除くと `bodies` の `A-2.html` と同じ'
    test: test_normal_when_html_body
lead: 配信しているワークスペースの全ての YAML と本文を、その場で読んで 1 つの JSON にまとめて返す。プレビューの画面が開いたときと、書き換えの知らせを受けたときに読む。
idempotent: true
side_effects: なし（読むだけ）
callers:
  - dev/設計書/インターフェース定義/プレビュー/プレビューを開く#
request:
  - name: Host
    type: str
    required: true
    location: header
    description: ブラウザが付ける接続先
    constraints: '『プレビューの配信』の制約「接続先の確かめ」に合うもの（`127.0.0.1:{ポート}`・`localhost:{ポート}`・許可するホスト名）'
response:
  - name: settings
    type: dict
    description: '`config.yaml` の中身。`display`（見た目の既定・表示する種類の既定）を含む。`config.yaml` がスキーマに合わないときは、配信が持つ最後に検査に通った設定'
  - name: decisions / tasks / research / docs / terms / notes / logs
    type: list[dict]
    description: 種類ごとの YAML の `items` の中身（キー名はファイル名から `.yaml` を落としたもの）
  - name: bodies
    type: dict[str, str]
    description: '`docs/` のファイル名 → 本文の原文（項目の `body` が指すものだけ。Markdown は `{ID}.md`、HTML は `{ID}.html` のキーで、どちらも書いたまま）。画面はキーの拡張子で形式を決め、差分・検索・前の版の組み立てには原文を使う'
  - name: built_at
    type: str
    description: 読んだ日時（UTC のタイムゾーン付き ISO 8601）。画面はつながらないときに「{日時} に読んだ記録」と出す
  - name: derived.next[]
    type: list[{id, title, phase, weight, followers}]
    description: 次に検討する項目。『次の候補』（`next`、上限なし）と同じ並びと中身。画面の「着手可否」が「着手可能」になるのはここにある ID
  - name: derived.goal
    type: dict
    description: 『ゴール判定』（`goal`）の結果と同じキーに、判定に入れたフェーズごとの決着した数と全体の数 `phase_progress[]`（`{phase, settled, total}`）を足したもの。ゴールが無いときは `has_goal` が偽で、`phase_progress` は全フェーズ
  - name: derived.progress[]
    type: 'list[{category, cells: list[{phase, settled, total}], settled, total}]'
    description: カテゴリー別の進捗。`settings.categories` の順、セルは `settings.phases` の順。決着は『次の候補』『ゴール判定』と同じ（検討事項の決定済み・対象外・取り下げ）
  - name: changes
    type: dict
    description: '`changes.yaml` の中身（`last_seq`・`sets`・`pending`）。無ければ `{last_seq: 0, sets: [], pending: {added: [], changed: []}}`。画面の変更履歴の一覧と、新規・変更の印はここから取る。種類ごとの項目は `history` を持ったまま返し、画面はそこから前の版を組み立てる'
  - name: settings_problem
    type: list[str] | None
    description: '`config.yaml` がスキーマに合わないとき、合わない箇所ごとの `config.yaml: {キーのパス}: {理由}`。合うときは `null`。画面は表示を変えず、設定を直すよう知らせる'
  - name: marked_bodies
    type: dict[str, str]
    description: '`bodies` の HTML の本文ごとの、ファイル名 → 開きタグに原文の行の印（`data-line`）を足した HTML。画面はこれを描き、選んだ範囲を本文の行の範囲にし、差分の印を付ける要素を決める。HTML の本文が無ければ `{}`'
    notes: 印の足し方は制約「行の印」
response_notes: |-
  > [!NOTE]
  > 配る書き出し（`export`）は、同じ形の JSON を `<script type="application/json" id="mindmap-data">` の中身に埋め込む。画面は埋め込みのデータがあればそれを読み、無ければこの API を読む。送信（`submissions.yaml`）は返さない。
status_codes:
  - code: '200'
    condition: 読めた
  - code: '422'
    condition: '`config.yaml` 以外のどれかの YAML がスキーマに合わないか、YAML として読めない。または `config.yaml` が無くなった'
    notes: '`detail` に合わない箇所ごとの `{ファイル名}: {キーのパス}: {理由}` を改行でつなぐ。画面は前に読んだ記録で描き続ける'
error_format: 本文は `application/problem+json`（RFC 9457 の `type`・`title`・`status`・`detail`）。`detail` は日本語
constraints:
  - item: 読む時
    constraint: 呼ばれるたびにワークスペースの YAML と本文を読み直す（書き出しのファイルを持たない）
  - item: 本文の形
    constraint: '`application/json; charset=utf-8`。日本語はエスケープしない。`Cache-Control: no-store`'
  - item: 接続先の確かめ
    constraint: 『プレビューの配信』と同じ（`Host` が合わなければ 403 を返す。確かめは『プレビューの配信』の異常系が持つ）
  - item: 読みかけ
    constraint: ツールは YAML を一時ファイルから `os.replace` で置き換えるため、書きかけを読まない
  - item: 設定の読み方
    constraint: 呼ばれるたびに `config.yaml` を読み、スキーマに合えば配信の「最後に検査に通った設定」をその値に差し替える。合わなければ差し替えず、最後に検査に通った設定を `settings` に、合わない箇所を `settings_problem` に入れて 200 を返す
  - item: 行の印
    constraint: Python の標準ライブラリ `html.parser.HTMLParser` で原文を読み、開きタグ（空要素を含む）のタグ名の直後に ` data-line="{行}"` を足す。行はその開きタグが閉じた原文の行（中身が始まる行、1 始まり）。文書の外枠と描いた文を持たない要素（`html`・`head`・`body`・`meta`・`link`・`base`・`style`・`script`・`template`・`title`）には足さない。印の他は原文を変えず、行の並びも保つ
    notes: PoC（#215）で、コメントの中のタグ・`<style>` / `<script>` の中の `<` `>`・属性値の `>`・複数行の開きタグ・閉じタグを省いた `<p>` / `<li>` を含む 12 ケースで確かめた
refs:
  - dev/設計書/インターフェース定義/サーバー/次の候補#
  - dev/設計書/インターフェース定義/サーバー/ゴール判定#
test_file: tests/integration/server/test_records.py

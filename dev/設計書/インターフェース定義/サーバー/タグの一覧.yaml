title: "タグの一覧"
entry:
  kind: mcp_tool
  value: '`tags`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__tags`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 種類をまたいでタグと件数を数える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 次の項目を持つワークスペース
        notes: 'D-1: タグ `データ`／D-2: タグ `画面`／T-1: タグ `データ`／N-1: タグ無し'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as tags（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: tags workspace
        IF-->>WS: 全ての YAML を読む
        IF-->>クライアント: JSON（tags）
      ```
    expected:
      - ツールのエラーにならない
      - '`tags` が `データ`（`count: 2`・`kinds: [decision, task]`）と `画面`（`count: 1`・`kinds: [decision]`）の 2 件を、名前の順に並べる'
    test: test_normal
  - name: 正常系（タグが無い）
    summary: どの項目もタグを持たないと空の一覧を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: タグを持たない検討事項 D-1 だけを持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as tags（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: tags workspace
        IF-->>WS: 全ての YAML を読む
        IF-->>クライアント: JSON（tags: []）
      ```
    expected:
      - ツールのエラーにならない
      - '`tags` が空の配列'
    test: test_normal_when_no_tags
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: config.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as tags（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: tags workspace
        IF-->>WS: config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
lead: ワークスペースの項目が `tags` で使っているタグと、付いている項目の数・種類を返す。取り込みで、既にある話題のタグを使い回すために引く。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`config.yaml` があるフォルダ'
response:
  - name: tags[].name
    type: str
    description: タグ（名前の順）
  - name: tags[].count
    type: int
    description: そのタグを持つ項目の数
  - name: tags[].kinds
    type: list[str]
    description: そのタグを持つ項目の種類（`decision` など。種類の定義の順で重なりなし）
exceptions:
  - name: なし（正常終了）
    condition: 一覧を作れた（タグが 0 件のときも含む）
    notes: 結果を返す。タグが 0 件なら `tags` は空の配列
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `config.yaml` が無い'
    notes: ツールのエラー
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 名前の同一視
    constraint: しない（字面が違えば別のタグとして並べ、揺れの判断はスキルが行う）
  - item: 数える範囲
    constraint: 全ての種類の項目の `tags` を数える。1 つの項目が同じタグを 2 回持っても 1 件と数える
test_file: tests/integration/server/test_tags.py

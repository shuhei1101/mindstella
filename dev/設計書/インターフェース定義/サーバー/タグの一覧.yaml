title: "タグの一覧"
entry:
  kind: mcp_tool
  value: '`tags`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__tags`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 語彙のタグごとに、説明と種類をまたいで数えた件数を返す。持つ項目が無いタグも返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: タグの語彙 `データ`（説明 `記録の形`・含める `記録のキーと保存の形`・含めない `画面の見た目`・例 `[ワークスペースの YAML]`）・`画面`（説明 `利用者が見る画面`）・`保留`（説明なし）と、次の項目を持つワークスペース
        notes: 'D-1: タグ `データ`／D-2: タグ `画面`／T-1: タグ `データ`／N-1: タグ無し'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as tags（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: tags workspace
        IF-->>WS: 語彙と全ての YAML を読む
        IF-->>クライアント: JSON（tags）
      ```
    expected:
      - ツールのエラーにならない
      - '`tags` が `データ`（`summary: 記録の形`・`count: 2`・`kinds: [decision, task]`）・`保留`（`summary: null`・`count: 0`・`kinds: []`）・`画面`（`summary: 利用者が見る画面`・`count: 1`・`kinds: [decision]`）の 3 件を、この順に並べる'
      - '`データ` が `include: 記録のキーと保存の形`・`exclude: 画面の見た目`・`examples: [ワークスペースの YAML]` を語彙のとおりに返し、3 点を持たない `保留`・`画面` は `include: null`・`exclude: null`・`examples: []` を返す'
    test: test_normal
  - name: 正常系（タグが無い）
    summary: 語彙が空なら空の一覧を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: タグの語彙を持たず、タグを持たない検討事項 D-1 だけを持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as tags（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: tags workspace
        IF-->>WS: 語彙と全ての YAML を読む
        IF-->>クライアント: JSON（tags: []）
      ```
    expected:
      - ツールのエラーにならない
      - '`tags` が空の配列'
    test: test_normal_when_no_tags
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as tags（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: tags workspace
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
lead: ワークスペースのタグの語彙を、タグごとの説明（含める / 含めない / 例を含む）と、付いている項目の数・種類を添えて返す。取り込みで話題に合うタグを選ぶためと、`find` のタグの条件を決めるために先に引く。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ'
response:
  - name: tags[].name
    type: str
    description: 語彙のタグ（名前の順）
  - name: tags[].summary
    type: str | None
    description: タグの説明（語彙に説明が無いタグは `null`）
  - name: tags[].count
    type: int
    description: そのタグを持つ項目の数（持つ項目が無いタグは 0）
  - name: tags[].kinds
    type: list[str]
    description: そのタグを持つ項目の種類（`decision` など。種類の定義の順で重なりなし。持つ項目が無いタグは空の配列）
  - name: tags[].include
    type: str | None
    description: そのタグに含めるもの（語彙のそのタグが持たなければ `null`）
  - name: tags[].exclude
    type: str | None
    description: そのタグに含めないもの（語彙のそのタグが持たなければ `null`）
  - name: tags[].examples
    type: list[str]
    description: そのタグを付ける例（語彙のそのタグが持たなければ空の配列）
exceptions:
  - name: なし（正常終了）
    condition: 一覧を作れた（語彙が空のときも含む）
    notes: 結果を返す。語彙が空なら `tags` は空の配列
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 返す範囲
    constraint: 語彙のタグだけを返す。語彙に無い未登録の候補は点検が警告で洗い出し、ここでは数えない
  - item: 数える範囲
    constraint: 全ての種類の項目の `tags` を数える。1 つの項目が同じタグを 2 回持っても 1 件と数える
  - item: ツールの説明
    constraint: MCP のツールの説明に、語彙のタグと説明・件数を返すことと、`find` でタグを渡す前やタグを付ける前に呼ぶことを書く
test_file: tests/integration/server/test_tags.py

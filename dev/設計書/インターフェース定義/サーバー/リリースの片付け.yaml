title: "リリースの片付け"
entry:
  kind: mcp_tool
  value: '`clear_release`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__clear_release`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: release/ の中身を消し、消したものを返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`release/` に `古い資料.md` と、ファイルを 1 つ持つフォルダ `図/` があるワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as clear_release（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: clear_release workspace
        IF-->>WS: config.yaml があるか確かめる
        IF->>WS: release/ の中のファイルとフォルダを消す
        IF-->>クライアント: JSON（removed）
      ```
    expected:
      - ツールのエラーにならない
      - '`removed` が `古い資料.md`・`図/` の順'
      - '`release/` があり、中身が空'
      - '`release/` の外のファイルの中身が、呼ぶ前と同じ'
    test: test_normal
  - name: 正常系（release/ が無い）
    summary: release/ を持たないワークスペースでは空の release/ を作る
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: '`release/` を消し、前の版の `handoff/` に `資料.md` があるワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as clear_release（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: clear_release workspace
        IF-->>WS: config.yaml があるか確かめる
        IF->>WS: 空の release/ を作る
        IF-->>クライアント: JSON（removed は空）
      ```
    expected:
      - ツールのエラーにならない
      - '`removed` が空'
      - 空の `release/` がある
      - '`handoff/` とその中の `資料.md` が、呼ぶ前と同じ'
    test: test_normal_when_release_dir_missing
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: .mindstella/config.yaml が無いフォルダを指すと何も消さずにエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`.mindstella/config.yaml` が無く、`release/` に `資料.md` がある）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as clear_release（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: clear_release workspace
        IF-->>WS: .mindstella/config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
      - '`release/` の `資料.md` が残っている'
    test: test_error_when_workspace_not_found
  - name: 異常系（消せない・WriteFailedError）
    summary: 消せないものに当たった時点でエラーで終わり、それまでに消したものは消えたままになる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて MCP のクライアントでツールを呼び、消せないものはフォルダの権限で作る）
      - name: make_workspace
        description: '`release/` にファイル `一.md` と、中のファイルを消せないフォルダ `二.md/` があるワークスペース'
        notes: '`二.md/` は `lock_dirs` で読み取りだけにする（root・Windows では skip）。名前の順に消すので、`一.md` を消した後に `二.md` で止まる'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as clear_release（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: clear_release workspace
        IF-->>WS: config.yaml があるか確かめる
        IF->>WS: 一.md を消す
        IF->>WS: 二.md を消せない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、消せなかった `二.md` のパスを含み、トレースバックを含まない'
      - '`release/` に `二.md` が残り、`一.md` は無い'
    test: test_error_when_remove_fails
lead: ゴール判定でリリースの資料を書き出す前に、`release/` の中身を消して空の `release/` を用意する。
idempotent: true
side_effects: '`release/` の中のファイルとフォルダを消す（`release/` が無ければ作る）。`release/` の外は読み書きしない'
callers:
  - dev/設計書/インターフェース定義/スキル/話し合いの進行#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` があるフォルダ'
response:
  - name: removed[]
    type: list[str]
    description: 消したものの `release/` からのパス。フォルダは末尾に `/` を付け、中のファイルは並べない。名前の順
exceptions:
  - name: なし（正常終了）
    condition: 消すものが無かったときを含む
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `.mindstella/config.yaml` が無い'
    notes: ツールのエラー。何も消さない
  - name: WriteFailedError
    condition: '`release/` の中のものを消せない、または `release/` を作れない（権限が無い・他のプログラムが開いている）'
    notes: ツールのエラー。消せなかった時点で止め、それまでに消したものは戻さない。次の `clear_release` で片付く
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 消す範囲
    constraint: '`{ワークスペースのフォルダ}/.mindstella/release/` の中だけ。`release/` 自体と、前の版の `handoff/` は消さない'
notes:
  サーバーに置く理由: '`session` はファイルを消すツールを持たず、Write はファイルを消せない。古いファイルを残さず最新の確定版の一式だけを置くため、消す処理をサーバーのツールにする'
test_file: tests/integration/server/test_clear_release.py

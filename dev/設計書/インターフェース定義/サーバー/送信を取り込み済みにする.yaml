title: "送信を取り込み済みにする"
entry:
  kind: mcp_tool
  value: '`take_submission`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__take_submission`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 取り込んでいない送信に取り込んだ日時を付ける
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 送信 S-1（取り込み済み）・S-2（取り込んでいない）を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as take_submission（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: take_submission workspace id S-2
        IF-->>WS: submissions.yaml を読む
        IF->>WS: S-2 の taken に日時を書く
        IF-->>クライアント: JSON（id・taken・already: false）
      ```
    expected:
      - ツールのエラーにならない
      - '`submissions.yaml` の S-2 の `taken` が返った日時で、S-1 は呼ぶ前と同じ'
      - '`submissions` が 0 件を返す'
    test: test_normal
  - name: 正常系（既に取り込み済み）
    summary: 取り込み済みの送信には書かずに前の日時を返す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 取り込み済みの送信 S-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as take_submission（MCP のツール）

        クライアント->>IF: take_submission workspace id S-1
        IF-->>クライアント: JSON（already: true）
      ```
    expected:
      - ツールのエラーにならない
      - '`already` が真で、`taken` が前の日時'
      - '`submissions.yaml` の中身が呼ぶ前と同じ'
    test: test_normal_when_already_taken
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: mindmap.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`mindmap.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as take_submission（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: take_submission workspace id S-1
        IF-->>WS: mindmap.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
  - name: 異常系（送信が無い・SubmissionNotFoundError）
    summary: 無い ID を指すと何も書かずに終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 送信 S-1 だけを持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as take_submission（MCP のツール）

        クライアント->>IF: take_submission workspace id S-9
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文に `S-9` がある
      - '`submissions.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_submission_not_found
  - name: 異常系（書き込めない・WriteFailedError）
    summary: 書き込めないワークスペースでは前の送信を残す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 取り込んでいない送信 S-1 を持ち、ワークスペースのフォルダの書き込みの権限を外したワークスペース
        notes: root で動かすときは skip する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as take_submission（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: take_submission workspace id S-1
        IF->>WS: 一時ファイルを書けない
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - 'エラーの本文が `エラー: ` で始まり、トレースバックを含まない'
      - '`submissions.yaml` の中身が呼ぶ前と同じ'
    test: test_error_when_write_fails
lead: 記録へ取り込んだ送信 1 件に、取り込んだ日時を付けて取り込み済みにする。
idempotent: true
side_effects: '`submissions.yaml` のその送信の `taken` に日時を書く。一時ファイルから `os.replace` で置き換える。ほかのファイルは書き換えない'
callers:
  - dev/設計書/インターフェース定義/スキル/話し合いの進行#
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`mindmap.yaml` があるフォルダ'
  - name: id
    type: str
    required: true
    location: argument
    description: 取り込み済みにする送信の ID
    example: S-2
response:
  - name: id
    type: str
    description: 取り込み済みにした送信の ID
  - name: taken
    type: str
    description: 取り込んだ日時（UTC のタイムゾーン付き ISO 8601）。既に取り込み済みなら前の日時
  - name: already
    type: bool
    description: 呼ぶ前から取り込み済みだったか
exceptions:
  - name: なし（正常終了）
    condition: 取り込み済みにした（既に取り込み済みのときも含む）
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `mindmap.yaml` が無い'
    notes: ツールのエラー。何も書き込まない
  - name: SubmissionNotFoundError
    condition: '`id` の送信が無い'
    notes: ツールのエラー。何も書き込まない
  - name: WriteFailedError
    condition: '`submissions.yaml` の書き込みか置き換えに失敗した'
    notes: ツールのエラー。エラーの本文に書けなかったパスと理由。前の `submissions.yaml` を残す
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 呼ぶ時
    constraint: スキルが、その送信の中身を記録へ書いた後に 1 件ずつ呼ぶ。一覧を読んだだけでは呼ばない（単一ユースケース『送信の取り込み』）
  - item: 同時の呼び出し
    constraint: 書き換えの鍵とワークスペースのロック（『MCP サーバーの起動』の同時の呼び出し）を取ってから読み・書く。同じプロセス・別のプロセスの画面からの送信と重なっても、どちらの書き換えも失わない
refs:
  - dev/設計書/ER図/ワークスペース#
  - dev/設計書/シナリオ/単一ユースケース/送信の取り込み#
test_file: tests/integration/server/test_take_submission.py

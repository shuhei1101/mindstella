title: "属性名の一覧"
entry:
  kind: mcp_tool
  value: '`attrs`（MCP サーバー `mindstella` のツール。Claude Code からは `mcp__mindstella__attrs`）。結果とエラーの返し方は『MCP サーバーの起動』'
flows:
  - name: 正常系
    summary: 種類をまたいで属性名と件数を数える
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 次の項目を持つワークスペース
        notes: 'D-1・D-2: 属性 `担当`／T-1: 属性 `期限`・`担当`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as attrs（MCP のツール）
        participant WS as ワークスペース

        クライアント->>IF: attrs workspace
        IF-->>WS: 全ての YAML を読む
        IF-->>クライアント: JSON（attrs）
      ```
    expected:
      - ツールのエラーにならない
      - '`attrs` が `担当`（`count: 3`・`kinds: [decision, task]`）と `期限`（`count: 1`・`kinds: [task]`）の 2 件'
    test: test_normal
  - name: 異常系（ワークスペースが無い・WorkspaceNotFoundError）
    summary: config.yaml が無いフォルダを指すとエラーで終わる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 空のフォルダ
        description: テストごとの一時フォルダ（`config.yaml` が無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as attrs（MCP のツール）
        participant WS as フォルダ

        クライアント->>IF: attrs workspace
        IF-->>WS: config.yaml が無い
        IF-->>クライアント: ツールのエラー
      ```
    expected:
      - ツールのエラーになる
      - エラーの本文にフォルダのパスがある
    test: test_error_when_workspace_not_found
lead: ワークスペースの項目が `attrs` で使っている属性名と、使っている件数を返す。
idempotent: true
side_effects: なし（読むだけ）
request:
  - name: workspace
    type: str
    required: true
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`config.yaml` があるフォルダ'
response:
  - name: attrs[].name
    type: str
    description: 属性名（名前の順）
  - name: attrs[].count
    type: int
    description: その属性を持つ項目の数
  - name: attrs[].kinds
    type: list[str]
    description: その属性を持つ項目の種類（`decision` など。重なりなし）
exceptions:
  - name: なし（正常終了）
    condition: 一覧を作れた（属性が 0 件のときも含む）
    notes: 結果を返す
  - name: WorkspaceNotFoundError
    condition: '`workspace` のフォルダに `config.yaml` が無い'
    notes: ツールのエラー
error_format: 'ツールのエラーの本文に `エラー: {内容}` の行を出す。'
constraints:
  - item: 結果の形
    constraint: ツールの結果に JSON のオブジェクトを 1 個（構造化の結果と、同じ JSON の文字列の本文。日本語はエスケープしない）
  - item: エラーの返し方
    constraint: 実行時のエラーと引数の誤りは、ツールのエラー（`isError`）で返し、本文にエラーの行を書く（『MCP サーバーの起動』）
  - item: 名前の同一視
    constraint: しない（字面が違えば別の属性名として並べ、揺れの判断はスキルが行う）
test_file: tests/integration/server/test_attrs.py

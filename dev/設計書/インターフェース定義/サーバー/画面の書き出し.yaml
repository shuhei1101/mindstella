title: "画面の書き出し"
entry:
  kind: trigger
  value: ワークスペースを作ったときと、項目か設定を書き換えたツール・エンドポイントが書き込みを終えたとき
flows:
  - name: 正常系
    summary: 項目を足すと、直下の mindstella.html がその項目を持つ見るだけの画面になる
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を 1 件持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant TL as add（MCP のツール）
        participant IF as 画面の書き出し
        participant WS as ワークスペース

        クライアント->>TL: add workspace kind decision
        TL->>WS: .mindstella/ の decisions.yaml を書く
        TL->>IF: 書き込みを終えた
        IF-->>WS: .mindstella/ の記録を読む
        IF->>WS: 直下の mindstella.html を置き換える
        TL-->>クライアント: JSON（id・file・body）
      ```
    expected:
      - ツールのエラーにならず、結果が `screen_error` を持たない
      - 直下の `mindstella.html` の `mindmap-data` の中身が、足した D-2 を含む『記録の取得』と同じ記録である
      - '`mindstella.html` が描画のライブラリの `<script src>` を雛形と同じ URL で持ち、コメントのボタンを出さない'
      - 直下に `mindstella.html` と `.mindstella/` のほかのファイルが無い
    test: test_normal
  - name: 異常系（画面を書けない）
    summary: 画面を書けなくても項目の書き込みは残り、結果に理由が載る
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1 を持ち、直下の `mindstella.html` の場所に同じ名前のフォルダを置いたワークスペース
        notes: フォルダはファイルで置き換えられないため、書き出しが必ず失敗する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant TL as add（MCP のツール）
        participant IF as 画面の書き出し
        participant WS as ワークスペース

        クライアント->>TL: add workspace kind decision
        TL->>WS: .mindstella/ の decisions.yaml を書く
        TL->>IF: 書き込みを終えた
        IF->>WS: 直下の mindstella.html を置き換えられない
        TL-->>クライアント: JSON（id・file・body・screen_error）
      ```
    expected:
      - ツールのエラーにならず、`id` が `D-2`
      - 結果の `screen_error` に `mindstella.html` のパスと理由がある
      - '`.mindstella/decisions.yaml` に D-2 がある'
      - 直下に一時ファイルが残っていない
    test: test_error_when_screen_write_fails
lead: ワークスペースの直下に、今の記録を中に持つ見るだけの画面 `mindstella.html` を書き直す。利用者はサーバーを立てていなくても、このファイルを開けば今の記録を読める。
side_effects: ワークスペースの直下の `mindstella.html` を、同じフォルダの一時ファイルから `os.replace` で置き換える。`.mindstella/` の中は読むだけ
exclusivity: 呼ぶ側の書き込みと同じ鍵（プロセスの中の鍵と `.mindstella.lock`）を持ったまま書く。書き込みと画面の間に別の書き込みを挟まない
constraints:
  - item: 中身
    constraint: サーバーが配るプレビューと同じ `template.html` と画面の CSS・JavaScript を使い、CSS を `<style>`、JavaScript を `<script>` の中身として差し込む。記録は『記録の取得』のレスポンスと同じ形で `<script type="application/json" id="mindmap-data">` の中身に入れる。描画のライブラリの `<script src>` と文字の `<link>` は雛形のまま残し、開いたブラウザが CDN から読む
  - item: 見るだけ
    constraint: 『配る書き出し』と同じく、記録を埋め込みのデータから読み、コメントのボタン・一覧・入力・選んだ箇所の入口と書き換えの知らせの購読を出さない
  - item: 埋め込みの安全
    constraint: 『配る書き出し』と同じ（埋め込む JSON の `<`・`>`・`&` を Unicode エスケープに置き換える）
  - item: 通信
    constraint: 書き出すときに通信しない（描画のライブラリを取らない）
  - item: 失敗したとき
    constraint: 画面を書けなかったときも、呼ぶ側の書き込みは取り消さない。呼ぶ側の結果は成功のままで、結果の `screen_error` に書けなかったパスと理由を入れる（書けたときはキーを持たない）。前の `mindstella.html` は残し、次に書き換えたときに書き直す
  - item: 書かないとき
    constraint: レビュー中のコメント・書きかけ・送信・前回開いた日時・AI が最後に読んだ時点だけを書き換えたときと、書き換えた項目が無かったときは書かない（見るだけの画面に出ないため）
notes:
  対応テストファイル: '`tests/integration/server/test_screen_write.py`。結合テスト作成でファイルを作ったときに `test_file` へ移す'

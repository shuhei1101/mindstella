title: "セットアップ"
entry:
  kind: operation
  value: '`/mindstella:setup [ワークスペースのフォルダ]`（利用者が Claude Code で呼ぶスキル。実体は `plugins/mindstella/skills/setup/SKILL.md`）'
flows:
  - name: 正常系
    summary: スキル setup のファイルが制約どおりの形で、プラグインの検証を通る
    setup:
      - name: Mock
        description: なし（リポジトリのファイルを読み、実際の Claude Code の `claude plugin validate` を起動する。モデルは呼ばない）
      - name: 設定のフォルダ
        description: テストごとの空の一時フォルダを Claude Code の設定のフォルダにする
        notes: 環境変数 `CLAUDE_CONFIG_DIR`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as skills/setup/SKILL.md
        participant C as Claude Code（claude plugin validate）

        クライアント->>IF: front matter と本文のパスを読む
        クライアント->>C: リポジトリの直下を検証する
        C-->>クライアント: 終了コード 0
      ```
    expected:
      - front matter の `name` が `setup`、`allowed-tools` が制約の値と一致する
      - 本文の `${CLAUDE_PLUGIN_ROOT}/` で始まるパスが全てリポジトリの中にある
      - 本文が指す `steps/` のファイルが全てある
      - 本文が呼ぶツールが全て `allowed-tools` にあり、サーバーのツールの一覧（『MCP サーバーの起動』）にある
      - 本文が `mindmap.py`・`build`・`check-env` を指さない
      - '本文が `migrate` を `plan: true` で呼ぶ'
      - 本文に、MCP のツールが無いとき起動スクリプトを案内して止まる分岐がある
      - '`claude plugin validate` が終了コード 0'
    test: test_normal
lead: 新しいワークスペースを作るか既存のワークスペースの状況を示して、`/mindstella:session` へ渡すスキルの入口と、そのファイルの形。
callers:
  - dev/設計書/シナリオ/単一ユースケース/話し合いのセットアップ#
side_effects: サーバーの MCP のツール `init` でワークスペースを作る（新しいワークスペースのときだけ）。スキルが自分でファイルを書くことはない
request:
  - name: $ARGUMENTS
    type: str
    required: false
    default: なし（ワークスペースのフォルダの指定を求める）
    location: argument
    description: ワークスペースのフォルダのパス。`mindmap.yaml` があれば既存、無ければ新しいワークスペースとして扱う
    example: ~/discussions/家計簿アプリ
exceptions:
  - name: なし（正常終了）
    condition: ファイルの形が制約どおりで、Claude Code がスキルとして読み込める
constraints:
  - item: ファイルの形
    constraint: '`skills/setup/SKILL.md` と `skills/setup/steps/`（`新しいワークスペース.md`・`既存のワークスペース.md`）。進め方ガイド・質問の書式は `skills/mindmap/` の共通のものを読む'
  - item: front matter の name
    constraint: '`setup`'
  - item: front matter の description
    constraint: いつ使うか（話し合いを始める・再開するとき）が分かる 1 文
  - item: front matter の allowed-tools
    constraint: '`Read, mcp__mindstella__init, mcp__mindstella__status, mcp__mindstella__migrate`。Bash は許していない'
    notes: PoC（#73）で、権限のモード `default` でもスキルから呼んだ MCP のツールに確認が出ないことを確かめた
  - item: 共通のファイルの参照
    constraint: 本文では `${CLAUDE_PLUGIN_ROOT}/skills/mindmap/...` と書く。本文が指すパスは全てプラグインの中に実体がある
  - item: 引き継ぎ
    constraint: 最後に `/mindstella:session {ワークスペースのフォルダ}` で続けるよう案内する
  - item: 版の比較
    constraint: '既存のワークスペースでは `status` の前に `migrate` を `plan: true` で呼ぶ。`relation` が `older` なら `/mindstella:upgrade {フォルダ}` を案内して止まり、`newer` ならプラグインの更新を案内して止まる。`same` のときだけ `status` へ進む'
    notes: インターフェース定義『記録の形式の移行』（サーバー）
  - item: ツールの呼び出し
    constraint: ワークスペースの読み書きは全て mindstella の MCP のツール（`mcp__mindstella__{ツール}`）で行い、`workspace` にワークスペースのフォルダを渡す。設定は `init` の `settings` に JSON のオブジェクトで渡す。スクリプトを Bash で起動しない
    notes: インターフェース定義『MCP サーバーの起動』
  - item: MCP のツールが使えないとき
    constraint: 最初に mindstella の MCP のツールがあるかを見て、無ければワークスペースに何も書かず、起動スクリプト（`{プラグインのフォルダ}/bin/mindstella {ワークスペースのフォルダ}`）で立ち上げ直すよう案内して止まる
    notes: インターフェース定義『起動スクリプト』
refs:
  - dev/設計書/外部ライブラリ/claude-code#
  - dev/設計書/インターフェース定義/サーバー/MCPサーバーの起動#
notes:
  確かめないもの: スキルをモデルが読んで動かす振る舞い（たたき台・案内）は、費用が掛かり結果が揺れるためテストしない。読み込まれてスラッシュコマンドになることは PoC（#22）で、MCP のツールの許可の規則が当たることは PoC（#73）で確かめた
test_file: tests/integration/skill/test_setup.py

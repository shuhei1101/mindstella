title: "セットアップ"
entry:
  kind: operation
  value: '`/mindstella:setup [ワークスペースのフォルダ]`（利用者が Claude Code で呼ぶスキル。実体は `plugins/mindstella/skills/setup/SKILL.md`）'
flows:
  - name: 正常系
    summary: スキル setup のファイルが制約どおりの形で、プラグインの検証を通る
    setup:
      - name: Mock
        description: なし（リポジトリのファイルを読み、実際の Claude Code の `claude plugin validate` を起動する。モデルは呼ばない）
      - name: 設定のフォルダ
        description: テストごとの空の一時フォルダを Claude Code の設定のフォルダにする
        notes: 環境変数 `CLAUDE_CONFIG_DIR`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as skills/setup/SKILL.md
        participant C as Claude Code（claude plugin validate）

        クライアント->>IF: front matter と本文のパスを読む
        クライアント->>C: リポジトリの直下を検証する
        C-->>クライアント: 終了コード 0
      ```
    expected:
      - front matter の `name` が `setup`、`allowed-tools` が制約の値と一致する
      - 本文の `${CLAUDE_PLUGIN_ROOT}/` で始まるパスが全てリポジトリの中にある
      - 本文が指す `steps/` のファイルが全てある
      - 本文が呼ぶツールが全て `allowed-tools` にあり、サーバーのツールの一覧（『MCP サーバーの起動』）にある
      - 本文が `mindmap.py`・`build`・`check-env` を指さない
      - '本文が `migrate` を `plan: true` で呼ぶ'
      - 本文に、MCP のツールが無いとき起動スクリプトを案内して止まる分岐がある
      - '`claude plugin validate` が終了コード 0'
    test: test_normal
lead: 新しいワークスペースを作るか既存のワークスペースの状況を示して、`/mindstella:session` へ渡すスキルの入口と、そのファイルの形。
callers:
  - dev/設計書/シナリオ/単一ユースケース/話し合いのセットアップ#
side_effects: サーバーの MCP のツール `init` でワークスペースを作る（新しいワークスペースのときだけ）。起動スクリプトの登録では、登録のスクリプトがログインシェルの設定と `~/.config/mindstella/` を書く。スキルが自分でファイルを書くことはない
request:
  - name: $ARGUMENTS
    type: str
    required: false
    default: なし（ワークスペースのフォルダの指定を求める）
    location: argument
    description: ワークスペースのフォルダのパス。`.mindstella/config.yaml` か、直下の `config.yaml`・`mindmap.yaml` があれば既存（`.mindstella/config.yaml` が無く直下の設定ファイルだけなら、版が古いワークスペースとして移し替えを案内する）、どれも無ければ新しいワークスペースとして扱う
    example: ~/discussions/家計簿アプリ
exceptions:
  - name: なし（正常終了）
    condition: ファイルの形が制約どおりで、Claude Code がスキルとして読み込める
constraints:
  - item: ファイルの形
    constraint: '`skills/setup/SKILL.md` と `skills/setup/steps/`（`新しいワークスペース.md`・`既存のワークスペース.md`・`起動スクリプトの登録.md`）、登録のスクリプト `skills/setup/scripts/register.py`。進め方ガイド・質問の書式は `skills/mindmap/` の共通のものを読む'
  - item: front matter の name
    constraint: '`setup`'
  - item: front matter の description
    constraint: いつ使うか（話し合いを始める・再開するとき）が分かる 1 文
  - item: front matter の allowed-tools
    constraint: '`Read, mcp__mindstella__init, mcp__mindstella__status, mcp__mindstella__migrate, Bash(python3 ${CLAUDE_PLUGIN_ROOT}/skills/setup/scripts/register.py:*)`。Bash は登録のスクリプトだけを許す'
    notes: PoC（#73）で、権限のモード `default` でもスキルから呼んだ MCP のツールに確認が出ないことを確かめた
  - item: 共通のファイルの参照
    constraint: 本文では `${CLAUDE_PLUGIN_ROOT}/skills/mindmap/...` と書く。本文が指すパスは全てプラグインの中に実体がある
  - item: 引き継ぎ
    constraint: 最後に `/mindstella:session {ワークスペースのフォルダ}` で続けるよう案内する
  - item: 版の比較
    constraint: '既存のワークスペースでは `status` の前に `migrate` を `plan: true` で呼ぶ。`relation` が `older` なら `/mindstella:upgrade {フォルダ}` を案内して止まり、`newer` ならプラグインの更新を案内して止まる。`same` のときだけ `status` へ進む'
    notes: インターフェース定義『記録の形式の移行』（サーバー）
  - item: ツールの呼び出し
    constraint: ワークスペースの読み書きは全て mindstella の MCP のツール（`mcp__mindstella__{ツール}`）で行い、`workspace` にワークスペースのフォルダを渡す。設定は `init` の `settings` に JSON のオブジェクトで渡す。Bash で起動するのは登録のスクリプト（インターフェース定義『起動スクリプトの登録』）だけで、ワークスペースを触るスクリプトを Bash で起動しない
    notes: インターフェース定義『MCP サーバーの起動』
  - item: MCP のツールが使えないとき
    constraint: 最初に mindstella の MCP のツールがあるかを見て、無ければワークスペースに何も書かず、登録のスクリプトを `show` で呼ぶ。未登録なら `steps/起動スクリプトの登録.md` で登録を持ちかける。登録済みなら、新しいシェルで `mindstella {ワークスペースのフォルダ}`（アカウントごとの alias があればその名前も）で立ち上げ直すよう案内して止まる。利用者が登録を変えたい・外したい・アカウントを足したいと言ったときは、MCP のツールの有無に関わらず `steps/起動スクリプトの登録.md` へ進む
    notes: インターフェース定義『起動スクリプト』『起動スクリプトの登録』
  - item: 新しいワークスペースの設定
    constraint: 話題に合う進め方ガイドを 1 つ以上選んですべて読み、`playbooks` に並べる。複数選んだときは各ガイドのフェーズから 1 本の `phases` のたたき台を作る。題名（`summary`）は必ず決め、話し合いの概要（`description`。1 文の短い文）のたたき台も作る。ゴールは候補に「決めずに始める」を並べ、選ばれたら `goal` を渡さない
    notes: 単一ユースケース『話し合いのセットアップ』
refs:
  - dev/設計書/外部ライブラリ/claude-code#
  - dev/設計書/インターフェース定義/サーバー/MCPサーバーの起動#
  - dev/設計書/インターフェース定義/スキル/起動スクリプトの登録#
notes:
  確かめないもの: スキルをモデルが読んで動かす振る舞い（たたき台・案内）は、費用が掛かり結果が揺れるためテストしない。読み込まれてスラッシュコマンドになることは PoC（#22）で、MCP のツールの許可の規則が当たることは PoC（#73）で確かめた
test_file: tests/integration/skill/test_setup.py

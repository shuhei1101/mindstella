title: "話し合いの進行"
entry:
  kind: operation
  value: '`/mindstella:session [ワークスペースのフォルダ]`（利用者が Claude Code で呼ぶスキル。実体は `plugins/mindstella/skills/session/SKILL.md`）'
flows:
  - name: 正常系
    summary: スキル session と共通の置き場所のファイルが制約どおりの形で、プラグインの検証を通る
    setup:
      - name: Mock
        description: なし（リポジトリのファイルを読み、実際の Claude Code の `claude plugin validate` を起動する。モデルは呼ばない）
      - name: 設定のフォルダ
        description: テストごとの空の一時フォルダを Claude Code の設定のフォルダにする
        notes: 環境変数 `CLAUDE_CONFIG_DIR`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant クライアント
        participant IF as skills/session/SKILL.md
        participant C as Claude Code（claude plugin validate）

        クライアント->>IF: front matter と本文のパスを読む
        クライアント->>C: リポジトリの直下を検証する
        C-->>クライアント: 終了コード 0
      ```
    expected:
      - front matter の `name` が `session`、`allowed-tools` が制約の値と一致する
      - '`steps/` に 7 つのステップのファイルがあり、SKILL.md のステップの表がその全てを指す'
      - SKILL.md が `## 記録の書き方` の節を持つ
      - SKILL.md と `steps/` の本文の `${CLAUDE_PLUGIN_ROOT}/` で始まるパスが全てリポジトリの中にある
      - SKILL.md と `steps/` の本文が呼ぶツールが全て `allowed-tools` にあり、サーバーのツールの一覧（『MCP サーバーの起動』）にある
      - SKILL.md と `steps/` の本文が `mindmap.py`・`build`・`preview.html` を指さず、`config.yaml` を Edit ツールで直す手順を持たない
      - '本文が `migrate` を `plan: true` で呼び、その後に `submissions` を呼ぶ'
      - 本文に、MCP のツールが無いとき起動スクリプトを案内して止まる分岐がある
      - '`steps/プレビュー.md` が `preview_url` を呼ぶ'
      - '`steps/範囲の見直し.md` が `update_settings` を呼ぶ'
      - '`skills/mindmap/` に SKILL.md が無く、`references/`・`playbooks/` がある'
      - '`playbooks/` に システム開発・調査・資料作り・壁打ち の 4 つのガイドがあり、どれも制約の 6 つの節をその並びで持ち、`## ゴールの候補` に `（既定）` の行が 1 つだけある'
      - スキルの全ての Markdown に特定の開発基盤の名前が無い
      - '`claude plugin validate` が終了コード 0'
      - '`steps/取り込み.md`・`ヒアリング.md`・`リサーチ.md`・`方針転換.md` が `commit` を呼ぶ'
      - 本文が準備で `changes_since_read` を `submissions` より前に呼ぶ
      - '`steps/取り込み.md` が `batch` を呼ぶ'
      - '`steps/取り込み.md` が `tags` を呼ぶ'
      - 本文が準備で `readme` を `changes_since_read` より前に呼ぶ
    test: test_normal
lead: 作成済みのワークスペースで、取り込み・ヒアリング・リサーチ・方針転換・範囲の見直し・プレビュー・ゴール判定のステップを回すスキルの入口と、そのファイルの形。
callers:
  - dev/設計書/シナリオ/複合ユースケース/話し合いをゴールまで進める#
side_effects: サーバーの MCP の書き込むツールでワークスペースの YAML を書き換える。準備で取り込んだ送信を `take_submission` で取り込み済みにする。リリースの資料（`.mindstella/release/`）はスキルが Markdown を書き、そのとき利用者に書き込みの確認が出る。リリースの資料を書く前に `clear_release` で `.mindstella/release/` の中身を消す。リサーチではサブエージェントが Web を調べる。配る書き出しを頼まれたときは `export` で、利用者が示したパスへ HTML を書き出す
request:
  - name: $ARGUMENTS
    type: str
    required: false
    default: なし（同じ会話で `setup` が渡したフォルダを使う。無ければ `/mindstella:setup` を案内する）
    location: argument
    description: ワークスペースのフォルダのパス
    constraints: '`.mindstella/config.yaml` か、直下の `config.yaml`・`mindmap.yaml` があるフォルダ。無ければ書き込まず `/mindstella:setup` を案内する'
exceptions:
  - name: なし（正常終了）
    condition: ファイルの形が制約どおりで、Claude Code がスキルとして読み込める
constraints:
  - item: ファイルの形
    constraint: '`skills/session/SKILL.md` と `skills/session/steps/`（`取り込み.md`・`ヒアリング.md`・`リサーチ.md`・`方針転換.md`・`範囲の見直し.md`・`プレビュー.md`・`ゴール判定.md`）。SKILL.md は入力・ステップの表・記録の書き方・ツールと引数の一覧だけを持ち、各ステップは `steps/` を指す'
  - item: 共通の置き場所
    constraint: '`skills/mindmap/`（SKILL.md を持たない）に `references/`（質問の書式・文章の書き方・リサーチの調べ方）・`playbooks/`（システム開発・調査・資料作り・壁打ち）・`scripts/`・`schemas/`・`preview/`・`README.md` を置き、setup と session の両方が読む'
  - item: front matter の name
    constraint: '`session`'
  - item: front matter の description
    constraint: いつ使うか（セットアップの後に話し合いを進めるとき）が分かる 1 文
  - item: front matter の allowed-tools
    constraint: '`Read, Agent, WebSearch, WebFetch` と、`init` を除く mindstella の MCP のツール（`mcp__mindstella__add`・`update`・`update_settings`・`adopt`・`edit_option`・`batch`・`changes_since_read`・`commit`・`pending`・`status`・`next`・`impact`・`find`・`show`・`attrs`・`tags`・`check`・`goal`・`migrate`・`clear_release`・`export`・`preview_url`・`readme`・`submissions`・`take_submission`。`mcp__mindstella__` を頭に付けて並べる）。Write・Edit・Bash は許していない'
    notes: Agent・WebSearch・WebFetch はリサーチのサブエージェントに使う。許可がサブエージェントの WebSearch・WebFetch に及ぶことは PoC で確かめた。`docs/` の本文は `add`・`update` の `body_markdown` で、`config.yaml` は `update_settings` で書く。`release/` の Markdown の書き出しは、数が少ないため利用者の確認に回す（パスで絞れない Write・Edit を話し合いの間ずっと許さない）
  - item: 共通のファイルの参照
    constraint: 本文では `${CLAUDE_PLUGIN_ROOT}/skills/mindmap/...` と書く。本文が指すパスは全てプラグインの中に実体がある
  - item: リサーチの確認
    constraint: サブエージェントの起動前に「何を・どの観点で・何体で」を示して確認を取る。利用者が自分から頼んだときだけ省く
  - item: スキルの中の名前
    constraint: 特定の開発基盤の名前を出さない（アーキテクチャ図の制約）
  - item: 進め方ガイド
    constraint: '`playbooks/{分野}.md` は、`## 最上位の軸の呼び名`・`## カテゴリーの分け方`・`## フェーズと観点`・`## 必ず調べるもの`・`## ゴールの候補`・`## リリースの形` の節をこの並びで持つ。`## ゴールの候補` は `（既定）` を付けた行を 1 つだけ持つ。準備では `config.yaml` の `playbooks` に並んだガイドをすべて読む'
    notes: 資料作り・壁打ちの値は補足の `進め方ガイドの分野`
  - item: 配る書き出し
    constraint: 利用者が記録を人に渡したいと言ったときだけ、プレビューのステップで書き出す先のパスを利用者に聞き、`export` を `workspace`・`out` で呼ぶ。書き出す先にワークスペースの `.mindstella/` の中を指さない。書き出したら `path` の絶対パスと、ネットにつながらなくても開けて書き込む操作が無いことを示す
    notes: '`release/` は `clear_release` が中身を消す。インターフェース定義『配る書き出し』（サーバー）'
  - item: 版の比較
    constraint: '準備のステップで `.mindstella/config.yaml`（無ければ直下の `config.yaml` か `mindmap.yaml`）を読んだ後に `migrate` を `plan: true` で呼ぶ。`relation` が `older` なら何も書き込まず `/mindstella:upgrade {フォルダ}` を案内して止まり、`newer` ならプラグインの更新を案内して止まる'
    notes: インターフェース定義『記録の形式の移行』（サーバー）
  - item: ツールの呼び出し
    constraint: ワークスペースの読み書きは全て mindstella の MCP のツール（`mcp__mindstella__{ツール}`）で行い、`workspace` にワークスペースのフォルダを渡す。項目の中身は `add`・`update` の `item` に JSON のオブジェクトで渡し、`docs/` の本文はその `body_markdown` で書く。スクリプトを Bash で起動しない。書き換えはサーバーが開いている画面へ知らせるため、書いた後に書き出しを流さない
    notes: インターフェース定義『MCP サーバーの起動』『書き換えの知らせ』
  - item: MCP のツールが使えないとき
    constraint: 準備の最初に mindstella の MCP のツールがあるかを見て、無ければワークスペースに何も書かず、起動スクリプト（`{プラグインのフォルダ}/bin/mindstella {ワークスペースのフォルダ}`）で立ち上げ直すよう案内して止まる
    notes: インターフェース定義『起動スクリプト』
  - item: 送信の取り込み
    constraint: 準備のステップで版の比較の後に `submissions` を呼ぶ。1 件以上あれば、届いていた送信を利用者に示し、送った順に 1 件ずつ取り込みのステップで記録してから `take_submission` で取り込み済みにする。一覧を読んだだけでは取り込み済みにしない。0 件なら取り込みを飛ばす。示すとき、箇所（`loc`）を持つ送信は本文の行の範囲か値のキーと選んだ文を添え、`target` が `null` の送信は項目を指さない旨を添える。箇所を持つ送信はその箇所への意見として、項目を指さない送信は発言と同じく対象を振り分けて記録する
    notes: 単一ユースケース『送信の取り込み』
  - item: プレビュー
    constraint: プレビューのステップで `preview_url` を呼び、返った `url` を示す。開く画面と項目が決まっていれば URL のハッシュ（インターフェース定義『プレビューを開く』）を付けて示す。ブラウザは開かない
    notes: インターフェース定義『プレビューの URL』
  - item: 範囲の見直し
    constraint: 範囲が広がった・利用者が題名・話し合いの概要・ゴール・プレイブック・最上位の軸の呼び名・対象・カテゴリーを変えたいと言った・話の中身と呼び名が合わなくなった・ゴール判定でゴールが無く利用者が決めると言ったときに回す。書き換えのたたき台を示し、フェーズ・対象・カテゴリーが変わるときは新しい設定に無い古い名前ごとの対応の表も示して、利用者が確定してから `update_settings`（`settings`・`phase_map`・`target_map`・`category_map`）を呼ぶ。終えたら会話ログを足す
    notes: 単一ユースケース『話し合いの範囲の見直し』、インターフェース定義『設定の更新』（サーバー）
  - item: 書き換えのまとまり
    constraint: 取り込み・ヒアリング・リサーチ・方針転換の各ステップで記録を書き換え終えたら、そのステップで何をしたかを一言の説明にして `commit` を呼ぶ。書き換えが無いステップでは呼ばない。範囲の見直しは `update_settings` のフェーズ・対象・カテゴリーの付け替えを変更履歴の対象にしないと決めたため、`commit` を呼ぶステップに入れない。準備のステップで `pending` が空でなければ、前の話し合いでまとめ忘れた分として説明を付けて `commit` する
    notes: インターフェース定義『書き換えのまとまり』『まだまとめていない変更』
  - item: 記録の書き方
    constraint: SKILL.md の `## 記録の書き方` に、記録（検討事項・タスク・調査・資料・用語集・メモ・会話ログ）は状況が変わるたびに利用者に確かめずに足し、書き換えることと、確かめるのはワークスペースの外へ書き込むときだけであることを書く。設定（`config.yaml`）の書き換え・リサーチの起動前の確認・ゴール判定の確定は記録の書き込みに含めず、それぞれのステップの確かめを残す
    notes: 全てのステップに効くため、準備で必ず読まれる SKILL.md に置く
  - item: 検討事項の案
    constraint: '取り込みで検討事項を足すときに、案（`options` の `key`・`content`・`pros`・`cons`）を書いて足す。決まったこととして足すときは、選ばれた案を `adopted: true` にする。既にある検討事項の案を足す・直す・消すときは `edit_option` を使い、`update` で案の配列を丸ごと渡さない。採用している案を消すときは、先に `adopt` で採用を移す。ヒアリングは検討事項が持つ案を案の表に出し、案の無い検討事項は案を書き足してから聞く'
    notes: 単一ユースケース『発言の取り込み』『ヒアリング』
  - item: 納品物の資料
    constraint: 'ゴールの納品物のうち `doc` を持たないものがあれば、取り込み（範囲の見直しで納品物を足したときはその後）で、概要・背景・最終的な構成を先に置いた本文の資料（`deliverable: true`・`status: 下書き`）を `add` で足し、`update_settings` で納品物の `doc` から指す。以降は決まったことに合わせて本文を `update` で書き足す'
    notes: 単一ユースケース『発言の取り込み』『話し合いの範囲の見直し』
  - item: 用語集
    constraint: 一般的でない言葉（システムの名前・業務や製品の固有の言葉・話し合いで決めた呼び名）は、利用者が指定しなくても用語集に足す。リサーチの結果や読んだコード・ドキュメントにある固有の言葉も足す。一般的な技術の言葉は、利用者が指定したときだけ足す
    notes: 単一ユースケース『発言の取り込み』『リサーチ』
  - item: タスクの成果と資料
    constraint: '作業・検証のタスクで作った成果は 1 件ずつ資料にし、タスクの `related` から指す。成果の資料はゴールの納品物に当たるときだけ `deliverable: true` にする。タスクを完了にする前と、ゴール判定で `goal` が届いたと返した後の確定を取る前に、成果と資料が 1 対 1 で揃っているかを確かめ、欠けていれば資料を足す。調査のタスクの成果は調査の記録に書き、資料にしない'
    notes: 調査は一次情報をまとめたもの、資料は調査を踏まえて今の話し合いで使える形にしたもの。単一ユースケース『発言の取り込み』『ゴール判定』
  - item: 前回読んだ時点からの変更
    constraint: 準備のステップで版の比較が `same` のとき、`submissions` より前に `changes_since_read` を必ず呼ぶ。`added`・`changed` があれば、前回の後に足された・変わった項目として利用者に短く示し、話し合いの前提にする。`had_read_point` が偽なら何も示さない
    notes: 単一ユースケース『前回読んだ時点からの変更を読む』、インターフェース定義『前回読んだ時点からの変更』（サーバー）
  - item: まとめての書き込み
    constraint: 取り込みで、利用者の 1 つの発言から出た記録（項目の追加・更新と会話ログ）は `batch` で 1 回に書く。同じ発言で足す項目を指すときは `$番号` を使う。設定の書き換え（`update_settings`）と採用の切り替え（`adopt`）は `batch` に含めず、別に呼ぶ
    notes: 単一ユースケース『発言の取り込み』、インターフェース定義『まとめての読み書き』（サーバー）
  - item: 話題のタグ
    constraint: 取り込みで記録を `batch` で書く前に `tags` を引き、既にある話題のタグを使い回し、新しい話題のときだけタグを作って `tags` に付ける。1 項目に複数の話題が当たるときは全て付ける。対象は作るものの区分として使い、話題には使わない
    notes: 単一ユースケース『発言の取り込み』、インターフェース定義『タグの一覧』（サーバー）
  - item: 記録の置き場所
    constraint: 手順が Read で読む設定と YAML、リリースの資料を書き出す先は、全て `{ワークスペースのフォルダ}/.mindstella/` の下を指す（`.mindstella/config.yaml`・`.mindstella/decisions.yaml`・`.mindstella/release/`）。進め方ガイドの「リリースの形」も `.mindstella/release/` を指す
  - item: 全ての種類の本文
    constraint: 取り込みのステップは、タスク・用語集・メモにも経緯や補足があれば `body_markdown` で本文を書く（脱線で調べたことはメモの本文に残す）。どの種類に何を本文に書くかは取り込みの手順の表が決める
  - item: README の書き直し
    constraint: 準備のステップで版の比較が `same` のとき、`changes_since_read` より前に `readme` を呼ぶ。`written` が偽（利用者が書いた README）でも利用者には示さずに続ける
    notes: 単一ユースケース『README の書き直し』、インターフェース定義『README の書き出し』（サーバー）
refs:
  - dev/設計書/外部ライブラリ/claude-code#
  - dev/設計書/インターフェース定義/サーバー/MCPサーバーの起動#
  - dev/設計書/シナリオ/単一ユースケース/送信の取り込み#
notes:
  確かめないもの: スキルをモデルが読んで動かす振る舞いは、費用が掛かり結果が揺れるためテストしない。サブエージェントの起動と許可が及ぶことは PoC（#22）で確かめた
  進め方ガイドの分野: |-
    | 分野 | 最上位の軸の呼び名 | フェーズ | ゴールの候補 |
    | --- | --- | --- | --- |
    | 資料作り | 資料 | 目的 → 読み手 → 構成 → コンテンツ → 仕上げ | 構成まで / コンテンツまで（既定）/ 仕上げまで |
    | 壁打ち | テーマ | 問い → 発散 → 整理 → 絞り込み → 結論 | 整理まで / 結論まで（既定） |
test_file: tests/integration/skill/test_session.py

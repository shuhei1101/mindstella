        IF->>IF: 既定の動作を止め、id が usage の要素まで本文のスクロール領域を送る
        ユーザー->>IF: #%E4%BD%BF%E3%81%84%E6%96%B9 のリンクを押す
        IF->>IF: id が「使い方」の要素まで本文のスクロール領域を送る
        ユーザー->>IF: #none のリンクを押す
        IF->>IF: 既定の動作を止める
    expected:
      - '`#usage` のリンクを押すと、`id="usage"` の見出しが詳細パネルの本文のスクロール領域の見える範囲に入り、後ろの画面は送られない'
      - パーセントエンコードした `#` のリンクを押すと、`id="使い方"` の見出しが見える範囲に入る
      - '`#none` のリンクを押しても、本文のスクロール領域の位置が変わらない'
      - どのリンクを押しても、タブは増えず、URL のハッシュは `tab=docs&id=A-1` のままで、iframe の文書の場所が変わらない
    test: test_normal_when_html_body_anchor_link
  - name: 正常系（HTML の本文の開かないリンクを押す）
    summary: 相対の URL と `http:`・`https:`・`mailto:` 以外のスキームのリンクは、押しても開かず、枠の中でも移らない
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 本文を HTML で持つ資料 A-1 を持つワークスペース
        notes: 本文は `href="other.html"`・`href="/mindstella.html"`・`href="javascript:parent.__mark=1"`・`href="data:text/html,x"` のリンクを持つ。ハッシュは `tab=docs&id=A-1`
    flow: |-
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信

        ユーザー->>IF: #tab=docs&id=A-1 で開く
        IF-->>SV: GET /api/records
        SV-->>IF: 記録（marked_bodies に A-1.html）
        IF->>IF: sandbox の iframe に A-1 の本文を描き、枠の文書に押下の受け手を足す
        IF-->>ユーザー: A-1 の詳細パネル
        ユーザー->>IF: 4 つのリンクを順に押す
        IF->>IF: 既定の動作を止める
    expected:
      - どのリンクを押しても、タブは増えない
      - どのリンクを押した後も、詳細パネルの iframe は A-1 の本文を描いたままで、iframe の文書の場所が変わらない
      - ページの変数に印が残らない（`javascript:` が実行されていない）
    test: test_normal_when_html_body_link_not_opened
  - name: 正常系（HTML の本文のリンクの文を選ぶ）
    summary: リンクの文をなぞって選んだ直後の押下では開かず、選んだ後にリンクを押す・Enter を押すと開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）。リンク先は、テストが別のポートで配るページ（外のサイトへ通信しない）
      - name: make_workspace
        description: 本文を HTML で持つ資料 A-1 を持つワークスペース
        notes: '本文は段落と、リンク先のページを指すリンクを持つ。ハッシュは `tab=docs&id=A-1`。なぞって選ぶ操作は、枠の文書へ `pointerdown` を送り、Range でリンクの文を選び（`selectionchange`）、`pointerup` とリンクへの `click`（`detail` が 1）を送って作る（sandbox の iframe の上では Playwright の `page.mouse` が返らない。PoC #215）'
    flow: |-
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信

        ユーザー->>IF: #tab=docs&id=A-1 で開く
        IF-->>SV: GET /api/records
        SV-->>IF: 記録（marked_bodies に A-1.html）
        IF->>IF: sandbox の iframe に A-1 の本文を描き、枠の文書に押下の受け手を足す
        IF-->>ユーザー: A-1 の詳細パネル
        ユーザー->>IF: リンクの文をなぞって選ぶ
        IF->>IF: 既定の動作を止める（開かない）
        IF-->>ユーザー: 選んだ箇所のコメントの入口
        ユーザー->>IF: 文を選んだまま、リンクにフォーカスして Enter を押す
        IF->>IF: 既定の動作を止め、window.open で開く
        IF-->>ユーザー: リンク先を開いた新しいタブ
    expected:
      - リンクの文をなぞって選んだ直後は、タブが増えず、選んだ箇所のコメントの入口が出る
      - 文を選んだまま、リンクにフォーカスして Enter を押すと、リンク先を開いたタブが 1 つ増える
      - どの操作の後も、iframe の文書の場所が変わらない
    test: test_normal_when_html_body_link_text_selected
lead: 利用者がサーバーの配信の URL をブラウザで開くと、記録をサーバーから読み、URL のハッシュが指す画面・表示形式・項目を開く。書き換えの知らせを受けると描き直し、詳細パネルから項目ごとに回答・意見を送る。
idempotent: false
side_effects: コメント・返信を溜める・直す・消す・書きかけを書くと、サーバーがワークスペースの `comments.yaml`・`drafts.yaml` を書き換える。まとめて送ると `threads.yaml` にスレッドと返信を足し（『コメントをまとめて送る』）、クローズ・オープンへの戻しで `threads.yaml` の状態を書き換える（『画面からのスレッドの状態の書き換え』）。タブを開くと、サーバーが `.mindstella-opened` を書き換える（『前回開いた日時』）。ほかの記録は書き換えない。端末の保存領域（`localStorage`）に個人の上書き（見た目・表示する種類・ライト / ダーク・表の表示する列・ピン留め）と変更履歴で選んだ時点を書き、サーバーの配信では画面ごとの絞り込みの条件も書く。表示の設定で「ワークスペースの既定にする」を保存すると、サーバーが `config.yaml` の `display` を書き換える（『設定の既定の書き換え』）
callers:
  - dev/設計書/シナリオ/複合ユースケース/プレビューで記録を読み返す#
request:
  - name: mindmap-data
    type: JSON（`<script type="application/json" id="mindmap-data">` の中身）
    required: false
    description: 配る書き出しが埋め込んだ記録。形はインターフェース定義『記録の取得』のレスポンスと同じ。サーバーの配信では空で、画面は『記録の取得』を読む
  - name: tab
    type: "'overview' | 'decisions' | 'tasks' | 'research' | 'docs' | 'terms' | 'notes' | 'logs' | 'graph'"
    required: false
    default: overview
    description: 開く画面（タブとネットワーク）
    constraints: 上の値のどれでもないとき、表示しない種類（個人の上書きかワークスペースの既定）を指すときは、`overview` で開く（`overview` と `graph` は常に開ける）
    notes: URL のハッシュの引数
  - name: view
    type: "'map' | 'board' | 'cards' | 'table'"
    required: false
    default: 画面ごとの既定（`decisions` は `map`、`tasks` は `board`、`docs` は `cards`、それ以外は `table`）
    description: 表示形式。既定と違うときだけハッシュに書く
    constraints: その画面が持たない形式のときは既定の形式で開く
    notes: URL のハッシュの引数
  - name: id
    type: str
    required: false
    default: なし（詳細パネルを開かない）
    description: 詳細パネルで開く項目の ID
    constraints: '`D-`・`T-`・`R-`・`A-`・`G-`・`N-`・`L-` に数字。記録に無い ID のときは詳細パネルを開かない'
    example: D-3
    notes: URL のハッシュの引数
  - name: full
    type: "'1'"
    required: false
    default: なし（詳細パネルで開く）
    description: 詳細を全画面で開く
    constraints: '`id` があるときだけ効く'
    notes: URL のハッシュの引数
  - name: f.{列}
    type: str
    required: false
    default: なし（絞り込まない）
    description: 開いた画面を、その列の値で絞って開く。どの表示形式（マップ・ボード・カード・表・ネットワーク）でも絞り込みのドロワーの条件として効き、画面の既定の条件（検討事項の状態）を置き換える。概要の「すべて表示」・セルが作る
    constraints: 複数の値は `|` でつなぐ。列が `~{列}` のときは文字の条件で、その列の値に文字を含む行に絞る（大文字・小文字を区別せず、文字の中の `|` で分けない）。開いたときに一度だけ読み、絞り込みを変えてもハッシュには書き戻さない
    example: f.status=要見直し
    notes: URL のハッシュの引数
  - name: コメントの本文
    type: str
    required: false
    default: なし（溜めない）
    description: 詳細パネル・詳細の全画面・コメントの一覧の入力欄に書いて溜める本文。開いている項目の ID（一覧の入力欄は無し）と添えた箇所と一緒に『レビュー中のコメントの追加』へ送る
    constraints: 前後の空白を除いて 1 文字以上、10000 文字以下
    example: 案 A にする
    notes: 利用者の入力。サーバーの配信でだけ受ける
  - name: 個人の上書き
    type: '{network_look?, visible_kinds?, theme?, columns?}'
    required: false
    default: なし（ワークスペースの既定で表示する）
    description: ネットワークの見た目のドロップダウン・表示の設定のパネルの表示する種類・トップバーのライト / ダーク・表の表示する列で選んだ値。項目ごとに、あればワークスペースの既定より優先する
    constraints: '`network_look` は `glow`・`starlight`・`constellation`・`deep`・`dust` のどれか、`visible_kinds` は `decisions`・`tasks`・`research`・`docs`・`terms`・`notes`・`logs` の配列。読めない値の項目は持たないものとして扱う'
    notes: 利用者の操作。端末の保存領域に持ち、URL のハッシュには書かない。「既定に戻す」で全て外す
  - name: 変更履歴で選んだ時点
    type: None | 'since' | 'pending' | str
    required: false
    default: なし（差分を出さない）
    description: 差分の表示で比べる時点。`since` は「前回開いてから」、`pending` は「まだまとめていない変更」、それ以外はまとまりの ID（`V-{番号}`）
    constraints: 記録に無いまとまりの ID・まだまとめていない変更が空の `pending` のときは差分を出さない
    notes: 利用者が変更履歴のモーダルで選ぶ。端末の保存領域に持ち、URL のハッシュの `diff` にも書く
  - name: 選んだ範囲
    type: Range
    required: false
    default: なし（入口を出さない）
    description: 詳細パネル・詳細の全画面で、本文の文か項目の値を選んだ範囲。本文は元の Markdown か HTML の行の範囲に、値はキーのパスに対応づけて箇所にする
    constraints: 本文と値の外・空の選択・Markdown の中の `html` のコードブロックを描いた枠の中の選択・差分の表示の間の HTML の本文の中の選択では入口を出さない
    notes: 利用者の操作。サーバーの配信でだけ受ける
  - name: h
    type: str
    required: false
    default: なし（本文の頭で開く）
    description: '詳細パネル（`full` のときは全画面）の本文の、開いたときに画面に入れる見出し。本文の見出しの右の # を押すと書く'
    constraints: 見出しの文言の空白を `-` にした形。同じ文言の見出しが 2 つ以上あるときは、本文の頭から 2 つ目が `-1`、3 つ目が `-2` を続ける。`id` があるときだけ効く。本文に無い見出しのときと、本文が HTML の資料のときは本文の頭で開き、ハッシュから `h` を外す
    example: 決め方
    notes: URL のハッシュの引数。本文の中の `[文言](#見出し)` のリンクは、同じ形で見出しを指す
  - name: diff
    type: "'since' | 'pending' | str"
    required: false
    default: なし（端末の保存領域に残した時点。残していなければ差分を出さない）
    description: 差分の表示で比べる時点。値は『変更履歴で選んだ時点』と同じ
    constraints: 端末の保存領域に残した時点より先に読み、差分を出せた時点を保存領域にも残す。記録に無いまとまりの ID・まだまとめていない変更が空の `pending` のときは差分を出さずに開き、ハッシュから `diff` を外す。ハッシュに `diff` が無く、保存領域の時点で差分を出せたときは、その時点をハッシュに書く
    example: V-2
    notes: URL のハッシュの引数。変更履歴で時点を選ぶと書き、差分の表示をやめると外す
request_example: |-
  ```text
  http://127.0.0.1:43817/mindstella.html#tab=decisions&view=table&id=D-3&f.status=%E8%A6%81%E8%A6%8B%E7%9B%B4%E3%81%97
  ```
response:
  - name: 画面
    type: DOM
    description: '`tab` の画面。タブの帯でそのタブが選ばれている（`aria-current="page"`）'
  - name: 表示形式
    type: DOM
    description: 表示形式の切り替えで `view` の形式が押されている（`aria-pressed="true"`）
  - name: 詳細パネル
    type: DOM
    description: '`id` の項目の詳細。`full` のときは全画面のモーダル。`h` があれば、その見出しを本文の中で画面に入れて開く'
  - name: 条件のチップ
    type: DOM
    description: '絞り込みのドロワーで選んでいる条件（`f.{列}` で開いたときはその列と値）ごとのチップ。画面の項目はその条件に合うものだけ。トップバーの絞り込みのボタンに、値を 1 つ以上選んでいる条件の数のバッジが付く'
  - name: 読めなかったライブラリの知らせ
    type: DOM（`role="alert"`）
    description: 描画のライブラリが読めなかったとき、そのライブラリを使う箇所（本文・図・マップ）に、読めなかったライブラリの名前を出す
  - name: 回答・意見の入力
    type: DOM
    description: 詳細パネル・詳細の全画面の下端に留めた入力欄と送るボタン。サーバーの配信でだけ出し、配る書き出しでは出さない
  - name: 送信の結果
    type: DOM（`role="status"`）
    description: 送っている・送った・本文が空・送れなかった（理由）を入力の近くに出す。読み上げの対象にする
  - name: 接続の状態
    type: DOM（`role="status"`）
    description: サーバーにつながらない間、トップバーにつながらないことと、描いている記録を読んだ日時（`built_at`）を出す。つながり直したら消す。配る書き出しでは出さない
  - name: 変更履歴
    type: DOM（モーダルの dialog）
    description: トップバーの「変更履歴」で開く。先頭から「差分を出さない（今の内容）」・「まだまとめていない変更」（あるときだけ）・「前回開いてから」・`changes.sets` のまとまりを新しい順に、日時・説明・変わった項目の数つきで並べる。選んだ時点に印を付ける
  - name: 差分の表示
    type: DOM
    description: 時点を選んだ間だけ出す。トップバーの選んだ時点の札と外すボタン、その時点で足した項目の新規の印（+）と変えた項目の変更の印（●）、印の付いた項目を持つタブの点、詳細パネル・資料の本文・図・Raw・キーの前後の差分。HTML の本文は、今の本文を描いた上で変わった行を含む要素に印を付け、「原文の差分」に切り替えると原文の行の差分を出す。印は読み上げの名前を持ち、足した・消したは記号か下線・取り消し線を併せる
  - name: 表示の設定
    type: DOM
    description: トップバーの「表示の設定」で、コメントの一覧と同じ左のパネルに開く。表示する種類・「この端末で変えている項目」・「既定に戻す」・「ワークスペースの既定にする」（サーバーの配信で、選びが既定と違うときだけ）を持つ。見た目はネットワークのドロップダウンで選び、パネルでは選ばない（変えている項目・既定に戻す・既定にするの対象には含める）。既定にする前は確かめのモーダルで今の既定と保存する値を並べ、保存に失敗したらモーダルの中に理由を出す
  - name: 表示する種類
    type: DOM
    description: 表示しない種類のタブをトップバーから外す。概要とネットワークは常に出す。概要のタイルは残し、表示しない種類の画面へのリンクだけを外す
  - name: 既定が変わった知らせ
    type: DOM（`role="status"`）
    description: 書き換えの知らせで受けた新しい既定を上書きを持たない項目に当て直したとき、画面の下に「ワークスペースの既定が変わりました。」を 6 秒出す。同じ知らせを時刻つきで表示の設定のパネルにも残す
response_notes: |-
  > [!NOTE]
  > 開いた後の画面の移動・項目の移動も同じ形のハッシュに書き、同じ URL を開き直すと同じ画面と項目が開く。
constraints:
  - item: ハッシュの形
    constraint: '`#` の後ろを `URLSearchParams` の形（`キー=値` を `&` でつなぐ）で読み書きする。既定の値は書かない'
  - item: 履歴
    constraint: 画面の移動と、詳細パネル・全画面の中の項目の移動（本文の用語・項目の ID のリンクを含む）は履歴に積む。表示形式の切り替え・詳細パネルの開閉・重ねる画面の開閉・本文の見出しへの移動は積まずにハッシュを置き換える。幅 900px 以下の詳細パネルだけは開くときに積む
  - item: 記録
    constraint: '`mindmap-data` に中身があれば `JSON.parse` して読み、空なら開いたときに `GET /api/records` を読む。画面から記録を書き換えない（コメントはサーバーがレビュー中・送信として持つだけ）'
  - item: 描画のライブラリ
    constraint: 描画のライブラリ（`refs` の外部ライブラリの設計書）を配信元から、版を固定し `integrity` と `crossorigin="anonymous"` を付けた script 要素で読む。読めなかったときは代わりの読み込みをせず、そのライブラリを使う箇所に名前を出す。本文は原文を出し、表・ボード・カード・ネットワークはそのまま使える。配る書き出しは描画のライブラリを中に持ち、配信元から読まない
  - item: 本文の無害化
    constraint: '本文の Markdown は HTML に描いた後、無害化してから差し込む。図はスクリプトを動かさない安全の設定で描く。HTML の本文は、記録の `marked_bodies` を `sandbox="allow-same-origin"`（`allow-scripts` を付けない）の iframe の `srcdoc` に描き、本文のスクリプトを動かさず、本文の CSS を枠の外へ漏らさない。枠の高さは `ResizeObserver` で描いた中身に合わせる。Markdown の中の言語指定 `html` のコードブロックも、コードではなく同じ枠に描く（行の印は付けない）'
  - item: 文字
    constraint: 画面の文字（デザイン方針の書体）を文字の配信元から読む。読めないときは端末の文字で描く。配る書き出しは文字の配信元を読まず、端末の文字で描く
  - item: 端末の保存領域
    constraint: ライト / ダークと、表ごとの表示する列・ピン留め、変更履歴で選んだ時点を `localStorage` の 1 つのキーに持つ。サーバーの配信では、画面ごとの絞り込みの条件（値の選び・列の文字）も同じキーに持ち、条件を変えるたびに書く。配る書き出しは絞り込みの条件を保存しない。保存できない環境では開いている間だけ保つ
  - item: 通信
    constraint: 描画のライブラリと文字の配信元と、開いた配信（`127.0.0.1`）だけ。記録を外へ送らない。配る書き出しは通信しない。HTML の本文が外の画像・CSS を指すときだけ、描くときにブラウザがその URL を読みに行く（読めなければそのまま描く）
  - item: 描き直し
    constraint: サーバーの配信では `GET /api/events` につなぎ、`changed` を受けたら `GET /api/records` を読み直す。開いている画面・表示形式・URL のハッシュ・詳細パネルの項目・表の絞り込みと並べ替え・入力欄の書きかけを保ったまま描き直し、履歴に積まない。開いていた項目が記録から消えたら詳細パネルを閉じる。読み直しが 422 なら前に読んだ記録で描き続ける
  - item: サーバーにつながらないとき
    constraint: '`GET /api/events` のつながりが切れている間と、`GET /api/records` に届かないときは、接続の状態を出して前に読んだ記録で描き続ける。つなぎ直しはブラウザの `EventSource` に任せ、つながったら記録を読み直して接続の状態を消す。開いたときに一度も記録を読めなければ、接続の状態だけを出す'
  - item: 「前回開いてから」の範囲
    constraint: サーバーの配信では、タブで最初に記録を読む前に `POST /api/opened` を 1 度呼び、`previous` をそのタブの範囲の始まりにする（`sessionStorage` に持ち、同じタブで読み込み直しても呼び直さない）。`previous` が `null` か呼べなかったときはタブを開いた日時にする。配る書き出しは `localStorage` に前回開いた日時を持つ。範囲に入るのは、`at` が始まりより後のまとまりと、まだまとめていない変更
  - item: 前の版の組み立て
    constraint: 項目の `history` を新しいものから順に、選んだ時点の最初の `seq` まで当てる（キーは `before` で戻し、本文は `body_diff` で戻す）。選んだ時点の範囲の中の回が 1 つでも保持する回数を超えて消えていれば（範囲の要素が無いか、項目の `history_dropped_seq` が範囲の始まりの `seq` より大きい）、印だけ付けて詳細パネルにその旨を出す。`body_diff` の `now` が今の本文に当たらなければ、本文は今の内容を描いて差分を出せない旨を出し、キーの差分は出す。`update_settings` が付け替えた `phase` は変更履歴に無いため、前の版でも今の値で出す
  - item: 差分の表示と書き換え
    constraint: 差分の表示に入る・抜ける・時点を選び直すだけでは記録を読み直さず、履歴にも積まずにハッシュの `diff` を置き換える。画面・項目を移ってもハッシュの `diff` を保つ。書き換えの知らせで読み直したときは、同じ時点の差分の表示のまま描き直す。選んだまとまりが記録から消えたか（保持する回数を超えた）、`pending` を選んでいてまだまとめていない変更が空になったら、差分の表示をやめてハッシュから `diff` を外す
  - item: コメントの読み書き
    constraint: '開いたときに `GET /api/comments` を読み、コメントのボタンの件数・コメントの一覧・詳細の一番下のレビュー中のコメント・入力欄の書きかけを描く。溜める・直す・消す・元に戻す・まとめて送るはそれぞれの API へ `Content-Type: application/json` で送り、送っている間はそのボタンを押せなくする。空白だけの本文は送らずに理由を出す。届かない・エラーのときは本文を残して理由（届いたときは `detail`、409 のまとめて送るは `stale` を行ごとに）を出す。書きかけは入力が止まったときと入力欄を閉じるときに `PUT /api/drafts` へ送る。一覧のチェックは画面だけが持ち、溜めたコメントはチェックした状態で入る'
  - item: 選んだ箇所の対応づけ
    constraint: '本文は描くときにブロックへ元の行の印を付け、選択の端から元の Markdown の行の範囲を求める（PoC #80 の方式）。HTML の本文は、親の画面が iframe の文書に `pointerup`・`selectionchange` の受け手を足し、選択の端ごとに、文書の順で端より前にある `data-line` を持つ要素のうち最も後のものの行に、その要素の開きタグの直後から端までの文とコメントの中の改行の数を足して元の HTML の行を求める（`<br>` は数えない。`<pre>`・`<textarea>`・`<listing>` の開きタグの直後の改行は文書から落ちるため、その要素から数えるときは原文にその改行があれば 1 を足す）。入口の位置は iframe の中の選択の矩形に iframe の位置を足す。値は描いた要素にキーのパスを持たせる。選んだ文は描いた文のまま送る'
  - item: 画面の移動と項目
    constraint: タブの帯で画面を移るときは、ハッシュの `id` を残し、表示形式を移った先の画面の既定にする。移った先がネットワーク・検討事項のマップのときは、`id` の項目を選んだ項目として示す
  - item: 保存した絞り込みの条件
    constraint: サーバーの配信で画面を開くとき、その画面の保存した条件があれば画面の既定の条件（検討事項の状態）の代わりに当てる。URL のハッシュに `f.{列}` があればハッシュの条件で開き、保存した条件を書き換えない。保存した値が今の記録に無ければ、その値を外して描く。表示の設定の「既定に戻す」で全ての画面の保存した条件を外す
  - item: HTML の本文の差分
    constraint: 前の版の本文と今の本文の原文を行ごとに比べ、今の本文で足した行と、消した行と入れ替えた行（変えた行）を求める（空行だけを足した行は入れない）。描いた結果では、その行を含む最も内側の `data-line` を持つ要素に「足した」か「変わった」の印を付ける。行を含む要素は `data-line` ≦ 行 ≦ `data-line-end` の要素で、最も内側はそのうち文書の順で最後のもの（コメントの一覧から開いたときに示す要素も同じ）。消しただけの箇所は描いた結果に出せないため、原文の差分で見られる旨を添える。前の版の本文が Markdown（形式を替えた）のときは、原文の差分だけを出す
    notes: 差分の見せ方はモック作成でユーザーが案 C を選んだ（PR ドキュメントの確認ログ）
  - item: スレッドの読み書き
    constraint: コメントの一覧を開いたときと、書き換えの知らせを受けたときに `GET /api/threads` を読み、スレッドの一覧と開いているスレッドを描き直す（入力欄の書きかけ・開いているスレッド・一覧の絞り込みを保つ）。一覧の状態・タグの絞り込みは画面が持つ。返信は `POST /api/comments` に `thread` を渡してレビュー中に溜め、クローズとオープンへの戻しは理由を添えて `PATCH /api/threads/{id}` へ送る。開いているスレッドの状態が知らせで変わったら、変わる前の状態で開いた理由の入力を閉じる
    notes: 単一ユースケース『スレッドで話す』。画面の要素は画面設計で決める
  - item: HTML の本文の中のリンク
    constraint: 親の画面が枠の文書に `click`・`auxclick` の受け手を足し、押された要素から最も近い `href` を持つ `a`（SVG の `a` を含む）・`area` の押下を受けて、既定の動作を止める（枠の中では移らない。`target` の有無、Ctrl・Shift・Meta つき、中ボタン、Enter によらない）。`href` の属性の値が `#` で始まるリンクは、`#` の後ろを `decodeURIComponent` で戻した `id` を持つ枠の中の要素まで本文のスクロール領域を送り、その要素が無ければ何もしない（URL のハッシュは変えず、履歴に積まない）。それ以外は、`href` の属性の値がそれだけで絶対の URL として読め、スキームが `http:`・`https:`・`mailto:` のリンクだけを、親の画面の `window.open` に `_blank` と `noopener,noreferrer` を渡して開く。相対の URL とほかのスキーム（`javascript:`・`data:`・`file:` ほか）のリンクは開かない。ポインターを押してから離すまでの間に枠の中の選択が変わり、`click` の時点で選択が空でないときは、開かず送らない（リンクの文をなぞって選んだ直後）。キーボードからの `click`（`detail` が 0）は選択の有無によらず扱う。枠に描く全ての場所（HTML の本文・`html` のコードブロック・HTML の本文の差分の描いた結果・配る書き出し）で同じ
    notes: '測った記録（Chromium 151、Linux、headless と headed）: `mailto:` を `window.open`（`_blank`・`noopener,noreferrer`）で開くと、新しいタブは残らず、親の画面は移らず `beforeunload` も届かない。親の画面の文書のリンクとして押す開き方と `location.assign` は、親の画面に `beforeunload` が届くため採らない。メールのアプリが立ち上がるかは端末の設定によるため、テストでは `window.open` の呼び出しで確かめる'

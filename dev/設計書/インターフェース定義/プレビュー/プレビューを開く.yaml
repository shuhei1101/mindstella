title: "プレビューを開く"
entry:
  kind: screen
  value: 'サーバーの配信の URL（`preview_url` が返す `http://127.0.0.1:{ポート}/`。画面は『プレビューの配信』が返し、雛形は `plugins/mindstella/skills/mindmap/preview/`）。`export` が書き出した配る書き出しも同じ画面を開く'
  api: '`GET /api/records`（記録）・`GET /api/events`（書き換えの知らせ）・`GET`/`POST /api/comments`・`PATCH`/`DELETE /api/comments/{id}`（レビュー中のコメント）・`PUT /api/drafts`（書きかけ）・`POST /api/comments/send`（まとめて送る）。配る書き出しは呼ばず、記録を `mindmap-data` の要素から読む'
flows:
  - name: 正常系
    summary: ハッシュが指す画面・表示形式・項目を開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1・D-3（D-3 は要見直しで、本文に見出しと mermaid の図を持つ）を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信
        participant CDN as 描画のライブラリの配信元

        ユーザー->>IF: #tab=decisions&view=table&id=D-3 で開く
        IF-->>CDN: 描画のライブラリを読む
        IF-->>SV: GET /api/records
        SV-->>IF: 記録
        IF-->>SV: GET /api/events につなぐ
        IF-->>ユーザー: 検討事項の表と D-3 の詳細パネル
      ```
    expected:
      - タブの帯で検討事項が選ばれ、表示形式は表
      - 表に D-1・D-3 の行がある
      - 詳細パネルに D-3 が開き、本文の見出しが見出しの要素で、図が SVG で描かれている
      - 同じ URL を開き直すと同じ画面と項目が開く
    test: test_normal
  - name: 正常系（ハッシュが無い）
    summary: ハッシュが無いと概要を開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: ハッシュ無しで開く
        IF-->>ユーザー: 概要
      ```
    expected:
      - タブの帯で概要が選ばれている
      - 詳細パネルが開いていない
      - URL にハッシュが付かない
    test: test_normal_when_no_hash
  - name: 正常系（絞り込みの条件がある）
    summary: ハッシュの f.{列} で絞った表を条件のチップ付きで開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 要見直しの D-3・保留の D-4・未決定の D-1 を持つワークスペース
        notes: ハッシュは `tab=decisions&view=table&f.status=要見直し|保留`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: f.status=要見直し|保留 のハッシュで開く
        IF-->>ユーザー: 条件のチップ付きの検討事項の表
      ```
    expected:
      - 状態 = 要見直し・保留の条件のチップがある
      - 表の行が D-3・D-4 だけ
      - チップを外すと D-1 の行も出て、URL のハッシュに `f.` の引数が無い
    test: test_normal_when_filter_in_hash
  - name: 正常系（項目が記録に無い）
    summary: 記録に無い ID を指すハッシュでは画面だけを開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1 だけを持つワークスペース
        notes: ハッシュは `tab=decisions&id=D-99`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: #tab=decisions&id=D-99 で開く
        IF-->>ユーザー: 検討事項のマップ（詳細パネルなし）
      ```
    expected:
      - タブの帯で検討事項が選ばれ、表示形式はマップ
      - 詳細パネルが開いていない
      - URL のハッシュに `id` が無い
    test: test_normal_when_item_not_found
  - name: 正常系（配る書き出しを通信なしで開く）
    summary: 描画のライブラリを中に持つ配る書き出しは、通信が無くても本文・図・マップを描く
    setup:
      - name: Mock
        description: ブラウザから `file:` 以外への要求を全て失敗させ、要求の数を数える
      - name: exported_html
        description: 検討事項 D-3（本文に見出しと mermaid の図を持つ）を持つワークスペースから `export` で書き出した HTML
        notes: ハッシュは `tab=decisions&id=D-3`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as 配る書き出し

        ユーザー->>IF: #tab=decisions&id=D-3 で開く
        IF->>IF: 中に持つ描画のライブラリと mindmap-data を読む
        IF-->>ユーザー: 検討事項のマップと D-3 の詳細パネル
      ```
    expected:
      - 外への要求が 0 件
      - '`role="alert"` の読めなかったライブラリの知らせが無い'
      - マップに D-3 が描かれている
      - 詳細パネルに D-3 が開き、本文の見出しが見出しの要素で、図が SVG で描かれている
      - 詳細パネルに回答・意見の入力と送るボタンが無く、接続の状態も出ていない
    test: test_normal_when_exported_offline
  - name: 異常系（描画のライブラリが読めない）
    summary: 描画のライブラリの配信元に届かないと、使う箇所に読めなかったライブラリの名前を出す
    setup:
      - name: Mock
        description: ブラウザから描画のライブラリの配信元への要求を全て失敗させる。MCP サーバーを立てて `preview_url` が返した URL を開く
      - name: make_workspace
        description: 検討事項 D-3（本文に見出しと mermaid の図を持つ）を持つワークスペース
        notes: ハッシュは `tab=decisions&id=D-3`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant CDN as 描画のライブラリの配信元

        ユーザー->>IF: #tab=decisions&id=D-3 で開く
        IF-->>CDN: 描画のライブラリを読む（届かない）
        IF-->>ユーザー: 読めなかったライブラリの知らせと本文の原文
      ```
    expected:
      - 'マップの箇所に、「読み込めなかったライブラリ: elkjs」が `role="alert"` で出る'
      - 詳細パネルの本文の箇所に、marked・DOMPurify・mermaid の名前と本文の原文が出る
      - 表示形式を表に切り替えると、D-3 の行がある
    test: test_error_when_library_unavailable
  - name: 正常系（書き換えで描き直す）
    summary: ツールで書き換えると、開いている画面と項目を保ったまま描き直す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、同じサーバーの `add` を MCP のクライアントで呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1・D-3 を持つワークスペース
        notes: ハッシュは `tab=decisions&view=table&id=D-3`。詳細パネルの入力欄に「書きかけ」と入れておく
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信
        participant T as add（MCP のツール）

        ユーザー->>IF: #tab=decisions&view=table&id=D-3 で開く
        T->>SV: 検討事項 D-4 を足す
        SV-->>IF: event changed
        IF-->>SV: GET /api/records
        SV-->>IF: D-4 を含む記録
        IF-->>ユーザー: D-4 の行が足された表と D-3 の詳細パネル
      ```
    expected:
      - 再読み込みの操作をしないまま、表に D-4 の行が出る
      - タブの帯で検討事項が選ばれ、表示形式は表のまま
      - 詳細パネルに D-3 が開いたままで、入力欄に「書きかけ」が残っている
      - URL が開いたときと同じで、履歴の数が増えていない
    test: test_normal_when_rewritten
  - name: 正常系（コメントを溜めて送る）
    summary: 本文の文を選んで箇所を添えたコメントを溜め、コメントの一覧からまとめて送る
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開く）
      - name: make_workspace
        description: 本文に 3 行の段落を持つ資料 A-1 を持ち、レビュー中のコメントと送信を持たないワークスペース
        notes: ハッシュは `tab=docs&id=A-1`。本文の 2 行目の「言い換えたい文」を選ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信

        ユーザー->>IF: 本文の 2 行目の文を選ぶ
        IF-->>ユーザー: 選んだ範囲の近くにコメントの入口
        ユーザー->>IF: 入口を押し、「ここは言い換える」を書いて溜める
        IF-->>SV: POST /api/comments {target: A-1, loc: 本文の 2 行目, body}
        SV-->>IF: 201
        IF-->>ユーザー: 溜めた旨と件数、詳細の一番下にそのコメント
        ユーザー->>IF: コメントのボタンから一覧を開き、まとめて送る
        IF-->>SV: POST /api/comments/send {ids: [C-1]}
        SV-->>IF: 201
        IF-->>ユーザー: 送った旨と空の一覧
      ```
    expected:
      - 入口を押した後、下端の入力に「本文 2 行目」と選んだ文が添えられている
      - 溜めた後、コメントのボタンの件数が 1 で、詳細の一番下のレビュー中のコメントにその 1 件がある
      - 送った後、取り込んでいない送信（`submissions`）が A-1 の本文の 2 行目の箇所を持つ 1 件を返し、コメントのボタンの件数が 0
      - 入口と入力欄とコメントのボタンとまとめて送るボタンに Tab キーで届き、入口は Esc で閉じる
    test: test_normal_when_sent
  - name: 異常系（本文が空）
    summary: 空白だけの本文は溜めずに理由を出す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、画面からの要求を数える）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
        notes: ハッシュは `tab=decisions&id=D-1`。入力欄に空白だけを入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: 空白だけで溜める
        IF-->>ユーザー: 本文が空の理由
      ```
    expected:
      - '`POST /api/comments` が送られていない'
      - 入力の結果に本文が空である旨が出る
    test: test_error_when_body_empty
  - name: 異常系（サーバーにつながらない）
    summary: サーバーが止まると接続の状態を出し、前に読んだ記録で描き続け、送れなかった本文を残す
    setup:
      - name: Mock
        description: なし（MCP サーバーを子プロセスとして立て、`preview_url` が返した URL を実際のブラウザで開いた後に、サーバーの標準入力を閉じて止める）
      - name: make_workspace
        description: 検討事項 D-1・D-3 を持つワークスペース
        notes: ハッシュは `tab=decisions&view=table&id=D-1`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信

        ユーザー->>IF: 開く
        IF-->>SV: GET /api/records
        SV-->>IF: 記録
        SV->>SV: 止まる
        IF->>IF: GET /api/events のつながりが切れる
        IF-->>ユーザー: 接続の状態と前に読んだ記録
        ユーザー->>IF: 「案 A にする」を溜める
        IF-->>SV: POST /api/comments（届かない）
        IF-->>ユーザー: 溜められなかった理由と残した本文
      ```
    expected:
      - 接続の状態に、つながらない旨と記録を読んだ日時が出る
      - 表に D-1・D-3 の行が残り、詳細パネルに D-1 が開いたまま
      - 入力の結果に溜められなかった旨が出て、入力欄に「案 A にする」が残っている
    test: test_error_when_server_unreachable
lead: 利用者がサーバーの配信の URL をブラウザで開くと、記録をサーバーから読み、URL のハッシュが指す画面・表示形式・項目を開く。書き換えの知らせを受けると描き直し、詳細パネルから項目ごとに回答・意見を送る。
idempotent: false
side_effects: コメントを溜める・直す・消す・書きかけを書くと、サーバーがワークスペースの `comments.yaml`・`drafts.yaml` を書き換える。まとめて送ると `submissions.yaml` に足す（『コメントをまとめて送る』）。タブを開くと、サーバーが `.mindstella-opened` を書き換える（『前回開いた日時』）。ほかの記録は書き換えない。端末の保存領域（`localStorage`）にライト / ダークと表の表示する列・ピン留め・変更履歴で選んだ時点を書く
callers:
  - dev/設計書/シナリオ/複合ユースケース/プレビューで記録を読み返す#
request:
  - name: mindmap-data
    type: JSON（`<script type="application/json" id="mindmap-data">` の中身）
    required: false
    description: '配る書き出しが埋め込んだ記録。形はインターフェース定義『記録の取得』のレスポンスと同じ。サーバーの配信では空で、画面は『記録の取得』を読む'
  - name: tab
    type: "'overview' | 'decisions' | 'tasks' | 'research' | 'docs' | 'terms' | 'notes' | 'logs' | 'graph'"
    required: false
    default: overview
    description: 開く画面（タブとつながり）
    constraints: 上の値のどれでもないときは既定の値で開く
    notes: URL のハッシュの引数
  - name: view
    type: "'map' | 'board' | 'cards' | 'table'"
    required: false
    default: 画面ごとの既定（`decisions` は `map`、`tasks` は `board`、`docs` は `cards`、それ以外は `table`）
    description: 表示形式。既定と違うときだけハッシュに書く
    constraints: その画面が持たない形式のときは既定の形式で開く
    notes: URL のハッシュの引数
  - name: id
    type: str
    required: false
    default: なし（詳細パネルを開かない）
    description: 詳細パネルで開く項目の ID
    constraints: '`D-`・`T-`・`R-`・`A-`・`G-`・`N-`・`L-` に数字。記録に無い ID のときは詳細パネルを開かない'
    example: D-3
    notes: URL のハッシュの引数
  - name: full
    type: "'1'"
    required: false
    default: なし（詳細パネルで開く）
    description: 詳細を全画面で開く
    constraints: '`id` があるときだけ効く'
    notes: URL のハッシュの引数
  - name: f.{列}
    type: str
    required: false
    default: なし（絞り込まない）
    description: 表・カードをその列の値で絞って開く。概要の「すべて表示」・セルが作る
    constraints: 複数の値は `|` でつなぐ。開いたときに一度だけ読み、絞り込みを変えてもハッシュには書き戻さない
    example: f.status=要見直し
    notes: URL のハッシュの引数
  - name: コメントの本文
    type: str
    required: false
    default: なし（溜めない）
    description: 詳細パネル・詳細の全画面・コメントの一覧の入力欄に書いて溜める本文。開いている項目の ID（一覧の入力欄は無し）と添えた箇所と一緒に『レビュー中のコメントの追加』へ送る
    constraints: 前後の空白を除いて 1 文字以上、10000 文字以下
    example: 案 A にする
    notes: 利用者の入力。サーバーの配信でだけ受ける
  - name: 変更履歴で選んだ時点
    type: None | 'since' | 'pending' | str
    required: false
    default: なし（差分を出さない）
    description: 差分の表示で比べる時点。`since` は「前回開いてから」、`pending` は「まだまとめていない変更」、それ以外はまとまりの ID（`C-{番号}`）
    constraints: 記録に無いまとまりの ID・まだまとめていない変更が空の `pending` のときは差分を出さない
    notes: 利用者が変更履歴のモーダルで選ぶ。端末の保存領域に持ち、URL のハッシュには書かない
  - name: 選んだ範囲
    type: Range
    required: false
    default: なし（入口を出さない）
    description: 詳細パネル・詳細の全画面で、本文の文か項目の値を選んだ範囲。本文は元の Markdown の行の範囲に、値はキーのパスに対応づけて箇所にする
    constraints: 本文と値の外・空の選択では入口を出さない
    notes: 利用者の操作。サーバーの配信でだけ受ける
request_example: |-
  ```text
  http://127.0.0.1:43817/#tab=decisions&view=table&id=D-3&f.status=%E8%A6%81%E8%A6%8B%E7%9B%B4%E3%81%97
  ```
response:
  - name: 画面
    type: DOM
    description: '`tab` の画面。タブの帯でそのタブが選ばれている（`aria-current="page"`）'
  - name: 表示形式
    type: DOM
    description: 表示形式の切り替えで `view` の形式が押されている（`aria-pressed="true"`）
  - name: 詳細パネル
    type: DOM
    description: '`id` の項目の詳細。`full` のときは全画面のモーダル'
  - name: 条件のチップ
    type: DOM
    description: '`f.{列}` の列と値ごとのチップ。表の行・カードはその条件に合うものだけ'
  - name: 読めなかったライブラリの知らせ
    type: DOM（`role="alert"`）
    description: 描画のライブラリが読めなかったとき、そのライブラリを使う箇所（本文・図・マップ）に、読めなかったライブラリの名前を出す
  - name: 回答・意見の入力
    type: DOM
    description: 詳細パネル・詳細の全画面の下端に留めた入力欄と送るボタン。サーバーの配信でだけ出し、配る書き出しでは出さない
  - name: 送信の結果
    type: DOM（`role="status"`）
    description: 送っている・送った・本文が空・送れなかった（理由）を入力の近くに出す。読み上げの対象にする
  - name: 接続の状態
    type: DOM（`role="status"`）
    description: サーバーにつながらない間、トップバーにつながらないことと、描いている記録を読んだ日時（`built_at`）を出す。つながり直したら消す。配る書き出しでは出さない
  - name: 変更履歴
    type: DOM（モーダルの dialog）
    description: トップバーの「変更履歴」で開く。先頭から「差分を出さない（今の内容）」・「まだまとめていない変更」（あるときだけ）・「前回開いてから」・`changes.sets` のまとまりを新しい順に、日時・説明・変わった項目の数つきで並べる。選んだ時点に印を付ける
  - name: 差分の表示
    type: DOM
    description: 時点を選んだ間だけ出す。トップバーの選んだ時点の札と外すボタン、その時点で足した項目の新規の印（+）と変えた項目の変更の印（●）、印の付いた項目を持つタブの点、詳細パネル・資料の本文・図・Raw・キーの前後の差分。印は読み上げの名前を持ち、足した・消したは記号か下線・取り消し線を併せる
response_notes: |-
  > [!NOTE]
  > 開いた後の画面の移動・項目の移動も同じ形のハッシュに書き、同じ URL を開き直すと同じ画面と項目が開く。
constraints:
  - item: ハッシュの形
    constraint: '`#` の後ろを `URLSearchParams` の形（`キー=値` を `&` でつなぐ）で読み書きする。既定の値は書かない'
  - item: 履歴
    constraint: 画面の移動と、詳細パネル・全画面の中の項目の移動は履歴に積む。表示形式の切り替え・詳細パネルの開閉・重ねる画面の開閉は積まずにハッシュを置き換える。幅 900px 以下の詳細パネルだけは開くときに積む
  - item: 記録
    constraint: '`mindmap-data` に中身があれば `JSON.parse` して読み、空なら開いたときに `GET /api/records` を読む。画面から記録を書き換えない（コメントはサーバーがレビュー中・送信として持つだけ）'
  - item: 描画のライブラリ
    constraint: 描画のライブラリ（`refs` の外部ライブラリの設計書）を配信元から、版を固定し `integrity` と `crossorigin="anonymous"` を付けた script 要素で読む。読めなかったときは代わりの読み込みをせず、そのライブラリを使う箇所に名前を出す。本文は原文を出し、表・ボード・カード・つながりはそのまま使える。配る書き出しは描画のライブラリを中に持ち、配信元から読まない
  - item: 本文の無害化
    constraint: '本文の Markdown は HTML に描いた後、無害化してから差し込む。図はスクリプトを動かさない安全の設定で描く'
  - item: 文字
    constraint: 画面の文字（デザイン方針の書体）を文字の配信元から読む。読めないときは端末の文字で描く。配る書き出しは文字の配信元を読まず、端末の文字で描く
  - item: 端末の保存領域
    constraint: ライト / ダークと、表ごとの表示する列・ピン留め、変更履歴で選んだ時点を `localStorage` の 1 つのキーに持つ。表の絞り込みの条件は保存しない。保存できない環境では開いている間だけ保つ
  - item: 通信
    constraint: 描画のライブラリと文字の配信元と、開いた配信（`127.0.0.1`）だけ。記録を外へ送らない。配る書き出しは通信しない
  - item: 描き直し
    constraint: サーバーの配信では `GET /api/events` につなぎ、`changed` を受けたら `GET /api/records` を読み直す。開いている画面・表示形式・URL のハッシュ・詳細パネルの項目・表の絞り込みと並べ替え・入力欄の書きかけを保ったまま描き直し、履歴に積まない。開いていた項目が記録から消えたら詳細パネルを閉じる。読み直しが 422 なら前に読んだ記録で描き続ける
  - item: サーバーにつながらないとき
    constraint: '`GET /api/events` のつながりが切れている間と、`GET /api/records` に届かないときは、接続の状態を出して前に読んだ記録で描き続ける。つなぎ直しはブラウザの `EventSource` に任せ、つながったら記録を読み直して接続の状態を消す。開いたときに一度も記録を読めなければ、接続の状態だけを出す'
  - item: 「前回開いてから」の範囲
    constraint: サーバーの配信では、タブで最初に記録を読む前に `POST /api/opened` を 1 度呼び、`previous` をそのタブの範囲の始まりにする（`sessionStorage` に持ち、同じタブで読み込み直しても呼び直さない）。`previous` が `null` か呼べなかったときはタブを開いた日時にする。配る書き出しは `localStorage` に前回開いた日時を持つ。範囲に入るのは、`at` が始まりより後のまとまりと、まだまとめていない変更
  - item: 前の版の組み立て
    constraint: 項目の `history` を新しいものから順に、選んだ時点の最初の `seq` まで当てる（キーは `before` で戻し、本文は `body_diff` で戻す）。その `seq` の要素が保持する回数を超えて消えていれば、印だけ付けて詳細パネルにその旨を出す。`body_diff` の `now` が今の本文に当たらなければ、本文は今の内容を描いて差分を出せない旨を出し、キーの差分は出す。`update_settings` が付け替えた `phase` は変更履歴に無いため、前の版でも今の値で出す
  - item: 差分の表示と書き換え
    constraint: 差分の表示に入る・抜ける・時点を選び直すだけでは記録を読み直さず、履歴にも積まない。書き換えの知らせで読み直したときは、同じ時点の差分の表示のまま描き直す
  - item: コメントの読み書き
    constraint: '開いたときに `GET /api/comments` を読み、コメントのボタンの件数・コメントの一覧・詳細の一番下のレビュー中のコメント・入力欄の書きかけを描く。溜める・直す・消す・元に戻す・まとめて送るはそれぞれの API へ `Content-Type: application/json` で送り、送っている間はそのボタンを押せなくする。空白だけの本文は送らずに理由を出す。届かない・エラーのときは本文を残して理由（届いたときは `detail`、409 のまとめて送るは `stale` を行ごとに）を出す。書きかけは入力が止まったときと入力欄を閉じるときに `PUT /api/drafts` へ送る。一覧のチェックは画面だけが持ち、溜めたコメントはチェックした状態で入る'
  - item: 選んだ箇所の対応づけ
    constraint: '本文は描くときにブロックへ元の行の印を付け、選択の端から元の Markdown の行の範囲を求める（PoC #80 の方式）。値は描いた要素にキーのパスを持たせる。選んだ文は描いた文のまま送る'

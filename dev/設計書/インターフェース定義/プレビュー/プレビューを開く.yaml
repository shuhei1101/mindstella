title: "プレビューを開く"
entry:
  kind: screen
  value: サーバーの配信の URL（`preview_url` が返す `http://127.0.0.1:{ポート}/mindstella.html`。画面は『プレビューの配信』が返し、雛形は `plugins/mindstella/skills/mindmap/preview/`）。`export` が書き出した配る書き出しも同じ画面を開く
  api: '`GET /api/records`（記録）・`GET /api/events`（書き換えの知らせ）・`GET`/`POST /api/comments`・`PATCH`/`DELETE /api/comments/{id}`（レビュー中の書き込み）・`PUT /api/drafts`（書きかけ）・`POST /api/comments/send`（まとめて送る）・`GET /api/threads`（スレッド）・`PATCH /api/threads/{id}`（クローズとオープンへの戻し）・`PUT /api/config/display`（ワークスペースの既定の書き換え）。配る書き出しは呼ばず、記録を `mindmap-data` の要素から読む'
flows:
  - name: 正常系
    summary: ハッシュが指す画面・表示形式・項目を開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1・D-3（D-3 は要見直しで、本文に見出しと mermaid の図を持つ）を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信
        participant CDN as 描画のライブラリの配信元

        ユーザー->>IF: #tab=decisions&view=table&id=D-3 で開く
        IF-->>CDN: 描画のライブラリを読む
        IF-->>SV: GET /api/records
        SV-->>IF: 記録
        IF-->>SV: GET /api/events につなぐ
        IF-->>ユーザー: 検討事項の表と D-3 の詳細パネル
      ```
    expected:
      - タブの帯で検討事項が選ばれ、表示形式は表
      - 表に D-1・D-3 の行がある
      - 詳細パネルに D-3 が開き、本文の見出しが見出しの要素で、図が SVG で描かれている
      - 同じ URL を開き直すと同じ画面と項目が開く
    test: test_normal
  - name: 正常系（ハッシュが無い）
    summary: ハッシュが無いと概要を開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: ハッシュ無しで開く
        IF-->>ユーザー: 概要
      ```
    expected:
      - タブの帯で概要が選ばれている
      - 詳細パネルが開いていない
      - URL にハッシュが付かない
    test: test_normal_when_no_hash
  - name: 正常系（絞り込みの条件がある）
    summary: ハッシュの f.{列} で絞った表を条件のチップ付きで開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 要見直しの D-3・保留の D-4・未決定の D-1 を持つワークスペース
        notes: ハッシュは `tab=decisions&view=table&f.status=要見直し|保留`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: f.status=要見直し|保留 のハッシュで開く
        IF-->>ユーザー: 条件のチップ付きの検討事項の表
      ```
    expected:
      - 状態 = 要見直し・保留の条件のチップがある
      - 表の行が D-3・D-4 だけ
      - 絞り込みのドロワーの状態で要見直し・保留だけが選ばれ、絞り込みのボタンにバッジ 1 が付く
      - チップを外すと D-1 の行も出て、URL のハッシュに `f.` の引数が無い
    test: test_normal_when_filter_in_hash
  - name: 正常系（項目が記録に無い）
    summary: 記録に無い ID を指すハッシュでは画面だけを開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1 だけを持つワークスペース
        notes: ハッシュは `tab=decisions&id=D-99`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: #tab=decisions&id=D-99 で開く
        IF-->>ユーザー: 検討事項のマップ（詳細パネルなし）
      ```
    expected:
      - タブの帯で検討事項が選ばれ、表示形式はマップ
      - 詳細パネルが開いていない
      - URL のハッシュに `id` が無い
    test: test_normal_when_item_not_found
  - name: 正常系（配る書き出しを通信なしで開く）
    summary: 描画のライブラリを中に持つ配る書き出しは、通信が無くても本文・図・マップを描く
    setup:
      - name: Mock
        description: ブラウザから `file:` 以外への要求を全て失敗させ、要求の数を数える
      - name: exported_html
        description: 検討事項 D-3（本文に見出しと mermaid の図を持つ）を持つワークスペースから `export` で書き出した HTML
        notes: ハッシュは `tab=decisions&id=D-3`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as 配る書き出し

        ユーザー->>IF: #tab=decisions&id=D-3 で開く
        IF->>IF: 中に持つ描画のライブラリと mindmap-data を読む
        IF-->>ユーザー: 検討事項のマップと D-3 の詳細パネル
      ```
    expected:
      - 外への要求が 0 件
      - '`role="alert"` の読めなかったライブラリの知らせが無い'
      - マップに D-3 が描かれている
      - 詳細パネルに D-3 が開き、本文の見出しが見出しの要素で、図が SVG で描かれている
      - 詳細パネルに回答・意見の入力と送るボタンが無く、接続の状態も出ていない
    test: test_normal_when_exported_offline
  - name: 異常系（描画のライブラリが読めない）
    summary: 描画のライブラリの配信元に届かないと、使う箇所に読めなかったライブラリの名前を出す
    setup:
      - name: Mock
        description: ブラウザから描画のライブラリの配信元への要求を全て失敗させる。MCP サーバーを立てて `preview_url` が返した URL を開く
      - name: make_workspace
        description: 検討事項 D-3（本文に見出しと mermaid の図を持つ）を持つワークスペース
        notes: ハッシュは `tab=decisions&id=D-3`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant CDN as 描画のライブラリの配信元

        ユーザー->>IF: #tab=decisions&id=D-3 で開く
        IF-->>CDN: 描画のライブラリを読む（届かない）
        IF-->>ユーザー: 読めなかったライブラリの知らせと本文の原文
      ```
    expected:
      - 'マップの箇所に、「読み込めなかったライブラリ: elkjs」が `role="alert"` で出る'
      - 詳細パネルの本文の箇所に、marked・DOMPurify・mermaid の名前と本文の原文が出る
      - 表示形式を表に切り替えると、D-3 の行がある
    test: test_error_when_library_unavailable
  - name: 正常系（書き換えで描き直す）
    summary: ツールで書き換えると、開いている画面と項目を保ったまま描き直す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、同じサーバーの `add` を MCP のクライアントで呼ぶ）
      - name: make_workspace
        description: 検討事項 D-1・D-3 を持つワークスペース
        notes: ハッシュは `tab=decisions&view=table&id=D-3`。詳細パネルの入力欄に「書きかけ」と入れておく
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信
        participant T as add（MCP のツール）

        ユーザー->>IF: #tab=decisions&view=table&id=D-3 で開く
        T->>SV: 検討事項 D-4 を足す
        SV-->>IF: event changed
        IF-->>SV: GET /api/records
        SV-->>IF: D-4 を含む記録
        IF-->>ユーザー: D-4 の行が足された表と D-3 の詳細パネル
      ```
    expected:
      - 再読み込みの操作をしないまま、表に D-4 の行が出る
      - タブの帯で検討事項が選ばれ、表示形式は表のまま
      - 詳細パネルに D-3 が開いたままで、入力欄に「書きかけ」が残っている
      - URL が開いたときと同じで、履歴の数が増えていない
    test: test_normal_when_rewritten
  - name: 正常系（コメントを溜めて送る）
    summary: 本文の文を選んで箇所を添えたコメントを溜め、コメントの一覧からまとめて送る
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開く）
      - name: make_workspace
        description: 本文に 3 行の段落を持つ資料 A-1 を持ち、レビュー中のコメントと送信を持たないワークスペース
        notes: ハッシュは `tab=docs&id=A-1`。本文の 2 行目の「言い換えたい文」を選ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信

        ユーザー->>IF: 本文の 2 行目の文を選ぶ
        IF-->>ユーザー: 選んだ範囲の近くにコメントの入口
        ユーザー->>IF: 入口を押し、「ここは言い換える」を書いて溜める
        IF-->>SV: POST /api/comments {target: A-1, loc: 本文の 2 行目, body}
        SV-->>IF: 201
        IF-->>ユーザー: 溜めた旨と件数、詳細の一番下にそのコメント
        ユーザー->>IF: コメントのボタンから一覧を開き、まとめて送る
        IF-->>SV: POST /api/comments/send {ids: [C-1]}
        SV-->>IF: 201
        IF-->>ユーザー: 送った旨と空の一覧
      ```
    expected:
      - 入口を押した後、下端の入力に「本文 2 行目」と選んだ文が添えられている
      - 溜めた後、コメントのボタンの件数が 1 で、詳細の一番下のレビュー中のコメントにその 1 件がある
      - 送った後、取り込み待ちのスレッドの一覧（`threads` を `awaiting` で）が A-1 の本文の 2 行目の箇所を持つ 1 件を返し、コメントのボタンの件数が 0
      - 入口と入力欄とコメントのボタンとまとめて送るボタンに Tab キーで届き、入口は Esc で閉じる
    test: test_normal_when_sent
  - name: 異常系（本文が空）
    summary: 空白だけの本文は溜めずに理由を出す
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、画面からの要求を数える）
      - name: make_workspace
        description: 検討事項 D-1 を持つワークスペース
        notes: ハッシュは `tab=decisions&id=D-1`。入力欄に空白だけを入れる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: 空白だけで溜める
        IF-->>ユーザー: 本文が空の理由
      ```
    expected:
      - '`POST /api/comments` が送られていない'
      - 入力の結果に本文が空である旨が出る
    test: test_error_when_body_empty
  - name: 異常系（サーバーにつながらない）
    summary: サーバーが止まると接続の状態を出し、前に読んだ記録で描き続け、送れなかった本文を残す
    setup:
      - name: Mock
        description: なし（MCP サーバーを子プロセスとして立て、`preview_url` が返した URL を実際のブラウザで開いた後に、サーバーの標準入力を閉じて止める）
      - name: make_workspace
        description: 検討事項 D-1・D-3 を持つワークスペース
        notes: ハッシュは `tab=decisions&view=table&id=D-1`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面
        participant SV as サーバーの配信

        ユーザー->>IF: 開く
        IF-->>SV: GET /api/records
        SV-->>IF: 記録
        SV->>SV: 止まる
        IF->>IF: GET /api/events のつながりが切れる
        IF-->>ユーザー: 接続の状態と前に読んだ記録
        ユーザー->>IF: 「案 A にする」を溜める
        IF-->>SV: POST /api/comments（届かない）
        IF-->>ユーザー: 溜められなかった理由と残した本文
      ```
    expected:
      - 接続の状態に、つながらない旨と記録を読んだ日時が出る
      - 表に D-1・D-3 の行が残り、詳細パネルに D-1 が開いたまま
      - 入力の結果に溜められなかった旨が出て、入力欄に「案 A にする」が残っている
    test: test_error_when_server_unreachable
  - name: 正常系（見出しを指す）
    summary: ハッシュの h が指す本文の見出しまで送った詳細パネルを開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 本文に見出し「保存先」「決め方」「決め方」をこの順に持つ資料 A-1 を持つワークスペース
        notes: ハッシュは `tab=docs&id=A-1&h=決め方-1`。どの見出しも、本文の頭で開いたときには画面に入らない位置に置く
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: #tab=docs&id=A-1&h=決め方-1 で開く
        IF-->>ユーザー: 2 つ目の「決め方」まで送った A-1 の詳細パネル
        ユーザー->>IF: 1 つ目の「決め方」の # を押す
        IF-->>ユーザー: 1 つ目の「決め方」を指すハッシュ
      ```
    expected:
      - 詳細パネルに A-1 が開き、2 つ目の「決め方」の見出しがパネルの中で画面に入っている
      - '1 つ目の「決め方」の # を押した後、URL のハッシュの `h` が `決め方` で、履歴の数が増えていない'
      - '`h=無い見出し` で開き直すと、本文の頭で開き、URL のハッシュに `h` が無い'
    test: test_normal_when_heading_in_hash
  - name: 正常系（文字の条件がある）
    summary: ハッシュの f.~{列} で、その列の値に文字を含む行に絞った表を条件のチップ付きで開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 用語 G-1「a|b の用語」・G-2「a の用語」・G-3「b の用語」を持つワークスペース
        notes: ハッシュは `tab=terms&f.~title=a|b`。文字の中の `|` で分けないことを確かめる値にする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: f.~title=a|b のハッシュで開く
        IF-->>ユーザー: 条件のチップ付きの用語集の表
      ```
    expected:
      - 表の行が G-1 だけ（`a|b` を 1 つの文字として当てる）
      - チップが「用語に「a|b」を含む」の 1 つ
      - 開いた後の URL のハッシュに `f.` の引数が無い
    test: test_normal_when_text_filter_in_hash
  - name: 正常系（項目を開いたまま画面を移る）
    summary: 詳細パネルに項目を開いたままタブの帯でネットワークへ移ると、その項目を選んだネットワークを開く
    setup:
      - name: Mock
        description: なし（MCP サーバーを立てて `preview_url` が返した URL を実際のブラウザで開き、描画のライブラリは配信元から読む）
      - name: make_workspace
        description: 検討事項 D-1・D-3 を持つワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as プレビューの画面

        ユーザー->>IF: #tab=decisions&id=D-3 で開く
        IF-->>ユーザー: 検討事項と D-3 の詳細パネル
        ユーザー->>IF: タブの帯のネットワークを押す
        IF-->>ユーザー: D-3 を選んだネットワークと D-3 の詳細パネル
        ユーザー->>IF: ブラウザの戻るを押す
        IF-->>ユーザー: 検討事項と D-3 の詳細パネル
      ```
    expected:
      - ネットワークへ移った後、URL のハッシュが `tab=graph&id=D-3` で、タブの帯でネットワークが選ばれている
      - 詳細パネルに D-3 が開いたままで、ネットワークが D-3 を選んだ項目として示す
      - 戻るを押すと、ハッシュが `tab=decisions&id=D-3` に戻り、検討事項と D-3 の詳細パネルが開く
    test: test_normal_when_tab_moved_with_item
  - name: 正常系（配る書き出しで絞り込みを変える）
    summary: 配る書き出しでは、絞り込みの条件を変えても端末に残さず、読み込み直すと画面の既定の条件で開く
    setup:
      - name: Mock
        description: なし
      - name: exported_html
        description: 状態が進行中のタスクと完了のタスクを持つワークスペースから `export` で書き出した HTML
        notes: ハッシュは `tab=tasks&view=table`
    flow: |-
      ```mermaid
      sequenceDiagram
        actor ユーザー
        participant IF as 配る書き出し

        ユーザー->>IF: #tab=tasks&view=table で開く
        ユーザー->>IF: 絞り込みのドロワーで状態の「進行中」を選ぶ
        IF-->>ユーザー: 進行中のタスクだけの表
        ユーザー->>IF: 読み込み直す
        IF-->>ユーザー: 画面の既定の条件の表
      ```
    expected:
      - 読み込み直した後の表が、全てのタスクを並べている
      - 読み込み直した後の絞り込みのドロワーで、どの値も選ばれていない
      - '`localStorage` の個人の上書きに、タスクの画面の絞り込みの条件が無い（`filters` が無いか、`tasks` を持たない）'
    test: test_normal_when_exported_filter_changed
  - name: 正常系（配る書き出しを、端末に条件が残ったまま開く）
    summary: 配る書き出しは、端末の個人の上書きに絞り込みの条件があっても当てず、画面の既定の条件で開く
    setup:
      - name: Mock
        description: なし
      - name: exported_html
        description: 状態が進行中のタスクと完了のタスクを持つワークスペースから `export` で書き出した HTML
        notes: ハッシュは `tab=tasks&view=table`
      - name: 端末に残った条件

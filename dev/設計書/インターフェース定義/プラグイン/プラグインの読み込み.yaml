title: "プラグインの読み込み"
entry:
  kind: operation
  value: '`plugins/mindstella/` の `.claude-plugin/plugin.json`・`skills/`・`bin/`・`LICENSE`（Claude Code の `claude plugin install` が取り込むプラグインの中身）'
flows:
  - name: 正常系
    summary: プラグイン mindstella がスキルのフォルダを持ち、hooks を持たずに読み込まれる
    setup:
      - name: Mock
        description: なし（実際の Claude Code の CLI で実行する）
      - name: 設定のフォルダ
        description: テストごとの空の一時フォルダを Claude Code の設定のフォルダにする
        notes: 環境変数 `CLAUDE_CONFIG_DIR`
      - name: マーケットプレイスの登録
        description: リポジトリの直下をマーケットプレイス mindstella として登録しておく
    flow: |-
      ```mermaid
      sequenceDiagram
        participant C as Claude Code
        participant IF as plugins/mindstella/ の .claude-plugin/plugin.json・skills/・LICENSE

        C-->>IF: マニフェストとフォルダを取り込む
        C->>C: プラグイン mindstella を有効にする
      ```
    expected:
      - '`claude plugin list` で `mindstella@mindstella` が有効である'
      - 取り込まれたプラグインのフォルダに `skills/setup/SKILL.md`・`skills/session/SKILL.md` と、`skills/mindmap/` の `references/`・`playbooks/`・`schemas/`・`scripts/` がある
      - 取り込まれたプラグインのフォルダに、実行の権限を持つ `bin/mindstella` がある
      - 取り込まれたプラグインのフォルダの直下に `LICENSE` があり、本文がリポジトリの直下の `LICENSE` と一致する
      - 取り込まれたプラグインのフォルダに `dev/`・`docs/`・`tests/`・`.storybook/`・`package.json`・`.mcp.json` が無く、`plugin.json` が `mcpServers` を持たない
      - '`claude plugin details` で hooks が 0 件である'
      - その設定のフォルダで `claude mcp list` に mindstella が無い
    test: test_normal
lead: Claude Code がプラグイン mindstella をインストールして読み込むときの、プラグインのマニフェストとフォルダの形。
callers:
  - dev/設計書/外部ライブラリ/claude-code#
request:
  - name: name
    type: '"mindstella"'
    required: true
    description: プラグイン名。マーケットプレイスの `plugins[].name` と同じ値
  - name: description
    type: string
    required: true
    description: プラグインの説明
    notes: マーケットプレイスの `plugins[].description` と同じ文言
  - name: author.name
    type: '"shuhei1101"'
    required: true
    description: プラグインの作者
  - name: author.url
    type: '"https://github.com/shuhei1101"'
    required: true
    description: 作者の GitHub のページ
  - name: license
    type: '"MIT"'
    required: true
    description: プラグインのライセンス（SPDX の識別子）
    notes: 本文はプラグインのフォルダの直下の `LICENSE`
  - name: homepage
    type: '"https://github.com/shuhei1101/mindstella"'
    required: true
    description: プラグインの紹介先。リポジトリの URL
  - name: repository
    type: '"https://github.com/shuhei1101/mindstella"'
    required: true
    description: プラグインのソースコードのリポジトリ
  - name: skills/mindmap/
    type: フォルダ
    required: true
    description: 2 つのスキルが共通で読む置き場所。`references/`・`playbooks/`・`schemas/`・`scripts/`・`preview/`・`README.md` を持ち、SKILL.md は持たない
    notes: 'SKILL.md を持たないのでスキルとしては読み込まれない（PoC #22 で確かめた）'
  - name: skills/setup/
    type: フォルダ
    required: true
    description: スキル setup（`/mindstella:setup`）。形はインターフェース定義『セットアップ』
  - name: skills/session/
    type: フォルダ
    required: true
    description: スキル session（`/mindstella:session`）。形はインターフェース定義『話し合いの進行』
  - name: LICENSE
    type: ファイル
    required: true
    description: MIT ライセンスの本文と著作権の表記（`Copyright (c) 2026 shuhei1101`）
  - name: bin/mindstella
    type: ファイル
    required: true
    description: 起動スクリプト。実行の権限を持つ。形はインターフェース定義『起動スクリプト』
request_example: |-
  ```json
  {
    "name": "mindstella",
    "description": "話し合いを記録しながら、要件・調査・資料作りで決めたことを形にしていく Claude Code のスキル",
    "author": { "name": "shuhei1101", "url": "https://github.com/shuhei1101" },
    "license": "MIT",
    "homepage": "https://github.com/shuhei1101/mindstella",
    "repository": "https://github.com/shuhei1101/mindstella"
  }
  ```
constraints:
  - item: 持つ部品
    constraint: スキルだけ。hooks・MCP サーバー・コマンド・エージェントは持たない。MCP サーバーの実体（`skills/mindmap/scripts/server.py`）は同梱するが、マニフェストにも `.mcp.json` にも書かず、起動スクリプトが `--mcp-config` で渡す
  - item: 版
    constraint: '`version` は持たない'
    notes: 版の正はタグと `version.ini`（規約『バージョニング』）。マニフェストに写すと揃える作業がリリースごとに増える
  - item: Claude Code の版
    constraint: 2.1.287 以上
    notes: 非機能要件の「Claude Code の版」
  - item: ライセンスの本文の置き方
    constraint: リポジトリの直下とプラグインのフォルダの直下の 2 か所に、同じ本文の実体のファイルとして置く。シンボリックリンクにしない
    notes: 'Claude Code は、ローカルのパスからインストールするとプラグインのフォルダの外を指すシンボリックリンクを飛ばす（公式ドキュメント『Host and maintain a marketplace』の Share files within a marketplace with symlinks）。Windows の clone ではリンクが本文を持たないファイルになる'
  - item: プラグインの版のファイル
    constraint: '`plugins/mindstella/version.ini` の 1 行目にプラグインの版（`v{メジャー}.{マイナー}.{パッチ}`）を書く。スクリプトがワークスペースの版と比べるために読む。リポジトリの直下の `version.ini` の版より小さくしない'
    notes: ワークスペースの形を変える PR が `migrations/{次の版}/` を足すときに、同じ PR でその版へ上げる。リリースでは tester がリポジトリの直下の `version.ini` を上げるときに、形を変えなかったスプリントでも同じ版へ揃える。マニフェストの `version` には写さない（制約「版」）
test_file: tests/integration/plugin/test_plugin_loading.py

title: "つながりを辿る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 7 種類の項目を 1 件以上ずつ。検討事項 D-3 は前提 D-1・進めるタスク T-2・関連 R-1 とつながる
      - name: 配信
        description: 記録を配っているサーバー
    flow: |
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: つながりを開く
        P-->>U: 全種類の項目の玉と線
        U->>P: ドラッグで回し、ホイールで寄る
        U->>P: D-3 の玉を押す
        P-->>U: D-3 へ寄り、D-3 の詳細パネルを開く
        U->>P: 絞り込みのボタンを押し、ドロワーの種類で「会話ログ」の選択を外す
        P-->>U: 会話ログの玉とその線を消す
    expected:
      - つながりに 7 種類の項目が、種類ごとの色で出る
      - D-3 を押した後、詳細パネルに D-3 が開き、URL のハッシュがつながりと D-3 を指す
      - 「会話ログ」の選択を外した後、会話ログの玉とその線が消え、ドロワーの「会話ログ」のチェックボックスの選択が外れ、絞り込みのボタンに件数のバッジが付く
    test: test_normal
    notes:
      この PR の範囲: つながりは見本の作りを整える（リファクタ）にとどめる。大幅な改善は後続の Issue で扱う
      性能: 描画の速さは E2E では確かめず、非機能要件の行の「確かめる時点」で、GPU の効いた端末で PoC と同じ計測を流して確かめる
  - name: 正常シナリオ（種類をまとめて切り替える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 7 種類の項目を 1 件以上ずつ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: つながりを開き、絞り込みのボタンを押す
        P-->>U: 全種類の項目の玉と線と、種類のチェックの入ったまとめて切り替える箱を持つドロワー
        U->>P: まとめて切り替える箱を押す
        P-->>U: 全ての種類の玉と線を消す
        U->>P: 種類のうち「検討事項」を選ぶ
        P-->>U: 検討事項の玉だけを出し、箱を横棒にする
        U->>P: まとめて切り替える箱を押す
        P-->>U: 全種類の項目の玉と線
    expected:
      - 開いた直後、ドロワーの種類の見出しのまとめて切り替える箱にチェックが入っている
      - 1 回目に押した後、玉が 1 つも無く、箱と 7 種類のチェックが全て外れている
      - 「検討事項」を選んだ後、検討事項の玉だけが出て、箱が横棒（一部を選択）になっている
      - 2 回目に箱を押した後、7 種類の玉が出て、箱と 7 種類のチェックが全て入っている
    test: test_normal_when_toggle_all_kinds
  - name: 正常シナリオ（状態と話題のタグで絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '決定済みの検討事項 D-1（タグ: 保存）、D-1 を前提に持つ要見直しの D-3（タグ: 保存）、D-3 を進める進行中のタスク T-2（タグ: 通知）、D-3 に関連する調査 R-1（タグ無し）'
        notes: 'D-3 は `depends_on: [D-1]`、T-2 は `for: [D-3]`、R-1 は `related: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: つながりを開き、絞り込みのボタンを押す
        U->>P: ドロワーのタグで「保存」を選ぶ
        P-->>U: 「保存」を持つ項目の玉と、その間の線
        U->>P: ドロワーの状態で「決定済み」を選ぶ
        P-->>U: 両方の条件に合う項目の玉
    expected:
      - 「保存」を選ぶと、D-1・D-3 の玉とその間の依存の線があり、T-2・R-1 の玉とそれにつながる線が無い
      - ドロワーの状態に、並んでいる項目の状態（決定済み・要見直し・進行中 など）が出る
      - 「決定済み」を足すと、D-1 の玉だけがある
      - 絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_filtered
lead: 利用者が、全種類の項目を関係でつないだ 3D のつながりを回し、寄り、絞り込みのボタンのドロワーで種類・状態・タグで絞り、玉を押して詳細を開く単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者がタブの帯の右端のつながりを押す
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_graph_trace_view.py

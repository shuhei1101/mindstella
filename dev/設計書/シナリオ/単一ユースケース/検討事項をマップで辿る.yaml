title: "検討事項をマップで辿る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 対象 1・カテゴリー 2・フェーズ 2 にまたがる検討事項。決定済みの D-1、要見直しの D-3（前提 D-1・後続 D-5）、未決定の D-5
        notes: 'D-3 は `depends_on: [D-1]`、D-5 は `depends_on: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: ボード（状態ごとの列）
        U->>P: 表示形式をマップに切り替える
        P-->>U: マップ（決定済みを隠した木）
        U->>P: 絞り込みのボタンを押し、ドロワーの状態で決定済みを選ぶ
        U->>P: D-3 を押す
        P-->>U: 根までの枝と依存の線を強調し、D-3 の詳細パネルを開く
        U->>P: 表示形式をボード、表の順に切り替える
        P-->>U: ボード（状態ごとの列）、表
      ```
    expected:
      - 開いた直後にボードが出て、表示形式の切り替えがボード・マップ・表の順に並び、ボードが押された状態になっている
      - マップに切り替えた直後、マップに D-3・D-5 があり、決定済みの D-1 は無い
      - マップのカテゴリー・フェーズのラベルが、背景の面か枠を持ち、枝の線がラベルの文字の上に重ならない
      - ページ全体に縦スクロールが無く、トップバーとタブの帯が画面の上に見えている
      - 開いた直後から、ドロワーの状態で要見直し・未決定・未整理・保留が選ばれ、絞り込みのボタンに件数のバッジが付いている
      - 決定済みを選んだ後、マップに D-1 がある
      - D-3 を押した後、D-3 から根までの枝と、D-1・D-5 への依存の線が強調され、それ以外の項目は薄くなる
      - 詳細パネルに D-3 が開き、URL のハッシュが検討事項のタブとマップの表示形式と D-3 を指す
      - ボードに状態ごとの列があり、D-3 は要見直し、D-5 は未決定、D-1 は決定済みの列にある
      - 表示形式を切り替えても、切り替えのボタンの位置と幅が変わらず、ドロワーで選んだ状態の条件が保たれる
      - 表に「着手可否」の列があり、D-5 は「前提待ち」（前提の D-3 が未決定）
    test: test_normal
  - name: 正常シナリオ（キーワードで探す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 名前に「保存」を含む未決定の D-2 と要見直しの D-3、含まない未決定の D-5
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: マップのキーワードに「保存」を入れる
        P-->>U: タイトルに含む項目を強調する
        U->>P: 絞り込みのボタンを押す
        P-->>U: 状態の選択肢にキーワードに一致した件数を付けたドロワー
      ```
    expected:
      - D-2・D-3 が黄色で強調され、D-5 は強調されない
      - ドロワーの状態の未決定と要見直しの選択肢に、キーワードに一致した件数（各 1）のバッジが付く
    test: test_normal_when_keyword
  - name: 正常シナリオ（狭い幅）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 390px
        notes: 狭い幅の境は画面設計で決める
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替える
        P-->>U: 字下げした縦の一覧
      ```
    expected:
      - マップの代わりに、対象 → カテゴリー → フェーズ → 検討事項を字下げした縦の一覧が出る
      - ページに横スクロールが出ない
    test: test_normal_when_narrow
  - name: 異常シナリオ（配置のライブラリが読めない）
    setup:
      - name: Mock
        description: CDN への elkjs の要求をブラウザの通信の差し替えで失敗させる（ほかのライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-5
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替える
        P-->>U: マップの場所に、読めなかったライブラリの名前
        U->>P: 表示形式を表に切り替える
        P-->>U: 表
      ```
    expected:
      - マップの場所に、読めなかったライブラリとして elkjs の名前が出る
      - 表に切り替えると D-5 の行がある
    test: test_error_when_layout_library_unavailable
  - name: 正常シナリオ（状態の条件を解除する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 決定済みの D-1、要見直しの D-3、未決定の D-5
        notes: D-1 だけが 1 つ目のフェーズ、D-3・D-5 は 2 つ目のフェーズに属する（状態とフェーズの条件を重ねて 0 件にするため）
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替え、絞り込みのボタンを押す
        P-->>U: マップ（決定済みを隠した木）と、状態で決定済み以外を選んだドロワー
        U->>P: 状態の条件の「解除」を押す
        P-->>U: 全ての状態の項目を出したマップ
        U->>P: 状態で決定済みを選び、フェーズで 2 つ目のフェーズを選ぶ
        P-->>U: 検討事項の無いマップと、空の旨の文
      ```
    expected:
      - 開いた直後、マップに D-3・D-5 があり D-1 が無く、ドロワーの状態で記録にある値のうち要見直し・未決定が選ばれ、決定済みは選ばれていない
      - 「解除」を押した後、マップに D-1・D-3・D-5 があり、状態のチェックが全て外れ、絞り込みのボタンのバッジが消える
      - 決定済みと 2 つ目のフェーズを選んだ後、マップに検討事項が 1 件も無く、マップの枠に「表示する検討事項はありません。」が出て、絞り込みのボタンにバッジ 2 が付く
    test: test_normal_when_status_condition_cleared
  - name: 正常シナリオ（話題のタグで絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'カテゴリー 2 にまたがる未決定の検討事項。D-2（カテゴリー 1・タグ: 保存）、D-3（カテゴリー 1・タグ: 保存・通知）、D-5（カテゴリー 2・タグ: 通知）'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替え、絞り込みのボタンを押す
        U->>P: ドロワーのタグで「保存」を選ぶ
        P-->>U: 「保存」を持つ検討事項だけの木
      ```
    expected:
      - マップに D-2・D-3 があり、D-5 が無い
      - 木に、D-5 だけが属するカテゴリー 2 の枝が無い
      - 絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_topic_tag
  - name: 正常シナリオ（余白を押して選びを外す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項（決定済みの D-1、要見直しの D-3、未決定の D-5）
        notes: 'D-3 は `depends_on: [D-1]`、D-5 は `depends_on: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
      - name: 拡大率
        description: 拡大を押して最大の 150% にする。詳細パネルが閉じて広がった枠でも横に送れる幅を残す
        notes: 「全体を表示」のままだと、この記録は広がった枠に収まり、押した後の位置が縦・横とも 0 になって位置を戻すかどうかを見分けられない
      - name: ドラッグ
        description: D-3 を選んで中央へ送られたマップを、余白をつかんで右へドラッグして左端寄りへ戻す
        notes: 右へ 450px。押す前の横の位置を、押した後に広がった枠で送れる端より手前（0 より大きく）にして、期待値の小さい方を押す前の位置にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替え、絞り込みのボタンを押し、ドロワーの状態で決定済みを選ぶ
        U->>P: 拡大を押して 150% にする
        U->>P: D-3 を押す
        P-->>U: 根までの枝と依存の線を強調し、D-3 の詳細パネルを開く
        U->>P: マップの余白をつかんで右へドラッグする
        P-->>U: マップを動かし、D-3 を選んだまま
        U->>P: マップの余白を 1 回押す
        P-->>U: 選びを外し、詳細パネルを閉じて全体の表示に戻す
      ```
    expected:
      - 余白をドラッグした後も、D-3 の詳細パネルが開いたままで、D-3 から根までの枝と依存の線が強調されている
      - 余白を押した後、詳細パネルが閉じ、URL のハッシュが検討事項のタブを指して項目の ID を持たない
      - 余白を押した後、強調した枝・依存の線と薄くした項目が無く、全ての項目が選ぶ前と同じ表示になる
      - 余白を押した後のマップのスクロールの位置は、縦・横それぞれ、押す前の位置と、詳細パネルが閉じて広がった枠で送れる端の位置のうち小さい方になる（選んだ項目を中央へ送り直さず、送れる幅が縮んだ分だけ端へ寄る）
    test: test_normal_when_background_pressed
  - name: 正常シナリオ（ホイールで拡大・縮小する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項（決定済みの D-1、要見直しの D-3、未決定の D-5）
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替える
        P-->>U: 全体を表示の倍率のマップ
        U->>P: D-3 の節の上で、ホイールを奥へ回し続ける
        P-->>U: D-3 をマウスの下に残したまま、150% まで拡大して止まる
        U->>P: ホイールを手前へ回し続ける
        P-->>U: 40% まで縮小して止まる
        U->>P: 「全体を表示」を押す
        P-->>U: 全体が枠に収まる倍率のマップ
      ```
    expected:
      - ホイールを奥へ 1 回回した後、マップの倍率が上がり、回す前にマウスの下にあった D-3 の節がマウスの下にある
      - ホイールで倍率を変えた後、「全体を表示」が押された状態でない
      - 奥へ回し続けると倍率は 150% で止まり、手前へ回し続けると 40% で止まる
      - ホイールを回している間、ページ全体のスクロールの位置は変わらず、マップの枠のスクロールの位置はマウスの下の点を残す分だけ変わる
      - 「全体を表示」を押した後、「全体を表示」が押された状態になり、マップの木の全体が枠に収まる
    test: test_normal_when_wheel_zoomed
  - name: 正常シナリオ（ロックして辿る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項（決定済みの D-1、要見直しの D-3、未決定の D-5）
        notes: 'D-3 は `depends_on: [D-1]`、D-5 は `depends_on: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、表示形式をマップに切り替え、D-3 を押す
        P-->>U: D-3 の枝と依存を強調し、D-3 の詳細パネルを開く
        U->>P: D-3 をもう一度押す
        P-->>U: D-3 をロックし、節に閉じた鍵を出す
        U->>P: D-5 を押す
        P-->>U: 詳細パネルを D-5 に切り替え、強調は D-3 のまま
        U->>P: マップの余白を押す
        P-->>U: 鍵を震わせ、表示は変えない
        U->>P: D-3 を押し、もう一度 D-3 を押す
        P-->>U: 詳細パネルを D-3 に戻し、ロックを外す
      ```
    expected:
      - D-3 を 2 回目に押した後、マップが D-3 をロックした項目として示し、D-3 の節に閉じた鍵がある
      - D-5 を押した後、詳細パネルに D-5 が開き、D-3 から根までの枝と D-1・D-5 への依存の線が強調されたままで、D-5 の節は薄くならない
      - 余白を押した後も、詳細パネルは D-5 のまま開いていて、ロックした項目は D-3 のままで、URL のハッシュは D-5 を指す
      - D-3 を押した後、詳細パネルに D-3 が開き、ロックした項目は D-3 のままで、もう一度押した後にロックした項目が無くなる
    test: test_normal_when_locked
    notes:
      E2E の範囲: 鍵の震えの動きと、素早い 2 回押しの扱いは、画面設計の結合テストで確かめる
lead: 利用者が、検討事項を対象 → カテゴリー → フェーズ → 検討事項の木（マップ）で見て、絞り込みのボタンのドロワーで状態・タグで絞り、項目の枝と依存を辿る単一ユースケース。検討事項の画面はボードで開き、表示形式をマップへ切り替えて辿る。ホイールでの拡大・縮小と、ボード・表への切り替え、注目の起点の節のロックを含む。
issue: 5
primary_actor: 利用者
trigger: 利用者が検討事項のタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_decision_map_view.py

title: "検討事項をマップで辿る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 対象 1・カテゴリー 2・フェーズ 2 にまたがる検討事項。決定済みの D-1、要見直しの D-3（前提 D-1・後続 D-5）、未決定の D-5
        notes: 'D-3 は `depends_on: [D-1]`、D-5 は `depends_on: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: マップ（決定済みを隠した木）
        U->>P: 状態の印で決定済みを表示する
        U->>P: D-3 を押す
        P-->>U: 根までの枝と依存の線を強調し、D-3 の詳細パネルを開く
        U->>P: 表示形式をボード、表の順に切り替える
        P-->>U: ボード（状態ごとの列）、表
      ```
    expected:
      - 開いた直後のマップに D-3・D-5 があり、決定済みの D-1 は無い
      - 決定済みを表示した後、マップに D-1 がある
      - D-3 を押した後、D-3 から根までの枝と、D-1・D-5 への依存の線が強調され、それ以外の項目は薄くなる
      - 詳細パネルに D-3 が開き、URL のハッシュが検討事項のタブと D-3 を指す
      - ボードに状態ごとの列があり、D-3 は要見直し、D-5 は未決定、D-1 は決定済みの列にある
      - 表示形式を切り替えても、切り替えのボタンの位置と幅が変わらない
      - 表に「着手可否」の列があり、D-5 は「前提待ち」（前提の D-3 が未決定）
    test: test_normal
  - name: 正常シナリオ（キーワードで探す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 名前に「保存」を含む未決定の D-2 と要見直しの D-3、含まない未決定の D-5
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: マップのキーワードに「保存」を入れる
        P-->>U: タイトルに含む項目を強調し、状態の印にバッジを付ける
      ```
    expected:
      - D-2・D-3 が黄色で強調され、D-5 は強調されない
      - 未決定と要見直しの状態の印に、キーワードに一致した件数（各 1）のバッジが付く
    test: test_normal_when_keyword
  - name: 正常シナリオ（狭い幅）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 390px
        notes: 狭い幅の境は画面設計で決める
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: 字下げした縦の一覧
      ```
    expected:
      - マップの代わりに、対象 → カテゴリー → フェーズ → 検討事項を字下げした縦の一覧が出る
      - ページに横スクロールが出ない
    test: test_normal_when_narrow
  - name: 異常シナリオ（配置のライブラリが読めない）
    setup:
      - name: Mock
        description: CDN への elkjs の要求をブラウザの通信の差し替えで失敗させる（ほかのライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-5
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: マップの場所に、読めなかったライブラリの名前
        U->>P: 表示形式を表に切り替える
        P-->>U: 表
      ```
    expected:
      - マップの場所に、読めなかったライブラリとして elkjs の名前が出る
      - 表に切り替えると D-5 の行がある
    test: test_error_when_layout_library_unavailable
  - name: 正常シナリオ（状態をまとめて切り替える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 決定済みの D-1、要見直しの D-3、未決定の D-5
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: マップ（決定済みを隠した木）と、横棒のまとめて切り替える箱
        U->>P: まとめて切り替える箱を押す
        P-->>U: 全ての状態の項目を出したマップ
        U->>P: まとめて切り替える箱をもう一度押す
        P-->>U: 全ての状態の項目を隠したマップと、空の旨の文
      ```
    expected:
      - 開いた直後、状態の印の帯の右端のまとめて切り替える箱が横棒（一部を表示）になっている
      - 1 回目に押した後、マップに D-1・D-3・D-5 があり、箱と状態の印の決定済み・要見直し・未決定のチェックが全て入っている
      - 2 回目に押した後、マップに検討事項が 1 件も無く、箱と状態の印のチェックが全て外れ、マップの枠に「表示する検討事項はありません。」が出る
    test: test_normal_when_toggle_all_statuses
  - name: 正常シナリオ（余白を押して選びを外す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項（決定済みの D-1、要見直しの D-3、未決定の D-5）
        notes: 'D-3 は `depends_on: [D-1]`、D-5 は `depends_on: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、D-3 を押す
        P-->>U: 根までの枝と依存の線を強調し、D-3 の詳細パネルを開く
        U->>P: マップの余白をつかんでドラッグする
        P-->>U: マップを動かし、D-3 を選んだまま
        U->>P: マップの余白を 1 回押す
        P-->>U: 選びを外し、詳細パネルを閉じて全体の表示に戻す
      ```
    expected:
      - 余白をドラッグした後も、D-3 の詳細パネルが開いたままで、D-3 から根までの枝と依存の線が強調されている
      - 余白を押した後、詳細パネルが閉じ、URL のハッシュが検討事項のタブを指して項目の ID を持たない
      - 余白を押した後、強調した枝・依存の線と薄くした項目が無く、全ての項目が選ぶ前と同じ表示になる
      - 余白を押す前後で、マップのスクロールの位置が変わらない
    test: test_normal_when_background_pressed
lead: 利用者が、検討事項を対象 → カテゴリー → フェーズ → 検討事項の木（マップ）で見て、状態で絞り、項目の枝と依存を辿る単一ユースケース。ボード・表への切り替えを含む。
issue: 5
primary_actor: 利用者
trigger: 利用者が検討事項のタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_decision_map_view.py

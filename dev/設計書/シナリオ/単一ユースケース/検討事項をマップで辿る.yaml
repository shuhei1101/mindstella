title: "検討事項をマップで辿る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 対象 1・カテゴリー 2・フェーズ 2 にまたがる検討事項。決定済みの D-1、要見直しの D-3（前提 D-1・後続 D-5）、未決定の D-5
        notes: 'D-3 は `depends_on: [D-1]`、D-5 は `depends_on: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: マップ（決定済みを隠した木）
        U->>P: 絞り込みのボタンを押し、ドロワーの状態で決定済みを選ぶ
        U->>P: D-3 を押す
        P-->>U: 根までの枝と依存の線を強調し、D-3 の詳細パネルを開く
        U->>P: 表示形式をボード、表の順に切り替える
        P-->>U: ボード（状態ごとの列）、表
      ```
    expected:
      - 開いた直後のマップに D-3・D-5 があり、決定済みの D-1 は無い
      - 開いた直後から、ドロワーの状態で要見直し・未決定・未整理・保留が選ばれ、絞り込みのボタンに件数のバッジが付いている
      - 決定済みを選んだ後、マップに D-1 がある
      - D-3 を押した後、D-3 から根までの枝と、D-1・D-5 への依存の線が強調され、それ以外の項目は薄くなる
      - 詳細パネルに D-3 が開き、URL のハッシュが検討事項のタブと D-3 を指す
      - ボードに状態ごとの列があり、D-3 は要見直し、D-5 は未決定、D-1 は決定済みの列にある
      - 表示形式を切り替えても、切り替えのボタンの位置と幅が変わらず、ドロワーで選んだ状態の条件が保たれる
      - 表に「着手可否」の列があり、D-5 は「前提待ち」（前提の D-3 が未決定）
    test: test_normal
  - name: 正常シナリオ（キーワードで探す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 名前に「保存」を含む未決定の D-2 と要見直しの D-3、含まない未決定の D-5
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: マップのキーワードに「保存」を入れる
        P-->>U: タイトルに含む項目を強調する
        U->>P: 絞り込みのボタンを押す
        P-->>U: 状態の選択肢にキーワードに一致した件数を付けたドロワー
      ```
    expected:
      - D-2・D-3 が黄色で強調され、D-5 は強調されない
      - ドロワーの状態の未決定と要見直しの選択肢に、キーワードに一致した件数（各 1）のバッジが付く
    test: test_normal_when_keyword
  - name: 正常シナリオ（狭い幅）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ検討事項
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 390px
        notes: 狭い幅の境は画面設計で決める
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: 字下げした縦の一覧
      ```
    expected:
      - マップの代わりに、対象 → カテゴリー → フェーズ → 検討事項を字下げした縦の一覧が出る
      - ページに横スクロールが出ない
    test: test_normal_when_narrow
  - name: 異常シナリオ（配置のライブラリが読めない）
    setup:
      - name: Mock
        description: CDN への elkjs の要求をブラウザの通信の差し替えで失敗させる（ほかのライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-5
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開く
        P-->>U: マップの場所に、読めなかったライブラリの名前
        U->>P: 表示形式を表に切り替える
        P-->>U: 表
      ```
    expected:
      - マップの場所に、読めなかったライブラリとして elkjs の名前が出る
      - 表に切り替えると D-5 の行がある
    test: test_error_when_layout_library_unavailable
  - name: 正常シナリオ（状態の条件を解除する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 決定済みの D-1、要見直しの D-3、未決定の D-5
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、絞り込みのボタンを押す
        P-->>U: マップ（決定済みを隠した木）と、状態で決定済み以外を選んだドロワー
        U->>P: 状態の条件の「解除」を押す
        P-->>U: 全ての状態の項目を出したマップ
        U->>P: 状態で保留だけを選ぶ
        P-->>U: 検討事項の無いマップと、空の旨の文
      ```
    expected:
      - 開いた直後、マップに D-3・D-5 があり D-1 が無く、ドロワーの状態で要見直し・未決定・未整理・保留が選ばれている
      - 「解除」を押した後、マップに D-1・D-3・D-5 があり、状態のチェックが全て外れ、絞り込みのボタンのバッジが消える
      - 保留だけを選んだ後、マップに検討事項が 1 件も無く、マップの枠に「表示する検討事項はありません。」が出て、絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_status_condition_cleared
  - name: 正常シナリオ（話題のタグで絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'カテゴリー 2 にまたがる未決定の検討事項。D-2（カテゴリー 1・タグ: 保存）、D-3（カテゴリー 1・タグ: 保存・通知）、D-5（カテゴリー 2・タグ: 通知）'
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1280px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、絞り込みのボタンを押す
        U->>P: ドロワーのタグで「保存」を選ぶ
        P-->>U: 「保存」を持つ検討事項だけの木
      ```
    expected:
      - マップに D-2・D-3 があり、D-5 が無い
      - 木に、D-5 だけが属するカテゴリー 2 の枝が無い
      - 絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_topic_tag
lead: 利用者が、検討事項を対象 → カテゴリー → フェーズ → 検討事項の木（マップ）で見て、絞り込みのボタンのドロワーで状態・タグで絞り、項目の枝と依存を辿る単一ユースケース。ボード・表への切り替えを含む。
issue: 5
primary_actor: 利用者
trigger: 利用者が検討事項のタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_decision_map_view.py

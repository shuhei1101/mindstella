title: "項目を検索する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: タイトルに「保存先」を含む検討事項 D-2、本文に「保存先」を含む資料 A-1、どちらにも含まないタスク T-1
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 概要で / キーを押す
        P-->>U: 何も開かない
        U->>P: Ctrl+K を押す
        P-->>U: 全体の検索
        U->>P: 「保存先」を入れる
        P-->>U: D-2・A-1 の結果
        U->>P: A-1 の結果を押す
        P-->>U: 資料のタブと A-1 の詳細パネル
      ```
    expected:
      - / キーを押しても全体の検索は開かず、URL のハッシュも変わらない
      - Ctrl+K を押すと全体の検索が開き、入力欄にフォーカスがある
      - 結果に D-2 と A-1 があり、T-1 は無い
      - A-1 を押した後、検索が閉じ、資料のタブと A-1 の詳細パネルが開く
      - URL のハッシュが資料のタブと A-1 を指す
    test: test_normal
  - name: 正常シナリオ（該当なし）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: どの項目にも「存在しない語」を含まない記録
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検索を開き、「存在しない語」を入れる
        P-->>U: 該当なしの表示
        U->>P: Esc を押す
        P-->>U: 検索を閉じる
      ```
    expected:
      - 結果の場所に「該当する項目はありません。別の条件を試してください。」が出る
      - Esc で検索が閉じ、開く前の画面のままで URL のハッシュも変わらない
    test: test_normal_when_no_match
  - name: 正常シナリオ（完全に一致する項目がある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: タイトルが「シナリオの依頼」の用語 G-1、タイトルが「シナリオの依頼の受け方」の検討事項 D-1、本文に「シナリオの依頼」を含む資料 A-1
        notes: 今の並び（種類の順）では、用語集の G-1 が結果の一番下に出る組み合わせ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のマップのキーワードの入力欄にフォーカスしたまま Ctrl+K を押す
        P-->>U: 全体の検索
        U->>P: 「シナリオの依頼 」を入れる（末尾に空白）
        P-->>U: 一番上に G-1、その下に種類ごとの D-1・A-1
        U->>P: Enter を押す
        P-->>U: 用語集のタブと G-1 の詳細パネル
      ```
    expected:
      - 入力欄にフォーカスがあっても、Ctrl+K で全体の検索が開く
      - 結果の一番上に G-1 があり、検討事項・資料の種類の見出しより上にある
      - G-1 は、その下の用語集のまとまりに重ねて出ない
      - D-1 と A-1 は、それぞれ検討事項・資料の見出しの下にある
      - Enter を押した後、検索が閉じ、用語集のタブと G-1 の詳細パネルが開く
    test: test_normal_when_exact_match
  - name: 正常シナリオ（HTML の本文で当てる）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を HTML で持ち、段落の文に「画面の流れ」を含む資料 A-1 と、本文を Markdown で持ち、言語指定 `html` のコードブロックの段落の文に「画面の流れ」を含む資料 A-2 と、どれにも「画面の流れ」と「data-step」を含まないタスク T-1
        notes: A-1 と A-2 のコードブロックの段落は `<p class="flow" data-step="1">` のように属性を持ち、`data-step` は描いた文には出さない。A-2 のコードブロックの外の Markdown には「画面の流れ」も「data-step」も書かない
      - name: 配信
        description: 記録を配っているサーバー
    flow: |
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: Ctrl+K を押し、「画面の流れ」を入れる
        P-->>U: A-1 と A-2 の結果
        U->>P: 入力を「data-step」に替える
        P-->>U: 該当なし
    expected:
      - 「画面の流れ」の結果に A-1 と A-2 があり、T-1 は無い
      - 「data-step」の結果が 0 件で、該当なしが出る（HTML の本文と、Markdown の中の `html` のコードブロックのタグ・属性には当てない）
    test: test_normal_when_html_body_matched
lead: 利用者が、トップバーの全体の検索で全ての種類の項目を ID・タイトル・本文で探し、結果からその項目のタブと詳細を開く単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者が検索のボタンを押すか、`Ctrl+K`（macOS は `Cmd+K`）を押す
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_item_search_view.py

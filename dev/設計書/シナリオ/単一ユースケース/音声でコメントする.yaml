  flow: |-
    ```mermaid
    sequenceDiagram
      actor U as 利用者
      participant P as プレビュー（ブラウザ）
      U->>P: マイクのボタンを押す
      P->>P: マイクの許可が得られない
      P-->>U: 録音を始めず、マイクの許可が要る旨を出す
    ```
  expected:
  - 入力の近くに、マイクの許可が要る旨が出る
  - 録音中にならず、「レビューに追加」とマイクのボタンが元の位置のままである

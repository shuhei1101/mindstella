- name: 異常シナリオ（文字起こしに失敗する）
  setup:
  - name: Mock
    description: voice-paste の代わりに、`POST /web/transcriptions` で音声と用語集のプリセットを受けて 202 と `job_id` を返し、`GET /web/transcriptions/{job_id}` で `failed` を返す偽のサーバーを 127.0.0.1 で立てる。MCP サーバーをその偽のサーバーへ向けて立て、サーバーが配るプレビューを、偽のマイク（音声のファイルを流す）を許した実際のブラウザで開く。描画のライブラリは CDN から読む
  - name: make_workspace
    description: 作成を済ませ、文字起こし後の挙動が既定の `send` のワークスペース
  - name: 記録
    description: 未決定の検討事項 D-1
  - name: 開いている画面
    description: D-1 の詳細パネルで、コメントの入力に「案 B も見たい」と入れている
  flow: |-
    ```mermaid
    sequenceDiagram
      actor U as 利用者
      participant P as プレビュー（ブラウザ）
      participant SV as サーバー
      participant VP as voice-paste（偽のサーバー）
      U->>P: マイクのボタンを押し、話してから「文字起こし」を押す
      P->>SV: 録音した音声を送る
      SV->>VP: 文字起こしを依頼し、終わるまで待つ
      VP-->>SV: failed
      SV-->>P: 文字起こしに失敗した理由
      P-->>U: 失敗したことを出し、元のボタンに戻す
    ```
  expected:
  - 入力の近くに、文字起こしに失敗した旨が出る
  - 入力欄が「案 B も見たい」のままである
  - スレッドとレビュー中の書き込みが 0 件のままである
  test: test_error_when_transcription_failed
notes:
  画面の文言: マイクのボタン・録音中のボタン・ツールチップ・結果の文言はモック作成で決め、画面設計に書く
  Claude Code への入力: '`send` で送った書き込みを Claude Code へ入力する手順と、入力できなかったときの扱いは、単一ユースケース『コメントを選んで送る』と同じ'
  対象の画面: 今の画面と React の画面の両方のコメントの入力・返信の入力にマイクのボタンを置く。レビュー中の書き込みの書き換えの入力には置かない
  配る書き出し: 配る書き出しはコメント・返信の入力を持たないため、マイクのボタンも持たない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を足す

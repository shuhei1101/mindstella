title: "発言の取り込み"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `add` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: プレイブックがシステム開発で、検討事項を持たないワークスペース
      - name: 再生する書き込み
        description: 決め事を持つ検討事項 D-1（決定済み。案 A・B を持ち、A を採用）、D-1 を `parent` に持つ派生の検討事項 D-2（未決定。案 A・B を持つ）、問いの形にならない D-3（未整理）、D-2 を進めるタスク T-1、会話ログ L-1
        notes: どの項目も `target`・`category`・`phase` を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言（決め事を含む）
        CC->>CC: 対象・カテゴリー・フェーズに振り分け、並べた進め方ガイドの観点と照らし、検討事項ごとに案を書く
        CC->>SV: add（案を持つ検討事項・派生の検討事項・未整理・タスク）
        SV->>WS: スキーマと突き合わせて書く
        CC->>SV: add（会話ログ）
        SV->>WS: 書く
        CC-->>U: 記録した項目と、積んだ問いを短く示す
      ```
    expected:
      - D-1 が決定済みで `answer` を持つ
      - 'D-1 が案を持ち、A だけが `adopted: true` である'
      - 'D-2 が `parent: D-1` と案を持ち、未決定である'
      - D-3 が未整理である
      - 'T-1 が `for: [D-2]` を持つ'
      - 会話ログ L-1 がある
      - 足した全ての項目が `target`・`category`・`phase` を持つ
    test: test_normal
  - name: 正常シナリオ（保留・解除・中止）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `update`・`add` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 未決定の D-1・保留の D-2・未着手のタスク T-1 を持つ
      - name: 再生する書き込み
        description: D-1 を保留に、D-2 を未決定に戻し、T-1 を中止にする。それぞれ `reason` を持たせる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言（後回し・再開・やめる）
        CC->>SV: update（D-1 を保留、D-2 を未決定、T-1 を中止）
        SV->>WS: 書く
        CC->>SV: add（会話ログ）
        CC-->>U: 変えた状態を短く示す
      ```
    expected:
      - D-1 が保留で `reason` を持つ
      - D-2 が未決定である
      - T-1 が中止で `reason` を持つ
      - 会話ログが 1 件足されている
    notes:
      E2E: 持たない。状態と `reason` を直すのは `update` だけで、既存の『記録の追加と更新』の『正常シナリオ』が確かめる
  - name: 正常シナリオ（図や文書を資料に残す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `docs/` への本文の書き出し・`add` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 検討事項 D-1 を持つ
      - name: 再生する書き込み
        description: '会話で出した Mermaid の図を本文にした資料 A-1（`kind`: 図、`related: [D-1]`）'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言
        CC-->>U: 図を出す
        CC->>WS: docs/ に図の本文を書く
        CC->>SV: add（資料 A-1）
        CC->>SV: add（会話ログ）
      ```
    expected:
      - '資料 A-1 が `kind: 図` と `related: [D-1]` を持つ'
      - '`docs/` に A-1 の本文の Markdown がある'
      - '`check` が YAML と Markdown のずれを 0 件で返す'
    test: test_normal_when_diagram_kept_as_doc
  - name: 正常シナリオ（脱線した質問）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `add` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: タスクを持たない
      - name: 再生する書き込み
        description: 言葉の意味を尋ねた質問は用語集 G-1、それ以外の脱線はメモ N-1（タグ `脱線`）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        U->>CC: 「○○って何？」
        CC-->>U: 答える
        CC->>SV: add（用語集 G-1 かメモ N-1）
        CC->>SV: add（会話ログ）
      ```
    expected:
      - 用語集 G-1 が `meaning` を持つ
      - メモ N-1 がタグ `脱線` を持つ
      - タスクが 0 件のままである
    test: test_normal_when_off_topic_question
  - name: 正常シナリオ（納品物の資料を作る）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `docs/` への本文の書き出し・`add`・設定の更新を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: ゴールの納品物に `要件定義書`（`doc` 無し）を持つ
      - name: 再生する書き込み
        description: '概要・背景・構成の見出しを先に置いた本文を `docs/` に書いた納品物の資料 A-1（タイトル `要件定義書`、`deliverable: true`、`status: 下書き`）を足し、設定の更新で同じタイトルの納品物の `doc` から A-1 を指す'
        notes: 同じタイトルの納品物があるので、行は足さない。構成は納品物の最終的な見出しの並び
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言
        CC->>CC: ゴールの納品物に資料の無い要件定義書があると気付く
        CC->>WS: docs/ に概要・背景・構成を先に置いた本文を書く
        CC->>SV: add（資料 A-1、deliverable: true）
        CC->>SV: 設定の更新（同じタイトルの納品物の doc から A-1 を指す）
        CC->>SV: add（会話ログ）
      ```
    expected:
      - '`goal.deliverables` が「要件定義書」の 1 件だけで、その `doc` が A-1 である'
      - '資料 A-1 が `deliverable: true` を持つ'
      - '`docs/` の A-1 の本文が、概要・背景・構成の見出しを持つ'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_deliverable_doc_created
  - name: 正常シナリオ（タスクの成果を資料にする）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `add`・`update` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: ゴールの納品物に `要件定義書` を持ち、検討事項 D-1 と、D-1 を進める進行中の作業のタスク T-1 を持つ
      - name: 再生する書き込み
        description: 'T-1 で作った画面の一覧を本文にした資料 A-1（`deliverable: false`）を足し、T-1 を `related: [A-1]`・完了・`result` を持つように更新する'
        notes: 成果の資料はゴールの納品物に当たらないので、納品物にしない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言（画面の一覧ができた）
        CC->>WS: docs/ に成果の本文を書く
        CC->>SV: add（資料 A-1）
        CC->>CC: T-1 の成果と資料が 1 対 1 で揃っているかを確かめる
        CC->>SV: update（T-1 を related: A-1・完了にする）
        CC->>SV: add（会話ログ）
        CC-->>U: 完了にしたタスクと、成果の資料を示す
      ```
    expected:
      - T-1 が完了で、`related` に A-1 を持つ
      - '資料 A-1 が `deliverable: false` を持ち、`docs/` に本文がある'
      - '`goal.deliverables` が呼ぶ前と同じである'
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_task_output_kept_as_doc
lead: 話し合いを進めるスキル `session` が、利用者の発言を対象・カテゴリー・フェーズに振り分けて記録し、進め方ガイドの観点と照らして派生の検討事項・未整理・タスクを積む単一ユースケース。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 抽象と具体を行き来する発言をそのまま話しても、決め事とそこから派生する問いが記録に残る。脱線した質問がタスクに紛れない
trigger: '`session` で話し合っている間に、利用者が発言する'
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 発言ごとに会話ログが 1 件足され、記録した項目は対象・カテゴリー・フェーズを持つ。
minimal_guarantee: スキーマに合わない書き込みは MCP のツールが拒み、ワークスペースは書き込みの前のまま残る。
frequency: 利用者の発言のたび
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねる書き込みを再生してワークスペースの状態を確かめる。E2E を持つのは、既存のシナリオに無い組み合わせ（`parent` と未整理と `for` を持つ書き込みの組・`docs/` の本文を持つ資料・タスクを積まない脱線の記録・タスクの成果の資料を `related` で指す完了）を持つシナリオだけ。発言をどう振り分けるか・どの案や言葉を書くかというモデルの判断は確かめない
test_file: tests/e2e/単一ユースケース/test_utterance_intake.py

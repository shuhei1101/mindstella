title: "画面で項目を足す・消す"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未着手のタスク T-1 と、本文を持ちどの項目からも指されていないメモ N-1
      - name: 開いている画面
        description: タスクのボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: タスクのボードで「項目を足す」を押す
        P-->>U: 詳細パネルに、足すタスクの編集の表示
        U->>P: タイトル「画面を作る」を書く
        P->>SV: タスクを足す編集を保存待ちに溜める
        P-->>U: ボードに、ID を持たない足すタスクのカードとバッジ
        U->>P: メモの表で「項目を足す」を押し、タイトル「画面の形」を書く
        P->>SV: メモを足す編集を保存待ちに溜める
        U->>P: N-1 を開いて「項目を消す」を押す
        P->>SV: N-1 を消す編集を保存待ちに溜める
        U->>P: 保存待ちのパネルを開き、まとめて保存する
        P->>SV: 保存する
        SV->>WS: タスクとメモに ID を振って足し、N-1 とその本文を消し、保存待ちの編集を空にする
        SV-->>P: 受け付けた（振った ID）
        P-->>U: ボードに T-2、メモの表に N-2 を出し、N-1 を外す
      ```
    expected:
      - タスク T-2（「画面を作る」）とメモ N-2（「画面の形」）が足され、どちらも最後に編集した人が利用者（`user`）である
      - N-1 が `notes.yaml` から消え、本文のファイルも消えている
      - まだまとめていない変更に、消した項目 N-1 が残っている
      - 保存する前の足すタスクのカードが ID を持たず、保存待ちのバッジを持つ
      - 保存した後、保存待ちの編集が 0 件で、画面を開き直さずにボードに T-2 が出ている
    test: test_normal
  - name: 異常シナリオ（指されている項目を消す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 検討事項 D-1 と、D-1 を依存先（`depends_on`）に持つ検討事項 D-2
      - name: 保存待ちの編集
        description: D-1 を消す編集と、D-2 の答えの編集の 2 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 保存待ちのパネルでまとめて保存する
        P->>SV: 保存する
        SV-->>P: D-1 は D-2 が指している（何も書いていない）
        P-->>U: D-1 を消す行に、指している項目 D-2 と書き込めない理由を出す
      ```
    expected:
      - D-1・D-2 がどちらも保存する前のままで、D-2 の答えも書き換わっていない
      - 保存待ちの編集が 2 件のまま残る
      - D-1 を消す行に、指している項目 D-2 と、指されているため消せない理由が出る
    test: test_error_when_item_referenced
lead: 利用者が、サーバーが配るプレビューの種類ごとの画面から項目を足し、詳細パネルから項目を消す編集を保存待ちに溜め、保存待ちのパネルからまとめて保存する単一ユースケース。足した項目の ID は保存したときにサーバーが振る。ほかの項目が指している項目は消せない。溜めた編集の取り消しと、差分の表示中の扱いは単一ユースケース『画面で項目を編集して保存する』と同じ。
issue: 48
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: AI に頼まずに、画面から項目を足し、誤って足した・要らなくなった項目を消せる
  - name: AI（次の話し合いの Claude Code）
    interest: 利用者が足した・消した項目を、前回読んだ時点からの変更として受け取れる
trigger: 利用者が種類ごとの画面の「項目を足す」か、詳細パネルの「項目を消す」を押す
preconditions:
  - ワークスペースが作成済みで、サーバーがプレビューを配っている
  - 差分の表示をしていない
success_guarantee: 足した項目が、サーバーが振った ID で種類の YAML に加わり、消した項目が種類の YAML と本文から消える。足した項目の最後に編集した人が利用者になり、消した項目はまだまとめていない変更に消した項目として残る。
minimal_guarantee: 消す項目をほかの項目が指しているときは、どの項目も足さず・消さず・書き換えず、保存待ちの編集を残して、指している項目を示す。
frequency: 話し合いの合間に画面で記録を整えるたび
priority: 高
notes:
  E2E の範囲: MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで操作し、ワークスペースの YAML と本文のファイルを読んで確かめる。対応テストファイルは `tests/e2e/単一ユースケース/test_item_add_remove.py` にし、E2E テスト作成で書き足す
  消すと取り下げる: 消すのは誤って足した・重なった項目で、やめた項目は取り下げ・対象外・中止の状態にする（単一ユースケース『画面で項目を編集して保存する』）。指されている項目を消せない扱いは MCP の `remove` と同じ

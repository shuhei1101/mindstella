title: "採用する案の切り替え"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: 案 A（採用）と案 B を持つ決定済みの検討事項
      - name: 検討事項 D-2
        description: D-1 に依存する決定済みの検討事項（案 A を採用）
        notes: '`depends_on: [D-1]`'
      - name: 検討事項 D-3
        description: D-2 に依存する未決定の検討事項（案 A・B を持つ）
        notes: '`depends_on: [D-2]`'
      - name: タスク T-1
        description: D-3 を進める未着手のタスク
        notes: '`for: [D-3]`'
      - name: 検討事項 D-4
        description: D-1 と関係しない検討事項（案 A を持つ未決定）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の採用する案を B に切り替える
        SV->>SV: 案 A を外し案 B を採用にして、スキーマと突き合わせる
        SV->>WS: decisions.yaml に書く
        SV-->>CC: 切り替えた案
        CC->>SV: D-1 の影響を洗い出す
        SV->>WS: 依存をたどる
        SV-->>CC: 影響を受ける項目の一覧
      ```
    expected:
      - D-1 の案 B が採用、案 A が採用でない
      - D-1 の採用する案が 1 つだけである
      - D-1 が決定済みのままである
      - 影響の一覧に D-2・D-3・T-1 があり、D-4 が無い
      - 影響の一覧の各項目に、D-1 からたどった経路（直接か、どの項目を経たか）がある
      - D-1 が変更履歴を 1 回分持ち、切り替える前の案の採否（案 A が採用）が入っている
      - D-1 の `updated_by` が `ai` で、その変更履歴の回が書き換えた人 `ai` を持つ
    test: test_normal
  - name: 異常シナリオ（存在しない案を指す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: 案 A（採用）と案 B を持つ検討事項
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の採用する案を Z に切り替える
        SV->>WS: 案 Z を探して見つからない
        SV-->>CC: 案が無いエラー
      ```
    expected:
      - 切り替えのツールがエラーを返す
      - エラーの本文に、渡した案のキー `Z` と、D-1 が持つ案のキー `A`・`B` がある
      - ワークスペースの全てのファイルの中身が、切り替えを呼ぶ前と同じである
    test: test_error_when_option_not_found
  - name: 正常シナリオ（未決定の検討事項の案を採用する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: 案 A・B を持ち、B に推奨の印を持つ未決定の検討事項
      - name: 検討事項 D-2
        description: 案 A を採用した要見直しの検討事項
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の採用する案を B にする
        SV->>SV: 案 B を採用にし、状態を決定済みにして、スキーマと突き合わせる
        SV->>WS: decisions.yaml に書く
        SV-->>CC: 採用した案と、変えた状態
        CC->>SV: D-2 の採用する案を A にする
        SV->>SV: 案 A を採用にしたまま、状態を決定済みにする
        SV->>WS: decisions.yaml に書く
      ```
    expected:
      - D-1 が決定済みで、案 B だけが採用である
      - D-1 の変更履歴の回に、切り替える前の状態 `未決定` が入っている
      - D-1 の `answer` は呼ぶ前と同じである
      - D-2 が決定済みで、案 A だけが採用である
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_undecided_adopted
lead: スキルが、方針転換で検討事項の採用する案を切り替え、依存をたどって影響を受ける項目を洗い出す単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 方針を変えたときに、見直しが要る検討事項とタスクを漏れなく知る
trigger: 利用者が、決めた検討事項の別の案を採ると言う
preconditions:
  - ワークスペースに、案を 2 つ以上持つ検討事項がある
success_guarantee: 採用する案がちょうど 1 つになり、その検討事項に直接・間接に依存する項目と、それを進めるタスクが洗い出される。採用した検討事項は決定済みになる。
minimal_guarantee: 存在しない案を指したときは、どのファイルも書き換えない。
test_file: tests/e2e/単一ユースケース/test_option_adopt.py

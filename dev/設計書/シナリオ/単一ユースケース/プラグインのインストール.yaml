title: "プラグインのインストール"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（実際の Claude Code の CLI で実行する）
      - name: 設定のフォルダ
        description: テストごとの空の一時フォルダを Claude Code の設定のフォルダにし、利用者の環境を汚さない
        notes: 環境変数 `CLAUDE_CONFIG_DIR` で差し替える
      - name: マーケットプレイスの場所
        description: このリポジトリの作業ツリーの直下。GitHub から登録するときも取り込む中身は同じ
        notes: ローカルのパスを渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code
        participant PLG as プラグイン

        U->>CC: マーケットプレイスを登録する
        CC->>PLG: .claude-plugin/marketplace.json を読む
        CC-->>U: マーケットプレイス mindstella を登録した
        U->>CC: プラグイン mindstella@mindstella をインストールする
        CC->>PLG: plugins/mindstella/ の .claude-plugin/plugin.json と skills/ を取り込む
        CC-->>U: プラグイン mindstella をインストールした
        U->>CC: インストール済みのプラグインの一覧を見る
        CC-->>U: mindstella@mindstella（有効）
      ```
    expected:
      - 登録済みのマーケットプレイスの一覧に `mindstella` がある
      - インストール済みのプラグインの一覧に `mindstella@mindstella` が有効である
      - インストールしたプラグインのフォルダに `skills/mindmap/schemas/` と `skills/mindmap/scripts/` がある
      - インストールしたプラグインのフォルダに `dev/`・`docs/`・`tests/`・`.storybook/`・`package.json` が無い
      - インストールしたプラグインの hooks が `SessionStart` の 1 件（『未読へ戻す』）だけである
    test: test_normal
lead: 利用者がこのリポジトリを Claude Code のマーケットプレイスとして登録し、プラグイン mindstella をインストールする単一ユースケース。
issue: 2
primary_actor: Claude Code の利用者
trigger: 利用者がマーケットプレイスを登録するコマンドを打つ
preconditions:
  - Claude Code が入っている
  - プラグイン mindstella をまだインストールしていない
success_guarantee: プラグイン mindstella が有効な状態で入り、スキルのフォルダ `skills/mindmap/` を持つ。利用者の手元へ写されるのはプラグインのフォルダ（`plugins/mindstella/`）の中だけで、リポジトリの開発用のファイルは写されない。
test_file: tests/e2e/単一ユースケース/test_plugin_install.py

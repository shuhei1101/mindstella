title: "ワークスペースの作成"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: ワークスペースの場所
        description: テストごとの一時フォルダの下の、まだ無いフォルダ
      - name: 設定
        description: プレイブック・最上位の軸の呼び名・フェーズの並び・対象・カテゴリー・ゴール
        notes: プレイブック `[システム開発]`、最上位の軸の呼び名 `機能`、フェーズ `目的` → `要件` → `構成`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: フォルダと設定を渡してワークスペースを作る
        SV->>SV: 設定をスキーマと突き合わせる
        SV->>WS: .mindstella/ に設定・空の YAML・docs/・release/・版のファイルを書く
        SV->>WS: 直下に README.md を書く
        SV-->>CC: 作ったワークスペースのパス
      ```
    expected:
      - ワークスペースに `.mindstella/config.yaml` があり、渡したプレイブック・最上位の軸の呼び名・フェーズ・対象・カテゴリー・ゴールを持つ
      - ワークスペースの `.mindstella/` に `decisions.yaml`・`tasks.yaml`・`research.yaml`・`docs.yaml`・`terms.yaml`・`notes.yaml`・`logs.yaml` があり、どれも項目を持たない
      - ワークスペースの `.mindstella/` に `docs/` と `release/` のフォルダがある
      - ワークスペースに `.mindstella/mindstella-version.ini` があり、1 行目がプラグインの版である
      - ワークスペースの直下に、設定・種類ごとの YAML・`docs/`・`release/`・版のファイルが無い
      - ワークスペースの直下に `README.md` があり、プレビューの開き方の案内がある
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal
  - name: 異常シナリオ（既にワークスペースがある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 既存のワークスペース
        description: 作成を 1 回済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 既存のワークスペースのフォルダを渡して作る
        SV->>WS: .mindstella/config.yaml か、直下の config.yaml・mindmap.yaml があることを確かめる
        SV-->>CC: 既にワークスペースがあるエラー
      ```
    expected:
      - 作成のツールがエラーを返す
      - エラーの本文に、既にワークスペースがある旨とフォルダのパスがある
      - ワークスペースの全てのファイルの中身が、作成を呼ぶ前と同じである
      - ワークスペースの直下のファイルとフォルダの並びが、作成を呼ぶ前と同じである
    test: test_error_when_workspace_exists
  - name: 正常シナリオ（ゴールを決めずに作る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: ワークスペースの場所
        description: テストごとの一時フォルダの下の、まだ無いフォルダ
      - name: 設定
        description: ゴールを持たず、プレイブックを 2 つ並べた設定
        notes: プレイブック `[壁打ち, 調査]`、`goal` のキーを渡さない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: フォルダと、ゴールを持たない設定を渡してワークスペースを作る
        SV->>SV: 設定をスキーマと突き合わせる
        SV->>WS: .mindstella/ に設定・空の YAML・docs/・release/・版のファイルを書く
        SV-->>CC: 作ったワークスペースのパス
      ```
    expected:
      - '`config.yaml` が `goal` のキーを持たず、`playbooks` が `壁打ち`・`調査` の 2 件である'
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_without_goal
  - name: 異常シナリオ（移す前の形のワークスペースがある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 移す前の形のワークスペース
        description: '`.mindstella/` を持たず、直下に `mindmap.yaml` と種類ごとの YAML を持ち、検討事項 D-1 を持つフォルダ'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 移す前の形のワークスペースのフォルダを渡して作る
        SV->>WS: 直下に mindmap.yaml があることを確かめる
        SV-->>CC: 既にワークスペースがあるエラー（移し替えを案内する）
      ```
    expected:
      - 作成のツールがエラーを返す
      - エラーの本文に、既にワークスペースがある旨と、移し替えの案内がある
      - '`.mindstella/` が作られていない'
      - 直下に `README.md` が作られていない
      - ワークスペースの全てのファイルの中身が、作成を呼ぶ前と同じである
    test: test_error_when_unmigrated_workspace_exists
  - name: 正常シナリオ（README.md が既にある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: README.md を持つフォルダ
        description: 利用者が書いた `README.md` だけを直下に持ち、`.mindstella/` を持たないフォルダ
        notes: '`README.md` の中身は `# 家計簿アプリの話し合い`'
      - name: 設定
        description: 正常シナリオと同じ設定
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: フォルダと設定を渡してワークスペースを作る
        SV->>WS: .mindstella/ に設定・空の YAML・docs/・release/・版のファイルを書く
        SV->>WS: 直下に README.md が既にあることを確かめ、書かない
        SV-->>CC: 作ったワークスペースのパス
      ```
    expected:
      - 作成のツールがエラーを返さない
      - ワークスペースに `.mindstella/config.yaml` がある
      - 直下の `README.md` の中身が、作成を呼ぶ前と同じである
    test: test_normal_when_readme_exists
lead: スキルが、1 つの話し合いのフォルダ（ワークスペース）を新しく作る単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 話し合いの記録を始められる。既にある話し合いの記録を上書きされない
trigger: 利用者が新しい話し合いを始め、スキルがセットアップのステップで題名・プレイブック・最上位の軸の呼び名・フェーズ・対象・カテゴリーと、持つときはゴールを決め終える
preconditions:
  - プラグイン mindstella がインストールされている
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 指定したフォルダの `.mindstella/` に、決めた設定を持つ `config.yaml` と、空の種類ごとの YAML・`docs/`・`release/`・プラグインの版を書いた `mindstella-version.ini` があり、全ての YAML がスキーマに合う。
minimal_guarantee: 既にワークスペースがあるときは、フォルダの中身を書き換えない。
test_file: tests/e2e/単一ユースケース/test_workspace_create.py

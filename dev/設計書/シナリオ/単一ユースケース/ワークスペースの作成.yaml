title: "ワークスペースの作成"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: ワークスペースの場所
        description: テストごとの一時フォルダの下の、まだ無いフォルダ
      - name: 設定
        description: 分野・最上位の軸の呼び名・フェーズの並び・対象・カテゴリー・ゴール
        notes: 分野 `システム開発`、最上位の軸の呼び名 `システム`、フェーズ `目的` → `要件` → `構成`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: フォルダと設定を渡してワークスペースを作る
        SV->>SV: 設定をスキーマと突き合わせる
        SV->>WS: 設定・空の YAML・docs/・release/・版のファイルを書く
        SV-->>CC: 作ったワークスペースのパス
      ```
    expected:
      - ワークスペースに `mindmap.yaml` があり、渡した分野・最上位の軸の呼び名・フェーズ・対象・カテゴリー・ゴールを持つ
      - ワークスペースに `decisions.yaml`・`tasks.yaml`・`research.yaml`・`docs.yaml`・`terms.yaml`・`notes.yaml`・`logs.yaml` があり、どれも項目を持たない
      - ワークスペースに `docs/` と `release/` のフォルダがある
      - ワークスペースに `mindstella-version.ini` があり、1 行目がプラグインの版である
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal
  - name: 異常シナリオ（既にワークスペースがある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: 既存のワークスペース
        description: 作成を 1 回済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 既存のワークスペースのフォルダを渡して作る
        SV->>WS: mindmap.yaml があることを確かめる
        SV-->>CC: 既にワークスペースがあるエラー
      ```
    expected:
      - 作成のツールがエラーを返す
      - エラーの本文に、既にワークスペースがある旨とフォルダのパスがある
      - ワークスペースの全てのファイルの中身が、作成を呼ぶ前と同じである
    test: test_error_when_workspace_exists
lead: スキルが、1 つの話し合いのフォルダ（ワークスペース）を新しく作る単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 話し合いの記録を始められる。既にある話し合いの記録を上書きされない
trigger: 利用者が新しい話し合いを始め、スキルがセットアップのステップで分野・最上位の軸の呼び名・フェーズ・対象・カテゴリー・ゴールを決め終える
preconditions:
  - プラグイン mindstella がインストールされている
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 指定したフォルダに、決めた設定を持つ `mindmap.yaml` と、空の種類ごとの YAML・`docs/`・`release/`・プラグインの版を書いた `mindstella-version.ini` があり、全ての YAML がスキーマに合う。
minimal_guarantee: 既にワークスペースがあるときは、フォルダの中身を書き換えない。
test_file: tests/e2e/単一ユースケース/test_workspace_create.py

title: "概要を見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '前提が全て決定済みの未決定の検討事項 D-2・前提が未決定の未決定の検討事項 D-6・要見直しの検討事項 D-3・保留の検討事項 D-4（前提の D-6 が未決定）・保留のタスク T-3・進行中のタスク T-2・納品物の資料 A-1（状態: 完成）と A-2（状態: 確認中）'
        notes: 'D-4 は `depends_on: [D-6]`。資料の状態の値はインターフェース定義設計で `docs.schema.json` と決め、決まった値に合わせる'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューの URL を開く
        P-->>U: 概要のタイル
        U->>P: 要見直しのタイルの「すべて表示」を押す
        P-->>U: 検討事項の表（状態 = 要見直しの条件のチップ付き）
      ```
    expected:
      - 次に検討する項目のタイルに D-2 があり、D-6 は無い
      - ゴールまでの進捗のタイルの納品物のチェックリストに、状態が完成の A-1（チェック済み）と、完成でない A-2（未チェック）がある
      - 要見直しのタイルに D-3 がある
      - 保留のタイルに D-4 の名前があり、待っている前提などの補足の行と、保留のタスク T-3 は無い
      - 進行中のタスクのタイルに T-2 がある
      - 「すべて表示」を押した後、検討事項の表に状態 = 要見直しの条件のチップがあり、行は D-3 だけ
      - URL のハッシュが検討事項の表と表示形式を指す
    test: test_normal
  - name: 正常シナリオ（保留をすべて表示する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 保留の検討事項 D-4・D-7 と保留のタスク T-3
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 概要を開く
        P-->>U: 保留のタイル（保留の検討事項と「すべて表示」）
        U->>P: 保留の「すべて表示」を押す
        P-->>U: 検討事項の表（状態 = 保留の条件のチップ付き）
      ```
    expected:
      - 保留のタイルに「すべて表示（2 件）」が 1 つだけあり、保留のタスク T-3 は無い
      - 「すべて表示」を押した後、検討事項の表に状態 = 保留の条件のチップがあり、行は D-4・D-7 だけ
    test: test_normal_when_show_all_holds
  - name: 正常シナリオ（納品物が 5 件を超える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 納品物の資料 6 件と、納品物でない資料 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 概要を開く
        P-->>U: ゴールまでの進捗のタイル（納品物の「すべて表示」）
        U->>P: 納品物の「すべて表示」を押す
        P-->>U: 資料（納品物で絞り込んだカード）
      ```
    expected:
      - ゴールまでの進捗のタイルに納品物の「すべて表示」がある
      - 押した後、資料の画面に納品物の絞り込みの条件があり、カードは納品物の 6 件だけ
    test: test_normal_when_many_deliverables
lead: 利用者が、プレビューの概要のタイルで次に検討する項目・ゴールまでの進捗・要見直し・保留・進行中のタスクを読み、タイルからその条件の一覧を開く単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者がプレビューを開く（概要は既定で開く画面）
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
  - ブラウザが CDN へ HTTPS で届く
test_file: tests/e2e/単一ユースケース/test_overview_view.py

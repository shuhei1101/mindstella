title: "記録の追加と更新"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 検討事項の中身
        description: タイトル・対象・カテゴリー・フェーズ・状態・問いの説明・影響度・案
        notes: 状態 `未決定`、影響度 `大`、案 A・B（推奨の印は A）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 検討事項を足す
        SV->>SV: ID・作成日・更新日を付け、スキーマと突き合わせる
        SV->>WS: decisions.yaml に書く
        SV-->>CC: 振った ID
        CC->>SV: その ID の答えと状態を直し、案 A を採用にする
        SV->>SV: 更新日を変え、スキーマと突き合わせる
        SV->>WS: decisions.yaml に書く
        SV-->>CC: 直した ID
      ```
    expected:
      - 追加が返した ID が `D-` で始まる
      - '`.mindstella/decisions.yaml` にその ID の項目が 1 件あり、足したタイトル・対象・カテゴリー・フェーズ・問いの説明・影響度を持つ'
      - 足した項目が案 A・B を持ち、案 A だけが推奨の印を持つ
      - 更新の後、その項目の答えと状態が直した値になっている
      - 更新の後、その項目が決定済みで、案 A だけが採用である
      - その項目の作成日が追加のときの値のまま、更新日が記録されている
      - 足した時点と更新の後のどちらでも、その項目の `updated_by` が `ai` である
      - ワークスペースの全ての YAML がスキーマに合う
      - 足しただけの時点では、その項目は変更履歴を持たない
      - 更新の後、その項目が変更履歴を 1 回分持ち、直す前の答えと状態が入っている
      - その変更履歴の 1 回分が、書き換えた人 `ai` を持つ
    test: test_normal
  - name: 異常シナリオ（スキーマに合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
      - name: 検討事項の中身
        description: 状態に、決めた状態の名前に無い値を入れた検討事項
        notes: 状態 `完了`（タスクの状態で、検討事項には無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 状態の値が誤った検討事項を足す
        SV->>SV: スキーマと突き合わせて合わない
        SV-->>CC: 合わない箇所を示すエラー
      ```
    expected:
      - 追加のツールがエラーを返す
      - エラーの本文に、合わないキー `status` と、その値 `完了` がある
      - ワークスペースの全てのファイルの中身が、追加を呼ぶ前と同じである
    test: test_error_when_schema_mismatch
  - name: 異常シナリオ（存在しない ID を直す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 存在しない ID の答えを直す
        SV->>WS: ID を探して見つからない
        SV-->>CC: ID が無いエラー
      ```
    expected:
      - 更新のツールがエラーを返す
      - エラーの本文に、渡した ID がある
      - ワークスペースの全てのファイルの中身が、更新を呼ぶ前と同じである
    test: test_error_when_id_not_found
  - name: 正常シナリオ（保持する回数を超えて直す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、`config.yaml` の `history_limit` を 1 にして、本文を持つ検討事項 D-1 を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の答えを直す
        SV->>WS: 変更履歴を 1 回分積んで書く
        CC->>SV: D-1 の本文を直す
        SV->>SV: 変更履歴を積み、保持する回数を超えた古い履歴を消す
        SV->>WS: 書く
        CC->>SV: D-1 の本文を同じ中身で直す
        SV->>SV: 変わったキーが無く、変更履歴を積まない
      ```
    expected:
      - D-1 の変更履歴が 1 回分だけで、本文を直した回のものである
      - その変更履歴から、本文を直す前の本文を組み立てられる
      - 答えを直した回の変更履歴は残っていない
      - 同じ中身で直した後も、変更履歴はその前と同じ
      - 変更履歴に本文の全文は入っていない
    test: test_normal_when_over_history_limit
  - name: 正常シナリオ（保持する回数が 0）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 保持する回数を 0 にし、検討事項 D-1 を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の答えを直す
        SV->>SV: 保持する回数が 0 のため、変更履歴を積まない
        SV->>WS: decisions.yaml に書く
      ```
    expected:
      - D-1 の答えが直した値になっている
      - D-1 が変更履歴を持たない
    test: test_normal_when_history_limit_zero
  - name: 正常シナリオ（書き換えをまとめる）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を 1 件足して `commit` したワークスペース（保持する回数は既定の 5）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の答えを直す
        CC->>SV: タスク T-1 を足す
        CC->>SV: pending
        SV-->>CC: まだまとめていない変更（D-1・T-1）
        CC->>SV: commit（説明「D-1 を決め、T-1 を積む」）
        SV->>WS: まとまりを書く
        CC->>SV: pending
        SV-->>CC: 空
      ```
    expected:
      - 1 回目の `pending` が D-1（変えたキー `answer`）と T-1（足した）を返す
      - '`commit` の後、まとまりが 1 つ増え、日時と説明「D-1 を決め、T-1 を積む」を持つ'
      - D-1 の変更履歴と T-1 が、そのまとまりに属する
      - 2 回目の `pending` が空を返す
      - 書き換えは `commit` を呼ぶ前からワークスペースに書かれている
    test: test_normal_when_changes_committed
  - name: 正常シナリオ（まとめて読み書きする）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を 1 件足して `commit` したワークスペース
      - name: まとめて渡す操作
        description: 検討事項を足す → その検討事項を進めるタスクを足す → D-1 の答えと状態を直す → D-1 を取得する、の 4 つをこの順に 1 回の呼び出しで渡す
        notes: タスクの `for` は、同じ呼び出しで先に足す検討事項を指す。指し方はインターフェース定義設計で決める
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 追加・追加・更新・取得の操作を並べて渡す
        SV->>WS: 種類の YAML を読む
        SV->>SV: 並べた順に当て、ID・日時・通し番号・変更履歴を付け、全てを当てた後に 1 回だけスキーマと突き合わせる
        SV->>WS: decisions.yaml と tasks.yaml を書く
        SV-->>CC: 操作ごとの結果（振った ID・直した ID・取得した中身）
      ```
    expected:
      - 結果が渡した操作と同じ順に 4 件あり、足した検討事項が D-2、タスクが T-1 である
      - 'T-1 が `for: [D-2]` を持つ'
      - 4 つ目の取得の結果が、直した後の D-1 の答えと状態を持つ
      - D-1 が変更履歴を 1 回分持ち、直す前の答えと状態が入っている
      - '`pending` が D-2・T-1（足した）と D-1（変えた）を返す'
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_batched
  - name: 異常シナリオ（まとめた操作の途中が合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を 1 件足したワークスペース
      - name: まとめて渡す操作
        description: 正しい検討事項を足す → D-1 の状態を、決めた状態の名前に無い値に直す、の 2 つを 1 回の呼び出しで渡す
        notes: 状態 `完了`（タスクの状態で、検討事項には無い）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 追加と誤った更新を並べて渡す
        SV->>SV: 並べた順に当て、スキーマと突き合わせて 2 つ目が合わない
        SV-->>CC: 合わない操作と箇所を示すエラー
      ```
    expected:
      - まとめて読み書きするツールがエラーを返す
      - エラーの本文に、合わないのが 2 つ目の操作であることと、キー `status` と値 `完了` がある
      - 1 つ目の検討事項も足されていない
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_batch_has_invalid_operation
  - name: 正常シナリオ（読んでいない回を残す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 保持する回数を 1 にし、検討事項 D-1 を足してから前回読んだ時点からの変更を一度読んだワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 の答えを直す
        CC->>SV: D-1 の理由を直す
        SV->>SV: 保持する回数を超えるが、どちらの回も AI が最後に読んだ時点より後なので消さない
        SV->>WS: decisions.yaml を書く
        CC->>SV: 前回読んだ時点からの変更を読む
        CC->>SV: D-1 の答えをもう一度直す
        SV->>SV: 読み終えた回のうち、保持する回数を超えた古い回を消す
        SV->>WS: decisions.yaml を書く
      ```
    expected:
      - 2 回直した後、D-1 が変更履歴を 2 回分持ち、`history_dropped_seq` を持たない
      - 前回読んだ時点からの変更が、D-1 の答えと理由の両方を前の値つきで返す
      - 3 回目に直した後、D-1 の変更履歴が 3 回目の 1 回分だけで、`history_dropped_seq` が消した回の最も大きい通し番号である
    test: test_normal_when_unread_history_kept
  - name: 正常シナリオ（タスク・用語集・メモに本文を書く）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 本文
        description: タスク T-1・用語 G-1・メモ N-1 にそれぞれ渡す 2 行の本文の Markdown と、N-1 を直すときの 2 行目を書き換えた本文
        notes: 'T-1 の本文 `経緯: 会話で持ち越した\n終わり方: 検証の結果を残す`。N-1 は 2 行目を `補足: 書き直した` に直す'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 本文を渡してタスク・用語・メモを足す
        SV->>WS: 種類の YAML と .mindstella/docs/ の本文を書く
        SV-->>CC: 振った ID
        CC->>SV: N-1 の本文を直す
        SV->>SV: 本文の差分を変更履歴に積む
        SV->>WS: notes.yaml と .mindstella/docs/ の本文を書く
        CC->>SV: T-1・G-1・N-1 を表示する
        SV-->>CC: 中身と本文
      ```
    expected:
      - 足した T-1・G-1・N-1 が、それぞれ `body` に `{ID}.md` を持ち、`.mindstella/docs/` にその Markdown がある
      - 表示の `body_markdown` が、T-1・G-1 は渡した本文、N-1 は直した後の本文である
      - N-1 が変更履歴を 1 回分持ち、その回が本文の 2 行目の差分を持つ
      - T-1・G-1・N-1 の `updated_by` が `ai` である
      - ワークスペースの全ての YAML がスキーマに合い、点検が問題を 0 件で返す
    test: test_normal_when_body_for_every_kind
  - name: 正常シナリオ（未整理の検討事項を案を持たずに足す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 案を持たない未整理の検討事項 D-1 を足す
        SV->>SV: 未整理は案の必須の対象でないことを確かめ、スキーマと突き合わせる
        SV->>WS: decisions.yaml に書く
        CC->>SV: D-1 を、案を持たないまま取り下げにする
        SV->>WS: decisions.yaml に書く
      ```
    expected:
      - D-1 が足され、案を持たない
      - D-1 が取り下げで、案を持たない
      - ワークスペースの全ての YAML がスキーマに合う
    test: test_normal_when_unsorted_without_options
  - name: 異常シナリオ（案を持たない検討事項を足す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 検討事項の中身
        description: 案を持たない未決定の検討事項
        notes: '`options` を渡さない'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 案を持たない未決定の検討事項を足す
        SV->>SV: 案の必須の対象の状態で、案が無い
        SV-->>CC: 案が無いことと直し方を示すエラー
      ```
    expected:
      - 追加のツールがエラーを返す
      - エラーの本文に、キー `options` と、案を 1 つ以上書く直し方がある
      - ワークスペースの全てのファイルの中身が、追加を呼ぶ前と同じである
    test: test_error_when_options_missing
  - name: 異常シナリオ（採用と状態が合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、案 A・B を持つ未決定の検討事項 D-1 を足したワークスペース
      - name: 書き込み
        description: D-1 を採用した案を持たないまま決定済みに直す更新と、案 A を採用にしたまま未決定で足す追加
        notes: 2 回に分けて呼ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: D-1 を、採用した案を持たないまま決定済みに直す
        SV->>SV: 決定済みが採用した案を持たない
        SV-->>CC: 採用した案が無いことを示すエラー
        CC->>SV: 案 A を採用にした未決定の検討事項を足す
        SV->>SV: 採用した案を持つのに未決定である
        SV-->>CC: 採用と状態が合わないことを示すエラー
      ```
    expected:
      - 更新のツールがエラーを返し、本文に D-1 と、`adopt` で案を採用する直し方がある
      - 追加のツールがエラーを返し、本文に状態 `未決定` と採用した案 `A` がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_adoption_and_status_mismatch
  - name: 正常シナリオ（資料の本文を HTML で書く）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませた、項目を持たないワークスペース
      - name: 本文
        description: 資料 A-1 に渡す 3 行の HTML の本文と、2 行目を書き換えた HTML の本文と、形式を替えるときの 2 行の Markdown の本文
        notes: HTML の本文 `<h1>画面のモック</h1>\n<p>一覧の画面</p>\n<p>詳細の画面</p>`。書き換えは 2 行目を `<p>絞り込みの画面</p>` にする
    flow: |-
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: HTML の本文を渡して資料 A-1 を足す
        SV->>WS: docs.yaml と .mindstella/docs/ の HTML の本文を書く
        CC->>SV: A-1 の HTML の本文の 2 行目を直す
        SV->>SV: 本文の差分を変更履歴に積む
        SV->>WS: docs.yaml と HTML の本文を書く
        CC->>SV: A-1 を表示する
        SV-->>CC: 中身と HTML の本文と形式
        CC->>SV: Markdown の本文を渡して A-1 を直す
        SV->>WS: docs.yaml と Markdown の本文を書き、HTML の本文を消す
        CC->>SV: A-1 を表示する
        SV-->>CC: 中身と Markdown の本文と形式
    expected:
      - 足した直後の A-1 の本文が HTML の形式で、`.mindstella/docs/` に渡した HTML の本文がある
      - 1 回目の表示が、書き換えた後の HTML の本文と HTML の形式を返す
      - A-1 の変更履歴の 1 回目が、HTML の本文の 2 行目の差分を持つ
      - Markdown に替えた後、A-1 の本文が Markdown の形式になり、`.mindstella/docs/` に A-1 の HTML の本文が残らない
      - 2 回目の表示が、渡した Markdown の本文と Markdown の形式を返す

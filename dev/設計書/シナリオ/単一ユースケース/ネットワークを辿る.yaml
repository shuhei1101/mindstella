title: "ネットワークを辿る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 7 種類の項目を 1 件以上ずつ。検討事項 D-3 は前提 D-1・進めるタスク T-2・関連 R-1 とつながる
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: ネットワークを開く
        P-->>U: 全種類の項目の玉と線
        U->>P: ドラッグで回し、ホイールで寄る
        U->>P: D-3 の玉を押す
        P-->>U: D-3 へ寄り、D-3 の詳細パネルを開く
        U->>P: 絞り込みのボタンを押し、ドロワーの種類で「検討事項」と「タスク」を選ぶ
        P-->>U: 検討事項とタスクの玉とその間の線だけを残す
      ```
    expected:
      - ネットワークに 7 種類の項目が、種類ごとの色で出る
      - D-3 を押した後、詳細パネルに D-3 が開き、URL のハッシュがネットワークと D-3 を指す
      - 「検討事項」と「タスク」を選んだ後、検討事項とタスクの玉とその間の線だけが残り、ドロワーの「検討事項」「タスク」のチェックボックスが選ばれ、絞り込みのボタンに件数のバッジが付く
    test: test_normal
    notes:
      E2E の範囲: 見た目の描き分け・状態の印・鍵の震えの見え方は、キャンバスの中の絵なので E2E では確かめず、画面設計の結合テストで確かめる
      性能: 描画の速さは E2E では確かめず、ほかの作業を止めた端末で PoC と同じ 200 条件の計測を流して確かめる
  - name: 正常シナリオ（種類の条件を解除する）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 7 種類の項目を 1 件以上ずつ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: ネットワークを開き、絞り込みのボタンを押す
        P-->>U: 全種類の項目の玉と線と、どの種類も選ばれていないドロワー
        U->>P: 種類のうち「検討事項」を選ぶ
        P-->>U: 検討事項の玉だけ
        U->>P: 種類の条件の「解除」を押す
        P-->>U: 全種類の項目の玉と線
      ```
    expected:
      - 開いた直後、ドロワーの種類のチェックが全て外れ、7 種類の玉が出て、絞り込みのボタンにバッジが無い
      - 「検討事項」を選んだ後、検討事項の玉だけが出て、絞り込みのボタンに件数のバッジが付く
      - 「解除」を押した後、7 種類の玉が出て、種類のチェックが全て外れ、バッジが消える
    test: test_normal_when_kind_condition_cleared
  - name: 正常シナリオ（状態と話題のタグで絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '決定済みの検討事項 D-1（タグ: 保存）、D-1 を前提に持つ要見直しの D-3（タグ: 保存）、D-3 を進める進行中のタスク T-2（タグ: 通知）、D-3 に関連する調査 R-1（タグ無し）'
        notes: 'D-3 は `depends_on: [D-1]`、T-2 は `for: [D-3]`、R-1 は `related: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: ネットワークを開き、絞り込みのボタンを押す
        U->>P: ドロワーのタグで「保存」を選ぶ
        P-->>U: 「保存」を持つ項目の玉と、その間の線
        U->>P: ドロワーの状態で「決定済み」を選ぶ
        P-->>U: 両方の条件に合う項目の玉
      ```
    expected:
      - 「保存」を選ぶと、D-1・D-3 の玉とその間の依存の線があり、T-2・R-1 の玉とそれにつながる線が無い
      - ドロワーの状態に、並んでいる項目の状態（決定済み・要見直し・進行中 など）が出る
      - 「決定済み」を足すと、D-1 の玉だけがある
      - 絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_filtered
  - name: 正常シナリオ（ロックして辿る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ記録。検討事項 D-3 は前提 D-1・進めるタスク T-2・関連 R-1 とつながる
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: ネットワークを開き、D-3 の玉を押す
        P-->>U: D-3 の詳細パネルを開く
        U->>P: D-3 の玉をもう一度押す
        P-->>U: D-3 をロックし、閉じた鍵を出す
        U->>P: T-2 の玉を押す
        P-->>U: 詳細パネルを T-2 に切り替え、中心と強調は D-3 のまま
        U->>P: 余白を押す
        P-->>U: 鍵を震わせ、表示は変えない
        U->>P: 概要のタブへ移り、ネットワークのタブへ戻る
        P-->>U: D-3 をロックしたままのネットワーク
        U->>P: D-3 の玉を押す
        P-->>U: 詳細パネルを D-3 に戻す
        U->>P: D-3 の玉をもう一度押す
        P-->>U: ロックを外す
      ```
    expected:
      - D-3 を 2 回目に押した後、ネットワークが D-3 をロックした項目として示し、詳細パネルは D-3 のまま
      - T-2 を押した後、詳細パネルに T-2 が開き、ロックした項目と注目の起点は D-3 のまま
      - 余白を押した後も、詳細パネルは T-2 のまま開いていて、ロックした項目は D-3 のまま
      - 概要からネットワークへ戻った後も、ロックした項目は D-3 のまま
      - D-3 を押した後、詳細パネルに D-3 が開き、ロックした項目は D-3 のまま
      - D-3 をもう一度押した後、ロックした項目が無くなり、詳細パネルは D-3 のまま
    test: test_normal_when_locked
    notes:
      E2E の範囲: 鍵の形・震え・素早い 2 回押しの扱いは、画面設計の結合テストで確かめる
  - name: 正常シナリオ（詳細を開いたままネットワークへ移る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 正常シナリオと同じ記録
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項のタブを開き、D-3 を押す
        P-->>U: D-3 の詳細パネルを開く
        U->>P: タブの帯のネットワークを押す
        P-->>U: D-3 を選んだネットワーク
      ```
    expected:
      - ネットワークへ移った後、詳細パネルに D-3 が開いたままで、ネットワークが D-3 を選んだ項目として示す
      - URL のハッシュがネットワークと D-3 を指す
      - 詳細パネルにネットワークへ移るボタンが無い
    test: test_normal_when_opened_with_detail
lead: 利用者が、全種類の項目を星として関係でつないだ 3D のネットワークを回し、寄り、絞り込みのボタンのドロワーで種類・状態・タグで絞り、玉を押して詳細を開き、注目の起点の項目をロックして辿る単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者がタブの帯の右端のネットワークを押す
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_graph_trace_view.py

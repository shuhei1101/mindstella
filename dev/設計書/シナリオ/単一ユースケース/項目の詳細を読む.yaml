title: "項目の詳細を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 検討事項 D-3（背景 `lead`・答え `answer`・理由 `reason` はそれぞれ強調とリストを含む Markdown、案 A を採用・案 B を不採用と理由、前提 D-1・後続 D-5、進めるタスク T-2、関連 R-1、本文の Markdown に mermaid の図を 1 つ）。メモ N-1 が D-3 を `related` で指す
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1920px
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項の表で D-3 を押す
        P-->>U: D-3 の詳細パネル（本文を寄せて並べる）
        U->>P: 「全画面表示」を押す
        P-->>U: 周りに余白を空けたモーダル
        U->>P: モーダルの中でホイールを回して本文を下へ送る
        P-->>U: モーダルの中だけを送る
        U->>P: 図の「拡大表示」を押す
        P-->>U: 全画面の中身を図の拡大に切り替える
        U->>P: 図の拡大を閉じ、モーダルの外側を押す
        P-->>U: 元の大きさ（D-3 の詳細パネル）
        U->>P: 前提の D-1 を押す
        P-->>U: D-1 の詳細パネル
        U->>P: ブラウザの戻る操作
        P-->>U: D-3 の詳細パネル
      ```
    expected:
      - D-3 の詳細パネルに、案 A（採用）と案 B（不採用と理由）のカードが縦に並ぶ
      - D-3 の詳細パネルが、タイトル → 背景 → 案 → 採用した案と理由（答え・理由）→ 本文の順に並ぶ
      - 背景・答え・理由と案の各値の Markdown が、強調とリストとして描かれる
      - 前提に D-1、後続に D-5、関連タスクに T-2、関連に R-1、参照元に N-1 が出る
      - 本文の Markdown が描かれ、mermaid の図が図として出て、図に「拡大表示」「Raw」「コピー」がある
      - 幅 1920px では、パネルを開いている間、本文がパネルの分だけ寄る
      - 全画面表示の間、全画面表示のボタンのアイコンが縮小（矢印が内向き）に替わり、ボタンの文字色・枠の色・背景色は押す前と同じ
      - モーダルの本文の幅が、モーダルの中の左右の余白を除いた幅いっぱいに広がる
      - モーダルの中で本文を送った後も、後ろの画面のスクロールの位置が変わらない
      - 図の拡大は全画面の中身の切り替えで、モーダルが 2 枚重ならない
      - 全画面に全てを閉じるボタンが無く、外側を押すと D-3 の詳細パネルに戻る
      - D-1 を押した後、詳細パネルに D-1 が開き、URL のハッシュが D-1 を指す
      - 最後に戻る操作で D-3 の詳細パネルに戻り、URL のハッシュが D-3 を指す
    test: test_normal
  - name: 異常シナリオ（本文にスクリプトを含む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文に `<script>` と `onerror` 属性を持つ `<img>` を含む資料 A-1
        notes: どちらも実行されるとページの変数に印を残す中身にする
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: A-1 の詳細パネルを開く
        P-->>U: 無害化した本文
      ```
    expected:
      - ページの変数に印が残らない（本文のスクリプトが実行されていない）
      - 詳細パネルの中に `<script>` 要素と `onerror` 属性が無い
    test: test_error_when_body_has_script
  - name: 異常シナリオ（本文の描画のライブラリが読めない）
    setup:
      - name: Mock
        description: CDN への marked・mermaid の要求をブラウザの通信の差し替えで失敗させる
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文に見出しと mermaid の図を持つ資料 A-1
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: A-1 の詳細パネルを開く
        P-->>U: 読めなかったライブラリの名前と、描画しない本文
      ```
    expected:
      - 読めなかったライブラリとして marked と mermaid の名前が出る
      - 本文の Markdown が、描画されないままの文字として読める
    test: test_error_when_render_library_unavailable
  - name: 正常シナリオ（本文のリンクで移る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 資料 A-1（本文に見出し「保存先」「決め方」、段落に `[決め方](#決め方)` のリンク・用語「保存先」・検討事項の ID「D-3」・インラインコードの「D-5」・記録に無い ID「D-99」、コードブロックに「保存先」と「D-3」）。用語 G-1（タイトル「保存先」、意味「記録を置くフォルダ」、本文に「保存先」）。検討事項 D-3・D-5
        notes: 「決め方」の見出しは、詳細パネルを開いたときに画面に入らない位置に置く
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: A-1 の詳細パネルを開く
        P-->>U: 用語に印、項目の ID にリンクを付けた本文
        U->>P: 本文の「保存先」にカーソルを合わせる
        P-->>U: G-1 の意味のツールチップ
        U->>P: 本文の「決め方」のリンクを押す
        P-->>U: 「決め方」の見出しまで送った本文
        U->>P: 「決め方」の見出しのリンクを押す
        P-->>U: A-1 と見出しを指す URL のハッシュ
        U->>P: その URL を新しいタブで開く
        P-->>U: 「決め方」の見出しまで送った A-1 の詳細パネル
        U->>P: 本文の「D-3」を押す
        P-->>U: D-3 の詳細パネル
        U->>P: ブラウザの戻る操作をし、本文の「保存先」を押す
        P-->>U: G-1 の詳細パネル
      ```
    expected:
      - A-1 の本文の段落の「保存先」に用語の印が付き、カーソルを合わせると「記録を置くフォルダ」のツールチップが出る。キーボードでフォーカスしても同じツールチップが出る
      - 見出し「保存先」の中の「保存先」には用語の印が付かない
      - 段落の「D-3」と、インラインコードの「D-5」はリンクで、「D-99」はリンクでない
      - コードブロックの「保存先」と「D-3」には、用語の印もリンクも無い
      - 本文の見出し「保存先」「決め方」に、それぞれの見出しを指すリンクがある
      - 「決め方」のリンクを押すと、詳細パネルの中が「決め方」の見出しが画面に入る位置まで送られ、後ろの画面は送られない
      - 見出しのリンクを押した後、URL のハッシュが資料のタブと A-1 と「決め方」の見出しを指す
      - その URL を新しいタブで開くと、A-1 の詳細パネルが「決め方」の見出しが画面に入る位置まで送られて開く
      - 「D-3」を押すと D-3 の詳細パネルが開き、URL のハッシュが D-3 を指す
      - 「保存先」を押すと G-1 の詳細パネルが開き、G-1 の本文の「保存先」には用語の印が付かない
    test: test_normal_when_body_links
  - name: 正常シナリオ（未決定の検討事項の推奨を読む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-7（背景 `lead` は強調を含む Markdown、案 A・B を持ち、B に推奨の印、どの案も採用でない）
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 検討事項の表で D-7 を押す
        P-->>U: D-7 の詳細パネル（背景・推奨の印の付いた案）
      ```
    expected:
      - D-7 の詳細パネルに、案 B のカードだけに推奨の印が出る
      - 案 A・B のカードが、どちらも採用・不採用の表示を持たない
      - 背景の Markdown が強調として描かれる
      - 採用した案と理由の節が出ない
    test: test_normal_when_recommendation_shown
  - name: 正常シナリオ（取り下げた項目を読む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '資料 A-1（`withdrawn: true`、`reason`「別の資料にまとめた」）と、取り下げていない資料 A-2'
      - name: 配信
        description: 記録を配っているサーバー。差分の表示は出していない（既定）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料の表を開く
        P-->>U: A-1 に取り下げの印を付けた表
        U->>P: A-1 を押す
        P-->>U: 取り下げの印と理由を出した詳細パネル
      ```
    expected:
      - 資料の表で、A-1 に取り下げの印が付き、A-2 には付かない
      - A-1 の詳細パネルに、取り下げの印と理由「別の資料にまとめた」が出る
      - A-2 の詳細パネルには取り下げの印も理由も出ない
    test: test_normal_when_withdrawn
  - name: 正常シナリオ（HTML の資料を読む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を HTML で持つ資料 A-1。本文は `<style>` で `body`・`p`・`*` の色と余白を塗り、見出し・段落・表・`<svg>` の図を持つ
        notes: 本文の高さは詳細パネルの高さより大きくする
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 1920px
    flow: |-
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のカードで A-1 を押す
        P-->>U: A-1 の詳細パネル（本文の HTML を描いた結果）
        U->>P: 「全画面表示」を押す
        P-->>U: 本文の HTML を描いた結果を持つモーダル
        U->>P: モーダルの外側を押す
        P-->>U: A-1 の詳細パネル
    expected:
      - 詳細パネルのヘッダーに HTML のバッジが出る
      - 本文の見出し・段落・表・図が、HTML を描いた結果で出る
      - 本文の `<style>` が、詳細パネルのタイトル・トップバー・資料のカードの色と余白を変えない
      - 本文の枠の高さが描いた中身に合い、本文の枠の中にスクロールの帯が出ない
      - 全画面表示のモーダルでも、本文が同じく描かれる
    test: test_normal_when_html_doc
  - name: 異常シナリオ（HTML の本文にスクリプトを含む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を HTML で持ち、`<script>`・`onerror` 属性を持つ `<img>`・`onclick` 属性を持つボタンを含む資料 A-1
        notes: どれも実行されるとページの変数に印を残す中身にする
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: A-1 の詳細パネルを開く
        P-->>U: スクリプトを動かさずに描いた本文
        U->>P: 本文のボタンを押す
        P-->>U: 何も起きない
    expected:
      - プレビューのページの変数にも、本文を描いた文書の変数にも印が残らない（本文のスクリプトとイベントの属性が実行されていない）
      - 本文の見出し・段落は描かれて出る
    test: test_error_when_html_body_has_script
  - name: 正常シナリオ（Markdown の中の html のコードブロックを読む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を Markdown で持つ資料 A-1。本文は見出し・段落の間に言語指定 `html` のコードブロックを 1 つ持ち、その HTML は `<style>` で `p` の色を塗り、段落と `<svg>` の図・`<script>` を持つ
        notes: '`<script>` は実行されるとページの変数に印を残す中身にする'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のカードで A-1 を押す
        P-->>U: Markdown の本文の中に、コードブロックの HTML を描いた結果を持つ詳細パネル
    expected:
      - コードブロックの位置に、HTML を描いた段落と図が出る（コードのまま出ない）
      - コードブロックの前後の Markdown の見出し・段落は、今までどおり描かれる
      - コードブロックの `<style>` が、前後の Markdown の段落・詳細パネル・トップバーの色を変えない
      - プレビューのページの変数にも、描いた文書の変数にも印が残らない（コードブロックのスクリプトが実行されていない）
      - 詳細パネルのヘッダーには MD のバッジが出て、HTML のバッジは出ない
    test: test_normal_when_html_code_block
lead: 利用者が、詳細パネルで 1 件の項目の案・関係・本文を読み、関係する項目や本文の見出し・用語・項目の ID のリンクへ移り、全画面と図の拡大で読む単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者がどれかの画面で項目を押すか、項目を指す URL を開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
minimal_guarantee: 本文に書かれた HTML やスクリプトは実行しない。描画のライブラリが読めないときも、本文の文字は読める。
test_file: tests/e2e/単一ユースケース/test_item_detail_view.py

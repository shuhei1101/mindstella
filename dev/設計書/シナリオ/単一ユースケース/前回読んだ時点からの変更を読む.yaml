title: "前回読んだ時点からの変更を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、本文を持つ検討事項 D-1 を足してから前回読んだ時点からの変更を一度読み、AI が最後に読んだ時点を記録したワークスペース（保持する回数は既定の 5）
      - name: 読んだ後の書き換え
        description: D-1 のタイトルを直し、続けて D-1 のタイトルと本文を直し、タスク T-1 を足す
        notes: D-1 のタイトルは読んだ時点の `問い A` → `問い B` → `問い C` と 2 回変える。本文は 3 行のうち 2 行目だけを変える
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 前回読んだ時点からの変更を読む
        SV->>WS: AI が最後に読んだ時点と、項目の通し番号・変更履歴を読む
        SV->>SV: 読んだ時点より大きい通し番号を持つ項目を集め、変わったキーごとに読んだ時点の値を組み立てる
        SV->>WS: AI が最後に読んだ時点を、最後に振った通し番号に書く
        SV-->>CC: 足した項目と、変えた項目（変わったキーと前の値・本文の行の差分）
        CC->>SV: 前回読んだ時点からの変更をもう一度読む
        SV-->>CC: 足した項目・変えた項目が空
      ```
    expected:
      - 足した項目が T-1 の 1 件である
      - 変えた項目が D-1 の 1 件で、変わったキーが `title` と本文である
      - D-1 の `title` の前の値が、読んだ時点の `問い A` である
      - D-1 の本文が 2 行目だけの行の差分で返り、本文の全文を含まない
      - 足した T-1 と変えた D-1 に、最後に編集した人 `ai` が載っている
      - 読んだ後、AI が最後に読んだ時点が `changes.yaml` の `last_seq` と同じである
      - 2 回目の読み取りが、足した項目・変えた項目を 0 件で返す
      - 項目の YAML の中身が、読む前と同じである
    test: test_normal
  - name: 正常シナリオ（読んだ時点の記録が無い）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項 D-1 を足して答えを直したワークスペース。前回読んだ時点からの変更を一度も読んでおらず、AI が最後に読んだ時点を持たない
        notes: この機能を入れる前の版で作ったワークスペースと同じ形
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 前回読んだ時点からの変更を読む
        SV->>WS: AI が最後に読んだ時点を読んで無い
        SV->>WS: AI が最後に読んだ時点を、最後に振った通し番号に書く
        SV-->>CC: 記録が無かったことと、空の足した項目・変えた項目
        CC->>SV: 前回読んだ時点からの変更をもう一度読む
        SV-->>CC: 足した項目・変えた項目が空
      ```
    expected:
      - 1 回目の結果が、記録が無かったことを示し、足した項目・変えた項目を 0 件で返す
      - 1 回目の後、AI が最後に読んだ時点が `changes.yaml` の `last_seq` と同じである
      - 2 回目の結果が、記録が無かったことを示さず、足した項目・変えた項目を 0 件で返す
    test: test_normal_when_no_read_point
  - name: 正常シナリオ（保持する回数が 0）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 保持する回数を 0 にし、検討事項 D-1 を足してから前回読んだ時点からの変更を一度読んだワークスペース
      - name: 読んだ後の書き換え
        description: D-1 の答えを直し、タスク T-1 を足す
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 前回読んだ時点からの変更を読む
        SV->>WS: AI が最後に読んだ時点と、項目の通し番号を読む
        SV->>SV: 読んだ時点より大きい通し番号を持つ項目を集める（変更履歴が無く、前の値は組み立てない）
        SV->>WS: AI が最後に読んだ時点を、最後に振った通し番号に書く
        SV-->>CC: 足した項目と変えた項目の ID
      ```
    expected:
      - 足した項目が T-1、変えた項目が D-1 である
      - D-1 が変わったキーと前の値を持たず、ID だけで返る
      - D-1 が変更履歴を持たない
    test: test_normal_when_history_limit_zero
lead: 話し合いを進めるスキル `session` が、準備のステップで AI が前回読んだ時点より後に足した・変えた項目を、変わったキーと前の値つきで読み、AI が最後に読んだ時点を今の時点に書き換える単一ユースケース。
issue: 45
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 前の話し合いの後に変わった記録を、AI が読み落とさずに話し合いを続ける
trigger: '`session` の準備のステップで、ワークスペースの版がプラグインと同じだと分かる'
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: AI が最後に読んだ時点より後に足した・変えた項目が全て返り、変えた項目は変わったキーごとに読んだ時点の値を持つ。AI が最後に読んだ時点が、最後に振った通し番号になっている。
minimal_guarantee: 読み取りに失敗したときは、AI が最後に読んだ時点を書き換えず、次に呼んだときに同じ変更を読める。
frequency: 話し合いごとに最初の 1 回
priority: 高
notes:
  E2E の範囲: MCP サーバーを立て、MCP のクライアントで書き込みのツールと前回読んだ時点からの変更を読むツールを呼んで、結果とワークスペースの状態を確かめる。ツールの名前と引数はインターフェース定義設計で決める
  読んだ時点が進むとき: AI が最後に読んだ時点を進めるのは、このツールを呼んだときだけ。AI が MCP のツールで書いた分も、次にこのツールを呼ぶまではまだ読んでいない変更に数える。次の話し合いの AI は、前の話し合いで書いた内容を覚えていないため
  記録が無いとき: 読んだ時点の記録が無いワークスペース（この機能を入れる前の版で作ったもの・作ったばかりのもの）では差分を返さず、今の時点を記録する。状況はセットアップの `status` で読んでいる。記録が無いうちは、保持する回数を超えた古い回を今までどおり消す
test_file: tests/e2e/単一ユースケース/test_changes_since_read.py

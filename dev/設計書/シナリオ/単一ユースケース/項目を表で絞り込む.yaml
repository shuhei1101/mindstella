title: "項目を表で絞り込む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '調査 R-1（確度: 高）・R-2（確度: 低）・R-3（確度: 高）。表が画面に収まらず縦に送れる件数にする'
        notes: 縦に送れるよう、調査をそのほかに 40 件足す
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 調査のタブを開き、表を下へ送る
        U->>P: 確度の列の見出しを 3 回押す
        P-->>U: 昇順 → 降順 → 解除
        U->>P: 絞り込みのボタンを押し、ドロワーで確度の「高」を選ぶ
        P-->>U: 絞り込んだ表と条件のチップ、ボタンの件数のバッジ
        U->>P: 2 列目までピン留めし、列を 1 つ隠す
        U->>P: 初期設定に戻す
        P-->>U: 既定の列と並び
      ```
    expected:
      - 確度の見出しを押すたびに、並びが昇順 → 降順 → 既定の並びに変わり、見出しの `aria-sort` もそれに合う
      - 列の見出しに絞り込みのボタンが無く、表の上に絞り込みのボタンが 1 つある
      - ドロワーの確度の選択肢に値ごとの件数が出る
      - 「高」で絞ると行に R-2 が無く、表の上に確度 = 高のチップがあり、絞り込みのボタンに件数のバッジが付く
      - 押した列のピン留めのボタンだけが押された見た目になり、横に送っても 2 列目までが残る
      - 隠した列が表に無い
      - どの操作の後も、表の縦のスクロールの位置が操作の前と同じ
      - 表を下へ送っても、トップバーとタブの帯が画面の上に見えたままで、ページ全体の縦のスクロールの位置は 0 のまま
      - 初期設定に戻すと、隠した列が戻り、ピン留めが外れる
    test: test_normal
  - name: 正常シナリオ（該当なし）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 完了）と T-2（種類: 調査・状態: 未着手）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表で、ドロワーで種類 = 作業 × 状態 = 未着手を選ぶ
        P-->>U: 該当なしの表示
        U->>P: 「すべて解除」を押す
        P-->>U: 全ての行
      ```
    expected:
      - 絞った後、表の場所に「該当するタスクはありません。別の条件を試してください。」が出る
      - 「すべて解除」を押すと T-1・T-2 の 2 行が戻り、チップが無くなり、絞り込みのボタンのバッジが消える
    test: test_normal_when_no_match
  - name: 正常シナリオ（話題のタグで絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 未着手・タグ: 保存・画面）、T-2（種類: 調査・状態: 進行中・タグ: 保存）、T-3（種類: 作業・状態: 未着手・タグ: 通知）、T-4（種類: 作業・状態: 完了・タグ無し）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクの表で絞り込みのボタンを押す
        P-->>U: 種類・状態・タグの条件を並べたドロワー（どの値も選ばれていない）
        U->>P: タグの「保存」と「通知」を選ぶ
        P-->>U: どちらかのタグを持つ行
        U->>P: 種類の「作業」を選ぶ
        P-->>U: 両方の条件に合う行
        U->>P: 表示形式をボードに切り替える
        P-->>U: 同じ条件で絞ったボード
      ```
    expected:
      - ドロワーに種類・状態・タグの条件があり、どの値も選ばれておらず、絞り込みのボタンにバッジが無い
      - タグの選択肢に「保存」（2）・「画面」（1）・「通知」（1）の件数が出る
      - タグの「保存」と「通知」を選ぶと、表に T-1・T-2・T-3 があり、T-4 が無い
      - 種類の「作業」を足すと、表に T-1・T-3 だけがある
      - ボードに切り替えても、T-1・T-3 のカードだけがあり、絞り込みのボタンに件数のバッジが付いたまま
    test: test_normal_when_topic_tags
  - name: 正常シナリオ（列の文字で絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 用語 G-1「シナリオの依頼」、G-2「シナリオ」、G-3「タスクの担当」、G-12「レビュー」
        notes: G-12 は ID に「G-1」を含むが G-1 とは別の項目
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 用語集のタブを表で開き、絞り込みのボタンを押す
        U->>P: ドロワーで用語の列に「シナリオ」を入れる
        P-->>U: 用語に「シナリオ」を含む行と条件のチップ
        U->>P: 用語の列の条件を解除し、ID の列に「g-1」を入れる
        P-->>U: ID に「G-1」を含む行
      ```
    expected:
      - 「シナリオ」を入れると、表に G-1・G-2 があり、G-3・G-12 が無い
      - 表の上に用語の列の文字の条件のチップがあり、絞り込みのボタンに件数のバッジが付く
      - ID の列に「g-1」を入れると、大文字・小文字を区別せず含む行に絞り、表に G-1・G-12 があり、G-2・G-3 が無い
      - 列の見出しに絞り込みのボタンが無く、表の上に絞り込みのボタンが 1 つある
    test: test_normal_when_text_condition
    notes:
      入口: 列の文字の条件を絞り込みのドロワーに置くのは、#47（D-44）で「どの画面も絞り込みのボタン 1 つにまとめ、ドロワーで条件を選ぶ」と決めたため。文字を入れる欄の形はモック作成で決める
  - name: 正常シナリオ（読み込み直しても条件が残る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（状態: 未着手）、T-2（状態: 完了）、T-3（状態: 進行中）'
      - name: 配信
        description: 記録を配っているサーバーと、そのプレビューの URL。端末の保存領域は空
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）
        participant LS as 端末の保存領域

        U->>P: タスクの表で、ドロワーで状態 = 未着手を選ぶ
        P->>LS: タスクの画面の絞り込みの条件を残す
        U->>P: 画面を読み込み直す
        P-->>U: 状態 = 未着手で絞った表
        U->>P: URL のハッシュに状態 = 完了の f.{列} を付けてタスクを開く
        P-->>U: 状態 = 完了で絞った表
        U->>P: ハッシュを付けずにタスクを開き直す
        P-->>U: 状態 = 未着手で絞った表
        U->>P: 表示の設定の「既定に戻す」を押す
        P->>LS: 絞り込みの条件を外す
        P-->>U: 絞っていない表
      ```
    expected:
      - 読み込み直した後、表に T-1 だけがあり、状態 = 未着手のチップと絞り込みのボタンの件数のバッジがある
      - '`f.{列}` で開くと表に T-2 だけがあり、ハッシュを付けずに開き直すと T-1 だけに戻る（ハッシュの条件で保存した条件を書き換えない）'
      - 表示の設定の「この端末で変えている項目」に、タスクの絞り込みがある
      - 既定に戻すと T-1・T-2・T-3 の全ての行が戻り、読み込み直しても絞られない
      - ワークスペースの記録の項目の YAML と `config.yaml` の中身が、開く前と同じ
    test: test_normal_when_reloaded
    notes:
      配る書き出し: 配る書き出しは絞り込みの条件を保存しない。既存の『プレビューを配る』のシナリオを実行するだけで、ここでは確かめない
lead: 利用者が、どの種類の項目も共通の表で並べ替え・絞り込みのボタンのドロワーでの絞り込み（列の値の文字・ID を含む）・ピン留め・表示する列の選択をして、初期設定に戻す単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者がどれかのタブを表で開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_table_filter_view.py

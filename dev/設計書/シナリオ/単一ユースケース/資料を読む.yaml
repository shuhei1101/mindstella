title: "資料を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '納品物でない資料 A-1（種類: メモ書き、状態: 下書き、本文の Markdown に 1 行の文「メモ書きの本文」を持つ）と、納品物の資料 A-2（種類: 仕様書、状態: 完成、本文の Markdown に見出しと表を持つ）'
        notes: 資料の状態の値はインターフェース定義設計で `docs.schema.json` と決め、決まった値に合わせる
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のタブを開く
        P-->>U: 納品物を先頭にしたカード
        U->>P: 表示形式をボードに切り替える
        P-->>U: 状態ごとの列のボード
        U->>P: A-1 のカードを押す
        P-->>U: A-1 の詳細パネル
        U->>P: 表示形式をカードに戻す
        P-->>U: 納品物を先頭にしたカード
        U->>P: 絞り込みのボタンを押し、ドロワーで種類 = 仕様書を選ぶ
        P-->>U: 絞り込んだカード
        U->>P: A-2 のカードを押す
        P-->>U: A-2 の詳細パネル（本文）
      ```
    expected:
      - 開いた直後のカードの並びが A-2、A-1 の順で、A-2 に納品物の印がある
      - カードに資料の状態が出る（A-2 は完成、A-1 は下書き）
      - ボードに下書き・確認中・完成の 3 列があり、A-1 は下書き、A-2 は完成の列にあり、確認中の列は 0 件で出る
      - ボードから開いた詳細パネルに A-1 の本文「メモ書きの本文」が出る
      - 絞り込んだ後のカードは A-2 だけで、条件のチップに種類 = 仕様書があり、絞り込みのボタンに件数のバッジが付く
      - 詳細パネルに A-2 の本文が、見出しと表に描かれて出る
    test: test_normal
  - name: 正常シナリオ（本文の形式のバッジ）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '本文を Markdown で持つ資料 A-1（種類: 仕様書）と、本文を HTML で持つ資料 A-2（種類: モック）'
        notes: A-2 の本文は見出しと段落を持つ HTML
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のタブを開く
        P-->>U: 形式のバッジを付けたカード
        U->>P: 表示形式をボードに切り替える
        P-->>U: 形式のバッジを付けたボード
        U->>P: 表示形式を表に切り替える
        P-->>U: 形式のバッジを付けた表
    expected:
      - カード・ボード・表のどれでも、A-2 に HTML のバッジが出て、A-1 には形式のバッジが出ない
      - バッジは色だけでなく文言で形式を示す
    test: test_normal_when_body_format_badge
    notes:
      バッジの文言と位置: モック作成で決め、画面設計に書く
lead: 利用者が、資料を納品物を先頭にしたカードで見て、状態の列のボードに切り替え、絞り込み、カードから本文を開く単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者が資料のタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_doc_read_view.py

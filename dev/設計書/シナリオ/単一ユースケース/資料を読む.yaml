title: "資料を読む"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '納品物でない資料 A-1（種類: メモ書き、状態: 下書き、本文の Markdown に 1 行の文「メモ書きの本文」を持つ）と、納品物の資料 A-2（種類: 仕様書、状態: 完成、本文の Markdown に見出しと表を持つ）'
        notes: 資料の状態の値はインターフェース定義設計で `docs.schema.json` と決め、決まった値に合わせる
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のタブを開く
        P-->>U: 納品物を先頭にしたカード
        U->>P: 表示形式をボードに切り替える
        P-->>U: 状態ごとの列のボード
        U->>P: A-1 のカードを押す
        P-->>U: A-1 の詳細パネル
        U->>P: 表示形式をカードに戻す
        P-->>U: 納品物を先頭にしたカード
        U->>P: 絞り込みのボタンを押し、ドロワーで種類 = 仕様書を選ぶ
        P-->>U: 絞り込んだカード
        U->>P: A-2 のカードを押す
        P-->>U: A-2 の詳細パネル（本文）
      ```
    expected:
      - 開いた直後のカードの並びが A-2、A-1 の順で、A-2 に納品物の印がある
      - カードに資料の状態が出る（A-2 は完成、A-1 は下書き）
      - ボードに下書き・確認中・完成の 3 列があり、A-1 は下書き、A-2 は完成の列にあり、確認中の列は 0 件で出る
      - ボードから開いた詳細パネルに A-1 の本文「メモ書きの本文」が出る
      - 絞り込んだ後のカードは A-2 だけで、条件のチップに種類 = 仕様書があり、絞り込みのボタンに件数のバッジが付く
      - 詳細パネルに A-2 の本文が、見出しと表に描かれて出る
    test: test_normal
  - name: 正常シナリオ（本文の形式のバッジ）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: '本文を Markdown で持つ資料 A-1（種類: 仕様書）と、本文を HTML で持つ資料 A-2（種類: モック）'
        notes: A-2 の本文は見出しと段落を持つ HTML
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のタブを開く
        P-->>U: 形式のバッジを付けたカード
        U->>P: 表示形式をボードに切り替える
        P-->>U: 形式のバッジを付けたボード
        U->>P: 表示形式を表に切り替える
        P-->>U: 形式のバッジを付けた表
      ```
    expected:
      - カード・ボード・表のどれでも、A-2 に HTML のバッジ、A-1 に MD のバッジが出る（表は「形式」の列に HTML / MD）
      - バッジは色だけでなく文言で形式を示す
    test: test_normal_when_body_format_badge
    notes:
      バッジの文言と位置: モック作成で決め、画面設計に書く
  - name: 正常シナリオ（埋め込んだ HTML と部品）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文を Markdown で持つ資料 A-1 と、用語 G-1（エイリアス「応答時間」）と、資料 A-2
        notes: A-1 の本文は、段落（「応答時間」と `A-2` を含む）、`<!-- html -->` の範囲（「応答時間」と `A-2` を含む段落・`<mdmark-chart>` のチャート・`<mdmark-param>` のスライダー 1 つと今の値をコピーするボタン・`<script>`）、範囲の外の `html` のコードブロックを持つ
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 資料のタブで A-1 を押す
        P-->>U: 埋め込んだ HTML・チャート・スライダーを描いた詳細パネル
        U->>P: チャートの拡大のボタンを押し、拡大したチャートをドラッグする
        P-->>U: 倍率と表示の位置が変わったチャート
        U->>P: スライダーを矢印キーで動かす
        P-->>U: 値に合わせて描き直したグラフ
        U->>P: 今の値をコピーするボタンを押す
        P-->>U: クリップボードに今の値の JSON
        U->>P: 埋め込んだ HTML の中の「応答時間」のマーカーに乗せる
        P-->>U: G-1 のツールチップ
        U->>P: 埋め込んだ HTML の中の A-2 のリンクを押す
        P-->>U: A-2 の詳細パネル
      ```
    expected:
      - A-1 の詳細パネルで、範囲の HTML が要素で描かれ、範囲の中の `<script>` は動かず文書にも残らない
      - 範囲の外の `html` のコードブロックは、今のまま HTML の本文の枠で描かれる
      - チャートは拡大のボタンで倍率が上がり、拡大した後のドラッグで表示の位置が変わる。図の拡大の画面は開かない
      - 範囲の中のチャート以外の要素（段落・スライダー）には、拡大・縮小のボタンが付かない
      - 'スライダーを動かすと値とグラフが描き直され、コピーのボタンでクリップボードに `{"{キー}": {"name": ..., "value": ...}}` の JSON が入る'
      - 段落と埋め込んだ HTML の中の「応答時間」の両方に用語のマーカーが付き、乗せると G-1 のツールチップが出る
      - 埋め込んだ HTML の中の `A-2` がリンクになり、押すと A-2 の詳細パネルへ移って履歴に積まれる
      - ワークスペースの YAML と本文の中身が、開く前と同じ
    test: test_normal_when_embedded_html_and_parts
lead: 利用者が、資料を納品物を先頭にしたカードで見て、状態の列のボードに切り替え、絞り込み、カードから本文を開く単一ユースケース。
issue: 5
primary_actor: 利用者
trigger: 利用者が資料のタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_doc_read_view.py

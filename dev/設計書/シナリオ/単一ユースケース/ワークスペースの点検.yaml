title: "ワークスペースの点検"
scenarios:
  - name: 正常シナリオ（問題が無い）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 整った記録
        description: D-2 が D-1 に依存し、D-1 の本文が `.mindstella/docs/` にある検討事項。D-1 は案 A を採用した決定済み、D-2 は案 A・B を持つ未決定
        notes: '`depends_on: [D-1]`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを点検する
        SV->>WS: 全ての YAML と docs/ を読む
        SV-->>CC: 問題が無い
      ```
    expected:
      - 点検のツールが成功を返す
      - 出力に、問題が無い旨がある
    test: test_normal_when_clean
  - name: 正常シナリオ（参照切れとずれがある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 参照切れ
        description: 存在しない D-9 に依存する検討事項 D-1
        notes: '`depends_on: [D-9]`'
      - name: 本文の無い項目
        description: 本文を指しているのに、`.mindstella/docs/` にその Markdown が無い調査 R-1 とメモ N-1
      - name: 項目の無い本文
        description: どの項目からも指されていない `.mindstella/docs/` の Markdown
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを点検する
        SV->>WS: 全ての YAML と docs/ を読む
        SV-->>CC: 参照切れとずれの一覧
      ```
    expected:
      - 点検のツールがツールのエラーにせず、`ok` が偽の結果を返す
      - 出力に、D-1 の `depends_on` が存在しない D-9 を指す旨がある
      - 出力に、R-1 と N-1 の本文が `.mindstella/docs/` に無い旨がある
      - 出力に、どの項目からも指されていない `.mindstella/docs/` の Markdown のファイル名がある
      - ワークスペースの全てのファイルの中身が、点検を呼ぶ前と同じである
    test: test_normal_when_problems_found
  - name: 正常シナリオ（設定に無いフェーズがある）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: フェーズ 目的 → 要件 で作成を済ませたワークスペース
      - name: 設定に無いフェーズ
        description: '`phase` が `発散` の検討事項 D-1 と、`goal.phase` が `結論` の設定'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを点検する
        SV->>WS: config.yaml と全ての YAML を読む
        SV-->>CC: 設定に無いフェーズの一覧
      ```
    expected:
      - 点検のツールがツールのエラーにせず、`ok` が偽の結果を返す
      - 出力に、D-1 の `phase` の `発散` が設定の `phases` に無い旨がある
      - 出力に、`goal.phase` の `結論` が設定の `phases` に無い旨がある
      - ワークスペースの全てのファイルの中身が、点検を呼ぶ前と同じである
    test: test_normal_when_unknown_phase
  - name: 正常シナリオ（検討事項の案と状態が合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 合わない検討事項
        description: 案を持たない未決定の D-1、採用した案を持たない決定済みの D-2、案 A を採用した未決定の D-3
        notes: YAML を直接書いて作る
      - name: 必須の対象でない検討事項
        description: 案を持たない未整理の D-4・対象外の D-5・取り下げの D-6
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: ワークスペースを点検する
        SV->>WS: 全ての YAML を読む
        SV-->>CC: 案と状態の合わない検討事項の一覧
      ```
    expected:
      - 点検のツールがツールのエラーにせず、`ok` が偽の結果を返す
      - 出力に、D-1 が案を持たない旨がある
      - 出力に、D-2 が決定済みなのに採用した案を持たない旨がある
      - 出力に、D-3 が採用した案を持つのに未決定である旨がある
      - 出力に D-4・D-5・D-6 が無い
      - ワークスペースの全てのファイルの中身が、点検を呼ぶ前と同じである
    test: test_normal_when_options_and_status_mismatch
lead: スキルが、ワークスペースの参照切れと、YAML と本文の Markdown のずれと、設定に無いフェーズと、案と状態の合わない検討事項を洗い出す単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 消した項目を指したままの記録や、どの項目にも結び付かない本文が残らない
trigger: スキルが記録を書き終えた、または利用者がワークスペースを手で直した
preconditions:
  - ワークスペースが作成済みである
success_guarantee: 参照切れとずれが全て、どの項目のどのキーかとともに出る。どのファイルも書き換えない。
test_file: tests/e2e/単一ユースケース/test_workspace_check.py

  - name: 正常シナリオ（関連に種類といつ読むかを持たせる）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てる・`check`・`show`・まとめての書き込み・版の書き換えを、決めた引数で順に再生する
        notes: まとめての書き込みは、AI が関連ごとに両方の項目を読んで決めた種類といつ読むかを、決めた値で渡す
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
        notes: '-'
      - name: 関連を ID の並びで持つ版のワークスペース
        description: 版のファイルが v0.11.0 で、検討事項 D-1・D-2 と、関連を ID の並びで持つ調査 R-1（D-1・D-2 を指す）を持つワークスペース
        notes: 'YAML を直接書いて作る。R-1 `related: [D-1, D-2]`。D-2 への関連はいつ読むかを書けないものとして外す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者

title: "ワークスペースの移し替え"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てる・`check`・題名を入れる・版の書き換えを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版を記録する前の形式のワークスペース
        description: '版のファイルを持たず、`mindmap.yaml` が `summary` を持たず `field: システム開発` と `target_label: システム` を持ち、資料 A-1（`done: true`）・A-2（`done: false`）を持つワークスペース'
        notes: YAML を直接書いて作る。聞かれる題名には `要件出しのスキルを設計する` と答える
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV->>WS: 版のファイルを読む（無い）
        SV-->>CC: 版を記録する前の形式 → プラグインの版の手順（mindmap.yaml を config.yaml へ改め、直下のファイルとフォルダを .mindstella/ へ移す破壊的な操作を含む）
        CC-->>U: 当てる手順の一覧を示し、破壊的な操作を当ててよいか確かめる
        U->>CC: 当ててよい
        CC->>SV: 写しを取って手順を当てる
        SV->>WS: 写しを取る
        SV->>WS: 版の順に手順を当てる
        SV-->>CC: 当てた手順
        CC->>SV: check
        SV-->>CC: config.yaml に summary が無い
        CC-->>U: 題名を聞く
        U->>CC: 題名
        CC->>SV: 題名を入れる
        SV->>WS: .mindstella/config.yaml を書く
        CC->>SV: 版を書き換える
        SV->>WS: .mindstella/mindstella-version.ini を書く
        CC-->>U: 移し替えた版を示し、/mindstella:session で続けるよう案内する
      ```
    expected:
      - '`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である'
      - 並べた手順に、`mindmap.yaml` を `config.yaml` へ改める `rename_file` が破壊的な操作の印つきである
      - 並べた手順に、直下のファイルとフォルダを `.mindstella/` へ移す手順が、破壊的な操作の印つきである
      - '`docs.yaml` の A-1 が `status: 完成`、A-2 が `status: 下書き` で、どちらも `done` を持たず、`updated` が呼ぶ前と同じである'
      - '`config.yaml` の `summary` が答えた題名である'
      - ワークスペースに `mindmap.yaml` が無く、`.mindstella/config.yaml` がある
      - 種類ごとの YAML・`docs/`・`release/` が `.mindstella/` の下にあり、直下に残っていない
      - 資料 A-1・A-2 の本文が、移し替える前と同じ中身で `.mindstella/docs/` にある
      - '`config.yaml` が `field` を持たず、`playbooks` が `[システム開発]` で、`target_label` が `システム` のままである'
      - '`check` が問題を 0 件で返す'
    test: test_normal
  - name: 正常シナリオ（版が同じ）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 今の版のワークスペース
        description: '`init` で作り、資料 A-1（`status: 完成`）を足したワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV->>WS: 版のファイルを読む
        SV-->>CC: 版が同じ・当てる手順は無い
        CC-->>U: 移し替えるものが無いことを示す
      ```
    expected:
      - 版の比較が、版が同じで当てる手順が空だと返す
      - ワークスペースの全てのファイルの中身と更新日時が、呼ぶ前と同じである
    test: test_normal_when_same_version
  - name: 異常シナリオ（手順の途中で失敗する）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てるを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 手順が読めないワークスペース
        description: 版のファイルを持たず、`mindmap.yaml` は読めるが、`docs.yaml` が YAML として読めない中身のワークスペース
        notes: '`v0.3.0` の資料の `done` を `status` に移す手順が `docs.yaml` を読めずに失敗する。`docs.yaml` には閉じていない括弧（`items: [`）を書く'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV-->>CC: 当てる手順
        CC->>SV: 写しを取って手順を当てる
        SV->>WS: 写しを取る
        SV->>SV: 手順を当てる途中で失敗する
        SV->>WS: 写しから戻す
        SV-->>CC: エラー（失敗した版・手順・理由）
        CC-->>U: どの版のどの手順で何が失敗したかを示して止まる
      ```
    expected:
      - 手順を当てるツールがエラーを返し、出力に失敗した版（`v0.3.0`）・手順・`docs.yaml` を読めない理由がある
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
      - '`mindstella-version.ini` が無いままである'
    test: test_error_when_step_fails
  - name: 異常シナリオ（版が新しい）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版が新しいワークスペース
        description: '`init` で作り、版のファイルを `v99.0.0` に書き換えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV->>WS: 版のファイルを読む
        SV-->>CC: ワークスペースの版が新しい
        CC-->>U: プラグインを更新するよう案内して止まる
      ```
    expected:
      - 版の比較が、ワークスペースの版がプラグインより新しいと返す
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_workspace_newer
  - name: 異常シナリオ（話し合いを進めるスキルを版が古いワークスペースへ呼ぶ）
    setup:
      - name: Mock
        description: モデルを呼ばない。`session` の準備が連ねる版の比較を、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版を記録する前の形式のワークスペース
        description: '版のファイルを持たず、資料 A-1 が `done: true` のワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>WS: .mindstella/config.yaml か、直下の config.yaml・mindmap.yaml を読む
        CC->>SV: 版を比べる
        SV-->>CC: ワークスペースの版が古い
        CC-->>U: /mindstella:upgrade で移し替えるよう案内して止まる
      ```
    expected:
      - 版の比較が、ワークスペースの版がプラグインより古いと返す
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_session_on_older_workspace
  - name: 異常シナリオ（話し合いを進めるスキルを版が新しいワークスペースへ呼ぶ）
    setup:
      - name: Mock
        description: モデルを呼ばない。`session` の準備が連ねる版の比較を、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版が新しいワークスペース
        description: '`init` で作り、版のファイルを `v99.0.0` に書き換えたワークスペース'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>WS: .mindstella/config.yaml か、直下の config.yaml・mindmap.yaml を読む
        CC->>SV: 版を比べる
        SV-->>CC: ワークスペースの版が新しい
        CC-->>U: プラグインを更新するよう案内して止まる
      ```
    expected:
      - 版の比較が、ワークスペースの版がプラグインより新しいと返す
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_session_on_newer_workspace
  - name: 正常シナリオ（直下に版を記録したワークスペース）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てる・`check`・版の書き換えを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 直下に版を記録したワークスペース
        description: '直下に `mindstella-version.ini`（`v0.5.0`）・`mindmap.yaml`・種類ごとの YAML・`docs/` を持ち、`mindmap.yaml` が `playbooks: [システム開発]` と `summary` を持ち、本文と案 A・B を持つ未決定の検討事項 D-1 を持つワークスペース'
        notes: v0.5.0 のプラグインで作った形。YAML を直接書いて作る。直下の版のファイルを読み外すと「版を記録する前の形式」と扱われ、v0.3.0・v0.5.0 の手順がもう一度当たる
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV->>WS: .mindstella/ の版のファイルを読む（無い）
        SV->>WS: 直下の版のファイルを読む（v0.5.0）
        SV-->>CC: v0.5.0 → プラグインの版の手順（v0.5.0 より新しくプラグインの版までの手順）
        CC-->>U: 当てる手順の一覧を示し、破壊的な操作を当ててよいか確かめる
        U->>CC: 当ててよい
        CC->>SV: 写しを取って手順を当てる
        SV->>WS: 写しを取り、v0.5.0 より新しくプラグインの版までの手順を当てる
        CC->>SV: check
        SV-->>CC: 問題 0 件
        CC->>SV: 版を書き換える
        SV->>WS: .mindstella/mindstella-version.ini を書く
        CC-->>U: 移し替えた版を示し、/mindstella:session で続けるよう案内する
      ```
    expected:
      - 版の比較が、ワークスペースの版 `v0.5.0` からプラグインの版への移し替えを返し、並べた手順の版が、`migrations/` にある版のうち `v0.5.0` より新しくプラグインの版（`version.ini`）までの版の集まりと一致する（v0.6.0 の手順を含む）
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版で、直下に版のファイルが残っていない
      - '`config.yaml` の `playbooks`・`summary` と D-1 の中身・本文が、呼ぶ前と同じである'
      - 種類ごとの YAML・`docs/` が `.mindstella/` の下にあり、直下に `mindmap.yaml`・`config.yaml` が残っていない
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_version_recorded_at_top
  - name: 正常シナリオ（案を持たない検討事項を直す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てる・`check`・`batch`・版の書き換えを、決めた引数で順に再生する
        notes: '-'
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
        notes: '-'
      - name: v0.6.0 のワークスペース
        description: '`.mindstella/mindstella-version.ini` が `v0.6.0` で、`answer` と `reason` を持ち案を持たない決定済みの D-1、案を持たない未決定の D-2、案を持たない未整理の D-3、案 A を採用した未決定の D-4 を持つワークスペース'
        notes: YAML を直接書いて作る
      - name: 再生する確かめ
        description: '`check` が挙げた D-2 には AI が案 A・B のたたき台（A に推奨の印）を書いて示し、利用者がそのまま書いてよいと答える。D-4 は利用者が案 A で決まっていると答える'
        notes: '`batch` 1 回で、D-2 は `update` で案 A・B を書き、D-4 は `update` で状態を決定済みにする'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV-->>CC: v0.6.0 → プラグインの版の手順（v0.6.0 より新しくプラグインの版までの手順。v0.7.0 の手順を含む）
        CC->>SV: 写しを取って手順を当てる
        SV->>WS: 写しを取り、決定済みで答えを持つ D-1 に答えから採用した案を作る
        CC->>SV: check
        SV-->>CC: D-2 が案を持たない・D-4 が採用した案を持つのに未決定
        CC-->>U: D-2 の案のたたき台と、D-4 の扱いを示して確かめる
        U->>CC: D-2 はそのまま書く・D-4 は案 A で決まっている
        CC->>SV: batch（D-2 に案 A・B を書き、D-4 を決定済みにする）
        CC->>SV: check
        SV-->>CC: 問題 0 件
        CC->>SV: 版を書き換える
        SV->>WS: .mindstella/mindstella-version.ini を書く
      ```
    expected:
      - D-1 が案を 1 つだけ持ち、その案が採用で、`content` が移し替えの前の `answer`、`reason` が移し替えの前の `reason` であり、D-1 は決定済みのままである
      - D-2 が案 A・B を持ち、案 A だけが推奨の印を持ち、未決定のままである
      - D-3 が案を持たない未整理のままである
      - D-4 が決定済みで、案 A だけが採用である
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である
      - 最後の `check` が問題を 0 件で返す
    test: test_normal_when_options_filled
  - name: 正常シナリオ（送信をスレッドへ移す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てる・`check`・版の書き換えを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: スレッドを足す前の版のワークスペース
        description: 版のファイルが v0.7.0 で、未決定の検討事項 D-1・本文を持つ資料 A-1 と、送信 2 件を持つワークスペース
        notes: S-1 は D-1 への「案 A にする」で取り込み済み。S-2 は A-1 の本文の 2 行目と選んだ文「言い換えたい文」を指す「ここは言い換える」で、取り込んでいない。YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV-->>CC: 送信をスレッドへ移し、送信のファイルを消す手順（破壊的な操作）
        CC-->>U: 当てる手順の一覧を示し、破壊的な操作を当ててよいか確かめる
        U->>CC: 当ててよい
        CC->>SV: 写しを取って手順を当てる
        SV->>WS: 送信を 1 件ずつスレッドにし、送信のファイルを消す
        CC->>SV: check
        SV-->>CC: 問題が無い
        CC->>SV: 版を書き換える
        SV->>WS: .mindstella/mindstella-version.ini を書く
      ```
    expected:
      - 並べた手順に、送信をスレッドへ移して送信のファイルを消す手順が、破壊的な操作の印つきである
      - スレッドが 2 件あり、それぞれの最初の書き込みが S-1・S-2 の向けた項目・箇所・本文・送った日時のままである
      - 取り込み済みだった S-1 のスレッドはクローズで、書き込みが取り込み済みである。取り込んでいなかった S-2 のスレッドはオープンで、取り込み待ちである
      - ワークスペースに送信のファイルが無い
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である
      - 最後の `check` が問題を 0 件で返す
    notes:
      取り込み済みの送信: 取り込み済みの送信は、書き込みを取り込み済みにして移す（次の取り込みで記録し直さない）。AI の返信を持たず話が済んでいるので、クローズのスレッドとして移す
    test: test_normal_when_submissions_to_threads
  - name: 正常シナリオ（タグの語彙を外す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較と手順の一覧・手順を当てる・`check`・版の書き換えを、決めた引数で順に再生する
        notes: '-'
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
        notes: '-'
      - name: タグの語彙を持つ版のワークスペース
        description: 版のファイルが v0.10.0 で、`config.yaml` がタグの語彙（`保存`・`通知`・`起票`。`保存` は説明を持つ）を持ち、検討事項 D-1（タグ `保存`・`通知`）と、タグ `起票` を持つスレッド TH-1 を持つワークスペース
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（upgrade）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:upgrade {フォルダ}
        CC->>SV: 版を比べ、当てる手順を並べる
        SV-->>CC: タグの語彙を外す手順と、項目のタグを主題を持てる形にする手順
        CC->>SV: 写しを取って手順を当てる
        SV->>WS: config.yaml からタグの語彙を外す
        SV->>WS: 項目の文字列のタグを名前の組にする
        CC->>SV: check
        SV-->>CC: 問題が無い
        CC->>SV: 版を書き換える
        SV->>WS: .mindstella/mindstella-version.ini を書く
      ```
    expected:
      - 並べた手順に、v0.11.0 と v0.12.0 の手順が破壊的な操作として並ぶ
      - '`config.yaml` がタグのキー（`tags`）を持たず、ほかのキーは移し替える前と同じである'
      - D-1 のタグが名前 `保存`・`通知` の組（どちらも主題でない）になり、TH-1 のタグが移し替える前と同じ文字列である
      - タグの一覧が `保存`・`通知`・`起票` を 1 件ずつ返す
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である
      - 最後の `check` が問題を 0 件で返す
    test: test_normal_when_tag_vocabulary_removed

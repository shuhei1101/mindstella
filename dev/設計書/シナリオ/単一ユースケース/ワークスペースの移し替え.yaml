      - 移し替えの後、R-1 の関連が D-1 への 1 件で、種類と書いたいつ読むかを持つ
      - D-1・D-2 の中身が移し替える前と同じである
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である
      - 最後の `check` が問題を 0 件で返す
    test: test_normal_when_related_typed_on_upgrade
lead: 利用者がプラグインを上げた後、移し替えのスキル `upgrade` を呼び、ワークスペースを記録した版からプラグインの版まで、版ごとの手順を順に当てて移し替える単一ユースケース。
issue: 43
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: プラグインを上げても、作ったワークスペースを壊さずに今の版の形で話し合いを続けられる。失敗しても移し替える前の中身に戻る
trigger: 利用者が `/mindstella:upgrade {ワークスペースのフォルダ}` を呼ぶ（`/mindstella:setup`・`/mindstella:session` が、版が古いときに案内する）
preconditions:
  - 起動スクリプトで立ち上げた Claude Code で、mindstella の MCP のツールが使える
success_guarantee: 記録した版より後でプラグインの版以下の版の手順が版の順に当たり、全ての YAML が今のスキーマに合い、`.mindstella/mindstella-version.ini` がプラグインの版になっている。
minimal_guarantee: 手順の途中で失敗したときは、ワークスペースが移し替える前の中身に戻り、どの版のどの手順で何が失敗したかが示される。ワークスペースの版がプラグインより新しいときは、何も書かずに止まる。
frequency: ワークスペースの形を変えた版へプラグインを上げた後、ワークスペースごとに 1 回
priority: 高
notes:
  E2E の範囲: E2E はモデルを呼ばず、スキルの手順が連ねるツールの呼び出しの並びを再生してワークスペースの状態を確かめる。手順の一覧の示し方・破壊的な操作を当てる前の確認・案内の文面はモデルの応答で、確かめない。破壊的な操作の印は、`mindmap.yaml` を `config.yaml` へ改める手順で確かめる
  スキルの呼び名: 移し替えのスキルは `upgrade`（`/mindstella:upgrade`）
  対応テストファイル: '`tests/e2e/単一ユースケース/test_workspace_upgrade.py`。E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` へ移す'
  関連の種類といつ読むか: 関連の ID の文字列を相手だけを持つ要素にするのは手順のスクリプトで、種類といつ読むかは、点検の後に移し替えのスキルが関連ごとに両方の項目を読み、判定フローチャート『関連の張り方』（knowledge）で決めて `batch` 1 回でまとめて書く。いつ読むかを書けない関連は外し、外した関連を利用者に示す
  案を持たない検討事項: v0.7.0 の手順は、`決定済み` で `answer` を持ち案を持たない検討事項に、`answer` を内容・`reason` を理由にした採用した案を 1 つ作る。ほかの案と状態の合わない検討事項は、点検の後に移し替えのスキルが AI の書いたたたき台を利用者に確かめてから、`batch` 1 回でまとめて直す（書き込むツールはワークスペース全体を案と状態の決まりと突き合わせるため、1 件ずつは直せない）
test_file: tests/e2e/単一ユースケース/test_workspace_upgrade.py

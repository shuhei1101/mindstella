        CC->>SV: R-1・D-1・D-2 の中身を出す
        CC->>CC: 関連ごとに、関連の張り方に当てて種類といつ読むかを決める
        CC->>SV: まとめての書き込み（R-1 の D-1 への関連に種類といつ読むかを書き、D-2 への関連を外す）

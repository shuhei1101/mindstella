title: "記録の検索"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 検討事項 D-1
        description: 'タイトルに `スキーマ` を含み、タグ `データ` と属性 `担当: 自分` を持つ検討事項'
      - name: 検討事項 D-2
        description: どの文字の欄にも `スキーマ` を含まず、D-1 に依存する検討事項
        notes: '`depends_on: [D-1]`・属性 `担当: 自分`・タグ `画面`'
      - name: タスク T-1
        description: 'どの文字の欄にも `スキーマ` を含まず、D-1 を進め、属性 `期限: 10 月` を持つタスク'
        notes: '`for: [D-1]`・タグ `データ`'
    flow: |
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 「スキーマ」を含む項目を探す
        SV->>WS: 全ての YAML を読む
        SV-->>CC: 合う項目の一覧
        CC->>SV: D-1 の中身を出す
        SV-->>CC: D-1 の中身と、D-1 を参照している項目
        CC->>SV: 使っている属性名を出す
        SV-->>CC: 属性名と使っている件数
        CC->>SV: 使っているタグを出す
        SV-->>CC: タグと付いている件数・種類
        CC->>SV: タグ「データ」を持つ項目を探す
        SV-->>CC: 合う項目の一覧
    expected:
      - 探した結果に D-1 があり、D-2・T-1 が無い
      - D-1 の中身に、タイトル・状態・タグ・属性がある
      - D-1 を参照している項目に D-2 と T-1 がある
      - 属性名の一覧に `担当`（2 件）と `期限`（1 件）がある
      - タグの一覧が名前の順で、`データ`（2 件・検討事項とタスク）と `画面`（1 件・検討事項）を持つ
      - タグ「データ」で探した結果に D-1・T-1 があり、D-2 が無い
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal
  - name: 異常シナリオ（存在しない ID を出す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 存在しない ID の中身を出す
        SV->>WS: ID を探して見つからない
        SV-->>CC: ID が無いエラー
      ```
    expected:
      - ツールがエラーを返す
      - エラーの本文に、渡した ID がある
    test: test_error_when_id_not_found
lead: スキルが、ワークスペースの項目を条件で探し、1 件の中身とそれを参照している項目、使っている属性名とタグを読む単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 前に決めたことを会話の中ですぐ引ける。同じ意味の属性が別の名前で増えない
trigger: 会話で前の記録に触れる、または属性を付ける前に使っている名前を確かめる
preconditions:
  - ワークスペースが作成済みである
success_guarantee: 条件に合う項目・1 件の中身と参照元・属性名の一覧が出る。どのファイルも書き換えない。
test_file: tests/e2e/単一ユースケース/test_record_search.py

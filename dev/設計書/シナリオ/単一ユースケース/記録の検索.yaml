title: "記録の検索"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、タグの語彙に `データ`・`画面`・`保留` を説明つきで登録したワークスペース
        notes: '`保留` はどの項目も持たない'
      - name: 検討事項 D-1
        description: 'タイトルに `スキーマ` を含み、タグ `データ` と属性 `担当: 自分` を持つ検討事項'
      - name: 検討事項 D-2
        description: どの文字の欄にも `スキーマ` を含まず、D-1 に依存する検討事項
        notes: '`depends_on: [D-1]`・属性 `担当: 自分`・タグ `画面`'
      - name: タスク T-1
        description: 'どの文字の欄にも `スキーマ` を含まず、D-1 を進め、属性 `期限: 10 月` を持つタスク'
        notes: '`for: [D-1]`・タグ `データ`・`画面`'
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 「スキーマ」を含む項目を探す
        SV->>WS: 全ての YAML を読む
        SV-->>CC: 合う項目の一覧と全体の件数
        CC->>SV: D-1 の中身を出す
        SV-->>CC: D-1 の中身と、D-1 を参照している項目
        CC->>SV: 使っている属性名を出す
        SV-->>CC: 属性名と使っている件数
        CC->>SV: タグの語彙を出す
        SV-->>CC: 語彙のタグごとの説明と、付いている件数・種類
        CC->>SV: タグ「データ」と「画面」を両方持つ項目を探す
        SV-->>CC: 合う項目の一覧
        CC->>SV: タグ「データ」か「画面」を持つ項目を探す
        SV-->>CC: 合う項目の一覧
        CC->>SV: タグ「保留」を持つ検討事項を探す
        SV-->>CC: 空の一覧と、外せる条件の案内
      ```
    expected:
      - 探した結果に D-1 があり、D-2・T-1 が無く、全体の件数が 1 で、続きを取る値が無い
      - 探した結果の各項目が、ID・種類・タイトル・状態・タグを持つ
      - D-1 の中身に、タイトル・状態・タグ・属性がある
      - D-1 を参照している項目に D-2 と T-1 がある
      - 属性名の一覧に `担当`（2 件）と `期限`（1 件）がある
      - タグの語彙が登録した 3 件を説明つきで持ち、`データ`（2 件・検討事項とタスク）・`画面`（2 件・検討事項とタスク）・`保留`（0 件）である
      - タグ「データ」と「画面」を両方持つ項目で探した結果が T-1 だけである
      - タグ「データ」か「画面」を持つ項目で探した結果に D-1・D-2・T-1 がある
      - タグ「保留」を持つ検討事項で探した結果がエラーにならず、空の一覧・全体の件数 0 と、外せる条件（タグ・種類）を案内する文を持つ
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal
  - name: 異常シナリオ（存在しない ID を出す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を 1 件足したワークスペース
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 存在しない ID の中身を出す
        SV->>WS: ID を探して見つからない
        SV-->>CC: ID が無いエラー
      ```
    expected:
      - ツールがエラーを返す
      - エラーの本文に、渡した ID がある
    test: test_error_when_id_not_found
  - name: 正常シナリオ（ページを分けて読む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、検討事項を既定の件数より 5 件多く足したワークスペース
        notes: 既定の件数はインターフェース定義『項目の検索』の制約が持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 条件を付けずに項目を探す
        SV->>WS: 全ての YAML を読む
        SV-->>CC: 最初のページ・全体の件数・続きを取る値・絞り込める引数の案内
        CC->>SV: 続きを取る値を渡して探す
        SV-->>CC: 残りの 5 件・全体の件数
      ```
    expected:
      - 最初のページが既定の件数の項目を種類の順・連番の順で持ち、全体の件数が既定の件数 + 5 である
      - 最初のページの返事が、続きを取る値と、絞り込める引数（タグ・種類・状態）を案内する文を持つ
      - 続きを取る値で探した結果が残りの 5 件で、続きを取る値が無い
      - 2 つのページを合わせると、全ての検討事項が 1 回ずつ出る
    test: test_normal_when_paged
  - name: 正常シナリオ（語彙に無いタグで探す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませ、タグの語彙に `データ` を登録したワークスペース
      - name: 検討事項 D-1
        description: タグ `データ` を持つ検討事項
      - name: 検討事項 D-2
        description: 語彙に無い未登録の候補のタグを持つ検討事項
        notes: タグ `通知`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（スキル）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: タグ「通知」を持つ項目を探す
        SV->>WS: タグの語彙と項目を読む
        SV-->>CC: D-2 を持つページ
        CC->>SV: タグ「データー」を持つ項目を探す
        SV->>WS: タグの語彙と項目を読む
        SV-->>CC: 空のページと、近い語彙のタグの案内
      ```
    expected:
      - タグ「通知」で探した結果がエラーにならず、D-2 だけである
      - タグ「データー」で探した結果がエラーにならず、空の一覧・全体の件数 0 である
      - タグ「データー」で探した結果の案内の文に、渡したタグ `データー` と、近い語彙のタグ `データ` がある
    test: test_normal_when_unknown_tag
lead: スキルが、ワークスペースの項目を条件で探し、1 件の中身とそれを参照している項目、使っている属性名とタグの語彙を読む単一ユースケース。
issue: 3
primary_actor: スキルの手順を実行する Claude Code
stakeholders:
  - name: 利用者
    interest: 前に決めたことを会話の中ですぐ引ける。同じ意味の属性が別の名前で増えない
trigger: 会話で前の記録に触れる、または属性を付ける前に使っている名前を確かめる
preconditions:
  - ワークスペースが作成済みである
success_guarantee: 条件に合う項目のページと全体の件数・1 件の中身と参照元・属性名の一覧・タグの語彙が出る。どのファイルも書き換えない。
test_file: tests/e2e/単一ユースケース/test_record_search.py

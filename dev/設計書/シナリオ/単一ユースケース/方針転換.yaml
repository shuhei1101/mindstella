title: "方針転換"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `adopt`・`impact`・`update`・`add` を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 案 A・B を持ち A を採用した決定済みの D-1、D-1 に `depends_on` で依存する決定済みの D-2、D-2 に依存する決定済みの D-3
      - name: 再生する書き込み
        description: D-1 の採用を B に切り替え、`impact` が返した D-2・D-3 を要見直しにし、それぞれの見直しのタスク T-1・T-2 を積む。D-1 の `answer` を B の内容だけに直す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言（D-1 を B にしたい）
        CC->>SV: adopt D-1 B
        SV->>WS: 採用する案を切り替える
        CC->>SV: impact D-1
        SV-->>CC: 影響を受ける項目（D-2・D-3）
        CC->>SV: update（D-2・D-3 を要見直し、D-1 の answer を今の正だけにする）
        CC->>SV: add（見直しのタスク T-1・T-2、会話ログ）
        CC-->>U: 要見直しにした項目とタスクを示す
      ```
    expected:
      - D-2・D-3 が要見直しである
      - 'T-1・T-2 がそれぞれ `for: [D-2]`・`for: [D-3]` を持つ'
      - D-1 の `answer` に A の内容が残っていない
    test: test_normal
  - name: 正常シナリオ（納品物が要らなくなる）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `update`・`check`・`add` と `mindmap.yaml` の書き換えを、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: '`deliverable: true` の資料 A-1 と、`mindmap.yaml` のゴールの `deliverables` に A-1 を持つ'
      - name: 再生する書き込み
        description: スコープが変わり A-1 が要らなくなったため、A-1 の `deliverable` を外して資料へ格下げし、ゴールの `deliverables` から A-1 を外す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as mindmap.yaml

        U->>CC: 発言（スコープを変える）
        CC->>SV: update（A-1 の deliverable を外す）
        CC->>WS: Edit（ゴールの deliverables から A-1 を外す。利用者に書き込みの確認が出る）
        CC->>SV: check
        CC->>SV: add（会話ログ）
        CC-->>U: 資料へ格下げしたことを示す
      ```
    expected:
      - 'A-1 が `deliverable: false` で、資料として残っている'
      - ゴールの `deliverables` に A-1 が無い
      - '`check` が参照切れを 0 件で返す'
    test: test_normal_when_deliverable_no_longer_needed
lead: '`session` が、検討事項の採用する案を切り替え、依存をたどって影響を受ける項目を要見直しにし、見直しのタスクを積む単一ユースケース。'
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 方針を変えても、影響を受ける決め事を取りこぼさずに見直せる。本文に古い方針が混ざらない
trigger: 利用者が決定済みの検討事項の案を変える、またはセットアップで要見直しの検討事項から再開する
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 切り替えた検討事項の本文は今の正だけを書き、`impact` が返した決定済みの検討事項は全て要見直しになり、それぞれに見直しのタスクがある。
frequency: 話し合いの中で数回
priority: 高
notes:
  E2E の範囲: '`adopt`・`impact` の結果は既存の『採用する案の切り替え』の『正常シナリオ』が確かめる。このユースケースの E2E は、その後の要見直し・見直しのタスク・`answer` の直しと、納品物の格下げを確かめる'
test_file: tests/e2e/単一ユースケース/test_policy_change.py

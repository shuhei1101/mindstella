title: "プレビューを配る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる配る書き出しのツールを MCP のクライアントで呼ぶ（描画のライブラリは jsDelivr から取る）。ブラウザは外への通信を全て止めて、書き出した HTML を開く
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 検討事項 D-1 と、D-1 を前提に持つ D-2。資料 A-1（本文の Markdown に表と mermaid の図を 1 つずつ持つ）
      - name: ワークスペースの既定
        description: '`config.yaml` の見た目の既定を `starlight` にし、表示する種類の既定から用語集を外す'
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの中のパス
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース
        participant CDN as jsDelivr
        participant P as 配る書き出し（通信を止めたブラウザ）

        U->>CC: 記録を人に渡したい
        CC->>SV: 配る書き出し
        SV->>WS: 全ての YAML と docs/ を読む
        SV->>CDN: 描画のライブラリとライセンスの本文を取る
        SV->>SV: データ・画面・描画のライブラリを 1 枚の HTML にまとめる
        SV-->>CC: 書き出したファイルのパス
        CC-->>U: 絶対パスを示す
        U->>P: 書き出したファイルを開く
        P-->>U: 概要
        U->>P: 検討事項のタブを開き、表示形式をマップに切り替える
        P-->>U: D-1・D-2 のマップ
        U->>P: A-1 の詳細パネルを開く
        P-->>U: 表と図を描いた本文
        U->>P: ネットワークを開く
        P-->>U: 3D のネットワーク
      ```
    expected:
      - 配る書き出しのツールが成功を返し、出力に書き出す先のファイルの絶対パスがある
      - 書き出した HTML の `script`・`link`・`img` の `src`・`href` に、外のファイルや URL を指すものが無い
      - 開いてから操作を終えるまでに、ブラウザが外へ出した要求が 0 件
      - どの画面にも、読めなかったライブラリの知らせが出ない
      - 検討事項のマップに D-1 と D-2 が描かれる
      - A-1 の詳細パネルの本文に、表が `table` 要素で、mermaid の図が SVG で描かれる
      - ネットワークに玉が描かれる
      - トップバーに用語集のタブが無く、ネットワークに渡る見た目が `starlight` である
      - トップバーの表示の設定でパネルが開き、「ワークスペースの既定にする」が無い
      - 画面に、項目の追加・編集・削除、回答・コメントの送信、設定の保存のボタンが無い
      - 書き出した HTML の中に、marked・DOMPurify・elkjs・mermaid・jsdiff のそれぞれの名前・版・著作権の表示・ライセンスの名前がある
      - 書き出した HTML の中に、elkjs のソースコードの入手先（リポジトリと版のタグの URL）がある
    test: test_normal
  - name: 異常シナリオ（YAML がスキーマに合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、MCP のクライアントでツールを呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 書き出す先
        description: ワークスペースの外の一時フォルダの中に、一度配る書き出しを書き出したファイル
      - name: 手で崩した YAML
        description: '`decisions.yaml` の検討事項の状態を、決めた状態の名前に無い値へ直接書き換える'
        notes: 状態 `完了`
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 配る書き出し
        SV->>WS: 全ての YAML を読む
        SV->>SV: スキーマと突き合わせて合わない
        SV-->>CC: 合わないファイルと箇所を示すエラー
      ```
    expected:
      - 配る書き出しのツールがエラーを返す
      - エラーの本文に、合わないファイル `decisions.yaml` とキー `status` がある
      - 書き出す先のファイルの中身が、呼ぶ前と同じである
    test: test_error_when_schema_mismatch
lead: 利用者が、記録を見るだけの 1 枚の HTML（配る書き出し）に書き出してもらい、ネットにつながらない端末のブラウザで開いて読む単一ユースケース。
issue: 19
test_file: tests/e2e/単一ユースケース/test_preview_export.py
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: ワークスペースもサーバーも持たない人へ、ファイルを 1 つ渡すだけで記録を見せられる
  - name: 受け取る人
    interest: ネットにつながらなくても開いて読め、記録を書き換える操作に触れない
trigger: 利用者が記録を人に渡したいと言う
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 書き出す先に、記録のデータ・画面・描画のライブラリを全て中に持つ 1 枚の HTML があり、ネットにつながらないブラウザで開いて記録を読める。
minimal_guarantee: YAML がスキーマに合わないときは、書き出す先のファイルを書き換えない。
frequency: 記録を人に渡すときに数回
priority: 中
notes:
  E2E の範囲: タブ・表示形式の切り替え・絞り込み・検索・ライトとダークは、サーバーが配るプレビューと同じ画面の JavaScript を差し込むため、それぞれの単一ユースケースの E2E が確かめる。このユースケースは、描画のライブラリを使う画面（本文・図・マップ・ネットワーク）が通信なしで描けることを確かめる
  検討事項の案: セットアップの検討事項は、単一ユースケース『記録の追加と更新』の補足「検討事項の案」の形で作る

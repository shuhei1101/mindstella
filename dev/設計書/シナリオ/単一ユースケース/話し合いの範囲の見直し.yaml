id: SC-489-38
title: "話し合いの範囲の見直し"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `add`（たたき台の資料）・スレッドを立てる・スレッドを読む・設定の更新・`add`（納品物の資料・会話ログ）・スレッドへの返信を、決めた引数で順に再生する。利用者の回答は、サーバーの配信の `POST /api/comments` と `POST /api/comments/send` で再生する
      - name: 作成済みのワークスペース
        description: プレイブック `壁打ち`、フェーズ 問い → 発散 → 整理 → 絞り込み → 結論、対象 `話題`、カテゴリー `論点`・`アイデア`（どちらも話題）、ゴール無しで作り、検討事項 D-1（問い・論点）・D-2（発散・アイデア）を持つ
      - name: 利用者の返答
        description: 話が作るシステムの要件へ広がり、たたき台の資料 A-1 を向けたスレッドへ、示したたたき台（プレイブックにシステム開発を足す・フェーズの並びと対応・対象とカテゴリーとその対応・題名・最上位の軸の呼び名・ゴール）を確定する
        notes: 新しい並びは 目的 → 発散 → 要件 → 構成 → インターフェース → コンテンツ。対応は 問い → 目的、整理・絞り込み・結論 → 要件。対象は `話題` → `本体`、カテゴリーは `論点`（本体）だけにして `アイデア` → `論点`。最上位の軸の呼び名は `機能`、ゴールはシステム開発の要件まで（納品物 `要件定義書`）
      - name: 再生する書き込み
        description: '設定を書き換えた後に、概要・背景・構成を先に置いた本文を `body_markdown` で渡した納品物の資料 A-2（タイトル `要件定義書`、`deliverable: true`、`status: 下書き`）を足し、設定の更新で納品物の `doc` から A-2 を指す。たたき台の資料 A-1 は設定を書き換える前に `deliverable: false` で足す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言（作るシステムの要件まで決めたい）
        CC->>CC: 足すプレイブックの進め方ガイドを読み、題名・プレイブック・フェーズの並び・対象とカテゴリー・最上位の軸の呼び名・ゴールのたたき台を作る
        CC->>SV: add（たたき台と、古いフェーズ・対象・カテゴリーから新しいものへの対応の表を本文にした資料 A-1）
        CC->>SV: スレッドを立てる（A-1 を向け、確認を求める）
        U->>SV: スレッドへ確定を送る
        CC->>SV: スレッドを読む（未読だけ）
        CC->>SV: 設定の更新（たたき台の設定と、フェーズ・対象・カテゴリーの対応）
        SV->>WS: config.yaml と、項目の phase・target・category を書く
        CC->>SV: add（資料 A-2、deliverable: true、本文は概要・背景・構成を先に置いた body_markdown）
        SV->>WS: docs.yaml と docs/ の本文を書く
        CC->>SV: 設定の更新（納品物の doc から A-2 を指す）
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドへ返信する（書き換えた設定と、付け替えた項目と、作った納品物の資料の ID）
      ```
    expected:
      - '`config.yaml` の `playbooks` が `壁打ち`・`システム開発` の 2 件で、`summary`・`target_label`・`phases`・`targets`・`categories` が確定したたたき台の値である'
      - '`goal` が確定したたたき台の値で、納品物 `要件定義書` の `doc` が A-2 である'
      - '資料 A-2 が `deliverable: true` を持ち、`.mindstella/docs/` の本文が概要・背景・構成の見出しを持つ'
      - D-1 の `phase` が `目的`、D-2 の `phase` が `発散` である
      - D-1・D-2 の `target` が `本体`、`category` が `論点` である
      - 付け替えた D-1・D-2 の `updated_by` が `ai` である
      - 会話ログが 1 件足されている
      - '`check` が問題を 0 件で返す'
      - 'たたき台の資料 A-1 が `deliverable: false` であり、A-1 を向けた AI のスレッドに、確認・利用者の確定・書き換えた内容を示す AI の返信が書いた順に並ぶ'
    test: test_normal
  - name: 正常シナリオ（題名と最上位の軸の呼び名だけを直す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねるスレッドを立てる・スレッドを読む・設定の更新・`add`（会話ログ）・スレッドへの返信を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: プレイブック `システム開発`、最上位の軸の呼び名 `システム` で作ったワークスペース
      - name: 利用者の返答
        description: 話の中身が 1 つのシステムの機能の話になり、示したたたき台（最上位の軸の呼び名を `機能` に、題名を今の話に合わせる）を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        CC->>CC: 話の中身と最上位の軸の呼び名が合わないと気付く
        CC->>SV: スレッドを立てる（題名と最上位の軸の呼び名のたたき台を示して確認を求める）
        U->>SV: スレッドへ確定を送る
        CC->>SV: スレッドを読む（未読だけ）
        CC->>SV: 設定の更新（summary・target_label）
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドへ返信する（書き換えた設定）
      ```
    expected:
      - '`config.yaml` の `summary` と `target_label` が確定した値で、`playbooks`・`phases`・`goal` が呼ぶ前と同じである'
      - どの項目の `phase` も呼ぶ前と同じである
lead: '`session` が、話し合いの範囲が広がった・利用者が題名やゴールやプレイブックを変えたいと言った・話の中身と最上位の軸の呼び名が合わなくなったときに、題名・話し合いの概要・プレイブック・フェーズ・最上位の軸の呼び名・ゴール・対象・カテゴリーの書き換えのたたき台と、古いフェーズ・対象・カテゴリーから新しいものへの対応を示して確かめ、設定を書き換える単一ユースケース。'
issue: 44
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 話しながら範囲が広がっても、新しいワークスペースを作り直さずに同じ記録のまま続けられる。確かめていない書き換えで、項目のフェーズが勝手に変わらない
trigger: '`session` で話し合っている間に、範囲が広がる、利用者が題名・ゴール・プレイブック・最上位の軸の呼び名を変えたいと言う、話の中身と最上位の軸の呼び名が合わなくなる、またはゴール判定でゴールが無いと分かって利用者がゴールを決めると言う'
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 利用者が確かめた書き換えだけが設定に入る。フェーズを付け替えたときは、全ての項目の `phase` が新しい `phases` のどれかになり、会話ログに書き換えの内容が残る。
minimal_guarantee: 利用者が確定しないうちは、設定も項目も書き換えない。
frequency: 話し合いの中で 0〜数回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねる書き込みを再生してワークスペースの状態を確かめる。いつ範囲を見直すか・たたき台の中身はモデルの判断で、確かめない。題名と最上位の軸の呼び名だけを直すシナリオは、『設定の更新』の『正常シナリオ』が確かめるため E2E を持たない
  フェーズの並び: 複数のプレイブックを並べるときも、フェーズはワークスペースの設定が 1 本の並びで持つ。AI が並べた各ガイドのフェーズから並びのたたき台を作り、利用者の確認を取る
test_file: tests/e2e/単一ユースケース/test_scope_review.py

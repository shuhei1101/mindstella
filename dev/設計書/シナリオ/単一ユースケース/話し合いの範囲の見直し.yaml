title: "話し合いの範囲の見直し"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる設定の更新・`add`（納品物の資料・会話ログ）を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: プレイブック `壁打ち`、フェーズ 問い → 発散 → 整理 → 絞り込み → 結論、ゴール無しで作り、検討事項 D-1（問い）・D-2（発散）を持つ
      - name: 利用者の返答
        description: 話が作るシステムの要件へ広がり、示したたたき台（プレイブックにシステム開発を足す・フェーズの並びと対応・題名・最上位の軸の呼び名・ゴール）を確定する
        notes: 新しい並びは 目的 → 発散 → 要件 → 構成 → インターフェース → コンテンツ。対応は 問い → 目的、整理・絞り込み・結論 → 要件。最上位の軸の呼び名は `機能`、ゴールはシステム開発の要件まで（納品物 `要件定義書`）
      - name: 再生する書き込み
        description: '設定を書き換えた後に、概要・背景・構成を先に置いた納品物の資料 A-1（タイトル `要件定義書`、`deliverable: true`）を足し、設定の更新で納品物の `doc` から A-1 を指す'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: 発言（作るシステムの要件まで決めたい）
        CC->>CC: 足すプレイブックの進め方ガイドを読み、題名・プレイブック・フェーズの並び・最上位の軸の呼び名・ゴールのたたき台を作る
        CC-->>U: たたき台と、古いフェーズから新しいフェーズへの対応の表を示して確認を取る
        U->>CC: 確定する
        CC->>SV: 設定の更新（たたき台の設定と、フェーズの対応）
        SV->>WS: mindmap.yaml と、項目の phase を書く
        CC->>WS: docs/ に概要・背景・構成を先に置いた納品物の本文を書く
        CC->>SV: add（資料 A-1、deliverable: true）
        CC->>SV: 設定の更新（納品物の doc から A-1 を指す）
        CC->>SV: add（会話ログ）
        CC-->>U: 書き換えた設定と、フェーズを付け替えた項目と、作った納品物の資料を示す
      ```
    expected:
      - '`mindmap.yaml` の `playbooks` が `壁打ち`・`システム開発` の 2 件で、`summary`・`target_label`・`phases` が確定したたたき台の値である'
      - '`goal` が確定したたたき台の値で、納品物 `要件定義書` の `doc` が A-1 である'
      - '資料 A-1 が `deliverable: true` を持ち、`docs/` の本文が概要・背景・構成の見出しを持つ'
      - D-1 の `phase` が `目的`、D-2 の `phase` が `発散` である
      - 会話ログが 1 件足されている
      - '`check` が問題を 0 件で返す'
    test: test_normal
  - name: 正常シナリオ（題名と最上位の軸の呼び名だけを直す）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる設定の更新・`add`（会話ログ）を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: プレイブック `システム開発`、最上位の軸の呼び名 `システム` で作ったワークスペース
      - name: 利用者の返答
        description: 話の中身が 1 つのシステムの機能の話になり、示したたたき台（最上位の軸の呼び名を `機能` に、題名を今の話に合わせる）を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        CC->>CC: 話の中身と最上位の軸の呼び名が合わないと気付く
        CC-->>U: 題名と最上位の軸の呼び名のたたき台を示して確認を取る
        U->>CC: 確定する
        CC->>SV: 設定の更新（summary・target_label）
        CC->>SV: add（会話ログ）
        CC-->>U: 書き換えた設定を示す
      ```
    expected:
      - '`mindmap.yaml` の `summary` と `target_label` が確定した値で、`playbooks`・`phases`・`goal` が呼ぶ前と同じである'
      - どの項目の `phase` も呼ぶ前と同じである
lead: '`session` が、話し合いの範囲が広がった・利用者が題名やゴールやプレイブックを変えたいと言った・話の中身と最上位の軸の呼び名が合わなくなったときに、題名・話し合いの概要・プレイブック・フェーズ・最上位の軸の呼び名・ゴールの書き換えのたたき台と、古いフェーズから新しいフェーズへの対応を示して確かめ、設定を書き換える単一ユースケース。'
issue: 44
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 話しながら範囲が広がっても、新しいワークスペースを作り直さずに同じ記録のまま続けられる。確かめていない書き換えで、項目のフェーズが勝手に変わらない
trigger: '`session` で話し合っている間に、範囲が広がる、利用者が題名・ゴール・プレイブック・最上位の軸の呼び名を変えたいと言う、話の中身と最上位の軸の呼び名が合わなくなる、またはゴール判定でゴールが無いと分かって利用者がゴールを決めると言う'
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 利用者が確かめた書き換えだけが設定に入る。フェーズを付け替えたときは、全ての項目の `phase` が新しい `phases` のどれかになり、会話ログに書き換えの内容が残る。
minimal_guarantee: 利用者が確定しないうちは、設定も項目も書き換えない。
frequency: 話し合いの中で 0〜数回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねる書き込みを再生してワークスペースの状態を確かめる。いつ範囲を見直すか・たたき台の中身はモデルの判断で、確かめない。題名と最上位の軸の呼び名だけを直すシナリオは、『設定の更新』の『正常シナリオ』が確かめるため E2E を持たない
  フェーズの並び: 複数のプレイブックを並べるときも、フェーズはワークスペースの設定が 1 本の並びで持つ。AI が並べた各ガイドのフェーズから並びのたたき台を作り、利用者の確認を取る
test_file: tests/e2e/単一ユースケース/test_scope_review.py

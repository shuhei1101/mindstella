title: "話し合いのセットアップ"
scenarios:
  - name: 正常シナリオ（新しいワークスペース）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `init` を、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 空のワークスペースのフォルダ
        description: まだ `config.yaml` も `mindmap.yaml` も持たないフォルダ
        notes: 引数に渡す
      - name: 選んだプレイブック
        description: 利用者がプレイブックをシステム開発だけと答え、進め方ガイドの既定のゴール（インターフェースまで）を選ぶ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:setup {フォルダ}
        CC->>WS: config.yaml か mindmap.yaml の有無を見る
        CC->>CC: 選んだ進め方ガイドから題名・プレイブック・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールのたたき台を作る
        CC-->>U: たたき台を示して確認を取る
        U->>CC: 確定する
        CC->>SV: init（決めた設定）
        SV->>WS: config.yaml と空の YAML を作る
        CC-->>U: /mindstella:session で話し合いを続けるよう案内する
      ```
    expected:
      - '`config.yaml` のプレイブックが `[システム開発]`、最上位の軸の呼び名が機能、フェーズが 目的 → 要件 → 構成 → インターフェース → コンテンツ、ゴールがインターフェースまでになっている'
      - '`config.yaml` が、確定した話し合いの概要を持つ'
      - 検討事項・タスク・調査・資料・用語集・メモ・会話ログの YAML が空で作られている
    notes:
      E2E: 既存の『ワークスペースの作成』の『正常シナリオ』が確かめる
  - name: 正常シナリオ（既存のワークスペース）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較・`status` を、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 途中まで進んだワークスペース
        description: 要見直しの検討事項 D-1・進行中のタスク T-1・保留で依存先が決定済みの検討事項 D-2・前提が揃った未決定 D-3 を持ち、版のファイルにプラグインと同じ版を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:setup {フォルダ}
        CC->>WS: config.yaml か mindmap.yaml の有無を見る
        CC->>SV: 版を比べる
        SV-->>CC: ワークスペースの版とプラグインの版が同じ
        CC->>SV: status
        SV->>WS: 全ての YAML を読む
        SV-->>CC: 要見直し・進行中・再開可能・次の候補
        CC-->>U: 状況と続きの推奨を示し、/mindstella:session で続けるよう案内する
      ```
    expected:
      - '`status` の出力の要見直しに D-1、進行中に T-1、再開可能に D-2、次の候補に D-3 がある'
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    notes:
      E2E: 既存の『状況の確認』の『正常シナリオ（再開時の状況）』が確かめる
  - name: 正常シナリオ（フォルダの指定なし）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順はツールを呼ばない
      - name: 引数
        description: 何も渡さない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）

        U->>CC: /mindstella:setup
        CC-->>U: ワークスペースのフォルダの指定を求める
      ```
    expected:
      - '`init` が呼ばれず、どのフォルダにも `config.yaml` が作られていない'
    notes:
      E2E: 持たない。フォルダの指定を求めるのはモデルの応答で、ツールの呼び出しの再生では作られない
  - name: 異常シナリオ（MCP のツールが使えない）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順はツールを呼ばない
      - name: 起動スクリプトを通さずに立ち上げた Claude Code
        description: mindstella の MCP のツールを持たない
      - name: 空のワークスペースのフォルダ
        description: まだ `config.yaml` も `mindmap.yaml` も持たないフォルダ
        notes: 引数に渡す
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）

        U->>CC: /mindstella:setup {フォルダ}
        CC->>CC: mindstella の MCP のツールが無い
        CC-->>U: 起動スクリプトで立ち上げ直すよう案内して止まる
      ```
    expected:
      - ワークスペースのフォルダに何も書かれていない
    notes:
      E2E: 持たない。ツールが無いと気付いて案内するのはモデルの応答で、スキルの手順にその分岐があることは結合テストが確かめる
  - name: 正常シナリオ（版が古いワークスペース）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較を、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版を記録する前の形式のワークスペース
        description: '版のファイルと `config.yaml` を持たず `mindmap.yaml` だけを持ち、資料 A-1 が `done: true` のワークスペース'
        notes: YAML を直接書いて作る
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:setup {フォルダ}
        CC->>WS: config.yaml か mindmap.yaml の有無を見る
        CC->>SV: 版を比べる
        SV->>WS: 版のファイルを読む（無い）
        SV-->>CC: ワークスペースの版が古い・当てる手順
        CC-->>U: 版が古いことを示し、/mindstella:upgrade で移し替えるよう案内して止まる
      ```
    expected:
      - 版の比較が、ワークスペースの版を「版を記録する前の形式」、プラグインより古いと返す
      - '`status` が呼ばれない'
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_older_version
  - name: 異常シナリオ（版が新しいワークスペース）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる版の比較を、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版が新しいワークスペース
        description: 版のファイルにプラグインより新しい版を持つワークスペース
        notes: 版のファイルに `v99.0.0` を書く
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:setup {フォルダ}
        CC->>WS: config.yaml か mindmap.yaml の有無を見る
        CC->>SV: 版を比べる
        SV->>WS: 版のファイルを読む
        SV-->>CC: ワークスペースの版が新しい
        CC-->>U: プラグインを更新するよう案内して止まる
      ```
    expected:
      - 版の比較が、ワークスペースの版がプラグインより新しいと返す
      - '`status` が呼ばれない'
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_error_when_newer_version
  - name: 正常シナリオ（プレイブックを複数選び、ゴールを決めずに始める）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `init` を、決めた引数で再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 空のワークスペースのフォルダ
        description: まだ `config.yaml` も `mindmap.yaml` も持たないフォルダ
        notes: 引数に渡す
      - name: 選んだプレイブック
        description: 利用者が壁打ちと調査を選び、ゴールの候補から「決めずに始める」を選ぶ
        notes: フェーズは、AI が 2 つのガイドのフェーズから作った並びのたたき台を利用者が確定したもの
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（setup）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:setup {フォルダ}
        CC->>CC: 選んだ 2 つの進め方ガイドを読み、題名・フェーズの並び・カテゴリーのたたき台を作る
        CC-->>U: たたき台とゴールの候補（決めずに始めるを含む）を示して確認を取る
        U->>CC: ゴールを決めずに確定する
        CC->>SV: init（ゴールを持たない設定）
        SV->>WS: config.yaml と空の YAML を作る
        CC-->>U: /mindstella:session で話し合いを続けるよう案内する
      ```
    expected:
      - '`config.yaml` の `playbooks` が `壁打ち`・`調査` の 2 件で、`goal` のキーを持たない'
      - 検討事項・タスク・調査・資料・用語集・メモ・会話ログの YAML が空で作られている
    notes:
      E2E: 既存の『ワークスペースの作成』の『正常シナリオ（ゴールを決めずに作る）』が確かめる
lead: 利用者が起動スクリプトで立ち上げた Claude Code でセットアップのスキル `setup` を呼び、新しいワークスペースを作るか、既存のワークスペースの状況を読んで続きを選ぶ単一ユースケース。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 新しい話し合いは分野に合った軸で始まり、既存の話し合いは前回の続きから迷わず再開できる。起動スクリプトで立ち上げていないときは、何をすればよいかが分かる
trigger: 利用者が `/mindstella:setup` を呼ぶ（引数にワークスペースのフォルダを渡すか、何も渡さない）
preconditions:
  - プラグイン mindstella がインストールされている
success_guarantee: 新しいワークスペースは、選んだ進め方ガイドに沿った題名・プレイブック・最上位の軸の呼び名・フェーズ・カテゴリーと、決めたときはゴールを持つ `config.yaml` を持つ。既存のワークスペースは、どのファイルも書き換えずに状況と続きの推奨が示される。どちらも最後に `/mindstella:session` で話し合いを続けるよう案内する。版がプラグインより古いワークスペースは `/mindstella:upgrade` を、新しいワークスペースはプラグインの更新を案内する。
minimal_guarantee: mindstella の MCP のツールが使えないとき（起動スクリプトで立ち上げていない）、ワークスペースのフォルダが決まらないとき、ワークスペースの版がプラグインと違うときは、ワークスペースに何も書かずに止まる。
frequency: 話し合いを始めるとき・再開するときに 1 回
priority: 高
notes:
  E2E の範囲: E2E を持つのは版の 2 シナリオだけで、版の比較の結果とワークスペースを書き換えないことを確かめる。そのほかのシナリオは、各シナリオの補足の既存のシナリオがツールの振る舞いを確かめる。たたき台の中身・状況の示し方・続きの推奨・`/mindstella:session` の案内はモデルの応答で、確かめない
test_file: tests/e2e/単一ユースケース/test_discussion_setup.py

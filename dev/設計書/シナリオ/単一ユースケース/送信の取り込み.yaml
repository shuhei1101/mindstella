title: "送信の取り込み"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる返信待ちのスレッドの一覧・スレッドを読む・`adopt`・`add`（会話ログ）・スレッドへの返信と要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指す利用者の「案 A にする」だけを持つオープンのスレッドを持つ
        notes: 利用者の書き込みは AI の未読
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 返信待ちのスレッドの一覧
        SV->>WS: スレッドを読む
        SV-->>CC: D-1 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV->>WS: 返した書き込みを既読にする
        SV-->>CC: D-1 への「案 A にする」
        CC-->>U: 届いていたコメントを示す
        CC->>SV: adopt D-1 A
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドへ返信する（D-1 の ID を含む）・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに書き込みの本文がある
      - スレッドの最後の書き込みが D-1 の ID を含む AI の返信で、スレッドが要約を持つ
      - 利用者の書き込みが AI の既読である
      - 返信待ちのスレッドの一覧が 0 件を返す
    test: test_normal
  - name: 正常シナリオ（返信待ちが無い）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる返信待ちのスレッドの一覧を再生する
      - name: 作成済みのワークスペース
        description: クローズのスレッド 1 件と、利用者の書き込みと AI の返信を持つオープンのスレッド 1 件を持つ
        notes: どの書き込みも AI の未読（Claude Code のセッションを開き直して未読へ戻った形）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 返信待ちのスレッドの一覧
        SV-->>CC: 0 件
        CC->>CC: 取り込みを飛ばして話し合いを続ける
      ```
    expected:
      - 返信待ちのスレッドの一覧が 0 件を返す
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_nothing_awaiting
  - name: 正常シナリオ（箇所と項目に紐づかない送信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる返信待ちのスレッドの一覧・スレッドを読む・`add`（会話ログ）・スレッドへの返信と要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 本文を持つ資料 A-1 と、利用者の書き込みだけを持つオープンのスレッド 2 件を持つ
        notes: 1 件目の書き込みは A-1 を指し、箇所が本文の 2 行目と選んだ文「言い換えたい文」で、本文が「ここは言い換える」。2 件目の書き込みは項目を指さず、本文が「全体に目を通した」
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 返信待ちのスレッドの一覧
        SV-->>CC: 2 件
        CC->>SV: 1 件目のスレッドを読む（未読だけ）
        SV-->>CC: A-1 の 2 行目への「ここは言い換える」
        CC->>SV: add（会話ログ。A-1 の箇所と選んだ文を添える）
        CC->>SV: 1 件目へ返信する（受け取った旨）・要約を書き直す
        CC->>SV: 2 件目のスレッドを読む（未読だけ）
        SV-->>CC: 項目を指さない「全体に目を通した」
        CC->>SV: add（会話ログ）
        CC->>SV: 2 件目へ返信する（受け取った旨）・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - スレッドを読むと、A-1 への書き込みの箇所（本文の 2 行目と選んだ文）と、項目を指さない書き込みが返る
      - 会話ログに、A-1 の本文の 2 行目と選んだ文を添えた「ここは言い換える」と、「全体に目を通した」がある
      - 2 件のスレッドとも最後の書き込みが AI の返信で、要約を持つ
      - 返信待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_location_and_no_target
  - name: 正常シナリオ（話し合いの途中に入力された送信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、入力された文字列を受けた後に手順が連ねる返信待ちのスレッドの一覧・スレッドを読む・`adopt`・`add`（会話ログ）・スレッドへの返信と要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 話し合いの途中のワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指す利用者の「案 A にする」だけを持つオープンのスレッドを持つ。準備の取り込みは済んでいる
      - name: 入力された文字列
        description: 単一ユースケース『コメントを選んで送る』でサーバーが会話へ入力した `[mindstella] ユーザーからのコメントが 1 件届きました。読み直してください。`
        notes: 書き込みの中身は入力に含まれず、返信待ちのスレッドの一覧で読む
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SV as サーバー
        participant CC as Claude Code（session）
        participant WS as ワークスペース

        SV->>CC: 「ユーザーからのコメントが 1 件届きました」を入力する
        CC->>SV: 返信待ちのスレッドの一覧
        SV-->>CC: D-1 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: D-1 への「案 A にする」
        CC->>SV: adopt D-1 A
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドへ返信する（D-1 の ID を含む）・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに書き込みの本文がある
      - スレッドの最後の書き込みが D-1 の ID を含む AI の返信である
      - 返信待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_entered_during_session
  - name: 正常シナリオ（スレッドへの返信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる返信待ちのスレッドの一覧・スレッドを読む・`add`（メモと会話ログ）・スレッドへの返信と要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 未決定の検討事項 D-1 と、AI が立てたオープンのスレッド 1 件を持つ
        notes: 書き込みは AI の `D-1 の比べた結果を Issue に起票してよいですか`（既読）と、利用者の `起票してよい`（未読）。取り込みでは起票した旨のメモ N-1 を足し、返信に N-1 の ID を書く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 返信待ちのスレッドの一覧
        SV-->>CC: AI が立てたスレッド（要約つき）
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: 利用者の「起票してよい」
        CC->>SV: add（メモ N-1 と会話ログ）
        CC->>SV: スレッドへ返信する（N-1 の ID を含む）・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - スレッドを読むと、利用者の `起票してよい` の 1 件だけが返る
      - メモ N-1 が足されている
      - スレッドの書き込みが AI の問い・利用者の返信・N-1 の ID を含む AI の返信の順に並び、要約が書き直されている
      - 返信待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_reply_to_ai_thread
lead: '`session` が、話し合いの最初と、話し合いの途中にサーバーが会話へ入力したときに、AI の返信待ちのスレッド（最後の書き込みが利用者のオープンのスレッド）を拾い、未読の書き込みを読んで記録し、そのスレッドへ返信して要約を書き直す単一ユースケース。'
issue: 67
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: プレビューから送ったコメントや返信が記録へ反映され、どのスレッドにも AI の返信が付く。同じ書き込みを 2 度取り込まない
trigger: 利用者が `/mindstella:session` を呼ぶ（準備のステップ）か、話し合いの途中にサーバーがコメント・返信の届いたことを会話へ入力する
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 返信待ちのスレッドが全て AI の返信で終わり、利用者の書き込みが指す項目への記録と会話ログに残る。読んだ書き込みは AI の既読になり、要約が書き直されている。
minimal_guarantee: 取り込みの途中で話し合いを終えても、まだ返信していないスレッドは返信待ちのまま残り、次の取り込みで拾われる。
frequency: 話し合いを始めるたびに 1 回と、話し合いの途中にプレビューからまとめて送るか返信するたびに 1 回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねるツールの呼び出しを再生する。書き込みの本文から何を記録するか・返信に何を書くかというモデルの判断は確かめない
  取り込む対象: 取り込むのは返信待ちのスレッド（最後の書き込みが利用者のオープンのスレッド）だけにする。既読かどうかでは決めないので、Claude Code のセッションを開き直して全ての書き込みが未読に戻っても、AI が返信したスレッドを取り込み直さない
  入力された文字列の読み直し: サーバーが入力するのは `[mindstella]` で始まる件数だけの 1 行で、スレッドの ID も本文も含まない。返信待ちのスレッドの一覧を読み、一覧にあるスレッドだけを記録する
  返信する時点: 書き込みを記録した後に、スレッド 1 件ずつ返信して要約を書き直す。読んだだけでは返信待ちのまま残る。記録するものが無いときも、受け取った旨だけを返信する
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
test_file: tests/e2e/単一ユースケース/test_submission_intake.py

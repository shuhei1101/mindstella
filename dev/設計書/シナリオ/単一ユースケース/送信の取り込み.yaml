title: "送信の取り込み"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる取り込んでいない送信の一覧・`adopt`・`add`（会話ログ）・取り込み済みにするを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指し本文が「案 A にする」の取り込んでいない送信を持つ
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 取り込んでいない送信
        SV->>WS: 送信を読む
        SV-->>CC: D-1 への「案 A にする」
        CC-->>U: 届いていた送信を示す
        CC->>SV: adopt D-1 A
        CC->>SV: add（会話ログ）
        CC->>SV: その送信を取り込み済みにする
        SV->>WS: 書く
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに送信の本文がある
      - その送信が取り込み済みである
      - 取り込んでいない送信の一覧が 0 件を返す
    test: test_normal
  - name: 正常シナリオ（送信が無い）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる取り込んでいない送信の一覧を再生する
      - name: 作成済みのワークスペース
        description: 送信を持たない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 取り込んでいない送信
        SV-->>CC: 0 件
        CC->>CC: 取り込みを飛ばして話し合いを続ける
      ```
    expected:
      - 取り込んでいない送信の一覧が 0 件を返す
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_no_submissions
  - name: 正常シナリオ（箇所と項目に紐づかない送信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる取り込んでいない送信の一覧・`add`（会話ログ）・取り込み済みにするを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 本文を持つ資料 A-1 と、取り込んでいない送信 2 件を持つ
        notes: 1 件目は A-1 を指し、箇所が本文の 2 行目と選んだ文「言い換えたい文」で、本文が「ここは言い換える」。2 件目は項目を指さず、本文が「全体に目を通した」
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 取り込んでいない送信
        SV->>WS: 送信を読む
        SV-->>CC: A-1 の 2 行目への「ここは言い換える」と、項目を指さない「全体に目を通した」
        CC-->>U: 箇所と、項目を指さないことを添えて届いていた送信を示す
        CC->>SV: add（会話ログ。A-1 の箇所と選んだ文を添える）
        CC->>SV: 1 件目を取り込み済みにする
        CC->>SV: add（会話ログ）
        CC->>SV: 2 件目を取り込み済みにする
        SV->>WS: 書く
      ```
    expected:
      - 取り込んでいない送信の一覧が、A-1 への送信の箇所（本文の 2 行目と選んだ文）と、項目を指さない送信を返す
      - 会話ログに、A-1 の本文の 2 行目と選んだ文を添えた「ここは言い換える」と、「全体に目を通した」がある
      - 2 件とも取り込み済みで、取り込んでいない送信の一覧が 0 件を返す
    test: test_normal_when_location_and_no_target
  - name: 正常シナリオ（話し合いの途中に入力された送信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、入力された文字列を受けた後に手順が連ねる取り込んでいない送信の一覧・`adopt`・`add`（会話ログ）・取り込み済みにするを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 話し合いの途中のワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指し本文が「案 A にする」の取り込んでいない送信 S-1 を持つ。準備の取り込みは済んでいる
      - name: 入力された文字列
        description: 単一ユースケース『コメントを選んで送る』でサーバーが会話へ入力した `[mindstella] ユーザーからのコメントが 1 件届きました。読み直してください。`
        notes: 送信の中身は入力に含まれず、取り込んでいない送信の一覧で読む
    flow: |-
      sequenceDiagram
        participant SV as サーバー
        participant CC as Claude Code（session）
        participant WS as ワークスペース

        SV->>CC: 「ユーザーからのコメントが 1 件届きました」を入力する
        CC->>SV: 取り込んでいない送信
        SV->>WS: 送信を読む
        SV-->>CC: S-1（D-1 への「案 A にする」）
        CC->>SV: adopt D-1 A
        CC->>SV: add（会話ログ）
        CC->>SV: S-1 を取り込み済みにする
        SV->>WS: 書く
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに S-1 の本文がある
      - S-1 が取り込み済みである
      - 取り込んでいない送信の一覧が 0 件を返す
    test: test_normal_when_entered_during_session
lead: '`session` が、話し合いの最初と、話し合いの途中にサーバーが送信を会話へ入力したときに、プレビューから送られた取り込んでいない送信を拾い、1 件ずつ記録してから取り込み済みにする単一ユースケース。'
issue: 67
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: プレビューから送った答えや意見が、話し合いを始めるときに記録へ反映される。同じ送信を 2 度取り込まない
trigger: 利用者が `/mindstella:session` を呼ぶ（準備のステップ）か、話し合いの途中にサーバーが送信を会話へ入力する
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 取り込んでいない送信が全て取り込み済みになり、それぞれの本文が指す項目への記録と会話ログに残る。
minimal_guarantee: 取り込みの途中で話し合いを終えても、まだ記録していない送信は取り込んでいないまま残り、次の取り込みで拾われる。
frequency: 話し合いを始めるたびに 1 回と、話し合いの途中にプレビューからまとめて送るたびに 1 回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねるツールの呼び出しを再生する。送信の本文から何を記録するかというモデルの判断は確かめない
  取り込み済みにする時点: 送信を記録した後に 1 件ずつ取り込み済みにする。一覧を読んだだけでは取り込み済みにしない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
  入力された送信の読み直し: サーバーが入力するのは `[mindstella]` で始まる件数だけの 1 行で、送信の ID も本文も含まない。取り込んでいない送信の一覧を読み、一覧にある送信だけを記録する。既に取り込み済みの送信は一覧に出ないので記録し直さない
test_file: tests/e2e/単一ユースケース/test_submission_intake.py

title: "送信の取り込み"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`adopt`・`add`（会話ログ）・スレッドへの返信と取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指す利用者の「案 A にする」だけを持つオープンのスレッドを持つ
        notes: 利用者の書き込みは AI の未読で、取り込んでいない
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 取り込み待ちのスレッドの一覧
        SV->>WS: スレッドを読む
        SV-->>CC: D-1 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV->>WS: 返した書き込みを既読にする
        SV-->>CC: D-1 への「案 A にする」
        CC-->>U: 届いていたコメントを示す
        CC->>SV: adopt D-1 A
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドへ返信する（D-1 の ID を含む）・取り込み済みにする・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに書き込みの本文がある
      - スレッドの最後の書き込みが D-1 の ID を含む AI の返信で、スレッドが要約を持ち、オープンのままである
      - 利用者の書き込みが AI の既読で、取り込み済みである
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal
  - name: 正常シナリオ（取り込み待ちが無い）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる取り込み待ちのスレッドの一覧を再生する
      - name: 作成済みのワークスペース
        description: クローズのスレッド 1 件と、利用者の書き込みと AI の返信を持つオープンのスレッド 1 件と、利用者の書き込みだけを持つ AI がクローズにしたスレッド 1 件を持つ
        notes: 利用者の書き込みはどれも取り込み済みで、どの書き込みも AI の未読（Claude Code のセッションを開き直して未読へ戻った形）
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: 0 件
        CC->>CC: 取り込みを飛ばして話し合いを続ける
      ```
    expected:
      - 取り込み待ちのスレッドの一覧が 0 件を返す
      - ワークスペースの全てのファイルの中身が、呼ぶ前と同じである
    test: test_normal_when_nothing_awaiting
  - name: 正常シナリオ（箇所と項目に紐づかない送信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、準備が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`add`（会話ログ）・スレッドへの返信・クローズ・取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 本文を持つ資料 A-1 と、利用者の書き込みだけを持つオープンのスレッド 2 件を持つ
        notes: 1 件目の書き込みは A-1 を指し、箇所が本文の 2 行目と選んだ文「言い換えたい文」で、本文が「ここは言い換える」。2 件目の書き込みは項目を指さず、本文が「全体に目を通した」。再生では、1 件目へ返信し、2 件目は返信せずに理由「受け取った」でクローズにする
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>CC: /mindstella:session {フォルダ}
        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: 2 件
        CC->>SV: 1 件目のスレッドを読む（未読だけ）
        SV-->>CC: A-1 の 2 行目への「ここは言い換える」
        CC->>SV: add（会話ログ。A-1 の箇所と選んだ文を添える）
        CC->>SV: 1 件目へ返信する・取り込み済みにする・要約を書き直す
        CC->>SV: 2 件目のスレッドを読む（未読だけ）
        SV-->>CC: 項目を指さない「全体に目を通した」
        CC->>SV: add（会話ログ）
        CC->>SV: 2 件目をクローズにする（理由つき）・取り込み済みにする・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - スレッドを読むと、A-1 への書き込みの箇所（本文の 2 行目と選んだ文）と、項目を指さない書き込みが返る
      - 会話ログに、A-1 の本文の 2 行目と選んだ文を添えた「ここは言い換える」と、「全体に目を通した」がある
      - 1 件目のスレッドは最後の書き込みが AI の返信で、オープンのままである
      - 2 件目のスレッドは AI の書き込みが無く、状態がクローズで、クローズにした書き手が AI・理由が `受け取った` である
      - 2 件のスレッドとも要約を持ち、利用者の書き込みが取り込み済みである
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_location_and_no_target
  - name: 正常シナリオ（話し合いの途中に入力された送信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、入力された文字列を受けた後に手順が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`adopt`・`add`（会話ログ）・スレッドへの返信と取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 話し合いの途中のワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指す利用者の「案 A にする」だけを持つオープンのスレッドを持つ。準備の取り込みは済んでいる
      - name: 入力された文字列
        description: 単一ユースケース『コメントを選んで送る』でサーバーが会話へ入力した `[mindstella] ユーザーからのコメントが 1 件届きました。読み直してください。`
        notes: 書き込みの中身は入力に含まれず、取り込み待ちのスレッドの一覧で読む
    flow: |-
      ```mermaid
      sequenceDiagram
        participant SV as サーバー
        participant CC as Claude Code（session）
        participant WS as ワークスペース

        SV->>CC: 「ユーザーからのコメントが 1 件届きました」を入力する
        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: D-1 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: D-1 への「案 A にする」
        CC->>SV: adopt D-1 A
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドへ返信する（D-1 の ID を含む）・取り込み済みにする・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに書き込みの本文がある
      - スレッドの最後の書き込みが D-1 の ID を含む AI の返信である
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_entered_during_session
  - name: 正常シナリオ（スレッドへの返信）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`add`（メモと会話ログ）・スレッドへの返信と取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 未決定の検討事項 D-1 と、AI が立てたオープンのスレッド 1 件を持つ
        notes: 書き込みは AI の `D-1 の比べた結果を Issue に起票してよいですか`（既読）と、利用者の `起票してよい`（未読で、取り込んでいない）。取り込みでは起票した旨のメモ N-1 を足し、返信に N-1 の ID を書く
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: AI が立てたスレッド（要約つき）
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: 利用者の「起票してよい」
        CC->>SV: add（メモ N-1 と会話ログ）
        CC->>SV: スレッドへ返信する（N-1 の ID を含む）・取り込み済みにする・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - スレッドを読むと、利用者の `起票してよい` の 1 件だけが返る
      - メモ N-1 が足されている
      - スレッドの書き込みが AI の問い・利用者の返信・N-1 の ID を含む AI の返信の順に並び、要約が書き直されている
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_reply_to_ai_thread
  - name: 正常シナリオ（返事の要らない返信をクローズにする）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`add`（会話ログ）・スレッドのクローズ・取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A で決定済みの検討事項 D-1 と、D-1 を指すオープンのスレッド 1 件を持つ
        notes: 書き込みは利用者の `案 A にする`（取り込み済み）・AI の `D-1 を案 A で決定にしました`・利用者の `了解`（未読で、取り込んでいない）。再生では、返信せずに理由 `了解を受けた` でクローズにする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: D-1 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: 利用者の「了解」
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドをクローズにする（理由つき）・取り込み済みにする・要約を書き直す
        SV->>WS: 状態をクローズに書き、書き手（AI）・理由・日時を残す
      ```
    expected:
      - スレッドの書き込みが 3 件のままで、AI の返信が足されていない
      - スレッドの状態がクローズで、クローズにした書き手が AI・理由が `了解を受けた` で、日時が残る
      - 利用者の `了解` が取り込み済みである
      - 取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_no_reply_needed
  - name: 正常シナリオ（利用者がクローズにしたスレッドの返信を取り込む）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`adopt`・`add`（会話ログ）・取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、D-1 を指す AI が立てたスレッド 1 件を持つ
        notes: 書き込みは AI の `D-1 は案 B で進めてよいですか`（既読）と、利用者の `それでよい`（未読で、取り込んでいない）。利用者が返信を送った後に、理由を書かずにクローズにしている
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: クローズの D-1 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: 利用者の「それでよい」
        CC->>SV: adopt D-1 B
        CC->>SV: add（会話ログ）
        CC->>SV: 取り込み済みにする・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - 取り込み待ちのスレッドの一覧が、状態を渡さずに呼んでも、クローズのスレッドを返す
      - D-1 の採用する案が B で、決定済みである
      - スレッドはクローズのままで、AI の書き込みが増えていない
      - 利用者の `それでよい` が取り込み済みで、取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_closed_by_user
  - name: 正常シナリオ（クローズのスレッドをオープンに戻して返信する）
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、手順が連ねる取り込み待ちのスレッドの一覧・スレッドを読む・`add`（会話ログ）・オープンへの戻し・スレッドへの返信と取り込み済みにする・要約の書き直しを、決めた引数で順に再生する
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 作成済みのワークスペース
        description: 決定済みの検討事項 D-2 と、D-2 を指す利用者の `版はどこに書く？` だけを持つスレッド 1 件を持つ
        notes: 利用者の書き込みは未読で、取り込んでいない。利用者が送った後にクローズにしている。再生では、理由 `質問に答える` でオープンに戻してから返信する
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: 取り込み待ちのスレッドの一覧
        SV-->>CC: クローズの D-2 へのスレッド
        CC->>SV: スレッドを読む（未読だけ）
        SV-->>CC: 利用者の「版はどこに書く？」
        CC->>SV: add（会話ログ）
        CC->>SV: スレッドをオープンに戻す（理由つき）
        SV->>WS: 状態をオープンに書き、書き手（AI）・理由・日時を残す
        CC->>SV: スレッドへ返信する（D-2 の ID を含む）・取り込み済みにする・要約を書き直す
        SV->>WS: 書く
      ```
    expected:
      - スレッドの状態がオープンで、オープンに戻した書き手が AI・理由が `質問に答える` で、日時が残る
      - スレッドの最後の書き込みが D-2 の ID を含む AI の返信である
      - 利用者の書き込みが取り込み済みで、取り込み待ちのスレッドの一覧が 0 件を返す
    test: test_normal_when_reopen_to_reply
lead: '`session` が、話し合いの最初と、話し合いの途中にサーバーが会話へ入力したときに、取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド。オープンでもクローズでも）を拾い、未読の書き込みを読んで記録し、返信するか返信せずにクローズにするかを決めて取り込み済みにし、要約を書き直す単一ユースケース。'
issue: 67
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: プレビューから送ったコメントや返信が記録へ反映され、返事の要る書き込みには AI の返信が付き、「了解」など返事の要らない書き込みで済んだ話は AI がクローズにする。返信を送ってからクローズにしても、その返信が AI に届く。同じ書き込みを 2 度取り込まない
trigger: 利用者が `/mindstella:session` を呼ぶ（準備のステップ）か、話し合いの途中にサーバーがコメント・返信の届いたことを会話へ入力する
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: 取り込み待ちのスレッドが無くなり、利用者の書き込みが指す項目への記録と会話ログに残る。返事の要る書き込みのスレッドは AI の返信で終わり、返事の要らない書き込みで済んだスレッドは AI がクローズにしている。読んだ書き込みは AI の既読で取り込み済みになり、要約が書き直されている。
minimal_guarantee: 取り込みの途中で話し合いを終えても、まだ取り込み済みにしていない書き込みを持つスレッドは取り込み待ちのまま残り、次の取り込みで拾われる。
frequency: 話し合いを始めるたびに 1 回と、話し合いの途中にプレビューからまとめて送るか返信するたびに 1 回
priority: 高
notes:
  E2E の範囲: モデルを呼ばず、手順が連ねるツールの呼び出しを再生する。書き込みの本文から何を記録するか・返信するかクローズにするか・返信に何を書くかというモデルの判断は確かめない
  取り込む対象: 取り込むのは取り込み待ちのスレッド（AI が取り込んでいない利用者の書き込みを持つスレッド）で、オープンでもクローズでも拾う。利用者が返信を送ってからクローズにしても、その返信を取り込む。既読かどうかでは決めないので、Claude Code のセッションを開き直して全ての書き込みが未読に戻っても、取り込み済みの書き込みを取り込み直さない
  入力された文字列の読み直し: サーバーが入力するのは `[mindstella]` で始まる件数だけの 1 行で、スレッドの ID も本文も含まない。取り込み待ちのスレッドの一覧を読み、一覧にあるスレッドだけを記録する
  返信する時点: 書き込みを記録した後に、スレッド 1 件ずつ、返信するか返信せずにクローズにするかを決めて取り込み済みにし、要約を書き直す。読んだだけでは取り込み待ちのまま残る。返事の要らない書き込み（「了解」など）には返信せず、話が済んでいればクローズにする。質問・依頼には返信し、クローズにしない。クローズのスレッドに返信が要るときは、オープンに戻してから返信する
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
test_file: tests/e2e/単一ユースケース/test_submission_intake.py

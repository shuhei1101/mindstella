title: "タスクをボードで見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 状態が未着手・進行中・保留・完了・中止のタスクを 1 件ずつ（T-1〜T-5）。T-2（進行中）は検討事項 D-3 を進める
        notes: 'T-2 は `for: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクのタブを開く
        P-->>U: 状態ごとの列のボード
        U->>P: T-2 のカードを押す
        P-->>U: T-2 の詳細パネル
        U->>P: 表示形式を表に切り替える
        P-->>U: タスクの表
      ```
    expected:
      - ボードに未着手・進行中・保留・完了・中止の 5 列があり、T-1〜T-5 がそれぞれの状態の列にある
      - T-2 の詳細パネルに、進める検討事項として D-3 がある
      - 表に T-1〜T-5 の 5 行がある
    test: test_normal
  - name: 正常シナリオ（絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 未着手・タグ: 保存）、T-2（種類: 調査・状態: 進行中・タグ: 保存）、T-3（種類: 作業・状態: 完了・タグ: 通知）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクのタブを開き、絞り込みのボタンを押す
        U->>P: ドロワーのタグで「保存」を選ぶ
        P-->>U: 「保存」を持つタスクだけのボード
        U->>P: ドロワーの種類で「調査」を選ぶ
        P-->>U: 両方の条件に合うタスクだけのボード
      ```
    expected:
      - 「保存」を選ぶと、ボードに T-1・T-2 のカードがあり、T-3 が無い
      - 「調査」を足すと、ボードに T-2 のカードだけがある
      - 絞っても未着手・進行中・保留・完了・中止の 5 列が残り、各列の件数が絞った後のカードの数に合う
      - 絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_filtered
  - name: 正常シナリオ（ボードが画面に収まらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未着手のタスク 40 件（T-1〜T-40）と、他の状態のタスクを 1 件ずつ
        notes: 未着手の列が画面の高さに収まらない件数にする
      - name: 配信
        description: 記録を配っているサーバー。表示の幅は 768px
        notes: 5 列が幅に収まらず、横にも送る幅にする
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクのタブを開く
        P-->>U: 帯の下の領域に収めたボード
        U->>P: ボードの上でホイールを回して下へ送る
        P-->>U: ボードの中だけを送る
        U->>P: ボードを右端まで横に送り、T-40 のカードを押す
        P-->>U: T-40 の詳細パネル
      ```
    expected:
      - 開いた直後、ページ全体に縦・横ともスクロールが無い
      - ボードを下へ送った後も、トップバーとタブの帯が画面の上に見えたままで、ページ全体の縦のスクロールの位置は 0 のまま
      - ボードの中を縦と横に送れ、横に送ると中止の列が画面に入る
      - T-40 を押すと、T-40 の詳細パネルが開く
    test: test_normal_when_overflowing
lead: 利用者が、タスクを状態ごとの列のボードで見て、絞り込みのボタンのドロワーで絞り、カードから詳細を開く単一ユースケース。表への切り替えを含む。
issue: 5
primary_actor: 利用者
trigger: 利用者がタスクのタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_task_board_view.py
notes:
  検討事項の案: セットアップの検討事項は、`未整理`・`対象外`・`取り下げ` を除く状態なら案を 1 つ以上持ち、`決定済み`（と、前に採用した案を残す `要見直し`）は採用した案を 1 つ持つ。案を持たない形や、採用した案を持たない決定済みで作ると、読み込みの検証で弾かれる

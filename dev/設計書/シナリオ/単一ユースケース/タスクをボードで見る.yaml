title: "タスクをボードで見る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 状態が未着手・進行中・保留・完了・中止のタスクを 1 件ずつ（T-1〜T-5）。T-2（進行中）は検討事項 D-3 を進める
        notes: 'T-2 は `for: [D-3]`'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクのタブを開く
        P-->>U: 状態ごとの列のボード
        U->>P: T-2 のカードを押す
        P-->>U: T-2 の詳細パネル
        U->>P: 表示形式を表に切り替える
        P-->>U: タスクの表
      ```
    expected:
      - ボードに未着手・進行中・保留・完了・中止の 5 列があり、T-1〜T-5 がそれぞれの状態の列にある
      - T-2 の詳細パネルに、進める検討事項として D-3 がある
      - 表に T-1〜T-5 の 5 行がある
    test: test_normal
  - name: 正常シナリオ（絞り込む）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 'タスク T-1（種類: 作業・状態: 未着手・タグ: 保存）、T-2（種類: 調査・状態: 進行中・タグ: 保存）、T-3（種類: 作業・状態: 完了・タグ: 通知）'
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: タスクのタブを開き、絞り込みのボタンを押す
        U->>P: ドロワーのタグで「保存」を選ぶ
        P-->>U: 「保存」を持つタスクだけのボード
        U->>P: ドロワーの種類で「調査」を選ぶ
        P-->>U: 両方の条件に合うタスクだけのボード
      ```
    expected:
      - 「保存」を選ぶと、ボードに T-1・T-2 のカードがあり、T-3 が無い
      - 「調査」を足すと、ボードに T-2 のカードだけがある
      - 絞っても未着手・進行中・保留・完了・中止の 5 列が残り、各列の件数が絞った後のカードの数に合う
      - 絞り込みのボタンに件数のバッジが付く
    test: test_normal_when_filtered
lead: 利用者が、タスクを状態ごとの列のボードで見て、絞り込みのボタンのドロワーで絞り、カードから詳細を開く単一ユースケース。表への切り替えを含む。
issue: 5
primary_actor: 利用者
trigger: 利用者がタスクのタブを開く
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
test_file: tests/e2e/単一ユースケース/test_task_board_view.py

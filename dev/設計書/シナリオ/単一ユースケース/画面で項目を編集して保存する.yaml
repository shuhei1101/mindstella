title: "画面で項目を編集して保存する"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1（案 A・B、タグ `画面`）と、未着手のタスク T-1（タグ `記録の形`）
      - name: 開いている画面
        description: 検討事項のボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: D-1 を開いて「編集する」を押す
        P-->>U: D-1 の詳細パネルを編集の表示にする
        U->>P: 答えを書き、タグに使われているタグの候補から「記録の形」を足し、案 C を足して採用する
        P->>SV: D-1 の編集を保存待ちに溜める
        P-->>U: 変えたキーと案 C にバッジ、ボードの D-1 のカードにバッジ、トップバーに保存待ちの件数
        U->>P: T-1 を開いて状態を「中止」にする
        P->>SV: T-1 の編集を保存待ちに溜める
        U->>P: ページを開き直す
        P->>SV: 記録と保存待ちの編集を読む
        P-->>U: 開き直す前と同じバッジと件数
        U->>P: トップバーの保存待ちの件数を押す
        P-->>U: 保存待ちのパネル（D-1 の答え・タグ・案 C の追加・採用の切り替えの 4 件と、T-1 の状態の 1 件）
        U->>P: T-1 の状態の編集を取り消し、まとめて保存する
        P->>SV: 保存する
        SV->>WS: D-1 の答え・タグ・案 C・採用を書き、編集した人を利用者にし、保存待ちの編集を空にする
        SV-->>P: 受け付けた
        P-->>U: 保存したことと、D-1 の新しい中身
      ```
    expected:
      - D-1 の答え・タグ（`画面`・`記録の形`）・案 C が書かれ、採用する案が C である
      - D-1 の最後に編集した人が利用者（`user`）で、変更履歴の最後の回の書き換えた人が利用者である
      - T-1 の状態が未着手のまま、変更履歴も増えていない
      - 開き直した後も、D-1 の変えたキーと案 C のバッジ・ボードの D-1 のカードのバッジ・トップバーの件数 5 が出ている
      - T-1 の状態の編集を取り消すと、トップバーの件数が 4 になり、D-1 の 4 件は保存待ちに残る
      - 保存した後、保存待ちの編集が 0 件で、トップバーの件数とボードの D-1 のカードのバッジが画面を開き直さずに消える
    test: test_normal
  - name: 正常シナリオ（設定を書き換える）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませ、題名が「話し合い」のワークスペース
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: 表示の設定のパネルを開き、「設定を編集する」を押す
        P-->>U: 設定の画面
        U->>P: 題名を「画面の編集」に書き換える
        P->>SV: 設定の編集を保存待ちに溜める
        U->>P: 保存待ちのパネルを開き、まとめて保存する
        P->>SV: 保存する
        SV->>WS: `config.yaml` の題名を書き、保存待ちの編集を空にする
        SV-->>P: 受け付けた
        P-->>U: トップバーの題名を「画面の編集」にする
      ```
    expected:
      - '`config.yaml` の題名が「画面の編集」で、タグのキー（`tags`）を持たない'
      - 設定の画面にタグの語彙の入力が無い
      - 保存待ちの編集が 0 件である
      - 画面を開き直さずに、トップバーの題名が「画面の編集」になる
    test: test_normal_when_settings
  - name: 正常シナリオ（取り下げ・対象外にする）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1 と、調査 R-1
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: D-1 を編集し、状態を「対象外」にする
        P->>SV: D-1 の編集を保存待ちに溜める
        U->>P: R-1 を編集し、取り下げにする
        P->>SV: R-1 の編集を保存待ちに溜める
        U->>P: 保存待ちのパネルでまとめて保存する
        P->>SV: 保存する
        SV->>WS: D-1 の状態と R-1 の取り下げを書く
        SV-->>P: 受け付けた
      ```
    expected:
      - D-1 の状態が `対象外` である
      - R-1 が取り下げ（`withdrawn` が真）になり、調査の表の R-1 の行に取り下げの札が出る
      - D-1・R-1 の最後に編集した人が利用者である
    test: test_normal_when_withdraw
  - name: 正常シナリオ（差分の表示中）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませ、書き換えのまとまりを 1 つ持つワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 保存待ちの編集
        description: D-1 の答えの編集 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 保存待ちのパネルを開いたまま、変更履歴で時点を選ぶ
        P-->>U: 差分の表示にし、保存待ちのパネルを閉じ、編集の操作とバッジと件数を出さない
        U->>P: D-1 を開く
        P-->>U: D-1 の詳細パネル（読む表示だけで「編集する」が無い）
        U->>P: 差分の表示をやめる
        P-->>U: D-1 のバッジとトップバーの件数 1 を出し直し、「編集する」を出す
      ```
    expected:
      - 差分の表示中は、保存待ちのパネルが閉じ、詳細パネルに「編集する」が無く、保存待ちのバッジとトップバーの件数が出ない
      - 差分の表示をやめると、D-1 のバッジとトップバーの件数 1 と「編集する」が出る
      - 保存待ちの編集が D-1 の答えの 1 件のまま変わらない
    test: test_normal_when_diff_view
  - name: 異常シナリオ（AI が同じ項目を書き換えた）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1 と、未着手のタスク T-1
      - name: 保存待ちの編集
        description: D-1 の答えの編集と、T-1 の状態を「完了」にする編集の 2 件
        notes: 溜めた後に、MCP のクライアントで D-1 のタイトルを書き換える（話し合いの途中で Claude Code が書き換えた形）
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: 保存待ちのパネルでまとめて保存する
        P->>SV: 保存する
        SV-->>P: D-1 は溜めた後に書き換わっている（何も書いていない）
        P-->>U: D-1 の行に、書き込めない理由を出す
        U->>P: D-1 の編集を取り消し、もう一度まとめて保存する
        P->>SV: 保存する
        SV->>WS: T-1 の状態を書く
        SV-->>P: 受け付けた
      ```
    expected:
      - 最初の保存の後、D-1 も T-1 も書き換わっておらず、保存待ちの編集が 2 件のまま残る
      - D-1 の行に、溜めた後に書き換わったため書き込めない理由が出る
      - D-1 のタイトルが MCP で書き換えた値のままである
      - 取り消して保存し直すと、T-1 の状態が `完了` になり、保存待ちの編集が 0 件になる
    test: test_error_when_item_changed_after_staged
  - name: 異常シナリオ（サーバーにつながらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。保存待ちのパネルを開いた後にサーバーを止める）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 保存待ちの編集
        description: D-1 の答えの編集 1 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー（止まっている）

        U->>P: まとめて保存する
        P->>SV: 保存する
        SV--xP: つながらない
        P-->>U: 保存できなかったことを出す
      ```
    expected:
      - 画面に、保存できなかった旨が出る
      - 保存待ちのパネルに D-1 の編集が残っている
      - D-1 の答えが溜める前のままで、保存待ちの編集が 1 件のままである
    test: test_error_when_server_unreachable
lead: 利用者が、サーバーが配るプレビューの詳細パネルと設定の画面で、項目のキー・本文・案・状態と設定を書き換えて保存待ちに溜め、変えた箇所のバッジを見ながら 1 件ずつ取り消し、保存待ちのパネルからまとめて保存する単一ユースケース。保存で書いた項目は、編集した人が利用者として残る。項目を足す・消す操作は単一ユースケース『画面で項目を足す』『画面で項目を消す』が持つ。
issue: 48
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: AI に話す前に、画面から記録を直し、変えた分を見直してからまとめて確定できる
  - name: AI（次の話し合いの Claude Code）
    interest: 利用者が画面で変えた分を、AI の変更と見分けて受け取れる
trigger: 利用者が詳細パネルの「編集する」か、表示の設定のパネルの「設定を編集する」を押す
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
  - 差分の表示をしていない
success_guarantee: 保存待ちに溜めた編集のうち、取り消さなかったものが 1 回の保存で全て項目と設定に書かれ、書いた項目の最後に編集した人と変更履歴の書き換えた人が利用者になる。保存した後、保存待ちの編集は 0 件で、バッジと件数が画面から消える。
minimal_guarantee: 1 件でも書き込めない編集があるときは、どの項目も設定も書き換えず、保存待ちの編集を全て残して、書き込めない編集と理由を出す。保存待ちの編集は、保存するか取り消すまで画面を開き直しても残る。
frequency: 話し合いの合間に画面で記録を読み返すたび
priority: 高
notes:
  保存待ちの数え方: 保存待ちの編集は、項目のキー 1 つ・本文・案 1 つの追加と書き換えと削除・採用する案の切り替え・設定のキー 1 つをそれぞれ 1 件と数え、取り消しも 1 件ずつ行う。項目の追加と削除は項目ごとに 1 件と数える。トップバーの件数はこの数え方の合計
  E2E の範囲: MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで操作し、ワークスペースの YAML と `config.yaml` を読んで確かめる。対応テストファイルは `tests/e2e/単一ユースケース/test_item_edit_save.py` にし、E2E テスト作成で書き足す。保存待ちの編集は ER 図『ワークスペース』の `edits.yaml` に溜まり、保存の入口はインターフェース定義『保存待ちの編集をまとめて保存』
  前提にした案: 要件の `未確定` のうち、保存待ちの編集をワークスペースに溜める案と、溜めた後に AI が書き換えた項目の編集を書き込めない編集として示す案（いずれも推奨の A）で書いた。保存を書き換えのまとまりにするかはこのシナリオでは確かめない
  配る書き出し: 配る書き出しの 1 枚の HTML に編集の操作が出ないことは、単一ユースケース『プレビューを配る』で確かめる
test_file: tests/e2e/単一ユースケース/test_item_edit_save.py

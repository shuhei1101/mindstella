title: "画面で項目を足す"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未着手のタスク T-1 とメモ N-1
      - name: 開いている画面
        description: タスクのボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: タスクのボードで「項目を追加」を押す
        P-->>U: 詳細パネルに、足すタスクの編集の表示
        U->>P: タイトル「画面を作る」を書く
        P->>SV: タスクを足す編集を保存待ちに溜める
        P-->>U: ボードに、ID を持たない足すタスクのカードとバッジ
        U->>P: メモの表で「項目を追加」を押し、タイトル「画面の形」を書く
        P->>SV: メモを足す編集を保存待ちに溜める
        U->>P: 保存待ちのパネルを開き、まとめて保存する
        P->>SV: 保存する
        SV->>WS: タスクとメモに ID を振って足し、保存待ちの編集を空にする
        SV-->>P: 受け付けた（振った ID）
        P-->>U: ボードに T-2、メモの表に N-2 を出す
      ```
    expected:
      - タスク T-2（「画面を作る」）とメモ N-2（「画面の形」）が足され、どちらも最後に編集した人が利用者（`user`）である
      - 保存する前の足すタスクのカードが ID を持たず、保存待ちのバッジを持つ
      - 保存する前のトップバーの件数が 2（足す項目ごとに 1 件）である
      - 保存した後、保存待ちの編集が 0 件で、画面を開き直さずにボードに T-2 が出ている
    test: test_normal
  - name: 正常シナリオ（検討事項に案を書いて足す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: 開いている画面
        description: 検討事項の表
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: 検討事項の表で「項目を追加」を押す
        P-->>U: 詳細パネルに、足す検討事項の編集の表示
        U->>P: タイトル「保存の単位」を書く
        P->>SV: 検討事項を足す編集を保存待ちに溜める
        U->>P: 「案を追加」で案 A「項目ごと」と案 B「まとめて」を書く
        P->>SV: 足す検討事項の編集に案を溜める
        U->>P: 案 B の「採用」を選ぶ
        P->>SV: 足す検討事項の編集に採用を溜める
        U->>P: 追加の入力を閉じ、検討事項の表の足す検討事項を開き直す
        P-->>U: 案の区画に案 A と案 B（B が採用）
        U->>P: 保存待ちのパネルを開き、まとめて保存する
        P->>SV: 保存する
        SV->>WS: 案を持つ検討事項に ID を振って足し、保存待ちの編集を空にする
        SV-->>P: 受け付けた（振った ID）
        U->>P: 絞り込みで状態に「決定済み」を加える
        P-->>U: 検討事項の表に D-2 を出す
      ```
    expected:
      - 検討事項 D-2（「保存の単位」）が足され、案 A（「項目ごと」）と案 B（「まとめて」）を持ち、案 B だけが採用で、状態が決定済み、最後に編集した人が利用者（`user`）である
      - D-2 が、案の記号（`A`・`B`）をキーにした属性を持たない
      - 保存する前の保存待ちの編集が、足す検討事項の 1 件だけで、トップバーの件数が 1 である
      - 保存する前に足す検討事項を開き直すと、案の区画に案 A と案 B が出て、案 B の「採用」が選ばれている
      - 保存した後、保存待ちの編集が 0 件である
    test: test_normal_when_options_written
lead: 利用者が、サーバーが配るプレビューの種類ごとの画面から項目を足す編集を保存待ちに溜め、保存待ちのパネルからまとめて保存する単一ユースケース。足した項目の ID は保存したときにサーバーが振る。溜めた編集の取り消しと、差分の表示中の扱いは単一ユースケース『画面で項目を編集して保存する』と同じ。
issue: 48
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: AI に頼まずに、画面から検討事項・タスク・メモなどを足せる
  - name: AI（次の話し合いの Claude Code）
    interest: 利用者が足した項目を、前回読んだ時点からの変更として受け取れる
trigger: 利用者が種類ごとの画面の「項目を追加」を押す
preconditions:
  - ワークスペースが作成済みで、サーバーがプレビューを配っている
  - 差分の表示をしていない
success_guarantee: 足した項目が、サーバーが振った ID で種類の YAML に加わり、最後に編集した人が利用者になる。
minimal_guarantee: 保存できなかったときは、どの項目も足さず、足す編集を保存待ちに残す。
frequency: 話し合いの合間に画面で記録を整えるたび
priority: 高
notes:
  E2E の範囲: MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで操作し、ワークスペースの YAML を読んで確かめる。対応テストファイルは `tests/e2e/単一ユースケース/test_item_add.py` にし、E2E テスト作成で書き足す
  異常シナリオを持たない理由: 保存できないときの扱い（つながらない・1 件でも書き込めない）は編集と同じ保存の入口を通り、単一ユースケース『画面で項目を編集して保存する』で確かめる。足す項目の入力の誤り（タイトルが空など）は画面設計で決め、結合テストで確かめる
test_file: tests/e2e/単一ユースケース/test_item_add.py

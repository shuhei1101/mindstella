title: ""
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 1）
      - name: 記録
        description: 検討事項 D-1〜D-5 とタスク T-1。D-3 は状態 `未決定` で、本文に段落 3 つと mermaid の flowchart を 1 つ持つ
      - name: 前回開いた
        description: 記録を作った後に、プレビューを一度開いて閉じる
        notes: 端末に前回開いた日時が残る
      - name: 書き換え
        description: MCP のツールで、D-3 の状態を `要見直し` にし、本文の段落を 1 つ書き換えて 1 つ消し、図のノードのラベルを 1 つ変える。検討事項 D-6 を足す
        notes: D-3 は変更履歴を 1 回分持ち、D-6 は変更履歴を持たない。T-1 は書き換えない
      - name: 配信
        description: 記録を配っているサーバー。差分の表示は切り（既定）
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: 新しいタブでプレビューを開く
        P-->>U: 概要（差分の表示は切り）
        U->>P: 差分の表示を入れる
        P-->>U: 検討事項のタブに印
        U->>P: 検討事項の表を開く
        P-->>U: D-3 に変更、D-6 に新規の印
        U->>P: D-3 を押す
        P-->>U: 状態・本文・図の前回からの変更を出した詳細パネル
        U->>P: 図の Raw を押す
        P-->>U: 記法の行ごとの差分
        U->>P: ページを読み込み直す
        P-->>U: 同じ画面と印
        U->>P: 差分の表示を切る
        P-->>U: 印と差分のない画面
      ```
    expected:
      - 差分の表示を入れる前は、どの項目にもタブにも印が無い
      - 差分の表示を入れると、検討事項のタブに印が付き、タスクのタブには付かない。タブの件数は入れる前と同じ
      - 検討事項の表で、D-3 に変更、D-6 に新規の印が付き、D-1・D-2・D-4・D-5 には印が無い
      - D-3 の詳細パネルで、状態の前の値 `未決定` と今の値 `要見直し` を見分けられる
      - D-3 の本文が Markdown として描かれたまま、書き換えた段落に足した印、消した段落に消した印が付き、変えていない段落には印が無い
      - D-3 の図で、ラベルを変えたノードに変わった色が付き、ほかのノードと辺には付かない
      - 図の Raw で、変えた行が消した行と足した行として出る
      - 読み込み直した後も差分の表示が入ったままで、D-3 と D-6 の印が残る
      - 差分の表示を切ると、印と差分が消え、D-3 の本文は今の内容だけになる
      - ワークスペースの YAML と本文の中身が、開く前と同じ
    test: test_normal
  - name: 正常シナリオ（図の種類が色付けの対象外）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 1）
      - name: 記録
        description: 本文に mermaid の gantt を 1 つ持つ資料 A-1
      - name: 書き換え
        description: MCP のツールで、A-1 の gantt のタスク 1 本の期間を変える
        notes: gantt はノード・辺に色を付ける対象（flowchart・sequenceDiagram・classDiagram・erDiagram・stateDiagram-v2）に入らない
      - name: 配信
        description: 記録を配っているサーバー。差分の表示を入れてある
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: A-1 の詳細パネルを開く
        P-->>U: 変わった図の枠に色
        U->>P: 図の Raw を押す
        P-->>U: 記法の行ごとの差分
      ```
    expected:
      - A-1 の図の枠に変わった色が付き、図の中の要素には色が付かない
      - 図の Raw で、期間を変えた行が消した行と足した行として出る
    test: test_normal_when_diagram_type_not_colored
  - name: 正常シナリオ（開いたまま書き換わる）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、プレビューを実際のブラウザで開いたまま、MCP のクライアントで `update` を呼ぶ）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 1）
      - name: 記録
        description: 本文を持つ検討事項 D-1・D-3
      - name: 開いている画面
        description: 差分の表示を入れた検討事項の表。どの項目にも印が無い
    flow: |-
      ```mermaid
      sequenceDiagram
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant P as プレビュー（ブラウザ）
        actor U as 利用者

        CC->>SV: update（D-3 の本文を書き換える）
        SV-->>P: 書き換えを知らせる
        P->>SV: 記録を読み直す
        P-->>U: 差分の表示のまま描き直した検討事項の表
        U->>P: D-3 を押す
        P-->>U: 本文の前回からの変更を出した詳細パネル
      ```
    expected:
      - 再読み込みの操作をせずに、検討事項の表の D-3 に変更の印が付き、D-1 には付かない
      - 描き直した後も差分の表示が入ったままで、開いていた画面と URL のハッシュが変わらない
      - D-3 の詳細パネルで、書き換えた本文に足した・消した印がある
    test: test_normal_when_rewritten_while_open
  - name: 正常シナリオ（端末で初めて開く）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、端末の保存領域が空のブラウザでプレビューを開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 1）
      - name: 記録
        description: 本文を書き換えて変更履歴を 1 回分持つ検討事項 D-3 と、変更履歴を持たない D-1
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューを開き、差分の表示を入れる
        P-->>U: 印のない検討事項の表
        U->>P: D-3 を押す
        P-->>U: 本文の前回からの変更を出した詳細パネル
      ```
    expected:
      - 前回開いた日時が無いため、どの項目にもタブにも新規・変更の印が付かない
      - D-3 の詳細パネルでは、変更履歴から本文の前回からの変更が出る
    test: test_normal_when_first_open
  - name: 正常シナリオ（保持する回数が 0）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 保持する回数を 0 にしたワークスペース
      - name: 記録
        description: 本文を持つ検討事項 D-3
      - name: 前回開いた
        description: 記録を作った後に、プレビューを一度開いて閉じる
      - name: 書き換え
        description: MCP のツールで D-3 の本文を書き換え、検討事項 D-6 を足す
        notes: 保持する回数が 0 のため、D-3 は変更履歴を持たない
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: プレビューを開き、差分の表示を入れる
        P-->>U: 検討事項の表
        U->>P: D-3 を押す
        P-->>U: 今の内容だけの詳細パネル
      ```
    expected:
      - 検討事項の表で D-6 に新規の印が付き、D-3 には変更の印が付かない
      - D-3 の詳細パネルに差分の印が無く、今の本文だけが出る
    test: test_normal_when_history_limit_zero
  - name: 異常シナリオ（前の版を組み立てられない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 1）
      - name: 記録
        description: MCP のツールで状態と本文を書き換え、変更履歴を 1 回分持つ検討事項 D-3
      - name: 手での書き換え
        description: その後、`docs/D-3.md` の全ての行をツールを通さずに手で書き換える
        notes: 変更履歴の本文の差分が、今の本文に当たらない
      - name: 配信
        description: 記録を配っているサーバー。差分の表示を入れてある
    flow: |-
      ```mermaid
      sequenceDiagram
        participant U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: D-3 の詳細パネルを開く
        P-->>U: 今の本文と、本文の差分を出せない旨
      ```
    expected:
      - D-3 の本文は今の内容が Markdown として描かれ、差分の印が無い
      - 本文の前回からの差分を出せない旨が出る
      - 状態の前の値と今の値は、本文と関係なく見分けられる
    test: test_error_when_previous_version_unavailable
lead: 利用者が、プレビューを差分の表示に切り替え、前回開いてから足された・変わった項目を印で見つけ、詳細パネルで本文・図・Raw・キーの前回からの変更を読む単一ユースケース。
issue: 68
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: AI が書き換えた資料などのどこが変わったかを、本文を読み比べずに素早く読める
trigger: 利用者が、AI が記録を書き換えた後に、何が変わったかを確かめたくなる
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
  - 書き換えた項目が、保持する回数の分だけ変更履歴を持つ
success_guarantee: 差分の表示の間、前回開いた日時より後に足された項目に新規、変わった項目に変更の印が付き、印の付いた項目を持つタブに印が付く。変更履歴を持つ項目の詳細で、本文・図・Raw・キーの前回からの変更を読める。差分の表示の入り切りだけではワークスペースの記録を書き換えない。
minimal_guarantee: 前の版を組み立てられない項目でも、今の内容は読める。差分の表示を切れば、差分を入れる前と同じ画面に戻る。
frequency: AI が記録を書き換えるたび
priority: 高
notes:
  印の基準の時点: 端末に「前回開いた日時」をワークスペースごとに持ち、タブで最初に開いたときに残っていた値をそのタブの基準にする。開いた後は「前回開いた日時」を今の日時に書き換え、同じタブで読み込み直しても基準は変えない。詳細パネルの差分は基準と関係なく、項目の変更履歴の前回と比べる
  比べる回: '2 回分以上持つときに比べる回を選べるかは要件の `未確定`（決める段: モック作成）。選べる形に決まったら、そのシナリオをここへ足す'
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を足す

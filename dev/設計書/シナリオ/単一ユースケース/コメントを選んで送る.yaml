title: "コメントを選んで送る"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1 と、本文を持つ資料 A-1
      - name: レビュー中のコメント
        description: D-1 への「案 A にする」と、A-1 の本文の 2 行目を指す「ここは言い換える」の 2 件
      - name: 開いている画面
        description: 検討事項のボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース

        U->>P: コメントのボタンを押す
        P-->>U: コメントの一覧（チェックした 2 件）
        U->>P: 項目に紐づかない「全体に目を通した」を書いて溜める
        P->>SV: レビュー中のコメントを足す（項目なし）
        U->>P: 「全体に目を通した」のチェックを外し、まとめて送る
        P->>SV: チェックした 2 件を送る
        SV->>WS: 2 件を取り込んでいない送信に足し、レビュー中から外す
        SV-->>P: 受け付けた
        P-->>U: 送ったことと、残った 1 件
        P-->>U: ボードの D-1 のカードからコメントの印を外す
      ```
    expected:
      - 取り込んでいない送信が 2 件あり、D-1 への「案 A にする」と、A-1 の本文の 2 行目の箇所を持つ「ここは言い換える」である
      - レビュー中のコメントが項目に紐づかない「全体に目を通した」の 1 件だけである
      - コメントの一覧に 1 件が残り、コメントのボタンの件数が 1 である
      - 画面を開き直さずに、検討事項のボードの D-1 のカードからコメントの印が消える
      - 送った結果に、Claude Code へ入力しなかったことが出る（tmux の外で立てた MCP サーバーのため）
    test: test_normal
  - name: 正常シナリオ（一覧から元の箇所へ移る）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 本文が画面の高さを超える長さの資料 A-1
      - name: レビュー中のコメント
        description: A-1 の本文の終わり近くの行を指す 1 件
      - name: 配信
        description: 記録を配っているサーバー
      - name: 画面の幅
        description: 幅 900px 以下（コメントの一覧を画面の幅いっぱいに出し、行から開いた詳細パネルを閉じると一覧へ戻る幅。画面設計『コメントの一覧』）
        notes: 800px
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: コメントの一覧で A-1 への行を押す
        P-->>U: A-1 の詳細パネルを開き、箇所までスクロールして示す
        U->>P: ブラウザの戻る操作
        P-->>U: 詳細パネルを閉じ、コメントの一覧を出したままにする
      ```
    expected:
      - A-1 の詳細パネルが開き、箇所の行が画面の中にあり、示されている
      - 戻る操作で詳細パネルが閉じ、コメントの一覧が開いたままで、URL のハッシュが `id` を持たない
    test: test_normal_when_jump_to_location
  - name: 正常シナリオ（直して消して戻す）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中のコメント
        description: D-1 への「案 A にする」と「案 B も見たい」の 2 件
      - name: 開いている画面
        description: 検討事項のボード
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: 「案 A にする」を「案 A に決める」へ書き換える
        P->>SV: レビュー中のコメントを書き換える
        U->>P: 「案 B も見たい」を消す
        P->>SV: レビュー中のコメントを消す
        P-->>U: ボードの D-1 のカードの件数を 1 にする
        U->>P: 消したコメントを戻す
        P->>SV: レビュー中のコメントを戻す
        P-->>U: 2 件の一覧と、D-1 のカードの件数 2
      ```
    expected:
      - レビュー中のコメントが「案 A に決める」と「案 B も見たい」の 2 件である
      - ページを開き直しても、一覧に同じ 2 件が出る
      - 検討事項のボードの D-1 のカードのコメントの印の件数が、消した後に 1、戻した後に 2 になる
    test: test_normal_when_edit_remove_restore
  - name: 異常シナリオ（サーバーにつながらない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。一覧を開いた後にサーバーを止める）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中のコメント
        description: D-1 への 2 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー（止まっている）

        U->>P: チェックした 2 件をまとめて送る
        P->>SV: 送る
        SV--xP: つながらない
        P-->>U: 送れなかったことを出す
      ```
    expected:
      - 画面に、送れなかった旨が出る
      - 一覧に 2 件がチェックしたまま残っている
      - ワークスペースの取り込んでいない送信が 0 件で、レビュー中のコメントが 2 件のままである
    test: test_error_when_server_unreachable
  - name: 異常シナリオ（チェックが 0 件）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: レビュー中のコメント
        description: D-1 への 1 件
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）

        U->>P: コメントの一覧で、ただ 1 件のチェックを外す
        P-->>U: まとめて送るボタンを押せなくする
      ```
    expected:
      - まとめて送るボタンが押せない
      - 取り込んでいない送信が 0 件である
    test: test_error_when_nothing_checked
  - name: 異常シナリオ（箇所が本文に合わない）
    setup:
      - name: Mock
        description: なし（MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く。描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1 と、本文を持つ資料 A-1
      - name: レビュー中のコメント
        description: A-1 の本文の 5 行目を指す 1 件と、D-1 への 1 件
        notes: 溜めた後に A-1 の本文を 3 行に縮める（話し合いの途中で Claude Code が資料を書き換えた形）
      - name: 配信
        description: 記録を配っているサーバー
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー

        U->>P: チェックした 2 件をまとめて送る
        P->>SV: 送る
        SV-->>P: A-1 へのコメントの箇所が本文に合わない（何も送っていない）
        P-->>U: A-1 への行に、箇所が合わない理由を出す
        U->>P: A-1 へのコメントから箇所を外し、もう一度まとめて送る
        P->>SV: 送る
        SV-->>P: 受け付けた
      ```
    expected:
      - 最初に送ったとき、取り込んでいない送信が 0 件で、2 件ともレビュー中に残る
      - A-1 への行に、箇所が本文に合わない理由が出る
      - 箇所を外して送り直すと、取り込んでいない送信が 2 件になり、A-1 への送信は箇所を持たない
    test: test_error_when_location_stale
  - name: 正常シナリオ（Claude Code へ入力する）
    setup:
      - name: Mock
        description: モデルを呼ばない。Claude Code の代わりに、貼られた文字列を 1 件の user のメッセージ（`cwd` はワークスペースのフォルダ）として、設定のフォルダの `projects` の下の作業フォルダに当たるフォルダの会話の記録（jsonl）へ書く偽のコマンドを tmux のペインで動かし、そのペインの環境（`TMUX`・`TMUX_PANE`・`CLAUDE_CONFIG_DIR`）で MCP サーバーを立てる。サーバーが配るプレビューを実際のブラウザで開く
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: 記録
        description: 未決定の検討事項 D-1
      - name: レビュー中のコメント
        description: D-1 への「案 A にする」と、項目に紐づかない 2 行の「全体に目を通した」の 2 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant WS as ワークスペース
        participant TM as tmux
        participant CC as Claude Code（偽のコマンド）

        U->>P: 2 件をまとめて送る
        P->>SV: 送る
        SV->>WS: 2 件を取り込んでいない送信に足し、レビュー中から外す
        SV->>TM: 送信の ID・向けた項目・本文を並べた文字列を Claude Code のペインへ貼って確定する
        TM->>CC: 1 回の入力
        CC->>CC: 会話の記録へ書く
        SV->>SV: 会話の記録に 2 件の ID が入ったことを確かめる
        SV-->>P: 受け付けた（Claude Code へ入力した）
        P-->>U: 送って Claude Code へ入力したこと
      ```
    expected:
      - 取り込んでいない送信が 2 件ある
      - 会話の記録に user のメッセージが 1 件だけ増え、その中に 2 件の送信の ID・「案 A にする」・2 行の「全体に目を通した」がある
      - 送った結果に、Claude Code へ入力したことが出る
      - 2 件とも取り込み済みになっていない（取り込み済みにするのは Claude Code が記録した後）
    test: test_normal_when_entered_to_claude_code
  - name: 異常シナリオ（入力が会話に入らない）
    setup:
      - name: Mock
        description: モデルを呼ばない。貼られた文字列を受けても会話の記録へ何も書かない偽のコマンドを tmux のペインで動かし、そのペインの環境で MCP サーバーを立てる。サーバーが配るプレビューを実際のブラウザで開く
      - name: tmux
        description: テストごとに専用のソケットで立てた tmux のサーバー
        notes: 利用者の tmux のセッションに触れない
      - name: make_workspace
        description: 作成を済ませたワークスペース
      - name: レビュー中のコメント
        description: 未決定の検討事項 D-1 への「案 A にする」の 1 件
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant P as プレビュー（ブラウザ）
        participant SV as サーバー
        participant TM as tmux
        participant CC as Claude Code（偽のコマンド）

        U->>P: まとめて送る
        P->>SV: 送る
        SV->>SV: 送信に足し、レビュー中から外す
        SV->>TM: 文字列を貼って確定する
        TM->>CC: 入力
        SV->>SV: 待つ上限までに会話の記録へ ID が入らない
        SV-->>P: 受け付けた（Claude Code へは入力できなかった）
        P-->>U: 送信は残したが Claude Code へ入力できなかったこと
      ```
    expected:
      - 取り込んでいない送信が 1 件あり、レビュー中のコメントが 0 件である
      - 送った結果に、送信は残したが Claude Code へ入力できなかったことが出る
    test: test_error_when_not_entered
lead: 利用者が、コメントの一覧でレビュー中のコメントを確かめ、直し・消し・項目に紐づかないコメントを足して、チェックしたものだけをまとめて送る単一ユースケース。送った送信は、起動スクリプトが立てた tmux のセッションの Claude Code へすぐに入力する。コメントは単一ユースケース『項目へコメントする』『選んだ箇所へコメントする』で溜める。
issue: 13
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 送る前に溜めたコメントを見直し、送りたくないものを外して送れる。間違えて消しても戻せる
trigger: 利用者がコメントのボタンを押す
preconditions:
  - ワークスペースに記録があり、サーバーがプレビューを配っている
success_guarantee: チェックしたレビュー中のコメントが、向けた項目・箇所・本文のまま取り込んでいない送信になり、レビュー中から外れる。チェックしなかったものはレビュー中に残る。tmux の中で立てた Claude Code なら、送った送信が 1 回の入力として会話に入り、画面に入力したことが出る。
minimal_guarantee: 送れなかったときは、どのコメントも送信にせずレビュー中に残し、送れなかったことを出す。Claude Code へ入力できなかったときも送信は残し、入力できなかったことを出して、話し合いの取り込みに任せる。
frequency: プレビューを読み終えるたびに 1 回
priority: 高
notes:
  消したものの戻し方: 「元に戻す」で戻すか確認のモーダルを挟むかはモック作成で決める。確認のモーダルに決まったときは、正常シナリオ（直して消して戻す）の戻す手順を、モーダルで取り消す手順へ書き換える
  まとめて送るときの一部の失敗: チェックしたものは全て送るか、何も送らないかのどちらかにする。一部だけ送った状態にはしない
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` と各シナリオの `test` を足す
  箇所が合わなくなったコメント: 溜めた後に本文や値が書き換わり、箇所が合わなくなったコメントは送らない。一覧のその行に理由を出し、利用者が箇所を外すか消すまで、チェックしたものはどれも送らない
  Claude Code への入力: 入力欄に打ちかけがあるときや選択の表示が出ているときも、ペインの状態を見ずに貼って確定する。打ちかけとつながったり選択の表示で失われたりしたときは、利用者が tmux のセッションで気づいて直す。入力した文字列の取り込みは単一ユースケース『送信の取り込み』が持つ
  送った結果の文言: 入力したときと入力できなかったときの文言はモック作成で決める
test_file: tests/e2e/単一ユースケース/test_comment_select_send.py

title: "ゴール判定"
scenarios:
  - name: 正常シナリオ（ゴールに届いた）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `goal`・`show`・`clear-release`・`release/` への書き出し・`add`（会話ログ）を、決めた引数で順に再生する
      - name: 作成済みのワークスペース
        description: 'ゴールがインターフェースまでで、目的からインターフェースまでの検討事項が全て決定済みか対象外で、ゴールの `deliverables` の資料 A-1 が `status: 完成`'
        notes: コンテンツのフェーズに未決定の D-9 を置き、ゴールより後ろのフェーズは判定に入らないことを確かめる
      - name: 前回のリリース
        description: '`release/` に、前回のゴール判定で書き出した `古い資料.md` がある'
      - name: 利用者の返答
        description: 示した検討事項と納品物を確定する
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー
        participant WS as ワークスペース

        CC->>SV: goal
        SV->>WS: mindmap.yaml のフェーズ・ゴールと全ての YAML を読む
        SV-->>CC: 届いた（残り 0 件）
        CC-->>U: 決まった検討事項と納品物を示して確定を求める
        U->>CC: 確定する
        CC->>SV: show（納品物の本文）
        CC->>SV: clear-release
        SV->>WS: release/ の中身を消す
        CC->>WS: release/ にリリースの資料を書き出す
        CC->>SV: add（会話ログ）
        CC-->>U: release/ のファイルを示す
      ```
    expected:
      - '`goal` の出力が「届いた」で、残りの検討事項と納品物が 0 件である（ゴールより後ろの D-9 を含まない）'
      - '`release/` に、決まった検討事項の一覧と納品物 A-1 の本文がある'
      - '`release/` に前回の `古い資料.md` が残っていない'
      - 会話ログが 1 件足されている
    test: test_normal_when_reached
  - name: 正常シナリオ（ゴールに届いていない）
    setup:
      - name: Mock
        description: モデルを呼ばない。手順が連ねる `goal` を再生する
      - name: 作成済みのワークスペース
        description: 'ゴールのフェーズまでに未決定の D-1 と、ゴールの `deliverables` に `status: 確認中` の納品物 A-1 を持つ'
    flow: |-
      ```mermaid
      sequenceDiagram
        actor U as 利用者
        participant CC as Claude Code（session）
        participant SV as サーバー

        CC->>SV: goal
        SV-->>CC: 届いていない（残り D-1・A-1）
        CC-->>U: 残っている D-1・A-1 を示す
      ```
    expected:
      - '`goal` の出力が「届いていない」で、残りに D-1 と A-1 がある'
      - '`release/` に何も書かれていない'
    test: test_normal_when_not_reached
lead: '`session` が、ゴールのフェーズまでの検討事項と納品物が揃ったかを確かめ、利用者の確定を取って `release/` にリリースの資料を書き出す単一ユースケース。'
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: ゴールに届いていないときは、何が残っているかが分かる
  - name: 受け取り手
    interest: '`release/` だけを読めば、決まったことと納品物が分かる'
trigger: 利用者がゴールに届いたかを尋ねる、または `next` の候補が無くなる
preconditions:
  - ワークスペースが作成済みである
  - 起動スクリプトで立ち上げ、mindstella の MCP のツールが使える
success_guarantee: ゴールに届いたときだけ、利用者の確定の後に `release/` へ書き出す。届いていないときは残りを示し、`release/` には書かない。
frequency: 話し合いの終わりに 1〜数回
priority: 高
notes:
  リリースの形: '`release/` に書き出す資料の形は進め方ガイドの「リリースの形」が決める。書き出しはスキルが Markdown を書く。書き出す前に `clear-release` で `release/` の中身を消し、最新の確定版の一式だけを置く（版はフォルダで切らない）'
  ゴールに届いたかの判定: 'MCP のツール `goal` が判定する。ゴールのフェーズまでの検討事項が全て決定済みか対象外・取り下げで、ゴールの `deliverables` の資料が全て `status: 完成` のときに届いたとする。引数と出力の形はインターフェース定義設計で決める'
test_file: tests/e2e/単一ユースケース/test_goal_check.py

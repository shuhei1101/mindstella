summary: 単一ユースケースのシナリオ
items:
  - page: プラグインのインストール.yaml
    summary: マーケットプレイスを登録してプラグイン mindstella をインストールする
  - page: 起動スクリプトで立ち上げる.yaml
    summary: 依存を確かめ、tmux の中で MCP サーバーを渡した Claude Code を立ち上げる
  - page: ワークスペースの作成.yaml
    summary: 新しいワークスペースを作る
  - page: 記録の追加と更新.yaml
    summary: 検討事項・タスクなどの項目を足す・直す
  - page: 採用する案の切り替え.yaml
    summary: 検討事項の採用する案を切り替え、影響を受ける項目を洗い出す
  - page: 状況の確認.yaml
    summary: 再開時の状況と、次に検討する項目の候補を読む
  - page: 記録の検索.yaml
    summary: 項目を探し、1 件の中身と参照元・使っている属性名を読む
  - page: ワークスペースの点検.yaml
    summary: 参照切れと、YAML と本文の Markdown のずれと、設定に無いフェーズを洗い出す
  - page: 話し合いのセットアップ.yaml
    summary: 新しいワークスペースを作るか既存の続きを選ぶ
  - page: 送信の取り込み.yaml
    summary: 話し合いの最初に、プレビューから届いた送信を記録して取り込み済みにする
  - page: 発言の取り込み.yaml
    summary: 発言を記録し、派生の検討事項・未整理・タスクを積む
  - page: ヒアリング.yaml
    summary: 前提が揃った未決定を 1 ラウンドにまとめて聞き、答えを記録する
  - page: リサーチ.yaml
    summary: 確認を取ってサブエージェントで調べ、調査を検討事項に繋ぐ
  - page: 方針転換.yaml
    summary: 採用する案を切り替え、影響を要見直しにして見直しのタスクを積む
  - page: プレビューを開く.yaml
    summary: サーバーが配るプレビューの URL を示し、記録の書き換えを開いている画面へ反映する
  - page: ゴール判定.yaml
    summary: ゴールに届いたかを確かめ、確定した記録をリリースの資料に書き出す
  - page: 概要を見る.yaml
    summary: プレビューの概要のタイルを読み、その条件の一覧を開く
  - page: 検討事項をマップで辿る.yaml
    summary: 検討事項をマップで見て、枝と依存を辿る
  - page: タスクをボードで見る.yaml
    summary: タスクを状態ごとの列のボードで見る
  - page: 項目を表で絞り込む.yaml
    summary: 項目を表で並べ替え・絞り込み・ピン留めする
  - page: 資料を読む.yaml
    summary: 資料を納品物を先頭にしたカードと状態の列のボードで見て、本文を開く
  - page: 項目の詳細を読む.yaml
    summary: 詳細パネルで項目の案・関係・本文を読む
  - page: 項目を検索する.yaml
    summary: 全体の検索で項目を探し、詳細を開く
  - page: つながりを辿る.yaml
    summary: 3D のつながりを回し、玉を押して詳細を開く
  - page: プレビューを配る.yaml
    summary: 記録を見るだけの 1 枚の HTML に書き出し、ネットにつながらない端末で開いて読む
  - page: ワークスペースの移し替え.yaml
    summary: プラグインを上げた後、ワークスペースを版ごとの手順で今の版へ移し替える
  - page: 前回からの差分を見る.yaml
    summary: 変更履歴から書き換えのまとまりを選び、足された・変わった項目の印と、本文・図・Raw・キーの変更を読む
  - page: 設定の更新.yaml
    summary: 題名・プレイブック・フェーズ・最上位の軸の呼び名・ゴールを書き換え、項目のフェーズを付け替える
  - page: 話し合いの範囲の見直し.yaml
    summary: 書き換えのたたき台とフェーズの対応を確かめ、話し合いの設定を書き換える
  - page: 選んだ箇所へコメントする.yaml
    summary: 詳細パネルで本文の文章か値を選び、その箇所を指すコメントを溜める
  - page: コメントを選んで送る.yaml
    summary: コメントの一覧で溜めたコメントを見直し、チェックしたものだけをまとめて送る
  - page: 項目へコメントする.yaml
    summary: 詳細パネルから、項目へのコメントを書いてレビュー中に溜める
  - page: 表示の設定を変える.yaml
    summary: 見た目と表示する種類を自分の端末だけで変え、既定に戻す
  - page: ワークスペースの既定を変える.yaml
    summary: 選んだ見た目と表示する種類を、確かめてからワークスペースの既定として保存する
  - page: 設定の再読み込み.yaml
    summary: 手で直した config.yaml を再読み込みし、検査に通らなければ前の設定のまま違う箇所を返す

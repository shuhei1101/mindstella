title: "プレビューで記録を読み返す"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、サーバーが配るプレビューを実際のブラウザで開く（描画のライブラリは CDN から読む）
      - name: make_workspace
        description: 作成を済ませたワークスペース（保持する回数は既定の 5）
      - name: 記録
        description: 対象 1・カテゴリー 2・フェーズ 3 にまたがる検討事項（未決定・決定済み・要見直し・保留を含み、依存でつながる）と、検討事項を進めるタスク（進行中を含む）・調査・資料（納品物を含み、本文の Markdown に mermaid の図を持つ）・用語・メモ・会話ログ
        notes: 要見直しの検討事項 D-3 は、前提の D-1 と後続の D-5 を持ち、タスク T-2 が進める
      - name: 書き換え
        description: 記録を作った後にプレビューを一度開いて閉じ、その後 MCP のツールで D-3 の状態と本文（段落 1 つと mermaid の図のノード 1 つ）を書き換え、検討事項 D-6 を足して、`commit`（説明「D-3 を見直し、D-6 を足す」）で 1 つのまとまりにする
        notes: 端末に前回開いた日時が残り、それより後の書き換えになる。D-3 は変更履歴を 1 回分持ち、D-6 は変更履歴を持たない新規の項目
      - name: 配信
        description: 記録を配っているサーバーと、そのプレビューの URL。差分の表示は切り（既定）
    flow: |
      flowchart TD
        A[概要を見る:正常シナリオ] -->|変更履歴からまとまり「D-3 を見直し、D-6 を足す」を選ぶ| X[前回からの差分を見る:正常シナリオ]
        X -->|変更の印が付いた D-3 を押す| B[項目の詳細を読む:正常シナリオ]
        B -->|ネットワークで D-3 を押す| C[つながりを辿る:正常シナリオ]
        click A "../単一ユースケース/概要を見る.md#正常シナリオ"
        click X "../単一ユースケース/前回からの差分を見る.md#正常シナリオ"
        click B "../単一ユースケース/項目の詳細を読む.md#正常シナリオ"
        click C "../単一ユースケース/つながりを辿る.md#正常シナリオ"
    expected:
      - 終えたときの URL を新しいタブで開くと、ネットワークの画面と D-3 の詳細パネルが開く
      - 新しいタブで開いた画面でも、変更履歴から選んだ時点の差分の表示のままで、D-3 の詳細パネルの本文に足した・消した印がある
      - ワークスペースの YAML の中身が、開く前と同じ
    test: test_normal
    notes:
      シナリオの判定: 判定フローチャート『シナリオ』で、新規に複合ユースケース（単一価値シナリオ）とした。達成価値は「利用者が概要から前回より変わった項目を見つけ、その中身と関係を読み、開いた画面を URL で開き直せる」。画面をまたいだ遷移・選んだ時点の引き継ぎと URL のハッシュの復元だけを残し、本文・図・Raw の差分の見え方、古いまとまりの選び方、マップ・ボード・資料・表・検索は各単一ユースケースの E2E で確かめる（Q4 の下位テストに降ろす）
    uses:
      - dev/設計書/シナリオ/単一ユースケース/概要を見る#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/前回からの差分を見る#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/項目の詳細を読む#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/つながりを辿る#scenarios[正常シナリオ]
lead: 利用者が、サーバーが配るプレビューの概要で変更履歴から時点を選んで差分の表示にし、変わった項目の詳細を開き、ネットワークでその項目の関係を読み、開いた画面と項目を URL に残す複合ユースケース。
issue: 5
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: ファイルを開くだけで、次に何を決めるか・何が進んでいるか・前回から何が変わったか・項目どうしがどうつながっているかを読める
trigger: 利用者が、話し合いを再開する前や途中で、記録の全体を見返したくなる
preconditions:
  - ワークスペースに記録があり、起動スクリプトで立ち上げた Claude Code のサーバーがプレビューを配っている
  - 利用者がブラウザでプレビューの URL を開いている（概要の画面）
  - ブラウザが CDN へ HTTPS で届く
success_guarantee: 利用者が開いた画面と項目が URL のハッシュに残り、同じ URL を開き直すと同じ画面と項目が開く。変更履歴から選んだ時点は画面を移っても開き直しても保たれる。読み返すだけではワークスペースの記録を書き換えない。
minimal_guarantee: 描画のライブラリが読めないときも画面は開き、読めなかったライブラリの名前が出る。ワークスペースの記録は書き換えない。
frequency: 話し合いの再開のたびと、記録を書き足した後
priority: 高
test_file: tests/e2e/複合ユースケース/test_preview_reread.py

title: "表示の好みを人ごとに分ける"
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立て、サーバーが配るプレビューを、端末の保存領域を共有しない 2 つのブラウザのコンテキスト（利用者 A と利用者 B）で開く
      - name: make_workspace
        description: 作成を済ませたワークスペース。`config.yaml` は見た目の既定と表示する種類の既定を持たない
        notes: 組み込みの既定により、見た目は `deep`、表示する種類は全ての種類になる
      - name: 記録
        description: 検討事項・タスク・用語を 1 件以上ずつ持つ
      - name: 配信
        description: 記録を配っているサーバーと、そのプレビューの URL。A と B の端末の保存領域は空
    flow: |-
      ```mermaid
      flowchart TD
        A0([利用者 A]) -->|プレビューの URL を開く| A1[プレビューを開く:正常シナリオ]
        A1 -->|ネットワークのドロップダウンで見た目を glow にし、表示の設定で表示する種類から用語集を外す| A2[表示の設定を変える:正常シナリオ]
        A2 -->|利用者 B が同じ URL を開く| B1[プレビューを開く:正常シナリオ]
        B1 -->|B がネットワークのドロップダウンで見た目を dust にする| B2[表示の設定を変える:正常シナリオ]
        B2 -->|A がワークスペースの既定にする操作で今の選びを保存する| A3[ワークスペースの既定を変える:正常シナリオ]
        A3 --> DONE([B の画面が、上書きした見た目は dust のまま、表示する種類だけ既定に従った状態])
        click A1 "../単一ユースケース/プレビューを開く.yaml#正常シナリオ"
        click A2 "../単一ユースケース/表示の設定を変える.yaml#正常シナリオ"
        click B1 "../単一ユースケース/プレビューを開く.yaml#正常シナリオ"
        click B2 "../単一ユースケース/表示の設定を変える.yaml#正常シナリオ"
        click A3 "../単一ユースケース/ワークスペースの既定を変える.yaml#正常シナリオ"
      ```
    expected:
      - B が開いた直後の画面は、見た目が `deep` で、トップバーに用語集のタブがある（A の上書きが効いていない）
      - 既定を保存した後の `config.yaml` の見た目の既定が `glow`、表示する種類の既定が用語集を除いた種類である
      - 既定を保存した後、B の画面は開き直さずに用語集のタブが外れ、見た目は B が上書きした `dust` のままである
      - A の画面は見た目が `glow` で、用語集のタブが無い
      - A の端末の保存領域に A の上書きが、B の端末の保存領域に B の上書き（見た目だけ）が残っている
      - ワークスペースの記録の項目の YAML の中身が、開く前と同じ
    test: test_normal
    notes:
      シナリオの判定: 判定フローチャート『シナリオ』で、新規に複合ユースケース（交差点シナリオ）とした。達成価値は「同じワークスペースを見る 2 人が、互いの表示に影響せずに表示の好みを変えられ、既定の保存だけが上書きを持たない項目に効く」。2 つのブラウザのコンテキストの交わりが価値の中核で、単一ユースケースの E2E では再現できない（Q4・Q5A）。表示の設定の各項目の変え方と既定に戻す操作、既定の保存に失敗したときの扱いは各単一ユースケースの E2E で確かめる
    uses:
      - dev/設計書/シナリオ/単一ユースケース/プレビューを開く#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/表示の設定を変える#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/ワークスペースの既定を変える#scenarios[正常シナリオ]
lead: 同じワークスペースのプレビューを開いた 2 人が、それぞれの端末で表示の設定を変えても互いの表示に影響せず、ワークスペースの既定を保存したときだけ、上書きを持たない項目の表示が相手の画面でも変わる複合ユースケース。
issue: 24
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 自分の見やすい見た目・表示する種類に変えても、同じワークスペースを見ている他の人の表示を変えない
  - name: 同じワークスペースを見る他の人
    interest: 他の人の好みに振り回されず、自分で変えていない項目はワークスペースの既定で見られる
trigger: 同じワークスペースのプレビューを複数人で開き、ある人が表示の設定を変える
preconditions:
  - ワークスペースに記録があり、起動スクリプトで立ち上げた Claude Code のサーバーがプレビューを配っている
  - 2 人がそれぞれのブラウザでプレビューの URL を開ける
success_guarantee: 各自の端末の上書きはその端末の表示だけに効く。ワークスペースの既定として保存した値は `config.yaml` に残り、上書きを持たない項目は開いている全ての画面でその値になる。
minimal_guarantee: 表示の設定を変えても、ワークスペースの記録の項目は書き換えない。既定の保存に失敗したときは `config.yaml` を書き換えず、画面の表示は保存の前のまま。
frequency: 複数人で同じワークスペースを見るたび
priority: 中
test_file: tests/e2e/複合ユースケース/test_display_prefs_per_person.py

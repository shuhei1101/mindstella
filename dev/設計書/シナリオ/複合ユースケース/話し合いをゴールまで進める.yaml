lead: 利用者が起動スクリプトで Claude Code を立ち上げ、セットアップのスキル `setup` でワークスペースを用意し、話し合いを進めるスキル `session` で発言の取り込み・ヒアリング・リサーチ・方針転換・範囲の見直しを重ね、ゴール判定でリリースの資料を書き出すまでの複合ユースケース。
issue: 4
primary_actor: 利用者
stakeholders:
  - name: 利用者
    interest: 抽象と具体を行き来する発言をそのまま話しても、決め事・派生する問い・調べものが記録に残り、ゴールまで迷わず進める
  - name: 受け取り手
    interest: ゴール判定で書き出した資料だけを読めば、決まったことと納品物が分かる
trigger: 利用者が起動スクリプトで tmux と Claude Code を立ち上げ、セットアップのスキル（`/mindstella:setup`）を呼ぶ
preconditions:
  - プラグイン mindstella がインストールされている
  - tmux が入っている
success_guarantee: ゴールに届いた検討事項と納品物を利用者が確定し、`.mindstella/release/` にリリースの資料が書き出されている。ワークスペースの YAML はどの時点でもスキーマに合い、サーバーが配るプレビューは最後の編集を表示している。ワークスペースの直下には画面の `mindstella.html` と記録のフォルダ `.mindstella/` だけがある。
minimal_guarantee: 途中で話し合いを終えても、それまでに記録した項目と会話ログ、取り込んでいない送信はワークスペースに残り、次に起動スクリプトで立ち上げてセットアップすると続きから再開できる。
frequency: 1 つの話し合いにつき、セットアップ 1 回と、ゴールまでの数回〜数十回の会話
priority: 高
notes:
  スキルの呼び名: セットアップのスキルは `setup`（`/mindstella:setup`）、話し合いを進めるスキルは `session`（`/mindstella:session`）
  ステップとの対応: 単一ユースケースはスキルのステップに 1 対 1 で当たる（セットアップ → 話し合いのセットアップ、取り込み → 発言の取り込み、範囲の見直し → 話し合いの範囲の見直し、プレビュー → プレビューを開く）。`session` の準備で、前回読んだ時点からの変更を読み（前回読んだ時点からの変更を読む）、取り込んでいない送信を拾う（送信の取り込み）
  E2E の範囲: E2E はモデルを呼ばず、起動スクリプトの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、スキルの手順が連ねるツールの呼び出しの並びを再生してワークスペースの状態を確かめる。利用者の発言から何を積むかというモデルの判断は確かめない。起動スクリプトそのもの（依存の確認・tmux・`--mcp-config`）と、依存が足りないときに止まることは、単一ユースケース『起動スクリプトで立ち上げる』で確かめる
test_file: tests/e2e/複合ユースケース/test_discussion_to_goal.py

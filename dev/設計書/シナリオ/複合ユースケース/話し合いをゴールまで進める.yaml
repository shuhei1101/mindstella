title: "話し合いをゴールまで進める"
scenarios:
  - name: 正常シナリオ（新しい話し合い）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動スクリプトの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、各ステップの手順が連ねる MCP のツールの呼び出しとファイルの書き出しを、決めた引数で順に再生する。起動スクリプトそのもの（依存の確認・tmux・`--mcp-config`）は単一ユースケース『起動スクリプトで立ち上げる』で、スキルの読み込みと許可は結合テストで確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 空のワークスペースのフォルダ
        description: まだ `.mindstella/config.yaml` を持たないフォルダ
      - name: 再生する手順
        description: 'セットアップの `init`（プレイブック: システム開発）→ 取り込みのまとめての書き込み（決め事を持つ検討事項・`parent` を持つ派生の検討事項・本文を持つタスク・会話ログを 1 回で）→ ヒアリングの `next` と `update` → 取り込みの案の書き換え（D-1 に案 B を足す）→ リサーチの `add`（調査を `related` で検討事項に繋ぐ）→ 方針転換の `adopt` と `impact` と `update`（要見直し・見直しのタスク）→ 取り込みの `update`（要見直しを決め直し、見直しのタスクを完了）→ プレビューの URL の取得 → ゴール判定の `goal` と `.mindstella/release/` への書き出し'
        notes: 'ゴールは進め方ガイドの既定（システム開発: インターフェースまで）。依存は D-2 が D-1 に `depends_on` で依存する形にして、D-1 の採用する案の切り替えで D-2 が要見直しになるようにする。ゴールのフェーズまでの検討事項は、ゴール判定の前に全て決定済みにする。D-1 は案 A だけを持って足し、案 B は案の書き換えで足す'
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して起動スクリプトを叩く| L1([起動スクリプトで立ち上げる:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（新しいワークスペース）])
        S1 -->|プレイブック・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールを決めて作る +<br>/mindstella:session へ渡す| T1([発言の取り込み:正常シナリオ])
        T1 -->|決め事と派生の検討事項・タスクを積む| H1([ヒアリング:正常シナリオ])
        H1 -->|前提が揃った未決定を 1 ラウンドで聞き、答えを取り込む| R1([リサーチ:正常シナリオ])
        R1 -->|確認を取ってサブエージェントで調べ、調査を検討事項に繋ぐ| C1([方針転換:正常シナリオ])
        C1 -->|採用する案を切り替え、影響を要見直しにして見直しのタスクを積む| P1([プレビューを開く:正常シナリオ])
        P1 -->|サーバーが配るプレビューの URL を示す| G1([ゴール判定:正常シナリオ（ゴールに届いた）])
        G1 --> DONE([確定した検討事項と納品物が release/ に書き出された状態])

        click L1 "../単一ユースケース/起動スクリプトで立ち上げる.yaml#正常シナリオ"
        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ新しいワークスペース"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
        click H1 "../単一ユースケース/ヒアリング.yaml#正常シナリオ"
        click R1 "../単一ユースケース/リサーチ.yaml#正常シナリオ"
        click C1 "../単一ユースケース/方針転換.yaml#正常シナリオ"
        click P1 "../単一ユースケース/プレビューを開く.yaml#正常シナリオ"
        click G1 "../単一ユースケース/ゴール判定.yaml#正常シナリオゴールに届いた"
      ```
    expected:
      - '`config.yaml` に、プレイブック・最上位の軸の呼び名・フェーズ・カテゴリー・ゴールが入っている'
      - 取り込みで足した検討事項・派生の検討事項（`parent` を持つ）・タスク・会話ログがある
      - 取り込みで足したタスクが本文を持ち、`show` の `body_markdown` が書いた本文を返す
      - 足した・直した項目の `updated_by` が、どれも `ai` である
      - リサーチで足した調査が、元の検討事項と `related` でつながっている
      - D-1 の採用する案が B で、D-2 が決め直されて決定済み、D-2 の見直しのタスクが完了である
      - '`goal` の出力が「届いた」である'
      - '`.mindstella/release/` に、確定した検討事項と納品物の資料が書き出されている'
      - '`check` が参照切れと、YAML と Markdown のずれを 0 件で返す'
      - サーバーが配るプレビューの記録が、最後の編集を含んでいる
      - ワークスペースに `preview.html` が書き出されていない
      - ワークスペースの直下には `mindstella.html` と `.mindstella/` だけがあり、`config.yaml`・種類ごとの YAML・`docs/`・`release/` は `.mindstella/` の下にある
    test: test_normal_when_new_discussion
  - name: 正常シナリオ（続きから再開）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動スクリプトの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、セットアップの `status`、準備の前回読んだ時点からの変更の読み取り、取り込みのまとめての書き込みを、決めた引数で再生する。起動スクリプトそのものは単一ユースケース『起動スクリプトで立ち上げる』で確かめる。正常シナリオ（新しい話し合い）で通した方針転換・ゴール判定は通さない
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 途中まで進んだワークスペース
        description: 要見直しの検討事項 D-1・進行中のタスク T-1・前提が揃った未決定 D-2 を持ち、版のファイルにプラグインと同じ版を持ち、取り込んでいない送信を持たないワークスペース。AI が最後に読んだ時点を記録しており、その時点より後の書き換えで D-1 のタイトルと本文が変わっている
        notes: 最後の検討事項の ID は D-2、最後のタスクの ID は T-1。前回読んだ時点からの変更を一度読んで読んだ時点を記録した後に、`update` で D-1 のタイトルと本文を書き換えて作る（AI がツールで書いた分も、次に読むまでは読んでいない変更に数える）。取り込みでは、1 つの発言から出た検討事項とタスクを 1 回の呼び出しで書く
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|途中まで進んだワークスペースのフォルダを渡して起動スクリプトを叩く| L1([起動スクリプトで立ち上げる:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S1 -->|要見直し・進行中・再開可能・次の候補と続きの推奨を出す +<br>/mindstella:session へ渡す| D1([前回読んだ時点からの変更を読む:正常シナリオ])
        D1 -->|前回読んだ時点より後に変わった D-1 を示し、読んだ時点を書き換える| T1([発言の取り込み:正常シナリオ])
        T1 -->|1 つの発言から出た検討事項とタスクをまとめて書く| DONE([続きの番号で項目が足された状態])

        click L1 "../単一ユースケース/起動スクリプトで立ち上げる.yaml#正常シナリオ"
        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ既存のワークスペース"
        click D1 "../単一ユースケース/前回読んだ時点からの変更を読む.yaml#正常シナリオ"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
      ```
    expected:
      - '`status` の出力に、要見直しの D-1・進行中の T-1・次の候補の D-2 がある'
      - 前回読んだ時点からの変更の出力に、D-1 が変わったキー（タイトル・本文）と前の値つきである
      - 前回読んだ時点からの変更の出力の D-1 に、最後に編集した人 `ai` が載っている
      - 読んだ後、AI が最後に読んだ時点が最後の書き換えの通し番号になっており、続けてもう一度読むと変更が 0 件である
      - 既存の項目の ID が変わらず、取り込みの 1 回の呼び出しで足した検討事項が D-3、タスクが T-2 になっている
    test: test_normal_when_resume
  - name: 正常シナリオ（古い版のワークスペースから再開）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動スクリプトの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、セットアップの版の比較、移し替えのスキルの手順の一覧・写し・当てる・点検・版の書き換え、2 回目のセットアップの `status`、取り込みの `add` を、決めた引数で再生する。起動スクリプトそのものは単一ユースケース『起動スクリプトで立ち上げる』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 版を記録する前の形式のワークスペース
        description: '版のファイルを持たず、`mindmap.yaml` が `summary` を持たず `field: システム開発` を持ち、資料 A-1 が `done: true` で、検討事項 D-1 を持つワークスペース'
        notes: YAML を直接書いて作る。点検で聞かれる題名には `要件出しのスキルを設計する` と答える。最後の検討事項の ID は D-1
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|プラグインを上げた後、版を記録する前の形式のワークスペースのフォルダを渡して起動スクリプトを叩く| L1([起動スクリプトで立ち上げる:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（版が古いワークスペース）])
        S1 -->|ワークスペースの版が古いことと、移し替えのスキルを案内する| M1([ワークスペースの移し替え:正常シナリオ])
        M1 -->|手順の一覧を見せて写しを取り、手順を当て、題名を聞いて、版を書き換える| S2([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S2 -->|状況と続きの推奨を出す +<br>/mindstella:session へ渡す| T1([発言の取り込み:正常シナリオ])
        T1 --> DONE([今の版の形式で続きの番号の項目が足された状態])

        click L1 "../単一ユースケース/起動スクリプトで立ち上げる.yaml#正常シナリオ"
        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ版が古いワークスペース"
        click M1 "../単一ユースケース/ワークスペースの移し替え.yaml#正常シナリオ"
        click S2 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ既存のワークスペース"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
      ```
    expected:
      - 最初のセットアップが、どのファイルも書き換えずに移し替えのスキルを案内し、`/mindstella:session` へ渡さない
      - 移し替えの後、`.mindstella/mindstella-version.ini` の 1 行目がプラグインの版である
      - '資料 A-1 が `status: 完成` で `done` を持たず、`config.yaml` の `summary` が答えた題名である'
      - '`config.yaml` が `field` を持たず、`playbooks` に元の分野のシステム開発の 1 件を持ち、`target_label` が移し替えの前と同じである'
      - ワークスペースに `mindmap.yaml` が残っていない
      - 移し替えの後、`config.yaml`・種類ごとの YAML・`docs/`・`release/`・版のファイルが `.mindstella/` の下にあり、直下に残っていない
      - 2 回目のセットアップが版の案内を出さず、状況と続きの推奨を出す
      - 既存の項目の ID が変わらず、取り込みで足した検討事項が D-2 になっている
      - '`check` が問題を 0 件で返す'
    test: test_normal_when_resume_older_version
  - name: 正常シナリオ（画面から送った回答を取り込む）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動スクリプトの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、セットアップの `status`・プレビューの URL の取得・送信の取り込み・取り込みの `adopt` と `add` を、決めた引数で再生する。Claude Code の立ち上げ直しは、MCP サーバーを止めて立て直すことで代える。コメントを溜めて送るのは実際のブラウザで、サーバーが配るプレビューの詳細パネルとコメントの一覧から行う。起動スクリプトそのものは単一ユースケース『起動スクリプトで立ち上げる』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 未決定の検討事項と資料を持つワークスペース
        description: 案 A・B を持つ未決定の検討事項 D-1 と、3 行の段落の本文を持つ資料 A-1 を持ち、版のファイルにプラグインと同じ版を持ち、取り込んでいない送信を持たないワークスペース
        notes: D-1 の詳細パネルで溜める本文は `案 A にする`。A-1 の本文の 2 行目の文を選んで溜める本文は `ここは言い換える`。コメントの一覧で、項目に紐づかないコメント `全体に目を通した` を書いて溜め、チェックを外す。取り込みでは D-1 の採用する案を A にし、会話ログに送信の本文と A-1 の箇所を残す
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|ワークスペースのフォルダを渡して起動スクリプトを叩く| L1([起動スクリプトで立ち上げる:正常シナリオ])
        L1 -->|/mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S1 -->|記録を見たいと言う| P1([プレビューを開く:正常シナリオ])
        P1 -->|示された URL をブラウザで開き、D-1 の詳細パネルを開く| A1([項目へコメントする:正常シナリオ])
        A1 -->|A-1 の詳細パネルで本文の 2 行目の文を選ぶ| A2([選んだ箇所へコメントする:正常シナリオ（本文の文を選ぶ）])
        A2 -->|コメントのボタンから一覧を開く| A3([コメントを選んで送る:正常シナリオ])
        A3 -->|Claude Code を閉じ、起動スクリプトで立ち上げ直して /mindstella:setup を呼ぶ| S2([話し合いのセットアップ:正常シナリオ（既存のワークスペース）])
        S2 -->|/mindstella:session へ渡す| I1([送信の取り込み:正常シナリオ（箇所と項目に紐づかない送信）])
        I1 -->|送信を 1 件ずつ取り込む| T1([発言の取り込み:正常シナリオ])
        T1 --> DONE([送ったコメントで D-1 が決まり、A-1 の箇所への意見が残り、送信が取り込み済みの状態])

        click L1 "../単一ユースケース/起動スクリプトで立ち上げる.yaml#正常シナリオ"
        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ既存のワークスペース"
        click P1 "../単一ユースケース/プレビューを開く.yaml#正常シナリオ"
        click A1 "../単一ユースケース/項目へコメントする.yaml#正常シナリオ"
        click A2 "../単一ユースケース/選んだ箇所へコメントする.yaml#正常シナリオ本文の文を選ぶ"
        click A3 "../単一ユースケース/コメントを選んで送る.yaml#正常シナリオ"
        click S2 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ既存のワークスペース"
        click I1 "../単一ユースケース/送信の取り込み.yaml#正常シナリオ箇所と項目に紐づかない送信"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
      ```
    expected:
      - D-1 の採用する案が A で、決定済みである
      - 会話ログに、D-1 への送信の本文と、A-1 の本文の 2 行目と選んだ文を添えた送信の本文が残っている
      - チェックを外した項目に紐づかないコメントは送信に無く、コメントの一覧に残っている
      - 送信が取り込み済みで、取り込みのツールをもう一度呼ぶと 0 件を返す
      - '`check` が問題を 0 件で返す'
    notes:
      シナリオの判定: 判定フローチャート『シナリオ』で、既存の複合ユースケースへのシナリオの追加とした。プレビューから送り、Claude Code を立ち上げ直して取り込むまでは、プレビューとスキルのサブシステムをまたぎ、単一ユースケースの E2E では再現できない（Q4）
    test: test_normal_when_submission_from_preview
  - name: 正常シナリオ（ゴールを決めずに始めて範囲を広げる）
    setup:
      - name: Mock
        description: モデル（スキルの手順を読む Claude）を呼ばない。起動スクリプトの代わりに MCP サーバーを立てて MCP のクライアントでつなぎ、各ステップの手順が連ねる MCP のツールの呼び出しとファイルの書き出しを、決めた引数で順に再生する。起動スクリプトそのものは単一ユースケース『起動スクリプトで立ち上げる』で確かめる
      - name: 依存が揃った環境
        description: スキル専用の仮想環境に Python 3.12 以上・PyYAML・jsonschema・MCP の SDK が入っている
      - name: 空のワークスペースのフォルダ
        description: まだ `.mindstella/config.yaml` を持たないフォルダ
      - name: 再生する手順
        description: 'セットアップの `init`（プレイブック: 壁打ち・ゴール無し）→ 取り込みの `add`（壁打ちのフェーズの検討事項）→ ゴール判定の `goal`（ゴールが無い）→ 範囲の見直しの設定の更新（プレイブックにシステム開発を足し、古いフェーズから新しいフェーズへの対応で項目のフェーズを付け替え、古い対象・カテゴリーから新しい対象・カテゴリーへの対応で項目の対象・カテゴリーを付け替え、題名・最上位の軸の呼び名・ゴールを書き換える）→ 取り込みの `add`（納品物の資料）と設定の更新（ゴールの納品物から資料を指す）→ 取り込みの `update`（ゴールのフェーズまでの検討事項を決定済み、納品物の資料を完成にする）→ ゴール判定の `goal` と `.mindstella/release/` への書き出し'
        notes: 付け替えの前に、壁打ちの問い・発散のフェーズの検討事項 D-1・D-2 を足しておく。書き換えた後のフェーズの並びと対応は単一ユースケース『話し合いの範囲の見直し』の決めた形に従う。書き換えるゴールはシステム開発の要件まで、納品物は要件定義書。D-1・D-2 は壁打ちで作った対象・カテゴリーを持ち、範囲の見直しでその対象の名前を変え、カテゴリーを別のカテゴリーへまとめる
    flow: |-
      ```mermaid
      flowchart TD
        U0([利用者]) -->|空のワークスペースのフォルダを渡して起動スクリプトを叩く| L1([起動スクリプトで立ち上げる:正常シナリオ])
        L1 -->|立ち上がった Claude Code で /mindstella:setup を呼ぶ| S1([話し合いのセットアップ:正常シナリオ（新しいワークスペース）])
        S1 -->|壁打ちのプレイブックを選び、ゴールを決めずに作る +<br>/mindstella:session へ渡す| T1([発言の取り込み:正常シナリオ])
        T1 -->|問いと発散の検討事項を積む| G1([ゴール判定:正常シナリオ（ゴールが無い）])
        G1 -->|ゴールが無いことを示し、ゴールを決めるかを尋ねる| W1([話し合いの範囲の見直し:正常シナリオ])
        W1 -->|システム開発のプレイブックを足し、フェーズ・対象・カテゴリーの対応を確かめて付け替え、<br>題名・最上位の軸の呼び名・ゴールを書き換える| T2([発言の取り込み:正常シナリオ])
        T2 -->|納品物の資料を作って同じタイトルのゴールの納品物から指し、ゴールのフェーズまでを決める| G2([ゴール判定:正常シナリオ（ゴールに届いた）])
        G2 --> DONE([書き換えたゴールまでの検討事項と納品物が release/ に書き出された状態])

        click L1 "../単一ユースケース/起動スクリプトで立ち上げる.yaml#正常シナリオ"
        click S1 "../単一ユースケース/話し合いのセットアップ.yaml#正常シナリオ新しいワークスペース"
        click T1 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
        click G1 "../単一ユースケース/ゴール判定.yaml#正常シナリオゴールが無い"
        click W1 "../単一ユースケース/話し合いの範囲の見直し.yaml#正常シナリオ"
        click T2 "../単一ユースケース/発言の取り込み.yaml#正常シナリオ"
        click G2 "../単一ユースケース/ゴール判定.yaml#正常シナリオゴールに届いた"
      ```
    expected:
      - 最初の `goal` の出力が、ゴールが無いことを示す
      - '`config.yaml` の `playbooks` が壁打ちとシステム開発の 2 件で、`summary`・`target_label`・`goal` が範囲の見直しで書き換えた値である'
      - 付け替えの前に足した D-1・D-2 のフェーズが、どちらも書き換えた後の `phases` のどれかである
      - D-1・D-2 の対象・カテゴリーが、書き換えた後の `targets`・`categories` のどれかである
      - '`goal.deliverables` の納品物が、取り込みで作った資料を `doc` で指している'
      - 2 回目の `goal` の出力が「届いた」である
      - '`.mindstella/release/` に、確定した検討事項と納品物の資料が書き出されている'
      - '`check` が問題を 0 件で返す'
    notes:
      シナリオの判定: 判定フローチャート『シナリオ』で、既存の複合ユースケースへのシナリオの追加とした。ゴールを決めずに作ったワークスペースで、範囲の見直しで書き換えた設定が後の取り込みとゴール判定に効くかは、セットアップ・範囲の見直し・取り込み・ゴール判定のステップをまたぎ、単一ユースケースの E2E では再現できない（Q4）

summary: 複合ユースケースのシナリオ
items:
  - page: 話し合いをゴールまで進める.yaml
    summary: セットアップから発言の取り込み・ヒアリング・リサーチ・方針転換を重ね、ゴール判定でリリースするまで
  - page: プレビューで記録を読み返す.yaml
    summary: プレビューを開き、概要から項目を探して詳細とネットワークを読む
  - page: 表示の好みを人ごとに分ける.yaml
    summary: 同じワークスペースを見る 2 人が表示の設定を各自で変え、既定の保存だけが上書きを持たない項目に効く
  - page: 共有サーバーでメンバーがログインして使う.yaml
    summary: オーナーがメンバーを登録して公開し、メンバーと管理者がログインして役割の範囲で読み・送り・既定を変える

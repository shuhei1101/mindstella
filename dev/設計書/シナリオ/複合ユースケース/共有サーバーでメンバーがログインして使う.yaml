title: ""
scenarios:
  - name: 正常シナリオ
    setup:
      - name: Mock
        description: モデルを呼ばない。起動スクリプトの代わりに MCP サーバーを立てる。ほかのマシンの代わりに、端末の保存領域と Cookie を共有しない 2 つのブラウザのコンテキスト（管理者 A とメンバー B）で、待ち受けた `127.0.0.1` 以外のアドレスの URL を開く。オーナーはサーバーのマシンのブラウザのコンテキストで開く
        notes: 公開のアドレスはテストの端末の `127.0.0.1` 以外のアドレス
      - name: make_workspace
        description: 作成を済ませたワークスペース。`config.yaml` はメンバーと公開の設定を持たない
      - name: 記録
        description: 検討事項 D-1 を持つ
      - name: 利用者のファイル
        description: テスト用の一時フォルダに置いた空の利用者のファイル（`users.yaml`）
        notes: 本人の `~/.config/mindstella/` を触らない
    flow: |-
      ```mermaid
      flowchart TD
        O0([オーナー]) -->|自分をオーナー、A を管理者、B をメンバーとして登録し、各自の仮のパスワードを決める| O1[メンバーを管理する:正常シナリオ]
        O1 -->|ほかのマシンへ公開する設定にし、配信を立て直す| O2[公開範囲を設定する:正常シナリオ]
        O2 -->|B が公開した URL を開く| B1[ログインする:正常シナリオ]
        B1 -->|B が D-1 にコメントを書いて送る| B2[コメントを選んで送る:正常シナリオ]
        B2 -->|B が表示の設定を開く| B3[ワークスペースの既定を変える:異常シナリオ（メンバーが保存する）]
        B3 -->|A が公開した URL を開く| A1[ログインする:正常シナリオ]
        A1 -->|A がネットワークの見た目を glow にしてワークスペースの既定にする| A2[ワークスペースの既定を変える:正常シナリオ]
        A2 --> DONE([B の画面の見た目が開き直さずに glow になった状態])
        click O1 "../単一ユースケース/メンバーを管理する.yaml#正常シナリオ"
        click O2 "../単一ユースケース/公開範囲を設定する.yaml#正常シナリオ"
        click B1 "../単一ユースケース/ログインする.yaml#正常シナリオ"
        click B2 "../単一ユースケース/コメントを選んで送る.yaml#正常シナリオ"
        click B3 "../単一ユースケース/ワークスペースの既定を変える.yaml#異常シナリオ（メンバーが保存する）"
        click A1 "../単一ユースケース/ログインする.yaml#正常シナリオ"
        click A2 "../単一ユースケース/ワークスペースの既定を変える.yaml#正常シナリオ"
      ```
    expected:
      - 公開した後、ログインしていない要求で公開した URL を開くと、記録を含まないログインの画面が返る
      - '`config.yaml` の `members` にオーナー・A（管理者）・B（メンバー）の 3 人がいて、オーナーはちょうど 1 人である'
      - 利用者のファイルにパスワードの平文が無く、3 人ぶんのハッシュがあり、ファイルの権限が `0600` である
      - B が送ったコメントが、取り込んでいない送信に 1 件ある
      - B の表示の設定に「ワークスペースの既定にする」が出ず、B の Cookie で既定の書き換えを直接送ると 403 が返り、`config.yaml` の見た目の既定が変わらない
      - A が保存した後の `config.yaml` の見た目の既定が `glow` である
      - B の画面は開き直さずに見た目が `glow` になる
      - ワークスペースの記録の項目の YAML の中身が、開く前と同じ
    test: test_normal
    uses:
      - dev/設計書/シナリオ/単一ユースケース/コメントを選んで送る#scenarios[正常シナリオ]
      - dev/設計書/シナリオ/単一ユースケース/ワークスペースの既定を変える#scenarios[正常シナリオ]
    notes:
      シナリオの判定: 判定フローチャート『シナリオ』で、新規に複合ユースケース（交差点シナリオ）とした。達成価値は「オーナーが登録したメンバーが、ほかのマシンからログインして役割の範囲でワークスペースを使える」。オーナー・管理者・メンバーの 3 つの役割が同じワークスペースで交わり、メンバーが断られる操作を管理者が通す権限の境界が価値の中核で、単一ユースケースの E2E では再現できない（Q4・Q5A）。ログインの失敗とロック、仮のパスワードからの変更、オーナーがいない公開のエラー、オーナーの再設定のコマンドは各単一ユースケースの E2E で確かめる
      使う単一ユースケース: メンバーを管理する・公開範囲を設定する・ログインすると、ワークスペースの既定を変えるの異常シナリオ（メンバーが保存する）は単一ユースケース設計で作り、`uses` に足す
lead: オーナーがメンバーを登録してほかのマシンへ公開し、メンバーと管理者がそれぞれログインして、役割の範囲で記録を読み・コメントを送り・ワークスペースの既定を変える複合ユースケース。
issue: 25
primary_actor: オーナー
stakeholders:
  - name: オーナー
    interest: ワークスペースを社内のほかのマシンへ開いても、登録したメンバーだけが使える
  - name: 管理者
    interest: ワークスペースの既定を自分の判断で変えられる
  - name: メンバー
    interest: ほかのマシンからログインして記録を読み、コメントを送れる
trigger: オーナーが、社内のサーバーで動かしているワークスペースをほかの人と共有しようとする
preconditions:
  - ワークスペースに記録があり、起動スクリプトで立ち上げた Claude Code のサーバーがプレビューを配っている
  - ワークスペースにメンバーは未登録で、プレビューはログインなしで開け、`127.0.0.1` だけで待ち受けている
success_guarantee: 登録したメンバーだけが、ほかのマシンからログインして役割の範囲でプレビューを使える。メンバーが送ったコメントと、管理者が保存した既定がワークスペースに残る。
minimal_guarantee: ログインしていない要求には画面も記録も返さない。役割で許さない操作は、画面で出さず、送られてもサーバーが断り、`config.yaml` を書き換えない。
frequency: ワークスペースを社内で共有するとき
priority: 中
notes:
  対応テストファイル: E2E テスト作成でファイルを作ったときに `test_file` を足す

use_cases:
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/設定の更新.yaml
    impact: changed
    detail: 文字起こし後の挙動（送信する・入力欄へ挿入する）と用語集のプリセットを設定で選べるようにする
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/項目へコメントする.yaml
    impact: run_only
    detail: コメントの入力にマイクのボタンが加わるため、キーボードでのコメントが今までどおり溜まるかを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/スレッドで話す.yaml
    impact: run_only
    detail: 返信の入力にマイクのボタンが加わるため、キーボードでの返信が今までどおり溜まるかを確かめる
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/音声でコメントする.yaml
    impact: new
    detail: コメント・返信の入力のマイクのボタンで録音し、文字起こしの結果をその書き込みだけで Claude Code へ送信するか入力欄へ挿入する。文字起こしを使えないときはマイクのボタンを押せず理由が出る
    depends_on: []
  - kind: single
    scenario: dev/設計書/シナリオ/単一ユースケース/画面で項目を編集して保存する.yaml
    impact: changed
    detail: 設定の画面で、文字起こし後の挙動と用語集のプリセットを書き換えて保存する。voice-paste が止まっていてプリセットの候補を読めないときは、プリセットの入力だけを押せなくする
    depends_on: []
